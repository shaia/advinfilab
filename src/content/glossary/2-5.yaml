# Terms first defined in lesson 2.5. (`diameter` moved to 2-1.yaml: lesson 2.1 defines it, 2.1.2.)
- id: nowhere-dense-set
  term: קבוצה דלילה
  en: nowhere dense set
  definition: >-
    קבוצה $A$ שלסגור שלה אין נקודות פנימיות: $(\overline{A})^\circ=\emptyset$. למשל $\mathbb{Z}$ ב-$\mathbb{R}$.
    לא די שלקבוצה עצמה אין פנים: $\mathbb{Q}$ אינה דלילה ב-$\mathbb{R}$.
  lesson: '2.5'
- id: baire-category
  term: קטגוריה ראשונה
  en: first category (Baire category)
  definition: >-
    קבוצה מקטגוריה ראשונה היא איחוד בן מנייה של קבוצות דלילות; קבוצה שאינה כזו היא מקטגוריה שנייה. משפט
    הקטגוריה של בייר: מרחב מטרי שלם לא ריק הוא מקטגוריה שנייה בעצמו, כלומר אינו איחוד בן מנייה של קבוצות
    דלילות.
  lesson: '2.5'
