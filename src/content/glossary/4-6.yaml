# Terms first defined in lesson 4.6 (the Stone–Weierstrass theorem, enrichment).
- id: subalgebra
  term: תת-אלגברה
  en: subalgebra
  definition: >-
    תת-קבוצה $\mathcal{A}\subseteq C(K)$ שסגורה לחיבור, לכפל בסקלר ולכפל של שתי פונקציות: אם $f,g\in\mathcal{A}$
    ו-$c\in\mathbb{R}$ אז $f+g$, $cf$ ו-$fg$ ב-$\mathcal{A}$. כלומר תת-מרחב לינארי שסגור לכפל.
  lesson: '4.6'
- id: contains-constants
  term: מכילה את הקבועים
  en: contains the constants
  definition: >-
    תת-אלגברה $\mathcal{A}\subseteq C(K)$ מכילה את הקבועים אם הפונקציה הקבועה $1$ שייכת לה; אז, כתת-מרחב, היא מכילה
    כל פונקציה קבועה $c\cdot1$.
  lesson: '4.6'
- id: separates-points
  term: מפרידה נקודות
  en: separates points
  definition: >-
    משפחה $\mathcal{A}$ של פונקציות על $K$ מפרידה נקודות אם לכל $x\ne y$ ב-$K$ יש $f\in\mathcal{A}$ עם
    $f(x)\ne f(y)$. הפונקציה רשאית להיות תלויה בזוג.
  lesson: '4.6'
- id: generated-subalgebra
  term: האלגברה הנוצרת
  en: subalgebra generated by a family
  definition: >-
    התת-אלגברה הנוצרת על ידי משפחה $\Phi\subseteq C(K)$ והקבועים היא קבוצת כל הפונקציות $P(\varphi_1,\dots,\varphi_m)$,
    כאשר $m\in\mathbb{N}$, $\varphi_1,\dots,\varphi_m\in\Phi$ ו-$P$ פולינום ממשי ב-$m$ משתנים. זו התת-אלגברה הקטנה
    ביותר שמכילה את $\Phi$ ואת הקבועים.
  lesson: '4.6'
- id: stone-weierstrass-theorem
  term: משפט סטון-ויירשטראס
  en: Stone–Weierstrass theorem
  definition: >-
    יהי $K$ מרחב מטרי קומפקטי לא ריק, ותהי $\mathcal{A}\subseteq C(K)$ תת-אלגברה שמכילה את הקבועים ומפרידה נקודות.
    אז $\mathcal{A}$ צפופה ב-$C(K)$ בנורמת הסופרמום.
  reject: [סטון ויירשטראס]
  lesson: '4.6'
- id: trigonometric-polynomial
  term: פולינום טריגונומטרי
  en: trigonometric polynomial
  symbol: 'T(x)=c+\sum_{k=1}^{N}(a_k\cos kx+b_k\sin kx)'
  definition: >-
    פונקציה $T:\mathbb{R}\to\mathbb{R}$ שהיא צירוף לינארי סופי של הפונקציות $1$, $\cos kx$ ו-$\sin kx$ ($k\in\mathbb{N}$).
    המעלה שלו היא ה-$k$ הגדול ביותר שמקדמו שונה מאפס. כל פולינום טריגונומטרי רציף ומחזורי במחזור $2\pi$.
  lesson: '4.6'
- id: periodic-function
  term: פונקציה מחזורית
  en: periodic function
  definition: >-
    $f:\mathbb{R}\to\mathbb{R}$ מחזורית במחזור $2\pi$ (או $2\pi$-מחזורית) אם $f(t+2\pi)=f(t)$ לכל $t\in\mathbb{R}$.
  lesson: '4.6'
