# Terms first defined in lesson 4.6 (the Stone–Weierstrass theorem, enrichment).
- id: subalgebra
  term: תת-אלגברה
  en: subalgebra
  definition: >-
    תת-קבוצה $\mathcal{A}\subseteq C(K)$ שסגורה לחיבור, לכפל בסקלר ולכפל של שתי פונקציות: אם $f,g\in\mathcal{A}$
    ו-$c\in\mathbb{R}$ אז $f+g$, $cf$ ו-$fg$ ב-$\mathcal{A}$.
  lesson: '4.6'
- id: separates-points
  term: מפרידה נקודות
  en: separates points
  definition: >-
    משפחה $\mathcal{A}$ של פונקציות על $K$ מפרידה נקודות אם לכל $x\ne y$ ב-$K$ יש $f\in\mathcal{A}$ עם
    $f(x)\ne f(y)$. הפונקציה רשאית להיות תלויה בזוג.
  lesson: '4.6'
- id: stone-weierstrass-theorem
  term: משפט סטון-ויירשטראס
  en: Stone–Weierstrass theorem
  definition: >-
    יהי $K$ מרחב מטרי קומפקטי, ותהי $\mathcal{A}\subseteq C(K)$ תת-אלגברה שמכילה את הקבועים ומפרידה נקודות. אז
    $\mathcal{A}$ צפופה ב-$C(K)$ בנורמת הסופרמום.
  reject: [סטון ויירשטראס]
  lesson: '4.6'
- id: trigonometric-polynomial
  term: פולינום טריגונומטרי
  en: trigonometric polynomial
  symbol: 'P(x)=\frac{c_0}{2}+\sum_{n=1}^{N}(c_n\cos nx+d_n\sin nx)'
  definition: >-
    צירוף לינארי סופי של איברי המערכת הטריגונומטרית. המעלה שלו היא ה-$N$ הגדול ביותר שמקדמו שונה מאפס. כל פולינום
    טריגונומטרי רציף ומחזורי במחזור $2\pi$.
  lesson: '4.6'
