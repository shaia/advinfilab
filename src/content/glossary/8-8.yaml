# Terms first defined in lesson 8.8 (approximating paths; homotopy of continuous paths).
- id: integral-along-continuous-path
  term: אינטגרל של שדה משמר מקומית לאורך מסילה רציפה
  en: integral of a locally conservative field along a continuous path
  definition: >-
    $F$ משמר מקומית בקבוצה פתוחה $U$ ו-$\gamma:[a,b]\to U$ מסילה רציפה בלבד. בוחרים חלוקה $a=t_0<\dots<t_k=b$ וכדורים
    $B_j\subseteq U$ שבהם ל-$F$ יש פוטנציאל $\varphi_j$, כך ש-$\gamma([t_{j-1},t_j])\subseteq B_j$ (קיימים לפי למת
    המספר של לבג ורציפות במידה שווה), ומגדירים
    $\int_\gamma F\cdot ds=\sum_{j=1}^k\left(\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))\right)$. הערך אינו תלוי
    בחלוקה ובפוטנציאלים, ולמסילה חלקה למקוטעין הוא האינטגרל הקווי הרגיל. לשדה הזווית הוא השינוי של פונקציית זווית
    רציפה, גם כשהמסילה אינה ברת-מדידה.
  lesson: '8.8'
