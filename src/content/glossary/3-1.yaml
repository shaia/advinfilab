# Terms first defined in lesson 3.1.
- id: sequential-compactness
  term: קומפקטיות סדרתית
  en: sequential compactness
  definition: >-
    קבוצה $K$ במרחב מטרי $(X,d)$ היא קומפקטית סדרתית אם לכל סדרה $(x_n)$ של נקודות של $K$ יש תת-סדרה
    $(x_{n_k})$ שמתכנסת לנקודה **של $K$**. התכונה תלויה רק ב-$K$ עם המטריקה שלה, לא במרחב שמסביב.
  lesson: '3.1'
- id: compact-set
  term: קבוצה קומפקטית
  en: compact set
  definition: >-
    בשיעור 3.1: קבוצה קומפקטית סדרתית. בשיעור 3.2 מגדירים קומפקטיות בכיסויים (לכל כיסוי פתוח יש תת-כיסוי
    סופי) ומוכיחים שבמרחב מטרי שתי ההגדרות שקולות. קבוצה קומפקטית היא תמיד סגורה וחסומה; הכיוון ההפוך נכון
    במרחב האוקלידי (משפט היינה-בורל) ולא באופן כללי.
  lesson: '3.1'
