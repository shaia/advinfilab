# Terms first defined in lesson 3.1.
- id: sequential-compactness
  term: קומפקטיות סדרתית
  en: sequential compactness
  definition: >-
    קבוצה $K$ במרחב מטרי $(X,d)$ היא קומפקטית סדרתית אם לכל סדרה $(x_n)$ של נקודות של $K$ יש תת-סדרה
    $(x_{n_k})$ שמתכנסת לנקודה **של $K$**. התכונה תלויה רק ב-$K$ עם המטריקה שלה, לא במרחב שמסביב.
  lesson: '3.1'
- id: compact-set
  term: קבוצה קומפקטית
  en: compact set
  definition: >-
    בשיעור 3.1: קבוצה קומפקטית סדרתית. בשיעור 3.2 מגדירים קומפקטיות בכיסויים (לכל כיסוי פתוח יש תת-כיסוי
    סופי) ומוכיחים שבמרחב מטרי שתי ההגדרות שקולות. קבוצה קומפקטית היא תמיד סגורה וחסומה; הכיוון ההפוך נכון
    במרחב האוקלידי (משפט היינה-בורל) ולא באופן כללי.
  lesson: '3.1'
- id: bolzano-weierstrass
  term: משפט בולצאנו-ויירשטראס
  en: Bolzano–Weierstrass theorem
  definition: >-
    באינפי 1: לכל סדרה חסומה של מספרים ממשיים יש תת-סדרה מתכנסת. בשיעור 3.1 (משפט 3.1.7) הוא מוכח ב-$\mathbb{R}^k$
    עם $d_1$, $d_2$ או $d_\infty$. במרחב מטרי כללי הוא אינו נכון: במטריקה הבדידה לסדרה $1,2,3,\dots$ אין תת-סדרה
    מתכנסת, אף שהיא חסומה.
  lesson: '3.1'
- id: separated-sequence
  term: סדרה מופרדת
  en: separated sequence
  definition: >-
    יהי $\varepsilon>0$. סדרה $(x_n)$ במרחב מטרי היא מופרדת $\varepsilon$ אם $d(x_n,x_m)\ge\varepsilon$ לכל $n\ne m$.
    לפי למה 3.1.4 לאף תת-סדרה שלה אין גבול, ולכן קבוצה שמכילה סדרה כזו אינה קומפקטית סדרתית.
  lesson: '3.1'
- id: tent-functions
  term: פונקציות האוהל
  en: tent functions
  definition: >-
    הפונקציות $t_n\in C[0,1]$, $n\ge1$: $t_n$ מתאפסת מחוץ לקטע $I_n=[2^{-n},2^{-n+1}]$, שווה ל-1 באמצע שלו
    $m_n=3\cdot2^{-n-1}$, ולינארית בכל חצי שלו. $\|t_n\|_\infty=1$ ו-$\|t_n-t_m\|_\infty=1$ כש-$n\ne m$ (טענה
    3.1.9(ב)), ו-$\|t_n\|_1=2^{-n-1}$.
  lesson: '3.1'
- id: product-max-metric
  term: מטריקת המקסימום על מכפלה
  en: max metric on a product
  definition: >-
    לשני מרחבים מטריים $(Y,d_Y)$ ו-$(Z,d_Z)$, המטריקה $d\big((y,z),(y',z')\big)=\max\big(d_Y(y,y'),d_Z(z,z')\big)$ על
    $Y\times Z$. בה סדרה מתכנסת אם ורק אם שני הרכיבים שלה מתכנסים. על $\mathbb{R}^{k+l}=\mathbb{R}^k\times\mathbb{R}^l$
    עם $d_\infty$ בשני הגורמים היא $d_\infty$.
  lesson: '3.1'
- id: diagonal-subsequence
  term: תת-סדרה אלכסונית
  en: diagonal subsequence
  definition: >-
    כשבונים סדרה של תת-סדרות, כל אחת תת-סדרה של הקודמת, תת-הסדרה האלכסונית לוקחת את האיבר ה-$k$ של תת-הסדרה
    ה-$k$. מהמקום ה-$i$ והלאה היא תת-סדרה של תת-הסדרה ה-$i$, ולכן יורשת את כל התכונות שלה. (זו שיטה אחרת מהאלכסון
    של קנטור, שמוכיח אי-מנייה.)
  lesson: '3.1'
