# Terms first defined in lesson 1.5 (sequences in a metric space).
- id: convergence-metric
  term: התכנסות במרחב מטרי
  en: convergence in a metric space
  symbol: 'x_n\to x'
  definition: >-
    $x_n\to x$ ב-$(X,d)$ אם $d(x_n,x)\to0$: לכל $\varepsilon>0$ קיים $N$ כך שלכל $n>N$ מתקיים
    $d(x_n,x)<\varepsilon$ (הגדרה 1.5.1). הגבול, אם קיים, יחיד (משפט 1.5.2).
  lesson: '1.5'
- id: sup-tube
  term: צינור (סביב פונקציה)
  en: sup-norm ball (tube) around a function
  definition: >-
    פונקציה $g$ בצינור ברוחב $\varepsilon$ סביב $f$ כש-$\sup_x|g(x)-f(x)|<\varepsilon$, כלומר כש-$g$ בכדור
    $B(f,\varepsilon)$ של מטריקת הסופרמום. זה יותר מכך שהגרף של $g$ נמצא ברצועה $\{(x,y): |y-f(x)|<\varepsilon\}$,
    שפירושו רק $|g(x)-f(x)|<\varepsilon$ בכל $x$ בנפרד: $x^n$ על $[0,1]$ נמצאת ברצועה ברוחב 1 סביב הגבול הנקודתי
    שלה, אבל לא בצינור, כי הסופרמום של ההפרש הוא 1.
  lesson: '1.5'
- id: countable-choice
  term: אקסיומת הבחירה הבת מנייה
  en: axiom of countable choice
  definition: >-
    אם $S_1,S_2,\dots$ סדרה של קבוצות לא ריקות, יש סדרה $(x_n)$ עם $x_n\in S_n$ לכל $n$. מבחירה אחת, או ממספר סופי של
    בחירות, אין צורך באקסיומה; היא נחוצה כשבוחרים אינסוף איברים "בבת אחת" בלי כלל מפורש שקובע איזה לבחור. כשיש כלל
    כזה, למשל "האינדקס הטבעי הקטן ביותר שמקיים את התנאי" (שקיים לפי עקרון הסדר הטוב של $\mathbb{N}$), אין צורך בה. משמשת
    בהוכחה של משפט 1.5.7.
  lesson: '1.5'
- id: coordinatewise-convergence
  term: התכנסות לפי קואורדינטות
  en: coordinatewise convergence
  definition: >-
    סדרה $x_n=(x_{n,1},\dots,x_{n,k})$ ב-$\mathbb{R}^k$ מתכנסת לפי קואורדינטות ל-$x$ אם $x_{n,i}\to x_i$ לכל
    $i$. ב-$\mathbb{R}^k$ עם $d_1$, $d_2$ או $d_\infty$ זה שקול ל-$x_n\to x$ (משפט 1.5.9), כי
    $|x_{n,i}-x_i|\le\|x_n-x\|_\infty\le\|x_n-x\|_2\le\|x_n-x\|_1\le k\,\|x_n-x\|_\infty$. במימד אינסופי זה נכשל.
  lesson: '1.5'
- id: eventually-constant
  term: קבועה מ-N והלאה
  en: eventually constant
  definition: >-
    סדרה שיש לה $N$ כך ש-$x_n=x_{N+1}$ לכל $n>N$. בכל מרחב מטרי היא מתכנסת, ובמטריקה הבדידה אלה בדיוק הסדרות
    המתכנסות (טענה 1.5.5).
  lesson: '1.5'
- id: bounded-set
  term: קבוצה חסומה (במרחב מטרי)
  en: bounded set
  definition: >-
    $A\subseteq X$ חסומה במרחב המטרי $(X,d)$ אם היא מוכלת בכדור כלשהו $B(a,r)$ (הגדרה וטענה 1.5.3); לקבוצה לא
    ריקה זה שקול לכך שיש $M$ עם $d(a,b)\le M$ לכל $a,b\in A$. החסימות תלויה במטריקה: $\mathbb{R}$ אינה חסומה
    ב-$|x-y|$, וחסומה ב-$|\arctan x-\arctan y|$. מטריקות שקולות ליפשיץ נותנות אותן קבוצות חסומות (משפט 1.7.5).
  lesson: '1.5'
