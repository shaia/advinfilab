# Terms first defined in lesson 3.5.
- id: equivalent-norms
  term: נורמות שקולות
  en: equivalent norms
  symbol: 'c\|x\|_a\le\|x\|_b\le C\|x\|_a'
  definition: >-
    שתי נורמות $\|\cdot\|_a$ ו-$\|\cdot\|_b$ על אותו מרחב וקטורי הן שקולות אם יש קבועים $c,C>0$ כך
    ש-$c\|x\|_a\le\|x\|_b\le C\|x\|_a$ לכל $x$ (הגדרה 3.5.1). לנורמות שקולות אותן סדרות מתכנסות, אותן סדרות קושי, אותן
    קבוצות פתוחות, סגורות, חסומות וקומפקטיות (טענה 3.5.2). במרחב ממימד סופי כל הנורמות שקולות (משפט 3.5.5 ומסקנה
    3.5.6).
  lesson: '3.5'
- id: seminorm
  term: חצי-נורמה
  en: seminorm
  definition: >-
    פונקציה $N:V\to[0,\infty)$ על מרחב וקטורי ממשי שמקיימת $N(\lambda x)=|\lambda|N(x)$ ואת אי-שוויון המשולש, אבל
    לא בהכרח את התנאי "$N(x)=0$ רק כש-$x=0$". לדוגמה $N(x_1,x_2)=|x_1|$ על $\mathbb{R}^2$. היא אינה נורמה, ואין
    $c>0$ עם $c\|x\|_2\le N(x)$ לכל $x$ (טענה 3.5.5א).
  lesson: '3.5'
- id: riesz-lemma
  term: הלמה של ריס
  en: Riesz's lemma
  definition: >-
    במרחב נורמי $V$, אם $W\ne V$ תת-מרחב **סגור** ו-$0<\eta<1$, יש $v\in V$ עם $\|v\|=1$
    ו-$\operatorname{dist}(v,W)\ge\eta$ (למה 3.5.9). ממנה נובע שכדור היחידה הסגור קומפקטי רק במרחב ממימד סופי
    (משפט 3.5.10).
  lesson: '3.5'
