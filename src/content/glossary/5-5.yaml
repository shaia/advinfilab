# Terms first defined in lesson 5.5.
- id: chain-rule
  term: כלל השרשרת
  en: chain rule
  symbol: 'D(g\circ f)(a)=Dg(f(a))\circ Df(a)'
  definition: >-
    אם $f$ דיפרנציאבילית ב-$a$ ו-$g$ דיפרנציאבילית ב-$f(a)$, אז $g\circ f$ דיפרנציאבילית ב-$a$,
    ו-$D(g\circ f)(a)=Dg(f(a))\circ Df(a)$; במטריצות $J_{g\circ f}(a)=J_g(f(a))\,J_f(a)$. מקרה פרטי: לאורך מסילה,
    $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$.
  lesson: '5.5'
- id: homogeneous-function
  term: פונקציה הומוגנית
  en: homogeneous function
  definition: >-
    $f:\mathbb{R}^n\setminus\{0\}\to\mathbb{R}$ הומוגנית מדרגה $k$ אם $f(tx)=t^kf(x)$ לכל $x\ne0$ ולכל $t>0$. אם היא גם
    דיפרנציאבילית, היא מקיימת את משפט אוילר: $x\cdot\nabla f(x)=kf(x)$.
  lesson: '5.5'
- id: euler-homogeneous-theorem
  term: משפט אוילר לפונקציות הומוגניות
  en: Euler's homogeneous function theorem
  symbol: 'x\cdot\nabla f(x)=kf(x)'
  definition: >-
    פונקציה דיפרנציאבילית על $\mathbb{R}^n\setminus\{0\}$ הומוגנית מדרגה $k$ אם ורק אם $x\cdot\nabla f(x)=kf(x)$ בכל
    נקודה $x\ne0$. ההוכחה: גוזרים את $t\mapsto f(tx)$ פעמיים, פעם לפי ההומוגניות ופעם לפי כלל השרשרת.
  lesson: '5.5'
- id: polar-coordinates
  term: קואורדינטות קוטביות
  en: polar coordinates
  symbol: 'x=r\cos\theta,\ y=r\sin\theta'
  definition: >-
    ההעתקה $(r,\theta)\mapsto(r\cos\theta,r\sin\theta)$, עם $r\ge0$: $r$ המרחק מהראשית ו-$\theta$ הזווית מהחלק החיובי
    של ציר $x$. לפונקציה $f$ במישור, $g(r,\theta)=f(r\cos\theta,r\sin\theta)$ היא אותה פונקציה בקואורדינטות קוטביות.
    הדטרמיננטה של מטריצת יעקובי של ההעתקה היא $r$; בשיעור 9.6 זה נותן את $dx\,dy=r\,dr\,d\theta$.
  lesson: '5.5'
