# Terms first defined in lesson 1.8 (bounded linear maps and the operator norm).
- id: bounded-linear-map
  term: העתקה לינארית חסומה
  en: bounded linear map
  definition: >-
    העתקה לינארית $T:V\to W$ בין מרחבים נורמיים שיש לה $M$ עם $\|Tx\|\le M\|x\|$ לכל $x$ (הגדרה 1.8.1). לפי משפט
    1.8.2 היא חסומה אם ורק אם היא רציפה, אם ורק אם היא רציפה ב-0, אם ורק אם היא ליפשיצית. "חסומה" אינו "בעלת
    תמונה חסומה".
  lesson: '1.8'
- id: operator-norm
  term: נורמת אופרטור
  en: operator norm
  symbol: '\|T\|_{\mathrm{op}}=\sup_{\|x\|\le1}\|Tx\|'
  definition: >-
    $\|T\|_{\mathrm{op}}=\sup_{\|x\|\le1}\|Tx\|$ (הגדרה 1.8.3), הקבוע $M$ הקטן ביותר עם $\|Tx\|\le M\|x\|$ (טענה
    1.8.4). למטריצה: בנורמה 1, הסכום המקסימלי של ערכים מוחלטים בעמודה; בנורמת אינסוף, בשורה; בנורמה האוקלידית
    $\sqrt{\lambda_{\max}(A^TA)}$ (משפטים 1.8.8–1.8.10).
  lesson: '1.8'
- id: linear-functional
  term: פונקציונל לינארי
  en: linear functional
  definition: >-
    העתקה לינארית $\varphi:V\to\mathbb{R}$ ממרחב נורמי לממשיים (עם הערך המוחלט), למשל $f\mapsto\int_0^1f$ או
    $f\mapsto f(0)$ על $C[0,1]$ (הגדרה 1.8.3). הנורמה שלו היא $\|\varphi\|_{\mathrm{op}}=\sup_{\|x\|\le1}|\varphi(x)|$, והוא רציף אם ורק אם הוא חסום.
  lesson: '1.8'
- id: unit-sphere
  term: ספרת היחידה
  en: unit sphere
  symbol: '\{x: \|x\|=1\}'
  definition: >-
    $\{x\in V:\ \|x\|=1\}$, השפה של כדור היחידה: הווקטורים שאורכם בדיוק 1. ("ספרה" כאן מלשון ספֵרה, שפה של כדור,
    ולא ספרה של מספר.) במישור: שפת המעוין ל-$\|\cdot\|_1$,
    המעגל ל-$\|\cdot\|_2$ ושפת הריבוע ל-$\|\cdot\|_\infty$. כש-$V\ne\{0\}$, נורמת האופרטור היא הסופרמום של $\|Tx\|$
    עליה (טענה 1.8.4).
  lesson: '1.8'
- id: frobenius-norm
  term: נורמת פרובניוס
  en: Frobenius norm
  symbol: '\|A\|_F=\sqrt{\sum_{i,j}a_{ij}^2}'
  definition: >-
    נורמה של מטריצה $A$ מגודל $m\times n$: $\|A\|_F=\sqrt{\sum_{i,j}a_{ij}^2}$, הנורמה האוקלידית של רשימת הכניסות.
    היא חוסמת מלעיל את נורמת האופרטור בנורמה האוקלידית, $\|A\|_2\le\|A\|_F$ (טענה 1.8.10ב), ואינה שווה לה באופן
    כללי.
  lesson: '1.8'
