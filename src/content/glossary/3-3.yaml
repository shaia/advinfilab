# Terms first defined in lesson 3.3.
- id: epsilon-net
  term: ε-רשת
  en: epsilon-net
  definition: >-
    קבוצה סופית $F\subseteq K$ כך שכל נקודה של $K$ נמצאת במרחק קטן מ-$\varepsilon$ מאחת הנקודות של $F$, כלומר
    $K\subseteq\bigcup_{y\in F}B(y,\varepsilon)$.
  lesson: '3.3'
- id: totally-bounded
  term: חסומה כליל
  en: totally bounded
  definition: >-
    קבוצה $K$ במרחב מטרי היא חסומה כליל אם לכל $\varepsilon>0$ יש לה $\varepsilon$-רשת סופית. חסומה כליל גורר
    חסומה, ולא להפך; מרחב מטרי קומפקטי אם ורק אם הוא שלם וחסום כליל.
  reject: [חסומה לחלוטין, חסומה לגמרי]
  lesson: '3.3'
- id: separated-set
  term: קבוצה מופרדת
  en: separated set
  definition: >-
    יהי $r>0$. קבוצה $S$ במרחב מטרי היא $r$-מופרדת אם $d(s,t)\ge r$ לכל $s\ne t$ ב-$S$. קבוצה חסומה כליל אם ורק אם
    לכל $r>0$ כל תת-קבוצה $r$-מופרדת שלה סופית.
  lesson: '3.3'
