# Terms first defined in lesson 1.7 (Lipschitz equivalence of metrics).
- id: lipschitz-equivalent-metrics
  term: מטריקות שקולות ליפשיץ
  en: Lipschitz-equivalent metrics
  definition: >-
    שתי מטריקות $d,d'$ על אותה קבוצה הן שקולות ליפשיץ אם יש קבועים $c,C>0$ עם $c\,d(x,y)\le d'(x,y)\le C\,d(x,y)$
    לכל $x,y$ (הגדרה 1.7.1). אז יש להן אותן קבוצות פתוחות, אותן סדרות מתכנסות ואותן קבוצות חסומות (משפט 1.7.5).
    למשל $d_\infty\le d_2\le d_1\le n\,d_\infty$ על $\mathbb{R}^n$.
  lesson: '1.7'
- id: topologically-equivalent-metrics
  term: מטריקות שקולות טופולוגית
  en: topologically equivalent metrics
  definition: >-
    שתי מטריקות $d,d'$ על אותה קבוצה $X$ הן שקולות טופולוגית אם יש להן אותן קבוצות פתוחות (הגדרה 1.7.6); באופן
    שקול, הזהות מ-$(X,d)$ אל $(X,d')$ היא הומיאומורפיזם, או שיש להן אותן סדרות מתכנסות עם אותם גבולות. שקילות
    ליפשיץ גוררת שקילות טופולוגית, ולא להפך: $|x-y|$ ו-$\min(|x-y|,1)$ על $\mathbb{R}$.
  lesson: '1.7'
