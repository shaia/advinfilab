# Terms first defined in lesson 1.3 (balls, open and closed sets).
- id: open-ball
  term: כדור פתוח
  en: open ball
  symbol: 'B(x,r)'
  definition: >-
    $B(x,r)=\{y\in X: d(x,y)<r\}$, עבור $x\in X$ ו-$r>0$. במישור עם $d_1$, $d_2$, $d_\infty$ הוא מעוין, עיגול
    וריבוע; במטריקה הבדידה הוא $\{x\}$ או כל $X$.
  lesson: '1.3'
- id: closed-ball
  term: כדור סגור
  en: closed ball
  symbol: 'B[x,r]'
  definition: >-
    $B[x,r]=\{y\in X: d(x,y)\le r\}$. הוא קבוצה סגורה, ומכיל את הסגור של $B(x,r)$, אבל לא תמיד שווה לו.
  lesson: '1.3'
- id: open-set
  term: קבוצה פתוחה
  en: open set
  definition: >-
    $U\subseteq X$ פתוחה אם לכל $x\in U$ קיים $r>0$ עם $B(x,r)\subseteq U$. איחוד כלשהו וחיתוך סופי של
    פתוחות פתוחים.
  lesson: '1.3'
- id: closed-set
  term: קבוצה סגורה
  en: closed set
  definition: >-
    $F\subseteq X$ סגורה אם המשלים $X\setminus F$ פתוח. "סגורה" אינה ההפך של "פתוחה": קבוצה יכולה להיות שתיהן
    או אף אחת.
  lesson: '1.3'
- id: metric-subspace
  term: תת-מרחב (של מרחב מטרי)
  en: subspace (of a metric space)
  definition: >-
    תת-קבוצה $Y\subseteq X$ עם צמצום המטריקה. הכדורים בו הם $B_X(y,r)\cap Y$, והקבוצות הפתוחות בו הן
    $U\cap Y$ ל-$U$ פתוחה ב-$X$; לכן $[0,1)$ פתוחה בתת-המרחב $[0,2]$ ולא ב-$\mathbb{R}$.
  lesson: '1.3'
- id: sphere
  term: ספרה
  en: sphere
  symbol: 'S(x,r)'
  definition: >-
    $S(x,r)=\{y\in X: d(x,y)=r\}$, עבור $x\in X$ ו-$r>0$ (הגדרה 1.3.1): הכדור הסגור פחות הכדור הפתוח. היא תמיד
    קבוצה סגורה (דוגמה 3 בשיעור 1.3). במישור
    עם $d_2$ זה מעגל; במטריקה הבדידה $S(x,1)=X\setminus\{x\}$, והיא גם פתוחה.
  lesson: '1.3'
