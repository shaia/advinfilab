# Terms first defined in lesson 2.3.
- id: contraction
  term: העתקה מכווצת
  en: contraction (contraction mapping)
  symbol: 'd(f(x),f(y))\le q\,d(x,y)'
  definition: >-
    העתקה $f:X\to X$ של מרחב מטרי לתוך עצמו, שיש לה **מקדם כיווץ** $0\le q<1$ אחד כך ש-$d(f(x),f(y))\le q\,d(x,y)$
    לכל $x,y\in X$. העתקה שרק מקטינה כל מרחק ($d(f(x),f(y))<d(x,y)$) אינה בהכרח מכווצת.
  lesson: '2.3'
- id: fixed-point
  term: נקודת שבת
  en: fixed point
  symbol: 'f(x^*)=x^*'
  definition: >-
    נקודה $x^*$ שההעתקה $f$ משאירה במקומה: $f(x^*)=x^*$. משפט נקודת השבת של בנך: להעתקה מכווצת של מרחב שלם לא
    ריק יש נקודת שבת יחידה, והאיטרציות $x_{n+1}=f(x_n)$ מכל נקודת התחלה מתכנסות אליה.
  lesson: '2.3'
- id: iteration-sequence
  term: סדרת האיטרציות
  en: sequence of iterates
  symbol: 'x_{n+1}=f(x_n)'
  definition: >-
    ל-$f:X\to X$ ולנקודת התחלה $x_0\in X$, הסדרה $x_0,\ x_1=f(x_0),\ x_2=f(x_1),\dots$, כלומר $x_n=f^n(x_0)$. היא מוגדרת
    רק כש-$f$ שולחת את $X$ לתוך עצמו; אחרת איבר יכול לצאת מ-$X$, ואז $f$ אינה מוגדרת עליו.
  lesson: '2.3'
- id: a-priori-bound
  term: חסם אפריורי
  en: a-priori error bound
  symbol: 'd(x_n,x^*)\le\frac{q^n}{1-q}\,d(x_0,x_1)'
  definition: >-
    חסם על השגיאה $d(x_n,x^*)$ של האיטרציה ה-$n$ של העתקה מכווצת, שמחושב **לפני** שמריצים את האיטרציות: הוא תלוי
    רק במקדם הכיווץ $q$ ובצעד הראשון $d(x_0,x_1)$. בעזרתו מוצאים מראש כמה איטרציות מספיקות לדיוק נתון.
  lesson: '2.3'
- id: a-posteriori-bound
  term: חסם אפוסטריורי
  en: a-posteriori error bound
  symbol: 'd(x_n,x^*)\le\frac{q}{1-q}\,d(x_{n-1},x_n)'
  definition: >-
    חסם על השגיאה $d(x_n,x^*)$ שמחושב **אחרי** שהאיטרציות רצו, מהצעד האחרון $d(x_{n-1},x_n)$. בדרך כלל הוא חד
    בהרבה מהחסם האפריורי, כי הוא משתמש במה שכבר נמדד.
  lesson: '2.3'
