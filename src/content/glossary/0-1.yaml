# Terms first defined in lesson 0.1.
- id: counterexample
  term: דוגמה נגדית
  en: counterexample
  definition: >-
    דוגמה שמפריכה טענה כללית: אובייקט שמקיים את ההנחות של הטענה ולא את המסקנה שלה. כדי להראות שהנחה במשפט
    נחוצה, מחפשים דוגמה נגדית שמקיימת את כל שאר ההנחות ומפרה רק אותה.
  reject: [דוגמא נגדית]
  lesson: '0.1'
