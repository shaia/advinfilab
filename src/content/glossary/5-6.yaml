# Terms first defined in lesson 5.6.
- id: mean-value-inequality
  term: אי-שוויון הערך הממוצע
  en: mean value inequality
  symbol: '\|f(b)-f(a)\|\le\sup_{c\in[a,b]}\|Df(c)\|_{\mathrm{op}}\|b-a\|'
  definition: >-
    אם $f:U\to\mathbb{R}^m$ דיפרנציאבילית והקטע $[a,b]$ מוכל ב-$U$, אז
    $\|f(b)-f(a)\|\le\sup_{c\in[a,b]}\|Df(c)\|_{\mathrm{op}}\,\|b-a\|$. זה מה שנשאר ממשפט הערך הממוצע לפונקציות
    וקטוריות, שלהן אין שוויון. על קבוצה קמורה הוא הופך חסם על $Df$ לקבוע ליפשיץ.
  lesson: '5.6'
- id: segment-in-space
  term: קטע במרחב
  en: line segment
  symbol: '[a,b]=\{a+t(b-a):\ 0\le t\le1\}'
  definition: >-
    הקטע מ-$a$ ל-$b$ ב-$\mathbb{R}^n$ הוא $[a,b]=\{a+t(b-a):\ 0\le t\le1\}$, והנקודות שבהן $0<t<1$ הן הנקודות
    הפנימיות שלו (כלומר כל הנקודות חוץ מהקצוות; זה אינו המובן של "נקודה פנימית" של קבוצה משיעור 1.4). קבוצה קמורה היא קבוצה שמכילה את הקטע בין כל שתיים מנקודותיה. משפט הערך הממוצע בכמה משתנים מדבר
    על קטע שמוכל בתחום.
  lesson: '5.6'
