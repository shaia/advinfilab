# Terms first defined in lesson 3.6 (enrichment).
- id: separation
  term: פירוק
  en: separation (of a metric space)
  symbol: 'X=U\cup V'
  definition: >-
    פירוק של מרחב מטרי $X$ הוא זוג קבוצות $U,V$ פתוחות ב-$X$, זרות ולא ריקות, עם $X=U\cup V$. מרחב שיש לו פירוק אינו
    קשיר. פירוק של תת-קבוצה $A$ הוא פירוק של תת-המרחב $A$: הקבוצות פתוחות **ב-$A$** (משפט 1.3.11).
  lesson: '3.6'
- id: connected
  term: קבוצה קשירה
  en: connected set
  definition: >-
    מרחב מטרי $X$ הוא קשיר אם אי אפשר לכתוב אותו כאיחוד של שתי קבוצות פתוחות, זרות ולא ריקות (אין לו פירוק). קבוצה
    $A\subseteq X$ היא קשירה אם תת-המרחב $A$, עם המטריקה המצומצמת, קשיר. בישר, הקבוצות הקשירות הן בדיוק הקטעים (כולל
    קרניים, נקודה, הקבוצה הריקה והישר כולו).
  lesson: '3.6'
- id: clopen-set
  term: קבוצה פתוחה וסגורה
  en: clopen set
  definition: >-
    קבוצה שהיא בו-זמנית פתוחה וסגורה באותו מרחב. ב-$X$ עצמו $\emptyset$ ו-$X$ תמיד כאלה; $X$ קשיר אם ורק אם אין אחרות.
    במרחב בדיד כל קבוצה פתוחה וסגורה.
  lesson: '3.6'
- id: interval
  term: קטע
  en: interval
  definition: >-
    תת-קבוצה $I\subseteq\mathbb{R}$ כך שלכל $a,b\in I$ ולכל $c$ עם $a<c<b$ גם $c\in I$. אלה בדיוק הקטעים המוכרים: סגורים,
    פתוחים, חצי-פתוחים, קרניים, $\mathbb{R}$, נקודה אחת והקבוצה הריקה.
  lesson: '3.6'
- id: path
  term: מסילה (במרחב מטרי)
  en: path
  symbol: '\gamma:[0,1]\to X'
  definition: >-
    מסילה מ-$p$ ל-$q$ במרחב מטרי $X$ היא פונקציה רציפה $\gamma:[0,1]\to X$ עם $\gamma(0)=p$ ו-$\gamma(1)=q$. המסילה היא
    הפונקציה; התמונה שלה $\gamma([0,1])$ היא קבוצה קשירה.
  lesson: '3.6'
- id: path-connected
  term: קשירה מסילתית
  en: path-connected
  definition: >-
    $X$ קשיר מסילתית אם לכל $p,q\in X$ יש מסילה ב-$X$ מ-$p$ ל-$q$. קשיר מסילתית גורר קשיר, ולא להפך (עקומת הסינוס של
    הטופולוגים); קבוצה פתוחה וקשירה במרחב נורמי קשירה מסילתית.
  reject: [קשירה במסילות]
  lesson: '3.6'
- id: polygonal-path
  term: מסילה פוליגונלית
  en: polygonal path
  definition: >-
    במרחב נורמי: מסילה שהיא שרשור של מספר סופי של קטעים $[z_0,z_1],[z_1,z_2],\dots,[z_{m-1},z_m]$, כאשר
    $[a,b]=\{(1-t)a+tb:\ t\in[0,1]\}$. בקבוצה פתוחה וקשירה כל שתי נקודות מתחברות במסילה כזו.
  lesson: '3.6'
- id: topologists-sine-curve
  term: עקומת הסינוס של הטופולוגים
  en: topologist's sine curve
  symbol: 'S=G\cup J'
  definition: >-
    $S=G\cup J$ במישור, עם $G=\{(x,\sin\frac1x):\ 0<x\le1\}$ ו-$J=\{0\}\times[-1,1]$. היא קשירה (וגם קומפקטית), ואינה
    קשירה מסילתית: אין מסילה ב-$S$ מנקודה של $J$ לנקודה של $G$.
  lesson: '3.6'
