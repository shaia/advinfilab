# Terms first defined in lesson 3.6 (enrichment).
- id: connected
  term: קבוצה קשירה
  en: connected set
  definition: >-
    מרחב מטרי $X$ הוא קשיר אם אי אפשר לכתוב אותו כאיחוד של שתי קבוצות פתוחות, זרות ולא ריקות. קבוצה קשירה היא
    קבוצה שהיא מרחב קשיר עם המטריקה המושרית. בישר, הקבוצות הקשירות הן בדיוק הקטעים (כולל קרניים, נקודה והישר כולו).
  lesson: '3.6'
- id: path-connected
  term: קשירה מסילתית
  en: path-connected
  definition: >-
    $X$ קשיר מסילתית אם לכל $p,q\in X$ יש מסילה, פונקציה רציפה $\gamma:[0,1]\to X$ עם $\gamma(0)=p$ ו-$\gamma(1)=q$.
    קשיר מסילתית גורר קשיר, ולא להפך; קבוצה פתוחה וקשירה במרחב האוקלידי קשירה מסילתית.
  reject: [קשירה במסילות]
  lesson: '3.6'
