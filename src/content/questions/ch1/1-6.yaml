# Lesson 1.6 — continuity between metric spaces.
# Objectives (src/course.ts):
#   OBJ-1.6-1  continuity at a point by ε-δ and by sequences, and their equivalence
#   OBJ-1.6-2  continuous iff preimages of open sets are open; use it to show sets open or closed
#   OBJ-1.6-3  Lipschitz functions, uniform continuity, homeomorphisms, told apart by examples
chapter: 1
questions:
  - id: Q-1.6-epsdelta
    type: mc
    objectives: [OBJ-1.6-1]
    qualitative: true
    level: basic
    prompt: >-
      $f:(X,d_X)\to(Y,d_Y)$. מה פירוש "$f$ רציפה בנקודה $a\in X$"?
    choices:
      - text: 'לכל $\varepsilon>0$ קיים $\delta>0$ כך שלכל $x$ עם $d_X(x,a)<\delta$: $d_Y(f(x),f(a))<\varepsilon$'
        correct: true
        feedback: >-
          נכון. קודם בוחרים כמה קרוב רוצים להיות בתמונה ($\varepsilon$), ואז מוצאים כמה קרוב צריך להיות בתחום ($\delta$).
      - text: 'קיים $\delta>0$ כך שלכל $\varepsilon>0$ ולכל $x$ עם $d_X(x,a)<\delta$: $d_Y(f(x),f(a))<\varepsilon$'
        feedback: >-
          כש-$\delta$ בא קודם, הוא צריך להתאים לכל $\varepsilon$, ואז $f(x)=f(a)$ לכל $x$ ב-$B(a,\delta)$: $f$ קבועה
          ליד $a$. זו דרישה חזקה בהרבה מרציפות.
        misconception: MC-c1-quantifier-order
      - text: 'לכל $\varepsilon>0$ קיים $\delta>0$ כך שלכל $x$ עם $d_Y(f(x),f(a))<\delta$: $d_X(x,a)<\varepsilon$'
        feedback: >-
          הכיוון הפוך: זה אומר "קרוב בתמונה גורר קרוב בתחום". פונקציה קבועה רציפה, ובכל זאת כל $x$ מקיים
          $d_Y(f(x),f(a))=0$, גם $x$ רחוק מ-$a$.
        misconception: MC-c1-continuity-direction
      - text: 'לכל $\delta>0$ קיים $\varepsilon>0$ כך שלכל $x$ עם $d_X(x,a)<\delta$: $d_Y(f(x),f(a))<\varepsilon$'
        feedback: >-
          זה אומר רק שהתמונה של כל כדור סביב $a$ חסומה, וזה נכון גם לפונקציית מדרגה חסומה שקופצת ב-$a$.
        misconception: MC-c1-quantifier-order

  - id: Q-1.6-seq
    type: twotier
    objectives: [OBJ-1.6-1]
    qualitative: true
    level: basic
    prompt: >-
      $f:(\mathbb{R}^2,d_2)\to\mathbb{R}$, $f(x,y)=\frac{x^2y^2}{x^4+y^4}$ כש-$(x,y)\neq(0,0)$, ו-$f(0,0)=0$. האם $f$
      רציפה ב-$(0,0)$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. לפי האפיון הסדרתי מספיקה סדרה אחת $x_n\to(0,0)$ עם $f(x_n)\not\to0$.'
      - text: כן
        feedback: >-
          על הצירים $f=0$, אבל לאורך האלכסון $f(\frac1n,\frac1n)=\frac{1/n^4}{2/n^4}=\frac12$ לכל $n$.
        misconception: MC-c1-few-sequences-continuity
    reasons:
      - text: '$(\frac1n,\frac1n)\to(0,0)$, ו-$f(\frac1n,\frac1n)=\frac12\not\to0=f(0,0)$'
        correct: true
        feedback: >-
          בדיוק. רציפות דורשת $f(x_n)\to f(a)$ **לכל** סדרה $x_n\to a$; סדרה אחת שנכשלת מפריכה.
      - text: '$f(\frac1n,0)=0\to0$ ו-$f(0,\frac1n)=0\to0$, ולכן $f$ רציפה'
        feedback: >-
          שתי סדרות אינן כל הסדרות. סדרה אחת יכולה להפריך רציפות, אבל לא להוכיח אותה.
        misconception: MC-c1-few-sequences-continuity
      - text: 'לכל $y$ קבוע, $x\mapsto f(x,y)$ רציפה'
        feedback: >-
          רציפות בכל משתנה בנפרד היא בדיקה לאורך ישרים מקבילים לצירים, ולא כל הסדרות. האלכסון מפריך.
        misconception: MC-c1-few-sequences-continuity

  - id: Q-1.6-preimage
    type: multi
    objectives: [OBJ-1.6-2]
    qualitative: true
    level: basic
    prompt: >-
      $f:\mathbb{R}\to\mathbb{R}$ רציפה. אילו מהטענות נכונות **בהכרח**? סמנו את כולן.
    choices:
      - text: '$\{x: f(x)>0\}$ פתוחה'
        correct: true
        feedback: 'נכון: זו $f^{-1}((0,\infty))$, מקור של קבוצה פתוחה.'
      - text: '$\{x: 0\le f(x)\le1\}$ סגורה'
        correct: true
        feedback: >-
          נכון: זו $f^{-1}([0,1])$. המשלים שלה הוא $f^{-1}(\mathbb{R}\setminus[0,1])$, מקור של פתוחה, ולכן פתוח.
      - text: '$f((0,1))$ פתוחה'
        feedback: >-
          רציפות מדברת על מקורות, לא על תמונות. $f\equiv5$ רציפה ו-$f((0,1))=\{5\}$ אינה פתוחה.
        misconception: MC-c1-continuity-direction
      - text: '$f(\mathbb{R})$ פתוחה'
        feedback: >-
          $f(x)=x^2$ רציפה ו-$f(\mathbb{R})=[0,\infty)$ אינה פתוחה.
        misconception: MC-c1-continuity-direction
      - text: '$\{x: f(x)=0\}$ סגורה'
        correct: true
        feedback: 'נכון: $f^{-1}(\{0\})$, ו-$\{0\}$ סגורה ב-$\mathbb{R}$.'

  - id: Q-1.6-lipconst
    type: numeric
    objectives: [OBJ-1.6-3]
    level: basic
    prompt: >-
      $g:(\mathbb{R}^2,d_\infty)\to\mathbb{R}$, $g(x,y)=x+y$. מהו קבוע ליפשיץ **הקטן ביותר** $L$, כלומר
      $|g(u)-g(v)|\le L\,d_\infty(u,v)$ לכל $u,v\in\mathbb{R}^2$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. עם $u=(x,y)$, $v=(x',y')$: $|(x-x')+(y-y')|\le|x-x'|+|y-y'|\le2d_\infty(u,v)$, ועם $u=(1,1)$, $v=(0,0)$
      מקבלים $|g(u)-g(v)|=2=2d_\infty(u,v)$. לכן קבוע קטן מ-2 לא עובד.
    wrongFeedback: >-
      חסמו $|g(u)-g(v)|$ בעזרת $\max(|x-x'|,|y-y'|)$, ומצאו זוג נקודות שבו החסם מתקבל בשוויון.
    commonWrong:
      - value: 1
        feedback: >-
          1 הוא הקבוע עבור $d_1$ בתחום. עם $d_\infty$ שתי הקואורדינטות יכולות לזוז בבת אחת עד המרחק המלא: $u=(1,1)$.
        misconception: MC-c1-one-distance
      - value: 1.41421356
        feedback: >-
          $\sqrt2$ הוא הקבוע עבור $d_2$ בתחום (קושי-שוורץ). כאן התחום עם $d_\infty$, והקבוע 2.
        misconception: MC-c1-one-distance

  - id: Q-1.6-dist-lip
    type: rank
    objectives: [OBJ-1.6-3]
    level: basic
    prompt: >-
      סדרו את שלבי ההוכחה שהפונקציה $f(x)=d(x,a)$ על מרחב מטרי היא 1-ליפשיצית:
      $|d(x,a)-d(y,a)|\le d(x,y)$.
    help: סדרו את השלבים מהראשון לאחרון.
    items:
      - id: tri
        label: 'לפי אי-שוויון המשולש: $d(x,a)\le d(x,y)+d(y,a)$, כלומר $d(x,a)-d(y,a)\le d(x,y)$.'
      - id: swap
        label: 'מחליפים את התפקידים של $x$ ו-$y$: $d(y,a)-d(x,a)\le d(y,x)$.'
      - id: sym
        label: 'לפי הסימטריה $d(y,x)=d(x,y)$.'
      - id: abs
        label: 'שני אי-השוויונים יחד: $|d(x,a)-d(y,a)|\le d(x,y)$.'
      - id: conc
        label: 'לכן $f$ ליפשיצית עם קבוע 1, ובפרט רציפה במידה שווה, עם $\delta=\varepsilon$.'
    order: [tri, swap, sym, abs, conc]
    correctFeedback: >-
      נכון. זה אי-שוויון המשולש ההפוך. מכאן, למשל, ש-$B(a,r)=f^{-1}((-\infty,r))$ פתוח ו-$B[a,r]=f^{-1}([0,r])$ סגור.
    wrongFeedback: >-
      ערך מוחלט קטן מ-$t$ פירושו שני אי-שוויונים, אחד לכל כיוון. השיגו כל אחד ממשולש, ואחדו בסוף.

  - id: Q-1.6-closed-ball
    type: twotier
    objectives: [OBJ-1.6-2]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: בכל מרחב מטרי הכדור הסגור $B[a,r]$ הוא קבוצה סגורה.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. האפיון של רציפות דרך מקורות נותן את זה בשורה אחת.'
      - text: לא נכון, למשל במטריקה הבדידה
        feedback: >-
          במטריקה הבדידה כל קבוצה סגורה, כולל $B[a,1]=X$. מה שנכשל שם הוא $\overline{B(a,1)}=B[a,1]$, לא הסגירות
          של הכדור הסגור.
        misconception: MC-c1-closure-of-ball
    reasons:
      - text: '$B[a,r]=f^{-1}\big((-\infty,r]\big)$ עם $f(x)=d(x,a)$ רציפה, ו-$(-\infty,r]$ סגורה בישר'
        correct: true
        feedback: >-
          בדיוק: מקור של קבוצה סגורה תחת פונקציה רציפה סגור. (אפשר גם ישירות: המשלים $\{x: d(x,a)>r\}$ פתוח.)
      - text: 'הוא הסגור של $B(a,r)$, וסגור הוא תמיד סגור'
        feedback: >-
          $B[a,r]$ אינו תמיד הסגור של $B(a,r)$: במטריקה הבדידה $\overline{B(a,1)}=\{a\}\neq X=B[a,1]$.
        misconception: MC-c1-closure-of-ball
      - text: 'לכל $y$ במשלים, הכדור $B(y,d(y,a))$ זר ל-$B[a,r]$'
        feedback: >-
          הרדיוס גדול מדי: ב-$\mathbb{R}$ עם $a=0$, $r=1$, $y=3$, הכדור $B(3,3)=(0,6)$ מכיל את $\frac12\in B[0,1]$.
          הרדיוס הנכון הוא $d(y,a)-r$.
        misconception: MC-c1-radius-distance

  - id: Q-1.6-uc-def
    type: mc
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: basic
    prompt: >-
      מתי $f:(X,d_X)\to(Y,d_Y)$ **רציפה במידה שווה**?
    choices:
      - text: 'לכל $\varepsilon>0$ קיים $\delta>0$ כך שלכל $x,y\in X$ עם $d_X(x,y)<\delta$: $d_Y(f(x),f(y))<\varepsilon$'
        correct: true
        feedback: >-
          נכון. $\delta$ נבחר לפני הנקודות, ולכן מתאים לכולן בבת אחת.
      - text: 'לכל $\varepsilon>0$ ולכל $x\in X$ קיים $\delta>0$ כך שלכל $y$ עם $d_X(x,y)<\delta$: $d_Y(f(x),f(y))<\varepsilon$'
        feedback: >-
          זו רציפות רגילה בכל נקודה: $\delta$ רשאי להיות תלוי ב-$x$. ב-$x^2$ על $\mathbb{R}$ ה-$\delta$ חייב לקטון
          כש-$x$ גדל.
        misconception: MC-c1-quantifier-order
      - text: 'יש $L$ כך ש-$d_Y(f(x),f(y))\le L\,d_X(x,y)$ לכל $x,y$'
        feedback: >-
          זו ליפשיציות, תנאי חזק יותר. $\sqrt x$ על $[0,1]$ רציפה במידה שווה ואינה ליפשיצית.
        misconception: MC-c1-uniform-lipschitz

  - id: Q-1.6-sqrt
    type: twotier
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: mid
    prompt: >-
      האם $f(x)=\sqrt x$ ליפשיצית על $[0,1]$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. היא רציפה במידה שווה, אבל אינה ליפשיצית.'
      - text: כן, כי היא רציפה במידה שווה
        feedback: >-
          רציפה במידה שווה אינה גוררת ליפשיצית. עם $x=\frac1{n^2}$ ו-$y=0$ היחס $\frac{|\sqrt x-\sqrt y|}{|x-y|}=n$ אינו
          חסום.
        misconception: MC-c1-uniform-lipschitz
    reasons:
      - text: 'עם $x=\frac1{n^2}$, $y=0$: $\frac{|f(x)-f(y)|}{|x-y|}=n$, ולכן אין קבוע $L$'
        correct: true
        feedback: >-
          בדיוק. ובכל זאת $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$, כך ש-$\delta=\varepsilon^2$ מתאים לכל הנקודות:
          רציפה במידה שווה.
      - text: 'הנגזרת $\frac{1}{2\sqrt x}$ אינה חסומה, ולכן $f$ אינה אפילו רציפה במידה שווה'
        feedback: >-
          המסקנה שגויה: $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$, ולכן $f$ רציפה במידה שווה. נגזרת לא חסומה שוללת
          ליפשיציות, לא רציפות במידה שווה.
        misconception: MC-c1-uniform-lipschitz
      - text: 'כל פונקציה רציפה על קטע סגור ליפשיצית'
        feedback: >-
          $\sqrt x$ עצמה רציפה על $[0,1]$ ואינה ליפשיצית. על קטע סגור רציפות גוררת רציפות במידה שווה (משפט קנטור-היינה מאינפי 1),
          לא ליפשיציות.
        misconception: MC-c1-uniform-lipschitz

  - id: Q-1.6-x2
    type: twotier
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: mid
    prompt: >-
      תהי $f:\mathbb{N}\to\mathbb{R}$, $f(n)=n^2$, כאשר על $\mathbb{N}$ ועל $\mathbb{R}$ המרחק הרגיל $|\cdot|$. האם $f$
      רציפה במידה שווה?
    choices:
      - text: כן
        correct: true
        feedback: 'נכון. בתחום הזה נקודות שונות רחוקות זו מזו לפחות 1, ולכן $\delta$ קטן מ-1 אינו משאיר זוגות שונים לבדוק.'
      - text: לא
        feedback: >-
          ב-$\mathbb{R}$ הזוגות $n$, $n+\frac1n$ מפילים את $x^2$, אבל $n+\frac1n\notin\mathbb{N}$ כש-$n\ge2$. ב-$\mathbb{N}$,
          $|m-n|<\frac12$ גורר $m=n$.
        misconception: MC-c1-uniform-ignores-domain
    reasons:
      - text: 'יהי $\varepsilon>0$ ו-$\delta=\frac12$: אם $m,n\in\mathbb{N}$ ו-$|m-n|<\frac12$ אז $m=n$, ולכן $|f(m)-f(n)|=0$'
        correct: true
        feedback: >-
          בדיוק: אותו טיעון כמו במטריקה הבדידה (טענה 1.6.10 (א)), כי על $\mathbb{N}$ המרחק בין נקודות שונות הוא
          לפחות 1. הנוסחה אותה נוסחה כמו על $\mathbb{R}$; התחום שונה.
      - text: 'היא ליפשיצית על $\mathbb{N}$, ולכן רציפה במידה שווה'
        feedback: >-
          המסקנה נכונה, הנימוק לא: $\frac{|f(n+1)-f(n)|}{|(n+1)-n|}=2n+1$ אינו חסום, ולכן $f$ אינה ליפשיצית על
          $\mathbb{N}$. רציפות במידה שווה אינה דורשת ליפשיציות (טענה 1.6.9).
        misconception: MC-c1-uniform-lipschitz
      - text: 'היא רציפה בכל נקודה של $\mathbb{N}$, וכל פונקציה רציפה רציפה במידה שווה'
        feedback: >-
          המסקנה נכונה, הנימוק לא: $x^2$ על $\mathbb{R}$ ו-$\frac1x$ על $(0,1)$ רציפות ואינן רציפות במידה שווה.
        misconception: MC-c1-continuous-uniform

  - id: Q-1.6-homeo
    type: multi
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: mid
    prompt: >-
      אילו מההעתקות הבאות הן **הומיאומורפיזמים** (עם המטריקות הרגילות, אלא אם נאמר אחרת)? סמנו את כולן.
    choices:
      - text: '$(0,1]\to[1,\infty)$, $x\mapsto\frac1x$'
        correct: true
        feedback: >-
          נכון: רציפה (מנה עם מכנה שאינו מתאפס, טענה 1.6.5 (ב)), חד-חד-ערכית ועל, וההפכית שלה היא
          $y\mapsto\frac1y$ על $[1,\infty)$, רציפה מאותה סיבה. קבוצה חסומה ולא חסומה, ובכל זאת הומיאומורפיות.
      - text: '$[0,1)\cup[2,3]\to[0,2]$, $f(x)=x$ על $[0,1)$ ו-$f(x)=x-1$ על $[2,3]$'
        feedback: >-
          $f$ רציפה (כל נקודה של התחום יש לה כדור, ברדיוס קטן מ-1, שכולו באותו חלק, ושם $f$ הזזה), חד-חד-ערכית ועל.
          אבל ההפכית אינה רציפה ב-1: $1-\frac1n\to1$, וההפכית שולחת אותן ל-$1-\frac1n\to1$, ואת $1$ עצמה ל-$2$.
        misconception: MC-c1-bijection-homeomorphism
      - text: '$x\mapsto x^3$, מ-$\mathbb{R}$ עם המטריקה הבדידה אל $\mathbb{R}$ עם המטריקה הבדידה'
        correct: true
        feedback: >-
          נכון: היא חד-חד-ערכית ועל, וגם היא וגם ההפכית $\sqrt[3]{y}$ הן פונקציות ממרחב עם המטריקה הבדידה, ולכן
          רציפות לפי טענה 1.6.10 (א).
      - text: '$x\mapsto x^3$, מ-$\mathbb{R}$ עם המטריקה הבדידה אל $\mathbb{R}$ עם המרחק הרגיל'
        feedback: >-
          רציפה לפי טענה 1.6.10 (א), חד-חד-ערכית ועל. אבל ההפכית $\sqrt[3]{y}$, מהישר הרגיל אל הבדידה, אינה רציפה
          באף נקודה: $\sqrt[3]{b+\frac1n}\ne\sqrt[3]{b}$, ולכן המרחק הבדיד ביניהם 1 לכל $n$, אף ש-$b+\frac1n\to b$.
        misconception: MC-c1-bijection-homeomorphism

  - id: Q-1.6-bounded-homeo
    type: twotier
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: אם $X$ ו-$Y$ מרחבים מטריים הומיאומורפיים ו-$X$ חסום, אז גם $Y$ חסום.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. חסימות תלויה במרחקים, והומיאומורפיזם לא שומר עליהם.'
      - text: נכון
        feedback: >-
          על אותה קבוצה $\mathbb{N}$, המטריקה הבדידה חסומה והמרחק הרגיל לא, והזהות ביניהן רציפה בשני הכיוונים.
        misconception: MC-c1-homeo-preserves-metric
    reasons:
      - text: 'הזהות מ-$(\mathbb{N},d_0)$ אל $(\mathbb{N},|\cdot|)$: בשני המרחבים מרחק קטן מ-$\frac12$ גורר שוויון, והראשון חסום והשני לא'
        correct: true
        feedback: >-
          בדיוק. בשני המרחבים $\delta=\frac12$ מתאים לכל פונקציה, כמו בטענה 1.6.10 (א), ולכן הזהות וההפכית שלה רציפות.
          $(\mathbb{N},d_0)=B(1,2)$ חסום, ו-$(\mathbb{N},|\cdot|)$ אינו מוכל באף כדור. הומיאומורפיזם שומר על מה שמוגדר
          דרך קבוצות פתוחות או סדרות מתכנסות, לא על חסימות.
      - text: 'הומיאומורפיזם הוא ליפשיצי, ולכן שומר על חסימות'
        feedback: >-
          הומיאומורפיזם רק רציף בשני הכיוונים, לא ליפשיצי. הזהות מ-$(\mathbb{N},d_0)$ אל $(\mathbb{N},|\cdot|)$ אינה
          ליפשיצית: $|n-1|=n-1$ ו-$d_0(n,1)=1$.
        misconception: MC-c1-homeo-preserves-metric
      - text: 'מרחבים הומיאומורפיים הם "אותו מרחב", ולכן יש להם אותן תכונות'
        feedback: >-
          יש להם אותן תכונות **טופולוגיות** (קבוצות פתוחות, סדרות מתכנסות), לא אותם מרחקים.
        misconception: MC-c1-homeo-preserves-metric

  - id: Q-1.6-eval
    type: twotier
    objectives: [OBJ-1.6-1, OBJ-1.6-2]
    qualitative: true
    level: mid
    prompt: >-
      ב-$C[0,1]$ עם מטריקת **האינטגרל** $d_1(f,g)=\int_0^1|f-g|$, האם $U=\{f: f(0)>0\}$ פתוחה?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ב-$d_\infty$ היא פתוחה, אבל לא ב-$d_1$: שם ערך בנקודה אחת לא נשלט.
      - text: כן
        feedback: >-
          $U$ היא אכן המקור של $(0,\infty)$ תחת $f\mapsto f(0)$. אבל משפט 1.6.4 מסיק פתיחות רק מרציפות: ביחס לאיזו
          משתי המטריקות $f\mapsto f(0)$ רציפה (טענה 1.6.11)?
        misconception: MC-c1-one-distance
    reasons:
      - text: '$\mathbf 1\in U$, ו-$g_n(x)=1-2\max(0,1-nx)$ מקיימת $d_1(g_n,\mathbf 1)=\frac1n\to0$ ו-$g_n(0)=-1\notin U$'
        correct: true
        feedback: >-
          בדיוק: כל כדור של $d_1$ סביב הפונקציה הקבועה $\mathbf 1$ מכיל פונקציה מחוץ ל-$U$.
          ($d_1(g_n,\mathbf 1)=2\int_0^{1/n}(1-nx)\,dx=\frac1n$.)
      - text: '$U$ מקור של הקבוצה הפתוחה $(0,\infty)$ תחת $f\mapsto f(0)$, שהיא רציפה'
        feedback: >-
          $f\mapsto f(0)$ רציפה (אפילו 1-ליפשיצית) ביחס ל-$d_\infty$. ביחס ל-$d_1$, $f_n=\max(0,1-nx)$ מקיימת
          $d_1(f_n,\theta)\to0$ ו-$f_n(0)=1\not\to0$.
        misconception: MC-c1-one-distance
      - text: '$U$ פתוחה ב-$d_\infty$, ולכן בכל מטריקה על $C[0,1]$'
        feedback: >-
          פתיחות תלויה במטריקה. כאן $d_1(g_n,\mathbf 1)\to0$ ובכל זאת $g_n\notin U$.
        misconception: MC-c1-one-distance

  - id: Q-1.6-uc-bounded
    type: twotier
    objectives: [OBJ-1.6-3]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי **חסום** (הגדרה 1.5.3), ותהי $f:X\to\mathbb{R}$ רציפה במידה שווה. נכון או לא: $f$
      חסומה.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. במרחב מטרי כללי חסימות של התחום ורציפות במידה שווה אינן מספיקות.'
      - text: נכון
        feedback: >-
          זה נכון בקטע חסום בישר, אבל לא בכל מרחב מטרי חסום. חפשו מרחב חסום שבו כל פונקציה רציפה במידה שווה.
        misconception: MC-c1-uniform-bounded
    reasons:
      - text: '$X=\mathbb{N}$ עם המטריקה הבדידה ו-$f(n)=n$: $X=B(1,2)$, ו-$f$ רציפה במידה שווה לפי טענה 1.6.10 (א)'
        correct: true
        feedback: >-
          בדיוק. $d_0\le1$, ולכן $X=B(1,2)$ חסום. לפי טענה 1.6.10 (א) כל פונקציה מ-$(X,d_0)$ רציפה במידה שווה,
          ו-$f(n)=n$ אינה חסומה (ארכימדס).
      - text: 'נכון: מחברים $x_0$ קבועה לכל $x$ בשרשרת צעדים קטנים מ-$\delta$; מספר הצעדים חסום כי $X$ חסום'
        feedback: >-
          בקטע בישר יש שרשרת כזו, אבל במרחב מטרי כללי לא. ב-$(\mathbb{N},d_0)$, עם $\delta=\frac12$, אין לאף נקודה שכנה
          במרחק קטן מ-$\delta$, ושרשרת לא יכולה לצאת ממנה.
        misconception: MC-c1-uniform-bounded
      - text: 'לא נכון: $(0,1)$ חסום, ו-$\frac1x$ על $(0,1)$ אינה חסומה'
        feedback: >-
          המסקנה נכונה, אבל הדוגמה אינה מקיימת את ההנחה: $\frac1x$ אינה רציפה במידה שווה על $(0,1)$ (דוגמה נגדית (ג)
          אחרי טענה 1.6.9).
        misconception: MC-c0-example-tests-other-hypothesis

  - id: Q-1.6-closed-dist
    type: twotier
    objectives: [OBJ-1.6-2]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, ויהיו $A,E\subseteq X$ קבוצות סגורות, לא ריקות וזרות. נכון או לא:
      $\inf\{d(a,e): a\in A,\ e\in E\}>0$.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. כל נקודה של $A$ רחוקה מ-$E$, אבל לא בהכרח במרחק אחיד.'
      - text: נכון
        feedback: >-
          לכל $a\in A$ אכן $\operatorname{dist}(a,E)>0$. השאלה היא אם יש להם חסם מלרע חיובי משותף.
        misconception: MC-c0-inf-of-positive-positive
    reasons:
      - text: 'ב-$\mathbb{R}$: $A=\{n\in\mathbb{N}: n\ge2\}$, $E=\{n+\frac1n: n\in\mathbb{N},\ n\ge2\}$, ו-$\big|n-(n+\frac1n)\big|=\frac1n\to0$'
        correct: true
        feedback: >-
          בדיוק. הן זרות, כי $n+\frac1n$ אינו שלם כש-$n\ge2$. שתיהן סגורות: נקודות שונות של אותה קבוצה רחוקות זו מזו
          לפחות $\frac56$ (ב-$E$ הפער הוא $1-\frac{1}{n(n+1)}\ge\frac56$), ולכן לכל $t$ מחוץ לקבוצה הכדור $B(t,\frac13)$
          פוגש לכל היותר נקודה אחת $s$ שלה, והכדור $B\big(t,\min(\frac13,|t-s|)\big)$ זר לה.
      - text: 'נכון: לפי טענה 1.6.6 (ד), $\operatorname{dist}(a,E)>0$ לכל $a\in A$, ולכן גם האינפימום על $a\in A$ חיובי'
        feedback: >-
          החלק הראשון נכון: $E$ סגורה ו-$a\notin E$, ולכן $\operatorname{dist}(a,E)>0$. אבל אינפימום של מספרים
          חיוביים יכול להיות 0: בדוגמה הנכונה $\operatorname{dist}(n,E)\le\frac1n$.
        misconception: MC-c0-inf-of-positive-positive
      - text: 'לא נכון: $(0,1)$ ו-$(1,2)$ זרות, והמרחק ביניהן 0'
        feedback: >-
          המסקנה נכונה, אבל הדוגמה אינה מקיימת את ההנחות: $(0,1)$ ו-$(1,2)$ אינן סגורות, והסגורים שלהן נפגשים ב-1.
        misconception: MC-c0-example-tests-other-hypothesis
