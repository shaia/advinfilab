# Lesson 1.2 — normed spaces and inner products.
# Objectives (src/course.ts):
#   OBJ-1.2-1  define a norm, show every norm induces a metric, recognise a metric that comes from no norm
#   OBJ-1.2-2  compute the 1-, 2- and ∞-norms on R^n and draw their unit balls
#   OBJ-1.2-3  norms from an inner product; decide by the parallelogram law
#   OBJ-1.2-4  the sup norm and the integral norm on C[a,b]
chapter: 1
questions:
  - id: Q-1.2-def
    type: mc
    objectives: [OBJ-1.2-1]
    qualitative: true
    level: basic
    prompt: >-
      איזו מהתכונות הבאות היא אחת האקסיומות של **נורמה** על מרחב וקטורי ממשי $V$ (לכל $x,y\in V$ ולכל
      $\lambda\in\mathbb{R}$)?
    choices:
      - text: '$\|\lambda x\|=|\lambda|\,\|x\|$'
        correct: true
        feedback: >-
          נכון: הומוגניות. יחד איתה: $\|x\|=0$ רק ל-$x=0$, ואי-שוויון המשולש $\|x+y\|\le\|x\|+\|y\|$.
      - text: '$\|\lambda x\|=\lambda\|x\|$'
        feedback: >-
          עם $\lambda=-1$ זה נותן $\|-x\|=-\|x\|$, מספר שלילי לכל $x\neq0$. חסר הערך המוחלט.
        misconception: MC-c1-homogeneity-sign
      - text: '$\|x+y\|=\|x\|+\|y\|$'
        feedback: >-
          זה שוויון, והוא נכשל כבר לערך המוחלט על $\mathbb{R}$: $|1+(-1)|=0<2$. האקסיומה היא אי-שוויון.
        misconception: MC-c1-triangle-wrong-form
      - text: '$\|x\|\ge0$, ו-$\|x\|=0$ מותר גם לווקטור שונה מאפס'
        feedback: >-
          נורמה מתאפסת **רק** על וקטור האפס. "נורמה" שמתאפסת על $x\neq0$ משרה "מרחק" 0 בין $x$ לבין $0$.
        misconception: MC-c1-zero-axiom

  - id: Q-1.2-p1
    type: numeric
    objectives: [OBJ-1.2-2]
    level: basic
    prompt: >-
      חשבו את $\|x\|_1$ עבור $x=(2,-5,1,-3)\in\mathbb{R}^4$.
    answer: 11
    tolerance: 0.001
    correctFeedback: >-
      נכון: $|2|+|-5|+|1|+|-3|=11$. לשם השוואה $\|x\|_2=\sqrt{39}\approx6.245$ ו-$\|x\|_\infty=5$, ואכן
      $\|x\|_\infty\le\|x\|_2\le\|x\|_1$.
    wrongFeedback: >-
      $\|x\|_1$ הוא סכום הערכים המוחלטים של הקואורדינטות.
    commonWrong:
      - value: -5
        feedback: >-
          $2-5+1-3=-5$: חסר הערך המוחלט. בלעדיו "נורמה" יכולה לצאת שלילית, ולווקטור כמו $(1,-1)$ שונה מאפס היא
          הייתה יוצאת 0.
        misconception: MC-c1-norm-no-abs
      - value: 5
        feedback: >-
          5 הוא $\|x\|_\infty$, הקואורדינטה הגדולה בערכה המוחלט. נורמת 1 מחברת את כולן.
        misconception: MC-c1-one-distance
      - value: 39
        feedback: >-
          39 הוא $\|x\|_2^2$, סכום הריבועים. ממנו מקבלים את הנורמה האוקלידית בשורש, ונורמת 1 היא בכלל סכום
          הערכים המוחלטים.
        misconception: MC-c1-norm-squared

  - id: Q-1.2-balls
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: basic
    prompt: >-
      מהו כדור היחידה הסגור $\{x\in\mathbb{R}^2:\|x\|_1\le1\}$?
    choices:
      - text: 'מעוין שקודקודיו $(\pm1,0)$, $(0,\pm1)$'
        correct: true
        feedback: >-
          נכון. ברביע הראשון $x+y\le1$ הוא משולש מתחת לישר מ-$(1,0)$ ל-$(0,1)$, ובשאר הרביעים בסימטריה.
      - text: 'הריבוע $[-1,1]\times[-1,1]$, שצלעותיו מקבילות לצירים'
        feedback: >-
          זה כדור היחידה של $\|\cdot\|_\infty$. הנקודה $(1,1)$ בריבוע, אבל $\|(1,1)\|_1=2>1$.
        misconception: MC-c1-unit-ball-swap
      - text: 'העיגול $x^2+y^2\le1$, כמו כל כדור יחידה'
        feedback: >-
          זה כדור היחידה של הנורמה האוקלידית. לכל נורמה כדור יחידה משלה; העיגול הוא רק אחד מהם.
        misconception: MC-c1-one-distance

  - id: Q-1.2-supnorm
    type: numeric
    objectives: [OBJ-1.2-4]
    level: basic
    prompt: >-
      חשבו את $\|f\|_\infty=\max_{[0,1]}|f|$ עבור $f(x)=3x^2-1$ ב-$C[0,1]$.
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $f$ עולה על $[0,1]$ מ-$f(0)=-1$ עד $f(1)=2$, ולכן $\max|f|=\max(1,2)=2$.
    wrongFeedback: >-
      מצאו את טווח הערכים של $f$ על הקטע, ואז את הערך המוחלט הגדול ביותר.
    commonWrong:
      - value: 1
        feedback: >-
          $|f(0)|=1$, אבל זו רק נקודה אחת. ב-$x=1$ הערך $|f(1)|=2$ גדול יותר: בודקים את כל הקטע.
        misconception: MC-c1-sup-metric-shortcut

  - id: Q-1.2-induced
    type: rank
    objectives: [OBJ-1.2-1]
    level: mid
    prompt: >-
      תהי $d$ מטריקה על מרחב וקטורי ממשי $V$, אינווריאנטית להזזות: $d(x+a,y+a)=d(x,y)$ לכל $x,y,a\in V$. נגדיר
      $N(v)=d(v,0)$. סדרו את שלבי ההוכחה ש-$N$ מקיימת את אי-שוויון המשולש: $N(u+v)\le N(u)+N(v)$ לכל
      $u,v\in V$.
    help: סדרו את השלבים מהראשון לאחרון.
    items:
      - id: def
        label: 'יהיו $u,v\in V$. לפי ההגדרה של $N$, $N(u+v)=d(u+v,\ 0)$.'
      - id: tri
        label: 'לפי אי-שוויון המשולש של $d$ דרך הנקודה $v$, הביטוי האחרון קטן או שווה ל-$d(u+v,\ v)+d(v,\ 0)$.'
      - id: shift
        label: 'במחובר הראשון שקיבלנו מזיזים ב-$-v$: לפי האינווריאנטיות להזזות, $d(u+v,\ v)=d(u,\ 0)$.'
      - id: end
        label: 'מציבים ומקבלים $N(u+v)\le d(u,0)+d(v,0)$, כלומר, לפי ההגדרה של $N$, $N(u+v)\le N(u)+N(v)$.'
    order: [def, tri, shift, end]
    correctFeedback: >-
      נכון. זה שלב 4 בהוכחה של טענה 1.2.4: אי-שוויון המשולש של $d$ "דרך" $v$, ואחר כך הזזה שמחזירה את
      $d(u+v,v)$ למרחק מהראשית. ההומוגניות (ii) לא נדרשה כאן; היא נותנת את (N2).
    wrongFeedback: >-
      התחילו ממה שרוצים לחסום, $N(u+v)$, וכתבו אותו כמרחק. כל שלב אחר כך מתייחס למה שהשלב הקודם כתב: "הביטוי
      האחרון", "המחובר הראשון שקיבלנו".

  - id: Q-1.2-inclusions
    type: multi
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: basic
    prompt: >-
      כמו בשיעור, $K_1$, $K_2$, $K_\infty$ הם כדורי היחידה הסגורים של $\|\cdot\|_1$, $\|\cdot\|_2$, $\|\cdot\|_\infty$
      ב-$\mathbb{R}^2$. אילו מהטענות נכונות? סמנו את כולן.
    choices:
      - text: '$K_1\subseteq K_2$'
        correct: true
        feedback: >-
          נכון: $\|x\|_2\le\|x\|_1$, ולכן $\|x\|_1\le1$ גורר $\|x\|_2\le1$. המעוין מוכל בעיגול.
      - text: '$K_2\subseteq K_\infty$'
        correct: true
        feedback: 'נכון: $\|x\|_\infty\le\|x\|_2$. העיגול מוכל בריבוע.'
      - text: '$K_\infty\subseteq K_2$'
        feedback: >-
          הפינה $(1,1)$ של הריבוע מקיימת $\|(1,1)\|_2=\sqrt2>1$. נורמה **קטנה** יותר נותנת כדור **גדול** יותר.
        misconception: MC-c1-norm-order
      - text: '$\|x\|_1\le\|x\|_\infty$ לכל $x$'
        feedback: >-
          $\|(1,1)\|_1=2>1=\|(1,1)\|_\infty$. הכיוון הנכון: $\|x\|_\infty\le\|x\|_1$.
        misconception: MC-c1-norm-order
      - text: '$\|x\|_1\le2\|x\|_\infty$ לכל $x\in\mathbb{R}^2$'
        correct: true
        feedback: >-
          נכון: כל אחד משני המחוברים לכל היותר $\|x\|_\infty$. ב-$\mathbb{R}^n$ הקבוע הוא $n$. לכן כל $x\in K_\infty$
          מקיים $\|x\|_1\le2$: הריבוע מוכל במעוין $\{x:\ \|x\|_1\le2\}$, שקודקודיו $(\pm2,0)$, $(0,\pm2)$.

  - id: Q-1.2-discrete-norm
    type: twotier
    objectives: [OBJ-1.2-1]
    qualitative: true
    level: mid
    prompt: >-
      האם המטריקה הבדידה על $\mathbb{R}^2$ היא המטריקה המושרית של נורמה כלשהי, כלומר $d(x,y)=\|x-y\|$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. הומוגניות של נורמה סותרת את זה שכל המרחקים 0 או 1.'
      - text: כן
        feedback: >-
          ה"נורמה" המתבקשת, $\|x\|=1$ לכל $x\neq0$, אינה הומוגנית: $\|2x\|=1\neq2=2\|x\|$.
        misconception: MC-c1-every-metric-norm
    reasons:
      - text: 'אילו $\|x\|=d(x,0)$ הייתה נורמה, אז לכל $x\neq0$: $1=\|2x\|=2\|x\|=2$, סתירה'
        correct: true
        feedback: >-
          בדיוק. מטריקה מושרית מקיימת $d(\lambda x,\lambda y)=|\lambda|d(x,y)$, ומטריקה שערכיה רק 0 ו-1 לא יכולה.
      - text: 'המטריקה הבדידה אינה מטריקה כלל, כי $d(x,y)$ אינו תלוי במרחק האוקלידי בין $x$ ל-$y$'
        feedback: >-
          היא מטריקה, על כל קבוצה (טענה 1.1.3): שלוש האקסיומות מתקיימות, ואין אקסיומה שקושרת אותה למרחק אחר. השאלה
          היא רק אם היא באה מנורמה.
        misconception: MC-c1-discrete-not-metric
      - text: 'כל מטריקה על מרחב וקטורי באה מנורמה, כאן $\|x\|=d(x,0)$'
        feedback: >-
          $d(x,0)$ מוגדר לכל מטריקה, אבל הוא נורמה רק אם הוא הומוגני. כאן הוא לא.
        misconception: MC-c1-every-metric-norm

  - id: Q-1.2-parallelogram
    type: twotier
    objectives: [OBJ-1.2-3]
    qualitative: true
    level: mid
    prompt: >-
      האם $\|\cdot\|_1$ על $\mathbb{R}^2$ באה ממכפלה פנימית, כלומר $\|x\|_1=\sqrt{\langle x,x\rangle}$ למכפלה
      פנימית כלשהי?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. היא אינה מקיימת את חוק המקבילית.'
      - text: כן, מהמכפלה הסקלרית הרגילה
        feedback: >-
          המכפלה הסקלרית הרגילה נותנת את $\|\cdot\|_2$, לא את $\|\cdot\|_1$. ולמעשה אף מכפלה פנימית לא נותנת את
          $\|\cdot\|_1$.
        misconception: MC-c1-every-norm-inner
    reasons:
      - text: '$x=(1,1)$, $y=(1,-1)$: באגף שמאל של החוק $8$, ובאגף ימין $16$'
        correct: true
        feedback: >-
          בדיוק: $\|(2,0)\|_1^2+\|(0,2)\|_1^2=4+4=8$, ואילו $2\|(1,1)\|_1^2+2\|(1,-1)\|_1^2=8+8=16$. כל נורמה שבאה
          ממכפלה פנימית מקיימת את חוק המקבילית (טענה 1.2.15(א)), ולכן זוג אחד שמפר אותו מכריע.
      - text: 'כל נורמה מקיימת את חוק המקבילית, ולכן כל נורמה באה ממכפלה פנימית'
        feedback: >-
          חוק המקבילית נובע מפיתוח $\langle x\pm y,x\pm y\rangle$, ולכן הוא מתקיים רק לנורמות שבאות ממכפלה
          פנימית. ל-$\|\cdot\|_1$ הוא נכשל ($8\neq16$ בזוג $(1,1)$, $(1,-1)$).
        misconception: MC-c1-every-norm-inner
      - text: '$\|\cdot\|_1$ אינה מקיימת את אי-שוויון המשולש'
        feedback: >-
          היא מקיימת אותו, מאי-שוויון המשולש בכל קואורדינטה. היא נורמה; היא פשוט לא באה ממכפלה פנימית.
        misconception: MC-c1-axiom-misdiagnosed

  - id: Q-1.2-par-inf
    type: numeric
    objectives: [OBJ-1.2-3]
    level: basic
    prompt: >-
      עם $x=(2,1)$ ו-$y=(1,-1)$ ב-$\mathbb{R}^2$, חשבו את $\|x+y\|_\infty^2+\|x-y\|_\infty^2$. (אילו
      $\|\cdot\|_\infty$ הייתה באה ממכפלה פנימית, התוצאה הייתה $2\|x\|_\infty^2+2\|y\|_\infty^2=10$.)
    answer: 13
    tolerance: 0.001
    correctFeedback: >-
      נכון: $x+y=(3,0)$ ו-$x-y=(1,2)$, ולכן $\|x+y\|_\infty=3$, $\|x-y\|_\infty=2$, והסכום $9+4=13\neq10$. חוק
      המקבילית נכשל בזוג הזה, ולכן, לפי טענה 1.2.15(א), $\|\cdot\|_\infty$ אינה באה ממכפלה פנימית.
    wrongFeedback: >-
      חשבו קודם את $x+y$ ואת $x-y$. נורמת אינסוף של כל אחד היא הקואורדינטה הגדולה בערכה המוחלט; אחר כך מעלים
      בריבוע ומחברים.
    commonWrong:
      - value: 10
        feedback: >-
          10 הוא מה שחוק המקבילית **היה** נותן. חשבו את אגף שמאל עצמו: $3^2+2^2=13$.
        misconception: MC-c1-every-norm-inner
      - value: 18
        feedback: >-
          18 מתקבל בנורמת 1: $\|(3,0)\|_1^2+\|(1,2)\|_1^2=9+9$. כאן הנורמה היא $\|\cdot\|_\infty$: $\|(1,2)\|_\infty=2$.
        misconception: MC-c1-one-distance
      - value: 14
        feedback: >-
          14 מתקבל בנורמה האוקלידית: $9+(1+4)$. כאן הנורמה היא $\|\cdot\|_\infty$, ו-$\|(1,2)\|_\infty^2=4$.
        misconception: MC-c1-one-distance
      - value: 5
        feedback: >-
          $3+2=5$ הוא סכום הנורמות, בלי ריבועים. חוק המקבילית מדבר על **ריבועי** הנורמות: $3^2+2^2$.
        misconception: MC-c1-norm-squared

  - id: Q-1.2-l1norm
    type: numeric
    objectives: [OBJ-1.2-4]
    level: mid
    prompt: >-
      חשבו את $\|f\|_1=\int_0^1|f(x)|\,dx$ עבור $f(x)=3x^2-1$ ב-$C[0,1]$. (תשובה עשרונית בשלוש ספרות אחרי
      הנקודה מתקבלת.)
    answer: 0.769800359
    tolerance: 0.001
    correctFeedback: >-
      נכון: $\frac{4}{3\sqrt3}\approx0.770$. $f$ מחליפה סימן ב-$a=\frac{1}{\sqrt3}$, ולכן
      $\int_0^a(1-3x^2)\,dx+\int_a^1(3x^2-1)\,dx=\frac{2a}{3}+\frac{2a}{3}=\frac{4a}{3}$.
    wrongFeedback: >-
      מצאו היכן $f$ מחליפה סימן, ופצלו את האינטגרל של $|f|$ לשני קטעים.
    commonWrong:
      - value: 0
        feedback: >-
          $\int_0^1(3x^2-1)\,dx=1-1=0$: זה האינטגרל של $f$ בלי ערך מוחלט, שבו השטחים מעל ומתחת לציר מבטלים זה
          את זה. אבל $f\neq0$, ולכן הנורמה חייבת להיות חיובית.
        misconception: MC-c1-norm-no-abs
      - value: 2
        feedback: >-
          2 הוא $\|f\|_\infty$. נורמת האינטגרל היא השטח מתחת ל-$|f|$, מספר אחר.
        misconception: MC-c1-one-distance

  - id: Q-1.2-is-norm
    type: multi
    objectives: [OBJ-1.2-1, OBJ-1.2-4]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהבאות הן נורמות על $C[0,1]$? סמנו את כולן.
    choices:
      - text: '$\max_{[0,1]}|f|$'
        correct: true
        feedback: 'נכון: נורמת הסופרמום.'
      - text: '$\int_0^1|f|$'
        correct: true
        feedback: >-
          נכון: נורמת האינטגרל. אקסיומת החיוביות (N1) משתמשת ברציפות: אם $f(x_0)\neq0$, אז $|f|>\frac{|f(x_0)|}{2}$ על קטע
          סביב $x_0$, והאינטגרל חיובי.
      - text: '$|f(0)|$'
        feedback: >-
          $f(x)=x$ שונה מאפס ו-$|f(0)|=0$. הערך בנקודה אחת לא רואה את שאר הפונקציה.
        misconception: MC-c1-zero-axiom
      - text: '$\left|\int_0^1 f\right|$'
        feedback: >-
          $f(x)=2x-1$ שונה מאפס, ו-$\int_0^1(2x-1)\,dx=0$. הערך המוחלט צריך להיות **בתוך** האינטגרל.
        misconception: MC-c1-norm-no-abs
      - text: '$\max_{[0,1]}|f|+|f(0)|$'
        correct: true
        feedback: >-
          נכון. סכום של נורמה ושל פונקציה אי-שלילית, הומוגנית, שמקיימת משולש הוא שוב נורמה: (N2) ו-(N3) מתחברות,
          ו-(N1) נובעת מהמחובר הראשון.

  - id: Q-1.2-polar
    type: numeric
    objectives: [OBJ-1.2-3]
    level: mid
    prompt: >-
      במרחב מכפלה פנימית ידוע ש-$\|x\|=3$, $\|y\|=4$ ו-$\|x+y\|=6$. חשבו את $\|x-y\|$. (תשובה עשרונית בשלוש
      ספרות אחרי הנקודה מתקבלת.)
    answer: 3.74165739
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\sqrt{14}\approx3.742$. מחוק המקבילית $\|x-y\|^2=2\cdot9+2\cdot16-36=14$. (מכאן גם
      $\langle x,y\rangle=\frac{\|x+y\|^2-\|x-y\|^2}{4}=\frac{36-14}{4}=5.5$.)
    wrongFeedback: >-
      הנורמה באה ממכפלה פנימית, ולכן חוק המקבילית מתקיים: $\|x+y\|^2+\|x-y\|^2=2\|x\|^2+2\|y\|^2$.
    commonWrong:
      - value: 14
        feedback: >-
          14 הוא $\|x-y\|^2$. חוק המקבילית מדבר על ריבועי הנורמות: נשאר להוציא שורש.
        misconception: MC-c1-norm-squared
      - value: 1
        feedback: >-
          $\left|\|x\|-\|y\|\right|=1$ הוא רק **חסם מלרע** ל-$\|x-y\|$ (אי-שוויון המשולש ההפוך), לא הערך עצמו.
          כשהנורמה באה ממכפלה פנימית, חוק המקבילית קובע את $\|x-y\|$ במדויק.
        misconception: MC-c1-triangle-wrong-form

  - id: Q-1.2-xn
    type: twotier
    objectives: [OBJ-1.2-4]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: יש קבוע $C>0$ כך ש-$\|f\|_\infty\le C\|f\|_1$ לכל $f\in C[0,1]$. (בשיעור הופרך זה בעזרת
      $x^n$; כאן נמקו בעזרת פונקציה אחרת.)
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. הכיוון ההפוך כן נכון, $\|f\|_1\le\|f\|_\infty$, אבל הכיוון הזה נכשל.
      - text: נכון
        feedback: >-
          עם ה"אוהל" $h_n(x)=\max\big(0,\ 1-n|x-\tfrac12|\big)$, $n\ge2$: $\|h_n\|_\infty=1$ ו-$\|h_n\|_1=\frac1n$,
          כך שהדרישה היא $1\le\frac{C}{n}$ לכל $n\ge2$, וזה סותר את ארכימדס.
        misconception: MC-c1-norms-comparable
    reasons:
      - text: 'האוהל $h_n(x)=\max\big(0,1-n|x-\frac12|\big)$: $\|h_n\|_\infty=1$, $\|h_n\|_1=\frac1n$'
        correct: true
        feedback: >-
          בדיוק. ל-$n\ge2$ האוהל רציף ונשען על $[\frac12-\frac1n,\frac12+\frac1n]\subseteq[0,1]$; גובהו 1 ושטחו
          $\frac12\cdot\frac2n\cdot1=\frac1n$. היחס $\frac{\|h_n\|_\infty}{\|h_n\|_1}=n$ אינו חסום: פונקציה גבוהה על קטע
          קצר, ושטחה קטן.
      - text: '$\|f\|_1=\int_0^1|f|\le\max|f|=\|f\|_\infty$, ומזה נובע גם הכיוון ההפוך, עם אותו קבוע $C=1$'
        feedback: >-
          זה מוכיח רק $\|f\|_1\le\|f\|_\infty$. אי-שוויון בכיוון אחד אינו נותן את הכיוון ההפוך, וכאן הוא באמת נכשל.
        misconception: MC-c1-norm-order
      - text: 'כל שתי נורמות על אותו מרחב וקטורי חוסמות זו את זו, עם קבועים מתאימים'
        feedback: >-
          זה נכון בממד סופי (שיעור 3.5), לא במרחב כמו $C[0,1]$: האוהלים $h_n$ מראים שאין קבוע.
        misconception: MC-c1-norms-comparable

  - id: Q-1.2-bounded-metric
    type: twotier
    objectives: [OBJ-1.2-1]
    qualitative: true
    level: mid
    prompt: >-
      האם $d(x,y)=\frac{|x-y|}{1+|x-y|}$ על $\mathbb{R}$ היא המטריקה המושרית של נורמה כלשהי על $\mathbb{R}$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. היא מטריקה, אבל חסומה, ומטריקה של נורמה אינה חסומה.'
      - text: כן
        feedback: >-
          אילו $d(x,y)=\|x-y\|$, אז $d(t,0)=|t|\,\|1\|\to\infty$ כש-$t\to\infty$. אבל $d(t,0)<1$ לכל $t$.
        misconception: MC-c1-every-metric-norm
    reasons:
      - text: 'מטריקה מושרית אינה חסומה (מסקנה 1.2.5(א)), וכאן $d<1$ תמיד'
        correct: true
        feedback: >-
          בדיוק. מטריקה מושרית מקיימת $d(tx,0)=|t|\,d(x,0)$, ולכן אינה חסומה: כל מטריקה חסומה על מרחב וקטורי שאינו
          $\{0\}$ אינה באה מנורמה. זה נכון גם למטריקה הבדידה.
      - text: 'היא אינה אינווריאנטית להזזות, ולכן לפי טענה 1.2.3 אינה באה מנורמה'
        feedback: >-
          היא כן: $d(x+a,y+a)=d(x,y)$, כי היא תלויה רק ב-$x-y$. אינווריאנטיות להזזות היא תנאי הכרחי שמתקיים כאן;
          מה שחסר הוא הומוגניות.
        misconception: MC-c1-axiom-misdiagnosed
      - text: 'היא אינה מקיימת את אי-שוויון המשולש, כי $\frac{t}{1+t}$ אינה לינארית'
        feedback: >-
          היא כן מקיימת אותו, כי $\frac{t}{1+t}$ עולה ותת-חיבורית (שיעור 1.1). השאלה היא לא אם זו מטריקה, אלא אם
          היא באה מנורמה.
        misconception: MC-c1-axiom-misdiagnosed

  - id: Q-1.2-l1-not-inner
    type: twotier
    objectives: [OBJ-1.2-3, OBJ-1.2-4]
    qualitative: true
    level: exam
    prompt: >-
      הוכיחו או הפריכו: יש מכפלה פנימית $\langle\cdot,\cdot\rangle$ על $C[0,1]$ כך ש-$\int_0^1|f|=\sqrt{\langle f,f\rangle}$
      לכל $f\in C[0,1]$.
    choices:
      - text: לא נכון, אין מכפלה כזו
        correct: true
        feedback: >-
          נכון. נורמת האינטגרל אינה מקיימת את חוק המקבילית, ולפי טענה 1.2.15(א) נורמה שבאה ממכפלה פנימית חייבת
          לקיים אותו לכל זוג.
      - text: נכון
        feedback: >-
          המכפלה $\int_0^1fg$ של טענה 1.2.22 נותנת את $\big(\int_0^1f^2\big)^{1/2}=\|f\|_2$, לא את $\int_0^1|f|$. ואין
          אף מכפלה שנותנת את $\|\cdot\|_1$: עם $f(x)=x$, $g(x)=1-x$ חוק המקבילית נכשל ($\frac54\ne1$).
        misconception: MC-c1-every-norm-inner
    reasons:
      - text: 'עם $f(x)=x$, $g(x)=1-x$: אגף שמאל של חוק המקבילית $\frac54$, ואגף ימין $1$'
        correct: true
        feedback: >-
          בדיוק. $f+g\equiv1$, ולכן $\|f+g\|_1=1$; $f-g=2x-1$, ו-$\|2x-1\|_1=\frac12$ (שני משולשים); ו-$\|f\|_1=\|g\|_1=\frac12$.
          אגף שמאל $1+\frac14=\frac54$, אגף ימין $2\cdot\frac14+2\cdot\frac14=1$. זוג אחד מספיק (טענה 1.2.15(א)).
      - text: 'עם $f\equiv1$ ו-$g(x)=x$, הזוג של מסקנה 1.2.16(ב), חוק המקבילית נכשל גם בנורמת האינטגרל'
        feedback: >-
          חשבו: $\|1+x\|_1=\frac32$, $\|1-x\|_1=\frac12$, $\|1\|_1=1$, $\|x\|_1=\frac12$. אגף שמאל $\frac94+\frac14=\frac52$
          ואגף ימין $2+\frac12=\frac52$: בנורמת האינטגרל הזוג הזה **מקיים** את החוק. זוג שמפר את החוק בנורמה אחת אינו
          בהכרח מפר אותו בנורמה אחרת; צריך זוג אחר.
        misconception: MC-c1-one-distance
      - text: '$\int_0^1|f|$ אינה נורמה על $C[0,1]$, כי פונקציה שאינה אפס יכולה להיות בעלת אינטגרל $0$'
        feedback: >-
          זה נכון ל-$\int_0^1f$ בלי ערך מוחלט ($2x-1$), לא ל-$\int_0^1|f|$: לפי טענה 1.2.20 היא נורמה, ו-(N1) שלה היא
          למה 1.2.19. הבעיה אינה באקסיומות הנורמה אלא בחוק המקבילית.
        misconception: MC-c1-axiom-misdiagnosed
      - text: 'נכון: $\int_0^1fg$ היא מכפלה פנימית על $C[0,1]$, ולכן כל נורמה על $C[0,1]$ באה ממנה'
        feedback: >-
          המכפלה $\int_0^1fg$ (טענה 1.2.22) משרה נורמה אחת בלבד, $\|f\|_2=\big(\int_0^1f^2\big)^{1/2}$. נורמות אחרות על
          אותו מרחב, כמו $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$, אינן חייבות לבוא ממכפלה פנימית כלשהי.
        misconception: MC-c1-every-norm-inner
    explanation: >-
      לפי משפט 1.2.17 השאלה שקולה לשאלה אם $\|\cdot\|_1$ מקיימת את חוק המקבילית לכל זוג. כדי להפריך מספיק זוג אחד,
      אבל צריך לחשב אותו בנורמה הנתונה: הזוג $1$, $x$, שהפריך את נורמת הסופרמום, מקיים את החוק בנורמת האינטגרל,
      והזוג $x$, $1-x$ מפר אותו.

  - id: Q-1.2-holder-equality
    type: twotier
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: exam
    prompt: >-
      יהי $1<p<\infty$ ו-$q$ הצמוד שלו, ויהיו $x,y\in\mathbb{R}^n$, שניהם שונים מ-$0$, שעבורם יש שוויון באי-שוויון
      הלדר: $\sum_i|x_iy_i|=\|x\|_p\|y\|_q$. הוכיחו או הפריכו: לכל $i$,
      $\frac{|x_i|^p}{\|x\|_p^p}=\frac{|y_i|^q}{\|y\|_q^q}$.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. השוויון בסכום מאלץ שוויון באי-שוויון יאנג בכל קואורדינטה, ולפי למה 1.2.8 זה בדיוק התנאי.
      - text: לא נכון
        feedback: >-
          בהוכחה של משפט 1.2.9 כל מחובר מקיים $a_ib_i\le\frac{a_i^p}{p}+\frac{b_i^q}{q}$, וסכום אגפי ימין הוא $1$.
          אם $\sum_ia_ib_i=1$, סכום ההפרשים האי-שליליים הוא $0$, ולכן כל הפרש $0$.
        misconception: MC-c1-holder-equality-dependent
    reasons:
      - text: 'עם $a_i$, $b_i$ מההוכחה של משפט 1.2.9: יאנג הוא שוויון בכל $i$, ולכן $a_i^p=b_i^q$'
        correct: true
        feedback: >-
          בדיוק. $a_i=\frac{|x_i|}{\|x\|_p}$, $b_i=\frac{|y_i|}{\|y\|_q}$, $\sum_ia_i^p=\sum_ib_i^q=1$. השוויון הנתון
          הוא $\sum_ia_ib_i=1=\sum_i\big(\frac{a_i^p}{p}+\frac{b_i^q}{q}\big)$. ההפרשים
          $\frac{a_i^p}{p}+\frac{b_i^q}{q}-a_ib_i$ אי-שליליים (למה 1.2.8) וסכומם $0$, ולכן כולם $0$; לפי תנאי השוויון
          של למה 1.2.8, $a_i^p=b_i^q$ לכל $i$, וזו הטענה.
      - text: 'שוויון בהלדר, כמו בקושי-שוורץ, קורה רק כש-$x,y$ תלויים לינארית, ואז שני היחסים שווים'
        feedback: >-
          ל-$p\ne2$ זה לא נכון בשני הכיוונים. עם $p=3$, $x=(1,2)$, $y=(1,4)$: $\sum|x_iy_i|=9$ ו-$\|x\|_3\|y\|_{3/2}=9^{1/3}\cdot9^{2/3}=9$,
          שוויון, אף ש-$x,y$ בלתי תלויים. ועם $x=y=(1,2)$: $\sum|x_iy_i|=5$, ואילו $\|x\|_3\|x\|_{3/2}\approx5.09$, אין שוויון.
        misconception: MC-c1-holder-equality-dependent
      - text: 'לא נכון: עם $p=3$, $x=(1,2)$, $y=(1,4)$ יש שוויון, אבל $x$ ו-$y$ אינם פרופורציוניים'
        feedback: >-
          הטענה אינה ש-$x$ ו-$y$ פרופורציוניים, אלא ש-$|x_i|^p$ פרופורציוני ל-$|y_i|^q$. בדוגמה הזו
          $\frac{|x_i|^3}{9}=(\frac19,\frac89)$ ו-$\frac{|y_i|^{3/2}}{9}=(\frac19,\frac89)$: שווים, כפי שהטענה אומרת.
        misconception: MC-c1-holder-equality-dependent
      - text: 'לא נכון: שוויון בסכום אינו גורר שוויון בכל מחובר, למשל $3+1=2+2$'
        feedback: >-
          נכון ששוויון בסכום לבדו לא מספיק, אבל כאן כל מחובר מקיים אי-שוויון **באותו כיוון**:
          $a_ib_i\le\frac{a_i^p}{p}+\frac{b_i^q}{q}$. אם אחד מהם חזק, גם הסכום חזק. ב-$3+1=2+2$ אין אי-שוויון כזה בין
          המחוברים ($3>2$ ו-$1<2$).
        misconception: MC-c1-holder-equality-dependent
    explanation: >-
      זה המקרה של שוויון באי-שוויון הלדר: יש שוויון אם ורק אם $|y_i|^q$ פרופורציוני ל-$|x_i|^p$ (ההפך נובע מאותו
      חישוב, כמו בחלק (ב) של W-1.2-07). ל-$p=2$ התנאי הוא $|y_i|$ פרופורציוני ל-$|x_i|$, תנאי השוויון של קושי-שוורץ
      לערכים המוחלטים.
