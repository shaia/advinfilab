# Lesson 1.3 — balls, open sets and closed sets.
# Objectives (src/course.ts):
#   OBJ-1.3-1  define open and closed balls and sets; prove an open ball is open
#   OBJ-1.3-2  arbitrary unions and finite intersections of open sets are open; an infinite intersection need not be
#   OBJ-1.3-3  decide open / closed / both / neither, in the discrete metric and in a subspace too
chapter: 1
questions:
  - id: Q-1.3-open-def
    type: mc
    objectives: [OBJ-1.3-1]
    qualitative: true
    level: basic
    prompt: >-
      במרחב מטרי $(X,d)$, מתי תת-קבוצה $U\subseteq X$ נקראת **פתוחה**?
    choices:
      - text: 'לכל $x\in U$ קיים $r>0$ כך ש-$B(x,r)\subseteq U$'
        correct: true
        feedback: >-
          נכון. כל נקודה של $U$ "מוקפת" ב-$U$; הרדיוס רשאי להיות תלוי בנקודה.
      - text: 'קיימים $x\in U$ ו-$r>0$ כך ש-$B(x,r)\subseteq U$'
        feedback: >-
          זה אומר רק ש-$U$ מכילה כדור אחד. $[0,2]$ מכילה את $B(1,\frac12)$, ובכל זאת אינה פתוחה: סביב $0$ אין כדור
          בתוכה.
        misconception: MC-c1-quantifier-order
      - text: 'קיים $r>0$ כך שלכל $x\in U$: $B(x,r)\subseteq U$'
        feedback: >-
          זה דורש רדיוס אחד לכל הנקודות. $(0,1)$ פתוחה, אבל ליד $0$ הרדיוס חייב להיות קטן מ-$x$, ואין רדיוס אחד
          שמתאים לכולן.
        misconception: MC-c1-quantifier-order
      - text: 'לכל $x\in U$ ולכל $r>0$: $B(x,r)\subseteq U$'
        feedback: >-
          זה מתקיים רק ל-$U=\emptyset$ או $U=X$. ההגדרה מבקשת **קיים**
          רדיוס, לא כל רדיוס.
        misconception: MC-c1-quantifier-order

  - id: Q-1.3-radius
    type: numeric
    objectives: [OBJ-1.3-1]
    level: basic
    prompt: >-
      ב-$(\mathbb{R}^2,d_1)$, עם $d_1(x,y)=|x_1-y_1|+|x_2-y_2|$, הנקודה $y=(1,-1)$ נמצאת בכדור $B((0,0),3)$. ההוכחה
      שכדור פתוח הוא קבוצה פתוחה בוחרת סביב $y$ כדור ברדיוס $s=r-d(a,y)$. מהו $s$ כאן?
    answer: 1
    tolerance: 0.001
    correctFeedback: >-
      נכון: $d_1((0,0),(1,-1))=2$, ולכן $s=3-2=1$. כל נקודה $z$ עם $d_1(y,z)<1$ מקיימת
      $d_1(0,z)\le2+d_1(y,z)<3$.
    wrongFeedback: >-
      חשבו את $d_1$ בין המרכז ל-$y$, והחסירו אותו מהרדיוס.
    commonWrong:
      - value: 2
        feedback: >-
          2 הוא המרחק מהמרכז ל-$y$. הרדיוס של הכדור הקטן הוא מה **שנשאר** עד השפה: $3-2=1$. כדור ברדיוס 2 סביב
          $y$ יוצא מ-$B(0,3)$, למשל הנקודה $(2.9,-1)$.
        misconception: MC-c1-radius-distance
      - value: 1.58578644
        feedback: >-
          $3-\sqrt2$ משתמש במרחק האוקלידי. במרחב $(\mathbb{R}^2,d_1)$ המרחק בין $0$ ל-$y$ הוא $|1|+|-1|=2$.
        misconception: MC-c1-one-distance

  - id: Q-1.3-both
    type: multi
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: basic
    prompt: >-
      אילו מהקבוצות הבאות **גם פתוחות וגם סגורות** ב-$\mathbb{R}$ עם המטריקה הרגילה? סמנו את כולן.
    choices:
      - text: '$\emptyset$'
        correct: true
        feedback: >-
          נכון. היא פתוחה באופן ריק (אין נקודה לבדוק), והמשלים שלה, $\mathbb{R}$, פתוח.
      - text: '$\mathbb{R}$'
        correct: true
        feedback: 'נכון: כל כדור מוכל בה, והמשלים $\emptyset$ פתוח.'
      - text: '$[0,1]$'
        feedback: >-
          היא סגורה (המשלים $(-\infty,0)\cup(1,\infty)$ פתוח), אבל לא פתוחה: כל כדור סביב $0$ מכיל מספרים שליליים.
        misconception: MC-c1-open-not-closed
      - text: '$\mathbb{Q}$'
        feedback: >-
          היא לא פתוחה וגם לא סגורה: כל קטע סביב רציונלי מכיל אי-רציונליים, וכל קטע סביב אי-רציונלי מכיל
          רציונליים. "לא פתוחה" אינו "סגורה".
        misconception: MC-c1-open-not-closed

  - id: Q-1.3-ball-proof
    type: rank
    objectives: [OBJ-1.3-1]
    level: basic
    prompt: >-
      סדרו את שלבי ההוכחה שהכדור $B(a,r)$ הוא קבוצה פתוחה בכל מרחב מטרי.
    help: סדרו את השלבים מהראשון לאחרון.
    items:
      - id: take
        label: 'תהי $y\in B(a,r)$, כלומר $d(a,y)<r$.'
      - id: s
        label: 'נגדיר $s=r-d(a,y)$; אז $s>0$.'
      - id: z
        label: 'תהי $z\in B(y,s)$, כלומר $d(y,z)<s$.'
      - id: tri
        label: 'לפי אי-שוויון המשולש: $d(a,z)\le d(a,y)+d(y,z)<d(a,y)+s=r$.'
      - id: done
        label: 'לכן $z\in B(a,r)$, כלומר $B(y,s)\subseteq B(a,r)$, ו-$y$ הייתה כלשהי.'
    order: [take, s, z, tri, done]
    correctFeedback: >-
      נכון. הרעיון: הרדיוס של הכדור הקטן הוא המרחק שנשאר עד השפה, ואי-שוויון המשולש מראה שהכדור הקטן לא חוצה
      אותה.
    wrongFeedback: >-
      התחילו מנקודה כלשהי של הכדור; הגדירו רדיוס שתלוי בה; הראו שכל נקודה בכדור הקטן נמצאת בגדול.

  - id: Q-1.3-classify
    type: multi
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהקבוצות הבאות **סגורות** ב-$\mathbb{R}$ עם המטריקה הרגילה? סמנו את כולן.
    choices:
      - text: '$\mathbb{Z}$'
        correct: true
        feedback: >-
          נכון: המשלים הוא איחוד הקטעים הפתוחים $(n,n+1)$, ואיחוד של פתוחות פתוח.
      - text: '$\{\frac1n:n\in\mathbb{N}\}$'
        feedback: >-
          לא סגורה: $0$ במשלים, וכל קטע $(-r,r)$ סביבו מכיל $\frac1n$ עם $n>\frac1r$. לכן המשלים אינו פתוח.
        misconception: MC-c1-separated-points-closed
      - text: '$\{\frac1n:n\in\mathbb{N}\}\cup\{0\}$'
        correct: true
        feedback: >-
          נכון. הוספת $0$ סוגרת את הקבוצה. לכל נקודה $z$ אחרת במשלים יש קטע פתוח סביבה בלי נקודות של הקבוצה: אם
          $z<0$ או $z>1$ זה מיידי, ואם $0<z<1$ אז $z$ נמצאת בין שתי נקודות עוקבות, $\frac1{n+1}<z<\frac1n$, והקטע
          $\left(\frac1{n+1},\frac1n\right)$ זר לקבוצה.
      - text: '$[0,\infty)$'
        correct: true
        feedback: 'נכון: המשלים $(-\infty,0)$ פתוח.'
      - text: '$\mathbb{R}\setminus\mathbb{Q}$'
        feedback: >-
          המשלים שלה הוא $\mathbb{Q}$, שאינה פתוחה. הקבוצה לא פתוחה, אבל זה לא הופך אותה לסגורה.
        misconception: MC-c1-open-not-closed

  - id: Q-1.3-discrete
    type: twotier
    objectives: [OBJ-1.3-3, OBJ-1.3-1]
    qualitative: true
    level: basic
    prompt: >-
      $X$ קבוצה עם המטריקה הבדידה. נכון או לא: כל תת-קבוצה $A\subseteq X$ פתוחה.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. ומכאן גם שכל תת-קבוצה סגורה, כי המשלים שלה פתוח.
      - text: לא נכון
        feedback: >-
          ב-$\mathbb{R}$ הרגיל $\{0\}$ אינה פתוחה, אבל במטריקה הבדידה הכדור הקטן סביב $0$ הוא $\{0\}$ עצמה.
          פתיחות תלויה במטריקה.
        misconception: MC-c1-one-distance
    reasons:
      - text: 'לכל $x\in A$: $B(x,\frac12)=\{x\}\subseteq A$'
        correct: true
        feedback: >-
          בדיוק. כל נקודה מבודדת לגמרי: בתוך מרחק $\frac12$ אין אף נקודה אחרת.
      - text: 'כל כדור ברדיוס חיובי הוא כל $X$, ו-$X$ פתוחה'
        feedback: >-
          $B(x,r)=X$ רק כש-$r>1$. לכל $r\le1$ הכדור הוא $\{x\}$, וזה מה שמאפשר לכל קבוצה להיות פתוחה.
        misconception: MC-c1-discrete-balls
      - text: 'כל יחידון $\{x\}$ סגור (טענה 1.3.5(ב)), ו-$A$ היא איחוד של יחידונים'
        feedback: >-
          יחידון **סגור** אינו עוזר להראות ש-$A$ **פתוחה**: איחוד של סגורות אינו בהכרח פתוח (ב-$\mathbb{R}$ כל
          יחידון סגור, ו-$[0,1]$ איחוד של יחידונים ואינה פתוחה). מה שעובד במטריקה הבדידה הוא שהיחידון גם **פתוח**,
          כי $\{x\}=B(x,\frac12)$.
        misconception: MC-c1-open-not-closed

  - id: Q-1.3-intersection
    type: twotier
    objectives: [OBJ-1.3-2]
    qualitative: true
    level: basic
    prompt: >-
      האם $\bigcap_{n=1}^{\infty}\left(-\frac1n,\frac1n\right)$ היא קבוצה פתוחה ב-$\mathbb{R}$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. החיתוך הוא $\{0\}$, וקבוצה של נקודה אחת אינה פתוחה ב-$\mathbb{R}$.'
      - text: כן, חיתוך של קבוצות פתוחות פתוח
        feedback: >-
          זה נכון רק לחיתוך **סופי**. כאן החיתוך הוא $\{0\}$, ואין קטע סביב $0$ שמוכל בו.
        misconception: MC-c1-infinite-intersection
    reasons:
      - text: 'החיתוך הוא $\{0\}$, ואין קטע סביב $0$ שמוכל בו'
        correct: true
        feedback: >-
          בדיוק. ל-$x\neq0$ יש $n$ עם $\frac1n<|x|$, ולכן החיתוך הוא $\{0\}$. הרדיוסים $\frac1n$ שואפים ל-0, ובחיתוך
          לא נשאר "מקום" סביב $0$.
      - text: 'החיתוך ריק, כי כל נקודה יוצאת מהקטעים כש-$n$ גדל, והקבוצה הריקה פתוחה'
        feedback: >-
          $0$ נמצא בכל אחד מהקטעים, ולכן גם בחיתוך. החיתוך הוא $\{0\}$, לא $\emptyset$.
        misconception: MC-c1-infinite-intersection
      - text: 'כל אחד מהקטעים פתוח ומכיל את $0$, ולכן גם החיתוך שלהם פתוח'
        feedback: >-
          הוכחת החיתוך הסופי לוקחת את הרדיוס $\min(r_1,\dots,r_n)$. לאינסוף קבוצות אין מינימום חיובי מובטח, וכאן
          האינפימום של הרדיוסים הוא 0.
        misconception: MC-c1-infinite-intersection

  - id: Q-1.3-finite
    type: mc
    objectives: [OBJ-1.3-2]
    level: basic
    prompt: >-
      בהוכחה ש-$U_1\cap\dots\cap U_n$ פתוחה כאשר כל $U_i$ פתוחה, איפה בדיוק משתמשים בכך שיש **מספר סופי** של
      קבוצות?
    choices:
      - text: 'כדי ש-$r=\min(r_1,\dots,r_n)$ יהיה חיובי'
        correct: true
        feedback: >-
          נכון. לנקודה $x$ בחיתוך יש $r_i>0$ עם $B(x,r_i)\subseteq U_i$, והמינימום של מספר סופי של חיוביים הוא אחד
          מהם, ולכן חיובי. אז $B(x,r)\subseteq B(x,r_i)\subseteq U_i$ לכל $i$. לאינסוף רדיוסים האינפימום יכול להיות
          0, ובדיוק שם ההוכחה נשברת.
      - text: 'כדי לדעת שהחיתוך אינו ריק, כי בחיתוך של אינסוף קבוצות לא ריקות לא תמיד נשארת נקודה שאפשר לבחור'
        feedback: >-
          חיתוך ריק הוא פתוח בכל מקרה, ולא צריך לדעת שהוא לא ריק. הסופיות נדרשת כדי שהמינימום של הרדיוסים יהיה חיובי.
        misconception: MC-c1-infinite-intersection
      - text: 'לא משתמשים בזה; אותה הוכחה עובדת לכל משפחה, כי כל נקודה של החיתוך נמצאת בכל אחת מהקבוצות'
        feedback: >-
          $\bigcap_n(-\frac1n,\frac1n)=\{0\}$ אינה פתוחה, ולכן ההוכחה **חייבת** להשתמש בסופיות: ברדיוס
          $\min(r_1,\dots,r_n)>0$.
        misconception: MC-c1-infinite-intersection

  - id: Q-1.3-closed-union
    type: twotier
    objectives: [OBJ-1.3-2]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: איחוד של אינסוף קבוצות סגורות ב-$\mathbb{R}$ הוא קבוצה סגורה.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. איחוד **סופי** של סגורות סגור (מסקנה 1.3.8(ג)); אינסופי לא בהכרח.'
      - text: נכון
        feedback: >-
          כל יחידון $\{\frac1n\}$ סגור, אבל האיחוד שלהם, $\{\frac1n:n\in\mathbb{N}\}$, אינו סגור.
        misconception: MC-c1-infinite-intersection
    reasons:
      - text: 'כל $\{\frac1n\}$ סגור, ו-$\bigcup_n\{\frac1n\}$ אינו סגור: כל קטע סביב $0$ פוגש אותו'
        correct: true
        feedback: >-
          בדיוק: היחידונים סגורים לפי טענה 1.3.5(ב), ו-$0$ מחוץ לאיחוד אבל לכל $t>0$ יש $n>\frac1t$ (ארכימדס), כלומר
          $\frac1n\in B(0,t)$. זו התמונה במראה של החיתוך האינסופי של פתוחות: לפי דה-מורגן המשלים הוא חיתוך של
          אינסוף פתוחות, והוא אינו פתוח.
      - text: 'לפי דה-מורגן המשלים של האיחוד הוא החיתוך של המשלימים, שכל אחד מהם פתוח, וחיתוך של קבוצות פתוחות פתוח'
        feedback: >-
          דה-מורגן נכון לכל משפחה, אבל חיתוך **אינסופי** של פתוחות אינו בהכרח פתוח. לכן גם האיחוד האינסופי של
          סגורות אינו בהכרח סגור.
        misconception: MC-c1-infinite-intersection
      - text: 'כל אחת מהקבוצות מכילה את כל נקודות הקצה שלה, ולכן גם האיחוד שלהן מכיל את כל הנקודות שהוא "צריך"'
        feedback: >-
          כל יחידון מכיל את הנקודה היחידה שלו, אבל $0$ אינה באף אחד מהם, וכל קטע סביב $0$ פוגש את האיחוד. נקודה
          שהאיחוד "צריך" יכולה להופיע רק כשמתקרבים אליה דרך אינסוף קבוצות.
        misconception: MC-c1-infinite-intersection

  - id: Q-1.3-subspace
    type: multi
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: mid
    prompt: >-
      בכל טענה, "פתוחה ב-$Y$" פירושו פתוחה בתת-המרחב $Y\subseteq\mathbb{R}$ עם המטריקה $|x-y|$. אילו מהטענות
      נכונות? סמנו את כולן.
    choices:
      - text: '$\{2\}$ פתוחה ב-$Y=[0,1]\cup\{2\}$'
        correct: true
        feedback: >-
          נכון. $B_Y(2,\frac12)=(\frac32,\frac52)\cap Y=\{2\}$, כי כל נקודה של $[0,1]$ רחוקה מ-$2$ לפחות $1$. בתוך $Y$
          הנקודה $2$ "מבודדת", ולכן היחידון פתוח בו, אף שב-$\mathbb{R}$ יחידון אינו פתוח.
      - text: '$[0,1)$ פתוחה ב-$\mathbb{R}$'
        feedback: >-
          ב-$\mathbb{R}$ כל קטע סביב $0$ מכיל מספרים שליליים. פתיחות בתת-מרחב אינה גוררת פתיחות במרחב הגדול.
        misconception: MC-c1-subspace-ignored
      - text: '$(0,1]$ פתוחה ב-$[0,2]$'
        feedback: >-
          ב-$[0,2]$ הכדור סביב $1$ הוא $(1-r,1+r)\cap[0,2]$, והוא מכיל נקודות גדולות מ-1 לכל $r>0$. רק הקצוות
          של $Y$ עצמו, $0$ ו-$2$, מקבלים כדורים חד-צדדיים.
        misconception: MC-c1-subspace-ball
      - text: '$(0,1]$ פתוחה ב-$[0,1]$'
        correct: true
        feedback: >-
          נכון: $(0,1]=(0,2)\cap[0,1]$. כאן $1$ הוא קצה של $Y=[0,1]$, והכדור סביבו ב-$Y$ הוא $(1-r,1]$.
      - text: '$[\frac12,1)$ סגורה ב-$(0,1)$'
        correct: true
        feedback: >-
          נכון: $[\frac12,1)=[\frac12,1]\cap(0,1)$, חיתוך של $Y$ עם קבוצה סגורה ב-$\mathbb{R}$ (הכדור הסגור
          $B[\frac34,\frac14]$), ולכן סגורה ב-$Y$ לפי מסקנה 1.3.12. הנקודה $1$, שהפריעה לסגירות ב-$\mathbb{R}$, אינה ב-$Y$.
      - text: '$(0,1)$ סגורה ב-$[0,1]$'
        feedback: >-
          המשלים שלה ב-$Y=[0,1]$ הוא $\{0,1\}$, והוא אינו פתוח ב-$Y$: לכל $r>0$ הכדור $B_Y(0,r)$ מכיל את
          $\frac12\min(r,1)\in(0,1)$. "ב-$Y$ אין נקודות מחוץ לקטע" לא הופך כל קבוצה לסגורה; הקצוות $0$ ו-$1$ שייכים ל-$Y$.
        misconception: MC-c1-subspace-ignored
    explanation: >-
      בתת-מרחב $Y$ הכדורים הם $B_{\mathbb{R}}(y,r)\cap Y$, ולכן הקבוצות הפתוחות ב-$Y$ הן $O\cap Y$ עם $O$
      פתוחה ב-$\mathbb{R}$ (משפט 1.3.11), והסגורות הן $G\cap Y$ עם $G$ סגורה ב-$\mathbb{R}$ (מסקנה 1.3.12).
      פתיחות היא תכונה של זוג: קבוצה ומרחב.

  - id: Q-1.3-func-space
    type: twotier
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: mid
    prompt: >-
      ב-$C[0,1]$ עם מטריקת הסופרמום $d_\infty$, תהי $U$ קבוצת הפונקציות $f\in C[0,1]$ שמקיימות $f(x)>x$ לכל
      $x\in[0,1]$, כלומר שהגרף שלהן כולו מעל הקו $y=x$. האם $U$ פתוחה?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. לכל $f\in U$ יש רדיוס אחד שמתאים לכל הנקודות $x$ בבת אחת: המינימום של $f(x)-x$.
      - text: לא
        feedback: >-
          כדור במטריקת הסופרמום הוא רצועה סביב הגרף: אם $d_\infty(f,g)<m$ אז $g(x)>f(x)-m$ **בכל** $x$. עם
          $m=\min_{[0,1]}(f(x)-x)>0$ נקבל $g(x)>x$ לכל $x$.
        misconception: MC-c1-sup-ball-band
    reasons:
      - text: '$f(x)-x$ רציפה וחיובית על $[0,1]$, ולכן יש לה מינימום $m>0$, ו-$B_\infty(f,m)\subseteq U$'
        correct: true
        feedback: >-
          בדיוק: אם $d_\infty(f,g)<m$ אז $g(x)>f(x)-m\ge x$ לכל $x$. משפט ויירשטראס (אינפי 1) הוא מה שנותן $m>0$; על
          $(0,1]$, למשל, האינפימום של פונקציה רציפה וחיובית יכול להיות 0. זה המבנה של טענה 1.3.14(א), עם $f(x)-x$
          במקום $f$.
      - text: 'לכל $x$ הקבוצה $\{f: f(x)>x\}$ פתוחה ב-$d_\infty$, ו-$U$ היא החיתוך של כל הקבוצות האלה, ולכן פתוחה'
        feedback: >-
          כל אחת מהקבוצות פתוחה, אבל זה חיתוך **אינסופי** (על כל $x\in[0,1]$), וחיתוך אינסופי של פתוחות אינו
          בהכרח פתוח. צריך רדיוס אחד לכל $x$, וזה ה-$m$.
        misconception: MC-c1-infinite-intersection
      - text: 'כל כדור סביב $f$ מכיל פונקציה $g$ שנוגעת בקו $y=x$ בנקודה כלשהי, כי הרצועה סביב הגרף של $f$ צרה רק במקומות מסוימים'
        feedback: >-
          לא אם הרדיוס קטן מ-$m=\min(f(x)-x)$: הרצועה היא באותו רוחב לכל אורך הגרף, וכל $g$ בכדור כזה נמצאת
          מעל הקו בכל נקודה. אולי חשבתם על מטריקת האינטגרל $d_1$, שבה "עוקץ" צר כלפי מטה כן זול.
        misconception: MC-c1-sup-ball-band

  - id: Q-1.3-outside-ball
    type: twotier
    objectives: [OBJ-1.3-1]
    qualitative: true
    level: mid
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $a\in X$ ו-$r>0$. נכון או לא: הקבוצה $\{y\in X:\ d(a,y)>r\}$ פתוחה ב-$X$.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. היא המשלים של הכדור הסגור $B[a,r]$, ולכן הטענה שקולה לכך ש-$B[a,r]$ סגור (טענה 1.3.5(א)).
      - text: לא נכון
        feedback: >-
          ב-$\mathbb{R}$ היא $(-\infty,a-r)\cup(a+r,\infty)$, איחוד של שתי פתוחות. ובכל מרחב: סביב נקודה $y$ שבה
          $d(a,y)>r$ יש "מרווח" של $d(a,y)-r$, ואי-שוויון המשולש שומר עליו.
        misconception: MC-c1-open-not-closed
    reasons:
      - text: 'עם $t=d(a,y)-r$: לכל $w\in B(y,t)$, $d(a,w)\ge d(a,y)-d(y,w)>r$'
        correct: true
        feedback: >-
          בדיוק. אי-שוויון המשולש "בכיוון ההפוך": $d(a,y)\le d(a,w)+d(w,y)$, ולכן $d(a,w)\ge d(a,y)-d(y,w)>d(a,y)-t=r$.
          זה הרדיוס של ההוכחה של טענה 1.3.5(א).
      - text: 'היא המשלים של הכדור הסגור $B[a,r]$, וכדור סגור אינו פתוח, ולכן המשלים שלו פתוח'
        feedback: >-
          "אינו פתוח" אינו "סגור": המשלים של $A$ פתוח בדיוק כש-$A$ **סגורה**, ולא כש-$A$ אינה פתוחה. וחוץ מזה,
          כדור סגור יכול להיות גם פתוח (במטריקה הבדידה $B[a,1]=X$).
        misconception: MC-c1-open-not-closed
      - text: 'סביב $y$ מתאים הרדיוס $t=d(a,y)$, כי הכדור $B(y,d(a,y))$ אינו מכיל את המרכז $a$ של הכדור הסגור'
        feedback: >-
          לא להכיל את $a$ לא מספיק. ב-$\mathbb{R}$ עם $a=0$, $r=1$, $y=2$: $B(2,2)=(0,4)$ מכיל את $\frac12$, שבה
          $d(0,\frac12)=\frac12<1$. הרדיוס צריך להיות המרווח $d(a,y)-r$, לא המרחק למרכז.
        misconception: MC-c1-radius-distance

  - id: Q-1.3-closed-in-open-subspace
    type: twotier
    objectives: [OBJ-1.3-3]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $Y\subseteq X$ תת-מרחב **פתוח** ב-$X$, ו-$F\subseteq Y$ קבוצה **סגורה ב-$Y$**. הוכיחו
      או הפריכו: $F$ סגורה ב-$X$.
    choices:
      - text: הטענה שגויה
        correct: true
        feedback: >-
          נכון. טענה 1.3.13 מעבירה **פתיחות** מ-$Y$ ל-$X$ כש-$Y$ פתוחה, ו**סגירות** כש-$Y$ סגורה. כאן ההנחה על $Y$
          מתאימה לפתיחות, והשאלה על סגירות.
      - text: הטענה נכונה
        feedback: >-
          ההנחה ש-$Y$ פתוחה מתאימה לטענה 1.3.13(א), שעוסקת בקבוצות **פתוחות**. לסגירות צריך ש-$Y$ תהיה סגורה (טענה
          1.3.13(ב)), ויש דוגמה נגדית בלי זה.
        misconception: MC-c1-subspace-ignored
    reasons:
      - text: 'ב-$\mathbb{R}$, $Y=(0,1)\cup(2,3)$ ו-$F=(0,1)=[0,1]\cap Y$: סגורה ב-$Y$, אבל לא ב-$\mathbb{R}$'
        correct: true
        feedback: >-
          בדיוק. $Y$ פתוחה (איחוד של שני קטעים פתוחים), ו-$F=[0,1]\cap Y$ סגורה ב-$Y$ לפי מסקנה 1.3.12. ב-$\mathbb{R}$
          היא אינה סגורה: $0\notin F$, ולכל $r>0$ הנקודה $\frac12\min(r,1)$ נמצאת ב-$B(0,r)\cap F$. הנקודה $0$, שמפריעה,
          אינה ב-$Y$, ולכן בתוך $Y$ היא לא הפריעה.
      - text: '$Y\setminus F$ פתוחה ב-$Y$, ולכן לפי טענה 1.3.13(א) גם פתוחה ב-$X$; זה המשלים של $F$, ולכן $F$ סגורה ב-$X$'
        feedback: >-
          הצעד הראשון נכון, אבל $Y\setminus F$ אינה המשלים של $F$ **ב-$X$**: $X\setminus F=(X\setminus Y)\cup(Y\setminus F)$,
          ו-$X\setminus Y$ אינה בהכרח פתוחה. בדוגמה $Y=(0,1)\cup(2,3)$, $F=(0,1)$: $Y\setminus F=(2,3)$ פתוחה, אבל
          $\mathbb{R}\setminus F=(-\infty,0]\cup[1,\infty)$ אינה פתוחה.
        misconception: MC-c1-subspace-ignored
      - text: 'לפי טענה 1.3.13(ב) סגירות ב-$Y$ וסגירות ב-$X$ מתלכדות, ולכן $F$, שסגורה ב-$Y$, סגורה גם ב-$X$'
        feedback: >-
          טענה 1.3.13(ב) דורשת ש-$Y$ תהיה **סגורה** ב-$X$. כאן $Y$ פתוחה, ולמשל $Y=(0,1)\cup(2,3)$ אינה סגורה
          ב-$\mathbb{R}$, ולכן הטענה לא חלה.
        misconception: MC-c1-subspace-ignored

  - id: Q-1.3-integral-set
    type: multi
    objectives: [OBJ-1.3-3, OBJ-1.3-1]
    qualitative: true
    level: exam
    prompt: >-
      ב-$C[0,1]$ תהי $A=\{f\in C[0,1]:\ \int_0^1f(x)\,dx>0\}$, ונשווה בין המטריקות $d_1(f,g)=\int_0^1|f-g|$
      ו-$d_\infty(f,g)=\max_{[0,1]}|f-g|$. אילו מהטענות נכונות? סמנו את כולן.
    choices:
      - text: '$A$ פתוחה ב-$(C[0,1],d_1)$'
        correct: true
        feedback: >-
          נכון. $\left|\int_0^1g-\int_0^1f\right|\le\int_0^1|g-f|=d_1(f,g)$ (מונוטוניות האינטגרל, אינפי 1). לכן לכל
          $f\in A$, עם $m=\int_0^1f>0$: אם $d_1(f,g)<m$ אז $\int_0^1g\ge\int_0^1f-d_1(f,g)>0$, כלומר
          $B_{d_1}(f,m)\subseteq A$.
      - text: '$A$ פתוחה ב-$(C[0,1],d_\infty)$'
        correct: true
        feedback: >-
          נכון. $d_1\le d_\infty$ על $C[0,1]$ (טענה 1.2.21), ולכן $B_\infty(f,m)\subseteq B_{d_1}(f,m)\subseteq A$
          עם אותו $m$.
      - text: '$A$ אינה פתוחה ב-$d_1$: כמו בטענה 1.3.14(ב), עוקץ צר שיורד מתחת לאפס עולה מעט מאוד ב-$d_1$'
        feedback: >-
          העוקץ שובר תנאי על **ערכים בנקודות** ($f(x)>0$ לכל $x$). כאן התנאי הוא על האינטגרל, והעוקץ משנה את
          האינטגרל בדיוק בשטח שלו, שהוא קטן. האינטגרל נשאר חיובי, ו-$A$ פתוחה ב-$d_1$.
        misconception: MC-c1-d1-never-open
      - text: '$A$ סגורה ב-$(C[0,1],d_\infty)$'
        feedback: >-
          $\mathbf 0\notin A$, ולכל $r>0$ הפונקציה הקבועה $\frac r2$ נמצאת ב-$A$ ובמרחק $d_\infty=\frac r2<r$ מ-$\mathbf 0$.
          לכן אין כדור סביב $\mathbf 0$ שזר ל-$A$, והמשלים אינו פתוח. "פתוחה" אינה שוללת "סגורה", אבל גם אינה גוררת אותה.
        misconception: MC-c1-open-not-closed
      - text: 'הקבוצה $\{f\in C[0,1]:\ \int_0^1f\ge0\}$ סגורה ב-$(C[0,1],d_1)$'
        correct: true
        feedback: >-
          נכון. המשלים שלה, $\{g:\int_0^1g<0\}$, פתוח ב-$d_1$ באותו נימוק: עם $m=-\int_0^1g>0$, אם $d_1(g,h)<m$ אז
          $\int_0^1h\le\int_0^1g+d_1(g,h)<0$.
    explanation: >-
      הכלי הוא אי-השוויון $\left|\int_0^1g-\int_0^1f\right|\le d_1(f,g)$: תנאי שמנוסח דרך האינטגרל יציב ב-$d_1$.
      השוו לטענה 1.3.14: קבוצת הפונקציות החיוביות **בכל נקודה** פתוחה ב-$d_\infty$ ולא ב-$d_1$, כי $d_1$ אינה
      שולטת בערך בנקודה. וכיוון ש-$d_1\le d_\infty$, כל קבוצה שפתוחה ב-$d_1$ פתוחה גם ב-$d_\infty$, ולא להפך.
