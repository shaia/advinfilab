# Lesson 1.8 — bounded linear maps and the operator norm.
# Objectives (src/course.ts):
#   OBJ-1.8-1  a linear map between normed spaces is continuous iff bounded iff continuous at 0
#   OBJ-1.8-2  the operator norm; matrices in the 1- and ∞-norms, an estimate in the Euclidean norm
#   OBJ-1.8-3  an unbounded linear map in infinite dimension: differentiation in the sup norm
#   OBJ-1.8-4  convergence in operator norm; entrywise for matrices; pointwise does not imply it (C[0,1])
chapter: 1
questions:
  - id: Q-1.8-bounded-def
    type: mc
    objectives: [OBJ-1.8-1]
    qualitative: true
    level: basic
    prompt: >-
      $T:V\to W$ לינארית בין מרחבים נורמיים. מה פירוש "$T$ **חסומה**"?
    choices:
      - text: 'קיים $M\ge0$ כך ש-$\|Tx\|\le M\|x\|$ לכל $x\in V$'
        correct: true
        feedback: >-
          נכון. בשקילות: $T$ חסומה על כדור היחידה, $\sup_{\|x\|\le1}\|Tx\|<\infty$, והסופרמום הזה הוא $\|T\|_{\mathrm{op}}$.
      - text: 'קיים $M$ כך ש-$\|Tx\|\le M$ לכל $x\in V$'
        feedback: >-
          רק העתקת האפס מקיימת זאת: אם $Tx\neq0$ אז $\|T(tx)\|=|t|\,\|Tx\|\to\infty$. "חסומה" נמדדת ביחס ל-$\|x\|$.
        misconception: MC-c1-bounded-image
      - text: 'לכל $x\in V$ קיים $M$ כך ש-$\|Tx\|\le M\|x\|$'
        feedback: >-
          זה נכון לכל העתקה (קחו $M=\frac{\|Tx\|}{\|x\|}$). ה-$M$ צריך להיות אחד לכל $x$, ולכן הוא בא לפני "לכל $x$".
        misconception: MC-c1-quantifier-order

  - id: Q-1.8-norm-inf
    type: numeric
    objectives: [OBJ-1.8-2]
    level: basic
    prompt: >-
      $A=\begin{pmatrix}1&-2\\-5&3\end{pmatrix}$ כהעתקה $(\mathbb{R}^2,\|\cdot\|_\infty)\to(\mathbb{R}^2,\|\cdot\|_\infty)$.
      חשבו את $\|A\|_{\mathrm{op}}$.
    answer: 8
    tolerance: 0.001
    correctFeedback: >-
      נכון: לפי משפט 1.8.9, הסכום המקסימלי של ערכים מוחלטים בשורה, $\max(1+2,\ 5+3)=8$. הוא מתקבל בווקטור הסימנים
      של השורה השנייה, $x=(-1,1)$: $Ax=(-3,8)$.
    wrongFeedback: >-
      כל רכיב של $Ax$ הוא שורה כפול $x$, ולכן $|(Ax)_i|\le\sum_j|a_{ij}|\cdot\|x\|_\infty$. מצאו את השורה הגרועה,
      ואל תשכחו ערכים מוחלטים.
    commonWrong:
      - value: 6
        feedback: >-
          6 הוא הסכום המקסימלי של **עמודה**, $\max(1+5,\ 2+3)$: זו נורמת האופרטור בנורמה 1 (משפט 1.8.8). בנורמת אינסוף
          סוכמים שורות.
        misconception: MC-c1-opnorm-rowcol-swap
      - value: 5
        feedback: >-
          5 הוא הערך המוחלט של הכניסה הגדולה. $x=(-1,1)$ עם $\|x\|_\infty=1$ נותן $\|Ax\|_\infty=8$, ולכן הנורמה לפחות 8.
        misconception: MC-c1-opnorm-entrywise
      - value: 11
        feedback: >-
          11 הוא סכום הערכים המוחלטים של כל הכניסות. כל רכיב של $Ax$ משתמש בשורה אחת בלבד, ולכן הנורמה היא סכום
          השורה הגדול, 8.
        misconception: MC-c1-opnorm-entrywise

  - id: Q-1.8-norm-1
    type: numeric
    objectives: [OBJ-1.8-2]
    level: basic
    prompt: >-
      $A=\begin{pmatrix}2&-1&0\\1&3&-2\end{pmatrix}$ כהעתקה $(\mathbb{R}^3,\|\cdot\|_1)\to(\mathbb{R}^2,\|\cdot\|_1)$.
      חשבו את $\|A\|_{\mathrm{op}}$.
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון: סכומי העמודות בערך מוחלט הם $3$, $4$, $2$, והגדול הוא $4$. הוא מתקבל ב-$x=e_2$: $\|Ae_2\|_1=|-1|+|3|=4$.
    wrongFeedback: >-
      $Ax=\sum_j x_j\,a_j$ (צירוף של העמודות), ולכן $\|Ax\|_1\le\sum_j|x_j|\,\|a_j\|_1$. מצאו את העמודה הגדולה.
    commonWrong:
      - value: 6
        feedback: >-
          6 הוא סכום **השורה** השנייה, $1+3+2$: זו הנורמה בנורמת אינסוף. בנורמת 1 סוכמים עמודות.
        misconception: MC-c1-opnorm-rowcol-swap
      - value: 3
        feedback: >-
          ייתכן שסכמתם עמודות בלי ערך מוחלט ($2+1=3$, $-1+3=2$, $0-2=-2$). העמודה השנייה נותנת $|-1|+|3|=4$.
        misconception: MC-c1-norm-no-abs

  - id: Q-1.8-cont-zero
    type: rank
    objectives: [OBJ-1.8-1]
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה: אם $T:V\to W$ לינארית ורציפה ב-$0$, אז $T$ חסומה.
    help: >-
      סדרו את השלבים מהראשון לאחרון. כל שלב משתמש רק בעצמים שהוגדרו בשלבים שלפניו.
    items:
      - id: apply
        label: 'הלינאריות נותנת $\|Ty\|=\frac{\delta}{2\|x\|}\,\|Tx\|$, והמספר הזה קטן מ-1.'
      - id: bound
        label: 'אי-השוויון $\|Tx\|\le\frac2\delta\|x\|$ מתקיים לכל $x\ne0$, וגם ל-$x=0$; זו חסימות עם $M=\frac2\delta$.'
      - id: eps
        label: 'הרציפות ב-0 עם $\varepsilon=1$ (ו-$T0=0$) נותנת $\delta>0$ כך ש-$\|y\|<\delta$ גורר $\|Ty\|<1$.'
      - id: scale
        label: 'ל-$x\neq0$ הווקטור $y=\frac{\delta}{2\|x\|}\,x$ מקיים $\|y\|=\frac\delta2<\delta$.'
    order: [eps, scale, apply, bound]
    correctFeedback: >-
      נכון. הרעיון: רציפות נותנת חסם על כדור קטן אחד, ולינאריות "מנפחת" אותו לכל המרחב, בתמורה לגורם $\frac2\delta$.
    wrongFeedback: >-
      התחילו מהגדרת הרציפות ב-0 עם $\varepsilon$ קבוע; כווצו $x$ לתוך הכדור; הפעילו את $T$; החזירו את הגורם.

  - id: Q-1.8-lin-cont
    type: twotier
    objectives: [OBJ-1.8-1]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: העתקה **לינארית** בין מרחבים נורמיים שרציפה ב-$0$ רציפה בכל נקודה.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. לפונקציה כללית זה שקרי, אבל לינאריות מעבירה את ההתנהגות ב-0 לכל נקודה.'
      - text: לא נכון
        feedback: >-
          לפונקציה כללית רציפות בנקודה אחת לא אומרת דבר על אחרות, אבל כאן $\|Tx-Ty\|=\|T(x-y)\|$: מה שקורה ליד 0
          קורה ליד כל נקודה.
        misconception: MC-c1-linear-structure-ignored
    reasons:
      - text: 'אם $x_n\to x$ אז $x_n-x\to0$, ולכן $Tx_n-Tx=T(x_n-x)\to T0=0$'
        correct: true
        feedback: >-
          בדיוק. ואפילו יותר: $T$ חסומה, ולכן ליפשיצית, $\|Tx-Ty\|\le\|T\|_{\mathrm{op}}\|x-y\|$.
      - text: 'כל העתקה לינארית רציפה, ולכן גם זו'
        feedback: >-
          זה שקרי במימד אינסופי (הגזירה על פולינומים). כאן הרציפות נובעת מההנחה שהיא רציפה ב-0, לא מלינאריות לבד.
        misconception: MC-c1-linear-always-continuous
      - text: 'רציפות בנקודה אחת גוררת תמיד רציפות בכל נקודה'
        feedback: >-
          לפונקציה כללית לא: $f(x)=x$ ל-$x\in\mathbb{Q}$ ו-$0$ אחרת רציפה רק ב-0. לינאריות היא מה שעושה את ההבדל.
        misconception: MC-c1-linear-structure-ignored

  - id: Q-1.8-norm-2
    type: numeric
    objectives: [OBJ-1.8-2]
    level: mid
    prompt: >-
      $A=\begin{pmatrix}1&2\\-1&1\end{pmatrix}$ כהעתקה $(\mathbb{R}^2,\|\cdot\|_2)\to(\mathbb{R}^2,\|\cdot\|_2)$.
      חשבו את $\|A\|_{\mathrm{op}}$. (תשובה עשרונית בשלוש ספרות אחרי הנקודה מתקבלת.)
    answer: 2.30277564
    tolerance: 0.0005
    correctFeedback: >-
      נכון. לפי משפט 1.8.10, $A^TA=\begin{pmatrix}2&1\\1&5\end{pmatrix}$, עם עקבה 7 ודטרמיננטה 9, ולכן הערכים העצמיים
      $\frac{7\pm\sqrt{13}}{2}$, והשורש של הגדול הוא $\frac{1+\sqrt{13}}{2}\approx2.303$ (כי
      $\left(\frac{1+\sqrt{13}}{2}\right)^2=\frac{14+2\sqrt{13}}{4}$).
    wrongFeedback: >-
      לפי משפט 1.8.10 צריך את הערכים העצמיים של $A^TA$, לא של $A$ (ל-$A$ כאן אין ערכים עצמיים ממשיים). חשבו את
      $A^TA$, את הפולינום האופייני שלה, ואת השורש של הערך העצמי הגדול.
    commonWrong:
      - value: 5.30277564
        feedback: >-
          זה $\lambda_{\max}(A^TA)$ עצמו. לפי משפט 1.8.10 הנורמה היא **השורש** שלו: $\|Ax\|_2^2=\langle A^TAx,x\rangle$
          מודד את ריבוע האורך.
        misconception: MC-c1-norm-squared
      - value: 2.64575131
        feedback: >-
          $\sqrt7=\sqrt{1+4+1+1}$ הוא שורש סכום ריבועי הכניסות, נורמת פרובניוס. לפי טענה 1.8.10ב זה רק חסם מלעיל
          לנורמה, לא הנורמה.
        misconception: MC-c1-opnorm-entrywise
      - value: 3
        feedback: >-
          3 הוא נורמת האופרטור כשהמישור נמדד בנורמה 1 (סכום עמודה) או בנורמת אינסוף (סכום שורה). בנורמה האוקלידית
          התשובה אחרת.
        misconception: MC-c1-one-distance

  - id: Q-1.8-frobenius
    type: twotier
    objectives: [OBJ-1.8-2, OBJ-1.8-1]
    qualitative: true
    level: basic
    prompt: >-
      נכון או לא: לכל מטריצה $A$ מגודל $m\times n$, כהעתקה בין המרחבים האוקלידיים,
      $\|A\|_{\mathrm{op}}\le\sqrt{\sum_{i,j}a_{ij}^2}$. (בפרט כל העתקה כזו חסומה, ולכן רציפה.)
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. זה קושי-שוורץ, שורה אחר שורה.'
      - text: לא נכון
        feedback: >-
          לכל שורה $r_i$: $|(Ax)_i|=|\langle r_i,x\rangle|\le\|r_i\|_2\|x\|_2$, ומסכמים ריבועים. ל-$\begin{pmatrix}1&2\\3&4\end{pmatrix}$:
          $\|A\|_{\mathrm{op}}\approx5.465\le\sqrt{30}\approx5.477$.
        misconception: MC-c1-opnorm-entrywise
    reasons:
      - text: 'קושי-שוורץ לכל שורה $r_i$: $(Ax)_i^2\le\|r_i\|_2^2\|x\|_2^2$, ומסכמים על $i$'
        correct: true
        feedback: >-
          בדיוק: $\|Ax\|_2^2=\sum_i\langle r_i,x\rangle^2\le\left(\sum_{i,j}a_{ij}^2\right)\|x\|_2^2$ (טענה 1.8.10ב). זה
          חסם מפורש שלא משתמש בשום משפט על שקילות נורמות.
      - text: 'נורמת האופרטור **שווה** ל-$\sqrt{\sum a_{ij}^2}$'
        feedback: >-
          לא תמיד: ל-$\begin{pmatrix}1&1\\0&1\end{pmatrix}$ הנורמה $\frac{1+\sqrt5}2\approx1.618$ והביטוי $\sqrt3$.
          ולמטריצת היחידה $n\times n$: נורמה 1, ביטוי $\sqrt n$.
        misconception: MC-c1-opnorm-entrywise
      - text: 'נורמת האופרטור קטנה מהכניסה הגדולה ביותר'
        feedback: >-
          ל-$\begin{pmatrix}1&1\\1&1\end{pmatrix}$ הכניסה הגדולה 1, ו-$\|A(1,1)\|_2=\|(2,2)\|_2=2\sqrt2=2\|(1,1)\|_2$, כלומר
          הנורמה לפחות 2.
        misconception: MC-c1-opnorm-entrywise

  - id: Q-1.8-integral
    type: numeric
    objectives: [OBJ-1.8-2]
    level: mid
    prompt: >-
      $T:(C[0,1],\|\cdot\|_\infty)\to\mathbb{R}$, $Tf=\int_0^1x\,f(x)\,dx$. חשבו את $\|T\|_{\mathrm{op}}$.
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. חסם מלעיל: $|Tf|\le\int_0^1x|f(x)|\,dx\le\|f\|_\infty\int_0^1x\,dx=\frac12\|f\|_\infty$. חסם מלרע: $f\equiv1$
      נותנת $T1=\frac12$ עם $\|1\|_\infty=1$. לכן $\|T\|=\frac12$, והוא מתקבל.
    wrongFeedback: >-
      חסמו $|Tf|$ בעזרת $\|f\|_\infty$, ומצאו $f$ עם $\|f\|_\infty=1$ שבה החסם מתקבל.
    commonWrong:
      - value: 1
        feedback: >-
          1 בא מהחסם הגס $x\le1$: $|Tf|\le\int_0^1|f|\le\|f\|_\infty$. זה חסם מלעיל נכון, אבל לא הדוק: הוא מוותר על
          הגורם $x$, ואף $f$ עם $\|f\|_\infty\le1$ אינה מגיעה אליו. החסם $\int_0^1x\,|f(x)|\,dx\le\|f\|_\infty\int_0^1x\,dx$
          חד יותר, ו-$f\equiv1$ משיגה אותו. (1 היה הנורמה אילו התחום היה עם נורמת **האינטגרל**.)
        misconception: MC-c1-opnorm-upper-only

  - id: Q-1.8-deriv
    type: twotier
    objectives: [OBJ-1.8-3]
    qualitative: true
    level: basic
    prompt: >-
      $P$ הוא מרחב הפולינומים על $[0,1]$ עם נורמת הסופרמום, ו-$D:P\to P$, $Dp=p'$. האם $D$ חסומה?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. לכן $D$ לינארית ואינה רציפה.'
      - text: כן
        feedback: >-
          $\|x^n\|_\infty=1$ ו-$\|Dx^n\|_\infty=\|nx^{n-1}\|_\infty=n$. אין $M$ עם $n\le M\cdot1$ לכל $n$.
        misconception: MC-c1-linear-always-continuous
    reasons:
      - text: '$\|x^n\|_\infty=1$ אבל $\|nx^{n-1}\|_\infty=n$, ולכן $\frac{\|Dp\|}{\|p\|}$ אינו חסום'
        correct: true
        feedback: >-
          בדיוק. פולינום יכול להיות קטן ותלול מאוד. ($\frac{x^n}{\sqrt n}\to0$ במידה שווה, והנגזרות שלו אינן שואפות
          ל-0: זו אי-רציפות ב-0.)
      - text: 'כל העתקה לינארית רציפה'
        feedback: >-
          זה נכון במרחב האוקלידי, לא בכל מרחב נורמי. $D$ היא הדוגמה הנגדית.
        misconception: MC-c1-linear-always-continuous
      - text: 'הנגזרת של פולינום היא פולינום, ולכן $D$ מעבירה את $P$ ל-$P$ בצורה חסומה'
        feedback: >-
          זה מראה רק ש-$D$ מוגדרת כהעתקה $P\to P$. חסימות היא אי-שוויון $\|Dp\|\le M\|p\|$, ו-$x^n$ מפריכה אותו.
        misconception: MC-c1-bounded-image

  - id: Q-1.8-props
    type: multi
    objectives: [OBJ-1.8-2]
    level: basic
    prompt: >-
      $S,T$ העתקות לינאריות חסומות (כך ש-$ST$ מוגדרת). אילו מהטענות נכונות תמיד? סמנו את כולן.
    choices:
      - text: '$\|Tx\|\le\|T\|_{\mathrm{op}}\|x\|$ לכל $x$'
        correct: true
        feedback: 'נכון: ל-$x\neq0$, $\frac{x}{\|x\|}$ בכדור היחידה, ולכן $\|T\frac{x}{\|x\|}\|\le\|T\|$.'
      - text: '$\|ST\|_{\mathrm{op}}\le\|S\|_{\mathrm{op}}\|T\|_{\mathrm{op}}$'
        correct: true
        feedback: 'נכון: $\|STx\|\le\|S\|\,\|Tx\|\le\|S\|\,\|T\|\,\|x\|$.'
      - text: '$\|ST\|_{\mathrm{op}}=\|S\|_{\mathrm{op}}\|T\|_{\mathrm{op}}$'
        feedback: >-
          עם $S=\begin{pmatrix}1&0\\0&0\end{pmatrix}$, $T=\begin{pmatrix}0&0\\0&1\end{pmatrix}$: $ST=0$ ואילו
          $\|S\|\,\|T\|=1$. זה אי-שוויון, לא שוויון.
        misconception: MC-c1-triangle-wrong-form
      - text: 'אם $T=A$ מטריצה ריבועית ממשית, אז $\|A\|_2=\max|\mu|$ על הערכים העצמיים הממשיים $\mu$ של $A$'
        feedback: >-
          רק למטריצה **סימטרית** (מסקנה 1.8.10א). ל-$N=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ הערך העצמי היחיד $0$,
          ו-$\|Ne_2\|_2=\|e_1\|_2=1$, ולכן $\|N\|_2\ge1$.
        misconception: MC-c1-opnorm-2-eigen
      - text: '$\|S+T\|_{\mathrm{op}}\le\|S\|_{\mathrm{op}}+\|T\|_{\mathrm{op}}$'
        correct: true
        feedback: 'נכון: $\|(S+T)x\|\le\|Sx\|+\|Tx\|$. נורמת האופרטור היא נורמה על מרחב ההעתקות החסומות.'

  - id: Q-1.8-sign
    type: numeric
    objectives: [OBJ-1.8-2]
    level: mid
    prompt: >-
      $T:(C[0,1],\|\cdot\|_\infty)\to\mathbb{R}$, $Tf=\int_0^1(2x-1)f(x)\,dx$. חשבו את $\|T\|_{\mathrm{op}}$.
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון: $\frac12$. חסם מלעיל: $|Tf|\le\|f\|_\infty\int_0^1|2x-1|\,dx=\frac12\|f\|_\infty$. חסם מלרע: $f_n$ רציפה
      שווה ל-$-1$ עד $\frac12-\frac1{2n}$, ל-$1$ מ-$\frac12+\frac1{2n}$, ולינארית ביניהן; $Tf_n\to\frac12$. הנורמה אינה
      מתקבלת: זה ידרוש $f=\operatorname{sign}(2x-1)$.
    wrongFeedback: >-
      חסם מלעיל מ-$|2x-1|$; חסם מלרע מפונקציות רציפות שמקרבות את הסימן של $2x-1$.
    commonWrong:
      - value: 0
        feedback: >-
          $f\equiv1$ נותנת $T1=0$, אבל זה וקטור אחד, וכל וקטור נותן רק חסם מלרע. פונקציה שמתיישרת עם הסימן של $2x-1$
          נותנת ערכים קרובים ל-$\frac12$.
        misconception: MC-c1-opnorm-test-one
      - value: 1
        feedback: >-
          $1=\max_{[0,1]}|2x-1|$ היה הנורמה אילו התחום היה עם נורמת **האינטגרל**. עם נורמת הסופרמום החסם הוא
          $\int_0^1|2x-1|\,dx=\frac12$.
        misconception: MC-c1-one-distance

  - id: Q-1.8-eval-L1
    type: twotier
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    qualitative: true
    level: mid
    prompt: >-
      האם הפונקציונל $\varphi(f)=f(0)$ רציף על $(C[0,1],\|\cdot\|_1)$, עם $\|f\|_1=\int_0^1|f|$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. הוא לינארי ואינו חסום, ולכן אינו רציף. (על $(C[0,1],\|\cdot\|_\infty)$ הוא חסום עם נורמה 1.)
      - text: כן, כי $|f(0)|\le\|f\|_\infty$
        feedback: >-
          זה חסם בנורמת **הסופרמום**. בנורמת האינטגרל: $f_n(x)=\max(0,1-nx)$ מקיימת $\|f_n\|_1=\frac1{2n}$ ו-$\varphi(f_n)=1$.
        misconception: MC-c1-one-distance
    reasons:
      - text: '$f_n=\max(0,1-nx)$: $\|f_n\|_1=\frac1{2n}$ ו-$|\varphi(f_n)|=1$, ולכן $\frac{|\varphi(f_n)|}{\|f_n\|_1}=2n$ אינו חסום'
        correct: true
        feedback: >-
          בדיוק. ובלשון סדרות: $f_n\to0$ בנורמת האינטגרל, ו-$\varphi(f_n)=1\not\to0=\varphi(0)$.
      - text: 'כל פונקציונל לינארי רציף'
        feedback: >-
          לא במימד אינסופי. כאן "קוץ" צר ב-0 עולה מעט בנורמת האינטגרל ומזיז את $f(0)$ הרבה.
        misconception: MC-c1-linear-always-continuous
      - text: 'הוא לא רציף, כי התמונה שלו, $\mathbb{R}$, אינה חסומה'
        feedback: >-
          גם $f\mapsto\int_0^1f$ מקבל כל ערך ממשי, והוא חסום (נורמה 1). חסימות היא $|\varphi(f)|\le M\|f\|$, לא תמונה חסומה.
        misconception: MC-c1-bounded-image

  - id: Q-1.8-C1-norm
    type: twotier
    objectives: [OBJ-1.8-3]
    qualitative: true
    level: mid
    prompt: >-
      על הפולינומים $P$ ב-$[0,1]$ נשנה את הנורמה **בתחום** ל-$\|p\|_{C^1}=\|p\|_\infty+\|p'\|_\infty$, ונשאיר
      $\|\cdot\|_\infty$ בטווח. האם $D:(P,\|\cdot\|_{C^1})\to(P,\|\cdot\|_\infty)$, $Dp=p'$, חסומה?
    choices:
      - text: כן, עם $\|D\|_{\mathrm{op}}\le1$
        correct: true
        feedback: >-
          נכון: $\|Dp\|_\infty=\|p'\|_\infty\le\|p\|_{C^1}$. (למעשה $\|D\|=1$: עם $x^n$ היחס $\frac{n}{1+n}\to1$.)
      - text: לא, כמו בנורמת הסופרמום
        feedback: >-
          חסימות תלויה בנורמות. הנורמה החדשה "משלמת" על התלילות: $\|x^n\|_{C^1}=1+n$, והיחס $\frac{n}{1+n}<1$.
        misconception: MC-c1-one-distance
    reasons:
      - text: '$\|p''\|_\infty\le\|p\|_\infty+\|p''\|_\infty=\|p\|_{C^1}$ לכל $p$'
        correct: true
        feedback: >-
          בדיוק. אותה העתקה, שתי נורמות בתחום, שתי תשובות. זו הסיבה שבמרחבי פונקציות בוחרים את הנורמה לפי מה שרוצים
          שיהיה רציף.
      - text: '$\|x^n\|_\infty=1$ ו-$\|nx^{n-1}\|_\infty=n$, ולכן לא חסומה'
        feedback: >-
          זה החישוב עם נורמת הסופרמום בתחום. בנורמה $\|\cdot\|_{C^1}$, $\|x^n\|_{C^1}=1+n$, והיחס $\frac{n}{n+1}\le1$.
        misconception: MC-c1-one-distance
      - text: 'כל העתקה לינארית חסומה'
        feedback: >-
          לא: עם נורמת הסופרמום בתחום אותה $D$ אינה חסומה. כאן היא חסומה בגלל הנורמה שבחרנו, לא בגלל לינאריות.
        misconception: MC-c1-linear-always-continuous

  - id: Q-1.8-inf-to-1
    type: numeric
    objectives: [OBJ-1.8-2]
    level: exam
    prompt: >-
      $A=\begin{pmatrix}1&2\\3&-1\end{pmatrix}$, הפעם בין **שתי נורמות שונות**: כהעתקה
      $(\mathbb{R}^2,\|\cdot\|_\infty)\to(\mathbb{R}^2,\|\cdot\|_1)$. חשבו את $\|A\|_{\mathrm{op}}$, והיו מוכנים להוכיח
      גם חסם מלעיל וגם חסם מלרע.
    answer: 5
    tolerance: 0.001
    correctFeedback: >-
      נכון: 5. **חסם מלעיל:** לכל ממשי $u$, $|u|=\max(u,-u)$, ולכן
      $\|Ax\|_1=|x_1+2x_2|+|3x_1-x_2|$ הוא המקסימום, על $s_1,s_2\in\{\pm1\}$, של
      $(s_1+3s_2)x_1+(2s_1-s_2)x_2$. לכל $x$, כל ביטוי כזה קטן או שווה ל-$\big(|s_1+3s_2|+|2s_1-s_2|\big)\|x\|_\infty$, כי $|x_1|,|x_2|\le\|x\|_\infty$, וארבע הבחירות של
      הסימנים נותנות בסוגריים $5$, $5$, $5$, $5$. לכן $\|Ax\|_1\le5\|x\|_\infty$, ולפי טענה 1.8.4(א) $\|A\|\le5$. **חסם מלרע:** $x=(1,1)$ מקיים $\|x\|_\infty=1$
      ו-$Ax=(3,2)$, עם $\|Ax\|_1=5$.
    wrongFeedback: >-
      הסופרמום הוא על הריבוע $\|x\|_\infty\le1$, והנורמה של התמונה היא $\|\cdot\|_1$. נסו את ארבע הפינות $(\pm1,\pm1)$,
      ואז הוכיחו שאף $x$ בריבוע לא נותן יותר: כתבו כל ערך מוחלט כמקסימום של שני סימנים.
    commonWrong:
      - value: 4
        feedback: >-
          4 הוא סכום העמודה הגדול (משפט 1.8.8) וגם סכום השורה הגדול (משפט 1.8.9). שני המשפטים מניחים אותה נורמה בשני
          הצדדים. כאן הפינה $x=(1,1)$, ש-$\|x\|_\infty=1$, נותנת $\|Ax\|_1=5>4$.
        misconception: MC-c1-one-distance
      - value: 7
        feedback: >-
          7 הוא סכום הערכים המוחלטים של כל הכניסות: החסם הגס $\|Ax\|_1\le\sum_{i,j}|a_{ij}|\,|x_j|\le7\|x\|_\infty$. הוא
          נכון אבל לא הדוק: הסימנים בשורות "מתנגשים", ואף פינה לא נותנת יותר מ-5.
        misconception: MC-c1-opnorm-upper-only

  - id: Q-1.8-eval-new-norm
    type: twotier
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    qualitative: true
    level: exam
    prompt: >-
      על $C[0,1]$ נגדיר $\|f\|_*=\int_0^1|f|+|f(0)|$; זו נורמה (סכום של נורמת האינטגרל ושל $|f(0)|$). האם הפונקציונל
      הלינארי $\psi(f)=f(1)$ רציף על $(C[0,1],\|\cdot\|_*)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $\psi$ לינארי ואינו חסום, ולכן לפי משפט 1.8.2 אינו רציף. (לעומתו $f\mapsto f(0)$ חסום, כי
          $|f(0)|\le\|f\|_*$: הנורמה החדשה "רואה" רק את הנקודה 0.)
      - text: כן
        feedback: >-
          הנורמה החדשה שולטת ב-$f(0)$, לא ב-$f(1)$. אוהל צר ליד 1 שמתאפס ב-0 קטן בנורמה $\|\cdot\|_*$, ובכל זאת
          $\psi$ שלו 1.
        misconception: MC-c1-one-distance
    reasons:
      - text: 'האוהלים $g_n(x)=\max(0,1-n(1-x))$ מקיימים $g_n(0)=0$, $\|g_n\|_*=\frac1{2n}$ ו-$\psi(g_n)=1$'
        correct: true
        feedback: >-
          בדיוק. היחס $\frac{|\psi(g_n)|}{\|g_n\|_*}=2n$ אינו חסום, ולכן אין $M$ עם $|f(1)|\le M\|f\|_*$. בלשון סדרות:
          $g_n\to0$ ב-$\|\cdot\|_*$, ו-$\psi(g_n)=1\not\to0$ (משפט 1.6.3).
      - text: 'לפי הרציפות של $f$, הערך $f(1)$ קרוב ל-$f(0)$, ו-$|f(0)|\le\|f\|_*$; לכן $\psi$ חסום'
        feedback: >-
          רציפות של $f$ אחת לא נותנת חסם **אחיד**: $g_n$ רציפה, $g_n(0)=0$ ו-$g_n(1)=1$, ו-$\|g_n\|_*\to0$. החסם צריך
          להיות $|f(1)|\le M\|f\|_*$ עם $M$ אחד לכל $f$.
        misconception: MC-c1-quantifier-order
      - text: 'בנורמה שיש בה אינטגרל אף ערך בנקודה אינו רציף, ולכן גם $\psi$ לא'
        feedback: >-
          המסקנה נכונה, והנימוק לא: $f\mapsto f(0)$ רציף על אותו מרחב, כי $|f(0)|\le\|f\|_*$. צריך דוגמה שמראה
          ש-$\psi$ עצמו אינו חסום.
        misconception: MC-c1-one-distance

  - id: Q-1.8-opconv-def
    type: mc
    objectives: [OBJ-1.8-4]
    qualitative: true
    level: basic
    prompt: >-
      $T_k,T\in\mathcal{L}(V,W)$. מה פירוש "$T_k\to T$ בנורמת האופרטור"?
    choices:
      - text: '$\|T_k-T\|_{\mathrm{op}}\to0$'
        correct: true
        feedback: >-
          נכון (הגדרה 1.8.13). זו התכנסות במרחב הנורמי $\mathcal{L}(V,W)$ של משפט 1.8.5, ושקולה לכך ש-$T_kx\to Tx$
          במידה שווה על כדור היחידה (טענה 1.8.15).
      - text: '$T_kx\to Tx$ לכל $x\in V$'
        feedback: >-
          זו התכנסות נקודתית: ה-$N$ רשאי להיות תלוי ב-$x$. היא נובעת מהתכנסות בנורמה, אבל לא להפך:
          $T_kf=f(\frac1k)-f(0)$ על $(C[0,1],\|\cdot\|_\infty)$ שואפת נקודתית לאפס, ו-$\|T_k\|=2$ לכל $k$ (טענה 1.8.16).
        misconception: MC-c1-opconv-pointwise
      - text: '$\|T_k\|_{\mathrm{op}}\to\|T\|_{\mathrm{op}}$'
        feedback: >-
          הנורמה רואה רק את גודל המתיחה. $T_k=(-1)^kI$ על $\mathbb{R}^2$: כל הנורמות 1, והסדרה אינה מתכנסת, כי
          $T_ke_1=(-1)^ke_1$ אינה מתכנסת. ההפך כן נכון: מ-$\|T_k-T\|\to0$ נובע $\|T_k\|\to\|T\|$.
        misconception: MC-c1-opconv-norms-only
      - text: '$\sup_{x\in V}\|T_kx-Tx\|\to0$'
        feedback: >-
          הסופרמום על **כל** המרחב אינסופי כש-$T_k\ne T$: אם $(T_k-T)x\ne0$, אז $\|(T_k-T)(tx)\|=|t|\,\|(T_k-T)x\|$
          גדל בלי גבול. הסופרמום בנורמת האופרטור הוא על כדור היחידה.
        misconception: MC-c1-bounded-image

  - id: Q-1.8-opconv-matrix
    type: numeric
    objectives: [OBJ-1.8-4, OBJ-1.8-2]
    level: basic
    prompt: >-
      $A_k=\begin{pmatrix}3+\frac1k&-\frac2k\\ \frac{(-1)^k}{k}&5\end{pmatrix}$, ו-$A$ הגבול של $A_k$ בנורמת האופרטור
      (לפי טענה 1.8.14 זה הגבול של הכניסות). כהעתקות $(\mathbb{R}^2,\|\cdot\|_\infty)\to(\mathbb{R}^2,\|\cdot\|_\infty)$,
      חשבו את $\|A_{10}-A\|_{\mathrm{op}}$.
    answer: 0.3
    tolerance: 0.001
    correctFeedback: >-
      נכון. כל כניסה מתכנסת, ולכן $A=\begin{pmatrix}3&0\\0&5\end{pmatrix}$, ו-$A_{10}-A=\begin{pmatrix}0.1&-0.2\\0.1&0\end{pmatrix}$.
      לפי משפט 1.8.9, סכומי השורות בערך מוחלט הם $0.3$ ו-$0.1$, והנורמה $0.3$. באופן כללי $\|A_k-A\|_\infty=\frac3k\to0$.
    wrongFeedback: >-
      מצאו קודם את $A$ (הגבול של כל כניסה), חשבו את ההפרש $A_{10}-A$, ורק אז את נורמת האופרטור שלו בנורמת אינסוף:
      סכום השורה הגדול בערך מוחלט.
    commonWrong:
      - value: 0.2
        feedback: >-
          $0.2$ הוא סכום העמודה הגדול של $A_{10}-A$ ($0.1+0.1$, או $|-0.2|$), כלומר הנורמה כשהמישור נמדד בנורמה 1
          (משפט 1.8.8); הוא גם הכניסה הגדולה. בנורמת אינסוף סוכמים שורות: $0.1+0.2=0.3$.
        misconception: MC-c1-opnorm-rowcol-swap
      - value: 0.4
        feedback: >-
          $0.4$ הוא סכום הערכים המוחלטים של כל הכניסות של $A_{10}-A$. לפי טענה 1.8.14 זה רק חסם מלעיל לנורמה; כל רכיב
          של $(A_{10}-A)x$ משתמש בשורה אחת בלבד.
        misconception: MC-c1-opnorm-entrywise
      - value: 0.1
        feedback: >-
          $0.1=\|A_{10}\|_\infty-\|A\|_\infty=5.1-5$, הפרש של נורמות. המרחק בין העתקות הוא הנורמה של ההפרש,
          $\|A_{10}-A\|$, ולא ההפרש של הנורמות (שרק קטן ממנו או שווה לו בערך מוחלט, לפי אי-שוויון המשולש ההפוך).
        misconception: MC-c1-opconv-norms-only

  - id: Q-1.8-opconv-pointwise
    type: twotier
    objectives: [OBJ-1.8-4]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא: אם $T_k,T\in\mathcal{L}(V,W)$ ו-$T_kx\to Tx$ לכל $x\in V$, אז $\|T_k-T\|_{\mathrm{op}}\to0$.
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. התכנסות בנורמה גוררת התכנסות נקודתית (טענה 1.8.15), אבל לא להפך, במרחב ממימד אינסופי.
      - text: נכון
        feedback: >-
          על $(C[0,1],\|\cdot\|_\infty)$, $T_kf=f(\frac1k)-f(0)$ שואפת לאפס לכל $f$ רציפה, ובכל זאת $\|T_k-0\|=2$ לכל
          $k$: הפונקציה $g_k=\min(1,2kx-1)$ מנורמה 1 נותנת $T_kg_k=2$.
        misconception: MC-c1-opconv-pointwise
    reasons:
      - text: 'על $(C[0,1],\|\cdot\|_\infty)$, $T_kf=f(\frac1k)-f(0)$ שואפת לאפס לכל $f$, ו-$\|T_k\|_{\mathrm{op}}=2$ לכל $k$'
        correct: true
        feedback: >-
          בדיוק (טענה 1.8.16). $f$ רציפה ב-0 ולכן $f(\frac1k)\to f(0)$, אבל ה-$k$ שמתאים תלוי ב-$f$: לכל $k$ יש
          $g_k$ בכדור היחידה, שעולה מ-$(-1)$ ל-1 על $[0,\frac1k]$, עם $T_kg_k=2$.
      - text: '$\|T_k-T\|$ הוא סופרמום של $\|T_kx-Tx\|$ על כדור היחידה, וכל אחד מהם שואף לאפס, ולכן גם הסופרמום'
        feedback: >-
          סופרמום של סדרות ששואפות לאפס לא חייב לשאוף לאפס: צריך $N$ אחד לכל ה-$x$ בכדור, כלומר התכנסות במידה שווה
          על כדור היחידה (טענה 1.8.15(ב)). זה אותו פער שבין התכנסות נקודתית להתכנסות במידה שווה של $x^n$ על $[0,1]$.
        misconception: MC-c1-opconv-pointwise
      - text: 'זה נכשל כבר במטריצות: $A_ke_j\to Ae_j$ לכל $j$ אינו גורר $A_k\to A$'
        feedback: >-
          במטריצות, עם נורמה 1, 2 או אינסוף, זה דווקא נכון: $A_ke_j$ היא העמודה ה-$j$, ולכן כל הכניסות מתכנסות (משפט
          1.5.9), ולפי טענה 1.8.14 $A_k\to A$ בנורמה (דוגמה 2(ד)). הדוגמה הנגדית חייבת להיות במימד אינסופי.
        misconception: MC-c1-coordinatewise-weaker

  - id: Q-1.8-opconv-consequences
    type: multi
    objectives: [OBJ-1.8-4]
    level: mid
    prompt: >-
      $T_k,T\in\mathcal{L}(V,W)$ ו-$\|T_k-T\|_{\mathrm{op}}\to0$. אילו מהטענות נובעות מכך תמיד? סמנו את כולן.
    choices:
      - text: '$T_kx\to Tx$ לכל $x\in V$'
        correct: true
        feedback: 'נכון: $\|T_kx-Tx\|\le\|T_k-T\|\,\|x\|\to0$ (טענה 1.8.4(א) על $T_k-T$).'
      - text: '$\sup_{\|x\|\le5}\|T_kx-Tx\|\to0$'
        correct: true
        feedback: 'נכון: הסופרמום חסום על ידי $5\|T_k-T\|$ (טענה 1.8.15(א)); ההתכנסות במידה שווה על כל כדור.'
      - text: '$\|T_k\|_{\mathrm{op}}\to\|T\|_{\mathrm{op}}$'
        correct: true
        feedback: >-
          נכון: לפי אי-שוויון המשולש ההפוך במרחב הנורמי $\mathcal{L}(V,W)$ (למה 1.2.2),
          $\big|\,\|T_k\|-\|T\|\,\big|\le\|T_k-T\|$.
      - text: '$\sup_{x\in V}\|T_kx-Tx\|\to0$'
        feedback: >-
          על כל המרחב הסופרמום אינסופי לכל $k$ שבו $T_k\ne T$, כי $\|(T_k-T)(tx)\|=|t|\,\|(T_k-T)x\|$. למשל
          $T_k=\frac1kI$ ו-$T=0$ על $\mathbb{R}$: $\|T_k\|=\frac1k\to0$, אבל $\sup_x\frac{|x|}{k}=\infty$.
        misconception: MC-c1-bounded-image
      - text: 'כל סדרה $S_k\in\mathcal{L}(V,W)$ עם $\|S_k\|_{\mathrm{op}}\to\|T\|_{\mathrm{op}}$ מתכנסת גם היא ל-$T$'
        feedback: >-
          לא: עם $T\ne0$ ו-$S_k=-T$ לכל $k$, הנורמות שוות, אבל $\|S_k-T\|=2\|T\|\ne0$. מהתכנסות הנורמות לא נובעת
          התכנסות.
        misconception: MC-c1-opconv-norms-only

  - id: Q-1.8-opconv-entrywise-proof
    type: rank
    objectives: [OBJ-1.8-4]
    level: exam
    prompt: >-
      סדרו את שלבי ההוכחה: יהי $p\in\{1,2,\infty\}$, ו-$A_k,A$ מטריצות $m\times n$, עם $\|\cdot\|_p$ בתחום ובטווח. אם
      כל כניסה של $A_k$ שואפת לכניסה המתאימה של $A$, אז $\|A_k-A\|_p\to0$.
    help: >-
      סדרו את השלבים מהראשון לאחרון. כל שלב משתמש רק בעצמים שהוגדרו בשלבים שלפניו.
    items:
      - id: limit
        label: '$s_k$ הוא סכום של $mn$ סדרות ששואפות לאפס, ולכן $s_k\to0$, ואיתו $\|A_k-A\|_p\to0$.'
      - id: column
        label: 'לכל $x$, $B_kx$ הוא צירוף של העמודות $b^{(k)}_j$ של $B_k$, ולפי אי-שוויון המשולש $\|B_kx\|_p\le\sum_j|x_j|\,\|b^{(k)}_j\|_p$.'
      - id: minimal
        label: 'לפי טענה 1.8.4(א), $\|A_k-A\|_p=\|B_k\|_p\le s_k$.'
      - id: setb
        label: 'נסמן $B_k=A_k-A$; לפי ההנחה כל הכניסות שלה שואפות לאפס.'
      - id: bound
        label: '$\|b^{(k)}_j\|_p\le\|b^{(k)}_j\|_1$ ו-$|x_j|\le\|x\|_\infty\le\|x\|_p$, ולכן $\|B_kx\|_p\le s_k\|x\|_p$, כאשר $s_k$ סכום הערכים המוחלטים של כל הכניסות של $B_k$.'
    order: [setb, column, bound, minimal, limit]
    correctFeedback: >-
      נכון. הרעיון: חסם מפורש, $\|B\|_p\le\sum_{i,j}|b_{ij}|$, שלא משתמש בשקילות כל הנורמות (שיעור 3.5) ולא
      בקומפקטיות. הסופיות נכנסת רק בשלב האחרון: סכום של מספר **סופי** של סדרות ששואפות לאפס.
    wrongFeedback: >-
      התחילו מההפרש $B_k$; חסמו את $\|B_kx\|_p$ דרך העמודות; העבירו כל נורמה לנורמה 1 או לנורמת אינסוף; עברו
      מחסם לכל $x$ לחסם על הנורמה; ולבסוף קחו גבול.
