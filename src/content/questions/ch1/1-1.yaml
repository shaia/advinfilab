# Lesson 1.1 — metric spaces: definition and examples.
# Objectives (src/course.ts):
#   OBJ-1.1-1  state the three axioms of a metric and check them, the triangle inequality in particular
#   OBJ-1.1-2  the basic examples: Euclidean, discrete, sum and max metrics on R^n, the sup metric on B(X)
#   OBJ-1.1-3  find the axiom that fails for a function that is not a metric (squared difference)
# Fix round 2026-11-11 (student read): sqrt-key demoted to basic and truncate to mid (both restate the lesson);
# Q-1.1-shifted-metric is the new exam-level question (Lemma 1.1.2(b) + Prop 1.1.13(a)); sum/three/sup/which/
# unbounded use numbers and functions the lesson does not compute. Every number recomputed with npx tsx
# (src/math/multivar.ts pDist; a 10^6-point grid for the sup) on 2026-11-11.
chapter: 1
questions:
  - id: Q-1.1-axioms
    type: mc
    objectives: [OBJ-1.1-1]
    qualitative: true
    level: basic
    prompt: >-
      פונקציה $d:X\times X\to[0,\infty)$ היא **מטריקה** על $X$ אם לכל $x,y,z\in X$ מתקיימות שלוש תכונות. איזו
      רשימה היא הנכונה?
    choices:
      - text: '$d(x,y)=0 \iff x=y$;  $d(x,y)=d(y,x)$;  $d(x,z)\le d(x,y)+d(y,z)$'
        correct: true
        feedback: >-
          נכון. אפס בדיוק לנקודה עצמה, סימטריה, ואי-שוויון המשולש: עקיפה דרך $y$ אינה קצרה מהדרך הישירה.
      - text: '$d(x,x)=0$;  $d(x,y)=d(y,x)$;  $d(x,z)\le d(x,y)+d(y,z)$'
        feedback: >-
          חסר הכיוון "$d(x,y)=0$ רק אם $x=y$". בלעדיו $d(x,y)=|x_1-y_1|$ על $\mathbb{R}^2$ הייתה "מטריקה", אף
          שהנקודות $(0,0)$ ו-$(0,1)$ שונות ובמרחק 0.
        misconception: MC-c1-zero-axiom
      - text: '$d(x,y)=0 \iff x=y$;  $d(x,y)=d(y,x)$;  $d(x,z)\le \max(d(x,y),d(y,z))$'
        feedback: >-
          זו דרישה חזקה בהרבה מאי-שוויון המשולש, והמרחק הרגיל על $\mathbb{R}$ אינו מקיים אותה:
          $|0-2|=2>\max(|0-1|,|1-2|)=1$.
        misconception: MC-c1-triangle-wrong-form
      - text: '$d(x,y)=0 \iff x=y$;  $d(x,y)=d(y,x)$;  $d(x,z)\ge d(x,y)+d(y,z)$'
        feedback: >-
          האי-שוויון הפוך. עם $y=x$ הוא היה נותן $d(x,z)\ge d(x,z)+0$, ועם $y=z$ אותו דבר, אבל עם $x=z$
          הוא נותן $0\ge2d(x,y)$, כלומר כל הנקודות שוות. הדרך הישירה היא הקצרה, לא הארוכה.
        misconception: MC-c1-triangle-wrong-form

  - id: Q-1.1-square
    type: twotier
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    qualitative: true
    level: basic
    prompt: >-
      האם $d(x,y)=(x-y)^2$ היא מטריקה על $\mathbb{R}$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. היא אפס רק כש-$x=y$ והיא סימטרית, אבל אי-שוויון המשולש נכשל.
      - text: כן
        feedback: >-
          $|x-y|$ היא מטריקה, אבל ריבוע של מטריקה אינו בהכרח מטריקה: $d(0,2)=4$ ואילו $d(0,1)+d(1,2)=2$.
        misconception: MC-c1-transform-metric
    reasons:
      - text: '$d(0,2)=4>2=d(0,1)+d(1,2)$: אי-שוויון המשולש נכשל'
        correct: true
        feedback: >-
          בדיוק. דוגמה נגדית אחת מספיקה כדי להפריך "לכל $x,y,z$". שימו לב: הריבוע "מעניש" מרחקים גדולים, ולכן
          שני צעדים קטנים זולים מצעד גדול אחד.
      - text: 'הסימטריה נכשלת, כי $x-y\neq y-x$'
        feedback: >-
          אמנם $x-y\neq y-x$, אבל $(x-y)^2=(y-x)^2$, ולכן הסימטריה מתקיימת. התכונה שנכשלת היא אי-שוויון המשולש.
        misconception: MC-c1-axiom-misdiagnosed
      - text: 'אקסיומת החיוביות (M1) נכשלת, כי $(x-y)^2=0$ אפשרי'
        feedback: >-
          $(x-y)^2=0$ רק כש-$x=y$, וזה בדיוק מה שהאקסיומה דורשת. התכונה שנכשלת היא אי-שוויון המשולש.
        misconception: MC-c1-axiom-misdiagnosed

  - id: Q-1.1-proj
    type: twotier
    objectives: [OBJ-1.1-3]
    qualitative: true
    level: basic
    prompt: >-
      על $\mathbb{R}^2$ מגדירים $d(x,y)=|x_1-y_1|$, כלומר רק את ההפרש בקואורדינטה הראשונה. האם זו מטריקה?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. סימטריה ואי-שוויון המשולש עוברים מ-$\mathbb{R}$, אבל נקודות שונות יכולות להיות במרחק 0.
      - text: כן
        feedback: >-
          $d((0,0),(0,1))=|0-0|=0$, אף ש-$(0,0)\neq(0,1)$. מטריקה מתאפסת רק על זוג של נקודה עם עצמה.
        misconception: MC-c1-zero-axiom
    reasons:
      - text: '$d((0,0),(0,1))=0$ אף שהנקודות שונות'
        correct: true
        feedback: >-
          בדיוק: הכיוון "$d(x,y)=0\Rightarrow x=y$" של אקסיומת החיוביות (M1) נכשל. (פונקציה כזו נקראת לפעמים
          פסאודו-מטריקה.)
      - text: 'אי-שוויון המשולש נכשל'
        feedback: >-
          הוא מתקיים: $|x_1-z_1|\le|x_1-y_1|+|y_1-z_1|$ הוא אי-שוויון המשולש בישר. מה שנכשל הוא אקסיומת החיוביות
          (M1).
        misconception: MC-c1-axiom-misdiagnosed
      - text: 'הסימטריה נכשלת, כי $y_2$ לא משתתף'
        feedback: >-
          $|x_1-y_1|=|y_1-x_1|$, כך שהסימטריה מתקיימת. העובדה ש-$y_2$ לא משתתפת פוגעת דווקא באקסיומת החיוביות
          (M1).
        misconception: MC-c1-axiom-misdiagnosed

  - id: Q-1.1-discrete
    type: mc
    objectives: [OBJ-1.1-2, OBJ-1.1-1]
    qualitative: true
    level: basic
    prompt: >-
      על קבוצה כלשהי $X$ מגדירים את **המטריקה הבדידה**: $d(x,y)=1$ אם $x\neq y$ ו-$d(x,x)=0$. למה היא מקיימת
      את אי-שוויון המשולש $d(x,z)\le d(x,y)+d(y,z)$?
    choices:
      - text: 'אם $x=z$ האגף השמאלי 0. אם $x\neq z$, אז $y$ שונה מאחת מהן, ולכן האגף הימני לפחות 1'
        correct: true
        feedback: >-
          נכון. שני מקרים מכסים הכול, ואין שום הנחה על $X$: היא מטריקה על כל קבוצה, סופית או אינסופית.
      - text: היא אינה מקיימת אותו, כי המרחק לא תלוי במיקום הנקודות
        feedback: >-
          מטריקה לא חייבת לשקף "מיקום". צריך רק לבדוק את שלוש האקסיומות, והמטריקה הבדידה עומדת בכולן.
        misconception: MC-c1-discrete-not-metric
      - text: היא מקיימת אותו רק כש-$X$ סופית
        feedback: >-
          ההוכחה לא משתמשת בגודל של $X$ בכלל: המטריקה הבדידה מוגדרת היטב גם על $\mathbb{R}$.
        misconception: MC-c1-discrete-not-metric
      - text: 'כי כל המרחקים שווים ל-1, ו-$1\le1+1$'
        feedback: >-
          לא כל המרחקים 1: $d(x,x)=0$. הטיעון צריך לטפל גם במקרים שבהם חלק מהנקודות שוות, וזה מה שהחלוקה
          למקרים עושה.
        misconception: MC-c1-zero-axiom

  - id: Q-1.1-sum
    type: numeric
    objectives: [OBJ-1.1-2]
    level: basic
    prompt: >-
      חשבו את $d_1(x,y)=|x_1-y_1|+|x_2-y_2|$ (מטריקת הסכום) בין $x=(-2,3)$ ל-$y=(1,-3)$ ב-$\mathbb{R}^2$.
    answer: 9
    tolerance: 0.001
    correctFeedback: >-
      נכון. $|-2-1|+|3-(-3)|=3+6=9$. לשם השוואה, המרחק האוקלידי הוא $\sqrt{9+36}=\sqrt{45}\approx6.708$ ומטריקת
      המקסימום נותנת $\max(3,6)=6$: שלוש מטריקות, שלושה מרחקים בין אותן שתי נקודות.
    wrongFeedback: >-
      חשבו את ההפרש בכל קואורדינטה, קחו ערך מוחלט, וחברו.
    commonWrong:
      - value: 3
        feedback: >-
          3 הוא $(-2-1)+(3-(-3))=-3+6$: חיברתם את ההפרשים בלי ערך מוחלט, והשלילי קיזז את החיובי. בכל קואורדינטה
          לוקחים $|x_i-y_i|$ לפני שמחברים.
      - value: 6.708
        feedback: >-
          $\sqrt{45}\approx6.708$ הוא המרחק **האוקלידי**. מטריקת הסכום היא מטריקה אחרת על אותה קבוצה ונותנת מספר
          אחר.
        misconception: MC-c1-one-distance
      - value: 6
        feedback: >-
          6 הוא המרחק במטריקת **המקסימום**, $\max(3,6)$. במטריקת הסכום מחברים את שני ההפרשים.
        misconception: MC-c1-one-distance

  - id: Q-1.1-three
    type: rank
    objectives: [OBJ-1.1-2]
    level: basic
    prompt: >-
      סדרו מהגדול לקטן את המרחקים בין $x=(0,5)$ ל-$y=(4,4)$ בשלוש המטריקות על $\mathbb{R}^2$.
    items:
      - id: d1
        label: 'מטריקת הסכום $d_1$'
      - id: d2
        label: 'המטריקה האוקלידית $d_2$'
      - id: dinf
        label: 'מטריקת המקסימום $d_\infty$'
    order: [d1, d2, dinf]
    correctFeedback: >-
      נכון: $5>\sqrt{17}\approx4.12>4$. זה לא מקרי: לפי למה 1.1.6, לכל שתי נקודות $d_\infty\le d_2\le d_1$.
      (שוויון אפשרי: להפרש $(3,0)$ שלושתן 3.)
    wrongFeedback: >-
      חשבו כל אחד: ההפרשים בערך מוחלט הם 4 ו-1; סכום, שורש סכום הריבועים, ומקסימום.

  - id: Q-1.1-sup
    type: numeric
    objectives: [OBJ-1.1-2]
    level: mid
    prompt: >-
      ב-$C[0,1]$ עם **מטריקת הסופרמום** $d_\infty(f,g)=\sup_{x\in[0,1]}|f(x)-g(x)|$, חשבו את $d_\infty(f,g)$ עבור
      $f(x)=x^2$ ו-$g(x)=x^3$. (שבר או תשובה עשרונית בשלוש ספרות אחרי הנקודה.)
    answer: 0.148148148
    tolerance: 0.0005
    correctFeedback: >-
      נכון: $\frac4{27}$. ההפרש $h(x)=x^2-x^3=x^2(1-x)\ge0$ על $[0,1]$, $h'(x)=2x-3x^2=x(2-3x)$ מתאפסת ב-$0$
      וב-$\frac23$, ו-$h(\frac23)=\frac49-\frac8{27}=\frac4{27}$, בעוד שבקצוות $h=0$. לפי טענה 1.1.8(ב) הסופרמום
      הוא המקסימום הזה.
    wrongFeedback: >-
      כתבו את ההפרש $h=f-g$ כפונקציה אחת, ומצאו את המקסימום של $|h|$ על כל הקטע: בנקודות הקריטיות שבתוך הקטע
      ובקצוות.
    commonWrong:
      - value: 0
        feedback: >-
          0 הוא ההפרש בקצוות ($h(0)=h(1)=0$), וגם $\sup f-\sup g=1-1$. הסופרמום של ההפרש מתקבל בנקודה פנימית,
          $x=\frac23$, ולא בקצה; והמטריקה היא הסופרמום של **ההפרש**, לא ההפרש בין הסופרמומים.
        misconception: MC-c1-sup-metric-shortcut
      - value: 0.125
        feedback: >-
          $\frac18=h(\frac12)$: הצבתם את אמצע הקטע במקום למצוא את הנקודה הקריטית. $h'(\frac12)=\frac14\ne0$, ו-$h$
          עוד עולה שם; המקסימום ב-$x=\frac23$.
        misconception: MC-c1-sup-metric-shortcut
      - value: 1.125
        feedback: >-
          $\frac98=|h(\frac32)|$: מ-$2x-3x^2=0$ יצא לכם $x=\frac32$ (חלוקה הפוכה), נקודה שאינה בקטע $[0,1]$ בכלל.
          הפתרון הוא $x=\frac23$.
        misconception: MC-c1-sup-metric-shortcut

  - id: Q-1.1-unbounded
    type: twotier
    objectives: [OBJ-1.1-2, OBJ-1.1-3]
    qualitative: true
    level: mid
    prompt: >-
      על הקבוצה של **כל** הפונקציות $f:\mathbb{R}\to\mathbb{R}$ (לא רק החסומות) מגדירים
      $d(f,g)=\sup_{x\in\mathbb{R}}|f(x)-g(x)|$. האם זו מטריקה?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ההוכחה של שלוש האקסיומות עוברת בכל פעם שהסופרמומים סופיים, אבל $d$ לא תמיד מוגדרת כמספר ממשי.
      - text: כן, אותה הוכחה כמו ב-$B(X)$
        feedback: >-
          ההוכחה על $B(X)$ משתמשת בחסימות כדי שהסופרמום יהיה מספר ממשי. בלעדיה, בין $f(x)=x^2$ לבין פונקציית
          האפס, הקבוצה $\{x^2:x\in\mathbb{R}\}$ אינה חסומה מלעיל ואין לה סופרמום ממשי; ומטריקה מקבלת ערכים
          ממשיים.
        misconception: MC-c1-metric-infinite-value
    reasons:
      - text: 'בין $f(x)=x^2$ ל-$g(x)=x$ הקבוצה $\{|x^2-x|\}$ אינה חסומה מלעיל, ומטריקה מקבלת ערכים ב-$[0,\infty)$'
        correct: true
        feedback: >-
          בדיוק: $|x^2-x|\ge x^2-|x|$, ולמשל ב-$x=n+1$ הערך $n(n+1)\ge n$ לכל $n\in\mathbb{N}$, ולפי ארכימדס אין
          חסם. בשביל זה מגבילים את מטריקת הסופרמום ל-$B(X)$: הפרש של שתי פונקציות חסומות חסום.
      - text: 'אי-שוויון המשולש נכשל לפונקציות לא חסומות'
        feedback: >-
          לכל $x$: $|f(x)-h(x)|\le|f(x)-g(x)|+|g(x)-h(x)|$, ומזה נובע אי-שוויון המשולש בכל פעם ששלושת הסופרמומים
          סופיים, כמו בטענה 1.1.8(א). הבעיה מוקדמת יותר: ל-$d(f,g)$ אין ערך ממשי בכלל.
        misconception: MC-c1-axiom-misdiagnosed
      - text: 'אקסיומת החיוביות (M1) נכשלת, כי $\sup|f-g|=0$ גם לפונקציות שונות'
        feedback: >-
          אם $\sup|f-g|=0$ אז $|f(x)-g(x)|=0$ בכל נקודה, ולכן $f=g$. אקסיומת החיוביות (M1) בסדר.
        misconception: MC-c1-axiom-misdiagnosed

  - id: Q-1.1-sup-triangle
    type: rank
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    qualitative: true
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה של אי-שוויון המשולש למטריקת הסופרמום על $B(X)$:
      $d(f,h)\le d(f,g)+d(g,h)$.
    help: סדרו את השלבים מהראשון לאחרון.
    items:
      - id: fix
        label: 'יהיו $f,g,h\in B(X)$, ותהי $x\in X$ נקודה כלשהי.'
      - id: real
        label: 'לפי אי-שוויון המשולש בישר: $|f(x)-h(x)|\le|f(x)-g(x)|+|g(x)-h(x)|$.'
      - id: bound
        label: 'כל מחובר באגף ימין קטן או שווה לסופרמום שלו: $|f(x)-h(x)|\le d(f,g)+d(g,h)$.'
      - id: upper
        label: 'זה נכון לכל $x$, ולכן $d(f,g)+d(g,h)$ הוא חסם מלעיל של $\{|f(x)-h(x)|:x\in X\}$.'
      - id: sup
        label: 'הסופרמום הוא החסם המלעיל הקטן ביותר, ולכן $d(f,h)\le d(f,g)+d(g,h)$.'
    order: [fix, real, bound, upper, sup]
    correctFeedback: >-
      נכון. הרעיון: עובדים בנקודה אחת, שם יש אי-שוויון בין מספרים, ורק בסוף עוברים לסופרמום דרך "חסם מלעיל
      קטן ביותר".
    wrongFeedback: >-
      התחילו בנקודה אחת $x$: שם אפשר להשתמש באי-שוויון המשולש בישר. הסופרמום נכנס רק אחרי שיש אי-שוויון שנכון
      לכל $x$.

  - id: Q-1.1-which
    type: multi
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    qualitative: true
    level: mid
    prompt: >-
      אילו מהפונקציות הבאות הן מטריקות על $\mathbb{R}$? סמנו את כולן.
    choices:
      - text: '$\min\big(\sqrt{|x-y|},\,1\big)$'
        correct: true
        feedback: >-
          נכון. לפי מסקנה 1.1.12, $\sqrt{|x-y|}$ מטריקה על $\mathbb{R}$. אותה מסקנה, מופעלת הפעם על המטריקה
          $\sqrt{|x-y|}$, אומרת ש-$\min\big(\sqrt{|x-y|},1\big)$ מטריקה.
      - text: '$|x-y|+|x^3-y^3|$'
        correct: true
        feedback: >-
          נכון. שני המחוברים מטריקות: הראשון המרחק הרגיל, והשני לפי טענה 1.1.13(ב) עם $g(x)=x^3$, שהיא עולה ממש
          ולכן חד-חד-ערכית. סכום של שתי מטריקות הוא מטריקה (דוגמה 4(א)).
      - text: '$\big|(x^3-x)-(y^3-y)\big|$'
        feedback: >-
          $g(x)=x^3-x$ מתאפסת ב-$0$ וב-$1$, ולכן $d(0,1)=0$ אף ש-$0\ne1$: אקסיומת החיוביות (M1) נכשלת. לפי טענה
          1.1.13(ב) זו מטריקה רק כש-$g$ חד-חד-ערכית, ו-$g$ אינה כזו.
        misconception: MC-c1-zero-axiom
      - text: '$\dfrac{(x-y)^2}{1+(x-y)^2}$'
        feedback: >-
          בנקודות $0,1,2$ המשולש עובר ($\frac45\le\frac12+\frac12$), אבל בנקודות קרובות הוא נכשל:
          $d(0,0.2)=\frac{0.04}{1.04}\approx0.0385$, ואילו $d(0,0.1)+d(0.1,0.2)=2\cdot\frac{0.01}{1.01}\approx0.0198$.
          ליד $0$ הפונקציה $\varphi(t)=\frac{t^2}{1+t^2}$ מתנהגת כמו $t^2$, ואינה תת-חיבורית.
        misconception: MC-c1-triangle-few-points
      - text: '$|x-2y|+|2x-y|$'
        feedback: >-
          היא סימטרית (החלפת $x$ ו-$y$ מחליפה את שני המחוברים זה בזה), אבל $d(1,1)=1+1=2\ne0$: אקסיומת החיוביות
          (M1) נכשלת.
        misconception: MC-c1-zero-axiom
    explanation: >-
      שתי דרכים כלליות מהשיעור: למה 1.1.11 ($\varphi\circ d$ מטריקה כש-$\varphi$ לא-יורדת, מתאפסת רק ב-$0$
      ותת-חיבורית), וטענה 1.1.13 ($|g(x)-g(y)|$ מטריקה בדיוק כש-$g$ חד-חד-ערכית). להפרכה מספיקה דוגמה נגדית
      אחת, ולפעמים צריך לחפש אותה בין נקודות קרובות.

  - id: Q-1.1-sqrt-key
    type: mc
    objectives: [OBJ-1.1-1]
    level: basic
    prompt: >-
      בהוכחה ש-$d(x,y)=\sqrt{|x-y|}$ מקיימת את אי-שוויון המשולש, מה הצעד המרכזי?
    choices:
      - text: '$\sqrt{a+b}\le\sqrt a+\sqrt b$ לכל $a,b\ge0$, ומונוטוניות השורש'
        correct: true
        feedback: >-
          נכון. מעלים בריבוע: $a+b\le a+2\sqrt{ab}+b$. אחר כך
          $\sqrt{|x-z|}\le\sqrt{|x-y|+|y-z|}\le\sqrt{|x-y|}+\sqrt{|y-z|}$.
      - text: 'בדיקה על $x=0$, $y=1$, $z=2$: $\sqrt2\le1+1$'
        feedback: >-
          בדיקה של שלשה אחת יכולה רק להפריך. האקסיומה היא "לכל $x,y,z$", וצריך טיעון כללי.
        misconception: MC-c1-triangle-few-points
      - text: '$\sqrt{a+b}\ge\sqrt a+\sqrt b$ לכל $a,b\ge0$'
        feedback: >-
          האי-שוויון הזה שקרי ($\sqrt2<1+1$), ובכל מקרה כיוון "גדול או שווה" לא היה נותן חסם מלעיל ל-$d(x,z)$.
        misconception: MC-c1-triangle-wrong-form
      - text: 'השורש לא-יורד, וכל פונקציה לא-יורדת של מטריקה, שמתאפסת רק ב-0, היא מטריקה'
        feedback: >-
          לא נכון: $t\mapsto t^2$ לא-יורדת על $[0,\infty)$ ומתאפסת רק ב-$0$, ו-$(x-y)^2$ אינה מטריקה. מה שעובד כאן
          הוא שהשורש גם **תת-חיבורי** (למה 1.1.11).
        misconception: MC-c1-transform-metric

  - id: Q-1.1-truncate
    type: twotier
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    qualitative: true
    level: mid
    prompt: >-
      $d$ מטריקה על $X$. האם $d'(x,y)=\min(d(x,y),1)$ היא בהכרח מטריקה על $X$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. (M1) ו-(M2) עוברים מ-$d$ ישירות; צריך לבדוק רק את המשולש, בשני מקרים.
      - text: לא, החיתוך ב-1 שובר את אי-שוויון המשולש
        feedback: >-
          החיתוך רק מקטין מרחקים גדולים. בדקו את שני המקרים: אם אחד המחוברים באגף ימין הוא 1, האגף הימני לפחות 1
          והשמאלי לכל היותר 1.
        misconception: MC-c1-axiom-misdiagnosed
    reasons:
      - text: 'אם $d(x,y)\ge1$ או $d(y,z)\ge1$, אגף ימין $\ge1\ge d''(x,z)$; אחרת הוא $d(x,y)+d(y,z)\ge d''(x,z)$'
        correct: true
        feedback: >-
          בדיוק. החלוקה למקרים היא כל ההוכחה. כך מקבלים מכל מטריקה מטריקה חסומה, עם אותן סדרות מתכנסות (שיעור 1.5).
      - text: 'כל פונקציה לא-יורדת $\varphi$ עם $\varphi(0)=0$ הופכת מטריקה למטריקה, ו-$\min(t,1)$ היא כזו'
        feedback: >-
          זה שקרי: $\varphi(t)=t^2$ לא-יורדת על $[0,\infty)$, ו-$d^2$ אינה בהכרח מטריקה. $\min(t,1)$ עובדת כי היא
          גם תת-חיבורית.
        misconception: MC-c1-transform-metric
      - text: '$d''$ הוא המינימום של שתי מטריקות, $d$ והפונקציה הקבועה $1$, ומינימום של מטריקות הוא מטריקה'
        feedback: >-
          הקבוע 1 אינו מטריקה: $d(x,x)$ חייב להיות 0. וגם מינימום של שתי מטריקות אינו בהכרח מטריקה (דוגמה 4(ג)).
        misconception: MC-c1-zero-axiom

  - id: Q-1.1-shifted-metric
    type: twotier
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ותהי $a\in X$ נקודה קבועה. לכל $x,y\in X$ מגדירים

      $$\rho(x,y)=d(x,y)+\big|d(x,a)-d(y,a)\big|.$$

      הוכיחו או הפריכו: $\rho$ מטריקה על $X$, ולכל $x,y\in X$ מתקיים $d(x,y)\le\rho(x,y)\le2\,d(x,y)$. בחרו
      תשובה ונימוק.
    choices:
      - text: 'נכון: $\rho$ מטריקה, ו-$d\le\rho\le2d$'
        correct: true
        feedback: >-
          נכון. החסם התחתון כי המחובר השני אי-שלילי; החסם העליון לפי למה 1.1.2(ב); ו-$\rho$ מטריקה כי המחובר
          הראשון מטריקה והשני "כמעט": אי-שלילי, סימטרי ומקיים את (M3). בדיקה על $\mathbb{R}$ עם $a=0$: ב-$x=1$,
          $y=2$, $\rho=1+1=2=2d$; ב-$x=1$, $y=-1$, $\rho=2+0=d$. שני החסמים הדוקים.
      - text: '$\rho$ מטריקה, אבל $\rho\le2d$ אינו נכון בכל מרחב'
        feedback: >-
          לפי למה 1.1.2(ב) (אי-שוויון המשולש ההפוך) עם $z=a$, $\big|d(x,a)-d(y,a)\big|\le d(x,y)$ בכל מרחב מטרי,
          ולכן $\rho\le d+d=2d$.
        misconception: MC-c1-triangle-wrong-form
      - text: '$\rho$ אינה בהכרח מטריקה'
        feedback: >-
          $\rho$ היא סכום של מטריקה ושל פונקציה שאינה מטריקה, אבל זה לא מקלקל דבר: (M1) נובעת מהמחובר $d$ לבדו,
          ו-(M2), (M3) מתקיימות בשני המחוברים, ולכן בסכום.
        misconception: MC-c1-pseudo-summand
    reasons:
      - text: 'לפי טענה 1.1.13(א) עם $g=d(\cdot,a)$, המחובר השני אי-שלילי ומקיים (M2), (M3); לפי למה 1.1.2(ב) הוא לכל היותר $d(x,y)$'
        correct: true
        feedback: >-
          בדיוק. (M1): $\rho\ge d\ge0$, ו-$\rho(x,y)=0$ גורר $0\le d(x,y)\le\rho(x,y)=0$, ולפי (M1) של $d$, $x=y$;
          ו-$\rho(x,x)=0+0$. (M2) ו-(M3): מחברים את אי-השוויונים של $d$ ושל $|g(x)-g(y)|$ (טענה 1.1.13(א)), כמו
          בדוגמה 4(א) של השיעור, שהשתמשה רק באי-השליליות של המחובר השני. החסמים: $0\le|g(x)-g(y)|\le d(x,y)$.
      - text: 'המחובר השני מתאפס גם בין נקודות שונות (ב-$\mathbb{R}^2$ עם $d_2$ ו-$a=0$, בין $(1,0)$ ל-$(0,1)$), ולכן הסכום נכשל ב-(M1)'
        feedback: >-
          נכון שהמחובר השני מתאפס שם, אבל המחובר הראשון לא: $\rho\big((1,0),(0,1)\big)=\sqrt2+0>0$. כדי ש-$\rho$
          תתאפס צריך ששני המחוברים יתאפסו, ו-$d(x,y)=0$ כבר גורר $x=y$.
        misconception: MC-c1-pseudo-summand
      - text: 'כש-$a$ רחוקה מ-$x$ ומ-$y$, ההפרש $|d(x,a)-d(y,a)|$ יכול לעלות על $d(x,y)$, ואז $\rho>2d$'
        feedback: >-
          אי-שוויון המשולש ההפוך (למה 1.1.2(ב)) אומר בדיוק שזה בלתי אפשרי, בכל מרחב ולכל $a$: ההפרש בין המרחקים
          של $x$ ושל $y$ מנקודה שלישית אינו עולה על המרחק ביניהן.
        misconception: MC-c1-triangle-wrong-form
