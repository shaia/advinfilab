# Lesson 4.4 — separability.
# Objectives (src/course.ts):
#   OBJ-4.4-1  define a separable space and prove that Euclidean space is separable
#   OBJ-4.4-2  prove that a subspace of a separable metric space is separable, and that a compact space is separable
#   OBJ-4.4-3  prove that the bounded functions with the sup norm are not separable (uncountably many far-apart points)
chapter: 4
questions:
  - id: Q-4.4-def
    type: mc
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: basic
    prompt: >-
      מה פירוש "המרחב המטרי $X$ **ספרבילי**"?
    choices:
      - text: יש ב-$X$ תת-קבוצה צפופה שהיא לכל היותר בת מנייה
        correct: true
        feedback: >-
          נכון. כלומר יש $D=\{q_1,q_2,\dots\}\subseteq X$ כך שכל כדור פתוח ב-$X$ מכיל נקודה של $D$; או: כל $x\in X$ הוא
          גבול של סדרה מ-$D$.
      - text: '$X$ בן מנייה'
        feedback: >-
          זה חזק מדי: $\mathbb{R}$ אינו בן מנייה ובכל זאת ספרבילי, כי $\mathbb{Q}$ צפופה בו. (מרחב לכל היותר בן מנייה כן ספרבילי:
          הוא צפוף בעצמו.)
        misconception: MC-c4-separable-countable
      - text: יש ב-$X$ תת-קבוצה בת מנייה
        feedback: >-
          בכל מרחב אינסופי יש תת-קבוצה בת מנייה. ההגדרה דורשת שהיא תהיה **צפופה**.
        misconception: MC-c4-separable-countable
      - text: '$X$ הוא איחוד של מספר בן מנייה של כדורים'
        feedback: >-
          זה נכון בכל מרחב מטרי: $X=\bigcup_{n}B(x_0,n)$. גם $B([0,1])$, שאינו ספרבילי, מקיים זאת. מה שכן שקול
          לספרביליות (טענה 4.4.5א): **לכל** $\varepsilon>0$, $X$ איחוד של מספר בן מנייה של כדורים ברדיוס $\varepsilon$.
        misconception: MC-c4-separable-countable

  - id: Q-4.4-which
    type: multi
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: basic
    prompt: >-
      אילו מהמרחבים הבאים ספרביליים? סמנו את כולם.
    choices:
      - text: '$\mathbb{R}^n$ עם $\|\cdot\|_1$'
        correct: true
        feedback: >-
          נכון. $\mathbb{Q}^n$ בת מנייה (מכפלה סופית של בנות מנייה) וצפופה: מקרבים כל קואורדינטה במספר רציונלי.
      - text: '$\mathbb{N}$ עם המטריקה הבדידה'
        correct: true
        feedback: 'נכון. המרחב עצמו בן מנייה וצפוף בעצמו.'
      - text: '$C[0,1]$ עם $\|\cdot\|_\infty$'
        correct: true
        feedback: >-
          נכון. הקווים השבורים עם נקודות שבירה $\frac km$ וערכים רציונליים בהן הם קבוצה בת מנייה, והם צפופים בגלל
          שכל $f\in C[0,1]$ רציפה במידה שווה (קנטור).
      - text: '$\mathbb{R}$ עם המטריקה הבדידה'
        feedback: >-
          במטריקה הבדידה $B(x,\frac12)=\{x\}$, ולכן קבוצה צפופה חייבת להכיל כל נקודה: היא כל $\mathbb{R}$, שאינו בן
          מנייה. ספרביליות תלויה במטריקה.
        misconception: MC-c4-separable-set-not-metric
      - text: '$[0,1]$ עם המטריקה הרגילה'
        correct: true
        feedback: >-
          נכון: $\mathbb{Q}\cap[0,1]$ צפופה. העובדה ש-$[0,1]$ אינו בן מנייה לא משנה.

  - id: Q-4.4-radius
    type: numeric
    objectives: [OBJ-4.4-3]
    level: basic
    prompt: >-
      ב-$B([0,1])$ עם נורמת הסופרמום, לכל $A\subseteq[0,1]$ נסמן ב-$\chi_A$ את הפונקציה המציינת של $A$. לכל
      $A\ne A'$ מתקיים $\|\chi_A-\chi_{A'}\|_\infty=1$. מהו הרדיוס $r$ **הגדול ביותר** כך שהכדורים הפתוחים
      $B(\chi_A,r)$ זרים בזוגות?
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. אם $g$ בשני כדורים ברדיוס $\frac12$ אז $1\le\|g-\chi_A\|+\|g-\chi_{A'}\|<1$, סתירה. ולכל
      $r>\frac12$ הנקודה $\frac{\chi_A+\chi_{A'}}{2}$ נמצאת במרחק $\frac12$ משני המרכזים.
    wrongFeedback: >-
      השתמשו באי-שוויון המשולש: נקודה בשני כדורים ברדיוס $r$ נותנת מרחק קטן מ-$2r$ בין המרכזים.
    commonWrong:
      - value: 1
        feedback: >-
          ברדיוס 1 הכדורים נחתכים: $\frac{\chi_A+\chi_{A'}}{2}$ נמצאת במרחק $\frac12$ משני המרכזים.
        misconception: MC-c4-ball-radius-distance

  - id: Q-4.4-cube
    type: numeric
    objectives: [OBJ-4.4-3]
    level: basic
    prompt: >-
      הגרסה הסופית של ההוכחה: ב-$\mathbb{R}^{10}$ עם $\|\cdot\|_\infty$, כמה וקטורים יש שכל הקואורדינטות שלהם 0 או 1?
      (המרחק בין כל שניים מהם הוא 1.)
    answer: 1024
    tolerance: 0.001
    correctFeedback: >-
      נכון: $2^{10}=1024$, שתי אפשרויות לכל קואורדינטה. כשהמימד אינסופי (סדרות של 0 ו-1) מקבלים קבוצה **לא בת מנייה**,
      וזה מה ששובר את הספרביליות של $\ell^\infty$. ב-$\mathbb{R}^{10}$ קבוצה סופית לא מפריעה.
    wrongFeedback: >-
      לכל אחת מעשר הקואורדינטות יש שתי אפשרויות, והבחירות בלתי תלויות.
    commonWrong:
      - value: 10
        feedback: >-
          10 הם רק וקטורי היחידה $e_1,\dots,e_{10}$. גם $(1,1,0,\dots,0)$ וכל שאר הבחירות במשפחה.
      - value: 20
        feedback: >-
          $2\cdot10$ מחבר את האפשרויות במקום לכפול אותן. הבחירות בקואורדינטות בלתי תלויות: $2\cdot2\cdots2=2^{10}$.

  - id: Q-4.4-subspace-rank
    type: rank
    objectives: [OBJ-4.4-2]
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה: אם $X$ ספרבילי ו-$A\subseteq X$, אז $A$ (עם אותה מטריקה) ספרבילי.
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: dense
        label: 'תהי $D=\{q_1,q_2,\dots\}$ צפופה ב-$X$'
      - id: pick
        label: 'לכל זוג $(k,m)\in\mathbb{N}^2$ שעבורו $B(q_k,\frac1m)\cap A\ne\emptyset$ בוחרים נקודה $a_{k,m}$ בחיתוך; הקבוצה $E$ של כל ה-$a_{k,m}$ לכל היותר בת מנייה'
      - id: approach
        label: 'כדי להראות ש-$E$ צפופה ב-$A$, יהיו $a\in A$ ו-$\varepsilon>0$; בוחרים $m$ עם $\frac2m<\varepsilon$ ו-$k$ עם $d(a,q_k)<\frac1m$'
      - id: exists
        label: 'אז $a\in B(q_k,\frac1m)\cap A$, ולכן $a_{k,m}$ הוגדר, ו-$d(a,a_{k,m})$ קטן מ-$\frac1m+\frac1m<\varepsilon$'
      - id: concl
        label: 'לכן $E\subseteq A$, לכל היותר בת מנייה, צפופה ב-$A$, ו-$A$ ספרבילי'
    order: [dense, pick, approach, exists, concl]
    correctFeedback: >-
      נכון. הטריק: לא לוקחים את $D\cap A$, שעלולה להיות ריקה, אלא בוחרים נקודה של $A$ ליד כל נקודה של $D$, בכל רזולוציה
      $\frac1m$.
    wrongFeedback: >-
      כל שלב משתמש במה שהוגדר בשלב שלפניו: הבחירה צריכה את $D$; ההוכחה שהקבוצה $E$ צפופה מדברת על $E$, ולכן באה אחרי
      שהיא נבנתה; ו-$a_{k,m}$ עם ה-$k,m$ של $a$ מופיע רק אחרי שבחרנו אותם.

  - id: Q-4.4-intersect
    type: twotier
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      טענה: אם $D$ צפופה ב-$X$ ו-$A\subseteq X$, אז $D\cap A$ צפופה ב-$A$. נכון או לא נכון?
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. לכן ההוכחה שתת-מרחב של מרחב ספרבילי ספרבילי צריכה בנייה, לא חיתוך.'
      - text: נכון
        feedback: >-
          החיתוך יכול להיות ריק לגמרי. ראו את הדוגמה בנימוק הנכון.
        misconception: MC-c4-dense-subset-restricts
    reasons:
      - text: '$X=\mathbb{R}$, $D=\mathbb{Q}$, $A=\mathbb{R}\setminus\mathbb{Q}$: $D\cap A=\emptyset$, שאינה צפופה ב-$A$'
        correct: true
        feedback: >-
          בדיוק. ובכל זאת $A$ ספרבילי: למשל $\{q+\sqrt2:\ q\in\mathbb{Q}\}\subseteq A$ בת מנייה וצפופה בו.
      - text: 'כל כדור ב-$A$ הוא כדור ב-$X$, ולכן הוא מכיל נקודה של $D$, והיא ב-$A$'
        feedback: >-
          הכדור ב-$A$ הוא $B(a,r)\cap A$. ב-$B(a,r)$ יש נקודה של $D$, אבל אין סיבה שתהיה ב-$A$: כל הנקודות של
          $\mathbb{Q}$ שליד $\sqrt2$ אינן ב-$\mathbb{R}\setminus\mathbb{Q}$.
        misconception: MC-c4-dense-subset-restricts
      - text: 'הטענה נכונה כש-$A$ פתוחה, ולכן תמיד'
        feedback: >-
          כש-$A$ פתוחה זה אכן נכון, כי אז $B(a,r)\subseteq A$ ל-$r$ קטן. ההכללה לכל $A$ נכשלת: $\mathbb{R}\setminus\mathbb{Q}$
          אינה פתוחה.
        misconception: MC-c4-dense-subset-restricts

  - id: Q-4.4-compact
    type: mc
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      איזה טיעון מוכיח שמרחב מטרי קומפקטי $K$ ספרבילי?
    choices:
      - text: 'לכל $k$ יש רשת סופית $F_k$ ברדיוס $\frac1k$ (חסימות כליל), ו-$\bigcup_kF_k$ לכל היותר בת מנייה וצפופה'
        correct: true
        feedback: >-
          נכון. איחוד בן מנייה של קבוצות סופיות הוא לכל היותר בן מנייה, ולכל $x$ ולכל $\varepsilon$ יש $k>\frac1\varepsilon$ ונקודה של
          $F_k$ במרחק קטן מ-$\frac1k<\varepsilon$.
      - text: 'מרחב קומפקטי בן מנייה, ולכן צפוף בעצמו'
        feedback: >-
          $[0,1]$ קומפקטי ואינו בן מנייה (קנטור). הקומפקטיות לא מגבילה את מספר הנקודות.
        misconception: MC-c4-separable-countable
      - text: 'מרחב קומפקטי שלם, ומרחב שלם ספרבילי'
        feedback: >-
          מרחב שלם אינו בהכרח ספרבילי: $B([0,1])$ שלם ואינו ספרבילי. מה שעובד הוא החלק השני של "שלם וחסום כליל".
        misconception: MC-c4-complete-separable

  - id: Q-4.4-polyline
    type: twotier
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: mid
    prompt: >-
      כדי להראות ש-$C[0,1]$ ספרבילי מקרבים $f$ בקו שבור $L_m$ שמסכים עם $f$ בנקודות $\frac km$, $k=0,\dots,m$. טענה:
      לכל $f\in C[0,1]$ ולכל $\varepsilon>0$ יש $m$ כך ש-$\|f-L_m\|_\infty<\varepsilon$. נכון או לא נכון?
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. אחר כך מזיזים את הערכים $f(\frac km)$ למספרים רציונליים קרובים, ומקבלים קבוצה בת מנייה.'
      - text: לא נכון
        feedback: >-
          הטענה נכונה לכל פונקציה רציפה על הקטע הסגור, בלי הנחת גזירות. ראו את הנימוק עם משפט קנטור.
        misconception: MC-c4-pointwise-delta-enough
    reasons:
      - text: 'קנטור: $f$ רציפה במידה שווה, ולכן יש $\delta$ אחד כך שבכל קטע $[\frac km,\frac{k+1}m]$ עם $\frac1m<\delta$ הערכים של $f$ ושל $L_m$ קרובים ל-$f(\frac km)$ עד $\frac\varepsilon2$'
        correct: true
        feedback: >-
          בדיוק. $L_m$ בקטע נמצא בין $f(\frac km)$ ל-$f(\frac{k+1}m)$, ושניהם במרחק פחות מ-$\frac\varepsilon2$ מכל ערך
          של $f$ שם. ה-$\delta$ המשותף לכל הקטעים בא מהרציפות במידה שווה.
      - text: 'בכל נקודה $x$ הרציפות נותנת $\delta(x)$, ולכן חלוקה עדינה מספיק מתאימה'
        feedback: >-
          חלוקה אחת צריכה להתאים לכל $x$ בבת אחת. עם $\delta(x)$ שונה לכל נקודה אין $m$ אחד, אלא אם $\inf_x\delta(x)>0$,
          וזה בדיוק רציפות במידה שווה.
        misconception: MC-c4-pointwise-delta-enough
      - text: 'כל פונקציה רציפה ליפשיצית, ולכן השגיאה לכל היותר $\frac{L}{m}$'
        feedback: >-
          $\sqrt x$ רציפה על $[0,1]$ ואינה ליפשיצית. הטענה נכונה, אבל צריך את קנטור, לא ליפשיץ.
        misconception: MC-c4-continuous-is-lipschitz

  - id: Q-4.4-nonsep-rank
    type: rank
    objectives: [OBJ-4.4-3]
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה ש-$\ell^\infty$ (הסדרות החסומות עם נורמת הסופרמום) אינו ספרבילי.
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: family
        label: 'תהי $S$ קבוצת הסדרות שכל איבריהן 0 או 1; לפי האלכסון של קנטור $S$ אינה בת מנייה'
      - id: far
        label: 'לכל $s\ne s''$ ב-$S$, $\|s-s''\|_\infty=1$, ולכן הכדורים $B(s,\frac12)$, $s\in S$, זרים בזוגות'
      - id: hit
        label: 'נניח בשלילה שיש ב-$\ell^\infty$ קבוצה צפופה לכל היותר בת מנייה, ונרשום אותה כסדרה $D=\{q_1,q_2,\dots\}$. כל אחד מהכדורים הזרים האלה מכיל נקודה של $D$; לכל $s\in S$ יהי $k(s)$ האינדקס הקטן ביותר עם $q_{k(s)}\in B(s,\frac12)$'
      - id: inject
        label: 'כיוון שהכדורים זרים, $s\mapsto k(s)$ חד-חד-ערכית מ-$S$ ל-$\mathbb{N}$, ו-$S$ לכל היותר בת מנייה: סתירה'
    order: [family, far, hit, inject]
    correctFeedback: >-
      נכון. אותה הוכחה עובדת ל-$B([0,1])$ עם הפונקציות המציינות $\chi_{\{x\}}$, $x\in[0,1]$: קבוצה לא בת מנייה של
      נקודות במרחק 1 זו מזו.
    wrongFeedback: >-
      כל שלב משתמש בקודם: המרחק מדבר על איברי $S$; הנקודות של $D$ נבחרות בכדורים הזרים, ולכן אחרי שהוכחנו שהם זרים;
      וההעתקה $s\mapsto k(s)$ מוגדרת רק אחרי ש-$k(s)$ הוגדר.

  - id: Q-4.4-bounded
    type: twotier
    objectives: [OBJ-4.4-3]
    qualitative: true
    level: mid
    prompt: >-
      האם $B([0,1])$, הפונקציות החסומות על $[0,1]$ עם נורמת הסופרמום, ספרבילי?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון, אף ש-$C[0,1]$, שיושב בתוכו, ספרבילי.'
      - text: כן
        feedback: >-
          הקבוצה הבת מנייה הצפופה של $C[0,1]$ לא מגיעה לפונקציות לא רציפות, ו-$B([0,1])$ מכיל קבוצה לא בת מנייה של
          נקודות רחוקות.
        misconception: MC-c4-superset-separable
    reasons:
      - text: 'הפונקציות המציינות $\chi_{\{x\}}$, $x\in[0,1]$: לא בני מנייה, והמרחק בין כל שניים 1; כדורים ברדיוס $\frac12$ סביבם זרים'
        correct: true
        feedback: >-
          בדיוק. כל קבוצה צפופה חייבת לפגוש כל אחד מהכדורים הזרים, ולכן אינה בת מנייה.
      - text: '$C[0,1]$ ספרבילי וצפוף ב-$B([0,1])$, ולכן גם $B([0,1])$ ספרבילי'
        feedback: >-
          $C[0,1]$ אינו צפוף ב-$B([0,1])$: הוא סגור בו (גבול במידה שווה של רציפות רציף) ושונה ממנו. למשל
          $\chi_{[0,1/2]}$ במרחק $\frac12$ לפחות מכל פונקציה רציפה (המרחק מ-$C[0,1]$ הוא בדיוק $\frac12$, למשל מהקבועה
          $\frac12$).
        misconception: MC-c4-continuous-dense-in-bounded
      - text: '$B([0,1])$ שלם, ולכן ספרבילי'
        feedback: >-
          שלמות אינה קשורה לספרביליות: $B([0,1])$ שלם ואינו ספרבילי, ו-$\mathbb{Q}$ ספרבילי ואינו שלם.
        misconception: MC-c4-complete-separable

  - id: Q-4.4-up-down
    type: multi
    objectives: [OBJ-4.4-2, OBJ-4.4-3]
    qualitative: true
    level: exam
    prompt: >-
      אילו מהטענות הבאות נכונות? סמנו את כולן.
    choices:
      - text: מרחב לא ספרבילי יכול להכיל תת-מרחב ספרבילי
        correct: true
        feedback: 'נכון: $C[0,1]\subseteq B([0,1])$, או סתם קבוצה בת מנייה בתוך כל מרחב.'
      - text: מרחב שמכיל תת-מרחב לא ספרבילי אינו ספרבילי
        correct: true
        feedback: >-
          נכון: זו השלילה של המשפט "תת-מרחב של ספרבילי ספרבילי". לכן כל מרחב שמכיל עותק של $\ell^\infty$ אינו ספרבילי.
      - text: '$C[0,1]$ עם $\|\cdot\|_1$ ספרבילי'
        correct: true
        feedback: >-
          נכון. $\|f\|_1\le\|f\|_\infty$ על $[0,1]$, ולכן קבוצה שצפופה בנורמת הסופרמום צפופה גם בנורמת האינטגרל: כדור
          בנורמה 1 מכיל כדור בנורמת הסופרמום.
      - text: מרחב שמכיל תת-מרחב ספרבילי ספרבילי
        feedback: >-
          $B([0,1])$ מכיל את $C[0,1]$ הספרבילי ואינו ספרבילי. ספרביליות עוברת רק לתת-מרחבים.
        misconception: MC-c4-superset-separable
      - text: '$\mathbb{R}$ עם המטריקה הבדידה ספרבילי, כי $\mathbb{Q}$ צפופה ב-$\mathbb{R}$'
        feedback: >-
          $\mathbb{Q}$ צפופה במטריקה הרגילה. במטריקה הבדידה $\{\sqrt2\}$ הוא כדור פתוח שלא פוגש את $\mathbb{Q}$.
        misconception: MC-c4-separable-set-not-metric

  - id: Q-4.4-image
    type: mc
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      יהיו $X$ מרחב מטרי ספרבילי, $Y$ מרחב מטרי ו-$f:X\to Y$ פונקציה **על**. איזו הנחה נוספת על $f$ מבטיחה ש-$Y$
      ספרבילי?
    choices:
      - text: '$f$ רציפה'
        correct: true
        feedback: >-
          נכון (טענה 4.4.3(ב)). אם $D$ צפופה ב-$X$, אז $f(D)$ לכל היותר בת מנייה, ולכל $y=f(x)$ ו-$r>0$ הרציפות ב-$x$
          נותנת $\delta$, ונקודה $q\in D$ עם $d(x,q)<\delta$ נשלחת לכדור $B(y,r)$.
      - text: '$f$ חד-חד-ערכית'
        feedback: >-
          חד-חד-ערכיות לא עוזרת. הזהות $([0,1],|x-y|)\to([0,1],d')$ עם $d'$ הבדידה היא חד-חד-ערכית ועל, התחום ספרבילי
          והטווח אינו: במטריקה הבדידה הקבוצה הצפופה היחידה היא כל $[0,1]$. מה שחסר הוא רציפות.
        misconception: MC-c4-separable-set-not-metric
      - text: 'אין צורך בהנחה נוספת: תמונה של קבוצה לכל היותר בת מנייה היא לכל היותר בת מנייה'
        feedback: >-
          $f(D)$ אכן לכל היותר בת מנייה, אבל אין סיבה שתהיה **צפופה** ב-$Y$. ראו את הזהות אל $[0,1]$ הבדיד: התמונה של
          $\mathbb{Q}\cap[0,1]$ היא $\mathbb{Q}\cap[0,1]$, שאינה צפופה במטריקה הבדידה.
        misconception: MC-c4-separable-countable
