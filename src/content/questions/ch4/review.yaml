# Chapter 4 review — the space C(K) (lessons 4.1–4.6), easy to hard.
# Every lesson is touched; most questions combine two or more lessons, several reach back to chapters 0–3.
# Each hint names the lesson to go back to and the numbered statement of .claude/ch4-spine.md.
# Core lessons are 4.1 and 4.5: a question about them never relies on the enrichment lessons 4.2–4.4, 4.6.
chapter: 4
questions:
  - id: Q-4-review-01
    type: multi
    objectives: [OBJ-4.1-2, OBJ-0.3-1]
    qualitative: true
    level: basic
    prompt: >-
      $f_n,f\in C(K)$, $K$ קומפקטי. אילו מהטענות הבאות **שקולות** ל"$f_n\to f$ במרחב $C(K)$"? סמנו את כולן.
    choices:
      - text: '$\max_{x\in K}|f_n(x)-f(x)|\to0$'
        correct: true
        feedback: 'נכון: זו ההגדרה, $\|f_n-f\|_\infty\to0$.'
      - text: '$f_n\to f$ במידה שווה על $K$'
        correct: true
        feedback: >-
          נכון: לכל $\varepsilon$ יש $N$ כך ש-$|f_n(x)-f(x)|<\varepsilon$ לכל $n>N$ ולכל $x$, וזה בדיוק
          $\|f_n-f\|_\infty<\varepsilon$ לכל $n>N$ (המקסימום מתקבל).
      - text: '$f_n(x)\to f(x)$ לכל $x\in K$'
        feedback: >-
          התכנסות נקודתית חלשה יותר: האוהלים $t_n$ של טענה 3.1.9(ב) שואפים ל-0 בכל נקודה, ו-$\|t_n\|_\infty=1$.
        misconception: MC-c4-pointwise-is-ck-convergence
      - text: '$\int_K|f_n-f|\to0$ (כש-$K=[0,1]$)'
        feedback: >-
          זו התכנסות בנורמת האינטגרל, חלשה יותר: אוהל בגובה 1 וברוחב $\frac2n$ שואף ל-0 בנורמה הזו (השטח $\frac1n$)
          ולא בנורמת הסופרמום.
        misconception: MC-c4-sup-vs-integral-norm
    hints:
      - 'חזרו לשיעור 4.1: התכנסות ב-$C(K)$ (טענה 4.1.3, ומשפט 1.5.10), ולשיעור 0.3: התכנסות במידה שווה.'

  - id: Q-4-review-02
    type: numeric
    objectives: [OBJ-4.1-1]
    level: basic
    prompt: >-
      ב-$C[0,2]$: מהו $\|f\|_\infty$ עבור $f(x)=xe^{-x}$? (תשובה עשרונית, בדיוק של שלוש ספרות.)
    answer: 0.36787944117144233
    tolerance: 0.001
    correctFeedback: >-
      נכון: $f'(x)=(1-x)e^{-x}$ מתאפסת ב-$x=1$, ו-$f(1)=\frac1e\approx0.368$. בקצוות $f(0)=0$ ו-$f(2)=2e^{-2}\approx0.271$,
      ו-$f\ge0$ על הקטע, ולכן $\max|f|=\frac1e$.
    wrongFeedback: >-
      מצאו את הנקודה הקריטית של $xe^{-x}$ בקטע, והשוו את הערך בה לערכים בקצוות.
    commonWrong:
      - value: 0.2706705664732254
        feedback: >-
          $2e^{-2}\approx0.271$ הוא הערך בקצה $x=2$. המקסימום בפנים, ב-$x=1$.
        misconception: MC-c4-max-at-endpoints
    hints:
      - 'חזרו לשיעור 4.1: הגדרה 4.1.1. הנורמה היא מקסימום שמתקבל (מסקנה 3.4.3), ומחשבים אותו כמו באינפי 1.'

  - id: Q-4-review-03
    type: twotier
    objectives: [OBJ-4.2-1, OBJ-1.6-3]
    qualitative: true
    level: basic
    prompt: >-
      טענה: כל אחת מהפונקציות $x^n$ **רציפה במידה שווה** על $[0,1]$, אבל המשפחה $\{x^n:\ n\in\mathbb{N}\}$ **אינה רציפה
      במידה אחידה** על $[0,1]$. נכון או לא נכון?
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. שני המונחים נבדלים במילה אחת ובכמת אחד: האם $\delta$ משותף לכל המשפחה.'
      - text: לא נכון
        feedback: >-
          שני החלקים נכונים: משפט קנטור לכל פונקציה בנפרד, ו-$\varepsilon=\frac12$ עם הנקודות $1$ ו-$1-\frac\delta2$
          למשפחה.
        misconception: MC-c4-equi-vs-uniform
    reasons:
      - text: 'לכל $n$ יש $\delta_n$ (קנטור), אבל אין $\delta$ אחד לכל $n$: לכל $\delta\in(0,1]$ יש $n$ עם $1-(1-\frac\delta2)^n\ge\frac12$'
        correct: true
        feedback: >-
          בדיוק. $(1-\frac\delta2)^n\to0$, ולכן עבור $n$ גדול הנקודות $1$ ו-$1-\frac\delta2$, במרחק $\frac\delta2<\delta$,
          נותנות הפרש של לפחות $\frac12$. רציפות במידה אחידה הייתה דורשת $\delta$ אחד שמתאים לכל $n$.
      - text: 'רציפה במידה שווה ורציפה במידה אחידה הם אותו מושג, ולכן הטענה סותרת את עצמה'
        feedback: >-
          הם שני מושגים: הראשון על פונקציה אחת, השני על משפחה. הטענה עקבית ונכונה.
        misconception: MC-c4-equi-vs-uniform
      - text: 'המשפחה חסומה ב-1, ולכן היא כן רציפה במידה אחידה'
        feedback: >-
          חסימות אינה גוררת רציפות במידה אחידה, ו-$\{x^n\}$ היא בדיוק הדוגמה.
        misconception: MC-c4-bounded-family-equicontinuous
    hints:
      - 'חזרו לשיעור 4.2: הגדרה 4.2.1 וטענה 4.2.7(ב), ולשיעור 3.4: משפט קנטור (משפט 3.4.6); ההבדל מרציפות במידה שווה (שיעור 1.6).'

  - id: Q-4-review-04
    type: mc
    objectives: [OBJ-4.4-1, OBJ-4.4-3]
    qualitative: true
    level: basic
    prompt: >-
      איזה מהמרחבים הבאים **אינו** ספרבילי?
    choices:
      - text: '$\ell^\infty$, הסדרות החסומות עם נורמת הסופרמום'
        correct: true
        feedback: >-
          נכון. הסדרות שאיבריהן 0 או 1 הן קבוצה לא בת מנייה של נקודות במרחק 1 זו מזו, ולפי למה 4.4.7 אין במרחב קבוצה
          צפופה בת מנייה.
      - text: '$C[0,1]$ עם נורמת הסופרמום'
        feedback: >-
          ספרבילי: הקווים השבורים עם צמתים וערכים רציונליים (טענה 4.4.2(ג)), או הפולינומים עם מקדמים רציונליים, צפופים.
          העובדה שהוא ממימד אינסופי ואינו בן מנייה לא משנה.
        misconception: MC-c4-separable-countable
      - text: '$\mathbb{R}^3$ עם $\|\cdot\|_\infty$'
        feedback: 'ספרבילי: $\mathbb{Q}^3$ צפופה בכל אחת מהנורמות $\|\cdot\|_1,\|\cdot\|_2,\|\cdot\|_\infty$.'
        misconception: MC-c4-separable-countable
      - text: '$[0,1]$, שאינו בן מנייה'
        feedback: >-
          ספרבילי: $\mathbb{Q}\cap[0,1]$ צפופה. ספרבילי אינו "בן מנייה".
        misconception: MC-c4-separable-countable
    hints:
      - 'חזרו לשיעור 4.4: הגדרה 4.4.1, מרחבי המבחן (טענה 4.4.2), קבוצה מופרדת שאינה בת מנייה (למה 4.4.7) ו-$\ell^\infty$ (טענה 4.4.8(ב)).'

  - id: Q-4-review-05
    type: numeric
    objectives: [OBJ-4.2-2, OBJ-4.3-3]
    level: mid
    prompt: >-
      $\mathcal{F}$ קבוצת הפונקציות $f\in C^1[0,1]$ עם $|f(0)|\le1$ ועם $|f'(t)|\le1$ לכל $t$. הראו ש-$\mathcal{F}$ קומפקטית יחסית ב-$C[0,1]$, וחשבו
      את $\sup_{f\in\mathcal{F}}\|f\|_\infty$.
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי משפט הערך הממוצע $|f(x)|$ קטן מ-$|f(0)|+|x|\cdot\max|f'|$ או שווה לו, וזה לכל היותר 2, ו-$f(x)=1+x$ במשפחה ומגיעה ל-2. החסם על
      הנגזרות נותן קבוע ליפשיץ משותף 1, ולכן רציפות במידה אחידה (טענה 4.2.5); עם החסם 2 זו משפחה חסומה, ולפי
      ארצלה-אסקולי היא קומפקטית יחסית.
    wrongFeedback: >-
      משפט הערך הממוצע: $|f(x)-f(0)|\le|x|$. הוסיפו את $|f(0)|$.
    commonWrong:
      - value: 1
        feedback: >-
          $|f(0)|\le1$ חוסם רק את הערך ב-0. הפונקציה $1+x$ במשפחה ומגיעה ל-2.
        misconception: MC-c4-pointwise-bounded-uniform
    hints:
      - 'חזרו לשיעור 4.2: חסם משותף לנגזרות (טענה 4.2.5(ב)), ולשיעור 4.3: משפט ארצלה-אסקולי (משפט 4.3.7) וטענה 4.3.11(א).'

  - id: Q-4-review-06
    type: twotier
    objectives: [OBJ-4.1-3, OBJ-4.3-1]
    qualitative: true
    level: mid
    prompt: >-
      בשיעור 4.1 ראיתם שכדור היחידה הסגור של $C[0,1]$ אינו קומפקטי. איזו הנחה של ארצלה-אסקולי הוא מפר?
    choices:
      - text: רציפות במידה אחידה
        correct: true
        feedback: 'נכון. הוא חסום (ב-1) וסגור, אבל אינו רציף במידה אחידה.'
      - text: חסימות
        feedback: '$\|f\|_\infty\le1$ לכל $f$ בכדור: הוא חסום.'
        misconception: MC-c4-aa-hypothesis-role
    reasons:
      - text: 'הכדור מכיל את $\{x^n\}$ (או את האוהלים $t_n$), שאינה רציפה במידה אחידה; קבוצה שמכילה משפחה כזו אינה רציפה במידה אחידה'
        correct: true
        feedback: >-
          בדיוק: תת-משפחה של משפחה רציפה במידה אחידה רציפה במידה אחידה (טענה 4.2.3(ג)). ולפי הכיוון (i)⇒(ii) של
          ארצלה-אסקולי, קבוצה קומפקטית ב-$C[0,1]$ חייבת להיות רציפה במידה אחידה.
      - text: 'כל פונקציה בכדור רציפה במידה שווה, ולכן הבעיה בחסימות'
        feedback: >-
          כל פונקציה בכדור אכן רציפה במידה שווה (קנטור), אבל זה לא נותן $\delta$ משותף לכל הכדור.
        misconception: MC-c4-equi-vs-uniform
      - text: 'הכדור אינו סגור, כי $x^n$ מתכנסת לפונקציה לא רציפה'
        feedback: >-
          כדור סגור סגור. $x^n$ אינה מתכנסת ב-$C[0,1]$ בכלל; הגבול הנקודתי שלה אינו גבול בנורמה.
        misconception: MC-c4-pointwise-is-ck-convergence
    hints:
      - 'חזרו לשיעור 4.1: כדור היחידה אינו קומפקטי (טענה 4.1.9(א)), לשיעור 4.2: $x^n$ (טענה 4.2.7(ב)) ותת-משפחות (טענה 4.2.3(ג)), ולשיעור 4.3: משפט 4.3.7.'

  - id: Q-4-review-07
    type: mc
    objectives: [OBJ-4.3-2, OBJ-4.4-2]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחת ארצלה-אסקולי מפעילים שיטת אלכסון על קבוצה צפופה $D\subseteq K$. למה חשוב ש-$D$ תהיה **בת מנייה**, ומה
      מבטיח שיש כזו?
    choices:
      - text: 'שיטת האלכסון עוברת על נקודות $D$ אחת אחרי השנייה; $D$ קיימת כי מרחב קומפקטי ספרבילי'
        correct: true
        feedback: >-
          נכון. הבנייה בונה תת-סדרה $S_k$ לנקודה ה-$k$, ובוחרת את האיבר ה-$k$ של $S_k$. קבוצה לא בת מנייה אי אפשר לסדר
          כך. ספרביליות של קומפקטי באה מחסימות כליל: איחוד של רשתות סופיות ברדיוסים $\frac1j$ (למה 4.3.4).
      - text: 'כי $C(K)$ ספרבילי'
        feedback: >-
          ההוכחה צריכה קבוצה צפופה ב-$K$, התחום, לא ב-$C(K)$. ($C(K)$ אכן ספרבילי, אבל זה לא מה שנדרש כאן.)
        misconception: MC-c4-aa-hypothesis-role
      - text: 'כי $K$ בן מנייה'
        feedback: >-
          $K=[0,1]$ אינו בן מנייה. מה שבן מנייה הוא תת-קבוצה צפופה, למשל $\mathbb{Q}\cap[0,1]$.
        misconception: MC-c4-separable-countable
      - text: 'כי התכנסות על $D$ גוררת לבד התכנסות במידה שווה'
        feedback: >-
          לא: $\sin(k!\,\pi x)$ מתכנסת ל-0 בכל רציונלי של $[0,1]$ (מ-$k$ גדול מספיק $k!\,x$ שלם) ולא במידה שווה, כי
          $\|\sin(k!\,\pi x)\|_\infty=1$. בשביל המעבר מ-$D$ לכל $K$ צריך רציפות במידה אחידה (למה 4.2.10).
        misconception: MC-c4-dense-convergence-enough
    hints:
      - 'חזרו לשיעור 4.3: קבוצה צפופה בת מנייה (למה 4.3.4) ושיטת האלכסון (למה 4.3.6), לשיעור 4.2: למה 4.2.10, ולשיעור 4.4: משפט 4.4.5.'

  - id: Q-4-review-08
    type: numeric
    objectives: [OBJ-4.5-2]
    level: basic
    prompt: >-
      $B_n(x^2)=x^2+\frac{x(1-x)}{n}$. מהי השגיאה $B_5(x^2)-x^2$ בנקודה $x=\frac13$? (שבר מותר.)
    answer: 0.044444444444444446
    tolerance: 0.001
    correctFeedback: >-
      נכון: $\frac{\frac13\cdot\frac23}{5}=\frac{2}{45}\approx0.0444$. השגיאה הגדולה ביותר ב-$n=5$ היא $\frac1{20}$, באמצע.
    wrongFeedback: >-
      הציבו $x=\frac13$ ו-$n=5$ ב-$\frac{x(1-x)}{n}$.
    commonWrong:
      - value: 0.05
        feedback: >-
          $\frac1{20}=\frac1{4n}$ היא השגיאה ב-$x=\frac12$, המקסימלית. השאלה על $x=\frac13$.
      - value: 0
        feedback: >-
          פולינום ברנשטיין אינו מסכים עם $f$ בנקודות החלוקה: ל-$x^2$ ההפרש $\frac{x(1-x)}{n}$ מתאפס רק ב-0 וב-1.
          (ו-$\frac13$ אינה נקודת חלוקה $\frac k5$ בכלל.)
        misconception: MC-c4-bernstein-interpolates
    hints:
      - 'חזרו לשיעור 4.5: פולינומי ברנשטיין של $x^2$ (למה 4.5.2) והשגיאה $\frac{x(1-x)}{n}$ (טענה 4.5.6(א)).'

  - id: Q-4-review-09
    type: twotier
    objectives: [OBJ-4.5-1, OBJ-2.2-1]
    qualitative: true
    level: mid
    prompt: >-
      האם קבוצת הפולינומים על $[0,1]$, עם נורמת הסופרמום, היא מרחב שלם?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. היא תת-מרחב לא סגור של המרחב השלם $C[0,1]$.'
      - text: כן
        feedback: >-
          $C[0,1]$ שלם, אבל תת-מרחב שלו שלם רק אם הוא סגור בו. הפולינומים אינם סגורים.
        misconception: MC-c4-poly-limit-poly
    reasons:
      - text: 'תת-מרחב שלם של מרחב מטרי סגור בו (משפט 2.2.1(ב)); לפי ויירשטראס הסגור של הפולינומים הוא כל $C[0,1]$, והם אינם כל $C[0,1]$'
        correct: true
        feedback: >-
          בדיוק. אפשר גם בלי ויירשטראס (טענה 4.1.8(א)): $\sum_{k\le n}\frac{x^k}{k!}$ היא סדרת קושי של פולינומים
          שהגבול שלה ב-$C[0,1]$, $e^x$, אינו פולינום.
      - text: 'כל תת-מרחב של מרחב שלם שלם'
        feedback: >-
          רק תת-מרחב **סגור**. $(0,1)$ בתוך $\mathbb{R}$ אינו שלם.
        misconception: MC-c2-subset-of-complete
      - text: 'גבול במידה שווה של פולינומים הוא פולינום, ולכן הם סגורים ושלמים'
        feedback: >-
          על קטע זה לא נכון: $e^x$ היא גבול במידה שווה של פולינומי טיילור שלה על $[0,1]$.
        misconception: MC-c4-poly-limit-poly
    hints:
      - 'חזרו לשיעור 2.2: תת-מרחב שלם סגור (משפט 2.2.1(ב), מסקנה 2.2.2), לשיעור 4.1: הפולינומים אינם סגורים (טענה 4.1.8(א)), ולשיעור 4.5: מסקנה 4.5.5.'

  - id: Q-4-review-10
    type: mc
    objectives: [OBJ-4.6-2, OBJ-4.4-1]
    qualitative: true
    level: mid
    prompt: >-
      הפונקציות הרציפות ה-$2\pi$-מחזוריות $\mathbb{R}\to\mathbb{R}$, עם נורמת הסופרמום, הן מרחב ספרבילי. איזו קבוצה בת
      מנייה צפופה בו?
    choices:
      - text: 'הפולינומים הטריגונומטריים עם מקדמים רציונליים'
        correct: true
        feedback: >-
          נכון. הפולינומים הטריגונומטריים צפופים (מסקנה 4.6.8), ו-$|\cos kx|,|\sin kx|\le1$, אז החלפת המקדמים הממשיים
          ברציונליים קרובים משנה את הפונקציה לכל היותר בסכום ההפרשים במקדמים. הקבוצה בת מנייה: איחוד על $N$ של
          קבוצות שבנות מנייה כמו $\mathbb{Q}^{2N+1}$.
      - text: 'הפולינומים (באלגברי) עם מקדמים רציונליים, מוגבלים ל-$[-\pi,\pi]$'
        feedback: >-
          פולינום שאינו קבוע אינו מחזורי, ולכן אינו במרחב. (הם כן צפופים ב-$C[-\pi,\pi]$, מרחב אחר.)
        misconception: MC-c4-periodic-interval
      - text: 'כל הפולינומים הטריגונומטריים'
        feedback: >-
          צפופים כן, בני מנייה לא: כבר הקבועים $c\in\mathbb{R}$ אינם בני מנייה.
        misconception: MC-c4-separable-countable
      - text: '$\{\cos kx,\ \sin kx:\ k\in\mathbb{N}\}$'
        feedback: >-
          בת מנייה, אבל לא צפופה: למשל הקבוע 2 נמצא במרחק 1 לפחות מכל אחת מהן. צריך את כל הצירופים הלינאריים, עם
          מקדמים רציונליים.
        misconception: MC-c4-integer-polys-dense
    hints:
      - 'חזרו לשיעור 4.6: הפולינומים הטריגונומטריים (מסקנה 4.6.8) ו-$C(K)$ ספרבילי (מסקנה 4.6.9), ולשיעור 4.4: הגדרה 4.4.1.'

  - id: Q-4-review-11
    type: numeric
    objectives: [OBJ-4.3-3, OBJ-4.2-2]
    level: mid
    prompt: >-
      $(Tf)(x)=\int_0^1\sin(xt)f(t)\,dt$ על $C[0,1]$. לכל $f$ עם $\|f\|_\infty\le1$, ההערכה $|\sin(xt)-\sin(yt)|\le t|x-y|$
      (משפט הערך הממוצע) נותנת $|Tf(x)-Tf(y)|\le L|x-y|$. מהו הקבוע $L$ שמתקבל כך?
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון: $$\begin{aligned}&|Tf(x)-Tf(y)|\\&\ \le\int_0^1t|x-y|\cdot|f(t)|\,dt\\&\ \le|x-y|\int_0^1t\,dt=\tfrac12|x-y| .\end{aligned}$$ עם $|Tf|\le1$, התמונה של כדור
      היחידה חסומה וליפשיצית עם קבוע משותף $\frac12$: קומפקטית יחסית לפי ארצלה-אסקולי.
    wrongFeedback: >-
      הכניסו את ההערכה לתוך האינטגרל, השתמשו ב-$|f(t)|\le1$, וחשבו את $\int_0^1t\,dt$.
    commonWrong:
      - value: 1
        feedback: >-
          $L=1$ מתקבל מ-$t\le1$, וזה נכון אבל גס יותר. ההערכה שבשאלה שומרת את $t$ בתוך האינטגרל ונותנת $\frac12$.
    hints:
      - 'חזרו לשיעור 4.3: אופרטורים אינטגרליים מעבירים את כדור היחידה לקבוצה קומפקטית יחסית (טענה 4.3.11(ג)), ולשיעור 4.2: קבוע ליפשיץ משותף (טענה 4.2.5(א)).'

  - id: Q-4-review-12
    type: numeric
    objectives: [OBJ-4.4-3, OBJ-0.3-2]
    level: exam
    prompt: >-
      ב-$B([0,1])$ עם נורמת הסופרמום: מהו המרחק של $\mathbf{1}_{[0,1/2]}$ (1 על $[0,\frac12]$ ו-0 אחריו) מהתת-מרחב $C[0,1]$?
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. לכל $g$ רציפה עם $c=g(\frac12)$: ב-$\frac12$ ההפרש $|1-c|$, ומימין ל-$\frac12$ ההפרשים $|g(x)|\to|c|$, ולכן
      $\|\mathbf{1}_{[0,1/2]}-g\|_\infty$ לפחות $\max(|1-c|,|c|)$, וזה לפחות $\frac12$. הקבוע $\frac12$ משיג את זה. לכן $C[0,1]$ אינו צפוף
      ב-$B([0,1])$.
    wrongFeedback: >-
      תהי $g$ רציפה ו-$c=g(\frac12)$. השוו את ההפרש ב-$\frac12$ עצמה ובנקודות קרובות מימין.
    commonWrong:
      - value: 0
        feedback: >-
          0 היה אומר ש-$\mathbf{1}_{[0,1/2]}$ גבול במידה שווה של רציפות, ואז היא הייתה רציפה (למה 2.2.5).
        misconception: MC-c4-continuous-dense-in-bounded
      - value: 1
        feedback: >-
          1 הוא המרחק מ-$g\equiv0$ או מ-$g\equiv1$. הקבוע $\frac12$ קרוב יותר: ההפרש ממנו הוא $\frac12$ בכל נקודה.
    hints:
      - 'חזרו לשיעור 4.4: $B([0,1])$ אינו ספרבילי (טענה 4.4.8(א)), ולשיעור 2.2: גבול במידה שווה של רציפות רציף (למה 2.2.5; שיעור 0.3).'

  - id: Q-4-review-13
    type: twotier
    objectives: [OBJ-4.6-3, OBJ-4.5-1]
    qualitative: true
    level: exam
    prompt: >-
      ב-$C[-1,1]$: הפולינומים ב-$x^2$ אינם צפופים. האם הפולינומים ב-$x^3$ (כלומר $q(x^3)$ עם $q$ פולינום) צפופים?
    choices:
      - text: כן
        correct: true
        feedback: 'נכון. ההבדל הוא הפרדת נקודות.'
      - text: לא
        feedback: >-
          שתי האלגברות נראות דומות, אבל $x^3$ חד-חד-ערכית על $[-1,1]$ ו-$x^2$ לא.
        misconception: MC-c4-sw-separation-forgotten
    reasons:
      - text: 'תת-אלגברה עם הקבועים, ו-$x^3$ חד-חד-ערכית על $[-1,1]$, ולכן מפרידה נקודות (סטון-ויירשטראס)'
        correct: true
        feedback: >-
          בדיוק. אפשר גם בלי סטון-ויירשטראס: $u\mapsto f(\sqrt[3]{u})$ רציפה על $[-1,1]$; אם הפולינום $p$ קרוב אליה עד
          כדי $\varepsilon$ שם (ויירשטראס), אז $p(x^3)$ קרוב ל-$f$ עד כדי $\varepsilon$, כי $x^3$ עוברת על כל $[-1,1]$.
      - text: 'כי $x$ אינו פולינום ב-$x^3$, האלגברה אינה צפופה'
        feedback: >-
          צפיפות היא קירוב, לא שייכות: $x=\sqrt[3]{x^3}$, ו-$\sqrt[3]{u}$ רציפה על $[-1,1]$ ולכן מקורבת בפולינומים
          ב-$u$; ההצבה $u=x^3$ נותנת קירוב של $x$ בפולינומים ב-$x^3$.
        misconception: MC-c4-dense-means-contains
      - text: 'כל אלגברה עם הקבועים צפופה, ולכן גם הפולינומים ב-$x^2$ צפופים'
        feedback: >-
          הפולינומים ב-$x^2$ אינם צפופים ב-$C[-1,1]$: כולם זוגיים, ו-$x$ במרחק 1 מהם.
        misconception: MC-c4-sw-separation-forgotten
    hints:
      - 'חזרו לשיעור 4.6: משפט סטון-ויירשטראס (משפט 4.6.6) והפולינומים הזוגיים (טענה 4.6.10(ב)), ולשיעור 4.5: מסקנה 4.5.5.'

  - id: Q-4-review-14
    type: twotier
    objectives: [OBJ-4.3-3, OBJ-4.1-2]
    qualitative: true
    level: exam
    prompt: >-
      $f_n\in C[0,1]$ עם $|f_n|\le1$ ו-$|f_n(x)-f_n(y)|\le|x-y|$ לכל $n,x,y$, ו-$f_n(x)\to f(x)$ לכל $x$. האם בהכרח
      $f_n\to f$ במידה שווה?
    choices:
      - text: כן
        correct: true
        feedback: 'נכון. כאן התכנסות נקודתית כן גוררת התכנסות במידה שווה, בזכות הרציפות במידה אחידה.'
      - text: לא
        feedback: >-
          בדרך כלל התכנסות נקודתית אינה במידה שווה, אבל כאן יש חסימות ורציפות במידה אחידה. ראו את טיעון "תת-תת-סדרה".
        misconception: MC-c4-pointwise-is-ck-convergence
    reasons:
      - text: 'אם לא, יש $\varepsilon$ ותת-סדרה עם $\|f_{n_k}-f\|_\infty\ge\varepsilon$; לפי ארצלה-אסקולי יש לה תת-תת-סדרה מתכנסת במידה שווה, והגבול חייב להיות $f$: סתירה'
        correct: true
        feedback: >-
          בדיוק. הגבול במידה שווה של תת-תת-הסדרה שווה לגבול הנקודתי $f$, ולכן המרחק שלה מ-$f$ שואף ל-0, בסתירה
          ל-$\ge\varepsilon$. (דרך ישירה: למה 4.2.10 עם $D=K$.)
      - text: 'ארצלה-אסקולי אומר שהסדרה כולה מתכנסת במידה שווה'
        feedback: >-
          המשפט נותן רק תת-סדרה; $(-1)^n$ מראה שהסדרה כולה לא חייבת להתכנס. כאן ההתכנסות הנקודתית היא שמשלימה את הטיעון.
        misconception: MC-c4-aa-whole-sequence
      - text: 'על קטע קומפקטי התכנסות נקודתית לגבול רציף תמיד במידה שווה'
        feedback: >-
          האוהלים $t_n$ של טענה 3.1.9(ב) שואפים נקודתית לאפס ולא במידה שווה. בלי רציפות במידה אחידה זה נכשל.
        misconception: MC-c4-pointwise-is-ck-convergence
    hints:
      - 'חזרו לשיעור 4.3: משפט ארצלה-אסקולי (משפט 4.3.7), לשיעור 4.2: למה 4.2.10, ולשיעור 4.1: התכנסות ב-$C(K)$ (טענה 4.1.3).'

  - id: Q-4-review-15
    type: numeric
    objectives: [OBJ-4.1-3, OBJ-1.8-2]
    level: exam
    prompt: >-
      על $C[0,1]$ עם נורמת הסופרמום נגדיר $\varphi(f)=\int_0^1 f(x)\,dx-f(1)$. זהו פונקציונל לינארי, והקבוצה
      $Z=\{f:\ \varphi(f)=0\}$ סגורה ברגע שמראים ש-$|\varphi(f)-\varphi(g)|\le L\|f-g\|_\infty$ לכל $f,g$. מהו הקבוע $L$
      **הקטן ביותר** שמקיים זאת, כלומר $\|\varphi\|_{\mathrm{op}}$?
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $|\varphi(f)|\le\int_0^1|f|+|f(1)|$, וזה לכל היותר $2\|f\|_\infty$, ולכן $L=2$ מתאים. ואין קטן ממנו: $f_\eta$ ששווה 1 על
      $[0,1-\eta]$ ויורדת לינארית עד $f_\eta(1)=-1$ מקיימת $\|f_\eta\|_\infty=1$ ו-$\varphi(f_\eta)=(1-\eta)+1=2-\eta$. הערך 2
      עצמו אינו מתקבל: $\varphi(f)=2$ עם $\|f\|_\infty\le1$ היה מחייב $\int_0^1 f=1$, כלומר $f\equiv1$, וגם $f(1)=-1$.
    wrongFeedback: >-
      חסמו כל אחד משני המחוברים ב-$\|f\|_\infty$. אחר כך חפשו פונקציה עם נורמה 1 שבה שני המחוברים כמעט מגיעים לחסם יחד:
      שווה 1 כמעט בכל הקטע, ועם $f(1)=-1$.
    commonWrong:
      - value: 1
        feedback: >-
          1 הוא $\varphi(1-2x)$, או הנורמה של כל מחובר לבד (טענה 1.8.12). בנורמת הסופרמום הערך בנקודה 1 כמעט אינו
          משפיע על האינטגרל, ולכן אפשר לקבל את שני החסמים כמעט יחד.
    hints:
      - 'חזרו לשיעור 4.1: קבוצות סגורות דרך העתקות ליפשיציות (טענה 4.1.7(א),(ב)), ולשיעור 1.8: נורמת אופרטור (הגדרה 1.8.3) ופונקציונלי האינטגרל והערך בנקודה (טענה 1.8.12).'

  - id: Q-4-review-16
    type: twotier
    objectives: [OBJ-4.3-3, OBJ-4.1-1, OBJ-3.1-3]
    qualitative: true
    level: mid
    prompt: >-
      $K=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$ עם המטריקה של הישר, ו-$B=\{f\in C(K):\ \|f\|_\infty\le1\}$. האם $B$
      קומפקטית ב-$C(K)$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. $B$ סגורה וחסומה, ובכל זאת אינה קומפקטית: היא אינה רציפה במידה אחידה בנקודה 0.'
      - text: כן
        feedback: >-
          $K$ קומפקטי ו-$B$ סגורה וחסומה, אבל ב-$C(K)$ אין היינה-בורל: ארצלה-אסקולי דורש גם רציפות במידה אחידה.
        misconception: MC-c4-closed-bounded-compact
    reasons:
      - text: 'עם $e_k$ ששווה 1 בנקודה $\frac1k$ ו-0 בשאר $K$: $e_k\in B$, ו-$\|e_j-e_k\|_\infty=1$ לכל $j\ne k$, ולכן אין תת-סדרה מתכנסת'
        correct: true
        feedback: >-
          בדיוק. $e_k$ רציפה: $\frac1k$ נקודה מבודדת, ו-$e_k=0$ על $B(0,\frac1k)\cap K$. לפי למה 3.1.4 לסדרה המופרדת אין
          תת-סדרה מתכנסת. ההנחה שנכשלת: $|e_k(\frac1k)-e_k(0)|=1$ אף ש-$\frac1k\to0$. דרך טענה 4.1.2(ב): $C(K)$ הוא
          מרחב הסדרות המתכנסות, ו-$e_k$ הן סדרות היחידה.
      - text: 'כל $f\in C(K)$ רציפה במידה שווה (קנטור), ולכן $B$ רציפה במידה אחידה וקומפקטית לפי ארצלה-אסקולי'
        feedback: >-
          כל פונקציה לבדה רציפה במידה שווה, אבל ה-$\delta$ של $e_k$ עבור $\varepsilon=\frac12$ חייב להיות לכל היותר
          $\frac1k$: אין $\delta$ אחד לכל $B$.
        misconception: MC-c4-equi-vs-uniform
      - text: '$C(K)$ איזומטרי ל-$(\mathbb{R}^n,\|\cdot\|_\infty)$, ושם כדור היחידה הסגור קומפקטי'
        feedback: >-
          זה נכון רק ל-$K$ סופי (טענה 4.1.2(א)). כאן $K$ אינסופי, $C(K)$ ממימד אינסופי ($e_1,e_2,\dots$ בלתי תלויות
          לינארית), ולפי משפט 3.5.10 כדור היחידה שלו אינו קומפקטי.
        misconception: MC-c3-unit-ball-always-compact
    hints:
      - 'חזרו לשיעור 4.1: מרחב המבחן $K=\{0\}\cup\{\frac1n\}$ (טענה 4.1.2(ב)), לשיעור 3.1: סדרה מופרדת (למה 3.1.4), ולשיעור 4.3: משפט ארצלה-אסקולי (משפט 4.3.7).'

  - id: Q-4-review-17
    type: twotier
    objectives: [OBJ-4.5-1, OBJ-1.6-3, OBJ-3.4-2]
    qualitative: true
    level: exam
    prompt: >-
      האם יש סדרת פולינומים $p_n$ שמתכנסת ל-$\sin\frac1x$ במידה שווה על הקטע הפתוח $(0,1)$?
    choices:
      - text: לא
        correct: true
        feedback: 'נכון. משפט ויירשטראס הוא על קטע סגור וחסום, ועל $(0,1)$ המסקנה באמת נכשלת.'
      - text: כן
        feedback: >-
          $\sin\frac1x$ רציפה וחסומה על $(0,1)$, אבל משפט ויירשטראס דורש קטע סגור וחסום, ואין לה הרחבה רציפה
          ל-$[0,1]$.
        misconception: MC-c4-weierstrass-noncompact
    reasons:
      - text: 'כל פולינום רציף במידה שווה על $(0,1)$; גבול במידה שווה של פונקציות רציפות במידה שווה רציף במידה שווה; ו-$\sin\frac1x$ אינה רציפה במידה שווה על $(0,1)$'
        correct: true
        feedback: >-
          בדיוק. פולינום רציף על $[0,1]$ ולכן רציף בו במידה שווה (משפט 3.4.6), ובפרט על $(0,1)$. השלב האמצעי הוא
          $\frac\varepsilon3$: בוחרים $n$ עם $\sup_{(0,1)}|p_n-f|<\frac\varepsilon3$, ורק אחר כך $\delta$ של $p_n$. ולבסוף
          $\sin\frac1x=1$ ב-$\frac1{2\pi k+\pi/2}$ ו-$\sin\frac1x=-1$ ב-$\frac1{2\pi k-\pi/2}$, נקודות שהמרחק ביניהן שואף ל-0.
      - text: 'על כל $[\frac1m,1]$ יש פולינום קרוב לפי ויירשטראס, ו-$m\to\infty$ נותן קירוב על כל $(0,1)$'
        feedback: >-
          הפולינום שמתאים ל-$[\frac1m,1]$ יכול להיות רחוק מ-$f$ ליד 0: קירובים על קטעים שגדלים אינם קירוב במידה שווה על
          האיחוד. וכאן אין שום קירוב כזה, לפי הטיעון הנכון.
        misconception: MC-c4-weierstrass-noncompact
      - text: 'פונקציה רציפה וחסומה על קטע חסום רציפה בו במידה שווה, ולכן אפשר להרחיב את $\sin\frac1x$ ל-$[0,1]$ ולהפעיל את ויירשטראס'
        feedback: >-
          $\sin\frac1x$ רציפה וחסומה על $(0,1)$ ואינה רציפה בו במידה שווה (טענה 3.4.7(ג)), ואין לה הרחבה רציפה ל-0:
          הגבול ב-0 אינו קיים.
        misconception: MC-c3-uniform-without-compact
    hints:
      - 'חזרו לשיעור 4.5: מה המשפט אינו אומר (טענה 4.5.6(ב)), לשיעור 3.4: $\sin\frac1x$ (טענה 3.4.7(ג)) ומשפט קנטור (משפט 3.4.6), ולשיעור 1.6: רציפות במידה שווה.'

  - id: Q-4-review-18
    type: rank
    objectives: [OBJ-4.2-1, OBJ-3.4-2, OBJ-4.1-2]
    level: exam
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    prompt: >-
      ההוכחה של "$K$ מרחב מטרי קומפקטי, $f_n\in C(K)$ ו-$f_n\to f$ בנורמת הסופרמום, ולכן המשפחה $\{f_n:\ n\in\mathbb{N}\}$
      רציפה במידה אחידה" התפרקה לשלבים. סדרו אותם.
    items:
      - id: eps
        label: 'יהי $\varepsilon>0$. מההתכנסות בנורמה יש $N$ עם $\|f_n-f\|_\infty<\frac\varepsilon3$ לכל $n>N$.'
      - id: limit
        label: '$f\in C(K)$ ו-$K$ קומפקטי, ולכן לפי משפט קנטור (משפט 3.4.6) יש $\delta_0>0$ עם $|f(x)-f(y)|<\frac\varepsilon3$ לכל $x,y$ עם $d(x,y)<\delta_0$.'
      - id: tail
        label: 'לכל $n>N$ ולכל $x,y$ עם $d(x,y)<\delta_0$, אי-שוויון המשולש חוסם את $|f_n(x)-f_n(y)|$ בסכום של $|f_n(x)-f(x)|$, של $|f(x)-f(y)|$ ושל $|f(y)-f_n(y)|$. כל אחד מהם קטן מ-$\frac\varepsilon3$, ולכן $|f_n(x)-f_n(y)|$ קטן מ-$\varepsilon$.'
      - id: head
        label: 'כל אחת מ-$f_1,\dots,f_N$ רציפה במידה שווה (שוב משפט 3.4.6), עם $\delta_1,\dots,\delta_N$ עבור $\varepsilon$; לכן $\delta$, המינימום של $\delta_0,\delta_1,\dots,\delta_N$, חיובי ומתאים לכל $n\in\mathbb{N}$.'
    order: [eps, limit, tail, head]
    correctFeedback: >-
      נכון. הקומפקטיות של $K$ נכנסת דרך משפט קנטור פעמיים: לגבול $f$ ולמספר הסופי של האיברים הראשונים. שהמספר סופי הוא
      מה שמאפשר מינימום חיובי.
    wrongFeedback: >-
      קודם קובעים $\varepsilon$ ו-$N$. הזנב קרוב ל-$f$, ולכן מטפלים בו דרך ה-$\delta$ של $f$; את מספר האיברים הסופי
      שנשאר מטפלים בסוף, במינימום.
    hints:
      - 'חזרו לשיעור 4.2: משפט 4.2.8 ומשפחה סופית (טענה 4.2.3(ב)), ולשיעור 3.4: משפט קנטור (משפט 3.4.6).'
