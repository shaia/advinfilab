  - id: Q-8-review-13
    type: twotier
    objectives: [OBJ-8.4-1, OBJ-5.6-3]
    qualitative: true
    level: exam
    prompt: >-
      נכון או לא נכון: אם $\varphi_1,\varphi_2$ שתי פונקציות פוטנציאל של אותו שדה $F$ בקבוצה פתוחה $U$ **כלשהי**, אז
      $\varphi_1-\varphi_2$ קבועה ב-$U$.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. צריך גם ש-$U$ תהיה קשירה מסילתית.'
      - text: נכון
        feedback: >-
          בקבוצה לא קשירה ההפרש יכול להיות קבוע אחר בכל חלק. ראו את הדוגמה בנימוק.
        misconception: MC-c8-conservative-domain-free
    reasons:
      - text: 'ב-$U=B((0,0),1)\cup B((3,0),1)$ ול-$F=0$, הפונקציה ששווה 0 בעיגול הראשון ו-1 בשני היא פוטנציאל, וגם $0$; ההפרש אינו קבוע'
        correct: true
        feedback: >-
          בדיוק. בקבוצה פתוחה וקשירה מסילתית הטענה נכונה: $\nabla(\varphi_1-\varphi_2)=0$, ופונקציה שהדיפרנציאל שלה
          מתאפס בקבוצה פתוחה וקשירה קבועה (שיעור 5.6); או ישירות: $\varphi(q)-\varphi(p)=\int F\cdot ds$ לאורך מסילה
          מ-$p$ ל-$q$.
      - text: '$\nabla(\varphi_1-\varphi_2)=0$, ופונקציה עם גרדיאנט אפס קבועה'
        feedback: >-
          זה נכון רק בקבוצה פתוחה **וקשירה**. בלי קשירות המשפט של שיעור 5.6 לא חל, והדוגמה בנימוק הנכון מפריכה.
        misconception: MC-c8-conservative-domain-free
      - text: 'פונקציית פוטנציאל יחידה, ולכן $\varphi_1=\varphi_2$'
        feedback: >-
          גם בתחום קשיר מותר להוסיף קבוע: $\nabla(\varphi+c)=\nabla\varphi$. האינטגרל תלוי רק בהפרש ערכים, ולכן הקבוע לא
          משנה דבר.
        misconception: MC-c8-potential-forget-start
    hints:
      - 'חזרו לשיעור 8.4: ההגדרה של פונקציית פוטנציאל; ולשיעור 5.6: דיפרנציאל אפס בקבוצה פתוחה וקשירה.'

  - id: Q-8-review-14
    type: numeric
    objectives: [OBJ-8.3-3, OBJ-8.2-3]
    level: mid
    prompt: >-
      $\gamma(t)=(\cos t,\sin t,t)$, $t\in[0,2\pi]$, ו-$F(x,y,z)=(z,x,y)$. חשבו את החסם
      $L(\gamma)\cdot\max_t\|F(\gamma(t))\|$ על $\left|\int_\gamma F\cdot ds\right|$ (מקורב לשתי ספרות אחרי הנקודה).
    answer: 56.533598
    tolerance: 0.0002
    correctFeedback: >-
      נכון: $L=2\sqrt2\,\pi$, $\|F(\gamma(t))\|=\|(t,\cos t,\sin t)\|=\sqrt{t^2+1}$, והמקסימום ב-$t=2\pi$:
      $2\sqrt2\,\pi\cdot\sqrt{4\pi^2+1}\approx56.53$.
    wrongFeedback: >-
      חשבו את אורך הסליל ואת הגודל של השדה לאורכו כפונקציה של $t$, ומצאו את המקסימום שלו על $[0,2\pi]$.
    commonWrong:
      - value: 39.975291
        feedback: >-
          זה מתקבל עם $2\pi$, המרחק בין $(1,0,0)$ ל-$(1,0,2\pi)$, במקום אורך הסליל $2\sqrt2\,\pi$.
        misconception: MC-c8-bound-chord
    hints:
      - 'חזרו לשיעור 8.3: החסם על אינטגרל קווי; ולשיעור 8.2: אורך הסליל.'
