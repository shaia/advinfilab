# Lesson 8.8 — approximating paths and homotopy of continuous paths (enrichment; Lindenstrauss IX §4).
# Objectives (src/course.ts):
#   OBJ-8.8-1  a continuous path in an open set is a uniform limit of C² paths in the set with the same endpoints; a closed
#              path is homotopic in the set to its approximants
#   OBJ-8.8-2  the integral of a locally conservative field along a continuous path, via local potentials on a fine
#              partition: well defined, and equal to the line integral for piecewise smooth paths
#   OBJ-8.8-3  for a locally conservative field, homotopic continuous closed paths have equal integrals
# ω = (−y, x)/(x²+y²) is the angle field and ω_p(x) = ω(x−p). "The integral along a continuous path" is the one of OBJ-8.8-2:
#   ∫_γ F·ds = Σ_j (φ_j(γ(t_j)) − φ_j(γ(t_{j−1}))), with γ([t_{j−1},t_j]) inside a ball B_j ⊆ U where F = ∇φ_j.
# φ_j (\varphi) is reserved for local potentials; a reparametrisation of an edge is λ.
# Inline formulas stay short (≤ ~16 glyphs in rank items, ~24 in choices); long chains go to display math.
# May use 8.7 and everything before it; nothing later.
chapter: 8
questions:
  - id: Q-8.8-def-integral
    type: mc
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: basic
    prompt: >-
      $F$ משמר מקומית בקבוצה פתוחה $U$, ו-$\gamma:[a,b]\to U$ מסילה רציפה בלבד (אולי בלי נגזרת בשום נקודה). איך מגדירים
      את $\int_\gamma F\cdot ds$?
    choices:
      - text: 'בחלוקה עדינה, עם כדורים $B_j\subseteq U$ שמכילים את $\gamma([t_{j-1},t_j])$ ופוטנציאלים $\varphi_j$ של $F$ בהם: סכום ההפרשים של $\varphi_j$ בקצות הקטע ה-$j$'
        correct: true
        feedback: >-
          נכון:
          $$\int_\gamma F\cdot ds=\sum_{j=1}^k\left(\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))\right).$$
          חלוקה כזו קיימת לפי למת המספר של לבג לכיסוי של $\gamma([a,b])$ ורציפות במידה שווה; ההגדרה אינה תלויה בבחירות,
          ולמסילה חלקה למקוטעין היא האינטגרל הקווי הרגיל.
      - text: '$\varphi(\gamma(b))-\varphi(\gamma(a))$, כאשר $\varphi$ פוטנציאל אחד של $F$ בכל $U$, שקיים תמיד כי $F$ משמר מקומית בקבוצה פתוחה'
        feedback: >-
          לשדה משמר מקומית אין בהכרח פוטנציאל ב-$U$ כולה: לשדה הזווית ב-$\mathbb{R}^2\setminus\{0\}$ אין. לכן עובדים עם
          פוטנציאלים מקומיים, אחד לכל קטע.
        misconception: MC-c8-local-means-global
      - text: '$\int_a^bF(\gamma(t))\cdot\gamma^{\prime}(t)\,dt$, כשמשלבים רק על קבוצת ה-$t$ שבהן הנגזרת $\gamma^{\prime}(t)$ קיימת, ומתעלמים מהשאר'
        feedback: >-
          ייתכן ש-$\gamma^{\prime}$ אינה קיימת באף נקודה, ואז אין כאן מה לשלב. ההגדרה החדשה אינה משתמשת בנגזרת בכלל, ולכן
          עובדת גם למסילה שאינה ברת-מדידה.
        misconception: MC-c8-continuous-path-no-integral
      - text: 'בעזרת פוטנציאלים מקומיים $\varphi_j$ בכדורים $B_j$ לאורך המסילה, אבל רק אם בוחרים אותם כך שהם מתלכדים בכל החיתוכים $B_j\cap B_{j+1}$'
        feedback: >-
          אין צורך בכך, ולעיתים זה בלתי אפשרי (שדה הזווית לאורך מעגל). כל $\varphi_j$ משמש רק לקטע שלו, והקבוע החופשי
          מתקזז בהפרש.
        misconception: MC-c8-local-potential-choice

  - id: Q-8.8-what-was-missing
    type: mc
    objectives: [OBJ-8.8-3]
    qualitative: true
    level: mid
    prompt: >-
      בשיעור 8.5 הוכחנו: אם $F$ משמר מקומית ב-$U$, ו-$\gamma_0,\gamma_1$ מסילות סגורות **חלקות למקוטעין** שהומוטופיות
      ב-$U$, אז $\int_{\gamma_0}F\cdot ds=\int_{\gamma_1}F\cdot ds$. מה בדיוק משלים שיעור 8.8?
    choices:
      - text: 'את אותו משפט כש-$\gamma_0,\gamma_1$ רציפות בלבד, עם האינטגרל שמוגדר בעזרת פוטנציאלים מקומיים'
        correct: true
        feedback: >-
          נכון. ב-8.5 ההומוטופיה הייתה רציפה בלבד, ומסילות הביניים $H(s,\cdot)$ היו רציפות בלבד כבר שם; אבל האינטגרל על
          **הקצוות** $\gamma_0,\gamma_1$ דרש נגזרת. עכשיו גם הקצוות יכולים להיות מסילות רציפות כלשהן, אפילו לא ברות-מדידה.
      - text: 'ב-8.5 ההומוטופיה $H$ הייתה חייבת להיות גזירה ברציפות, ועכשיו מספיק ש-$H$ רציפה בלבד'
        feedback: >-
          כבר ב-8.5 $H$ הייתה רציפה בלבד: זו הסיבה שההוכחה עברה דרך קווים שבורים במקום מסילות הביניים עצמן.
        misconception: MC-c8-continuous-path-no-integral
      - text: 'הוא מרחיב את המשפט לכל שדה רציף, גם כזה שאינו משמר מקומית, כל עוד המסילות הומוטופיות'
        feedback: >-
          ל-$F=(-y,x)$, שאינו משמר מקומית, המעגלים ברדיוס 1 וברדיוס 2 סביב הראשית הומוטופיים ב-$\mathbb{R}^2$, והאינטגרלים
          $2\pi$ ו-$8\pi$.
        misconception: MC-c8-path-independent-always
      - text: 'הוא מראה ששדה משמר מקומית הוא משמר בכל קבוצה פתוחה, ולכן האינטגרל על כל מסילה סגורה 0'
        feedback: >-
          שדה הזווית נשאר משמר מקומית ולא משמר ב-$\mathbb{R}^2\setminus\{0\}$; המשפט עוסק במסילות הומוטופיות, לא בכל
          המסילות הסגורות.
        misconception: MC-c8-local-means-global

  - id: Q-8.8-open-margin
    type: mc
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחה שמסילה רציפה $\gamma:[a,b]\to U$ אפשר לקרב במסילות גזירות פעמיים ברציפות **בתוך** $U$, איפה משתמשים בכך
      ש-$U$ פתוחה?
    choices:
      - text: 'כדי שיהיה $r>0$ אחד עם $B(\gamma(t),r)\subseteq U$ לכל $t$, כי התמונה הקומפקטית רחוקה מ-$\mathbb{R}^n\setminus U$'
        correct: true
        feedback: >-
          נכון. הקבוצה הקומפקטית $\gamma([a,b])$ זרה לקבוצה הסגורה $\mathbb{R}^n\setminus U$, ולכן נמצאת ממנה במרחק חיובי
          $r$. אחרי זה בוחרים חלוקה שבה כל $\gamma([t_{j-1},t_j])$ בכדור $B(\gamma(t_{j-1}),r)\subseteq U$; הכדור קמור,
          ולכן גם הקטע מ-$\gamma(t_{j-1})$ ל-$\gamma(t_j)$, וכל מסילה שעוברת עליו, נשארים ב-$U$.
      - text: 'אין $r$ משותף: $\gamma$ יכולה להתקרב כרצוננו לשפה של $U$, ולכן עובדים עם רדיוס $r_t$ שתלוי ב-$t$'
        feedback: >-
          התמונה $\gamma([a,b])$ קומפקטית, ולכן רחוקה מהמשלים הסגור של $U$ במרחק חיובי: יש $r$ משותף. בלעדיו לא הייתה חלוקה
          סופית.
        misconception: MC-c3-compact-margin
      - text: 'כדי שהקטע מ-$\gamma(t_{j-1})$ ל-$\gamma(t_j)$ יהיה מוכל ב-$U$, כי כל קבוצה פתוחה ב-$\mathbb{R}^n$ היא קמורה'
        feedback: >-
          $\mathbb{R}^2\setminus\{0\}$ פתוחה ואינה קמורה: הקטע מ-$(1,0)$ ל-$(-1,0)$ עובר בראשית. רק הכדורים הקטנים בתוך
          $U$ קמורים.
        misconception: MC-c8-homotopy-leaves-domain
      - text: 'כדי ש-$\gamma$ תהיה רציפה במידה שווה על $[a,b]$, וכך תהיה לה חלוקה עדינה כרצוננו'
        feedback: >-
          הרציפות במידה שווה באה מהקומפקטיות של **התחום** $[a,b]$ (משפט קנטור), בלי קשר ל-$U$.
        misconception: MC-c3-uniform-without-compact

  - id: Q-8.8-polygon-pieces
    type: numeric
    objectives: [OBJ-8.8-1]
    level: mid
    prompt: >-
      $\gamma(t)=(\cos t,\sin t)$, $t\in[0,2\pi]$, ו-$U=\mathbb{R}^2\setminus\{(3,0)\}$. המרחק של המעגל מ-$(3,0)$ הוא
      $r=2$, ולכן $B(\gamma(t),2)\subseteq U$ לכל $t$. בהוכחת הקירוב מחלקים את $[0,2\pi]$ ל-$k$ קטעים שווים
      $[t_{j-1},t_j]$ ודורשים $\|\gamma(t)-\gamma(t_{j-1})\|<2$ לכל $t\in[t_{j-1},t_j]$; אז הקו השבור דרך
      $\gamma(t_0),\dots,\gamma(t_k)$ נשאר בכדורים $B(\gamma(t_{j-1}),2)\subseteq U$. מהו ה-$k$ הקטן ביותר שמקיים את
      הדרישה?
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון. המרחק במישור הוא אורך המיתר: $\|\gamma(t)-\gamma(t_{j-1})\|=2\sin\frac{t-t_{j-1}}{2}$, והוא עולה כל עוד
      $t-t_{j-1}\le\pi$. ל-$k\ge2$ אורך הקטע $\frac{2\pi}{k}\le\pi$, והמקסימום $2\sin\frac\pi k$ מתקבל ב-$t=t_j$. ב-$k=2$
      הוא $2\sin\frac\pi2=2$, שאינו קטן ממש מ-2; ב-$k=3$ הוא $\sqrt3<2$. ל-$k=1$ המרחק מגיע ל-2 ב-$t=\pi$. (והכדורים
      אכן ב-$U$: $\|\gamma(t)-(3,0)\|^2=10-6\cos t\ge4$.)
    wrongFeedback: >-
      חשבו את המרחק הגדול ביותר מ-$\gamma(t_{j-1})$ לנקודות הקטע (אורך מיתר, לא אורך קשת) כפונקציה של $k$, ודרשו שיהיה
      **קטן ממש** מ-2.
    commonWrong:
      - value: 4
        feedback: >-
          זו הדרישה שאורך **הקשת** $\frac{2\pi}{k}$ יהיה קטן מ-2. היא מספיקה, כי המיתר קצר מהקשת, אבל היא חזקה מהדרישה:
          המרחק במישור הוא אורך המיתר, וכבר ב-$k=3$ הוא $2\sin\frac\pi3=\sqrt3<2$.
      - value: 2
        feedback: >-
          ב-$k=2$ המיתר $2\sin\frac\pi2=2$ בדיוק: $\gamma(t_j)$ על השפה של $B(\gamma(t_{j-1}),2)$ ולא בתוכו. הדרישה היא
          אי-שוויון ממש.
        misconception: MC-c3-endpoint-in-open
      - value: 1
        feedback: >-
          ב-$k=1$ הקטע היחיד הוא כל $[0,2\pi]$, ונקודות הקצה שלו מתלכדות. אבל הדרישה היא לכל $t$ בקטע, לא רק בקצותיו:
          ב-$t=\pi$ המרחק מ-$\gamma(0)$ הוא 2.

  - id: Q-8.8-c2-corners
    type: twotier
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: mid
    prompt: >-
      $\sigma$ עוברת על קו שבור $P_0P_1\dots P_k$, ועל הצלע ה-$j$ היא $P_{j-1}+\lambda(u)(P_j-P_{j-1})$, $u\in[0,1]$, עם
      $\lambda(u)=10u^3-15u^4+6u^5$. נכון או לא נכון: $\sigma$ גזירה פעמיים ברציפות, אף שלתמונה שלה יש פינות.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. כך מקבלים את המסילות המקרבות מהשיעור: קו שבור בפרמטריזציה ש"עוצרת" בכל קודקוד.'
      - text: לא נכון
        feedback: >-
          פינה בתמונה אינה סותרת גזירות, אם המהירות מתאפסת בפינה. ראו את הנימוק.
        misconception: MC-c8-c1-means-smooth-image
    reasons:
      - text: '$\lambda(0)=0$, $\lambda(1)=1$, $\lambda^{\prime}(u)=30u^2(1-u)^2$ ו-$\lambda^{\prime\prime}(u)=60u(1-u)(1-2u)$, ושתיהן מתאפסות ב-$u=0,1$; לכן בכל קודקוד $\sigma^{\prime}=\sigma^{\prime\prime}=0$ משני הצדדים'
        correct: true
        feedback: >-
          בדיוק. הנגזרת הראשונה והשנייה רציפות גם בקודקודים, ו-$\lambda^{\prime}\ge0$, כך ש-$\sigma$ אינה יוצאת מהצלע.
          $\sigma$ אינה **חלקה**: $\sigma^{\prime}=0$ בקודקודים.
      - text: 'לא נכון: לתמונה של מסילה גזירה ברציפות אין פינות'
        feedback: >-
          $(t^3,|t|^3)$ גזירה ברציפות ויוצרת פינה ב-0. מה שאוסר פינות הוא $\gamma^{\prime}\ne0$, כלומר מסילה חלקה.
        misconception: MC-c8-c1-means-smooth-image
      - text: 'לא נכון: בקודקוד הנגזרת משמאל היא בכיוון $P_j-P_{j-1}$ ומימין בכיוון $P_{j+1}-P_j$'
        feedback: >-
          כך בפרמטריזציה הלינארית $u\mapsto P_{j-1}+u(P_j-P_{j-1})$. עם $\lambda$ שתי הנגזרות החד-צדדיות הן וקטור האפס,
          ואז הן שוות.
        misconception: MC-c8-c1-means-smooth-image

  - id: Q-8.8-spiral
    type: numeric
    objectives: [OBJ-8.8-2]
    level: mid
    prompt: >-
      $\gamma(t)=\rho(t)(\cos t,\sin t)$, $t\in[0,\frac{5\pi}{2}]$, כאשר $\rho:[0,\frac{5\pi}{2}]\to[1,3]$ רציפה בלבד (אולי
      בלי נגזרת בשום מקום, כך ש-$\gamma$ אולי אינה ברת-מדידה). חשבו את $\int_\gamma\omega\cdot ds$ לשדה הזווית, במובן של
      האינטגרל לאורך מסילה רציפה (מקורב לשלוש ספרות אחרי הנקודה).
    answer: 7.853982
    tolerance: 0.0002
    correctFeedback: >-
      נכון, $\frac{5\pi}{2}$. בכל כדור $B_j$ שאינו מכיל את הראשית הפוטנציאל $\varphi_j$ הוא ענף רציף של הזווית: פונקציה
      רציפה על $B_j$ שנותנת בכל נקודה $x$ זווית של $x$. $\theta(t)=t$ פונקציית זווית רציפה של $\gamma$; על הקטע ה-$j$,
      $\varphi_j(\gamma(t))=t+2\pi k_j$, וכל מחובר בסכום הוא $t_j-t_{j-1}$. הסכום הטלסקופי:
      $\theta(\frac{5\pi}{2})-\theta(0)$.
    wrongFeedback: >-
      הפוטנציאלים המקומיים של $\omega$ הם ענפים רציפים של הזווית. מה פונקציית הזווית הרציפה של $\gamma$, ומה השינוי שלה?
    commonWrong:
      - value: 1.570796
        feedback: >-
          $\frac\pi2$ הוא ההפרש בין הזוויות הראשיות של נקודת הסיום (על החלק החיובי של ציר $y$) ונקודת ההתחלה. המסילה הקיפה
          את הראשית פעם שלמה בדרך, והזווית הרציפה זוכרת את זה.
        misconception: MC-c8-angle-principal-value
      - value: 1.25
        feedback: >-
          $\frac54$ הוא השינוי חלקי $2\pi$. האינטגרל של שדה הזווית הוא השינוי של הזווית עצמו, ברדיאנים.
        misconception: MC-c8-winding-normalisation

  - id: Q-8.8-choice-free
    type: twotier
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: mid
    prompt: >-
      בהגדרת $\int_\gamma F\cdot ds$ למסילה רציפה בוחרים לכל קטע כדור $B_j$ ופוטנציאל $\varphi_j$ של $F$ ב-$B_j$. נכון
      או לא נכון: לחלוקה קבועה ולכדורים קבועים, הסכום אינו תלוי בבחירת הפוטנציאלים $\varphi_j$.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. (וגם המעבר לעידון של החלוקה אינו משנה את הסכום, ולכן ההגדרה כולה אינה תלויה בבחירות.)'
      - text: לא נכון
        feedback: >-
          הפוטנציאל בכדור נקבע עד כדי קבוע, וקבוע מתקזז בהפרש של שני ערכים. ראו את הנימוק.
        misconception: MC-c8-local-potential-choice
    reasons:
      - text: 'אם $\varphi_j,\psi_j$ שני פוטנציאלים של $F$ ב-$B_j$, אז $\nabla(\varphi_j-\psi_j)=0$ בכדור, שהוא קמור, ולכן $\varphi_j-\psi_j\equiv c$; והקבוע $c$ מתקזז בהפרש בין הערכים של $\varphi_j$ בקצות הקטע'
        correct: true
        feedback: >-
          בדיוק: פונקציה גזירה עם גרדיאנט אפס בקבוצה פתוחה קמורה קבועה (משפט הערך הממוצע על קטעים). לכן כל מחובר תלוי רק
          ב-$F$ ובקטע.
      - text: 'הסכום אינו תלוי בבחירה רק אם בוחרים פוטנציאלים שמתלכדים בחיתוכים, ואז יש פוטנציאל אחד לכל המסילה'
        feedback: >-
          ההתלכדות אינה נחוצה, ולעיתים בלתי אפשרית: לשדה הזווית לאורך מעגל שלם אין "פוטנציאל אחד לכל המסילה".
        misconception: MC-c8-local-potential-choice
      - text: 'ל-$F$ יש פוטנציאל אחד ב-$U$, ולכן כל הבחירות הן צמצומים שלו'
        feedback: >-
          משמר מקומית אינו משמר: לשדה הזווית אין פוטנציאל ב-$\mathbb{R}^2\setminus\{0\}$, ובכל זאת ההגדרה עובדת.
        misconception: MC-c8-local-means-global

  - id: Q-8.8-simply-connected
    type: twotier
    objectives: [OBJ-8.8-3]
    qualitative: true
    level: mid
    prompt: >-
