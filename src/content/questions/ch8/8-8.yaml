  - id: Q-8.8-uniform-close
    type: twotier
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: exam
    prompt: >-
      נכון או לא נכון: אם $F$ שדה רציף ב-$\mathbb{R}^2$, ו-$\sigma_k\to\gamma$ במידה שווה על $[a,b]$, כאשר כל המסילות חלקות
      ובעלות אותן נקודות קצה, אז $\int_{\sigma_k}F\cdot ds\to\int_\gamma F\cdot ds$.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. לשדה כללי קרבה במידה שווה אינה מספיקה; לשדה משמר מקומית היא מספיקה, ואפילו נותנת שוויון.'
      - text: נכון
        feedback: >-
          המסילות הקרובות יכולות להיות ארוכות מאוד, והחסם על אינטגרל קווי כולל את האורך. ראו את הדוגמה בנימוק.
        misconception: MC-c8-uniform-close-integrals
    reasons:
      - text: '$F=(-y,x)$, $\gamma(t)=(t,0)$, $t\in[0,2\pi]$, ו-$\sigma_k=\gamma+\frac1k v_k$ עם $v_k(t)=(\cos k^2t-1,\ \sin k^2t)$, $k\ge2$: אותן נקודות קצה, $\|\sigma_k-\gamma\|\le\frac2k$, אבל $\int_{\sigma_k}F\cdot ds=2\pi$ לכל $k$, ו-$\int_\gamma F\cdot ds=0$'
        correct: true
        feedback: >-
          בדיוק. האינטגרנד $-y\,x^{\prime}+x\,y^{\prime}$ לאורך $\sigma_k$ הוא
          $$1-\frac{\sin k^2t}{k}+kt\cos k^2t-\cos k^2t,$$
          ועל $[0,2\pi]$ רק האיבר 1 תורם (כי $k^2$ שלם, ובאינטגרציה בחלקים $\int_0^{2\pi}t\cos k^2t\,dt=0$): $2\pi$. האורכים
          לא חסומים: $\int_0^{2\pi}|y_k^{\prime}|\,dt=4k$. ($F$ אינו משמר מקומית: $\partial_y(-y)=-1\ne1=\partial_x x$.)
      - text: 'נכון, כי ההפרש בין שני האינטגרלים חסום ב-$L(\gamma)$ כפול $\max\|F(\sigma_k)-F(\gamma)\|$, וזה שואף ל-0'
        feedback: >-
          אי-שוויון כזה אינו נכון: $\sigma_k$ ו-$\gamma$ הן מסילות שונות עם נגזרות שונות, וההפרש כולל את
          $F(\sigma_k)\cdot(\sigma_k^{\prime}-\gamma^{\prime})$, שאינו קטן כשהנגזרות של $\sigma_k$ גדולות.
        misconception: MC-c8-uniform-close-integrals
      - text: 'נכון, כי $F$ רציף במידה שווה על קבוצה קומפקטית שמכילה את כל המסילות'
        feedback: >-
          רציפות במידה שווה של $F$ שולטת בערכים של $F$, לא בדרך שהמסילה עוברת. בדוגמה הנגדית $F$ אפילו לינארי.
        misconception: MC-c8-uniform-close-integrals

  - id: Q-8.8-two-holes
    type: numeric
    objectives: [OBJ-8.8-3]
    level: exam
    prompt: >-
      $U=\mathbb{R}^2\setminus\{(0,0),(2,0)\}$ ו-$F=\omega_{(0,0)}+3\,\omega_{(2,0)}$. $\gamma$ מסילה סגורה רציפה ב-$U$, לא
      בהכרח ברת-מדידה, שהומוטופית ב-$U$ למעגל ברדיוס 3 סביב הראשית (פעם אחת נגד כיוון השעון). חשבו את
      $\int_\gamma F\cdot ds$ (מקורב לשלוש ספרות אחרי הנקודה).
    answer: 25.132741
    tolerance: 0.0002
    correctFeedback: >-
      נכון, $8\pi$. $F$ משמר מקומית ב-$U$, ולפי משפט ההומוטופיה למסילות רציפות האינטגרל שווה לזה על המעגל ברדיוס 3. שתי
      הנקודות בתוכו, ולכן $2\pi(1+3\cdot1)$.
    wrongFeedback: >-
      החליפו את $\gamma$ במסילה ההומוטופית לה, ואז השתמשו בלינאריות ובמספרי הליפוף של המעגל סביב שתי הנקודות.
    commonWrong:
      - value: 6.283185
        feedback: >-
          $2\pi$ סופר רק את הראשית. גם $(2,0)$ בתוך המעגל ברדיוס 3, והיא תורמת $3\cdot2\pi$.
        misconception: MC-c8-winding-any-circle
      - value: 4
        feedback: '4 הוא $1+3\cdot1$, צירוף מספרי הליפוף. האינטגרל הוא $2\pi$ כפול זה.'
        misconception: MC-c8-winding-normalisation

  - id: Q-8.8-approx-proof
    type: rank
    objectives: [OBJ-8.8-3, OBJ-8.8-1]
    level: exam
    prompt: >-
      $F$ משמר מקומית ב-$U$, ו-$\gamma_0,\gamma_1:[a,b]\to U$ מסילות סגורות רציפות שהומוטופיות ב-$U$. סדרו את שלבי ההוכחה
      ש-$\int_{\gamma_0}F\cdot ds=\int_{\gamma_1}F\cdot ds$ (האינטגרל לאורך מסילה רציפה).
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: a
        label: 'לפי למת המספר של לבג ורציפות במידה שווה, יש חלוקה $a=t_0<\dots<t_k=b$ כך שלכל $i\in\{0,1\}$ ולכל $j$, $\gamma_i([t_{j-1},t_j])$ מוכלת בכדור $B_{ij}\subseteq U$ שבו ל-$F$ יש פוטנציאל $\varphi_{ij}$; $\sigma_i$ הוא הקו השבור הסגור דרך $\gamma_i(t_0),\dots,\gamma_i(t_k)$, לינארי על כל $[t_{j-1},t_j]$; צלע באורך 0 היא קטע קבוע, שהאינטגרל עליו 0, ומשמיטים אותה.'
      - id: b
        label: 'הכדורים קמורים: ל-$t\in[t_{j-1},t_j]$ הקטע בין $\gamma_i(t)$ ל-$\sigma_i(t)$ מוכל ב-$B_{ij}\subseteq U$. לכן ההומוטופיה הלינארית בין $\gamma_i$ ל-$\sigma_i$ נשארת ב-$U$ (וסגורה, כי שתי המסילות סגורות).'
      - id: c
        label: 'משרשרים הומוטופיות, אחת אחרי השנייה בפרמטר $s$: $\sigma_0\simeq\gamma_0\simeq\gamma_1\simeq\sigma_1$, ולכן $\sigma_0$ ו-$\sigma_1$ הומוטופיות ב-$U$.'
      - id: d
        label: 'אחרי השמטת הצלעות באורך 0, $\sigma_0,\sigma_1$ חלקות למקוטעין, ולפי המשפט של שיעור 8.5 $\int_{\sigma_0}F\cdot ds=\int_{\sigma_1}F\cdot ds$.'
      - id: e
        label: 'על כל קטע, האינטגרל לאורך $\gamma_i$ ולאורך הצלע של $\sigma_i$ שניהם ההפרש של $\varphi_{ij}$ בין $\gamma_i(t_j)$ ל-$\gamma_i(t_{j-1})$; לכן $\int_{\gamma_0}=\int_{\sigma_0}=\int_{\sigma_1}=\int_{\gamma_1}$.'
    order: [a, b, c, d, e]
    correctFeedback: >-
      נכון. הרעיון: להחליף כל מסילה רציפה בקו שבור קרוב, ש(א) הומוטופי לה ו-(ב) נותן אותו אינטגרל, ואז להפעיל את המשפט
      הישן על הקווים השבורים. הקומפקטיות נותנת חלוקה סופית אחת שמתאימה לשתי המסילות.
    wrongFeedback: >-
      קודם חלוקה עדינה והקווים השבורים, אחר כך ההומוטופיות $\gamma_i\simeq\sigma_i$ והשרשור שלהן, אחר כך המשפט של 8.5
      על $\sigma_0,\sigma_1$, ובסוף ההשוואה בין האינטגרל על $\gamma_i$ לזה על $\sigma_i$.
