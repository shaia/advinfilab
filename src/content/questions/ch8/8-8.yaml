# Lesson 8.8 — approximating paths and homotopy of continuous paths (enrichment; Lindenstrauss IX §4).
# Objectives (src/course.ts):
#   OBJ-8.8-1  a continuous path in an open set is a uniform limit of C² paths in the set with the same endpoints; a closed
#              path is homotopic in the set to its approximants
#   OBJ-8.8-2  the integral of a locally conservative field along a continuous path, via local potentials on a fine
#              partition: well defined, and equal to the line integral for piecewise smooth paths
#   OBJ-8.8-3  for a locally conservative field, homotopic continuous closed paths have equal integrals
# ω = (−y, x)/(x²+y²) is the angle field and ω_p(x) = ω(x−p). "The integral along a continuous path" is the one of OBJ-8.8-2:
#   ∫_γ F·ds = Σ_j (φ_j(γ(t_j)) − φ_j(γ(t_{j−1}))), with γ([t_{j−1},t_j]) inside a ball B_j ⊆ U where F = ∇φ_j.
# May use 8.7 and everything before it; nothing later.
chapter: 8
questions:
  - id: Q-8.8-what-was-missing
    type: mc
    objectives: [OBJ-8.8-3]
    qualitative: true
    level: basic
    prompt: >-
      בשיעור 8.5 הוכחנו: אם $F$ משמר מקומית ב-$U$, ו-$\gamma_0,\gamma_1$ מסילות סגורות **חלקות למקוטעין** שהומוטופיות
      ב-$U$, אז $\int_{\gamma_0}F\cdot ds=\int_{\gamma_1}F\cdot ds$. מה בדיוק משלים שיעור 8.8?
    choices:
      - text: 'את אותו משפט כש-$\gamma_0,\gamma_1$ רק רציפות, עם האינטגרל המוגדר בעזרת פוטנציאלים מקומיים; מסילות הביניים $H(s,\cdot)$ היו רציפות בלבד כבר בשיעור 8.5'
        correct: true
        feedback: >-
          נכון. ב-8.5 ההומוטופיה הייתה רציפה בלבד, אבל האינטגרל על **הקצוות** $\gamma_0,\gamma_1$ דרש נגזרת. עכשיו גם הקצוות
          יכולים להיות מסילות רציפות כלשהן, אפילו לא ברות-מדידה.
      - text: 'ב-8.5 ההומוטופיה $H$ הייתה צריכה להיות גזירה ברציפות, ועכשיו מספיק ש-$H$ רציפה'
        feedback: >-
          כבר ב-8.5 $H$ הייתה רציפה בלבד: זו הסיבה שההוכחה עברה דרך קווים שבורים במקום מסילות הביניים עצמן.
        misconception: MC-c8-continuous-path-no-integral
      - text: 'הוא מרחיב את המשפט לכל שדה רציף, גם כזה שאינו משמר מקומית'
        feedback: >-
          ל-$F=(-y,x)$, שאינו משמר מקומית, המעגלים ברדיוס 1 וברדיוס 2 סביב הראשית הומוטופיים ב-$\mathbb{R}^2$, והאינטגרלים
          $2\pi$ ו-$8\pi$.
        misconception: MC-c8-path-independent-always
      - text: 'הוא מראה ששדה משמר מקומית הוא משמר בכל קבוצה פתוחה'
        feedback: >-
          שדה הזווית נשאר משמר מקומית ולא משמר ב-$\mathbb{R}^2\setminus\{0\}$; המשפט עוסק במסילות הומוטופיות, לא בכל
          המסילות הסגורות.
        misconception: MC-c8-local-means-global

  - id: Q-8.8-open-margin
    type: mc
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: basic
    prompt: >-
      בהוכחה שמסילה רציפה $\gamma:[a,b]\to U$ אפשר לקרב במסילות גזירות פעמיים ברציפות **בתוך** $U$, איפה משתמשים בכך
      ש-$U$ פתוחה?
    choices:
      - text: 'כדי לקבל $r>0$ אחד עם $B(\gamma(t),r)\subseteq U$ לכל $t$: הקבוצה הקומפקטית $\gamma([a,b])$ זרה לקבוצה הסגורה $\mathbb{R}^n\setminus U$, ולכן נמצאת ממנה במרחק חיובי'
        correct: true
        feedback: >-
          נכון. אחרי זה בוחרים חלוקה שבה כל $\gamma([t_{j-1},t_j])$ בכדור $B(\gamma(t_{j-1}),r)\subseteq U$; הכדור קמור,
          ולכן גם הקטע מ-$\gamma(t_{j-1})$ ל-$\gamma(t_j)$, וכל מסילה שעוברת עליו, נשארים ב-$U$.
      - text: 'באופן כללי אין $r$ משותף, כי $\gamma$ יכולה להתקרב כרצוננו לשפה של $U$; לכן עובדים עם $r_t$ שתלוי ב-$t$'
        feedback: >-
          התמונה $\gamma([a,b])$ קומפקטית, ולכן רחוקה מהמשלים הסגור של $U$ במרחק חיובי: יש $r$ משותף. בלעדיו לא הייתה חלוקה
          סופית.
        misconception: MC-c3-compact-margin
      - text: 'קבוצה פתוחה קמורה, ולכן הקטע מ-$\gamma(t_{j-1})$ ל-$\gamma(t_j)$ מוכל ב-$U$'
        feedback: >-
          $\mathbb{R}^2\setminus\{0\}$ פתוחה ואינה קמורה: הקטע מ-$(1,0)$ ל-$(-1,0)$ עובר בראשית. רק הכדורים הקטנים בתוך
          $U$ קמורים.
        misconception: MC-c8-homotopy-leaves-domain
      - text: 'כדי ש-$\gamma$ תהיה רציפה במידה שווה'
        feedback: >-
          הרציפות במידה שווה באה מהקומפקטיות של **התחום** $[a,b]$ (משפט קנטור), בלי קשר ל-$U$.
        misconception: MC-c3-uniform-without-compact

  - id: Q-8.8-def-integral
    type: mc
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: basic
    prompt: >-
      $F$ משמר מקומית בקבוצה פתוחה $U$, ו-$\gamma:[a,b]\to U$ מסילה רציפה בלבד (אולי בלי נגזרת בשום נקודה). איך מגדירים
      את $\int_\gamma F\cdot ds$?
    choices:
      - text: 'בוחרים חלוקה $a=t_0<\dots<t_k=b$ וכדורים $B_j\subseteq U$ עם פוטנציאל $\varphi_j$ של $F$ ו-$\gamma([t_{j-1},t_j])\subseteq B_j$, ומגדירים $\sum_j\left(\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))\right)$'
        correct: true
        feedback: >-
          נכון. חלוקה כזו קיימת לפי למת המספר של לבג לכיסוי של $\gamma([a,b])$ ורציפות במידה שווה; ההגדרה אינה תלויה בבחירות,
          ולמסילה חלקה למקוטעין היא האינטגרל הקווי הרגיל.
      - text: '$\varphi(\gamma(b))-\varphi(\gamma(a))$, כאשר $\varphi$ פוטנציאל של $F$ ב-$U$'
        feedback: >-
          לשדה משמר מקומית אין בהכרח פוטנציאל ב-$U$ כולה: לשדה הזווית ב-$\mathbb{R}^2\setminus\{0\}$ אין. לכן עובדים עם
          פוטנציאלים מקומיים, אחד לכל קטע.
        misconception: MC-c8-local-means-global
      - text: '$\int_a^bF(\gamma(t))\cdot\gamma^{\prime}(t)\,dt$, על קבוצת ה-$t$ שבהן $\gamma^{\prime}(t)$ קיימת'
        feedback: >-
          ייתכן ש-$\gamma^{\prime}$ אינה קיימת באף נקודה, ואז אין כאן מה לשלב. ההגדרה החדשה אינה משתמשת בנגזרת בכלל, ולכן
          עובדת גם למסילה שאינה ברת-מדידה.
        misconception: MC-c8-continuous-path-no-integral
      - text: 'כמו בתשובה הראשונה, אבל רק אם בוחרים את $\varphi_j$ כך שהם מתלכדים בחיתוכים $B_j\cap B_{j+1}$'
        feedback: >-
          אין צורך בכך, ולעיתים זה בלתי אפשרי (שדה הזווית לאורך מעגל). כל $\varphi_j$ משמש רק לקטע שלו, והקבוע החופשי
          מתקזז בהפרש.
        misconception: MC-c8-local-potential-choice

  - id: Q-8.8-polygon-pieces
    type: numeric
    objectives: [OBJ-8.8-1]
    level: mid
    prompt: >-
      $\gamma(t)=(\cos t,\sin t)$, $t\in[0,2\pi]$, ו-$U=\mathbb{R}^2\setminus\{0\}$, כך ש-$r=1$ הוא המרחק של המעגל מ-0.
      בהוכחת הקירוב מחלקים את $[0,2\pi]$ ל-$k$ קטעים שווים ודורשים $\|\gamma(t)-\gamma(t_{j-1})\|<r$ לכל
      $t\in[t_{j-1},t_j]$; אז הקו השבור דרך $\gamma(t_0),\dots,\gamma(t_k)$ נשאר בכדורים $B(\gamma(t_{j-1}),1)\subseteq U$.
      מהו ה-$k$ הקטן ביותר שמקיים את הדרישה?
    answer: 7
    tolerance: 0.001
    correctFeedback: >-
      נכון. על קטע באורך $\Delta=\frac{2\pi}{k}$ המרחק $\|\gamma(t)-\gamma(t_{j-1})\|=2\sin\frac{t-t_{j-1}}{2}$ עולה, והמקסימום
      $2\sin\frac{\pi}{k}$ ב-$t=t_j$ (כש-$k\ge2$, כלומר $\Delta\le\pi$; ל-$k=1$ המרחק מגיע ל-2 באמצע הקטע). הדרישה
      $2\sin\frac\pi k<1$ שקולה ל-$\frac\pi k<\frac\pi6$, כלומר $k>6$.
    wrongFeedback: >-
      חשבו את אורך המיתר בין $\gamma(t_{j-1})$ ל-$\gamma(t_j)$ כפונקציה של $k$, ודרשו שיהיה **קטן ממש** מ-1.
    commonWrong:
      - value: 6
        feedback: >-
          ב-$k=6$ המיתר $2\sin\frac\pi6=1$ בדיוק: $\gamma(t_j)$ על השפה של $B(\gamma(t_{j-1}),1)$ ולא בתוכו. הדרישה היא
          אי-שוויון ממש.
        misconception: MC-c3-endpoint-in-open

  - id: Q-8.8-c2-corners
    type: twotier
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: mid
    prompt: >-
      $\sigma$ עוברת על קו שבור $P_0P_1\dots P_k$, ועל הצלע ה-$j$ היא
      $P_{j-1}+\phi(u)(P_j-P_{j-1})$, $u\in[0,1]$, עם $\phi(u)=10u^3-15u^4+6u^5$. נכון או לא נכון: $\sigma$ גזירה פעמיים
      ברציפות, אף שלתמונה שלה יש פינות.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. כך מקבלים את המסילות המקרבות מהשיעור: קו שבור בפרמטריזציה ש"עוצרת" בכל קודקוד.'
      - text: לא נכון
        feedback: >-
          פינה בתמונה אינה סותרת גזירות, אם המהירות מתאפסת בפינה. ראו את הנימוק.
        misconception: MC-c8-c1-means-smooth-image
    reasons:
      - text: '$\phi(0)=0$, $\phi(1)=1$, $\phi^{\prime}(u)=30u^2(1-u)^2$ ו-$\phi^{\prime\prime}(u)=60u(1-u)(1-2u)$, ושתיהן מתאפסות ב-$u=0,1$; לכן בכל קודקוד $\sigma^{\prime}=\sigma^{\prime\prime}=0$ משני הצדדים'
        correct: true
        feedback: >-
          בדיוק. הנגזרת הראשונה והשנייה רציפות גם בקודקודים, ו-$\phi^{\prime}\ge0$, כך ש-$\sigma$ אינה יוצאת מהצלע. $\sigma$
          אינה **חלקה**: $\sigma^{\prime}=0$ בקודקודים.
      - text: 'לא נכון: לתמונה של מסילה גזירה ברציפות אין פינות'
        feedback: >-
          $(t^3,|t|^3)$ גזירה ברציפות ויוצרת פינה ב-0. מה שאוסר פינות הוא $\gamma^{\prime}\ne0$, כלומר מסילה חלקה.
        misconception: MC-c8-c1-means-smooth-image
      - text: 'לא נכון: בקודקוד הנגזרת משמאל היא בכיוון $P_j-P_{j-1}$ ומימין בכיוון $P_{j+1}-P_j$'
        feedback: >-
          כך בפרמטריזציה הלינארית $u\mapsto P_{j-1}+u(P_j-P_{j-1})$. עם $\phi$ שתי הנגזרות החד-צדדיות הן וקטור האפס, ואז הן
          שוות.
        misconception: MC-c8-c1-means-smooth-image

  - id: Q-8.8-spiral
    type: numeric
    objectives: [OBJ-8.8-2]
    level: mid
    prompt: >-
      $\gamma(t)=\rho(t)(\cos t,\sin t)$, $t\in[0,\frac{5\pi}{2}]$, כאשר $\rho:[0,\frac{5\pi}{2}]\to[1,3]$ רציפה בלבד (אולי
      בלי נגזרת בשום מקום, כך ש-$\gamma$ אולי אינה ברת-מדידה). חשבו את $\int_\gamma\omega\cdot ds$ לשדה הזווית, במובן של
      האינטגרל לאורך מסילה רציפה (מקורב לשלוש ספרות אחרי הנקודה).
    answer: 7.853982
    tolerance: 0.0002
    correctFeedback: >-
      נכון, $\frac{5\pi}{2}$. בכל כדור $B_j$ שאינו מכיל את הראשית הפוטנציאל $\varphi_j$ הוא ענף של הזווית, ו-$\theta(t)=t$
      פונקציית זווית רציפה של $\gamma$; על הקטע ה-$j$, $\varphi_j(\gamma(t))=t+2\pi k_j$, וכל מחובר בסכום הוא
      $t_j-t_{j-1}$. הסכום הטלסקופי: $\theta(\frac{5\pi}{2})-\theta(0)$.
    wrongFeedback: >-
      הפוטנציאלים המקומיים של $\omega$ הם ענפים של הזווית. מה פונקציית הזווית הרציפה של $\gamma$, ומה השינוי שלה?
    commonWrong:
      - value: 1.570796
        feedback: >-
          $\frac\pi2$ הוא ההפרש בין הזוויות הראשיות של נקודת הסיום (על החלק החיובי של ציר $y$) ונקודת ההתחלה. המסילה הקיפה
          את הראשית פעם שלמה בדרך, והזווית הרציפה זוכרת את זה.
        misconception: MC-c8-angle-principal-value
      - value: 1.25
        feedback: >-
          $\frac54$ הוא השינוי חלקי $2\pi$. האינטגרל של שדה הזווית הוא השינוי של הזווית עצמו, ברדיאנים.
        misconception: MC-c8-winding-normalisation

  - id: Q-8.8-choice-free
    type: twotier
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: mid
    prompt: >-
      בהגדרת $\int_\gamma F\cdot ds$ למסילה רציפה בוחרים לכל קטע כדור $B_j$ ופוטנציאל $\varphi_j$ של $F$ ב-$B_j$. נכון
      או לא נכון: לחלוקה קבועה ולכדורים קבועים, הסכום אינו תלוי בבחירת הפוטנציאלים $\varphi_j$.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. (וגם המעבר לעידון של החלוקה אינו משנה את הסכום, ולכן ההגדרה כולה אינה תלויה בבחירות.)'
      - text: לא נכון
        feedback: >-
          הפוטנציאל בכדור נקבע עד כדי קבוע, וקבוע מתקזז בהפרש של שני ערכים. ראו את הנימוק.
        misconception: MC-c8-local-potential-choice
    reasons:
      - text: 'אם $\varphi_j,\psi_j$ שני פוטנציאלים של $F$ ב-$B_j$, אז $\nabla(\varphi_j-\psi_j)=0$ בכדור, שהוא קמור, ולכן $\varphi_j-\psi_j\equiv c$; ו-$c$ מתקזז ב-$\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))$'
        correct: true
        feedback: >-
          בדיוק: פונקציה גזירה עם גרדיאנט אפס בקבוצה פתוחה קמורה קבועה (משפט הערך הממוצע על קטעים). לכן כל מחובר תלוי רק
          ב-$F$ ובקטע.
      - text: 'הסכום אינו תלוי בבחירה רק אם בוחרים פוטנציאלים שמתלכדים בחיתוכים, ואז יש פוטנציאל אחד לכל המסילה'
        feedback: >-
          ההתלכדות אינה נחוצה, ולעיתים בלתי אפשרית: לשדה הזווית לאורך מעגל שלם אין "פוטנציאל אחד לכל המסילה".
        misconception: MC-c8-local-potential-choice
      - text: 'ל-$F$ יש פוטנציאל אחד ב-$U$, ולכן כל הבחירות הן צמצומים שלו'
        feedback: >-
          משמר מקומית אינו משמר: לשדה הזווית אין פוטנציאל ב-$\mathbb{R}^2\setminus\{0\}$, ובכל זאת ההגדרה עובדת.
        misconception: MC-c8-local-means-global

  - id: Q-8.8-simply-connected
    type: twotier
    objectives: [OBJ-8.8-3]
    qualitative: true
    level: mid
    prompt: >-
      $U$ תחום פשוט קשר, $F$ משמר מקומית ב-$U$, ו-$\gamma$ מסילה סגורה **רציפה** ב-$U$, לא בהכרח ברת-מדידה. נכון או לא
      נכון: $\int_\gamma F\cdot ds=0$, במובן של האינטגרל לאורך מסילה רציפה.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. זה בדיוק מה שמשפט ההומוטופיה המלא נותן מעבר לשיעור 8.5.'
      - text: לא נכון
        feedback: >-
          האינטגרל מוגדר גם למסילה רציפה, ומשפט ההומוטופיה חל עליו. ראו את הנימוק.
        misconception: MC-c8-continuous-path-no-integral
    reasons:
      - text: 'בתחום פשוט קשר $\gamma$ הומוטופית ב-$U$ למסילה קבועה; לפי משפט ההומוטופיה למסילות רציפות האינטגרלים שווים, ועל מסילה קבועה הסכום הוא 0'
        correct: true
        feedback: >-
          בדיוק. על מסילה קבועה כל מחובר $\varphi_j(c)-\varphi_j(c)$ הוא 0.
      - text: 'האינטגרל מוגדר רק למסילות חלקות למקוטעין, ולכן אין כאן מה לחשב'
        feedback: >-
          זו בדיוק המגבלה ששיעור 8.8 מסיר: ההגדרה בעזרת פוטנציאלים מקומיים עובדת לכל מסילה רציפה.
        misconception: MC-c8-continuous-path-no-integral
      - text: 'לשדה משמר מקומית האינטגרל על כל מסילה סגורה הוא 0, בכל קבוצה פתוחה'
        feedback: >-
          לא: לשדה הזווית על מעגל היחידה האינטגרל $2\pi$. פשטות הקשר של $U$ היא שעושה את העבודה.
        misconception: MC-c8-local-means-global

  - id: Q-8.8-uniform-close
    type: twotier
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: exam
    prompt: >-
      נכון או לא נכון: אם $F$ שדה רציף ב-$\mathbb{R}^2$, ו-$\sigma_k\to\gamma$ במידה שווה על $[a,b]$, כאשר כל המסילות חלקות
      ובעלות אותן נקודות קצה, אז $\int_{\sigma_k}F\cdot ds\to\int_\gamma F\cdot ds$.
    choices:
      - text: לא נכון
        correct: true
        feedback: 'נכון. לשדה כללי קרבה במידה שווה אינה מספיקה; לשדה משמר מקומית היא מספיקה, ואפילו נותנת שוויון.'
      - text: נכון
        feedback: >-
          המסילות הקרובות יכולות להיות ארוכות מאוד, והחסם על אינטגרל קווי כולל את האורך. ראו את הדוגמה בנימוק.
        misconception: MC-c8-uniform-close-integrals
    reasons:
      - text: '$F=(-y,x)$, $\gamma(t)=(t,0)$ ו-$\sigma_k(t)=(t+\frac{\cos k^2t-1}{k},\ \frac{\sin k^2t}{k})$, $t\in[0,2\pi]$, $k\ge2$: אותן נקודות קצה, $\|\sigma_k-\gamma\|\le\frac2k$, אבל $\int_{\sigma_k}F\cdot ds=2\pi$ לכל $k$ ו-$\int_\gamma F\cdot ds=0$'
        correct: true
        feedback: >-
          בדיוק. האינטגרנד $-y\,x^{\prime}+x\,y^{\prime}$ לאורך $\sigma_k$ הוא
          $1-\frac{\sin k^2t}{k}+kt\cos k^2t-\cos k^2t$, ועל $[0,2\pi]$ רק האיבר 1 תורם (כי $k^2$ שלם, ובאינטגרציה בחלקים
          $\int_0^{2\pi}t\cos k^2t\,dt=0$): $2\pi$. האורכים לא חסומים: $\int_0^{2\pi}|y_k^{\prime}|\,dt=4k$. ($F$ אינו משמר
          מקומית: $\partial_y(-y)=-1\ne1=\partial_x x$.)
      - text: 'נכון, כי $\left|\int_{\sigma_k}F\cdot ds-\int_\gamma F\cdot ds\right|\le L(\gamma)\cdot\max\|F(\sigma_k)-F(\gamma)\|\to0$'
        feedback: >-
          אי-שוויון כזה אינו נכון: $\sigma_k$ ו-$\gamma$ הן מסילות שונות עם נגזרות שונות, וההפרש כולל את
          $F(\sigma_k)\cdot(\sigma_k^{\prime}-\gamma^{\prime})$, שאינו קטן כשהנגזרות של $\sigma_k$ גדולות.
        misconception: MC-c8-uniform-close-integrals
      - text: 'נכון, כי $F$ רציף במידה שווה על קבוצה קומפקטית שמכילה את כל המסילות'
        feedback: >-
          רציפות במידה שווה של $F$ שולטת בערכים של $F$, לא בדרך שהמסילה עוברת. בדוגמה הנגדית $F$ אפילו לינארי.
        misconception: MC-c8-uniform-close-integrals

  - id: Q-8.8-two-holes
    type: numeric
    objectives: [OBJ-8.8-3]
    level: exam
    prompt: >-
      $U=\mathbb{R}^2\setminus\{(0,0),(2,0)\}$ ו-$F=\omega_{(0,0)}+3\,\omega_{(2,0)}$. $\gamma$ מסילה סגורה רציפה ב-$U$, לא
      בהכרח ברת-מדידה, שהומוטופית ב-$U$ למעגל ברדיוס 3 סביב הראשית (פעם אחת נגד כיוון השעון). חשבו את
      $\int_\gamma F\cdot ds$ (מקורב לשלוש ספרות אחרי הנקודה).
    answer: 25.132741
    tolerance: 0.0002
    correctFeedback: >-
      נכון, $8\pi$. $F$ משמר מקומית ב-$U$, ולפי משפט ההומוטופיה למסילות רציפות האינטגרל שווה לזה על המעגל ברדיוס 3. שתי
      הנקודות בתוכו, ולכן $2\pi(1+3\cdot1)$.
    wrongFeedback: >-
      החליפו את $\gamma$ במסילה ההומוטופית לה, ואז השתמשו בלינאריות ובמספרי הליפוף של המעגל סביב שתי הנקודות.
    commonWrong:
      - value: 6.283185
        feedback: >-
          $2\pi$ סופר רק את הראשית. גם $(2,0)$ בתוך המעגל ברדיוס 3, והיא תורמת $3\cdot2\pi$.
        misconception: MC-c8-winding-any-circle
      - value: 4
        feedback: '4 הוא $1+3\cdot1$, צירוף מספרי הליפוף. האינטגרל הוא $2\pi$ כפול זה.'
        misconception: MC-c8-winding-normalisation

  - id: Q-8.8-approx-proof
    type: rank
    objectives: [OBJ-8.8-3, OBJ-8.8-1]
    level: exam
    prompt: >-
      $F$ משמר מקומית ב-$U$, ו-$\gamma_0,\gamma_1:[a,b]\to U$ מסילות סגורות רציפות שהומוטופיות ב-$U$. סדרו את שלבי ההוכחה
      ש-$\int_{\gamma_0}F\cdot ds=\int_{\gamma_1}F\cdot ds$ (האינטגרל לאורך מסילה רציפה).
    help: סדרו את שלבי ההוכחה מהראשון לאחרון.
    items:
      - id: a
        label: 'לפי למת המספר של לבג ורציפות במידה שווה, יש חלוקה $a=t_0<\dots<t_k=b$ כך שלכל $i\in\{0,1\}$ ולכל $j$, $\gamma_i([t_{j-1},t_j])$ מוכלת בכדור $B_{ij}\subseteq U$ שבו ל-$F$ יש פוטנציאל $\varphi_{ij}$; $\sigma_i$ הוא הקו השבור הסגור דרך $\gamma_i(t_0),\dots,\gamma_i(t_k)$, לינארי על כל $[t_{j-1},t_j]$; צלע באורך 0 היא קטע קבוע, שהאינטגרל עליו 0, ומשמיטים אותה.'
      - id: b
        label: 'הכדורים קמורים, ולכן $(1-s)\gamma_i(t)+s\sigma_i(t)\in B_{ij}\subseteq U$ ל-$t\in[t_{j-1},t_j]$: זו הומוטופיה ב-$U$ (סגורה, כי שתי המסילות סגורות) בין $\gamma_i$ ל-$\sigma_i$.'
      - id: c
        label: 'משרשרים הומוטופיות, אחת אחרי השנייה בפרמטר $s$: $\sigma_0\simeq\gamma_0\simeq\gamma_1\simeq\sigma_1$, ולכן $\sigma_0$ ו-$\sigma_1$ הומוטופיות ב-$U$.'
      - id: d
        label: 'אחרי השמטת הצלעות באורך 0, $\sigma_0,\sigma_1$ חלקות למקוטעין, ולפי המשפט של שיעור 8.5 $\int_{\sigma_0}F\cdot ds=\int_{\sigma_1}F\cdot ds$.'
      - id: e
        label: 'על כל קטע, האינטגרל לאורך $\gamma_i$ ולאורך הצלע של $\sigma_i$ שניהם $\varphi_{ij}(\gamma_i(t_j))-\varphi_{ij}(\gamma_i(t_{j-1}))$; לכן $\int_{\gamma_0}=\int_{\sigma_0}=\int_{\sigma_1}=\int_{\gamma_1}$.'
    order: [a, b, c, d, e]
    correctFeedback: >-
      נכון. הרעיון: להחליף כל מסילה רציפה בקו שבור קרוב, ש(א) הומוטופי לה ו-(ב) נותן אותו אינטגרל, ואז להפעיל את המשפט
      הישן על הקווים השבורים. הקומפקטיות נותנת חלוקה סופית אחת שמתאימה לשתי המסילות.
    wrongFeedback: >-
      קודם חלוקה עדינה והקווים השבורים, אחר כך ההומוטופיות $\gamma_i\simeq\sigma_i$ והשרשור שלהן, אחר כך המשפט של 8.5
      על $\sigma_0,\sigma_1$, ובסוף ההשוואה בין האינטגרל על $\gamma_i$ לזה על $\sigma_i$.
