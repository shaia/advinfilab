# Lesson 2.6 — the completion of a metric space.
# Objectives (src/course.ts):
#   OBJ-2.6-1  define a completion as an isometric embedding onto a dense subset of a complete space; ℝ completes ℚ
#   OBJ-2.6-2  build the completion from equivalence classes of Cauchy sequences; the metric is well defined
#   OBJ-2.6-3  the completion is unique up to isometry; inside a complete space the completion is the closure
chapter: 2
questions:
  - id: Q-2.6-def
    type: mc
    objectives: [OBJ-2.6-1]
    qualitative: true
    level: basic
    prompt: >-
      השלמה של מרחב מטרי $(X,d)$ היא מרחב מטרי שלם $Y$ יחד עם העתקה $\iota:X\to Y$ כך ש...
    choices:
      - text: '$\iota$ שיכון איזומטרי ו-$\iota(X)$ צפופה ב-$Y$'
        correct: true
        feedback: >-
          נכון. איזומטרי, כדי ש-$X$ יישב ב-$Y$ עם אותם מרחקים (ולכן עם אותן סדרות קושי); צפוף, כדי ש-$Y$ לא יכיל
          יותר ממה שצריך: כל נקודה חדשה היא גבול של נקודות מ-$X$.
      - text: '$\iota$ שיכון איזומטרי (בלי דרישה נוספת)'
        feedback: >-
          בלי צפיפות, גם $\mathbb{R}^2$ היה "השלמה" של $\mathbb{Q}$ (על ציר ה-$x$). ההשלמה צריכה להיות המרחב השלם
          **הקטן ביותר** שמכיל את $X$, וזה מה שהצפיפות אומרת (מסקנה 2.6.11(ד): ההשלמה נכנסת לכל מרחב שלם שמכיל
          עותק של $X$, כסגור של העותק).
        misconception: MC-c2-completion-any-superset
      - text: '$\iota$ הומיאומורפיזם מ-$X$ אל תת-קבוצה צפופה של $Y$ (ולא בהכרח איזומטריה)'
        feedback: >-
          הומיאומורפיזם לא שומר סדרות קושי. $x\mapsto\tan(\pi(x-\frac12))$ הוא הומיאומורפיזם מ-$(0,1)$ אל
          $\mathbb{R}$ השלם, והוא על, אבל ההשלמה של $(0,1)$ היא $[0,1]$.
        misconception: MC-c2-completeness-topological
      - text: '$Y$ הוא $X$ יחד עם הגבולות של כל סדרות הקושי ב-$X$'
        feedback: >-
          לסדרת קושי שאינה מתכנסת ב-$X$ אין גבול שאפשר "להוסיף": אין לה גבול בשום מקום עדיין. לכן ההגדרה
          דורשת מרחב $Y$ קיים, והבנייה משתמשת במחלקות של סדרות קושי.
        misconception: MC-c2-completion-adds-limits

  - id: Q-2.6-identify
    type: multi
    objectives: [OBJ-2.6-1, OBJ-2.6-3]
    qualitative: true
    level: basic
    prompt: >-
      בכל זוג, $X\subseteq Y$ עם המרחק הרגיל והשיכון הוא ההכלה. באילו זוגות $Y$ היא ההשלמה של $X$? סמנו את כולם.
    choices:
      - text: '$X=(0,1)$, $Y=[0,1]$'
        correct: true
        feedback: '$[0,1]$ שלם ו-$(0,1)$ צפוף בו: הנקודות $0,1$ הן גבולות של נקודות מ-$(0,1)$.'
      - text: '$X=\mathbb{Q}$, $Y=\mathbb{R}$'
        correct: true
        feedback: '$\mathbb{R}$ שלם ו-$\mathbb{Q}$ צפוף בו (שיעור 1.4). זו הדוגמה שממנה המושג נולד.'
      - text: '$X=\{\frac1n:n\in\mathbb{N}\}$, $Y=\{0\}\cup\{\frac1n:n\in\mathbb{N}\}$'
        correct: true
        feedback: >-
          $Y$ סגור ב-$\mathbb{R}$ ולכן שלם, ו-$X$ צפוף בו (הנקודה היחידה החסרה, 0, היא גבול של $\frac1n$).
      - text: '$X=\mathbb{Z}$, $Y=\mathbb{Z}$'
        correct: true
        feedback: '$\mathbb{Z}$ כבר שלם, ומרחב שלם הוא ההשלמה של עצמו.'
      - text: '$X=(0,1)$, $Y=\mathbb{R}$'
        feedback: >-
          $\mathbb{R}$ שלם, אבל $(0,1)$ אינו צפוף בו: הנקודה 5 אינה גבול של נקודות מ-$(0,1)$. בתוך $\mathbb{R}$ ההשלמה
          היא הסגור, $[0,1]$.
        misconception: MC-c2-completion-any-superset
      - text: '$X=\mathbb{Q}\times\{0\}$, $Y=\mathbb{R}^2$'
        feedback: >-
          $\mathbb{R}^2$ שלם, אבל הסגור של $X$ בו הוא ציר ה-$x$, $\mathbb{R}\times\{0\}$, ורק הוא ההשלמה.
        misconception: MC-c2-completion-any-superset

  - id: Q-2.6-equiv-relation
    type: mc
    objectives: [OBJ-2.6-2]
    qualitative: true
    level: basic
    prompt: >-
      בבניית ההשלמה, מתי שתי סדרות קושי $(x_n)$ ו-$(y_n)$ ב-$X$ נחשבות שקולות (מייצגות אותה נקודה של ההשלמה)?
    choices:
      - text: 'כאשר $d(x_n,y_n)\to0$'
        correct: true
        feedback: >-
          נכון. התנאי מדבר רק על נקודות של $X$, בלי שום גבול, ולכן אפשר לבדוק אותו גם כשהסדרות לא מתכנסות ב-$X$.
      - text: 'כאשר $x_n=y_n$ לכל $n$ מאינדקס מסוים'
        feedback: >-
          זה מחמיר מדי. הקירובים העשרוניים $a_n$ של $\sqrt2$ והסדרה $a_n+10^{-n}$ לעולם לא שוות, ושתיהן "שואפות
          ל-$\sqrt2$": הן צריכות לייצג אותה נקודה.
        misconception: MC-c2-equivalence-too-strict
      - text: 'כאשר יש להן אותו גבול'
        feedback: >-
          ב-$X$ אולי אין להן גבול כלל, ובשביל זה בונים את ההשלמה. התנאי $d(x_n,y_n)\to0$ אומר "אותו גבול" בלי להזכיר
          גבול.
        misconception: MC-c2-completion-adds-limits

  - id: Q-2.6-complete-itself
    type: twotier
    objectives: [OBJ-2.6-1, OBJ-2.6-3]
    qualitative: true
    level: basic
    prompt: >-
      $X$ מרחב מטרי **שלם**. האם $X$ עצמו (עם הזהות) הוא ההשלמה של $X$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון, ולפי היחידות כל השלמה של $X$ איזומטרית ל-$X$. ההשלמה לא מוסיפה דבר למרחב שאין בו חורים.
      - text: 'לא, ההשלמה תמיד גדולה יותר'
        feedback: >-
          בבנייה, כל סדרת קושי ב-$X$ מתכנסת לאיזה $x$, ולכן שקולה לסדרה הקבועה $x$: אין מחלקות חדשות.
        misconception: MC-c2-completion-of-complete
    reasons:
      - text: 'הזהות היא איזומטריה, $X$ צפוף בעצמו, ו-$X$ שלם: אלה בדיוק התנאים בהגדרה'
        correct: true
        feedback: 'בדיוק: בודקים את שלושת התנאים של ההגדרה, וכולם מתקיימים.'
      - text: 'מחלקות השקילות של סדרות קושי תמיד מוסיפות נקודות חדשות'
        feedback: >-
          הן מוסיפות נקודה רק לסדרת קושי שאינה מתכנסת ב-$X$. במרחב שלם אין כאלה.
        misconception: MC-c2-completion-of-complete

  - id: Q-2.6-discrete-Q
    type: twotier
    objectives: [OBJ-2.6-1]
    qualitative: true
    level: mid
    prompt: >-
      $\mathbb{Q}$ עם **המטריקה הבדידה**. האם ההשלמה שלו היא $\mathbb{R}$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ההשלמה היא $\mathbb{Q}$ עצמו (עם המטריקה הבדידה). "ההשלמה של $\mathbb{Q}$ היא $\mathbb{R}$" נכון רק
          במרחק הרגיל.
      - text: כן
        feedback: >-
          ההשלמה תלויה במטריקה. במטריקה הבדידה $\mathbb{Q}$ כבר שלם, ושום נקודה אי-רציונלית אינה גבול של רציונליים.
        misconception: MC-c2-completion-ignores-metric
    reasons:
      - text: 'במטריקה הבדידה כל סדרת קושי קבועה מאינדקס מסוים, ולכן $\mathbb{Q}$ שלם והוא ההשלמה של עצמו'
        correct: true
        feedback: >-
          בדיוק. וגם "צפיפות" נכשלת: ב-$\mathbb{R}$ עם המטריקה הבדידה כל נקודה מבודדת, ו-$\mathbb{Q}$ אינו צפוף בו.
      - text: 'הקירובים העשרוניים של $\sqrt2$ הם סדרת קושי בלי גבול רציונלי, ולכן צריך להוסיף את $\sqrt2$'
        feedback: >-
          במטריקה הבדידה הקירובים אינם סדרת קושי: כל שני קירובים שונים במרחק 1.
        misconception: MC-c2-completion-ignores-metric

  - id: Q-2.6-metric-value
    type: numeric
    objectives: [OBJ-2.6-2]
    level: basic
    prompt: >-
      ב-$\widehat{\mathbb{Q}}$, הבנייה של משפט 2.6.8 (מחלקות של סדרות קושי, $\widehat d([(x_n)],[(y_n)])=\lim|x_n-y_n|$), תהי $\xi$
      המחלקה של הקירובים העשרוניים $x_n$: $1,\ 1.4,\ 1.41,\ 1.414,\dots$ של $\sqrt2$, ו-$\eta$ המחלקה של $y_n=2-\frac1n$.
      חשבו את $\widehat d(\xi,\eta)$ (בקירוב עשרוני).
    answer: 0.5857864376
    tolerance: 0.001
    correctFeedback: >-
      נכון: $2-\sqrt2\approx0.5858$. $x_n\to\sqrt2$ ו-$y_n\to2$ ב-$\mathbb{R}$, ולכן $|x_n-y_n|\to2-\sqrt2$. כאן
      $\eta$ היא המחלקה של הסדרה הקבועה 2, כלומר הנקודה $\iota(2)$.
    wrongFeedback: >-
      המטריקה היא גבול של המרחקים בין האיברים, לא המרחק בין איברים מסוימים. לאן שואפות שתי הסדרות ב-$\mathbb{R}$?
    commonWrong:
      - value: 0
        feedback: >-
          0 הוא $|x_1-y_1|=|1-1|$, המרחק בין האיברים הראשונים. $\widehat d$ מוגדר כגבול, ולא תלוי באף מספר סופי של איברים
          (אחרת הוא היה תלוי בנציג); ו-$\widehat d=0$ היה אומר ש-$\xi=\eta$, כלומר ש-$\sqrt2=2$.
        misconception: MC-c2-metric-not-well-defined
      - value: 0.1
        feedback: >-
          $0.1=|x_2-y_2|=|1.4-1.5|$: שוב מרחק באינדקס מסוים. צריך את הגבול כש-$n\to\infty$.
        misconception: MC-c2-metric-not-well-defined

  - id: Q-2.6-well-defined
    type: rank
    objectives: [OBJ-2.6-2]
    level: mid
    prompt: >-
      סדרו את שלבי ההוכחה ש-$\widehat d([(x_n)],[(y_n)])=\lim_n d(x_n,y_n)$ מוגדר היטב על מחלקות השקילות של סדרות קושי.
    help: גררו את השלבים לסדר הנכון, מהשלב הראשון של ההוכחה לאחרון.
    items:
      - id: four
        label: 'מאי-שוויון המשולש (פעמיים): $|d(x_n,y_n)-d(x_m,y_m)|\le d(x_n,x_m)+d(y_n,y_m)$.'
      - id: cauchy
        label: 'שתי הסדרות הן סדרות קושי, ולכן $\big(d(x_n,y_n)\big)$ היא סדרת קושי ב-$\mathbb{R}$, ומתכנסת כי $\mathbb{R}$ שלם.'
      - id: reps
        label: 'אם $(x_n'')\sim(x_n)$ ו-$(y_n'')\sim(y_n)$, אותו אי-שוויון נותן $|d(x_n'',y_n'')-d(x_n,y_n)|\le d(x_n'',x_n)+d(y_n'',y_n)\to0$, ולכן $d(x_n'',y_n'')$ שואפת לאותו גבול שאליו שואפת $d(x_n,y_n)$.'
      - id: done
        label: 'לכן $\widehat d$ תלוי רק במחלקות, לא בנציגים.'
    order: [four, cauchy, reps, done]
    correctFeedback: >-
      נכון. הרעיון: אי-שוויון "המרובע" עושה את שתי העבודות, קיום הגבול ואי-התלות בנציגים. (את האקסיומות של מטריקה
      בודקים אחר כך, במעבר לגבול באקסיומות של $d$.)
    wrongFeedback: >-
      קודם האי-שוויון, ממנו קיום הגבול (קושי ב-$\mathbb{R}$), ורק אז אפשר לשאול אם הגבול תלוי בנציגים.

  - id: Q-2.6-well-defined-why
    type: twotier
    objectives: [OBJ-2.6-2]
    qualitative: true
    level: mid
    prompt: >-
      בהגדרת $\widehat d([(x_n)],[(y_n)])=\lim d(x_n,y_n)$, האם אפשר לדלג על ההוכחה שהגבול קיים?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $x_n$ ו-$y_n$ אינן מתכנסות ב-$X$ באופן כללי, ולכן אין "גבול של מרחקים" מובטח מראש.
      - text: 'כן, זה ברור מההגדרה'
        feedback: >-
          הגדרה שמשתמשת ב-$\lim$ צריכה הוכחה שהגבול קיים, ובמחלקות גם שהוא לא תלוי בנציג.
        misconception: MC-c2-metric-not-well-defined
    reasons:
      - text: '$\big(d(x_n,y_n)\big)$ היא סדרת קושי ב-$\mathbb{R}$ (מאי-שוויון המשולש), ו-$\mathbb{R}$ שלם; את זה צריך להוכיח'
        correct: true
        feedback: >-
          בדיוק. שימו לב שההוכחה משתמשת בשלמות של $\mathbb{R}$. כשבונים כך את $\mathbb{R}$ עצמו מ-$\mathbb{Q}$, אי
          אפשר להשתמש בה, ולכן שם מגדירים את המרחק בדרך אחרת (כמחלקה של הסדרה $|x_n-y_n|$).
      - text: 'הגבול קיים כי $x_n\to x$ ו-$y_n\to y$, ולכן $d(x_n,y_n)\to d(x,y)$'
        feedback: >-
          ב-$X$ אולי אין $x,y$ כאלה: בשביל זה בונים את ההשלמה. הנימוק צריך לעבוד גם בלי גבולות.
        misconception: MC-c2-completion-adds-limits

  - id: Q-2.6-closure
    type: twotier
    objectives: [OBJ-2.6-3]
    qualitative: true
    level: mid
    prompt: >-
      $Y$ מרחב מטרי שלם ו-$X\subseteq Y$ (עם אותה מטריקה). האם הסגור $\overline{X}$ (בתוך $Y$), עם ההכלה, הוא השלמה
      של $X$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון, ולפי היחידות כל השלמה של $X$ איזומטרית ל-$\overline X$. כך מוצאים השלמות בפועל: אם $X$ יושב במרחב
          שלם מוכר, לוקחים את הסגור.
      - text: 'לא, ההשלמה היא $Y$'
        feedback: >-
          $Y$ שלם ומכיל את $X$, אבל $X$ אינו צפוף בו באופן כללי: $(0,1)\subseteq\mathbb{R}$, וההשלמה היא $[0,1]$.
        misconception: MC-c2-completion-any-superset
    reasons:
      - text: '$\overline X$ סגורה במרחב השלם $Y$ ולכן שלמה (שיעור 2.2), $X$ צפופה בסגור שלה, וההכלה שומרת מרחקים'
        correct: true
        feedback: 'בדיוק: שלושת התנאים של ההגדרה, וכל אחד מהם משפט שכבר ידוע.'
      - text: '$Y$ שלם ומכיל את $X$, ולכן $Y$ היא ההשלמה, והסגור הוא רק חלק ממנה'
        feedback: >-
          חסרה הצפיפות. הסגור הוא בדיוק החלק של $Y$ שנקודותיו הן גבולות של נקודות מ-$X$, וזו ההשלמה.
        misconception: MC-c2-completion-any-superset

  - id: Q-2.6-arctan
    type: mc
    objectives: [OBJ-2.6-1, OBJ-2.6-3]
    qualitative: true
    level: mid
    prompt: >-
      מהי ההשלמה של $\mathbb{R}$ עם המטריקה $d(x,y)=|\arctan x-\arctan y|$ (עד כדי איזומטריה)?
    choices:
      - text: 'הקטע $[-\frac\pi2,\frac\pi2]$ עם המרחק הרגיל'
        correct: true
        feedback: >-
          נכון. $x\mapsto\arctan x$ היא איזומטריה מ-$(\mathbb{R},d)$ אל $(-\frac\pi2,\frac\pi2)$ עם המרחק הרגיל, והיא על, וזה
          תת-מרחב של $\mathbb{R}$ השלם; ההשלמה שלו היא הסגור. שתי הנקודות החדשות מתנהגות כמו $\pm\infty$.
      - text: '$\mathbb{R}$ עם המרחק הרגיל'
        feedback: >-
          ההשלמה תלויה במטריקה. ב-$d$ הסדרה $n$ היא סדרת קושי בלי גבול, ולכן ההשלמה חייבת להוסיף לה נקודה.
        misconception: MC-c2-completion-ignores-metric
      - text: '$(\mathbb{R},d)$ עצמו, כי הוא הומיאומורפי ל-$\mathbb{R}$ השלם'
        feedback: >-
          הומיאומורפיזם לא שומר שלמות: $(\mathbb{R},d)$ אינו שלם (שיעור 2.1), ומרחב לא שלם אינו ההשלמה של עצמו.
        misconception: MC-c2-completeness-topological
      - text: '$\mathbb{R}$ ועוד נקודה אחת "באינסוף"'
        feedback: >-
          הסדרות $n$ ו-$-n$ שתיהן סדרות קושי, אבל $d(n,-n)=2\arctan n\to\pi\neq0$: הן אינן שקולות, ולכן מייצגות
          **שתי** נקודות חדשות.
        misconception: MC-c2-completion-ignores-metric

  - id: Q-2.6-unique-proof
    type: rank
    objectives: [OBJ-2.6-3]
    level: exam
    prompt: >-
      $\iota_1:X\to Y_1$ ו-$\iota_2:X\to Y_2$ שתי השלמות של $X$. סדרו את שלבי ההוכחה שיש איזומטריה $\Phi$ של $Y_1$
      **על** $Y_2$ עם $\Phi\circ\iota_1=\iota_2$.
    help: גררו את השלבים לסדר הנכון, מהשלב הראשון של ההוכחה לאחרון.
    items:
      - id: dense
        label: 'על $\iota_1(X)$ נגדיר $\Phi(\iota_1(x))=\iota_2(x)$; זו איזומטריה, כי $d(\iota_2(x),\iota_2(x''))=d(x,x'')=d(\iota_1(x),\iota_1(x''))$.'
      - id: seq
        label: 'יהי $y\in Y_1$. כי $\iota_1(X)$ צפופה, יש $x_n\in X$ עם $\iota_1(x_n)\to y$, ולכן $(x_n)$ סדרת קושי ב-$X$.'
      - id: extend
        label: '$(\iota_2(x_n))$ סדרת קושי ב-$Y_2$ השלם; נגדיר $\Phi(y)=\lim\iota_2(x_n)$, והגבול לא תלוי בבחירת $(x_n)$.'
      - id: iso
        label: 'מעבר לגבול: $d(\Phi(y),\Phi(y''))=\lim d(\iota_2(x_n),\iota_2(x_n''))=\lim d(\iota_1(x_n),\iota_1(x_n''))=d(y,y'')$.'
      - id: onto
        label: '$\Phi(Y_1)$ שלם ולכן סגור ב-$Y_2$, והוא מכיל את $\iota_2(X)$ הצפופה; לכן $\Phi(Y_1)=Y_2$.'
    order: [dense, seq, extend, iso, onto]
    correctFeedback: >-
      נכון. הרעיון: איזומטריה מקבוצה צפופה אל מרחב שלם נמשכת באופן יחיד לכל המרחב, דרך גבולות של סדרות קושי. ה"על" בא מכך
      שתמונה שלמה סגורה (שיעור 2.2) ומכילה קבוצה צפופה.
    wrongFeedback: >-
      מגדירים קודם על החלק הצפוף, ממשיכים בעזרת סדרות (צפיפות ב-$Y_1$, שלמות ב-$Y_2$), מראים ששמירת המרחקים עוברת
      לגבול, ולבסוף מראים שההעתקה על.

  - id: Q-2.6-sine-curve
    type: mc
    objectives: [OBJ-2.6-1, OBJ-2.6-3]
    qualitative: true
    level: exam
    prompt: >-
      תהי $G=\left\{\big(x,\sin\tfrac1x\big):\ 0<x\le1\right\}\subseteq\mathbb{R}^2$, הגרף של $\sin\frac1x$, עם המטריקה
      $d_2$ של המישור. מהי ההשלמה של $G$ (עם ההכלה)?
    choices:
      - text: '$G\cup\big(\{0\}\times[-1,1]\big)$'
        correct: true
        feedback: >-
          נכון. $\mathbb{R}^2$ שלם (משפט 2.1.11), ולפי טענה 2.6.2 ההשלמה היא הסגור של $G$. ל-$|y|\le1$, עם
          $t_0=\arcsin y$ ו-$x_n=\frac1{t_0+2\pi n}\in(0,1)$, הנקודות $(x_n,\sin\frac1{x_n})=(x_n,y)$ שואפות ל-$(0,y)$.
          להפך, גבול $(x,y)$ של נקודות $(x_n,\sin\frac1{x_n})$ מקיים $x\in[0,1]$ (משפט 1.5.9); אם $x>0$ אז
          $y=\sin\frac1x$ מרציפות, ואם $x=0$ אז $|y|\le1$. כל סדרת קושי ב-$G$ ש"בורחת" אל $x=0$ מכוונת לנקודה אחת
          של הקטע.
      - text: '$G\cup\{(0,0)\}$'
        feedback: >-
          ל-$\sin\frac1x$ אין גבול ב-$0$, ולכן אין "נקודת גבול" אחת להוסיף. לכל $y\in[-1,1]$ יש סדרה ב-$G$ שמכוונת
          ל-$(0,y)$, ושתי סדרות כאלה עם $y\ne y'$ אינן שקולות: המרחק ביניהן שואף ל-$|y-y'|$.
        misconception: MC-c2-completion-adds-limits
      - text: '$[0,1]\times[-1,1]$'
        feedback: >-
          המלבן שלם ומכיל את $G$, אבל $G$ אינה צפופה בו: הנקודה $(1,0)$ במרחק חיובי מ-$G$ (שם $\sin1\approx0.84$, ובקרבת
          $x=1$ הגרף רחוק מ-$0$). ההשלמה היא הסגור, לא כל מרחב שלם שמכיל את $G$.
        misconception: MC-c2-completion-any-superset
      - text: '$G$ עצמה: היא גרף של פונקציה רציפה, ולכן סגורה, ולכן שלמה'
        feedback: >-
          $G$ אינה סגורה ב-$\mathbb{R}^2$: $(0,0)$ היא גבול של $\big(\frac1{\pi n},0\big)\in G$ ואינה ב-$G$. גרף של פונקציה
          רציפה על קטע **לא סגור** אינו בהכרח סגור. ו"סגורה" גוררת "שלמה" רק בתוך מרחב שלם (משפט 2.2.1(א)).
        misconception: MC-c2-closed-implies-complete
