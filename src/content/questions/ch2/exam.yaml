# Chapter 2 exam questions — original, in the style of an 80315 final (not taken from a real exam).
# Each is worth 25 points in lettered parts, with at least one open part graded against a model solution and a rubric.
chapter: 2
questions:
  - id: Q-2-exam-1
    type: exam
    title: איטרציה לשורש של 2
    prompt: >-
      נתונה הפונקציה $g(x)=\frac x2+\frac1x$, והסדרה $x_{n+1}=g(x_n)$.
    parts:
      - label: א
        points: 9
        type: open
        objectives: [OBJ-2.3-1, OBJ-2.3-3, OBJ-2.2-1]
        prompt: >-
          הוכיחו שמשפט נקודת השבת של בנך חל על $g$ בקטע $X=[1,2]$ עם מקדם כיווץ $q=\frac12$, ומצאו את נקודת השבת. מה
          המשפט אומר על הסדרה $x_n$ כש-$x_0\in[1,2]$?
        solution:
          - kind: given
            text: '$g(x)=\frac x2+\frac1x$ על $X=[1,2]$, עם המרחק הרגיל.'
          - kind: goal
            text: >-
              $X$ שלם, $g(X)\subseteq X$, ו-$|g(x)-g(y)|\le\frac12|x-y|$ לכל $x,y\in X$; ומכאן נקודת שבת יחידה והתכנסות
              האיטרציות אליה.
          - kind: idea
            text: >-
              בודקים את שלוש ההנחות של משפט בנך אחת-אחת: שלמות מסגירות, הכלה מהמקסימום והמינימום של $g$, ומקדם כיווץ
              מסופרמום הנגזרת על **כל** הקטע.
          - kind: step
            text: '$[1,2]$ סגור ב-$\mathbb{R}$, ו-$\mathbb{R}$ שלם (משפט 2.1.10), ולכן $[1,2]$ שלם (מסקנה 2.2.2).'
          - kind: computation
            text: >-
              $g'(x)=\frac12-\frac1{x^2}$: שלילית על $[1,\sqrt2)$ וחיובית על $(\sqrt2,2]$. לכן המינימום הוא
              $g(\sqrt2)=\sqrt2$ והמקסימום $\max(g(1),g(2))=\frac32$, כלומר $g([1,2])=[\sqrt2,\frac32]\subseteq[1,2]$.
          - kind: computation
            text: >-
              $g'$ עולה על $[1,2]$, מ-$g'(1)=-\frac12$ עד $g'(2)=\frac14$, ולכן $|g'|\le\frac12$ על הקטע. לפי משפט הערך
              הממוצע (זו טענה 2.3.6), $|g(x)-g(y)|=|g'(c)|\,|x-y|\le\frac12|x-y|$.
          - kind: theorem
            text: >-
              משפט בנך: ל-$g$ נקודת שבת יחידה $x^*\in[1,2]$, והסדרה $x_n$ מתכנסת אליה מכל $x_0\in[1,2]$.
          - kind: computation
            text: '$g(x)=x\iff\frac1x=\frac x2\iff x^2=2$, והפתרון בקטע הוא $x^*=\sqrt2$.'
          - kind: result
            text: >-
              נקודת השבת היחידה ב-$[1,2]$ היא $\sqrt2$, ולכל $x_0\in[1,2]$ מתקיים $x_n\to\sqrt2$, עם
              $|x_n-\sqrt2|\le2^{1-n}|x_1-x_0|$.
        rubric:
          - text: 'השלמות של $[1,2]$ מנומקת (סגור במרחב שלם)'
            weight: 2
          - text: 'ההכלה $g([1,2])\subseteq[1,2]$ מוכחת בחישוב, לא רק נטענת'
            weight: 2
          - text: 'מקדם הכיווץ $\frac12$ מסופרמום $|g''|$ על כל הקטע, עם משפט הערך הממוצע'
            weight: 3
          - text: 'נקודת השבת $\sqrt2$, ומסקנת המשפט: יחידות והתכנסות מכל נקודת התחלה בקטע'
            weight: 2

      - label: ב
        points: 5
        type: numeric
        standalone: false
        objectives: [OBJ-2.3-2]
        prompt: >-
          עם $x_0=1$ ו-$q=\frac12$ מסעיף א: מהו ה-$n$ הקטן ביותר שעבורו החסם המוקדם $\frac{q^n}{1-q}\,|x_1-x_0|$ קטן
          מ-$10^{-6}$?
        answer: 20
        tolerance: 0.001
        correctFeedback: >-
          נכון. $x_1=g(1)=\frac32$, ולכן החסם הוא $\frac{2^{-n}}{1/2}\cdot\frac12=2^{-n}$; $2^{-19}\approx1.9\cdot10^{-6}$
          ו-$2^{-20}\approx9.5\cdot10^{-7}$.
        wrongFeedback: >-
          חשבו את $x_1$, את $|x_1-x_0|$, ופשטו את החסם לחזקה של 2.
        commonWrong:
          - value: 19
            feedback: >-
              19 מתקבל מ-$q^n|x_1-x_0|$, בלי הגורם $\frac1{1-q}=2$ שסוכם את כל הצעדים הבאים.
            misconception: MC-c2-bound-formula

      - label: ג
        points: 6
        type: twotier
        objectives: [OBJ-2.3-3, OBJ-2.1-3]
        qualitative: true
        prompt: >-
          האם משפט בנך חל על $g$ גם בקטע **הלא חסום** $X=[1,\infty)$?
        choices:
          - text: כן
            correct: true
            feedback: >-
              נכון, ולכן מכל $x_0\ge1$ האיטרציות מתכנסות ל-$\sqrt2$.
          - text: 'לא, כי $[1,\infty)$ אינו חסום ולכן אינו שלם'
            feedback: >-
              שלמות אינה חסימות: $[1,\infty)$ סגור ב-$\mathbb{R}$ ולכן שלם.
            misconception: MC-c2-complete-closed-bounded
        reasons:
          - text: '$[1,\infty)$ סגור ולכן שלם; $g(x)\ge\sqrt2\ge1$ (ממוצע חשבוני-הנדסי של $\frac x2$ ו-$\frac1x$); ו-$g''(x)=\frac12-\frac1{x^2}\in[-\frac12,\frac12)$, כך ש-$q=\frac12$'
            correct: true
            feedback: >-
              בדיוק. הנגזרת מתקרבת ל-$\frac12$ כש-$x\to\infty$ ולא עוברת אותו, ולכן $\frac12$ עדיין מקדם כיווץ.
          - text: '$g''(x)\to\frac12$ כש-$x\to\infty$, ולכן אין מקדם כיווץ אחיד'
            feedback: >-
              מקדם כיווץ צריך לחסום את $|g'|$ ולהיות קטן מ-1. כאן $\sup|g'|=\frac12<1$, וזה מספיק (טענה 2.3.6); זה
              ש-$|g'|$ מתקרב לחסם אינו מפריע.
            misconception: MC-c2-shrinking-is-contraction

      - label: ד
        points: 5
        type: mc
        standalone: false
        objectives: [OBJ-2.3-2]
        qualitative: true
        prompt: >-
          בפועל, מ-$x_0=1$: $x_3\approx1.4142157$ ו-$|x_4-\sqrt2|<2\cdot10^{-12}$. כלומר ארבעה צעדים מספיקים, והחסם בסעיף
          ב ביקש עשרים. מה נכון?
        choices:
          - text: 'אין סתירה: החסם מבטיח שגיאה לכל מכווצת עם $q=\frac12$; כאן $g''(\sqrt2)=0$, וליד נקודת השבת ההתכנסות מהירה בהרבה'
            correct: true
            feedback: >-
              נכון. החסם צריך לעבוד לכל העתקה עם אותו $q$, למשל גם ל-$\frac x2+c$, שבה הוא הדוק בדיוק: שם $|x_1-x_0|=(1-q)|x_0-x^*|$, והחסם שווה לשגיאה $2^{-n}|x_0-x^*|$. ל-$g$ הזו
              הכיווץ האמיתי ליד $\sqrt2$ חזק בהרבה (זו שיטת ניוטון לשורש של 2).
          - text: 'יש טעות בסעיף ב: החסם היה צריך לתת 4'
            feedback: >-
              החסם לא מודד את השגיאה, הוא חוסם אותה. 20 נכון לחסם; 4 הוא מה שקרה בפועל.
            misconception: MC-c2-estimate-is-exact
          - text: 'מקדם הכיווץ הנכון הוא $0$, כי $g''(\sqrt2)=0$'
            feedback: >-
              הנגזרת בנקודת השבת אינה מקדם כיווץ: ב-$x=1$ השיפוע $-\frac12$. מקדם כיווץ חייב לעבוד לכל הזוגות בקטע.
            misconception: MC-c2-q-at-one-point

  - id: Q-2-exam-2
    type: exam
    title: שתי נורמות על הפונקציות הרציפות
    prompt: >-
      לכל $n\ge2$ תהי $f_n\in C[0,1]$ ה"רמפה": $f_n=0$ על $[0,\frac12]$, $f_n(x)=n(x-\frac12)$ על
      $[\frac12,\frac12+\frac1n]$, ו-$f_n=1$ על $[\frac12+\frac1n,1]$. נסמן $X=(C[0,1],\|\cdot\|_1)$, עם
      $\|f\|_1=\int_0^1|f|$.
    parts:
      - label: א
        points: 10
        type: open
        objectives: [OBJ-2.2-3, OBJ-2.1-1]
        prompt: >-
          הוכיחו ש-$(f_n)$ סדרת קושי ב-$X$, ושאין לה גבול ב-$X$. הסיקו ש-$X$ אינו שלם.
        solution:
          - kind: given
            text: 'הרמפות $f_n$, והמרחב $X=(C[0,1],\|\cdot\|_1)$.'
          - kind: goal
            text: '$(f_n)$ סדרת קושי ב-$X$, ואין $g\in C[0,1]$ עם $\|f_n-g\|_1\to0$.'
          - kind: idea
            text: >-
              את המרחקים מחשבים כשטחים. גבול רציף היה חייב להתאפס משמאל ל-$\frac12$ ולהיות 1 מימין לו, ואין פונקציה רציפה
              כזו. צריך לשלול **כל** $g$ רציפה, לא רק את פונקציית המדרגה.
          - kind: computation
            text: >-
              $\int_0^1f_n=\left(\frac12-\frac1n\right)+\frac1{2n}=\frac12-\frac1{2n}$. ל-$m>n$ מתקיים $f_m\ge f_n$: על
              $[0,\frac12]$ שתיהן 0; על $[\frac12,\frac12+\frac1m]$ מתקיים $m(x-\frac12)\ge n(x-\frac12)$; ועל
              $[\frac12+\frac1m,1]$ מתקיים $f_m=1\ge f_n$. לכן
              $\|f_n-f_m\|_1=\int(f_m-f_n)=\frac1{2n}-\frac1{2m}<\frac1{2n}$.
          - kind: step
            text: >-
              יהי $\varepsilon>0$ ו-$N>\frac1{2\varepsilon}$. לכל $m>n>N$: $\|f_n-f_m\|_1<\frac1{2n}<\varepsilon$. לכן
              $(f_n)$ סדרת קושי.
          - kind: step
            text: >-
              נניח ש-$g\in C[0,1]$ ו-$\|f_n-g\|_1\to0$. כי $f_n=0$ על $[0,\frac12]$:
              $\int_0^{1/2}|g|=\int_0^{1/2}|f_n-g|\le\|f_n-g\|_1\to0$. אז $\int_0^{1/2}|g|=0$, ו-$|g|$ רציפה ואי-שלילית,
              ולכן $g=0$ על $[0,\frac12]$ (למה 1.2.19).
          - kind: step
            text: >-
              יהי $c\in(\frac12,1)$. לכל $n>\frac{1}{c-1/2}$ מתקיים $f_n=1$ על $[c,1]$, ולכן
              $\int_c^1|g-1|\le\|f_n-g\|_1\to0$; $|g-1|$ רציפה ואי-שלילית, ולכן $g=1$ על $[c,1]$ (למה 1.2.19). כי $c$
              שרירותי, $g=1$ על $\bigcup_{c\in(1/2,1)}[c,1]=(\frac12,1]$.
          - kind: check
            text: >-
              $g(\frac12)=0$ אבל $\lim_{x\to1/2^+}g(x)=1$: $g$ אינה רציפה ב-$\frac12$, בסתירה ל-$g\in C[0,1]$.
          - kind: result
            text: '$(f_n)$ סדרת קושי ב-$X$ בלי גבול ב-$X$, ולכן $(C[0,1],\|\cdot\|_1)$ אינו שלם.'
        rubric:
          - text: 'חישוב נכון של $\|f_n-f_m\|_1$ והסקה מפורשת של תנאי קושי'
            weight: 3
          - text: 'מ-$\|f_n-g\|_1\to0$ נובע $g=0$ על $[0,\frac12]$, עם השימוש ברציפות ובאי-שליליות'
            weight: 2
          - text: '$g=1$ על $(\frac12,1]$, דרך קטעים $[c,1]$ שעליהם $f_n=1$ מ-$n$ מסוים'
            weight: 3
          - text: 'הסתירה לרציפות, והמסקנה נשללת לכל $g$ רציפה (לא רק לגבול הנקודתי)'
            weight: 2

      - label: ב
        points: 4
        type: numeric
        objectives: [OBJ-2.2-3]
        prompt: >-
          חשבו את $\|f_3-f_6\|_1$.
        answer: 0.0833333333
        tolerance: 0.001
        correctFeedback: >-
          נכון, $\frac1{12}$: $\frac1{2\cdot3}-\frac1{2\cdot6}=\frac16-\frac1{12}$.
        wrongFeedback: >-
          השתמשו ב-$\|f_n-f_m\|_1=\frac1{2n}-\frac1{2m}$ ל-$m>n$, או חשבו את השטח בין הגרפים ישירות.
        commonWrong:
          - value: 0.5
            feedback: >-
              $\frac12=\|f_3-f_6\|_\infty$, ההפרש הגדול ביותר (ב-$x=\frac23$). כאן הנורמה היא האינטגרל.
            misconception: MC-c2-norm-irrelevant

      - label: ג
        points: 5
        type: twotier
        objectives: [OBJ-2.2-2, OBJ-2.2-3]
        qualitative: true
        prompt: >-
          האם $(f_n)$ סדרת קושי גם בנורמת הסופרמום $\|\cdot\|_\infty$?
        choices:
          - text: לא
            correct: true
            feedback: >-
              נכון. וטוב שכך: $(C[0,1],\|\cdot\|_\infty)$ שלם, ולו הייתה סדרת קושי בו, היה לה גבול רציף.
          - text: 'כן, כי $\|\cdot\|_1\le\|\cdot\|_\infty$'
            feedback: >-
              אי-השוויון $\|h\|_1\le\|h\|_\infty$ מעביר תנאי קושי **מ**-$\|\cdot\|_\infty$ **ל**-$\|\cdot\|_1$, לא בכיוון
              ההפוך.
            misconception: MC-c2-norm-irrelevant
        reasons:
          - text: 'ב-$x=\frac12+\frac1{2n}$: $f_{2n}=1$ ו-$f_n=\frac12$, ולכן $\|f_n-f_{2n}\|_\infty\ge\frac12$ לכל $n$'
            correct: true
            feedback: 'בדיוק: לכל $N$ יש זוג אחריו ($n$ ו-$2n$) במרחק $\frac12$.'
          - text: 'הסדרה מתכנסת נקודתית, ולכן היא סדרת קושי בכל נורמה'
            feedback: >-
              התכנסות נקודתית אינה תנאי קושי בנורמת הסופרמום (ראו $x^n$). כאן הגבול הנקודתי אפילו לא רציף.
            misconception: MC-c2-pointwise-limit-enough

      - label: ד
        points: 6
        type: mc
        standalone: false
        objectives: [OBJ-2.6-1, OBJ-2.6-2]
        qualitative: true
        prompt: >-
          תהי $\iota:X\to\widehat X$ ההשלמה של $X$, הבנויה ממחלקות שקילות של סדרות קושי. מה נכון לגבי המחלקה $[(f_n)]$?
        choices:
          - text: 'היא נקודה של $\widehat X$ שאינה בתמונה $i(X)$'
            correct: true
            feedback: >-
              נכון. $\iota(g)$ היא המחלקה של הסדרה הקבועה $g$, ו-$(f_n)\sim(g,g,\dots)$ פירושו $\|f_n-g\|_1\to0$, וזה בדיוק
              מה שסעיף א שולל. זו "נקודה חדשה", שמתנהגת כמו פונקציית המדרגה.
          - text: 'היא שווה ל-$\iota(g)$, כאשר $g$ היא הגבול הנקודתי של $f_n$'
            feedback: >-
              הגבול הנקודתי (המדרגה) אינו רציף, ולכן אינו איבר של $X$ בכלל; ו-$\iota$ מוגדרת רק על $X$.
            misconception: MC-c2-completion-adds-limits
          - text: 'היא שווה למחלקה של הסדרה $(f_2,f_2,f_2,\dots)$, כי $f_n$ ו-$f_2$ שוות על $[0,\frac12]$'
            feedback: >-
              שקילות היא $\|f_n-f_2\|_1\to0$, ו-$\|f_n-f_2\|_1=\frac14-\frac1{2n}\to\frac14\ne0$. שוויון על חלק מהקטע לא
              מספיק.
            misconception: MC-c2-equivalence-too-strict
          - text: '$\widehat X$ הוא $(C[0,1],\|\cdot\|_\infty)$, כי הוא שלם ומכיל אותן פונקציות'
            feedback: >-
              הזהות $X\to(C[0,1],\|\cdot\|_\infty)$ אינה איזומטריה (הנורמות שונות), והרמפות אינן סדרת קושי בנורמה
              השנייה (סעיף ג). השלמה תלויה במטריקה.
            misconception: MC-c2-completion-ignores-metric

  - id: Q-2-exam-3
    type: exam
    title: טורים במרחב בנך וטור נוימן
    prompt: >-
      $(V,\|\cdot\|)$ מרחב בנך. בסעיפים ב–ד, $A$ היא מטריצה $n\times n$, ו-$\|A\|$ היא נורמת האופרטור שלה ביחס
      ל-$\|\cdot\|_\infty$ על $\mathbb{R}^n$ (המקסימום על השורות של סכום הערכים המוחלטים בשורה, משפט 1.8.9).
    parts:
      - label: א
        points: 8
        type: open
        objectives: [OBJ-2.4-1]
        prompt: >-
          הוכיחו: אם $x_k\in V$ ו-$\sum_k\|x_k\|<\infty$, אז הטור $\sum_kx_k$ מתכנס ב-$V$, ו-$\left\|\sum_kx_k\right\|\le\sum_k\|x_k\|$.
        solution:
          - kind: given
            text: '$V$ מרחב בנך, $\sum_k\|x_k\|<\infty$. נסמן $S_n=\sum_{k=1}^nx_k$.'
          - kind: goal
            text: '$(S_n)$ מתכנסת ב-$V$ לאיזה $S$, ו-$\|S\|\le\sum_k\|x_k\|$.'
          - kind: idea
            text: >-
              תנאי קושי של הטור הממשי $\sum\|x_k\|$ עובר דרך אי-שוויון המשולש לסכומים החלקיים; את הגבול נותנת השלמות,
              ואת אי-השוויון מעבר לגבול.
          - kind: step
            text: >-
              יהי $\varepsilon>0$. לפי קריטריון קושי לטורים ממשיים יש $N$ כך ש-$\sum_{k=n+1}^m\|x_k\|<\varepsilon$ לכל
              $m>n>N$.
          - kind: step
            text: >-
              לכל $m>n>N$: $\|S_m-S_n\|=\left\|\sum_{k=n+1}^mx_k\right\|\le\sum_{k=n+1}^m\|x_k\|<\varepsilon$. לכן $(S_n)$
              סדרת קושי ב-$V$.
          - kind: theorem
            text: '$V$ שלם, ולכן $S_n\to S$ לאיזה $S\in V$: הטור מתכנס.'
          - kind: step
            text: >-
              לכל $n$: $\|S_n\|\le\sum_{k=1}^n\|x_k\|\le\sum_{k=1}^\infty\|x_k\|$. הנורמה רציפה
              ($\big|\|S_n\|-\|S\|\big|\le\|S_n-S\|$), ולכן במעבר לגבול $\|S\|\le\sum_k\|x_k\|$.
          - kind: result
            text: 'הטור $\sum x_k$ מתכנס ב-$V$, וסכומו מקיים $\left\|\sum x_k\right\|\le\sum\|x_k\|$.'
        rubric:
          - text: 'תנאי קושי של הטור הממשי מנוסח נכון'
            weight: 2
          - text: 'אי-שוויון המשולש מעביר אותו לסכומים החלקיים: $(S_n)$ סדרת קושי'
            weight: 3
          - text: 'השימוש בשלמות של $V$ מפורש'
            weight: 2
          - text: 'אי-השוויון על הנורמה בגבול, עם רציפות הנורמה'
            weight: 1

      - label: ב
        points: 8
        type: open
        objectives: [OBJ-2.4-3]
        prompt: >-
          הוכיחו שאם $\|A\|<1$ אז $I-A$ הפיכה ו-$\|(I-A)^{-1}\|\le\frac1{1-\|A\|}$. מותר להשתמש בסעיף א.
        solution:
          - kind: given
            text: 'מטריצה $A$ עם $\|A\|<1$, בנורמת האופרטור.'
          - kind: goal
            text: '$I-A$ הפיכה, $(I-A)^{-1}=\sum_{k\ge0}A^k$, ו-$\|(I-A)^{-1}\|\le\frac1{1-\|A\|}$.'
          - kind: idea
            text: 'כמו $\frac1{1-t}=\sum t^k$ ל-$|t|<1$: הטור מתכנס בהחלט, וטלסקופ מראה שסכומו הוא ההופכית.'
          - kind: step
            text: >-
              מרחב המטריצות עם נורמת האופרטור הוא מרחב בנך: כל איבר מקיים $|a_{ij}|\le\|A\|$, ו-$\|A\|\le\sum_{i,j}|a_{ij}|$;
              לכן סדרת קושי בנורמה היא סדרת קושי בכל איבר, מתכנסת איבר-איבר (משפט 2.1.10), ולכן גם בנורמה (זה מקרה
              פרטי של משפט 2.4.8).
          - kind: step
            text: >-
              $\|A^k\|\le\|A\|^k$ (תת-כפליות), ולכן $\sum_k\|A^k\|\le\frac1{1-\|A\|}<\infty$. לפי סעיף א, $S=\sum_{k\ge0}A^k$
              מתכנס ו-$\|S\|\le\frac1{1-\|A\|}$.
          - kind: computation
            text: '$(I-A)\sum_{k=0}^NA^k=\left(\sum_{k=0}^NA^k\right)(I-A)=I-A^{N+1}$.'
          - kind: step
            text: >-
              $\|A^{N+1}\|\le\|A\|^{N+1}\to0$. כפל במטריצה קבועה רציף בנורמה: $\|(I-A)M\|\le\|I-A\|\,\|M\|$ (טענה
              1.8.6), ולכן $(I-A)\sum_{k=0}^NA^k\to(I-A)S$, וכך גם מימין. במעבר לגבול $(I-A)S=S(I-A)=I$.
          - kind: result
            text: '$I-A$ הפיכה, $(I-A)^{-1}=\sum_{k\ge0}A^k$, ו-$\|(I-A)^{-1}\|\le\frac1{1-\|A\|}$.'
        rubric:
          - text: 'חסם $\|A^k\|\le\|A\|^k$ והתכנסות בהחלט של הטור'
            weight: 2
          - text: 'נימוק לשלמות מרחב המטריצות (או הפניה מפורשת אליה) והפעלת סעיף א'
            weight: 2
          - text: 'הזהות הטלסקופית משני הצדדים, ומעבר לגבול מוצדק'
            weight: 3
          - text: 'החסם על נורמת ההופכית'
            weight: 1

      - label: ג
        points: 5
        type: numeric
        objectives: [OBJ-2.4-3]
        prompt: >-
          $A=\begin{pmatrix}0.2&0.4\\0.3&0.1\end{pmatrix}$, ולכן $\|A\|=0.6$ והחסם מסעיף ב הוא $2.5$. חשבו את
          $\|(I-A)^{-1}\|$ המדויקת. (אפשר לענות בשבר.)
        answer: 2.1666666667
        tolerance: 0.001
        correctFeedback: >-
          נכון, $\frac{13}6$. $\det(I-A)=0.8\cdot0.9-0.4\cdot0.3=0.6$, ולכן
          $(I-A)^{-1}=\frac1{0.6}\begin{pmatrix}0.9&0.4\\0.3&0.8\end{pmatrix}=\begin{pmatrix}\frac32&\frac23\\\frac12&\frac43\end{pmatrix}$,
          וסכומי השורות $\frac{13}6$ ו-$\frac{11}6$.
        wrongFeedback: >-
          חשבו את $I-A$, את ההופכית שלה (מטריצה $2\times2$), ואת סכום הערכים המוחלטים בכל שורה.
        commonWrong:
          - value: 2.5
            feedback: >-
              $2.5$ הוא החסם $\frac1{1-0.6}$. החסם מבטיח, הוא לא הערך; כאן הערך $\frac{13}6<2.5$.
            misconception: MC-c2-estimate-is-exact
          - value: 1.5
            feedback: >-
              $\frac32$ הוא האיבר הגדול ביותר של ההופכית. הנורמה היא סכום שורה.
            misconception: MC-c2-neumann-entrywise

      - label: ד
        points: 4
        type: twotier
        objectives: [OBJ-2.4-3]
        qualitative: true
        prompt: >-
          האם $\|A\|\ge1$ גורר ש-$I-A$ אינה הפיכה?
        choices:
          - text: לא
            correct: true
            feedback: 'נכון: התנאי $\|A\|<1$ מספיק, ואינו הכרחי.'
          - text: כן
            feedback: >-
              $A=2I$: $\|A\|=2$, ו-$I-A=-I$ הפיכה.
            misconception: MC-c2-neumann-necessary
        reasons:
          - text: '$A=2I$ נותנת $\|A\|=2$ ו-$I-A=-I$, הפיכה'
            correct: true
            feedback: 'בדיוק. טור נוימן מתבדר כאן, אבל ההופכית קיימת מסיבות אחרות.'
          - text: 'אם $\|A\|\ge1$ טור נוימן מתבדר, ולכן אין הופכית'
            feedback: >-
              התבדרות הטור אומרת רק שהשיטה הזו לא מוצאת את ההופכית, לא שהיא לא קיימת.
            misconception: MC-c2-neumann-necessary

  - id: Q-2-exam-4
    type: exam
    title: משפט החיתוך של קנטור ומרחבים שאינם בני מנייה
    prompt: >-
      $(X,d)$ מרחב מטרי שלם ולא ריק.
    parts:
      - label: א
        points: 10
        type: open
        objectives: [OBJ-2.5-1, OBJ-2.1-1]
        prompt: >-
          נסחו והוכיחו את משפט החיתוך של קנטור: אם $F_1\supseteq F_2\supseteq\cdots$ קבוצות סגורות לא ריקות ב-$X$ עם
          $\operatorname{diam}F_n\to0$, אז $\bigcap_nF_n$ מכיל נקודה אחת בדיוק.
        solution:
          - kind: given
            text: >-
              $X$ שלם; $F_1\supseteq F_2\supseteq\cdots$ סגורות ולא ריקות; $\operatorname{diam}F_n\to0$.
          - kind: goal
            text: 'יש $x\in X$ עם $\bigcap_nF_n=\{x\}$.'
          - kind: idea
            text: >-
              בוחרים נקודה בכל קבוצה. כי הקבוצות יורדות והקוטר שואף לאפס, הנקודות נעשות קרובות זו לזו: סדרת קושי. הגבול
              נמצא בכל $F_k$ כי היא סגורה, ונקודה שנייה בחיתוך הייתה במרחק לכל היותר $\operatorname{diam}F_n$ מהראשונה
              לכל $n$.
          - kind: step
            text: 'לכל $n$ נבחר $x_n\in F_n$ (אפשרי כי $F_n\neq\emptyset$; בחירה של סדרה).'
          - kind: step
            text: >-
              יהי $\varepsilon>0$. כי $\operatorname{diam}F_n\to0$, יש $N$ עם $\operatorname{diam}F_N<\varepsilon$. לכל
              $m,n>N$: $x_m\in F_m\subseteq F_N$ ו-$x_n\in F_n\subseteq F_N$, ולכן
              $d(x_m,x_n)\le\operatorname{diam}F_N<\varepsilon$. כלומר $(x_n)$ סדרת קושי.
          - kind: theorem
            text: '$X$ שלם, ולכן $x_n\to x$ עבור $x\in X$ כלשהו.'
          - kind: step
            text: >-
              יהי $k\in\mathbb{N}$. לכל $n\ge k$ מתקיים $x_n\in F_k$, והסדרה $(x_{k-1+j})_{j\ge1}$ היא תת-סדרה של
              $(x_n)$, ולכן מתכנסת ל-$x$ (טענה 1.5.4(א)). כל איבריה ב-$F_k$ הסגורה, ולכן $x\in F_k$ (מסקנה 1.5.8). כי
              $k$ שרירותי, $x\in\bigcap_kF_k$.
          - kind: step
            text: >-
              יהי $y\in\bigcap_nF_n$. לכל $n$ שתי הנקודות $x,y$ ב-$F_n$, ולכן $0\le d(x,y)\le\operatorname{diam}F_n\to0$.
              לכן $d(x,y)=0$, כלומר $y=x$.
          - kind: result
            text: '$\bigcap_nF_n=\{x\}$: נקודה אחת בדיוק.'
        rubric:
          - text: 'בחירת $x_n\in F_n$ והוכחה שהיא סדרת קושי, עם השימוש בכך שהקבוצות יורדות ובקוטר'
            weight: 4
          - text: 'השימוש בשלמות של $X$ לקבלת גבול'
            weight: 1
          - text: 'הגבול נמצא בכל $F_k$: זנב הסדרה ב-$F_k$ וסגירות'
            weight: 3
          - text: 'יחידות הנקודה מהקוטר'
            weight: 2

      - label: ב
        points: 5
        type: twotier
        objectives: [OBJ-2.5-1]
        qualitative: true
        prompt: >-
          נוותר על ההנחה $\operatorname{diam}F_n\to0$: האם במרחב שלם, חיתוך של סדרה יורדת של קבוצות סגורות לא ריקות
          תמיד לא ריק?
        choices:
          - text: לא
            correct: true
            feedback: 'נכון: ההנחה על הקוטר הכרחית, גם כשהמרחב שלם והקבוצות סגורות.'
          - text: כן
            feedback: >-
              ב-$\mathbb{R}$ השלם, $F_n=[n,\infty)$ סגורות, לא ריקות ויורדות, וחיתוכן ריק.
            misconception: MC-c2-cantor-no-diameter
        reasons:
          - text: '$F_n=[n,\infty)$ ב-$\mathbb{R}$: סגורות, לא ריקות, יורדות, ו-$\bigcap_nF_n=\emptyset$ כי לכל $x$ יש $n>x$ (ארכימדס); כאן $\operatorname{diam}F_n=\infty$'
            correct: true
            feedback: >-
              בדיוק. ההוכחה בסעיף א נשברת בצעד של סדרת הקושי: הבחירה $x_n=n$ אינה סדרת קושי.
          - text: 'בוחרים $x_n\in F_n$, והשלמות נותנת לסדרה גבול'
            feedback: >-
              שלמות נותנת גבול רק לסדרת **קושי**, ובלי ההנחה על הקוטר הנקודות שנבחרו אינן חייבות להיות סדרת קושי
              ($x_n=n$).
            misconception: MC-c2-cauchy-always-converges

      - label: ג
        points: 10
        type: open
        objectives: [OBJ-2.5-3, OBJ-2.5-2]
        prompt: >-
          נניח שלמרחב $X$ אין נקודות מבודדות. הוכיחו ש-$X$ אינו בן מנייה. מותר להשתמש במשפט בייר: במרחב מטרי שלם
          ולא ריק, איחוד בן מנייה של קבוצות דלילות הוא בעל פנים ריק.
        solution:
          - kind: given
            text: '$X$ שלם, לא ריק, ואין לו נקודות מבודדות.'
          - kind: goal
            text: '$X$ אינו סופי ואינו בן מנייה אינסופי.'
          - kind: idea
            text: >-
              אילו $X$ היה בן מנייה, הוא היה איחוד בן מנייה של יחידונים. כשאין נקודות מבודדות כל יחידון דליל, ובייר
              אוסר על המרחב כולו (שהפנים שלו הוא המרחב) להיות איחוד כזה.
          - kind: step
            text: >-
              נניח בשלילה ש-$X$ בן מנייה (סופי או אינסופי). כי $X\neq\emptyset$, אפשר לכתוב $X=\{x_k:\ k\in\mathbb{N}\}$
              (אם $X$ סופי, חוזרים על נקודות).
          - kind: step
            text: >-
              כל יחידון $\{x_k\}$ סגור: לכל $y\neq x_k$ הכדור $B(y,d(y,x_k))$ אינו מכיל את $x_k$, ולכן המשלים פתוח.
          - kind: step
            text: >-
              הפנים של $\{x_k\}$ ריק: קבוצה פתוחה לא ריקה המוכלת ב-$\{x_k\}$ היא $\{x_k\}$ עצמה, ואז יש $r>0$ עם
              $B(x_k,r)\subseteq\{x_k\}$, כלומר $B(x_k,r)=\{x_k\}$ ו-$x_k$ מבודדת (הגדרה 1.4.7), בסתירה להנחה.
          - kind: definition
            text: >-
              קבוצה סגורה עם פנים ריק היא דלילה ($\overline{\{x_k\}}=\{x_k\}$ ו-$(\{x_k\})^\circ=\emptyset$), ולכן כל
              $\{x_k\}$ דלילה.
          - kind: theorem
            text: >-
              לפי משפט בייר (המרחב שלם ולא ריק), $\bigcup_k\{x_k\}=X$ בעל פנים ריק. אבל $X$ פתוח ב-$X$, ולכן
              $X^\circ=X\neq\emptyset$. סתירה.
          - kind: result
            text: '$X$ אינו בן מנייה.'
        rubric:
          - text: 'הנחת השלילה בצורת מנייה $X=\{x_k\}$, כולל המקרה הסופי'
            weight: 2
          - text: 'כל יחידון סגור, עם נימוק'
            weight: 2
          - text: 'לכל יחידון פנים ריק, בדיוק מההנחה שאין נקודות מבודדות'
            weight: 3
          - text: 'הפעלה נכונה של בייר, עם השלמות, והסתירה'
            weight: 3
