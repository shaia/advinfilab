# Chapter 8 exam questions — original, in the style of an 80315 final (not taken from a real exam).
# Each is worth 25 points in lettered parts, with at least one open part graded against a model solution and a rubric.
chapter: 6
questions:
  - id: Q-6-exam-1
    type: exam
    title: נקודות קריטיות, סיווג וקיצון מוחלט
    prompt: >-
      נתונה הפונקציה $f(x,y)=x^3-12xy+8y^3$ על $\mathbb{R}^2$.
    parts:
      - label: א
        points: 5
        type: multi
        objectives: [OBJ-6.2-2]
        prompt: >-
          אילו מהנקודות הבאות הן נקודות קריטיות של $f$? סמנו את כולן.
        choices:
          - text: '$(0,0)$'
            correct: true
            feedback: 'נכון. $\nabla f=(3x^2-12y,\ -12x+24y^2)$ מתאפס בראשית.'
          - text: '$(2,1)$'
            correct: true
            feedback: >-
              נכון. מ-$\nabla f=0$: $y=\frac{x^2}{4}$ ו-$x=2y^2$, ולכן $x=\frac{x^4}{8}$, כלומר $x=0$ או $x^3=8$. מתקבלות
              בדיוק $(0,0)$ ו-$(2,1)$.
          - text: '$(-2,1)$'
            feedback: >-
              $\nabla f(-2,1)=(12-12,\ 24+24)=(0,48)$. המשוואה הראשונה מתקיימת ($y=\frac{x^2}{4}$), השנייה לא.
            misconception: MC-c6-solve-separately
          - text: '$(2,-1)$'
            feedback: >-
              $\nabla f(2,-1)=(12+12,\ -24+24)=(24,0)$. המשוואה השנייה ($x=2y^2$) מתקיימת, הראשונה לא.
            misconception: MC-c6-solve-separately

      - label: ב
        points: 6
        type: mc
        standalone: false
        objectives: [OBJ-6.4-2]
        prompt: >-
          סווגו את הנקודות הקריטיות של $f$ בעזרת ההסיאן.
        choices:
          - text: '$(0,0)$ נקודת אוכף, ו-$(2,1)$ נקודת מינימום מקומי ממש'
            correct: true
            feedback: >-
              נכון. $H_f=\begin{pmatrix}6x&-12\\-12&48y\end{pmatrix}$. בראשית $\det H=-144<0$: לא מוגדרת. ב-$(2,1)$
              $H=\begin{pmatrix}12&-12\\-12&48\end{pmatrix}$, $\Delta_1=12>0$ ו-$\det H=576-144=432>0$: חיובית מוגדרת.
          - text: 'ב-$(0,0)$ המבחן אינו מכריע כי האלכסון של ההסיאן אפס, ו-$(2,1)$ נקודת מינימום מקומי ממש'
            feedback: >-
              $\det H_f(0,0)=-144<0$ אומר שהערכים העצמיים בסימנים מנוגדים: לא מוגדרת, אוכף. אלכסון אפס אינו "לא מכריע".
            misconception: MC-c6-sylvester-partial
          - text: '$(0,0)$ נקודת אוכף, ו-$(2,1)$ נקודת מינימום מוחלט של $f$'
            feedback: >-
              המבחן מקומי. $f(-3,0)=-27<-8=f(2,1)$ (ראו סעיף ג).
            misconception: MC-c6-local-is-global
          - text: '$(0,0)$ נקודת אוכף, ו-$(2,1)$ נקודת אוכף כי יש בהסיאן איברים שליליים'
            feedback: >-
              סימני האיברים אינם קובעים. $\Delta_1=12>0$ ו-$\Delta_2=432>0$, ולכן ההסיאן ב-$(2,1)$ חיובי מוגדר.
            misconception: MC-c6-positive-entries

      - label: ג
        points: 8
        type: open
        objectives: [OBJ-6.2-3, OBJ-6.5-3]
        prompt: >-
          הוכיחו, **בלי** להשתמש בהסיאן, ש-$(0,0)$ אינה נקודת קיצון מקומי של $f$, ושל-$f$ אין מינימום מוחלט
          ב-$\mathbb{R}^2$ (בפרט $(2,1)$, שבה $f=-8$, אינה נקודת מינימום מוחלט).
        solution:
          - kind: given
            text: '$f(x,y)=x^3-12xy+8y^3$, ו-$f(0,0)=0$, $f(2,1)=8-24+8=-8$.'
          - kind: goal
            text: >-
              (1) בכל כדור סביב הראשית יש ערכים גדולים מ-0 וערכים קטנים מ-0. (2) לכל נקודה $p$ יש נקודה $q$ עם
              $f(q)<f(p)$.
          - kind: idea
            text: >-
              לצמצם את $f$ לציר $x$: שם $f(x,0)=x^3$, פונקציה של משתנה אחד שמחליפה סימן ב-0 ואינה חסומה מלרע.
          - kind: step
            text: >-
              לכל $t>0$: $f(t,0)=t^3>0=f(0,0)$ ו-$f(-t,0)=-t^3<0=f(0,0)$. כל כדור $B(0,r)$ מכיל את $(\pm t,0)$ עבור
              $0<t<r$.
          - kind: step
            text: >-
              לכן הראשית אינה מינימום מקומי (יש ערכים קטנים ממנה קרוב ככל שנרצה) ואינה מקסימום מקומי: היא נקודה קריטית
              שאינה קיצון, כלומר נקודת אוכף.
          - kind: step
            text: >-
              $f(x,0)=x^3\to-\infty$ כש-$x\to-\infty$. לכן לכל נקודה $p$ יש $x$ עם $f(x,0)<f(p)$, ול-$f$ אין מינימום
              מוחלט.
          - kind: check
            text: 'למשל $f(-3,0)=-27<-8=f(2,1)$.'
          - kind: result
            text: >-
              $(0,0)$ נקודת אוכף; $f$ אינה חסומה מלרע ולכן אין לה מינימום מוחלט, ו-$(2,1)$ היא מינימום מקומי בלבד.
        rubric:
          - text: 'מסלול (למשל ציר $x$) שעליו $f$ מקבלת ליד הראשית גם ערכים חיוביים וגם שליליים'
            weight: 3
          - text: 'המסקנה מנוסחת לפי ההגדרה: בכל כדור סביב הראשית יש ערכים גבוהים ונמוכים מ-$f(0,0)$'
            weight: 2
          - text: 'הוכחה ש-$f$ אינה חסומה מלרע, למשל $f(x,0)\to-\infty$'
            weight: 2
          - text: 'השוואה מפורשת ל-$f(2,1)=-8$, או הסבר ישיר למה אין מינימום מוחלט'
            weight: 1

      - label: ד
        points: 6
        type: twotier
        qualitative: true
        objectives: [OBJ-6.5-1, OBJ-6.5-2]
        prompt: >-
          נכון או לא נכון: על הריבוע $Q=[0,3]\times[0,3]$ המינימום המוחלט של $f$ הוא $f(2,1)=-8$.
        choices:
          - text: נכון
            correct: true
            feedback: 'נכון. המינימום קיים ומתקבל בנקודה הקריטית הפנימית $(2,1)$.'
          - text: לא נכון
            feedback: >-
              על $Q$ המצב שונה מאשר במישור: $Q$ קומפקטי, והשוואת המועמדים מראה שערכי השפה כולם גדולים מ-$(-8)$.
            misconception: MC-c6-noncompact-no-extremum
        reasons:
          - text: >-
              $Q$ קומפקטי, ולכן יש מינימום; המועמדים הם $(2,1)$ בפנים ($f=-8$) ונקודות השפה, ועל הצלעות $f\ge27-12\sqrt6\approx-2.39$
            correct: true
            feedback: >-
              בדיוק. על $y=0$: $x^3\ge0$; על $x=0$: $8y^3\ge0$; על $y=3$: $x^3-36x+216$ יורדת על $[0,3]$ ו-$\ge135$; על
              $x=3$: $27-36y+8y^3$ מינימלית ב-$y=\sqrt{3/2}$ עם ערך $27-12\sqrt6$. כולם גדולים מ-$(-8)$.
          - text: >-
              $(2,1)$ נקודת מינימום מקומי ממש לפי ההסיאן, ולכן היא המינימום של $f$ על כל קבוצה שמכילה אותה
            feedback: >-
              במישור כולו זה כבר נכשל ($f(-3,0)=-27$). על $Q$ המסקנה נכונה רק אחרי בדיקת השפה.
            misconception: MC-c6-local-is-global
          - text: >-
              המינימום של פונקציה על ריבוע מתקבל בקודקוד, וכאן הקודקודים נותנים ערכים גדולים, אז יש לבדוק רק את $(2,1)$
            feedback: >-
              הקודקודים ($0,27,216,135$) הם רק חלק מהשפה; על הצלע $x=3$ הערך יורד עד $27-12\sqrt6$, באמצע הצלע.
            misconception: MC-c6-only-corners

  - id: Q-6-exam-2
    type: exam
    title: משפחה של תבניות ריבועיות
    prompt: >-
      לכל $k\in\mathbb{R}$ נתונה הפונקציה $f_k(x,y,z)=x^2+y^2+\frac k2z^2+xy+xz+yz$. הראשית נקודה קריטית של $f_k$,
      וההסיאן שם הוא $A_k=\begin{pmatrix}2&1&1\\1&2&1\\1&1&k\end{pmatrix}$. שימו לב ש-$f_k(h)=\frac12h^{T}A_kh$ בדיוק.
    parts:
      - label: א
        points: 5
        type: numeric
        objectives: [OBJ-6.3-2]
        prompt: >-
          מצאו את המספר $k_0$ כך ש-$A_k$ חיובית מוגדרת אם ורק אם $k>k_0$.
        answer: 0.6666667
        tolerance: 0.001
        correctFeedback: >-
          נכון, $k_0=\frac23$. $\Delta_1=2$, $\Delta_2=3$, ו-$\Delta_3=2(2k-1)-1(k-1)+1(1-2)=3k-2$. לפי סילבסטר
          חיובית מוגדרת בדיוק כש-$3k-2>0$.
        wrongFeedback: >-
          חשבו את שלושת המינורים המובילים. רק $\Delta_3=\det A_k$ תלוי ב-$k$.
        commonWrong:
          - value: 0
            feedback: >-
              $k>0$ מבטיח רק שאיבר האלכסון $a_{33}$ חיובי. למשל ב-$k=\frac12$: $\Delta_3=-\frac12<0$, ו-$A_k$ לא מוגדרת.
            misconception: MC-c6-diagonal-decides

      - label: ב
        points: 5
        type: mc
        objectives: [OBJ-6.4-2]
        prompt: >-
          מה הסוג של הראשית עבור $k=1$?
        choices:
          - text: 'מינימום מקומי ממש, כי המינורים המובילים $2,3,1$ כולם חיוביים'
            correct: true
            feedback: >-
              נכון. $A_1$ חיובית מוגדרת, ולפי מבחן הנגזרת השנייה הראשית מינימום מקומי ממש. כי $f_1$ עצמה תבנית
              ריבועית, זה אפילו מינימום מוחלט: $f_1(h)\ge\frac{\lambda_{\min}}{2}\|h\|^2$.
          - text: 'מינימום מקומי ממש, כי כל איברי $A_1$ חיוביים'
            feedback: >-
              המסקנה נכונה, הנימוק לא: ל-$A_0$ כל האיברים אי-שליליים, והיא לא מוגדרת ($\Delta_3=-2$).
            misconception: MC-c6-positive-entries
          - text: 'המבחן אינו מכריע, כי $A_1$ אינה אלכסונית'
            feedback: >-
              קריטריון סילבסטר עובד לכל מטריצה סימטרית; האלכסוניות אינה נחוצה.
            misconception: MC-c6-diagonal-decides

      - label: ג
        points: 10
        type: open
        objectives: [OBJ-6.4-3, OBJ-6.3-1]
        prompt: >-
          יהי $k=\frac23$. הראו שמבחן הנגזרת השנייה אינו מכריע בראשית, וקבעו בכל זאת אם הראשית נקודת קיצון, ואם כן
          אם הוא ממש.
        solution:
          - kind: given
            text: >-
              $A=A_{2/3}=\begin{pmatrix}2&1&1\\1&2&1\\1&1&\frac23\end{pmatrix}$ ו-$f(h)=\frac12h^{T}Ah$.
          - kind: goal
            text: 'להראות ש-$A$ אינה חיובית מוגדרת ואינה לא מוגדרת, ולסווג את הראשית ישירות.'
          - kind: idea
            text: >-
              $f$ עצמה היא התבנית הריבועית של $A$, ולכן הסימן של $f$ הוא הסימן של התבנית: אין צורך בשארית, צריך רק
              לסווג את $A$ לפי הערכים העצמיים.
          - kind: computation
            text: >-
              $\Delta_1=2$, $\Delta_2=3$, $\Delta_3=3k-2=0$. לכן $A$ סינגולרית ואינה חיובית מוגדרת, ומבחן הנגזרת השנייה
              אינו חל.
          - kind: computation
            text: >-
              $A(1,1,-3)^{T}=(2+1-3,\ 1+2-3,\ 1+1-2)=0$, $A(1,-1,0)^{T}=(1,-1,0)$, $A(3,3,2)^{T}=\frac{11}{3}(3,3,2)$.
              הערכים העצמיים: $0,\ 1,\ \frac{11}{3}$ (בדיקה: סכומם $\frac{14}{3}$, העקבה).
          - kind: step
            text: >-
              כל הערכים העצמיים אי-שליליים ואחד אפס: $A$ חיובית חצי מוגדרת ואינה מוגדרת. זה המקרה שבו המבחן אינו מכריע.
              (את זה **אי אפשר** להסיק מ-$\Delta_k\ge0$ לבד.)
          - kind: step
            text: >-
              לכן $f(h)=\frac12h^{T}Ah\ge0=f(0)$ לכל $h$: הראשית נקודת מינימום (אפילו מוחלט).
          - kind: step
            text: >-
              בכיוון הווקטור העצמי של 0: $f(t,t,-3t)=0=f(0)$ לכל $t$, כך שבכל כדור יש נקודות שונות מהראשית עם אותו ערך.
          - kind: check
            text: >-
              הצבה ישירה: $x=y=t$, $z=-3t$ נותן $t^2+t^2+\frac13\cdot9t^2+t^2-3t^2-3t^2=0$.
          - kind: result
            text: >-
              המבחן אינו מכריע ($A$ חצי מוגדרת), והראשית נקודת מינימום מקומי (ואף מוחלט) שאינו ממש: $f=0$ על כל הישר
              $\{t(1,1,-3)\}$.
        rubric:
          - text: 'חישוב המינורים, והסבר למה $\Delta_3=0$ מונע את המבחן'
            weight: 2
          - text: 'סיווג $A$ כחצי מוגדרת דרך הערכים העצמיים (או כתיבה כסכום ריבועים), לא דרך "המינורים אי-שליליים"'
            weight: 3
          - text: 'המעבר מ-$A$ חצי מוגדרת ל-$f\ge f(0)$, תוך שימוש בכך ש-$f$ היא בדיוק התבנית'
            weight: 3
          - text: 'מציאת הכיוון $(1,1,-3)$ שבו $f=0$, ומסקנה שהמינימום אינו ממש'
            weight: 2

      - label: ד
        points: 5
        type: twotier
        qualitative: true
        objectives: [OBJ-6.4-1, OBJ-6.3-2]
        prompt: >-
          נכון או לא נכון: לכל $k<\frac23$ הראשית נקודת אוכף של $f_k$.
        choices:
          - text: נכון
            correct: true
            feedback: 'נכון. ההסיאן לא מוגדר, ומבחן הנגזרת השנייה נותן אוכף.'
          - text: לא נכון
            feedback: >-
              $\Delta_1=2>0$ נותן כיוון חיובי ($f_k(1,0,0)=1$), ו-$\det A_k=3k-2<0$ נותן ערך עצמי שלילי. תבנית לא מוגדרת:
              אוכף.
            misconception: MC-c6-sylvester-partial
        reasons:
          - text: >-
              $e_1^{T}A_ke_1=2>0$, ו-$\det A_k=3k-2<0$ הוא מכפלת שלושת הערכים העצמיים, ולכן אחד מהם לפחות שלילי: $A_k$ לא
              מוגדרת
            correct: true
            feedback: >-
              בדיוק. יש כיוון שבו התבנית חיובית וכיוון שבו היא שלילית, ומבחן הנגזרת השנייה נותן נקודת אוכף.
          - text: >-
              $\det A_k<0$, ולכן $A_k$ שלילית מוגדרת והראשית מקסימום
            feedback: >-
              במימד 3 שלילית מוגדרת דורשת $\Delta_1<0$, $\Delta_2>0$, $\Delta_3<0$. כאן $\Delta_1=2>0$, ו-$f_k(1,0,0)=1>0$.
            misconception: MC-c6-negative-minors
          - text: >-
              $\Delta_1>0$ ו-$\Delta_2>0$, ולכן הראשית מינימום
            feedback: >-
              צריך את כל שלושת המינורים. $\Delta_3<0$, ולמשל ב-$k=0$: $f_0(1,1,-3)=1+1+1-3-3=(-3)<0$.
            misconception: MC-c6-sylvester-partial

  - id: Q-6-exam-3
    type: exam
    title: קיצון מוחלט בעיגול
    prompt: >-
      נתונה $f(x,y)=x^2+2y^2-x$, ו-$D=\{(x,y):x^2+y^2\le1\}$ עיגול היחידה הסגור.
    parts:
      - label: א
        points: 4
        type: twotier
        qualitative: true
        objectives: [OBJ-6.5-1]
        prompt: >-
          נכון או לא נכון: ל-$f$ יש ב-$D$ מקסימום מוחלט ומינימום מוחלט.
        choices:
          - text: נכון
            correct: true
            feedback: 'נכון. זו מסקנה של משפט ויירשטראס, לפני כל חישוב.'
          - text: לא נכון
            feedback: >-
              $D$ סגורה וחסומה, ולכן קומפקטית, ו-$f$ פולינום ולכן רציפה: לפי ויירשטראס שני הקיצונים קיימים.
            misconception: MC-c6-noncompact-no-extremum
        reasons:
          - text: '$D$ סגורה וחסומה ב-$\mathbb{R}^2$, ולכן קומפקטית; $f$ רציפה; משפט ויירשטראס'
            correct: true
            feedback: 'בדיוק. שתי ההנחות של ויירשטראס, קומפקטיות ורציפות, מתקיימות.'
          - text: '$D$ סגורה, ופונקציה רציפה על קבוצה סגורה מקבלת מקסימום ומינימום'
            feedback: >-
              סגירות לבדה לא מספיקה: $f=x$ על חצי המישור הסגור $x\ge0$ אינה מקבלת מקסימום. כאן גם החסימות נחוצה.
            misconception: MC-c6-closed-enough
          - text: '$f$ חסומה על $D$, ופונקציה חסומה מקבלת את החסמים שלה'
            feedback: >-
              $\arctan x$ על $[0,\infty)$ חסומה ואינה מקבלת את הסופרמום $\frac\pi2$. מה שמבטיח כאן קיצון הוא
              הקומפקטיות של התחום.
            misconception: MC-c6-bounded-below-attains

      - label: ב
        points: 12
        type: open
        objectives: [OBJ-6.5-2]
        prompt: >-
          מצאו את המקסימום המוחלט ואת המינימום המוחלט של $f$ ב-$D$, ואת כל הנקודות שבהן הם מתקבלים.
        solution:
          - kind: given
            text: '$f(x,y)=x^2+2y^2-x$ על $D=\{x^2+y^2\le1\}$, קומפקטית; לפי סעיף א שני הקיצונים קיימים.'
          - kind: goal
            text: 'למצוא את $\max_D f$, $\min_D f$ והנקודות שבהן הם מתקבלים.'
          - kind: idea
            text: >-
              קיצון מוחלט מתקבל בנקודה קריטית בפנים או על השפה. על השפה $y^2=1-x^2$, ולכן $f$ הופכת לפונקציה של $x$
              בלבד על $[-1,1]$.
          - kind: computation
            text: >-
              פנים: $\nabla f=(2x-1,\ 4y)=0$ נותן $(\frac12,0)$, שנמצאת בפנים ($\frac14<1$), עם $f(\frac12,0)=\frac14-\frac12=-\frac14$.
          - kind: computation
            text: >-
              שפה: $f=x^2+2(1-x^2)-x=2-x-x^2=:\varphi(x)$, $x\in[-1,1]$. $\varphi'(x)=-1-2x=0$ ב-$x=-\frac12$, עם
              $\varphi(-\frac12)=2+\frac12-\frac14=\frac94$, בנקודות $(-\frac12,\pm\frac{\sqrt3}{2})$.
          - kind: computation
            text: >-
              קצוות הפרמטר: $\varphi(1)=0$ בנקודה $(1,0)$ ו-$\varphi(-1)=2$ בנקודה $(-1,0)$.
          - kind: step
            text: 'המועמדים והערכים: $\left(-\frac14\right)$, $\frac94$, $0$, $2$.'
          - kind: check
            text: >-
              $f(-\frac12,\frac{\sqrt3}{2})=\frac14+2\cdot\frac34+\frac12=\frac94$, ו-$\frac94\ge f$ בנקודות אחרות שנבדקו
              (למשל $f(0,1)=2$).
          - kind: result
            text: >-
              $\max_D f=\frac94$, מתקבל ב-$(-\frac12,\frac{\sqrt3}{2})$ וב-$(-\frac12,-\frac{\sqrt3}{2})$; $\min_D f=-\frac14$,
              מתקבל ב-$(\frac12,0)$ בלבד.
        rubric:
          - text: 'הנקודה הקריטית הפנימית והערך בה'
            weight: 2
          - text: 'צמצום נכון לשפה (פרמטריזציה או הצבה $y^2=1-x^2$) לפונקציה של משתנה אחד עם התחום הנכון'
            weight: 3
          - text: 'הנקודה הקריטית של הצמצום וגם קצוות הפרמטר נבדקו'
            weight: 3
          - text: 'השוואת כל המועמדים, ומקסימום ומינימום נכונים'
            weight: 2
          - text: 'כל הנקודות שבהן מתקבל הקיצון (שתיים למקסימום)'
            weight: 2

