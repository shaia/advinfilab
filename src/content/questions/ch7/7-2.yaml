# Lesson 7.2 — the proof of the inverse function theorem.
# Objectives (src/course.ts):
#   OBJ-7.2-1  prove injectivity near a with the mean value inequality
#   OBJ-7.2-2  prove that the image contains a neighbourhood with Banach's fixed point theorem, and that the inverse is C¹
#   OBJ-7.2-3  show that continuous differentiability is necessary: a differentiable f with f'(a) > 0, invertible on no neighbourhood
#   OBJ-7.2-4  deduce the open mapping theorem: C¹ with invertible differential everywhere on an open set maps open sets to open sets
# Notation used throughout: A = Df(a) (invertible), c = ½‖A⁻¹‖⁻¹ (operator norms), h(x) = f(x) − Ax.
chapter: 7
questions:
  - id: Q-7.2-continuity
    type: mc
    objectives: [OBJ-7.2-1]
    qualitative: true
    level: basic
    prompt: >-
      בהוכחת החד-חד-ערכיות בוחרים $r>0$ כך ש-$\|Df(x)-Df(a)\|_{\mathrm{op}}\le c$ לכל $x\in B(a,r)$, כאשר
      $c=\frac12\|Df(a)^{-1}\|_{\mathrm{op}}^{-1}$. איזו הנחה של המשפט מאפשרת את הבחירה הזו?
    choices:
      - text: הרציפות של $Df$ בנקודה $a$, כלומר ש-$f$ גזירה ברציפות
        correct: true
        feedback: >-
          נכון. זו בדיוק הגדרת הרציפות של $x\mapsto Df(x)$ ב-$a$ (במרחב המטריצות עם נורמת האופרטור), עם
          $\varepsilon=c$.
      - text: הגזירות של $f$ בנקודה $a$
        feedback: >-
          גזירות ב-$a$ אומרת ש-$f(x)\approx f(a)+Df(a)(x-a)$, ולא אומרת דבר על $Df(x)$ בנקודות אחרות. בדוגמה
          $x+2x^2\sin\frac1x$ הנגזרת קיימת בכל מקום, ובכל זאת $|f'(x)-f'(0)|=2$ בנקודות $\frac{1}{2\pi k}$, הקרובות
          ל-0 כרצוננו.
        misconception: MC-c7-differentiable-enough
      - text: ההפיכות של $Df(a)$
        feedback: >-
          ההפיכות קובעת את הקבוע $c>0$ (בלעדיה אין $\|Df(a)^{-1}\|$), אבל לא את קיום הרדיוס $r$. את $r$ נותנת
          רציפות הנגזרת.
      - text: השלמות של $\mathbb{R}^n$
        feedback: >-
          השלמות נכנסת בשלב העל (משפט בנך), לא כאן. בחירת $r$ היא שאלה של רציפות.

  - id: Q-7.2-lower
    type: numeric
    objectives: [OBJ-7.2-1]
    level: basic
    prompt: >-
      $A=\begin{pmatrix}2&0\\0&\frac12\end{pmatrix}$, בנורמה האוקלידית. מהו הקבוע $m$ הגדול ביותר כך
      ש-$\|Av\|\ge m\|v\|$ לכל $v\in\mathbb{R}^2$?
    answer: 0.5
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\|Av\|^2=4v_1^2+\frac14v_2^2\ge\frac14\|v\|^2$, עם שוויון ב-$v=e_2$. באופן כללי
      $m=\|A^{-1}\|_{\mathrm{op}}^{-1}$, וכאן $A^{-1}=\operatorname{diag}(\frac12,2)$ עם נורמה 2.
    wrongFeedback: >-
      חפשו את הווקטור היחידה שהכי "מתכווץ" תחת $A$. בהוכחה משתמשים ב-$\|v\|=\|A^{-1}Av\|\le\|A^{-1}\|\,\|Av\|$.
    commonWrong:
      - value: 2
        feedback: >-
          $2=\|A\|_{\mathrm{op}}$ הוא חסם **עליון**: $\|Av\|\le2\|v\|$. עבור $v=e_2$ מקבלים $\|Av\|=\frac12$, לא 2.
        misconception: MC-c7-opnorm-lower-bound
      - value: 1
        feedback: >-
          $1=\det A$. הדטרמיננטה מודדת שינוי שטח, לא את המתיחה המינימלית בכיוון אחד.

  - id: Q-7.2-contraction-map
    type: mc
    objectives: [OBJ-7.2-2]
    level: basic
    prompt: >-
      כדי להראות שכל $y$ קרוב ל-$f(a)$ הוא בתמונה, מחפשים פתרון של $f(x)=y$ כנקודת שבת. איזו העתקה משמשת בהוכחה,
      ולמה היא מכווצת על $B[a,r]$ עם מקדם $\frac12$?
    choices:
      - text: '$\varphi_y(x)=x+A^{-1}(y-f(x))$, כי $D\varphi_y(x)=A^{-1}(A-Df(x))$ ונורמתה לכל היותר $\|A^{-1}\|\cdot c=\frac12$'
        correct: true
        feedback: >-
          נכון. $\varphi_y(x)=x$ אם ורק אם $f(x)=y$ (כי $A^{-1}$ הפיכה), ואי-שוויון הערך הממוצע על הכדור הקמור
          הופך את החסם על $D\varphi_y$ לקבוע כיווץ.
      - text: '$\varphi_y(x)=x+(y-f(x))$, כי נקודות השבת שלה הן הפתרונות של $f(x)=y$'
        feedback: >-
          נקודות השבת אכן נכונות, אבל $D\varphi_y=I-Df(x)$, קרוב ל-$I-A$, שיכול להיות גדול. למשל ל-$A=3I$ הנורמה
          קרובה ל-2. הכפל ב-$A^{-1}$ הוא מה שמנרמל את הבעיה ל"נגזרת קרובה ל-$I$".
      - text: '$\varphi_y(x)=x-A^{-1}(y-f(x))$, כי $D\varphi_y(x)=I-A^{-1}Df(x)$'
        feedback: >-
          סימן שגוי: כאן $D\varphi_y(x)=I+A^{-1}Df(x)$, שקרוב ל-$2I$ ליד $a$, עם נורמה קרובה ל-2. זו לא העתקה מכווצת.
      - text: '$\varphi_y(x)=x+Df(x)^{-1}(y-f(x))$ (שיטת ניוטון), כי היא מתכנסת הכי מהר'
        feedback: >-
          לנקודות השבת של שיטת ניוטון יש אותה משמעות, אבל הנגזרת שלה כוללת נגזרות שניות של $f$, ו-$f$ רק גזירה
          ברציפות. בהוכחה מקפיאים את המטריצה ב-$A=Df(a)$, ואת זה אפשר לחסום.

  - id: Q-7.2-oscillating-derivative
    type: numeric
    objectives: [OBJ-7.2-3]
    level: basic
    prompt: >-
      $f(x)=x+2x^2\sin\frac1x$ ל-$x\neq0$ ו-$f(0)=0$. חשבו את $f'\left(\frac{1}{2\pi k}\right)$ ל-$k\in\mathbb{N}$.
    answer: -1
    tolerance: 0.001
    correctFeedback: >-
      נכון. ל-$x\neq0$: $f'(x)=1+4x\sin\frac1x-2\cos\frac1x$. ב-$x=\frac1{2\pi k}$: $\sin(2\pi k)=0$ ו-$\cos(2\pi k)=1$,
      ולכן $f'=1+0-2=-1$. אף על פי ש-$f'(0)=\lim_{x\to0}\left(1+2x\sin\frac1x\right)=1$.
    wrongFeedback: >-
      גזרו את $2x^2\sin\frac1x$ לפי כלל המכפלה וכלל השרשרת: $(\sin\frac1x)'=\cos\frac1x\cdot\left(-\frac{1}{x^2}\right)$.
    commonWrong:
      - value: 1
        feedback: >-
          שכחתם את האיבר $-2\cos\frac1x$ שמגיע מכלל השרשרת: $2x^2\cdot\cos\frac1x\cdot(-\frac1{x^2})=-2\cos\frac1x$. בלעדיו
          $f'$ נראית רציפה, וכל הדוגמה מתמוטטת.
      - value: 3
        feedback: >-
          סימן שגוי בנגזרת של $\frac1x$: $\left(\frac1x\right)'=-\frac{1}{x^2}$, ולכן האיבר הוא $-2\cos\frac1x$, לא
          $+2\cos\frac1x$. (הערך 3 כן מתקבל, בנקודות $\frac{1}{(2k+1)\pi}$.)

  - id: Q-7.2-open-map-statement
    type: mc
    objectives: [OBJ-7.2-4]
    qualitative: true
    level: basic
    prompt: >-
      $U\subseteq\mathbb{R}^n$ פתוחה, $f:U\to\mathbb{R}^n$ גזירה ברציפות ו-$Df(x)$ הפיכה לכל $x\in U$. איך מסיקים
      ממשפט הפונקציה ההפוכה ש-$f(O)$ פתוחה לכל $O\subseteq U$ פתוחה?
    choices:
      - text: >-
          לכל $b=f(a)$ עם $a\in O$ מפעילים את המשפט על $f$ המצומצמת ל-$O$ (גם היא פתוחה): יש $V\subseteq O$ ו-$W=f(V)$
          פתוחה עם $b\in W\subseteq f(O)$
        correct: true
        feedback: >-
          נכון. כל נקודה של $f(O)$ היא נקודה פנימית, ולכן $f(O)$ פתוחה. אין צורך ש-$f$ תהיה חד-חד-ערכית על $O$: כל
          נקודה מקבלת את הסביבה שלה.
      - text: >-
          $f$ רציפה, ולכן התמונה של קבוצה פתוחה פתוחה
        feedback: >-
          רציפות מבטיחה ש**מקורות** של קבוצות פתוחות פתוחים, לא תמונות: $x\mapsto x^2$ רציפה ומעתיקה את $(-1,1)$
          על $[0,1)$.
        misconception: MC-c7-image-of-open-is-open
      - text: >-
          המשפט נותן ש-$f$ הפיכה על $O$ עם הופכית רציפה $g$, ואז $f(O)=g^{-1}(O)$ פתוחה כמקור של פתוחה
        feedback: >-
          $f$ אינה חייבת להיות חד-חד-ערכית על $O$: $(e^x\cos y,\ e^x\sin y)$ על רצועה ברוחב $3\pi$. המשפט נותן
          הופכית **מקומית** בלבד, ולכן הטיעון עובר נקודה-נקודה.
        misconception: MC-c7-local-is-global
      - text: >-
          מספיק ש-$Df(a)$ הפיכה בנקודה אחת $a\in O$
        feedback: >-
          זה נותן סביבה של $f(a)$ בתוך $f(O)$, אבל רק של הנקודה הזו. בכל נקודה אחרת צריך שוב דיפרנציאל הפיך:
          $x\mapsto x^2$ על $(-1,1)$ הפיכה בנקודה $\frac12$, והתמונה $[0,1)$ אינה פתוחה בגלל הנקודה 0.
        misconception: MC-c7-ift-iff

  - id: Q-7.2-open-map-det
    type: numeric
    objectives: [OBJ-7.2-4]
    level: basic
    prompt: >-
      $g(x,y,z)=(x+e^y,\ y+e^z,\ z+e^x)$. חשבו את $\det J_g(0,0,0)$.
    answer: 2
    tolerance: 0.001
    correctFeedback: >-
      נכון. $J_g=\begin{pmatrix}1&e^y&0\\0&1&e^z\\e^x&0&1\end{pmatrix}$, ופיתוח לפי השורה הראשונה נותן
      $\det J_g=1+e^{x+y+z}$, ובראשית $2$. כי $1+e^{x+y+z}>0$ בכל מקום, $g$ הפיכה מקומית ליד **כל** נקודה, ולפי
      משפט ההעתקה הפתוחה היא מעתיקה קבוצות פתוחות לפתוחות.
    wrongFeedback: >-
      כתבו את $J_g$ (השורה ה-$i$ היא הגרדיאנט של הרכיב ה-$i$) ופתחו את הדטרמיננטה לפי השורה הראשונה.
    commonWrong:
      - value: 1
        feedback: >-
          1 היא מכפלת האלכסון בלבד. המטריצה אינה משולשית: האיבר $e^x$ בפינה השמאלית התחתונה תורם את המחובר
          $e^y\cdot e^z\cdot e^x$.
      - value: 0
        feedback: >-
          הסימן של המחובר השני: בפיתוח לפי השורה הראשונה, $-e^y\cdot(0\cdot1-e^z e^x)=+e^{x+y+z}$. הדטרמיננטה
          חיובית, לא אפס.

  - id: Q-7.2-vector-mvt
    type: twotier
    objectives: [OBJ-7.2-1]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחת החד-חד-ערכיות מישהו כותב: "לפי משפט הערך הממוצע יש $\xi$ על הקטע בין $x$ ל-$y$ כך ש-
      $h(x)-h(y)=Dh(\xi)(x-y)$". האם הצעד הזה תקין?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. ל-$h:\mathbb{R}^n\to\mathbb{R}^n$ אין שוויון ערך ממוצע; משתמשים באי-שוויון, וזה מספיק להוכחה.
      - text: כן
        feedback: >-
          השוויון נכון לפונקציה ממשית בלבד. ל-$\gamma(t)=(\cos t,\sin t)$ על $[0,2\pi]$:
          $\gamma(2\pi)-\gamma(0)=0$, אבל $\gamma'(\xi)\cdot2\pi\neq0$ לכל $\xi$.
        misconception: MC-c7-vector-mvt-equality
    reasons:
      - text: 'לפונקציה וקטורית נכון רק $\|h(x)-h(y)\|\le\sup_{z\in[x,y]}\|Dh(z)\|_{\mathrm{op}}\,\|x-y\|$, ואת זה מפעילים על הכדור הקמור'
        correct: true
        feedback: >-
          בדיוק (שיעור 5.6). הכדור קמור, ולכן הקטע בין $x$ ל-$y$ בתוכו, ושם $\|Dh\|=\|Df-A\|\le c$.
      - text: 'השוויון נכון לכל רכיב בנפרד, ולכן גם לווקטור כולו'
        feedback: >-
          לכל רכיב $h_i$ יש $\xi_i$ משלו, והנקודות $\xi_i$ שונות בדרך כלל. אין $\xi$ אחד שמתאים לכל הרכיבים יחד.
        misconception: MC-c7-vector-mvt-equality
      - text: 'הצעד תקין, כי $h$ גזירה ברציפות'
        feedback: >-
          גזירות ברציפות לא מצילה את השוויון: $\gamma(t)=(\cos t,\sin t)$ חלקה לגמרי.
        misconception: MC-c7-vector-mvt-equality

  - id: Q-7.2-injective-proof
    type: rank
    objectives: [OBJ-7.2-1]
    level: mid
    prompt: >-
      $f:U\to\mathbb{R}^n$ גזירה ברציפות ו-$Df(a)$ הפיכה. הוכיחו שיש $r>0$ כך ש-$f$ חד-חד-ערכית על $B(a,r)$.
    help: סדרו את שלבי ההוכחה, מהראשון לאחרון.
    items:
      - id: set
        label: 'מסמנים $A=Df(a)$ ו-$c=\frac12\|A^{-1}\|_{\mathrm{op}}^{-1}>0$.'
      - id: radius
        label: 'מרציפות $Df$ ב-$a$ בוחרים $r>0$ עם $\|Df(x)-A\|_{\mathrm{op}}\le c$ לכל $x\in B(a,r)$.'
      - id: mvi
        label: 'ל-$h(x)=f(x)-Ax$ מתקיים $Dh=Df-A$; הכדור קמור, ולפי אי-שוויון הערך הממוצע $\|h(x)-h(y)\|\le c\|x-y\|$ על $B(a,r)$.'
      - id: combine
        label: 'מאי-שוויון המשולש ומ-$\|A(x-y)\|\ge2c\|x-y\|$: $\|f(x)-f(y)\|\ge\|A(x-y)\|-\|h(x)-h(y)\|\ge c\|x-y\|$.'
      - id: conclude
        label: 'לכן $x\neq y$ גורר $f(x)\neq f(y)$ על $B(a,r)$, וההופכית על $f(B(a,r))$ ליפשיץ עם קבוע $\frac1c$.'
    order: [set, radius, mvi, combine, conclude]
    correctFeedback: >-
      נכון. רעיון ההוכחה: ליד $a$ הפונקציה $f$ היא $A$ ועוד שגיאה $h$ שקבוע הליפשיץ שלה קטן מחצי ממה שהופך את $A$
      ל"מותחת": $A$ מרחיקה נקודות לפחות פי $2c$, והשגיאה מקרבת לכל היותר פי $c$.
    wrongFeedback: >-
      התחילו מהקבועים, אחר כך הרדיוס (הוא תלוי ב-$c$), אחר כך החסם על השגיאה $h$ (הוא תלוי ברדיוס), ורק אז השילוב.

  - id: Q-7.2-radius
    type: numeric
    objectives: [OBJ-7.2-2]
    level: mid
    prompt: >-
      $f(x)=x+x^2$ ו-$a=0$, ולכן $A=f'(0)=1$ ו-$\varphi_y(x)=x+(y-f(x))=y-x^2$. על הקטע $[-\frac14,\frac14]$ מתקיים
      $|\varphi_y'(x)|=2|x|\le\frac12$. מהו המספר $s$ הגדול ביותר כך שלכל $y$ עם $|y|\le s$ ההעתקה $\varphi_y$
      מעבירה את $[-\frac14,\frac14]$ לתוך עצמו?
    answer: 0.1875
    tolerance: 0.001
    correctFeedback: >-
      נכון, $s=\frac{3}{16}$. ל-$|x|\le\frac14$ הערכים $y-x^2$ נעים בין $y-\frac1{16}$ ל-$y$. ל-$y<0$ הקצה המסוכן הוא
      $y-\frac1{16}$, והתנאי $|y|+\frac1{16}\le\frac14$ נותן $|y|\le\frac{3}{16}$. ל-$y>0$ מספיק $y\le\frac14$. לכן
      הכל עובד בדיוק כש-$|y|\le\frac3{16}$, ואז לפי בנך יש פתרון יחיד ל-$x+x^2=y$ בקטע.
    wrongFeedback: >-
      כתבו את טווח הערכים של $y-x^2$ כש-$|x|\le\frac14$, ודרשו שיהיה בתוך $[-\frac14,\frac14]$. בדקו בנפרד $y$ חיובי
      ושלילי.
    commonWrong:
      - value: 0.125
        feedback: >-
          $\frac18$ הוא החסם מההוכחה הכללית, $|y-f(a)|\le(1-\frac12)\frac{r}{\|A^{-1}\|}=\frac{r}{2}$. הוא מספיק, אבל לא
          הגדול ביותר: כאן אפשר לחשב ישירות.
      - value: 0.25
        feedback: >-
          עם $y=-\frac14$: $\varphi_y(\frac14)=-\frac14-\frac1{16}<-\frac14$, יציאה מהקטע. שכחתם שהאיבר $-x^2$
          מזיז את הערכים שמאלה.

  - id: Q-7.2-open-ball
    type: twotier
    objectives: [OBJ-7.2-2]
    qualitative: true
    level: mid
    prompt: >-
      בשלב העל רוצים להפעיל את משפט נקודת השבת של בנך על $\varphi_y$. מישהו מציע לעבוד על הכדור הפתוח $B(a,r)$
      במקום על הכדור הסגור $B[a,r]$. אם מראים ש-$\varphi_y$ מכווצת ומעבירה את $B(a,r)$ לתוך עצמו, האם משפט בנך
      מבטיח נקודת שבת ב-$B(a,r)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. משפט בנך דורש מרחב מטרי שלם, ו-$B(a,r)$ אינו שלם.
      - text: כן
        feedback: >-
          $\varphi(x)=\frac{x+1}{2}$ מכווצת עם מקדם $\frac12$ ומעבירה את $(-1,1)$ לתוך $(0,1)$, אבל נקודת השבת
          היחידה שלה היא 1, מחוץ לקטע.
        misconception: MC-c7-open-ball-banach
    reasons:
      - text: 'סדרת קושי בכדור הפתוח יכולה להתכנס לנקודה על השפה, ושם נמצאת נקודת השבת'
        correct: true
        feedback: >-
          בדיוק: ב-$\varphi(x)=\frac{x+1}{2}$ האיטרציות מתכנסות ל-1. הכדור הסגור הוא תת-קבוצה סגורה של המרחב
          השלם $\mathbb{R}^n$, ולכן שלם (שיעור 2.1).
      - text: 'הכדור הפתוח אינו קומפקטי'
        feedback: >-
          משפט בנך אינו דורש קומפקטיות: $\mathbb{R}^n$ כולו אינו קומפקטי ומשפט בנך חל עליו. ההנחה החסרה היא
          שלמות.
      - text: 'כל העתקה מכווצת של כדור לתוך עצמו יש לה נקודת שבת, פתוח או סגור'
        feedback: >-
          הדוגמה $\frac{x+1}{2}$ על $(-1,1)$ מפריכה את זה.
        misconception: MC-c7-open-ball-banach

  - id: Q-7.2-inverse-c1
    type: mc
    objectives: [OBJ-7.2-2]
    level: mid
    prompt: >-
      אחרי שהוכח ש-$f:V\to W$ הפיכה, שההופכית $g$ גזירה, ו-$Dg(y)=Df(g(y))^{-1}$: למה $Dg$ **רציפה**?
    choices:
      - text: 'כי $y\mapsto Df(g(y))^{-1}$ היא הרכבה של שלוש העתקות רציפות: $g$, $Df$ וההיפוך $M\mapsto M^{-1}$ על המטריצות ההפיכות'
        correct: true
        feedback: >-
          נכון. $g$ רציפה (אפילו ליפשיץ), $Df$ רציפה כי $f\in C^1$, וההיפוך רציף כי לפי כלל קרמר האיברים של
          $M^{-1}$ הם מנות של פולינומים באיברי $M$, עם מכנה $\det M\neq0$.
      - text: 'כי $g$ ליפשיץ עם קבוע $\frac1c$'
        feedback: >-
          ליפשיץ לא נותן אפילו גזירות, ובוודאי לא נגזרת רציפה: $|x|$ ליפשיץ. ליפשיץ משמש להוכחת **הגזירות** של
          $g$ (הוא שולט ב-$\|g(y)-g(b)\|$), לא לרציפות של $Dg$.
        misconception: MC-c7-lipschitz-gives-derivative
      - text: 'כי $f$ גזירה פעמיים ברציפות'
        feedback: >-
          המשפט אינו מניח זאת; $f$ רק גזירה ברציפות. ההוכחה צריכה רק רציפות של $Df$, של $g$ ושל ההיפוך.
      - text: 'כי כל פונקציה גזירה היא גזירה ברציפות'
        feedback: >-
          לא נכון: $x^2\sin\frac1x$ (עם 0 באפס) גזירה, והנגזרת שלה אינה רציפה באפס.

  - id: Q-7.2-not-injective
    type: twotier
    objectives: [OBJ-7.2-3]
    qualitative: true
    level: mid
    prompt: >-
      $f(x)=x+2x^2\sin\frac1x$, $f(0)=0$, גזירה בכל $\mathbb{R}$ עם $f'(0)=1>0$. האם יש $\delta>0$ כך ש-$f$
      חד-חד-ערכית על $(-\delta,\delta)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. נגזרת חיובית בנקודה אחת אינה מספיקה, כש-$f'$ אינה רציפה שם.
      - text: כן
        feedback: >-
          זה היה נכון אילו $f'$ הייתה רציפה ב-0. כאן $f'\left(\frac1{2\pi k}\right)=-1$ בנקודות קרובות ל-0 כרצוננו.
        misconception: MC-c7-positive-derivative-monotone
    reasons:
      - text: 'בכל $(-\delta,\delta)$ יש נקודות עם $f''=-1$ ($x=\frac1{2\pi k}$) ונקודות עם $f''=3$ ($x=\frac1{(2k+1)\pi}$); פונקציה רציפה וחד-חד-ערכית בקטע מונוטונית ממש, ואז $f''$ לא מחליפה סימן'
        correct: true
        feedback: >-
          בדיוק. אילו $f$ הייתה חד-חד-ערכית על הקטע, היא הייתה מונוטונית ממש (אינפי 1), ואז $f'\ge0$ בכל
          הקטע או $f'\le0$ בכל הקטע. שני הסימנים מופיעים, סתירה.
      - text: '$f''(0)=1\neq0$, ולכן לפי משפט הפונקציה ההפוכה $f$ הפיכה ליד 0'
        feedback: >-
          המשפט דורש $f\in C^1$, ו-$f'$ אינה רציפה ב-0: $f'(x)=1+4x\sin\frac1x-2\cos\frac1x$ מתנדנדת בין ערכים
          קרובים ל-$-1$ ול-3.
        misconception: MC-c7-differentiable-enough
      - text: '$f$ אינה רציפה ב-0'
        feedback: >-
          $f$ רציפה ואף גזירה ב-0: $|f(x)|\le|x|+2x^2\to0$. מה שאינו רציף הוא $f'$.

  - id: Q-7.2-square-not-open
    type: twotier
    objectives: [OBJ-7.2-4]
    qualitative: true
    level: mid
    prompt: >-
      $f(x)=x^2$ על $\mathbb{R}$ גזירה ברציפות. האם $f$ העתקה פתוחה, כלומר האם $f(O)$ פתוחה לכל $O\subseteq\mathbb{R}$
      פתוחה?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. $f((-1,1))=[0,1)$, וזו אינה קבוצה פתוחה: אין סביבה של 0 בתוכה.
      - text: כן
        feedback: >-
          גזירות ברציפות לבדה אינה מספיקה. $f((-1,1))=[0,1)$, ו-0 אינה נקודה פנימית שלה.
        misconception: MC-c7-image-of-open-is-open
    reasons:
      - text: '$f''(0)=0$: בנקודה 0 ההנחה של משפט ההעתקה הפתוחה נכשלת, ו-$f(0)=0$ היא נקודת שפה של התמונה'
        correct: true
        feedback: >-
          בדיוק. בכל קבוצה פתוחה שאינה מכילה את 0 הנגזרת שונה מאפס, ושם $f$ כן פתוחה: למשל $f((1,2))=(1,4)$.
      - text: 'פונקציה רציפה מעתיקה קבוצות פתוחות לקבוצות סגורות'
        feedback: >-
          לא: $f((1,2))=(1,4)$ פתוחה. רציפות לא אומרת דבר על תמונות של קבוצות פתוחות, לא בכיוון זה ולא באחר.
        misconception: MC-c7-image-of-open-is-open
      - text: '$f$ אינה חד-חד-ערכית על $\mathbb{R}$'
        feedback: >-
          חד-חד-ערכיות אינה תנאי לפתיחות: $(e^x\cos y,\ e^x\sin y)$ אינה חד-חד-ערכית והיא העתקה פתוחה. מה שמקלקל כאן
          הוא הנגזרת המתאפסת ב-0.
        misconception: MC-c7-local-is-global

  - id: Q-7.2-where-fails
    type: mc
    objectives: [OBJ-7.2-3, OBJ-7.2-1]
    qualitative: true
    level: exam
    prompt: >-
      מפעילים את ההוכחה של משפט הפונקציה ההפוכה, צעד אחר צעד, על $f(x)=x+2x^2\sin\frac1x$ ב-$a=0$ (כאן $A=1$
      ו-$c=\frac12$). באיזה צעד בדיוק היא נשברת?
    choices:
      - text: 'בבחירת $r$: אין $r>0$ עם $|f''(x)-1|\le\frac12$ לכל $|x|<r$'
        correct: true
        feedback: >-
          נכון. $|f'(\frac1{2\pi k})-1|=|-1-1|=2>\frac12$ לכל $k$. מכאן נופלים גם החסם על $h$ וגם הכיווץ של
          $\varphi_y$; שאר ההוכחה תלוי בצעד הזה.
      - text: 'בהפעלת משפט בנך: הקטע $[-r,r]$ אינו שלם'
        feedback: >-
          קטע סגור ב-$\mathbb{R}$ שלם. הבעיה מוקדמת יותר: לא ניתן למצוא $r$ שבו $f'$ קרובה ל-$f'(0)$.
        misconception: MC-c7-open-ball-banach
      - text: 'בהגדרת $c$: הנגזרת $f''(0)$ אינה הפיכה'
        feedback: >-
          $f'(0)=1$ הפיך, ו-$c=\frac12$ מוגדר היטב.
        misconception: MC-c7-ift-iff
      - text: 'בשלב האחרון: ההופכית קיימת אבל אינה גזירה ב-0'
        feedback: >-
          ההופכית לא קיימת בכלל באף סביבה: $f$ אינה חד-חד-ערכית ליד 0. הכשל הוא בצעד הראשון, לא באחרון.
        misconception: MC-c7-positive-derivative-monotone

  - id: Q-7.2-global-version
    type: twotier
    objectives: [OBJ-7.2-1, OBJ-7.2-2]
    qualitative: true
    level: exam
    prompt: >-
      $f:\mathbb{R}^n\to\mathbb{R}^n$ גזירה ברציפות, ו-$\|Df(x)-I\|_{\mathrm{op}}\le\frac12$ לכל $x\in\mathbb{R}^n$. האם
      $f$ חד-חד-ערכית ועל $\mathbb{R}^n$?
    choices:
      - text: כן, חד-חד-ערכית ועל
        correct: true
        feedback: >-
          נכון. ההוכחה של משפט הפונקציה ההפוכה עובדת כאן על כל המרחב, כי החסם על הנגזרת נתון בכל מקום.
      - text: 'לא בהכרח: גם $\det J_F\neq0$ בכל מקום לא הספיק בדוגמה $(e^x\cos y,\ e^x\sin y)$'
        feedback: >-
          ההנחה כאן חזקה בהרבה מ-$\det\neq0$: היא חסם **אחיד** על המרחק של $Df(x)$ מ-$I$. הדוגמה האקספוננציאלית
          אינה מקיימת אותה, כי $J_F$ שם מסתובבת ללא הגבלה.
        misconception: MC-c7-global-never
    reasons:
      - text: 'ל-$h=f-\mathrm{id}$: $\|h(x)-h(y)\|\le\frac12\|x-y\|$ על הקבוצה הקמורה $\mathbb{R}^n$, ולכן $\|f(x)-f(y)\|\ge\frac12\|x-y\|$; ו-$\varphi_y(x)=x+y-f(x)$ מכווצת עם מקדם $\frac12$ על המרחב השלם $\mathbb{R}^n$'
        correct: true
        feedback: >-
          בדיוק: אי-שוויון הערך הממוצע נותן חד-חד-ערכיות, ומשפט בנך נותן לכל $y$ פתרון של $f(x)=y$. השלמות של
          $\mathbb{R}^n$ מחליפה את הכדור הסגור.
      - text: '$\det J_f(x)\neq0$ לכל $x$, ולכן $f$ הפיכה'
        feedback: >-
          המסקנה נכונה כאן, אבל הנימוק לא: דטרמיננטה שונה מאפס בכל נקודה נותנת הפיכות מקומית בלבד (הדוגמה
          האקספוננציאלית).
        misconception: MC-c7-local-is-global
      - text: 'המשפט נותן הופכית מקומית ליד כל נקודה, ואלה מתחברות להופכית אחת'
        feedback: >-
          הופכיות מקומיות לא מתחברות מעצמן; ב-$(e^x\cos y,\ e^x\sin y)$ הן לא מתחברות. כאן החיבור עובד בגלל החסם
          האחיד, דרך ההוכחה, לא דרך המשפט.
        misconception: MC-c7-local-is-global

  - id: Q-7.2-open-map-examples
    type: multi
    objectives: [OBJ-7.2-4]
    qualitative: true
    level: exam
    prompt: >-
      אילו מההעתקות הבאות הן העתקות פתוחות על כל התחום שלהן? סמנו את כולן.
    choices:
      - text: '$(x,y)\mapsto(x,0)$ על $\mathbb{R}^2$'
        feedback: >-
          לא: התמונה של כל קבוצה פתוחה מוכלת בציר ה-$x$, שאינו מכיל אף כדור של $\mathbb{R}^2$. כאן $\det J=0$ בכל
          מקום.
        misconception: MC-c7-image-of-open-is-open
      - text: '$(x,y,z)\mapsto(x+e^y,\ y+e^z,\ z+e^x)$ על $\mathbb{R}^3$'
        correct: true
        feedback: >-
          נכון: $\det J=1+e^{x+y+z}>0$ בכל נקודה, ומשפט ההעתקה הפתוחה חל.
      - text: '$(x,y)\mapsto(e^x\cos y,\ e^x\sin y)$ על $\mathbb{R}^2$'
        correct: true
        feedback: >-
          נכון: $\det J=e^{2x}>0$ בכל נקודה. העובדה שההעתקה אינה חד-חד-ערכית לא משנה: פתיחות היא תכונה מקומית.
      - text: '$(x,y)\mapsto(x^2-y^2,\ 2xy)$ על $\mathbb{R}^2$'
        correct: true
        feedback: >-
          נכון, אף שהמשפט אינו חל בראשית ($\det J=4(x^2+y^2)=0$ שם). מחוץ לראשית המשפט חל. בראשית בודקים ישירות:
          ההעתקה מכפילה את הזווית בקואורדינטות קוטביות ומעלה את הרדיוס בריבוע, ולכן מעתיקה את הכדור $B(0,r)$ על
          $B(0,r^2)$; כל קבוצה פתוחה שמכילה את הראשית מכילה כדור כזה, והתמונה שלה מכילה סביבה של 0. כשהנחה נכשלת
          המשפט שותק, והמסקנה יכולה להתקיים בכל זאת.
      - text: '$x\mapsto x^3$ על $\mathbb{R}$'
        correct: true
        feedback: >-
          נכון: $x^3$ עולה ממש ורציפה, ולכן מעתיקה כל קטע פתוח על קטע פתוח, וכל קבוצה פתוחה על פתוחה. שוב, $f'(0)=0$
          רק אומר שהמשפט לא חל.
    explanation: >-
      משפט ההעתקה הפתוחה נותן תנאי **מספיק**: $Df$ הפיכה בכל נקודה. כשהוא נכשל בנקודות בודדות צריך לבדוק ישירות:
      $x^2$ אינה פתוחה, $x^3$ כן.
