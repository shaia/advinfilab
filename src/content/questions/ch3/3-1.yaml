# Lesson 3.1 — sequential compactness.
# Objectives (src/course.ts):
#   OBJ-3.1-1  define a sequentially compact set; prove compact ⇒ closed and bounded in every metric space
#   OBJ-3.1-2  prove with Bolzano–Weierstrass that closed and bounded ⇒ compact in Euclidean space
#   OBJ-3.1-3  give a closed bounded set that is not compact: discrete metric, a space of functions
# Covers come only in 3.2: every question here says "קומפקטית סדרתית" in full, never a bare "קומפקטית".
# Numbers recomputed with npx tsx: lim_m ‖xⁿ − xᵐ‖∞ = 1 (sup of x − x^m on a grid of 2·10⁵ cells: 0.69684, 0.99212,
# 0.99987 for m = 10, 10³, 10⁵); the box question's c_i (1/ln 2 ≈ 1.4427 is the largest 1/ln(i+1);
# 1/(1 + sin² i) ≥ 1/2 for every i).
chapter: 3
questions:
  - id: Q-3.1-def
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: basic
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$K\subseteq X$. מהי ההגדרה של "$K$ קומפקטית סדרתית"?
    choices:
      - text: לכל סדרה של נקודות של $K$ יש תת-סדרה שמתכנסת לנקודה של $K$
        correct: true
        feedback: >-
          נכון. שני חלקים: תת-סדרה (לא כל הסדרה), והגבול שלה בתוך $K$ (לא סתם ב-$X$).
      - text: לכל סדרה של נקודות של $K$ יש תת-סדרה שמתכנסת לנקודה של $X$
        feedback: >-
          חסר כאן שהגבול ב-$K$. ב-$X=\mathbb{R}$, לכל סדרה ב-$(0,1)$ יש תת-סדרה מתכנסת ב-$\mathbb{R}$
          (בולצאנו-ויירשטראס), אבל $\frac1{n+1}$ מתכנסת ל-0, שאינו ב-$(0,1)$, וכך גם כל תת-סדרה שלה; ו-$(0,1)$
          אינה קומפקטית סדרתית.
        misconception: MC-c3-limit-in-set
      - text: כל סדרה של נקודות של $K$ מתכנסת לנקודה של $K$
        feedback: >-
          חזק מדי: אז אפילו $[-1,1]$ לא הייתה קומפקטית סדרתית, כי $(-1)^n$ אינה מתכנסת. ההגדרה מבקשת רק תת-סדרה
          מתכנסת.
        misconception: MC-c3-whole-sequence
      - text: לכל סדרה **חסומה** של נקודות של $K$ יש תת-סדרה מתכנסת ב-$K$
        feedback: >-
          זו תכונת בולצאנו-ויירשטראס, והיא חלשה יותר: $\mathbb{R}$ מקיים אותה, אבל לסדרה $a_n=n$ אין תת-סדרה
          מתכנסת, ולכן $\mathbb{R}$ אינו קומפקטי סדרתית.
        misconception: MC-c3-bw-is-compactness

  - id: Q-3.1-negate
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: basic
    prompt: >-
      מה פירוש הטענה "$K$ **אינה** קומפקטית סדרתית"?
    choices:
      - text: קיימת סדרה ב-$K$ שלאף תת-סדרה שלה אין גבול ששייך ל-$K$
        correct: true
        feedback: >-
          נכון. "לכל סדרה קיימת תת-סדרה עם גבול ב-$K$" נשלל ל"קיימת סדרה שלכל תת-סדרה שלה אין גבול ב-$K$".
      - text: קיימת סדרה ב-$K$ שאינה מתכנסת
        feedback: >-
          זה לא מספיק: $(-1)^n$ אינה מתכנסת, ובכל זאת $[-1,1]$ קומפקטית סדרתית. צריך סדרה שאף תת-סדרה שלה לא
          מתכנסת לנקודה של $K$.
        misconception: MC-c3-negate-compact
      - text: לאף סדרה ב-$K$ אין תת-סדרה מתכנסת
        feedback: >-
          חזק מדי, ולמעשה אף פעם לא מתקיים בקבוצה לא ריקה: סדרה קבועה $x_n=p$ מתכנסת. בשלילה מספיקה סדרה אחת רעה.
        misconception: MC-c3-negate-compact
      - text: '$K$ אינה סגורה או אינה חסומה'
        feedback: >-
          זה מספיק כדי ש-$K$ לא תהיה קומפקטית סדרתית (משפט 3.1.5), אבל זה לא הפירוש: $\mathbb{N}$ במטריקה הבדידה
          סגורה וחסומה ואינה קומפקטית סדרתית.
        misconception: MC-c3-closed-bounded-compact

  - id: Q-3.1-which
    type: multi
    objectives: [OBJ-3.1-2]
    level: basic
    prompt: >-
      אילו מהקבוצות הבאות במישור, עם המטריקה האוקלידית, קומפקטיות סדרתית? סמנו את כולן.
    choices:
      - text: 'העיגול הסגור $\{(x,y): x^2+y^2\le1\}$'
        correct: true
        feedback: >-
          נכון: סגורה (מכילה את גבולות הסדרות שלה, כי $x^2+y^2$ רציפה) וחסומה, ולכן קומפקטית סדרתית לפי מסקנה
          3.1.8.
      - text: 'ההיפרבולה $\{(x,y): xy=1\}$'
        feedback: >-
          סגורה אבל לא חסומה: הסדרה $(n,\frac1n)$ בורחת לאינסוף, ולאף תת-סדרה שלה אין גבול.
        misconception: MC-c3-closed-bounded-compact
      - text: '$\{(\frac1n,0): n\in\mathbb{N}\}\cup\{(0,0)\}$'
        correct: true
        feedback: >-
          נכון. חסומה, וסגורה: הנקודה היחידה שהסדרה $(\frac1n,0)$ מתקרבת אליה, $(0,0)$, נמצאת בקבוצה.
      - text: '$\{(\frac1n,0): n\in\mathbb{N}\}$'
        feedback: >-
          חסומה אבל לא סגורה: הסדרה $(\frac1n,0)$ מתכנסת ל-$(0,0)$, שאינו בקבוצה, וכך גם כל תת-סדרה שלה.
        misconception: MC-c3-limit-in-set
      - text: 'הריבוע $[0,1]\times[0,1)$'
        feedback: >-
          חסום ולא סגור: $(0,1-\frac1n)\to(0,1)$, שאינה בריבוע.
        misconception: MC-c3-limit-in-set

  - id: Q-3.1-closed-proof
    type: rank
    objectives: [OBJ-3.1-1]
    level: basic
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון.'
    prompt: >-
      ההוכחה ש"קבוצה קומפקטית סדרתית $K$ במרחב מטרי היא סגורה" התפרקה לשלבים. סדרו אותם.
    items:
      - id: seq
        label: 'יהי $x\in\overline{K}$. יש סדרה $x_n\in K$ עם $x_n\to x$ (אפיון הסגור בסדרות, שיעור 1.5).'
      - id: sub
        label: 'כי $K$ קומפקטית סדרתית, יש תת-סדרה $x_{n_k}\to y$ עם $y\in K$.'
      - id: same
        label: 'תת-סדרה של סדרה מתכנסת מתכנסת לאותו גבול, ולכן גם $x_{n_k}\to x$.'
      - id: uniq
        label: 'מיחידות הגבול $x=y\in K$. לכן $\overline{K}\subseteq K$, ו-$K$ סגורה.'
    order: [seq, sub, same, uniq]
    correctFeedback: >-
      נכון. שימו לב איפה נכנס "הגבול בתוך $K$" שבהגדרה: בלעדיו היינו מקבלים רק $y\in X$, ולא היה ממה להסיק $x\in K$.
    wrongFeedback: >-
      מתחילים מנקודה של הסגור ומסדרה ב-$K$ שמתכנסת אליה. רק אז יש סדרה להפעיל עליה את הקומפקטיות הסדרתית, ובסוף
      משווים בין שני הגבולות.

  - id: Q-3.1-unbounded
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: במרחב מטרי כלשהו, קבוצה **לא חסומה** אינה קומפקטית סדרתית.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון: זה החצי השני של משפט 3.1.5, "קומפקטית סדרתית גורר סגורה וחסומה".'
      - text: לא נכון
        feedback: >-
          זה נכון בכל מרחב מטרי, וההוכחה קצרה: בונים סדרה שבורחת מנקודה קבועה, ואף תת-סדרה שלה אינה חסומה. גם
          ב-$\mathbb{R}$, שבו לכל סדרה חסומה יש תת-סדרה מתכנסת, לסדרה $a_n=n$ אין.
        misconception: MC-c3-bw-is-compactness
    reasons:
      - text: 'נקבע $p\in X$ ונבחר $x_n\in K$ עם $d(x_n,p)>n$. כל תת-סדרה שלה אינה חסומה, וסדרה מתכנסת חסומה; לכן לאף תת-סדרה אין גבול'
        correct: true
        feedback: >-
          בדיוק. אי-החסימות היא שמאפשרת לבחור את $x_n$, וחסימות של סדרה מתכנסת (שיעור 1.5) סוגרת את הטיעון.
      - text: 'כל סדרה בקבוצה לא חסומה מתבדרת'
        feedback: >-
          לא נכון: גם בקבוצה לא חסומה יש סדרות קבועות, והן מתכנסות. השלילה של קומפקטיות סדרתית דורשת סדרה **אחת** בלי
          תת-סדרה מתכנסת, וצריך לבנות אותה.
        misconception: MC-c3-negate-compact
      - text: 'קבוצה לא חסומה אינה סגורה'
        feedback: >-
          לא נכון: $\mathbb{R}$ כולו לא חסום וסגור (בעצמו). סגירות וחסימות הן שתי תכונות נפרדות.
        misconception: MC-c3-closed-bounded-compact

  - id: Q-3.1-subsub
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחה שקבוצה סגורה וחסומה $K\subseteq\mathbb{R}^2$ קומפקטית סדרתית, נתונה סדרה $(a_n,b_n)\in K$. מוצאים תת-סדרה
      $a_{n_k}\to a$, ואז מפעילים את בולצאנו-ויירשטראס על $(b_{n_k})$, **לא** על $(b_n)$. למה?
    choices:
      - text: 'כדי לקבל תת-סדרה אחת שבה שתי הקואורדינטות מתכנסות: בתת-סדרה של $(a_{n_k})$ הקואורדינטה הראשונה עדיין מתכנסת ל-$a$'
        correct: true
        feedback: >-
          נכון. תת-סדרה של סדרה מתכנסת מתכנסת לאותו גבול, וכך שומרים את מה שכבר הושג בקואורדינטה הראשונה.
      - text: 'אין צורך: אפשר להפעיל את בולצאנו-ויירשטראס על $(a_n)$ ועל $(b_n)$ בנפרד'
        feedback: >-
          שתי הבחירות לא מתואמות. למשל ב-$(a_n,b_n)=((-1)^n,\ (-1)^{\lfloor n/2\rfloor})$ התת-סדרה של
          האינדקסים הזוגיים מתאימה ל-$(a_n)$, והתת-סדרה של האינדקסים $4k+1$ מתאימה ל-$(b_n)$, ואין להן אף איבר
          משותף. ההוכחה צריכה תת-סדרה **אחת** שבה שתי הקואורדינטות מתכנסות.
        misconception: MC-c3-separate-subsequences
      - text: 'כי $(b_n)$ אולי לא חסומה'
        feedback: >-
          $(b_n)$ חסומה: $|b_n|\le\|(a_n,b_n)\|_2$, ו-$K$ חסומה. הסיבה היא תיאום האינדקסים בין שתי הקואורדינטות.
        misconception: MC-c3-separate-subsequences
      - text: 'כדי שהגבול יהיה ב-$K$'
        feedback: >-
          הגבול ב-$K$ בגלל ש-$K$ סגורה, וזה הצעד האחרון של ההוכחה. בחירת תת-הסדרה של תת-הסדרה לא קשורה לזה.
        misconception: MC-c3-limit-in-set

  - id: Q-3.1-where-closed
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: mid
    prompt: >-
      באותה הוכחה (סגורה וחסומה ב-$\mathbb{R}^k$ גורר קומפקטית סדרתית), באיזה צעד משתמשים בכך ש-$K$ **סגורה**?
    choices:
      - text: 'בסוף: תת-הסדרה מתכנסת לנקודה $x\in\mathbb{R}^k$, וסגירות נותנת $x\in K$'
        correct: true
        feedback: >-
          נכון. החסימות מאפשרת את בולצאנו-ויירשטראס, והסגירות מכניסה את הגבול לתוך $K$. בלי סגירות, כמו ב-$(0,1]$,
          תת-הסדרה מתכנסת, אבל אולי לנקודה שמחוץ לקבוצה.
      - text: 'בהתחלה: כדי שכל קואורדינטה של הסדרה תהיה חסומה'
        feedback: >-
          לזה משתמשים בחסימות של $K$: $|x_i|\le\|x\|_2$. גם קבוצה חסומה לא סגורה נותנת קואורדינטות חסומות.
        misconception: MC-c3-half-heine-borel
      - text: 'באמצע: כדי להפעיל את בולצאנו-ויירשטראס על הקואורדינטות'
        feedback: >-
          בולצאנו-ויירשטראס דורש רק סדרה חסומה של ממשיים. הגבול שהוא נותן נמצא ב-$\mathbb{R}$, ושם הסגירות עוד
          לא נדרשת.
        misconception: MC-c3-bw-is-compactness
      - text: 'בשום צעד: חסימות מספיקה במרחב האוקלידי'
        feedback: >-
          $(0,1]$ חסומה ואינה קומפקטית סדרתית: $\frac1n\to0\notin(0,1]$. הסגירות הכרחית.
        misconception: MC-c3-limit-in-set

  - id: Q-3.1-discrete
    type: twotier
    objectives: [OBJ-3.1-3]
    qualitative: true
    level: mid
    prompt: >-
      על $\mathbb{N}$ שמים את המטריקה הבדידה: $d(m,n)=1$ אם $m\ne n$ ו-0 אם $m=n$. האם $\mathbb{N}$ (כמרחב
      בפני עצמו) קומפקטי סדרתית?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. וזו דוגמה למרחב סגור (כל מרחב סגור בעצמו) וחסום (כל המרחקים לכל היותר 1) שאינו קומפקטי סדרתית.
      - text: כן
        feedback: >-
          המרחב אכן סגור וחסום, אבל זה לא מספיק מחוץ למרחב האוקלידי: הסדרה $1,2,3,\dots$ לא מכילה תת-סדרה מתכנסת.
        misconception: MC-c3-closed-bounded-compact
    reasons:
      - text: 'במטריקה הבדידה סדרה מתכנסת היא קבועה החל ממקום מסוים (קחו $\varepsilon=\frac12$), ולתת-סדרה של $1,2,3,\dots$ אין זנב קבוע'
        correct: true
        feedback: >-
          בדיוק. $d(x_n,x)<\frac12$ פירושו $x_n=x$, ולכן התכנסות במטריקה הבדידה היא "קבועה מ-$N$ והלאה". לאיברים
          השונים זה מזה של $1,2,3,\dots$ אין זנב כזה.
      - text: '$\mathbb{N}$ אינה חסומה, ולכן אינה קומפקטית סדרתית'
        feedback: >-
          במטריקה הבדידה $\mathbb{N}\subseteq B(1,2)$: כל המרחקים 0 או 1. החסימות נשפטת לפי המטריקה הנתונה, לא לפי
          הערך המוחלט.
        misconception: MC-c3-usual-metric-habit
      - text: 'בכל מרחב מטרי לכל סדרה חסומה יש תת-סדרה מתכנסת, אז הבעיה חייבת להיות בסגירות'
        feedback: >-
          ההנחה שגויה: הסדרה $1,2,3,\dots$ חסומה במטריקה הבדידה ואין לה תת-סדרה מתכנסת. בולצאנו-ויירשטראס הוא משפט
          על $\mathbb{R}^k$ (משפט 3.1.7).
        misconception: MC-c3-bw-everywhere

  - id: Q-3.1-xn-gap
    type: numeric
    objectives: [OBJ-3.1-3]
    level: mid
    prompt: >-
      ב-$(C[0,1],\|\cdot\|_\infty)$ נסמן $f_n(x)=x^n$, ונקבע $n\in\mathbb{N}$. חשבו את
      $\lim_{m\to\infty}\|f_n-f_m\|_\infty$. (התשובה אינה תלויה ב-$n$.)
    answer: 1
    tolerance: 0.001
    correctFeedback: >-
      נכון. לכל $m>n$ ו-$x\in[0,1]$, $0\le x^m\le x^n\le1$, ולכן $\|f_n-f_m\|_\infty\le1$. מלמטה: יהי $0<\eta<1$
      ו-$x_0=(1-\eta)^{1/n}<1$. אז $x_0^n=1-\eta$ ו-$x_0^m\to0$, ולכן
      $\|f_n-f_m\|_\infty\ge1-\eta-x_0^m$, שגבולו $1-\eta$. מכאן הגבול 1. המסקנה: לכל תת-סדרה ולכל $k$,
      $\|f_{n_k}-f_{n_l}\|_\infty\to1$ כש-$l\to\infty$, ולכן אף תת-סדרה אינה סדרת קושי, ולפי טענה 2.1.4 אף תת-סדרה
      אינה מתכנסת: הוכחה שנייה לטענה 3.1.9(ג), בלי הגבול הנקודתי.
    wrongFeedback: >-
      חסמו מלמעלה בעזרת $0\le x^m\le x^n\le1$ (כש-$m>n$), ומלמטה בנקודה $x_0<1$ קרובה ל-1, שבה $x_0^n$ קרוב ל-1
      בעוד ש-$x_0^m\to0$.
    commonWrong:
      - value: 0.25
        feedback: >-
          זה $\|f_n-f_{2n}\|_\infty$, כש-$m=2n$ (שם עם $t=x^n$ ההפרש הוא $t-t^2$). כאן $n$ קבוע ו-$m\to\infty$, ובנקודה
          קבועה $x_0<1$ האיבר $x_0^m$ נעלם, כך שההפרש מתקרב ל-$x_0^n$.
      - value: 0
        feedback: >-
          0 היה מתקבל אילו $(f_m)$ הייתה סדרת קושי ב-$\|\cdot\|_\infty$, וההתכנסות בכל נקודה לא נותנת את זה. בכל
          $x<1$ קבוע $x^n-x^m\to x^n$, והסופרמום של $x^n$ על $[0,1)$ הוא 1.
        misconception: MC-c3-pointwise-is-enough
    hints:
      - 'כש-$m>n$, $0\le f_n-f_m\le f_n\le1$. מצאו נקודה $x_0<1$ שבה $f_n(x_0)=1-\eta$, ובדקו מה קורה ל-$f_m(x_0)$ כש-$m\to\infty$.'

  - id: Q-3.1-ball-C
    type: twotier
    objectives: [OBJ-3.1-3]
    qualitative: true
    level: mid
    prompt: >-
      $\theta$ פונקציית האפס. האם כדור היחידה הסגור $B[\theta,1]=\{f\in C[0,1]: \|f\|_\infty\le1\}$ קומפקטי סדרתית
      ב-$(C[0,1],\|\cdot\|_\infty)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. הוא סגור וחסום, וזו הדוגמה המרכזית לכך שבמרחב פונקציות "סגורה וחסומה" אינה מספיקה לקומפקטיות
          סדרתית (טענה 3.1.9(ב), (ג)).
      - text: כן
        feedback: >-
          $B[\theta,1]$ סגור וחסום, אבל זה לא מספיק במרחב פונקציות: לסדרה $x^n$ שבו אין תת-סדרה מתכנסת.
        misconception: MC-c3-closed-bounded-compact
    reasons:
      - text: 'הסדרה $x^n\in B[\theta,1]$: כל תת-סדרה מתכנסת נקודתית לפונקציה שהיא 0 ב-$[0,1)$ ו-1 ב-1; גבול ב-$\|\cdot\|_\infty$ היה שווה לה ורציף, וזו סתירה'
        correct: true
        feedback: >-
          בדיוק. גבול ב-$\|\cdot\|_\infty$ הוא גם הגבול בכל נקודה (משפט 1.5.10(ב)), והוא חייב להיות רציף כי הוא ב-$C[0,1]$.
          הגבול הנקודתי היחיד האפשרי אינו רציף.
      - text: '$x^n$ מתכנסת נקודתית, ולכן יש לה תת-סדרה מתכנסת, אבל הגבול מחוץ לכדור'
        feedback: >-
          התכנסות נקודתית אינה התכנסות במרחב הזה. לאף תת-סדרה של $x^n$ אין גבול ב-$C[0,1]$ בכלל: אפילו
          $\|x^n-x^{2n}\|_\infty=\frac14$ לכל $n$.
        misconception: MC-c3-pointwise-is-enough
      - text: '$B[\theta,1]$ אינו סגור'
        feedback: >-
          הוא סגור: אם $\|f_n\|_\infty\le1$ ו-$f_n\to f$ ב-$\|\cdot\|_\infty$, אז $|f(x)|=\lim|f_n(x)|\le1$ לכל $x$. הבעיה
          היא קומפקטיות סדרתית, לא סגירות.
        misconception: MC-c3-limit-in-set
    explanation: >-
      דרך נוספת (טענה 3.1.9(ב)): פונקציות האוהל $t_n$, עם גובה 1, שכל אחת מהן מתאפסת מחוץ לקטע
      $[2^{-n},2^{-n+1}]$ (והקטעים נפגשים לכל היותר בקצה), מקיימות $\|t_n-t_m\|_\infty=1$ לכל $n\ne m$. לפי למה 3.1.4
      לאף תת-סדרה שלהן אין גבול, ואף תת-סדרה אינה אפילו סדרת קושי.

  - id: Q-3.1-box-seq
    type: multi
    objectives: [OBJ-3.1-3]
    qualitative: true
    level: exam
    prompt: >-
      ב-$(B(\mathbb{N}),d_\infty)$, לסדרה חסומה $c=(c_i)$ של מספרים חיוביים נגדיר את "הקופסה"
      $H_c=\{x\in B(\mathbb{N}):\ |x(i)|\le c_i\ \ \forall i\}$. בדוגמה השישית של השיעור ("קובייה במרחב הסדרות") הוכחנו ש-$H_c$ קומפקטית סדרתית
      כש-$c_i=\frac1i$. לאילו מהסדרות הבאות $H_c$ קומפקטית סדרתית? סמנו את כולן, והוכיחו לעצמכם כל תשובה: הכלילו את
      הוכחת הדוגמה, או מצאו ב-$H_c$ סדרה מופרדת.
    choices:
      - text: '$c_i=2^{-i}$'
        correct: true
        feedback: >-
          כן. ההוכחה של הדוגמה השישית עובדת כמעט מילה במילה: צעדים 1–3 צריכים רק שכל קואורדינטה חסומה ב-$c_i$, ושהסדרה $c$
          חסומה (כדי ש-$y\in B(\mathbb{N})$). בצעד 4 בוחרים $I$ כך ש-$2c_i<\frac\varepsilon2$ לכל $i\ge I$, וזה אפשרי כי
          $c_i\to0$.
      - text: '$c_i=\frac1{\ln(i+1)}$'
        correct: true
        feedback: >-
          כן, אף שהסדרה יורדת לאט: $c$ חסומה (האיבר הגדול ביותר הוא $\frac1{\ln2}\approx1.443$) ו-$c_i\to0$, וזה כל
          מה שההכללה של הוכחת הדוגמה השישית צריכה (בצעד 4, $I$ עם $2c_i<\frac\varepsilon2$ לכל $i\ge I$).
      - text: '$c_i=1$ ל-$i$ זוגי ו-$c_i=\frac1i$ ל-$i$ אי-זוגי'
        feedback: >-
          לא. הסדרה $x_k=e_{2k}$ (1 במקום $2k$ ו-0 בשאר) נמצאת ב-$H_c$, ו-$d_\infty(x_k,x_l)=1$ לכל $k\ne l$: היא
          מופרדת, ולפי למה 3.1.4 אין לה תת-סדרה מתכנסת. האלכסון של הדוגמה השישית עדיין נותן התכנסות בכל קואורדינטה, אבל
          צעד 4 נשבר: הזנבות אינם קטנים במידה שווה.
        misconception: MC-c3-pointwise-is-enough
      - text: '$c_i=\frac1{1+\sin^2i}$'
        feedback: >-
          לא. $c_i\ge\frac12$ לכל $i$, ולכן $x_k=\frac12e_k\in H_c$, עם $d_\infty(x_k,x_l)=\frac12$ לכל $k\ne l$: סדרה
          מופרדת, ולמה 3.1.4. $H_c$ סגורה וחסומה, וזה לא מספיק.
        misconception: MC-c3-closed-bounded-compact
    explanation: >-
      הכלל: $H_c$ קומפקטית סדרתית אם ורק אם $c_i\to0$. אם $c_i\to0$, ההוכחה של הדוגמה השישית עובדת עם $c_i$ במקום $\frac1i$.
      אם $c_i\not\to0$, יש $\varepsilon>0$ ואינסוף מקומות $i_1<i_2<\cdots$ עם $c_{i_k}\ge\varepsilon$; הסדרה
      $x_k=\varepsilon e_{i_k}$ נמצאת ב-$H_c$ ומופרדת $\varepsilon$, ולפי למה 3.1.4 אין לה תת-סדרה מתכנסת.

  - id: Q-3.1-relative
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      נתבונן ב-$X=(0,1]$ עם המטריקה $d(x,y)=|x-y|$ כמרחב מטרי בפני עצמו. $X$ סגור ב-$X$ וחסום. האם $X$ קומפקטי
      סדרתית?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. קומפקטיות סדרתית היא תכונה פנימית (טענה 3.1.2), ו"סגור בתוך עצמו" נכון לכל מרחב, ולכן אינו אומר
          עליה דבר.
      - text: כן
        feedback: >-
          כל מרחב סגור בתוך עצמו, ולכן הנימוק הזה היה מוכיח שכל מרחב חסום קומפקטי סדרתית. הסדרה $\frac1n$ מראה
          שלא.
        misconception: MC-c3-closed-in-itself
    reasons:
      - text: 'הסדרה $\frac1n$ מתכנסת ב-$\mathbb{R}$ ל-0, ולכן כל תת-סדרה שלה מתכנסת ל-0 ב-$\mathbb{R}$; אילו התכנסה ב-$X$ לנקודה $p\in(0,1]$, הייתה מתכנסת ל-$p$ גם ב-$\mathbb{R}$, וזה סותר את יחידות הגבול'
        correct: true
        feedback: >-
          בדיוק. ההתכנסות ב-$X$ היא אותה התכנסות כמו ב-$\mathbb{R}$, כי המטריקה זהה; רק הנקודה 0 חסרה.
      - text: '$X$ אינו סגור ב-$X$, ולכן לפי משפט 3.1.5 אינו קומפקטי סדרתית'
        feedback: >-
          ההנחה שגויה: כל מרחב סגור בעצמו (מסקנה 1.3.8(א)), ובפרט $X$ סגור ב-$X$. $X$ אינו סגור ב-$\mathbb{R}$, וזה כן
          טיעון נכון: אילו $X$ היה קומפקטי סדרתית, לפי טענה 3.1.2 הוא היה קומפקטי סדרתית גם כתת-קבוצה של
          $\mathbb{R}$, ולפי משפט 3.1.5 סגור ב-$\mathbb{R}$ (ההערה אחרי משפט 3.1.5). חשוב לומר באיזה מרחב "סגור".
        misconception: MC-c1-subspace-ignored
      - text: 'לסדרה $\frac1n$ אין תת-סדרה שמתכנסת במרחב כלשהו'
        feedback: >-
          ב-$\mathbb{R}$ היא מתכנסת, ל-0. הבעיה היא רק שהגבול אינו נקודה של $X$.
        misconception: MC-c3-limit-in-set
    explanation: >-
      שתי הוכחות נכונות. (1) הסדרה $\frac1n$, כמו בנימוק הנכון ובהוכחת טענה 3.1.9(ה). (2) דרך הסגירות **ב-$\mathbb{R}$**:
      לפי טענה 3.1.2(א) קומפקטיות סדרתית של המרחב $(X,d)$ היא קומפקטיות סדרתית של $X$ כתת-קבוצה של $\mathbb{R}$,
      ולפי משפט 3.1.5 קבוצה כזו סגורה ב-$\mathbb{R}$; אבל $\frac1n\to0\notin X$, ולכן $X$ אינו סגור ב-$\mathbb{R}$. הסגירות
      של $X$ בתוך עצמו אינה משחקת תפקיד.

  - id: Q-3.1-nested-open
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, ותהיינה $K_1\supseteq K_2\supseteq\cdots$ קבוצות קומפקטיות סדרתית ולא ריקות ב-$X$. תהי
      $U\subseteq X$ פתוחה עם $\bigcap_nK_n\subseteq U$. נכון או לא נכון: יש $N$ כך ש-$K_N\subseteq U$.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. הקבוצות "נכנסות" כולן לתוך $U$ מאיזשהו מקום, אף שאף אחת מהן אינה חייבת להיות שווה לחיתוך.
      - text: לא נכון
        feedback: >-
          נסו לבנות דוגמה נגדית: הייתם צריכים נקודות $x_n\in K_n$ מחוץ ל-$U$ שמתקרבות לחיתוך, שכולו בתוך $U$. אבל
          $X\setminus U$ סגורה, וגבול של נקודות שבה נשאר בה.
        misconception: MC-c3-limit-escapes
    reasons:
      - text: 'אחרת נבחר $x_n\in K_n\setminus U$; לתת-סדרה יש גבול $x\in K_1$, ולפי הוכחת משפט 3.1.11 $x$ בכל $K_m$, כלומר $x\in U$; אבל כל $x_n$ ב-$X\setminus U$, שהיא סגורה, ולכן גם $x\notin U$'
        correct: true
        feedback: >-
          בדיוק. אותה הוכחה כמו משפט 3.1.11, עם הקבוצות $K_n\setminus U=K_n\cap(X\setminus U)$, שהן קומפקטיות סדרתית
          לפי טענה 3.1.6(ג). אילו כולן היו לא ריקות, לפי משפט 3.1.11 היה להן חיתוך לא ריק, מחוץ ל-$U$ ובתוך
          $\bigcap_nK_n$: סתירה.
      - text: 'החיתוך לא ריק לפי משפט 3.1.11, ולכן מאיזשהו $N$ הקבוצה $K_N$ שווה לחיתוך, שמוכל ב-$U$'
        feedback: >-
          סדרה יורדת לא חייבת להגיע לחיתוך שלה: $[0,\frac1n]$ יורדות וחיתוכן $\{0\}$, ואף אחת מהן אינה $\{0\}$. ובכל
          זאת כל קטע פתוח שמכיל את 0 מכיל את $[0,\frac1N]$ עבור $N$ גדול: זה מה שצריך להוכיח, בעזרת סדרות.
        misconception: MC-c3-nested-equals-intersection
      - text: 'נקודות $x_n\in K_n$ מחוץ ל-$U$ מתכנסות לנקודה של החיתוך, ולכן לתוך $U$; זו לא סתירה, ולכן הטענה לא נכונה'
        feedback: >-
          גבול של סדרה בקבוצה הסגורה $X\setminus U$ נמצא ב-$X\setminus U$ (מסקנה 1.5.8(ב)), ולכן אינו ב-$U$. זו בדיוק
          הסתירה שמוכיחה את הטענה.
        misconception: MC-c3-limit-escapes
    explanation: >-
      הקומפקטיות הסדרתית נחוצה: ב-$\mathbb{R}$ הקבוצות $[n,\infty)$ סגורות, לא ריקות ויורדות, החיתוך שלהן ריק ולכן מוכל
      ב-$U=\emptyset$, ואף אחת מהן אינה מוכלת ב-$\emptyset$. גם עם חיתוך לא ריק: $F_n=\{0\}\cup[n,\infty)$ וקבוצה פתוחה
      $U=(-1,1)$.

  - id: Q-3.1-dist-attained
    type: twotier
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: exam
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $K\subseteq X$ קומפקטית סדרתית ולא ריקה, ו-$p\in X$. נכון או לא נכון: יש $a\in K$ עם
      $d(p,a)=\operatorname{dist}(p,K)$, כלומר המרחק מ-$p$ ל-$K$ מתקבל.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. האינפימום שמגדיר את $\operatorname{dist}(p,K)$ מתקבל בנקודה של $K$, כמו שהמקסימום של פונקציה רציפה
          מתקבל בקטע סגור.
      - text: לא נכון
        feedback: >-
          נסו לבנות דוגמה נגדית: תצטרכו נקודות $a_n\in K$ שמרחקן מ-$p$ יורד לאינפימום בלי שאף נקודה של $K$ תשיג אותו.
          אבל לתת-סדרה של $(a_n)$ יש גבול **ב-$K$**, והמרחק ממנו ל-$p$ הוא בדיוק האינפימום.
        misconception: MC-c3-limit-in-set
    reasons:
      - text: 'נבחר $a_n\in K$ עם $d(p,a_n)<\operatorname{dist}(p,K)+\frac1n$; יש תת-סדרה $a_{n_j}\to a\in K$; לפי טענה 1.5.6(א) $d(p,a_{n_j})\to d(p,a)$, ולפי כלל הסנדוויץ'' $d(p,a)=\operatorname{dist}(p,K)$'
        correct: true
        feedback: >-
          בדיוק. $a_n$ קיימים לפי הגדרת האינפימום (בחירה בת מנייה). לכל $j$,
          $\operatorname{dist}(p,K)\le d(p,a_{n_j})<\operatorname{dist}(p,K)+\frac1{n_j}$, ו-$\frac1{n_j}\to0$. הקומפקטיות
          הסדרתית נכנסת במקום אחד: הגבול $a$ נמצא ב-$K$.
      - text: '$K$ סגורה (משפט 3.1.5), ובקבוצה סגורה המרחק מנקודה תמיד מתקבל'
        feedback: >-
          ב-$\mathbb{R}^k$ זה נכון (שם סגורה וחסומה מספיק), אבל לא במרחב כללי. ב-$(B(\mathbb{N}),d_\infty)$, עם $p=\theta$
          ו-$K=\{(1+\frac1k)e_k:\ k\in\mathbb{N}\}$: כל שני איברים שונים של $K$ רחוקים לפחות 1 זה מזה, ולכן סדרה
          מתכנסת ב-$K$ קבועה מאיזשהו מקום (היא סדרת קושי), ו-$K$ סגורה; היא גם חסומה. אבל
          $\operatorname{dist}(\theta,K)=\inf_k(1+\frac1k)=1$, ואף איבר של $K$ אינו במרחק 1 מ-$\theta$.
        misconception: MC-c3-closed-bounded-compact
      - text: 'כל סדרה $a_n\in K$ עם $d(p,a_n)\to\operatorname{dist}(p,K)$ מתכנסת, וגבולה הוא הנקודה הקרובה ביותר'
        feedback: >-
          לא כל סדרה כזו מתכנסת: ב-$\mathbb{R}$ עם $K=\{-1,1\}$ ו-$p=0$, הסדרה $a_n=(-1)^n$ מקיימת $d(0,a_n)=1=\operatorname{dist}(0,K)$
          לכל $n$, ואינה מתכנסת. יש רק **תת-סדרה** מתכנסת, וגם הנקודה הקרובה ביותר אינה בהכרח יחידה.
        misconception: MC-c3-whole-sequence
    explanation: >-
      ההוכחה בנימוק הנכון היא תבנית שתחזור הרבה (למשל בתרגול הכתוב, כשמוכיחים שהקוטר מתקבל): בוחרים סדרה שמשיגה את האינפימום בקירוב, עוברים
      לתת-סדרה מתכנסת עם גבול ב-$K$, ומעבירים את המרחק לגבול. בלי קומפקטיות סדרתית זה נכשל גם בקבוצה סגורה וחסומה,
      כמו בדוגמה ב-$B(\mathbb{N})$.

  - id: Q-3.1-quarter-stuck
    type: twotier
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: exam
    prompt: >-
      בצעד 2 של ההוכחה השנייה של משפט 3.1.7 (בחציות) בוחרים בת $Q_{j+1}$ של $Q_j$ עם $A(Q_{j+1})$ **אינסופית**.
      סטודנט מציע להסתפק בבת שבה יש $x_n$ עבור **לפחות אינדקס אחד** $n>n_j$, ולבחור $n_{j+1}$ להיות האינדקס הקטן
      ביותר כזה. נכון או לא נכון: גם כך ההוכחה עובדת.
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. ההוכחה צריכה בכל שלב אינדקס **נוסף**, ובחירה של בת עם איבר מאוחר אחד יכולה להשאיר את השלב הבא בלי
          אף אינדקס מתאים.
