# Lesson 3.5 — equivalent norms.
# Objectives (src/course.ts):
#   OBJ-3.5-1  define equivalent norms; equivalent norms give the same convergent sequences and the same open sets
#   OBJ-3.5-2  prove that all norms on Euclidean space are equivalent, using the compactness of the unit sphere
#   OBJ-3.5-3  every linear map on Euclidean space is continuous; the sup norm and the integral norm on C[0,1] are not equivalent
chapter: 3
questions:
  - id: Q-3.5-def
    type: mc
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: basic
    prompt: >-
      השלימו את ההגדרה (הגדרה 3.5.1): שתי נורמות $\|\cdot\|_a$ ו-$\|\cdot\|_b$ על מרחב וקטורי ממשי $V$ נקראות
      **שקולות** כאשר…
    choices:
      - text: 'יש $c,C>0$ כך ש-$c\|x\|_a\le\|x\|_b\le C\|x\|_a$ לכל $x\in V$'
        correct: true
        feedback: >-
          נכון. כל נורמה חסומה מלעיל על ידי כפולה של השנייה, **בשני הכיוונים**.
      - text: 'יש $C>0$ כך ש-$\|x\|_b\le C\|x\|_a$ לכל $x\in V$'
        feedback: >-
          זה רק חצי. ב-$C[0,1]$ מתקיים $\|f\|_1\le\|f\|_\infty$, אבל $\|x^n\|_\infty=1$ ו-$\|x^n\|_1=\frac1{n+1}$, ולכן
          אין חסם בכיוון השני.
        misconception: MC-c3-one-sided-bound
      - text: 'יש $C>0$ כך ש-$\|x\|_b=C\|x\|_a$ לכל $x\in V$'
        feedback: >-
          זה תנאי מספיק אבל לא הכרחי: מקרה פרטי חזק מדי. $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ במישור שקולות, אבל היחס ביניהן משתנה: 1 ב-$(1,0)$
          ו-2 ב-$(1,1)$.
        misconception: MC-c3-equivalent-same-numbers
      - text: 'יש להן אותו כדור יחידה'
        feedback: >-
          אז הן שוות (ובפרט שקולות, עם $c=C=1$), אבל התנאי אינו הכרחי. נורמות שקולות יכולות להיות עם כדורים שונים לגמרי: ריבוע מסובב מול ריבוע מול עיגול.
        misconception: MC-c3-equivalent-same-numbers

  - id: Q-3.5-const-num
    type: numeric
    objectives: [OBJ-3.5-1]
    level: basic
    prompt: >-
      ב-$\mathbb{R}^9$: מהו הקבוע **הקטן ביותר** $C$ כך ש-$\|x\|_1\le C\|x\|_2$ לכל $x$?
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון. לפי קושי-שוורץ $\|x\|_1=\sum|x_i|\cdot1\le\|x\|_2\sqrt9$, ובווקטור $(1,\dots,1)$ יש שוויון: $\|x\|_1=9$
      ו-$\|x\|_2=3$. לכן $C=\sqrt n=3$ ואי אפשר פחות.
    wrongFeedback: >-
      כתבו $\|x\|_1=\sum|x_i|\cdot1$ והפעילו קושי-שוורץ. אחר כך בדקו את הווקטור $(1,\dots,1)$.
    commonWrong:
      - value: 9
        feedback: >-
          $9$ עובד ($\|x\|_1\le9\|x\|_\infty\le9\|x\|_2$), אבל אינו הקטן ביותר. השרשרת מאבדת מידע; קושי-שוורץ נותן $\sqrt9$.
        misconception: MC-c3-best-constant
      - value: 1
        feedback: >-
          $\|x\|_2\le\|x\|_1$ עם קבוע 1 נכון, אבל זה הכיוון ההפוך. עבור $(1,1,\dots,1)$ מקבלים $\|x\|_1=9>1\cdot\|x\|_2=3$.
        misconception: MC-c3-one-sided-bound

  - id: Q-3.5-convergence
    type: multi
    objectives: [OBJ-3.5-1]
    level: basic
    prompt: >-
      אילו מהטענות הבאות נכונות? סמנו את כולן.
    choices:
      - text: 'ב-$\mathbb{R}^3$, $x_k\to x$ בנורמה $\|\cdot\|_1$ אם ורק אם $x_k\to x$ בנורמה $\|\cdot\|_\infty$'
        correct: true
        feedback: >-
          נכון: $\|y\|_\infty\le\|y\|_1\le3\|y\|_\infty$, ולכן $\|x_k-x\|_1\to0$ אם ורק אם $\|x_k-x\|_\infty\to0$.
      - text: 'ב-$C[0,1]$, אם $f_k\to f$ בנורמת הסופרמום אז $f_k\to f$ בנורמת האינטגרל'
        correct: true
        feedback: >-
          נכון: $\|g\|_1=\int_0^1|g|\le\|g\|_\infty$. אי-שוויון בכיוון אחד מספיק להעברת התכנסות בכיוון אחד.
      - text: 'ב-$C[0,1]$, אם $f_k\to0$ בנורמת האינטגרל אז $f_k\to0$ בנורמת הסופרמום'
        feedback: >-
          $\|x^k\|_1=\frac1{k+1}\to0$ אבל $\|x^k\|_\infty=1$. במרחב ממימד אינסופי נורמות יכולות להיות לא שקולות.
        misconception: MC-c3-all-norms-infinite-dim
      - text: 'ב-$\mathbb{R}^3$ לנורמות $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ אותו כדור יחידה, כי הן שקולות'
        feedback: >-
          $(1,1,1)$ בכדור היחידה של $\|\cdot\|_\infty$, ו-$\|(1,1,1)\|_1=3$. השקילות שומרת על התכנסות, לא על הכדורים.
        misconception: MC-c3-equivalent-same-numbers

  - id: Q-3.5-linear-cont
    type: mc
    objectives: [OBJ-3.5-3]
    level: basic
    prompt: >-
      $T:\mathbb{R}^n\to W$ לינארית, כש-$\mathbb{R}^n$ עם נורמה כלשהי $N$ ו-$W$ מרחב נורמי כלשהו. למה $T$ רציפה?
    choices:
      - text: '$$\begin{aligned}\|Tx\|&\le\sum|x_i|\,\|Te_i\|\\&\le M\|x\|_1\le MC\,N(x)\end{aligned}$$ עם $M=\max_i\|Te_i\|$, כי $\|\cdot\|_1$ ו-$N$ שקולות; העתקה לינארית חסומה רציפה'
        correct: true
        feedback: >-
          נכון. החסם $M\|x\|_1$ הוא חישוב ישיר; שקילות הנורמות מעבירה אותו לכל נורמה $N$, ושיעור 1.8 הופך חסימות
          לרציפות.
      - text: 'כל העתקה לינארית בין מרחבים נורמיים רציפה'
        feedback: >-
          לא במימד אינסופי: הגזירה ב-$(C^1[0,1],\|\cdot\|_\infty)$ (שיעור 1.8), או $f\mapsto f(0)$ על
          $(C[0,1],\|\cdot\|_1)$, אינן חסומות. המימד הסופי של התחום הוא שמציל.
        misconception: MC-c3-linear-always-continuous
      - text: 'כי $\mathbb{R}^n$ קומפקטי, ופונקציה על מרחב קומפקטי רציפה'
        feedback: >-
          $\mathbb{R}^n$ אינו קומפקטי (סגור ולא חסום), ופונקציה על מרחב קומפקטי אינה רציפה אוטומטית. הקומפקטיות
          נכנסת דרך הספרה, בהוכחת שקילות הנורמות.
        misconception: MC-c3-half-heine-borel

  - id: Q-3.5-same-open
    type: twotier
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: mid
    prompt: >-
      $\|\cdot\|_a$ ו-$\|\cdot\|_b$ נורמות שקולות על $V$. נכון או לא נכון: כל קבוצה פתוחה לפי $\|\cdot\|_a$ פתוחה
      גם לפי $\|\cdot\|_b$.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. לכן לנורמות שקולות אותן קבוצות פתוחות, אותן סגורות ואותן פונקציות רציפות.
      - text: לא נכון
        feedback: >-
          הכדורים של שתי הנורמות שונים, אבל כל כדור של אחת מכיל כדור (קטן יותר) של השנייה סביב אותו מרכז, וזה מה
          שפתיחות צריכה.
        misconception: MC-c3-equivalent-same-numbers
    reasons:
      - text: 'מ-$c\|y\|_a\le\|y\|_b$: אם $\|y-x\|_b<cr$ אז $\|y-x\|_a<r$, כלומר $B_b(x,cr)\subseteq B_a(x,r)$. אז אם $U$ פתוחה לפי $a$ ו-$B_a(x,r)\subseteq U$, גם $B_b(x,cr)\subseteq U$'
        correct: true
        feedback: >-
          בדיוק. שימו לב שכאן נדרש אי-השוויון $c\|y\|_a\le\|y\|_b$; לכיוון ההפוך משתמשים באי-השוויון השני.
      - text: 'לנורמות שקולות יש אותם כדורים'
        feedback: >-
          לא: כדור היחידה של $\|\cdot\|_1$ במישור הוא ריבוע מסובב ושל $\|\cdot\|_\infty$ ריבוע. מה שנכון הוא שכל כדור
          של אחת מכיל כדור של השנייה.
        misconception: MC-c3-equivalent-same-numbers
      - text: 'מספיק $\|y\|_b\le C\|y\|_a$: הוא נותן $B_a(x,\frac rC)\subseteq B_b(x,r)$'
        feedback: >-
          ההכלה הזו נכונה, אבל היא מראה שפתוחה לפי $b$ פתוחה לפי $a$, הכיוון ההפוך. לכיוון המבוקש צריך את
          אי-השוויון השני.
        misconception: MC-c3-one-sided-bound

  - id: Q-3.5-opnorm
    type: mc
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: basic
    prompt: >-
      עבור $A=\begin{pmatrix}1&2\\3&4\end{pmatrix}$ נורמת האופרטור היא 6 כש-$\mathbb{R}^2$ עם $\|\cdot\|_1$, ו-7 כשהוא
      עם $\|\cdot\|_\infty$ (שיעור 1.8). מה נכון?
    choices:
      - text: 'נורמת האופרטור תלויה בנורמה, אבל העובדה שהיא סופית (כלומר ש-$A$ רציפה) לא תלויה בה, כי הנורמות שקולות'
        correct: true
        feedback: >-
          נכון. שקילות שומרת על חסימות ורציפות, לא על המספרים עצמם.
      - text: 'אחד החישובים שגוי: לנורמות שקולות אותה נורמת אופרטור'
        feedback: >-
          שני החישובים נכונים: 6 הוא סכום העמודה השנייה, $2+4$, ו-7 הוא סכום השורה השנייה, $3+4$. שקילות לא שומרת על
          המספרים.
        misconception: MC-c3-equivalent-same-numbers
      - text: 'הנורמות $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ על $\mathbb{R}^2$ אינן שקולות, כי נורמות האופרטור שונות'
        feedback: >-
          הן שקולות: $\|x\|_\infty\le\|x\|_1\le2\|x\|_\infty$. מספרים שונים לא סותרים שקילות.
        misconception: MC-c3-equivalent-same-numbers

  - id: Q-3.5-why-sphere
    type: mc
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בהוכחה שכל נורמה $N$ על $\mathbb{R}^n$ שקולה ל-$\|\cdot\|_2$, למה צריך את הקומפקטיות של הספרה
      $S=\{x: \|x\|_2=1\}$?
    choices:
      - text: 'כדי ש-$N$, שהיא רציפה, תקבל מינימום $m$ על $S$; כי $0\notin S$, $m>0$, וזה החסם התחתון $m\|x\|_2\le N(x)$'
        correct: true
        feedback: >-
          נכון. החסם העליון בא מאי-שוויון המשולש בלבד; החסם התחתון הוא החלק הקשה, ושם הקומפקטיות הופכת "$N>0$ על
          $S$" ל"$N\ge m>0$ על $S$".
      - text: 'אין צורך: $N(x)>0$ לכל $x\in S$, ולכן $\inf_S N>0$'
        feedback: >-
          פונקציה חיובית יכולה להיות עם אינפימום 0, כמו $x$ על $(0,1]$. בלי קומפקטיות ההוכחה נופלת, ואכן ב-$C[0,1]$
          $\inf\{\|f\|_1: \|f\|_\infty=1\}=0$.
        misconception: MC-c3-inf-positive
      - text: 'כדי לקבל את החסם העליון $N(x)\le C\|x\|_2$'
        feedback: >-
          החסם העליון בא בלי קומפקטיות: $N(x)\le\sum|x_i|N(e_i)\le\max_iN(e_i)\sqrt n\,\|x\|_2$. חסם אחד בלבד אינו
          שקילות, והחסם השני הוא שדורש קומפקטיות.
        misconception: MC-c3-one-sided-bound
      - text: 'כי ספרת היחידה קומפקטית בכל מרחב נורמי, וכך ההוכחה עובדת בכל מרחב'
        feedback: >-
          ספרת היחידה של $(C[0,1],\|\cdot\|_\infty)$ סגורה וחסומה ואינה קומפקטית ($x^n$ שוב). היינה-בורל הוא מה שהופך
          את ההוכחה לנכונה דווקא ב-$\mathbb{R}^n$.
        misconception: MC-c3-closed-bounded-compact

  - id: Q-3.5-not-equiv
    type: twotier
    objectives: [OBJ-3.5-3]
    qualitative: true
    level: mid
    prompt: >-
      האם $\|\cdot\|_\infty$ ו-$\|\cdot\|_1$ שקולות על $C[0,1]$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. וזה מראה שמשפט שקילות הנורמות דורש מימד סופי.
      - text: כן
        feedback: >-
          $\|f\|_1\le\|f\|_\infty$ נכון, אבל בכיוון ההפוך אין קבוע: $\frac{\|x^n\|_\infty}{\|x^n\|_1}=n+1\to\infty$.
        misconception: MC-c3-one-sided-bound
    reasons:
      - text: '$\|x^n\|_\infty=1$ ו-$\|x^n\|_1=\frac1{n+1}$, ולכן אין $C$ עם $\|f\|_\infty\le C\|f\|_1$ לכל $f$'
        correct: true
        feedback: >-
          בדיוק. אילו היה $C$, היה $1\le\frac C{n+1}$ לכל $n$.
      - text: '$\|f\|_1\le\|f\|_\infty$ לכל $f$, ולכן הן שקולות'
        feedback: >-
          זה חצי מהשקילות בלבד; החצי השני נכשל ב-$x^n$.
        misconception: MC-c3-one-sided-bound
      - text: 'כל שתי נורמות על מרחב וקטורי שקולות'
        feedback: >-
          רק במימד סופי. $C[0,1]$ ממימד אינסופי, והזוג הזה הוא הדוגמה הנגדית.
        misconception: MC-c3-all-norms-infinite-dim

  - id: Q-3.5-normalized-num
    type: numeric
    objectives: [OBJ-3.5-3]
    level: basic
    prompt: >-
      $g_n(x)=(n+1)x^n$ מקיימת $\|g_n\|_1=1$ לכל $n$. חשבו את $\|g_9\|_\infty$ על $[0,1]$.
    answer: 10
    tolerance: 0.001
    correctFeedback: >-
      נכון: $\|g_9\|_\infty=10\cdot1^9=10$. כלומר $g_n$ על ספרת היחידה של $\|\cdot\|_1$, ו-$\|g_n\|_\infty=n+1$ לא
      חסום: אין $C$ עם $\|f\|_\infty\le C\|f\|_1$.
    wrongFeedback: >-
      $x^9$ עולה ב-$[0,1]$, ולכן המקסימום של $10x^9$ מתקבל ב-$x=1$.
    commonWrong:
      - value: 1
        feedback: >-
          $\|g_9\|_1=1$, אבל זה לא אומר דבר על $\|g_9\|_\infty$: החסם $\|f\|_1\le\|f\|_\infty$ הולך רק בכיוון אחד.
        misconception: MC-c3-one-sided-bound

  - id: Q-3.5-proof-rank
    type: rank
    objectives: [OBJ-3.5-2]
    level: exam
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון. שני השלבים הראשונים בלתי תלויים זה בזה, וכל סדר ביניהם נכון.'
    prompt: >-
      ההוכחה ש"כל נורמה $N$ על $\mathbb{R}^n$ שקולה ל-$\|\cdot\|_2$" התפרקה לשלבים. סדרו אותם.
    items:
      - id: upper
        label: '$$\begin{aligned}N(x)&\le\sum|x_i|N(e_i)\\&\le K\sqrt n\,\|x\|_2\end{aligned}$$ עם $K=\max_iN(e_i)$; לכן $$\begin{aligned}&|N(x)-N(y)|\\&\le N(x-y)\\&\le K\sqrt n\,\|x-y\|_2 ,\end{aligned}$$ ו-$N$ רציפה לפי $\|\cdot\|_2$.'
      - id: sphere
        label: 'הספרה $S=\{\|x\|_2=1\}$ סגורה וחסומה, ולכן קומפקטית לפי היינה-בורל.'
      - id: min
        label: '$N$ מקבלת על $S$ מינימום $m$, ו-$m>0$ כי $N(x)=0$ רק עבור $x=0\notin S$.'
      - id: scale
        label: 'לכל $x\ne0$, $\frac{x}{\|x\|_2}\in S$, ולכן $N(x)\ge m\|x\|_2$. יחד: $$\begin{aligned}m\|x\|_2&\le N(x)\\&\le K\sqrt n\,\|x\|_2 .\end{aligned}$$'
    order: [[upper, sphere], min, scale]
    correctFeedback: >-
      נכון. מהשקילות ל-$\|\cdot\|_2$ נובעת שקילות של כל שתי נורמות על $\mathbb{R}^n$, כי שקילות היא יחס שקילות.
    wrongFeedback: >-
      כדי להפעיל את משפט ויירשטראס על $N$ צריך גם את הרציפות שלה וגם את הקומפקטיות של $S$; ורק עם המינימום ביד
      אפשר להרחיב מ-$S$ לכל $x$ בכפל בסקלר.

  - id: Q-3.5-step-fails
    type: twotier
    objectives: [OBJ-3.5-2, OBJ-3.5-3]
    qualitative: true
    level: mid
    prompt: >-
      מנסים להעתיק את ההוכחה ל-$C[0,1]$: $N(f)=\|f\|_1$ רציפה לפי $\|\cdot\|_\infty$, ו-$S=\{f:\|f\|_\infty=1\}$. האם $N$
      מקבלת על $S$ מינימום חיובי?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. האינפימום הוא 0 והוא לא מתקבל, ולכן אין חסם $\|f\|_\infty\le C\|f\|_1$, וההוכחה נעצרת בדיוק בצעד הזה.
      - text: כן
        feedback: >-
          $x^n\in S$ ו-$\|x^n\|_1=\frac1{n+1}\to0$, כך ש-$\inf_S N=0$; ולכל $f\in S$ מתקיים $\|f\|_1>0$, אז 0 אינו מתקבל.
        misconception: MC-c3-inf-positive
    reasons:
      - text: '$\inf_S N=0$ (לפי $x^n$) ו-$N>0$ בכל נקודה של $S$, ולכן אין מינימום; משפט ויירשטראס אינו חל כי $S$ אינה קומפקטית'
        correct: true
        feedback: >-
          בדיוק. כאן הרציפות של $N$ עדיין מתקיימת ($\|f\|_1\le\|f\|_\infty$), ומה שנשבר הוא הקומפקטיות של הספרה.
      - text: '$\|f\|_1>0$ לכל $f\in S$, ולכן המינימום חיובי'
        feedback: >-
          חיוביות נקודתית לא נותנת אינפימום חיובי: $\|x^n\|_1=\frac1{n+1}$ קטן כרצוננו.
        misconception: MC-c3-inf-positive
      - text: '$S$ סגורה וחסומה, ולכן קומפקטית, ו-$N$ מקבלת עליה מינימום'
        feedback: >-
          סגורה וחסומה אינה קומפקטית ב-$C[0,1]$: לסדרה $x^n\in S$ אין תת-סדרה מתכנסת במידה שווה.
        misconception: MC-c3-closed-bounded-compact

  - id: Q-3.5-functional
    type: twotier
    objectives: [OBJ-3.5-3]
    qualitative: true
    level: mid
    prompt: >-
      $\varphi(f)=f(0)$ הוא פונקציונל לינארי על $C[0,1]$. האם הוא רציף כש-$C[0,1]$ עם נורמת האינטגרל $\|\cdot\|_1$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. אותו $\varphi$ רציף לפי $\|\cdot\|_\infty$ ($|f(0)|\le\|f\|_\infty$), ולא רציף לפי $\|\cdot\|_1$; זה
          אפשרי רק כי הנורמות אינן שקולות.
      - text: כן
        feedback: >-
          יש פונקציות עם נורמת אינטגרל קטנה כרצוננו ו-$f(0)=1$: "שיניים" צרות ליד 0.
        misconception: MC-c3-linear-always-continuous
    reasons:
      - text: '$f_n(x)=\max(1-nx,0)$ מקיימת $\|f_n\|_1=\frac1{2n}\to0$ ו-$\varphi(f_n)=1$, ולכן $\varphi$ אינו חסום'
        correct: true
        feedback: >-
          בדיוק. $f_n\to0$ בנורמה 1, אבל $\varphi(f_n)\not\to\varphi(0)=0$.
      - text: 'כל העתקה לינארית רציפה'
        feedback: >-
          זה נכון כשהתחום ממימד סופי, ו-$C[0,1]$ אינו כזה. כאן הדוגמה הנגדית מפורשת.
        misconception: MC-c3-linear-always-continuous
      - text: '$\varphi$ רציף לפי $\|\cdot\|_\infty$, ולכן לפי כל נורמה'
        feedback: >-
          רציפות עוברת בין נורמות רק כשהן שקולות. $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ על $C[0,1]$ אינן שקולות.
        misconception: MC-c3-all-norms-infinite-dim

  - id: Q-3.5-weird-norm
    type: mc
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: basic
    prompt: >-
      על $\mathbb{R}^2$ נגדיר $N(x)=\max(|x_1|,\ |x_2|,\ |x_1-x_2|)$, והסדרה $(x_k)$ מקיימת $N(x_k)\to0$. מה נכון?
    choices:
      - text: '$\|x_k\|_2\to0$: לפי משפט 3.5.5 יש $m>0$ עם $m\|x\|_2\le N(x)$, ולכן $\|x_k\|_2\le\frac1mN(x_k)$'
        correct: true
        feedback: >-
          נכון. כאן אפשר גם במפורש: $N(x)\ge\|x\|_\infty\ge\frac1{\sqrt2}\|x\|_2$ (דוגמה 1 בשיעור). אבל המשפט מבטיח קבוע
          כזה לכל נורמה על $\mathbb{R}^n$, בלי לחשב.
      - text: 'אי אפשר לדעת בלי לבדוק: $N$ אינה אחת מנורמות $p$, וייתכן שהיא מתכנסת אחרת'
        feedback: >-
          משפט 3.5.5 חל על **כל** נורמה על $\mathbb{R}^n$, משונה ככל שתהיה: אין צורך לבדוק כל נורמה בנפרד.
        misconception: MC-c3-norm-dependent-convergence
      - text: 'מובטח רק שהקואורדינטה הראשונה שואפת ל-0, כי $N$ "רואה" בעיקר אותה'
        feedback: >-
          $N(x)\ge|x_2|$, ולכן גם הקואורדינטה השנייה חסומה ב-$N(x_k)\to0$. ובכלל, נורמה על $\mathbb{R}^n$ אינה יכולה
          להתעלם מכיוון: על הספרה הקומפקטית היא חסומה מלרע במספר חיובי.
        misconception: MC-c3-norm-dependent-convergence
      - text: 'לא בהכרח: כמו $x^k$ ב-$C[0,1]$, שמתכנסת ל-0 בנורמה אחת ולא בשנייה'
        feedback: >-
          זה קורה רק במימד אינסופי (טענה 3.5.8). ב-$\mathbb{R}^2$ כל הנורמות שקולות.
        misconception: MC-c3-all-norms-infinite-dim

  - id: Q-3.5-ball-compact
    type: multi
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: mid
    prompt: >-
      באילו מהמרחבים הנורמיים הבאים כדור היחידה הסגור $B[0,1]$ קומפקטי? סמנו את כולם.
    choices:
      - text: '$\mathbb{R}^4$ עם נורמה כלשהי $N$'
        correct: true
        feedback: >-
          נכון. לפי משפט 3.5.10 (או מסקנה 3.5.6(ד)), במרחב ממימד סופי $B[0,1]$ סגור וחסום ולכן קומפקטי, בכל נורמה.
      - text: '$P_5$, הפולינומים ממעלה לכל היותר 5 על $[0,1]$, עם $\|p\|_1=\int_0^1|p|$'
        correct: true
        feedback: >-
          נכון. $P_5$ ממימד 6 (הבסיס $1,x,\dots,x^5$), ולכן משפט 3.5.10 חל, אף שהנורמה היא נורמת האינטגרל.
      - text: '$B(X)$ עם $\|f\|_\infty=\sup_X|f|$, כש-$X=\{1,2,3\}$'
        correct: true
        feedback: >-
          נכון. פונקציה על $\{1,2,3\}$ היא שלושה מספרים, ו-$B(X)$ הוא $\mathbb{R}^3$ עם $\|\cdot\|_\infty$: ממימד 3.
      - text: '$(C[0,1],\|\cdot\|_1)$'
        feedback: >-
          לא. $s_n=2^{n+1}t_n$, האוהלים מנורמלים, הם וקטורי יחידה עם $\|s_n-s_m\|_1=2$ לכל $n\ne m$, ולכן אין להם
          תת-סדרה מתכנסת (למה 3.1.4).
        misconception: MC-c3-unit-ball-always-compact
      - text: 'הפולינומים $P$, מכל מעלה, על $[0,1]$, עם $\|\cdot\|_\infty$'
        feedback: >-
          לא. $P$ ממימד אינסופי, ולפי משפט 3.5.10 כדור היחידה שלו אינו קומפקטי, אף שהוא סגור וחסום ב-$P$.
        misconception: MC-c3-closed-bounded-compact
      - text: '$C[0,1]$ עם נורמה שנבחרת בחוכמה, כך שכדור היחידה יהיה קומפקטי'
        feedback: >-
          אין נורמה כזו. משפט 3.5.10 חל על **כל** נורמה על מרחב ממימד אינסופי, ו-$C[0,1]$ כזה ($1,x,x^2,\dots$ בלתי
          תלויים).
        misconception: MC-c3-unit-ball-always-compact

  - id: Q-3.5-riesz-closed
    type: twotier
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: exam
    hints: ['חזרו להוכחה של למה 3.5.9 ולטענה 3.5.9א: באיזה שלב נכנסת הסגירות של $W$?']
    prompt: >-
      בלמה של ריס (למה 3.5.9) מניחים ש-$W$ תת-מרחב וקטורי **סגור** של המרחב הנורמי $V$, ו-$W\ne V$. נכון או לא נכון:
      אפשר לוותר על הסגירות, כלומר לכל תת-מרחב וקטורי $W\ne V$ של מרחב נורמי $V$ ולכל $0<\eta<1$ יש $v\in V$
      עם $\|v\|=1$ ו-$\operatorname{dist}(v,W)\ge\eta$.
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. בלי סגירות $W$ יכול להיות צפוף במרחב, ואז כל נקודה נמצאת במרחק $0$ ממנו.
      - text: נכון
        feedback: >-
          בשלב 2 של ההוכחה הסגירות היא שנותנת $\operatorname{dist}(x,W)>0$ ל-$x\notin W$. בלעדיה המרחק יכול להיות $0$
          לכל $x$, וזה קורה: טענה 3.5.9א.
        misconception: MC-c3-riesz-closure
    reasons:
      - text: 'ב-$(C[0,1],\|\cdot\|_1)$ התת-מרחב $W_0=\{f:\ f(0)=0\}$ שונה מכל המרחב, ולכל $g$ הפונקציות $g-g(0)h_n$, עם $h_n(x)=\max(0,1-nx)$, נמצאות ב-$W_0$ ובמרחק $\frac{|g(0)|}{2n}$ מ-$g$; לכן $\operatorname{dist}(g,W_0)=0$ לכל $g$'
        correct: true
        feedback: >-
          בדיוק (טענה 3.5.9א). בפרט אין אף וקטור, יחידה או לא, במרחק חיובי מ-$W_0$. בהוכחה של הלמה נשבר שלב 2:
          $\rho=\operatorname{dist}(x,W_0)=0$, ושלב 3 כבר אינו יכול לבחור $w_0$ עם $\|x-w_0\|<\frac\rho\eta$.
      - text: '$\operatorname{dist}(x,W)=\operatorname{dist}(x,\overline W)$ לכל $x$, ולכן אפשר להפעיל את הלמה על $\overline W$, שהוא סגור, ולקבל את אותו $v$'
        feedback: >-
          השוויון נכון, אבל הלמה דורשת גם $\overline W\ne V$. בדוגמה של $W_0$ בנורמת האינטגרל $\overline{W_0}=C[0,1]$, ואז
          אין מה להפעיל.
        misconception: MC-c3-riesz-closure
      - text: 'כל תת-מרחב וקטורי של מרחב נורמי סגור, ולכן ההנחה ממילא מתקיימת תמיד'
        feedback: >-
          רק תת-מרחב ממימד סופי סגור בכל מרחב נורמי (מסקנה 3.5.6(ג)). $W_0$ אינו סגור ב-$\|\cdot\|_1$, והפולינומים אינם
          סגורים ב-$(C[0,1],\|\cdot\|_\infty)$ (טענה 2.2.10).
        misconception: MC-c3-subspace-always-closed
      - text: 'בהוכחה הסגירות משמשת רק כדי לנרמל את $x-w_0$ לווקטור יחידה, ואת זה אפשר לעשות גם בלעדיה'
        feedback: >-
          הנרמול אינו צריך סגירות, רק $x-w_0\ne0$, וזה נכון כי $x\notin W$. הסגירות נכנסת בשלב 2, כדי ש-$\rho>0$.
        misconception: MC-c3-riesz-closure

  - id: Q-3.5-ball-rank
    type: rank
    objectives: [OBJ-3.5-2]
    level: exam
    hints: ['חזרו להוכחה של משפט 3.5.10, שלבים 2–3.']
    prompt: >-
      סדרו את שלבי ההוכחה של הכיוון הקשה במשפט 3.5.10: אם כדור היחידה הסגור $B[0,1]$ של מרחב נורמי $V$ קומפקטי,
      אז $V$ ממימד סופי.
    help: >-
      סדרו את השלבים מהראשון לאחרון. אחד הפריטים אינו שלב נכון בהוכחה הזו: שימו אותו בסוף הרשימה.
    items:
      - id: riesz
        label: 'הלמה של ריס עם $\eta=\frac12$, על התת-מרחב הסגור $W_k\ne V$, נותנת וקטור יחידה $v_{k+1}$ עם $\operatorname{dist}(v_{k+1},W_k)\ge\frac12$, ובפרט $\|v_{k+1}-v_i\|\ge\frac12$ לכל $i\le k$.'
      - id: hb
        label: 'הכדור $B[0,1]$ סגור וחסום, ולכן לפי היינה-בורל הוא קומפקטי; מכאן הסתירה.'
      - id: contra
        label: 'נוכיח בניסוח השקול: נניח ש-$V$ ממימד אינסופי ונראה ש-$B[0,1]$ אינה קומפקטית. בפרט $V\ne\{0\}$, ובוחרים וקטור יחידה $v_1$.'
      - id: conclude
        label: 'לכן $B[0,1]$ אינה קומפקטית סדרתית, ולכן אינה קומפקטית.'
      - id: closed
        label: 'אחרי שנבחרו וקטורי יחידה $v_1,\dots,v_k$, התת-מרחב $$\begin{aligned}&W_k\\&=\operatorname{span}\{v_1,\dots,v_k\}\end{aligned}$$ ממימד סופי, ולכן סגור ב-$V$; והוא שונה מ-$V$, כי $V$ ממימד אינסופי.'
      - id: separated
        label: 'ברקורסיה מתקבלת סדרה $(v_k)$ בתוך $B[0,1]$ שהמרחק בין כל שני איברים שלה לפחות $\frac12$; לסדרה כזו אין תת-סדרה מתכנסת.'
    order: [contra, closed, riesz, separated, conclude, hb]
    correctFeedback: >-
      נכון. הרעיון: ריס מחליף את האוהלים של $C[0,1]$ בכל מרחב ממימד אינסופי. הסגירות של $W_k$ (מסקנה 3.5.6(ג)) באה
      לפני ריס, כי בלעדיה אי אפשר להפעיל אותו. הפריט על היינה-בורל אינו שלב: היינה-בורל הוא משפט על $\mathbb{R}^n$
      ועל מרחבים ממימד סופי (מסקנה 3.5.6(ד)), ובמימד אינסופי $B[0,1]$ סגור וחסום ואינו קומפקטי, וזה בדיוק מה שהמשפט
      מוכיח.
    wrongFeedback: >-
      הסדר: ניסוח שקול ובחירת $v_1$; הסגירות של $W_k$; ריס; הסדרה המופרדת (למה 3.1.4); המסקנה (משפט 3.2.10). כל שלב
      משתמש רק בעצמים שהוגדרו לפניו. "סגור וחסום ולכן קומפקטי" נכשל במימד אינסופי, ולכן הוא בסוף.

  - id: Q-3.5-scaling-num
    type: numeric
    objectives: [OBJ-3.5-1]
    level: exam
    hints: ['השוו לשלב 4 בהוכחה של טענה 3.5.3, (ii)⇒(i).']
    prompt: >-
      יהיו $\|\cdot\|_a,\|\cdot\|_b$ נורמות על מרחב וקטורי ממשי $V\ne\{0\}$, ונתון רק זה: לכל $v\in V$, אם
      $\|v\|_a<\frac14$ אז $\|v\|_b<1$. מהו הקבוע **הקטן ביותר** $C$ שהמידע הזה לבדו מבטיח? כלומר, הקטן ביותר כך שכל
      זוג נורמות, על כל מרחב, שמקיים את הגרירה, מקיים גם $\|v\|_b\le C\|v\|_a$ לכל $v$.
    answer: 4
    tolerance: 0.001
    correctFeedback: >-
      נכון. יהי $v\ne0$ ו-$0<t<\frac14$. הווקטור $w=\frac{t}{\|v\|_a}\,v$ מקיים לפי (N2) $\|w\|_a=t<\frac14$, ולכן
      $\|w\|_b<1$, כלומר $\|v\|_b<\frac1t\|v\|_a$. זה נכון לכל $t<\frac14$, ולכן $\|v\|_b\le\inf_{t<1/4}\frac1t\|v\|_a=4\|v\|_a$.
      ואי אפשר פחות: על $V=\mathbb{R}$ עם $\|v\|_a=|v|$ ו-$\|v\|_b=4|v|$ הגרירה מתקיימת, ו-$\|v\|_b=4\|v\|_a$ לכל $v$.
    wrongFeedback: >-
      כווצו וקטור $v\ne0$ לנורמה $t<\frac14$ בנורמה $a$, הפעילו את הגרירה, והחזירו את הגורם בעזרת (N2). אחר כך
      השאיפו $t\to\frac14$, וחפשו זוג נורמות שבו יש שוויון.
    commonWrong:
      - value: 8
        feedback: >-
          $8=\frac2\delta$ עם $\delta=\frac14$: זה הקבוע של שלב 4 בטענה 3.5.3, שם כיווצנו ל-$\frac\delta2$ כדי להישאר
          בכדור הפתוח. הוא עובד, אבל אינו הקטן ביותר: אפשר לכווץ לכל $t<\delta$, ובגבול $t\to\delta$ מקבלים $\frac1\delta$.
        misconception: MC-c3-best-constant
      - value: 0.25
        feedback: >-
          $\frac14$ הוא הרדיוס $\delta$ עצמו, לא הקבוע. וקטור עם $\|v\|_a$ קרוב ל-$\frac14$ יכול להיות עם $\|v\|_b$ קרוב
          ל-$1$, כלומר עם יחס $\frac{\|v\|_b}{\|v\|_a}$ קרוב ל-$4$.
        misconception: MC-c3-best-constant

  - id: Q-3.5-ev0-p1
    type: numeric
    objectives: [OBJ-3.5-3]
    level: exam
    hints: ['מסקנה 3.5.7 אומרת שהקבוע קיים; את ערכו מחשבים בכלים של אינפי 1. ראו גם דוגמה 2 בשיעור.']
    prompt: >-
      יהי $P_1=\{p(x)=a+bx:\ a,b\in\mathbb{R}\}$, הפולינומים ממעלה לכל היותר 1 על $[0,1]$, עם נורמת האינטגרל
      $\|p\|_1=\int_0^1|p|$, ו-$\operatorname{ev}_0(p)=p(0)$. לפי מסקנה 3.5.7 $\operatorname{ev}_0$ חסום. חשבו את
      נורמת האופרטור שלו, כלומר את $\sup_{p\ne0}\frac{|p(0)|}{\|p\|_1}$, עד שלוש ספרות אחרי הנקודה.
    answer: 2.414213562
    tolerance: 0.001
    correctFeedback: >-
      נכון: $1+\sqrt2\approx2.414$. אם $p(0)=0$ היחס $0$; אחרת לפי (N2) אפשר להניח $p(0)=1$, כלומר $p=1+bx$, וצריך את
      $\min_b\int_0^1|1+bx|\,dx$. כש-$b\ge-1$, $1+bx\ge0$ על $[0,1]$ והאינטגרל $1+\frac b2\ge\frac12$. כש-$b=-c$
      עם $c>1$, השורש $\frac1c$ בתוך הקטע, והאינטגרל $\frac1{2c}+\big(\frac c2+\frac1{2c}-1\big)=\frac1c+\frac c2-1$;
      הנגזרת $-\frac1{c^2}+\frac12$ מתאפסת ב-$c=\sqrt2$, והערך שם $\sqrt2-1<\frac12$. לכן הנורמה
      $\frac1{\sqrt2-1}=\sqrt2+1$, ומתקבלת ב-$p=1-\sqrt2\,x$.
    wrongFeedback: >-
      לפי (N2) מספיק לבדוק פולינומים עם $p(0)=1$, כלומר $p=1+bx$. מזערו את $\int_0^1|1+bx|\,dx$, ופצלו את האינטגרל
      בשורש $-\frac1b$ כשהוא בתוך הקטע.
    commonWrong:
      - value: 2
        feedback: >-
          זה היחס של $p=1-2x$, שבו $\|p\|_1=\frac12$. שורש באמצע הקטע אינו המיטבי: עם $p=1-\sqrt2\,x$ האינטגרל
          $\sqrt2-1\approx0.414$, קטן יותר. פולינום אחד נותן חסם תחתון לנורמה, לא את הנורמה.
        misconception: MC-c3-best-constant
      - value: 1
        feedback: >-
          זה היחס של הקבוע $p=1$. פולינום שחוצה את $0$ מבטל חלק מהשטח בלי לשנות את $p(0)$, ולכן נותן יחס גדול יותר.
        misconception: MC-c3-best-constant
