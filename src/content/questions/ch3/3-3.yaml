# Lesson 3.3 — total boundedness.
# Objectives (src/course.ts):
#   OBJ-3.3-1  define a totally bounded set and tell it apart from a bounded set
#   OBJ-3.3-2  prove that a metric space is compact iff it is complete and totally bounded
#   OBJ-3.3-3  decide whether sets in spaces of functions are totally bounded
# An ε-net is a finite subset F of K with K ⊆ ∪_{y∈F} B(y,ε) (open balls, points of F in K).
chapter: 3
questions:
  - id: Q-3.3-def
    type: mc
    objectives: [OBJ-3.3-1]
    qualitative: true
    level: basic
    prompt: >-
      מהי ההגדרה של "$K$ חסומה כליל"?
    choices:
      - text: 'לכל $\varepsilon>0$ יש קבוצה סופית $F\subseteq K$ כך ש-$K\subseteq\bigcup_{y\in F}B(y,\varepsilon)$'
        correct: true
        feedback: >-
          נכון: לכל $\varepsilon$ יש $\varepsilon$-רשת סופית. ככל ש-$\varepsilon$ קטן הרשת גדלה, אבל תמיד נשארת סופית.
      - text: 'יש $\varepsilon>0$ וקבוצה סופית $F\subseteq K$ כך ש-$K\subseteq\bigcup_{y\in F}B(y,\varepsilon)$'
        feedback: >-
          עם $\varepsilon$ אחד זו בסך הכול חסימות: ב-$\mathbb{N}$ עם המטריקה הבדידה $F=\{1\}$ ו-$\varepsilon=2$
          מתאימים, ובכל זאת אין $\frac12$-רשת סופית.
        misconception: MC-c3-net-some-eps
      - text: 'יש כדור $B(p,R)$ שמכיל את $K$'
        feedback: >-
          זו ההגדרה של חסומה. חסומה כליל חזקה ממנה: בכדור היחידה של $(C[0,1],\|\cdot\|_\infty)$ יש אינסוף פונקציות
          אוהל במרחק 1 זו מזו, ולכן אין לו $\frac12$-רשת סופית.
        misconception: MC-c3-bounded-totally-bounded
      - text: 'לכל סדרה ב-$K$ יש תת-סדרה שמתכנסת לנקודה של $K$'
        feedback: >-
          זו קומפקטיות, והיא חזקה יותר: $(0,1)$ חסומה כליל ואינה קומפקטית.
        misconception: MC-c3-totally-bounded-compact

  - id: Q-3.3-net-count
    type: numeric
    objectives: [OBJ-3.3-1]
    level: basic
    prompt: >-
      בקטע $[0,3]$ עם $d(x,y)=|x-y|$: מהו המספר **הקטן ביותר** של נקודות ב-$\varepsilon$-רשת עבור
      $\varepsilon=0.25$? (נקודות הרשת ב-$[0,3]$, והכדורים פתוחים.)
    answer: 7
    tolerance: 0.001
    correctFeedback: >-
      נכון. שבע נקודות מספיקות: $\frac{3}{14},\frac{9}{14},\dots,\frac{39}{14}$, במרווחים של $\frac37$; כל נקודה של
      $[0,3]$ במרחק לכל היותר $\frac{3}{14}<0.25$ מאחת מהן. שש לא מספיקות: הנקודות $0,\ 0.5,\ 1,\ 1.5,\ 2,\ 2.5,\ 3$
      רחוקות זו מזו לפחות $0.5$, וכדור ברדיוס $0.25$ מכיל לכל היותר אחת מהן (למה 3.3.3א(א)).
    wrongFeedback: >-
      כל כדור $B(y,0.25)$ הוא קטע פתוח באורך $0.5$. כמה קטעים פתוחים כאלה צריך כדי לכסות קטע **סגור** באורך 3?
    commonWrong:
      - value: 6
        feedback: >-
          $6\cdot0.5=3$, אבל קטעים פתוחים לא מכילים את הקצוות שלהם: שישה קטעים פתוחים באורך $0.5$ צמודים זה לזה
          משאירים את נקודות המגע לא מכוסות. שבע הנקודות $0,0.5,\dots,3$ מראות שצריך שבע.
        misconception: MC-c3-endpoint-in-open

  - id: Q-3.3-discrete
    type: twotier
    objectives: [OBJ-3.3-1]
    qualitative: true
    level: basic
    prompt: >-
      $\mathbb{N}$ עם המטריקה הבדידה הוא מרחב חסום. האם הוא חסום כליל?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. זו הדוגמה הפשוטה ביותר לקבוצה חסומה שאינה חסומה כליל.
      - text: כן
        feedback: >-
          חסימות לא מספיקה. עבור $\varepsilon=\frac12$ כל כדור הוא נקודה אחת, ומספר סופי של נקודות לא מכסה את
          $\mathbb{N}$.
        misconception: MC-c3-bounded-totally-bounded
    reasons:
      - text: 'עבור $\varepsilon=\frac12$: $B(n,\frac12)=\{n\}$, ולכן כל $\frac12$-רשת היא $\mathbb{N}$ כולו, שאינו סופי'
        correct: true
        feedback: >-
          בדיוק. מספיק $\varepsilon$ אחד שאין לו רשת סופית; זו השלילה של "לכל $\varepsilon$".
      - text: 'הנקודה $1$ לבדה היא $2$-רשת, כי כל המרחקים לכל היותר 1'
        feedback: >-
          נכון ש-$\{1\}$ היא $2$-רשת, אבל זה מראה רק חסימות. ההגדרה דורשת רשת סופית **לכל** $\varepsilon$.
        misconception: MC-c3-net-some-eps
      - text: '$\mathbb{N}$ אינו חסום, ולכן אינו חסום כליל'
        feedback: >-
          במטריקה הבדידה $\mathbb{N}$ חסום: כל המרחקים 0 או 1. הסיבה היא שהכדורים הקטנים הם נקודות בודדות.
        misconception: MC-c3-usual-metric-habit

  - id: Q-3.3-tb-bounded
    type: twotier
    objectives: [OBJ-3.3-1]
    qualitative: true
    level: mid
    prompt: >-
      נכון או לא נכון: בכל מרחב מטרי, קבוצה חסומה כליל היא חסומה.
    choices:
      - text: נכון
        correct: true
        feedback: 'נכון. רשת סופית אחת, עבור $\varepsilon=1$, כבר נותנת חסם.'
      - text: לא נכון
        feedback: >-
          הכיוון הזה תמיד נכון: מספר סופי של כדורים ברדיוס 1 מוכל בכדור אחד גדול. הכיוון ההפוך הוא שנכשל.
        misconception: MC-c3-bounded-totally-bounded
    reasons:
      - text: 'ניקח $1$-רשת $x_1,\dots,x_m$. לכל $x\in K$ יש $i$ עם $d(x,x_i)<1$, ולכן $d(x,x_1)<1+\max_i d(x_i,x_1)$'
        correct: true
        feedback: >-
          בדיוק: אי-שוויון המשולש, ומקסימום של מספר סופי של מרחקים.
      - text: 'חסומה וחסומה כליל הן אותו מושג'
        feedback: >-
          לא: $\mathbb{N}$ עם המטריקה הבדידה חסום ואינו חסום כליל. רק הכיוון "חסומה כליל גורר חסומה" נכון.
        misconception: MC-c3-bounded-totally-bounded
      - text: 'קבוצה חסומה כליל קומפקטית, וקבוצה קומפקטית חסומה'
        feedback: >-
          הצעד הראשון שגוי: $(0,1)$ חסומה כליל ואינה קומפקטית. צריך גם שלמות.
        misconception: MC-c3-totally-bounded-compact

  - id: Q-3.3-rn
    type: mc
    objectives: [OBJ-3.3-1]
    level: mid
    prompt: >-
      מה נכון לגבי קבוצה $K\subseteq\mathbb{R}^k$ עם המטריקה האוקלידית?
    choices:
      - text: '$K$ חסומה כליל אם ורק אם היא חסומה'
        correct: true
        feedback: >-
          נכון. קבוצה חסומה מוכלת בקובייה $[-M,M]^k$; מחלקים אותה לקוביות קטנות בקוטר קטן מ-$\varepsilon$ ובוחרים
          נקודה אחת של $K$ מכל קובייה קטנה שפוגשת את $K$. כך מתקבלת $\varepsilon$-רשת סופית.
      - text: '$K$ חסומה כליל אם ורק אם היא קומפקטית'
        feedback: >-
          $(0,1)\subseteq\mathbb{R}$ חסומה כליל ואינה קומפקטית. במרחב האוקלידי חסומה כליל פירושו רק חסומה.
        misconception: MC-c3-totally-bounded-compact
      - text: '$K$ חסומה כליל אם ורק אם היא סגורה וחסומה'
        feedback: >-
          סגירות לא נדרשת: $(0,1)$ חסומה כליל ואינה סגורה. הסגירות (יחד עם השלמות של $\mathbb{R}^k$) היא מה שמוסיף
          קומפקטיות.
        misconception: MC-c3-holes-not-tb
      - text: 'אף קבוצה אינסופית ב-$\mathbb{R}^k$ אינה חסומה כליל'
        feedback: >-
          $[0,1]$ אינסופית וחסומה כליל: הנקודות $0,\frac1k,\dots,1$ הן $\varepsilon$-רשת לכל $\varepsilon>\frac1{2k}$.
        misconception: MC-c3-ambient-dimension

  - id: Q-3.3-open-interval
    type: twotier
    objectives: [OBJ-3.3-2]
    qualitative: true
    level: mid
    prompt: >-
      $(0,1)$ עם $d(x,y)=|x-y|$ חסום כליל. האם הוא קומפקטי?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. חסימות כליל היא רק חצי מהתנאי; החצי השני, שלמות, נכשל.
      - text: כן
        feedback: >-
          לסדרה $\frac1{n+1}$ ב-$(0,1)$ אין תת-סדרה שמתכנסת לנקודה של $(0,1)$. חסימות כליל לבדה לא מספיקה.
        misconception: MC-c3-totally-bounded-compact
    reasons:
      - text: 'הוא אינו שלם: $\frac1{n+1}$ היא סדרת קושי בלי גבול ב-$(0,1)$; ומרחב קומפקטי הוא שלם'
        correct: true
        feedback: >-
          בדיוק. במשפט "קומפקטי אם ורק אם שלם וחסום כליל" כאן נכשלת השלמות.
      - text: 'הוא אינו חסום כליל, כי חסרות בו נקודות הקצה'
        feedback: >-
          הוא חסום כליל: הנקודות $\frac1{2k},\frac3{2k},\dots,\frac{2k-1}{2k}$ הן $\varepsilon$-רשת לכל
          $\varepsilon>\frac1{2k}$. נקודות הקצה החסרות פוגעות בשלמות.
        misconception: MC-c3-holes-not-tb
      - text: 'הוא קבוצה פתוחה, וקבוצה פתוחה אינה קומפקטית'
        feedback: >-
          כמרחב בפני עצמו $(0,1)$ גם פתוח וגם סגור, כמו כל מרחב. הנימוק צריך להיות על התכונות הפנימיות שלו.
        misconception: MC-c3-closed-in-itself

  - id: Q-3.3-which-fails
    type: multi
    objectives: [OBJ-3.3-2]
    level: mid
    prompt: >-
      אילו מהמרחבים הבאים **שלמים אבל אינם חסומים כליל**? סמנו את כולם.
    choices:
      - text: '$\mathbb{R}$ עם $|x-y|$'
        correct: true
        feedback: >-
          נכון. שלם (שיעור 2.1), ולא חסום בכלל, ולכן לא חסום כליל.
      - text: '$\mathbb{N}$ עם המטריקה הבדידה'
        correct: true
        feedback: >-
          נכון. סדרת קושי במטריקה הבדידה קבועה החל ממקום מסוים (קחו $\varepsilon=\frac12$), ולכן מתכנסת: המרחב שלם.
          והוא חסום ולא חסום כליל.
      - text: 'כדור היחידה הסגור של $(C[0,1],\|\cdot\|_\infty)$'
        correct: true
        feedback: >-
          נכון. קבוצה סגורה במרחב שלם (שיעור 2.2), ולכן שלמה; ופונקציות האוהל במרחק 1 זו מזו מונעות $\frac12$-רשת
          סופית.
      - text: '$\mathbb{Q}\cap[0,1]$ עם $|x-y|$'
        feedback: >-
          להפך: היא חסומה כליל (הנקודות $\frac jk$ רציונליות) ואינה שלמה (סדרה רציונלית ששואפת ל-$\frac{\sqrt2}2$).
        misconception: MC-c3-holes-not-tb
      - text: '$(0,1)$ עם $|x-y|$'
        feedback: >-
          להפך: חסומה כליל ואינה שלמה ($\frac1{n+1}$ היא סדרת קושי בלי גבול בה).
        misconception: MC-c3-holes-not-tb
    explanation: >-
      בכל אחת מהדוגמאות נכשל בדיוק חצי אחד של "שלם וחסום כליל", ולכן אף אחת מהן אינה קומפקטית. שתי התכונות בלתי
      תלויות, וצריך את שתיהן.

  - id: Q-3.3-xn
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: mid
    prompt: >-
      האם הקבוצה $S=\{x^n: n\in\mathbb{N}\}$ חסומה כליל ב-$(C[0,1],\|\cdot\|_\infty)$?
    choices:
      - text: לא
        correct: true
        feedback: >-
          נכון. יש ב-$S$ אינסוף פונקציות שרחוקות זו מזו לפחות $\frac14$.
      - text: כן
        feedback: >-
          כל האיברים בנורמה 1, אבל הם לא מתקבצים: $\|x^n-x^m\|_\infty\ge\frac14$ לכל $m\ge2n$.
        misconception: MC-c3-bounded-totally-bounded
    reasons:
      - text: 'אם $m\ge2n$, בנקודה $x=2^{-1/n}$ מתקיים $x^n-x^m\ge\frac12-\frac14$. לכן הפונקציות $x^{2^k}$ רחוקות זו מזו לפחות $\frac14$, וכדור ברדיוס $\frac18$ מכיל לכל היותר אחת מהן: אין $\frac18$-רשת סופית'
        correct: true
        feedback: >-
          בדיוק. אינסוף נקודות שהמרחקים ביניהן חסומים מלרע הן מה ששובר חסימות כליל.
      - text: 'כל הפונקציות ב-$S$ בנורמה 1, ולכן $S$ חסומה כליל'
        feedback: >-
          זו חסימות בלבד. חסימות כליל דורשת כיסוי בכדורים קטנים כרצוננו, ובכדורים ברדיוס $\frac18$ זה בלתי אפשרי.
        misconception: MC-c3-bounded-totally-bounded
      - text: '$x^n\to0$ בכל נקודה של $[0,1)$, ולכן הפונקציות מתקרבות זו לזו'
        feedback: >-
          ההתקרבות היא נקודתית. במרחק הסופרמום $\|x^n-x^{2n}\|_\infty=\frac14$ לכל $n$.
        misconception: MC-c3-pointwise-is-enough

  - id: Q-3.3-linear-family
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: mid
    prompt: >-
      האם הקבוצה $A=\{a+bx:\ |a|\le1,\ |b|\le1\}$ חסומה כליל ב-$(C[0,1],\|\cdot\|_\infty)$?
    choices:
      - text: כן
        correct: true
        feedback: >-
          נכון. אף ש-$C[0,1]$ ממימד אינסופי, $A$ "חיה" בשני פרמטרים, ושם מספיקה רשת סופית של פרמטרים.
      - text: לא
        feedback: >-
          המימד של המרחב שמסביב לא קובע. $A$ תלויה בשני פרמטרים חסומים, וכל פונקציה בה קרובה לאחת מרשת סופית.
        misconception: MC-c3-ambient-dimension
    reasons:
      - text: 'לכל $x\in[0,1]$: $$\begin{aligned}&|(a+bx)-(a''+b''x)|\\&\quad\le|a-a''|+|b-b''| .\end{aligned}$$ רשת סופית של זוגות $(a,b)$ בצעד $\frac\varepsilon2$ נותנת $\varepsilon$-רשת של $A$'
        correct: true
        feedback: >-
          בדיוק. כל $a$ במרחק לכל היותר $\frac\varepsilon4$ מערך ברשת, וכך גם $b$, ולכן המרחק בנורמת הסופרמום לכל
          היותר $\frac\varepsilon2<\varepsilon$.
      - text: '$A$ חסומה (כל איבר בנורמה לכל היותר 2), ולכן חסומה כליל'
        feedback: >-
          המסקנה נכונה, אבל לא מהסיבה הזו: גם כדור היחידה של $C[0,1]$ חסום, ואינו חסום כליל.
        misconception: MC-c3-bounded-totally-bounded
      - text: '$C[0,1]$ ממימד אינסופי, ולכן אף קבוצה אינסופית בו אינה חסומה כליל'
        feedback: >-
          זה לא נכון: $A$ עצמה היא דוגמה נגדית. מה שקובע הוא הקבוצה, לא המרחב.
        misconception: MC-c3-ambient-dimension

  - id: Q-3.3-proof-rank
    type: rank
    objectives: [OBJ-3.3-2]
    level: exam
    help: 'סדרו את שלבי ההוכחה לפי הסדר הנכון. אחד הפריטים אינו שלב נכון של ההוכחה: שימו אותו אחרון.'
    prompt: >-
      ההוכחה ש"מרחב מטרי $(X,d)$ שלם וחסום כליל הוא קומפקטי סדרתית" התפרקה לשלבים, ונוסף אליהם פריט אחד שגוי.
      סדרו את השלבים, והפריט השגוי בסוף.
    items:
      - id: diag
        label: 'בוחרים אינדקסים עולים, אחד מכל קבוצת אינדקסים ברשימה היורדת, כך שהאינדקס במקום ה-$j$ שייך לקבוצה ה-$j$.'
      - id: limit
        label: 'לסדרת קושי במרחב שלם יש גבול במרחב, ולכן לסדרה הנתונה יש תת-סדרה מתכנסת.'
      - id: wrong
        label: 'השלמות של המרחב נותנת לסדרה הנתונה תת-סדרת קושי.'
      - id: nest
        label: 'לכל $j\in\mathbb{N}$ יש רשת סופית ברדיוס $\frac1j$. איחוד סופי של קבוצות סופיות סופי, ולכן בונים ברקורסיה רשימה יורדת של קבוצות אינדקסים אינסופיות, כך שלכל $j$ כל איברי הסדרה עם אינדקס בקבוצה ה-$j$ נמצאים בכדור אחד ברדיוס $\frac1j$.'
      - id: cauchy
        label: 'מהמקום ה-$j$ והלאה, כל איברי תת-הסדרה שנבחרה נמצאים בכדור אחד ברדיוס $\frac1j$, ולכן רחוקים זה מזה פחות מ-$\frac2j$; כיוון שזה נכון לכל $j$, היא סדרת קושי.'
      - id: start
        label: 'תהי $(x_n)$ סדרה כלשהי של נקודות של המרחב.'
    order: [start, nest, diag, cauchy, limit, wrong]
    correctFeedback: >-
      נכון. חסימות כליל מייצרת תת-סדרת קושי (בחירה אלכסונית, משפט 3.3.7), והשלמות הופכת אותה לתת-סדרה מתכנסת. הפריט
      השגוי מחליף את התפקידים: שלמות לא נותנת תת-סדרת קושי (ב-$\mathbb{R}$ השלם, לסדרה $x_n=n$ אין כזו); היא רק
      נותנת גבול לסדרה שכבר היא סדרת קושי.
    wrongFeedback: >-
      שאלו את עצמכם איזו הנחה כל שלב צורך. חסימות כליל נכנסת בבניית קבוצות האינדקסים; מהן בוחרים תת-סדרה באלכסון,
      מראים שהיא קושי, ורק בסוף משתמשים בשלמות כדי לקבל גבול. ושלמות לבדה אינה נותנת תת-סדרת קושי: ב-$\mathbb{R}$
      לסדרה $x_n=n$ אין כזו.

  - id: Q-3.3-cx2-net
    type: numeric
    objectives: [OBJ-3.3-3]
    level: mid
    prompt: >-
      במרחב $(C[0,2],\|\cdot\|_\infty)$ נתבונן ב-$S=\{c\,x^2:\ c\in[0,1]\}$. מהו המספר **הקטן ביותר** של נקודות
      ב-$\varepsilon$-רשת של $S$ עבור $\varepsilon=1$? (נקודות הרשת ב-$S$, כדורים פתוחים.)
    answer: 3
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\|cx^2-c'x^2\|_\infty=\max_{[0,2]}|c-c'|x^2=4|c-c'|$, ולכן $S$ נראה כמו הקטע $[0,4]$. שלוש נקודות
      מספיקות ($c=0.225,\ 0.5,\ 0.775$, כלומר $0.9,\ 2,\ 3.1$ בקטע $[0,4]$), ושתיים לא: $c=0,\ \frac12,\ 1$ רחוקות זו
      מזו לפחות 2, וכדור ברדיוס 1 מכיל לכל היותר אחת מהן.
    wrongFeedback: >-
      חשבו קודם את $\|cx^2-c'x^2\|_\infty$ על הקטע $[0,2]$. המרחב $S$ הוא אז עותק של קטע; כמה קטעים פתוחים
      ברדיוס 1 מכסים אותו?
    commonWrong:
      - value: 2
        feedback: >-
          שני קטעים פתוחים באורך 2 לא מכסים קטע סגור באורך 4: נקודת המגע ביניהם נשארת בחוץ.
        misconception: MC-c3-endpoint-in-open
      - value: 1
        feedback: >-
          זה מה שיוצא אם מחשבים את הסופרמום על $[0,1]$, שם $\|cx^2-c'x^2\|=|c-c'|$. המרחב הוא $C[0,2]$, והמקסימום
          של $x^2$ בו הוא 4.
        misconception: MC-c3-usual-metric-habit

  - id: Q-3.3-lip-union
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: mid
    prompt: >-
      ב-$(C[0,1],\|\cdot\|_\infty)$, לכל $M\in\mathbb{N}$ תהי $L_M$ קבוצת הפונקציות $f$ עם $f(0)=0$ ו-$|f(x)-f(y)|\le M|x-y|$
      לכל $x,y$. כל $L_M$ חסומה כליל. תהי $E$ קבוצת הפונקציות $f$ עם $\|f\|_\infty\le1$ ששייכות ל-$L_M$ עבור $M$
      **כלשהו** (שתלוי ב-$f$). נכון או לא נכון: $E$ חסומה כליל.
    choices:
      - text: לא נכון
        correct: true
        feedback: >-
          נכון. כל פונקציה ב-$E$ ליפשיצית, אבל אין קבוע **אחד** לכולן, ובלעדיו נכנסות ל-$E$ פונקציות שמתרוממות מהר
          כרצוננו.
      - text: נכון
        feedback: >-
          איחוד של מספר סופי של קבוצות חסומות כליל חסום כליל, אבל כאן האיחוד אינסופי. פונקציות האוהל $t_n$ נמצאות כולן
          ב-$E$ ורחוקות 1 זו מזו.
        misconception: MC-c3-countable-union-tb
    reasons:
      - text: 'האוהל $t_n$ מקיים $t_n(0)=0$ ו-$\|t_n\|_\infty=1$, והוא ליפשיצי עם קבוע $2^{n+1}$, ולכן $t_n\in E$; ו-$\|t_n-t_m\|_\infty=1$ ל-$n\ne m$. ב-$E$ יש קבוצה $1$-מופרדת אינסופית'
        correct: true
        feedback: >-
          בדיוק. קבוצה מופרדת אינסופית שוללת חסימות כליל (למה 3.3.3א), וכל אוהל נכנס ל-$L_M$ אחר.
      - text: 'כל $L_M$ חסומה כליל, ואיחוד של קבוצות חסומות כליל חסום כליל'
        feedback: >-
          טענה 3.3.5(ג) מדברת רק על מספר **סופי** של קבוצות. $\mathbb{N}\subseteq\mathbb{R}$ הוא איחוד של יחידונים, וכל
          יחידון חסום כליל.
        misconception: MC-c3-countable-union-tb
      - text: '$C[0,1]$ ממימד אינסופי, ולכן אף קבוצה אינסופית בו אינה חסומה כליל'
        feedback: >-
          המסקנה כאן נכונה, אבל הנימוק שגוי: $L_1$ אינסופית וחסומה כליל (טענה 3.3.10(א)).
        misconception: MC-c3-ambient-dimension
      - text: '$E$ אינה חסומה, כי $M$ אינו חסום'
        feedback: >-
          $E$ מוכלת בכדור היחידה, ולכן חסומה. מה שנכשל הוא חסימות **כליל**: אינסוף נקודות במרחק 1 זו מזו בתוך כדור אחד.
        misconception: MC-c3-bounded-totally-bounded

  - id: Q-3.3-square-image
    type: twotier
    objectives: [OBJ-3.3-3]
    qualitative: true
    level: exam
    prompt: >-
      ב-$(C[0,1],d_\infty)$ תהי $A$ קבוצה חסומה כליל, ונגדיר $A^2=\{f^2:\ f\in A\}$. ההעתקה $\Phi(f)=f^2$ של
      $C[0,1]$ לעצמו רציפה, אבל **אינה** רציפה במידה שווה: המרחק בין הפונקציות הקבועות $n\mathbf{1}$ ו-$(n+\frac1n)\mathbf{1}$
      הוא $\frac1n$, והמרחק בין הריבועים שלהן הוא $2+\frac1{n^2}$. נכון או לא נכון: $A^2$ חסומה כליל.
    choices:
      - text: נכון
        correct: true
        feedback: >-
          נכון. טענה 3.3.5(ד) נותנת תנאי מספיק, לא הכרחי; כאן מספיק ש-$\Phi$ מתנהגת יפה **על $A$**, לא על כל
          $C[0,1]$.
      - text: לא נכון
        feedback: >-
          טענה 3.3.5(ד) אומרת מה קורה כש-$f$ רציפה במידה שווה, ושום דבר כשלא. $A$ חסומה, ועל קבוצה חסומה $\Phi$
          ליפשיצית.
        misconception: MC-c3-uniform-needed
    reasons:
      - text: '$A$ חסומה (טענה 3.3.4): יש $M$ עם $\|f\|_\infty\le M$ לכל $f\in A$. לכל $f,g\in A$: $$\begin{aligned}&\|f^2-g^2\|_\infty\\&\quad\le\|f+g\|_\infty\|f-g\|_\infty\\&\quad\le2M\|f-g\|_\infty .\end{aligned}$$ לכן הצמצום של $\Phi$ למרחב $(A,d_\infty)$ ליפשיצי, ובפרט רציף במידה שווה, ולפי טענות 3.3.2ב ו-3.3.5(ד) $A^2=\Phi(A)$ חסומה כליל'
        correct: true
        feedback: >-
          בדיוק. ויש דרך שנייה: $C[0,1]$ שלם, ולכן לכל סדרה $(f_n)$ ב-$A$ יש תת-סדרת קושי (משפט 3.3.7) שמתכנסת לאיזו
          $g\in C[0,1]$; $\Phi$ רציפה, ולכן $f_{n_k}^2\to g^2$, ובפרט $(f_{n_k}^2)$ סדרת קושי. לפי משפט 3.3.7 שוב,
          $A^2$ חסומה כליל. בשתי הדרכים אין צורך ברציפות במידה שווה על כל המרחב.
      - text: '$\Phi$ אינה רציפה במידה שווה, ולכן לפי טענה 3.3.5(ד) התמונה $A^2$ אינה חסומה כליל'
        feedback: >-
          זו הפיכה של תנאי מספיק. טענה 3.3.5(ד) לא אומרת דבר על פונקציות שאינן רציפות במידה שווה, והתמונה כאן כן
          חסומה כליל.
        misconception: MC-c3-uniform-needed
      - text: '$\Phi$ רציפה, ופונקציה רציפה מעבירה כל קבוצה חסומה כליל לקבוצה חסומה כליל'
        feedback: >-
          המסקנה נכונה כאן, אבל הכלל שגוי: $\frac1x$ רציפה על $(0,1]$, שחסום כליל, והתמונה $[1,\infty)$ אינה חסומה.
          מה שעובד כאן הוא ש-$A$ חסומה (או ש-$C[0,1]$ שלם).
        misconception: MC-c3-continuous-image-tb
      - text: '$\|f^2\|_\infty\le M^2$ לכל $f\in A$, כלומר $A^2$ חסומה, ולכן חסומה כליל'
        feedback: >-
          חסומה אינה מספיקה ב-$C[0,1]$: כדור היחידה הסגור $B[\theta,1]$ חסום ואינו חסום כליל (טענה 3.3.4(ב)).
        misconception: MC-c3-bounded-totally-bounded

  - id: Q-3.3-arctan-min
    type: numeric
    objectives: [OBJ-3.3-1]
    level: exam
    prompt: >-
      על $\mathbb{R}$ נתבונן במטריקה $\rho(x,y)=|\arctan x-\arctan y|$ (טענה 3.3.5(ה)). מהו המספר **הקטן ביותר** של
      נקודות ב-$0.1$-רשת של המרחב $(\mathbb{R},\rho)$? (נקודות הרשת ב-$\mathbb{R}$, והכדורים פתוחים ב-$\rho$.)
    answer: 16
    tolerance: 0.001
    correctFeedback: >-
      נכון. $\arctan$ מעבירה את $(\mathbb{R},\rho)$ על הקטע הפתוח $(-\frac\pi2,\frac\pi2)$ עם $|s-t|$ ושומרת על מרחקים,
      ולכן השאלה היא על רשת של קטע פתוח באורך $\pi$. $16$ נקודות מספיקות: $x_i=\tan\alpha_i$ עם
      $\alpha_i=-\frac\pi2+(i-\frac12)\frac\pi{16}$, $i=1,\dots,16$; כל זווית בקטע במרחק לכל היותר
      $\frac\pi{32}\approx0.098<0.1$ מאחת מהן. $15$ לא מספיקות: הזוויות $-\frac\pi2+0.07+0.2i$, $i=0,\dots,15$, בתוך
      הקטע (הגדולה שבהן $-\frac\pi2+3.07<\frac\pi2$) ורחוקות זו מזו לפחות $0.2$; ה-$\tan$ שלהן הן $16$ נקודות של
      $\mathbb{R}$, $0.2$-מופרדות ב-$\rho$, ולפי למה 3.3.3א(א) כל $0.1$-רשת מכילה לפחות $16$ נקודות.
    wrongFeedback: >-
      העבירו את הבעיה דרך $\arctan$: מהו $\rho(x,y)$ במונחי $\arctan x$ ו-$\arctan y$? לאיזה קטע עובר $\mathbb{R}$,
      ומה אורכו? משם, טענה 3.3.3ב ולמה 3.3.3א(א).
    commonWrong:
      - value: 31
        feedback: >-
          זו הרשת שבונה ההוכחה של טענה 3.3.5(ה): $m=\lceil\frac{\pi}{0.1}\rceil=32$ ו-$m-1=31$ נקודות, עם מרווח
          $h\le\varepsilon$ בין הזוויות. מרווח עד $2\varepsilon$ מספיק, ולכן זו רשת, אבל לא הקטנה ביותר.
      - value: 15
        feedback: >-
          $\frac{\pi}{0.2}\approx15.7$, ו-$15$ קטעים פתוחים באורך $0.2$ אורכם הכולל $3<\pi$: הם לא מכסים קטע באורך
          $\pi$. צריך את המספר השלם הראשון שגדול מ-$15.7$.
