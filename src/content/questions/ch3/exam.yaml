# Chapter 3 exam questions — original, in the style of an 80315 final (not taken from a real exam).
# Each is worth 25 points in lettered parts, with at least one open part graded against a model solution and a rubric.
chapter: 3
questions:
  - id: Q-3-exam-1
    type: exam
    title: קומפקטיות בכדור היחידה של מרחב הפונקציות הרציפות
    prompt: >-
      $(X,d)$ מרחב מטרי. במרחב $(C[0,1],\|\cdot\|_\infty)$ נסמן $f_n(x)=x^n$, ו-$B=\{f\in C[0,1]: \|f\|_\infty\le1\}$
      הוא כדור היחידה הסגור.
    parts:
      - label: א
        points: 8
        type: open
        objectives: [OBJ-3.1-1]
        prompt: >-
          הגדירו מתי קבוצה $K\subseteq X$ היא קומפקטית סדרתית, והוכיחו שקבוצה קומפקטית סדרתית היא סגורה וחסומה.
        solution:
          - kind: definition
            text: >-
              $K$ קומפקטית סדרתית אם לכל סדרה $(x_n)$ של נקודות של $K$ יש תת-סדרה $(x_{n_k})$ שמתכנסת לנקודה **של $K$**.
          - kind: goal
            text: '$K$ סגורה, ו-$K$ מוכלת בכדור כלשהו.'
          - kind: idea
            text: >-
              בשני החלקים מניחים את ההפך ובונים סדרה ב-$K$ שאין לה תת-סדרה עם גבול ב-$K$.
          - kind: step
            text: >-
              סגירות: יהי $x\in\overline K$. לפי משפט 1.5.7 יש סדרה $x_n\in K$ עם $x_n\to x$. לפי הקומפקטיות הסדרתית יש
              תת-סדרה $x_{n_k}\to y\in K$. גם $x_{n_k}\to x$, כתת-סדרה של סדרה מתכנסת, ומיחידות הגבול (משפט 1.5.2)
              $x=y\in K$. לכן $\overline K\subseteq K$, כלומר $K$ סגורה.
          - kind: step
            text: >-
              חסימות: נניח ש-$K$ אינה חסומה ונקבע $p\in X$. לפי הגדרה וטענה 1.5.3(ב), לכל $n$ הקבוצה $K$ אינה מוכלת
              ב-$B(p,n)$, ולכן לכל $n$ אפשר לבחור $x_n\in K$ עם $d(x_n,p)\ge n$. בכל תת-סדרה $d(x_{n_k},p)\ge n_k\ge k$,
              ולכן היא אינה מוכלת באף כדור $B(p,R)$ (ארכימדס), כלומר אינה חסומה, ולכן אינה מתכנסת (סדרה מתכנסת חסומה,
              1.5.3(ג)). זו סתירה לקומפקטיות הסדרתית.
          - kind: result
            text: 'קבוצה קומפקטית סדרתית במרחב מטרי היא סגורה וחסומה.'
        rubric:
          - text: 'הגדרה מדויקת: תת-סדרה, והגבול שלה **ב-$K$**'
            weight: 2
          - text: 'סגירות: סדרה ב-$K$ שמתכנסת לנקודה של הסגור, תת-סדרה עם גבול ב-$K$, ויחידות הגבול'
            weight: 3
          - text: 'חסימות: בחירת $x_n$ עם $d(x_n,p)\ge n$, והנימוק שלאף תת-סדרה אין גבול'
            weight: 3

      - label: ב
        points: 4
        type: numeric
        objectives: [OBJ-3.1-3]
        prompt: >-
          חשבו את $\|f_n-f_{2n}\|_\infty$ (התשובה אינה תלויה ב-$n$).
        answer: 0.25
        tolerance: 0.001
        correctFeedback: >-
          נכון. עם $t=x^n\in[0,1]$, $f_n-f_{2n}=t-t^2$, והמקסימום $\frac14$ מתקבל ב-$t=\frac12$.
        wrongFeedback: >-
          הציבו $t=x^n$ ומצאו את המקסימום של $t-t^2$ ב-$[0,1]$.
        commonWrong:
          - value: 0
            feedback: >-
              $x^n-x^{2n}\to0$ לכל $x$ קבוע, אבל הנורמה היא סופרמום על הקטע לכל $n$ בנפרד: ב-$x=2^{-1/n}$ ההפרש $\frac14$.
            misconception: MC-c3-pointwise-is-enough

      - label: ג
        points: 8
        type: open
        objectives: [OBJ-3.1-3]
        prompt: >-
          הוכיחו שלסדרה $(f_n)$ אין תת-סדרה מתכנסת ב-$(C[0,1],\|\cdot\|_\infty)$, והסיקו ש-$B$ סגורה וחסומה אבל אינה
          קומפקטית.
        solution:
          - kind: goal
            text: 'לאף תת-סדרה $(f_{n_k})$ אין גבול $g\in C[0,1]$ בנורמת הסופרמום.'
          - kind: idea
            text: >-
              גבול בנורמת הסופרמום הוא גבול במידה שווה, ולכן גם גבול נקודתי. הגבול הנקודתי של $x^{n_k}$ ידוע ואינו רציף.
          - kind: step
            text: >-
              נניח ש-$\|f_{n_k}-g\|_\infty\to0$ עבור $g\in C[0,1]$. אז לכל $x$, $|f_{n_k}(x)-g(x)|\le\|f_{n_k}-g\|_\infty\to0$,
              כלומר $g(x)=\lim_k x^{n_k}$.
          - kind: computation
            text: '$\lim_k x^{n_k}=0$ עבור $0\le x<1$, ו-$\lim_k1^{n_k}=1$.'
          - kind: step
            text: >-
              לכן $g=0$ ב-$[0,1)$ ו-$g(1)=1$, ו-$g$ אינה רציפה ב-1, בסתירה ל-$g\in C[0,1]$ (וגם לכך שגבול במידה שווה
              של פונקציות רציפות רציף).
          - kind: step
            text: >-
              $B$ חסומה (מוכלת ב-$B(\theta,2)$, כאשר $\theta$ פונקציית האפס) וסגורה: אם $\|h_m\|_\infty\le1$ ו-$h_m\to h$, אז $|h(x)|=\lim|h_m(x)|\le1$ לכל $x$.
              וכל $f_n\in B$.
          - kind: result
            text: >-
              $(f_n)$ היא סדרה ב-$B$ בלי תת-סדרה מתכנסת, ולכן $B$ סגורה וחסומה ואינה קומפקטית.
        rubric:
          - text: 'מעבר מהתכנסות בנורמת הסופרמום להתכנסות נקודתית, עם האי-שוויון המתאים'
            weight: 2
          - text: 'חישוב הגבול הנקודתי והמסקנה שהוא אינו רציף, כלומר סתירה'
            weight: 3
          - text: 'הנימוק ש-$B$ סגורה וחסומה'
            weight: 2
          - text: 'המסקנה ש-$B$ אינה קומפקטית, עם ההפניה להגדרה'
            weight: 1

      - label: ד
        points: 5
        type: twotier
        standalone: false
        objectives: [OBJ-3.3-3, OBJ-3.3-2]
        qualitative: true
        prompt: >-
          האם הקבוצה $S=\{f_n: n\in\mathbb{N}\}$ חסומה כליל?
        choices:
          - text: לא
            correct: true
            feedback: 'נכון. אפשר להסיק זאת מסעיף ג בלי חישוב נוסף.'
          - text: כן
            feedback: >-
              כל $f_n$ בנורמה 1, אבל חסימות אינה חסימות כליל. אילו $S$ הייתה חסומה כליל, הייתה ל-$(f_n)$ תת-סדרה מתכנסת.
            misconception: MC-c3-bounded-totally-bounded
        reasons:
          - text: 'בקבוצה חסומה כליל לכל סדרה יש תת-סדרת קושי; $C[0,1]$ שלם (שיעור 2.2), ולכן תת-הסדרה הייתה מתכנסת, בסתירה לסעיף ג'
            correct: true
            feedback: >-
              בדיוק: זה החצי של "שלם וחסום כליל גורר קומפקטי" שבונה תת-סדרת קושי, יחד עם השלמות של המרחב שמסביב.
          - text: '$\|f_n\|_\infty=1$ לכל $n$, ולכן $S$ חסומה, ולכן חסומה כליל'
            feedback: >-
              חסומה אינו גורר חסומה כליל, וכאן בדיוק הוא נכשל.
            misconception: MC-c3-bounded-totally-bounded
          - text: '$C[0,1]$ ממימד אינסופי, ולכן אף קבוצה אינסופית בו אינה חסומה כליל'
            feedback: >-
              המסקנה כאן נכונה, אבל הנימוק שגוי: $\{cx: c\in[0,1]\}$ אינסופית וחסומה כליל.
            misconception: MC-c3-ambient-dimension

  - id: Q-3-exam-2
    type: exam
    title: משפט קנטור והומיאומורפיזמים
    prompt: >-
      $(K,d)$ מרחב מטרי קומפקטי ו-$f:K\to\mathbb{R}$ רציפה.
    parts:
      - label: א
        points: 10
        type: open
        objectives: [OBJ-3.4-2]
        prompt: >-
          הוכיחו את משפט קנטור: $f$ רציפה במידה שווה על $K$.
        solution:
          - kind: goal
            text: >-
              לכל $\varepsilon>0$ יש $\delta>0$ כך שלכל $x,y\in K$ עם $d(x,y)<\delta$ מתקיים $|f(x)-f(y)|<\varepsilon$.
          - kind: idea
            text: >-
              בשלילה מקבלים זוגות נקודות קרובות כרצוננו עם ערכים רחוקים. הקומפקטיות מרכזת אותם סביב נקודה אחת $p$,
              ושם הרציפות של $f$ ב-$p$ נותנת סתירה.
          - kind: step
            text: >-
              נניח בשלילה שיש $\varepsilon>0$ כך שלכל $\delta>0$ יש $x,y\in K$ עם $d(x,y)<\delta$ ו-$|f(x)-f(y)|\ge\varepsilon$.
              לכל $n\in\mathbb{N}$ נבחר, עם $\delta=\frac1n$, נקודות $x_n,y_n\in K$ עם $d(x_n,y_n)<\frac1n$ ו-$|f(x_n)-f(y_n)|\ge\varepsilon$.
          - kind: theorem
            text: 'מקומפקטיות $K$ (קומפקטי שקול לקומפקטי סדרתית, משפט 3.2.10) יש תת-סדרה $x_{n_k}\to p$ עם $p\in K$.'
          - kind: computation
            text: '$d(y_{n_k},p)\le d(y_{n_k},x_{n_k})+d(x_{n_k},p)<\frac1{n_k}+d(x_{n_k},p)\to0$, ולכן $y_{n_k}\to p$.'
          - kind: step
            text: >-
              $f$ רציפה ב-$p$, ולכן לפי הרציפות הסדרתית (משפט 1.6.3) $f(x_{n_k})\to f(p)$ ו-$f(y_{n_k})\to f(p)$, כלומר
              $|f(x_{n_k})-f(y_{n_k})|\to0$. זה סותר את
              $|f(x_{n_k})-f(y_{n_k})|\ge\varepsilon$ לכל $k$.
          - kind: result
            text: '$f$ רציפה במידה שווה על $K$.'
        rubric:
          - text: 'שלילה נכונה של רציפות במידה שווה, ובניית $x_n,y_n$ עם $\delta=\frac1n$'
            weight: 3
          - text: 'שימוש בקומפקטיות: תת-סדרה של $x_n$ שמתכנסת לנקודה של $K$'
            weight: 2
          - text: 'הוכחה שאותה תת-סדרה של $y_n$ מתכנסת לאותו גבול (אי-שוויון המשולש)'
            weight: 2
          - text: 'שימוש ברציפות בנקודה $p$ וסתירה מפורשת'
            weight: 3

      - label: ב
        points: 5
        type: numeric
        objectives: [OBJ-3.4-2]
        prompt: >-
          עבור $f(x)=x^2$ על $K=[0,1]$ ו-$\varepsilon=0.19$: מהו ה-$\delta$ **הגדול ביותר** כך שלכל $x,y\in[0,1]$ עם
          $|x-y|<\delta$ מתקיים $|x^2-y^2|<0.19$?
        answer: 0.1
        tolerance: 0.001
        correctFeedback: >-
          נכון. עבור $y=x+h$ עם $0\le h<\delta$ ו-$x+h\le1$: $(x+h)^2-x^2=h(2x+h)\le h(2-h)$, עם שוויון ב-$x+h=1$.
          $h(2-h)$ עולה ב-$h<1$, ולכן התנאי הוא $\delta(2-\delta)\le0.19$, כלומר $\delta\le1-\sqrt{0.81}=0.1$.
        wrongFeedback: >-
          ההפרש $|x^2-y^2|$ הכי גדול ליד $x=1$. כתבו $y=1$, $x=1-h$, ופתרו $1-(1-h)^2\le0.19$.
        commonWrong:
          - value: 0.095
            feedback: >-
              $\delta=\frac\varepsilon2$ (מהחסם $|x^2-y^2|\le2|x-y|$) עובד, אבל אינו הגדול ביותר: החסם 2 על $x+y$ לא מתקבל
              כש-$|x-y|>0$.
            misconception: MC-c3-best-constant
          - value: 0.19
            feedback: >-
              $\delta=\varepsilon$ מתאים לשיפוע 1, כמו ליד $x=\frac12$. ליד $x=1$ השיפוע 2: עם $x=0.85$ ו-$y=1$
              מקבלים $1-0.7225=0.2775>0.19$.
            misconception: MC-c3-delta-depends-on-point

      - label: ג
        points: 5
        type: twotier
        objectives: [OBJ-3.4-2]
        qualitative: true
        prompt: >-
          האם $h(x)=x\sin\frac1x$ רציפה במידה שווה על $(0,1]$? (שימו לב: $(0,1]$ אינה קומפקטית.)
        choices:
          - text: כן
            correct: true
            feedback: >-
              נכון. קנטור הוא תנאי מספיק: כאן ממשיכים את $h$ לקבוצה קומפקטית.
          - text: לא
            feedback: >-
              העובדה שהתחום אינו קומפקטי לא אומרת שהמסקנה נכשלת. $h$ ממשיכה ברציפות ל-$[0,1]$ עם $h(0)=0$.
            misconception: MC-c3-theorem-converse
        reasons:
          - text: 'עם $h(0)=0$ הפונקציה רציפה על $[0,1]$, כי $|x\sin\frac1x|\le|x|\to0$; לפי קנטור היא רציפה במידה שווה על $[0,1]$, ובפרט על $(0,1]$'
            correct: true
            feedback: >-
              בדיוק. צמצום של פונקציה רציפה במידה שווה רציף במידה שווה (אותו $\delta$). לעומת זאת $\sin\frac1x$ אינה ממשיכה
              ברציפות ל-0, ואינה רציפה במידה שווה.
          - text: '$h$ רציפה וחסומה על קטע חסום, ולכן רציפה בו במידה שווה'
            feedback: >-
              המסקנה נכונה והנימוק לא: $\sin\frac1x$ רציפה וחסומה על אותו קטע ואינה רציפה בו במידה שווה.
            misconception: MC-c3-uniform-without-compact
          - text: '$(0,1]$ אינה קומפקטית, ולכן קנטור לא חל ו-$h$ אינה רציפה במידה שווה'
            feedback: >-
              כשההנחה של משפט נכשלת, המשפט פשוט לא אומר דבר. צריך לבדוק את $h$ עצמה.
            misconception: MC-c3-theorem-converse

      - label: ד
        points: 5
        type: mc
        objectives: [OBJ-3.4-3]
        prompt: >-
          $D=[0,1)\cup[2,3]$, ו-$\varphi:D\to[0,2]$ מוגדרת $\varphi(t)=t$ עבור $t\in[0,1)$ ו-$\varphi(t)=t-1$ עבור
          $t\in[2,3]$. $\varphi$ רציפה, חד-חד-ערכית ועל. מה נכון?
        choices:
          - text: '$\varphi$ אינה הומיאומורפיזם: $1-\frac1n\to1=\varphi(2)$, אבל $$\begin{aligned}\varphi^{-1}(1-\tfrac1n)&=1-\tfrac1n\\&\to1\ne2 ;\end{aligned}$$ המשפט לא חל כי $D$ אינה קומפקטית'
            correct: true
            feedback: >-
              נכון. $D$ אינה סגורה ($1-\frac1n\to1\notin D$), ולכן לא קומפקטית, ו-$\varphi^{-1}$ "קופצת" בנקודה 1.
          - text: '$\varphi$ הומיאומורפיזם, כי $D$ חסומה ולכן קומפקטית'
            feedback: >-
              $D$ חסומה ואינה סגורה, ולכן אינה קומפקטית לפי היינה-בורל.
            misconception: MC-c3-half-heine-borel
          - text: '$\varphi$ אינה רציפה, כי יש "חור" בתחום בין 1 ל-2'
            feedback: >-
              $\varphi$ רציפה: כל אחד משני החלקים פתוח ב-$D$, ועל כל אחד $\varphi$ היא הזזה. החור פוגע ברציפות ההופכית, לא של $\varphi$.
            misconception: MC-c3-bijection-homeo
          - text: '$\varphi$ הומיאומורפיזם, כי היא רציפה, חד-חד-ערכית ועל'
            feedback: >-
              זה לא מספיק בלי תחום קומפקטי, וזו בדיוק הדוגמה.
            misconception: MC-c3-bijection-homeo

  - id: Q-3-exam-3
    type: exam
    title: שקילות נורמות במרחב האוקלידי ובמרחב פונקציות
    prompt: >-
      $N$ נורמה כלשהי על $\mathbb{R}^n$. בסעיף ד המרחב הוא $C[0,1]$.
    parts:
      - label: א
        points: 4
        type: numeric
        objectives: [OBJ-3.5-1]
        prompt: >-
          ב-$\mathbb{R}^{16}$: מהו הקבוע הקטן ביותר $C$ כך ש-$\|x\|_2\le C\|x\|_\infty$ לכל $x$?
        answer: 4
        tolerance: 0.001
        correctFeedback: >-
          נכון: $\|x\|_2^2=\sum x_i^2\le16\|x\|_\infty^2$, ולכן $C=\sqrt{16}=4$, עם שוויון ב-$(1,\dots,1)$.
        wrongFeedback: >-
          העריכו $\sum_{i=1}^{16}x_i^2$ בעזרת $\max|x_i|$ ובדקו את הווקטור $(1,\dots,1)$.
        commonWrong:
          - value: 16
            feedback: >-
              $16$ עובד, אבל אינו הקטן ביותר: החסם הוא על $\|x\|_2^2$, ולכן הקבוע עבור $\|x\|_2$ הוא $\sqrt{16}$.
            misconception: MC-c3-best-constant
          - value: 1
            feedback: >-
              $\|x\|_\infty\le\|x\|_2$ עם קבוע 1 הוא הכיוון ההפוך. עבור $(1,\dots,1)$: $\|x\|_2=4>\|x\|_\infty=1$.
            misconception: MC-c3-one-sided-bound

      - label: ב
        points: 11
        type: open
        objectives: [OBJ-3.5-2]
        prompt: >-
          הוכיחו שיש קבועים $c,C>0$ כך ש-$c\|x\|_2\le N(x)\le C\|x\|_2$ לכל $x\in\mathbb{R}^n$.
        solution:
          - kind: idea
            text: >-
              החסם העליון בא מאי-שוויון המשולש. ממנו $N$ רציפה, ועל הספרה הקומפקטית $S=\{\|x\|_2=1\}$ היא מקבלת מינימום
              חיובי; הומוגניות מעבירה אותו לכל $x$.
          - kind: computation
            text: >-
              עם $K=\max_iN(e_i)$: $N(x)=N(\sum x_ie_i)\le\sum|x_i|N(e_i)\le K\|x\|_1\le K\sqrt n\,\|x\|_2$ (קושי-שוורץ, משפט 1.7.3). נגדיר
              $C=K\sqrt n$.
          - kind: step
            text: >-
              $|N(x)-N(y)|\le N(x-y)\le C\|x-y\|_2$, ולכן $N$ רציפה (ליפשיצית) על $(\mathbb{R}^n,\|\cdot\|_2)$.
          - kind: theorem
            text: >-
              $S$ סגורה (מקור של $\{1\}$ תחת הפונקציה הרציפה $\|\cdot\|_2$, מסקנה 1.6.7) וחסומה, ולכן קומפקטית לפי
              היינה-בורל (משפט 3.2.11). היא לא ריקה: $e_1\in S$.
          - kind: step
            text: >-
              לפי משפט ויירשטראס (מסקנה 3.4.3) $N$, רציפה על הקבוצה הקומפקטית הלא ריקה $S$, מקבלת עליה מינימום $c=N(x_0)$
              עם $x_0\in S$. כי $\|x_0\|_2=1$, $x_0\ne0$, ו-$N$ נורמה, ולכן $c>0$.
          - kind: step
            text: >-
              לכל $x\ne0$: $\frac{x}{\|x\|_2}\in S$, ולכן $N(\frac{x}{\|x\|_2})\ge c$, כלומר $N(x)\ge c\|x\|_2$; עבור $x=0$
              זה טריוויאלי.
          - kind: result
            text: '$c\|x\|_2\le N(x)\le C\|x\|_2$ לכל $x$, עם $c=\min_SN>0$ ו-$C=\sqrt n\max_iN(e_i)$.'
        rubric:
          - text: 'החסם העליון מאי-שוויון המשולש והומוגניות, עם קבוע מפורש'
            weight: 3
          - text: 'רציפות $N$ לפי $\|\cdot\|_2$ (אי-שוויון המשולש ההפוך)'
            weight: 2
          - text: 'קומפקטיות הספרה (היינה-בורל), ומינימום שמתקבל וחיובי, עם הנימוק למה הוא חיובי'
            weight: 4
          - text: 'מעבר מהספרה לכל $x$ בכפל בסקלר'
            weight: 2

      - label: ג
        points: 5
        type: mc
        objectives: [OBJ-3.5-1, OBJ-2.1-3]
        prompt: >-
          מה נובע מסעיף ב לגבי השלמות של $(\mathbb{R}^n,N)$?
        choices:
          - text: 'הוא שלם: סדרת קושי לפי $N$ היא סדרת קושי לפי $\|\cdot\|_2$, ולכן מתכנסת לפי $\|\cdot\|_2$ (שיעור 2.1), ולכן גם לפי $N$'
            correct: true
            feedback: >-
              נכון. כל אחד משני אי-השוויונים משמש בכיוון אחר: $\|\cdot\|_2\le\frac1cN$ להעברת תנאי קושי, ו-$N\le C\|\cdot\|_2$
              להעברת ההתכנסות.
          - text: 'הוא שלם, כי $\mathbb{R}^n$ סגור ולכן קומפקטי'
            feedback: >-
              $\mathbb{R}^n$ סגור ולא חסום, ולכן אינו קומפקטי. השלמות באה מהשקילות ל-$\|\cdot\|_2$.
            misconception: MC-c3-half-heine-borel
          - text: 'הוא שלם, ומאותה סיבה גם $(C[0,1],\|\cdot\|_1)$ שלם, כי $(C[0,1],\|\cdot\|_\infty)$ שלם'
            feedback: >-
              $(C[0,1],\|\cdot\|_1)$ אינו שלם (שיעור 2.2). הטיעון עובר רק בין נורמות שקולות, ו-$\|\cdot\|_1$ ו-$\|\cdot\|_\infty$
              על $C[0,1]$ אינן שקולות.
            misconception: MC-c3-all-norms-infinite-dim

      - label: ד
        points: 5
        type: twotier
        objectives: [OBJ-3.5-3, OBJ-3.5-1]
        qualitative: true
        prompt: >-
          על $C[0,1]$ נגדיר $N_0(f)=\|f\|_1+|f(0)|$ (זו נורמה). האם $N_0$ ו-$\|\cdot\|_1$ שקולות?
        choices:
          - text: לא
            correct: true
            feedback: >-
              נכון. המשפט מסעיף ב דורש מימד סופי; כאן הוא נכשל.
          - text: כן
            feedback: >-
              $\|f\|_1\le N_0(f)$ הוא רק כיוון אחד. בכיוון השני אין קבוע: יש פונקציות עם $\|f\|_1$ קטן כרצוננו ו-$f(0)=1$.
            misconception: MC-c3-one-sided-bound
        reasons:
          - text: '$f_n(x)=\max(1-nx,0)$: $\|f_n\|_1=\frac1{2n}$ ו-$N_0(f_n)=\frac1{2n}+1$, ולכן $\frac{N_0(f_n)}{\|f_n\|_1}=1+2n\to\infty$'
            correct: true
            feedback: >-
              בדיוק. אין $C$ עם $N_0(f)\le C\|f\|_1$ לכל $f$.
          - text: '$\|f\|_1\le N_0(f)$ לכל $f$, ולכן הן שקולות'
            feedback: >-
              זה חצי מהשקילות. החצי השני נכשל בפונקציות ה"שן" $f_n$.
            misconception: MC-c3-one-sided-bound
          - text: 'כל הנורמות על מרחב וקטורי שקולות, כפי שהוכח בסעיף ב'
            feedback: >-
              סעיף ב עוסק ב-$\mathbb{R}^n$, וההוכחה משתמשת בקומפקטיות של הספרה. ב-$C[0,1]$ הספרה אינה קומפקטית.
            misconception: MC-c3-all-norms-infinite-dim

  - id: Q-3-exam-4
    type: exam
    title: כיסויים פתוחים, תכונת החיתוך הסופי ומספר לבג
    prompt: >-
      $(X,d)$ מרחב מטרי. קבוצה $K\subseteq X$ **קומפקטית** אם לכל כיסוי פתוח שלה יש תת-כיסוי סופי. בסעיפים א ו-ב
      אין להשתמש בשקילות לקומפקטיות סדרתית: עבדו עם כיסויים.
    parts:
      - label: א
        points: 8
        type: open
        objectives: [OBJ-3.2-1, OBJ-3.2-3]
        prompt: >-
          הגדירו כיסוי פתוח ותת-כיסוי סופי, והוכיחו ישירות מההגדרה בכיסויים שקבוצה קומפקטית $K\subseteq X$ היא חסומה
          וסגורה.
        solution:
          - kind: definition
            text: >-
              כיסוי פתוח של $K$ הוא משפחה $\{U_\alpha\}_{\alpha\in I}$ של קבוצות פתוחות ב-$X$ עם
              $K\subseteq\bigcup_{\alpha\in I}U_\alpha$; תת-כיסוי סופי הוא $U_{\alpha_1},\dots,U_{\alpha_m}$ מתוכה שעדיין
              מכסות את $K$.
          - kind: idea
            text: >-
              בשני החלקים מכסים את $K$ בסדרה **עולה** של קבוצות פתוחות. תת-כיסוי סופי של סדרה עולה הוא קבוצה אחת
              שלה, האחרונה, ולכן $K$ כולה בתוך קבוצה אחת: כדור גדול סביב $p$, או המשלים של כדור קטן סביב $q$.
          - kind: step
            text: >-
              אם $K=\emptyset$ היא סגורה וחסומה ואין מה להוכיח; נניח ש-$K\ne\emptyset$. חסימות: נקבע $p\in X$ ונגדיר $U_n=\{x\in X: d(x,p)<n\}$, $n\in\mathbb{N}$.
              $U_n$ פתוחה (מסקנה 1.6.7(א), כי $x\mapsto d(x,p)$ רציפה לפי טענה 1.6.6), ו-$\bigcup_nU_n=X\supseteq K$
              (ארכימדס: לכל $x$ יש $n>d(x,p)$).
          - kind: step
            text: >-
              מהקומפקטיות יש $n_1,\dots,n_m$ עם $K\subseteq U_{n_1}\cup\dots\cup U_{n_m}$. כי $U_1\subseteq U_2\subseteq\cdots$,
              האיחוד הוא $U_N$ עם $N=\max_in_i$, כלומר $K\subseteq B(p,N)$, ו-$K$ חסומה (הגדרה וטענה 1.5.3).
          - kind: step
            text: >-
              סגירות: נוכיח ש-$X\setminus K$ פתוחה. תהי $q\in X\setminus K$, ונגדיר $V_n=\{x\in X: d(x,q)>\frac1n\}$. כל
              $V_n$ פתוחה (מסקנה 1.6.7(א)), ו-$\bigcup_nV_n=X\setminus\{q\}\supseteq K$, כי $q\notin K$.
          - kind: step
            text: >-
              מהקומפקטיות $K\subseteq V_{n_1}\cup\dots\cup V_{n_m}=V_N$ עם $N=\max_in_i$, כי $V_1\subseteq V_2\subseteq\cdots$.
              לכן כל $x$ עם $d(x,q)<\frac1N$ אינו ב-$V_N$, ולכן אינו ב-$K$: $B(q,\frac1N)\subseteq X\setminus K$.
          - kind: result
            text: >-
              $X\setminus K$ פתוחה, ולכן $K$ סגורה; ו-$K$ חסומה. קבוצה קומפקטית בכל מרחב מטרי היא סגורה וחסומה.
        rubric:
          - text: 'הגדרה מדויקת של כיסוי פתוח (קבוצות פתוחות ב-$X$ שהאיחוד שלהן מכיל את $K$) ושל תת-כיסוי סופי'
            weight: 2
          - text: 'חסימות: הכיסוי בכדורים $B(p,n)$, הנימוק שהוא מכסה, ומעבר מתת-כיסוי סופי לכדור אחד'
            weight: 3
          - text: 'סגירות: הכיסוי של $X\setminus\{q\}$ בקבוצות הפתוחות $\{d(x,q)>\frac1n\}$, ומעבר לכדור סביב $q$ הזר ל-$K$'
            weight: 3

      - label: ב
        points: 9
        type: open
        objectives: [OBJ-3.2-4]
        prompt: >-
          נניח ש-$X$ קומפקטי. הוכיחו שלכל משפחה לא ריקה $\{F_\alpha\}_{\alpha\in I}$ של קבוצות סגורות ב-$X$ עם תכונת
          החיתוך הסופי יש חיתוך לא ריק, והסיקו: אם $F_1\supseteq F_2\supseteq\cdots$ קבוצות סגורות ולא ריקות ב-$X$, אז
          $\bigcap_nF_n\ne\emptyset$.
        solution:
          - kind: given
            text: >-
              $X$ קומפקטי; כל $F_\alpha$ סגורה; לכל $\alpha_1,\dots,\alpha_m\in I$,
              $F_{\alpha_1}\cap\dots\cap F_{\alpha_m}\ne\emptyset$.
          - kind: idea
            text: >-
              משלימים הופכים "חיתוך ריק" ל"כיסוי": המשלימים של קבוצות סגורות הם קבוצות פתוחות, ו"החיתוך ריק" אומר
              שהמשלימים מכסים את $X$.
          - kind: step
            text: >-
              נניח בשלילה ש-$\bigcap_{\alpha\in I}F_\alpha=\emptyset$, ונגדיר $U_\alpha=X\setminus F_\alpha$, פתוחה כמשלים
              של סגורה. לפי דה מורגן $\bigcup_\alpha U_\alpha=X\setminus\bigcap_\alpha F_\alpha=X$, כלומר $\{U_\alpha\}$ כיסוי
              פתוח של $X$.
          - kind: theorem
            text: 'מהקומפקטיות של $X$ יש $\alpha_1,\dots,\alpha_m$ עם $X=U_{\alpha_1}\cup\dots\cup U_{\alpha_m}$.'
          - kind: step
            text: >-
              שוב לפי דה מורגן $F_{\alpha_1}\cap\dots\cap F_{\alpha_m}=X\setminus(U_{\alpha_1}\cup\dots\cup U_{\alpha_m})=\emptyset$,
              בסתירה לתכונת החיתוך הסופי. לכן $\bigcap_\alpha F_\alpha\ne\emptyset$.
          - kind: step
            text: >-
              המסקנה: לסדרה יורדת $F_1\supseteq F_2\supseteq\cdots$ של סגורות לא ריקות יש תכונת החיתוך הסופי, כי
              $F_{n_1}\cap\dots\cap F_{n_m}=F_N$ עם $N=\max_in_i$, ו-$F_N\ne\emptyset$. לפי מה שהוכח,
              $\bigcap_nF_n\ne\emptyset$.
          - kind: result
            text: >-
              במרחב קומפקטי לכל משפחה של סגורות עם תכונת החיתוך הסופי יש חיתוך לא ריק, ובפרט לכל סדרה יורדת של סגורות
              לא ריקות (בלי שום תנאי על הקטרים).
        rubric:
          - text: 'המעבר למשלימים: הם פתוחים, ולפי דה מורגן חיתוך ריק פירושו שהם מכסים את $X$'
            weight: 3
          - text: 'תת-כיסוי סופי מהקומפקטיות, וחזרה בדה מורגן לחיתוך סופי ריק, כלומר סתירה'
            weight: 3
          - text: 'הוכחה שלסדרה יורדת של סגורות לא ריקות יש תכונת החיתוך הסופי (החיתוך הסופי הוא האיבר האחרון)'
            weight: 2
          - text: 'ניסוח המסקנה במפורש'
            weight: 1

      - label: ג
        points: 4
        type: mc
        objectives: [OBJ-3.2-4, OBJ-3.1-3]
        prompt: >-
          ב-$(C[0,1],\|\cdot\|_\infty)$ יהי $B$ כדור היחידה הסגור, ו-$t_n$ פונקציות האוהל: $t_n$ מתאפסת מחוץ לקטע
          $[2^{-n},2^{-n+1}]$, שווה 1 באמצעו, ולינארית בכל אחד משני חצאיו; לכן $\|t_n-t_m\|_\infty=1$ לכל $n\ne m$. נגדיר
          $F_n=\{t_k: k\ge n\}$. מה נכון?
        choices:
          - text: 'כל $F_n$ סגורה ולא ריקה, הן יורדות, והחיתוך שלהן ריק; לפי סעיף ב, $B$ אינה קומפקטית, אף שהיא סגורה, חסומה ושלמה'
            correct: true
            feedback: >-
              נכון. $F_n$ סגורה: סדרה מתכנסת ב-$F_n$ היא סדרת קושי, ולכן מאינדקס מסוים המרחקים בה קטנים מ-1, כלומר היא קבועה
              מאינדקס מסוים, והגבול שלה ב-$F_n$. $t_k\notin F_{k+1}$, ולכן החיתוך ריק. אילו $B$ הייתה קומפקטית, סעיף ב
              (על המרחב $B$, טענה 3.2.3) היה נותן חיתוך לא ריק.
          - text: 'הדוגמה סותרת את משפט החיתוך של קנטור (משפט 2.5.2), כי $C[0,1]$ שלם'
            feedback: >-
              אין סתירה: משפט 2.5.2 דורש גם שהקוטר ישאף ל-0, ו-$\operatorname{diam}F_n=1$ לכל $n$.
            misconception: MC-c2-cantor-no-diameter
          - text: '$F_n$ אינן סגורות: $t_k\to0$ נקודתית, ו-$0\notin F_n$'
            feedback: >-
              התכנסות נקודתית אינה התכנסות בנורמת הסופרמום: $\|t_k-0\|_\infty=1$ לכל $k$, ולכן $0$ אינו גבול של
              $(t_k)$ במרחב הזה.
            misconception: MC-c3-pointwise-is-enough
          - text: 'הדוגמה מראה ש-$C[0,1]$ אינו שלם'
            feedback: >-
              $C[0,1]$ עם נורמת הסופרמום שלם (שיעור 2.2). מה שנכשל הוא הקומפקטיות: $B$ שלמה וחסומה, אבל אינה חסומה כליל.
            misconception: MC-c3-complete-bounded-compact

      - label: ד
        points: 4
        type: numeric
        objectives: [OBJ-3.2-2]
        prompt: >-
          במרחב $X=[0,3]$ עם $d(x,y)=|x-y|$ נתון הכיסוי הפתוח $\{[0,\ 1.2),\ (0.8,\ 2.1),\ (1.9,\ 3]\}$. מהו מספר לבג
          **הגדול ביותר** שלו, כלומר ה-$\delta$ הגדול ביותר כך שלכל $x\in X$ הכדור $B(x,\delta)$ (ב-$X$) מוכל באחת
          משלוש הקבוצות?
        answer: 0.1
        tolerance: 0.001
        correctFeedback: >-
          נכון. בכל חפיפה הנקודה הקשה היא האמצע: ב-$x=1$ צריך $\delta\le0.2$, וב-$x=2$ צריך $\delta\le0.1$
          ($B(2,\delta)\subseteq(0.8,2.1)$ אם ורק אם $\delta\le0.1$, ו-$B(2,\delta)\subseteq(1.9,3]$ אם ורק אם $\delta\le0.1$).
          עם $\delta=0.1$: כל $x\le1.1$ מסתדר בראשונה, כל $x\in[0.9,2]$ בשנייה, וכל $x\ge2$ בשלישית.
        wrongFeedback: >-
          מספר לבג הוא רדיוס, והוא צריך לעבוד בכל נקודה. בדקו את הכדורים שמרכזם באמצע כל אחת משתי החפיפות.
        commonWrong:
          - value: 0.2
            feedback: >-
              $0.2$ מתאים לחפיפה הראשונה בלבד (חצי מאורכה $0.4$), או שזה אורך החפיפה השנייה. ב-$x=2$ הכדור
              $B(2,0.2)=(1.8,2.2)$ לא מוכל באף אחת מהקבוצות.
            misconception: MC-c3-lebesgue-overlap
          - value: 0.4
            feedback: >-
              $0.4$ הוא אורך החפיפה $(0.8,1.2)$. מספר לבג אינו אורך של חפיפה: $B(1,0.4)=(0.6,1.4)$ לא מוכל באף קבוצה.
            misconception: MC-c3-lebesgue-overlap
