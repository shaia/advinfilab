  why: >-
    הסרטון מציג משפט על החיתוך של סדרה יורדת של קבוצות סגורות, בשם "משפט החיתוך של קנטור". בדקו אילו הנחות
    מופיעות בסרטון: אם במקום "קוטר ששואף ל-0 במרחב שלם" (משפט 2.5.2) ההנחה היא שהקבוצות קומפקטיות, זה משפט אחר,
    שנפגוש בפרק 3. בשני המקרים החיתוך לא ריק, ורק בגרסה של השיעור הוא נקודה אחת.
