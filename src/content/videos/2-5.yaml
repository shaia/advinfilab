  why: >-
    הרצאה 14 בקורס אינפי 1מ' של הטכניון (ד"ר אביב צנזור, קורס 104031), על הלמה של קנטור ועל תתי-סדרות. הלמה של
    קנטור על קטעים מקוננים מאינפי 1 (קטעים סגורים מקוננים שאורכם שואף ל-0 נחתכים בנקודה אחת) היא המקרה
    $X=\mathbb{R}$ של משפט 2.5.2. בזמן הצפייה סמנו איפה ההוכחה שם משתמשת בכך שהקצוות שייכים לקטעים (סגירות),
    ואיפה בשלמות של $\mathbb{R}$; אלה שתי ההנחות שהדוגמאות הנגדיות בשיעור מראות שהן נחוצות.
  verified: 2026-11-10
