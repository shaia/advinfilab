  title: Be careful when using polar coordinates (limit of a multivariable function)
  channel: bprp calculus basics
  lang: en
  captions: [en]
  start: 0
  minutes: 10
  why: >-
    לפי פרקי הסרטון: הגבול של $\frac{3x^2y}{x^2+y^2}$ בראשית בקואורדינטות קוטביות, ואחריו $\frac{3x^2y}{x^4+y^2}$,
    שבו אותו מעבר לקוטביות מטעה, והוכחה שהגבול שלה אינו קיים. זו מלכודת הקוטביות של טענה 5.1.10, עם הפונקציה של טענה
    5.1.8(ב) כפול 3.
