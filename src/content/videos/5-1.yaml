  why: >-
    לפי תיאור הסרטון: הגדרת הגבול בשני משתנים, דוגמה פורמלית באפסילון ודלתא, הוכחה שגבול אינו קיים בהליכה על
    עקומים שונים, כללי הגבולות (סכום, מכפלה, מנה והרכבה), כלל הסנדוויץ' ושימוש בקואורדינטות קוטביות. זה המסלול של
    הגדרה 5.1.3, טענה 5.1.5, מסקנה 5.1.7 וטענה 5.1.9; שימו לב אם החסם בקוטביות שנבנה בהרצאה אינו תלוי בזווית.
