    שנמצאת בקבוצה קומפקטית יש תת-סדרה מתכנסת. לפי רשימות ההרצאה באתר הקורס, היא מגדירה קומפקטיות בכיסויים (ההגדרה
    של שיעור 3.2), מראה שקבוצה קומפקטית סגורה וחסומה ומזהירה שההפך אינו נכון במרחב כללי, ומשם מגיעה לתת-סדרות; אצלנו
    הסדר הפוך (הגדרה 3.1.1 כאן, והשקילות בשיעור 3.2). השוו את ההוכחה שם למשפט 3.1.5 ולטענה 3.1.9.
  verified: '2026-11-11'
