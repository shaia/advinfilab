  why: >-
    לפי התיאור: הנגזרת של $f(x(t),y(t))$ לפי $t$ בכלל השרשרת, עם דיאגרמות חצים של התלויות בין המשתנים, ובדוגמה שבה
    שינוי קטן ב-$t$ משנה מעט את $x$ ואת $y$, וזה משנה מעט את $f$. צפו בו אחרי מסקנה 5.5.3: שם הנוסחה
    $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$ היא מקרה פרטי של המכפלה $J_g(f(a))\,J_f(a)$.
    הסרטון מסביר ומדגים; את ההוכחה, ואת המקום שבו נחוצה הדיפרנציאביליות, תמצאו במשפט 5.5.1.
