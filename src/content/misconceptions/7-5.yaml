# Misconceptions first detected in lesson 7.5 (Lagrange multipliers, one constraint).
- id: MC-c7-constrained-needs-grad-zero
  title: מחפשים קיצון עם אילוץ בעזרת גרדיאנט מתאפס
  belief: >-
    בנקודת קיצון של $f$ על $S=\{g=0\}$ מתקיים $\nabla f(a)=0$.
  truth: >-
    בקיצון עם אילוץ מתאפסות רק הנגזרות בכיווני המשיק ל-$S$, ולכן $\nabla f(a)$ ניצב ל-$T_aS$, כלומר
    $\nabla f(a)=\lambda\nabla g(a)$. $f=xy$ על $x^2+y^2=2$ מקבלת מקסימום ב-$(1,1)$, ושם $\nabla f=(1,1)\neq0$.
  remedy: { lesson: '7.5', label: "משפט כופלי לגרנז' והמשמעות הגאומטרית שלו" }

- id: MC-c7-lagrange-sufficient
  title: חושבים שכל פתרון של משוואות לגרנז' הוא קיצון
  belief: >-
    אם $\nabla f(a)=\lambda\nabla g(a)$ ו-$g(a)=0$, אז $a$ נקודת קיצון של $f$ על $S$.
  truth: >-
    משפט לגרנז' נותן תנאי **הכרחי** בלבד. $f(x,y)=y$ על העקום $y=x^3$ (כלומר $g=y-x^3$): בראשית
    $\nabla f=(0,1)=1\cdot\nabla g(0,0)$, אבל $f$ על העקום היא $x^3$, ואין לה שם קיצון.
  remedy: { lesson: '7.5', label: 'מועמדים לעומת קיצון: הכרעה בעזרת קומפקטיות' }

- id: MC-c7-regularity-optional
  title: שוכחים את תנאי הרגולריות של האילוץ
  belief: >-
    כל קיצון של $f$ על $\{g=0\}$ הוא פתרון של $\nabla f=\lambda\nabla g$; ולכן אם למערכת אין פתרון, אין קיצון.
  truth: >-
    המשפט דורש $\nabla g(a)\neq0$. את נקודות $S$ שבהן $\nabla g=0$ בודקים בנפרד. $f=x$ על $y^2=x^3$ מקבלת מינימום
    0 ב-$(0,0)$, שם $\nabla g=0$, ולמערכת לגרנז' אין פתרון בכלל.
  remedy: { lesson: '7.5', label: 'תנאי הרגולריות: כשהגרדיאנט של האילוץ מתאפס' }

- id: MC-c7-gradients-perpendicular
  title: חושבים שבקיצון עם אילוץ הגרדיאנטים ניצבים
  belief: >-
    בקיצון עם אילוץ $\nabla f(a)\perp\nabla g(a)$, כי $f$ "לא משתנה לאורך האילוץ".
  truth: >-
    $f$ אינה משתנה, מסדר ראשון, בכיווני **המשיק** ל-$S$, ולכן $\nabla f(a)$ ניצב למשיק. גם $\nabla g(a)$ ניצב
    למשיק, ובמישור או לאילוץ אחד המשלים הניצב של המשיק חד-ממדי, ולכן $\nabla f(a)$ **מקביל** ל-$\nabla g(a)$: קו
    הגובה של $f$ משיק לעקום האילוץ.
  remedy: { lesson: '7.5', label: "משפט כופלי לגרנז' והמשמעות הגאומטרית שלו" }

- id: MC-c7-lambda-is-value
  title: מבלבלים בין הכופל לבין ערך הקיצון
  belief: >-
    הכופל $\lambda$ שמתקבל מהמערכת הוא ערך המקסימום או המינימום.
  truth: >-
    $\lambda$ הוא היחס בין הגרדיאנטים. את ערך הקיצון מקבלים מהצבת הנקודה ב-$f$. ב-$xy$ על $x^2+y^2=2$: בנקודה
    $(1,1)$ הכופל הוא $\lambda=\frac12$, והמקסימום הוא $f(1,1)=1$.
  remedy: { lesson: '7.5', label: "פתרון בעיית קיצון בשיטת לגרנז'" }

- id: MC-c7-noncompact-extremum
  title: מניחים קיום מקסימום ומינימום על אילוץ לא קומפקטי
  belief: >-
    אם מערכת לגרנז' נתנה מועמדים, הגדול שבהם הוא המקסימום והקטן הוא המינימום, גם כשקבוצת האילוץ אינה חסומה.
  truth: >-
    הכרעה כזו מותרת כש-$S$ קומפקטית (ויירשטראס, שיעור 6.5). על המישור $x+2y+2z=9$ ל-$x^2+y^2+z^2$ אין מקסימום,
    ועל ההיפרבולה $xy=1$ ל-$x^2+y^2$ יש רק מינימום. על קבוצה לא חסומה מוכיחים קיום בעזרת ההתנהגות באינסוף.
  remedy: { lesson: '7.5', label: 'מועמדים לעומת קיצון: הכרעה בעזרת קומפקטיות' }

- id: MC-c7-hessian-unconstrained
  title: מסווגים נקודת לגרנז' לפי ההסיאן של f בלבד
  belief: >-
    אם ההסיאן $H_f(a)$ חיובי מוגדר בנקודת לגרנז' $a$, אז $a$ מינימום מקומי של $f$ על $S$.
  truth: >-
    גם העקמומיות של $S$ משפיעה. $f=x^2+y^2$, שההסיאן שלה $2I$, על הפרבולה $y=1-x^2$: בנקודה $(0,1)$ מתקיים
    $\nabla f=(0,2)=2\nabla g$, ו-$f$ על הפרבולה היא $1-x^2+x^4$, שמקבלת שם **מקסימום** מקומי.
  remedy: { lesson: '7.5', label: 'מועמדים לעומת קיצון: הכרעה בעזרת קומפקטיות' }
