# Misconceptions first detected in lesson 9.2 (sets of measure zero and of content zero).
- id: MC-c9-measure-zero-is-content-zero
  title: לא מבחינים בין מידה אפס לתכולה אפס
  belief: >-
    כיסוי בן מנייה וכיסוי סופי הם אותו דבר, ולכן כל קבוצה ממידה אפס היא בעלת תכולה אפס.
  truth: >-
    תכולה אפס דורשת כיסוי **סופי**. $\mathbb{Q}\cap[0,1]$ ממידה אפס, אבל כל כיסוי סופי שלה בקטעים סגורים מכסה גם
    את הסגור $[0,1]$, ולכן סכום האורכים לפחות 1. שני המושגים מתלכדים רק לקבוצה קומפקטית.
  remedy: { lesson: '9.2', label: 'הרציונליים בקטע: מידה אפס בלי תכולה אפס' }

- id: MC-c9-measure-zero-countable
  title: חושבים שקבוצה ממידה אפס היא בת מנייה
  belief: >-
    רק קבוצות סופיות או בנות מנייה הן ממידה אפס.
  truth: >-
    קבוצת קנטור אינה בת מנייה, ובכל זאת בשלב $k$ של הבנייה היא מכוסה ב-$2^k$ קטעים שסכום אורכיהם
    $(\tfrac23)^k\to0$. גם הקטע $[0,1]\times\{0\}$ במישור אינו בן מנייה, והוא בעל תכולה אפס.
  remedy: { lesson: '9.2', label: 'קבוצת קנטור: לא בת מנייה וממידה אפס' }

- id: MC-c9-each-box-small
  title: דורשים שכל תיבה בכיסוי תהיה קטנה במקום שסכום הנפחים יהיה קטן
  belief: >-
    קבוצה ממידה אפס אם אפשר לכסות אותה בתיבות שהנפח של **כל אחת** מהן קטן מ-$\varepsilon$.
  truth: >-
    כל קבוצה חסומה מכוסה בתיבות קטנות כרצוננו (מחלקים תיבה שמכילה אותה). ההגדרה דורשת שסכום הנפחים של **כל**
    התיבות יחד יהיה קטן מ-$\varepsilon$.
  remedy: { lesson: '9.2', label: 'ההגדרה: סכום הנפחים, לא הנפח של כל תיבה' }

- id: MC-c9-countable-union-same-eps
  title: מכסים כל קבוצה באיחוד בן מנייה באותו אפסילון
  belief: >-
    באיחוד $\bigcup_k A_k$ של קבוצות ממידה אפס מכסים כל $A_k$ בתיבות שסכום נפחיהן קטן מ-$\varepsilon$, ומקבלים כיסוי
    של האיחוד בסכום קטן מ-$\varepsilon$.
  truth: >-
    אינסוף פעמים $\varepsilon$ אינו קטן מ-$\varepsilon$. מכסים את $A_k$ בסכום קטן מ-$\frac{\varepsilon}{2^k}$, וכל
    התיבות יחד (משפחה בת מנייה) נותנות סכום קטן מ-$\sum_k\frac{\varepsilon}{2^k}=\varepsilon$.
  remedy: { lesson: '9.2', label: 'איחוד בן מנייה: אפסילון חלקי שתיים בחזקת k' }

- id: MC-c9-dense-not-measure-zero
  title: חושבים שקבוצה צפופה אינה יכולה להיות ממידה אפס
  belief: >-
    קבוצה שנמצאת "בכל מקום" בתיבה, כמו הנקודות הרציונליות, תופסת נפח חיובי.
  truth: >-
    צפיפות היא תכונה של הסגור, ומידה אפס היא תכונה של הקבוצה עצמה. $\mathbb{Q}^2$ צפופה במישור ובת מנייה, ולכן
    ממידה אפס. מה שנכשל לקבוצה צפופה בתיבה הוא תכולה אפס.
  remedy: { lesson: '9.2', label: 'קבוצה צפופה ממידה אפס' }

- id: MC-c9-segment-positive-measure
  title: שוכחים שמידה אפס תלויה במרחב שבו הקבוצה יושבת
  belief: >-
    לקטע $[0,1]$ יש אורך חיובי, ולכן הוא אינו ממידה אפס גם כשהוא יושב במישור כ-$[0,1]\times\{0\}$; או להפך: כיוון
    שבמישור הוא ממידה אפס, גם בישר.
  truth: >-
    מידה אפס נמדדת בנפח של המרחב שבו הקבוצה יושבת. ב-$\mathbb{R}^2$ מכסים את $[0,1]\times\{0\}$ במלבן אחד
    $[0,1]\times[-\varepsilon,\varepsilon]$ בשטח $2\varepsilon$, ולכן הוא בעל תכולה אפס. ב-$\mathbb{R}$ הקטע $[0,1]$
    אינו ממידה אפס.
  remedy: { lesson: '9.2', label: 'קטע בישר ובמישור' }

- id: MC-c9-content-zero-unbounded
  title: מייחסים תכולה אפס לקבוצה לא חסומה
  belief: >-
    ישר במישור הוא "דק", ולכן הוא בעל תכולה אפס.
  truth: >-
    איחוד סופי של תיבות הוא קבוצה חסומה, ולכן רק קבוצה חסומה יכולה להיות בעלת תכולה אפס. ישר במישור ממידה אפס
    (איחוד בן מנייה של קטעים), אבל אינו בעל תכולה אפס.
  remedy: { lesson: '9.2', label: 'תכולה אפס מחייבת חסימות' }

- id: MC-c9-graph-needs-compact
  title: מסיקים שבלי תחום קומפקטי הגרף אינו בעל תכולה אפס
  belief: >-
    ההוכחה שגרף של פונקציה רציפה הוא בעל תכולה אפס משתמשת ברציפות במידה שווה על תיבה, ולכן על תחום שאינו
    קומפקטי (למשל $(0,1]$) המסקנה נכשלת.
  truth: >-
    כשהנחה של הוכחה נופלת, נכשלת ההוכחה, לא בהכרח המסקנה. הגרף של $\sin\frac1x$ על $(0,1]$ הוא בעל תכולה אפס:
    הסגור שלו הוא הגרף ועוד הקטע $\{0\}\times[-1,1]$, איחוד בן מנייה של קבוצות בעלות תכולה אפס שהוא קבוצה
    קומפקטית.
  remedy: { lesson: '9.2', label: 'הגרף של סינוס של אחד חלקי x' }
