# Misconceptions first detected in lesson 6.3 (quadratic forms and the Hessian matrix).
- id: MC-c6-positive-entries
  title: מטריצה עם איברים חיוביים נחשבת חיובית מוגדרת
  belief: >-
    אם כל איברי המטריצה הסימטרית $A$ חיוביים (או אי-שליליים), התבנית $h^{T}Ah$ חיובית מוגדרת (או חצי מוגדרת).
  truth: >-
    הסימן של התבנית נקבע לפי הערכים העצמיים, לא לפי סימני האיברים. ל-$A=\begin{pmatrix}1&2\\2&1\end{pmatrix}$ הערכים
    העצמיים $3$ ו-$(-1)$, ו-$q(1,-1)=-2$.
  remedy: { lesson: '6.3', label: 'סיווג לפי ערכים עצמיים' }

- id: MC-c6-diagonal-decides
  title: איברי האלכסון קובעים את הסימן של התבנית
  belief: >-
    איברי האלכסון של $A$ הם הערכים העצמיים שלה, ולכן אלכסון חיובי פירושו תבנית חיובית מוגדרת, והקבוע הטוב ביותר
    ב-$q(h)\ge c\|h\|^2$ הוא האיבר הקטן באלכסון.
  truth: >-
    $a_{ii}=q(e_i)$ הוא ערך התבנית בכיוון אחד בלבד. אלכסון חיובי הכרחי לחיוביות מוגדרת אבל אינו מספיק
    (ראו $\begin{pmatrix}1&2\\2&1\end{pmatrix}$), והקבוע הטוב ביותר הוא הערך העצמי הקטן ביותר.
  remedy: { lesson: '6.3', label: 'האלכסון לעומת הערכים העצמיים' }

- id: MC-c6-definite-vs-semi
  title: מבלבלים בין מוגדרת לחצי מוגדרת
  belief: >-
    "חיובית מוגדרת" פירושו $q(h)\ge0$ לכל $h$; או: תבנית שמתאפסת בכיוון כלשהו (למשל התבנית אפס) אינה חצי מוגדרת.
  truth: >-
    חיובית מוגדרת: $q(h)>0$ לכל $h\ne0$. חיובית חצי מוגדרת: $q(h)\ge0$ לכל $h$, ומותר ש-$q$ תתאפס בכיוונים שאינם
    אפס. התבנית $(x+y)^2$ והתבנית אפס חצי מוגדרות ואינן מוגדרות.
  remedy: { lesson: '6.3', label: 'ארבעת הסוגים של תבנית ריבועית' }

- id: MC-c6-sylvester-semi
  title: מינורים מובילים אי-שליליים נחשבים חצי מוגדרת
  belief: >-
    מקריטריון סילבסטר נובע: כל המינורים הראשיים המובילים $\ge0$ אם ורק אם התבנית חיובית חצי מוגדרת.
  truth: >-
    לא. ל-$\begin{pmatrix}0&0\\0&-1\end{pmatrix}$ המינורים המובילים הם $0,0$, והתבנית $(-y^2)$ שלילית חצי מוגדרת. לחצי
    מוגדרות צריך את **כל** המינורים הראשיים (לא רק המובילים), או את הערכים העצמיים.
  remedy: { lesson: '6.3', label: 'למה סילבסטר אינו מכריע חצי מוגדרות' }

- id: MC-c6-negative-minors
  title: קוראים לא נכון את דפוס הסימנים של המינורים
  belief: >-
    שלילית מוגדרת פירושו שכל המינורים המובילים שליליים; וכל דפוס סימנים אחר "לא מכריע", או נותן מקסימום.
  truth: >-
    $A$ שלילית מוגדרת אם ורק אם $(-A)$ חיובית מוגדרת, כלומר $(-1)^k\Delta_k>0$: הסימנים מתחלפים ומתחילים בשלילי.
    אם כל $\Delta_k\ne0$ והדפוס אינו "כולם חיוביים" ואינו "מתחלפים", התבנית לא מוגדרת.
  remedy: { lesson: '6.3', label: 'קריטריון סילבסטר לשלילית מוגדרת' }

- id: MC-c6-sylvester-partial
  title: בודקים רק חלק מהמינורים
  belief: >-
    מספיק לבדוק את $a_{11}$, או רק את הדטרמיננטה, או את שני המינורים הראשונים של מטריצה $3\times3$, כדי להכריע
    שהתבנית חיובית מוגדרת.
  truth: >-
    קריטריון סילבסטר דורש את **כל** המינורים המובילים. במימד 2: $\det A>0$ לבדו לא מבחין בין חיובית מוגדרת
    לשלילית מוגדרת, ו-$a_{11}>0$ לבדו לא שולל אוכף.
  remedy: { lesson: '6.3', label: 'קריטריון סילבסטר: כל המינורים' }

- id: MC-c6-positive-inf
  title: פונקציה חיובית נחשבת חסומה מלרע על ידי קבוע חיובי
  belief: >-
    אם $q(u)>0$ לכל $u$ על ספרת היחידה, אז ברור ש-$\inf q>0$, בלי שום קומפקטיות.
  truth: >-
    אינפימום של מספרים חיוביים יכול להיות 0: $f(x)=x$ על $(0,1]$. מה שמבטיח $\inf q>0$ הוא שהספרה קומפקטית, ולכן
    $q$ **מקבלת** בה מינימום, וערך של $q$ הוא חיובי.
  remedy: { lesson: '6.3', label: 'החסם מלרע והקומפקטיות של הספרה' }

- id: MC-c6-closed-enough
  title: מספיקה קבוצה סגורה, או חסומה, כדי שיהיה מקסימום
  belief: >-
    פונקציה רציפה על קבוצה סגורה (או על קבוצה חסומה) מקבלת בה מקסימום ומינימום.
  truth: >-
    משפט ויירשטראס צריך קבוצה קומפקטית, ובמרחב האוקלידי זה סגורה **וגם** חסומה. $f=x$ על חצי המישור הסגור
    $x\ge0$ אינה חסומה; $x^2+y^2$ על העיגול הפתוח לא מקבלת את הסופרמום 1.
  remedy: { lesson: '3.4', label: 'משפט ויירשטראס בקבוצה קומפקטית' }

- id: MC-c6-bound-euclidean-only
  title: חושבים שהחסם מלרע של תבנית חיובית מוגדרת קיים רק בנורמה האוקלידית
  belief: >-
    החסם $q(h)\ge m\|h\|^2$ בא מהערך העצמי הקטן ביותר, ולכן הוא נכון רק בנורמה האוקלידית ולא, למשל, בנורמת
    המקסימום.
  truth: >-
    קיום הקבוע נובע מקומפקטיות של ספרת היחידה ומהומוגניות $q(th)=t^2q(h)$, בכל נורמה. רק הערך **הטוב ביותר** של
    הקבוע תלוי בנורמה; בנורמה האוקלידית הוא $\lambda_{\min}$.
  remedy: { lesson: '6.3', label: 'החסם מלרע בכל נורמה' }
