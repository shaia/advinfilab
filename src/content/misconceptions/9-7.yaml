# Misconceptions first detected in lesson 9.7 (Sard's theorem and partitions of unity).
- id: MC-c9-sard-points-values
  title: מבלבלים בין נקודות קריטיות לבין ערכים קריטיים
  belief: >-
    משפט סארד אומר שקבוצת **הנקודות** הקריטיות ממידה אפס; או שערך קריטי הוא נקודה $y$ שבה $\det J_f(y)=0$, ומספר
    הערכים הקריטיים הוא מספר הנקודות הקריטיות.
  truth: >-
    נקודה קריטית $x$ נמצאת בתחום ($\det J_f(x)=0$); ערך קריטי הוא התמונה $f(x)$ שלה, בטווח. משפט סארד מדבר על
    הקבוצה $f(C)$ של הערכים. להעתקה קבועה כל נקודה קריטית, ויש לה ערך קריטי אחד; ל-$x^4-2x^2$ שלוש נקודות קריטיות
    ושני ערכים קריטיים.
  remedy: { lesson: '9.7', label: 'נקודות קריטיות וערכים קריטיים' }

- id: MC-c9-critical-value-every-preimage
  title: דורשים שכל המקורות של ערך קריטי יהיו נקודות קריטיות
  belief: >-
    $y$ ערך קריטי רק אם **כל** נקודה $x$ עם $f(x)=y$ היא נקודה קריטית.
  truth: >-
    מספיקה נקודה קריטית אחת מעל $y$. ל-$f(x)=x^3-3x$ הערך $2$ קריטי בזכות $x=-1$, אף ש-$f(2)=2$ ו-$f'(2)=9\neq0$.
    ערך **רגולרי** הוא ערך שכל המקורות שלו רגולריים.
  remedy: { lesson: '9.7', label: 'ההגדרה של ערך קריטי' }

- id: MC-c9-regular-value-in-image
  title: חושבים שערך שאינו בתמונה הוא ערך קריטי, או שמשפט סארד אומר שההעתקה כמעט על
  belief: >-
    נקודה שאינה בתמונה של $f$ היא "בעייתית" ולכן קריטית; משפט סארד אומר שכמעט כל נקודה של $\mathbb{R}^n$ מתקבלת
    כערך רגולרי.
  truth: >-
    ל-$y\notin f(U)$ אין מקורות, ולכן אין מעליו נקודה קריטית: הוא ערך רגולרי, באופן ריק. ל-$f(x)=x^2$ כל $y<0$ רגולרי
    ואינו בתמונה. משפט סארד אומר רק שהערכים הקריטיים מעטים (ממידה אפס), לא שהתמונה גדולה.
  remedy: { lesson: '9.7', label: 'ערך רגולרי שאינו בתמונה' }

- id: MC-c9-sard-image-not-thin
  title: מניחים שהתמונה של קובייה קטנה ליד נקודה קריטית גדולה כמו הקובייה
  belief: >-
    התמונה של קובייה בצלע $s$ תחת העתקה גזירה ברציפות היא בעלת נפח מסדר $s^n$, ולכן סכום הנפחים של התמונות לא קטן
    כשמעדנים את החלוקה.
  truth: >-
    ליד נקודה קריטית ההעתקה מועכת כיוון אחד לפחות: התמונה מוכלת ב"פרוסה" בעובי $2\varepsilon\sqrt n\,s$, בנפח לכל
    היותר $c\,\varepsilon s^n$. ל-$f(x,y)=(x^2,y)$ התמונה של $[0,s]\times[a,a+s]$ היא $[0,s^2]\times[a,a+s]$, בשטח
    $s^3$. הגורם $\varepsilon$ הוא שמנצח את מספר הקוביות $N^n$.
  remedy: { lesson: '9.7', label: 'התמונה של קובייה קטנה ליד נקודה קריטית' }

- id: MC-c9-sard-linear-exact
  title: מחליפים את ההעתקה בקירוב הלינארי שלה בלי שגיאה
  belief: >-
    ליד נקודה קריטית $a$ מתקיים $f(x)=f(a)+Df(a)(x-a)$, ולכן $f(S)$ מוכלת במישור $f(a)+Df(a)(\mathbb{R}^n)$, ממימד
    קטן מ-$n$.
  truth: >-
    הקירוב הלינארי נכון עד שגיאה. מה שהוכחת סארד מראה הוא $\|f(x)-f(a)-Df(a)(x-a)\|\le\varepsilon\sqrt n\,s$
    (אי-שוויון הערך הממוצע ורציפות במידה שווה של $Df$), כלומר $f(S)$ **קרובה** למישור, בתוך פרוסה דקה. ל-$f(x,y)=(x^2,y)$
    ב-$a=0$ התמונה $[0,s^2]\times[0,s]$ אינה מוכלת בישר $\{(0,v)\}$.
  remedy: { lesson: '9.7', label: 'הפרוסה הדקה בהוכחת משפט סארד' }

- id: MC-c9-sard-pointwise-delta
  title: משתמשים ברציפות של הדיפרנציאל בכל נקודה במקום ברציפות במידה שווה
  belief: >-
    לכל נקודה קריטית $a$ רציפות של $Df$ ב-$a$ נותנת $\delta_a$, וזה מספיק כדי לכסות את הערכים הקריטיים בתיבות קטנות.
  truth: >-
    ההוכחה מחלקת את הקובייה $K$ **פעם אחת** לקוביות שכולן קטנות מ-$\delta$, ולכן צריך $\delta$ אחד לכל $K$. אותו
    נותנת רציפות במידה שווה של $Df$ על הקבוצה הקומפקטית $K$; עם $\delta_a$ שתלוי בנקודה אין חלוקה אחת, ואין שליטה
    על מספר הקוביות.
  remedy: { lesson: '9.7', label: 'למה צריך רציפות במידה שווה בהוכחת משפט סארד' }

- id: MC-c9-critical-values-closed
  title: חושבים שקבוצת הערכים הקריטיים תמיד סגורה
  belief: >-
    קבוצת הנקודות הקריטיות סגורה (קבוצת אפסים של $\det J_f$), ולכן גם התמונה שלה, קבוצת הערכים הקריטיים, סגורה.
  truth: >-
    תמונה של קבוצה סגורה תחת פונקציה רציפה אינה בהכרח סגורה. ל-$f(x)=\frac{\sin x}{1+x^2}$ הערכים הקריטיים שואפים
    ל-$0$, אבל $0$ אינו ערך קריטי: כש-$\sin x=0$, $f'(x)=\frac{\cos x}{1+x^2}\neq0$. (התמונה של חלק **קומפקטי** של
    הקבוצה הקריטית כן קומפקטית.)
  remedy: { lesson: '9.7', label: 'הערכים הקריטיים כקבוצה' }

- id: MC-c9-sard-only-same-dim
  title: חושבים שמשפט סארד במימדים שווים אינו אומר דבר על העתקה למימד גבוה יותר
  belief: >-
    משפט סארד בשיעור הוא על $f:U\to\mathbb{R}^n$ עם $U\subseteq\mathbb{R}^n$, ולכן אינו עוזר להבין, למשל, תמונה של
    מסילה במישור.
  truth: >-
    מסילה $\gamma:\mathbb{R}\to\mathbb{R}^2$ גזירה ברציפות מרחיבים ל-$F(x,y)=\gamma(x)$. העמודה השנייה של $J_F$ אפס, ולכן
    כל נקודה קריטית, ו-$\gamma(\mathbb{R})=F(\mathbb{R}^2)$ ממידה אפס. כך לכל $f:\mathbb{R}^n\to\mathbb{R}^m$ גזירה
    ברציפות עם $n<m$.
  remedy: { lesson: '9.7', label: 'התמונה של מסילה גזירה ברציפות' }

- id: MC-c9-empty-interior-measure-zero
  title: חושבים שקבוצה בלי נקודות פנים היא ממידה אפס
  belief: >-
    אם קבוצה אינה מכילה שום כדור פתוח, היא "דקה" ולכן ממידה אפס.
  truth: >-
    הכיוון ההפוך נכון (קבוצה ממידה אפס אינה מכילה תיבה), אבל הכיוון הזה לא: $(\mathbb{R}\setminus\mathbb{Q})\times\mathbb{R}$
    אין לה נקודות פנים, והיא אינה ממידה אפס, כי האיחוד שלה עם $\mathbb{Q}\times\mathbb{R}$ (ממידה אפס) הוא כל המישור.
  remedy: { lesson: '9.7', label: 'מידה אפס ונקודות פנים' }

- id: MC-c9-exp-beats-poly
  title: חושבים שהחזקות של אחד חלקי t מנצחות את הדעיכה של האקספוננט
  belief: >-
    הנגזרות של $e^{-1/t}$ מכילות גורמים כמו $\frac{1}{t^{2k}}$, שמתפוצצים כש-$t\to0^+$, ולכן הפונקציה אינה גזירה
    אינסוף פעמים ב-$0$.
  truth: >-
    עם $u=\frac1t$ הנגזרת היא $P_k(u)e^{-u}$, ו-$u^me^{-u}\to0$ כש-$u\to\infty$ לכל $m$: האקספוננט דועך מהר יותר
    מכל חזקה. לכן כל הנגזרות שואפות ל-$0$, ו-$\varphi^{(k)}(0)=0$ לכל $k$.
  remedy: { lesson: '9.7', label: 'הפונקציה אקספוננט של מינוס אחד חלקי t' }

- id: MC-c9-smooth-is-analytic
  title: חושבים שפונקציה גזירה אינסוף פעמים שווה לטור טיילור שלה
  belief: >-
    פונקציה גזירה אינסוף פעמים שכל הנגזרות שלה בנקודה מתאפסות היא אפס בסביבה של הנקודה; ולכן פונקציה כזו שאינה אפס
    אינה יכולה להתאפס על קטע שלם או על קבוצה גדולה.
  truth: >-
    $\varphi(t)=e^{-1/t}$ ($t>0$), $\varphi(t)=0$ ($t\le0$) גזירה אינסוף פעמים, כל נגזרותיה ב-$0$ אפס, וטור טיילור שלה
    ב-$0$ הוא טור האפס, אבל $\varphi(t)>0$ לכל $t>0$. משפט טיילור נותן שארית לכל סדר סופי, ואינו אומר שהשארית שואפת
    לאפס. בזכות זה יש בליטות וחלוקות יחידה.
  remedy: { lesson: '9.7', label: 'פונקציה חלקה שאינה שווה לטור טיילור שלה' }

- id: MC-c9-bump-sum-not-product
  title: בונים בליטה של תיבה מסכום של בליטות במקום ממכפלה
  belief: >-
    כדי לקבל פונקציה חיובית בדיוק בתיבה $(a_1,b_1)\times\dots\times(a_n,b_n)$ מחברים בליטות בכל משתנה, או לוקחים
    בליטה של כדור.
  truth: >-
    סכום חיובי כשאחד המחוברים חיובי, כלומר באיחוד של רצועות; בליטה של כדור מתאפסת בפינות התיבה. המכפלה
    $\prod_{i=1}^n\varphi(x_i-a_i)\varphi(b_i-x_i)$ חיובית בדיוק כש-$a_i<x_i<b_i$ **לכל** $i$.
  remedy: { lesson: '9.7', label: 'בליטה של תיבה פתוחה' }

- id: MC-c9-glue-smooth
  title: חושבים שהדבקה רציפה של שתי פונקציות חלקות נותנת פונקציה חלקה
  belief: >-
    אם $f$ גזירה אינסוף פעמים משני הצדדים של נקודה ורציפה בה, היא גזירה אינסוף פעמים גם בה; למשל $\max(0,1-x^2)$.
  truth: >-
    ההדבקה דורשת שכל הנגזרות החד-צדדיות יתאימו. $\max(0,1-x^2)$ ב-$x=1$: נגזרת שמאלית $(-2)$, ימנית $0$, ולכן אינה
    גזירה. $\varphi(t)=e^{-1/t}$ נבחרה כי כל נגזרותיה מימין שואפות ל-$0$, ומתאימות לאפס שמשמאל.
  remedy: { lesson: '9.7', label: 'למה דווקא אקספוננט של מינוס אחד חלקי t' }

- id: MC-c9-pointwise-finite-sum
  title: מבלבלים בין סכום סופי בכל נקודה לבין סופיות מקומית
  belief: >-
    אם בכל נקודה רק מספר סופי מהפונקציות $\eta_i$ שונות מאפס, הסכום $\sum_i\eta_i$ הוא סכום סופי של פונקציות חלקות,
    ולכן חלק.
  truth: >-
    כדי שהסכום יהיה חלק צריך ש**בסביבה** של כל נקודה רק מספר סופי של פונקציות יהיו שונות מאפס. בליטות בגובה 1
    על הקטעים $(\frac1{k+1},\frac1k)$: בכל נקודה לכל היותר מחובר אחד שונה מאפס, והסכום אינו רציף ב-$0$.
  remedy: { lesson: '9.7', label: 'משפחה סופית מקומית' }

- id: MC-c9-support-is-nonzero-set
  title: מזהים את התומך עם הקבוצה שבה הפונקציה שונה מאפס
  belief: >-
    התומך של $h$ הוא $\{x: h(x)\neq0\}$, ולכן מספיק שהקבוצה הזו מוכלת בקבוצה של הכיסוי.
  truth: >-
    התומך הוא **הסגור** $\overline{\{x: h(x)\neq0\}}$. $\frac{\varphi(t)}{\varphi(t)+\varphi(1-t)}$ שונה מאפס בדיוק
    ב-$(0,\infty)$, אבל התומך שלה $[0,\infty)$ אינו מוכל ב-$(0,\infty)$. חלוקת יחידה כפופה לכיסוי דורשת שהתומך כולו
    יהיה בתוך קבוצה של הכיסוי.
  remedy: { lesson: '9.7', label: 'התומך של פונקציה' }

- id: MC-c9-bumps-are-partition
  title: שוכחים לחלק את הבליטות בסכום שלהן
  belief: >-
    משפחה של בליטות שהתומכים שלהן מוכלים בקבוצות הכיסוי ומכסים את המרחב היא כבר חלוקת יחידה.
  truth: >-
    סכום הבליטות אינו 1. מחלקים כל בליטה $\psi_R$ בסכום $s=\sum_R\psi_R$, שחיובי בכל נקודה וחלק בזכות הסופיות
    המקומית; אז $\sum_R\frac{\psi_R}{s}=1$.
  remedy: { lesson: '9.7', label: 'מבליטות לחלוקת יחידה' }

- id: MC-c9-partition-one-per-set
  title: חושבים שבחלוקת יחידה יש בדיוק פונקציה אחת לכל קבוצה של הכיסוי
  belief: >-
    חלוקת יחידה הכפופה לכיסוי $\{O_\alpha\}$ היא משפחה $\{\eta_\alpha\}$ עם פונקציה אחת לכל $O_\alpha$, ולכן מספר
    הפונקציות שווה למספר הקבוצות.
  truth: >-
    הדרישה היא רק שהתומך של כל $\eta_i$ יהיה מוכל **באיזושהי** קבוצה של הכיסוי. לכיסוי $\{B(0,j)\}\cup\{\mathbb{R}^n\}$
    החלוקה $\{1\}$ כפופה; ובבנייה של השיעור הפונקציות ממוספרות לפי תיבות קטנות, לא לפי הקבוצות.
  remedy: { lesson: '9.7', label: 'ההגדרה של חלוקת יחידה' }

- id: MC-c9-zero-set-any-set
  title: חושבים שכל קבוצה היא קבוצת האפסים של פונקציה רציפה
  belief: >-
    לכל $S\subseteq\mathbb{R}^n$ יש פונקציה רציפה (או חלקה) שמתאפסת בדיוק על $S$, למשל המרחק מ-$S$.
  truth: >-
    קבוצת האפסים $g^{-1}(\{0\})$ של פונקציה רציפה סגורה, ולכן $S$ חייבת להיות סגורה. המרחק מ-$S$ מתאפס על הסגור
    $\overline{S}$: ל-$S=\mathbb{Q}$ הוא אפס בכל מקום.
  remedy: { lesson: '9.7', label: 'קבוצת אפסים היא סגורה' }

- id: MC-c9-zero-set-thin
  title: חושבים שקבוצת האפסים של פונקציה רציפה שאינה אפס קטנה, למשל ממידה אפס
  belief: >-
    פונקציה רציפה (או חלקה) שאינה זהותית אפס מתאפסת רק על קבוצה "דקה": ממידה אפס, או בלי נקודות פנים.
  truth: >-
    כל קבוצה סגורה היא קבוצת האפסים של פונקציה גזירה אינסוף פעמים, גם $[-1,1]$ או רצועה במישור. לכן גם הקבוצה
    הקריטית $\{\det J_f=0\}$ יכולה להיות שמנה: ל-$f(x,y)=(h(x),y)$ עם $h(x)=\operatorname{sgn}(x)\max(0,|x|-1)^2$ היא
    כל הרצועה $|x|\le1$.
  remedy: { lesson: '9.7', label: 'פונקציה חלקה שמתאפסת בדיוק על קבוצה סגורה' }

- id: MC-c9-distance-smooth
  title: חושבים שפונקציית המרחק מקבוצה גזירה
  belief: >-
    $d(x,S)$ גזירה, לפחות מחוץ ל-$S$, ולכן היא כבר פותרת את הבעיה של פונקציה חלקה שמתאפסת בדיוק על $S$.
  truth: >-
    $d(x,\{0\})=|x|$ אינה גזירה ב-$0$, ו-$d(x,\{-1,1\})=1-|x|$ ליד $0$ אינה גזירה ב-$0$, מחוץ לקבוצה. המרחק נותן
    פונקציה **רציפה** שמתאפסת בדיוק על קבוצה סגורה; לגרסה החלקה צריך טור של בליטות עם מקדמים מתאימים.
  remedy: { lesson: '9.7', label: 'פונקציית המרחק לעומת הטור של בליטות' }

- id: MC-c9-small-function-small-derivative
  title: חושבים שפונקציה חסומה באחד יש לה נגזרות חסומות באחד
  belief: >-
    אם $0\le\psi\le1$, גם הנגזרות של $\psi$ חסומות בקבוע שאינו תלוי ב-$\psi$, ולכן מקדמים $2^{-k}$ מספיקים כדי
    שטורי הנגזרות יתכנסו.
  truth: >-
    פונקציה קטנה יכולה להיות תלולה: אם $\psi$ בליטה של $(-1,1)$ ו-$\psi_k(t)=\psi(4^kt)$, אז $\sup|\psi_k|=\sup|\psi|$
    אבל $\sup|\psi_k'|=4^k\sup|\psi'|$. לכן המקדם $c_k$ צריך לחלק גם בחסם $M_k$ של הנגזרות של $\psi_k$.
  remedy: { lesson: '9.7', label: 'בחירת המקדמים בטור של בליטות' }

- id: MC-c9-critical-det-nonsquare
  title: חושבים שנקודה קריטית היא תמיד נקודה שבה הדטרמיננטה של מטריצת יעקובי מתאפסת
  belief: >-
    גם להעתקה $f:\mathbb{R}^n\to\mathbb{R}^m$ עם $n\neq m$, נקודה $x$ קריטית אם $\det J_f(x)=0$.
  truth: >-
    $J_f(x)$ היא מטריצה בגודל $m\times n$, ולדטרמיננטה יש משמעות רק כש-$m=n$. ההגדרה הכללית: $x$ קריטית אם הדרגה של
    $J_f(x)$ קטנה מ-$m$. כש-$n<m$ הדרגה לכל היותר $n<m$, ולכן כל נקודה קריטית; להטלה $(x,y,z)\mapsto(x,y)$ הדרגה $2$
    בכל נקודה, ואין לה נקודות קריטיות.
  remedy: { lesson: '9.7', label: 'נקודה קריטית של העתקה בין מימדים שונים' }

- id: MC-c9-continuous-image-thin
  title: חושבים שהתמונה של העתקה רציפה ממימד נמוך תמיד ממידה אפס
  belief: >-
    מסילה רציפה במישור היא "קו", ולכן התמונה שלה ממידה אפס, בלי קשר לגזירות.
  truth: >-
    יש מסילות רציפות שממלאות ריבוע: עקומת פאנו היא העתקה רציפה של $[0,1]$ על $[0,1]^2$, והתמונה שלה אינה ממידה אפס.
    מה שמבטיח מידה אפס הוא גזירות ברציפות: ל-$\gamma$ גזירה ברציפות על קטע פתוח $I$ ההרחבה $F(x,y)=\gamma(x)$ על
    הקבוצה הפתוחה $I\times\mathbb{R}$ גזירה ברציפות, ומשפט סארד חל עליה. למסילה על קטע סגור $[a,b]$ מרחיבים את
    $\gamma$ לקטע פתוח, או מוסיפים את שתי נקודות הקצה, שאינן משנות מידה אפס.
  remedy: { lesson: '9.7', label: 'התמונה של מסילה גזירה ברציפות' }

- id: MC-c9-critical-by-dimension
  title: חושבים שהמימדים לבדם קובעים אילו נקודות קריטיות
  belief: >-
    אם $n>m$ ההעתקה $f:\mathbb{R}^n\to\mathbb{R}^m$ אין לה נקודות קריטיות, ואם המימדים שונים כל התמונה ערכים
    קריטיים; או שהדרגה של $J_f(x)$ נמדדת מול מימד התחום $n$.
  truth: >-
    נקודה $x$ קריטית אם הדרגה של $J_f(x)$ קטנה ממימד **הטווח** $m$. רק כש-$n<m$ המימדים לבדם מכריעים: הדרגה לכל
    היותר $n<m$, וכל נקודה קריטית. כש-$n\ge m$ זה תלוי בהעתקה: להטלה $(x,y,z)\mapsto(x,y)$ אין נקודות קריטיות, אבל
    ל-$(x,y,z)\mapsto(x^2+y^2+z^2,z)$ כל ציר $z$ קריטי.
  remedy: { lesson: '9.7', label: 'נקודה קריטית של העתקה בין מימדים שונים' }
