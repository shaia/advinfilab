# Misconceptions first detected in lesson 4.2 (equicontinuity: רציפות במידה אחידה of a family).
- id: MC-c4-equi-vs-uniform
  title: מבלבלים בין משפחה רציפה במידה אחידה לבין משפחה שכל פונקציה בה רציפה במידה שווה
  belief: >-
    אם כל פונקציה במשפחה רציפה במידה שווה, המשפחה רציפה במידה אחידה; אלה שני שמות לאותו דבר.
  truth: >-
    ברציפות במידה שווה של פונקציה אחת, $\delta$ לא תלוי בנקודה. ברציפות במידה אחידה של משפחה, $\delta$ אחד מתאים
    גם לכל הנקודות **וגם לכל הפונקציות**. כל $x^n$ רציפה במידה שווה על $[0,1]$ (קנטור), אבל המשפחה $\{x^n\}$
    אינה רציפה במידה אחידה.
  remedy: { lesson: '4.2', label: 'מילה אחת של הבדל: במידה שווה ובמידה אחידה' }

- id: MC-c4-equi-quantifier-order
  title: מרשים ל-δ להיות תלוי בפונקציה
  belief: >-
    בהגדרת רציפות במידה אחידה מותר לבחור $\delta$ אחרי שבחרו את $f$ מהמשפחה.
  truth: >-
    סדר הכמתים הוא $\forall\varepsilon\ \exists\delta\ \forall f\in\mathcal{F}\ \forall x,y$: $\delta$ נבחר לפני $f$
    ולכן אינו תלוי בה. אם $\delta$ תלוי ב-$f$, מקבלים רק שכל פונקציה רציפה במידה שווה.
  remedy: { lesson: '4.2', label: 'ההגדרה וסדר הכמתים' }

- id: MC-c4-equi-negation
  title: שוללים את הגדרת הרציפות במידה אחידה רק בחלקה
  belief: >-
    משפחה אינה רציפה במידה אחידה אם יש בה פונקציה שאינה רציפה, או אם לכל $\varepsilon$ ההגדרה נכשלת.
  truth: >-
    השלילה היא: קיים $\varepsilon>0$ כך שלכל $\delta>0$ יש $f\in\mathcal{F}$ ויש $x,y$ עם $d(x,y)<\delta$
    ו-$|f(x)-f(y)|\ge\varepsilon$. מספיק $\varepsilon$ אחד, והפונקציה והנקודות רשאיות להשתנות עם $\delta$.
  remedy: { lesson: '4.2', label: 'שלילת ההגדרה' }

- id: MC-c4-equi-needs-derivative-bound
  title: חושבים שרציפות במידה אחידה מחייבת חסם משותף לנגזרות
  belief: >-
    אם הנגזרות של הפונקציות במשפחה אינן חסומות במשותף, המשפחה אינה רציפה במידה אחידה.
  truth: >-
    חסם משותף לנגזרות (או קבוע ליפשיץ משותף) **מספיק**, אבל אינו הכרחי. המשפחה $\sqrt{x+\frac1n}$ על $[0,1]$
    רציפה במידה אחידה עם $\delta=\varepsilon^2$, אף ש-$f_n'(0)=\frac{\sqrt n}{2}$ אינה חסומה.
  remedy: { lesson: '4.2', label: 'תנאי מספיק אינו תנאי הכרחי' }

- id: MC-c4-lipschitz-delta
  title: בוחרים דלתא שווה לאפסילון כפול קבוע ליפשיץ, או מתעלמים מהקבוע
  belief: >-
    במשפחה עם קבוע ליפשיץ משותף $L$ בוחרים $\delta=L\varepsilon$, או פשוט $\delta=\varepsilon$.
  truth: >-
    $|f(x)-f(y)|\le L|x-y|<L\delta$, ולכן צריך $L\delta\le\varepsilon$, כלומר $\delta=\frac{\varepsilon}{L}$.
  remedy: { lesson: '4.2', label: 'משפחה ליפשיצית עם קבוע משותף' }

- id: MC-c4-bounded-family-equicontinuous
  title: חושבים שמשפחה חסומה במידה שווה רציפה במידה אחידה
  belief: >-
    אם $|f(x)|\le1$ לכל $f$ במשפחה ולכל $x$, המשפחה רציפה במידה אחידה.
  truth: >-
    חסימות ורציפות במידה אחידה הן שתי הנחות נפרדות. $\sin(nx)$ חסומות ב-1, ובכל זאת בין $0$ ל-$\frac{\pi}{2n}$
    הן קופצות ב-1.
  remedy: { lesson: '4.2', label: 'סינוס של nx' }

- id: MC-c4-equi-needs-bounded
  title: חושבים שמשפחה לא חסומה אינה יכולה להיות רציפה במידה אחידה
  belief: >-
    משפחה שאינה חסומה במידה שווה, כמו $f_n\equiv n$, אינה רציפה במידה אחידה.
  truth: >-
    רציפות במידה אחידה מדברת על **הפרשים** $|f(x)-f(y)|$, לא על הערכים. הקבועות $f_n\equiv n$ וההזזות $x+n$
    רציפות במידה אחידה (קבוע ליפשיץ 0 או 1), אף שאינן חסומות.
  remedy: { lesson: '4.2', label: 'רציפות במידה אחידה בלי חסימות' }

- id: MC-c4-domain-irrelevant
  title: חושבים שרציפות במידה אחידה של משפחה אינה תלויה בתחום
  belief: >-
    $\{x^n\}$ אינה רציפה במידה אחידה על $[0,1]$, ולכן אינה רציפה במידה אחידה על שום קטע.
  truth: >-
    הבעיה של $x^n$ נמצאת ליד $x=1$. על $[0,\frac12]$ מתקיים $|(x^n)'|=nx^{n-1}\le\frac{n}{2^{n-1}}\le1$, והמשפחה
    רציפה במידה אחידה שם.
  remedy: { lesson: '4.2', label: 'x בחזקת n על קטעים שונים' }
