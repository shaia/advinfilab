# Misconceptions first detected in lesson 9.5 (Fubini's theorem).
- id: MC-c9-fubini-always-swap
  title: מחליפים סדר אינטגרציה בלי לבדוק את ההנחות של משפט פוביני
  belief: >-
    אם שני האינטגרלים הנשנים קיימים, הם שווים; מותר תמיד להחליף את סדר האינטגרציה.
  truth: >-
    משפט פוביני מניח ש-$f$ אינטגרבילית (ובפרט חסומה) על התיבה. ל-$f(x,y)=\frac{x^2-y^2}{(x^2+y^2)^2}$ על
    $(0,1]^2$ האינטגרל הנשנה שבו מבצעים קודם את האינטגרל לפי $y$ שווה ל-$\frac\pi4$, והאינטגרל שבו מבצעים קודם את
    האינטגרל לפי $x$ שווה ל-$-\frac\pi4$: הפונקציה אינה חסומה ליד הראשית.
  remedy: { lesson: '9.5', label: 'שני אינטגרלים נשנים שונים' }

- id: MC-c9-iterated-equal-implies-integrable
  title: מסיקים אינטגרביליות משוויון של שני האינטגרלים הנשנים
  belief: >-
    אם שני האינטגרלים הנשנים של $f$ קיימים ושווים, אז $f$ אינטגרבילית על התיבה (זה ההפך של משפט פוביני).
  truth: >-
    ההפך אינו נכון. תהי $S$ קבוצת הנקודות $(\frac{k}{2^m},\frac{l}{2^m})$ עם $k,l$ אי-זוגיים. כל ישר אנכי או אופקי
    פוגש את $S$ במספר סופי של נקודות, ולכן שני האינטגרלים הנשנים של $\chi_S$ הם 0; אבל $S$ ומשלימה צפופות
    בריבוע, כך ש-$U(\chi_S,P)=1$ ו-$L(\chi_S,P)=0$ לכל חלוקה.
  remedy: { lesson: '9.5', label: 'אינטגרלים נשנים שווים לפונקציה לא אינטגרבילית' }

- id: MC-c9-fubini-inner-must-exist
  title: חושבים שבמשפט פוביני כל אינטגרל פנימי חייב להתקיים
  belief: >-
    אם $f$ אינטגרבילית על $A\times B$, אז לכל $x\in A$ הפונקציה $y\mapsto f(x,y)$ אינטגרבילית על $B$; ואם לאחת מהן
    אין אינטגרל, אי אפשר להשתמש במשפט פוביני.
  truth: >-
    האינטגרל הפנימי יכול לא להתקיים בקבוצה ממידה אפס של ערכי $x$. לכן המשפט מנוסח עם האינטגרל התחתון
    $\mathcal{L}(x)$ והעליון $\mathcal{U}(x)$ של $y\mapsto f(x,y)$: שתיהן אינטגרביליות על $A$ ושני האינטגרלים שלהן
    שווים ל-$\int_{A\times B}f$.
  remedy: { lesson: '9.5', label: 'האינטגרל העליון והתחתון במשפט פוביני' }

- id: MC-c9-iterated-bounds
  title: גבולות האינטגרציה באינטגרל הנשנה לא מתאימים לתחום
  belief: >-
    כשמחליפים את סדר האינטגרציה משאירים את אותם גבולות (רק מחליפים את שמות המשתנים), או שמשתמשים בגבולות של
    התיבה במקום בגבולות של התחום.
  truth: >-
    קודם מתארים את התחום כקבוצה, ואחר כך קוראים ממנו את הגבולות. התחום $\{0\le y\le x\le1\}$ הוא
    $\{0\le x\le1,\ 0\le y\le x\}$ וגם $\{0\le y\le1,\ y\le x\le1\}$: הגבולות של המשתנה הפנימי תלויים במשתנה
    החיצוני, ומשתנים כשמחליפים את הסדר.
  remedy: { lesson: '9.5', label: 'החלפת סדר: מתארים את התחום מחדש' }

- id: MC-c9-slice-radius
  title: מבלבלים בין רדיוס החתך לבין ריבוע הרדיוס
  belief: >-
    החתך של $\{y^2+z^2\le x\}$ במישור $x$ קבוע הוא עיגול שהרדיוס שלו $x$, ולכן השטח $\pi x^2$.
  truth: >-
    $y^2+z^2\le x$ פירושו רדיוס $\sqrt x$, ולכן שטח החתך $\pi x$. תמיד כתבו את החתך כ-$y^2+z^2\le\rho^2$ וזהו
    את $\rho$ לפני שמחשבים $\pi\rho^2$.
  remedy: { lesson: '9.5', label: 'נפח בחתכים: שטח החתך' }
