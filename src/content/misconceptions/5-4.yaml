# Misconceptions first detected in lesson 5.4 (a sufficient condition for differentiability, the gradient).
- id: MC-c5-differentiable-implies-c1
  title: חושבים שפונקציה דיפרנציאבילית גזירה ברציפות
  belief: >-
    אם $f$ דיפרנציאבילית בנקודה (או בכל מקום), הנגזרות החלקיות שלה רציפות.
  truth: >-
    התנאי "נגזרות חלקיות רציפות" מספיק לדיפרנציאביליות ואינו הכרחי. $(x^2+y^2)\sin\frac{1}{\sqrt{x^2+y^2}}$ (ו-0
    בראשית) דיפרנציאבילית בכל מקום עם $Df(0)=0$, אבל $\frac{\partial f}{\partial x}(x,0)=2x\sin\frac1x-\cos\frac1x$ אינה
    שואפת ל-0.
  remedy: { lesson: '5.4', label: 'דיפרנציאבילית אבל לא גזירה ברציפות' }

- id: MC-c5-steepest-rate
  title: טועים בכיוון או בקצב של העלייה המהירה ביותר
  belief: >-
    הקצב המרבי של עליית $f$ הוא הנגזרת החלקית הגדולה, או סכום הנגזרות החלקיות, או $\|\nabla f\|^2$; או שכיוון
    הגרדיאנט הוא גם כיוון הירידה המהירה ביותר.
  truth: >-
    $D_vf(a)=\nabla f(a)\cdot v$, ולפי קושי-שוורץ $-\|\nabla f(a)\|_2\le D_vf(a)\le\|\nabla f(a)\|_2$ לכל וקטור יחידה.
    העלייה המהירה ביותר בכיוון $\frac{\nabla f(a)}{\|\nabla f(a)\|_2}$ בקצב $\|\nabla f(a)\|_2$, והירידה המהירה ביותר
    בכיוון ההפוך.
  remedy: { lesson: '5.4', label: 'הגרדיאנט: כיוון העלייה המהירה ביותר' }

- id: MC-c5-gradient-tangent
  title: חושבים שהגרדיאנט משיק לקווי הגובה
  belief: >-
    הגרדיאנט מצביע לאורך קו הגובה, או שהישר בכיוון הגרדיאנט הוא המשיק למשטח הגובה.
  truth: >-
    לאורך קו גובה $f$ קבועה, ולכן $\nabla f(a)\cdot\gamma'(0)=0$ לכל מסילה $\gamma$ בקו הגובה: הגרדיאנט **ניצב**
    לקווי הגובה ולמשטחי הגובה, והוא הנורמל של המישור המשיק.
  remedy: { lesson: '5.4', label: 'הגרדיאנט ניצב לקווי הגובה' }

- id: MC-c5-tangent-plane-forget-point
  title: כותבים מישור משיק שאינו עובר בנקודת ההשקה
  belief: >-
    המישור המשיק לגרף הוא $z=f(a)+\nabla f(a)\cdot x$ או $z=\nabla f(a)\cdot(x-a)$; המישור המשיק למשטח גובה הוא
    $\nabla F(a)\cdot x=0$.
  truth: >-
    לגרף: $z=f(a)+\nabla f(a)\cdot(x-a)$. למשטח הגובה $F=c$: $\nabla F(a)\cdot(x-a)=0$. בדיקה מהירה: נקודת ההשקה
    חייבת לקיים את משוואת המישור.
  remedy: { lesson: '5.4', label: 'משוואת המישור המשיק' }

- id: MC-c5-level-surface-always-plane
  title: חושבים שלכל משטח גובה יש מישור משיק בכל נקודה
  belief: >-
    $\nabla F(a)\cdot(x-a)=0$ הוא תמיד המישור המשיק למשטח הגובה של $F$ דרך $a$.
  truth: >-
    זה מישור רק כש-$\nabla F(a)\ne0$. בקודקוד החרוט $x^2+y^2-z^2=0$ הגרדיאנט מתאפס, המשוואה היא $0=0$, ולחרוט אין
    שם מישור משיק.
  remedy: { lesson: '5.4', label: 'מישור משיק למשטח גובה: התנאי שהגרדיאנט אינו אפס' }
