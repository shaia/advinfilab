# Misconceptions first detected in lesson 9.1 (boxes, partitions and Darboux sums).
- id: MC-c9-subbox-count-points
  title: סופרים נקודות חלוקה במקום קטעים
  belief: >-
    מספר תת-התיבות של חלוקה הוא מכפלת מספרי הנקודות בחלוקות של הצלעות (או הסכום שלהם).
  truth: >-
    חלוקה של $[a_i,b_i]$ עם $k_i+1$ נקודות מחלקת אותו ל-$k_i$ קטעים, ותת-תיבה היא מכפלה של קטע אחד מכל צלע. לכן יש
    $k_1k_2\cdots k_n$ תת-תיבות: מכפלת מספרי **הקטעים**.
  remedy: { lesson: '9.1', label: 'חלוקה של תיבה: תת-התיבות כמכפלות של קטעים' }

- id: MC-c9-box-volume-sum
  title: מחברים את אורכי הצלעות במקום לכפול אותם
  belief: >-
    הנפח של תיבה הוא סכום אורכי הצלעות שלה.
  truth: >-
    $v(Q)=(b_1-a_1)(b_2-a_2)\cdots(b_n-a_n)$, מכפלה. רק כך הנפח מוכפל ב-$\lambda^n$ כשמותחים את התיבה פי $\lambda$,
    והנפח של תיבה שאחת מצלעותיה מנוונת הוא 0.
  remedy: { lesson: '9.1', label: 'תיבה ונפח של תיבה' }

- id: MC-c9-refinement-increases-upper
  title: חושבים שעידון מגדיל את הסכום העליון
  belief: >-
    בחלוקה עדינה יותר יש יותר תת-תיבות, ולכן הסכום העליון גדל (והתחתון קטן).
  truth: >-
    הכיוון הפוך: אם $P'$ מעדנת את $P$, כל תת-תיבה $S$ של $P$ מתפרקת לתת-תיבות $S'$ של $P'$ שסכום נפחיהן $v(S)$,
    ו-$M_{S'}(f)\le M_S(f)$. לכן $U(f,P')\le U(f,P)$, ובאותו אופן $L(f,P')\ge L(f,P)$.
  remedy: { lesson: '9.1', label: 'עידון: הסכום העליון יורד והתחתון עולה' }

- id: MC-c9-compare-different-partitions
  title: חושבים שאי אפשר להשוות סכומים של שתי חלוקות שאינן מעדנות זו את זו
  belief: >-
    $L(f,P_1)\le U(f,P_2)$ ידוע רק כש-$P_1=P_2$ או כשאחת מעדנת את השנייה; לשתי חלוקות כלליות אין קשר בין הסכומים.
  truth: >-
    לכל שתי חלוקות יש עידון משותף $P=P_1\cup P_2$ (מאחדים את נקודות החלוקה בכל צלע), ולכן
    $L(f,P_1)\le L(f,P)\le U(f,P)\le U(f,P_2)$. כל סכום תחתון קטן או שווה לכל סכום עליון.
  remedy: { lesson: '9.1', label: 'העידון המשותף של שתי חלוקות' }

- id: MC-c9-upper-exists-means-integrable
  title: מסיקים אינטגרביליות מכך שהאינטגרל העליון והתחתון קיימים
  belief: >-
    אם אפשר לחשב את האינטגרל העליון והתחתון של $f$, אז $f$ אינטגרבילית.
  truth: >-
    לכל פונקציה חסומה על תיבה יש אינטגרל עליון ואינטגרל תחתון (אינפימום וסופרמום של קבוצות חסומות של מספרים).
    אינטגרביליות פירושה שהם **שווים**. לפונקציית דיריכלה על $[0,1]^2$ העליון 1 והתחתון 0.
  remedy: { lesson: '9.1', label: 'האינטגרל העליון והתחתון של פונקציית דיריכלה' }

- id: MC-c9-integrable-needs-equal-sums
  title: חושבים שאינטגרביליות דורשת חלוקה שבה הסכום העליון שווה לתחתון
  belief: >-
    $f$ אינטגרבילית אם ורק אם יש חלוקה $P$ עם $U(f,P)=L(f,P)$.
  truth: >-
    שוויון בחלוקה אחת קורה רק כש-$f$ קבועה על הפנים של כל תת-תיבה, פחות או יותר. הקריטריון הוא שלכל
    $\varepsilon>0$ יש חלוקה $P$ עם $U(f,P)-L(f,P)<\varepsilon$: ל-$f(x,y)=xy$ ההפרש בחלוקה האחידה הוא $\frac1n$,
    אף פעם לא אפס, ובכל זאת $f$ אינטגרבילית.
  remedy: { lesson: '9.1', label: 'הקריטריון: ההפרש קטן כרצוננו' }

- id: MC-c9-darboux-sample-point
  title: מחשבים סכום דרבו מערך בפינה של כל תת-תיבה
  belief: >-
    הסופרמום של $f$ על תת-תיבה מתקבל תמיד בפינה ה"עליונה" שלה, ולכן $U(f,P)$ הוא סכום רימן עם הפינות האלה.
  truth: >-
    $M_S(f)=\sup_S f$ הוא סופרמום על **כל** התת-תיבה. רק לפונקציה עולה בכל משתנה הוא מתקבל בפינה העליונה; לפונקציה
    $(x-\tfrac12)^2+y$ על $[0,\tfrac12]\times[0,1]$ הסופרמום מתקבל ב-$(0,1)$, לא ב-$(\tfrac12,1)$.
  remedy: { lesson: '9.1', label: 'סכומי דרבו: סופרמום ואינפימום על כל התת-תיבה' }

- id: MC-c9-point-in-one-box
  title: חושבים שנקודה שייכת לתת-תיבה אחת בלבד של חלוקה
  belief: >-
    כל נקודה של התיבה נמצאת בתת-תיבה אחת, ולכן משפיעה רק על איבר אחד בסכום העליון.
  truth: >-
    התת-תיבות סגורות. נקודה על צלע משותפת שייכת לשתיים, ונקודה בפינה משותפת במישור שייכת לארבע. לפונקציה
    שערכה 1 בנקודה $(\tfrac12,\tfrac12)$ בלבד, עם החלוקה האחידה ל-$10\times10$ ריבועים, $U=\frac{4}{100}$ ולא
    $\frac1{100}$.
  remedy: { lesson: '9.1', label: 'סכום עליון של פונקציה שאינה אפס בנקודה אחת' }

- id: MC-c9-unbounded-darboux
  title: מחשבים סכומי דרבו לפונקציה לא חסומה
  belief: >-
    לכל פונקציה על תיבה אפשר לחשב סכומי דרבו ואינטגרל רימן; פונקציה לא חסומה פשוט נותנת אינטגרל גדול.
  truth: >-
    אינטגרל רימן מוגדר רק לפונקציה **חסומה**: אם $f$ אינה חסומה מלעיל, בכל חלוקה יש תת-תיבה שעליה הסופרמום
    אינסופי, ואין סכום עליון. אינטגרלים כמו $\int_0^1\frac{dx}{\sqrt x}$ הם אינטגרלים מוכללים, מושג אחר.
  remedy: { lesson: '9.1', label: 'סכומי דרבו מוגדרים לפונקציה חסומה' }
