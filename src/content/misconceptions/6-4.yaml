# Misconceptions first detected in lesson 6.4 (classifying critical points by the Hessian).
- id: MC-c6-min-implies-pd
  title: חושבים שבמינימום מקומי ההסיאן חיובי מוגדר
  belief: >-
    אם $a$ נקודת מינימום מקומי (ממש) של $f\in C^2$, אז $H_f(a)$ חיובית מוגדרת.
  truth: >-
    מבחן הנגזרת השנייה הוא תנאי **מספיק**. ההכרחי חלש יותר: במינימום מקומי פנימי $H_f(a)$ חיובית **חצי** מוגדרת.
    ל-$x^4+y^4$ יש מינימום ממש בראשית, ו-$H_f(0)=0$.
  remedy: { lesson: '6.4', label: 'תנאי מספיק לעומת תנאי הכרחי' }

- id: MC-c6-semi-decides
  title: הסיאן חצי מוגדר נחשב מכריע
  belief: >-
    אם $\nabla f(a)=0$ ו-$H_f(a)$ חיובית חצי מוגדרת, אז $a$ נקודת מינימום מקומי.
  truth: >-
    כשההסיאן חצי מוגדר ולא מוגדר, האיבר מסדר שני מתאפס בכיוון כלשהו, ושם מכריעים איברים מסדר גבוה. בראשית:
    $x^2+y^4$ מינימום, $x^2-y^4$ אוכף, $x^2+y^3$ אוכף, וכולן עם אותו הסיאן.
  remedy: { lesson: '6.4', label: 'המקרה החצי מוגדר: ארבע דוגמאות' }

- id: MC-c6-inconclusive-means-none
  title: מבחן שאינו מכריע נקרא כתשובה
  belief: >-
    אם מבחן הנגזרת השנייה אינו מכריע (למשל $H_f(a)=0$), אז $a$ אינה נקודת קיצון; או שאי אפשר לדעת דבר על הנקודה.
  truth: >-
    "לא מכריע" פירושו שההסיאן לבדו לא מספיק, לא שאין קיצון ולא שאין תשובה. בודקים ישירות: ל-$x^4+y^4$ יש מינימום
    כי $f\ge0=f(0)$; ל-$x^3y$ אין, כי $f(t,t)>0>f(t,-t)$.
  remedy: { lesson: '6.4', label: 'מה עושים כשהמבחן לא מכריע' }

- id: MC-c6-local-is-global
  title: מינימום מקומי מהמבחן נחשב מינימום מוחלט
  belief: >-
    אם ההסיאן חיובי מוגדר בנקודה קריטית, היא נקודת המינימום של $f$ בכל התחום.
  truth: >-
    המבחן משתמש בטיילור בכדור קטן סביב $a$ ונותן מידע מקומי בלבד. ל-$x^3-3x+y^2$ יש מינימום מקומי ב-$(1,0)$ עם
    $f=-2$, אבל $f(-3,0)=-18$.
  remedy: { lesson: '6.4', label: 'המבחן מקומי' }

- id: MC-c6-hessian-without-critical
  title: מפעילים את מבחן ההסיאן בנקודה שאינה קריטית
  belief: >-
    אם $H_f(a)$ חיובית מוגדרת, אז $a$ נקודת מינימום מקומי, גם בלי לבדוק ש-$\nabla f(a)=0$.
  truth: >-
    בטיילור $f(a+h)=f(a)+\nabla f(a)\cdot h+\frac12h^{T}H_f(c)h$ האיבר הלינארי שולט כש-$h$ קטן. ל-$f=x+x^2+y^2$
    ההסיאן חיובי מוגדר בכל מקום, אבל $f(-t,0)=-t+t^2<0=f(0,0)$ לכל $0<t<1$.
  remedy: { lesson: '6.4', label: 'קודם נקודה קריטית, אחר כך הסיאן' }

- id: MC-c6-definiteness-unstable
  title: חושבים שחיוביות מוגדרת בנקודה לא אומרת דבר על נקודות קרובות
  belief: >-
    גם אם $H_f(a)$ חיובית מוגדרת ו-$f\in C^2$, ייתכן שבנקודות קרובות ככל שנרצה ל-$a$ ההסיאן כבר אינו חיובי מוגדר.
  truth: >-
    חיוביות מוגדרת היא תנאי "פתוח": המינורים המובילים רציפים ב-$x$ וחיוביים ב-$a$, ולכן חיוביים בכדור סביבה. חצי
    מוגדרות **אינה** יציבה כך: ל-$x^2+y^3$, $H_f(0,t)=\begin{pmatrix}2&0\\0&6t\end{pmatrix}$ לא מוגדרת לכל $t<0$.
  remedy: { lesson: '6.4', label: 'למה ההסיאן חיובי מוגדר בכדור שלם' }
