# Misconceptions first detected in lesson 0.3 (pointwise and uniform convergence, the M-test, swapping limits).
- id: MC-c0-pointwise-is-uniform
  title: הוכחה של התכנסות נקודתית נחשבת כהוכחה של התכנסות במידה שווה
  belief: >-
    אם לכל $x$ ולכל $\varepsilon$ מצאנו $N$ כך ש-$|f_n(x)-f(x)|<\varepsilon$ לכל $n>N$, הוכחנו התכנסות במידה
    שווה.
  truth: >-
    כאן $N$ תלוי ב-$x$: זו התכנסות נקודתית. במידה שווה פירושו $N$ אחד לכל ה-$x$ בבת אחת, כלומר
    $\sup_x|f_n(x)-f(x)|\to0$. ב-$\frac{x}{n}$ על $\mathbb{R}$ צריך $N>\frac{|x|}{\varepsilon}$, ואין $N$ אחד לכולם.
  remedy: { lesson: '0.3', label: 'נקודתית מול במידה שווה: מי תלוי במי' }

- id: MC-c0-sup-of-limit
  title: מחשבים את הגבול לפני הסופרמום
  belief: >-
    כדי לבדוק התכנסות במידה שווה מחשבים קודם $\lim_n|f_n(x)-f(x)|$ לכל $x$, ואם הוא 0 לכל $x$, ההתכנסות במידה
    שווה.
  truth: >-
    $\lim_n|f_n(x)-f(x)|=0$ לכל $x$ זו בדיוק ההתכנסות הנקודתית. במידה שווה דורשים שהסופרמום **לכל $n$ קבוע**,
    $\sup_x|f_n(x)-f(x)|$, ישאף ל-0. סדר הפעולות הוא קודם סופרמום על $x$, אחר כך גבול ב-$n$.
  remedy: { lesson: '0.3', label: 'בדיקת התכנסות במידה שווה בעזרת הסופרמום של ההפרש' }

- id: MC-c0-sup-diff-at-fixed-x
  title: מחשבים את ההפרש בנקודה אחת במקום הסופרמום
  belief: >-
    מספיק להציב נקודה נוחה (קצה הקטע, למשל) כדי לקבל את $\sup_x|f_n(x)-f(x)|$.
  truth: >-
    הסופרמום הוא על **כל** הנקודות, ולעתים קרובות מתקבל בנקודה שזזה עם $n$. ב-$nxe^{-nx}$ המקסימום ב-$x=\frac1n$
    ושווה ל-$\frac1e$ לכל $n$, אף שבכל נקודה קבועה הערך שואף ל-0.
  remedy: { lesson: '0.3', label: 'בדיקת התכנסות במידה שווה בעזרת הסופרמום של ההפרש' }

- id: MC-c0-pointwise-limit-wrong
  title: טועים בגבול הנקודתי בנקודות הקצה
  belief: >-
    $x^n$ אינה מתכנסת ב-$x=1$, או שהגבול הנקודתי שלה על $[0,1]$ הוא 0 בכל הקטע.
  truth: >-
    בכל נקודה מחשבים גבול של סדרת מספרים: ב-$x=1$ הסדרה קבועה ושווה ל-1. הגבול הנקודתי של $x^n$ על $[0,1]$
    הוא 0 ב-$[0,1)$ ו-1 ב-$x=1$, פונקציה לא רציפה.
  remedy: { lesson: '0.3', label: 'הגבול הנקודתי: נקודה אחר נקודה' }

- id: MC-c0-pointwise-preserves-continuity
  title: גבול נקודתי של פונקציות רציפות רציף
  belief: >-
    אם כל $f_n$ רציפה ו-$f_n\to f$ בכל נקודה, אז $f$ רציפה.
  truth: >-
    ההתכנסות הנקודתית לא שומרת רציפות: $x^n$ רציפות על $[0,1]$ והגבול קופץ ב-1. השמירה מובטחת כשההתכנסות
    במידה שווה (טיעון שלושת ה-$\frac{\varepsilon}{3}$).
  remedy: { lesson: '0.3', label: 'גבול במידה שווה של פונקציות רציפות' }

- id: MC-c0-mtest-necessary
  title: אם מבחן ה-M נכשל, הטור לא מתכנס במידה שווה
  belief: >-
    טור פונקציות מתכנס במידה שווה רק אם $\sum\sup_x|f_n(x)|<\infty$.
  truth: >-
    מבחן ה-M הוא תנאי **מספיק**, לא הכרחי. הטור של הפונקציות הקבועות $\frac{(-1)^n}{n}$ מתכנס במידה שווה
    (כמו הטור המספרי), אבל $\sum\sup|f_n|=\sum\frac1n=\infty$.
  remedy: { lesson: '0.3', label: 'מבחן ה-M של ויירשטראס: מספיק ולא הכרחי' }

- id: MC-c0-mtest-bounded-enough
  title: מספיק שאיברי הטור חסומים
  belief: >-
    אם כל איבר של טור פונקציות חסום (למשל $|\sin(nx)|\le1$), הטור מתכנס במידה שווה.
  truth: >-
    מבחן ה-M דורש חסמים $M_n$ שהטור **שלהם** מתכנס. $\sum\sin(nx)$ איבריו חסומים ב-1, והוא לא מתכנס אפילו
    נקודתית ב-$x=\frac{\pi}{2}$; $\sum\frac{\sin nx}{n^2}$ כן, עם $M_n=\frac1{n^2}$.
  remedy: { lesson: '0.3', label: 'מבחן ה-M של ויירשטראס' }

- id: MC-c0-swap-always
  title: מחליפים גבול ואינטגרל בלי לבדוק
  belief: >-
    אם $f_n\to f$ בכל נקודה, אז $\int f_n\to\int f$.
  truth: >-
    התכנסות נקודתית לא מספיקה: $nx(1-x^2)^n\to0$ בכל נקודה של $[0,1]$, אבל האינטגרלים שואפים ל-$\frac12$.
    על קטע חסום, התכנסות במידה שווה מספיקה, כי $\left|\int(f_n-f)\right|\le(b-a)\sup|f_n-f|$.
  remedy: { lesson: '0.3', label: 'מתי מותר להחליף גבול ואינטגרל' }

- id: MC-c0-uniform-needed-for-swap
  title: בלי התכנסות במידה שווה אי אפשר להחליף גבול ואינטגרל
  belief: >-
    אם ההתכנסות אינה במידה שווה, בהכרח $\int f_n\not\to\int f$.
  truth: >-
    התכנסות במידה שווה מספיקה, לא הכרחית. אוהלים בגובה $\sqrt n$ ובבסיס $\frac2n$ אינם מתכנסים ל-0 במידה
    שווה (הסופרמום $\sqrt n$), ובכל זאת השטחים $\frac{1}{\sqrt n}\to0$.
  remedy: { lesson: '0.3', label: 'מתי מותר להחליף גבול ואינטגרל' }

- id: MC-c0-uniform-implies-derivatives
  title: התכנסות במידה שווה של הפונקציות גוררת התכנסות של הנגזרות
  belief: >-
    אם $f_n\to f$ במידה שווה ו-$f_n$ גזירות, אז $f_n'\to f'$.
  truth: >-
    $\frac{\sin nx}{\sqrt n}\to0$ במידה שווה, אבל $f_n'(0)=\sqrt n\to\infty$. כדי להחליף גבול ונגזרת דורשים
    התכנסות במידה שווה של **הנגזרות** והתכנסות של $f_n$ בנקודה אחת.
  remedy: { lesson: '0.3', label: 'מתי מותר להחליף גבול ונגזרת' }

- id: MC-c0-N-is-first-index
  title: מבלבלים את N עם האינדקס הראשון שבתוך הרצועה
  belief: >-
    ה-$N$ הקטן ביותר שמתאים הוא האינדקס הראשון שעבורו התנאי מתקיים.
  truth: >-
    ההגדרה אומרת "לכל $n>N$", ולכן $N$ קטן באחד מהאינדקס הראשון שממנו והלאה התנאי מתקיים.
  remedy: { lesson: '0.3', label: 'מציאת N לאפסילון נתון' }

- id: MC-c0-continuity-theorem-global
  title: המשפט על גבול במידה שווה דורש רציפות בכל מקום
  belief: >-
    המשפט "גבול במידה שווה של רציפות רציף" חל רק כשכל $f_n$ רציפה בכל התחום, ואינו אומר דבר על נקודה בודדת או
    על קצה הקטע.
  truth: >-
    ההוכחה עם שלושת ה-$\frac{\varepsilon}{3}$ מקומית: אם $f_n\to f$ במידה שווה וכל $f_n$ רציפה **בנקודה** $x_0$ של
    התחום (כולל קצה), אז $f$ רציפה ב-$x_0$. כך גבול במידה שווה של פונקציות עם קפיצות רציף בכל נקודה שבה אף אחת
    מהן לא קופצת.
  remedy: { lesson: '0.3', label: 'גבול במידה שווה של פונקציות רציפות' }
