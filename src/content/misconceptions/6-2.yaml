# Misconceptions first detected in lesson 6.2 (critical points and the necessary condition for an extremum).
- id: MC-c6-critical-is-extremum
  title: חושבים שכל נקודה קריטית היא נקודת קיצון
  belief: >-
    אם $\nabla f(a)=0$, אז $a$ נקודת מינימום מקומי או מקסימום מקומי.
  truth: >-
    $\nabla f(a)=0$ הוא תנאי **הכרחי** לקיצון פנימי, לא מספיק. ל-$x^2-y^2$ ול-$x^3+y^2$ הראשית קריטית ואינה קיצון:
    היא נקודת אוכף.
  remedy: { lesson: '6.2', label: 'נקודת אוכף: קריטית ולא קיצון' }

- id: MC-c6-boundary-gradient-zero
  title: מצפים לגרדיאנט אפס גם בקיצון על השפה
  belief: >-
    בכל נקודת קיצון של פונקציה דיפרנציאבילית מתקיים $\nabla f=0$, גם כשהנקודה על השפה של התחום.
  truth: >-
    ההוכחה צריכה את $f(a+te_i)$ לכל $t$ קטן בשני הסימנים, כלומר נקודה פנימית. ל-$f=x$ על $[0,1]^2$ המינימום
    מתקבל על הצלע $x=0$, והגרדיאנט שם הוא $(1,0)$.
  remedy: { lesson: '6.2', label: 'למה התנאי ההכרחי דורש נקודה פנימית' }

- id: MC-c6-nondiff-extremum
  title: מחפשים קיצון רק בין הנקודות שבהן הגרדיאנט מתאפס
  belief: >-
    כל נקודת קיצון מקומי של $f:\mathbb{R}^n\to\mathbb{R}$ מקיימת $\nabla f=0$, ולכן מספיק לפתור $\nabla f=0$.
  truth: >-
    המשפט מניח ש-$f$ דיפרנציאבילית בנקודה. ל-$f=\|(x,y)\|_2$ יש מינימום בראשית, ושם הנגזרות החלקיות אינן קיימות.
    מועמדים לקיצון: נקודות קריטיות, נקודות שבהן $f$ אינה דיפרנציאבילית, ונקודות שפה.
  remedy: { lesson: '6.2', label: 'ההנחות של התנאי ההכרחי' }

- id: MC-c6-lines-suffice
  title: מינימום לאורך כל ישר נחשב מינימום
  belief: >-
    אם הצמצום של $f$ לכל ישר דרך $a$ מקבל מינימום מקומי ב-$a$, אז $a$ נקודת מינימום מקומי של $f$.
  truth: >-
    הרדיוס שבו המינימום מתקיים יכול להיות תלוי בישר ולהצטמק לאפס. ל-$f=(y-x^2)(y-3x^2)$ יש מינימום ממש בראשית
    לאורך כל ישר, אבל על הפרבולה $y=2x^2$ מתקיים $f=-x^4<0$. זה אותו לקח כמו "גבול לאורך כל ישר אינו מספיק"
    (שיעור 5.1).
  remedy: { lesson: '6.2', label: 'הדוגמה עם שתי הפרבולות' }

- id: MC-c6-saddle-is-indefinite
  title: מגדירים נקודת אוכף לפי הצורה או רק כ"לא מינימום"
  belief: >-
    נקודת אוכף היא נקודה שבה $f$ מינימלית לאורך ציר אחד ומקסימלית לאורך ציר אחר; או כל נקודה קריטית שאינה מינימום.
  truth: >-
    נקודת אוכף היא נקודה קריטית שאינה נקודת קיצון מקומי, לא מינימום וגם לא מקסימום: בכל כדור סביבה יש נקודות שבהן
    $f$ גדולה מ-$f(a)$ ונקודות שבהן היא קטנה ממנה. ל-$xy$ הראשית היא אוכף אף ש-$f$ קבועה על שני הצירים, ול-$x^3+y^2$
    היא אוכף אף שאין בה מקסימום לאורך שום ציר.
  remedy: { lesson: '6.2', label: 'ההגדרה של נקודת אוכף' }

- id: MC-c6-solve-separately
  title: פותרים את משוואות הנקודות הקריטיות כל אחת לחוד
  belief: >-
    פותרים כל משוואה של $\nabla f=0$ בנפרד ומצרפים את כל הפתרונות, או מחלקים במשתנה שעלול להתאפס ומאבדים פתרונות.
  truth: >-
    נקודה קריטית מקיימת את כל המשוואות **יחד**: מציבים אחת בשנייה ובודקים כל צירוף. חלוקה ב-$x$ מותרת רק אחרי
    שטיפלו לחוד במקרה $x=0$.
  remedy: { lesson: '6.2', label: 'מציאת נקודות קריטיות: פתרון מערכת' }
