# Misconceptions first detected in lesson 8.4 (conservative fields and potentials).
- id: MC-c8-potential-add-both
  title: מחברים את שתי האינטגרציות כשמחפשים פוטנציאל
  belief: >-
    פוטנציאל של $(P,Q)$ הוא $\int P\,dx+\int Q\,dy$: משלבים כל רכיב לפי המשתנה שלו ומחברים.
  truth: >-
    כל אחת משתי האינטגרציות כבר מכילה את האיברים המשותפים, ולכן החיבור סופר אותם פעמיים. ל-$(2xy,x^2+3y^2)$:
    $\int P\,dx=x^2y+c(y)$, ומ-$\partial_y\varphi=Q$ נקבע $c'(y)=3y^2$, כלומר $\varphi=x^2y+y^3$, לא $2x^2y+y^3$.
    בודקים תמיד: $\nabla\varphi=F$.
  remedy: { lesson: '8.4', label: 'מציאת פונקציית פוטנציאל' }

- id: MC-c8-potential-forget-start
  title: מציבים בפוטנציאל רק את נקודת הסיום
  belief: >-
    אם $F=\nabla\varphi$, האינטגרל לאורך מסילה שמסתיימת ב-$q$ הוא $\varphi(q)$.
  truth: >-
    $\int_\gamma\nabla\varphi\cdot ds=\varphi(\gamma(b))-\varphi(\gamma(a))$. רק כש-$\varphi$ מתאפסת בנקודת ההתחלה
    הנוסחה מתקצרת ל-$\varphi(q)$; ל-$e^{xy}$ בראשית הערך 1, לא 0.
  remedy: { lesson: '8.4', label: 'המשפט היסודי לאינטגרל קווי' }

- id: MC-c8-potential-incomplete
  title: מוצאים פוטנציאל מרכיב אחד בלי לבדוק את האחרים
  belief: >-
    משלבים את $P$ לפי $x$ ומקבלים את הפוטנציאל; "קבוע האינטגרציה" הוא באמת קבוע.
  truth: >-
    קבוע האינטגרציה תלוי בשאר המשתנים: $\int P\,dx=g(x,y,z)+c(y,z)$, ואת $c$ קובעים מהרכיבים האחרים. ל-$(yz,xz,xy+2z)$
    הפוטנציאל $xyz+z^2$, והאיבר $z^2$ מתגלה רק מהרכיב השלישי.
  remedy: { lesson: '8.4', label: 'מציאת פונקציית פוטנציאל בשלושה משתנים' }

- id: MC-c8-crossed-partials-misread
  title: משווים את הנגזרות החלקיות הלא נכונות
  belief: >-
    התנאי לשדה משמר $(P,Q)$ הוא $\frac{\partial P}{\partial x}=\frac{\partial Q}{\partial y}$.
  truth: >-
    התנאי ההכרחי הוא $\frac{\partial P}{\partial y}=\frac{\partial Q}{\partial x}$: הנגזרות **המוצלבות**, כי
    $P=\partial_x\varphi$, $Q=\partial_y\varphi$ ו-$\partial_y\partial_x\varphi=\partial_x\partial_y\varphi$. השדה
    $(x,-y)$ משמר ($\varphi=\frac{x^2-y^2}{2}$) אף ש-$\partial_xP=1\ne-1=\partial_yQ$.
  remedy: { lesson: '8.4', label: 'תנאי הנגזרות המוצלבות' }

- id: MC-c8-crossed-partials-sufficient
  title: חושבים שתנאי הנגזרות המוצלבות מספיק כדי שהשדה יהיה משמר
  belief: >-
    אם $F$ גזיר ברציפות ו-$\partial_yP=\partial_xQ$ בכל התחום, אז $F$ משמר בתחום.
  truth: >-
    התנאי הכרחי, ומספיק רק בתחום פשוט קשר (שיעור 8.5). שדה הזווית $\frac{(-y,x)}{x^2+y^2}$ מקיים אותו בכל
    $\mathbb{R}^2\setminus\{0\}$, והאינטגרל שלו על מעגל היחידה $2\pi\ne0$.
  remedy: { lesson: '8.4', label: 'שדה הזווית: התנאי אינו מספיק' }

- id: MC-c8-one-loop-enough
  title: בודקים מסילה סגורה אחת, או כמה, ומסיקים שהשדה משמר
  belief: >-
    אם האינטגרל של $F$ על מעגל, או על כמה מסילות סגורות, יוצא 0, השדה משמר.
  truth: >-
    התנאי הוא **לכל** מסילה סגורה. ל-$(y^2,x^2)$ האינטגרל על מעגל היחידה 0, ועל שפת המשולש
    $(0,0),(1,0),(1,1)$ הוא $\frac13$. כדי להפריך מספיקה מסילה אחת; כדי להוכיח צריך פוטנציאל או משפט.
  remedy: { lesson: '8.4', label: 'שדה משמר ואינטגרלים על מסילות סגורות' }

- id: MC-c8-arctan-potential
  title: חושבים שהפונקציה ארקטנגנס של y חלקי x היא פוטנציאל של שדה הזווית בכל מקום
  belief: >-
    $\arctan\frac yx$ היא "הזווית", ולכן פוטנציאל של שדה הזווית בכל $\mathbb{R}^2\setminus\{0\}$, או לפחות במישור
    בלי חצי ציר.
  truth: >-
    $\arctan\frac yx$ אינה מוגדרת על הציר $x=0$, ובחצי המישור $x<0$ היא שונה מהזווית הקוטבית ב-$\pi$ (למעלה) או ב-$(-\pi)$ (למטה). היא
    פוטנציאל בכל אחד מחצאי המישור $x>0$ ו-$x<0$ בנפרד, אבל לא נדבקת לפוטנציאל אחד. במישור בלי חצי הציר
    $\{(x,0):x\le0\}$ הפוטנציאל הוא הזווית הקוטבית $\theta\in(-\pi,\pi)$.
  remedy: { lesson: '8.4', label: 'שדה הזווית וענפי הזווית' }

- id: MC-c8-angle-scales
  title: חושבים שהאינטגרל של שדה הזווית על מעגל גדל עם הרדיוס
  belief: >-
    על מעגל גדול יותר עוברים דרך ארוכה יותר, ולכן האינטגרל של שדה הזווית גדל עם הרדיוס.
  truth: >-
    על מעגל ברדיוס $r$ סביב הראשית $\|\omega\|=\frac1r$ והאורך $2\pi r$, והשדה משיק: האינטגרל $2\pi$ לכל $r$. הוא
    מודד את הזווית הכוללת שהמסילה מסתובבת סביב הראשית, לא את האורך.
  remedy: { lesson: '8.4', label: 'שדה הזווית על מעגלים' }

- id: MC-c8-conservative-domain-free
  title: חושבים ששדה משמר או לא משמר בלי קשר לתחום
  belief: >-
    "משמר" היא תכונה של הנוסחה של השדה: אם השדה אינו משמר בתחום אחד, אין לו פוטנציאל גם בשום תת-תחום.
  truth: >-
    משמר פירושו שיש פוטנציאל **בתחום הנתון**. שדה הזווית אינו משמר ב-$\mathbb{R}^2\setminus\{0\}$, אבל משמר בחצי
    המישור $x>0$ ובמישור בלי חצי ציר: שם אין מסילה סגורה שמקיפה את הראשית.
  remedy: { lesson: '8.4', label: 'שדה הזווית וענפי הזווית' }
