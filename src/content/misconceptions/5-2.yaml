# Misconceptions first detected in lesson 5.2 (partial and directional derivatives).
- id: MC-c5-partial-others-move
  title: בנגזרת חלקית לא מקבעים את שאר המשתנים
  belief: >-
    $\frac{\partial f}{\partial x_i}(a)$ מסתכלת על ערכי $f$ בכל הנקודות הקרובות ל-$a$, או שגוזרים גם לפי משתנה אחר.
  truth: >-
    $\frac{\partial f}{\partial x_i}(a)=\lim_{t\to0}\frac{f(a+te_i)-f(a)}{t}$: כל המשתנים פרט ל-$x_i$ קבועים, והנגזרת
    רואה רק את הישר דרך $a$ בכיוון $e_i$. ערכי $f$ מחוץ לישר הזה אינם משפיעים עליה.
  remedy: { lesson: '5.2', label: 'נגזרת חלקית: מקבעים את כל השאר' }

- id: MC-c5-one-sided-derivative
  title: מסתפקים בגבול חד-צדדי בהגדרת הנגזרת הכיוונית
  belief: >-
    אם $\frac{f(a+tv)-f(a)}{t}$ מתכנס כש-$t\to0^+$, הנגזרת הכיוונית קיימת.
  truth: >-
    בקורס הזה $D_vf(a)=\lim_{t\to0}\frac{f(a+tv)-f(a)}{t}$ היא גבול דו-צדדי. לכן $D_{-v}f(a)=-D_vf(a)$ כשאחת מהן
    קיימת, ול-$\|x\|_2$ אין נגזרת כיוונית בראשית: המנה היא $\frac{|t|}{t}$.
  remedy: { lesson: '5.2', label: 'הגדרת הנגזרת הכיוונית: גבול דו-צדדי' }

- id: MC-c5-nonunit-direction
  title: מחשבים נגזרת כיוונית עם וקטור שאינו וקטור יחידה
  belief: >-
    את הנגזרת הכיוונית "בכיוון $(3,4)$" מחשבים עם הווקטור $(3,4)$ עצמו.
  truth: >-
    כיוון מיוצג על ידי וקטור יחידה: $v=\frac{(3,4)}{5}$. המנה עם וקטור באורך $\lambda$ נותנת מספר גדול פי $\lambda$,
    ולכן תוצאה שתלויה בבחירת הנציג ולא רק בכיוון.
  remedy: { lesson: '5.2', label: 'נגזרת כיוונית: מנרמלים את הכיוון' }

- id: MC-c5-partials-imply-continuity
  title: חושבים שקיום הנגזרות החלקיות גורר רציפות
  belief: >-
    כמו במשתנה אחד, אם כל הנגזרות החלקיות קיימות בנקודה, הפונקציה רציפה בה.
  truth: >-
    הנגזרות החלקיות רואות רק את הישרים המקבילים לצירים. $\frac{xy}{x^2+y^2}$ (ו-0 בראשית) היא 0 על הצירים, ולכן שתי
    הנגזרות החלקיות בראשית 0, אבל $f(t,t)=\frac12$, והיא אינה רציפה שם.
  remedy: { lesson: '5.2', label: 'נגזרות חלקיות בלי רציפות' }

- id: MC-c5-directional-from-partials
  title: חושבים שהנגזרות הכיווניות נקבעות תמיד מהנגזרות החלקיות
  belief: >-
    אם הנגזרות החלקיות קיימות, אז כל הנגזרות הכיווניות קיימות ו-$D_vf(a)=\sum_i v_i\frac{\partial f}{\partial x_i}(a)$.
  truth: >-
    הנוסחה הזו היא משפט על פונקציות דיפרנציאביליות (שיעור 5.3). בלי דיפרנציאביליות הנגזרות הכיווניות עלולות לא
    להתקיים (0 על הצירים ו-1 מחוץ להם), או להתקיים ולא להיות לינאריות ב-$v$: ל-$\frac{x^2y}{x^4+y^2}$ הנגזרות
    החלקיות 0 ו-$D_vf(0)=\frac{v_1^2}{v_2}$.
  remedy: { lesson: '5.2', label: 'נגזרות כיווניות שאינן לינאריות בכיוון' }

- id: MC-c5-value-vs-derivative
  title: מחליפים את הגבול של הפונקציה בגבול של המנה
  belief: >-
    אם $f(a+tv)\to f(a)$ כש-$t\to0$, הנגזרת הכיוונית היא 0.
  truth: >-
    השאיפה $f(a+tv)\to f(a)$ היא רציפות לאורך הישר. הנגזרת היא הגבול של המנה $\frac{f(a+tv)-f(a)}{t}$, ותלויה בקצב:
    $f(tv)=t$ שואפת ל-0 ונגזרתה 1.
  remedy: { lesson: '5.2', label: 'נגזרת כיוונית: גבול של מנה, לא של ערכים' }

- id: MC-c5-directional-imply-continuity
  title: חושבים שקיום כל הנגזרות הכיווניות גורר רציפות
  belief: >-
    אם $D_vf(a)$ קיימת לכל כיוון $v$, $f$ רציפה ב-$a$.
  truth: >-
    נגזרות כיווניות בודקות רק ישרים. ל-$\frac{x^2y}{x^4+y^2}$ (ו-0 בראשית) יש נגזרת כיוונית בכל כיוון, ובכל זאת על
    הפרבולה $y=x^2$ היא שווה $\frac12$. רציפות צריכה מידע על כל הסביבה, ודיפרנציאביליות (שיעור 5.3) נותנת אותו.
  remedy: { lesson: '5.2', label: 'כל הנגזרות הכיווניות בלי רציפות' }

- id: MC-c5-continuity-gives-derivative
  title: חושבים שפונקציה רציפה גזירה בכל כיוון
  belief: >-
    אם $f$ רציפה ב-$a$, הנגזרות הכיווניות שלה שם קיימות; הסיבה היחידה לכך שנגזרת אינה קיימת היא אי-רציפות.
  truth: >-
    כמו $|x|$ במשתנה אחד: $\|x\|_2$ ו-$\sqrt{|xy|}$ רציפות בראשית, ולראשונה אין שם אף נגזרת כיוונית, ולשנייה אין
    נגזרת בכיוונים שאינם הצירים. רציפות היא תנאי הכרחי לגזירות, לא מספיק.
  remedy: { lesson: '5.2', label: 'רציפות אינה גוררת נגזרות כיווניות' }
