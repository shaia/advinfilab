# Misconceptions first detected in lesson 2.5 (Cantor's intersection theorem and Baire's theorem).
- id: MC-c2-diameter-metric-free
  title: מחשבים קוטר בלי להתחשב במטריקה
  belief: >-
    הקוטר של קבוצה הוא תמיד המרחק האוקלידי הגדול ביותר בה, והקוטר של כדור ברדיוס $r$ הוא $2r$.
  truth: >-
    $\operatorname{diam}A=\sup\{d(x,y):x,y\in A\}$ במטריקה הנתונה. הריבוע $[0,1]^2$ קוטרו $2$ בנורמה $\|\cdot\|_1$,
    $\sqrt2$ באוקלידית ו-$1$ ב-$\|\cdot\|_\infty$; במטריקה הבדידה $B(x,1)=\{x\}$ וקוטרו $0$.
  remedy: { lesson: '2.5', label: 'הגדרת הקוטר' }

- id: MC-c2-cantor-no-diameter
  title: חושבים שסדרה יורדת של סגורות לא ריקות במרחב שלם תמיד נחתכת
  belief: >-
    במרחב שלם, חיתוך של סדרה יורדת של קבוצות סגורות לא ריקות אינו ריק, גם בלי שהקוטר ישאף לאפס.
  truth: >-
    התנאי על הקוטר נחוץ. ב-$\mathbb{R}$ הקבוצות $[n,\infty)$ סגורות, לא ריקות ויורדות, וחיתוכן ריק; ב-$\mathbb{N}$
    עם המטריקה הבדידה הזנבות $\{n,n+1,\dots\}$ קוטרם 1, והחיתוך ריק.
  remedy: { lesson: '2.5', label: 'משפט החיתוך של קנטור: כל ההנחות' }

- id: MC-c2-cantor-closed-optional
  title: משמיטים את הסגירות או את השלמות ממשפט החיתוך של קנטור
  belief: >-
    מספיק שהקבוצות יורדות, לא ריקות וקוטרן שואף לאפס; לא משנה אם הן סגורות או אם המרחב שלם.
  truth: >-
    שתי ההנחות נחוצות. ב-$\mathbb{R}$ הקטעים $(0,\frac1n)$ אינם סגורים וחיתוכם ריק; ב-$\mathbb{Q}$ הקבוצות
    $\mathbb{Q}\cap[\sqrt2-\frac1n,\sqrt2+\frac1n]$ סגורות ב-$\mathbb{Q}$ וקוטרן $\frac2n$, וחיתוכן ריק כי $\mathbb{Q}$
    אינו שלם.
  remedy: { lesson: '2.5', label: 'משפט החיתוך של קנטור: כל ההנחות' }

- id: MC-c2-empty-interior-nowhere-dense
  title: מזהים קבוצה דלילה עם קבוצה שפנימה ריק
  belief: >-
    קבוצה דלילה היא קבוצה בלי נקודות פנימיות, למשל $\mathbb{Q}$ בתוך $\mathbb{R}$.
  truth: >-
    דלילה פירושו שלסגור אין פנים: $(\overline{A})^\circ=\emptyset$. ל-$\mathbb{Q}$ אין פנים, אבל
    $\overline{\mathbb{Q}}=\mathbb{R}$, ולכן היא רחוקה מלהיות דלילה: היא צפופה.
  remedy: { lesson: '2.5', label: 'הגדרת קבוצה דלילה: הסגור קודם' }

- id: MC-c2-singleton-always-nowhere-dense
  title: חושבים שנקודה בודדת היא תמיד קבוצה דלילה
  belief: >-
    קבוצה של נקודה אחת היא "קטנה", ולכן דלילה בכל מרחב.
  truth: >-
    $\{x\}$ דלילה אם ורק אם $x$ אינה נקודה מבודדת. במטריקה הבדידה $\{x\}=B(x,\frac12)$ פתוחה, ולכן אינה דלילה.
  remedy: { lesson: '2.5', label: 'נקודות מבודדות וקבוצות דלילות' }

- id: MC-c2-union-nowhere-dense
  title: חושבים שאיחוד בן מנייה של דלילות דליל
  belief: >-
    איחוד בן מנייה של קבוצות דלילות הוא קבוצה דלילה, כמו שאיחוד סופי של דלילות דליל.
  truth: >-
    $\mathbb{Q}=\bigcup_{q\in\mathbb{Q}}\{q\}$ הוא איחוד בן מנייה של נקודות, כל אחת דלילה ב-$\mathbb{R}$, והוא צפוף.
    משפט בייר אומר רק שאיחוד כזה אינו יכול להיות **כל** המרחב השלם (ואין לו פנים).
  remedy: { lesson: '2.5', label: 'משפט בייר: מה בדיוק הוא אומר' }

- id: MC-c2-baire-incomplete
  title: מפעילים את משפט בייר במרחב לא שלם
  belief: >-
    אף מרחב מטרי אינו איחוד בן מנייה של קבוצות דלילות.
  truth: >-
    משפט בייר דורש מרחב שלם. $\mathbb{Q}$ עם המרחק הרגיל הוא איחוד בן מנייה של הנקודות שלו, וכל נקודה דלילה בו
    (אין ב-$\mathbb{Q}$ נקודות מבודדות): זו לא סתירה, כי $\mathbb{Q}$ אינו שלם.
  remedy: { lesson: '2.5', label: 'משפט בייר: ההנחה על שלמות' }

- id: MC-c2-isolated-ignored
  title: שוכחים את ההנחה שאין נקודות מבודדות
  belief: >-
    כל מרחב מטרי שלם (לא ריק) אינו בן מנייה.
  truth: >-
    $\mathbb{Z}$, $\mathbb{N}$ עם המטריקה הבדידה וכל מרחב סופי שלמים ובני מנייה. בכולם כל נקודה מבודדת, ולכן
    $\{x\}$ פתוחה ואינה דלילה, ומשפט בייר לא נותן סתירה.
  remedy: { lesson: '2.5', label: 'מרחב שלם בלי נקודות מבודדות' }
