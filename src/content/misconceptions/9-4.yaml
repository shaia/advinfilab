# Misconceptions first detected in lesson 9.4 (integration over sets and volume).
- id: MC-c9-volume-depends-on-box
  title: חושבים שהאינטגרל על קבוצה תלוי בתיבה שבוחרים סביבה, או מתעלמים מהפונקציה המציינת
  belief: >-
    $\int_C f$ הוא האינטגרל של $f$ על התיבה הקטנה ביותר שמכילה את $C$, או שהוא משתנה כשמחליפים את התיבה.
  truth: >-
    $\int_C f=\int_Q f\chi_C$ לתיבה $Q\supseteq C$ כלשהי. הכפל ב-$\chi_C$ מאפס את $f$ מחוץ ל-$C$, ולכן הגדלת
    התיבה מוסיפה רק אזור שבו האינטגרנד 0, והערך אינו תלוי בבחירה.
  remedy: { lesson: '9.4', label: 'אינטגרל על קבוצה: הפונקציה המציינת על תיבה' }

- id: MC-c9-indicator-disc-interior
  title: מחפשים את נקודות האי-רציפות של פונקציה מציינת בקבוצה עצמה במקום בשפה
  belief: >-
    $\chi_C$ אינה רציפה בנקודות של $C$ (או בנקודות הפנים שלה).
  truth: >-
    בנקודת פנים של $C$ הפונקציה $\chi_C$ קבועה 1 בסביבה, ובנקודת פנים של המשלים קבועה 0 בסביבה: שם היא רציפה.
    בנקודת שפה כל סביבה מכילה נקודות משני הסוגים, ולכן התנודה 1. נקודות האי-רציפות הן בדיוק $\partial C$.
  remedy: { lesson: '9.4', label: 'הפונקציה המציינת אינה רציפה בדיוק על השפה' }

- id: MC-c9-bounded-has-volume
  title: חושבים שלכל קבוצה חסומה יש נפח
  belief: >-
    לכל קבוצה חסומה במרחב יש נפח, כי היא נמצאת בתוך תיבה בעלת נפח.
  truth: >-
    לקבוצה חסומה $C$ יש נפח אם ורק אם $\partial C$ ממידה אפס. ל-$\mathbb{Q}^2\cap[0,1]^2$ השפה היא כל
    $[0,1]^2$, ולכן אין לה נפח: בכל חלוקה $U(\chi_C,P)=1$ ו-$L(\chi_C,P)=0$.
  remedy: { lesson: '9.4', label: 'קבוצה חסומה בלי נפח' }

- id: MC-c9-measure-zero-has-volume
  title: חושבים שלכל קבוצה חסומה ממידה אפס יש נפח אפס
  belief: >-
    קבוצה חסומה ממידה אפס היא "קטנה", ולכן יש לה נפח, והוא 0.
  truth: >-
    נפח נקבע לפי השפה, לא לפי הקבוצה. $\mathbb{Q}\cap[0,1]$ ממידה אפס, אבל השפה שלה היא $[0,1]$, שאינה ממידה
    אפס, ולכן אין לה נפח. מה שנכון: לקבוצה בעלת **תכולה** אפס יש נפח 0.
  remedy: { lesson: '9.4', label: 'הרציונליים בקטע: מידה אפס בלי נפח' }

- id: MC-c9-volume-additive-overlap
  title: מחברים נפחים של שתי קבוצות שחותכות זו את זו
  belief: >-
    $v(C\cup D)=v(C)+v(D)$ לכל שתי קבוצות בעלות נפח, ו-$\chi_{C\cup D}=\chi_C+\chi_D$.
  truth: >-
    $\chi_{C\cup D}=\chi_C+\chi_D-\chi_{C\cap D}$, ולכן $v(C\cup D)=v(C)+v(D)-v(C\cap D)$. הנפחים מתחברים רק
    כשהחיתוך בעל נפח 0.
  remedy: { lesson: '9.4', label: 'אדיטיביות: מחסירים את החיתוך' }

- id: MC-c9-boundary-boxes-lower
  title: סופרים בסכום התחתון של פונקציה מציינת תיבות שרק נוגעות בקבוצה
  belief: >-
    כל תת-תיבה שנפגשת עם $C$ תורמת את הנפח שלה ל-$L(\chi_C,P)$.
  truth: >-
    $m_S(\chi_C)=1$ רק כש-$S\subseteq C$; תת-תיבה שחותכת את השפה מכילה גם נקודות מחוץ ל-$C$ ותורמת 0. הסכום
    התחתון סופר את התיבות שבתוך $C$, הסכום העליון את התיבות שנפגשות עם $C$, וההפרש הוא בדיוק התיבות שנפגשות
    עם השפה.
  remedy: { lesson: '9.4', label: 'סכומי דרבו של פונקציה מציינת' }

- id: MC-c9-open-has-volume
  title: חושבים שלכל קבוצה פתוחה וחסומה יש נפח
  belief: >-
    קבוצה פתוחה וחסומה היא איחוד של תיבות פתוחות, ולכן יש לה נפח.
  truth: >-
    לא בהכרח. מכסים את המספרים הרציונליים $r_k$ בקטע $[0,1]$ בקטעים פתוחים באורכים $\frac{\varepsilon}{2^k}$; האיחוד
    $U$ פתוח וחסום, אבל השפה שלו מכילה את $[0,1]\setminus U$, שאינה ממידה אפס כש-$\varepsilon<1$. איחוד **בן
    מנייה** של תיבות אינו חייב להיות בעל נפח.
  remedy: { lesson: '9.4', label: 'קבוצה פתוחה בלי נפח' }
