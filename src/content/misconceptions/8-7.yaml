# Misconceptions first detected in lesson 8.7 (the continuous angle and the fundamental theorem of algebra).
- id: MC-c8-angle-principal-value
  title: לוקחים את הזווית הראשית של כל נקודה במקום פונקציית זווית רציפה
  belief: >-
    פונקציית הזווית של מסילה היא הזווית של $\gamma(t)-p$ בתחום $(-\pi,\pi]$ (או $[0,2\pi)$), ומספר הליפוף הוא ההפרש
    בין הזוויות הראשיות של נקודת הסיום ונקודת ההתחלה.
  truth: >-
    הזווית הראשית קופצת ב-$2\pi$ כשהמסילה חוצה את חצי הציר השלילי (סביב $p$), ולכן אינה רציפה. פונקציית זווית רציפה
    "זוכרת" כמה פעמים הסתובבנו: למעגל $(\cos t,\sin t)$, $t\in[0,4\pi]$, היא $\theta(t)=t$, וההפרש $4\pi$, בעוד ההפרש
    בין הזוויות הראשיות של נקודות הקצה הוא 0.
  remedy: { lesson: '8.7', label: 'פונקציית זווית רציפה' }

- id: MC-c8-angle-lift-uniqueness
  title: חושבים שפונקציית זווית רציפה נקבעת לגמרי, או שאפשר לשנות אותה בכפולה אחרת של שתיים פאי בכל נקודה
  belief: >-
    לכל מסילה יש פונקציית זווית רציפה אחת בלבד; או להפך: בכל $t$ הזווית נקבעת רק עד כדי $2\pi k(t)$, ולכן
    $\theta(b)-\theta(a)$ תלוי בבחירות.
  truth: >-
    שתי פונקציות זווית רציפות $\theta_1,\theta_2$ של אותה מסילה נבדלות בקבוע: $\theta_2-\theta_1$ רציפה ומקבלת ערכים
    ב-$2\pi\mathbb{Z}$, ולפי משפט ערך הביניים היא קבועה. לכן $\theta(b)-\theta(a)$ אינו תלוי בבחירה, ומספר הליפוף מוגדר
    היטב. בלי דרישת הרציפות אפשר היה לקבל כל כפולה של $2\pi$.
  remedy: { lesson: '8.7', label: 'יחידות פונקציית הזווית' }

- id: MC-c8-leash-any-closeness
  title: חושבים שכל מסילה קרובה למסילה אחרת מקיפה את הנקודה אותו מספר פעמים
  belief: >-
    אם $\sigma$ קרובה ל-$\gamma$ "בערך כמו" המרחק של $\gamma$ מ-$p$ (למשל המרחק המקסימלי ביניהן קטן מהמרחק המקסימלי
    של $\gamma$ מ-$p$, או קטן מפעמיים המרחק), אז $\operatorname{Ind}(\sigma,p)=\operatorname{Ind}(\gamma,p)$.
  truth: >-
    למת הרצועה דורשת $\|\sigma(t)-\gamma(t)\|<\|\gamma(t)-p\|$ **לכל** $t$, באותו $t$. עם פי 2 היא נכשלת: למעגל היחידה
    $\gamma$ סביב הראשית ולמסילה הקבועה $\sigma\equiv(\frac12,0)$ מתקיים $\|\sigma(t)-\gamma(t)\|\le\frac32<2\|\gamma(t)\|$,
    אבל מספרי הליפוף 1 ו-0.
  remedy: { lesson: '8.7', label: 'למת הרצועה' }

- id: MC-c8-leash-strict-role
  title: לא מבינים מה תפקיד אי-השוויון החזק בלמת הרצועה
  belief: >-
    אם בלמת הרצועה מחליפים את $<$ ב-$\le$, הכלב יכול לעבור "מהצד השני" של העמוד ולהקיף אותו מספר שונה של פעמים; או
    להפך: החזקות היא עניין טכני, והמסקנה נכונה גם עם $\le$ בלי שום תוספת.
  truth: >-
    החזקות מבטיחה ש-$\sigma(t)\ne p$. עם $\le$ המסילה הקבועה $\sigma\equiv p$ מקיימת את התנאי בשוויון, ו-$\operatorname{Ind}(\sigma,p)$
    אינו מוגדר. אבל אם $\sigma$ אינה עוברת ב-$p$, גם $\le$ מספיק: המנה $\frac{\sigma(t)-p}{\gamma(t)-p}$ נמצאת בעיגול
    הסגור $B[1,1]$ בלי 0, שמוכל בחצי המישור $\operatorname{Re}w>0$.
  remedy: { lesson: '8.7', label: 'למת הרצועה' }

- id: MC-c8-winding-of-sum
  title: חושבים שמספר הליפוף של סכום של שתי מסילות הוא סכום מספרי הליפוף
  belief: >-
    המסילה $\gamma(t)+\delta(t)$ מקיפה את הראשית $\operatorname{Ind}(\gamma,0)+\operatorname{Ind}(\delta,0)$ פעמים; למשל
    מעגל שעליו "רוכב" מעגל קטן שמסתובב 5 פעמים מקיף את הראשית 6 פעמים.
  truth: >-
    זוויות מתחברות במכפלה (של מספרים מרוכבים), לא בסכום. בסכום מכריע המחובר הדומיננטי: אם $\|\delta(t)\|<\|\gamma(t)\|$
    לכל $t$, אז לפי למת הרצועה $\operatorname{Ind}(\gamma+\delta,0)=\operatorname{Ind}(\gamma,0)$. כך
    $(2\cos t+\frac12\cos5t,\ \sin t+\frac12\sin5t)$ מקיפה את הראשית פעם אחת.
  remedy: { lesson: '8.7', label: 'למת הרצועה' }

- id: MC-c8-fta-every-radius
  title: חושבים שפולינום ממעלה n מקיף את האפס n פעמים על כל מעגל
  belief: >-
    לכל $R>0$ (שאין שורש על המעגל $|z|=R$), המסילה $q(Re^{it})$, $t\in[0,2\pi]$, מקיפה את 0 בדיוק $\deg q$ פעמים.
  truth: >-
    זה נכון רק כש-$R$ גדול מספיק כדי ש-$z^n$ ישלוט: $|q(z)-z^n|<|z|^n$ על המעגל. ל-$q(z)=z-2$ ו-$R=1$ המסילה היא מעגל
    ברדיוס 1 סביב $(-2)$, שאינו מקיף את 0. ל-$z^3-2z$ על $|z|=1$ שולט $(-2z)$, ומספר הליפוף 1, לא 3.
  remedy: { lesson: '8.7', label: 'המשפט היסודי של האלגברה' }

- id: MC-c8-fta-proof-roles
  title: מבלבלים את תפקידי השלבים בהוכחת המשפט היסודי של האלגברה
  belief: >-
    ההנחה $n\ge1$ נחוצה כדי שהמסילה תהיה סגורה או כדי שההומוטופיה לא תעבור ב-0; או: למת הרצועה מעבירה שורשים מ-$z^n$
    ל-$q$.
  truth: >-
    כל הנחה עובדת במקום אחד. "אין שורש" נחוצה רק כדי ש-$H(s,t)=q(sRe^{it})$ לא תעבור ב-0; $n\ge1$ נחוצה רק בסתירה
    הסופית, $n\ne0$ (לפולינום הקבוע 1 שני החישובים נותנים 0, ואין סתירה). למת הרצועה משווה מספרי ליפוף, לא שורשים.
  remedy: { lesson: '8.7', label: 'הוכחת המשפט היסודי של האלגברה' }
