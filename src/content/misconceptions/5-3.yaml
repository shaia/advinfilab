# Misconceptions first detected in lesson 5.3 (differentiability).
- id: MC-c5-remainder-not-divided
  title: שוכחים לחלק את השארית בגודל התזוזה
  belief: >-
    $f$ דיפרנציאבילית ב-$a$ אם יש $T$ לינארית כך ש-$f(a+h)-f(a)-Th\to0$.
  truth: >-
    כל פונקציה רציפה מקיימת את זה עם כל $T$. ההגדרה דורשת שהשארית תהיה קטנה **ביחס** לתזוזה:
    $\frac{\|f(a+h)-f(a)-Th\|}{\|h\|}\to0$, כלומר $r(h)=o(\|h\|)$.
  remedy: { lesson: '5.3', label: 'הגדרת הדיפרנציאביליות: השארית קטנה ביחס ל-h' }

- id: MC-c5-partials-imply-differentiable
  title: חושבים שקיום הנגזרות החלקיות גורר דיפרנציאביליות
  belief: >-
    אם כל הנגזרות החלקיות קיימות ב-$a$, $f$ דיפרנציאבילית ב-$a$ ו-$Df(a)$ היא מטריצת הנגזרות החלקיות.
  truth: >-
    הנגזרות החלקיות נותנות רק את המועמד היחיד. צריך עוד לבדוק שהשארית $o(\|h\|)$. ל-$\sqrt{|xy|}$ ול-$\frac{x^3}{x^2+y^2}$
    יש נגזרות חלקיות בראשית, והן אינן דיפרנציאביליות שם. תנאי מספיק הוא נגזרות חלקיות **רציפות** (שיעור 5.4).
  remedy: { lesson: '5.3', label: 'נגזרות חלקיות בלי דיפרנציאביליות' }

- id: MC-c5-gateaux-enough
  title: חושבים שנגזרות כיווניות לינאריות בכיוון הן דיפרנציאביליות
  belief: >-
    אם $D_vf(a)$ קיימת לכל $v$ ו-$v\mapsto D_vf(a)$ לינארית, $f$ דיפרנציאבילית ב-$a$.
  truth: >-
    נגזרות כיווניות בודקות כל ישר בנפרד; דיפרנציאביליות דורשת שהשגיאה תהיה קטנה באחידות בכל הכיוונים. הפונקציה
    ששווה 1 על הפרבולה $y=x^2$ ($x\ne0$) ו-0 בכל מקום אחר: כל הנגזרות הכיווניות בראשית 0, והיא אפילו אינה רציפה שם.
  remedy: { lesson: '5.3', label: 'נגזרות כיווניות לינאריות ועדיין לא דיפרנציאבילית' }

- id: MC-c5-differential-is-value
  title: מבלבלים בין הדיפרנציאל לבין ערך, מספר או העתקה אפינית
  belief: >-
    $Df(a)$ הוא מספר, הערך $f(a)$, הקירוב האפיני $h\mapsto f(a)+Th$, או מטריצה שקיימת רק כשיש קואורדינטות.
  truth: >-
    $Df(a)$ היא **העתקה לינארית** מהמרחב של התזוזות $h$ למרחב הטווח, שמקרבת את ההפרש $f(a+h)-f(a)$. מטריצת יעקובי
    היא הרישום שלה בבסיס הסטנדרטי; במרחב נורמי כללי היא העתקה לינארית חסומה.
  remedy: { lesson: '5.3', label: 'הדיפרנציאל כהעתקה לינארית' }

- id: MC-c5-jacobian-transpose
  title: מחליפים שורות ועמודות במטריצת יעקובי
  belief: >-
    השורה ה-$i$ של $J_f(a)$ היא הנגזרות של כל הרכיבים לפי $x_i$.
  truth: >-
    $J_f(a)$ היא מטריצה $m\times n$ עם האיבר $\frac{\partial f_i}{\partial x_j}(a)$ בשורה $i$ ובעמודה $j$: שורה לכל
    רכיב (הגרדיאנט שלו), עמודה לכל משתנה. רק כך $Df(a)h=J_f(a)h$.
  remedy: { lesson: '5.3', label: 'מטריצת יעקובי: שורה לכל רכיב' }

- id: MC-c5-differential-not-unique
  title: חושבים שייתכנו כמה דיפרנציאלים
  belief: >-
    כמה העתקות לינאריות שונות יכולות לקיים את הגדרת הדיפרנציאביליות באותה נקודה.
  truth: >-
    אם $T$ ו-$S$ מקיימות את ההגדרה, אז $\frac{\|(T-S)h\|}{\|h\|}\to0$; על הישר $h=tv$ היחס קבוע, ולכן $Tv=Sv$ לכל $v$.
    הדיפרנציאל יחיד, ולכן כשהנגזרות החלקיות קיימות יש מועמד אחד בלבד.
  remedy: { lesson: '5.3', label: 'יחידות הדיפרנציאל' }

- id: MC-c5-formula-at-point
  title: מחשבים נגזרת בנקודה מיוחדת מנוסחה שתקפה רק מחוצה לה
  belief: >-
    אם הנוסחה של $\frac{\partial f}{\partial x}$ (שהתקבלה מכללי הגזירה) אינה מוגדרת בנקודה, הנגזרת שם אינה קיימת;
    ואם לנוסחה אין גבול בנקודה, הנגזרת שם אינה קיימת.
  truth: >-
    כללי הגזירה תקפים רק היכן שהם הופעלו. בנקודה המיוחדת מחשבים מההגדרה: ל-$\sqrt{|xy|}$
    $\frac{f(t,0)-f(0,0)}{t}=0$, ול-$(x^2+y^2)\sin\frac{1}{\sqrt{x^2+y^2}}$ הנגזרת בראשית 0 אף שלנוסחה אין שם גבול.
  remedy: { lesson: '5.3', label: 'נגזרת בנקודה מיוחדת: מההגדרה' }
