# Misconceptions first detected in lesson 1.8 (bounded linear maps and the operator norm).
- id: MC-c1-bounded-image
  title: חושבים ש"העתקה לינארית חסומה" פירושה תמונה חסומה
  belief: >-
    $T$ חסומה אם יש $M$ עם $\|Tx\|\le M$ לכל $x$.
  truth: >-
    רק העתקת האפס מקיימת זאת, כי $\|T(tx)\|=|t|\,\|Tx\|$ (דוגמה 2 בשיעור 1.8). "חסומה" פירושו $\|Tx\|\le M\|x\|$
    לכל $x$ (הגדרה 1.8.1), ולפי משפט 1.8.2 זה שקול לחסם על כדור היחידה.
  remedy: { lesson: '1.8', anchor: bounded-def, label: 'ההגדרה של העתקה לינארית חסומה' }

- id: MC-c1-linear-structure-ignored
  title: מתייחסים להעתקה לינארית כמו לפונקציה כללית
  belief: >-
    רציפות באפס לא אומרת דבר על נקודות אחרות, וחסם על כדור היחידה לא אומר דבר על וקטורים ארוכים.
  truth: >-
    לינאריות מעבירה הכול: $\|Tx-Ty\|=\|T(x-y)\|$, כך שרציפות באפס היא רציפות בכל נקודה (ואפילו ליפשיציות),
    ו-$\|Tx\|=\|x\|\,\|T(\frac{x}{\|x\|})\|$ מעביר חסם מספרת היחידה לכל $x$ (משפט 1.8.2). בלי לינאריות זה נשבר:
    $x^2$ חסומה על $[-1,1]$ ואין לה קבוע $M$.
  remedy: { lesson: '1.8', anchor: cont-bounded, label: 'רציפה באפס, רציפה, חסומה' }

- id: MC-c1-linear-always-continuous
  title: חושבים שכל העתקה לינארית רציפה
  belief: >-
    העתקות לינאריות הן "הכי פשוטות", ולכן תמיד רציפות, גם במרחב ממימד אינסופי.
  truth: >-
    הגזירה על הפולינומים ב-$[0,1]$ עם נורמת הסופרמום לינארית ואינה חסומה: $\|x^n\|_\infty=1$ ו-$\|nx^{n-1}\|_\infty=n$
    (טענה 1.8.11). גם $f\mapsto f(0)$ על $C[0,1]$ עם נורמת האינטגרל (טענה 1.8.12). במרחב האוקלידי כל העתקה
    לינארית רציפה; זו טענה 1.8.7, וההוכחה שלה משתמשת בבסיס סופי.
  remedy: { lesson: '1.8', anchor: unbounded-deriv, label: 'הגזירה אינה חסומה' }

- id: MC-c1-opnorm-rowcol-swap
  title: מחליפים בין סכום שורות לסכום עמודות
  belief: >-
    $\|A\|_{\mathrm{op}}$ בנורמת אינסוף הוא הסכום המקסימלי של עמודה, ובנורמת 1 של שורה.
  truth: >-
    בנורמת אינסוף: $\max_i\sum_j|a_{ij}|$, סכום **שורה**, כי כל רכיב של $Ax$ הוא שורה כפול $x$ (משפט 1.8.9). בנורמת
    1: $\max_j\sum_i|a_{ij}|$, סכום **עמודה**, כי $Ax$ הוא צירוף של העמודות (משפט 1.8.8).
  remedy: { lesson: '1.8', anchor: matrix-norms, label: 'נורמת אופרטור של מטריצה' }

- id: MC-c1-opnorm-entrywise
  title: מחשבים נורמת אופרטור מתוך הכניסות בלבד
  belief: >-
    $\|A\|_{\mathrm{op}}$ הוא הכניסה הגדולה ביותר, סכום כל הכניסות, או $\sqrt{\sum a_{ij}^2}$.
  truth: >-
    נורמת האופרטור היא $\sup_{\|x\|\le1}\|Ax\|$ ותלויה בנורמות שנבחרו. $\sqrt{\sum a_{ij}^2}$
    רק **חוסם** את $\|A\|_2$ מלמעלה (טענה 1.8.10ב): ל-$\begin{pmatrix}1&1\\0&1\end{pmatrix}$ הוא $\sqrt3\approx1.732$
    והנורמה $\frac{1+\sqrt5}{2}\approx1.618$.
  remedy: { lesson: '1.8', anchor: matrix-norms, label: 'נורמת אופרטור של מטריצה' }

- id: MC-c1-opnorm-2-eigen
  title: חושבים שהנורמה האוקלידית של מטריצה היא הערך העצמי הגדול
  belief: >-
    $\|A\|_2=\max|\lambda|$ על הערכים העצמיים של $A$.
  truth: >-
    $\|A\|_2=\sqrt{\lambda_{\max}(A^TA)}$ (משפט 1.8.10). זה שווה ל-$\max|\lambda|$ כש-$A$ סימטרית (מסקנה 1.8.10א), לא
    באופן כללי: ל-$\begin{pmatrix}0&1\\0&0\end{pmatrix}$ הערך העצמי היחיד 0 והנורמה 1, ול-$\begin{pmatrix}1&1\\0&1\end{pmatrix}$
    כל הערכים העצמיים 1 והנורמה $\frac{1+\sqrt5}{2}$.
  remedy: { lesson: '1.8', anchor: norm-2, label: 'הנורמה האוקלידית של מטריצה' }

- id: MC-c1-opnorm-test-one
  title: מחשבים נורמת אופרטור לפי וקטור אחד
  belief: >-
    מציבים וקטור "טבעי" אחד, למשל $f\equiv1$, והתוצאה היא נורמת האופרטור.
  truth: >-
    וקטור אחד נותן רק חסם מלרע: $\|T\|\ge\frac{\|Tx\|}{\|x\|}$ (טענה 1.8.4). ל-$Tf=\int_0^1(2x-1)f(x)\,dx$ על
    $(C[0,1],\|\cdot\|_\infty)$ הצבת $f\equiv1$ נותנת 0, ובכל זאת $\|T\|=\frac12$ (ועם $\|\cdot\|_1$ על אותו מרחב
    הנורמה 1). צריך גם חסם מלעיל שמתקיים לכל $x$.
  remedy: { lesson: '1.8', anchor: upper-lower, label: 'חסם מלעיל וחסם מלרע לנורמה' }

- id: MC-c1-sup-attained
  title: חושבים שהסופרמום בנורמת האופרטור תמיד מתקבל
  belief: >-
    יש תמיד $x$ עם $\|x\|\le1$ ו-$\|Tx\|=\|T\|$.
  truth: >-
    למטריצות בנורמות 1, 2 ואינסוף זה נכון, והוכחנו את זה בבנייה מפורשת (משפטים 1.8.8–1.8.10); במימד סופי עם נורמה
    כלשהי זה נובע מקומפקטיות (פרק 3). ב-$C[0,1]$ עם נורמת הסופרמום, ל-$Tf=\int_0^1(2x-1)f$ הנורמה $\frac12$ מתקבלת
    רק כגבול: היא דורשת $f=\operatorname{sign}(2x-1)$, שאינה רציפה. דוגמה 5 בשיעור 1.8 מוכיחה בדיוק את זה, לפונקציונל
    $\int_0^{1/2}f-\int_{1/2}^1f$ (שוויון היה מכריח את $f$ לקפוץ ב-$\frac12$). גם הגזירה בנורמת $C^1$ (טענה
    1.8.11(ב)) אינה משיגה את הנורמה שלה.
  remedy: { lesson: '1.8', anchor: ex-1-8-5, label: 'נורמה שאינה מתקבלת' }
