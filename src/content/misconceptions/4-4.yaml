# Misconceptions first detected in lesson 4.4 (separability).
- id: MC-c4-separable-countable
  title: חושבים שמרחב ספרבילי הוא מרחב בן מנייה
  belief: >-
    "ספרבילי" פירושו שיש במרחב מספר בן מנייה של נקודות, ולכן מרחב לא בן מנייה כמו $\mathbb{R}$ או מרחב קומפקטי כמו
    $[0,1]$ אינו ספרבילי.
  truth: >-
    ספרבילי פירושו שיש **תת-קבוצה** בת מנייה צפופה. $\mathbb{R}$ אינו בן מנייה, ו-$\mathbb{Q}$ צפופה בו: הוא
    ספרבילי.
  remedy: { lesson: '4.4', label: 'ההגדרה של מרחב ספרבילי' }

- id: MC-c4-separable-set-not-metric
  title: חושבים שספרביליות היא תכונה של הקבוצה ולא של המטריקה
  belief: >-
    $\mathbb{R}$ ספרבילי, ולכן הוא ספרבילי עם כל מטריקה, גם הבדידה.
  truth: >-
    צפיפות תלויה במטריקה. במטריקה הבדידה כל נקודה היא כדור פתוח $B(x,\frac12)=\{x\}$, ולכן הקבוצה הצפופה היחידה
    היא כל המרחב. $\mathbb{R}$ עם המטריקה הבדידה אינו ספרבילי.
  remedy: { lesson: '4.4', label: 'ספרביליות במטריקה הבדידה' }

- id: MC-c4-dense-subset-restricts
  title: חושבים שחיתוך של קבוצה צפופה עם תת-מרחב צפוף בתת-המרחב
  belief: >-
    אם $D$ צפופה ב-$X$ ו-$A\subseteq X$, אז $D\cap A$ צפופה ב-$A$, וזו כל ההוכחה שתת-מרחב של מרחב ספרבילי ספרבילי.
  truth: >-
    $\mathbb{Q}$ צפופה ב-$\mathbb{R}$, ו-$\mathbb{Q}\cap(\mathbb{R}\setminus\mathbb{Q})=\emptyset$. בהוכחה בוחרים נקודה
    של $A$ בכל כדור $B(d_k,\frac1m)$ שפוגש את $A$.
  remedy: { lesson: '4.4', label: 'תת-מרחב של מרחב ספרבילי' }

- id: MC-c4-complete-separable
  title: חושבים שמרחב שלם, או מרחב בנך, הוא ספרבילי
  belief: >-
    מרחב שלם "מלא" ולכן ספרבילי; או: מרחב קומפקטי ספרבילי כי הוא שלם.
  truth: >-
    שלמות וספרביליות אינן קשורות. $B([0,1])$ שלם (שיעור 2.2) ואינו ספרבילי, ו-$\mathbb{Q}$ ספרבילי ואינו שלם.
    מרחב קומפקטי ספרבילי כי הוא **חסום כליל**.
  remedy: { lesson: '4.4', label: 'קומפקטי גורר ספרבילי: דרך חסימות כליל' }

- id: MC-c4-continuous-dense-in-bounded
  title: חושבים שהפונקציות הרציפות צפופות בפונקציות החסומות
  belief: >-
    כל פונקציה חסומה על $[0,1]$ היא גבול במידה שווה של פונקציות רציפות, ולכן $B([0,1])$ ספרבילי כמו $C[0,1]$.
  truth: >-
    גבול במידה שווה של רציפות רציף (שיעור 0.3), ולכן $C[0,1]$ סגור ב-$B([0,1])$ ושונה ממנו. למשל המרחק של
    $\mathbf{1}_{[0,1/2]}$ מ-$C[0,1]$ הוא $\frac12$.
  remedy: { lesson: '4.4', label: 'B([0,1]) אינו ספרבילי' }

- id: MC-c4-superset-separable
  title: מעבירים ספרביליות מתת-מרחב למרחב הגדול
  belief: >-
    אם יש במרחב תת-מרחב ספרבילי (צפוף או לא), המרחב כולו ספרבילי; או להפך: במרחב לא ספרבילי אין תת-מרחב ספרבילי.
  truth: >-
    ספרביליות עוברת רק **מטה**, לתת-מרחבים. $C[0,1]$ ספרבילי ויושב בתוך $B([0,1])$, שאינו ספרבילי.
  remedy: { lesson: '4.4', label: 'ספרביליות עוברת לתת-מרחבים' }

- id: MC-c4-ball-radius-distance
  title: חושבים שכדורים ברדיוס השווה למרחק בין המרכזים זרים
  belief: >-
    אם המרחק בין כל שתי נקודות בקבוצה הוא 1, הכדורים ברדיוס 1 סביבן זרים.
  truth: >-
    מאי-שוויון המשולש הכדורים זרים כשהרדיוס לכל היותר $\frac12$. ברדיוס גדול מ-$\frac12$ נקודת האמצע
    $\frac{f+g}{2}$ נמצאת בשני הכדורים.
  remedy: { lesson: '4.4', label: 'הכדורים הזרים בהוכחה ש-B([0,1]) אינו ספרבילי' }

- id: MC-c4-pointwise-delta-enough
  title: משתמשים ברציפות בכל נקודה במקום רציפות במידה שווה
  belief: >-
    כדי לקרב פונקציה רציפה על קטע במידה שווה (בקו שבור או בפולינום ברנשטיין) מספיק לבחור לכל $x$ דלתא משלו.
  truth: >-
    הערכה במידה שווה דורשת $\delta$ אחד לכל הנקודות, ואת זה נותן משפט קנטור (שיעור 3.4): פונקציה רציפה על קטע סגור
    רציפה בו במידה שווה. עם $\delta(x)$ שונה לכל נקודה גם צפיפות החלוקה, או $n$, תלויים ב-$x$.
  remedy: { lesson: '4.4', label: 'קירוב בקו שבור: איפה משתמשים בקנטור' }

- id: MC-c4-continuous-is-lipschitz
  title: חושבים שפונקציה רציפה על קומפקטי היא ליפשיצית
  belief: >-
    רציפה על קבוצה קומפקטית גורר רציפה במידה שווה, וזה גורר ליפשיצית.
  truth: >-
    $\sqrt x$ רציפה במידה שווה על $[0,1]$ ואינה ליפשיצית: $\frac{\sqrt x-\sqrt0}{x}=\frac1{\sqrt x}$ אינה חסומה.
    רציפות במידה שווה מספיקה לקירוב בקו שבור; ליפשיץ אינו נחוץ.
  remedy: { lesson: '4.4', label: 'קירוב בקו שבור: קנטור ולא ליפשיץ' }
