# Misconceptions first detected in lesson 4.5 (the Weierstrass approximation theorem).
- id: MC-c4-taylor-approximates
  title: חושבים שהפולינומים של משפט ויירשטראס הם פולינומי טיילור
  belief: >-
    הפולינומים שמקרבים פונקציה רציפה הם פולינומי טיילור שלה, ולכן המשפט דורש גזירות.
  truth: >-
    ל-$|x|$ אין פולינום טיילור ב-0 מסדר 1, ובכל זאת היא גבול במידה שווה של פולינומים על $[-1,1]$. גם לפונקציה חלקה
    כמו $e^{-1/x^2}$ (עם 0 ב-0) כל פולינומי טיילור ב-0 הם אפס. הקירוב של ויירשטראס גלובלי, לא מקומי.
  remedy: { lesson: '4.5', anchor: 'not-taylor', label: 'קירוב גלובלי ולא טיילור' }

- id: MC-c4-interpolation-approximates
  title: חושבים שפולינום שמסכים עם הפונקציה בהרבה נקודות קרוב אליה במידה שווה
  belief: >-
    משפט ויירשטראס אומר שאפשר להעביר פולינום דרך כמה נקודות שרוצים על הגרף, ולכן פולינום אינטרפולציה מקרב היטב.
  truth: >-
    הסכמה בנקודות לא אומרת דבר על מה שקורה ביניהן: $\sin(n\pi x)$ מתאפסת בכל $n+1$ הנקודות $\frac kn$, ולכן פולינום
    האינטרפולציה שלה בנקודות האלה הוא $0$, אבל המרחק בסופרמום ביניהם $1$. המשפט מבטיח $\max|f-p|<\varepsilon$, לא הסכמה
    בנקודות; ופולינומי ברנשטיין, שמקרבים, אינם עוברים בכלל דרך הנקודות.
  remedy: { lesson: '4.5', anchor: 'slow', label: 'מה המשפט מבטיח' }

- id: MC-c4-weierstrass-noncompact
  title: מפעילים את משפט ויירשטראס על תחום שאינו קטע סגור
  belief: >-
    כל פונקציה רציפה על $\mathbb{R}$, או חסומה ורציפה על $(0,1)$, היא גבול במידה שווה של פולינומים שם.
  truth: >-
    על $\mathbb{R}$ גבול במידה שווה של פולינומים הוא פולינום (הפרש של שני פולינומים חסום על $\mathbb{R}$ רק אם
    הוא קבוע), ולכן $\sin x$ אינה כזה. על $(0,1)$ כל פולינום רציף במידה שווה, וכך גם כל גבול במידה שווה שלהם, ו-$\sin\frac1x$
    אינה רציפה במידה שווה.
  remedy: { lesson: '4.5', anchor: 'closed-interval', label: 'למה קטע סגור' }

- id: MC-c4-poly-limit-poly
  title: חושבים שגבול במידה שווה של פולינומים על קטע הוא פולינום
  belief: >-
    הפולינומים סגורים ב-$C[0,1]$: גבול של פולינומים הוא פולינום.
  truth: >-
    לפי משפט ויירשטראס הסגור של הפולינומים הוא כל $C[0,1]$, למשל $e^x$ ו-$|x-\frac12|$, שאינן פולינומים. (על
    $\mathbb{R}$ כולו הטענה דווקא נכונה, בגלל שהתחום אינו חסום.)
  remedy: { lesson: '4.5', anchor: 'dense', label: 'הפולינומים צפופים ואינם סגורים' }

- id: MC-c4-bernstein-interpolates
  title: חושבים שפולינום ברנשטיין שווה לפונקציה בנקודות החלוקה
  belief: >-
    $B_nf(\frac kn)=f(\frac kn)$ לכל $k$, כמו בקו שבור.
  truth: >-
    $B_nf(x)$ הוא ממוצע משוקלל של כל הערכים $f(\frac kn)$, ולכן השוויון $B_nf=f$ מובטח לכל $f$ רק בקצוות 0 ו-1 (לפונקציות מסוימות, כמו $c_0+c_1x$, יש שוויון בכל מקום). למשל עבור
    $f(x)=|x-\frac12|$: $B_4f(\frac14)=\frac{71}{256}\ne\frac14$.
  remedy: { lesson: '4.5', anchor: 'slow', label: 'פולינומי ברנשטיין: ממוצע משוקלל' }

- id: MC-c4-moments-finite
  title: חושבים שמספר סופי של מומנטים מתאפסים מספיק כדי שהפונקציה תתאפס
  belief: >-
    אם $\int_0^1 f(x)x^n\,dx=0$ ל-$n=0,1,\dots,N$, אז $f\equiv0$.
  truth: >-
    $f(x)=6x^2-6x+1$ מקיימת $\int_0^1 f=0$ ו-$\int_0^1 xf=0$, ואינה אפס. ההוכחה צריכה פולינומים מכל מעלה, כי הקירוב
    של ויירשטראס דורש מעלות שהולכות וגדלות.
  remedy: { lesson: '4.5', anchor: 'moments', label: 'המומנטים: למה צריך את כולם' }

- id: MC-c4-integer-polys-dense
  title: חושבים שכל קבוצה בת מנייה של פולינומים צפופה
  belief: >-
    הפולינומים עם מקדמים שלמים בני מנייה ו"עשירים" מספיק, ולכן גם הם צפופים ב-$C[0,1]$.
  truth: >-
    לפולינום עם מקדמים שלמים $p(0)\in\mathbb{Z}$, ולכן $\|p-\frac12\|_\infty\ge|p(0)-\frac12|\ge\frac12$. צריך מקדמים
    רציונליים, שמקרבים כל מקדם ממשי.
  remedy: { lesson: '4.5', anchor: 'countable-dense', label: 'הקבוצה הצפופה בת המנייה ב-C[0,1]' }

- id: MC-c4-dense-means-closed
  title: חושבים שקבוצה צפופה היא סגורה
  belief: >-
    הפולינומים צפופים ב-$C[0,1]$, ולכן הם קבוצה סגורה (ואולי גם פתוחה), כי "הם ממלאים את המרחב".
  truth: >-
    צפופה פירושו $\overline{A}=X$; סגורה פירושו $\overline{A}=A$. קבוצה שהיא גם צפופה וגם סגורה שווה למרחב כולו, ולכן
    $\mathcal{P}$, שהיא צפופה ו-$e^x\notin\mathcal{P}$, אינה סגורה. וכל כדור סביב פולינום מכיל פונקציה שאינה פולינום, ולכן
    היא גם אינה פתוחה.
  remedy: { lesson: '4.5', anchor: 'dense', label: 'צפופה ואינה סגורה' }

- id: MC-c4-weierstrass-needs-lipschitz
  title: חושבים שהוכחת משפט ויירשטראס צריכה פונקציה ליפשיצית
  belief: >-
    בהוכחה ש-$B_nf\to f$ בוחרים $\delta=\frac\varepsilon L$, ולכן היא עובדת רק כש-$f$ ליפשיצית; ופונקציה רציפה על קטע סגור
    היא ממילא ליפשיצית.
  truth: >-
    $\sqrt x$ רציפה על $[0,1]$ ואינה ליפשיצית ($\frac{\sqrt x}{x}=\frac1{\sqrt x}$ אינה חסומה). ההוכחה של משפט 4.5.4
    משתמשת רק ב-$\delta$ של רציפות במידה שווה, שמשפט קנטור נותן לכל פונקציה רציפה על $[0,1]$. ליפשיץ נותן רק קצב,
    $\frac L{2\sqrt n}$ (טענה 4.5.4א).
  remedy: { lesson: '4.5', anchor: 'theorem', label: 'איפה נכנסה הרציפות במידה שווה' }

- id: MC-c4-all-polys-countable
  title: חושבים שקבוצת כל הפולינומים בת מנייה
  belief: >-
    לכל פולינום יש מספר סופי של מקדמים, ולכן יש רק מנייה פולינומים, והם עצמם הקבוצה הצפופה בת המנייה ב-$C[a,b]$.
  truth: >-
    כבר הפולינומים הקבועים $c\in\mathbb{R}$ אינם בני מנייה. סופיות מספר המקדמים נותנת מנייה רק כשהמקדמים עצמם באים מקבוצה
    בת מנייה, כמו $\mathbb{Q}$: זו מסקנה 4.5.7.
  remedy: { lesson: '4.5', anchor: 'countable-dense', label: 'הפולינומים הרציונליים' }

- id: MC-c4-superset-gives-dense
  title: חושבים שמרחב גדול שמכיל את המרחב נותן לו קבוצה צפופה בת מנייה
  belief: >-
    $C[0,1]$ יושב בתוך $B([0,1])$, ולכן אפשר לקחת קבוצה צפופה בת מנייה מהמרחב הגדול ולסיים.
  truth: >-
    ב-$B([0,1])$ אין קבוצה צפופה בת מנייה: הפונקציות $\chi_{[0,t]}$, $t\in[0,1]$, הן קבוצה לא בת מנייה עם מרחק $1$ בין כל
    שתיים, וכל כדור ברדיוס $\frac12$ מכיל לכל היותר אחת מהן. וגם כשיש קבוצה כזו במרחב הגדול, הנקודות שלה אינן בהכרח בתוך
    המרחב הקטן. צריך קבוצה מפורשת בתוך $C[a,b]$: הפולינומים עם מקדמים רציונליים.
  remedy: { lesson: '4.5', anchor: 'countable-dense', label: 'הקבוצה הצפופה בת המנייה ב-C[a,b]' }
