# Misconceptions first detected in lesson 1.2 (normed spaces and inner products).
- id: MC-c1-every-metric-norm
  title: חושבים שכל מטריקה על מרחב וקטורי באה מנורמה
  belief: >-
    על מרחב וקטורי כל מטריקה היא $\|x-y\|$ לנורמה כלשהי, למשל המטריקה הבדידה היא $\|x-y\|$ עם $\|x\|=1$
    לכל $x\neq0$.
  truth: >-
    מטריקה שבאה מנורמה מקיימת $d(\lambda x,\lambda y)=|\lambda|d(x,y)$ ולכן אינה חסומה (אם $V\neq\{0\}$).
    המטריקה הבדידה, $\min(|x-y|,1)$ ו-$\frac{|x-y|}{1+|x-y|}$ חסומות, ולכן אינן באות מנורמה.
  remedy: { lesson: '1.2', anchor: not-from-norm, label: 'מטריקה שאינה באה מנורמה' }

- id: MC-c1-homogeneity-sign
  title: כותבים הומוגניות בלי ערך מוחלט
  belief: >-
    $\|\lambda x\|=\lambda\|x\|$.
  truth: >-
    $\|\lambda x\|=|\lambda|\,\|x\|$. עם $\lambda=-1$ הגרסה בלי ערך מוחלט נותנת נורמה שלילית. מאותה אקסיומה
    נובעת הסימטריה של המטריקה המושרית: $\|y-x\|=|-1|\,\|x-y\|$.
  remedy: { lesson: '1.2', anchor: norm-def, label: 'האקסיומות של נורמה' }

- id: MC-c1-norm-no-abs
  title: שוכחים ערך מוחלט בחישוב נורמה
  belief: >-
    $\|x\|_1=\sum x_i$, $\|x\|_\infty=\max x_i$ ו-$\|f\|_1=\int_a^b f$.
  truth: >-
    $\|x\|_1=\sum|x_i|$, $\|x\|_\infty=\max|x_i|$, $\|f\|_1=\int_a^b|f|$. בלי ערך מוחלט הווקטור
    $(3,-4,1)$ היה מקבל "נורמה" 0, ו-$3x^2-1$ על $[0,1]$ "נורמת אינטגרל" 0, אף ששניהם אינם אפס.
  remedy: { lesson: '1.2', anchor: p-norms, label: 'חישוב נורמות' }

- id: MC-c1-norm-squared
  title: מבלבלים בין הנורמה לבין הריבוע שלה
  belief: >-
    $\|x\|_2=\sum x_i^2$, או שחוק המקבילית נותן את $\|x-y\|$ ישירות.
  truth: >-
    $\|x\|_2=\sqrt{\sum x_i^2}$, וחוק המקבילית מדבר על ריבועי הנורמות: מקבלים $\|x-y\|^2$ ומוציאים שורש.
  remedy: { lesson: '1.2', anchor: inner-product, label: 'נורמה מתוך מכפלה פנימית' }

- id: MC-c1-unit-ball-swap
  title: מחליפים בין כדורי היחידה של נורמת 1 ונורמת אינסוף
  belief: >-
    כדור היחידה של $\|\cdot\|_1$ במישור הוא ריבוע עם צלעות מקבילות לצירים, ושל $\|\cdot\|_\infty$ הוא מעוין.
  truth: >-
    $|x|+|y|\le1$ הוא מעוין עם קודקודים $(\pm1,0)$, $(0,\pm1)$; $\max(|x|,|y|)\le1$ הוא הריבוע $[-1,1]^2$.
    בדקו נקודה: $(1,1)$ בריבוע, ו-$\|(1,1)\|_1=2$, ולכן היא מחוץ לכדור של נורמת 1.
  remedy: { lesson: '1.2', anchor: unit-balls, label: 'כדורי היחידה של נורמות p' }

- id: MC-c1-norm-order
  title: הופכים את הסדר בין נורמות 1, 2 ואינסוף
  belief: >-
    $\|x\|_1\le\|x\|_2\le\|x\|_\infty$, ולכן כדור היחידה של נורמת 1 הוא הגדול מבין השלושה.
  truth: >-
    $\|x\|_\infty\le\|x\|_2\le\|x\|_1\le n\|x\|_\infty$ ב-$\mathbb{R}^n$. נורמה גדולה יותר נותנת כדור יחידה
    קטן יותר: $B_1\subseteq B_2\subseteq B_\infty$. ובמרחב פונקציות על $[0,1]$: $\|f\|_1\le\|f\|_\infty$.
  remedy: { lesson: '1.2', anchor: compare, label: 'השוואה בין נורמות' }

- id: MC-c1-every-norm-inner
  title: חושבים שכל נורמה באה ממכפלה פנימית
  belief: >-
    כל נורמה מקיימת את חוק המקבילית, ולכן כל נורמה היא $\sqrt{\langle x,x\rangle}$ למכפלה פנימית כלשהי.
  truth: >-
    נורמה שבאה ממכפלה פנימית מקיימת $\|x+y\|^2+\|x-y\|^2=2\|x\|^2+2\|y\|^2$. עם $x=(1,0)$, $y=(0,1)$ נורמת 1
    נותנת $8\neq4$ ונורמת אינסוף $2\neq4$, ולכן הן אינן באות ממכפלה פנימית.
  remedy: { lesson: '1.2', anchor: parallelogram, label: 'חוק המקבילית' }

- id: MC-c1-norms-comparable
  title: חושבים שכל שתי נורמות חוסמות זו את זו
  belief: >-
    לכל שתי נורמות על אותו מרחב יש קבוע $C$ עם $\|f\|_\infty\le C\|f\|_1$, כמו ש-$\|f\|_1\le\|f\|_\infty$
    על $[0,1]$.
  truth: >-
    על $C[0,1]$: $\|x^n\|_\infty=1$ ו-$\|x^n\|_1=\frac{1}{n+1}$, כך שהיחס $n+1$ אינו חסום ואין קבוע כזה.
    במימד סופי זה שונה: שם כל הנורמות שקולות, וזה משפט שיוכח בשיעור 3.5.
  remedy: { lesson: '1.2', anchor: function-norms, label: 'נורמת הסופרמום ונורמת האינטגרל' }
