# Misconceptions first detected in lesson 1.7 (Lipschitz equivalence of metrics).
- id: MC-c1-lipschitz-equiv-one-side
  title: בודקים שקילות ליפשיץ בכיוון אחד בלבד
  belief: >-
    אם $d'\le C\,d$ אז $d$ ו-$d'$ שקולות ליפשיץ.
  truth: >-
    שקילות ליפשיץ דורשת שני קבועים חיוביים: $c\,d\le d'\le C\,d$ (הגדרה 1.7.1). $d'=\min(d,1)$ מקיימת $d'\le d$,
    אבל על $\mathbb{R}$ אין $C$ עם $|x-y|\le C\min(|x-y|,1)$: עם $|x-y|=1000$ צריך $C\ge1000$. ואי-שוויון אחד
    אינו מספיק אפילו לאותן קבוצות פתוחות: על $C[0,1]$, $d_1\le d_\infty$, והקבוצות הפתוחות שונות (טענה 1.7.7).
  remedy: { lesson: '1.7', anchor: one-side, label: 'שקילות ליפשיץ של מטריקות' }

- id: MC-c1-one-side-direction
  title: הופכים את הכיוון של מה שאי-שוויון בין מטריקות נותן
  belief: >-
    אם $d'\le d$ אז כל קבוצה פתוחה ב-$d$ פתוחה ב-$d'$, וכל סדרה שמתכנסת ב-$d'$ מתכנסת ב-$d$.
  truth: >-
    מטריקה קטנה יותר נותנת כדורים גדולים יותר, ולכן פחות קבוצות פתוחות. מ-$d'\le C\,d$ נובע
    $B_d(x,\tfrac rC)\subseteq B_{d'}(x,r)$ (למה 1.7.4): כל קבוצה פתוחה ב-$d'$ פתוחה ב-$d$, וכל סדרה שמתכנסת
    ב-$d$ מתכנסת ב-$d'$. על $C[0,1]$, $d_1\le d_\infty$, והסדרה $g_n(x)=\max(0,1-nx)$ מתכנסת לפונקציית האפס
    ב-$d_1$ ולא ב-$d_\infty$.
  remedy: { lesson: '1.7', anchor: nested, label: 'הלמה על כדורים מקוננים' }

- id: MC-c1-same-open-lipschitz
  title: חושבים שמטריקות עם אותן קבוצות פתוחות שקולות ליפשיץ
  belief: >-
    אם לשתי מטריקות יש אותן קבוצות פתוחות ואותן סדרות מתכנסות, הן שקולות ליפשיץ.
  truth: >-
    שקילות ליפשיץ גוררת אותן קבוצות פתוחות (משפט 1.7.5), אבל לא להפך. $|x-y|$ ו-$\min(|x-y|,1)$ על
    $\mathbb{R}$ נותנות אותם כדורים ברדיוס קטן מ-1, ולכן אותן קבוצות פתוחות ואותן סדרות מתכנסות, ואינן שקולות
    ליפשיץ: $\mathbb{R}$ חסומה באחת ולא בשנייה (טענה 1.7.8).
  remedy: { lesson: '1.7', anchor: not-necessary, label: 'שקילות ליפשיץ מול אותן קבוצות פתוחות' }

- id: MC-c1-discrete-never-equivalent
  title: חושבים שהמטריקה הבדידה אינה שקולה ליפשיץ לשום מטריקה אחרת
  belief: >-
    מטריקה שמקבלת רק את הערכים 0 ו-1 אינה יכולה להיות שקולה ליפשיץ למטריקה אחרת.
  truth: >-
    על קבוצה סופית כל שתי מטריקות שקולות ליפשיץ (טענה 1.7.2א): היחס $\frac{d'(x,y)}{d(x,y)}$ על זוגות שונים
    מקבל מספר סופי של ערכים חיוביים, והוא בין הקטן לגדול שבהם. על $\mathbb{R}$ המטריקה הבדידה ו-$|x-y|$ אינן שקולות בגלל זוגות
    קרובים, כמו $0$ ו-$\frac1n$, שהבדידה רואה במרחק 1.
  remedy: { lesson: '1.7', anchor: discrete-differ, label: 'המטריקה הבדידה מול המטריקה הרגילה' }
