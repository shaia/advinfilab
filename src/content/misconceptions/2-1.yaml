# Misconceptions first detected in lesson 2.1 (Cauchy sequences and complete spaces).
- id: MC-c2-consecutive-terms
  title: מספיק שהמרחק בין איברים עוקבים ישאף לאפס
  belief: >-
    אם $d(x_n,x_{n+1})\to0$, הסדרה היא סדרת קושי.
  truth: >-
    בהגדרת סדרת קושי **כל** שני איברים מ-$N$ והלאה קרובים, לא רק שכנים. ב-$\mathbb{R}$ הסדרה $x_n=\sqrt n$
    מקיימת $\sqrt{n+1}-\sqrt n\to0$, ובכל זאת $|x_{4n}-x_n|=\sqrt n\to\infty$: הצעדים קטנים, אבל מצטברים.
  remedy: { lesson: '2.1', label: 'הגדרת סדרת קושי: כל הזוגות, לא רק שכנים' }

- id: MC-c2-cauchy-negation
  title: שוללים את הגדרת סדרת קושי בלי להפוך את כל הכמתים
  belief: >-
    "הסדרה אינה סדרת קושי" פירושו שלכל $\varepsilon$ יש איברים רחוקים, או שכל האיברים מ-$N$ והלאה רחוקים זה מזה.
  truth: >-
    השלילה היא: קיים $\varepsilon>0$ כך שלכל $N$ יש $m,n>N$ עם $d(x_m,x_n)\ge\varepsilon$. מספיק $\varepsilon$ אחד,
    ובכל זנב מספיק זוג אחד.
  remedy: { lesson: '2.1', label: 'שלילת ההגדרה של סדרת קושי' }

- id: MC-c2-cauchy-needs-limit
  title: חושבים שבהגדרת סדרת קושי מופיע הגבול
  belief: >-
    כדי לבדוק שסדרה היא סדרת קושי צריך לדעת לאן היא שואפת, או שההגדרה היא "האיברים קרובים לנקודה $x$".
  truth: >-
    ההגדרה מדברת רק על המרחקים בין איברי הסדרה עצמם: $d(x_m,x_n)<\varepsilon$ לכל $m,n>N$. בדיוק בזה כוחה: היא
    נבדקת גם כשאין במרחב נקודה שהסדרה שואפת אליה.
  remedy: { lesson: '2.1', label: 'סדרת קושי: הגדרה בלי גבול' }

- id: MC-c2-cauchy-always-converges
  title: מזהים סדרת קושי עם סדרה מתכנסת בכל מרחב
  belief: >-
    "סדרת קושי" ו"סדרה מתכנסת" הם אותו מושג בכל מרחב מטרי, כמו בישר הממשי.
  truth: >-
    כל סדרה מתכנסת היא סדרת קושי בכל מרחב מטרי, אבל הכיוון ההפוך הוא בדיוק ההגדרה של מרחב שלם. ב-$(0,1)$ הסדרה
    $\frac{1}{n+1}$ היא סדרת קושי שאינה מתכנסת במרחב.
  remedy: { lesson: '2.1', label: 'מרחב שלם: הכיוון ההפוך כהגדרה' }

- id: MC-c2-bounded-implies-cauchy
  title: חושבים שסדרה חסומה היא סדרת קושי
  belief: >-
    כל סדרת קושי חסומה, ולכן גם כל סדרה חסומה היא סדרת קושי.
  truth: >-
    הגרירה היא בכיוון אחד בלבד. $(-1)^n$ חסומה ב-$\mathbb{R}$ ואינה סדרת קושי; במטריקה הבדידה הסדרה $x_n=n$ חסומה
    (כל המרחקים לכל היותר 1) וכל שני איברים שונים בה במרחק 1.
  remedy: { lesson: '2.1', label: 'סדרת קושי חסומה, ולא להפך' }

- id: MC-c2-subsequence-enough
  title: מסיקים התכנסות מתת-סדרה מתכנסת בלי תנאי קושי
  belief: >-
    אם לסדרה יש תת-סדרה מתכנסת, הסדרה כולה מתכנסת לאותו גבול.
  truth: >-
    זה נכון רק לסדרת קושי. $(-1)^n$ אינה מתכנסת, אף שהתת-סדרה $(-1)^{2n}=1$ מתכנסת.
  remedy: { lesson: '2.1', label: 'סדרת קושי עם תת-סדרה מתכנסת' }

- id: MC-c2-incomplete-no-cauchy-converges
  title: חושבים שבמרחב לא שלם אף סדרת קושי לא מתכנסת
  belief: >-
    "המרחב אינו שלם" פירושו שסדרות קושי בו אינן מתכנסות, ולכן כל סדרת קושי בו היא עדות לאי-שלמות.
  truth: >-
    מרחב אינו שלם אם **יש** בו סדרת קושי אחת לפחות שאינה מתכנסת. ב-$(0,1)$ הסדרה $\frac12+\frac{1}{4n}$ היא סדרת
    קושי שמתכנסת ל-$\frac12$, שנמצא במרחב; עדות לאי-שלמות היא סדרה כמו $\frac{1}{n+1}$.
  remedy: { lesson: '2.1', label: 'מרחב שלם: קיים מול לכל' }

- id: MC-c2-completeness-topological
  title: חושבים ששלמות נשמרת בהומיאומורפיזם או בהעתקה רציפה
  belief: >-
    אם שתי מטריקות נותנות אותן קבוצות פתוחות, או אם יש הומיאומורפיזם בין שני מרחבים, אחד שלם אם ורק אם השני
    שלם; והעתקה רציפה שולחת סדרות קושי לסדרות קושי.
  truth: >-
    שלמות תלויה במטריקה, לא רק בקבוצות הפתוחות. הזהות $(\mathbb{R},|x-y|)\to(\mathbb{R},|\arctan x-\arctan y|)$
    היא הומיאומורפיזם, הראשון שלם והשני לא ($x_n=n$ היא סדרת קושי בלי גבול). גם $\frac1x$ רציפה על $(0,1)$ ושולחת
    את סדרת הקושי $\frac{1}{n+1}$ ל-$n+1$.
  remedy: { lesson: '2.1', label: 'מטריקת הארקטנגנס' }

- id: MC-c2-complete-closed-bounded
  title: מזהים שלמות עם סגורה וחסומה
  belief: >-
    מרחב שלם הוא מרחב חסום, או קטע סגור; קבוצה לא חסומה כמו $\mathbb{R}$ או $[1,\infty)$ אינה שלמה.
  truth: >-
    שלמות היא תכונה של סדרות קושי, לא של גודל. $\mathbb{R}$ ו-$[1,\infty)$ שלמים ולא חסומים; $(0,1)$ חסום ואינו
    שלם.
  remedy: { lesson: '2.1', label: 'שלמות מול חסימות' }

- id: MC-c2-discrete-incomplete
  title: חושבים שמרחב בדיד עם חורים אינו שלם
  belief: >-
    $\mathbb{N}$ או $\mathbb{Q}$ עם המטריקה הבדידה "מלאים חורים", ולכן אינם שלמים.
  truth: >-
    במטריקה הבדידה כל סדרת קושי קבועה מאינדקס מסוים (עם $\varepsilon=1$: מרחק קטן מ-1 פירושו שוויון), ולכן
    מתכנסת. כל מרחב מטרי בדיד שלם; ה"חורים" הם בעיה של המטריקה הרגילה.
  remedy: { lesson: '2.1', label: 'שלמות במטריקה הבדידה' }

- id: MC-c2-estimate-is-exact
  title: מתייחסים לחסם עליון כאל הערך המדויק
  belief: >-
    חסם שמתקבל מאי-שוויון המשולש או מנוסחת שגיאה הוא הערך עצמו: ה-$N$ שהוא נותן הוא הקטן ביותר, ומספר האיטרציות
    שהוא נותן הוא המספר שבאמת נדרש.
  truth: >-
    חסם מבטיח, הוא לא מודד. ייתכן שהשגיאה האמיתית קטנה בהרבה (באיטרציה לשורש 2, ארבעה צעדים מספיקים לדיוק
    $10^{-6}$ כשהחסם מבקש עשרים), וייתכן ש-$N$ קטן יותר כבר מתאים.
  remedy: { lesson: '2.1', label: 'N שמתאים מול N הקטן ביותר: חסם אינו ערך' }
