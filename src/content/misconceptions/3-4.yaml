# Misconceptions first detected in lesson 3.4 (continuous functions on compact sets).
- id: MC-c3-image-of-closed
  title: חושבים שפונקציה רציפה מעבירה קבוצות סגורות לקבוצות סגורות
  belief: >-
    כמו שהמקור של קבוצה סגורה תחת פונקציה רציפה סגור, גם התמונה של קבוצה סגורה סגורה.
  truth: >-
    רציפות שומרת על סגירות במעבר **למקור**, לא לתמונה. $\arctan(\mathbb{R})=(-\frac\pi2,\frac\pi2)$ אינה סגורה, וגם
    $e^{-x}$ מעבירה את $[0,\infty)$ ל-$(0,1]$. מה שעובר לתמונה הוא קומפקטיות.
  remedy: { lesson: '3.4', anchor: 'not-preserved', label: 'מה רציפות אינה מעבירה לתמונה (טענה 3.4.2)' }

- id: MC-c3-preimage-of-compact
  title: חושבים שהמקור של קבוצה קומפקטית תחת פונקציה רציפה קומפקטי
  belief: >-
    אם $f$ רציפה ו-$K$ קומפקטית, גם $f^{-1}(K)$ קומפקטית.
  truth: >-
    המקור של $K$ סגור, אבל לא בהכרח חסום: עבור הפונקציה הקבועה $f\equiv\frac12$ על $\mathbb{R}$, המקור של $[0,1]$ הוא
    $\mathbb{R}$, ועבור $\sin$ המקור של $\{0\}$ הוא $\pi\mathbb{Z}$.
  remedy: { lesson: '3.4', anchor: 'not-preserved', label: 'תמונה ומקור של קבוצות קומפקטיות (טענה 3.4.2)' }

- id: MC-c3-bounded-attains
  title: חושבים שפונקציה רציפה וחסומה מקבלת מקסימום
  belief: >-
    פונקציה רציפה שהיא חסומה, או שמוגדרת על קבוצה חסומה, מקבלת את הסופרמום שלה.
  truth: >-
    משפט ויירשטראס דורש תחום קומפקטי. $\arctan$ חסומה על $\mathbb{R}$ ולא מקבלת את $\frac\pi2$; הפונקציה $x$ על
    $(0,1)$ לא מקבלת לא מקסימום ולא מינימום.
  remedy: { lesson: '3.4', anchor: 'hypotheses', label: 'משפט ויירשטראס: כל הנחה נחוצה (טענה 3.4.4)' }

- id: MC-c3-uniform-without-compact
  title: חושבים שפונקציה רציפה על קבוצה חסומה או סגורה רציפה בה במידה שווה
  belief: >-
    משפט קנטור צריך רק תחום חסום (או רק סגור), או רק פונקציה חסומה.
  truth: >-
    קנטור דורש תחום קומפקטי. $\frac1x$ ו-$\sin\frac1x$ רציפות על $(0,1]$, שחסומה, ואינן רציפות בו במידה שווה;
    $x^2$ רציפה על $\mathbb{R}$, שסגורה, ואינה רציפה בו במידה שווה.
  remedy: { lesson: '3.4', anchor: 'cantor-fails', label: 'משפט קנטור ומה קורה בלי קומפקטיות (טענה 3.4.7)' }

- id: MC-c3-uniform-is-lipschitz
  title: חושבים שרציפות במידה שווה פירושה δ פרופורציוני לאפסילון
  belief: >-
    אם $f$ רציפה במידה שווה, אפשר תמיד לבחור $\delta=c\,\varepsilon$, כלומר $f$ ליפשיצית.
  truth: >-
    כל פונקציה ליפשיצית רציפה במידה שווה, אבל לא להפך: $\sqrt x$ על $[0,1]$ רציפה בו במידה שווה (קנטור), והמספר
    $\delta$ הגדול ביותר עבור $\varepsilon\le1$ הוא $\varepsilon^2$, לא כפולה של $\varepsilon$.
  remedy: { lesson: '3.4', anchor: 'extension', label: 'משפט קנטור: השורש כדוגמה (מסקנה 3.4.7א)' }

- id: MC-c3-delta-depends-on-point
  title: מחשבים δ בנקודה אחת ומשתמשים בו לכל הנקודות
  belief: >-
    ברציפות במידה שווה מספיק למצוא $\delta$ שעובד בנקודה נוחה, למשל במקום שבו השיפוע קטן.
  truth: >-
    ה-$\delta$ צריך לעבוד בבת אחת לכל זוג נקודות; הנקודה הקובעת היא הגרועה ביותר. עבור $\sqrt x$ על $[0,1]$ זה ליד
    $0$, שם השיפוע אינסופי, ולא ליד $1$.
  remedy: { lesson: '3.4', anchor: 'fig-3-4a', label: 'דלתא אחת לכל הנקודות (איור 3.4א)' }

- id: MC-c3-bijection-homeo
  title: חושבים שכל פונקציה רציפה, חד-חד-ערכית ועל היא הומיאומורפיזם
  belief: >-
    אם $f$ רציפה, חד-חד-ערכית ועל, גם ההופכית שלה רציפה.
  truth: >-
    זה נכון כשהתחום קומפקטי, ונכשל בלעדיו. $t\mapsto(\cos t,\sin t)$ מ-$[0,2\pi)$ על המעגל רציפה, חד-חד-ערכית ועל,
    וההופכית אינה רציפה בנקודה $(1,0)$.
  remedy: { lesson: '3.4', anchor: 'homeo-fails', label: 'הומיאומורפיזם מתחום קומפקטי, ובלעדיו (טענה 3.4.9)' }

- id: MC-c3-closed-distance-attained
  title: חושבים שהמרחק מנקודה לכל קבוצה סגורה מתקבל
  belief: >-
    אם $A$ סגורה, יש $a\in A$ עם $d(x,a)=d(x,A)$.
  truth: >-
    זה נכון כש-$A$ קומפקטית, וגם לקבוצה סגורה ב-$\mathbb{R}^n$ (דרך קבוצה קומפקטית: החיתוך עם כדור סגור). באופן
    כללי זה נכשל: ב-$B(\mathbb{N})$ הקבוצה $\{(1+\frac1n)e_n\}$ סגורה, המרחק שלה מ-0 הוא 1, ואף נקודה בה אינה
    במרחק 1.
  remedy: { lesson: '3.4', anchor: 'distance', label: 'המרחק מנקודה לקבוצה (טענה 3.4.10)' }

- id: MC-c3-disjoint-closed-distance
  title: חושבים ששתי קבוצות סגורות וזרות נמצאות תמיד במרחק חיובי זו מזו
  belief: >-
    אם $A$ ו-$B$ סגורות, לא ריקות וזרות, אז $\operatorname{dist}(A,B)>0$.
  truth: >-
    זה נכון כשאחת מהן קומפקטית (טענה 3.4.10(ג)), ונכשל בלי זה: ב-$\mathbb{R}^2$ הענף $\{xy=1,\ x>0\}$ וציר ה-$x$
    סגורים וזרים, והמרחק בין $(n,\frac1n)$ ל-$(n,0)$ הוא $\frac1n$, ולכן המרחק בין הקבוצות 0.
  remedy: { lesson: '3.4', anchor: 'distance', label: 'מרחק בין קבוצה קומפקטית לקבוצה סגורה (טענה 3.4.10(ג))' }

- id: MC-c3-inf-positive
  title: חושבים שלפונקציה חיובית יש אינפימום חיובי
  belief: >-
    אם $g(x)>0$ לכל $x$ בקבוצה, אז $\inf g>0$.
  truth: >-
    $g(x)=x$ על $(0,1]$ חיובית ו-$\inf g=0$. על קבוצה קומפקטית ועם $g$ רציפה האינפימום מתקבל, ולכן הוא חיובי.
    זה בדיוק התפקיד של הקומפקטיות בהוכחות כמו שקילות הנורמות.
  remedy: { lesson: '3.4', anchor: 'inf-positive', label: 'אינפימום חיובי על קבוצה קומפקטית (מסקנה 3.4.5)' }

- id: MC-c3-theorem-converse
  title: חושבים שאם הנחה של משפט נכשלת, גם המסקנה נכשלת
  belief: >-
    $(0,1]$ אינה קומפקטית, ולכן אף פונקציה עליה אינה רציפה במידה שווה ואף פונקציה עליה לא מקבלת מקסימום.
  truth: >-
    משפטי הקומפקטיות נותנים תנאי מספיק, לא הכרחי. $x\sin\frac1x$ רציפה במידה שווה על $(0,1]$ (היא ממשיכה ברציפות
    ל-$[0,1]$), ו-$x(1-x)$ מקבלת מקסימום על $(0,1)$. כשהנחה נכשלת צריך לבדוק את המקרה הספציפי.
  remedy: { lesson: '3.4', anchor: 'extension', label: 'מה המשפטים אומרים ומה לא (מסקנה 3.4.7א)' }
