# Misconceptions first detected in lesson 3.5 (equivalent norms).
- id: MC-c3-one-sided-bound
  title: מסתפקים באי-שוויון אחד בין שתי נורמות
  belief: >-
    אם $\|x\|_a\le C\|x\|_b$ לכל $x$, הנורמות שקולות; או שאפשר להפוך את אי-השוויון עם אותו קבוע.
  truth: >-
    שקילות דורשת שני אי-שוויונים, $c\|x\|_a\le\|x\|_b\le C\|x\|_a$ עם $c,C>0$. ב-$C[0,1]$ מתקיים
    $\|f\|_1\le\|f\|_\infty$, אבל $\|x^n\|_\infty=1$ ו-$\|x^n\|_1=\frac1{n+1}$, ולכן אין $C$ עם
    $\|f\|_\infty\le C\|f\|_1$.
  remedy: { lesson: '3.5', label: 'ההגדרה של נורמות שקולות' }

- id: MC-c3-equivalent-same-numbers
  title: חושבים שנורמות שקולות נותנות אותם מספרים או אותם כדורים
  belief: >-
    לנורמות שקולות יש אותו כדור יחידה, אותם מרחקים או אותה נורמת אופרטור.
  truth: >-
    שקילות שומרת על מושגים "איכותיים": סדרות מתכנסות, סדרות קושי, קבוצות פתוחות, חסומות וקומפקטיות. המספרים
    משתנים: כדור היחידה של $\|\cdot\|_1$ במישור הוא ריבוע מסובב ושל $\|\cdot\|_\infty$ ריבוע, ונורמת האופרטור של
    המטריצה $\begin{pmatrix}1&2\\3&4\end{pmatrix}$ היא 6 בנורמה 1 ו-7 בנורמת אינסוף.
  remedy: { lesson: '3.5', label: 'מה נשמר תחת שקילות נורמות' }

- id: MC-c3-all-norms-infinite-dim
  title: חושבים שכל שתי נורמות על כל מרחב וקטורי שקולות
  belief: >-
    המשפט "כל הנורמות שקולות" נכון בכל מרחב נורמי, ולכן התכנסות בנורמה אחת היא התכנסות בכל נורמה.
  truth: >-
    המשפט נכון במרחב ממימד סופי, וההוכחה משתמשת בקומפקטיות של ספרת היחידה. ב-$C[0,1]$ הנורמות $\|\cdot\|_1$
    ו-$\|\cdot\|_\infty$ אינן שקולות: $x^n\to0$ בנורמה 1 ולא בנורמת הסופרמום.
  remedy: { lesson: '3.5', label: 'נורמות לא שקולות במרחב הפונקציות הרציפות' }

- id: MC-c3-linear-always-continuous
  title: חושבים שכל העתקה לינארית רציפה
  belief: >-
    העתקה לינארית בין מרחבים נורמיים תמיד רציפה, כמו מטריצה.
  truth: >-
    כשהתחום ממימד סופי זה נכון, כי כל הנורמות עליו שקולות. במימד אינסופי לא: הפונקציונל $f\mapsto f(0)$ על
    $(C[0,1],\|\cdot\|_1)$ אינו חסום, כי $f_n(x)=\max(1-nx,0)$ מקיימת $\|f_n\|_1=\frac1{2n}$ ו-$f_n(0)=1$.
  remedy: { lesson: '3.5', label: 'כל העתקה לינארית על המרחב האוקלידי רציפה' }

- id: MC-c3-best-constant
  title: מבלבלים בין קבוע שמקיים אי-שוויון לבין הקבוע הטוב ביותר
  belief: >-
    הקבוע שיוצא משרשרת אי-שוויונים, כמו $\|x\|_1\le n\|x\|_\infty\le n\|x\|_2$, הוא הקבוע הטוב ביותר.
  truth: >-
    שרשרת נותנת קבוע שעובד, לא בהכרח את הקטן ביותר. הקבוע הטוב ביותר ב-$\|x\|_1\le C\|x\|_2$ הוא $\sqrt n$ (קושי-שוורץ),
    ומראים שאי אפשר להקטין אותו בווקטור שבו יש שוויון, כאן $(1,\dots,1)$.
  remedy: { lesson: '3.5', label: 'הקבועים בין נורמות 1, 2 ואינסוף' }
