# Misconceptions first detected in lesson 3.5 (equivalent norms).
- id: MC-c3-one-sided-bound
  title: מסתפקים באי-שוויון אחד בין שתי נורמות
  belief: >-
    אם $\|x\|_a\le C\|x\|_b$ לכל $x$, הנורמות שקולות; או שאפשר להפוך את אי-השוויון עם אותו קבוע.
  truth: >-
    שקילות דורשת שני אי-שוויונים, $c\|x\|_a\le\|x\|_b\le C\|x\|_a$ עם $c,C>0$. ב-$C[0,1]$ מתקיים
    $\|f\|_1\le\|f\|_\infty$, אבל $\|x^n\|_\infty=1$ ו-$\|x^n\|_1=\frac1{n+1}$, ולכן אין $C$ עם
    $\|f\|_\infty\le C\|f\|_1$.
  remedy: { lesson: '3.5', anchor: 'definition', label: 'ההגדרה של נורמות שקולות' }

- id: MC-c3-equivalent-same-numbers
  title: חושבים שנורמות שקולות נותנות אותם מספרים או אותם כדורים
  belief: >-
    לנורמות שקולות יש אותו כדור יחידה, אותם מרחקים או אותה נורמת אופרטור.
  truth: >-
    שקילות שומרת על מושגים "איכותיים": סדרות מתכנסות, סדרות קושי, קבוצות פתוחות, חסומות וקומפקטיות. המספרים
    משתנים: כדור היחידה של $\|\cdot\|_1$ במישור הוא ריבוע מסובב ושל $\|\cdot\|_\infty$ ריבוע, ונורמת האופרטור של
    המטריצה $\begin{pmatrix}1&2\\3&4\end{pmatrix}$ היא 6 בנורמה 1 ו-7 בנורמת אינסוף.
  remedy: { lesson: '3.5', anchor: 'preserved', label: 'מה נשמר תחת שקילות נורמות' }

- id: MC-c3-all-norms-infinite-dim
  title: חושבים שכל שתי נורמות על כל מרחב וקטורי שקולות
  belief: >-
    המשפט "כל הנורמות שקולות" נכון בכל מרחב נורמי, ולכן התכנסות בנורמה אחת היא התכנסות בכל נורמה.
  truth: >-
    המשפט נכון במרחב ממימד סופי, וההוכחה משתמשת בקומפקטיות של ספרת היחידה. ב-$C[0,1]$ הנורמות $\|\cdot\|_1$
    ו-$\|\cdot\|_\infty$ אינן שקולות: $x^n\to0$ בנורמה 1 ולא בנורמת הסופרמום.
  remedy: { lesson: '3.5', anchor: 'sup-vs-integral', label: 'נורמות לא שקולות במרחב הפונקציות הרציפות' }

- id: MC-c3-linear-always-continuous
  title: חושבים שכל העתקה לינארית רציפה
  belief: >-
    העתקה לינארית בין מרחבים נורמיים תמיד רציפה, כמו מטריצה.
  truth: >-
    כשהתחום ממימד סופי זה נכון, כי כל הנורמות עליו שקולות. במימד אינסופי לא: הפונקציונל $f\mapsto f(0)$ על
    $(C[0,1],\|\cdot\|_1)$ אינו חסום, כי $f_n(x)=\max(1-nx,0)$ מקיימת $\|f_n\|_1=\frac1{2n}$ ו-$f_n(0)=1$.
  remedy: { lesson: '3.5', anchor: 'linear-maps', label: 'כל העתקה לינארית על המרחב האוקלידי רציפה' }

- id: MC-c3-best-constant
  title: מבלבלים בין קבוע שמקיים אי-שוויון לבין הקבוע הטוב ביותר
  belief: >-
    הקבוע שיוצא משרשרת אי-שוויונים, כמו $\|x\|_1\le n\|x\|_\infty\le n\|x\|_2$, הוא הקבוע הטוב ביותר.
  truth: >-
    שרשרת נותנת קבוע שעובד, לא בהכרח את הקטן ביותר. הקבוע הטוב ביותר ב-$\|x\|_1\le C\|x\|_2$ הוא $\sqrt n$ (קושי-שוורץ),
    ומראים שאי אפשר להקטין אותו בווקטור שבו יש שוויון, כאן $(1,\dots,1)$.
  remedy: { lesson: '3.5', anchor: 'test-spaces', label: 'הקבועים בין נורמות 1, 2 ואינסוף' }

- id: MC-c3-norm-dependent-convergence
  title: חושבים שנורמה חדשה על המרחב האוקלידי יכולה לשנות את ההתכנסות
  belief: >-
    על $\mathbb{R}^n$ אפשר להמציא נורמה "משונה" שבה סדרה מתכנסת ל-0 אף שבנורמה האוקלידית היא לא מתכנסת, ולכן כל נורמה
    חדשה צריך לבדוק מחדש.
  truth: >-
    כל נורמה $N$ על $\mathbb{R}^n$ מקיימת $m\|x\|_2\le N(x)\le M\|x\|_2$ עם $m,M>0$ (משפט 3.5.5), ולכן לכל הנורמות
    על $\mathbb{R}^n$ אותן סדרות מתכנסות, אותם גבולות ואותן קבוצות פתוחות (טענה 3.5.2). זה נכשל רק במימד אינסופי.
  remedy: { lesson: '3.5', anchor: 'all-norms', label: 'כל הנורמות על המרחב האוקלידי שקולות' }

- id: MC-c3-unit-ball-always-compact
  title: חושבים שכדור היחידה הסגור של כל מרחב נורמי קומפקטי
  belief: >-
    כדור היחידה הסגור סגור וחסום, ולכן קומפקטי, כמו ב-$\mathbb{R}^n$; או לפחות יש נורמה טובה שבה הוא קומפקטי.
  truth: >-
    כדור היחידה הסגור של מרחב נורמי קומפקטי אם ורק אם המרחב ממימד סופי (משפט 3.5.10), בכל נורמה. ב-$C[0,1]$ האוהלים
    $t_n$ נמצאים בכדור, והמרחק בין כל שניים מהם הוא 1, ולכן אין להם תת-סדרה מתכנסת.
  remedy: { lesson: '3.5', anchor: 'riesz', label: 'כדור היחידה קומפקטי רק במימד סופי' }

- id: MC-c3-subspace-always-closed
  title: חושבים שכל תת-מרחב וקטורי של מרחב נורמי סגור
  belief: >-
    תת-מרחב וקטורי הוא "ישר" או "מישור", ולכן תמיד קבוצה סגורה, כמו ב-$\mathbb{R}^n$.
  truth: >-
    תת-מרחב ממימד סופי סגור בכל מרחב נורמי (מסקנה 3.5.6(ג)), אבל תת-מרחב ממימד אינסופי לא בהכרח. ב-$(C[0,1],\|\cdot\|_1)$
    התת-מרחב $W_0=\{f:\ f(0)=0\}$ צפוף ושונה מכל המרחב (טענה 3.5.9א), והפולינומים אינם סגורים ב-$(C[0,1],\|\cdot\|_\infty)$
    (טענה 2.2.10).
  remedy: { lesson: '3.5', anchor: 'riesz', label: 'הלמה של ריס, והסגירות הנחוצה לה' }

- id: MC-c3-riesz-closure
  title: חושבים שבלמה של ריס אפשר להחליף את התת-מרחב בסגור שלו ולוותר על ההנחה שהוא סגור
  belief: >-
    המרחק של נקודה מ-$W$ שווה למרחק שלה מ-$\overline W$, ולכן הלמה של ריס נכונה לכל תת-מרחב $W\ne V$, סגור או לא.
  truth: >-
    השוויון $\operatorname{dist}(x,W)=\operatorname{dist}(x,\overline W)$ נכון, אבל הלמה דורשת $\overline W\ne V$, ו-$\overline W$ יכול להיות
    כל המרחב גם כש-$W\ne V$. ב-$(C[0,1],\|\cdot\|_1)$, עבור $W_0=\{f:\ f(0)=0\}$, מתקיים $\operatorname{dist}(g,W_0)=0$ לכל $g$
    (טענה 3.5.9א), ולכן אין וקטור יחידה במרחק חיובי מ-$W_0$.
  remedy: { lesson: '3.5', anchor: 'riesz', label: 'למה הסגירות נחוצה בלמה של ריס' }
