# Misconceptions first detected in lesson 2.2 (complete subspaces and spaces of functions).
- id: MC-c2-closed-implies-complete
  title: חושבים שכל קבוצה סגורה היא שלמה
  belief: >-
    קבוצה סגורה היא שלמה, בכל מרחב.
  truth: >-
    זה נכון לקבוצה סגורה **במרחב שלם**. $\mathbb{Q}\cap[0,2]$ סגורה במרחב $\mathbb{Q}$, ובכל זאת סדרה של
    רציונליים ששואפת ל-$\sqrt2$ היא סדרת קושי בה בלי גבול בה. גם $\mathbb{Q}$ עצמו סגור ב-$\mathbb{Q}$.
  remedy: { lesson: '2.2', anchor: counterexample-q, label: 'תת-קבוצה סגורה של מרחב שלם' }

- id: MC-c2-subset-of-complete
  title: חושבים שכל תת-קבוצה של מרחב שלם שלמה
  belief: >-
    אם $X$ שלם ו-$Y\subseteq X$, גם $Y$ שלם, כי סדרות הקושי של $Y$ מתכנסות ב-$X$.
  truth: >-
    הן מתכנסות ב-$X$, אבל הגבול עלול לצאת מ-$Y$. $(0,1)\subseteq\mathbb{R}$ אינו שלם, והפולינומים בתוך
    $(C[0,1],\|\cdot\|_\infty)$ אינם שלמים (הסכומים החלקיים של טור טיילור של $e^x$). צריך ש-$Y$ יהיה סגור.
  remedy: { lesson: '2.2', anchor: complete-iff-closed, label: 'תת-מרחב שלם אם ורק אם סגור' }

- id: MC-c2-ambient-needed
  title: חושבים שצריך מרחב שלם כדי שתת-מרחב שלם יהיה סגור
  belief: >-
    הטענה "תת-מרחב שלם הוא סגור" דורשת שהמרחב הגדול שלם, כמו הכיוון ההפוך.
  truth: >-
    תת-מרחב שלם $Y$ סגור ב**כל** מרחב מטרי $X$: אם $y_n\in Y$ ו-$y_n\to x$ ב-$X$, אז $(y_n)$ סדרת קושי ב-$Y$,
    מתכנסת לאיזה $y\in Y$, ומיחידות הגבול $x=y$. שלמות $X$ נחוצה רק בכיוון "סגורה גוררת שלמה".
  remedy: { lesson: '2.2', anchor: subspace-theorem, label: 'שני הכיוונים ומה כל אחד צריך' }

- id: MC-c2-pointwise-limit-enough
  title: עוצרים בגבול הנקודתי
  belief: >-
    אם $f_n(x)$ מתכנסת לכל $x$, הוכחנו התכנסות במרחב הפונקציות, והגבול שייך למרחב (חסום, רציף).
  truth: >-
    הגבול הנקודתי הוא רק המועמד. צריך עוד להראות שהוא במרחב (חסום ב-$B(X)$, רציף ב-$C[a,b]$) ושהמרחק
    $\|f_n-f\|_\infty$ שואף לאפס. $x^n$ על $[0,1]$ מתכנסת נקודתית לפונקציה לא רציפה.
  remedy: { lesson: '2.2', anchor: bx-complete, label: 'ההוכחה ש-B(X) שלם: שלושה שלבים' }

- id: MC-c2-norm-irrelevant
  title: חושבים ששלמות של מרחב פונקציות לא תלויה בנורמה
  belief: >-
    $C[0,1]$ שלם או לא שלם, בלי קשר לנורמה; וסדרת קושי בנורמה אחת היא סדרת קושי גם בשנייה.
  truth: >-
    $(C[0,1],\|\cdot\|_\infty)$ שלם ו-$(C[0,1],\|\cdot\|_1)$ לא. מ-$\|f\|_1\le\|f\|_\infty$ נובע שסדרת קושי
    בנורמת הסופרמום היא סדרת קושי בנורמת האינטגרל, אבל לא להפך: סדרת השיפועים היא סדרת קושי ב-$\|\cdot\|_1$
    ו-$\|f_n-f_{2n}\|_\infty=\frac12$.
  remedy: { lesson: '2.2', anchor: two-norms, label: 'שתי נורמות על C[0,1]' }

- id: MC-c2-xn-counterexample-L1
  title: מביאים את x בחזקת n כדוגמה לאי-שלמות בנורמת האינטגרל
  belief: >-
    $x^n$ מראה ש-$(C[0,1],\|\cdot\|_1)$ אינו שלם, כי הגבול הנקודתי שלה לא רציף.
  truth: >-
    $\|x^n-0\|_1=\frac{1}{n+1}\to0$, כלומר $x^n$ **מתכנסת** בנורמת האינטגרל לפונקציית האפס, שרציפה. הגבול
    הנקודתי לא רלוונטי לנורמה הזו; צריך סדרה שאין לה שום גבול רציף, כמו השיפועים סביב $\frac12$.
  remedy: { lesson: '2.2', anchor: xn-warning, label: 'דוגמה מפורשת לאי-שלמות בנורמת האינטגרל' }

- id: MC-c2-limit-outside-not-checked
  title: מראים שהגבול הצפוי לא במרחב ושוכחים לשלול גבולות אחרים
  belief: >-
    כדי להראות שסדרת קושי לא מתכנסת, מספיק להראות שהגבול הנקודתי שלה (פונקציית המדרגה) לא שייך למרחב.
  truth: >-
    צריך להראות שאין **אף** איבר במרחב שהסדרה מתכנסת אליו בנורמה הנתונה. בנורמת האינטגרל מראים שכל $g$ רציפה
    כזו חייבת להתאפס על $[0,\frac12]$ ולהיות 1 על $(\frac12,1]$, וזו סתירה לרציפות.
  remedy: { lesson: '2.2', anchor: no-continuous-limit, label: 'למה אין לרמפות גבול רציף' }
