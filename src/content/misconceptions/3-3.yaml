# Misconceptions first detected in lesson 3.3 (total boundedness).
- id: MC-c3-bounded-totally-bounded
  title: חושבים שכל קבוצה חסומה חסומה כליל
  belief: >-
    אם קבוצה מוכלת בכדור אחד, אפשר לכסות אותה במספר סופי של כדורים קטנים כרצוננו.
  truth: >-
    חסומה כליל גורר חסומה, אבל לא להפך. ב-$\mathbb{N}$ עם המטריקה הבדידה כל כדור ברדיוס $\frac12$ הוא נקודה אחת,
    ולכן אין $\frac12$-רשת סופית; בכדור היחידה של $(C[0,1],\|\cdot\|_\infty)$ יש אינסוף פונקציות אוהל במרחק 1
    זו מזו. במרחב האוקלידי שני המושגים מתלכדים.
  remedy: { lesson: '3.3', anchor: 'bounded-vs-tb', label: 'חסומה מול חסומה כליל' }

- id: MC-c3-totally-bounded-compact
  title: חושבים שקבוצה חסומה כליל היא קומפקטית
  belief: >-
    אם לכל $\varepsilon$ יש $\varepsilon$-רשת סופית, הקבוצה קומפקטית.
  truth: >-
    קומפקטי שקול לשלם **וגם** חסום כליל. $(0,1)$ ו-$\mathbb{Q}\cap[0,1]$ חסומות כליל ואינן קומפקטיות: הסדרה
    $\frac1{n+1}$, או סדרה רציונלית ששואפת ל-$\frac{\sqrt2}{2}$, היא סדרת קושי בלי גבול בקבוצה.
  remedy: { lesson: '3.3', anchor: 'two-halves', label: 'קומפקטי שקול לשלם וחסום כליל' }

- id: MC-c3-complete-bounded-compact
  title: חושבים שמרחב שלם וחסום הוא קומפקטי
  belief: >-
    שלמות מחליפה את הסגירות, ולכן מרחב שלם וחסום קומפקטי, כמו בישר.
  truth: >-
    צריך חסום **כליל**, לא רק חסום. $\mathbb{N}$ במטריקה הבדידה שלם (סדרת קושי בו קבועה מאיזשהו מקום) וחסום,
    וכדור היחידה הסגור של $(C[0,1],\|\cdot\|_\infty)$ שלם וחסום; שניהם אינם קומפקטיים.
  remedy: { lesson: '3.3', anchor: 'two-halves', label: 'קומפקטי שקול לשלם וחסום כליל' }

- id: MC-c3-net-some-eps
  title: מסתפקים ברשת סופית עבור אפסילון אחד
  belief: >-
    קבוצה חסומה כליל אם יש לה $\varepsilon$-רשת סופית עבור $\varepsilon$ מסוים, למשל $\varepsilon=1$.
  truth: >-
    ההגדרה היא **לכל** $\varepsilon>0$. רשת סופית ל-$\varepsilon$ אחד אומרת רק שהקבוצה חסומה: ב-$\mathbb{N}$ עם
    המטריקה הבדידה הנקודה $1$ לבדה היא $2$-רשת, ואין $\frac12$-רשת סופית.
  remedy: { lesson: '3.3', anchor: 'definition', label: 'ההגדרה של חסימות כליל' }

- id: MC-c3-holes-not-tb
  title: חושבים שקבוצה עם "חורים" אינה חסומה כליל
  belief: >-
    $(0,1)$ או $\mathbb{Q}\cap[0,1]$ אינן חסומות כליל, כי חסרות בהן נקודות.
  truth: >-
    חסימות כליל ושלמות הן תכונות בלתי תלויות. $\mathbb{Q}\cap[0,1]$ חסומה כליל: הנקודות $0,\frac1k,\frac2k,\dots,1$
    רציונליות ומהוות $\varepsilon$-רשת לכל $\varepsilon>\frac1{2k}$. החורים פוגעים בשלמות, לא בחסימות כליל.
  remedy: { lesson: '3.3', anchor: 'two-halves', label: 'חסימות כליל ושלמות הן שתי תכונות נפרדות' }

- id: MC-c3-ambient-dimension
  title: חושבים שבמרחב ממימד אינסופי אין קבוצות אינסופיות חסומות כליל
  belief: >-
    $C[0,1]$ ממימד אינסופי, ולכן אף קבוצה אינסופית בו אינה חסומה כליל.
  truth: >-
    מה שקובע הוא הקבוצה, לא המרחב שמסביב. $\{a+bx: |a|,|b|\le1\}$ ו-$\{cx: c\in[0,1]\}$ אינסופיות וחסומות כליל
    ב-$(C[0,1],\|\cdot\|_\infty)$, וכך גם הפונקציות הליפשיציות עם קבוע 1 שמתאפסות ב-0; רק כדור היחידה כולו אינו
    חסום כליל.
  remedy: { lesson: '3.3', anchor: 'function-spaces', label: 'חסימות כליל במרחבי פונקציות' }

- id: MC-c3-countable-union-tb
  title: חושבים שאיחוד של אינסוף קבוצות חסומות כליל חסום כליל
  belief: >-
    כל אחת מהקבוצות $A_1,A_2,\dots$ חסומה כליל, ולכן גם האיחוד שלהן, במיוחד אם הוא חסום.
  truth: >-
    רק איחוד **סופי** של קבוצות חסומות כליל חסום כליל. ב-$(C[0,1],\|\cdot\|_\infty)$ הקבוצה של הפונקציות שמתאפסות
    ב-0, ליפשיציות עם קבוע $M$ ובנורמה לכל היותר 1, חסומה כליל לכל $M$, אבל האיחוד על כל $M\in\mathbb{N}$ מכיל את
    כל פונקציות האוהל, שרחוקות 1 זו מזו, ולכן אינו חסום כליל.
  remedy: { lesson: '3.3', anchor: 'operations', label: 'מה נשמר ומה לא' }

- id: MC-c3-continuous-image-tb
  title: חושבים שכל פונקציה רציפה שומרת על חסימות כליל
  belief: >-
    אם $f$ רציפה ו-$A$ חסומה כליל, אז $f(A)$ חסומה כליל.
  truth: >-
    רציפות לבדה אינה מספיקה: $\frac1x$ רציפה על $(0,1]$, שחסום כליל, והתמונה $[1,\infty)$ אינה חסומה. רציפות במידה
    שווה מספיקה (טענה 3.3.5(ד)). וכשהמרחב שבו $A$ יושבת שלם, גם רציפות מספיקה: לכל סדרה ב-$A$ יש תת-סדרת קושי
    (משפט 3.3.7), השלמות נותנת לה גבול, והרציפות מעבירה אותה לסדרה מתכנסת; $(0,1]$ אינו שלם.
  remedy: { lesson: '3.3', anchor: 'operations', label: 'מה נשמר ומה לא' }

- id: MC-c3-uniform-needed
  title: הופכים את התנאי המספיק של רציפות במידה שווה לתנאי הכרחי
  belief: >-
    אם $f$ אינה רציפה במידה שווה על כל המרחב, אז לפי טענה 3.3.5(ד) היא לא מעבירה קבוצות חסומות כליל לקבוצות חסומות
    כליל.
  truth: >-
    טענה 3.3.5(ד) נותנת תנאי מספיק בלבד. $u\mapsto u^2$ אינה רציפה במידה שווה על $\mathbb{R}$, ובכל זאת מעבירה כל
    קבוצה חסומה כליל לקבוצה חסומה כליל: קבוצה כזו חסומה, ועל קבוצה חסומה ההעתקה ליפשיצית. מה שקובע הוא ההתנהגות
    על הקבוצה, לא על כל המרחב.
  remedy: { lesson: '3.3', anchor: 'operations', label: 'מה נשמר ומה לא' }
