# Misconceptions first detected in lesson 6.1 (Taylor's theorem in several variables).
- id: MC-c6-mixed-coefficient
  title: חצי מהנגזרת המעורבת כמקדם של xy
  belief: >-
    בפולינום טיילור מסדר שני המקדם של $h_1h_2$ הוא $\frac12\,\partial_1\partial_2 f(a)$, כמו המקדם של $h_1^2$.
  truth: >-
    $\frac12h^{T}H_f(a)h=\frac12\left(\partial_1^2f\,h_1^2+2\,\partial_1\partial_2f\,h_1h_2+\partial_2^2f\,h_2^2\right)$:
    האיבר שמחוץ לאלכסון מופיע פעמיים במטריצה, ולכן המקדם של $h_1h_2$ הוא $\partial_1\partial_2 f(a)$ בלי חצי.
  remedy: { lesson: '6.1', label: 'פולינום טיילור מסדר שני: פריסת התבנית הריבועית' }

- id: MC-c6-hessian-diagonal-only
  title: שוכחים את הנגזרות המעורבות באיבר מסדר שני
  belief: >-
    האיבר מסדר שני של טיילור הוא $\frac12\sum_i \partial_i^2 f(a)\,h_i^2$, והנגזרות המעורבות לא משתתפות.
  truth: >-
    האיבר הוא $\frac12\sum_{i,j}\partial_i\partial_j f(a)\,h_ih_j=\frac12h^{T}H_f(a)h$. לפונקציה $f=xy$ כל
    הנגזרות הטהורות מתאפסות, ובכל זאת $f(1,1)=1$: כל המידע נמצא באיבר המעורב.
  remedy: { lesson: '6.1', label: 'הנגזרת השנייה של g(t)=f(a+th)' }

- id: MC-c6-taylor-factorial
  title: שוכחים את המקדם אחד חלקי עצרת
  belief: >-
    האיבר מסדר שני הוא $h^{T}H_f(a)h$ (בלי חצי), או שהשארית מסדר שלישי לא מחולקת ב-$3!$.
  truth: >-
    האיבר מסדר $k$ הוא $\frac1{k!}\sum \partial_{i_1}\cdots\partial_{i_k}f\,h_{i_1}\cdots h_{i_k}$, בדיוק כמו
    $\frac{g^{(k)}(0)}{k!}$ במשתנה אחד. בדיקה מהירה: ל-$f=x^2$ צריך לקבל $f(h)=h^2$, לא $2h^2$.
  remedy: { lesson: '6.1', label: 'משפט טיילור דרך הצמצום לקטע' }

- id: MC-c6-remainder-at-a
  title: חושבים שהנקודה בשארית לגרנז' היא a או כל נקודה שנבחר
  belief: >-
    בשארית לגרנז' אפשר לשים את ההסיאן בנקודה $a$ (ואז הקירוב מדויק), או בכל נקודה של הקטע; ולכן מספיק לחסום
    את הנגזרות בנקודה $a$.
  truth: >-
    המשפט אומר רק ש**קיימת** נקודה $c$ על הקטע $[a,a+h]$, ואין לדעת איזו. לכן חסם על השגיאה צריך חסם על
    הנגזרות בכל הקטע. ל-$f=x^4$ ב-$a=0$ ההסיאן הוא אפס, ובכל זאת $f(h)\ne0$.
  remedy: { lesson: '6.1', label: 'שארית לגרנז'' היא נקודה לא ידועה על הקטע' }

- id: MC-c6-little-o-bound
  title: מסיקים חסם מספרי מהסימון או קטן
  belief: >-
    אם $f(a+h)=P_2(h)+o(\|h\|^2)$, אז השגיאה קטנה מ-$\|h\|^2$, או קטנה "מספיק" לכל $h$ קטן מסוים.
  truth: >-
    $o(\|h\|^2)$ מתאר רק את היחס $\frac{R(h)}{\|h\|^2}\to0$ כש-$h\to0$, ואינו נותן מספר לשום $h$ קבוע. ל-$f=1000x^3$
    הפולינום $P_2$ הוא אפס, והשגיאה ב-$h=(0.1,0)$ היא 1. חסם מספרי בא משארית לגרנז' יחד עם חסם על הנגזרות.
  remedy: { lesson: '6.1', label: 'הערכת שגיאה: מתי צריך שארית לגרנז''' }

- id: MC-c6-vector-lagrange
  title: שארית לגרנז' עם נקודה אחת לפונקציה וקטורית
  belief: >-
    לפונקציה $F:\mathbb{R}^n\to\mathbb{R}^m$ קיימת נקודה אחת $c$ שמתאימה לשארית לגרנז' של כל הרכיבים יחד.
  truth: >-
    לכל רכיב יש נקודה משלו, והן שונות בדרך כלל. ל-$F(t)=(\cos t,\sin t)$, $a=0$, $h=2\pi$ אין נקודה משותפת. זה
    אותו כישלון כמו של שוויון הערך הממוצע לפונקציה וקטורית (שיעור 5.6); מה שנשאר הוא אי-שוויון.
  remedy: { lesson: '6.1', label: 'משפט טיילור לפונקציה ממשית בלבד' }

- id: MC-c6-segment-not-needed
  title: מפעילים את משפט טיילור בלי לבדוק שהקטע בתחום
  belief: >-
    אם $f$ מסוג $C^2$ בקבוצה פתוחה $U$ והנקודות $a$ ו-$a+h$ ב-$U$, נוסחת טיילור עם שארית לגרנז' מתקיימת.
  truth: >-
    ההוכחה מצמצמת את $f$ לקטע $[a,a+h]$, ולכן הקטע כולו חייב להיות ב-$U$. ל-$f=\frac{1}{x^2+y^2}$ ב-$\mathbb{R}^2$
    בלי הראשית, עם $a=(-1,0)$ ו-$h=(2,0)$, אין שום נקודה $c\ne0$ על הקטע שמקיימת את הנוסחה.
  remedy: { lesson: '6.1', label: 'הצמצום לקטע והדרישה שהקטע בתחום' }

- id: MC-c6-degree-per-variable
  title: קוצצים לפי המעלה בכל משתנה במקום לפי המעלה הכוללת
  belief: >-
    בפולינום טיילור מסדר שני שומרים כל איבר שבו כל משתנה מופיע בחזקה 2 לכל היותר, למשל $x^2y^2$ או $xy^2$.
  truth: >-
    "מסדר שני" פירושו מעלה **כוללת** לכל היותר 2: $x^2$, $xy$, $y^2$ כן; $xy^2$ (מעלה 3) ו-$x^2y^2$ (מעלה 4) לא.
    איברים כאלה הם $O(\|h\|^3)$ ושייכים לשארית.
  remedy: { lesson: '6.1', label: 'מה זה מעלה כוללת של מונום' }

- id: MC-c6-taylor-only-by-formula
  title: חושבים שפולינום טיילור מתקבל רק מחישוב נגזרות
  belief: >-
    הדרך היחידה לגיטימית למצוא את $P_2$ היא לחשב את $\nabla f(a)$ ואת $H_f(a)$; הצבה בטורים מוכרים והכפלתם היא
    קיצור דרך לא מוצדק.
  truth: >-
    פולינום ממעלה 2 לכל היותר שמקיים $f(a+h)=Q(h)+o(\|h\|^2)$ הוא יחיד, ולכן כל דרך שמשאירה שגיאה $o(\|h\|^2)$
    (הכפלת טורים, הצבה של $u=x+y$ בטור של משתנה אחד) נותנת בדיוק את $P_2$.
  remedy: { lesson: '6.1', label: 'יחידות פולינום טיילור' }

- id: MC-c6-hessian-always-symmetric
  title: חושבים שההסיאן תמיד סימטרי
  belief: >-
    אם כל הנגזרות החלקיות מסדר שני קיימות בנקודה, המטריצה $H_f(a)$ סימטרית, ואפשר להפעיל עליה את המשפט הספקטרלי.
  truth: >-
    הסימטריה באה ממשפט שוורץ, שדורש רציפות של הנגזרות המעורבות. ל-$f=\frac{xy(x^2-y^2)}{x^2+y^2}$ (ו-0 בראשית)
    שתי הנגזרות המעורבות בראשית הן $1$ ו-$(-1)$. לכן בפרק הזה מניחים $f\in C^2$.
  remedy: { lesson: '5.7', label: 'משפט שוורץ והדוגמה הנגדית' }
