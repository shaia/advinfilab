# Misconceptions first detected in lesson 7.1 (the inverse function theorem).
- id: MC-c7-local-is-global
  title: הפיכות מקומית בכל נקודה נחשבת להפיכות גלובלית
  belief: >-
    אם מטריצת יעקובי הפיכה בכל נקודה, הפונקציה חד-חד-ערכית על כל התחום ויש לה הופכית אחת על כל התמונה.
  truth: >-
    משפט הפונקציה ההפוכה הוא מקומי: הוא נותן לכל נקודה סביבה שעליה הפונקציה הפיכה, ולא יותר.
    $F(x,y)=(e^x\cos y,\ e^x\sin y)$ מקיימת $\det J_F(x,y)=e^{2x}\neq0$ בכל המישור, ובכל זאת
    $F(x,y+2\pi)=F(x,y)$.
  remedy: { lesson: '7.1', label: 'האקספוננט במישור: הפיכה מקומית בכל נקודה ואינה חד-חד-ערכית' }

- id: MC-c7-ift-iff
  title: חושבים שבלי נגזרת הפיכה אין הופכית מקומית
  belief: >-
    אם $Df(a)$ אינה הפיכה, אז $f$ אינה הפיכה באף סביבה של $a$; ובאותו אופן, אם הנגזרת החלקית מתאפסת אין פונקציה
    סתומה.
  truth: >-
    ההנחה של המשפט מספיקה ואינה הכרחית. $f(x)=x^3$ חד-חד-ערכית ועל $\mathbb{R}$ אף ש-$f'(0)=0$; מה שנכשל הוא
    הגזירות של ההופכית $\sqrt[3]{y}$ באפס. מה שכן נכון: אם ההופכית גזירה ב-$f(a)$, אז $Df(a)$ הפיכה, כי מכלל
    השרשרת $D(f^{-1})(f(a))\,Df(a)=I$.
  remedy: { lesson: '7.1', label: 'x בשלישית: הפיכה, אבל ההופכית אינה גזירה באפס' }

- id: MC-c7-differentiable-enough
  title: חושבים שמספיקה גזירות עם נגזרת הפיכה בנקודה
  belief: >-
    אם $f$ גזירה ו-$Df(a)$ הפיכה, אז $f$ הפיכה בסביבה של $a$; הדרישה "גזירה ברציפות" היא טכנית בלבד.
  truth: >-
    בלי רציפות של $Df$ המשפט נכשל: $f(x)=x+2x^2\sin\frac1x$ עם $f(0)=0$ מקיימת $f'(0)=1$, אבל
    $f'\left(\frac{1}{2\pi k}\right)=-1$ לכל $k$, ולכן $f$ אינה חד-חד-ערכית באף סביבה של 0.
  remedy: { lesson: '7.2', label: 'למה צריך גזירות ברציפות: הדוגמה עם הסינוס של אחד חלקי x' }

- id: MC-c7-ift-any-dimensions
  title: מפעילים את משפט הפונקציה ההפוכה בין מרחבים ממימדים שונים
  belief: >-
    מספיק ש-$Df(a)$ תהיה מדרגה מלאה כדי ש-$f:\mathbb{R}^n\to\mathbb{R}^m$ תהיה הפיכה מקומית, גם כש-$m\neq n$.
  truth: >-
    המשפט עוסק ב-$f:U\to\mathbb{R}^n$ עם $U\subseteq\mathbb{R}^n$ פתוחה. כש-$m\neq n$ המטריצה $J_f(a)$ אינה ריבועית
    ואינה יכולה להיות הפיכה. מקרה $m<n$ שייך למשפט הפונקציה הסתומה, ושם מוסיפים רכיבים כדי לקבל העתקה ריבועית.
  remedy: { lesson: '7.1', label: 'ניסוח משפט הפונקציה ההפוכה: אותו מימד בשני הצדדים' }

- id: MC-c7-inverse-jacobian-entrywise
  title: הופכים כל איבר של מטריצת יעקובי בנפרד
  belief: >-
    הנגזרת החלקית של ההופכית היא אחד חלקי הנגזרת החלקית המתאימה של הפונקציה.
  truth: >-
    $D(f^{-1})(f(a))=Df(a)^{-1}$ היא ההופכית של **המטריצה**. ל-$J=\begin{pmatrix}1&2\\2&1\end{pmatrix}$ ההופכית היא
    $\frac13\begin{pmatrix}-1&2\\2&-1\end{pmatrix}$, ולא המטריצה של ההופכיים $\begin{pmatrix}1&\frac12\\\frac12&1\end{pmatrix}$.
    רק במשתנה אחד, או במטריצה אלכסונית, זה אותו דבר.
  remedy: { lesson: '7.1', label: 'הדיפרנציאל של ההופכית: הופכית של מטריצה' }

- id: MC-c7-inverse-derivative-wrong-point
  title: מציבים בנגזרת של הפונקציה את הנקודה של ההופכית
  belief: >-
    $D(f^{-1})(b)$ שווה ל-$Df(b)^{-1}$.
  truth: >-
    $D(f^{-1})(b)=Df(a)^{-1}$ כאשר $a=f^{-1}(b)$: קודם מוצאים את המקור $a$, ורק בו מחשבים את $Df$. למשל
    ל-$f(x)=x+e^x$ מתקיים $f(0)=1$, ולכן $(f^{-1})'(1)=\frac{1}{f'(0)}=\frac12$.
  remedy: { lesson: '7.1', label: 'הדיפרנציאל של ההופכית: באיזו נקודה מציבים' }
