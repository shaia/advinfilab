# Misconceptions first detected in lesson 4.6 (the Stone–Weierstrass theorem, enrichment).
- id: MC-c4-sw-constants-forgotten
  title: שוכחים שהאלגברה צריכה להכיל את הקבועים
  belief: >-
    תת-אלגברה שמפרידה נקודות צפופה ב-$C(K)$, גם אם כל הפונקציות בה מתאפסות באותה נקודה.
  truth: >-
    אם כל $p\in\mathcal{A}$ מקיימת $p(x_0)=0$, אז $\|1-p\|_\infty\ge|1-p(x_0)|=1$: הקבוע 1 רחוק מהאלגברה. הסגור הוא
    רק $\{f:\ f(x_0)=0\}$.
  remedy: { lesson: '4.6', label: 'ההנחה: מכילה את הקבועים' }

- id: MC-c4-sw-separation-forgotten
  title: שוכחים לבדוק שהאלגברה מפרידה נקודות
  belief: >-
    כל תת-אלגברה שמכילה את הקבועים צפופה, למשל הפולינומים ב-$x^2$ ב-$C[-1,1]$.
  truth: >-
    אם $p(x)=p(y)$ לכל $p\in\mathcal{A}$, גם כל גבול מקיים זאת. כל פולינום ב-$x^2$ זוגי, ולכן $f(x)=x$ במרחק 1
    לפחות מכל אחד מהם ב-$C[-1,1]$.
  remedy: { lesson: '4.6', label: 'ההנחה: מפרידה נקודות' }

- id: MC-c4-algebra-definition
  title: חושבים שקבוצה סגורה לפעולה אחת היא תת-אלגברה
  belief: >-
    מרחב לינארי של פונקציות (כמו הפולינומים ממעלה עד 3) הוא תת-אלגברה, וגם קבוצה סגורה לכפל (כמו הפונקציות
    האי-שליליות) היא תת-אלגברה.
  truth: >-
    תת-אלגברה סגורה לחיבור, לכפל בסקלר **ולכפל של שתי פונקציות**. $x^2\cdot x^2$ ממעלה 4, ו-$(-1)\cdot f$ אינה
    אי-שלילית.
  remedy: { lesson: '4.6', label: 'ההגדרה של תת-אלגברה' }

- id: MC-c4-separation-definition
  title: מבלבלים בהגדרה של הפרדת נקודות
  belief: >-
    אלגברה מפרידה נקודות אם יש בה פונקציה אחת חד-חד-ערכית, או אם לכל נקודה יש בה פונקציה שאינה מתאפסת בה.
  truth: >-
    מפרידה נקודות: לכל $x\ne y$ ב-$K$ יש $f\in\mathcal{A}$ (שרשאית להיות תלויה ב-$x,y$) עם $f(x)\ne f(y)$. פונקציה
    חד-חד-ערכית אחת מספיקה ואינה הכרחית, ו"לא מתאפסת בשום נקודה" הוא תנאי אחר, שמחליף את הקבועים.
  remedy: { lesson: '4.6', label: 'ההגדרה של הפרדת נקודות' }

- id: MC-c4-periodic-interval
  title: חושבים שהפולינומים הטריגונומטריים צפופים בכל הפונקציות הרציפות על הקטע
  belief: >-
    לפי סטון-ויירשטראס הפולינומים הטריגונומטריים צפופים ב-$C[-\pi,\pi]$.
  truth: >-
    כל פולינום טריגונומטרי מקיים $p(-\pi)=p(\pi)$: על הקטע הם לא מפרידים בין $(-\pi)$ ל-$\pi$. רואים בהם פונקציות על
    המעגל, ושם הם צפופים בפונקציות הרציפות המחזוריות. $f(x)=x$ נמצאת במרחק $\pi$ מכולם.
  remedy: { lesson: '4.6', label: 'פולינומים טריגונומטריים על המעגל' }

- id: MC-c4-dense-means-contains
  title: חושבים שקבוצה צפופה צריכה להכיל את הפונקציה שמקרבים
  belief: >-
    $x$ אינה פולינום ב-$x^2$, ולכן הפולינומים ב-$x^2$ אינם צפופים ב-$C[0,1]$.
  truth: >-
    צפופה פירושו שכל פונקציה היא **גבול** של איברי הקבוצה, לא שהיא שייכת לקבוצה. על $[0,1]$ הפונקציה $x=\sqrt{x^2}$
    היא גבול במידה שווה של פולינומים ב-$x^2$.
  remedy: { lesson: '4.6', label: 'צפיפות לעומת שייכות' }

- id: MC-c4-derivative-condition-closed
  title: חושבים שתנאי על נגזרת נשמר בגבול במידה שווה
  belief: >-
    אם $p'(0)=0$ לכל פונקציה בקבוצה, גם הגבולות שלה מקיימים זאת, ולכן הקבוצה אינה צפופה.
  truth: >-
    התכנסות במידה שווה אינה שולטת בנגזרות. $\sqrt{x^2+\frac1n}$ מקיימות $f_n'(0)=0$ ומתכנסות במידה שווה ל-$|x|$,
    שאינה גזירה ב-0. תנאי על ערך בנקודה נשמר בגבול; תנאי על נגזרת לא.
  remedy: { lesson: '4.6', label: 'אילו תנאים נשמרים בגבול' }
