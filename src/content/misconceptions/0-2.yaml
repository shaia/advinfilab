# Misconceptions first detected in lesson 0.2 (supremum, Bolzano–Weierstrass, Cauchy, lim sup and lim inf in ℝ).
- id: MC-c0-sup-is-max
  title: הסופרמום חייב להיות איבר של הקבוצה
  belief: >-
    לכל קבוצה חסומה יש איבר גדול ביותר (או קטן ביותר), והסופרמום (או האינפימום) הוא האיבר הזה.
  truth: >-
    הסופרמום הוא החסם מלעיל **הקטן ביותר**, והוא לא חייב להשתייך לקבוצה: $\sup\{1-\frac1n\}=1$ ואף איבר
    אינו שווה ל-1. כשהסופרמום שייך לקבוצה הוא המקסימום שלה.
  remedy: { lesson: '0.2', label: 'סופרמום ואינפימום: מתי הם מתקבלים' }

- id: MC-c0-sup-char-all-elements
  title: באפיון של הסופרמום כל האיברים קרובים אליו
  belief: >-
    $s=\sup A$ אם לכל $\varepsilon>0$ **כל** איברי $A$ גדולים מ-$s-\varepsilon$, או אם $s$ שייך ל-$A$.
  truth: >-
    $s=\sup A$ אם ורק אם $s$ חסם מלעיל של $A$, ולכל $\varepsilon>0$ **קיים** $a\in A$ עם $a>s-\varepsilon$.
    איבר אחד ליד $s$ מספיק לכל $\varepsilon$; שאר האיברים יכולים להיות רחוקים.
  remedy: { lesson: '0.2', label: 'אפיון האפסילון של הסופרמום' }

- id: MC-c0-sup-is-limit
  title: מבלבלים את הסופרמום של סדרה עם הגבול או הגבול העליון שלה
  belief: >-
    הסופרמום של קבוצת האיברים של סדרה הוא הערך שאליו הסדרה מתקרבת.
  truth: >-
    הסופרמום תלוי בכל האיברים, גם הראשונים; הגבול העליון תלוי רק בזנבות. ל-$(-1)^n+\frac1n$ הסופרמום הוא
    $\frac32$ (האיבר השני), והגבול העליון הוא 1.
  remedy: { lesson: '0.2', label: 'סופרמום מול גבול עליון' }

- id: MC-c0-infinite-no-min
  title: לקבוצה אינסופית אין מינימום
  belief: >-
    אם קבוצה אינסופית, אין לה איבר קטן ביותר או גדול ביותר, ולכן האינפימום לא מתקבל.
  truth: >-
    גודל הקבוצה לא קובע: ל-$\mathbb{N}$ יש מינימום 1, ול-$\{1-\frac1n\}$ יש מינימום 0 ואין מקסימום.
    בודקים בכל מקרה אם החסם ההדוק שייך לקבוצה.
  remedy: { lesson: '0.2', label: 'סופרמום ואינפימום: מתי הם מתקבלים' }

- id: MC-c0-near-sup-infinitely-many
  title: ליד הסופרמום יש תמיד אינסוף איברים
  belief: >-
    לפי אפיון האפסילון, לכל $\varepsilon>0$ יש אינסוף איברים של $A$ בקטע $(s-\varepsilon,s]$.
  truth: >-
    האפיון מבטיח איבר **אחד**. אם $s$ הוא מקסימום, ייתכן שהוא האיבר היחיד ליד עצמו: ב-$A=\{0,1\}$ הסופרמום
    הוא 1, וב-$(1-\varepsilon,1]$ עם $\varepsilon<1$ יש רק את 1. אינסוף איברים מובטחים רק כש-$s\notin A$.
  remedy: { lesson: '0.2', label: 'אפיון האפסילון של הסופרמום' }

- id: MC-c0-rational-complete
  title: מייחסים לרציונליים את תכונת השלמות של הממשיים
  belief: >-
    כל תכונה של הממשיים שמשתמשים בה בהוכחות (סופרמום, התכנסות של סדרות קושי ושל סדרות מונוטוניות חסומות)
    נכונה גם ברציונליים, כי הם צפופים.
  truth: >-
    ארכימדיות וצפיפות נכונות ב-$\mathbb{Q}$, אבל אקסיומת השלמות לא: ל-$\{q\in\mathbb{Q}:q^2<2\}$ אין סופרמום
    רציונלי, וקירובי עשרוניים של $\sqrt2$ הם סדרת קושי מונוטונית ברציונליים בלי גבול רציונלי.
  remedy: { lesson: '0.2', label: 'אקסיומת השלמות: מה נכשל ברציונליים' }

- id: MC-c0-bw-converse
  title: חושבים שסדרה עם תת-סדרה מתכנסת חסומה
  belief: >-
    משפט בולצאנו-ויירשטראס עובד בשני הכיוונים: אם יש תת-סדרה מתכנסת, הסדרה חסומה.
  truth: >-
    המשפט הוא גרירה בכיוון אחד. הסדרה ששווה ל-$n$ באינדקסים האי-זוגיים ול-0 בזוגיים אינה חסומה, ויש לה
    תת-סדרה מתכנסת (האפסים).
  remedy: { lesson: '0.2', label: 'בולצאנו-ויירשטראס: כיוון אחד' }

- id: MC-c0-cauchy-consecutive
  title: הפרשים עוקבים שואפים לאפס, ולכן הסדרה קושי
  belief: >-
    אם $a_{n+1}-a_n\to0$, אז $a_n$ סדרת קושי.
  truth: >-
    תנאי קושי משווה **כל** שני איברים רחוקים מספיק, לא רק שכנים. ב-$a_n=\sqrt n$ ההפרש
    $\sqrt{n+1}-\sqrt n\to0$, והסדרה שואפת לאינסוף. הפרשים קטנים מצטברים להפרש גדול.
  remedy: { lesson: '0.2', label: 'קריטריון קושי: כל שני איברים, לא רק שכנים' }

- id: MC-c0-limsup-is-sup
  title: הגבול העליון חוסם את כל איברי הסדרה
  belief: >-
    $\limsup a_n$ הוא האיבר הגדול ביותר של הסדרה, או לפחות $a_n<\limsup a_n+\varepsilon$ לכל $n$.
  truth: >-
    הגבול העליון הוא הגבול של $\sup_{k\ge n}a_k$ ותלוי רק בזנבות: $a_n<\limsup a_n+\varepsilon$ מתקיים רק
    **מ-$N$ והלאה**. מספר סופי של איברים יכול להיות גדול ממנו כרצוננו.
  remedy: { lesson: '0.2', label: 'גבול עליון: הגדרה ואפיון' }

- id: MC-c0-limsup-from-range
  title: קובעים גבול עליון ותחתון לפי הטווח של הנוסחה
  belief: >-
    ל-$\sin(n\theta)$ הגבול העליון הוא 1 והתחתון הוא מינוס 1, כי זה הטווח של הסינוס.
  truth: >-
    הגבולות החלקיים הם הגבולות של תת-סדרות של **הסדרה הזו**. $\sin\frac{n\pi}{3}$ מקבלת רק את הערכים
    $0,\pm\frac{\sqrt3}{2}$, ולכן הגבול העליון שלה $\frac{\sqrt3}{2}$, לא 1.
  remedy: { lesson: '0.2', label: 'גבול עליון: חישוב לסדרות מחזוריות' }

- id: MC-c0-limsup-additive
  title: חושבים שהגבול העליון של סכום הוא סכום הגבולות העליונים
  belief: >-
    $\limsup(a_n+b_n)=\limsup a_n+\limsup b_n$ לכל שתי סדרות חסומות.
  truth: >-
    מתקיים רק $\limsup(a_n+b_n)\le\limsup a_n+\limsup b_n$. עם $a_n=(-1)^n$ ו-$b_n=(-1)^{n+1}$ הסכום הוא 0,
    והצד הימני 2: הסדרות מגיעות לשיא שלהן באינדקסים שונים.
  remedy: { lesson: '0.2', label: 'גבול עליון של סכום' }
