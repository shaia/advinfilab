# Misconceptions first detected in lesson 8.3 (vector fields and the line integral).
- id: MC-c8-line-integral-no-derivative
  title: שוכחים את הנגזרת של המסילה באינטגרל הקווי
  belief: >-
    $\int_\gamma F\cdot ds$ הוא $\int_a^bF(\gamma(t))\,dt$, או $\int_a^bF(\gamma(t))\cdot\gamma(t)\,dt$: מציבים את
    המסילה בשדה ומשלבים.
  truth: >-
    $\int_\gamma F\cdot ds=\int_a^bF(\gamma(t))\cdot\gamma'(t)\,dt$. הגורם $\gamma'(t)\,dt$ הוא ה"צעד" הקטן לאורך
    המסילה; בלעדיו התוצאה תלויה בפרמטריזציה ואין לה משמעות של עבודה.
  remedy: { lesson: '8.3', label: 'ההגדרה של האינטגרל הקווי' }

- id: MC-c8-line-integral-norms
  title: מכפילים גדלים במקום לקחת מכפלה סקלרית
  belief: >-
    האינטגרל הקווי הוא $\int_a^b\|F(\gamma(t))\|\,\|\gamma'(t)\|\,dt$: כמה חזק השדה כפול כמה ארוך הצעד.
  truth: >-
    המכפלה הסקלרית $F\cdot\gamma'$ סופרת רק את רכיב השדה **בכיוון התנועה**, עם סימן. שדה שניצב למסילה תורם 0,
    ושדה נגד הכיוון תורם תרומה שלילית. הביטוי עם הנורמות הוא רק חסם מלעיל.
  remedy: { lesson: '8.3', label: 'האינטגרל הקווי כעבודה לאורך מסילה' }

- id: MC-c8-path-independent-always
  title: חושבים שהאינטגרל הקווי תלוי רק בנקודות הקצה
  belief: >-
    לכל שדה, האינטגרל מ-$p$ ל-$q$ יוצא אותו דבר לאורך כל מסילה, ולכן אפשר לבחור את הישר.
  truth: >-
    זה נכון בדיוק לשדות משמרים (שיעור 8.4). ל-$F=(x^2,xy)$ מ-$(0,0)$ ל-$(1,1)$: לאורך הישר $\frac23$, ולאורך
    הפרבולה $y=x^2$ $\frac{11}{15}$.
  remedy: { lesson: '8.3', label: 'חישוב אינטגרל קווי לאורך שתי מסילות' }

- id: MC-c8-closed-always-zero
  title: חושבים שהאינטגרל הקווי על כל מסילה סגורה מתאפס
  belief: >-
    מסילה סגורה חוזרת לנקודת ההתחלה, ולכן "לא עברנו כלום" והאינטגרל עליה 0.
  truth: >-
    האינטגרל על מסילה סגורה מתאפס לכל מסילה סגורה בדיוק כשהשדה משמר. ל-$(-y,x)$ על מעגל היחידה הוא $2\pi$:
    השדה מצביע בכל נקודה בכיוון התנועה.
  remedy: { lesson: '8.3', label: 'אינטגרל על מסילה סגורה' }

- id: MC-c8-orientation-ignored
  title: מתעלמים מכיוון המסילה
  belief: >-
    האינטגרל הקווי, או מספר הליפוף, תלוי רק בדרך שעוברים בה ולא בכיוון שבו עוברים עליה.
  truth: >-
    היפוך הכיוון, $\gamma^-(t)=\gamma(a+b-t)$, הופך את סימן האינטגרל: $\int_{\gamma^-}F\cdot ds=-\int_\gamma F\cdot ds$.
    לכן גם מעגל שעוברים עליו עם כיוון השעון נותן מספר ליפוף מינוס 1.
  remedy: { lesson: '8.3', label: 'היפוך כיוון ואי-תלות בפרמטריזציה' }

- id: MC-c8-speed-changes-integral
  title: חושבים ששינוי המהירות לאורך המסילה משנה את האינטגרל
  belief: >-
    אם עוברים על אותה מסילה מהר פי 2, $\gamma'$ גדל פי 2, ולכן גם האינטגרל.
  truth: >-
    $\gamma'$ גדל פי 2, אבל הזמן מתקצר פי 2. החלפת המשתנה $t=\varphi(u)$ עם $\varphi'>0$ מראה שהאינטגרל לא משתנה
    בפרמטריזציה ששומרת על הכיוון.
  remedy: { lesson: '8.3', label: 'אי-תלות בפרמטריזציה' }

- id: MC-c8-integral-depends-on-image
  title: חושבים שהאינטגרל הקווי נקבע על ידי התמונה של המסילה
  belief: >-
    שתי מסילות עם אותה תמונה נותנות אותו אינטגרל, ולכן "האינטגרל על המעגל" מוגדר בלי לציין את המסילה.
  truth: >-
    האינטגרל תלוי בפונקציה $\gamma$ עד כדי פרמטריזציה ששומרת על הכיוון. מעגל שעוברים עליו פעמיים נותן פי 2, ומעגל
    בכיוון ההפוך נותן מינוס. כשכותבים "על המעגל" מתכוונים למסילה מסוימת: פעם אחת, נגד כיוון השעון.
  remedy: { lesson: '8.3', label: 'אי-תלות בפרמטריזציה ומה היא לא אומרת' }

- id: MC-c8-bound-chord
  title: מציבים בחסם את המרחק בין הקצוות במקום את אורך המסילה
  belief: >-
    $\left|\int_\gamma F\cdot ds\right|\le\|\gamma(b)-\gamma(a)\|\cdot\max\|F\|$.
  truth: >-
    החסם הוא $L(\gamma)\cdot\max_{t}\|F(\gamma(t))\|$, עם **אורך המסילה**. למסילה סגורה המרחק בין הקצוות 0,
    ובכל זאת $\oint(-y\,dx+x\,dy)=2\pi$ על מעגל היחידה.
  remedy: { lesson: '8.3', label: 'חסם על אינטגרל קווי' }

- id: MC-c8-bound-is-value
  title: חושבים שהחסם על האינטגרל הקווי הוא ערכו
  belief: >-
    $\int_\gamma F\cdot ds$ שווה ל-$L(\gamma)\cdot\max\|F\|$, או לפחות שווה לו כש-$\|F\|$ קבועה על המסילה.
  truth: >-
    החסם נובע מ-$|F\cdot\gamma'|\le\|F\|\,\|\gamma'\|$ (קושי-שוורץ), והשוויון דורש ש-$F$ יהיה בכל נקודה **בכיוון**
    $\gamma'$. שדה רדיאלי באורך 1 על מעגל נותן 0.
  remedy: { lesson: '8.3', label: 'חסם על אינטגרל קווי' }
