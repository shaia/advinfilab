# Misconceptions first detected in lesson 5.6 (the mean value theorem in several variables).
- id: MC-c5-mvt-segment-needed
  title: שוכחים שמשפט הערך הממוצע מדבר על נקודה פנימית של הקטע
  belief: >-
    הנקודה $c$ במשפט הערך הממוצע יכולה להיות בכל מקום בתחום, או בקצה הקטע; ואין צורך שהקטע $[a,b]$ יהיה בתחום.
  truth: >-
    המשפט: אם $[a,b]\subseteq U$, יש $c=a+\tau(b-a)$ עם $0<\tau<1$ כך ש-$f(b)-f(a)=\nabla f(c)\cdot(b-a)$. הנקודה על
    הקטע ובפנים שלו, וההוכחה עוברת דרך $\varphi(t)=f(a+t(b-a))$, שמוגדרת רק כשהקטע כולו בתחום.
  remedy: { lesson: '5.6', label: 'משפט הערך הממוצע על קטע' }

- id: MC-c5-mvt-midpoint
  title: חושבים שהנקודה במשפט הערך הממוצע היא אמצע הקטע
  belief: >-
    במשפט הערך הממוצע אפשר תמיד לקחת את אמצע הקטע.
  truth: >-
    המשפט מבטיח קיום בלבד. האמצע עובד כש-$\varphi(t)=f(a+t(b-a))$ ריבועית (למשל $f$ פולינום ממעלה 2), כי אז
    $\varphi(1)-\varphi(0)=\varphi'(\frac12)$; ל-$x^3-y^2$ על הקטע מ-$(0,0)$ ל-$(1,1)$ הנקודה היא $\tau=\frac23$.
  remedy: { lesson: '5.6', label: 'משפט הערך הממוצע: קיום, לא מיקום' }

- id: MC-c5-mvt-vector-equality
  title: מפעילים שוויון ערך ממוצע על פונקציה וקטורית
  belief: >-
    לכל $f:U\to\mathbb{R}^m$ יש $c$ על הקטע עם $f(b)-f(a)=Df(c)(b-a)$, כי זה נכון לכל רכיב.
  truth: >-
    לכל רכיב יש נקודה משלו, ובדרך כלל אין נקודה משותפת. $\gamma(t)=(\cos t,\sin t)$ על $[0,2\pi]$: ההפרש 0
    ו-$\|\gamma'\|\equiv1$. מה שנכון לפונקציות וקטוריות הוא אי-השוויון
    $\|f(b)-f(a)\|\le\sup_{[a,b]}\|Df\|_{\mathrm{op}}\|b-a\|$.
  remedy: { lesson: '5.6', label: 'אין שוויון ערך ממוצע לפונקציות וקטוריות' }

- id: MC-c5-mvt-coordinatewise
  title: מוכיחים את משפט הערך הממוצע קואורדינטה אחר קואורדינטה
  belief: >-
    מפעילים את משפט לגרנז' על כל משתנה בנפרד ומקבלים נקודה אחת $c$ על הקטע.
  truth: >-
    צעדים מקבילים לצירים נותנים נקודה אחרת לכל קואורדינטה, ובדרך כלל לא על הקטע $[a,b]$. ההוכחה הנכונה מפעילה את
    לגרנז' פעם אחת, על $\varphi(t)=f(a+t(b-a))$, ואת כלל השרשרת על $\varphi'$.
  remedy: { lesson: '5.6', label: 'הוכחת משפט הערך הממוצע: הצמצום לקטע' }

- id: MC-c5-mvi-wrong-bound
  title: לוקחים קבוע לא נכון באי-שוויון הערך הממוצע
  belief: >-
    באי-שוויון הערך הממוצע אפשר לחסום בנגזרת בנקודה אחת, באינפימום שלה, או שהקבוע הטוב הוא נורמת פרובניוס או סכום
    החסמים של הרכיבים.
  truth: >-
    הקבוע הוא $\sup_{c\in[a,b]}\|Df(c)\|_{\mathrm{op}}$: סופרמום, של נורמת **האופרטור**, לאורך הקטע. נורמת פרובניוס
    גדולה ממנה או שווה לה, ולכן נותנת חסם נכון אבל חלש יותר.
  remedy: { lesson: '5.6', label: 'אי-שוויון הערך הממוצע עם נורמת אופרטור' }

- id: MC-c5-zero-derivative-disconnected
  title: חושבים שדיפרנציאל אפס גורר קביעות על כל קבוצה פתוחה
  belief: >-
    אם $Df\equiv0$ על קבוצה פתוחה $U$, $f$ קבועה על $U$.
  truth: >-
    צריך ש-$U$ תהיה גם קשירה מסילתית. על $\{x\ne0\}$ הפונקציה ששווה 1 ב-$x>0$ ו-$-1$ ב-$x<0$ מקיימת $Df\equiv0$. על
    קבוצה פתוחה כללית $f$ קבועה בכל רכיב קשירות בנפרד.
  remedy: { lesson: '5.6', label: 'דיפרנציאל אפס: קבועה על קבוצה קשירה מסילתית' }

- id: MC-c5-mvt-nonconvex
  title: הופכים חסם על הדיפרנציאל לקבוע ליפשיץ בקבוצה לא קמורה
  belief: >-
    אם $\|Df\|_{\mathrm{op}}\le M$ על קבוצה פתוחה (וקשירה מסילתית) $U$, אז $f$ ליפשיצית עם קבוע $M$ על $U$.
  truth: >-
    אי-שוויון הערך הממוצע חל על קטעים בתוך $U$, ולכן החסם עובר לקבוע ליפשיץ על קבוצה **קמורה**. על עיגול חיצוני בלי
    קרן, הזווית הקוטבית מקיימת $\|\nabla\theta\|<1$ ובכל זאת קופצת בכמעט $2\pi$ בין נקודות קרובות משני צדי הקרן.
  remedy: { lesson: '5.6', label: 'קבוע ליפשיץ מחסם על הדיפרנציאל: הצורך בקמירות' }
