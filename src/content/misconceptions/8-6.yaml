# Misconceptions first detected in lesson 8.6 (the winding number).
- id: MC-c8-winding-any-circle
  title: חושבים שכל מעגל מסתובב פעם אחת סביב כל נקודה
  belief: >-
    מספר הליפוף של מעגל שעוברים עליו פעם אחת נגד כיוון השעון הוא 1, בלי קשר למיקום הנקודה $p$.
  truth: >-
    מספר הליפוף הוא 1 לנקודות **בתוך** המעגל ו-0 לנקודות מחוצה לו: לנקודה בחוץ יש חצי מישור שמכיל את המעגל ולא
    את $p$, ושם השדה $\omega_p$ משמר. כך גם באינטגרל של צירוף שדות זווית: רק הנקודות שבפנים תורמות.
  remedy: { lesson: '8.6', label: 'מספר הליפוף בפנים ובחוץ' }

- id: MC-c8-winding-on-curve
  title: מחשבים מספר ליפוף סביב נקודה שעל המסילה
  belief: >-
    $\operatorname{Ind}(\gamma,p)$ מוגדר לכל $p$; לנקודה על המסילה הוא 0, או חצי.
  truth: >-
    השדה $\omega_p$ אינו מוגדר ב-$p$, ולכן $\operatorname{Ind}(\gamma,p)$ מוגדר רק ל-$p\notin\gamma([a,b])$. כשהנקודה
    חוצה את המסילה, מספר הליפוף קופץ.
  remedy: { lesson: '8.6', label: 'ההגדרה של מספר הליפוף' }

- id: MC-c8-winding-not-integer
  title: מתעלמים מכך שמספר הליפוף של מסילה סגורה שלם
  belief: >-
    מספר הליפוף יכול להיות שבר, למשל חצי למסילה שמקיפה את הנקודה "בחלקה"; ופונקציה רציפה של $p$ יכולה לקבל כל
    ערך בין שני ערכים.
  truth: >-
    למסילה **סגורה** $\operatorname{Ind}(\gamma,p)\in\mathbb{Z}$: האינטגרל הוא השינוי הכולל של זווית רציפה, והמסילה
    חוזרת לאותה נקודה. לכן, כפונקציה רציפה של $p$ עם ערכים שלמים, הוא קבוע על כל קבוצה קשירה מסילתית שזרה למסילה.
  remedy: { lesson: '8.6', label: 'מספר הליפוף שלם' }

- id: MC-c8-winding-independent-of-p
  title: חושבים שמספר הליפוף תלוי רק במסילה
  belief: >-
    למסילה סגורה יש "מספר ליפוף" אחד, אותו לכל נקודה שאינה עליה.
  truth: >-
    $\operatorname{Ind}(\gamma,p)$ תלוי ב-$p$: הוא קבוע על כל רכיב של המשלים של המסילה, אבל משתנה בין רכיבים. למעגל
    היחידה הוא 1 ב-$(0,0)$ ו-0 ב-$(3,0)$; ל"שמונה" הוא $1$, $(-1)$ ו-0 בשלושת הרכיבים.
  remedy: { lesson: '8.6', label: 'מספר הליפוף קבוע על רכיבי המשלים' }

- id: MC-c8-winding-normalisation
  title: מבלבלים בין מספר הליפוף לבין האינטגרל של שדה הזווית
  belief: >-
    מספר הליפוף הוא האינטגרל של $\omega_p$ על המסילה; או: האינטגרל של שדה הזווית הוא מספר הליפוף.
  truth: >-
    $\int_\gamma\omega_p\cdot ds=2\pi\operatorname{Ind}(\gamma,p)$. מספר הליפוף סופר סיבובים (מספר שלם), והאינטגרל
    מודד זווית ברדיאנים.
  remedy: { lesson: '8.6', label: 'ההגדרה של מספר הליפוף' }
