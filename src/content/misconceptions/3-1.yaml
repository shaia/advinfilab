# Misconceptions first detected in lesson 3.1 (sequential compactness).
- id: MC-c3-closed-bounded-compact
  title: חושבים שבכל מרחב מטרי קבוצה סגורה וחסומה היא קומפקטית
  belief: >-
    כמו בישר ובמרחב האוקלידי, בכל מרחב מטרי (ובכל מרחב נורמי) קבוצה סגורה וחסומה היא קומפקטית.
  truth: >-
    בכל מרחב מטרי קומפקטית גורר סגורה וחסומה, אבל הכיוון ההפוך נכון במרחב האוקלידי ונכשל באופן כללי.
    $\mathbb{N}$ עם המטריקה הבדידה סגורה וחסומה ואינה קומפקטית, וכך גם כדור היחידה הסגור של
    $(C[0,1],\|\cdot\|_\infty)$: הסדרה $x^n$ שבו אין לה תת-סדרה מתכנסת.
  remedy: { lesson: '3.1', label: 'קבוצות סגורות וחסומות שאינן קומפקטיות' }

- id: MC-c3-closed-in-itself
  title: חושבים שמרחב שסגור בעצמו וחסום הוא קומפקטי
  belief: >-
    כל מרחב מטרי סגור בתוך עצמו, ולכן מרחב חסום, כמו הקטע $(0,1]$ כמרחב בפני עצמו, הוא קומפקטי.
  truth: >-
    קומפקטיות היא תכונה של המרחב עצמו, לא של הקבוצה בתוך מרחב גדול יותר: היא דורשת שהגבול של תת-הסדרה יהיה
    **בתוך** הקבוצה. במרחב $(0,1]$ הסדרה $\frac1n$ לא מכילה תת-סדרה שמתכנסת לנקודה של $(0,1]$, ולכן הוא אינו
    קומפקטי, אף שהוא "סגור בעצמו" וחסום.
  remedy: { lesson: '3.1', label: 'הגבול חייב להיות בתוך הקבוצה' }

- id: MC-c3-bw-everywhere
  title: חושבים שבכל מרחב מטרי לכל סדרה חסומה יש תת-סדרה מתכנסת
  belief: >-
    משפט בולצאנו-ויירשטראס נכון בכל מרחב מטרי: לכל סדרה חסומה יש תת-סדרה מתכנסת.
  truth: >-
    בולצאנו-ויירשטראס הוא משפט על הישר (ובקואורדינטות, על המרחב האוקלידי). במטריקה הבדידה הסדרה $1,2,3,\dots$
    חסומה ואין לה תת-סדרה מתכנסת, ובמרחב הסדרות החסומות $B(\mathbb{N})$ וקטורי היחידה $e_k$ רחוקים זה מזה
    מרחק 1.
  remedy: { lesson: '3.1', label: 'בולצאנו-ויירשטראס במרחב האוקלידי בלבד' }

- id: MC-c3-bw-is-compactness
  title: מבלבלים בין תכונת בולצאנו-ויירשטראס לבין קומפקטיות
  belief: >-
    מרחב שבו לכל סדרה חסומה יש תת-סדרה מתכנסת הוא קומפקטי.
  truth: >-
    קומפקטיות דורשת תת-סדרה מתכנסת ל**כל** סדרה, גם לסדרה לא חסומה. בישר לכל סדרה חסומה יש תת-סדרה
    מתכנסת, אבל לסדרה $a_n=n$ אין, ולכן $\mathbb{R}$ אינו קומפקטי.
  remedy: { lesson: '3.1', label: 'ההגדרה של קומפקטיות סדרתית' }

- id: MC-c3-limit-in-set
  title: שוכחים שהגבול של תת-הסדרה צריך להיות בתוך הקבוצה
  belief: >-
    $K$ קומפקטית אם לכל סדרה ב-$K$ יש תת-סדרה שמתכנסת במרחב כלשהו, גם לנקודה שמחוץ ל-$K$.
  truth: >-
    בהגדרה הגבול חייב להיות נקודה של $K$. לכל סדרה ב-$(0,1)$ יש תת-סדרה שמתכנסת ב-$\mathbb{R}$, אבל
    $\frac1n$ מתכנסת ל-0, שאינו ב-$(0,1)$, ולכן $(0,1)$ אינה קומפקטית.
  remedy: { lesson: '3.1', label: 'ההגדרה של קומפקטיות סדרתית' }

- id: MC-c3-whole-sequence
  title: חושבים שבקבוצה קומפקטית כל סדרה מתכנסת
  belief: >-
    בקבוצה קומפקטית כל סדרה מתכנסת, לא רק תת-סדרה שלה.
  truth: >-
    ההגדרה מבטיחה רק תת-סדרה מתכנסת. הקטע $[-1,1]$ קומפקטי, והסדרה $(-1)^n$ שבו אינה מתכנסת; תת-הסדרה של
    האיברים הזוגיים מתכנסת ל-1.
  remedy: { lesson: '3.1', label: 'ההגדרה של קומפקטיות סדרתית' }

- id: MC-c3-negate-compact
  title: שוללים את ההגדרה של קומפקטיות סדרתית לא נכון
  belief: >-
    כדי להראות ש-$K$ אינה קומפקטית מספיקה סדרה אחת שאינה מתכנסת, או שצריך שאף סדרה לא תכיל תת-סדרה מתכנסת.
  truth: >-
    השלילה היא: **קיימת** סדרה ב-$K$ ש**לאף** תת-סדרה שלה אין גבול ב-$K$. סדרה שאינה מתכנסת לא מספיקה
    ($(-1)^n$ בקטע $[-1,1]$ הקומפקטי), ולא צריך שכל הסדרות ייכשלו (בכל קבוצה לא ריקה יש סדרות קבועות).
  remedy: { lesson: '3.1', label: 'מה פירוש שקבוצה אינה קומפקטית' }

- id: MC-c3-pointwise-is-enough
  title: מסתפקים בהתכנסות נקודתית במרחב של פונקציות רציפות עם נורמת הסופרמום
  belief: >-
    הסדרה $x^n$ מתכנסת נקודתית בקטע $[0,1]$, ולכן היא (או תת-סדרה שלה) מתכנסת גם ב-$(C[0,1],\|\cdot\|_\infty)$.
  truth: >-
    התכנסות בנורמת הסופרמום היא התכנסות במידה שווה. הגבול הנקודתי של $x^n$ (0 ב-$[0,1)$ ו-1 ב-1) אינו רציף,
    ולכן לאף תת-סדרה אין גבול במידה שווה; ואכן $\|x^n-x^{2n}\|_\infty=\frac14$ לכל $n$.
  remedy: { lesson: '3.1', label: 'כדור היחידה במרחב הפונקציות הרציפות' }

- id: MC-c3-separate-subsequences
  title: בוחרים תת-סדרה נפרדת לכל קואורדינטה
  belief: >-
    בהוכחה שסגורה וחסומה במרחב האוקלידי היא קומפקטית, מפעילים את בולצאנו-ויירשטראס על כל קואורדינטה בנפרד,
    על הסדרה המקורית, ומסיימים.
  truth: >-
    תת-הסדרה שמתאימה לקואורדינטה הראשונה עלולה להיות האינדקסים הזוגיים, וזו של השנייה האי-זוגיים, ואז אין
    תת-סדרה אחת שבה שתיהן מתכנסות. לכן בוחרים תת-סדרה של תת-הסדרה: בה הקואורדינטה הראשונה עדיין מתכנסת.
  remedy: { lesson: '3.1', label: 'בולצאנו-ויירשטראס בקואורדינטות' }

- id: MC-c3-usual-metric-habit
  title: שופטים חסימות, סגירות או התכנסות לפי המטריקה הרגילה במקום המטריקה הנתונה
  belief: >-
    $\mathbb{N}$ אינה חסומה גם במטריקה הבדידה, וכדור היחידה של נורמה כלשהי נראה כמו העיגול הרגיל.
  truth: >-
    חסימות, סגירות, התכנסות וכדורים נקבעים לפי המטריקה שעל המרחב. במטריקה הבדידה כל המרחקים הם 0 או 1, ולכן
    כל קבוצה חסומה; כדור היחידה של $\|\cdot\|_1$ במישור הוא ריבוע מסובב, לא עיגול.
  remedy: { lesson: '3.1', label: 'המטריקה הבדידה כמרחב בדיקה' }
