# Misconceptions first detected in lesson 7.7 (functional dependence).
- id: MC-c7-dependence-F-nonzero
  title: מסתפקים בקשר F שאינו זהותית אפס, בלי לדרוש גרדיאנט שונה מאפס
  belief: >-
    $f_1,\dots,f_k$ תלויות פונקציונלית אם יש פונקציה גזירה ברציפות $F$, שאינה זהותית אפס, עם
    $F(f_1,\dots,f_k)=0$.
  truth: >-
    ההגדרה דורשת $\nabla F\neq0$ בכל נקודה של קבוצה פתוחה $W$ שמכילה את התמונה $f(U)$. בלי זה כל משפחה עם תמונה
    חסומה הייתה "תלויה": $f=(x,y)$ על עיגול היחידה הפתוח ו-$F(u,v)=\left(\max\{0,\,u^2+v^2-1\}\right)^2$ מקיימות
    $F\circ f=0$, אף ש-$J_f=I$. גם $F(x,y)=y^2-x^2+x^4$, שמתאפסת על התמונה של $(\sin t,\sin t\cos t)$, אינה עדה
    לתלות, כי $\nabla F(0,0)=0$.
  remedy: { lesson: '7.7', label: 'ההגדרה של תלות פונקציונלית: למה הגרדיאנט של F שונה מאפס' }

- id: MC-c7-functional-is-linear
  title: מבלבלים בין תלות פונקציונלית לתלות לינארית
  belief: >-
    $f_1,\dots,f_k$ תלויות פונקציונלית אם ורק אם יש קבועים $c_i$, לא כולם 0, עם $c_1f_1+\dots+c_kf_k=0$.
  truth: >-
    תלות לינארית היא המקרה הפרטי שבו $F$ לינארית. $x+y$ ו-$e^{x+y}$ אינן תלויות לינארית, אבל הן תלויות
    פונקציונלית על $\mathbb{R}^2$ עם $F(u,v)=v-e^u$, ש-$\nabla F=(-e^u,1)\neq0$.
  remedy: { lesson: '7.7', label: 'ההגדרה של תלות פונקציונלית' }

- id: MC-c7-rank-implies-dependence
  title: חושבים שדרגה קטנה ממספר הפונקציות בכל נקודה גוררת תלות
  belief: >-
    אם הדרגה של $J_f(x)$ קטנה מ-$k$ לכל $x\in U$, אז $f_1,\dots,f_k$ תלויות פונקציונלית על $U$.
  truth: >-
    זה רק תנאי הכרחי. $f(t)=(t^3,|t|^3)$ על $(-1,1)$ מקיימת דרגה קטנה מ-2 בכל נקודה, אבל כל $F$ עם $F\circ f=0$
    מקיימת $\nabla F(0,0)\cdot(1,1)=0$ ו-$\nabla F(0,0)\cdot(1,-1)=0$, כלומר $\nabla F(0,0)=0$. הכיוון ההפוך נכון
    רק מקומית, ורק תחת דרגה **קבועה**.
  remedy: { lesson: '7.7', label: 'דרגה שאינה קבועה: הדוגמה של t בשלישית וערכו המוחלט בשלישית' }

- id: MC-c7-dependence-nonsmooth-F
  title: מקבלים קשר לא גזיר בין הפונקציות כעדות לתלות
  belief: >-
    אם $f_2=\psi(f_1)$ לאיזו פונקציה $\psi$, אפילו לא גזירה, אז $f_1,f_2$ תלויות פונקציונלית.
  truth: >-
    ההגדרה דורשת $F$ גזירה ברציפות על קבוצה פתוחה שמכילה את התמונה. $f_2=|t|^3=|f_1|$ ל-$f_1=t^3$, אבל
    $F(u,v)=v-|u|$ אינה גזירה ב-$(0,0)$, ושום $F$ גזירה ברציפות עם $\nabla F\neq0$ אינה מתאפסת על הצורה
    $v=|u|$ ליד הראשית.
  remedy: { lesson: '7.7', label: 'דרגה שאינה קבועה: הדוגמה של t בשלישית וערכו המוחלט בשלישית' }

- id: MC-c7-constant-rank-global
  title: חושבים שדרגה קבועה נותנת קשר אחד על כל התחום
  belief: >-
    אם הדרגה של $J_f$ קבועה ושווה ל-$r<k$ על כל $U$, יש קשר אחד $f_j=G_j(f_1,\dots,f_r)$ על כל $U$.
  truth: >-
    המשפט על דרגה קבועה מקומי, כמו משפט הפונקציה ההפוכה שממנו הוא נובע. ל-$f=(\sin t,\ \sin t\cos t)$ הדרגה 1 בכל
    $\mathbb{R}$, ובכל זאת אין קשר על כל $\mathbb{R}$: $f(0)=f(\pi)=(0,0)$ עם $f'(0)=(1,1)$ ו-$f'(\pi)=(-1,1)$, ולכן כל
    $F$ עם $F\circ f=0$ מקיימת $\nabla F(0,0)=0$.
  remedy: { lesson: '7.7', label: 'הלמניסקטה: דרגה קבועה ותלות מקומית בלבד' }

- id: MC-c7-any-r-functions
  title: חושבים שכל r מהפונקציות קובעות את השאר
  belief: >-
    אם הדרגה של $J_f$ קבועה ושווה ל-$r$, אז כל $r$ מהפונקציות $f_1,\dots,f_k$ קובעות מקומית את השאר.
  truth: >-
    המשפט בוחר $r$ פונקציות שהגרדיאנטים שלהן בנקודה בלתי תלויים לינארית. ל-$f_1=x+y$, $f_2=z$, $f_3=x+y+z^2$ הדרגה
    2 בכל מקום, אבל בראשית $\nabla f_1=\nabla f_3=(1,1,0)$, ובכל סביבה שלה הנקודות $(0,0,\pm s)$ נותנות אותם ערכים
    של $f_1$ ו-$f_3$ וערכים שונים של $f_2$.
  remedy: { lesson: '7.7', label: 'המשפט על דרגה קבועה: אילו פונקציות קובעות את השאר' }

- id: MC-c7-rank-at-point-enough
  title: מסתפקים בדרגה בנקודה אחת במקום דרגה קבועה בסביבה
  belief: >-
    אם הדרגה של $J_f(a)$ קטנה מ-$k$, הפונקציות תלויות ליד $a$; או: די שהדרגה היא $r$ ב-$a$ כדי ש-$r$ פונקציות
    יקבעו את השאר ליד $a$.
  truth: >-
    דרושה דרגה $r$ **בכל** נקודה של סביבה של $a$. ל-$f_1=x$, $f_2=xy$ הדרגה בראשית 1, אבל $\det J_f=x$, ובכל סביבה
    של הראשית יש $(\varepsilon,1)$ ו-$(\varepsilon,2)$ עם אותו $f_1$ וערכים שונים של $f_2$. בהוכחה, הדרגה בכל נקודה
    היא שנותנת $\partial_sh_j=0$ על כל התיבה ולא רק בנקודה אחת.
  remedy: { lesson: '7.7', label: 'המשפט על דרגה קבועה: איפה משתמשים בדרגה בכל הסביבה' }

- id: MC-c7-rank-drop-independent
  title: חושבים שכשהדרגה אינה קבועה אין תלות
  belief: >-
    אם הדרגה של $J_f$ אינה קבועה באף סביבה של $a$, הפונקציות אינן תלויות פונקציונלית ליד $a$.
  truth: >-
    דרגה קבועה היא תנאי מספיק לקשר מקומי, לא הכרחי. ל-$f_1=x+y+z$, $f_2=x^2+y^2+z^2$, $f_3=xy+yz+zx$ הדרגה יורדת
    מ-2 ל-1 על הישר $x=y=z$, ובכל זאת $F(u,v,w)=v-u^2+2w$ מקיימת $F\circ f=0$ ו-$\nabla F=(-2u,1,2)\neq0$ על כל
    $\mathbb{R}^3$.
  remedy: { lesson: '7.7', label: 'פולינומים סימטריים: תלות בלי דרגה קבועה' }
