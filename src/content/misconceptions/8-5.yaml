# Misconceptions first detected in lesson 8.5 (locally conservative fields and homotopy).
- id: MC-c8-local-means-global
  title: מזהים שדה משמר מקומית עם שדה משמר
  belief: >-
    אם ל-$F$ יש פוטנציאל סביב כל נקודה, אפשר להדביק את הפוטנציאלים המקומיים לפוטנציאל אחד בכל התחום; ושדה שאינו
    משמר אינו משמר גם מקומית.
  truth: >-
    שדה הזווית משמר מקומית ב-$\mathbb{R}^2\setminus\{0\}$ (בכל כדור שאינו מכיל את הראשית יש ענף של הזווית), אבל
    אינו משמר שם. ההדבקה נכשלת כשמקיפים את הראשית: הזווית חוזרת עם תוספת $2\pi$. היא מצליחה בתחום פשוט קשר.
  remedy: { lesson: '8.5', label: 'משמר מקומית לעומת משמר' }

- id: MC-c8-locally-conservative-definition
  title: מגדירים שדה משמר מקומית בעזרת תנאי הנגזרות המוצלבות או ברדיוס אחיד
  belief: >-
    "משמר מקומית" פירושו שהשדה מקיים את תנאי הנגזרות המוצלבות; או שיש רדיוס $r$ אחד כך שבכל כדור ברדיוס $r$ יש
    פוטנציאל.
  truth: >-
    ההגדרה: לכל $x\in U$ יש $r>0$, **שתלוי ב-$x$**, כך ש-$B(x,r)\subseteq U$ ול-$F$ יש פוטנציאל ב-$B(x,r)$. תנאי
    הנגזרות המוצלבות הוא מבחן מספיק לשדה גזיר ברציפות (משפט), לא ההגדרה; השדה הרציף $(|x|,0)$ אינו גזיר ובכל זאת
    משמר, עם הפוטנציאל $\frac{x|x|}{2}$.
  remedy: { lesson: '8.5', label: 'ההגדרה של שדה משמר מקומית' }

- id: MC-c8-homotopy-leaves-domain
  title: מרשים להומוטופיה לצאת מהתחום
  belief: >-
    כדי להראות שמסילה סגורה ב-$U$ הומוטופית לנקודה מספיק לכווץ אותה במישור, גם אם בדרך עוברים בנקודה שאינה ב-$U$.
  truth: >-
    הומוטופיה ב-$U$ היא העתקה רציפה $H:[0,1]\times[a,b]\to U$: **כל** המסילות בדרך, $H(s,\cdot)$, נמצאות ב-$U$.
    הכיווץ $(1-s)(\cos t,\sin t)$ עובר בראשית ב-$s=1$, ולכן אינו הומוטופיה ב-$\mathbb{R}^2\setminus\{0\}$.
  remedy: { lesson: '8.5', label: 'הומוטופיה של מסילות סגורות' }

- id: MC-c8-homotopy-not-closed
  title: שוכחים שבהומוטופיה של מסילות סגורות כל מסילת ביניים סגורה
  belief: >-
    מספיק ש-$H$ רציפה ומתחילה ב-$\gamma_0$ ומסתיימת ב-$\gamma_1$; מה שקורה לקצוות של מסילות הביניים לא חשוב.
  truth: >-
    דורשים $H(s,a)=H(s,b)$ לכל $s$. בלי זה כל מסילה סגורה "הומוטופית" לנקודה: פותחים את הלולאה ומושכים את הקצוות
    לאורכה. ההגדרה נועדה לכך שהאינטגרל של שדה משמר מקומית לא ישתנה לאורך הדרך.
  remedy: { lesson: '8.5', label: 'הומוטופיה של מסילות סגורות' }

- id: MC-c8-homotopy-by-image
  title: מכריעים הומוטופיה לפי הצורה או הגודל של התמונה
  belief: >-
    מסילות עם תמונות שונות (מעגל קטן ומעגל גדול, מעגל וריבוע) אינן הומוטופיות; מסילות עם אותה תמונה הומוטופיות.
  truth: >-
    הומוטופיה היא עיוות רציף בתוך התחום, ולכן גודל וצורה לא משנים: ב-$\mathbb{R}^2\setminus\{0\}$ המעגלים
    ברדיוס 1 וברדיוס 2 הומוטופיים דרך $(1+s)(\cos t,\sin t)$. להפך, המעגל פעם אחת ופעמיים בעלי אותה תמונה ואינם
    הומוטופיים (מספרי ליפוף 1 ו-2).
  remedy: { lesson: '8.5', label: 'הומוטופיה של מסילות סגורות' }

- id: MC-c8-connected-is-simply-connected
  title: מבלבלים בין קשירה מסילתית לבין פשוט קשר
  belief: >-
    תחום שאפשר לחבר בו כל שתי נקודות במסילה הוא פשוט קשר; או: כל שתי מסילות סגורות בתחום קשיר הומוטופיות.
  truth: >-
    פשוט קשר דורש יותר: כל מסילה סגורה בתחום הומוטופית בתוכו למסילה קבועה. $\mathbb{R}^2\setminus\{0\}$ קשירה
    מסילתית ואינה פשוטת קשר: שדה הזווית משמר מקומית בה ואינו משמר.
  remedy: { lesson: '8.5', label: 'תחום פשוט קשר' }
