# Misconceptions first detected in lesson 1.6 (continuity between metric spaces).
- id: MC-c1-continuity-direction
  title: הופכים את הכיוון באפיון הרציפות
  belief: >-
    $f$ רציפה אם ורק אם התמונה של כל קבוצה פתוחה פתוחה; או שבהגדרה "קרוב בתמונה גורר קרוב בתחום".
  truth: >-
    רציפות היא תנאי על **מקורות** (משפט 1.6.4): $f^{-1}(V)$ פתוח לכל $V$ פתוח, ו"קרוב בתחום גורר קרוב בתמונה". פונקציה
    קבועה רציפה, והתמונה של $(0,1)$ היא נקודה, שאינה פתוחה; $x^2$ מעבירה את $\mathbb{R}$ ל-$[0,\infty)$.
  remedy: { lesson: '1.6', anchor: preimage, label: 'רציפות דרך מקורות של קבוצות פתוחות' }

- id: MC-c1-continuous-uniform
  title: חושבים שכל פונקציה רציפה רציפה במידה שווה
  belief: >-
    אם $f$ רציפה בכל נקודה, אז אותו $\delta$ מתאים לכל הנקודות.
  truth: >-
    ב-$x^2$ על $\mathbb{R}$: $x=n$, $y=n+\frac1n$ קרובים כרצוננו, ו-$|y^2-x^2|=2+\frac{1}{n^2}\ge2$. לכן $x^2$
    רציפה ואינה רציפה במידה שווה. על קבוצה קומפקטית זה משתנה (משפט קנטור, שיעור 3.4).
  remedy: { lesson: '1.6', anchor: lipschitz, label: 'רציפות במידה שווה' }

- id: MC-c1-uniform-lipschitz
  title: מזהים רציפות במידה שווה עם ליפשיציות
  belief: >-
    פונקציה רציפה במידה שווה היא ליפשיצית, ולהפך פונקציה עם נגזרת לא חסומה אינה רציפה במידה שווה.
  truth: >-
    ליפשיצית גוררת רציפה במידה שווה (טענה 1.6.9, עם $\delta=\frac\varepsilon L$), אבל לא להפך: $\sqrt x$ על $[0,1]$ רציפה
    במידה שווה, כי $|\sqrt x-\sqrt y|\le\sqrt{|x-y|}$, ואינה ליפשיצית, כי $\frac{\sqrt x-0}{x-0}=\frac1{\sqrt x}$
    אינו חסום.
  remedy: { lesson: '1.6', anchor: lipschitz, label: 'ליפשיצית מול רציפה במידה שווה' }

- id: MC-c1-bijection-homeomorphism
  title: חושבים שהעתקה רציפה, חד-חד-ערכית ועל היא הומיאומורפיזם
  belief: >-
    אם $f$ רציפה והפיכה, ההופכית שלה רציפה אוטומטית.
  truth: >-
    הזהות מ-$\mathbb{R}$ עם המטריקה הבדידה ל-$\mathbb{R}$ הרגיל רציפה, חד-חד-ערכית ועל, וההופכית שלה אינה
    רציפה. גם $t\mapsto(\cos t,\sin t)$ מ-$[0,2\pi)$ למעגל (טענה 1.6.10). (ממרחב קומפקטי זה כן נכון, שיעור 3.4.)
  remedy: { lesson: '1.6', anchor: homeomorphism, label: 'הומיאומורפיזם' }

- id: MC-c1-homeo-preserves-metric
  title: חושבים שהומיאומורפיזם שומר על חסימות ועל מרחקים
  belief: >-
    מרחבים הומיאומורפיים "זהים", ולכן אם אחד חסום גם השני חסום.
  truth: >-
    הומיאומורפיזם שומר על מה שמוגדר דרך קבוצות פתוחות (פתיחות, סגירות, התכנסות, רציפות; טענה 1.6.10 (ד), (ו)), לא
    על מרחקים. $x\mapsto\tan(\pi(x-\frac12))$ הוא הומיאומורפיזם מ-$(0,1)$ החסום על $\mathbb{R}$ (טענה 1.6.10 (ה)).
  remedy: { lesson: '1.6', anchor: homeomorphism, label: 'הומיאומורפיזם מקטע פתוח לישר' }

- id: MC-c1-closed-graph-converse
  title: חושבים שגרף סגור גורר רציפות
  belief: >-
    לפונקציה רציפה $f:\mathbb{R}\to\mathbb{R}$ יש גרף סגור, ולכן גם כל פונקציה עם גרף סגור רציפה.
  truth: >-
    הכיוון ההפוך נכשל: $f(x)=\frac1x$ ל-$x\neq0$ ו-$f(0)=0$ יש גרף סגור ב-$\mathbb{R}^2$, והיא אינה רציפה ב-0.
    גרירה אינה שקולה להפוכה שלה.
  remedy: { lesson: '1.6', anchor: ex-1-6-6, label: 'גרף של פונקציה רציפה (דוגמה 6)' }

- id: MC-c1-few-sequences-continuity
  title: בודקים רציפות לאורך כמה סדרות או לאורך הצירים
  belief: >-
    אם $f(x_n)\to f(a)$ לאורך כמה סדרות שנבחרו, למשל לאורך הצירים או לאורך כל הישרים דרך $a$, אז $f$ רציפה ב-$a$.
  truth: >-
    לפי משפט 1.6.3 רציפות ב-$a$ שקולה לכך ש-$f(x_n)\to f(a)$ **לכל** סדרה $x_n\to a$. סדרה אחת שנכשלת מפריכה
    רציפות, אבל שום מספר סופי של סדרות לא מוכיח אותה. $\frac{xy}{x^2+y^2}$ מתאפסת על הצירים ושווה $\frac12$ על
    האלכסון; ו-$\frac{x^2y}{x^4+y^2}$ שואפת ל-$0$ לאורך כל ישר דרך הראשית ושווה $\frac12$ על $y=x^2$.
  remedy: { lesson: '1.6', anchor: sequences, label: 'רציפות דרך סדרות' }

- id: MC-c1-uniform-ignores-domain
  title: חושבים שרציפות במידה שווה תלויה רק בנוסחה ולא בתחום
  belief: >-
    $x^2$ אינה רציפה במידה שווה על $\mathbb{R}$, ולכן היא אינה רציפה במידה שווה על אף תחום.
  truth: >-
    רציפות במידה שווה היא תכונה של הפונקציה **עם** התחום שלה והמטריקות. על $\mathbb{N}$ עם המרחק הרגיל
    $x^2$ רציפה במידה שווה: $|m-n|<\frac12$ גורר $m=n$, ולכן $\delta=\frac12$ מתאים לכל $\varepsilon$. הזוגות
    $n$, $n+\frac1n$ שמפילים אותה על $\mathbb{R}$ אינם ב-$\mathbb{N}$.
  remedy: { lesson: '1.6', anchor: uniform, label: 'רציפה ולא במידה שווה: התחום קובע' }

- id: MC-c1-uniform-bounded
  title: חושבים שפונקציה רציפה במידה שווה על מרחב חסום חסומה
  belief: >-
    כמו על קטע חסום בישר, פונקציה רציפה במידה שווה על מרחב מטרי חסום היא חסומה.
  truth: >-
    במרחב מטרי כללי זה לא נכון. $\mathbb{N}$ עם המטריקה הבדידה חסום (הוא $B(1,2)$), ו-$f(n)=n$ רציפה במידה
    שווה לפי טענה 1.6.10 (א), ואינה חסומה. חסימות של המרחב אינה מבטיחה שאפשר לכסות אותו במספר סופי של כדורים
    קטנים, וזה מה שההוכחה בישר צריכה.
  remedy: { lesson: '1.6', anchor: discrete, label: 'המטריקה הבדידה כמרחב מבחן' }
