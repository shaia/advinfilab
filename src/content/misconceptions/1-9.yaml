# Misconceptions first detected in lesson 1.9 (convergence of a sequence of linear maps). The first two moved here
# from 1.8 on 2026-11-17, when convergence of linear maps became its own lesson.
- id: MC-c1-opconv-pointwise
  title: חושבים שהתכנסות נקודתית של העתקות היא התכנסות בנורמת האופרטור
  belief: >-
    אם $T_kx\to Tx$ לכל $x\in V$, אז $\|T_k-T\|_{\mathrm{op}}\to0$, כי הנורמה היא סופרמום של $\|T_kx-Tx\|$ על כדור
    היחידה, וכל אחד מהם שואף לאפס.
  truth: >-
    סופרמום של סדרות ששואפות לאפס אינו חייב לשאוף לאפס: התכנסות בנורמת האופרטור היא התכנסות **במידה שווה** על כדור
    היחידה (טענה 1.9.3). על $(C[0,1],\|\cdot\|_\infty)$, $T_kf=f(\frac1k)-f(0)$ שואפת לאפס לכל $f$, ובכל זאת
    $\|T_k\|_{\mathrm{op}}=2$ לכל $k$ (טענה 1.9.4). רק ב-$\mathbb{R}^n$, שבו מספיק לבדוק $n$ וקטורי בסיס, שני
    המושגים שקולים (משפט 1.9.7).
  remedy: { lesson: '1.9', anchor: pointwise-not-norm, label: 'נקודתית בלי התכנסות בנורמה' }

- id: MC-c1-opconv-norms-only
  title: חושבים שמספיק שנורמות האופרטור מתכנסות
  belief: >-
    אם $\|T_k\|_{\mathrm{op}}\to\|T\|_{\mathrm{op}}$, אז $T_k\to T$ בנורמת האופרטור.
  truth: >-
    הכיוון הנכון הוא ההפוך: מ-$\|T_k-T\|\to0$ נובע $\|T_k\|\to\|T\|$, לפי אי-שוויון המשולש ההפוך (טענה 1.9.3(ג)).
    הנורמה רואה רק את גודל המתיחה, לא את הכיוון: ל-$T_k=(-1)^kI$ על $\mathbb{R}^2$ כל הנורמות 1, והסדרה אינה
    מתכנסת, כי $T_ke_1=(-1)^ke_1$ אינה מתכנסת. וגם $\|T_k-T\|$ אינו $\|T_k\|-\|T\|$.
  remedy: { lesson: '1.9', anchor: norm-gives, label: 'מה נותנת התכנסות בנורמה' }

- id: MC-c1-opconv-one-vector
  title: חושבים שבמימד סופי מספיק לבדוק את ההתכנסות על וקטור אחד או על כיוון אחד
  belief: >-
    במימד סופי התכנסות נקודתית גוררת התכנסות בנורמה, ולכן אם $A_kv\to Av$ לווקטור אחד (או לכמה וקטורים שאינם
    פורשים), אז $A_k\to A$; או: הנורמה מתקבלת בווקטור מסוים, ולכן מספיק שההתכנסות תהיה בו.
  truth: >-
    משפט 1.9.7 משתמש בכל $n$ וקטורי הבסיס: כל אחד נותן עמודה אחת. $A_k=\begin{pmatrix}0&0\\0&k\end{pmatrix}$ מקיימת
    $A_ke_1=0$ לכל $k$, ובכל זאת $\|A_k\|=k\to\infty$. והווקטור שבו $\|A_k-A\|$ מתקבל תלוי ב-$k$, ולכן התכנסות בווקטור
    קבוע אחד אינה אומרת דבר על הנורמה.
  remedy: { lesson: '1.9', anchor: finite-dim, label: 'במימד סופי: נקודתית ובנורמה' }

- id: MC-c1-opconv-limit-bounded
  title: חושבים שגבול נקודתי של העתקות לינאריות חסומות הוא תמיד העתקה חסומה
  belief: >-
    אם כל $T_k$ לינארית וחסומה ו-$T_kx\to Sx$ לכל $x$, אז $S$ חסומה, למשל כי $\|Sx\|\le\sup_k\|T_k\|\,\|x\|$.
  truth: >-
    $S$ לינארית (למה 1.9.6), אבל לא בהכרח חסומה: $\sup_k\|T_k\|$ יכול להיות אינסופי. על הפולינומים עם נורמת
    הסופרמום, $D_kp=k\big(p(\frac1k)-p(0)\big)$ חסומים, $D_kp\to p'(0)$ לכל $p$, והגבול $p\mapsto p'(0)$ אינו חסום
    (דוגמה 6). ב-$\mathbb{R}^n$ זה לא יכול לקרות: כל העתקה לינארית שם חסומה (טענה 1.8.7).
  remedy: { lesson: '1.9', anchor: ex-1-9-6, label: 'גבול נקודתי לא חסום' }

- id: MC-c1-opconv-p-dependent
  title: חושבים שהתכנסות של מטריצות תלויה בנורמה שבה מודדים את המישור
  belief: >-
    נורמת האופרטור של מטריצה תלויה ב-$p$, ולכן סדרת מטריצות יכולה להתכנס בנורמת האופרטור כשמודדים ב-$\|\cdot\|_1$
    ולא להתכנס כשמודדים ב-$\|\cdot\|_\infty$ או ב-$\|\cdot\|_2$, או להתכנס לגבולות שונים.
  truth: >-
    המספרים $\|A_k-A\|_p$ אכן תלויים ב-$p$, אבל לפי טענה 1.9.5 כולם בין $\max_{i,j}|b_{ij}|$ ל-$\sum_{i,j}|b_{ij}|$,
    כאשר $b_{ij}$ הכניסות של $A_k-A$. לכן שלושתם שואפים לאפס יחד, בדיוק כשכל הכניסות מתכנסות, ולאותו גבול.
  remedy: { lesson: '1.9', anchor: matrix-entries, label: 'מטריצות: התכנסות של כל הכניסות' }

- id: MC-c1-opconv-no-norm-no-pointwise
  title: חושבים שסדרת העתקות שאינה מתכנסת בנורמה אינה מתכנסת גם נקודתית
  belief: >-
    אם $\|T_k-T\|_{\mathrm{op}}$ אינה שואפת לאפס, אז יש וקטור $x$ שעליו $T_kx$ אינה שואפת ל-$Tx$.
  truth: >-
    התכנסות בנורמה חזקה יותר מהתכנסות נקודתית (טענה 1.9.3), ולכן כשהחזקה נכשלת החלשה יכולה עדיין להתקיים. על
    $(C[0,1],\|\cdot\|_\infty)$, $T_kf=f(\frac1k)-f(0)$ שואפת לאפס לכל $f$ רציפה (רציפות ב-$0$), ובכל זאת
    $\|T_k\|_{\mathrm{op}}=2$ לכל $k$ (טענה 1.9.4): העד $g_k$ שעליו ההפרש $2$ משתנה עם $k$, ואין וקטור אחד שעליו
    ההתכנסות נכשלת.
  remedy: { lesson: '1.9', anchor: pointwise-not-norm, label: 'נקודתית בלי התכנסות בנורמה' }
