# Misconceptions first detected in lesson 2.6 (the completion of a metric space).
- id: MC-c2-completion-any-superset
  title: חושבים שכל מרחב שלם שמכיל את המרחב הוא ההשלמה שלו
  belief: >-
    אם $X\subseteq Y$ ו-$Y$ שלם, אז $Y$ הוא ההשלמה של $X$; למשל $\mathbb{R}$ הוא ההשלמה של $(0,1)$.
  truth: >-
    בהשלמה $X$ חייב להיות **צפוף**. ההשלמה של $(0,1)$ היא $[0,1]$, לא $\mathbb{R}$; ובתוך מרחב שלם $Y$, ההשלמה של
    $X$ היא הסגור $\overline{X}$.
  remedy: { lesson: '2.6', label: 'הגדרת ההשלמה: שיכון איזומטרי עם תמונה צפופה' }

- id: MC-c2-completion-ignores-metric
  title: חושבים שההשלמה תלויה רק בקבוצה ולא במטריקה
  belief: >-
    ההשלמה של $\mathbb{Q}$ היא תמיד $\mathbb{R}$, וההשלמה של $\mathbb{R}$ היא תמיד $\mathbb{R}$, בכל מטריקה.
  truth: >-
    ההשלמה נבנית מסדרות הקושי, והן תלויות במטריקה. $\mathbb{Q}$ עם המטריקה הבדידה שלם, ולכן הוא ההשלמה של עצמו;
    $\mathbb{R}$ עם $|\arctan x-\arctan y|$ מושלם לעותק איזומטרי של $[-\frac\pi2,\frac\pi2]$, עם שתי נקודות חדשות.
  remedy: { lesson: '2.6', label: 'השלמות תלויות במטריקה' }

- id: MC-c2-completion-adds-limits
  title: בונים את ההשלמה מ"הגבולות" של סדרות קושי
  belief: >-
    את ההשלמה בונים על ידי הוספת הגבולות של סדרות הקושי, ושתי סדרות קושי שקולות אם יש להן אותו גבול.
  truth: >-
    לסדרת קושי שאינה מתכנסת אין גבול שאפשר להוסיף: זו כל הבעיה. לכן הנקודה החדשה **היא** מחלקת השקילות של סדרות
    הקושי, ושקילות מוגדרת בלי גבול: $d(x_n,y_n)\to0$.
  remedy: { lesson: '2.6', label: 'הבנייה ממחלקות שקילות של סדרות קושי' }

- id: MC-c2-equivalence-too-strict
  title: דורשים שסדרות קושי שקולות יהיו שוות מאינדקס מסוים
  belief: >-
    שתי סדרות קושי מייצגות אותה נקודה בהשלמה רק אם הן שוות מאינדקס מסוים והלאה.
  truth: >-
    השקילות היא $d(x_n,y_n)\to0$. הקירובים העשרוניים $a_n$ של $\sqrt2$ והסדרה $a_n+10^{-n}$ לעולם אינן שוות, ובכל
    זאת הן מייצגות אותה נקודה, $\sqrt2$.
  remedy: { lesson: '2.6', label: 'יחס השקילות על סדרות קושי' }

- id: MC-c2-metric-not-well-defined
  title: מגדירים את המטריקה על ההשלמה בלי לבדוק שהיא מוגדרת היטב
  belief: >-
    $D([(x_n)],[(y_n)])=\lim d(x_n,y_n)$ מוגדר מאליו: אין צורך להראות שהגבול קיים או שהוא לא תלוי בנציגים, ואפשר
    לחשב אותו מכמה איברים ראשונים.
  truth: >-
    צריך שני דברים: $\big(d(x_n,y_n)\big)$ היא סדרת קושי ב-$\mathbb{R}$, כי
    $|d(x_n,y_n)-d(x_m,y_m)|\le d(x_n,x_m)+d(y_n,y_m)$, ולכן מתכנסת; והחלפת נציגים משנה כל איבר בפחות מ-$d(x_n,x_n')+d(y_n,y_n')\to0$.
  remedy: { lesson: '2.6', label: 'המטריקה על ההשלמה מוגדרת היטב' }

- id: MC-c2-completion-of-complete
  title: חושבים שההשלמה תמיד מוסיפה נקודות
  belief: >-
    ההשלמה של מרחב גדולה ממנו ממש, גם כשהמרחב כבר שלם.
  truth: >-
    אם $X$ שלם, הוא ההשלמה של עצמו (עם הזהות): כל סדרת קושי שקולה לסדרה קבועה, וההשלמה איזומטרית ל-$X$.
  remedy: { lesson: '2.6', label: 'ההשלמה של מרחב שלם' }
