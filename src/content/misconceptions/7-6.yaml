# Misconceptions first detected in lesson 7.6 (several constraints and applications).
- id: MC-c7-rank-each-nonzero
  title: בודקים רק שכל גרדיאנט של אילוץ שונה מאפס
  belief: >-
    בכמה אילוצים מספיק ש-$\nabla g_i(a)\neq0$ לכל $i$ כדי שיהיו כופלים.
  truth: >-
    התנאי הוא שהגרדיאנטים $\nabla g_1(a),\dots,\nabla g_k(a)$ **בלתי תלויים לינארית**, כלומר $Dg(a)$ מדרגה $k$.
    ב-$g_1=z$, $g_2=z-x^2$ בראשית שני הגרדיאנטים שווים ל-$(0,0,1)\neq0$ ותלויים, ו-$f=x+y^2$ מקבלת שם מינימום
    על $S$ בלי שיהיו כופלים.
  remedy: { lesson: '7.6', label: 'כמה אילוצים: תנאי הדרגה' }

- id: MC-c7-parallel-each
  title: דורשים שהגרדיאנט של f יהיה מקביל לכל גרדיאנט של אילוץ בנפרד
  belief: >-
    בכמה אילוצים $\nabla f(a)$ מקביל ל-$\nabla g_1(a)$ וגם ל-$\nabla g_2(a)$.
  truth: >-
    $\nabla f(a)$ הוא **צירוף לינארי** $\lambda_1\nabla g_1(a)+\dots+\lambda_k\nabla g_k(a)$: הוא ניצב למרחב המשיק
    $\bigcap_i\ker Dg_i(a)$, שהמשלים הניצב שלו הוא הפרישה של הגרדיאנטים. במקסימום של $z$ על המעגל
    $\{x^2+y^2+z^2=6,\ x+y+z=0\}$, בנקודה $(-1,-1,2)$, מתקיים $(0,0,1)=\frac16(-2,-2,4)+\frac13(1,1,1)$, ו-$(0,0,1)$
    אינו מקביל לאף אחד משני הגרדיאנטים.
  remedy: { lesson: '7.6', label: 'כמה אילוצים: צירוף לינארי של הגרדיאנטים' }

- id: MC-c7-drop-a-constraint
  title: פותרים עם חלק מהאילוצים
  belief: >-
    אפשר למצוא את הקיצון על חיתוך של שני אילוצים מתוך אחד מהם בלבד.
  truth: >-
    הנקודה האופטימלית של אילוץ אחד בדרך כלל אינה מקיימת את השני: המקסימום של $z$ על הספרה $x^2+y^2+z^2=6$ הוא
    $\sqrt6$ בנקודה $(0,0,\sqrt6)$, שאינה על המישור $x+y+z=0$; על החיתוך המקסימום הוא 2.
  remedy: { lesson: '7.6', label: 'כמה אילוצים: צירוף לינארי של הגרדיאנטים' }

- id: MC-c7-diagonal-is-max
  title: חושבים שהמקסימום של תבנית ריבועית על הספרה הוא האיבר האלכסוני הגדול
  belief: >-
    המקסימום של $x^TAx$ על ספרת היחידה הוא האיבר הגדול ביותר על האלכסון של $A$.
  truth: >-
    האיברים האלכסוניים הם הערכים על וקטורי הבסיס $e_i$ בלבד, ולכן הם רק חסם תחתון למקסימום. המקסימום הוא הערך
    העצמי הגדול: ל-$\begin{pmatrix}2&1\\1&2\end{pmatrix}$ הוא 3, בנקודה $\frac{1}{\sqrt2}(1,1)$.
  remedy: { lesson: '7.6', label: 'המקסימום של תבנית ריבועית על הספרה' }

- id: MC-c7-eigen-nonsymmetric
  title: מפעילים את תוצאת הערך העצמי על מטריצה לא סימטרית
  belief: >-
    לכל מטריצה ריבועית $A$, המקסימום של $x^TAx$ על ספרת היחידה הוא הערך העצמי הגדול של $A$.
  truth: >-
    $x^TAx=x^T\frac{A+A^T}{2}x$, והגרדיאנט שלה הוא $(A+A^T)x$, לא $2Ax$. התוצאה נכונה לחלק הסימטרי
    $\frac{A+A^T}{2}$. ל-$A=\begin{pmatrix}0&2\\0&0\end{pmatrix}$ כל הערכים העצמיים 0, אבל $x^TAx=2x_1x_2$ מגיעה
    ל-1.
  remedy: { lesson: '7.6', label: 'המקסימום של תבנית ריבועית על הספרה' }

- id: MC-c7-boundary-ignored
  title: מפעילים לגרנז' בלי לבדוק את השפה של התחום
  belief: >-
    בבעיה עם תנאים $x_i\ge0$ מספיק לפתור את מערכת לגרנז'.
  truth: >-
    משפט לגרנז' חל בנקודות של קבוצה פתוחה. בקבוצה $\{x_i\ge0,\ \sum x_i=s\}$ בודקים בנפרד את הנקודות שבהן
    $x_i=0$ לאיזה $i$. במכפלה $x_1\cdots x_n$ הערך שם 0, ולכן המקסימום מתקבל בנקודה שכל רכיביה חיוביים, ושם
    לגרנז' חל.
  remedy: { lesson: '7.6', label: "אי-שוויון הממוצעים בשיטת לגרנז'" }
