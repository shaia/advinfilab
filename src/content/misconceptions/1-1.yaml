# Misconceptions first detected in lesson 1.1 (metric spaces: definition and examples).
- id: MC-c1-zero-axiom
  title: שוכחים חצי מאקסיומת האפס
  belief: >-
    מספיק ש-$d(x,x)=0$; מותר שנקודות שונות יהיו במרחק אפס זו מזו. או להפך: מספיק שמרחק בין נקודות שונות
    חיובי, גם אם $d(x,x)\neq0$.
  truth: >-
    האקסיומה היא $d(x,y)=0 \iff x=y$, בשני הכיוונים. $d(x,y)=|x_1-y_1|$ על $\mathbb{R}^2$ נכשלת כי
    $d((0,0),(0,1))=0$, ו-$|x-y|+1$ נכשלת כי $d(x,x)=1$. בלי הכיוון "אפס רק לנקודה עצמה" גבולות כבר אינם
    יחידים.
  remedy: { lesson: '1.1', anchor: axioms, label: 'שלוש האקסיומות של מטריקה' }

- id: MC-c1-triangle-wrong-form
  title: זוכרים את אי-שוויון המשולש בצורה הלא נכונה
  belief: >-
    אי-שוויון המשולש הוא $d(x,z)\ge d(x,y)+d(y,z)$, או $d(x,z)\le\max(d(x,y),d(y,z))$, או שוויון.
  truth: >-
    $d(x,z)\le d(x,y)+d(y,z)$: עקיפה דרך $y$ אינה קצרה מהדרך הישירה. הצורה עם מקסימום חזקה בהרבה, והמטריקה
    הרגילה על $\mathbb{R}$ אינה מקיימת אותה ($d(0,2)=2>\max(1,1)$). וזה אי-שוויון, לא שוויון: על $\mathbb{R}$,
    $|0-2|=2<4=|0-3|+|3-2|$.
  remedy: { lesson: '1.1', anchor: axioms, label: 'אי-שוויון המשולש' }

- id: MC-c1-triangle-few-points
  title: בודקים את אי-שוויון המשולש על כמה נקודות ומסיקים שהוא מתקיים
  belief: >-
    אם אי-שוויון המשולש מתקיים לשלשה אחת או שתיים של נקודות, או נראה נכון בציור, הפונקציה היא מטריקה.
  truth: >-
    האקסיומה היא "לכל $x,y,z$". דוגמה אחת יכולה רק להפריך. כדי להוכיח צריך טיעון כללי, למשל
    $\sqrt{a+b}\le\sqrt a+\sqrt b$ לכל $a,b\ge0$, שנותן את מסקנה 1.1.12 דרך למה 1.1.11.
  remedy: { lesson: '1.1', anchor: triangle-proof, label: 'הוכחת אי-שוויון המשולש' }

- id: MC-c1-transform-metric
  title: חושבים שכל פונקציה עולה של מטריקה היא מטריקה
  belief: >-
    אם $d$ מטריקה ו-$\varphi$ עולה עם $\varphi(0)=0$, אז $\varphi\circ d$ מטריקה; בפרט $d^2$ מטריקה.
  truth: >-
    למה 1.1.11 דורשת עוד שני דברים. (ii) $\varphi(t)=0$ **רק** ב-$t=0$, לא רק $\varphi(0)=0$: עם
    $\varphi(t)=\max(t-1,0)$, שהיא לא-יורדת ו-$\varphi(0)=0$, על $\mathbb{R}$ מקבלים $\varphi(|0-\frac12|)=0$ בין
    נקודות שונות. (iii) $\varphi$ תת-חיבורית: $\varphi(a+b)\le\varphi(a)+\varphi(b)$. הפונקציות $\sqrt t$,
    $\frac{t}{1+t}$ ו-$\min(t,1)$ מקיימות את שתיהן (מסקנה 1.1.12), אבל $t^2$ אינה תת-חיבורית: $(x-y)^2$ נותנת
    $d(0,2)=4>1+1$ (טענה 1.1.10).
  remedy: { lesson: '1.1', anchor: new-from-old, label: 'מטריקות חדשות ממטריקה קיימת' }

- id: MC-c1-axiom-misdiagnosed
  title: מזהים לא נכון איזו תכונה נכשלת
  belief: >-
    כשפונקציה אינה מטריקה (או נורמה, או כשמשהו לא מתכנס), מצביעים על תכונה שבעצם מתקיימת, למשל "הסימטריה
    נכשלת" ל-$(x-y)^2$.
  truth: >-
    בודקים כל אקסיומה בנפרד, ולאקסיומה שנכשלת נותנים דוגמה נגדית מפורשת. $(x-y)^2$ סימטרית ומתאפסת רק כש-$x=y$;
    מה שנכשל הוא אי-שוויון המשולש.
  remedy: { lesson: '1.1', anchor: which-axiom, label: 'איזו אקסיומה נכשלת' }

- id: MC-c1-discrete-not-metric
  title: חושבים שהמטריקה הבדידה אינה מטריקה "אמיתית"
  belief: >-
    מרחק שלא תלוי במיקום הנקודות, 1 בין כל שתי נקודות שונות, אינו מטריקה, או שהוא מטריקה רק על קבוצה סופית.
  truth: >-
    המטריקה הבדידה מקיימת את שלוש האקסיומות על כל קבוצה: אם $x\neq z$ אז $y$ שונה מאחת מהן, ולכן
    $d(x,y)+d(y,z)\ge1=d(x,z)$. היא דוגמת המבחן שבה האינטואיציה של המישור נכשלת.
  remedy: { lesson: '1.1', anchor: discrete, label: 'המטריקה הבדידה' }

- id: MC-c1-one-distance
  title: מעבירים מרחק, התכנסות או פתיחות ממטריקה אחת לאחרת
  belief: >-
    המרחק בין שתי נקודות הוא מספר אחד, ולכן גם התכנסות, קבוצות פתוחות, צפיפות ורציפות לא תלויות במטריקה או
    בנורמה שבחרנו.
  truth: >-
    כל אלה תלויים במטריקה. על $\mathbb{R}$ עם המטריקה הבדידה $\frac1n\not\to0$. על $C[0,1]$ הסדרה $x^n$
    שואפת ל-0 בנורמת האינטגרל ($\int_0^1x^n=\frac1{n+1}$) ולא בנורמת הסופרמום (שם המרחק מ-0 הוא 1). והפונקציה
    $f\mapsto f(0)$ מקיימת $|f(0)-g(0)|\le d_\infty(f,g)$, אבל עבור מטריקת האינטגרל העוקצים
    $g_n(x)=\max(0,1-nx)$ נמצאים במרחק $\frac1{2n}$ מ-0 ובכל זאת $g_n(0)=1$: היא רציפה בנורמת הסופרמום ולא
    בנורמת האינטגרל (ההגדרות המדויקות בשיעור 1.6).
  remedy: { lesson: '1.1', anchor: same-set, label: 'אותה קבוצה, מטריקות שונות' }

- id: MC-c1-sup-metric-shortcut
  title: מחשבים מטריקת סופרמום בקיצור דרך
  belief: >-
    $\sup|f-g|$ מתקבל בקצות הקטע, או שווה ל-$|\sup f-\sup g|$.
  truth: >-
    צריך את הסופרמום של פונקציית ההפרש $|f-g|$ על כל התחום, כולל נקודות פנימיות. ל-$\sin$ ול-$\cos$ על
    $[0,\pi]$ ההפרש בקצוות הוא 1, ההפרש בין המקסימומים הוא 0, והמרחק הוא $\sqrt2$, ב-$x=\frac{3\pi}{4}$.
  remedy: { lesson: '1.1', anchor: sup, label: 'מטריקת הסופרמום על פונקציות חסומות' }

- id: MC-c1-metric-infinite-value
  title: מרשים למרחק להיות אינסופי
  belief: >-
    $\sup|f-g|$ היא מטריקה על כל הפונקציות $\mathbb{R}\to\mathbb{R}$, לא רק על החסומות.
  truth: >-
    מטריקה מקבלת ערכים ב-$[0,\infty)$. בין $f(x)=x$ ל-$g=0$ על $\mathbb{R}$ הסופרמום אינסופי, ולכן מגבילים
    את מטריקת הסופרמום ל-$B(X)$, הפונקציות החסומות, שבהן ההפרש חסום.
  remedy: { lesson: '1.1', anchor: bounded, label: 'למה רק פונקציות חסומות' }
