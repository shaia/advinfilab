# Misconceptions first detected in lesson 3.6 (connectedness, enrichment).
- id: MC-c3-connected-path
  title: חושבים שכל קבוצה קשירה קשירה מסילתית
  belief: >-
    קשירות וקשירות מסילתית הן אותו מושג: אם אי אפשר לפרק קבוצה לשני חלקים פתוחים, אפשר לחבר כל שתי נקודות במסילה.
  truth: >-
    קשירה מסילתית גורר קשירה, אבל לא להפך. עקומת הסינוס של הטופולוגים,
    $\{(x,\sin\frac1x): 0<x\le1\}\cup(\{0\}\times[-1,1])$, קשירה, ואין מסילה מ-$(0,0)$ לנקודה $(1,\sin1)$. בקבוצה
    **פתוחה** במרחב האוקלידי שני המושגים מתלכדים.
  remedy: { lesson: '3.6', label: 'עקומת הסינוס של הטופולוגים' }

- id: MC-c3-connected-by-picture
  title: מכריעים קשירות לפי איך שהקבוצה נראית
  belief: >-
    $\mathbb{Q}$ צפופה ו"אין בה רווחים", ולכן קשירה; עקומת הסינוס של הטופולוגים נראית כמו שני חלקים, ולכן אינה קשירה.
  truth: >-
    קשירות נבדקת לפי ההגדרה: אין פירוק לשתי קבוצות פתוחות זרות ולא ריקות. $\mathbb{Q}$ מתפרקת ל-$\mathbb{Q}\cap(-\infty,\sqrt2)$
    ו-$\mathbb{Q}\cap(\sqrt2,\infty)$; עקומת הסינוס קשירה, כי הקטע האנכי נמצא בסגור של הגרף, והסגור של קבוצה קשירה קשיר.
  remedy: { lesson: '3.6', label: 'ההגדרה של קבוצה קשירה' }

- id: MC-c3-puncture
  title: חושבים שהוצאת נקודה משפיעה על הישר ועל המישור באותו אופן
  belief: >-
    $\mathbb{R}\setminus\{0\}$ אינה קשירה, ולכן גם $\mathbb{R}^2\setminus\{0\}$ אינה קשירה (או להפך).
  truth: >-
    $\mathbb{R}\setminus\{0\}=(-\infty,0)\cup(0,\infty)$ אינה קשירה, אבל $\mathbb{R}^2\setminus\{0\}$ קשירה מסילתית: אפשר
    לעקוף את הראשית. ההבדל הזה מוכיח ש-$\mathbb{R}$ ו-$\mathbb{R}^2$ אינם הומיאומורפיים.
  remedy: { lesson: '3.6', label: 'מוציאים נקודה מהישר ומהמישור' }

- id: MC-c3-preimage-of-connected
  title: חושבים שהמקור של קבוצה קשירה תחת פונקציה רציפה קשיר
  belief: >-
    אם $f$ רציפה ו-$C$ קשירה, גם $f^{-1}(C)$ קשירה.
  truth: >-
    קשירות עוברת לתמונה, לא למקור: עבור $f(x)=x^2$ המקור של $[1,4]$ הוא $[-2,-1]\cup[1,2]$.
  remedy: { lesson: '3.6', label: 'התמונה הרציפה של קבוצה קשירה' }

- id: MC-c3-ivt-disconnected-domain
  title: חושבים שמשפט ערך הביניים נכון על כל תחום טוב, גם לא קשיר
  belief: >-
    פונקציה רציפה על קבוצה קומפקטית (או סגורה) מקבלת כל ערך בין שני ערכים שלה.
  truth: >-
    ערך הביניים נובע מקשירות התחום, לא מקומפקטיות. $f=-1$ על $[0,1]$ ו-$f=1$ על $[2,3]$ רציפה על קבוצה קומפקטית
    ואינה מקבלת את 0.
  remedy: { lesson: '3.6', label: 'משפט ערך הביניים כמסקנה מקשירות' }
