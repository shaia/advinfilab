# Misconceptions first detected in lesson 0.5 (inner products, matrices and determinants, the spectral theorem,
# quadratic forms).
- id: MC-c0-ip-partial-check
  title: בודקים רק חלק מהאקסיומות של מכפלה פנימית
  belief: >-
    ביטוי סימטרי שנראה כמו סכום של מכפלות הוא מכפלה פנימית.
  truth: >-
    צריך את שלוש האקסיומות: סימטריה, לינאריות ברכיב הראשון, וחיוביות ($\langle x,x\rangle>0$ לכל $x\ne0$).
    $x_1y_2+x_2y_1$ סימטרי ובילינארי, אבל $\langle(1,-1),(1,-1)\rangle=-2$; ו-$|x_1y_1|$ אינו לינארי.
  remedy: { lesson: '0.5', label: 'מכפלה פנימית: שלוש האקסיומות' }

- id: MC-c0-norm-is-sum
  title: הנורמה של וקטור היא סכום הקואורדינטות
  belief: >-
    האורך של $(1,2,2)$ הוא $1+2+2=5$.
  truth: >-
    הנורמה שמשרה המכפלה הפנימית הסטנדרטית היא $\|x\|_2=\sqrt{\langle x,x\rangle}$, כאן $\sqrt{1+4+4}=3$.
    סכום הערכים המוחלטים הוא $\|x\|_1$, נורמה אחרת.
  remedy: { lesson: '0.5', label: 'הנורמה שמשרה מכפלה פנימית' }

- id: MC-c0-forget-square-root
  title: שוכחים להוציא שורש
  belief: >-
    מקושי-שוורץ $\langle x,y\rangle^2\le\langle x,x\rangle\langle y,y\rangle$ מקבלים חסם ל-$\langle x,y\rangle$ בלי שורש.
  truth: >-
    אי-השוויון חוסם את **הריבוע** של המכפלה. החסם ל-$|\langle x,y\rangle|$ עצמו הוא $\|x\|\|y\|$, עם שורש על כל
    אחת מהמכפלות $\langle x,x\rangle$ ו-$\langle y,y\rangle$.
  remedy: { lesson: '0.5', label: 'אי-שוויון קושי-שוורץ' }

- id: MC-c0-cs-equality-equal
  title: שוויון בקושי-שוורץ רק כשהווקטורים שווים
  belief: >-
    $|\langle x,y\rangle|=\|x\|\|y\|$ רק כש-$x=y$.
  truth: >-
    שוויון מתקבל בדיוק כש-$x$ ו-$y$ תלויים לינארית (אחד מהם כפולה של השני, כולל כפולה שלילית או אפס). למשל
    $y=-2x$ נותן $|\langle x,y\rangle|=2\|x\|^2=\|x\|\|y\|$.
  remedy: { lesson: '0.5', label: 'אי-שוויון קושי-שוורץ: מקרה השוויון' }

- id: MC-c0-matrix-rows-images
  title: כותבים את התמונות של וקטורי הבסיס בשורות
  belief: >-
    המטריצה של העתקה לינארית בנויה מהתמונות $T(e_1),T(e_2),\dots$ כשורות.
  truth: >-
    התמונות הן **העמודות**: $Ae_j$ היא העמודה ה-$j$ של $A$. כתיבתן בשורות נותנת את המטריצה המשוחלפת, של
    העתקה אחרת (בסיבוב, הסיבוב בכיוון ההפוך).
  remedy: { lesson: '0.5', label: 'מהעתקה לינארית למטריצה' }

- id: MC-c0-det-sum-diagonals
  title: דטרמיננטה של מטריצה מסדר 2 כסכום המכפלות
  belief: >-
    הדטרמיננטה של $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ היא $ad+bc$.
  truth: >-
    הדטרמיננטה היא $ad-bc$: מכפלת האלכסון הראשי **פחות** מכפלת האלכסון המשני.
  remedy: { lesson: '0.5', label: 'דטרמיננטה והפיכות' }

- id: MC-c0-invertible-by-look
  title: מכריעים הפיכות לפי צורת המטריצה
  belief: >-
    מטריצה שכל איבריה שונים מאפס, או מטריצה סימטרית, הפיכה.
  truth: >-
    הפיכות נקבעת בדטרמיננטה (או בעמודות בלתי תלויות), לא במראה: $\begin{pmatrix}1&1\\1&1\end{pmatrix}$ סימטרית,
    בלי אפסים, ואינה הפיכה. $\begin{pmatrix}0&1\\1&0\end{pmatrix}$ עם אפסים הפיכה.
  remedy: { lesson: '0.5', label: 'דטרמיננטה והפיכות' }

- id: MC-c0-form-matrix-full-coefficient
  title: שמים את כל המקדם של המחובר המעורב בכל אחד מהאיברים שמחוץ לאלכסון
  belief: >-
    המטריצה הסימטרית של $x^2+4xy+y^2$ היא $\begin{pmatrix}1&4\\4&1\end{pmatrix}$, או
    $\begin{pmatrix}1&4\\0&1\end{pmatrix}$.
  truth: >-
    $x^TAx=a_{11}x^2+(a_{12}+a_{21})xy+a_{22}y^2$, ולכן במטריצה הסימטרית כל אחד מהאיברים שמחוץ לאלכסון
    הוא **חצי** מהמקדם של $xy$: $\begin{pmatrix}1&2\\2&1\end{pmatrix}$.
  remedy: { lesson: '0.5', label: 'תבנית ריבועית והמטריצה הסימטרית שלה' }

- id: MC-c0-diagonal-positive-definite
  title: מקדמים חיוביים על האלכסון גוררים תבנית חיובית מוגדרת
  belief: >-
    אם המקדמים של $x^2$ ושל $y^2$ חיוביים, התבנית חיובית מוגדרת; הערכים העצמיים הם איברי האלכסון.
  truth: >-
    המחובר המעורב יכול להכריע: עבור $Q(x,y)=x^2+4xy+y^2$ מתקבל $Q(1,-1)=-2$. הסימן נקבע לפי **הערכים העצמיים**
    (כאן 3 ומינוס 1), ואלה שווים לאיברי האלכסון רק במטריצה אלכסונית.
  remedy: { lesson: '0.5', label: 'הסימן של תבנית ריבועית לפי הערכים העצמיים' }

- id: MC-c0-det-positive-definite
  title: דטרמיננטה חיובית גוררת חיובית מוגדרת
  belief: >-
    מטריצה סימטרית עם דטרמיננטה חיובית חיובית מוגדרת.
  truth: >-
    הדטרמיננטה היא מכפלת הערכים העצמיים. עבור $A=-I$ מסדר 2 היא $1>0$, ושני הערכים העצמיים שליליים: התבנית
    $-x^2-y^2$ שלילית מוגדרת.
  remedy: { lesson: '0.5', label: 'הסימן של תבנית ריבועית לפי הערכים העצמיים' }

- id: MC-c0-real-eigen-orthodiag
  title: ערכים עצמיים ממשיים מספיקים ללכסון אורתוגונלי
  belief: >-
    כל מטריצה ממשית שכל ערכיה העצמיים ממשיים ניתנת ללכסון בבסיס אורתונורמלי של וקטורים עצמיים.
  truth: >-
    המשפט הספקטרלי דורש **סימטריה**. ל-$\begin{pmatrix}1&1\\0&2\end{pmatrix}$ ערכים עצמיים 1 ו-2 ווקטורים
    עצמיים $(1,0)$ ו-$(1,1)$, שאינם ניצבים; ל-$\begin{pmatrix}1&1\\0&1\end{pmatrix}$ אין אפילו לכסון.
  remedy: { lesson: '0.5', label: 'המשפט הספקטרלי' }

- id: MC-c0-inf-of-positive-positive
  title: האינפימום של מספרים חיוביים חיובי
  belief: >-
    אם $g(x)>0$ לכל $x$, אז גם $\inf_x g(x)>0$.
  truth: >-
    $\inf\{\frac1n:n\in\mathbb{N}\}=0$ אף שכל האיברים חיוביים. כדי שהאינפימום יהיה חיובי צריך שהוא יתקבל
    (יהיה מינימום), או חסם מלרע חיובי מפורש.
  remedy: { lesson: '0.5', label: 'תבנית חיובית מוגדרת: החסם עם הערך העצמי הקטן' }
