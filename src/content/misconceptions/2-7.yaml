# Misconceptions first detected in lesson 2.7 (G_δ sets, oscillation, pointwise limits of continuous functions,
# nowhere differentiable functions). Each remedy points at the part of lesson 2.7 that falsifies it.
- id: MC-c2-gdelta-union
  title: מבלבלים בין קבוצת G דלתא לקבוצת F סיגמא, או בין חיתוך לאיחוד
  belief: >-
    קבוצת $G_\delta$ היא איחוד של סדרה של קבוצות פתוחות (או של סגורות).
  truth: >-
    $G_\delta$ היא **חיתוך** של סדרה של קבוצות פתוחות; $F_\sigma$ היא **איחוד** של סדרה של קבוצות סגורות, והן דואליות:
    $A$ היא $F_\sigma$ אם ורק אם $X\setminus A$ היא $G_\delta$. איחוד של פתוחות הוא סתם קבוצה פתוחה.
  remedy: { lesson: '2.7', anchor: 'gdelta', label: 'הגדרת קבוצות G דלתא ו-F סיגמא' }

- id: MC-c2-gdelta-arbitrary-family
  title: שוכחים שבהגדרת G דלתא החיתוך הוא של סדרה
  belief: >-
    קבוצת $G_\delta$ היא חיתוך של משפחה כלשהי של קבוצות פתוחות.
  truth: >-
    כל תת-קבוצה $A$ של מרחב מטרי היא חיתוך של משפחה של פתוחות: $A=\bigcap_{y\notin A}(X\setminus\{y\})$. ההגדרה דורשת
    משפחה **בת מנייה**, וזה כל התוכן שלה: $\mathbb{Q}$ אינה $G_\delta$ ב-$\mathbb{R}$.
  remedy: { lesson: '2.7', anchor: 'gdelta', label: 'הגדרת קבוצות G דלתא' }

- id: MC-c2-fsigma-gdelta-exclusive
  title: חושבים שקבוצה אינה יכולה להיות גם F סיגמא וגם G דלתא
  belief: >-
    אם $A$ היא $F_\sigma$ אז היא אינה $G_\delta$, ולכן $\mathbb{Q}$ (איחוד בן מנייה של יחידונים) אינה $G_\delta$ מסיבה זו.
  truth: >-
    קבוצה יכולה להיות שתיהן: כל קבוצה סגורה היא $F_\sigma$ וגם $G_\delta$ (למשל $[0,1]=\bigcap_n(-\frac1n,1+\frac1n)$), וכל
    קבוצה פתוחה ב-$\mathbb{R}$ גם היא שתיהן. ש-$\mathbb{Q}$ אינה $G_\delta$ מוכיחים בעזרת משפט בייר.
  remedy: { lesson: '2.7', anchor: 'gdelta-examples', label: 'קבוצות F סיגמא ו-G דלתא: דוגמאות' }

- id: MC-c2-gdelta-uncountable
  title: חושבים שכל קבוצת G דלתא אינה בת מנייה
  belief: >-
    קבוצת $G_\delta$ היא "גדולה", ולכן אף קבוצה בת מנייה אינה $G_\delta$.
  truth: >-
    $\{0\}=\bigcap_n(-\frac1n,\frac1n)$ היא $G_\delta$ סופית, וכך כל קבוצה סגורה. מה שנכון: במרחב שלם בלי נקודות מבודדות,
    קבוצת $G_\delta$ **צפופה** אינה בת מנייה. הצפיפות היא חלק מהטענה.
  remedy: { lesson: '2.7', anchor: 'dense-gdelta', label: 'קבוצות G דלתא צפופות אינן בנות מנייה' }

- id: MC-c2-gdelta-shrink-neighbourhoods
  title: חושבים שחיתוך של סביבות מתכווצות של קבוצה מחזיר את הקבוצה
  belief: >-
    כל קבוצה $A$ היא $G_\delta$: $A=\bigcap_n U_n$, כאשר $U_n$ איחוד הכדורים ברדיוס $\frac1n$ סביב נקודות $A$.
  truth: >-
    החיתוך הזה הוא הסגור $\overline A$, לא $A$. עבור $\mathbb{Q}$ כל $U_n$ היא כבר $\mathbb{R}$. הטיעון מראה רק שכל קבוצה
    **סגורה** היא $G_\delta$; $\mathbb{Q}$ וכל קבוצה בת מנייה וצפופה ב-$\mathbb{R}$ אינן $G_\delta$ (משפט בייר).
  remedy: { lesson: '2.7', anchor: 'closed-gdelta', label: 'הרציונליים אינם קבוצת G דלתא' }

- id: MC-c2-dense-gdelta-like-dense
  title: חושבים שקבוצות G דלתא צפופות יכולות להיות זרות, כמו הרציונליים והאי-רציונליים
  belief: >-
    שתי קבוצות $G_\delta$ צפופות יכולות להיות זרות, או בנות מנייה, כמו כל קבוצה צפופה.
  truth: >-
    במרחב שלם, חיתוך של סדרה של קבוצות $G_\delta$ צפופות הוא שוב $G_\delta$ צפופה (משפט בייר), ובפרט לא ריק; ובלי נקודות
    מבודדות היא אינה בת מנייה. $\mathbb{Q}$ צפופה, בת מנייה וזרה ל-$\mathbb{R}\setminus\mathbb{Q}$, ובדיוק לכן היא **אינה**
    $G_\delta$.
  remedy: { lesson: '2.7', anchor: 'dense-gdelta', label: 'קבוצות G דלתא צפופות ומשפט בייר' }

- id: MC-c2-dense-intersection
  title: חושבים שחיתוך של שתי קבוצות צפופות צפוף
  belief: >-
    אם $A$ ו-$B$ צפופות ב-$X$, אז גם $A\cap B$ צפופה.
  truth: >-
    $\mathbb{Q}$ ו-$\mathbb{R}\setminus\mathbb{Q}$ צפופות וחיתוכן ריק. הטענה נכונה כששתיהן **פתוחות**, ומשפט בייר מרחיב
    אותה לסדרה של פתוחות צפופות במרחב שלם.
  remedy: { lesson: '2.7', anchor: 'dense-gdelta', label: 'חיתוך של פתוחות צפופות' }

- id: MC-c2-osc-one-sided
  title: מודדים את התנודה רק ביחס לערך בנקודה
  belief: >-
    התנודה של $f$ ב-$a$ היא $\sup|f(y)-f(a)|$ על נקודות קרובות, או הקפיצה מ-$f(a)$ לצד אחד.
  truth: >-
    $o(f,a)=\inf_{\delta>0}\sup\{|f(y)-f(z)|:\ y,z\in B(a,\delta)\}$: שתי הנקודות חופשיות. לפונקציית הסימן ב-0 המרחק מ-$f(0)$
    הוא לכל היותר 1, אבל $o(\operatorname{sgn},0)=|1-(-1)|=2$.
  remedy: { lesson: '2.7', anchor: 'oscillation', label: 'הגדרת התנודה' }

- id: MC-c2-osc-ignores-value
  title: מחשבים את התנודה בלי הערך בנקודה עצמה
  belief: >-
    התנודה ב-$a$ נקבעת רק לפי הערכים בנקודות ששונות מ-$a$, והערך $f(a)$ אינו משנה אותה.
  truth: >-
    הכדור $B(a,\delta)$ מכיל את $a$, ולכן $f(a)$ משתתף. ל-$f(x)=\sin\frac1x$ עם $f(0)=5$: $o(f,0)=5-(-1)=6$, ולא 2.
  remedy: { lesson: '2.7', anchor: 'oscillation', label: 'הגדרת התנודה: הכדור כולל את הנקודה' }

- id: MC-c2-osc-rational-continuous
  title: חושבים שפונקציית תומה רציפה ברציונליים כי הגבול בהם אפס
  belief: >-
    ל-$T$ יש גבול 0 בכל נקודה, ולכן התנודה שלה 0 בכל מקום והיא רציפה גם ברציונליים.
  truth: >-
    לרציפות צריך שהגבול יהיה **הערך**. ב-$\frac pq$ מצומצם $T(\frac pq)=\frac1q\ne0$, ולכן $o(T,\frac pq)=\frac1q$; $T$ רציפה
    בדיוק באי-רציונליים, שם הערך 0 שווה לגבול.
  remedy: { lesson: '2.7', anchor: 'thomae', label: 'פונקציית תומה' }

- id: MC-c2-osc-set-needs-continuity
  title: חושבים שהקבוצה שבה התנודה קטנה פתוחה רק לפונקציה רציפה
  belief: >-
    הקבוצה $\{x:\ o(f,x)<\varepsilon\}$ פתוחה רק כש-$f$ רציפה.
  truth: >-
    היא פתוחה לכל $f:X\to\mathbb{R}$: אם $o(f,x)<\varepsilon$, יש כדור $B(x,\delta)$ שבו כל ההפרשים קטנים מ-$\varepsilon$,
    וכל נקודה בכדור הזה מקבלת תנודה קטנה מ-$\varepsilon$. כש-$f$ רציפה הקבוצה היא פשוט $X$.
  remedy: { lesson: '2.7', anchor: 'osc-open', label: 'קבוצת נקודות הרציפות היא G דלתא' }

- id: MC-c2-osc-continuous
  title: חושבים שהתנודה היא פונקציה רציפה של הנקודה
  belief: >-
    $x\mapsto o(f,x)$ רציפה, ולכן $\{o<\varepsilon\}$ פתוחה כמקור של קבוצה פתוחה.
  truth: >-
    ל-$\chi_{\{0\}}$ על $\mathbb{R}$, $o=1$ ב-0 ו-$o=0$ בכל נקודה אחרת: התנודה אינה רציפה. נכון רק כיוון אחד: ליד נקודה,
    התנודה אינה גדולה בהרבה מהתנודה בנקודה עצמה, וזה מה שהופך את $\{o<\varepsilon\}$ לפתוחה.
  remedy: { lesson: '2.7', anchor: 'osc-open', label: 'קבוצת נקודות הרציפות היא G דלתא' }

- id: MC-c2-continuity-set-open
  title: חושבים שקבוצת נקודות הרציפות של פונקציה פתוחה
  belief: >-
    אם $f$ רציפה ב-$a$, היא רציפה גם בכל הנקודות הקרובות ל-$a$.
  truth: >-
    פונקציית תומה רציפה באי-רציונליים בלבד, וזו קבוצה בלי פנים. קבוצת נקודות הרציפות תמיד $G_\delta$, חיתוך של סדרה של
    פתוחות, אבל לא בהכרח פתוחה.
  remedy: { lesson: '2.7', anchor: 'continuity-set-theorem', label: 'קבוצת נקודות הרציפות היא G דלתא' }

- id: MC-c2-continuity-set-any
  title: חושבים שכל קבוצה יכולה להיות קבוצת נקודות הרציפות של פונקציה
  belief: >-
    כמו שפונקציית תומה רציפה בדיוק באי-רציונליים, אפשר לבנות פונקציה שרציפה בדיוק ברציונליים.
  truth: >-
    קבוצת נקודות הרציפות של כל פונקציה היא $G_\delta$, ו-$\mathbb{Q}$ אינה $G_\delta$ (משפט בייר). לכן אין פונקציה
    $\mathbb{R}\to\mathbb{R}$ שרציפה בדיוק ברציונליים, ולא בדיוק באף קבוצה בת מנייה וצפופה.
  remedy: { lesson: '2.7', anchor: 'no-rational-continuity', label: 'אין פונקציה שרציפה בדיוק ברציונליים' }

- id: MC-c2-double-limit
  title: מחשיבים גבול כפול של פונקציות רציפות כגבול נקודתי של סדרה אחת
  belief: >-
    $\chi_{\mathbb{Q}}=\lim_m\lim_n\cos(m!\pi x)^{2n}$, ולכן היא גבול נקודתי של סדרה של פונקציות רציפות.
  truth: >-
    הגבול הפנימי כבר אינו רציף, כך שזה גבול של גבולות. $\chi_{\mathbb{Q}}$ אינה רציפה באף נקודה, ולכן אינה גבול נקודתי
    של **סדרה אחת** של פונקציות רציפות על $\mathbb{R}$: לגבול כזה יש קבוצה צפופה של נקודות רציפות.
  remedy: { lesson: '2.7', anchor: 'baire-one', label: 'גבול נקודתי של פונקציות רציפות' }

- id: MC-c2-baire1-countable-disc
  title: חושבים שלגבול נקודתי של פונקציות רציפות יש רק מספר בן מנייה של נקודות אי-רציפות
  belief: >-
    גבול נקודתי של רציפות רציף בכל מקום פרט לקבוצה בת מנייה.
  truth: >-
    במישור, $\max(0,1-n|x_2|)$ מתכנסות לפונקציה המציינת של הישר $x_2=0$, שאינה רציפה באף נקודה של הישר, קבוצה שאינה בת
    מנייה. מה שהמשפט נותן: נקודות הרציפות הן $G_\delta$ **צפופה** (כשהמרחב שלם).
  remedy: { lesson: '2.7', anchor: 'baire-one-hypotheses', label: 'גבול נקודתי של פונקציות רציפות' }

- id: MC-c2-baire1-one-point
  title: חושבים שמספיק שלגבול יש נקודת רציפות אחת
  belief: >-
    כל פונקציה שרציפה לפחות בנקודה אחת יכולה להיות גבול נקודתי של פונקציות רציפות.
  truth: >-
    על מרחב שלם, נקודות הרציפות של גבול כזה **צפופות**. $x\chi_{\mathbb{Q}}(x)$ רציפה רק ב-0, ולכן אינה גבול נקודתי של
    פונקציות רציפות על $\mathbb{R}$.
  remedy: { lesson: '2.7', anchor: 'baire-one', label: 'גבול נקודתי של פונקציות רציפות' }

- id: MC-c2-baire1-no-completeness
  title: משמיטים את השלמות מהמשפט על גבול נקודתי של רציפות
  belief: >-
    גבול נקודתי של פונקציות רציפות רציף בקבוצה צפופה בכל מרחב מטרי.
  truth: >-
    ההוכחה משתמשת במשפט בייר, ובלי שלמות המסקנה נכשלת: על $\mathbb{Q}$, פונקציית תומה היא גבול נקודתי של קווים שבורים
    רציפים (שמסכימים איתה ב-$q_1,\dots,q_n$), ואינה רציפה באף נקודה של $\mathbb{Q}$.
  remedy: { lesson: '2.7', anchor: 'baire-one-completeness', label: 'גבול נקודתי של רציפות: למה צריך שלמות' }

- id: MC-c2-residual-means-all
  title: חושבים שקבוצה שיורית היא כמעט הכל, או שהיא מכילה כדור
  belief: >-
    אם הפונקציות שאינן גזירות באף נקודה הן קבוצה שיורית ב-$C[0,1]$, אז כל פונקציה רציפה כזו, או לפחות כל הפונקציות בכדור
    כלשהו.
  truth: >-
    שיורית פירושו שהמשלים מקטגוריה ראשונה. המשלים לא ריק ($x^2$) ואפילו צפוף (קווים שבורים נמצאים בכל כדור), ולכן הקבוצה
    השיורית אינה מכילה אף כדור. $\mathbb{R}\setminus\mathbb{Q}$ שיורית ב-$\mathbb{R}$ ואין לה פנים.
  remedy: { lesson: '2.7', anchor: 'residual-meaning', label: 'קבוצה שיורית: מה היא אומרת' }

- id: MC-c2-baire-only-nonempty
  title: חושבים שמשפט בייר נותן רק קיום
  belief: >-
    ההוכחה בעזרת בייר מראה שיש פונקציה רציפה שאינה גזירה באף נקודה, ולא יותר מזה.
  truth: >-
    משפט בייר נותן **צפיפות**: בכל כדור $B(f,r)$ של $C[0,1]$ יש פונקציה כזו. וגם בלי בייר, אם $g$ כזו אז גם $g+cx$ כזו לכל $c$.
  remedy: { lesson: '2.7', anchor: 'residual-meaning', label: 'פונקציות שאינן גזירות באף נקודה צפופות' }

- id: MC-c2-En-means-differentiable
  title: מזהים את הקבוצות E n עם גזירות בנקודה
  belief: >-
    $f\in E_n$ פירושו ש-$f$ גזירה בנקודה כלשהי (או בנקודה 0), ולכן פונקציה עם נקודה רעה אינה ב-$E_n$, ופונקציה ב-$E_n$
    גזירה בנקודה הטובה שלה.
  truth: >-
    $E_n$ דורשת נקודה אחת $x\in[0,1-\frac1n]$ שבה מנות ההפרשים מימין חסומות ב-$n$ לכל $0<h<\frac1n$. $\sqrt x\in E_2$ אף
    שאין לה נגזרת ימנית ב-0, ו-$x\sin\frac1x\in E_1$ אף שאינה גזירה ב-0. הכיוון שנחוץ להוכחה: נגזרת ימנית סופית בנקודה של
    $[0,1)$ מכניסה את $f$ ל-$E_n$ ל-$n$ גדול מספיק.
  remedy: { lesson: '2.7', anchor: 'En', label: 'הקבוצות E n' }

- id: MC-c2-En-n-derivative
  title: חושבים שמספיק לקחת n גדול מהנגזרת
  belief: >-
    אם ל-$f$ נגזרת ימנית $f'_+(x_0)$, אז $f\in E_n$ לכל $n\ge|f'_+(x_0)|$.
  truth: >-
    הנגזרת שולטת רק ב-$h$ קטן; $E_n$ דורשת את החסם עד $h=\frac1n$, ו-$x_0\le1-\frac1n$. $10x^2$ גזירה ב-0 עם נגזרת 0, ונמצאת
    ב-$E_n$ רק מ-$n=4$. מספיק $n$ שגדול מ-$|f'_+(x_0)|+1$, מ-$\frac{2\|f\|_\infty}{\delta}$ ומ-$\frac1{1-x_0}$ (למה 2.7.18(א)).
  remedy: { lesson: '2.7', anchor: 'En-derivative', label: 'גזירות בנקודה גוררת שייכות ל-E n' }

- id: MC-c2-En-open
  title: חושבים שבהוכחה צריך שהקבוצות E n יהיו פתוחות
  belief: >-
    כדי להפעיל את משפט בייר צריך ש-$E_n$ יהיו פתוחות.
  truth: >-
    משפט 2.5.8(ב) עוסק באיחוד של קבוצות **דלילות**. $E_n$ סגורה, ולכן מספיק להראות שאין לה פנים (טענה 2.5.6(ה)); המשלימים
    $C[0,1]\setminus E_n$ הם הפתוחים הצפופים של הניסוח 2.5.8(א).
  remedy: { lesson: '2.7', anchor: 'En-closed', label: 'הקבוצות E n סגורות ודלילות' }

- id: MC-c2-steep-is-far
  title: חושבים שפונקציה עם שיפועים גדולים רחוקה מאפס בנורמת הסופרמום
  belief: >-
    מסור עם שיפוע $L$ עצום הוא פונקציה "גדולה", ולכן הוספתו מרחיקה הרבה מהפונקציה המקורית.
  truth: >-
    $\|\varphi\|_\infty$ הוא גובה השיניים בלבד: מסור בגובה $\frac r4$ ובשיפוע $10^6$ במרחק $\frac r4$ מ-0. לכן בכל כדור של
    $C[0,1]$ יש פונקציות עם מנות הפרשים עצומות, וזה לב ההוכחה ש-$E_n$ אין לה פנים.
  remedy: { lesson: '2.7', anchor: 'sawtooth', label: 'המסור: קרוב בסופרמום, תלול בשיפוע' }

- id: MC-c2-sawtooth-slope
  title: בוחרים שיפוע מסור שגדול רק מ-n ושוכחים את השיפוע של הפונקציה שמתחתיו
  belief: >-
    כדי ש-$g=p+\varphi$ תצא מ-$E_n$ מספיק שהשיפוע $L$ של המסור יהיה גדול מ-$n$.
  truth: >-
    $p$ יכולה לבטל עד $Mh$ מהשינוי של המסור, כש-$M$ חוסם את מנות ההפרשים של $p$: $|g(x+h)-g(x)|\ge(L-M)h$. לכן צריך
    $L>n+M$; עם $p(x)=x^2$ ו-$n=3$, $L>5$.
  remedy: { lesson: '2.7', anchor: 'sawtooth', label: 'הקבוצות E n דלילות: בחירת המסור' }
