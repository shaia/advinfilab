# Misconceptions first detected in lesson 5.1 (functions of several variables: limits and continuity).
- id: MC-c5-graph-vs-level
  title: מבלבלים בין הגרף לבין קבוצות הגובה
  belief: >-
    קבוצת הגובה של $f:\mathbb{R}^2\to\mathbb{R}$ היא משטח במרחב, או שהגרף של $f$ יושב במישור.
  truth: >-
    הגרף $\{(x,f(x))\}$ הוא תת-קבוצה של $\mathbb{R}^{n+1}$; קבוצת הגובה $\{x: f(x)=c\}$ היא תת-קבוצה של התחום
    $\mathbb{R}^n$, ההטלה של חיתוך הגרף עם $z=c$. קבוצות גובה שונות זרות, והן יכולות להיות ריקות.
  remedy: { lesson: '5.1', label: 'גרף וקווי גובה של פונקציה של שני משתנים' }

- id: MC-c5-separate-continuity
  title: חושבים שרציפות בכל משתנה בנפרד היא רציפות
  belief: >-
    אם $x\mapsto f(x,y)$ רציפה לכל $y$ ו-$y\mapsto f(x,y)$ רציפה לכל $x$, אז $f$ רציפה.
  truth: >-
    $\frac{xy}{x^2+y^2}$ (ו-0 בראשית) רציפה בכל משתנה בנפרד ואינה רציפה בראשית. מה שנכון הוא אחר: $F$ עם ערכים
    ב-$\mathbb{R}^m$ רציפה אם ורק אם כל **רכיב** שלה רציף.
  remedy: { lesson: '5.1', label: 'רכיבים לעומת משתנים: רציפות' }

- id: MC-c5-paths-prove-limit
  title: בודקים כמה מסילות, או את כל הישרים, ומסיקים שהגבול קיים
  belief: >-
    אם הגבול לאורך כמה מסילות, או לאורך כל ישר דרך הנקודה, יוצא אותו מספר, זה הגבול.
  truth: >-
    מסילות יכולות רק לשלול גבול (שתי מסילות עם גבולות שונים) או להצביע על מועמד. $\frac{x^2y}{x^4+y^2}$ שואפת ל-0
    לאורך כל ישר ול-$\frac12$ לאורך $y=x^2$. קיום מוכיחים בחסם שתלוי רק במרחק מהנקודה.
  remedy: { lesson: '5.1', label: 'גבול לאורך כל ישר אינו מספיק' }

- id: MC-c5-iterated-limit
  title: מחליפים את הגבול בשני משתנים בגבולות נשנים
  belief: >-
    $\lim_{(x,y)\to(0,0)}f=\lim_{x\to0}\lim_{y\to0}f(x,y)$, ולכן מספיק לחשב גבול נשנה.
  truth: >-
    לפונקציה $\frac{xy}{x^2+y^2}$ שני הגבולות הנשנים 0, ואין לה גבול בראשית. גבול נשנה בודק דרך הגעה מיוחדת אחת;
    הגבול בשני משתנים דורש שכל נקודה קרובה מספיק תיתן ערך קרוב.
  remedy: { lesson: '5.1', label: 'גבול בשני משתנים לעומת גבולות נשנים' }

- id: MC-c5-polar-fixed-theta
  title: בקוטביות שולחים את r לאפס לכל זווית בנפרד
  belief: >-
    אם בקואורדינטות קוטביות הביטוי שואף ל-0 כש-$r\to0$ לכל $\theta$ קבוע, הגבול 0.
  truth: >-
    $\theta$ קבוע פירושו קרן, כלומר ישר; זה אותו מבחן חלש של "כל הישרים". צריך חסם $|f-L|\le g(r)$ עם $g(r)\to0$
    שאינו תלוי ב-$\theta$, כמו $r^2\cos^2\theta\sin^2\theta\le\frac{r^2}{4}$.
  remedy: { lesson: '5.1', label: 'קואורדינטות קוטביות: חסם אחיד בזווית' }

- id: MC-c5-level-set-shape
  title: מניחים שקבוצת גובה היא תמיד קו יפה ולא ריק
  belief: >-
    כל קבוצת גובה היא עקום אחד (מעגל, ישר), היא אף פעם לא ריקה, וקבוצות גובה שונות יכולות להיחתך.
  truth: >-
    קבוצת גובה היא כל פתרון של $f(x)=c$: היא יכולה להיות ריקה ($x^2+y^2=-1$), נקודה ($x^2+y^2=0$) או איחוד של שני
    ישרים ($xy=0$). קבוצות גובה של ערכים שונים זרות, כי $f$ מקבלת ערך אחד בכל נקודה.
  remedy: { lesson: '5.1', label: 'קווי גובה: דוגמאות לא צפויות' }

- id: MC-c5-zero-denominator
  title: מסיקים שאין גבול כי המכנה מתאפס או כי הפונקציה אינה מוגדרת בנקודה
  belief: >-
    אם המכנה מתאפס בנקודה, או ש-$f$ אינה מוגדרת בה, אין ל-$f$ גבול שם.
  truth: >-
    הגבול אינו מסתכל על הנקודה עצמה. $\frac{x^3}{x^2+y^2}$ אינה מוגדרת בראשית ושואפת שם ל-0, כי המונה קטן מהר יותר
    מהמכנה. השוואת סדרי הגודל של המונה והמכנה היא מה שמכריע.
  remedy: { lesson: '5.1', label: 'השוואת סדרי גודל במונה ובמכנה' }

- id: MC-c5-limit-vs-value
  title: מבלבלים בין קיום גבול לבין רציפות
  belief: >-
    אם ל-$f$ יש גבול בנקודה, $f$ רציפה בה.
  truth: >-
    רציפות ב-$a$ דורשת שלושה דברים: $f$ מוגדרת ב-$a$, הגבול קיים, והוא שווה ל-$f(a)$. פונקציה שאינה מוגדרת בנקודה,
    או שהוגדרה שם בערך אחר, אינה רציפה בה גם כשהגבול קיים.
  remedy: { lesson: '5.1', label: 'גבול ורציפות בכמה משתנים' }

- id: MC-c5-bound-not-vanishing
  title: חושבים שכל חסם מוכיח גבול
  belief: >-
    אם מצאתי חסם ל-$|f|$ ליד הנקודה (או חסם שתלוי במשתנים), הוכחתי שהגבול 0.
  truth: >-
    החסם צריך להיות פונקציה $g$ של המרחק בלבד עם $g(\rho)\to0$ כש-$\rho\to0$. חסימות לבדה אינה מספיקה:
    $\frac{xy}{x^2+y^2}$ חסומה על ידי $\frac12$ ואין לה גבול; וחסם כמו $\frac{|x|^3}{y^2}$ אינו קטן ליד הראשית.
  remedy: { lesson: '5.1', label: 'הוכחת גבול בעזרת חסם שתלוי במרחק' }

- id: MC-c5-norm-dependent
  title: חושבים שגבול, רציפות או דיפרנציאביליות ב-Rn תלויים בנורמה
  belief: >-
    פונקציה יכולה להיות רציפה או דיפרנציאבילית בנורמה אחת על $\mathbb{R}^n$ ולא בנורמה אחרת.
  truth: >-
    כל הנורמות על $\mathbb{R}^n$ שקולות (שיעור 3.5): $c\|h\|\le\|h\|'\le C\|h\|$. לכן אותן סדרות מתכנסות, אותן
    פונקציות רציפות, ו-$o(\|h\|)$ פירושו אותו דבר בכל נורמה. הנורמה משנה רק קבועים.
  remedy: { lesson: '5.1', label: 'גבולות ב-Rn אינם תלויים בנורמה' }
