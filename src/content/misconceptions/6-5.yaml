# Misconceptions first detected in lesson 6.5 (absolute extrema on a compact set).
- id: MC-c6-forget-boundary
  title: מחפשים קיצון מוחלט רק בנקודות הקריטיות
  belief: >-
    הקיצון המוחלט של $f$ על קבוצה קומפקטית מתקבל בנקודה קריטית, ולכן מספיק לפתור $\nabla f=0$ בפנים.
  truth: >-
    התנאי $\nabla f=0$ חל רק בנקודות פנימיות. ל-$x^2-y^2$ על עיגול היחידה הסגור הנקודה הקריטית היחידה היא הראשית,
    עם ערך 0, אבל המקסימום 1 והמינימום $(-1)$ מתקבלים על השפה.
  remedy: { lesson: '6.5', label: 'מועמדים: פנים ושפה' }

- id: MC-c6-forget-interior
  title: חושבים שקיצון מוחלט תמיד על השפה
  belief: >-
    בקבוצה קומפקטית המקסימום והמינימום תמיד מתקבלים על השפה, ולכן מספיק לבדוק את השפה (או את הקודקודים).
  truth: >-
    זה נכון לפונקציות לינאריות, לא באופן כללי. ל-$xy(1-x-y)$ על המשולש $x,y\ge0$, $x+y\le1$ הפונקציה מתאפסת על
    כל השפה, והמקסימום $\frac1{27}$ מתקבל בנקודה הפנימית $(\frac13,\frac13)$.
  remedy: { lesson: '6.5', label: 'הנקודות הקריטיות בפנים' }

- id: MC-c6-only-corners
  title: בודקים את השפה רק בקודקודים
  belief: >-
    על מלבן או משולש מספיק להשוות את ערכי $f$ בקודקודים ובנקודות הקריטיות הפנימיות.
  truth: >-
    כל צלע היא קטע, ועליו $f$ היא פונקציה של משתנה אחד שיכולה לקבל קיצון באמצע הצלע. ל-$x^2-2xy+2y$ על
    $[0,3]\times[0,2]$ המינימום מתקבל גם ב-$(2,2)$, באמצע הצלע העליונה.
  remedy: { lesson: '6.5', label: 'פרמטריזציה של כל צלע' }

- id: MC-c6-bounded-below-attains
  title: פונקציה חסומה מלרע נחשבת כזו שמקבלת מינימום
  belief: >-
    פונקציה רציפה על $\mathbb{R}^n$ (או על קבוצה סגורה) שחסומה מלרע מקבלת את האינפימום שלה.
  truth: >-
    סדרה ממזערת יכולה לברוח לאינסוף. $x^2+(xy-1)^2>0$ בכל מקום, אבל בנקודות $(\frac1n,n)$ הערך $\frac1{n^2}\to0$;
    $e^{-x^2-y^2}$ חסומה מלרע על ידי 0 ולא מקבלת אותו. צריך קומפקטיות, או התנהגות באינסוף שמחזירה את הבעיה לקבוצה
    קומפקטית.
  remedy: { lesson: '6.5', label: 'אינפימום שאינו מתקבל' }

- id: MC-c6-noncompact-no-extremum
  title: חושבים שבלי קומפקטיות אין קיצון
  belief: >-
    משפט ויירשטראס הוא "אם ורק אם": על קבוצה שאינה קומפקטית לפונקציה אין מקסימום ואין מינימום.
  truth: >-
    ויירשטראס הוא תנאי מספיק. ל-$x^2+y^2$ על $\mathbb{R}^2$ יש מינימום 0 בראשית (ואין מקסימום). בלי קומפקטיות
    צריך לבדוק ישירות, למשל בעזרת ההתנהגות באינסוף.
  remedy: { lesson: '6.5', label: 'תחום לא חסום' }

- id: MC-c6-unique-local-global
  title: נקודה קריטית יחידה שהיא מינימום מקומי נחשבת מינימום מוחלט
  belief: >-
    אם ל-$f:\mathbb{R}^2\to\mathbb{R}$ יש נקודה קריטית יחידה, והיא מינימום מקומי, אז היא מינימום מוחלט (כמו
    במשתנה אחד).
  truth: >-
    במשתנה אחד זה נכון (בין שני מינימומים יש מקסימום). בשני משתנים לא: $x^2(1+y)^3+y^2$ יש לה נקודה קריטית יחידה,
    הראשית, שהיא מינימום מקומי ממש, אבל $f(x,-2)=4-x^2\to-\infty$.
  remedy: { lesson: '6.5', label: 'מקומי לעומת מוחלט בכמה משתנים' }
