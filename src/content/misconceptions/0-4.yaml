# Misconceptions first detected in lesson 0.4 (countable sets and Cantor's diagonal argument).
- id: MC-c0-countable-direction
  title: מבלבלים את כיוון הפונקציה בהגדרה של בת מנייה
  belief: >-
    $A$ בת מנייה אם יש פונקציה על מ-$A$ ל-$\mathbb{N}$, או אם יש פונקציה חד-חד-ערכית מ-$\mathbb{N}$ ל-$A$.
  truth: >-
    שני התנאים האלה מתקיימים גם ל-$\mathbb{R}$. $A$ בת מנייה אם יש התאמה חד-חד-ערכית ועל בין $\mathbb{N}$ ל-$A$;
    פונקציה חד-חד-ערכית **מ-$A$ ל-$\mathbb{N}$** (או על **מ-$\mathbb{N}$ ל-$A$**) אומרת ש-$A$ סופית או בת מנייה.
  remedy: { lesson: '0.4', label: 'קבוצה בת מנייה: ההגדרה' }

- id: MC-c0-infinite-is-countable
  title: כל קבוצה אינסופית בת מנייה
  belief: >-
    יש רק "אינסוף אחד": כל קבוצה אינסופית אפשר לסדר ברשימה $a_1,a_2,\dots$.
  truth: >-
    קנטור הוכיח שאין רשימה של כל הממשיים, ושאין רשימה של כל הסדרות של אפסים ואחדים. יש קבוצות אינסופיות
    שאינן בנות מנייה.
  remedy: { lesson: '0.4', label: 'האלכסון של קנטור' }

- id: MC-c0-dense-vs-countable
  title: מקשרים בין צפיפות לבין מנייה
  belief: >-
    הרציונליים בני מנייה כי הם צפופים, או שקבוצה צפופה בקטע היא בהכרח גדולה מדי כדי להיות בת מנייה.
  truth: >-
    צפיפות ומנייה הן תכונות בלתי תלויות: $\mathbb{Q}$ צפופה ובת מנייה, $\mathbb{R}$ צפופה ואינה בת מנייה,
    ו-$\mathbb{N}$ בת מנייה ואינה צפופה.
  remedy: { lesson: '0.4', label: 'הרציונליים בני מנייה' }

- id: MC-c0-list-in-order
  title: מנסים למנות את הרציונליים לפי הגודל
  belief: >-
    כדי להראות ש-$\mathbb{Q}$ בת מנייה, מסדרים את הרציונליים בסדר עולה: הראשון, השני שאחריו, וכן הלאה.
  truth: >-
    אין "רציונלי הבא": בין כל שניים יש עוד. המנייה של $\mathbb{Q}$ אינה לפי הגודל: מתאימים ל-$\frac pq$ את הזוג
    $(p,q)$ ומונים את הזוגות.
  remedy: { lesson: '0.4', label: 'הרציונליים בני מנייה' }

- id: MC-c0-sequences-countable
  title: סדרות של אפסים ואחדים בנות מנייה כי יש רק שני סימנים
  belief: >-
    כל סדרה של אפסים ואחדים בנויה משני סימנים, ולכן כולן יחד בנות מנייה, כמו המחרוזות הסופיות.
  truth: >-
    המחרוזות **הסופיות** בנות מנייה (איחוד בן מנייה של קבוצות סופיות). הסדרות **האינסופיות** אינן: לכל רשימה
    $s^{(1)},s^{(2)},\dots$ הסדרה $t_n=1-s^{(n)}_n$ שונה מכל אחת מהן.
  remedy: { lesson: '0.4', label: 'הסדרות של אפסים ואחדים' }

- id: MC-c0-diagonal-double-expansion
  title: מתעלמים מכך שלמספר יכולים להיות שני פיתוחים עשרוניים
  belief: >-
    אם שני פיתוחים עשרוניים שונים בספרה אחת, המספרים שונים.
  truth: >-
    $0.0999\ldots=0.1000\ldots$: לאותו מספר יכולים להיות שני פיתוחים. לכן באלכסון של קנטור בוחרים ספרות
    שאינן 0 ו-9 (למשל 4 ו-5), כך שלמספר החדש יש פיתוח יחיד.
  remedy: { lesson: '0.4', label: 'האלכסון של קנטור: למה הספרות 4 ו-5' }

- id: MC-c0-diagonal-fix-list
  title: מתקנים את הרשימה במקום להבין את הטיעון
  belief: >-
    אם המספר של האלכסון חסר ברשימה, מוסיפים אותו בהתחלה ומקבלים רשימה של כל הממשיים.
  truth: >-
    הטיעון עובד על **כל** רשימה, גם על הרשימה המתוקנת: הוא נותן לה מספר חדש שחסר בה. זו בדיוק ההוכחה שאין
    רשימה שלמה.
  remedy: { lesson: '0.4', label: 'האלכסון של קנטור: כל רשימה' }

- id: MC-c0-diagonal-all-digits
  title: חושבים שהמספר של האלכסון שונה מכל מספר ברשימה בכל הספרות
  belief: >-
    המספר שבונים באלכסון שונה מ-$x_7$ בכל הספרות, או גדול מכל המספרים ברשימה.
  truth: >-
    הוא שונה מ-$x_7$ רק בספרה השביעית (ייתכן ששאר הספרות זהות). זה מספיק, כי הפיתוח שלו יחיד. הוא גם לא
    בהכרח גדול או אי-רציונלי: $0.444\ldots=\frac49$ יכול לצאת.
  remedy: { lesson: '0.4', label: 'האלכסון של קנטור' }

- id: MC-c0-interleave-same-size
  title: בין כל שני רציונליים יש אי-רציונלי, ולכן יש אותו מספר
  belief: >-
    כי בין כל שני רציונליים יש אי-רציונלי ובין כל שני אי-רציונליים יש רציונלי, שתי הקבוצות "באותו גודל",
    ולכן האי-רציונליים בני מנייה.
  truth: >-
    צפיפות הדדית לא אומרת דבר על גודל. אם האי-רציונליים היו בני מנייה, $\mathbb{R}=\mathbb{Q}\cup(\mathbb{R}\setminus\mathbb{Q})$
    היה איחוד של שתי קבוצות בנות מנייה, כלומר בן מנייה: סתירה לקנטור.
  remedy: { lesson: '0.4', label: 'איחוד בן מנייה של קבוצות בנות מנייה' }

- id: MC-c0-enumeration-count
  title: טעות בספירה של המקום ברשימה האלכסונית
  belief: >-
    המקום של $(m,n)$ ברשימה לפי אלכסונים הוא מספר כל הזוגות באלכסונים עד האלכסון שלו, כולל כולו.
  truth: >-
    לפני האלכסון $m+n=s$ יש $1+2+\dots+(s-2)=\frac{(s-1)(s-2)}{2}$ זוגות, ובתוכו $(m,n)$ הוא במקום ה-$m$.
    לכן המקום הוא $\frac{(s-1)(s-2)}{2}+m$.
  remedy: { lesson: '0.4', label: 'המנייה של זוגות סדורים' }
