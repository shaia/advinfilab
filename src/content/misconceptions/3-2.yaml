# Misconceptions first detected in lesson 3.2 (open covers, Lebesgue number, Heine–Borel).
- id: MC-c3-one-cover-enough
  title: חושבים שמספיק כיסוי פתוח אחד עם תת-כיסוי סופי
  belief: >-
    $K$ קומפקטית אם יש לה כיסוי פתוח (אחד) שיש לו תת-כיסוי סופי, או אם אפשר לכסות אותה במספר סופי של קבוצות פתוחות.
  truth: >-
    כל קבוצה מכוסה על ידי קבוצה פתוחה אחת, המרחב כולו, ולכן הדרישה הזו ריקה. ההגדרה היא **לכל** כיסוי פתוח יש
    תת-כיסוי סופי. כדי להראות שקבוצה **אינה** קומפקטית מספיק כיסוי פתוח אחד בלי תת-כיסוי סופי.
  remedy: { lesson: '3.2', label: 'ההגדרה של קומפקטיות בכיסויים' }

- id: MC-c3-closed-cover
  title: חושבים שאפשר להחליף בהגדרה כיסויים פתוחים בכיסויים כלשהם
  belief: >-
    בהגדרת הקומפקטיות לא משנה אם קבוצות הכיסוי פתוחות; אפשר לדרוש תת-כיסוי סופי לכל כיסוי, למשל בקבוצות סגורות.
  truth: >-
    הדרישה הזו לא מתקיימת אף פעם בקבוצה אינסופית: היחידונים $\{x\}$, $x\in[0,1]$, הם כיסוי של $[0,1]$ בקבוצות
    סגורות בלי תת-כיסוי סופי. הפתיחות היא מה שגורם לכל קבוצת כיסוי "לתפוס" סביבה של הנקודות שלה.
  remedy: { lesson: '3.2', label: 'למה דווקא כיסויים פתוחים' }

- id: MC-c3-infinite-cover
  title: חושבים שלכיסוי אינסופי אין תת-כיסוי סופי
  belief: >-
    אם הכיסוי מכיל אינסוף קבוצות, אין לו תת-כיסוי סופי.
  truth: >-
    הכיסוי של $[0,1]$ בקטעים $(-\frac1n,1+\frac1n)$ אינסופי, וכל אחת מהקבוצות שלו לבדה כבר מכסה. מה שקובע הוא
    אם אפשר לבחור מתוכו מספר סופי של קבוצות שעדיין מכסות.
  remedy: { lesson: '3.2', label: 'תת-כיסוי סופי' }

- id: MC-c3-endpoint-in-open
  title: מכניסים את נקודת הקצה לקטע פתוח או לכדור פתוח
  belief: >-
    הקטע $(\frac1{100},1)$ מכיל את $\frac1{100}$, והכדור $B(x,r)$ מכיל את הנקודות שבמרחק $r$ בדיוק.
  truth: >-
    $B(x,r)=\{y: d(x,y)<r\}$, באי-שוויון ממש. בחישובי כיסויים ורשתות זה משנה את התשובה: חמישה קטעים פתוחים
    באורך $0.2$ לא מכסים את $[0,1]$.
  remedy: { lesson: '3.2', label: 'כדורים פתוחים בכיסויים' }

- id: MC-c3-lebesgue-noncompact
  title: חושבים שלכל כיסוי פתוח של כל מרחב יש מספר לבג
  belief: >-
    לכל כיסוי פתוח, של כל מרחב מטרי, יש $\delta>0$ כך שכל כדור ברדיוס $\delta$ מוכל באחת מקבוצות הכיסוי.
  truth: >-
    הלמה של לבג דורשת מרחב קומפקטי. לכיסוי של $(0,1)$ בקטעים $(\frac1n,1)$ אין מספר לבג: לכל $\delta>0$ בוחרים
    נקודה $x\in(0,1)$ עם $x<\delta$. הכדור $B(x,\delta)$ במרחב $(0,1)$ מכיל את כל הקטע $(0,x]$, כלומר נקודות קטנות
    כרצוננו, ולכן אינו מוכל באף קטע $(\frac1n,1)$.
  remedy: { lesson: '3.2', label: 'הלמה של לבג' }

- id: MC-c3-lebesgue-overlap
  title: מזהים את מספר לבג עם אורך החפיפה בין קבוצות הכיסוי
  belief: >-
    מספר לבג של כיסוי בשתי קבוצות הוא אורך החיתוך שלהן.
  truth: >-
    מספר לבג הוא **רדיוס**: כל כדור $B(x,\delta)$ צריך להיכנס לקבוצה אחת. כדור שמרכזו באמצע החפיפה נכנס רק אם
    $\delta$ הוא לכל היותר חצי מאורך החפיפה.
  remedy: { lesson: '3.2', label: 'חישוב מספר לבג' }

- id: MC-c3-half-heine-borel
  title: בודקים רק אחד משני התנאים של היינה-בורל
  belief: >-
    במרחב האוקלידי מספיק לבדוק תנאי אחד: קבוצה חסומה (כמו כדור פתוח) או קבוצה סגורה (כמו קבוצה שמוגדרת
    באי-שוויון חלש) היא קומפקטית.
  truth: >-
    היינה-בורל דורש סגורה **וגם** חסומה. כדור היחידה הפתוח חסום ואינו קומפקטי: $(1-\frac1n)e_1\to e_1$, שאינה
    בכדור. הקבוצה $\{(x,y): x^2-y^2\le1\}$ סגורה ואינה קומפקטית: היא מכילה את $(t,t)$ לכל $t$.
  remedy: { lesson: '3.2', label: 'משפט היינה-בורל' }

- id: MC-c3-nested-closed
  title: חושבים שלסדרה יורדת של קבוצות סגורות לא ריקות יש תמיד חיתוך לא ריק
  belief: >-
    אם $F_1\supseteq F_2\supseteq\cdots$ סגורות ולא ריקות, אז $\bigcap_n F_n\ne\emptyset$, בכל מרחב.
  truth: >-
    ב-$\mathbb{R}$ הקבוצות $F_n=[n,\infty)$ סגורות, לא ריקות ויורדות, והחיתוך שלהן ריק. המסקנה נכונה במרחב
    קומפקטי: אילו החיתוך היה ריק, המשלימים $X\setminus F_n$ היו כיסוי פתוח בלי תת-כיסוי סופי.
  remedy: { lesson: '3.2', label: 'קומפקטיות וסדרות יורדות של קבוצות סגורות' }

- id: MC-c3-fip-pairwise
  title: מבלבלים את תכונת החיתוך הסופי עם חיתוך בזוגות או עם קבוצות לא ריקות
  belief: >-
    למשפחה יש תכונת החיתוך הסופי אם כל קבוצה בה לא ריקה, או אם כל שתי קבוצות בה נחתכות.
  truth: >-
    התכונה דורשת שכל מספר **סופי** של קבוצות במשפחה ייחתכו יחד. $\{a,b\}$, $\{b,c\}$, $\{a,c\}$ נחתכות בזוגות, והחיתוך
    של שלושתן ריק.
  remedy: { lesson: '3.2', label: 'תכונת החיתוך הסופי' }
