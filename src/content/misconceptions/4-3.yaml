# Misconceptions first detected in lesson 4.3 (the Arzelà–Ascoli theorem).
- id: MC-c4-relatively-compact-is-compact
  title: מבלבלים בין קבוצה קומפקטית יחסית לקבוצה קומפקטית
  belief: >-
    ארצלה-אסקולי אומר שקבוצה חסומה ורציפה במידה אחידה היא קומפקטית, ולכן הגבול של תת-סדרה שלה נמצא בקבוצה.
  truth: >-
    המשפט אומר שה**סגור** קומפקטי. $\{\frac{x}{n}\}$ חסומה ורציפה במידה אחידה, אבל הגבול שלה, פונקציית האפס, אינו
    בקבוצה: הקבוצה קומפקטית יחסית ואינה קומפקטית. הגבול של תת-הסדרה נמצא בסגור.
  remedy: { lesson: '4.3', anchor: hypotheses, label: 'ניסוח ארצלה-אסקולי: הסגור קומפקטי' }

- id: MC-c4-aa-without-bounded
  title: שוכחים את הנחת החסימות בארצלה-אסקולי
  belief: >-
    משפחה רציפה במידה אחידה מספיקה כדי לחלץ תת-סדרה מתכנסת במידה שווה.
  truth: >-
    $f_n\equiv n$ רציפות במידה אחידה, ו-$\|f_n-f_m\|_\infty\ge1$ לכל $n\ne m$: אין תת-סדרה מתכנסת. בהוכחה החסימות
    נותנת, דרך בולצאנו-ויירשטראס, תת-סדרה מתכנסת בכל נקודה של הקבוצה הצפופה.
  remedy: { lesson: '4.3', anchor: hypotheses, label: 'תפקיד החסימות' }

- id: MC-c4-dense-convergence-enough
  title: חושבים שהתכנסות על קבוצה צפופה נותנת התכנסות במידה שווה
  belief: >-
    אחרי שיטת האלכסון תת-הסדרה מתכנסת בכל נקודה של קבוצה צפופה, ולכן, כי הפונקציות רציפות, היא מתכנסת במידה
    שווה בכל המרחב.
  truth: >-
    בלי רציפות במידה אחידה זה נכשל: $\sin(n!\,\pi x)$ שואפת ל-0 בכל רציונלי ב-$[0,1]$ (מ-$n\ge q$ המספר
    $n!\frac pq$ שלם), אבל נורמת הסופרמום שלה היא 1. הרציפות במידה אחידה היא שמעבירה את ההתכנסות מרשת סופית לכל
    הנקודות.
  remedy: { lesson: '4.3', anchor: hypotheses, label: 'ההוכחה: מהקבוצה הצפופה לכל המרחב' }

- id: MC-c4-aa-hypothesis-role
  title: מייחסים להנחות של ארצלה-אסקולי תפקיד לא נכון בהוכחה
  belief: >-
    הקומפקטיות של $K$ דרושה כדי שהגבול יהיה רציף, והחסימות דרושה כדי שהקבוצה הצפופה תהיה בת מנייה.
  truth: >-
    בכיוון (ii)$\Rightarrow$(iii) הקומפקטיות של $K$ נותנת קבוצה צפופה בת מנייה ורשת סופית לכל $\delta$; בכיוון
    (i)$\Rightarrow$(ii) היא נותנת, דרך משפט קנטור, $\delta$ לכל אחת מהפונקציות ברשת הסופית. החסימות נותנת התכנסות
    בכל נקודה של הקבוצה הצפופה (בולצאנו-ויירשטראס). הרציפות במידה אחידה עם הרשת נותנת קושי במידה שווה, והשלמות של
    $C(K)$ נותנת גבול רציף.
  remedy: { lesson: '4.3', anchor: theorem, label: 'מה עושה כל הנחה בהוכחה' }

- id: MC-c4-aa-noncompact-domain
  title: מפעילים את ארצלה-אסקולי על תחום שאינו קומפקטי
  belief: >-
    משפחה חסומה ורציפה במידה אחידה של פונקציות על $\mathbb{R}$ קומפקטית יחסית בנורמת הסופרמום.
  truth: >-
    "גבעות" ברוחב 2 ובגובה 1 שמרכזן ב-$n$ חסומות וליפשיציות עם קבוע 1, אבל המרחק בין כל שתיים מהן 1. המשפט דורש
    ש-$K$ יהיה קומפקטי.
  remedy: { lesson: '4.3', anchor: hypotheses, label: 'למה K קומפקטי' }

- id: MC-c4-pointwise-bounded-uniform
  title: חושבים שחסם לכל פונקציה, או חסם בכל נקודה, הוא כבר חסם אחד למשפחה
  belief: >-
    חסם שתלוי בפונקציה (על $K$ קומפקטי כל $f\in C(K)$ חסומה), חסם שתלוי בנקודה, או חסם בנקודה אחת, כבר נותן חסם
    אחד לכל המשפחה ולכל הנקודות.
  truth: >-
    חסימות במידה שווה פירושה חסם אחד $M$ לכל הפונקציות ולכל הנקודות. $f_n\equiv n$ חסומה כל אחת, והמשפחה אינה
    חסומה; $\{n\,t_n\}$ חסומה נקודתית ואינה חסומה במידה שווה; ו-$|f(0)|\le1$ אינו חוסם את $f$ בנקודות אחרות. מחסם
    בנקודות עוברים לחסם אחד רק בעזרת מידע נוסף על המשפחה: חסם משותף על הנגזרת, או רציפות במידה אחידה (טענה 4.3.5).
  remedy: { lesson: '4.3', anchor: pointwise-to-uniform, label: 'חסומה נקודתית לעומת חסומה במידה שווה' }

- id: MC-c4-aa-pointwise-insufficient
  title: חושבים שחסימות נקודתית לעולם אינה מספיקה לארצלה-אסקולי
  belief: >-
    גם כשהמשפחה רציפה במידה אחידה, חסם בכל נקודה בנפרד אינו מספיק כדי לחלץ תת-סדרה מתכנסת במידה שווה; חייבים
    להניח חסם אחד לכל הנקודות.
  truth: >-
    על $K$ קומפקטי, משפחה רציפה במידה אחידה וחסומה נקודתית היא חסומה במידה שווה (טענה 4.3.5): $\delta$ עבור
    $\varepsilon=1$ ורשת סופית ברדיוס $\delta$ מעבירים את החסמים במספר סופי של נקודות לכל $K$, במחיר $1$. לכן
    לסדרה כזו יש תת-סדרה מתכנסת במידה שווה (מסקנה 4.3.8).
  remedy: { lesson: '4.3', anchor: pointwise-to-uniform, label: 'מחסימות נקודתית לחסימות במידה שווה' }

- id: MC-c4-aa-whole-sequence
  title: חושבים שארצלה-אסקולי נותן התכנסות של כל הסדרה
  belief: >-
    סדרה חסומה ורציפה במידה אחידה ב-$C(K)$ מתכנסת במידה שווה.
  truth: >-
    המשפט נותן **תת-סדרה** מתכנסת. $f_n\equiv(-1)^n$ חסומה ורציפה במידה אחידה ואינה מתכנסת.
  remedy: { lesson: '4.3', anchor: theorem, label: 'מה בדיוק המשפט נותן' }
