# Misconceptions first detected in lesson 1.3 (balls, open sets and closed sets).
- id: MC-c1-quantifier-order
  title: מחליפים את סדר הכמתים בהגדרה
  belief: >-
    "קיים כדור בתוך $U$" מספיק לפתיחות; או שאותו רדיוס צריך להתאים לכל הנקודות של $U$.
  truth: >-
    $U$ פתוחה אם **לכל** $x\in U$ **קיים** $r>0$, שתלוי ב-$x$, עם $B(x,r)\subseteq U$ (הגדרה 1.3.2). הקטע
    $(0,1)$ פתוח, ואין רדיוס אחד שמתאים לכל נקודותיו. (בהמשך, בשיעור 1.6, אותו סדר כמתים יחזור ברציפות.)
  remedy: { lesson: '1.3', anchor: open-def, label: 'הגדרה 1.3.2: קבוצה פתוחה' }

- id: MC-c1-radius-distance
  title: לוקחים את המרחק למרכז כרדיוס במקום המרחק שנשאר
  belief: >-
    בהוכחה ש-$B(a,r)$ פתוח, סביב $y$ לוקחים כדור ברדיוס $d(a,y)$.
  truth: >-
    הרדיוס הוא $s=r-d(a,y)>0$, המרחק שנשאר עד שפת הכדור. אז לכל $z\in B(y,s)$:
    $d(a,z)\le d(a,y)+d(y,z)<d(a,y)+s=r$.
  remedy: { lesson: '1.3', anchor: ball-open, label: 'משפט 1.3.3: כדור פתוח הוא קבוצה פתוחה' }

- id: MC-c1-open-not-closed
  title: חושבים שפתוחה וסגורה הן הפכים
  belief: >-
    קבוצה שאינה פתוחה היא סגורה, וקבוצה אינה יכולה להיות גם פתוחה וגם סגורה.
  truth: >-
    "סגורה" פירושו שהמשלים פתוח, לא "לא פתוחה". $\mathbb{Q}$ אינה פתוחה ואינה סגורה ב-$\mathbb{R}$; $\emptyset$ ו-$X$
    תמיד גם פתוחות וגם סגורות; ובמטריקה הבדידה כל קבוצה היא גם וגם.
  remedy: { lesson: '1.3', anchor: open-closed, label: 'פתוחה, סגורה, שתיהן או אף אחת' }

- id: MC-c1-separated-points-closed
  title: חושבים שקבוצה של נקודות מבודדות סגורה
  belief: >-
    אם כל נקודה של $A$ רחוקה משאר הנקודות של $A$, כמו ב-$\{\frac1n\}$, אז $A$ סגורה.
  truth: >-
    סגירות תלויה בנקודות **מחוץ** ל-$A$: $\{\frac1n:n\in\mathbb{N}\}$ אינה סגורה, כי כל כדור סביב $0\notin A$
    פוגש את $A$, ולכן המשלים אינו פתוח. $\mathbb{Z}$, לעומת זאת, סגורה.
  remedy: { lesson: '1.3', anchor: closed-def, label: 'הגדרה 1.3.4: קבוצה סגורה דרך המשלים' }

- id: MC-c1-discrete-balls
  title: מחשבים לא נכון כדורים במטריקה הבדידה
  belief: >-
    במטריקה הבדידה $B(x,1)$ הוא כל המרחב, או שכל כדור ברדיוס חיובי מכיל עוד נקודות מלבד המרכז, ולכן כל סדרה
    "מתקרבת" לכל נקודה.
  truth: >-
    $B(x,r)=\{x\}$ לכל $0<r\le1$ ו-$B(x,r)=X$ לכל $r>1$, ואילו $B[x,1]=X$. כדור ברדיוס $\tfrac12$ מכיל רק את
    מרכזו, ולכן כל קבוצה פתוחה (טענה 1.3.6). (בהמשך, בשיעור 1.5, זה יסביר מתי סדרה מתכנסת במטריקה הבדידה.)
  remedy: { lesson: '1.3', anchor: discrete, label: 'כדורים במטריקה הבדידה' }

- id: MC-c1-infinite-intersection
  title: חושבים שחיתוך של כל משפחה של פתוחות פתוח
  belief: >-
    כמו באיחוד, גם חיתוך של אינסוף קבוצות פתוחות פתוח (או, לפי דה מורגן, איחוד של אינסוף סגורות סגור).
  truth: >-
    בחיתוך סופי לוקחים את הרדיוס $\min(r_1,\dots,r_n)>0$; לאינסוף רדיוסים האינפימום יכול להיות 0.
    $\bigcap_n(-\frac1n,\frac1n)=\{0\}$ אינה פתוחה, ו-$\bigcup_n[\frac1n,1]=(0,1]$ אינה סגורה.
  remedy: { lesson: '1.3', anchor: intersections, label: 'משפט 1.3.7: חיתוך אינסופי של פתוחות' }

- id: MC-c1-subspace-ignored
  title: שוכחים שפתיחות תלויה במרחב שבו בודקים
  belief: >-
    $[0,1)$ "אינה פתוחה", בלי לשאול באיזה מרחב; או שקבוצה פתוחה בתת-מרחב פתוחה גם במרחב הגדול.
  truth: >-
    בתת-מרחב $Y\subseteq X$ הכדורים הם $B_X(y,r)\cap Y$. $[0,1)=(-1,1)\cap[0,2]$ פתוחה בתת-המרחב $[0,2]$
    ואינה פתוחה ב-$\mathbb{R}$ (משפט 1.3.11).
  remedy: { lesson: '1.3', anchor: subspace, label: 'משפט 1.3.11: פתוחות בתת-מרחב' }

- id: MC-c1-subspace-ball
  title: חושבים שבתת-מרחב כל קבוצה שנוגעת בקצה נעשית פתוחה
  belief: >-
    בתת-מרחב $[0,2]$ גם $(0,1]$ פתוחה, כי "בתת-מרחב הקצוות לא נחשבים".
  truth: >-
    רק הקצוות של **המרחב** $Y$ מקבלים כדורים חד-צדדיים. ב-$[0,2]$ הכדור סביב $1$ הוא $(1-r,1+r)\cap[0,2]$, והוא
    מכיל נקודות גדולות מ-1, ולכן $(0,1]$ אינה פתוחה ב-$[0,2]$. היא כן פתוחה ב-$[0,1]$.
  remedy: { lesson: '1.3', anchor: subspace, label: 'כדורים בתת-מרחב' }

- id: MC-c1-sup-ball-band
  title: לא רואים כדור במטריקת הסופרמום כרצועה סביב גרף
  belief: >-
    קרבה במטריקת הסופרמום לא שולטת בערכים בנקודות מסוימות, ולכן קבוצה כמו $\{f: f>0\}$ או $\{f: f(0)=0\}$
    אינה יכולה להיות פתוחה או סגורה.
  truth: >-
    $\|g-f\|_\infty<r$ פירושו שהגרף של $g$ כולו בתוך רצועה ברוחב $r$ סביב הגרף של $f$, ובפרט
    $|g(x)-f(x)|<r$ **בכל** נקודה (טענה 1.3.1א). לכן $|g(x_0)-f(x_0)|\le d_\infty(f,g)$, ומכאן $\{f: f>0\}$ פתוחה
    (טענה 1.3.14) ו-$\{f: f(0)=0\}$ סגורה ב-$d_\infty$.
  remedy: { lesson: '1.3', anchor: function-space, label: 'כדור במרחב פונקציות' }
