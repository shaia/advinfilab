# Misconceptions first detected in lesson 5.5 (the chain rule).
- id: MC-c5-chain-order
  title: כופלים את מטריצות יעקובי בכלל השרשרת בסדר הפוך
  belief: >-
    $J_{g\circ f}(a)=J_f(a)\,J_g(f(a))$, או שהגודל של $J_{g\circ f}$ נקבע מהמרחב האמצעי.
  truth: >-
    $J_{g\circ f}(a)=J_g(f(a))\,J_f(a)$: הפונקציה הפנימית פועלת ראשונה, ולכן המטריצה שלה מימין. ל-$f:\mathbb{R}^n\to\mathbb{R}^m$
    ו-$g:\mathbb{R}^m\to\mathbb{R}^k$ זו מכפלה $(k\times m)(m\times n)$, והתוצאה $k\times n$.
  remedy: { lesson: '5.5', label: 'כלל השרשרת כמכפלת מטריצות' }

- id: MC-c5-chain-wrong-point
  title: גוזרים את הפונקציה החיצונית בנקודה הלא נכונה
  belief: >-
    בכלל השרשרת מחשבים את $Dg$ באותה נקודה $a$ שבה מחשבים את $Df$, או בווקטור המהירות.
  truth: >-
    $D(g\circ f)(a)=Dg(f(a))\circ Df(a)$: את $g$ גוזרים בנקודה $f(a)$, שאליה $f$ שולחת את $a$. לאורך מסילה:
    $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$, הגרדיאנט ב-$\gamma(t)$.
  remedy: { lesson: '5.5', label: 'כלל השרשרת: באיזו נקודה גוזרים' }

- id: MC-c5-chain-partials-enough
  title: חושבים שכלל השרשרת עובד כשלפונקציה החיצונית יש רק נגזרות חלקיות
  belief: >-
    אם ל-$g$ יש נגזרות חלקיות ב-$f(a)$, אז $(g\circ f)'=\nabla g(f(a))\cdot f'$, גם בלי דיפרנציאביליות.
  truth: >-
    ההוכחה צריכה ש-$g(b+k)-g(b)-Bk=o(\|k\|)$ לכל $k$ קטן. ל-$g=\frac{x^2y}{x^2+y^2}$ (0 בראשית) ו-$f(t)=(t,t)$:
    $(g\circ f)'(0)=\frac12$, ואילו $\nabla g(0)\cdot f'(0)=0$. כשהנוסחה נכשלת, הפונקציה החיצונית אינה
    דיפרנציאבילית.
  remedy: { lesson: '5.5', label: 'ההנחות של כלל השרשרת' }

- id: MC-c5-polar-rule
  title: טועים בנגזרות בקואורדינטות קוטביות
  belief: >-
    $\frac{\partial g}{\partial r}=f_x$ ו-$\frac{\partial g}{\partial\theta}=f_y$, או ששוכחים את הגורם $r$ ואת הסימנים.
  truth: >-
    מ-$x=r\cos\theta$, $y=r\sin\theta$ וכלל השרשרת: $g_r=\cos\theta f_x+\sin\theta f_y$ ו-$g_\theta=-r\sin\theta f_x+r\cos\theta f_y$.
    לכן $f_x^2+f_y^2=g_r^2+\frac{1}{r^2}g_\theta^2$.
  remedy: { lesson: '5.5', label: 'נגזרות בקואורדינטות קוטביות' }

- id: MC-c5-curve-position
  title: כופלים את הגרדיאנט במיקום במקום במהירות
  belief: >-
    $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma(t)$.
  truth: >-
    כלל השרשרת כופל בנגזרת של הפונקציה הפנימית: $\frac{d}{dt}f(\gamma(t))=\nabla f(\gamma(t))\cdot\gamma'(t)$, הגרדיאנט
    בנקודה כפול וקטור המהירות.
  remedy: { lesson: '5.5', label: 'נגזרת לאורך מסילה' }

- id: MC-c5-euler-any-function
  title: מפעילים את משפט אוילר על כל פונקציה או עם הדרגה הלא נכונה
  belief: >-
    $x\cdot\nabla f(x)=f(x)$ (או $kf(x)$) לכל פונקציה, או ש-$f(tx)=tf(x)$ לכל פונקציה הומוגנית.
  truth: >-
    משפט אוילר הוא על פונקציה הומוגנית מדרגה $k$, $f(tx)=t^kf(x)$ לכל $t>0$, ואז $x\cdot\nabla f(x)=kf(x)$. פונקציה עם
    מחוברים מדרגות שונות ($x^2+y$) אינה הומוגנית, והמקדם תמיד הדרגה עצמה.
  remedy: { lesson: '5.5', label: 'משפט אוילר לפונקציות הומוגניות' }

- id: MC-c5-chain-inner-derivative
  title: שוכחים את הנגזרת הפנימית או את הסימן שלה
  belief: >-
    $\frac{\partial}{\partial y}\varphi(x-y)=\varphi'(x-y)$, או ש-$\frac{\partial}{\partial\theta}(r\cos\theta)=r\sin\theta$.
  truth: >-
    כלל השרשרת כופל תמיד בנגזרת של הפונקציה הפנימית: $\frac{\partial}{\partial y}\varphi(x-y)=\varphi'(x-y)\cdot\frac{\partial(x-y)}{\partial y}$,
    כלומר $\varphi'(x-y)$ כפול $(-1)$. סימן שגוי בנגזרת הפנימית הופך תוצאות שלמות.
  remedy: { lesson: '5.5', label: 'כלל השרשרת: הנגזרת הפנימית' }
