# Misconceptions first detected in lesson 1.5 (sequences in a metric space).
- id: MC-c1-consecutive-distance
  title: חושבים שאם איברים עוקבים מתקרבים הסדרה מתכנסת
  belief: >-
    אם $d(x_n,x_{n+1})\to0$ אז $(x_n)$ מתכנסת.
  truth: >-
    ההגדרה מדברת על המרחק לגבול: $d(x_n,x)\to0$. ב-$\mathbb{R}$ הסדרה $\sqrt n$ מקיימת
    $\sqrt{n+1}-\sqrt n=\frac{1}{\sqrt{n+1}+\sqrt n}\to0$ ואינה מתכנסת: היא אינה חסומה, וסדרה מתכנסת חסומה
    (טענה 1.5.3(ג)).
  remedy: { lesson: '1.5', anchor: definition, label: 'ההגדרה של התכנסות' }

- id: MC-c1-one-coordinate
  title: בודקים התכנסות במרחב האוקלידי בקואורדינטה אחת
  belief: >-
    סדרה ב-$\mathbb{R}^k$ מתכנסת אם קואורדינטה אחת מתכנסת, או שהמרחק $d_\infty$ נקבע לפי הקואורדינטה הראשונה.
  truth: >-
    $x_n\to x$ ב-$\mathbb{R}^k$ אם ורק אם **כל** קואורדינטה מתכנסת (משפט 1.5.9), כי
    $|x_{n,i}-x_i|\le\|x_n-x\|_\infty\le\|x_n-x\|_2\le\|x_n-x\|_1\le k\,\|x_n-x\|_\infty$. הסדרה $(\frac1n,(-1)^n)$ אינה
    מתכנסת.
  remedy: { lesson: '1.5', anchor: coordinates, label: 'התכנסות לפי קואורדינטות' }

- id: MC-c1-few-sequences
  title: מכריעים לפי סדרה אחת או כמה סדרות
  belief: >-
    אם סדרה אחת (או כמה) מ-$A$ מתכנסת לנקודה של $A$, הקבוצה סגורה; או: הסגור הוא קבוצת הגבולות של הסדרות הראשונות
    שעולות בדעת.
  truth: >-
    האפיון הוא "**לכל** סדרה": $A$ סגורה אם ורק אם הגבול של **כל** סדרה מ-$A$ שמתכנסת ב-$X$ נמצא ב-$A$ (מסקנה
    1.5.8), ו-$\overline A$ היא קבוצת הגבולות של **כל** הסדרות מ-$A$. סדרה אחת יכולה רק להפריך: ב-$G=\{xy>0\}$
    הסדרה $(1,1)$ הקבועה נשארת ב-$G$, אבל $(\frac1n,\frac1n)\to(0,0)\notin G$, ולכן $G$ אינה סגורה.
  remedy: { lesson: '1.5', anchor: closed-seq, label: 'האפיון הסדרתי של קבוצה סגורה' }

- id: MC-c1-pointwise-is-sup
  title: חושבים שהתכנסות נקודתית היא התכנסות במטריקת הסופרמום
  belief: >-
    אם $f_n(x)\to f(x)$ לכל $x$, אז $f_n\to f$ במטריקת הסופרמום.
  truth: >-
    התכנסות במטריקת הסופרמום היא התכנסות **במידה שווה**: $\sup|f_n-f|\to0$ (משפט 1.5.10). $x^n$ שואפת נקודתית על
    $[0,1]$ לפונקציה $f$ (0 ב-$[0,1)$, 1 ב-1), אבל $\sup|x^n-f|=1$ לכל $n$.
  remedy: { lesson: '1.5', anchor: sup-convergence, label: 'התכנסות במטריקת הסופרמום' }

- id: MC-c1-sum-splits
  title: חושבים שאם סכום מתכנס, כל מחובר מתכנס לבד
  belief: >-
    אם $e_k+f_k\to x$ עם $e_k\in E$ ו-$f_k\in F$, אז $(e_k)$ ו-$(f_k)$ מתכנסות, ולכן סכום של קבוצות סגורות סגור.
  truth: >-
    אריתמטיקה של גבולות עובדת בכיוון אחד בלבד: אם המחוברים מתכנסים, הסכום מתכנס. ההפך לא: $e_k=k$ ו-$f_k=-k+\frac1k$
    מתבדרות, וסכומן $\frac1k\to0$. כך $E=\mathbb{N}$ ו-$F=\{-n+\frac1n\}$ סגורות ב-$\mathbb{R}$, ו-$E+F$ אינה סגורה:
    $0\notin E+F$ אבל $\frac1n\in E+F$ (מסקנה 1.5.8(ב)).
  remedy: { lesson: '1.5', anchor: closed-seq, label: 'האפיון הסדרתי של קבוצה סגורה' }

- id: MC-c1-coordinatewise-weaker
  title: חושבים שגם במרחב האוקלידי התכנסות לפי קואורדינטות חלשה מהתכנסות במטריקה
  belief: >-
    התכנסות לפי קואורדינטות היא תמיד חלשה יותר מהתכנסות במטריקה, גם ב-$\mathbb{R}^k$, כמו בסדרה $e_n$ ב-$B(\mathbb{N})$.
  truth: >-
    ב-$\mathbb{R}^k$ עם $d_1$, $d_2$ או $d_\infty$ שני המושגים שקולים (משפט 1.5.9), כי יש רק $k$ קואורדינטות ואפשר לקחת
    מקסימום של $k$ מספרים $N_i$. רק עם אינסוף קואורדינטות, כמו ב-$B(\mathbb{N})$, ההתכנסות לפי קואורדינטות חלשה
    ממש.
  remedy: { lesson: '1.5', anchor: coordinates, label: 'התכנסות לפי קואורדינטות' }
