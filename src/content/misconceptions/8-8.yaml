# Misconceptions first detected in lesson 8.8 (approximating paths; homotopy of continuous paths).
- id: MC-c8-uniform-close-integrals
  title: חושבים שמסילות קרובות במידה שווה נותנות אינטגרלים קוויים קרובים לכל שדה רציף
  belief: >-
    אם $\sigma_k\to\gamma$ במידה שווה, אז $\int_{\sigma_k}F\cdot ds\to\int_\gamma F\cdot ds$ לכל שדה רציף $F$, כי
    $F$ רציף במידה שווה על קבוצה קומפקטית שמכילה את כל המסילות.
  truth: >-
    החסם על אינטגרל קווי כולל את **אורך** המסילה, ואורכים של מסילות קרובות יכולים להתפוצץ. ל-$F=(-y,x)$, ל-$\gamma(t)=(t,0)$
    ול-$\sigma_k(t)=(t+\frac{\cos k^2t-1}{k},\ \frac{\sin k^2t}{k})$, $t\in[0,2\pi]$: אותן נקודות קצה, מרחק לכל היותר
    $\frac2k$, אבל $\int_{\sigma_k}F\cdot ds=2\pi$ ו-$\int_\gamma F\cdot ds=0$. לשדה **משמר מקומית** ולמסילות עם אותם
    קצוות, קרבה מספקת (לפי מספר לבג) נותנת אינטגרלים **שווים**.
  remedy: { lesson: '8.8', label: 'אינטגרל לאורך מסילה רציפה' }

- id: MC-c8-continuous-path-no-integral
  title: חושבים שאינטגרל לאורך מסילה מוגדר רק דרך הנגזרת של המסילה
  belief: >-
    הדרך היחידה לשלב שדה לאורך מסילה היא $\int_a^bF(\gamma(t))\cdot\gamma'(t)\,dt$. לכן לאורך מסילה רציפה בלבד אין
    אינטגרל (או שמשתמשים בנוסחה במקומות שבהם $\gamma'$ קיימת), וכל טיעון הומוטופיה חייב מסילות חלקות.
  truth: >-
    מסילה רציפה יכולה להיות בלי נגזרת בשום מקום ובלי אורך סופי. לשדה משמר מקומית מגדירים את האינטגרל בעזרת פוטנציאלים
    מקומיים על חלוקה עדינה: $\sum_j\left(\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))\right)$. ההגדרה אינה תלויה
    בבחירות, ומתלכדת עם הנוסחה הרגילה כשהמסילה חלקה למקוטעין.
  remedy: { lesson: '8.8', label: 'אינטגרל לאורך מסילה רציפה' }

- id: MC-c8-local-potential-choice
  title: חושבים שבחירת הפוטנציאלים המקומיים משנה את האינטגרל
  belief: >-
    באינטגרל לאורך מסילה רציפה, כל בחירה אחרת של הפוטנציאלים $\varphi_j$ בכדורים נותנת ערך אחר; לכן צריך לבחור אותם
    כך שיתאימו זה לזה בחיתוכים.
  truth: >-
    שני פוטנציאלים של $F$ באותו כדור נבדלים בקבוע (הגרדיאנט של ההפרש מתאפס בקבוצה קמורה), והקבוע מתקזז בהפרש
    $\varphi_j(\gamma(t_j))-\varphi_j(\gamma(t_{j-1}))$. אין צורך שהפוטנציאלים יתאימו בחיתוכים, ולעיתים זה בלתי אפשרי:
    לשדה הזווית לאורך מעגל.
  remedy: { lesson: '8.8', label: 'אינטגרל לאורך מסילה רציפה' }
