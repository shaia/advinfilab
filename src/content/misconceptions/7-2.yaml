# Misconceptions first detected in lesson 7.2 (the proof of the inverse function theorem).
- id: MC-c7-opnorm-lower-bound
  title: חוסמים את גודל התמונה מלמטה בעזרת נורמת האופרטור
  belief: >-
    לכל $v$ מתקיים $\|Av\|\ge\|A\|_{\mathrm{op}}\|v\|$.
  truth: >-
    נורמת האופרטור היא חסם **עליון**: $\|Av\|\le\|A\|_{\mathrm{op}}\|v\|$. חסם תחתון בא מההופכית:
    $\|v\|=\|A^{-1}Av\|\le\|A^{-1}\|_{\mathrm{op}}\|Av\|$, כלומר $\|Av\|\ge\|A^{-1}\|_{\mathrm{op}}^{-1}\|v\|$.
    ל-$A=\operatorname{diag}(2,\frac12)$ הקבוע הוא $\frac12$, לא 2.
  remedy: { lesson: '7.2', label: 'חסם תחתון להעתקה הפיכה בעזרת נורמת ההופכית' }

- id: MC-c7-vector-mvt-equality
  title: משתמשים בשוויון הערך הממוצע לפונקציה וקטורית
  belief: >-
    לכל $x,y$ יש $\xi$ על הקטע ביניהן עם $h(x)-h(y)=Dh(\xi)(x-y)$, גם כש-$h$ וקטורית.
  truth: >-
    לפונקציה וקטורית יש רק **אי-שוויון** ערך ממוצע (שיעור 5.6). $\gamma(t)=(\cos t,\sin t)$ מקיימת
    $\gamma(2\pi)-\gamma(0)=0$ אף ש-$\gamma'(t)\neq0$ לכל $t$. בהוכחה משתמשים ב-
    $\|h(x)-h(y)\|\le\sup\|Dh\|_{\mathrm{op}}\,\|x-y\|$ על כדור, שהוא קבוצה קמורה.
  remedy: { lesson: '7.2', label: 'החד-חד-ערכיות מאי-שוויון הערך הממוצע' }

- id: MC-c7-open-ball-banach
  title: מפעילים את משפט בנך על כדור פתוח
  belief: >-
    אם $\varphi$ מכווצת ומעבירה את הכדור הפתוח $B(a,r)$ לתוך עצמו, יש לה נקודת שבת בו.
  truth: >-
    משפט בנך דורש מרחב שלם, והכדור הפתוח אינו שלם. $\varphi(x)=\frac{x+1}{2}$ מכווצת ומעבירה את $(-1,1)$ לתוך
    עצמו, ונקודת השבת היחידה שלה, 1, אינה בו. בהוכחה עובדים על הכדור הסגור $B[a,r]$, תת-קבוצה סגורה של המרחב
    השלם $\mathbb{R}^n$.
  remedy: { lesson: '7.2', label: 'העל מתוך משפט בנך: למה הכדור הסגור' }

- id: MC-c7-lipschitz-gives-derivative
  title: מסיקים גזירות מתנאי ליפשיץ
  belief: >-
    ההופכית ליפשיץ, מההערכה $\|f(x)-f(y)\|\ge c\|x-y\|$, ולכן היא גזירה ברציפות.
  truth: >-
    תנאי ליפשיץ נותן רציפות, לא גזירות: $|x|$ ליפשיץ ואינה גזירה באפס. את הגזירות של ההופכית מוכיחים בנפרד
    מהגדרת הדיפרנציאל, ורק אחר כך $y\mapsto Df(f^{-1}(y))^{-1}$ רציפה כהרכבה של העתקות רציפות.
  remedy: { lesson: '7.2', label: 'הגזירות של ההופכית ורציפות הנגזרת שלה' }

- id: MC-c7-positive-derivative-monotone
  title: חושבים שנגזרת חיובית בנקודה נותנת עלייה בסביבה
  belief: >-
    אם $f'(a)>0$, אז $f$ עולה באיזה קטע סביב $a$.
  truth: >-
    $f'(a)>0$ נותן רק $f(x)<f(a)<f(y)$ ל-$x<a<y$ קרובים מספיק. כדי לעלות בקטע צריך $f'>0$ בכל הקטע, ולשם כך
    רציפות של $f'$ ב-$a$. $f(x)=x+2x^2\sin\frac1x$ מקיימת $f'(0)=1$, ו-$f'\left(\frac{1}{2\pi k}\right)=-1$ לכל $k$.
  remedy: { lesson: '7.2', label: 'למה צריך גזירות ברציפות: הדוגמה עם הסינוס של אחד חלקי x' }

- id: MC-c7-global-never
  title: חושבים שההוכחה של משפט הפונקציה ההפוכה לעולם לא נותנת מסקנה גלובלית
  belief: >-
    כל מסקנה מההוכחה של משפט הפונקציה ההפוכה היא מקומית; אי אפשר לקבל ממנה הפיכות על כל $\mathbb{R}^n$.
  truth: >-
    ההוכחה עובדת על כל קבוצה קמורה שבה $\|Df(x)-A\|_{\mathrm{op}}\le\frac12\|A^{-1}\|_{\mathrm{op}}^{-1}$. אם,
    למשל, $\|Df(x)-I\|_{\mathrm{op}}\le\frac12$ לכל $x\in\mathbb{R}^n$, אז $f$ חד-חד-ערכית ועל $\mathbb{R}^n$:
    אי-שוויון הערך הממוצע על כל המרחב, ומשפט בנך על המרחב השלם $\mathbb{R}^n$.
  remedy: { lesson: '7.2', label: 'מתי ההוכחה נותנת הופכית על כל המרחב' }

- id: MC-c7-image-of-open-is-open
  title: חושבים שפונקציה רציפה, או גזירה, מעתיקה קבוצות פתוחות לקבוצות פתוחות
  belief: >-
    אם $f$ רציפה (ובוודאי אם היא גזירה ברציפות), התמונה של קבוצה פתוחה פתוחה.
  truth: >-
    רציפות היא תכונה של **מקורות**: $f^{-1}(O)$ פתוחה לכל $O$ פתוחה. תמונות לא חייבות להיות פתוחות: $x\mapsto x^2$
    מעתיקה את $(-1,1)$ על $[0,1)$, ו-$(x,y)\mapsto(x,0)$ מעתיקה את המישור על ישר. משפט ההעתקה הפתוחה דורש
    דיפרנציאל הפיך **בכל** נקודה של הקבוצה.
  remedy: { lesson: '7.2', label: 'משפט ההעתקה הפתוחה' }
