# Misconceptions first detected in lesson 7.4 (level sets and the tangent space).
- id: MC-c7-regular-means-invertible
  title: חושבים שנקודה רגולרית דורשת דיפרנציאל הפיך
  belief: >-
    $a$ נקודה רגולרית של $F:\mathbb{R}^n\to\mathbb{R}^k$ אם $DF(a)$ הפיכה.
  truth: >-
    $J_F(a)$ היא מטריצה $k\times n$, ובדרך כלל אינה ריבועית. $a$ רגולרית אם $DF(a)$ **על** $\mathbb{R}^k$, כלומר
    מדרגה $k$; כש-$k=1$ זה בדיוק $\nabla F(a)\neq0$.
  remedy: { lesson: '7.4', label: 'ההגדרה של נקודה רגולרית וערך רגולרי' }

- id: MC-c7-regular-value-scope
  title: מבלבלים בין ערך רגולרי לבין נקודה רגולרית אחת
  belief: >-
    $c$ ערך רגולרי אם יש נקודה אחת על $F^{-1}(c)$ שבה הגרדיאנט שונה מאפס; או להפך, רק אם $\nabla F\neq0$ בכל
    התחום.
  truth: >-
    $c$ ערך רגולרי אם **כל** נקודה של קבוצת הגובה $F^{-1}(c)$ רגולרית. נקודות קריטיות מחוץ לקבוצת הגובה אינן
    משנות: ל-$F=x^2+y^2-z^2$ הערך 1 רגולרי אף שהראשית נקודה קריטית של $F$, כי $F(0)=0\neq1$.
  remedy: { lesson: '7.4', label: 'ההגדרה של נקודה רגולרית וערך רגולרי' }

- id: MC-c7-tangent-space-affine
  title: מבלבלים בין המרחב המשיק לבין המישור המשיק שעובר בנקודה
  belief: >-
    המרחב המשיק לספרה $x^2+y^2+z^2=9$ בנקודה $(1,2,2)$ הוא $\{x+2y+2z=9\}$.
  truth: >-
    המרחב המשיק $T_aS=\ker DF(a)$ הוא תת-מרחב וקטורי ועובר בראשית: $\{v:\ v_1+2v_2+2v_3=0\}$. המישור המשיק שעובר
    בנקודה הוא ההזזה $a+T_aS=\{x+2y+2z=9\}$; במשוואה שלו האגף הימני הוא $\nabla F(a)\cdot a$.
  remedy: { lesson: '7.4', label: 'המרחב המשיק כגרעין של הדיפרנציאל' }

- id: MC-c7-tangent-normal-swap
  title: מחליפים בין הכיוון המשיק לכיוון הנורמלי
  belief: >-
    הגרדיאנט $\nabla F(a)$ פורש את המרחב המשיק לקבוצת הגובה.
  truth: >-
    הגרדיאנט ניצב לקבוצת הגובה: הוא פורש את הכיוון הנורמלי, והמרחב המשיק הוא המשלים הניצב שלו,
    $\ker DF(a)=\nabla F(a)^{\perp}$.
  remedy: { lesson: '7.4', label: 'המרחב המשיק והווקטור הנורמלי' }

- id: MC-c7-tangent-dim
  title: טועים במימד של המרחב המשיק
  belief: >-
    לקבוצת גובה רגולרית של $F:\mathbb{R}^n\to\mathbb{R}^k$ המרחב המשיק ממימד $k$.
  truth: >-
    $T_aS=\ker DF(a)$, ו-$DF(a)$ מדרגה $k$, ולכן לפי משפט הדרגה $\dim T_aS=n-k$: כל אילוץ בלתי תלוי מוריד מימד
    אחד.
  remedy: { lesson: '7.4', label: 'המרחב המשיק כגרעין של הדיפרנציאל' }

- id: MC-c7-graph-always-z
  title: מניחים שתמיד אפשר לבטא את המשתנה האחרון
  belief: >-
    ליד נקודה רגולרית, משטח גובה ב-$\mathbb{R}^3$ הוא גרף מהצורה $z=g(x,y)$.
  truth: >-
    משפט הפונקציה הסתומה נותן גרף לפי משתנה שהנגזרת החלקית לפיו אינה מתאפסת. ב-$x^2+y^2-z^2=1$ ליד $(1,0,0)$:
    $\nabla F=(2,0,0)$, ולכן $x=g(y,z)$; אבל $z$ אינו פונקציה של $(x,y)$ שם, כי ל-$(x,y)$ קרובים יש שני ערכים
    $z=\pm\sqrt{x^2+y^2-1}$ או אף אחד.
  remedy: { lesson: '7.4', label: 'קבוצת גובה של ערך רגולרי היא מקומית גרף' }

- id: MC-c7-zero-gradient-singular
  title: חושבים שגרדיאנט מתאפס מוכיח שקבוצת הגובה אינה חלקה
  belief: >-
    אם $\nabla F(a)=0$ בנקודה $a$ של קבוצת הגובה, קבוצת הגובה אינה עקום או משטח חלק ליד $a$.
  truth: >-
    $\nabla F(a)=0$ אומר רק שהמשפט אינו חל. ל-$F(x,y)=y^2$ הגרדיאנט מתאפס בכל נקודה של $\{F=0\}$, שהיא ציר
    ה-$x$, ישר חלק לגמרי. סינגולריות מוכיחים ישירות, למשל בשני ענפים שנחתכים (חרוט, למניסקטה) או בחוד.
  remedy: { lesson: '7.4', label: 'נקודות סינגולריות: חרוט, למניסקטה וחוד' }

- id: MC-c7-continuous-graph-smooth
  title: חושבים שגרף של פונקציה רציפה הוא עקום חלק
  belief: >-
    העקום $y^2=x^3$ הוא הגרף $x=y^{2/3}$, ולכן הוא עקום חלק ליד הראשית.
  truth: >-
    $x=|y|^{2/3}$ רציפה ואינה גזירה באפס, כי המנה $\frac{|y|^{2/3}}{y}$ אינה חסומה. זו נקודת חוד: באף סביבה של
    הראשית העקום אינו גרף של פונקציה גזירה ברציפות, לא של $x$ ולא של $y$.
  remedy: { lesson: '7.4', label: 'נקודות סינגולריות: חרוט, למניסקטה וחוד' }

- id: MC-c7-critical-not-on-level
  title: סופרים נקודות קריטיות שאינן על קבוצת הגובה
  belief: >-
    כל נקודה קריטית של $F$ היא נקודה סינגולרית של הקבוצה $\{F=0\}$.
  truth: >-
    נקודה סינגולרית של קבוצת גובה היא נקודה קריטית **שנמצאת עליה**. ל-$F=(x^2+y^2)^2-(x^2-y^2)$ יש שלוש נקודות
    קריטיות, $(0,0)$ ו-$(\pm\frac{1}{\sqrt2},0)$, אבל $F(\pm\frac{1}{\sqrt2},0)=-\frac14\neq0$: על הלמניסקטה רק
    הראשית סינגולרית.
  remedy: { lesson: '7.4', label: 'נקודות סינגולריות: חרוט, למניסקטה וחוד' }
