# Misconceptions first detected in lesson 0.1 (how to study an advanced course, how to read an abstract definition
# and a proof with several epsilons).
- id: MC-c0-satisfying-example-tests-hypothesis
  title: בודקים הנחה של משפט על דוגמה שמקיימת את כל ההנחות
  belief: >-
    כדי לבדוק אם הנחה במשפט נחוצה, מנסים את המשפט על דוגמה טובה שהוא חל עליה, ורואים שהמסקנה מתקיימת.
  truth: >-
    דוגמה שמקיימת את כל ההנחות לא אומרת דבר על אף הנחה: המשפט כבר מבטיח לה את המסקנה. כדי להראות שהנחה
    נחוצה מחפשים דוגמה שמקיימת את **כל שאר** ההנחות, מפרה רק אותה, והמסקנה נכשלת בה.
  remedy: { lesson: '0.1', label: 'איך בודקים שהנחה במשפט נחוצה' }

- id: MC-c0-example-tests-other-hypothesis
  title: דוגמה שמפרה הנחה אחרת נחשבת כבדיקה של ההנחה הנשאלת
  belief: >-
    כל דוגמה שבה המסקנה של המשפט נכשלת מראה שההנחה שאני בודק נחוצה.
  truth: >-
    דוגמה שבה המסקנה נכשלת מראה שאחת ההנחות שהיא מפרה נחוצה. אם היא מפרה הנחה אחרת (למשל רציפות במקום
    חסימות), היא בודקת את ההנחה האחרת. הדוגמה הנכונה מפרה **רק** את ההנחה הנבדקת.
  remedy: { lesson: '0.1', label: 'איך בודקים שהנחה במשפט נחוצה' }

- id: MC-c0-only-positive-examples
  title: בודקים הגדרה חדשה רק על דוגמאות שמקיימות אותה
  belief: >-
    כדי להבין הגדרה חדשה מספיק לראות שהדוגמה הפשוטה ביותר מקיימת אותה.
  truth: >-
    הגדרה מובנת כשיודעים גם מה **לא** מקיים אותה ואיזה חלק בה נכשל. התבנית של הקורס היא הגדרה, דוגמה,
    דוגמה נגדית: לכל הגדרה מחפשים אובייקט שמקיים אותה ואובייקט שאינו מקיים, ומסבירים את ההבדל.
  remedy: { lesson: '0.1', label: 'הגדרה, דוגמה, דוגמה נגדית' }

- id: MC-c0-quantifier-order-definition
  title: בהגדרה עם קיים ולכל, הקבוע נבחר אחרי הנקודות
  belief: >-
    בהגדרה "קיים $C$ כך שלכל $x<y$..." מותר לבחור $C$ אחר לכל זוג נקודות.
  truth: >-
    הכמת "קיים $C$" בא לפני "לכל $x<y$", ולכן אותו $C$ חייב להתאים לכל הזוגות בבת אחת. אם $C$ תלוי ב-$x,y$,
    כל פונקציה מקיימת את התנאי וההגדרה ריקה.
  remedy: { lesson: '0.1', label: 'קוראים הגדרה מופשטת: סדר הכמתים' }

- id: MC-c0-negation-partial
  title: שוללים רק חלק מהכמתים של הגדרה
  belief: >-
    כדי לשלול הגדרה מספיק לשלול את אי-השוויון שבסופה, או להפוך רק את הכמת הראשון.
  truth: >-
    בשלילה **כל** כמת מתהפך ("לכל" ל"קיים" ולהפך), לפי הסדר, ורק אחר כך נשלל התנאי שבסוף:
    השלילה של $\exists C\ \forall x\ P$ היא $\forall C\ \exists x\ \neg P$.
  remedy: { lesson: '0.1', label: 'קוראים הגדרה מופשטת: שלילה' }

- id: MC-c0-eps-half-always
  title: אפסילון חלקי שתיים כטקס קבוע
  belief: >-
    בכל הוכחה עם כמה גורמים בוחרים $\frac{\varepsilon}{2}$ (או $\frac{\varepsilon}{3}$ לפי מספר הגורמים), בלי
    להסתכל על אי-השוויון.
  truth: >-
    הקבוע נקרא מאי-השוויון שבסוף ההוכחה: כמה מחוברים יש ובאילו מקדמים הם מוכפלים. ב-$2|u|+5|v|$ צריך
    $|u|,|v|<\frac{\varepsilon}{7}$, ובממוצע של שלושה איברים לא צריך לחלק כלל.
  remedy: { lesson: '0.1', label: 'מאיפה באים הקבועים בהוכחה עם כמה אפסילונים' }

- id: MC-c0-constants-ignore-coefficients
  title: בוחרים קבוע שמתעלם מהמקדמים או ממספר המחוברים
  belief: >-
    אם $|a_nb_n-LM|\le 3|b_n-M|+4|a_n-L|$, מספיק לחלק כל מחובר במקדם שלו: $|b_n-M|<\frac{\varepsilon}{3}$
    ו-$|a_n-L|<\frac{\varepsilon}{4}$.
  truth: >-
    כך כל מחובר קטן מ-$\varepsilon$ והסכום קטן מ-$2\varepsilon$. צריך שהסכום של **כל** המחוברים, עם המקדמים,
    יהיה לכל היותר $\varepsilon$: למשל $\frac{\varepsilon}{6}$ ו-$\frac{\varepsilon}{8}$.
  remedy: { lesson: '0.1', label: 'מאיפה באים הקבועים בהוכחה עם כמה אפסילונים' }

- id: MC-c0-must-end-exactly-eps
  title: חושבים שהוכחה חייבת להסתיים בדיוק בקטן מאפסילון
  belief: >-
    הוכחה שמגיעה ל-$|a_n-L|<2\varepsilon$ שגויה, כי ההגדרה דורשת $<\varepsilon$.
  truth: >-
    כי $\varepsilon>0$ שרירותי, גם $2\varepsilon$ (או $K\varepsilon$ עם $K$ קבוע שאינו תלוי ב-$n$) הוא מספר חיובי
    שרירותי: מפעילים את אותו טיעון עם $\frac{\varepsilon}{2}$. החלוקה מראש היא נוחות, לא חובה.
  remedy: { lesson: '0.1', label: 'מאיפה באים הקבועים בהוכחה עם כמה אפסילונים' }

- id: MC-c0-same-N
  title: משתמשים באותו N לשתי סדרות שונות
  belief: >-
    אם $a_n\to a$ ו-$b_n\to b$, ה-$N$ שמתאים ל-$a_n$ מתאים גם ל-$b_n$.
  truth: >-
    כל התכנסות נותנת $N$ משלה, $N_1$ ו-$N_2$. כדי ששני התנאים יתקיימו יחד בוחרים $N=\max(N_1,N_2)$.
  remedy: { lesson: '0.1', label: 'קוראים הוכחה: מה מצדיק כל מעבר' }

- id: MC-c0-N-must-be-formula
  title: חושבים ש-N חייב להינתן בנוסחה מפורשת
  belief: >-
    הוכחת התכנסות תקינה רק אם כותבים את $N$ כנוסחה מפורשת ב-$\varepsilon$.
  truth: >-
    ההגדרה דורשת **קיום** של $N$. מותר לקבל $N$ ממשפט או מהתכנסות ידועה ("קיים $N_1$ כך ש...") בלי לדעת
    אותו במפורש.
  remedy: { lesson: '0.1', label: 'קוראים הוכחה: מה מצדיק כל מעבר' }

- id: MC-c0-passive-review
  title: קריאה חוזרת במקום בדיקה פעילה
  belief: >-
    הדרך ללמוד הוכחה או משפט היא לקרוא אותם שוב ושוב עד שהם נראים מובנים, או להציץ בפתרון מיד כשנתקעים.
  truth: >-
    תחושת "זה מובן" בזמן קריאה אינה הבנה. בודקים הבנה בפעולה: מנסחים את המטרה עם כמתים, בודקים את
    המשפט על דוגמה ועל דוגמה נגדית, ומנסים לבד זמן מה לפני שפותחים פתרון.
  remedy: { lesson: '0.1', label: 'לימוד עצמי: בדיקה פעילה' }

- id: MC-c0-mistake-is-noise
  title: טעות בשאלה היא רעש שעוברים הלאה ממנו
  belief: >-
    אם טעיתי בשאלה, כנראה זה מקרה; אפשר להמשיך לשאלה הבאה בלי לקרוא את המשוב.
  truth: >-
    טעות שסומנה "בטוח" היא הסימן החזק ביותר לתפיסה שגויה. קוראים את המשוב, חוזרים לשיעור שהוא מפנה
    אליו, וחוזרים לשאלות על אותו נושא אחרי יום או יומיים.
  remedy: { lesson: '0.1', label: 'לימוד עצמי: מה עושים עם טעות' }

- id: MC-c0-converse-equivalent
  title: מוכיחים את הטענה ההפוכה במקום הטענה עצמה
  belief: >-
    "אם $P$ אז $Q$" ו"אם $Q$ אז $P$" אומרות אותו דבר, ולכן מותר להוכיח את הקלה מהשתיים.
  truth: >-
    הטענה ההפוכה היא טענה אחרת, ולעתים קרובות שקרית: $|a_n|\to|a|$ אינו גורר $a_n\to a$, כפי שמראה
    $a_n=(-1)^n$. מה שכן שקול לטענה הוא השלילה ההפוכה (קונטרפוזיציה).
  remedy: { lesson: '0.1', label: 'קוראים טענה: כיוון הגרירה' }

- id: MC-c0-probe-proves
  title: חישוב של כמה איברים במקום הוכחה
  belief: >-
    אם מחשבים כמה איברים של סדרה (או כמה ערכים של פונקציה), האחרון שחושב הוא הגבול או הסופרמום.
  truth: >-
    חישוב מספרי נותן ראיה ורמז, לא הוכחה ולא ערך מדויק. גבול, סופרמום וגבול עליון נקבעים בטיעון שעובד לכל
    $n$, לא בערכים שבמקרה חושבו.
  remedy: { lesson: '0.1', label: 'חישוב מספרי הוא רמז, לא הוכחה' }
