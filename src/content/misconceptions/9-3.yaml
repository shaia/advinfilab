# Misconceptions first detected in lesson 9.3 (oscillation and Lebesgue's theorem on integrability).
- id: MC-c9-oscillation-ignores-value
  title: מחשבים את התנודה בלי הערך בנקודה עצמה
  belief: >-
    התנודה $o(f,a)$ נקבעת רק לפי ערכי $f$ בנקודות הקרובות ל-$a$ ושונות ממנה (למשל לפי הגבולות החד-צדדיים), והערך
    $f(a)$ אינו משנה אותה.
  truth: >-
    $o(f,a)=\lim_{\delta\to0}\bigl(\sup_{B(a,\delta)}f-\inf_{B(a,\delta)}f\bigr)$, והכדור מכיל את $a$. לכן
    $f(a)$ משתתף בסופרמום ובאינפימום: פונקציה ששווה ל-0 מחוץ ל-$a$ ול-1 ב-$a$ אינה רציפה ב-$a$, ו-$o(f,a)=1$.
  remedy: { lesson: '9.3', label: 'התנודה: הכדור כולל את הנקודה' }

- id: MC-c9-integrable-finite-discontinuities
  title: חושבים שפונקציה אינטגרבילית רציפה פרט למספר סופי (או בן מנייה) של נקודות
  belief: >-
    לפונקציה אינטגרבילית יש רק מספר סופי, או לכל היותר בן מנייה, של נקודות אי-רציפות.
  truth: >-
    משפט לבג דורש רק שקבוצת נקודות האי-רציפות תהיה ממידה אפס. הפונקציה המציינת של
    $\{(x,y)\in[0,1]^2: y\le x^2\}$ אינה רציפה על קשת שלמה של הפרבולה (קבוצה לא בת מנייה) ואינטגרבילית, וכך גם
    הפונקציה המציינת של $C\times[0,1]$ עם $C$ קבוצת קנטור.
  remedy: { lesson: '9.3', label: 'משפט לבג: מידה אפס, לא מספר סופי' }

- id: MC-c9-lebesgue-unbounded
  title: מפעילים את משפט לבג על פונקציה לא חסומה
  belief: >-
    פונקציה שאינה רציפה רק בנקודה אחת אינטגרבילית, גם אם היא שואפת לאינסוף ליד הנקודה הזו.
  truth: >-
    משפט לבג עוסק בפונקציות **חסומות**. $f(x,y)=\frac{1}{x^2+y^2}$ (ו-$f(0,0)=0$) רציפה פרט לראשית, אבל אינה
    חסומה על $[0,1]^2$, ולכן אינה אינטגרבילית לפי רימן: אין לה סכום עליון.
  remedy: { lesson: '9.3', label: 'משפט לבג: ההנחה שהפונקציה חסומה' }

- id: MC-c9-change-countable-points
  title: חושבים ששינוי של פונקציה במספר בן מנייה של נקודות אינו משנה אינטגרביליות
  belief: >-
    אם $f$ אינטגרבילית ו-$g$ שווה ל-$f$ פרט לקבוצה בת מנייה (שהיא ממידה אפס), אז $g$ אינטגרבילית ועם אותו אינטגרל.
  truth: >-
    שינוי במספר **סופי** של נקודות אכן אינו משנה דבר. אבל $0$ ו-$\chi_{\mathbb{Q}^2\cap[0,1]^2}$ שונות רק על קבוצה
    בת מנייה, והשנייה אינה רציפה באף נקודה, ולכן אינה אינטגרבילית. מה שקובע הוא קבוצת נקודות האי-רציפות של $g$,
    לא הקבוצה שבה $g\ne f$.
  remedy: { lesson: '9.3', label: 'שינוי על קבוצה צפופה בת מנייה' }

- id: MC-c9-abs-integrable-implies
  title: מסיקים מאינטגרביליות של הערך המוחלט את האינטגרביליות של הפונקציה
  belief: >-
    אם $|f|$ אינטגרבילית, גם $f$ אינטגרבילית.
  truth: >-
    הכיוון הנכון הפוך: אם $f$ אינטגרבילית אז $|f|$ אינטגרבילית, כי כל נקודת רציפות של $f$ היא נקודת רציפות של
    $|f|$. הפונקציה ששווה ל-1 בנקודות הרציונליות ול-$-1$ בשאר אינה רציפה באף נקודה, ובכל זאת $|f|\equiv1$.
  remedy: { lesson: '9.3', label: 'ערך מוחלט ומשפט לבג' }

- id: MC-c9-discontinuities-only-special-points
  title: מניחים שנקודות האי-רציפות הן רק הנקודות שבהן מוגדר "המקרה המיוחד"
  belief: >-
    פונקציה שמוגדרת $1$ על קבוצה $A$ ו-$0$ מחוצה לה אינה רציפה רק בנקודות של $A$.
  truth: >-
    הפונקציה המציינת $\chi_A$ אינה רציפה בדיוק בנקודות השפה $\partial A$, וזה כולל נקודות שאינן ב-$A$. לקבוצת
    הנקודות הרציונליות על האלכסון, כל נקודה של האלכסון (גם אי-רציונלית) היא נקודת אי-רציפות.
  remedy: { lesson: '9.3', label: 'נקודות האי-רציפות של פונקציה מציינת' }

- id: MC-c9-dense-discontinuities-not-integrable
  title: חושבים שפונקציה שנקודות האי-רציפות שלה צפופות אינה אינטגרבילית
  belief: >-
    אם נקודות האי-רציפות של $f$ צפופות בתיבה, $f$ "קופצת בכל מקום" ואינה אינטגרבילית.
  truth: >-
    מה שקובע הוא המידה של קבוצת האי-רציפות, לא הצפיפות שלה. הפונקציה $f(x,y)=t(x)$, עם $t$ פונקציית רימן
    ($t(\frac pq)=\frac1q$, ו-0 באי-רציונליים), אינה רציפה על $(\mathbb{Q}\cap[0,1])\times[0,1]$, קבוצה צפופה ממידה
    אפס, ולכן היא אינטגרבילית ו-$\int f=0$.
  remedy: { lesson: '9.3', label: 'פונקציית רימן בשני משתנים' }

- id: MC-c9-zero-integral-zero-function
  title: חושבים שפונקציה אי-שלילית עם אינטגרל אפס מתאפסת בכל נקודה
  belief: >-
    אם $f\ge0$ אינטגרבילית על $Q$ ו-$\int_Q f=0$, אז $f(x)=0$ לכל $x\in Q$.
  truth: >-
    הפונקציה ששווה 1 בנקודה אחת ו-0 בשאר היא אי-שלילית עם אינטגרל 0. מה שנכון: $f(a)=0$ בכל נקודת רציפות $a$ (אחרת
    $f>\frac{f(a)}{2}$ על תיבה קטנה סביב $a$ והאינטגרל חיובי), ולכן לפי משפט לבג $f=0$ פרט לקבוצה ממידה אפס.
  remedy: { lesson: '9.3', label: 'אינטגרל אפס ונקודות הרציפות' }
