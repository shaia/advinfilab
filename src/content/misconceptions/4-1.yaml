# Misconceptions first detected in lesson 4.1 (the space C(K) and the sup norm).
- id: MC-c4-noncompact-domain
  title: מעבירים את תכונות C(K) לתחום שאינו קומפקטי
  belief: >-
    כל פונקציה רציפה חסומה ומקבלת מקסימום, וכל מה שנכון במרחב הפונקציות הרציפות על קטע סגור נכון גם על
    קטע פתוח, על הישר או על מרחב בדיד אינסופי.
  truth: >-
    הסופרמום של $|f|$ סופי ומתקבל כי $K$ קומפקטי (שיעור 3.4). על $(0,1]$ הפונקציה $\frac1x$ רציפה ולא חסומה, ועל
    $\mathbb{N}$ במטריקה הבדידה $f(n)=n$ רציפה ולא חסומה. גם הפתיחות של $\{f:\ f>0\}$ נשענת על כך שהמינימום מתקבל.
  remedy: { lesson: '4.1', anchor: 'definition', label: 'למה הסופרמום מתקבל: הקומפקטיות של K' }

- id: MC-c4-sup-vs-integral-norm
  title: מחשבים נורמה אחרת, למשל נורמת האינטגרל, במקום נורמת הסופרמום
  belief: >-
    המרחק בין שתי פונקציות רציפות הוא השטח שבין הגרפים; או, על קבוצה סופית, שורש סכום הריבועים של ההפרשים.
  truth: >-
    במרחב $C(K)$ המרחק הוא $\|f-g\|_\infty=\max_{x\in K}|f(x)-g(x)|$, הפער הגדול ביותר בנקודה אחת. השטח
    $\int_a^b|f-g|$ הוא נורמה אחרת, $\|f-g\|_1$, ותמיד $\|h\|_1\le (b-a)\|h\|_\infty$. ועל קבוצה סופית
    $K=\{x_1,\dots,x_k\}$, $C(K)$ הוא $\mathbb{R}^k$ עם $\|\cdot\|_\infty$, לא עם $\|\cdot\|_2$.
  remedy: { lesson: '4.1', anchor: 'complete', label: 'נורמת הסופרמום לעומת נורמת האינטגרל' }

- id: MC-c4-max-at-endpoints
  title: מחפשים את המקסימום של הערך המוחלט רק בקצות הקטע
  belief: >-
    כדי לחשב $\max|f|$ על $[a,b]$ מספיק להציב את $a$ ואת $b$.
  truth: >-
    המקסימום יכול להתקבל בנקודה פנימית, ואז הנגזרת מתאפסת בה. בודקים את הקצוות **וגם** את הנקודות הקריטיות:
    $x-x^2$ מתאפסת בשני הקצוות ומגיעה ל-$\frac14$ ב-$x=\frac12$.
  remedy: { lesson: '4.1', anchor: 'ex-4-1-1', label: 'חישוב נורמת הסופרמום' }

- id: MC-c4-continuity-needs-interval
  title: חושבים שרציפות ו-C(K) מוגדרות רק על קטעים
  belief: >-
    פונקציה על קבוצה סופית או על מרחב בדיד אינה רציפה (אין לה "גרף רציף"), ולכן $C(K)$ מוגדר רק כש-$K$ קטע.
  truth: >-
    רציפות מוגדרת בכל מרחב מטרי. במרחב בדיד כל פונקציה רציפה (קחו $\delta=1$). לכן כש-$K=\{1,\dots,n\}$,
    $C(K)$ הוא כל הפונקציות על $K$, כלומר $\mathbb{R}^n$ עם $\|\cdot\|_\infty$.
  remedy: { lesson: '4.1', anchor: 'test-spaces', label: 'שלושת מרחבי המבחן של C(K)' }

- id: MC-c4-pointwise-is-ck-convergence
  title: מזהים התכנסות נקודתית עם התכנסות במרחב C(K)
  belief: >-
    אם $f_n(x)\to f(x)$ לכל $x$, ו-$f$ רציפה, אז $f_n\to f$ במרחב $C(K)$.
  truth: >-
    התכנסות ב-$C(K)$ פירושה $\|f_n-f\|_\infty\to0$, כלומר התכנסות במידה שווה. "אוהל" ברוחב $\frac2n$ ובגובה 1
    שואף לאפס בכל נקודה, ובכל זאת נורמת הסופרמום שלו היא 1 לכל $n$.
  remedy: { lesson: '4.1', anchor: 'convergence', label: 'התכנסות ב-C(K) היא התכנסות במידה שווה' }

- id: MC-c4-ck-not-complete
  title: חושבים ש-C(K) אינו שלם כי גבול של פונקציות רציפות יכול להיות לא רציף
  belief: >-
    $x^n$ רציפות ו"מתכנסות" לפונקציה לא רציפה, ולכן $C[0,1]$ אינו מרחב שלם.
  truth: >-
    $x^n$ אינה סדרת קושי בנורמת הסופרמום: $\|x^n-x^{2n}\|_\infty=\frac14$. כל סדרת קושי ב-$C(K)$ מתכנסת במידה
    שווה, וגבול במידה שווה של פונקציות רציפות רציף (למה 2.2.5), ולכן $C(K)$ שלם.
  remedy: { lesson: '4.1', anchor: 'complete', label: 'השלמות של C(K)' }

- id: MC-c4-limit-keeps-strict
  title: חושבים שאי-שוויון חזק נשמר בגבול
  belief: >-
    אם $f_n(x)>0$ לכל $x$ ו-$f_n\to f$ במידה שווה, אז גם $f(x)>0$, ולכן $\{f:\ f>0\}$ סגורה.
  truth: >-
    בגבול נשמר רק אי-שוויון חלש: $f_n=\frac1n$ חיוביות ושואפות לפונקציית האפס. הקבוצה $\{f:\ f\ge0\}$ סגורה,
    והקבוצה $\{f:\ f>0\}$ פתוחה ואינה סגורה.
  remedy: { lesson: '4.1', anchor: 'evaluation', label: 'קבוצות סגורות ב-C(K): אי-שוויון חלש' }

- id: MC-c4-pointwise-open-intersection
  title: חושבים שתנאי פתוח בכל נקודה נותן קבוצה פתוחה
  belief: >-
    לכל $x$ הקבוצה $\{f:\ f(x)>0\}$ פתוחה, ולכן גם החיתוך שלהן על כל $x$, $\{f:\ f>0\}$, פתוח בכל מרחב פונקציות.
  truth: >-
    חיתוך אינסופי של פתוחות אינו בהכרח פתוח (שיעור 1.3). ב-$C(K)$ הקבוצה אכן פתוחה, אבל מסיבה אחרת: המינימום
    $m>0$ מתקבל, והכדור $B(f,m)$ בתוכה. בפונקציות רציפות חסומות על $(0,1]$ אין מינימום כזה ל-$f(x)=x$, והקבוצה
    אינה פתוחה.
  remedy: { lesson: '4.1', anchor: 'positive-open', label: 'למה הפונקציות החיוביות פתוחות ב-C(K)' }

- id: MC-c4-not-closed-means-open
  title: חושבים שקבוצה שאינה סגורה היא פתוחה
  belief: >-
    כל קבוצה היא פתוחה או סגורה, ולכן אם הפולינומים אינם סגורים ב-$C[0,1]$ הם פתוחים.
  truth: >-
    "פתוחה" ו"סגורה" אינן הפכים. קבוצה עם פנים ריק שאינה סגורה (כמו הפולינומים, או $\mathbb{Q}$ בישר) אינה פתוחה
    ואינה סגורה. כדי להראות שקבוצה אינה פתוחה מוצאים נקודה שכל כדור סביבה יוצא מהקבוצה.
  remedy: { lesson: '4.1', anchor: 'polynomials', label: 'פתוחה, סגורה, שתיהן או אף אחת' }

- id: MC-c4-closed-bounded-compact
  title: חושבים שבמרחב C(K) קבוצה סגורה וחסומה קומפקטית
  belief: >-
    כמו במרחב האוקלידי, כדור היחידה הסגור של $C[0,1]$ קומפקטי כי הוא סגור וחסום.
  truth: >-
    היינה-בורל הוא משפט על המרחב האוקלידי. ב-$C[0,1]$ יש בכדור היחידה סדרת "אוהלים" על קטעים שנפגשים לכל היותר
    בקצה, שהמרחק בין כל שניים מהם 1, ולכן אין לה תת-סדרה מתכנסת. מה שחסר הוא שליטה משותפת בתלילות של הפונקציות:
    האוהלים תלולים כרצוננו (רציפות במידה אחידה, שיעור 4.2; משפט ארצלה-אסקולי, שיעור 4.3, העשרה).
  remedy: { lesson: '4.1', anchor: 'bounded', label: 'כדור היחידה של C[0,1] אינו קומפקטי' }

- id: MC-c4-compactness-makes-complete
  title: חושבים שהשלמות של C(K) באה מהקומפקטיות של K
  belief: >-
    בהוכחה ש-$C(K)$ שלם הקומפקטיות של $K$ היא שנותנת $N$ אחד לכל $x$, או שמראה שהגבול רציף.
  truth: >-
    השלמות באה מהשלמות של $\mathbb{R}$ ומנורמת הסופרמום: תנאי קושי בנורמה כבר אחיד ב-$x$, והרציפות של הגבול היא
    טיעון $\frac\varepsilon3$ שעובד בכל מרחב מטרי (למה 2.2.5). הקומפקטיות דרושה רק כדי שכל פונקציה רציפה תהיה חסומה
    ו-$\max|f|$ יתקבל; בלעדיה $C_b(X)$ שלם באותה הוכחה (מסקנה 2.2.6).
  remedy: { lesson: '4.1', anchor: 'complete', label: 'השלמות של C(K)' }
