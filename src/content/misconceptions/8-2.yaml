# Misconceptions first detected in lesson 8.2 (curves and arc length).
- id: MC-c8-c1-means-smooth-image
  title: חושבים שמסילה גזירה ברציפות היא מסילה חלקה, שתמונתה בלי פינות
  belief: >-
    אם $\gamma$ גזירה ברציפות, התמונה שלה היא עקומה "חלקה", בלי פינות וחודים, ובכל נקודה יש לה כיוון משיק.
  truth: >-
    מסילה חלקה היא מסילה גזירה ברציפות עם $\gamma'(t)\ne0$ לכל $t$. בלי התנאי הזה התמונה יכולה לשבור כיוון:
    $(t^2,t^3)$ יוצרת חוד ו-$(t^3,|t|^3)$ יוצרת פינה, שתיהן גזירות ברציפות עם $\gamma'(0)=0$.
  remedy: { lesson: '8.2', label: 'מסילה גזירה לעומת מסילה חלקה' }

- id: MC-c8-curve-is-image
  title: מזהים את המסילה עם התמונה שלה
  belief: >-
    מסילה היא קבוצה של נקודות במרחב: מעגל שעוברים עליו פעמיים הוא "אותה מסילה" כמו מעגל שעוברים עליו פעם אחת.
  truth: >-
    מסילה היא **פונקציה** רציפה $\gamma:[a,b]\to\mathbb{R}^n$. האורך, האינטגרל הקווי ומספר הליפוף תלויים בה, לא
    רק בתמונה: המעגל שעוברים עליו פעמיים אורכו $4\pi$, ומספר הליפוף שלו סביב מרכזו 2.
  remedy: { lesson: '8.2', label: 'מסילה היא פונקציה, לא קבוצה' }

- id: MC-c8-closed-simple-confusion
  title: מבלבלים בין מסילה סגורה למסילה פשוטה
  belief: >-
    מסילה סגורה היא מסילה שאינה חותכת את עצמה; או: מסילה שתמונתה נראית כמו לולאה היא סגורה.
  truth: >-
    סגורה: $\gamma(a)=\gamma(b)$. פשוטה: $\gamma$ חד-חד-ערכית (ולמסילה סגורה פשוטה: חד-חד-ערכית ב-$[a,b)$). אלה
    תנאים בלתי תלויים: הלמניסקטה ("שמונה") סגורה ואינה פשוטה, וחצי מעגל פשוט ואינו סגור.
  remedy: { lesson: '8.2', label: 'מסילה פשוטה ומסילה סגורה' }

- id: MC-c8-continuous-implies-rectifiable
  title: חושבים שכל מסילה רציפה ברת-מדידה
  belief: >-
    התמונה של מסילה רציפה קומפקטית ולכן חסומה, ולכן גם אורך המסילה סופי.
  truth: >-
    קבוצה חסומה יכולה להכיל מסילה באורך אינסופי. $(t,t\sin\frac1t)$ על $[0,1]$ רציפה, והרכיב השני שלה אינו בעל
    השתנות חסומה, ולכן היא אינה ברת-מדידה.
  remedy: { lesson: '8.2', label: 'מסילה ברת-מדידה אם ורק אם רכיביה בעלי השתנות חסומה' }

- id: MC-c8-length-add-components
  title: מחברים את האורכים, או את ההשתנויות, של הרכיבים
  belief: >-
    אורך המסילה $(x(t),y(t))$ הוא סכום ה"אורכים" של הרכיבים: $V(x)+V(y)$, או $\int(|x'|+|y'|)\,dt$.
  truth: >-
    זה רק חסם מלעיל: $\|v\|_2\le|v_1|+|v_2|$. האורך האוקלידי הוא $\int_a^b\sqrt{x'^2+y'^2}\,dt$. הסכום
    $V(x)+V(y)$ הוא בדיוק האורך כשמודדים את הקו השבור בנורמה $\|\cdot\|_1$.
  remedy: { lesson: '8.2', label: 'אורך מסילה גזירה ברציפות כאינטגרל של גודל הנגזרת' }

- id: MC-c8-length-chord
  title: מחליפים את אורך המסילה באורך של מיתר או של היטל
  belief: >-
    אורך המסילה הוא המרחק בין נקודות הקצה, או האורך של ההיטל שלה על ציר או על מישור.
  truth: >-
    המיתר הוא האורך של קו שבור אחד, הגס ביותר, ולכן רק חסם מלרע; וגם ההיטל אינו ארוך מהמסילה. קשת אחת של
    ציקלואידה ברדיוס 1 מתקדמת $2\pi$ אופקית ואורכה 8.
  remedy: { lesson: '8.2', label: 'האורך כסופרמום של אורכי קווים שבורים' }

- id: MC-c8-length-norm-independent
  title: חושבים שהאורך אינו תלוי בנורמה שבה מודדים
  belief: >-
    אורך מסילה הוא מספר גאומטרי אחד, ויוצא אותו מספר בכל נורמה על המרחב.
  truth: >-
    האורך תלוי בנורמה: מעגל היחידה אורכו $2\pi$ בנורמה $\|\cdot\|_2$, $8$ בנורמה $\|\cdot\|_1$ ו-$4\sqrt2$
    בנורמה $\|\cdot\|_\infty$. מה שאינו תלוי בנורמה הוא **האם** האורך סופי, כי הנורמות על המרחב האוקלידי שקולות.
  remedy: { lesson: '8.2', label: 'אורך בנורמות שונות' }

- id: MC-c8-arclength-rename
  title: חושבים שמעבר לפרמטר אורך הקשת הוא החלפת שם של הפרמטר
  belief: >-
    כדי לעבור לפרמטר אורך הקשת מספיק לכתוב $s$ במקום $t$, או לחלק את המסילה כולה בקבוע.
  truth: >-
    מחשבים $s(t)=\int_a^t\|\gamma'(u)\|\,du$, הופכים ל-$t(s)$ ומציבים: $\tilde\gamma(s)=\gamma(t(s))$. הנקודות
    בתמונה לא משתנות, רק הקצב שבו עוברים עליהן, ו-$\|\tilde\gamma'(s)\|=1$. חלוקת המסילה בקבוע משנה את הצורה עצמה.
  remedy: { lesson: '8.2', label: 'פרמטר אורך הקשת' }
