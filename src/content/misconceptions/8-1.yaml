# Misconceptions first detected in lesson 8.1 (functions of bounded variation).
- id: MC-c8-variation-endpoints
  title: מחשבים את ההשתנות כהפרש הערכים בקצוות
  belief: >-
    ההשתנות של $f$ בקטע $[a,b]$ היא $|f(b)-f(a)|$: כמה הפונקציה "השתנתה" מההתחלה עד הסוף.
  truth: >-
    $|f(b)-f(a)|$ הוא סכום ההשתנות של החלוקה הטריוויאלית בלבד, ולכן רק חסם מלרע של $V_a^b(f)$. ההשתנות סופרת
    כל עלייה וכל ירידה: $V_0^{2\pi}(\sin)=4$, אף ש-$\sin 2\pi-\sin 0=0$.
  remedy: { lesson: '8.1', label: 'ההגדרה של ההשתנות: סופרמום על כל החלוקות' }

- id: MC-c8-variation-range
  title: מחשבים את ההשתנות כמקסימום פחות מינימום
  belief: >-
    ההשתנות היא $\max f-\min f$, הטווח של הפונקציה; או שהיא חסומה על ידי $2\sup|f|$.
  truth: >-
    הטווח נספר פעם אחת, וההשתנות סופרת כל מעבר הלוך וחזור: $\sin$ על $[0,2\pi]$ עולה ב-1, יורדת ב-2 ועולה שוב
    ב-1, ולכן $V=4$ ולא $2$. פונקציה חסומה יכולה להיות בעלת השתנות לא חסומה.
  remedy: { lesson: '8.1', label: 'השתנות של פונקציה מונוטונית למקוטעין' }

- id: MC-c8-variation-single-partition
  title: קובעים את ההשתנות לפי חלוקה אחת, או מחפשים חלוקה אחת עם סכום אינסופי
  belief: >-
    ההשתנות היא הסכום של חלוקה מסוימת (למשל החלוקה האחידה, או האינפימום על החלוקות); ו"השתנות לא חסומה" פירושה
    שיש חלוקה שהסכום שלה אינסופי.
  truth: >-
    כל חלוקה סופית נותנת סכום סופי. ההשתנות היא **הסופרמום** על כל החלוקות, והעידון רק מגדיל את הסכום (אי-שוויון
    המשולש). השתנות לא חסומה פירושה שלכל $M$ יש חלוקה שהסכום שלה גדול מ-$M$.
  remedy: { lesson: '8.1', label: 'סכומי השתנות ועידון חלוקה' }

- id: MC-c8-continuous-implies-bv
  title: חושבים שפונקציה רציפה, או חסומה, בקטע סגור היא בעלת השתנות חסומה
  belief: >-
    פונקציה רציפה בקטע סגור חסומה ורציפה במידה שווה, ולכן ההשתנות שלה סופית.
  truth: >-
    $x\sin\frac1x$ (עם $0$ ב-$0$) רציפה ב-$[0,1]$, אבל בנקודות $x_k=\frac{2}{(2k+1)\pi}$ היא מקבלת לסירוגין את
    הערכים $\pm x_k$, והסכום $\sum(x_k+x_{k+1})$ מתבדר כמו הטור ההרמוני. רציפות במידה שווה מקטינה כל מחובר, אבל
    לא את מספר המחוברים.
  remedy: { lesson: '8.1', label: 'פונקציה רציפה בעלת השתנות לא חסומה' }

- id: MC-c8-differentiable-implies-bv
  title: חושבים שפונקציה גזירה בכל נקודה היא בעלת השתנות חסומה
  belief: >-
    אם $f$ גזירה בכל נקודה של $[a,b]$, היא "חלקה" מספיק כדי שההשתנות שלה תהיה סופית.
  truth: >-
    מה שעובד הוא נגזרת **חסומה** (אז $f$ ליפשיצית). $x^2\sin\frac{1}{x^2}$ (עם $0$ ב-$0$) גזירה בכל נקודה של
    $[0,1]$, אבל הנגזרת לא חסומה ליד 0, וסכום הערכים $\frac{1}{\frac\pi2+k\pi}$ בשיאים מתבדר.
  remedy: { lesson: '8.1', label: 'ליפשיצית גוררת השתנות חסומה, גזירה לא' }

- id: MC-c8-bv-needs-lipschitz
  title: חושבים שהשתנות חסומה דורשת נגזרת חסומה
  belief: >-
    פונקציה בעלת השתנות חסומה חייבת להיות ליפשיצית; $\sqrt{x}$, שהנגזרת שלה לא חסומה ליד 0, אינה כזו.
  truth: >-
    ליפשיץ מספיקה ואינה הכרחית. כל פונקציה מונוטונית היא בעלת השתנות חסומה, $V_a^b(f)=|f(b)-f(a)|$, ולכן
    $V_0^1(\sqrt{x})=1$.
  remedy: { lesson: '8.1', label: 'פונקציה מונוטונית היא בעלת השתנות חסומה' }

- id: MC-c8-bv-means-bounded
  title: מבלבלים בין השתנות חסומה לבין פונקציה חסומה
  belief: >-
    "השתנות חסומה" פירושה ש-$f$ חסומה; ופונקציה שאינה בעלת השתנות חסומה היא פונקציה לא חסומה.
  truth: >-
    כל פונקציה בעלת השתנות חסומה חסומה ($|f(x)|\le|f(a)|+V_a^b(f)$), אבל לא להפך: $x\sin\frac1x$ ופונקציית
    דיריכלה חסומות ובעלות השתנות לא חסומה.
  remedy: { lesson: '8.1', label: 'ההגדרה ושלילתה' }

- id: MC-c8-bv-implies-continuous
  title: חושבים שפונקציה בעלת השתנות חסומה רציפה
  belief: >-
    השתנות חסומה היא סוג של רציפות, ולכן לפונקציה כזו אין קפיצות.
  truth: >-
    פונקציית מדרגה, כמו $\mathbf{1}_{[\frac12,1]}$, מונוטונית ולכן בעלת השתנות חסומה ($V=1$). קפיצה רק תורמת את
    גודלה להשתנות. מה שנכון הוא שיש לכל היותר מנייה של נקודות אי-רציפות.
  remedy: { lesson: '8.1', label: 'קפיצות ופירוק ז׳ורדן' }

- id: MC-c8-bv-finitely-many-jumps
  title: חושבים שלפונקציה בעלת השתנות חסומה יש רק מספר סופי של קפיצות
  belief: >-
    כל קפיצה מוסיפה את גודלה להשתנות, וההשתנות סופית, ולכן יש רק מספר סופי של קפיצות.
  truth: >-
    סכום גודלי הקפיצות סופי, אבל אינסוף מספרים חיוביים יכולים להיות בעלי סכום סופי. הפונקציה העולה
    $\sum_{n\ge1}2^{-n}\mathbf{1}_{[\frac1n,1]}$ קופצת בכל נקודה $\frac1n$ ($n\ge2$), וההשתנות שלה $\sum 2^{-n}=1$.
  remedy: { lesson: '8.1', label: 'קפיצות ופירוק ז׳ורדן' }

- id: MC-c8-jordan-positive-part
  title: חושבים שהחלק החיובי והחלק השלילי נותנים את פירוק ז׳ורדן
  belief: >-
    את $f$ בעלת השתנות חסומה כותבים כהפרש של שתי פונקציות עולות בעזרת $f=\max(f,0)-\max(-f,0)$.
  truth: >-
    $\max(f,0)$ אינה עולה בדרך כלל: ל-$f=\sin$ היא עולה ויורדת. הפירוק הנכון הוא
    $f=V_a^x(f)-\left(V_a^x(f)-f(x)\right)$, ושני המחוברים עולים כי $|f(y)-f(x)|\le V_x^y(f)$.
  remedy: { lesson: '8.1', label: 'פירוק ז׳ורדן' }
