# Workbook of lesson 5.1 — functions of several variables: limits and continuity.
# Objectives (src/course.ts):
#   OBJ-5.1-1  describe a function between Euclidean spaces by components, graph and level curves
#   OBJ-5.1-2  prove that a limit does not exist with two paths; limits along every line are not enough
#   OBJ-5.1-3  prove that a limit exists by a bound, e.g. in polar coordinates
# Results cited by the numbers of the chapter-5 spine (5.1.m) and of chapters 1–3. Every number recomputed with
# npx tsx (path values at small t, the closed forms (x−1)²/(x²−3x+3) and ρ²/8 − ρ⁶/384, 0.02·ln 0.02).
lesson: '5.1'
practice:
  - id: W-5.1-01
    level: basic
    objectives: [OBJ-5.1-1]
    prompt: >-
      תארו את כל קבוצות הגובה של כל אחת מהפונקציות, לכל ערך $c\in\mathbb{R}$.

      (א) $f(x,y)=y-x^2$ על $\mathbb{R}^2$.

      (ב) $g(x,y)=\max(|x|,|y|)$ על $\mathbb{R}^2$.

      (ג) $h(x,y,z)=x^2+y^2+z^2$ על $\mathbb{R}^3$.
    answer: >-
      (א) הפרבולה $y=x^2+c$, לכל $c$. (ב) ל-$c>0$ השפה של הריבוע $[-c,c]^2$; ל-$c=0$ הראשית; ל-$c<0$ ריקה. (ג) ל-$c>0$
      הספרה ברדיוס $\sqrt c$; ל-$c=0$ הראשית; ל-$c<0$ ריקה.
    solution:
      - kind: idea
        text: >-
          קבוצת גובה היא קבוצת הפתרונות של המשוואה $f=c$ בתחום (הגדרה 5.1.1). פותרים לכל $c$, ומפרידים בין ערכים
          שהפונקציה אינה מקבלת, ערך הקיצון שלה, ושאר הערכים.
      - kind: step
        text: >-
          (א) $y-x^2=c$ אם ורק אם $y=x^2+c$. לכל $c$ זו פרבולה, ההזזה של $y=x^2$ ב-$c$ כלפי מעלה. אף קבוצת גובה אינה
          ריקה, כי $f$ מקבלת כל ערך ממשי (למשל $f(0,c)=c$).
      - kind: step
        text: >-
          (ב) $g=\|(x,y)\|_\infty\ge0$, ולכן $L_c(g)=\emptyset$ ל-$c<0$, ו-$L_0(g)=\{(0,0)\}$ (נורמה מתאפסת רק באפס).
          ל-$c>0$, $L_c(g)$ היא הספרה $S(0,c)$ של $d_\infty$: הנקודות עם $\max(|x|,|y|)=c$, כלומר השפה של הריבוע
          $[-c,c]^2$ (ארבע הצלעות, כולל הקודקודים).
      - kind: step
        text: >-
          (ג) $h=\|(x,y,z)\|_2^2\ge0$: ל-$c<0$ ריקה, ל-$c=0$ הראשית, ול-$c>0$ הספרה ברדיוס $\sqrt c$ סביב הראשית
          ב-$\mathbb{R}^3$. אלה משטחי גובה.
      - kind: check
        text: >-
          לפי טענה 5.1.2(א), בכל סעיף קבוצות הגובה זרות ומכסות את התחום: כל נקודה $(x,y)$ נמצאת על הפרבולה
          $L_{y-x^2}(f)$, ועל השפה של ריבוע אחד בדיוק, זה שגודלו $\max(|x|,|y|)$.
      - kind: result
        text: >-
          (א) פרבולות $y=x^2+c$; (ב) שפות של ריבועים, נקודה, ריקה; (ג) ספרות, נקודה, ריקה.

  - id: W-5.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-5.1-1]
    prompt: >-
      נכון או לא נכון? הוכיחו או תנו דוגמה נגדית.

      (א) אם $f:\mathbb{R}^2\to\mathbb{R}$ רציפה, הגרף שלה $\Gamma_f$ הוא קבוצה סגורה ב-$\mathbb{R}^3$.

      (ב) לפונקציה $f:\mathbb{R}^2\to\mathbb{R}$ יכולים להיות שני קווי גובה שונים שנחתכים בנקודה.

      (ג) אם $(X,d_0)$ מרחב מטרי עם המטריקה הבדידה, $a\in X$ ו-$f:X\to\mathbb{R}$, אז $\lim_{x\to a}f(x)$ אינו מוגדר.
    answer: >-
      (א) נכון. (ב) לא נכון. (ג) נכון: $a$ אינה נקודת הצטברות של $X$.
    solution:
      - kind: idea
        text: >-
          (א) נקודה שהיא גבול של נקודות על הגרף נמצאת על הגרף, כי $f$ רציפה. (ב) פונקציה מקבלת ערך אחד בכל נקודה.
          (ג) הגדרה 5.1.3 דורשת נקודת הצטברות.
      - kind: step
        text: >-
          (א) לפי מסקנה 1.5.8(ב) מספיק להראות: אם $(x_k,y_k,z_k)\in\Gamma_f$ ו-$(x_k,y_k,z_k)\to(x,y,z)$, אז
          $(x,y,z)\in\Gamma_f$. לפי משפט 1.5.9, $(x_k,y_k)\to(x,y)$ ו-$z_k\to z$.
      - kind: step
        text: >-
          $z_k=f(x_k,y_k)$, ו-$f$ רציפה ב-$(x,y)$; לפי משפט 1.6.3, $f(x_k,y_k)\to f(x,y)$. הגבול של סדרה ממשית יחיד,
          ולכן $z=f(x,y)$, כלומר $(x,y,z)\in\Gamma_f$.
      - kind: step
        text: >-
          (ב) אילו $p\in L_c(f)\cap L_{c'}(f)$ עם $c\ne c'$, היה $c=f(p)=c'$. זו טענה 5.1.2(א): קווי גובה של ערכים
          שונים זרים.
      - kind: step
        text: >-
          (ג) $B(a,1)=\{a\}$ במטריקה הבדידה, ולכן הכדור הזה אינו מכיל נקודה של $X$ ששונה מ-$a$: $a\notin X'$. הגדרה
          5.1.3 מוגדרת רק בנקודות הצטברות של התחום. (ולפי טענה 5.1.4(ג), $f$ רציפה ב-$a$, כמו שאמרה כבר טענה
          1.6.10(א).)
      - kind: check
        text: >-
          ב-(א) הרציפות נחוצה: עבור $f=0$ ל-$x\le0$ ו-$f=1$ ל-$x>0$, הנקודות $(\frac1k,0,1)\in\Gamma_f$ שואפות
          ל-$(0,0,1)$, ו-$(0,0,1)\notin\Gamma_f$ כי $f(0,0)=0$: הגרף אינו סגור.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון; (ג) נכון.

  - id: W-5.1-03
    level: basic
    objectives: [OBJ-5.1-2]
    prompt: >-
      תהי $f(x,y,z)=\frac{xy+yz+zx}{x^2+y^2+z^2}$ על $\mathbb{R}^3\setminus\{0\}$. חשבו את הגבול של $f$ לאורך הישרים
      $(t,t,t)$, $(t,0,0)$ ו-$(t,-t,0)$ כש-$t\to0^+$, והכריעו אם ל-$f$ יש גבול בראשית.
    answer: >-
      $1$, $0$ ו-$-\frac12$. אין גבול.
    solution:
      - kind: idea
        text: >-
          המונה והמכנה מאותו סדר, $\rho^2$, ולכן על כל ישר דרך הראשית $f$ קבועה, אבל הקבוע תלוי בישר. שני ישרים עם
          קבועים שונים מספיקים (מסקנה 5.1.7).
      - kind: computation
        text: >-
          $f(t,t,t)=\frac{3t^2}{3t^2}=1$; $f(t,0,0)=\frac0{t^2}=0$; $f(t,-t,0)=\frac{-t^2}{2t^2}=-\frac12$, לכל $t\ne0$.
      - kind: theorem
        text: >-
          לפי מסקנה 5.1.7, אילו היה ל-$f$ גבול $L$ בראשית, הוא היה הגבול לאורך כל אחת משלוש המסילות, כלומר $1=0$.
          סתירה.
      - kind: check
        text: >-
          בבדיקה מספרית ב-$t=0.1$ מתקבלים בדיוק $1$, $0$ ו-$-0.5$. ומאיפה הישר $(t,-t,0)$: מחפשים כיוון שבו המונה
          שלילי; ($(t,t,-t)$ נותן $-\frac13$.)
      - kind: result
        text: >-
          הגבולות לאורך הישרים $1$, $0$, $-\frac12$; ל-$f$ אין גבול בראשית.

  - id: W-5.1-04
    level: mid
    objectives: [OBJ-5.1-3]
    prompt: >-
      הוכחו:

      (א) $\lim_{(x,y)\to(0,0)}\frac{xy}{\sqrt{x^2+y^2}}=0$.

      (ב) $\lim_{(x,y)\to(0,0)}(x^2+y^2)\ln(x^2+y^2)=0$.
    answer: >-
      (א) $\big|\frac{xy}{\sqrt{x^2+y^2}}\big|\le\frac\rho2$. (ב) הרכבה של $u=x^2+y^2\to0^+$ עם $k(u)=u\ln u$, $k(0)=0$,
      שרציפה ב-0 על $[0,\infty)$.
    solution:
      - kind: idea
        text: >-
          (א) חסם שתלוי רק ב-$\rho=\|(x,y)\|_2$ (טענה 5.1.9(א)). (ב) הביטוי הוא פונקציה של משתנה אחד, $u=x^2+y^2$:
          מעבירים את השאלה לאינפי 1 בעזרת הרכבה (טענה 5.1.5(ג)).
      - kind: step
        text: >-
          (א) לפי $(|x|-|y|)^2\ge0$, $|xy|\le\frac12(x^2+y^2)=\frac{\rho^2}2$. לכן לכל $(x,y)\ne(0,0)$:
          $\Big|\frac{xy}{\sqrt{x^2+y^2}}\Big|\le\frac{\rho^2/2}{\rho}=\frac\rho2$.
      - kind: theorem
        text: >-
          $\varphi(\rho)=\frac\rho2\to0$, ולפי טענה 5.1.9(א) הגבול $0$.
      - kind: step
        text: >-
          (ב) נגדיר $k(u)=u\ln u$ ל-$u>0$ ו-$k(0)=0$. לפי אינפי 1 (למשל לופיטל על $\frac{\ln u}{1/u}$),
          $\lim_{u\to0^+}u\ln u=0$, ולכן $k$ רציפה ב-$0$ כפונקציה על $[0,\infty)$.
      - kind: step
        text: >-
          $p(x,y)=x^2+y^2$ פולינום עם $\lim_{(x,y)\to0}p=0$, וערכיו ב-$[0,\infty)$, התחום של $k$. מחוץ לראשית הפונקציה
          שלנו היא $k(p(x,y))$, ולפי טענה 5.1.5(ג) הגבול הוא $k(0)=0$.
      - kind: check
        text: >-
          ב-(א) החסם הדוק: על $y=x$ מתקבל בדיוק $\frac\rho2$ (ב-$(0.1,0.1)$ שניהם $0.070711$). ב-(ב), ב-$(0.1,0.1)$
          $u=0.02$ והערך $0.02\ln0.02\approx-0.0782$, קטן בערך מוחלט, כצפוי. שימו לב: ב-(ב) צריך את $k$ **רציפה** ב-$0$, ולכן
          הגדרנו $k(0)=0$.
      - kind: result
        text: >-
          שני הגבולות $0$.

  - id: W-5.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.1-2]
    prompt: >-
      סטודנט בדק את $f(x,y)=\frac{x^3y}{x^6+y^2}$ ליד הראשית. הוא הראה שהגבול לאורך כל ישר $y=mx$, לאורך הציר $x=0$
      ולאורך כל פרבולה $y=kx^2$ הוא $0$, והסיק ש-$\lim_{(x,y)\to(0,0)}f=0$. בדקו את החישובים שלו, ומצאו את הטעות
      במסקנה.
    answer: >-
      החישובים נכונים והמסקנה שגויה: על $y=x^3$, $f=\frac12$. אין גבול.
    solution:
      - kind: idea
        text: >-
          במכנה, $x^6$ ו-$y^2$ מאוזנים כש-$y\approx x^3$. על העקומים $y=kx^3$ הפונקציה קבועה.
      - kind: computation
        text: >-
          ישרים: ל-$m\ne0$ ו-$x\ne0$, $f(x,mx)=\frac{mx^4}{x^6+m^2x^2}=\frac{mx^2}{x^4+m^2}\to0$; על $y=0$ ועל $x=0$,
          $f=0$.
      - kind: computation
        text: >-
          פרבולות: ל-$k\ne0$, $f(x,kx^2)=\frac{kx^5}{x^6+k^2x^4}=\frac{kx}{x^2+k^2}\to0$.
      - kind: computation
        text: >-
          על $y=kx^3$: $f(x,kx^3)=\frac{kx^6}{x^6+k^2x^6}=\frac k{1+k^2}$, קבוע. ל-$k=1$, $f=\frac12$.
      - kind: theorem
        text: >-
          המסילות $(t,0)$ ו-$(t,t^3)$ נותנות $0$ ו-$\frac12$, ולפי מסקנה 5.1.7 אין גבול. הטעות: מסילות יכולות רק לשלול
          גבול; אף אוסף של מסילות, גם "כל הישרים וכל הפרבולות", אינו מוכיח קיום.
      - kind: check
        text: >-
          ב-$(0.01,\ 10^{-6})$, על $y=x^3$, הערך $0.5$ בדיוק; ועל $y=x$ ב-$x=0.001$ הערך כ-$10^{-6}$. קווי הגובה של $f$ הם
          העקומים $y=kx^3$.
      - kind: result
        text: >-
          הגבול אינו קיים; המסילה $y=x^3$ נותנת $\frac12$.

  - id: W-5.1-06
    level: mid
    objectives: [OBJ-5.1-1, OBJ-5.1-3]
    prompt: >-
      לכל אחת מהפונקציות $\mathbb{R}^2\to\mathbb{R}^2$ קבעו אם היא רציפה בראשית.

      (א) $F(x,y)=\Big(\frac{\sin(xy)}{\sqrt{x^2+y^2}},\ \frac{x^2-y^2}{x^2+y^2}\Big)$ ל-$(x,y)\ne(0,0)$, ו-$F(0,0)=(0,0)$.

      (ב) $G(x,y)=\Big(\frac{\sin(xy)}{\sqrt{x^2+y^2}},\ \cos(x+y)\Big)$ ל-$(x,y)\ne(0,0)$, ו-$G(0,0)=(0,1)$.
    answer: >-
      (א) לא: לרכיב השני אין גבול בראשית. (ב) כן: שני הרכיבים רציפים בראשית.
    solution:
      - kind: theorem
        text: >-
          לפי טענה 5.1.5(א), גבול של פונקציה וקטורית הוא גבול של כל רכיב; לכן (עם טענה 5.1.4(ג)) פונקציה וקטורית
          רציפה בנקודה אם ורק אם כל רכיב שלה רציף בה. בודקים רכיב רכיב.
      - kind: step
        text: >-
          הרכיב הראשון, המשותף: $|\sin u|\le|u|$ (אינפי 1) ו-$|xy|\le\frac{\rho^2}2$, ולכן
          $\Big|\frac{\sin(xy)}{\sqrt{x^2+y^2}}\Big|\le\frac{\rho^2/2}\rho=\frac\rho2\to0$. לפי טענה 5.1.9(א) הגבול
          $0$, והערך בראשית $0$: רציף.
      - kind: step
        text: >-
          (א) הרכיב השני הוא $\frac{x^2-y^2}{x^2+y^2}$: $1$ על ציר $x$ ו-$-1$ על ציר $y$, ולפי מסקנה 5.1.7 אין לו גבול
          בראשית. לכן ל-$F$ אין גבול שם, והיא אינה רציפה.
      - kind: step
        text: >-
          (ב) $\cos(x+y)$ היא הרכבה של פולינום עם $\cos$, רציפה (טענה 5.1.5(ד)), והערך בראשית $\cos0=1$ תואם את
          $G(0,0)=(0,1)$. שני הרכיבים רציפים בראשית, ולכן $G$ רציפה שם.
      - kind: check
        text: >-
          האם $F$ רציפה בראשית לפחות בכל **משתנה** בנפרד? לא: $F(x,0)=(0,1)$ ל-$x\ne0$, ו-$F(0,0)=(0,0)$. ו-$G(0,0)=(0,0)$ היה הורס את הרציפות של $G$: הגבול של הרכיב השני הוא $1$.
      - kind: result
        text: >-
          (א) לא רציפה; (ב) רציפה.

  - id: W-5.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-5.1-2]
    prompt: >-
      תהי $f(x,y)=\frac{x-y}{x+y}$ על הקבוצה $A=\{(x,y):\ x+y\ne0\}$.

      (א) סטודנטית טוענת שהשאלה "האם ל-$f$ יש גבול בראשית" חסרת משמעות, כי $f$ אינה מוגדרת על כל ישר $x+y=0$. האם
      היא צודקת?

      (ב) חשבו את שני הגבולות הנשנים בראשית, והסיקו בעזרת טענה 5.1.8(ד) שאין ל-$f$ גבול שם.
    answer: >-
      (א) לא: $(0,0)\in A'$. (ב) $\lim_{x\to0}\lim_{y\to0}f=1$ ו-$\lim_{y\to0}\lim_{x\to0}f=-1$; שונים, ולכן אין גבול.
    solution:
      - kind: definition
        text: >-
          הגבול מוגדר ב-$a\in A'$ (הגדרה 5.1.3): כל כדור סביב $a$ צריך לפגוש את $A$ בנקודה ששונה מ-$a$. התחום לא
          חייב להכיל סביבה מנוקבת.
      - kind: step
        text: >-
          (א) הנקודות $(\frac1k,0)$ שייכות ל-$A$, שונות מ-$(0,0)$ ושואפות אליה. לכן $(0,0)\in A'$, והשאלה מוגדרת היטב.
          היא לא צודקת.
      - kind: computation
        text: >-
          (ב) נקבע $x\ne0$. התחום של $y\mapsto f(x,y)$ הוא $\{y\ne-x\}$, ו-$0$ נקודת הצטברות שלו. שם המכנה ב-$y=0$
          הוא $x\ne0$, ולכן $\lim_{y\to0}f(x,y)=\frac xx=1$, ו-$\lim_{x\to0}1=1$.
      - kind: computation
        text: >-
          באותו אופן, לכל $y\ne0$: $\lim_{x\to0}f(x,y)=\frac{-y}y=-1$, ו-$\lim_{y\to0}(-1)=-1$.
      - kind: theorem
        text: >-
          אילו היה ל-$f$ גבול $L$ בראשית, לפי טענה 5.1.8(ד) (עם $r=1$, למשל) הגבול הנשנה הראשון היה $L$, ולפי אותה
          טענה עם תפקידי $x$ ו-$y$ מוחלפים גם השני. כלומר $1=L=-1$. סתירה.
      - kind: check
        text: >-
          הוכחה ישירה, למי שמעדיף מסילות: על $(t,0)$ הערך $1$, ועל $(0,t)$ הערך $-1$. ובבדיקה מספרית,
          $f(0.1,10^{-9})\approx1$ ו-$f(10^{-9},0.1)\approx-1$.
      - kind: result
        text: >-
          (א) לא, $(0,0)\in A'$; (ב) הגבולות הנשנים $1$ ו-$-1$, ולכן אין גבול.

  - id: W-5.1-08
    level: exam
    objectives: [OBJ-5.1-3]
    prompt: >-
      נגדיר $F(x,y)=\frac{1-\cos(xy)}{x^2+y^2}$ ל-$(x,y)\ne(0,0)$ ו-$F(0,0)=0$. נסמן $\rho=\|(x,y)\|_2$.

      (א) הוכיחו ש-$0\le F(x,y)\le\frac{\rho^2}8$, והסיקו ש-$F$ רציפה על כל $\mathbb{R}^2$.

      (ב) הוכיחו שהקבוע $\frac18$ אינו ניתן לשיפור: לכל $C<\frac18$ יש נקודות קרובות לראשית כרצוננו שבהן
      $F(x,y)>C\rho^2$.
    answer: >-
      (א) $0\le1-\cos u\le\frac{u^2}2$ ו-$x^2y^2\le\frac{\rho^4}4$. (ב) על $y=x$: $F\ge\frac{\rho^2}8-\frac{\rho^6}{384}$.
    solution:
      - kind: idea
        text: >-
          מחליפים את $1-\cos u$ בחסמים של משתנה אחד, $\frac{u^2}2-\frac{u^4}{24}\le1-\cos u\le\frac{u^2}2$, ומקבלים חסם
          שתלוי רק ב-$\rho$. בכיוון $\theta=\frac\pi4$ המכפלה $xy$ הגדולה ביותר, ושם החסם כמעט הדוק.
      - kind: step
        text: >-
          (א) **1.** לכל $u$: $1-\cos u\ge0$. ו-$q(u)=\frac{u^2}2-1+\cos u$ מקיימת $q(0)=0$ ו-$q'(u)=u-\sin u\ge0$
          ל-$u\ge0$; לכן $q\ge0$ על $[0,\infty)$, ו-$q$ זוגית: $1-\cos u\le\frac{u^2}2$ לכל $u$.
      - kind: step
        text: >-
          **2.** $|xy|\le\frac{\rho^2}2$ (מ-$(|x|-|y|)^2\ge0$), ולכן $(xy)^2\le\frac{\rho^4}4$ ו-
          $0\le F(x,y)\le\frac{(xy)^2/2}{\rho^2}\le\frac{\rho^4/8}{\rho^2}=\frac{\rho^2}8$.
      - kind: step
        text: >-
          **3.** לפי טענה 5.1.9(א), $\lim_{(x,y)\to0}F=0=F(0,0)$, ו-$F$ רציפה בראשית (טענה 5.1.4(ג)). מחוץ לראשית
          היא מנה של פונקציות רציפות עם מכנה חיובי (טענה 5.1.5(ב),(ד)).
      - kind: step
        text: >-
          (ב) **4.** לפי טיילור עם שארית לגרנז' (אינפי 1), $\cos u=1-\frac{u^2}2+\frac{\cos\xi}{24}u^4$ עבור $\xi$ בין
          $0$ ל-$u$, ולכן $1-\cos u\ge\frac{u^2}2-\frac{u^4}{24}$.
      - kind: computation
        text: >-
          **5.** על $y=x$ עם $\rho=\sqrt2|x|$: $xy=x^2=\frac{\rho^2}2$, ולכן
          $F\ge\frac{1}{\rho^2}\Big(\frac{\rho^4}8-\frac{\rho^8}{384}\Big)=\frac{\rho^2}8-\frac{\rho^6}{384}$.
      - kind: step
        text: >-
          **6.** יהי $C<\frac18$. $\frac{\rho^2}8-\frac{\rho^6}{384}>C\rho^2$ אם ורק אם $\rho^4<384\big(\frac18-C\big)$,
          וזה מתקיים לכל $\rho>0$ קטן מספיק. לכן הנקודות $(x,x)$ עם $x$ קטן מספיק מקיימות $F>C\rho^2$.
      - kind: check
        text: >-
          מספרית, ב-$\rho=0.5$ על $y=x$: $F\approx0.031209$, והחסמים $\frac{\rho^2}8=0.03125$ ו-$\frac{\rho^2}8-\frac{\rho^6}{384}\approx0.031209$.
          בבחינה, (א) לבדו מספיק להוכחת הרציפות: לא צריך את החסם הטוב ביותר.
      - kind: result
        text: >-
          (א) $0\le F\le\frac{\rho^2}8$, ו-$F$ רציפה על $\mathbb{R}^2$; (ב) על $y=x$, $F\ge\frac{\rho^2}8-\frac{\rho^6}{384}$, ולכן
          אין חסם $C\rho^2$ עם $C<\frac18$.

  - id: W-5.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-5.1-2]
    prompt: >-
      תהי $f:\mathbb{R}^2\setminus\{0\}\to\mathbb{R}$.

      (א) נניח ש-$f(tx,ty)=f(x,y)$ לכל $t>0$ ולכל $(x,y)\ne(0,0)$ ($f$ קבועה על כל קרן מהראשית). הוכיחו: ל-$f$ יש
      גבול בראשית אם ורק אם $f$ קבועה.

      (ב) הסיקו שלפונקציות $\frac{xy}{x^2+y^2}$ ו-$\frac{x^2-y^2}{x^2+y^2}$ אין גבול בראשית.

      (ג) נניח במקום זאת ש-$f(tx,t^2y)=f(x,y)$ לכל $t>0$. הוכיחו את אותה מסקנה, והסיקו שלפונקציה
      $\frac{x^2y}{x^4+y^2}$ אין גבול בראשית.
    answer: >-
      (א) המסילה $t\mapsto(tx,ty)$ נותנת $f(x,y)=L$ לכל נקודה. (ב) הפונקציות אינן קבועות. (ג) אותה הוכחה עם
      $t\mapsto(tx,t^2y)$; $\frac{x^2y}{x^4+y^2}$ היא $\frac12$ ב-$(1,1)$ ו-$0$ ב-$(1,0)$.
    solution:
      - kind: idea
        text: >-
          על כל מסילה $t\mapsto(tx,ty)$ הפונקציה קבועה, שווה ל-$f(x,y)$. אם יש גבול $L$, הגבול לאורך המסילה הזו, כלומר
          $f(x,y)$, חייב להיות $L$ (מסקנה 5.1.7).
      - kind: step
        text: >-
          (א) אם $f\equiv c$, הגבול $c$ (כל $\delta$ מתאים). להפך, נניח $\lim_{(x,y)\to0}f=L$, ותהי $(x,y)\ne(0,0)$.
          $\gamma(t)=(tx,ty)$ ל-$t\in(0,1)$ היא מסילה אל הראשית: $\gamma(t)\ne0$ ו-$\|\gamma(t)\|_2=t\|(x,y)\|_2\to0$.
      - kind: step
        text: >-
          לפי מסקנה 5.1.7, $f(\gamma(t))\to L$. אבל $f(\gamma(t))=f(x,y)$ לכל $t$, פונקציה קבועה של $t$, ולכן $f(x,y)=L$. זה לכל
          $(x,y)\ne(0,0)$: $f\equiv L$.
      - kind: step
        text: >-
          (ב) שתי הפונקציות מקיימות את ההנחה: מונה ומכנה הומוגניים מאותה מעלה, $t^2$ מצטמצם. $\frac{xy}{x^2+y^2}$ היא
          $0$ ב-$(1,0)$ ו-$\frac12$ ב-$(1,1)$, ו-$\frac{x^2-y^2}{x^2+y^2}$ היא $1$ ב-$(1,0)$ ו-$-1$ ב-$(0,1)$: לא קבועות.
          לפי (א) אין להן גבול.
      - kind: step
        text: >-
          (ג) אותה הוכחה עם $\gamma(t)=(tx,t^2y)$ ל-$t\in(0,1)$: $\gamma(t)\ne0$ (כי $(x,y)\ne0$), ו-
          $\|\gamma(t)\|_2\le t\,\|(x,y)\|_2\to0$ (כי $t^2\le t$). $g(x,y)=\frac{x^2y}{x^4+y^2}$ מקיימת
          $g(tx,t^2y)=\frac{t^4x^2y}{t^4(x^4+y^2)}=g(x,y)$, ו-$g(1,1)=\frac12\ne0=g(1,0)$.
      - kind: check
        text: >-
          (ג) מסביר את טענה 5.1.8(ב): קווי הגובה של $g$ הם הפרבולות $y=kx^2$, והמסילות $(tx,t^2y)$ הן בדיוק הפרבולות
          האלה. אילו בדקנו רק ישרים, לא היינו רואים את ההבדל: על ישר $g$ אינה קבועה.
      - kind: result
        text: >-
          (א) יש גבול אם ורק אם $f$ קבועה; (ב)–(ג) לשלוש הפונקציות אין גבול בראשית.

  - id: W-5.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-5.1-2]
    prompt: >-
      תהי $f(x,y)=\frac{x^2y^2}{x^3+y^3}$ על $A=\{(x,y):\ x^3+y^3\ne0\}$.

      (א) הראו ש-$A=\{(x,y):\ y\ne-x\}$ ושהראשית נקודת הצטברות של $A$.

      (ב) הראו שהגבול של $f$ לאורך כל ישר דרך הראשית שמוכל (בלי הראשית) ב-$A$ הוא $0$.

      (ג) חשבו את הגבול של $f$ לאורך המסילה $y=-x+x^2$, $x\to0^+$, והכריעו אם ל-$f$ יש גבול בראשית.
    answer: >-
      (ב) על $y=mx$: $\frac{m^2x}{1+m^3}\to0$. (ג) $f=\frac{(x-1)^2}{x^2-3x+3}\to\frac13$; אין גבול. (ועל $y=-x+x^3$ אפילו
      $f\to\infty$.)
    solution:
      - kind: idea
        text: >-
          המכנה מתאפס על כל הישר $y=-x$, וליד הישר הזה הוא קטן מאוד. מסילה שמתקרבת לראשית **צמוד** לישר הזה מגדילה את
          $f$.
      - kind: step
        text: >-
          (א) $x^3+y^3=(x+y)(x^2-xy+y^2)$, והגורם השני הוא
          $\big(x-\frac y2\big)^2+\frac34y^2$, שמתאפס רק בראשית. לכן $x^3+y^3=0$ אם ורק אם $y=-x$. הנקודות $(\frac1k,0)$
          ב-$A$ ושואפות לראשית: $(0,0)\in A'$.
      - kind: computation
        text: >-
          (ב) על $y=mx$ עם $m\ne-1$ ו-$x\ne0$: $f=\frac{m^2x^4}{x^3(1+m^3)}=\frac{m^2x}{1+m^3}\to0$. על $x=0$, $f=0$.
      - kind: computation
        text: >-
          (ג) עם $y=x(x-1)$: $x+y=x^2$, $x^2-xy+y^2=x^2\big(x^2-3x+3\big)$ ו-$x^2y^2=x^4(x-1)^2$. לכן, ל-$0<x<1$,
          $f=\frac{x^4(x-1)^2}{x^2\cdot x^2(x^2-3x+3)}=\frac{(x-1)^2}{x^2-3x+3}\to\frac13$.
      - kind: theorem
        text: >-
          המסילה $(t,\ -t+t^2)$ שייכת ל-$A$ (כי $x+y=t^2\ne0$) ונותנת $\frac13$, והמסילה $(t,0)$ נותנת $0$. לפי מסקנה
          5.1.7 אין גבול.
      - kind: check
        text: >-
          מספרית: ב-$x=0.01$ הערך $0.329989$, וב-$x=10^{-4}$ הערך $0.333300$. ועל $y=-x+x^3$ אותו חישוב נותן
          $f=\frac{(x^2-1)^2}{x(x^4-3x^2+3)}\to\infty$: $f$ אפילו אינה חסומה ליד הראשית.
      - kind: result
        text: >-
          הגבול לאורך כל ישר $0$, ולאורך $y=-x+x^2$ הוא $\frac13$: אין גבול בראשית.

challenge:
  - id: W-5.1-c1
    stars: 1
    objectives: [OBJ-5.1-2]
    prompt: >-
      תהי $A=\{(x,y)\in\mathbb{R}^2:\ x>0,\ 0<y<x^2\}$.

      (א) הוכיחו שכל ישר דרך הראשית מכיל קטע סביב הראשית שכולו מחוץ ל-$A$.

      (ב) נגדיר $f=1$ על $A$ ו-$f=0$ מחוץ ל-$A$. לכל $h\in\mathbb{R}^2$ נגדיר $g_h(t)=f(th)$. הוכיחו שכל $g_h$ רציפה
      ב-$0$, ושבכל זאת $f$ אינה רציפה בראשית.
    answer: >-
      (א) ישר עם שיפוע $m>0$ מחוץ ל-$A$ כש-$|x|<m$; שאר הישרים מחוץ ל-$A$ כולם. (ב) $g_h=0$ ליד $0$; הנקודות
      $(t,\frac{t^2}2)\in A$ שואפות לראשית.
    solution:
      - kind: idea
        text: >-
          $A$ הוא "קרן" דקה בין ציר $x$ לפרבולה $y=x^2$, שמשיקה לציר בראשית. ישר עם שיפוע חיובי $m$ נמצא ליד הראשית
          **מעל** הפרבולה, כי $mx>x^2$ ל-$0<x<m$; ישר אחר בכלל לא נכנס לרביע שבו $A$.
      - kind: step
        text: >-
          (א) **1.** הציר $x=0$ מחוץ ל-$A$ (שם לא $x>0$). ישר $y=mx$ עם $m\le0$: לנקודות עם $x>0$, $y=mx\le0$, ולכן לא
          $y>0$; ולנקודות עם $x\le0$ לא $x>0$. כל הישר מחוץ ל-$A$.
      - kind: step
        text: >-
          **2.** ישר $y=mx$ עם $m>0$: לנקודות עם $0<x<m$, $x^2<mx=y$, ולכן לא $y<x^2$; ולנקודות עם $x\le0$ לא $x>0$.
          לכן החלק של הישר עם $|x|<m$, קטע סביב הראשית, מחוץ ל-$A$.
      - kind: step
        text: >-
          (ב) **3.** אם $h=0$, $g_h\equiv f(0,0)=0$. אחרת $t\mapsto th$ עובר על הישר דרך הראשית בכיוון $h$, ולפי (א) יש
          $\tau>0$ עם $th\notin A$ לכל $|t|<\tau$ (עם $h=(h_1,h_2)$ ו-$h_1\ne0$: $\tau=\frac m{|h_1|}$ במקרה של שלב 2).
          לכן $g_h(t)=0=g_h(0)$ ל-$|t|<\tau$: $g_h$ רציפה ב-$0$.
      - kind: step
        text: >-
          **4.** לכל $t>0$, $0<\frac{t^2}2<t^2$, ולכן $(t,\frac{t^2}2)\in A$ ו-$f(t,\frac{t^2}2)=1$. המסילה הזו שואפת
          לראשית, ולפי מסקנה 5.1.7, אילו היה $\lim f=f(0,0)=0$, היה $1\to0$. לכן $f$ אינה רציפה בראשית.
      - kind: check
        text: >-
          זו טענה 5.1.12(ג) בגרסה "קיצונית": רציפות לאורך כל ישר (אפילו קבועה ליד $0$ על כל ישר) אינה רציפות. השוו
          ל-$\frac{x^2y}{x^4+y^2}$: שם $f$ רק שואפת ל-$0$ על כל ישר, כאן היא $0$ ממש.
      - kind: result
        text: >-
          (א) הוכח; (ב) כל $g_h$ רציפה ב-$0$, ו-$f$ אינה רציפה בראשית.
    source:
      name: 'M. Spivak, Calculus on Manifolds (statement as reproduced in M. Chien, "Spivak Solutions", 2024)'
      year: 1965
      problem: 'Problem 1-26'
      url: 'https://maxlchien.github.io/downloads/Spivak%20Solutions%20Only.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-5.1-c2
    stars: 1
    objectives: [OBJ-5.1-3]
    prompt: >-
      תהי $f:[0,1]^2\to\mathbb{R}$. נאמר ש-$f$ רציפה ב-$x$ **במידה שווה ב-$y$** אם לכל $x_0\in[0,1]$ ולכל
      $\varepsilon>0$ יש $\delta>0$ כך שלכל $x\in[0,1]$ עם $|x-x_0|<\delta$ ולכל $y\in[0,1]$:
      $|f(x,y)-f(x_0,y)|<\varepsilon$.

      (א) נניח ש-$f$ רציפה ב-$x$ במידה שווה ב-$y$, ושלכל $x_0\in[0,1]$ הפונקציה $y\mapsto f(x_0,y)$ רציפה על
      $[0,1]$. הוכיחו ש-$f$ רציפה על $[0,1]^2$.

      (ב) הראו שהמילים "במידה שווה ב-$y$" נחוצות: עבור $f=\frac{xy}{x^2+y^2}$ על $[0,1]^2$ (ו-$f(0,0)=0$), רציפה בכל
      משתנה בנפרד, התנאי נכשל ב-$x_0=0$.
    answer: >-
      (א) אי-שוויון המשולש דרך הנקודה $(x_0,y)$. (ב) $|f(x,x)-f(0,x)|=\frac12$ לכל $x>0$.
    solution:
      - kind: idea
        text: >-
          כדי לעבור מ-$(x_0,y_0)$ ל-$(x,y)$ עוברים דרך $(x_0,y)$: קודם במאונך (רציפות ב-$y$ על הקו $x=x_0$), ואחר כך
          באופקי. הצעד האופקי נעשה בגובה $y$ **משתנה**, ולכן צריך $\delta$ אחד לכל $y$: זו האחידות.
      - kind: step
        text: >-
          (א) **1.** תהי $(x_0,y_0)\in[0,1]^2$ ו-$\varepsilon>0$. לפי האחידות יש $\delta_1>0$ כך ש-$|x-x_0|<\delta_1$
          גורר $|f(x,y)-f(x_0,y)|<\frac\varepsilon2$ לכל $y\in[0,1]$.
      - kind: step
        text: >-
          **2.** $y\mapsto f(x_0,y)$ רציפה ב-$y_0$: יש $\delta_2>0$ כך ש-$|y-y_0|<\delta_2$ גורר
          $|f(x_0,y)-f(x_0,y_0)|<\frac\varepsilon2$.
      - kind: step
        text: >-
          **3.** עם $\delta=\min(\delta_1,\delta_2)$: אם $\|(x,y)-(x_0,y_0)\|_2<\delta$, אז $|x-x_0|<\delta_1$ ו-
          $|y-y_0|<\delta_2$, ולפי אי-שוויון המשולש
          $|f(x,y)-f(x_0,y_0)|\le|f(x,y)-f(x_0,y)|+|f(x_0,y)-f(x_0,y_0)|<\varepsilon$. לכן $f$ רציפה ב-$(x_0,y_0)$.
      - kind: step
        text: >-
          (ב) **4.** $f$ רציפה בכל משתנה בנפרד (טענה 5.1.12(ב)). ב-$x_0=0$: $f(0,y)=0$ לכל $y$, ולכל $x\in(0,1]$, עם
          $y=x$, $|f(x,x)-f(0,x)|=\frac12$. לכן עבור $\varepsilon=\frac12$ אין $\delta$ שמתאים לכל $y$: התנאי נכשל, וכמו
          שצריך, $f$ אינה רציפה בראשית.
      - kind: check
        text: >-
          איפה השתמשנו בכל הנחה: האחידות בשלב 1 (ה-$y$ של שלב 3 אינו ידוע מראש), והרציפות ב-$y$ בשלב 2, רק על הקו
          $x=x_0$. ההוכחה עובדת על כל תחום, לא רק $[0,1]^2$.
      - kind: result
        text: >-
          (א) $f$ רציפה על $[0,1]^2$; (ב) בלי האחידות זה נכשל, עם $\frac{xy}{x^2+y^2}$.
    source:
      name: 'University of British Columbia, Mathematics 226 (Advanced Calculus I), Sessional Examination'
      year: 2001
      problem: 'Problem 9'
      url: 'https://oldwww.math.ubc.ca/Ugrad/pastExams/Files/226_2001WT1.pdf'
      verified: '2026-11-17'
      adapted: true
