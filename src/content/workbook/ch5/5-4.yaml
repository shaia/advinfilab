# Workbook of lesson 5.4 — a sufficient condition for differentiability, and the gradient.
# Objectives (src/course.ts):
#   OBJ-5.4-1  continuous partial derivatives in a neighbourhood ⇒ differentiable; a differentiable function that is not C¹
#   OBJ-5.4-2  the gradient: direction of steepest ascent, orthogonal to the level curves
#   OBJ-5.4-3  the tangent plane to a graph and to a level surface
# Results cited by the numbers of the chapter-5 spine (5.m.k) and of chapters 1–4. Every number recomputed with
# npx tsx (gradients and Jacobians by finite differences in src/math/multivar.ts as a probe, the tangent planes at a
# nearby point, the formula of W-5.4-08 against a central difference, the volume of W-5.4-10 at (2, 1/2, 1), and the
