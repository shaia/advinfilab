# Workbook of lesson 5.3 — differentiability.
# Objectives (src/course.ts):
#   OBJ-5.3-1  define differentiability as a linear approximation with error small relative to the step; uniqueness of Df(a)
#   OBJ-5.3-2  differentiable ⇒ continuous, every directional derivative exists, Df(a) is given by the Jacobian matrix
#   OBJ-5.3-3  decide from the definition whether a function is differentiable at a point
# Results cited by the numbers of the chapter-5 spine (5.m.k) and of chapters 1–3. Every number recomputed with npx tsx
# (Jacobians and products, 19/3 and 16/3, √2 and 5√2/4, the tent integrals 1/n and 2/(3n), the δ of W-07, the
# inequality 3q²|p/q − √2| ≥ 1 for q ≤ 2000 as a probe of c2's step 2).
lesson: '5.3'
practice:
  - id: W-5.3-01
    level: basic
    objectives: [OBJ-5.3-2]
    prompt: >-
      הפונקציה $f(x,y,z)=(xyz,\ x^2+z^2)$, מ-$\mathbb{R}^3$ ל-$\mathbb{R}^2$, דיפרנציאבילית בנקודה $a=(1,2,3)$ (נתון).

      (א) מהו הגודל של $J_f(a)$? חשבו אותה.

      (ב) חשבו את $Df(a)h$ עבור $h=(1,0,-1)$.

      (ג) חשבו את $D_vf(a)$ עבור $v=\frac13(2,1,2)$.
    answer: >-
      (א) $2\times3$, עם השורות $(6,3,2)$ ו-$(2,0,6)$. (ב) $(4,-4)$. (ג) $\left(\frac{19}3,\frac{16}3\right)$.
    solution:
      - kind: theorem
        text: >-
          לפי משפט 5.3.7, $Df(a)h=J_f(a)h$, ו-$J_f(a)$ היא מטריצה $m\times n$, כאן $2\times3$: שורה לכל רכיב (שני
          רכיבים), עמודה לכל משתנה (שלושה משתנים). ולכל וקטור יחידה $v$, $D_vf(a)=Df(a)v$.
      - kind: computation
        text: >-
          (א) $f_1=xyz$: $\partial_xf_1=yz$, $\partial_yf_1=xz$, $\partial_zf_1=xy$, וב-$(1,2,3)$: $(6,3,2)$. $f_2=x^2+z^2$:
          $\partial_xf_2=2x$, $\partial_yf_2=0$, $\partial_zf_2=2z$, וב-$(1,2,3)$: $(2,0,6)$. לכן
          $$J_f(a)=\begin{pmatrix}6&3&2\\2&0&6\end{pmatrix}.$$
      - kind: computation
        text: >-
          (ב) $J_f(a)h=(6\cdot1+3\cdot0+2\cdot(-1),\ 2\cdot1+0+6\cdot(-1))=(4,-4)$.
      - kind: check
        text: >-
          (ג) $\|v\|_2=\frac13\sqrt{4+1+4}=1$, כלומר $v$ וקטור יחידה, והנוסחה $D_vf(a)=J_f(a)v$ חלה. מי שמשתמש ב-$(2,1,2)$
          בלי החלוקה ב-3 מקבל תשובה גדולה פי 3.
      - kind: computation
        text: >-
          $J_f(a)v=\frac13(6\cdot2+3\cdot1+2\cdot2,\ 2\cdot2+0+6\cdot2)=\frac13(19,16)$.
      - kind: result
        text: >-
          (א) $J_f(a)$ בגודל $2\times3$, השורות $(6,3,2)$ ו-$(2,0,6)$; (ב) $(4,-4)$; (ג) $\left(\frac{19}3,\frac{16}3\right)$.

  - id: W-5.3-02
    level: basic
    objectives: [OBJ-5.3-1]
    prompt: >-
      תהי $f(x,y)=x^2+xy$ ו-$a=(1,-1)$.

      (א) מצאו העתקה לינארית $T$ וכתבו במפורש את השארית $r(h)=f(a+h)-f(a)-Th$, עם $h=(h_1,h_2)$. הוכיחו מההגדרה
      ש-$f$ דיפרנציאבילית ב-$a$.

      (ב) הראו ישירות שההעתקה $S(h_1,h_2)=h_1$ **אינה** מקיימת את ההגדרה. למה זה צפוי מראש?
    answer: >-
      (א) $T(h_1,h_2)=h_1+h_2$, $r(h)=h_1^2+h_1h_2$, והמנה לכל היותר $\sqrt2\|h\|_2$. (ב) על $h=(0,t)$ המנה של $S$
      שווה ל-1. זה צפוי כי הדיפרנציאל יחיד, והוא $T\ne S$.
    solution:
      - kind: computation
        text: >-
          (א) $f(a)=1-1=0$. פותחים:
          $$\begin{aligned}f(1+h_1,-1+h_2)&=(1+h_1)^2+(1+h_1)(-1+h_2)\\&=h_1+h_2+h_1^2+h_1h_2.\end{aligned}$$
      - kind: step
        text: >-
          החלק הלינארי הוא $T(h_1,h_2)=h_1+h_2$, והשארית $r(h)=h_1^2+h_1h_2=h_1(h_1+h_2)$.
      - kind: step
        text: >-
          $|h_1|\le\|h\|_2$ ו-$|h_1|+|h_2|\le\sqrt2\|h\|_2$ (קושי-שוורץ, או משפט 1.7.3). לכן
          $|r(h)|\le\sqrt2\|h\|_2^2$, והמנה $\frac{|r(h)|}{\|h\|_2}\le\sqrt2\|h\|_2\to0$: $f$ דיפרנציאבילית ב-$a$, ו-$Df(a)=T$.
      - kind: step
        text: >-
          (ב) עם $S$, השארית היא $f(a+h)-f(a)-h_1=h_2+h_1^2+h_1h_2$. על $h=(0,t)$, $t\ne0$, היא $t$, והמנה
          $\frac{|t|}{|t|}=1$ אינה שואפת ל-0 (מסקנה 5.1.7). לכן $S$ אינה מקיימת את ההגדרה.
      - kind: check
        text: >-
          לפי משפט 5.3.3, רק העתקה אחת יכולה לעבוד, ו-$T$ כבר עובדת. ולפי משפט 5.3.7, המטריצה שלה היא
          $(\partial_xf(a),\partial_yf(a))=(2x+y,\ x)|_{(1,-1)}=(1,1)$: מתאים. $S$ טועה בכיוון $e_2$, שבו $D_{e_2}f(a)=1$ ואילו
          $Se_2=0$.
      - kind: result
        text: >-
          (א) $T(h)=h_1+h_2$, $r(h)=h_1^2+h_1h_2$, $\frac{|r(h)|}{\|h\|_2}\le\sqrt2\|h\|_2$. (ב) לאורך $(0,t)$ המנה של $S$ היא 1.

  - id: W-5.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-5.3-1, OBJ-5.3-2]
    prompt: >-
      נכון או לא נכון? נמקו כל סעיף. בכל הסעיפים $f:\mathbb{R}^2\to\mathbb{R}$ (בסעיף (ד) $f:\mathbb{R}\to\mathbb{R}$).

      (א) אם $f$ דיפרנציאבילית ב-$a$, אז $D_{-v}f(a)=-D_vf(a)$ לכל וקטור יחידה $v$.

      (ב) אם $f$ דיפרנציאבילית ב-$a$, אז הפונקציה $h\mapsto f(a+h)-f(a)$ לינארית.

      (ג) אם $f$ דיפרנציאבילית ב-$a$ ו-$Df(a)=0$, אז $f(a+h)-f(a)=o(\|h\|)$.

      (ד) $f(x)=x|x|$ דיפרנציאבילית ב-0, ו-$Df(0)=0$.
    answer: >-
      (א) נכון. (ב) לא נכון. (ג) נכון. (ד) נכון.
    solution:
      - kind: step
        text: >-
          (א) **נכון.** לפי משפט 5.3.7, $D_{-v}f(a)=Df(a)(-v)=-Df(a)v=-D_vf(a)$, מהלינאריות של $Df(a)$.
      - kind: step
        text: >-
          (ב) **לא נכון.** $f(x,y)=x^2$ ב-$a=0$: דיפרנציאבילית עם $Df(0)=0$ (השארית $h_1^2\le\|h\|_2^2$), אבל
          $h\mapsto h_1^2$ אינה לינארית ($2h$ נותן פי 4). רק **הקירוב** של ההפרש לינארי; ההפרש עצמו הוא קירוב ועוד שארית.
      - kind: step
        text: >-
          (ג) **נכון.** זו הגדרה 5.3.1 עם $T=0$: השארית היא $f(a+h)-f(a)-0$.
      - kind: step
        text: >-
          (ד) **נכון.** $f(0)=0$; עם $T=0$, $\frac{|f(h)-0-0|}{|h|}=\frac{|h|^2}{|h|}=|h|\to0$. לפי דוגמה 5.3.4(ה), זה אומר
          ש-$f'(0)=0$.
      - kind: check
        text: >-
          (ב) הוא הבלבול בין הדיפרנציאל לבין ההפרש (או הפונקציה): $Df(a)$ לינארית תמיד, $f$ כמעט אף פעם.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון, למשל $x^2$ בראשית; (ג) נכון, זו ההגדרה עם $T=0$; (ד) נכון, השארית $h|h|$.

  - id: W-5.3-04
    level: mid
    objectives: [OBJ-5.3-3]
    prompt: >-
      הכריעו אם הפונקציות דיפרנציאביליות בראשית (שתיהן מוגדרות 0 בראשית). אם כן, מצאו את הדיפרנציאל.

      (א) $f(x,y)=\frac{x^3y}{x^2+y^2}$.

      (ב) $g(x,y)=x+y+\frac{xy^2}{x^2+y^2}$.
    answer: >-
      (א) דיפרנציאבילית, $Df(0)=0$. (ב) אינה דיפרנציאבילית: המועמד הוא $(1,1)$, ועל האלכסון המנה היא $\frac1{2\sqrt2}$.
    solution:
      - kind: idea
        text: >-
          המתכון (מסקנה 5.3.8): נגזרות חלקיות נותנות את המועמד היחיד, ואז חוסמים את השארית או מוצאים מסילה שבה
          המנה אינה שואפת ל-0.
      - kind: step
        text: >-
          (א) $f=0$ על הצירים, ולכן הנגזרות החלקיות 0 והמועמד $T=0$. $|x|^3|y|\le\|h\|_2^4$, ולכן
          $|f(h)|\le\|h\|_2^2$, ו-$\frac{|f(h)|}{\|h\|_2}\le\|h\|_2\to0$. לפי טענה 5.1.9, $f$ דיפרנציאבילית ו-$Df(0)=0$.
      - kind: step
        text: >-
          (ב) $g(t,0)=t$ ו-$g(0,t)=t$, ולכן $\partial_xg(0)=\partial_yg(0)=1$, והמועמד הוא $T(h_1,h_2)=h_1+h_2$. השארית:
          $r(h)=\frac{h_1h_2^2}{h_1^2+h_2^2}$.
      - kind: step
        text: >-
          על האלכסון, $r(t,t)=\frac{t^3}{2t^2}=\frac t2$ ו-$\|(t,t)\|_2=\sqrt2|t|$, ולכן המנה היא $\frac1{2\sqrt2}$ לכל $t\ne0$,
          ואינה שואפת ל-0. $g$ אינה דיפרנציאבילית.
      - kind: check
        text: >-
          דרך שנייה ל-(ב), שלב (1) של המתכון: $D_vg(0)=v_1+v_2+v_1v_2^2$ (חלקו את $g(tv)$ ב-$t$), שאינו לינארי ב-$v$; ב-$v=\frac1{\sqrt2}(1,1)$
          התוספת היא $\frac1{2\sqrt2}$, בדיוק המנה שמצאנו. החלק $x+y$ לינארי ואינו משנה דבר: הבעיה היא $\frac{xy^2}{x^2+y^2}$,
          הומוגנית מדרגה 1, בדיוק כמו $\frac{x^3}{x^2+y^2}$.
      - kind: result
        text: >-
          (א) דיפרנציאבילית עם $Df(0)=0$; (ב) אינה דיפרנציאבילית.

  - id: W-5.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.3-2, OBJ-5.3-3]
    prompt: >-
      ל-$f:\mathbb{R}^2\to\mathbb{R}$ ידוע ש-$\frac{\partial f}{\partial x}(0)=3$ ו-$\frac{\partial f}{\partial y}(0)=-1$.

      (א) נניח ש-$f$ דיפרנציאבילית בראשית. חשבו את $D_vf(0)$ עבור $v=\frac1{\sqrt2}(1,1)$, ומצאו את כל וקטורי
      היחידה $v$ שעבורם $D_vf(0)=0$.

      (ב) בלי ההנחה, האם $D_vf(0)$ נקבע? בדקו את $g(x,y)=3x-y+\frac{x^2y}{x^2+y^2}$, $g(0)=0$.
    answer: >-
      (א) $\sqrt2$; $v=\pm\frac1{\sqrt{10}}(1,3)$. (ב) לא: ל-$g$ אותן נגזרות חלקיות, ו-$D_vg(0)=\frac{5\sqrt2}4$ באותו כיוון,
      ולכן $g$ אינה דיפרנציאבילית.
    solution:
      - kind: theorem
        text: >-
          (א) לפי משפט 5.3.7(ג), $D_vf(0)=3v_1-v_2$.
      - kind: computation
        text: >-
          עם $v=\frac1{\sqrt2}(1,1)$: $\frac{3-1}{\sqrt2}=\sqrt2$. ו-$3v_1-v_2=0$ פירושו $v_2=3v_1$; עם $v_1^2+v_2^2=1$:
          $10v_1^2=1$, ולכן $v=\pm\frac1{\sqrt{10}}(1,3)$.
      - kind: computation
        text: >-
          (ב) $g(t,0)=3t$ ו-$g(0,t)=-t$: אותן נגזרות חלקיות. לווקטור יחידה $v$ ו-$t\ne0$:
          $\frac{g(tv)}t=3v_1-v_2+v_1^2v_2$, ולכן $D_vg(0)=3v_1-v_2+v_1^2v_2$.
      - kind: computation
        text: >-
          ב-$v=\frac1{\sqrt2}(1,1)$: $\sqrt2+\frac12\cdot\frac1{\sqrt2}=\frac{5}{2\sqrt2}=\frac{5\sqrt2}4\approx1.768$.
      - kind: step
        text: >-
          לפי (א), אילו $g$ הייתה דיפרנציאבילית בראשית, היה $D_vg(0)=\sqrt2$. לכן $g$ אינה דיפרנציאבילית: הנגזרות
          החלקיות לבדן אינן קובעות את הנגזרות הכיווניות.
      - kind: result
        text: >-
          (א) $\sqrt2$, ו-$v=\pm\frac1{\sqrt{10}}(1,3)$; (ב) לא נקבע: $D_vg(0)=\frac{5\sqrt2}4\ne\sqrt2$, ו-$g$ אינה דיפרנציאבילית.

  - id: W-5.3-06
    level: mid
    objectives: [OBJ-5.3-2]
    prompt: >-
      הפונקציה $F(s,t)=(s\cos t,\ s\sin t,\ s^2)$, מ-$\mathbb{R}^2$ ל-$\mathbb{R}^3$, דיפרנציאבילית בכל נקודה (נתון).

      (א) חשבו את $J_F(2,\frac\pi2)$. מה הגודל שלה?

      (ב) חשבו את $DF(2,\frac\pi2)h$ עבור $h=(1,\frac12)$.

      (ג) חשבו ישירות את הנגזרת של המסילה $\tau\mapsto F(2,\frac\pi2+\tau)$ ב-$\tau=0$, והשוו לאחת העמודות של (א).
    answer: >-
      (א) $3\times2$, עם השורות $(0,-2)$, $(1,0)$, $(4,0)$. (ב) $(-1,1,4)$. (ג) $(-2,0,0)$, העמודה השנייה.
    solution:
      - kind: computation
        text: >-
          (א) שורה לכל רכיב: $\nabla$ של $s\cos t$ הוא $(\cos t,-s\sin t)$, של $s\sin t$ הוא $(\sin t,s\cos t)$, ושל $s^2$ הוא
          $(2s,0)$. ב-$(2,\frac\pi2)$, עם $\cos\frac\pi2=0$ ו-$\sin\frac\pi2=1$:
          $$J_F=\begin{pmatrix}0&-2\\1&0\\4&0\end{pmatrix},$$
          מטריצה $3\times2$.
      - kind: computation
        text: >-
          (ב) $J_Fh=(0\cdot1-2\cdot\frac12,\ 1\cdot1+0,\ 4\cdot1+0)=(-1,1,4)$.
      - kind: computation
        text: >-
          (ג) $F(2,\frac\pi2+\tau)=(2\cos(\frac\pi2+\tau),\ 2\sin(\frac\pi2+\tau),\ 4)=(-2\sin\tau,\ 2\cos\tau,\ 4)$. הנגזרת ב-$\tau=0$,
          רכיב-רכיב: $(-2,0,0)$.
      - kind: check
        text: >-
          זו הנגזרת החלקית $\frac{\partial F}{\partial t}(2,\frac\pi2)=DF(a)e_2$, העמודה **השנייה** של $J_F$ (משפט 5.3.7(ב)):
          עמודה לכל משתנה. מי שמחליף שורות ועמודות מקבל מטריצה $2\times3$, וכפל שלה ב-$h\in\mathbb{R}^2$ אינו מוגדר.
      - kind: result
        text: >-
          (א) $3\times2$, $\begin{pmatrix}0&-2\\1&0\\4&0\end{pmatrix}$; (ב) $(-1,1,4)$; (ג) $(-2,0,0)$, העמודה השנייה.

  - id: W-5.3-07
    level: mid
    objectives: [OBJ-5.3-1]
    prompt: >-
      $f(x,y)=x^2+y^2$ דיפרנציאבילית ב-$a=(1,1)$, עם $Df(a)h=2h_1+2h_2$ והשארית $r(h)=\|h\|_2^2$. יהי $\varepsilon=0.01$.
      מצאו את ה-$\delta$ **הגדול ביותר** כך ש-$0<N(h)<\delta$ גורר $\frac{|r(h)|}{N(h)}<\varepsilon$, כאשר הנורמה $N$
      על התחום היא:

      (א) $\|\cdot\|_2$; (ב) $\|\cdot\|_1$; (ג) $\|\cdot\|_\infty$.

      מה זה אומר על טענה 5.3.2?
    answer: >-
      (א) $0.01$; (ב) $0.01$; (ג) $0.005$. ה-$\delta$ תלוי בנורמה, הדיפרנציאביליות והדיפרנציאל לא.
    solution:
      - kind: idea
        text: >-
          ה-$\delta$ הגדול ביותר נקבע לפי הסופרמום של המנה על $0<N(h)<\delta$: צריך שהוא יהיה לכל היותר $\varepsilon$.
          נחשב את המנה כפונקציה של $N(h)$, ונמצא את המקום שבו היא הגדולה ביותר.
      - kind: step
        text: >-
          (א) המנה היא $\|h\|_2$. אם $\delta\le0.01$, אז $\|h\|_2<\delta$ גורר שהמנה קטנה מ-$0.01$. אם $\delta>0.01$,
          הצעד $h=(0.01,0)$ מקיים $\|h\|_2<\delta$ והמנה שם $0.01$, לא קטנה מ-$\varepsilon$. לכן $\delta=0.01$.
      - kind: step
        text: >-
          (ב) $\|h\|_2\le\|h\|_1$, ולכן $\frac{\|h\|_2^2}{\|h\|_1}\le\|h\|_1$, עם שוויון על הצירים ($h=(t,0)$: $\frac{t^2}{|t|}=|t|$).
          כמו ב-(א), $\delta=0.01$.
      - kind: step
        text: >-
          (ג) $\|h\|_2^2=h_1^2+h_2^2\le2\|h\|_\infty^2$, ולכן המנה לכל היותר $2\|h\|_\infty$, עם שוויון על האלכסון
          ($h=(t,t)$: $\frac{2t^2}{|t|}=2|t|$). המנה קטנה מ-$0.01$ לכל $\|h\|_\infty<\delta$ אם ורק אם $2\delta\le0.01$:
          $\delta=0.005$.
      - kind: check
        text: >-
          ב-(ג), עם $\delta=0.006$ הצעד $h=(0.0055,0.0055)$ נותן מנה $0.011>\varepsilon$. ובכל שלוש הנורמות המנה שואפת ל-0
          ואותה $T$ עובדת: זו טענה 5.3.2. הקבועים, כמו ה-$\delta$, כן תלויים בנורמה.
      - kind: result
        text: >-
          (א) $\delta=0.01$; (ב) $\delta=0.01$; (ג) $\delta=0.005$. הדיפרנציאביליות והדיפרנציאל אינם תלויים בנורמה; ה-$\delta$ כן.

  - id: W-5.3-08
    level: exam
    qualitative: true
    objectives: [OBJ-5.3-2, OBJ-5.3-3]
    prompt: >-
      $f:\mathbb{R}^n\to\mathbb{R}^m$ נקראת הומוגנית מדרגה 1 אם $f(tx)=tf(x)$ לכל $x\in\mathbb{R}^n$ ולכל $t>0$.

      (א) הוכיחו: אם $f$ הומוגנית מדרגה 1 ודיפרנציאבילית בראשית, אז $f$ לינארית, ו-$f=Df(0)$.

      (ב) הסיקו בשורה אחת לכל אחת שהפונקציות $\sqrt{|xy|}$, $\frac{x^3}{x^2+y^2}$ (0 בראשית) ו-$\|(x,y)\|_1$ אינן
      דיפרנציאביליות בראשית.
    answer: >-
      (א) על הקרן $h=tx$ המנה של ההגדרה שווה ל-$\frac{\|f(x)-Tx\|}{\|x\|}$, ואינה תלויה ב-$t$; היא שואפת ל-0, ולכן
      $f(x)=Tx$. (ב) שלושתן הומוגניות מדרגה 1 ואינן לינאריות.
    solution:
      - kind: idea
        text: >-
          זו ההוכחה של יחידות הדיפרנציאל (משפט 5.3.3), עם $f$ במקום $S$: לאורך קרן מהראשית, ההומוגניות הופכת את המנה
          של ההגדרה לקבועה, וקבוע ששואף ל-0 הוא 0.
      - kind: step
        text: >-
          (א) **1.** $f(0)=f(2\cdot0)=2f(0)$, ולכן $f(0)=0$. נסמן $T=Df(0)$, ו-$r(h)=f(h)-Th$.
      - kind: step
        text: >-
          **2.** נקבע $x\ne0$. לכל $t>0$, לפי ההומוגניות והלינאריות של $T$:
          $$\frac{\|r(tx)\|}{\|tx\|}=\frac{\|tf(x)-tTx\|}{t\|x\|}=\frac{\|f(x)-Tx\|}{\|x\|}.$$
      - kind: step
        text: >-
          **3.** $tx\to0$ כש-$t\to0^+$, ו-$tx\ne0$, ולכן לפי מסקנה 5.1.7 צד שמאל שואף ל-0. צד ימין אינו תלוי ב-$t$, ולכן הוא 0:
          $f(x)=Tx$. וגם $f(0)=0=T0$. לכן $f=T$, לינארית.
      - kind: step
        text: >-
          (ב) שלושתן מקיימות $f(tx)=tf(x)$ ל-$t>0$ (הוציאו $t$ מהשורש, מהשבר, מהערכים המוחלטים). אף אחת אינה לינארית:
          ל-$\sqrt{|xy|}$, $f(1,1)=1\ne f(1,0)+f(0,1)=0$; ל-$\frac{x^3}{x^2+y^2}$, $f(1,1)=\frac12\ne f(1,0)+f(0,1)=1$;
          ל-$\|\cdot\|_1$, $f(-1,0)=1\ne-f(1,0)$. לפי (א), אף אחת אינה דיפרנציאבילית בראשית.
      - kind: check
        text: >-
          זה ההסבר למה שראיתם באיור 5.3א: הגרף של פונקציה הומוגנית מדרגה 1 בנוי מקרניים מהראשית, והוא נראה אותו דבר בכל
          הגדלה. אם הוא אינו מישור כבר בהגדלה 1, הוא לעולם לא יתלכד עם מישור. איפה השתמשנו בדיפרנציאביליות: בשלב 3,
          המנה שואפת ל-0. בלעדיה, $\|x\|_2$ הומוגנית מדרגה 1 ואינה לינארית.
      - kind: result
        text: >-
          (א) $f=Df(0)$, לינארית; (ב) $\sqrt{|xy|}$, $\frac{x^3}{x^2+y^2}$ ו-$\|\cdot\|_1$ הומוגניות מדרגה 1 ואינן לינאריות, ולכן אינן
          דיפרנציאביליות בראשית.

  - id: W-5.3-09
    level: exam
    objectives: [OBJ-5.3-1]
    prompt: >-
      (א) על $V=(C[0,1],\|\cdot\|_\infty)$ תהי $\Psi(u)=\int_0^1u(x)^3\,dx$. הוכיחו ש-$\Psi$ דיפרנציאבילית בכל $u$, עם
      $D\Psi(u)h=3\int_0^1u^2h$.

      (ב) על אותה קבוצה $C[0,1]$, אבל עם הנורמה $\|u\|_1=\int_0^1|u|$, תהי $\Phi(u)=\int_0^1u(x)^2\,dx$. הוכיחו
      ש-$\Phi$ **אינה** דיפרנציאבילית ב-$u=0$. (רמז: אוהלים צרים.) השוו לטענה 5.3.10(ד).
    answer: >-
      (א) השארית $\int_0^1(3uh^2+h^3)$ חסומה ב-$(3\|u\|_\infty+\|h\|_\infty)\|h\|_\infty^2$. (ב) המועמד היחיד הוא 0,
      ולאוהל $h_n$ בגובה 1 על $[0,\frac2n]$ המנה היא $\frac{2/(3n)}{1/n}=\frac23$.
    solution:
      - kind: computation
        text: >-
          (א) $(u+h)^3-u^3=3u^2h+3uh^2+h^3$, ולפי הלינאריות של האינטגרל
          $\Psi(u+h)-\Psi(u)=3\int_0^1u^2h+\int_0^1(3uh^2+h^3)$.
      - kind: step
        text: >-
          $Th=3\int_0^1u^2h$ לינארית, וחסומה: $|Th|\le3\|u\|_\infty^2\|h\|_\infty$ (הגדרה 1.8.1). השארית מקיימת
          $$\begin{aligned}|r(h)|&\le\int_0^1\big(3|u|h^2+|h|^3\big)\\&\le\big(3\|u\|_\infty+\|h\|_\infty\big)\|h\|_\infty^2,\end{aligned}$$
          ולכן $\frac{|r(h)|}{\|h\|_\infty}\to0$. לפי טענה 5.3.10, $D\Psi(u)=T$.
      - kind: step
        text: >-
          (ב) **1. המועמד.** אילו $\Phi$ הייתה דיפרנציאבילית ב-0, לפי טענה 5.3.10(ג), לכל $w$:
          $D\Phi(0)w=\lim_{t\to0}\frac{\Phi(tw)}t=\lim_{t\to0}t\int_0^1w^2=0$. לכן $D\Phi(0)=0$, והשארית היא $\Phi(h)=\int_0^1h^2$.
      - kind: computation
        text: >-
          **2. האוהלים.** ל-$n\ge2$ יהי $h_n$ האוהל שגובהו 1 ב-$\frac1n$, שמתאפס מחוץ ל-$[0,\frac2n]$ ולינארי בכל חצי. $h_n$
          רציפה, $\|h_n\|_1=\frac12\cdot\frac2n\cdot1=\frac1n\to0$, ו-
          $$\int_0^1h_n^2=2\int_0^{1/n}(nx)^2\,dx=\frac2{3n}.$$
      - kind: step
        text: >-
          **3.** המנה היא $\frac{\Phi(h_n)}{\|h_n\|_1}=\frac{2/(3n)}{1/n}=\frac23$ לכל $n$, אף ש-$h_n\to0$ ב-$\|\cdot\|_1$.
          לפי הצורה הסדרתית של הגבול (טענה 5.1.4(ב)), המנה אינה שואפת ל-0: $\Phi$ אינה דיפרנציאבילית ב-0.
      - kind: check
        text: >-
          לפי טענה 5.3.10(ד), עם $\|\cdot\|_\infty$ אותה $\Phi$ **כן** דיפרנציאבילית, עם $D\Phi(0)=0$: שם $\|h_n\|_\infty=1$,
          והאוהלים אינם שואפים ל-0. בממד אינסופי הנורמות אינן שקולות, והדיפרנציאביליות תלויה בהן: טענה 5.3.2 היא
          תכונה של ממד סופי. בדיקה מספרית של האינטגרלים ל-$n=10$: $0.1$ ו-$0.0667$.
      - kind: result
        text: >-
          (א) $D\Psi(u)h=3\int_0^1u^2h$; (ב) ב-$\|\cdot\|_1$ המנה על האוהלים היא $\frac23$, ולכן $\Phi$ אינה דיפרנציאבילית ב-0.

  - id: W-5.3-10
    level: exam
    objectives: [OBJ-5.3-1, OBJ-5.3-2, OBJ-5.3-3]
    prompt: >-
      תהי $f:U\to\mathbb{R}$, $U\subseteq\mathbb{R}^n$ פתוחה, דיפרנציאבילית ב-$a\in U$, עם $f(a)=0$.

      (א) הוכיחו: $|f|$ דיפרנציאבילית ב-$a$ אם ורק אם $Df(a)=0$.

      (ב) הכריעו אם $|x+y|$ ואם $|x^2-y^2|$ דיפרנציאביליות בראשית.
    answer: >-
      (א) ($\Leftarrow$) $\big||f|(a+h)\big|=|r(h)|$. ($\Rightarrow$) $|f|$ מינימלית ב-$a$, ולכן כל הנגזרות הכיווניות שלה שם 0,
      ומכאן $f(a+h)=o(\|h\|)$. (ב) $|x+y|$ לא; $|x^2-y^2|$ כן.
    solution:
      - kind: step
        text: >-
          (א) ($\Leftarrow$) אם $Df(a)=0$, אז $f(a+h)=r(h)$ עם $r(h)=o(\|h\|)$. עם $T=0$ ל-$|f|$:
          $\frac{\big||f(a+h)|-|f(a)|-0\big|}{\|h\|}=\frac{|r(h)|}{\|h\|}\to0$. לכן $|f|$ דיפרנציאבילית ב-$a$ עם $D|f|(a)=0$.
      - kind: step
        text: >-
          ($\Rightarrow$) **1.** נניח ש-$|f|$ דיפרנציאבילית ב-$a$, ויהי $v$ וקטור יחידה. לפי משפט 5.3.7, הגבול
          $D_v|f|(a)=\lim_{t\to0}\frac{|f(a+tv)|}t$ קיים.
      - kind: step
        text: >-
          **2.** ל-$t>0$ המנה אי-שלילית, ולכן הגבול (שהוא גם הגבול מימין) $\ge0$; ל-$t<0$ היא אי-חיובית, ולכן הגבול $\le0$.
          לכן $D_v|f|(a)=0$ לכל $v$. לפי משפט 5.3.7(א), $D|f|(a)v=D_v|f|(a)=0$ לכל וקטור יחידה $v$, כלומר $D|f|(a)=0$.
      - kind: step
        text: >-
          **3.** כלומר $\frac{|f(a+h)|}{\|h\|}\to0$. זו בדיוק הגדרה 5.3.1 ל-$f$ עם $T=0$. לפי היחידות (משפט 5.3.3),
          $Df(a)=0$.
      - kind: step
        text: >-
          (ב) $x+y$ לינארית, דיפרנציאבילית עם $Df(0)h=h_1+h_2\ne0$ (דוגמה 5.3.4(ב)), ו-$f(0)=0$. לפי (א), $|x+y|$ **אינה**
          דיפרנציאבילית בראשית.
      - kind: step
        text: >-
          $g=x^2-y^2$: $g(0)=0$, ועם $T=0$, $|g(h)|\le h_1^2+h_2^2=\|h\|_2^2$, ולכן $g$ דיפרנציאבילית עם $Dg(0)=0$. לפי (א),
          $|x^2-y^2|$ **כן** דיפרנציאבילית בראשית.
      - kind: check
        text: >-
          איפה השתמשנו ב-$f(a)=0$: בשלב 2, $|f|$ מקבלת ב-$a$ את הערך הקטן ביותר שלה, 0, ולכן המנה מחליפה סימן עם $t$. כש-$f(a)\ne0$
          הסימן של $f$ קבוע ליד $a$ (רציפות, משפט 5.3.6), ו-$|f|=\pm f$ שם: דיפרנציאבילית תמיד (טענה 5.3.5(ג)).
          ובמשתנה אחד: $|x|$ ב-0 היא (ב) הראשון, ו-$|x^2|$ השני.
      - kind: result
        text: >-
          (א) $|f|$ דיפרנציאבילית ב-$a$ אם ורק אם $Df(a)=0$; (ב) $|x+y|$ אינה דיפרנציאבילית בראשית, $|x^2-y^2|$ דיפרנציאבילית שם
          עם דיפרנציאל 0.

challenge:
  - id: W-5.3-c1
    stars: 1
    objectives: [OBJ-5.3-2, OBJ-5.3-3]
    prompt: >-
      (א) תהי $F:\mathbb{R}^n\to\mathbb{R}$ דיפרנציאבילית ב-$a$, ונניח ש-$a$ נקודת מקסימום מקומי: יש $\delta>0$ כך
      ש-$F(x)\le F(a)$ לכל $x$ עם $\|x-a\|<\delta$. הוכיחו ש-$DF(a)=0$. (ולכן גם במינימום מקומי.)

      (ב) תהי $F(x,y)=(y-x^2)(y-3x^2)$. הוכיחו ש-$DF(0)=0$, ושעל כל ישר דרך הראשית ל-$F$ יש בראשית מינימום מקומי חזק
      (כפונקציה של משתנה אחד על הישר), ובכל זאת הראשית **אינה** נקודת מינימום מקומי של $F$.
    answer: >-
      (א) לכל $v$, $t\mapsto F(a+tv)$ מקבלת מקסימום מקומי ב-0, ולפי פרמה הנגזרת שם, $DF(a)v$, היא 0. (ב) על $y=mx$:
      $F=x^2(m-x)(m-3x)>0$ ליד 0; על $y=2x^2$: $F=-x^4<0$.
    solution:
      - kind: idea
        text: >-
          (א) מצמצמים לישרים: על כל ישר יש מקסימום של פונקציה של משתנה אחד, ומשפט פרמה (אינפי 1) נותן נגזרת כיוונית 0. לפי
          משפט 5.3.7 הנגזרות הכיווניות קובעות את $DF(a)$. (ב) מראה שהכיוון ההפוך אינו נכון: גם מינימום על כל ישר אינו
          מינימום. העקומה $y=2x^2$, בין שתי הפרבולות שבהן $F=0$, היא המסלול שבו $F$ שלילית.
      - kind: step
        text: >-
          (א) **1.** יהי $v$ וקטור יחידה ו-$\varphi(t)=F(a+tv)$ ל-$|t|<\delta$. אז $\varphi(t)\le\varphi(0)$, ולפי משפט 5.3.7
          $\varphi'(0)=D_vF(a)=DF(a)v$ קיימת.
      - kind: step
        text: >-
          **2.** לפי משפט פרמה (אינפי 1), נגזרת בנקודת קיצון פנימית מתאפסת: $DF(a)v=0$. כך לכל וקטור יחידה $v$, ולכן לכל
          וקטור: $DF(a)=0$. במינימום מקומי מפעילים את זה על $-F$.
      - kind: computation
        text: >-
          (ב) **3.** פותחים: $F(x,y)=y^2-4x^2y+3x^4$. $F(t,0)=3t^4$ ו-$F(0,t)=t^2$, ולכן הנגזרות החלקיות 0 והמועמד $T=0$.
          עם $\rho=\|(h,k)\|_2\le1$: $|F(h,k)|\le k^2+4h^2|k|+3h^4\le8\rho^2$, ולכן המנה לכל היותר $8\rho\to0$: $DF(0)=0$.
      - kind: step
        text: >-
          **4.** על הציר $x=0$: $F(0,y)=y^2>0$ ל-$y\ne0$. על $y=0$: $3x^4>0$. על $y=mx$ עם $m\ne0$:
          $F(x,mx)=x^2(m-x)(m-3x)$. כש-$0<|x|<\frac{|m|}3$, לשני הגורמים $m-x$ ו-$m-3x$ יש הסימן של $m$, והמכפלה חיובית.
          לכן על כל ישר, $F>F(0)=0$ בסביבה מנוקבת של הראשית.
      - kind: step
        text: >-
          **5.** אבל על העקומה $y=2x^2$: $F(x,2x^2)=(x^2)(-x^2)=-x^4<0$ לכל $x\ne0$, והנקודות $(x,2x^2)$ שואפות לראשית.
          בכל כדור סביב הראשית יש נקודה עם $F<F(0)$: הראשית אינה מינימום מקומי.
      - kind: check
        text: >-
          (ב) אינו סותר את (א): (א) אומר ש-$DF(a)=0$ **הכרחי** לקיצון, לא מספיק. הדוגמה (של פאנו) מראה שגם ההנחה החזקה יותר,
          מינימום על כל ישר, אינה מספיקה, מאותה סיבה שבגללה נגזרות כיווניות אינן דיפרנציאביליות: ישרים אינם רואים את
          הפרבולות. מספרית: $F(0.1,0.02)=-10^{-4}$. בפרק 6 נלמד תנאים מספיקים.
      - kind: result
        text: >-
          (א) $DF(a)=0$; (ב) $DF(0)=0$, מינימום חזק על כל ישר, ו-$F(x,2x^2)=-x^4<0$: הראשית אינה מינימום מקומי.
    source:
      name: 'Math 322 (Calculus on Manifolds), Assignment 1, NISER'
      year: 2017
      problem: 'Problem 6 (part a; part b, Peano''s example, is added here)'
      url: 'https://www.niser.ac.in/~chitrabhanu/CalcMfld/PS1.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-5.3-c2
    stars: 1
    objectives: [OBJ-5.3-2, OBJ-5.3-3]
    prompt: >-
      נגדיר $f:\mathbb{R}\to\mathbb{R}$ כך: $f(x)=0$ אם $x$ אי-רציונלי, ו-$f(\frac pq)=\frac1{q^3}$ כש-$\frac pq$ שבר מצומצם
      עם $q\in\mathbb{N}$.

      (א) הוכיחו ש-$f$ גזירה ב-$\sqrt2$ עם $f'(\sqrt2)=0$, אבל אינה רציפה באף קטע פתוח שמכיל את $\sqrt2$.

      (ב) הסיקו ש-$F(x,y)=f(x)+y^2$ דיפרנציאבילית ב-$(\sqrt2,0)$, ושבכל כדור סביב הנקודה יש נקודות שבהן $F$ אינה רציפה,
      ולכן גם אינה דיפרנציאבילית. דיפרנציאביליות בנקודה אינה אומרת דבר על הסביבה.
    answer: >-
      (א) לשבר $\frac pq$ קרוב ל-$\sqrt2$, $|\frac pq-\sqrt2|>\frac1{3q^2}$, ולכן מנת ההפרשים קטנה מ-$\frac3q$, ו-$q\to\infty$
      כש-$\frac pq\to\sqrt2$. $f$ אינה רציפה באף נקודה רציונלית. (ב) $DF(\sqrt2,0)=0$, ו-$F$ אינה רציפה ב-$(r,0)$ לכל $r$ רציונלי.
    solution:
      - kind: idea
        text: >-
          $\sqrt2$ "רחוק" מכל שבר עם מכנה קטן: $p^2-2q^2$ הוא שלם שונה מ-0. לכן ערך $\frac1{q^3}$ קטן מאוד ביחס למרחק
          $|\frac pq-\sqrt2|\gtrsim\frac1{q^2}$, והמנה קטנה מ-$\frac3q$. ו-$f$ קופצת בכל נקודה רציונלית.
      - kind: step
        text: >-
          (א) **1.** יהי $\frac pq$ שבר מצומצם. $\sqrt2$ אי-רציונלי, ולכן $p^2-2q^2$ שלם ושונה מ-0, ו-$|p^2-2q^2|\ge1$:
          $\left|\frac{p^2}{q^2}-2\right|\ge\frac1{q^2}$.
      - kind: step
        text: >-
          **2.** אם $|\frac pq-\sqrt2|<\frac1{10}$, אז $0<\frac pq+\sqrt2<2\sqrt2+\frac1{10}<3$, ולכן
          $$\left|\frac pq-\sqrt2\right|=\frac{|p^2/q^2-2|}{p/q+\sqrt2}>\frac1{3q^2}.$$
      - kind: step
        text: >-
          **3.** לכן לשבר כזה, $\frac{|f(p/q)-f(\sqrt2)|}{|p/q-\sqrt2|}<\frac{1/q^3}{1/(3q^2)}=\frac3q$. ולמספר אי-רציונלי $x$ המנה היא 0.
      - kind: step
        text: >-
          **4.** יהי $\varepsilon>0$ ו-$Q\ge\frac3\varepsilon$. בקטע $(\sqrt2-\frac1{10},\sqrt2+\frac1{10})$ יש רק מספר סופי של שברים
          עם מכנה $q\le Q$ (לכל $q$ לכל היותר $\frac q5+1$ מונים), ואף אחד מהם אינו $\sqrt2$. יהי $\eta>0$ קטן מ-$\frac1{10}$ ומהמרחק
          של כל אחד מהם ל-$\sqrt2$. אם $0<|x-\sqrt2|<\eta$ ו-$x=\frac pq$, אז $q>Q$ ולפי שלב 3 המנה קטנה מ-$\frac3Q\le\varepsilon$;
          ואם $x$ אי-רציונלי המנה 0. לכן $f'(\sqrt2)=0$.
      - kind: step
        text: >-
          **5.** בנקודה רציונלית $r=\frac pq$, $f(r)=\frac1{q^3}>0$, ויש סדרה של אי-רציונליים $x_k\to r$, עם $f(x_k)=0$: $f$ אינה
          רציפה ב-$r$ (משפט 1.6.3). בכל קטע פתוח יש מספר רציונלי, ולכן $f$ אינה רציפה באף קטע פתוח, ובפרט אינה גזירה בכל
          נקודה של קטע כזה.
      - kind: step
        text: >-
          (ב) **6.** $F(\sqrt2,0)=0$. עם $T=0$, לכל $(h,k)\ne0$:
          $$\frac{|F(\sqrt2+h,k)|}{\|(h,k)\|_2}\le\frac{|f(\sqrt2+h)|}{\|(h,k)\|_2}+\frac{k^2}{\|(h,k)\|_2}.$$
          המחובר השני לכל היותר $\|(h,k)\|_2$. הראשון 0 כש-$h=0$, ואחרת לכל היותר $\frac{|f(\sqrt2+h)|}{|h|}$, ששואף ל-0
          לפי (א). לכן $F$ דיפרנציאבילית ב-$(\sqrt2,0)$ עם $DF=0$.
      - kind: step
        text: >-
          **7.** לכל $r$ רציונלי, $F$ אינה רציפה ב-$(r,0)$: על הסדרה $(x_k,0)$ משלב 5, $F(x_k,0)=0\not\to F(r,0)=\frac1{q^3}$.
          ובכל כדור סביב $(\sqrt2,0)$ יש נקודות $(r,0)$ עם $r$ רציונלי. לפי משפט 5.3.6, $F$ אינה דיפרנציאבילית בהן.
      - kind: check
        text: >-
          בדיקה מספרית של שלב 2 (בדיקה, לא הוכחה): לכל $q\le2000$ ולשברים הקרובים ל-$\sqrt2$, $3q^2|\frac pq-\sqrt2|\ge1.029$.
          והשוו לדוגמה המעובדת 6 בשיעור, סעיף (ב): שם הפונקציה דיפרנציאבילית בראשית בזכות חסם $\|x\|_2^2$; כאן הנקודה
          אי-רציונלית, והחסם בא מתורת המספרים.
      - kind: result
        text: >-
          (א) $f'(\sqrt2)=0$, ו-$f$ אינה רציפה באף נקודה רציונלית, ולכן באף קטע פתוח; (ב) $DF(\sqrt2,0)=0$, ו-$F$ אינה
          דיפרנציאבילית ב-$(r,0)$ לכל $r$ רציונלי.
