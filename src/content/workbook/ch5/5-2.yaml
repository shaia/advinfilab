# Workbook of lesson 5.2 — partial and directional derivatives.
# Objectives (src/course.ts):
#   OBJ-5.2-1  define and compute partial and directional derivatives
#   OBJ-5.2-2  all partial derivatives existing at a point does not imply continuity there
#   OBJ-5.2-3  all directional derivatives existing does not imply continuity, and they need not be linear in v
# Results cited by the numbers of the chapter-5 spine (5.2.m). Every number recomputed with npx tsx (central
# differences of the slices, and the closed forms): 3/√2, 1/√2, 16/15, (√5 − 1)/2, √((√5 − 1)/2), 3/√2 vs 3.
lesson: '5.2'
practice:
  - id: W-5.2-01
    level: basic
    objectives: [OBJ-5.2-1]
    prompt: >-
      חשבו את הנגזרות החלקיות.

      (א) $\frac{\partial f}{\partial x}(1,0)$ ו-$\frac{\partial f}{\partial y}(1,0)$, עבור $f(x,y)=x^2\sin y+e^{xy}$.

      (ב) שלוש הנגזרות החלקיות של $g(x,y,z)=\frac{x}{y+z}$ בנקודה $(2,1,1)$.

      (ג) $\partial_xF(1,2)$ ו-$\partial_yF(1,2)$, עבור הפונקציה הווקטורית $F(x,y)=(xy,\ x+y^2)$.
    answer: >-
      (א) $0$ ו-$2$. (ב) $\frac12$, $-\frac12$, $-\frac12$. (ג) $\partial_xF(1,2)=(2,1)$, $\partial_yF(1,2)=(1,4)$.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 5.2.1, $\partial_if(a)$ היא הנגזרת של $t\mapsto f(a+te_i)$ ב-0. בכל הסעיפים הנוסחה תקפה על קטע שלם
          דרך הנקודה בכיוון הציר (המכנה $y+z$ חיובי ליד $(2,1,1)$), ולכן גוזרים לפי משתנה אחד כשהשאר קבועים. ל-$F$
          וקטורית גוזרים כל רכיב.
      - kind: computation
        text: >-
          (א) $\partial_xf=2x\sin y+ye^{xy}$, וב-$(1,0)$: $0+0=0$. $\partial_yf=x^2\cos y+xe^{xy}$, וב-$(1,0)$: $1+1=2$.
      - kind: computation
        text: >-
          (ב) $\partial_xg=\frac1{y+z}=\frac12$; $\partial_yg=-\frac{x}{(y+z)^2}=-\frac24=-\frac12$; ובאותו אופן
          $\partial_zg=-\frac12$.
      - kind: computation
        text: >-
          (ג) $\partial_xF=(y,\,1)$ ו-$\partial_yF=(x,\,2y)$, ובנקודה $(1,2)$: $(2,1)$ ו-$(1,4)$.
      - kind: check
        text: >-
          ב-(ב), $g(2,1+t,1)=\frac2{2+t}$, שהנגזרת שלו ב-0 היא $-\frac24$: אותו מספר מהפרוסה עצמה. ומנה סימטרית עם
          $t=10^{-6}$ (בדיקה, לא הוכחה) נותנת $0$ ו-$2.00000$ ב-(א).
      - kind: result
        text: >-
          (א) $0,\ 2$; (ב) $\frac12,\ -\frac12,\ -\frac12$; (ג) $(2,1)$ ו-$(1,4)$.

  - id: W-5.2-02
    level: basic
    objectives: [OBJ-5.2-1]
    prompt: >-
      $f(x,y)=xy^2$ ו-$a=(1,1)$. חשבו מההגדרה (דרך הפרוסה $\varphi(t)=f(a+tv)$):

      (א) את הנגזרת הכיוונית בכיוון הווקטור $(1,1)$;

      (ב) את הנגזרת הכיוונית בכיוון הווקטור $(-1,1)$;

      (ג) את הנגזרת הכיוונית בכיוון $(-1,-1)$, ואת הנגזרת **לאורך הווקטור** $(1,1)$ (בלי לנרמל).
    answer: >-
      (א) $\frac3{\sqrt2}\approx2.121$. (ב) $\frac1{\sqrt2}\approx0.707$. (ג) $-\frac3{\sqrt2}$, ו-$3$.
    solution:
      - kind: idea
        text: >-
          הכיוון מיוצג על ידי וקטור יחידה; מחשבים את הפרוסה, פולינום ב-$t$, וגוזרים ב-0. את (ג) מקבלים מ-(א) לפי טענה
          5.2.2א.
      - kind: computation
        text: >-
          (א) $v=\frac1{\sqrt2}(1,1)$. עם $s=\frac{t}{\sqrt2}$: $\varphi(t)=(1+s)(1+s)^2=(1+s)^3$. לפי כלל השרשרת במשתנה אחד,
          $\varphi'(0)=3(1+0)^2\cdot\frac1{\sqrt2}=\frac3{\sqrt2}$.
      - kind: computation
        text: >-
          (ב) $v=\frac1{\sqrt2}(-1,1)$. עם אותו $s$: $\varphi(t)=(1-s)(1+s)^2$. הנגזרת לפי $s$ היא
          $-(1+s)^2+2(1-s)(1+s)$, וב-$s=0$: $-1+2=1$. לכן $\varphi'(0)=1\cdot\frac1{\sqrt2}=\frac1{\sqrt2}$.
      - kind: theorem
        text: >-
          (ג) לפי טענה 5.2.2א(א), $D_{-v}f(a)=-D_vf(a)=-\frac3{\sqrt2}$. לפי טענה 5.2.2א(ב) עם $\lambda=\|(1,1)\|_2=\sqrt2$,
          הנגזרת לאורך $(1,1)$ היא $\sqrt2\cdot\frac3{\sqrt2}=3$.
      - kind: check
        text: >-
          ישירות: $f(1+t,1+t)=(1+t)^3$, שהנגזרת שלו ב-0 היא 3. ובדיקה מספרית (מנה סימטרית, $t=10^{-6}$): $2.12132$ ו-$0.707107$,
          כמו $\frac3{\sqrt2}$ ו-$\frac1{\sqrt2}$.
      - kind: result
        text: >-
          (א) $\frac3{\sqrt2}$; (ב) $\frac1{\sqrt2}$; (ג) $-\frac3{\sqrt2}$, והנגזרת לאורך $(1,1)$ היא $3$.

  - id: W-5.2-03
    level: basic
    qualitative: true
    objectives: [OBJ-5.2-1, OBJ-5.2-2]
    prompt: >-
      $f:\mathbb{R}^2\to\mathbb{R}$, $a\in\mathbb{R}^2$ ו-$v$ וקטור יחידה. נכון או לא נכון? נמקו כל סעיף: הוכחה קצרה או
      דוגמה נגדית.

      (א) אם $D_vf(a)$ קיימת, אז $D_{-v}f(a)=-D_vf(a)$.

      (ב) אם $\frac{\partial f}{\partial x}(a)$ קיימת, אז $t\mapsto f(a+te_1)$ רציפה ב-$t=0$.

      (ג) אם $f(a+tv)\to f(a)$ כש-$t\to0$, אז $D_vf(a)=0$.

      (ד) אם שתי הנגזרות החלקיות של $f$ ב-$a$ קיימות, אז $f$ רציפה ב-$a$.

      (ה) אם $D_vf(a)$ קיימת, הנגזרת של $f$ לאורך הווקטור $2v$ שווה ל-$D_vf(a)$.
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון: $f(x,y)=x$, $a=0$, $v=e_1$. (ד) לא נכון: $\frac{xy}{x^2+y^2}$. (ה) לא נכון: היא
      $2D_vf(a)$.
    solution:
      - kind: theorem
        text: >-
          (א) טענה 5.2.2א(א): עם $s=-t$, המנה בכיוון $-v$ היא מינוס המנה בכיוון $v$, והגבול הדו-צדדי עובר.
      - kind: theorem
        text: >-
          (ב) טענה 5.2.2א(ג) עם $v=e_1$: $f(a+te_1)-f(a)=t\cdot\frac{f(a+te_1)-f(a)}{t}\to0\cdot\partial_xf(a)=0$.
      - kind: step
        text: >-
          (ג) לא נכון. $f(x,y)=x$, $a=(0,0)$, $v=e_1$: $f(t,0)=t\to0=f(0,0)$, אבל המנה $\frac{t}{t}=1$, ולכן $D_vf(a)=1$.
          השאיפה $f(a+tv)\to f(a)$ היא רציפות לאורך הישר; הנגזרת היא הגבול של **המנה**.
      - kind: step
        text: >-
          (ד) לא נכון: טענה 5.2.4(א). ל-$f=\frac{xy}{x^2+y^2}$ (ו-0 בראשית) שתי הנגזרות החלקיות בראשית 0, ו-$f(\frac1k,\frac1k)=\frac12$.
      - kind: step
        text: >-
          (ה) לא נכון בדרך כלל: לפי טענה 5.2.2א(ב) עם $\lambda=2$ היא $2D_vf(a)$. למשל עבור $f(x,y)=x$, $a=0$, $v=e_1$:
          $D_vf(a)=1$ והנגזרת לאורך $2e_1$ היא 2. השוויון מתקיים רק כש-$D_vf(a)=0$.
      - kind: result
        text: >-
          נכון: (א), (ב). לא נכון: (ג), (ד), (ה).

  - id: W-5.2-04
    level: mid
    objectives: [OBJ-5.2-1]
    prompt: >-
      $f(x,y)=|x-y|$.

      (א) באילו נקודות קיימת $\frac{\partial f}{\partial x}$, ומה ערכה שם?

      (ב) תהי $a=(c,c)$ נקודה על האלכסון. לאילו וקטורי יחידה $v$ קיימת $D_vf(a)$, ומה ערכה?
    answer: >-
      (א) בדיוק כש-$x\ne y$, והיא $\operatorname{sgn}(x-y)$. (ב) בדיוק ל-$v=\pm\frac1{\sqrt2}(1,1)$, והיא 0.
    solution:
      - kind: idea
        text: >-
          כותבים את הפרוסה. היא מהצורה $|C+tB|$ עם קבועים $C,B$, ויש לה נגזרת ב-0 אלא אם $C=0$ ו-$B\ne0$.
      - kind: step
        text: >-
          (א) **1.** אם $x_0\ne y_0$: ליד $t=0$ הביטוי $x_0-y_0+t$ שומר על הסימן של $x_0-y_0$, ולכן
          $f(x_0+t,y_0)=\operatorname{sgn}(x_0-y_0)\,(x_0-y_0+t)$, פונקציה לינארית של $t$ עם שיפוע
          $\operatorname{sgn}(x_0-y_0)$.
      - kind: step
        text: >-
          **2.** אם $x_0=y_0$: $f(x_0+t,y_0)=|t|$, והמנה $\frac{|t|}t$ היא $\pm1$ משני הצדדים: הנגזרת אינה קיימת.
      - kind: computation
        text: >-
          (ב) **3.** לווקטור יחידה $v$ ו-$t\ne0$: $f(a+tv)=|c+tv_1-c-tv_2|=|t|\,|v_1-v_2|$, והמנה היא
          $|v_1-v_2|\cdot\frac{|t|}{t}$.
      - kind: step
        text: >-
          **4.** אם $v_1\ne v_2$, הגבולות החד-צדדיים $\pm|v_1-v_2|$ שונים, ואין נגזרת. אם $v_1=v_2$ המנה 0, ו-$D_vf(a)=0$.
          וקטורי היחידה עם $v_1=v_2$ הם $\pm\frac1{\sqrt2}(1,1)$.
      - kind: check
        text: >-
          על האלכסון $f$ היא 0, ולכן הנגזרת לאורך האלכסון 0, כצפוי. ו-(א) מתיישב עם (ב): על האלכסון $\partial_xf$ אינה
          קיימת, כי $e_1$ אינו בכיוון האלכסון. זו טענה 5.2.3(ג) אחרי סיבוב של 45 מעלות.
      - kind: result
        text: >-
          (א) $\partial_xf(x,y)=\operatorname{sgn}(x-y)$ כש-$x\ne y$, ואינה קיימת על האלכסון. (ב) רק בכיוונים
          $\pm\frac1{\sqrt2}(1,1)$, ושם $D_vf(a)=0$.

  - id: W-5.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-5.2-2]
    prompt: >-
      $f(x,y)=\frac{x^2y^2}{x^4+y^4}$ כש-$(x,y)\ne(0,0)$, ו-$f(0,0)=0$.

      (א) הוכיחו ששתי הנגזרות החלקיות של $f$ קיימות בכל נקודה של $\mathbb{R}^2$.

      (ב) הוכיחו ש-$f$ אינה רציפה ב-$(0,0)$.

      (ג) לאילו וקטורי יחידה $v$ קיימת $D_vf(0,0)$?
    answer: >-
      (א) בראשית שתיהן 0 ($f=0$ על הצירים); בשאר הנקודות $f$ מנה של פולינומים עם מכנה שאינו מתאפס. (ב)
      $f(\frac1k,\frac1k)=\frac12$. (ג) רק בכיווני הצירים, $v=\pm e_1,\pm e_2$.
    solution:
      - kind: idea
        text: >-
          על הצירים $f=0$, ולכן הנגזרות החלקיות בראשית 0. על כל ישר אחר דרך הראשית $f$ קבועה ושונה מ-0, ולכן הפרוסה
          קופצת ב-0.
      - kind: step
        text: >-
          (א) **1.** $f(t,0)=f(0,t)=0$ לכל $t$, ולכן שתי המנות בראשית 0, ו-$\partial_xf(0,0)=\partial_yf(0,0)=0$.
      - kind: step
        text: >-
          **2.** בנקודה $(x_0,y_0)\ne(0,0)$: אם $y_0\ne0$, המכנה $x^4+y_0^4\ge y_0^4>0$ לכל $x$; אם $y_0=0$, אז $x_0\ne0$ והמכנה
          $x^4>0$ לכל $x$ ליד $x_0$. על הקטע האופקי הזה $f$ היא מנה של פולינומים ב-$x$ עם מכנה חיובי, ולכן גזירה (אינפי 1).
          באותו אופן לפי $y$.
      - kind: step
        text: >-
          (ב) **3.** $(\frac1k,\frac1k)\to(0,0)$ ו-$f(\frac1k,\frac1k)=\frac{k^{-4}}{2k^{-4}}=\frac12\not\to0$. לפי משפט 1.6.3, $f$
          אינה רציפה בראשית.
      - kind: computation
        text: >-
          (ג) **4.** לווקטור יחידה $v$ ו-$t\ne0$: $f(tv)=\frac{t^4v_1^2v_2^2}{t^4(v_1^4+v_2^4)}=\frac{v_1^2v_2^2}{v_1^4+v_2^4}$,
          מספר קבוע $C(v)$ שאינו תלוי ב-$t$. (המכנה חיובי כי $v\ne0$.)
      - kind: step
        text: >-
          **5.** אם $v_1v_2\ne0$, אז $C(v)>0$, והמנה $\frac{C(v)}{t}$ אינה חסומה ליד 0: אין נגזרת. אם $v_1v_2=0$, אז $C(v)=0$
          והמנה 0: הנגזרת קיימת ושווה 0.
      - kind: check
        text: >-
          זה אותו מבנה כמו $\frac{xy}{x^2+y^2}$ של טענה 5.2.4: פונקציה שקבועה על כל קרן מהראשית ($f(tx)=f(x)$ לכל
          $t>0$), ושהיא 0 על הצירים. נגזרות חלקיות בכל נקודה, ובכל זאת אין רציפות: הנגזרות החלקיות אינן חסומות ליד הראשית.
      - kind: result
        text: >-
          (א) קיימות בכל $\mathbb{R}^2$; (ב) אינה רציפה בראשית; (ג) $D_vf(0,0)$ קיימת רק ל-$v=\pm e_1,\pm e_2$, והיא 0.

  - id: W-5.2-06
    level: mid
    objectives: [OBJ-5.2-3]
    prompt: >-
      $f(x,y)=\frac{xy^2}{x^2+y^4}$ כש-$(x,y)\ne(0,0)$, ו-$f(0,0)=0$.

      (א) חשבו את $D_vf(0,0)$ לכל וקטור יחידה $v$.

      (ב) הראו שההעתקה $v\mapsto D_vf(0,0)$ אינה צמצום של העתקה לינארית.

      (ג) הוכיחו ש-$f$ אינה רציפה ב-$(0,0)$.
    answer: >-
      (א) $\frac{v_2^2}{v_1}$ כש-$v_1\ne0$, ו-0 כש-$v_1=0$. (ב) הנגזרות החלקיות 0, ו-$D_vf=\frac{16}{15}$ ל-$v=(\frac35,\frac45)$.
      (ג) $f(y^2,y)=\frac12$.
    solution:
      - kind: idea
        text: >-
          זו $g$ של טענה 5.2.5 עם תפקידי $x$ ו-$y$ מוחלפים: מצמצמים חזקות של $t$ במנה, והפרבולה הקריטית היא $x=y^2$.
      - kind: computation
        text: >-
          (א) **1.** אם $v_1=0$: $f(0,t)=0$, והנגזרת 0. אם $v_1\ne0$, לכל $t\ne0$:
          $$\frac{f(tv)}{t}=\frac{t^3v_1v_2^2}{t\,(t^2v_1^2+t^4v_2^4)}=\frac{v_1v_2^2}{v_1^2+t^2v_2^4},$$
          וכש-$t\to0$ זה שואף ל-$\frac{v_1v_2^2}{v_1^2}=\frac{v_2^2}{v_1}$.
      - kind: step
        text: >-
          (ב) **2.** אילו $D_vf(0,0)=c\cdot v$, אז $c_1=D_{e_1}f(0,0)=\frac{0}{1}=0$ ו-$c_2=D_{e_2}f(0,0)=0$, כלומר $c=0$.
          אבל ל-$v=(\frac35,\frac45)$: $D_vf(0,0)=\frac{16/25}{3/5}=\frac{16}{15}\ne0$.
      - kind: step
        text: >-
          (ג) **3.** $(\frac1{k^2},\frac1k)\to(0,0)$ ו-$f(\frac1{k^2},\frac1k)=\frac{k^{-4}}{k^{-4}+k^{-4}}=\frac12\not\to0$. לפי משפט 1.6.3, $f$
          אינה רציפה בראשית.
      - kind: check
        text: >-
          5.2.2א(א) מתקיימת: $\frac{v_2^2}{-v_1}=-\frac{v_2^2}{v_1}$. ובדיקה מספרית: ב-$v=(\frac35,\frac45)$ ועם $t=10^{-4}$
          המנה היא $1.066667$, ו-$\frac{16}{15}\approx1.066667$.
      - kind: result
        text: >-
          (א) $D_vf(0,0)=\frac{v_2^2}{v_1}$ ($v_1\ne0$), 0 ($v_1=0$); (ב) לא לינארית; (ג) אינה רציפה.

  - id: W-5.2-07
    level: mid
    objectives: [OBJ-5.2-1]
    prompt: >-
      שני מרחבי מבחן.

      (א) במרחב $(C[0,1],\|\cdot\|_\infty)$ תהי $\Psi(u)=\int_0^1u(x)^3\,dx$. הוכיחו שלכל $u,w\in C[0,1]$ הנגזרת של $\Psi$
      ב-$u$ לאורך $w$ קיימת, מצאו אותה, וחשבו אותה עבור $u(x)=x$ ו-$w=\mathbf 1$.

      (ב) ב-$\mathbb{R}^2$ תהי $f(x,y)=x^2+y$ ו-$a=(1,0)$. חשבו את הנגזרת הכיוונית בכיוון $(1,1)$, ואת הנגזרת לאורך
      הווקטור $w=(1,1)$ עצמו, שהוא וקטור יחידה של $\|\cdot\|_\infty$. מה היחס, ולמה?
    answer: >-
      (א) $3\int_0^1u^2w$; עבור $u=x$, $w=\mathbf 1$: $1$. (ב) $\frac3{\sqrt2}$ ו-$3$; היחס $\sqrt2=\|w\|_2$.
    solution:
      - kind: idea
        text: >-
          (א) מפתחים את $(u+tw)^3$: המנה היא פולינום ב-$t$. (ב) הנורמה נכנסת רק לבחירת הנציג של הכיוון (טענה 5.2.2ב(א)).
      - kind: computation
        text: >-
          (א) **1.** לכל $x$: $(u+tw)^3=u^3+3t\,u^2w+3t^2\,uw^2+t^3w^3$. לפי הלינאריות של האינטגרל, ל-$t\ne0$:
          $$\frac{\Psi(u+tw)-\Psi(u)}{t}=3\int_0^1u^2w+t\cdot3\int_0^1uw^2+t^2\int_0^1w^3 .$$
      - kind: step
        text: >-
          **2.** האינטגרלים מספרים קבועים (הפונקציות רציפות על $[0,1]$), ולכן כש-$t\to0$ המנה שואפת ל-$3\int_0^1u^2w$. עבור
          $u=x$, $w=\mathbf 1$: $3\int_0^1x^2\,dx=1$.
      - kind: computation
        text: >-
          (ב) **3.** $v=\frac1{\sqrt2}(1,1)$; עם $s=\frac t{\sqrt2}$: $f(a+tv)=(1+s)^2+s$, שהנגזרת שלו לפי $s$ ב-0 היא $2+1=3$.
          לכן $D_vf(a)=\frac3{\sqrt2}$.
      - kind: computation
        text: >-
          **4.** לאורך $w=(1,1)$: $f(1+t,t)=(1+t)^2+t$, והנגזרת ב-0 היא 3. היחס $\frac{3}{3/\sqrt2}=\sqrt2=\|w\|_2$, לפי טענה
          5.2.2א(ב) עם $\lambda=\sqrt2$.
      - kind: check
        text: >-
          $\|w\|_\infty=1$, כך שמי שמגדיר "וקטור יחידה" לפי $\|\cdot\|_\infty$ היה מקבל 3 ולא $\frac3{\sqrt2}$. לכן הקורס קובע
          וקטורי יחידה של $\|\cdot\|_2$. וב-(א), מנה עם $t=10^{-6}$ (בדיקה) נותנת $1.0000015$, ששואף ל-1.
      - kind: result
        text: >-
          (א) $3\int_0^1u^2w$, ו-1 עבור $u=x$, $w=\mathbf 1$; (ב) $\frac3{\sqrt2}$ לעומת $3$, פי $\|w\|_2=\sqrt2$.

  - id: W-5.2-08
    level: exam
    qualitative: true
    objectives: [OBJ-5.2-1]
    prompt: >-
      לכל $\alpha>0$ תהי $f_\alpha(x,y)=|xy|^\alpha$.

      (א) הוכיחו ש-$f_\alpha$ רציפה בראשית, ושתי הנגזרות החלקיות שלה שם 0, לכל $\alpha>0$.

      (ב) לאילו $\alpha$ קיימות כל הנגזרות הכיווניות של $f_\alpha$ בראשית? חשבו אותן.

      (ג) הסיקו: לאילו $\alpha$ הפונקציה $f_\alpha$ היא דוגמה לפונקציה רציפה עם נגזרות חלקיות, שאין לה נגזרת כיוונית בכיוון
      אחר?
    answer: >-
      (א) $|f_\alpha|\le(\frac{\rho^2}2)^\alpha$, ו-$f_\alpha=0$ על הצירים. (ב) בדיוק כש-$\alpha>\frac12$, וכולן 0. (ג) כש-$0<\alpha\le\frac12$
      ($\alpha=\frac12$ הוא $\sqrt{|xy|}$ של טענה 5.2.7(ב)).
    solution:
      - kind: idea
        text: >-
          לאורך ישר $tv$: $f_\alpha(tv)=|t|^{2\alpha}|v_1v_2|^\alpha$. המנה מחלקת ב-$t$ פעם אחת, ולכן החזקה הקובעת היא
          $2\alpha-1$.
      - kind: step
        text: >-
          (א) **1.** עם $\rho=\|(x,y)\|_2$: $|xy|\le\frac12\rho^2$ (כי $(|x|-|y|)^2\ge0$), ולכן $|f_\alpha(x,y)|\le2^{-\alpha}\rho^{2\alpha}\to0$
          כש-$\rho\to0$. עם $\delta=(2^\alpha\varepsilon)^{1/(2\alpha)}$ בהגדרה 1.6.1, $f_\alpha$ רציפה בראשית.
      - kind: step
        text: >-
          **2.** $f_\alpha(t,0)=f_\alpha(0,t)=0$, ולכן שתי הנגזרות החלקיות בראשית 0.
      - kind: computation
        text: >-
          (ב) **3.** יהי $v$ עם $v_1v_2\ne0$ ו-$c=|v_1v_2|^\alpha>0$. לכל $t\ne0$: $\frac{f_\alpha(tv)}{t}=c\,\frac{|t|^{2\alpha}}{t}$, ובערך
          מוחלט $c\,|t|^{2\alpha-1}$.
      - kind: step
        text: >-
          **4.** $\alpha>\frac12$: $c|t|^{2\alpha-1}\to0$, והנגזרת 0. $\alpha=\frac12$: המנה $c\frac{|t|}{t}$, גבולות חד-צדדיים $\pm c$: אין
          נגזרת. $\alpha<\frac12$: $c|t|^{2\alpha-1}\to\infty$: אין נגזרת.
      - kind: step
        text: >-
          **5.** בכיווני הצירים הנגזרת קיימת תמיד (שלב 2). לכן כל הנגזרות הכיווניות קיימות בדיוק כש-$\alpha>\frac12$, ואז
          כולן 0.
      - kind: step
        text: >-
          (ג) **6.** לפי (א) $f_\alpha$ תמיד רציפה עם נגזרות חלקיות בראשית, ולפי (ב) כש-$\alpha\le\frac12$ אין לה נגזרת בכל כיוון
          עם $v_1v_2\ne0$.
      - kind: check
        text: >-
          $\alpha=\frac12$: באלכסון $c=\big(\frac12\big)^{1/2}=\frac1{\sqrt2}$, כמו בטענה 5.2.7(ב). ההשוואה עם דוגמה 6 בשיעור: שם המכנה
          $x^2+y^2$ מוריד את החזקה ב-2, והספים זזים ל-1 (רציפות) ול-$\frac32$ (נגזרות).
      - kind: result
        text: >-
          (א) רציפה, נגזרות חלקיות 0; (ב) כל הנגזרות הכיווניות קיימות בדיוק כש-$\alpha>\frac12$, ושוות 0; (ג) $0<\alpha\le\frac12$.

  - id: W-5.2-09
    level: exam
    qualitative: true
    objectives: [OBJ-5.2-3]
    prompt: >-
      (א) תהי $F(x,y)=\frac1{|x|}$ כש-$y=x^2$ ו-$x\ne0$, ו-$F(x,y)=0$ בכל נקודה אחרת. הוכיחו ש-$D_vF(0,0)=0$ לכל וקטור יחידה
      $v$, ושבכל סביבה של הראשית $F$ אינה חסומה.

      (ב) תהי $g(x,y)=\frac{x^2y}{x^4+y^2}$, $g(0,0)=0$. מצאו את כל וקטורי היחידה $v$ עם $D_vg(0,0)=1$.

      (ג) הוכיחו ש-$|g|\le\frac12$ בכל $\mathbb{R}^2$, אבל ש-$\{D_vg(0,0):\ \|v\|_2=1\}$ אינה חסומה.
    answer: >-
      (א) כל ישר פוגש את הפרבולה לכל היותר בנקודה אחת מחוץ לראשית; $F(\frac1k,\frac1{k^2})=k$. (ב)
      $v=\big(\pm\sqrt{s},\,s\big)$ עם $s=\frac{\sqrt5-1}2\approx0.618$, כלומר $v\approx(\pm0.786,\ 0.618)$. (ג)
      $x^4+y^2\ge2x^2|y|$; ו-$D_vg=\frac{v_1^2}{v_2}\to\infty$ כש-$v_2\to0^+$.
    solution:
      - kind: idea
        text: >-
          (א) הנגזרת הכיוונית תלויה רק בערכים על ישר, קרוב לנקודה; הערכים הגדולים של $F$ יושבים על פרבולה, שכל ישר
          פוגש לכל היותר פעם אחת. (ב)–(ג) הנוסחה $D_vg(0,0)=\frac{v_1^2}{v_2}$ של טענה 5.2.5 על מעגל היחידה.
      - kind: step
        text: >-
          (א) **1.** כמו בטענה 5.2.6: אם $t\ne0$ ו-$tv$ על הפרבולה, אז $t=t^*=\frac{v_2}{v_1^2}$ (ואם $v_1=0$ אין נקודה כזו).
          לכן עם $\rho=|t^*|$ (או $\rho=1$ אם אין $t^*$), $F(tv)=0$ לכל $0<|t|<\rho$, המנה 0, ו-$D_vF(0,0)=0$.
      - kind: step
        text: >-
          **2.** יהיו $r>0$ ו-$M>0$. לפי ארכימדס יש $k\in\mathbb{N}$ עם $k>M$ ו-$k>\frac{\sqrt2}{r}$. הנקודה $(\frac1k,\frac1{k^2})$
          נמצאת ב-$B((0,0),r)$, כי $\|(\frac1k,\frac1{k^2})\|_2\le\frac{\sqrt2}k<r$, ו-$F$ שם שווה $k>M$. לכן $F$ אינה חסומה
          באף סביבה של הראשית.
      - kind: computation
        text: >-
          (ב) **3.** $D_vg(0,0)=1$ דורש $v_2\ne0$ (אחרת הנגזרת 0) ו-$v_1^2=v_2$; בפרט $v_2>0$. עם $v_1^2+v_2^2=1$:
          $v_2^2+v_2-1=0$, והשורש החיובי הוא $s=\frac{\sqrt5-1}2\approx0.618$. אז $v_1^2=s$, כלומר $v_1=\pm\sqrt s\approx\pm0.786$.
      - kind: step
        text: >-
          (ג) **4.** $(x^2-|y|)^2\ge0$ נותן $x^4+y^2\ge2x^2|y|$, ולכן מחוץ לראשית $|g|=\frac{x^2|y|}{x^4+y^2}\le\frac12$.
      - kind: step
        text: >-
          **5.** עם $v=(\sqrt{1-s^2},\,s)$ ו-$0<s<1$: $D_vg(0,0)=\frac{1-s^2}{s}\to\infty$ כש-$s\to0^+$. לכן קבוצת הנגזרות הכיווניות
          אינה חסומה.
      - kind: check
        text: >-
          ב-(ב), $s^2+s=1$ ולכן $v_1^2+v_2^2=s+s^2=1$: וקטור יחידה, ו-$\frac{v_1^2}{v_2}=\frac ss=1$. ב-(ג): פונקציה חסומה
          שהנגזרות הכיווניות שלה, כולן קיימות, אינן חסומות: הנגזרות אינן "קטנות" רק משום שהערכים קטנים.
      - kind: result
        text: >-
          (א) $D_vF(0,0)=0$ לכל $v$, ו-$F$ אינה חסומה ליד הראשית; (ב) $v=(\pm\sqrt s,\,s)$, $s=\frac{\sqrt5-1}2$; (ג) $|g|\le\frac12$,
          והנגזרות הכיווניות אינן חסומות.

  - id: W-5.2-10
    level: exam
    objectives: [OBJ-5.2-1, OBJ-5.2-2]
    prompt: >-
      $f:\mathbb{R}^2\to\mathbb{R}$, וידוע שהנגזרת החלקית $\frac{\partial f}{\partial x}(x,y)$ קיימת ושווה $2x$ בכל נקודה.

      (א) הוכיחו שיש פונקציה $\varphi:\mathbb{R}\to\mathbb{R}$ עם $f(x,y)=x^2+\varphi(y)$ לכל $(x,y)$.

      (ב) אם גם $\frac{\partial f}{\partial y}(x,y)=0$ בכל נקודה ו-$f(0,0)=1$, מצאו את $f$.

      (ג) בלי הנתון של (ב): הראו ש-$f$ אינה חייבת להיות רציפה.
    answer: >-
      (א) $\varphi(y)=f(0,y)$. (ב) $f(x,y)=x^2+1$. (ג) $f(x,y)=x^2+\chi(y)$, עם $\chi(y)=1$ כש-$y>0$ ו-0 אחרת.
    solution:
      - kind: idea
        text: >-
          מחסירים את $x^2$, ומקבלים פונקציה שהנגזרת שלה לפי $x$ מתאפסת. למה 5.2.8 על קטעים אופקיים אומרת שהיא אינה תלויה
          ב-$x$; על קטעים אנכיים, באותו אופן עם $y$.
      - kind: step
        text: >-
          (א) **1.** נגדיר $G(x,y)=f(x,y)-x^2$. לפי האריתמטיקה של גבולות, $\partial_xG(x,y)=2x-2x=0$ בכל נקודה.
      - kind: theorem
        text: >-
          **2.** יהי $(x,y)$ עם $x\ne0$. על הקטע מ-$(0,y)$ ל-$(x,y)$ הנגזרת $\partial_xG$ קיימת בכל נקודה, כולל הקצוות. לפי למה
          5.2.8(ב) ו-(א), עם $a=(0,y)$ ו-$t=x$: $G(x,y)-G(0,y)=x\,\partial_xG(\theta x,y)=0$.
      - kind: step
        text: >-
          **3.** לכן $G(x,y)=G(0,y)=f(0,y)$ לכל $(x,y)$ (גם כש-$x=0$), ועם $\varphi(y)=f(0,y)$: $f(x,y)=x^2+\varphi(y)$.
      - kind: step
        text: >-
          (ב) **4.** $\varphi(y)=f(0,y)$, ולכן $\varphi'(y)=\partial_yf(0,y)=0$ לכל $y$. לפי למה 5.2.8 על הקטע מ-$(0,0)$ ל-$(0,y)$ (עם
          $e_2$), $\varphi(y)-\varphi(0)=0$, כלומר $\varphi(y)=f(0,0)=1$. לכן $f(x,y)=x^2+1$.
      - kind: step
        text: >-
          (ג) **5.** תהי $f(x,y)=x^2+\chi(y)$ עם $\chi(y)=1$ כש-$y>0$ ו-$\chi(y)=0$ כש-$y\le0$. לכל $y$ קבוע, $x\mapsto f(x,y)$ היא
          $x^2$ ועוד קבוע, ולכן $\partial_xf(x,y)=2x$ בכל נקודה.
      - kind: step
        text: >-
          **6.** $(0,\frac1k)\to(0,0)$ ו-$f(0,\frac1k)=1\not\to0=f(0,0)$: לפי משפט 1.6.3, $f$ אינה רציפה בראשית.
      - kind: check
        text: >-
          ב-(ג) הנגזרת לפי $x$ קיימת בכל נקודה ואפילו רציפה, ו-$f$ אינה רציפה: מה שחסר הוא מידע על $y$. ובהוכחה של (א)
          לא הנחנו ש-$f$ רציפה: למה 5.2.8(ב) נותנת את הרציפות **לאורך הקטע** מקיום הנגזרת החלקית עליו.
      - kind: result
        text: >-
          (א) $f(x,y)=x^2+f(0,y)$; (ב) $f(x,y)=x^2+1$; (ג) $x^2+\chi(y)$ מקיימת את הנתון ואינה רציפה.

challenge:
  - id: W-5.2-c1
    stars: 1
    objectives: [OBJ-5.2-2]
    prompt: >-
      תהי $E\subseteq\mathbb{R}^n$ קבוצה פתוחה, ו-$f:E\to\mathbb{R}$ פונקציה שכל הנגזרות החלקיות שלה $\partial_1f,\dots,\partial_nf$
      קיימות בכל נקודה של $E$ וחסומות על $E$: יש $M$ עם $|\partial_if(x)|\le M$ לכל $x\in E$ ולכל $i$. הוכיחו ש-$f$
      רציפה על $E$.

      (השוו לטענה 5.2.4: ל-$\frac{xy}{x^2+y^2}$ יש נגזרות חלקיות בכל נקודה, והיא אינה רציפה. מה נכשל שם?)
    answer: >-
      לכל $p$ וכדור $B(p,r)\subseteq E$: $|f(q)-f(p)|\le M\|q-p\|_1\le M\sqrt n\,\|q-p\|_2$ לכל $q\in B(p,r)$. שם
      $\partial_xf(0,y)=\frac1y$ אינה חסומה.
    solution:
      - kind: idea
        text: >-
          מ-$p$ ל-$q$ הולכים קואורדינטה אחת בכל פעם, כמו במדרגות. כל צעד הוא קטע מקביל לציר, ועליו למה 5.2.8 הופכת את
          ההפרש בערכים לנגזרת חלקית כפול אורך הצעד. החסם $M$ על הנגזרות נותן חסם על כל צעד.
      - kind: step
        text: >-
          **1.** יהי $p\in E$. $E$ פתוחה, ולכן יש $r>0$ עם $B(p,r)\subseteq E$. יהי $q\in B(p,r)$, $h=q-p$, ונגדיר
          $p^0=p$ ו-$p^j=p+h_1e_1+\dots+h_je_j$ ל-$j=1,\dots,n$. אז $p^n=q$.
      - kind: step
        text: >-
          **2.** כל נקודה של הקטע מ-$p^{j-1}$ ל-$p^j$ היא $p+h_1e_1+\dots+h_{j-1}e_{j-1}+s\,h_je_j$ עם $0\le s\le1$, והמרחק שלה
          מ-$p$ בריבוע הוא $h_1^2+\dots+h_{j-1}^2+s^2h_j^2\le\|h\|_2^2<r^2$. לכן כל הקטעים מוכלים ב-$B(p,r)\subseteq E$.
      - kind: theorem
        text: >-
          **3.** אם $h_j=0$ אז $p^j=p^{j-1}$. אחרת, $\partial_jf$ קיימת בכל נקודה של הקטע הסגור, ולפי למה 5.2.8 ((ב) ואז (א))
          יש $\xi_j$ על הקטע עם $f(p^j)-f(p^{j-1})=h_j\,\partial_jf(\xi_j)$, ולכן $|f(p^j)-f(p^{j-1})|\le M|h_j|$.
      - kind: computation
        text: >-
          **4.** בסכום טלסקופי ואי-שוויון המשולש:
          $$|f(q)-f(p)|\le\sum_{j=1}^n|f(p^j)-f(p^{j-1})|\le M\|h\|_1 .$$
          ולפי קושי-שוורץ (משפט 1.2.13), $\|h\|_1=\sum|h_j|\cdot1\le\sqrt n\,\|h\|_2$.
      - kind: step
        text: >-
          **5.** יהי $\varepsilon>0$, ו-$\delta=\min\big(r,\frac{\varepsilon}{M\sqrt n+1}\big)$. אם $\|q-p\|_2<\delta$, אז $q\in B(p,r)$ ו-$|f(q)-f(p)|\le M\sqrt n\,\delta<\varepsilon$.
          לכן $f$ רציפה ב-$p$, לכל $p\in E$.
      - kind: check
        text: >-
          איפה נכנסה כל הנחה: הפתיחות בשלב 1 (כדור סביב $p$); קיום הנגזרות **בכל נקודה של הקטעים** בשלב 3; החסימות בשלב 3.
          ל-$\frac{xy}{x^2+y^2}$ (טענה 5.2.4) כל הנגזרות החלקיות קיימות, אבל $\partial_xf(0,y)=\frac1y$ אינה חסומה בשום
          סביבה של הראשית, ולכן התרגיל אינו חל, והפונקציה אכן אינה רציפה שם.
      - kind: result
        text: >-
          $f$ רציפה על $E$; יותר מזה, על כל כדור $B(p,r)\subseteq E$: $|f(q)-f(p)|\le M\sqrt n\,\|q-p\|_2$.
    source:
      name: "Harvard Math 55b (Honors Real and Complex Analysis), Homework Assignment #8, 26 March 2018; Rudin, Principles of Mathematical Analysis, Chapter 9, Exercise 7"
      year: 2018
      problem: 'Problem 1'
      url: 'https://people.math.harvard.edu/~elkies/M55b.17/p8.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-5.2-c2
    stars: 1
    objectives: [OBJ-5.2-3]
    prompt: >-
      יהי $S=\{x\in\mathbb{R}^2:\ \|x\|_2=1\}$ מעגל היחידה, ותהי $g:S\to\mathbb{R}$ פונקציה עם $g(1,0)=g(0,1)=0$ ו-$g(-x)=-g(x)$
      לכל $x\in S$. נגדיר $f(x)=\|x\|_2\,g\big(\frac{x}{\|x\|_2}\big)$ כש-$x\ne0$, ו-$f(0)=0$.

      (א) הוכיחו ש-$f(tx)=t\,f(x)$ לכל $x\in\mathbb{R}^2$ ולכל $t\in\mathbb{R}$, והסיקו ש-$D_vf(0)=g(v)$ לכל וקטור יחידה $v$.

      (ב) הוכיחו שההעתקה $v\mapsto D_vf(0)$ היא צמצום של העתקה לינארית אם ורק אם $g=0$ בכל $S$.

      (ג) הראו ש-$f(x,y)=\frac{x|y|}{\sqrt{x^2+y^2}}$ (ו-0 בראשית) היא מהצורה הזו, חשבו את $D_vf(0)$, והוכיחו ש-$f$ רציפה בראשית.
    answer: >-
      (א) לכל $t\ne0$ מבחינים בין $t>0$ ל-$t<0$, ומשתמשים ב-$g(-x)=-g(x)$; המנה $\frac{f(tv)}t=g(v)$ קבועה. (ב)
      הצבת $e_1,e_2$ נותנת $c=0$. (ג) $g(x,y)=x|y|$ על $S$; $D_vf(0)=v_1|v_2|$; $|f|\le|y|$.
    solution:
      - kind: idea
        text: >-
          $f$ "לינארית על כל ישר דרך הראשית": היא נקבעת מהערכים של $g$ על המעגל, והאי-זוגיות של $g$ דואגת שגם בצד
          השלילי של הישר השיפוע זהה. לכן כל הנגזרות הכיווניות קיימות, ו-$v\mapsto D_vf(0)$ היא $g$ עצמה, שאינה חייבת
          להיות לינארית.
      - kind: step
        text: >-
          (א) **1.** אם $x=0$ או $t=0$, שני הצדדים 0. אם $t>0$ ו-$x\ne0$: $\|tx\|_2=t\|x\|_2$ ו-$\frac{tx}{\|tx\|_2}=\frac{x}{\|x\|_2}$, ולכן
          $f(tx)=t\|x\|_2\,g(\frac x{\|x\|_2})=tf(x)$.
      - kind: step
        text: >-
          **2.** אם $t<0$ ו-$x\ne0$: $\|tx\|_2=|t|\,\|x\|_2$ ו-$\frac{tx}{\|tx\|_2}=-\frac{x}{\|x\|_2}$, ולכן
          $f(tx)=|t|\,\|x\|_2\,g(-\frac x{\|x\|_2})=-|t|\,\|x\|_2\,g(\frac x{\|x\|_2})=t\,f(x)$.
      - kind: step
        text: >-
          **3.** לווקטור יחידה $v$: $f(v)=g(v)$, ולפי שלבים 1–2, $\frac{f(tv)-f(0)}{t}=\frac{tg(v)}t=g(v)$ לכל $t\ne0$. לכן
          $D_vf(0)=g(v)$.
      - kind: step
        text: >-
          (ב) **4.** אם $g=0$, כל הנגזרות הכיווניות 0: ההעתקה האפס, לינארית. להפך, נניח $D_vf(0)=c\cdot v$ לכל $v\in S$. אז
          $c_1=D_{e_1}f(0)=g(1,0)=0$ ו-$c_2=g(0,1)=0$, כלומר $g(v)=D_vf(0)=0$ לכל $v\in S$.
      - kind: computation
        text: >-
          (ג) **5.** עם $g(x,y)=x|y|$ על $S$: $g(1,0)=0$, $g(0,1)=0$, $g(-x,-y)=-x|y|=-g(x,y)$. ול-$(x,y)\ne0$ עם
          $\rho=\sqrt{x^2+y^2}$: $\rho\,g(\frac x\rho,\frac y\rho)=\rho\cdot\frac{x|y|}{\rho^2}=\frac{x|y|}{\rho}$, שזו $f$.
      - kind: computation
        text: >-
          **6.** לפי (א), $D_vf(0)=g(v)=v_1|v_2|$. בכיוון $\frac1{\sqrt2}(1,1)$ זה $\frac12$, ואילו הנגזרות החלקיות 0: לפי (ב)
          ההעתקה אינה לינארית.
      - kind: step
        text: >-
          **7.** רציפות: $|x|\le\rho$, ולכן $|f(x,y)|=\frac{|x|}{\rho}|y|\le|y|\le\rho$. עם $\delta=\varepsilon$ בהגדרה 1.6.1, $f$
          רציפה בראשית.
      - kind: check
        text: >-
          (א) לא השתמש ברציפות של $g$ בכלל: גם $g$ שאינה רציפה על המעגל נותנת נגזרות כיווניות בכל כיוון. ובהשוואה לשיעור:
          ב-$g$ של טענה 5.2.5 הנגזרות הכיווניות אינן לינאריות ו-$g$ אינה רציפה; כאן הן אינן לינאריות ו-$f$ רציפה, כמו
          $k=\sqrt[3]{x^3+y^3}$ של דוגמה 4. בשיעור 5.3 נסיק שפונקציות כאלה אינן דיפרנציאביליות בראשית (אלא אם $g=0$).
      - kind: result
        text: >-
          (א) $D_vf(0)=g(v)$; (ב) לינארית רק כש-$g=0$; (ג) $D_vf(0)=v_1|v_2|$, ו-$f$ רציפה בראשית.
