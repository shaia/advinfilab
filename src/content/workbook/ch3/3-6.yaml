# Workbook of lesson 3.6 — connectedness and path-connectedness (enrichment).
# Objectives (src/course.ts):
#   OBJ-3.6-1  define connected and path-connected spaces; the connected subsets of the line are the intervals
#   OBJ-3.6-2  the continuous image of a connected set is connected; the intermediate value theorem as a corollary
#   OBJ-3.6-3  an open connected subset of Euclidean space is path-connected; a connected set that is not path-connected
# Results cited by the numbers of the formal spine (3.6.k). Numbers recomputed with npx tsx (W-01 roots, W-02 bound,
# W-10 midpoints).
lesson: '3.6'
practice:
  - id: W-3.6-01
    level: basic
    qualitative: true
    objectives: [OBJ-3.6-1]
    prompt: >-
      קבעו אילו מתת-הקבוצות הבאות של $\mathbb{R}$ קשירות, ונמקו.

      (א) $A=\{x\in\mathbb{R}:\ x^2\ge1\}$.

      (ב) $B=\{x\in\mathbb{R}:\ x^3-x\le0\}$.

      (ג) $C=\{x\in\mathbb{R}:\ x^2+x\le2\}$.

      (ד) $\mathbb{R}\setminus\mathbb{Q}$.
    answer: >-
      (א) לא: $(-\infty,-1]\cup[1,\infty)$. (ב) לא: $(-\infty,-1]\cup[0,1]$. (ג) כן: $[-2,1]$. (ד) לא.
    solution:
      - kind: theorem
        text: >-
          משפט 3.6.5: $E\subseteq\mathbb{R}$ קשירה אם ורק אם היא קטע (הגדרה 3.6.4). לכן בכל סעיף מחפשים שתי נקודות של
          הקבוצה ונקודה ביניהן שאינה בה, או מראים שהקבוצה קטע.
      - kind: step
        text: >-
          (א) $x^2\ge1\iff|x|\ge1$, ולכן $A=(-\infty,-1]\cup[1,\infty)$. $-1,1\in A$ ו-$0\notin A$: $A$ אינה קטע, ולכן
          אינה קשירה.
      - kind: step
        text: >-
          (ב) $x^3-x=(x+1)x(x-1)$. לפי טבלת סימנים, המכפלה $\le0$ בדיוק כש-$x\le-1$ או $0\le x\le1$. $-1,0\in B$
          ו-$-\frac12\notin B$: הערך שם הוא $(-\frac12)^3+\frac12=\frac38>0$. לכן $B$ אינה קשירה.
      - kind: step
        text: >-
          (ג)
          $$\begin{aligned}x^2+x-2&=(x+2)(x-1)\\&\le0\end{aligned}$$
          בדיוק כש-$-2\le x\le1$. $C=[-2,1]$, קטע, ולכן קשירה.
      - kind: step
        text: >-
          (ד) $\frac{\sqrt2}2$ ו-$\sqrt2$ אי-רציונליים, $\frac{\sqrt2}2<1<\sqrt2$, ו-$1\in\mathbb{Q}$. לכן
          $\mathbb{R}\setminus\mathbb{Q}$ אינה קטע, ואינה קשירה.
      - kind: check
        text: >-
          בחישוב: $(-0.5)^3-(-0.5)=0.375>0$, וגם
          $$\begin{aligned}\frac{\sqrt2}2&\approx0.7071<1\\&<1.4142\approx\sqrt2 .\end{aligned}$$
          שימו לב ש-(ד) צפופה
          ב-$\mathbb{R}$ ובכל זאת אינה קשירה: צפיפות אינה קשירות.
      - kind: result
        text: >-
          רק $C=[-2,1]$ קשירה.

  - id: W-3.6-02
    level: basic
    objectives: [OBJ-3.6-2]
    prompt: >-
      יהי $p(x)=a_nx^n+a_{n-1}x^{n-1}+\dots+a_0$ פולינום ממשי ממעלה אי-זוגית $n$, עם $a_n>0$. הוכיחו שיש ל-$p$ שורש
      ממשי, בעזרת מסקנה 3.6.7.
    answer: >-
      עם $M=1+\frac2{a_n}\sum_{k<n}|a_k|$: $p(M)>0>p(-M)$, ו-$\mathbb{R}$ קשיר.
    solution:
      - kind: idea
        text: >-
          לערכים גדולים של $|x|$ האיבר המוביל שולט, ולכן $p$ חיובי רחוק מימין ושלילי רחוק משמאל. ערך הביניים על
          המרחב הקשיר $\mathbb{R}$ נותן אפס.
      - kind: computation
        text: >-
          נסמן $S=\sum_{k=0}^{n-1}|a_k|$ ו-$M=1+\frac{2S}{a_n}$. לכל $x$ עם $|x|\ge M\ge1$ נכתוב
          $p(x)=x^n\big(a_n+q(x)\big)$ עם $q(x)=\sum_{k<n}a_kx^{k-n}$. כיוון ש-$k-n\le-1$ ו-$|x|\ge1$,
          $|x|^{k-n}\le|x|^{-1}$, ולכן $|q(x)|\le\frac S{|x|}\le\frac SM<\frac{a_n}2$.
      - kind: step
        text: >-
          לכן $a_n+q(\pm M)>\frac{a_n}2>0$. $n$ אי-זוגי, ולכן $M^n>0$ ו-$(-M)^n<0$: $p(M)>0$ ו-$p(-M)<0$.
      - kind: theorem
        text: >-
          $p$ רציפה (פולינום, טענה 1.6.5(ג)), ו-$\mathbb{R}$ קשיר (משפט 3.6.5). לפי מסקנה 3.6.7, עם הנקודות $-M$ ו-$M$
          במקום הנקודות שבמסקנה (כאן $p$ הוא שם הפולינום) ועם $y=0$, יש $x$ עם $p(x)=0$.
      - kind: check
        text: >-
          דוגמה: $x^3-5x^2+1$. כאן $S=6$, $M=13$, $p(13)=1353>0$ ו-$p(-13)=-3041<0$. וכשהמעלה זוגית הטענה נכשלת:
          $x^2+1$ אין לו שורש ממשי, כי $(-M)^n>0$ ושני הקצוות חיוביים.
      - kind: result
        text: >-
          לכל פולינום ממשי ממעלה אי-זוגית יש שורש ממשי.

  - id: W-3.6-03
    level: basic
    objectives: [OBJ-3.6-1, OBJ-3.6-3]
    prompt: >-
      $S^1=\{x\in\mathbb{R}^2:\ \|x\|_2=1\}$, מעגל היחידה, עם $d_2$.

      (א) הוכיחו ש-$S^1$ קשיר מסילתית, ולכן קשיר.

      (ב) הוכיחו ש-$S^1$ אינו קמור, כך שטענה 3.6.11(א) אינה חלה עליו.
    answer: >-
      (א) מסילות $t\mapsto(\cos t\theta,\sin t\theta)$ מ-$(1,0)$, ולמה 3.6.9א(ג); משפט 3.6.10. (ב) אמצע הקטע
      בין $(1,0)$ ל-$(-1,0)$ הוא $0\notin S^1$.
    solution:
      - kind: idea
        text: >-
          כל נקודה של המעגל היא $(\cos\theta,\sin\theta)$; "סובבים" את הזווית מ-$0$ ל-$\theta$. מספיק לחבר כל נקודה
          לנקודה קבועה אחת.
      - kind: step
        text: >-
          (א) תהי $x\in S^1$. לפי טריגונומטריה (אינפי 1) יש $\theta\in[0,2\pi)$ עם $x=(\cos\theta,\sin\theta)$. נגדיר
          $\gamma(t)=(\cos t\theta,\sin t\theta)$ ל-$t\in[0,1]$. $\|\gamma(t)\|_2^2=\cos^2+\sin^2=1$, ולכן $\gamma(t)\in S^1$;
          $\gamma(0)=(1,0)$ ו-$\gamma(1)=x$.
      - kind: step
        text: >-
          $\gamma$ רציפה: שתי הקואורדינטות רציפות (אינפי 1), ולפי משפט 1.5.9 ומשפט 1.6.3 גם $\gamma$ ל-$(\mathbb{R}^2,d_2)$.
          לפי למה 3.6.5א היא רציפה גם ל-$S^1$, ולכן היא מסילה ב-$S^1$ מ-$(1,0)$ ל-$x$.
      - kind: theorem
        text: >-
          לפי למה 3.6.9א(ג) עם $p_0=(1,0)$, $S^1$ קשיר מסילתית, ולפי משפט 3.6.10 הוא קשיר.
      - kind: step
        text: >-
          (ב) $(1,0),(-1,0)\in S^1$, ועם $t=\frac12$: $\frac12(1,0)+\frac12(-1,0)=(0,0)$, ו-$\|(0,0)\|_2=0\ne1$.
      - kind: check
        text: >-
          (ב) מראה שהקשירות כאן אינה באה מקמירות. ובאותה דרך: המסילה כאן אינה פוליגונלית, ולמעשה במעגל אין שום קטע
          לא מנוון (ההערה אחרי משפט 3.6.12); המעגל אינו פתוח במישור, כך שמשפט 3.6.12 לא מבטיח קו שבור.
      - kind: result
        text: >-
          $S^1$ קשיר מסילתית וקשיר, ואינו קמור.

  - id: W-3.6-04
    level: mid
    objectives: [OBJ-3.6-2]
    prompt: >-
      הוכיחו שאין פונקציה רציפה $f:[0,1]\to\mathbb{R}$ שמעבירה כל נקודה רציונלית של $[0,1]$ למספר אי-רציונלי וכל
      נקודה אי-רציונלית של $[0,1]$ למספר רציונלי.
    answer: >-
      $f([0,1])$ קטע שמוכל באיחוד של שתי קבוצות בנות מנייה, ולכן נקודה אחת $c$; אבל $f(0)$ אי-רציונלי ו-$f(\frac{\sqrt2}2)$
      רציונלי.
    solution:
      - kind: idea
        text: >-
          התמונה קשירה, כלומר קטע. אבל היא מוכלת בקבוצה בת מנייה, וקטע עם שתי נקודות אינו בן מנייה. לכן $f$ קבועה,
          וקבוע אחד אינו יכול להיות גם רציונלי וגם אי-רציונלי.
      - kind: theorem
        text: >-
          $[0,1]$ קשיר (משפט 3.6.5), ולפי משפט 3.6.6 $I=f([0,1])$ קשירה, ולפי משפט 3.6.5 היא קטע.
      - kind: step
        text: >-
          $$\begin{aligned}I&=f(\mathbb{Q}\cap[0,1])\\&\quad\cup f([0,1]\setminus\mathbb{Q})\\&\subseteq f(\mathbb{Q}\cap[0,1])\cup\mathbb{Q} .\end{aligned}$$
          הקבוצה
          $\mathbb{Q}\cap[0,1]$ בת מנייה (אינפי 1), התמונה של קבוצה בת מנייה היא לכל היותר בת מנייה, ואיחוד של שתי
          קבוצות בנות מנייה בן מנייה. לכן $I$ לכל היותר בת מנייה.
      - kind: step
        text: >-
          אילו היו ב-$I$ שתי נקודות $a<b$, אז $[a,b]\subseteq I$ (הגדרה 3.6.4). אבל $[a,b]$ אינו בן מנייה: $t\mapsto a+t(b-a)$
          היא התאמה חד-חד-ערכית ועל מ-$[0,1]$, ו-$[0,1]$ אינו בן מנייה (מסקנה 2.5.9א). סתירה. לכן $I=\{c\}$: $f\equiv c$.
      - kind: step
        text: >-
          $0\in\mathbb{Q}$, ולכן $c=f(0)\notin\mathbb{Q}$; ו-$\frac{\sqrt2}2\in[0,1]$ אי-רציונלי, ולכן $c=f(\frac{\sqrt2}2)\in\mathbb{Q}$.
          סתירה.
      - kind: check
        text: >-
          בלי רציפות יש פונקציה כזו: $f(x)=\sqrt2$ ל-$x$ רציונלי ו-$f(x)=0$ לאי-רציונלי. וההוכחה השתמשה בקשירות של התחום
          בלבד, לא בקומפקטיות שלו.
      - kind: result
        text: >-
          אין פונקציה רציפה כזו.

  - id: W-3.6-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.6-1, OBJ-3.6-2]
    prompt: >-
      הוכיחו או הפריכו.

      (א) התמונה הרציפה של קבוצה שאינה קשירה אינה קשירה.

      (ב) אם $X$ קשיר ו-$f:X\to\mathbb{R}$ רציפה עם $f(x)\in\mathbb{Z}$ לכל $x$, אז $f$ קבועה.

      (ג) אם $A\subseteq\mathbb{R}^2$ ושתי ההטלות שלה, $\pi_1(A)$ ו-$\pi_2(A)$, הן קטעים, אז $A$ קשירה.

      (ד) אם $A\subseteq\mathbb{R}^2$ קשירה, אז $\pi_1(A)$ ו-$\pi_2(A)$ קטעים.
    answer: >-
      (א) לא נכון. (ב) נכון. (ג) לא נכון: שני קטעים מקבילים. (ד) נכון.
    solution:
      - kind: step
        text: >-
          (א) הפרכה: $\{0,1\}\subseteq\mathbb{R}$ אינה קשירה (אינה קטע, משפט 3.6.5), והפונקציה הקבועה $0$ רציפה ומעבירה
          אותה ל-$\{0\}$, קשירה.
      - kind: step
        text: >-
          (ב) הוכחה: לפי משפטים 3.6.6 ו-3.6.5, $f(X)$ קטע. אילו היו בו שני שלמים $m<n$, אז $m+\frac12\in f(X)$ (הגדרה
          3.6.4), והוא אינו שלם. לכן $f(X)$ יחידון (או ריקה, כש-$X=\emptyset$): $f$ קבועה.
      - kind: computation
        text: >-
          (ג) הפרכה: $A_1=\{(t,t):\ t\in[0,1]\}$, $A_2=\{(t,t+\frac12):\ t\in[0,1]\}$, $A=A_1\cup A_2$. אז
          $\pi_1(A)=[0,1]$ ו-$\pi_2(A)=[0,1]\cup[\frac12,\frac32]=[0,\frac32]$, שני קטעים.
      - kind: step
        text: >-
          $g(x)=x_2-x_1$ רציפה (טענה 1.6.5(ג)), $g=0$ על $A_1$ ו-$g=\frac12$ על $A_2$. $W_1=A\cap\{g<\frac14\}=A_1$ ו-$W_2=A\cap\{g>\frac14\}=A_2$
          פתוחות ב-$A$ (מסקנה 1.6.7(א), משפט 1.3.11), זרות, לא ריקות, ואיחודן $A$: $A$ אינה קשירה.
      - kind: step
        text: >-
          (ד) הוכחה: $\pi_1,\pi_2$ רציפות (טענה 1.6.5(ג)); לפי משפט 3.6.6 $\pi_i(A)$ קשירות, ולפי משפט 3.6.5 הן קטעים.
      - kind: check
        text: >-
          (ב) היא טענה 3.6.2(iii) בתחפושת: פונקציה רציפה ל-$\mathbb{Z}$ על מרחב קשיר. ו-(ג) מראה ש-(ד) אינה הפיכה:
          ההטלות "מדביקות" שני חלקים נפרדים.
      - kind: result
        text: >-
          (א) לא נכון; (ב) נכון; (ג) לא נכון; (ד) נכון.

  - id: W-3.6-06
    level: mid
    objectives: [OBJ-3.6-3]
    prompt: >-
      $U=\mathbb{R}^2\setminus\big(\{0\}\times(-\infty,0]\big)$: המישור בלי חצי הציר האנכי השלילי (כולל הראשית), עם $d_2$.

      (א) הוכיחו ש-$U$ פתוחה וקשירה מסילתית: כל נקודה מתחברת ל-$(0,1)$ בקטע אחד.

      (ב) הוכיחו ש-$\mathbb{R}^2\setminus(\{0\}\times\mathbb{R})$ (המישור בלי כל הציר האנכי) אינה קשירה.
    answer: >-
      (א) הקטע מ-$(a,b)\in U$ אל $(0,1)$ נשאר ב-$U$; למה 3.6.9א(ג). (ב) הפירוק $\{x_1<0\}$, $\{x_1>0\}$.
    solution:
      - kind: idea
        text: >-
          מהנקודה $(0,1)$ "רואים" את כל $U$: הקטע ממנה לכל נקודה של $U$ אינו פוגע בחצי הציר שהוצא. כשמוציאים את כל הציר,
          אין נקודה כזו, ויש פירוק.
      - kind: step
        text: >-
          (א, פתוחה)
          $$\begin{aligned}L&=\{0\}\times(-\infty,0]\\&=\{x:\ x_1=0\}\\&\quad\cap\{x:\ x_2\le0\} ,\end{aligned}$$
          חיתוך של שתי קבוצות סגורות (מסקנה
          1.6.7(א) עם ההטלות, טענה 1.6.5(ג)), סגור (מסקנה 1.3.8(ב)). לכן $U=\mathbb{R}^2\setminus L$ פתוחה.
      - kind: step
        text: >-
          (א, הקטע) יהי $(a,b)\in U$, ונגדיר
          $$\begin{aligned}&\sigma(t)\\&\quad=(1-t)(a,b)+t(0,1)\\&\quad=\big((1-t)a,\ (1-t)b+t\big) .\end{aligned}$$
          אם $a\ne0$: ל-$t<1$ הקואורדינטה
          הראשונה $(1-t)a\ne0$, ולכן $\sigma(t)\notin L$; ו-$\sigma(1)=(0,1)\notin L$. אם $a=0$: כיוון ש-$(0,b)\in U$,
          $b>0$, והקואורדינטה השנייה $(1-t)b+t>0$, ולכן $\sigma(t)\notin L$.
      - kind: theorem
        text: >-
          $\sigma$ מסילה (טענה 3.6.11(א), צעד 1: ליפשיצית) שכולה ב-$U$, מ-$(a,b)$ ל-$(0,1)$. לפי למה 3.6.9א(ג), $U$
          קשירה מסילתית, ולפי משפט 3.6.10 קשירה.
      - kind: step
        text: >-
          (ב) זו הקבוצה $H$ של טענה 3.6.3(ג): $\{x_1<0\}$ ו-$\{x_1>0\}$ פירוק שלה.
      - kind: check
        text: >-
          $U$ אינה קמורה ($(1,-1),(-1,-1)\in U$ ואמצע הקטע $(0,-1)\notin U$), ובכל זאת יש בה נקודה שממנה הקטע לכל נקודה
          נשאר בקבוצה. ב-(ב) אין נקודה כזו: הקטע מ-$(1,0)$ ל-$(-1,0)$ חוצה את הציר.
      - kind: result
        text: >-
          (א) $U$ פתוחה וקשירה מסילתית; (ב) המישור בלי הציר האנכי אינו קשיר.

  - id: W-3.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.6-3, OBJ-3.6-1]
    prompt: >-
      במישור עם $d_2$, תהי $X$ קבוצת הנקודות שלפחות אחת מהקואורדינטות שלהן אי-רציונלית, כלומר
      $X=\mathbb{R}^2\setminus\mathbb{Q}^2$.

      (א) הוכיחו או הפריכו: $X$ קשירה.

      (ב) הוכיחו או הפריכו: $\mathbb{Q}^2$ קשירה.
    answer: >-
      (א) נכון: כל נקודה מתחברת ל-$(\sqrt2,\sqrt2)$ בשני קטעים מקבילים לצירים. (ב) לא נכון.
    solution:
      - kind: idea
        text: >-
          על ישר אנכי $x_1=a$ עם $a$ אי-רציונלי כל הנקודות ב-$X$, וכך גם על ישר אופקי $x_2=c$ עם $c$ אי-רציונלי.
          הולכים לאורך ישרים כאלה אל נקודה קבועה.
      - kind: step
        text: >-
          (א) נסמן $c=\sqrt2$ ו-$w=(c,c)\in X$. תהי $(a,b)\in X$. אם $a\notin\mathbb{Q}$: הקטע האנכי מ-$(a,b)$ ל-$(a,c)$
          מורכב מנקודות $(a,s)$, כולן ב-$X$; והקטע האופקי מ-$(a,c)$ ל-$w$ מנקודות $(s,c)$, כולן ב-$X$.
      - kind: step
        text: >-
          אם $a\in\mathbb{Q}$, אז $b\notin\mathbb{Q}$: הקטע האופקי מ-$(a,b)$ ל-$(c,b)$ מנקודות $(s,b)\in X$, והקטע
          האנכי מ-$(c,b)$ ל-$w$ מנקודות $(c,s)\in X$.
      - kind: theorem
        text: >-
          כל קטע הוא מסילה (טענה 3.6.11(א), צעד 1), ושרשור של שניים מסילה (למה 3.6.9א(ב)). לפי למה 3.6.9א(ג), $X$
          קשירה מסילתית, ולפי משפט 3.6.10 קשירה.
      - kind: step
        text: >-
          (ב) $V_1=\mathbb{Q}^2\cap\{x_1<c\}$ ו-$V_2=\mathbb{Q}^2\cap\{x_1>c\}$ פתוחות ב-$\mathbb{Q}^2$ (מסקנה 1.6.7(א),
          משפט 1.3.11), זרות, לא ריקות ($(0,0)$ ו-$(2,0)$), ואיחודן $\mathbb{Q}^2$ כי ל-$x\in\mathbb{Q}^2$, $x_1\ne\sqrt2$.
          לכן $\mathbb{Q}^2$ אינה קשירה.
      - kind: check
        text: >-
          $X$ אינה פתוחה (כל כדור פוגש את $\mathbb{Q}^2$, משפט 1.4.16), ולכן משפט 3.6.12 לא היה עוזר כאן; המסילות
          נבנו ביד. וב-$\mathbb{R}$ המקבילה נכשלת: $\mathbb{R}\setminus\mathbb{Q}$ אינה קשירה (W-3.6-01(ד)). זה עוד מקרה
          של ההבדל בין הישר למישור.
      - kind: result
        text: >-
          (א) $X$ קשירה, ואף קשירה מסילתית; (ב) $\mathbb{Q}^2$ אינה קשירה.

  - id: W-3.6-08
    level: exam
    objectives: [OBJ-3.6-2]
    prompt: >-
      $S^1$ מעגל היחידה במישור, עם $d_2$.

      (א) תהי $f:S^1\to\mathbb{R}$ רציפה. הוכיחו שיש $x\in S^1$ עם $f(x)=f(-x)$.

      (ב) הסיקו שאין פונקציה רציפה וחד-חד-ערכית מ-$S^1$ ל-$\mathbb{R}$.
    answer: >-
      (א) $g(x)=f(x)-f(-x)$ רציפה, $g(-x)=-g(x)$, ו-$S^1$ קשיר: מסקנה 3.6.7. (ב) $f(x)=f(-x)$ עם $x\ne-x$.
    solution:
      - kind: idea
        text: >-
          ההפרש $g(x)=f(x)-f(-x)$ מחליף סימן כשעוברים לנקודה הנגדית. על מרחב קשיר, פונקציה רציפה שמקבלת ערך חיובי
          וערך שלילי מתאפסת.
      - kind: step
        text: >-
          (א) $S^1$ קשיר: הוא $\gamma([0,1])$ עבור $\gamma(t)=(\cos2\pi t,\sin2\pi t)$, רציפה (משפט 1.5.9, משפט 1.6.3),
          ו-$[0,1]$ קשיר (משפטים 3.6.5, 3.6.6).
      - kind: step
        text: >-
          $x\mapsto-x$ שומרת מרחקים ($\|(-x)-(-y)\|_2=\|x-y\|_2$) ומעבירה את $S^1$ לעצמו, ולכן רציפה. לכן
          $g(x)=f(x)-f(-x)$ רציפה על $S^1$ (טענה 1.6.5), ומתקיים
          $$\begin{aligned}g(-x)&=f(-x)-f(x)\\&=-g(x) .\end{aligned}$$
      - kind: step
        text: >-
          נקבע $x_0\in S^1$. אם $g(x_0)=0$ סיימנו. אחרת $g(x_0)$ ו-$g(-x_0)=-g(x_0)$ בסימנים מנוגדים; לפי מסקנה 3.6.7
          (על המרחב הקשיר $S^1$, עם $y=0$) יש $x$ עם $g(x)=0$, כלומר $f(x)=f(-x)$.
      - kind: step
        text: >-
          (ב) לכל $x\in S^1$, $-x\ne x$ (אחרת $x=0\notin S^1$). לפי (א), לכל $f$ רציפה יש $x$ עם $f(x)=f(-x)$, ולכן
          $f$ אינה חד-חד-ערכית.
      - kind: check
        text: >-
          דוגמה: $f(x)=x_1$ (ההטלה). $g(x)=2x_1$, והאפסים הם $(0,\pm1)$: אכן $f(0,1)=f(0,-1)=0$. ההנחה "רציפה"
          נחוצה: הזווית $\theta(x)\in[0,2\pi)$ חד-חד-ערכית על $S^1$, ואינה רציפה ב-$(1,0)$ (טענה 1.6.10(ג)).
      - kind: result
        text: >-
          (א) לכל $f$ רציפה יש זוג נקודות נגדיות עם אותו ערך; (ב) לכן אין $f:S^1\to\mathbb{R}$ רציפה וחד-חד-ערכית.

  - id: W-3.6-09
    level: exam
    objectives: [OBJ-3.6-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי. לכל $x\in X$ נגדיר את **רכיב הקשירות** של $x$, $C(x)$: האיחוד של כל הקבוצות הקשירות
      $A\subseteq X$ עם $x\in A$.

      (א) הוכיחו ש-$C(x)$ קשירה, ושכל קבוצה קשירה שמכילה את $x$ מוכלת בה.

      (ב) הוכיחו ש-$C(x)$ סגורה ב-$X$.

      (ג) הוכיחו שלכל $x,y$: $C(x)=C(y)$ או $C(x)\cap C(y)=\emptyset$.

      (ד) מצאו את רכיבי הקשירות של $\mathbb{Q}$ ושל $\mathbb{R}\setminus\{0\}$.
    answer: >-
      (א) טענה 3.6.8(א) עם הנקודה המשותפת $x$. (ב) $\overline{C(x)}$ קשירה ומכילה את $x$. (ג) איחוד עם נקודה משותפת. (ד)
      ב-$\mathbb{Q}$ היחידונים; ב-$\mathbb{R}\setminus\{0\}$, $(-\infty,0)$ ו-$(0,\infty)$.
    solution:
      - kind: idea
        text: >-
          $C(x)$ היא "הקבוצה הקשירה הגדולה ביותר" שמכילה את $x$. כל מה שצריך הוא טענה 3.6.8: איחוד עם נקודה משותפת
          קשיר, וסגור של קשירה קשיר.
      - kind: step
        text: >-
          (א) משפחת הקבוצות הקשירות $A\subseteq X$ עם $x\in A$ אינה ריקה: $\{x\}$ קשיר. לכל איבריה הנקודה המשותפת $x$, ולפי
          טענה 3.6.8(א) האיחוד $C(x)$ קשיר. כל $A$ קשירה עם $x\in A$ היא אחד האיברים, ולכן $A\subseteq C(x)$.
      - kind: step
        text: >-
          (ב) לפי טענה 3.6.8(ב), $\overline{C(x)}$ קשירה, והיא מכילה את $x$. לפי (א), $\overline{C(x)}\subseteq C(x)$. תמיד
          $C(x)\subseteq\overline{C(x)}$, ולכן הן שוות, ולפי טענה 1.4.4(ג) $C(x)$ סגורה.
      - kind: step
        text: >-
          (ג) נניח $z\in C(x)\cap C(y)$. לפי (א) ולפי טענה 3.6.8(א) (נקודה משותפת $z$), $C(x)\cup C(y)$ קשירה, ומכילה את $x$;
          לפי (א) היא מוכלת ב-$C(x)$, ולכן $C(y)\subseteq C(x)$. באופן סימטרי, בהחלפת $x$ ו-$y$ באותם צעדים,
          $C(x)\subseteq C(y)$.
      - kind: step
        text: >-
          (ד) ב-$\mathbb{Q}$: לפי טענה 3.6.3(ב), לכל קבוצה קשירה יש לכל היותר נקודה אחת, ולכן $C(q)=\{q\}$. ב-$\mathbb{R}\setminus\{0\}$:
          יהי $x>0$. $(0,\infty)$ קטע, קשיר, ומכיל את $x$, ולכן $(0,\infty)\subseteq C(x)$. להפך, $C(x)$ קשירה, ולפי
          משפט 3.6.5 היא קטע; אילו הייתה בה $a<0$, אז $0\in C(x)$ (הגדרה 3.6.4, $a<0<x$), אבל $0\notin\mathbb{R}\setminus\{0\}$.
          לכן $C(x)=(0,\infty)$, ובאותו חישוב עם $x<0$, $C(x)=(-\infty,0)$.
      - kind: check
        text: >-
          ב-$\mathbb{Q}$ הרכיבים סגורים (כמו ב-(ב)) ואינם פתוחים: $\{q\}$ אינה פתוחה ב-$\mathbb{Q}$. ב-$\mathbb{R}\setminus\{0\}$
          הרכיבים גם פתוחים. בקבוצה פתוחה $U$ של מרחב נורמי הרכיבים תמיד פתוחים: הרכיב של $p$ ב-$U$ הוא הקבוצה $A$ של
          ההוכחה של משפט 3.6.12. צעדים 2–3 שם לא השתמשו בקשירות של $U$, ולכן $A$ ו-$U\setminus A$ פתוחות ב-$U$. $A$
          קשירה מסילתית, ולכן קשירה (משפט 3.6.10), ו-$p\in A$, כך ש-$A\subseteq C(p)$. ולהפך: אם $U\setminus A=\emptyset$
          אז $C(p)\subseteq U=A$; אחרת $A,\ U\setminus A$ פירוק של $U$, ולפי למה 3.6.2א הקבוצה הקשירה $C(p)$, שמכילה את
          $p\in A$, מוכלת ב-$A$.
      - kind: result
        text: >-
          $C(x)$ קשירה, מקסימלית, סגורה; הרכיבים זרים או שווים; ב-$\mathbb{Q}$ הם היחידונים, וב-$\mathbb{R}\setminus\{0\}$
          הם שתי הקרניים הפתוחות.

  - id: W-3.6-10
    level: exam
    qualitative: true
    objectives: [OBJ-3.6-3, OBJ-3.6-1]
    prompt: >-
      **המסרק שהקטע השמאלי שלו הוחלף בנקודה אחת.** במישור עם $d_2$, $D=D'\cup\{(0,1)\}$, כאשר

      $$\begin{aligned}D'&=\big([0,1]\times\{0\}\big)\\&\quad\cup\bigcup_{n\in\mathbb{N}}\big(\{\tfrac1n\}\times[0,1]\big) .\end{aligned}$$

      (א) הוכיחו ש-$D'$ קשירה מסילתית.

      (ב) הוכיחו ש-$D$ קשירה.

      (ג) הוכיחו שכל מסילה ב-$D$ שמתחילה ב-$(0,1)$ קבועה, והסיקו ש-$D$ אינה קשירה מסילתית.
    answer: >-
      (א) כל נקודה מתחברת ל-$(0,0)$ דרך הבסיס. (ב) $(\frac1n,1)\to(0,1)$, וטענה 3.6.8(ב). (ג) קבוצת הזמנים שבהם
      $\gamma(t)=(0,1)$ פתוחה וסגורה ב-$[0,1]$.
    solution:
      - kind: idea
        text: >-
          $D'$ הוא מסרק: בסיס ושיניים. הנקודה $(0,1)$ בסגור שלו, ולכן $D$ קשירה. אבל קרוב ל-$(0,1)$ הקבוצה מתפרקת
          לשיניים נפרדות ולנקודה עצמה, ומסילה שיוצאת מ-$(0,1)$ "לא יכולה לבחור שן" ברגע הראשון.
      - kind: step
        text: >-
          (א) $(0,0)\in D'$. נקודה $(s,0)$ של הבסיס מתחברת ל-$(0,0)$ בקטע אופקי בתוך הבסיס. נקודה $(\frac1n,y)$ מתחברת
          בקטע אנכי ל-$(\frac1n,0)$ (בתוך השן), ומשם בקטע אופקי ל-$(0,0)$. קטעים הם מסילות (טענה 3.6.11(א)), ולפי למה
          3.6.9א(ב),(ג) $D'$ קשירה מסילתית.
      - kind: step
        text: >-
          (ב) $D'$ קשירה (משפט 3.6.10). $(\frac1n,1)\in D'$ ו-$d_2\big((\frac1n,1),(0,1)\big)=\frac1n\to0$, ולכן $(0,1)\in\overline{D'}$
          (משפט 1.5.7(א)). $D'\subseteq D\subseteq\overline{D'}$, ולפי טענה 3.6.8(ב) $D$ קשירה.
      - kind: step
        text: >-
          (ג, הסביבה) נסמן $w=(0,1)$ ו-$W=D\cap B(w,\frac12)$. נקודות הבסיס במרחק $\sqrt{s^2+1}\ge1$ מ-$w$, ולכן כל נקודה
          של $W$ היא $w$ או מהצורה $(\frac1n,y)$. נראה שהקבוצה הקשירה היחידה ב-$W$ שמכילה את $w$ היא $\{w\}$. תהי $E\subseteq W$
          קשירה עם $w\in E$, ונניח בשלילה ש-$(\frac1n,y)\in E$. נגדיר $c=\frac12(\frac1n+\frac1{n+1})$; אז
          $\frac1{n+1}<c<\frac1n$, ולכן $c$ אינו מהצורה $\frac1k$ ואינו $0$: לאף נקודה של $W$ אין $x_1=c$.
      - kind: step
        text: >-
          $E\cap\{x_1<c\}$ ו-$E\cap\{x_1>c\}$ פתוחות ב-$E$ (מסקנה 1.6.7(א), משפט 1.3.11), זרות, איחודן $E$, והראשונה מכילה
          את $w$ והשנייה את $(\frac1n,y)$: פירוק של $E$, סתירה. לכן $E=\{w\}$.
      - kind: step
        text: >-
          (ג, הזמנים) תהי $\gamma:[0,1]\to D$ מסילה עם $\gamma(0)=w$, ו-$T=\{t:\ \gamma(t)=w\}$. $0\in T$. $T$ סגורה: היא
          המקור של היחידון הסגור $\{w\}$ (טענה 1.3.5(ב), משפט 1.6.4). $T$ פתוחה ב-$[0,1]$: ל-$t_0\in T$ יש $\eta>0$ עם
          $\gamma(t)\in B(w,\frac12)$ לכל $t\in I=(t_0-\eta,t_0+\eta)\cap[0,1]$. $I$ קטע, קשיר (משפט 3.6.5), ולכן $\gamma(I)$
          קשירה (משפט 3.6.6), מוכלת ב-$W$ ומכילה את $w=\gamma(t_0)$. לפי הצעד הקודם $\gamma(I)=\{w\}$, כלומר $I\subseteq T$.
      - kind: theorem
        text: >-
          $[0,1]$ קשיר, ו-$T$ פתוחה, סגורה ולא ריקה בו; לפי טענה 3.6.2(ii) $T=[0,1]$: $\gamma\equiv w$. בפרט אין מסילה
          מ-$w$ ל-$(1,0)\in D$, ו-$D$ אינה קשירה מסילתית.
      - kind: check
        text: >-
          $c$ לדוגמה: $n=1$ נותן $c=\frac34$, ו-$n=2$ נותן $c=\frac5{12}$, שניהם בין שני הפכים עוקבים. השוו לעקומת
          הסינוס (טענה 3.6.13): שם מסילה מ-$J$ "חייבת לעבור" דרך פסגות; כאן הנקודה $w$ מבודדת מהשיניים בתוך כל כדור
          קטן. והמסרק **המלא**, עם כל הקטע $\{0\}\times[0,1]$, קשיר מסילתית: יורדים לאורך הקטע לראשית.
      - kind: result
        text: >-
          $D'$ קשירה מסילתית, $D$ קשירה, ו-$D$ אינה קשירה מסילתית: כל מסילה מ-$(0,1)$ קבועה.

challenge:
  - id: W-3.6-c1
    stars: 1
    objectives: [OBJ-3.6-1, OBJ-3.6-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי.

      (א) יהיו $p\in X$ ו-$\delta>0$, $A=\{x:\ d(p,x)<\delta\}$ ו-$B=\{x:\ d(p,x)>\delta\}$. הוכיחו ש-$A$ ו-$B$ פתוחות
      וזרות.

      (ב) נניח ש-$X$ קשיר ויש בו שתי נקודות שונות $p,q$. הוכיחו שלכל $0<\delta<d(p,q)$ יש $x\in X$ עם $d(p,x)=\delta$.

      (ג) הסיקו שמרחב מטרי קשיר עם שתי נקודות לפחות אינו בן מנייה.
    answer: >-
      (א) $x\mapsto d(p,x)$ רציפה. (ב) אחרת $A,B$ פירוק. (ג) $d(p,\cdot)$ מעבירה את $X$ על קבוצה שמכילה את $(0,d(p,q))$.
    solution:
      - kind: idea
        text: >-
          הפונקציה $x\mapsto d(p,x)$ רציפה, ולכן התמונה של מרחב קשיר היא קטע שמכיל את $0$ ואת $d(p,q)$. קטע כזה אינו
          בן מנייה, ופונקציה לא מגדילה מספר נקודות.
      - kind: step
        text: >-
          (א) לפי טענה 1.6.6(א), $f(x)=d(p,x)$ ליפשיצית ולכן רציפה (טענה 1.6.9). לפי מסקנה 1.6.7(א), $A=\{f<\delta\}$
          ו-$B=\{f>\delta\}$ פתוחות; הן זרות כי אין מספר שקטן מ-$\delta$ וגדול ממנו.
      - kind: step
        text: >-
          (ב) נניח בשלילה שאין $x$ עם $d(p,x)=\delta$. אז $X=A\cup B$. $p\in A$ ($d(p,p)=0<\delta$) ו-$q\in B$ ($d(p,q)>\delta$),
          ולפי (א) זה פירוק של $X$, בסתירה לקשירות. (במילים של השיעור: $f(X)$ קטע, לפי משפטים 3.6.6 ו-3.6.5, שמכיל את
          $0$ ואת $d(p,q)$, ולכן את $\delta$.)
      - kind: step
        text: >-
          (ג) לפי (ב), $f(X)\supseteq(0,d(p,q))$. אילו $X$ היה לכל היותר בן מנייה, גם $f(X)$ היה לכל היותר בן מנייה
          (תמונה של קבוצה בת מנייה), וגם הקטע $(0,d(p,q))\subseteq f(X)$. אבל קטע פתוח לא ריק אינו בן מנייה: $[0,1]$ אינו
          בן מנייה (מסקנה 2.5.9א), ו-$t\mapsto\frac{d(p,q)}2\cdot\frac{1+t}{2}$ מעבירה אותו בהתאמה חד-חד-ערכית לתוך
          $(0,d(p,q))$. סתירה.
      - kind: check
        text: >-
          ההנחה "שתי נקודות" נחוצה: מרחב בן נקודה אחת קשיר וסופי. וההנחה "קשיר" נחוצה: $\mathbb{Q}$ בן מנייה (ואינו קשיר,
          טענה 3.6.3(ב)). שימו לב שלא השתמשנו בשלמות, בניגוד למשפט 2.5.9: כאן הקשירות מחליפה את משפט בייר.
      - kind: result
        text: >-
          מרחב מטרי קשיר עם שתי נקודות לפחות אינו בן מנייה.
    source:
      name: 'W. Rudin, Principles of Mathematical Analysis, 3rd ed. (statement as quoted in MIT 18.100C Recitation Homework 3, Fall 2010)'
      year: 1976
      problem: 'Chapter 2, Exercise 19'
      url: 'https://dev.mathcomm.org/wp-content/uploads/Math-100C-Fall-2010-RecitationHomework311.pdf'
      verified: '2026-11-11'
      adapted: true

  - id: W-3.6-c2
    stars: 1
    objectives: [OBJ-3.6-2]
    prompt: >-
      (א) הוכיחו שאין פונקציה רציפה $f:\mathbb{R}\to\mathbb{R}$ שמקבלת כל ערך ממשי בדיוק פעמיים.

      (ב) חזקו: אין פונקציה רציפה $f:\mathbb{R}\to\mathbb{R}$ שמקבלת כל ערך שלה בדיוק פעמיים (כלומר, כל $y$ מתקבל
      אפס פעמים או פעמיים).
    answer: >-
      נניח $f(x_1)=f(x_2)=y_0$ עם $x_1<x_2$, ונקבל ערך שמתקבל שלוש פעמים, בעזרת המקסימום על $[x_1,x_2]$ וערך הביניים.
    solution:
      - kind: idea
        text: >-
          ההוכחה של (ב) מוכיחה גם את (א). בין שתי נקודות עם אותו ערך הפונקציה עולה ויורדת; המקסימום שלה מתקבל פעמיים,
          וערך קצת מתחת למקסימום מתקבל אז שלוש פעמים, לפי ערך הביניים על קטעים.
      - kind: step
        text: >-
          נניח ש-$f$ רציפה וכל ערך שלה מתקבל בדיוק פעמיים. נבחר $x_1<x_2$ עם $f(x_1)=f(x_2)=y_0$. $f$ אינה קבועה על
          $[x_1,x_2]$ (אחרת $y_0$ היה מתקבל אינסוף פעמים). אם $f\le y_0$ על כל $[x_1,x_2]$, נחליף את $f$ ב-$-f$, שגם היא
          רציפה וכל ערך שלה מתקבל בדיוק פעמיים; לכן נניח ש-$f$ מקבלת ב-$[x_1,x_2]$ ערך גדול מ-$y_0$.
      - kind: theorem
        text: >-
          לפי משפט ויירשטראס (מסקנה 3.4.3, או אינפי 1) $f$ מקבלת על $[x_1,x_2]$ מקסימום $M>y_0$, בנקודה $x_0$, ו-$x_0\ne x_1,x_2$
          כי שם הערך $y_0<M$. $M$ ערך של $f$, ולכן הוא מתקבל בדיוק פעמיים: ב-$x_0$ ובעוד נקודה $z\ne x_0$.
      - kind: step
        text: >-
          (מקרה 1: $z\in[x_1,x_2]$) אז $z\in(x_1,x_2)$. אם $z<x_0$ נחליף את $f$ ב-$x\mapsto f(-x)$ (וגם את $x_1,x_2,x_0,z$
          בנגדיים שלהם, בסדר הפוך), כך שנניח $x_0<z$. נבחר $w\in(x_0,z)$; $f(w)<M$, כי $M$ מתקבל רק ב-$x_0$ וב-$z$. נבחר
          $y$ עם $\max(y_0,f(w))<y<M$. לפי מסקנה 3.6.7 על הקטעים הקשירים $[x_1,x_0]$, $[x_0,w]$, $[w,z]$ יש נקודות
          $a\in(x_1,x_0)$, $b\in(x_0,w)$, $c\in(w,z)$ עם $f=y$ בכולן: שלוש נקודות שונות, סתירה.
      - kind: step
        text: >-
          (מקרה 2: $z\notin[x_1,x_2]$) אם $z<x_1$ נחליף שוב את $f$ ב-$x\mapsto f(-x)$, כך שנניח $z>x_2$. נבחר $y$ עם $y_0<y<M$.
          לפי מסקנה 3.6.7 על $[x_1,x_0]$ ($f(x_1)=y_0<y<M$), על $[x_0,x_2]$ ($f(x_2)=y_0<y<M=f(x_0)$) ועל $[x_2,z]$
          ($f(x_2)=y_0<y<M=f(z)$) יש שלוש נקודות שונות, אחת בכל קטע פתוח $(x_1,x_0)$, $(x_0,x_2)$, $(x_2,z)$, עם $f=y$.
          סתירה.
      - kind: step
        text: >-
          (א) נובע מ-(ב): פונקציה שמקבלת **כל** ערך ממשי בדיוק פעמיים מקבלת בפרט כל ערך שלה בדיוק פעמיים.
      - kind: check
        text: >-
          ההחלפות שומרות על ההנחות: $-f$ ו-$f(-x)$ רציפות, ואת כל ערך שלהן הן מקבלות בדיוק פעמיים. התחום $\mathbb{R}$
          נחוץ למקרה 2 (הנקודה $z$ יכולה להיות כל מקום). על תחום אחר זה נכשל: על $[-1,0)\cup(0,1]$, $f(x)=|x|$ מקבלת כל
          ערך שלה, כל מספר ב-$(0,1]$, בדיוק פעמיים, והתחום אינו קשיר.
      - kind: result
        text: >-
          אין פונקציה רציפה $\mathbb{R}\to\mathbb{R}$ שמקבלת כל ערך שלה בדיוק פעמיים, ובפרט אף אחת שמקבלת כל ערך ממשי
          בדיוק פעמיים.
