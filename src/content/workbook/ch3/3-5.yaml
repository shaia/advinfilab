# Workbook of lesson 3.5 — equivalence of norms.
# Objectives (src/course.ts):
#   OBJ-3.5-1  define equivalent norms; equivalent norms give the same convergent sequences and the same open sets
#   OBJ-3.5-2  prove that all norms on Euclidean space are equivalent, using the compactness of the unit sphere
#   OBJ-3.5-3  every linear map on Euclidean space is continuous; the sup norm and the integral norm on C[0,1] are not equivalent
# Results cited by the numbers of the chapter-3 spine (3.k.j). Every number recomputed with npx tsx (extremes of the
# norms on the unit circle by sampling 360000 directions; integrals by the midpoint rule; the operator norm of J by
# src/math/multivar.ts opNorm).
lesson: '3.5'
practice:
  - id: W-3.5-01
    level: basic
    objectives: [OBJ-3.5-1]
    prompt: >-
      על $\mathbb{R}^2$ נגדיר $N(x)=2|x_1|+3|x_2|$.

      (א) הוכיחו ש-$N$ נורמה.

      (ב) מצאו את הקבועים הטובים ביותר $m,M$ ב-$m\|x\|_2\le N(x)\le M\|x\|_2$, והוכיחו שאי אפשר לשפר אותם.

      (ג) אותו הדבר עם $\|\cdot\|_\infty$ במקום $\|\cdot\|_2$.
    answer: >-
      (ב) $m=2$, $M=\sqrt{13}$. (ג) $2\|x\|_\infty\le N(x)\le5\|x\|_\infty$.
    solution:
      - kind: idea
        text: >-
          חסם עליון: קושי-שוורץ מול הווקטור $(2,3)$, או "כל קואורדינטה לכל היותר המקסימום". חסם תחתון: מחליפים את
          המקדמים בקטן שבהם. בכל חסם מוצאים וקטור שבו יש שוויון.
      - kind: step
        text: >-
          (א) (N1): $N\ge0$, ו-$N(x)=0$ רק כש-$x_1=x_2=0$. (N2):
          $$\begin{aligned}N(\lambda x)&=2|\lambda||x_1|+3|\lambda||x_2|\\&=|\lambda|N(x) .\end{aligned}$$
          (N3): $|x_i+y_i|\le|x_i|+|y_i|$ לכל $i$; כופלים ב-2 וב-3 ומחברים.
      - kind: step
        text: >-
          (ב) עליון: לפי קושי-שוורץ לווקטורים $(|x_1|,|x_2|)$ ו-$(2,3)$,
          $$\begin{aligned}N(x)&\le\sqrt{4+9}\,\|x\|_2\\&=\sqrt{13}\,\|x\|_2 .\end{aligned}$$
          ב-$x=(2,3)$: $N(x)=13=\sqrt{13}\cdot\sqrt{13}$, שוויון.
      - kind: step
        text: >-
          (ב) תחתון (משפט 1.7.3):
          $$\begin{aligned}N(x)&\ge2(|x_1|+|x_2|)\\&=2\|x\|_1\ge2\|x\|_2 .\end{aligned}$$
          ב-$x=(1,0)$: $N(x)=2=2\|x\|_2$, שוויון.
          בשני המקרים, וקטור שבו יש שוויון מראה שאי אפשר לשפר את הקבוע (כמו שלב 5 של משפט 3.5.5).
      - kind: step
        text: >-
          (ג)
          $$\begin{aligned}N(x)&\le(2+3)\max(|x_1|,|x_2|)\\&=5\|x\|_\infty ,\end{aligned}$$
          עם שוויון ב-$(1,1)$. ו-$N(x)\ge2|x_1|$ וגם
          $N(x)\ge3|x_2|\ge2|x_2|$, ולכן $N(x)\ge2\|x\|_\infty$, עם שוויון ב-$(1,0)$.
      - kind: check
        text: >-
          בדגימה של $N$ על המעגל $\|x\|_2=1$ ב-360000 כיוונים: מינימום $2$ ומקסימום $3.60555\approx\sqrt{13}$. היחס
          $N/\|\cdot\|_\infty$ נע בין $2$ ל-$5$.
      - kind: result
        text: '$2\|x\|_2\le N(x)\le\sqrt{13}\,\|x\|_2$ ו-$2\|x\|_\infty\le N(x)\le5\|x\|_\infty$, כל הקבועים הדוקים.'

  - id: W-3.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.5-1]
    prompt: >-
      בכל סעיף, האם שתי הנורמות שקולות? נמקו.

      (א) על $\mathbb{R}^2$: $N(x)=|x_1|+|x_1-x_2|$ ו-$\|x\|_2$ (הוכיחו קודם ש-$N$ נורמה).

      (ב) על $C[0,1]$: $\|f\|_\infty$ ו-$\|f\|_\infty+|f(1)|$.

      (ג) על $C[0,1]$: $\|f\|_1$ ו-$\|f\|_1+|f(1)|$.
    answer: >-
      (א) כן. (ב) כן. (ג) לא.
    solution:
      - kind: idea
        text: >-
          (א) במימד סופי אין מה לחשב: מספיק לבדוק ש-$N$ נורמה, ומשפט 3.5.5 עושה את השאר. (ב) ו-(ג) הם מימד אינסופי,
          ושם השאלה היא אם הערך בנקודה נשלט על ידי הנורמה.
      - kind: step
        text: >-
          (א) (N1): אם $N(x)=0$ אז $x_1=0$ ו-$x_1=x_2$, ולכן $x=0$. (N2) ו-(N3): כל אחד משני המחוברים הוא ערך מוחלט של
          פונקציונל לינארי, ולכן הומוגני ומקיים את אי-שוויון המשולש; סכום שלהם גם כן. לפי משפט 3.5.5, $N$ שקולה
          ל-$\|\cdot\|_2$. (הקבועים, אם רוצים: בדגימה $\frac1{\sqrt2}\le N/\|\cdot\|_2\le\sqrt5$.)
      - kind: step
        text: >-
          (ב) כמו טענה 3.5.1א(ג), עם הנקודה $1$ במקום $0$: $0\le|f(1)|\le\|f\|_\infty$, ולכן
          $$\begin{aligned}\|f\|_\infty&\le\|f\|_\infty+|f(1)|\\&\le2\|f\|_\infty .\end{aligned}$$
          שקולות.
      - kind: step
        text: >-
          (ג) $N'(f)=\|f\|_1+|f(1)|$ נורמה מאותן סיבות, ו-$\|f\|_1\le N'(f)$. בכיוון השני: $g_n(x)=\max(0,\ 1-n(1-x))$
          ("שן" ליד $1$) רציפה, $g_n(1)=1$ ו-$\|g_n\|_1=\frac1{2n}$ (משולש עם בסיס $\frac1n$ וגובה 1). לכן
          $\frac{N'(g_n)}{\|g_n\|_1}=1+2n\to\infty$, ואין $C$ עם $N'\le C\|\cdot\|_1$.
      - kind: check
        text: >-
          (ג) בחישוב: $\|g_1\|_1=0.5$ ו-$\|g_5\|_1=0.1$, כמו $\frac1{2n}$. ההבדל בין (ב) ל-(ג): הפונקציונל $f\mapsto f(1)$
          רציף ב-$\|\cdot\|_\infty$ ואינו רציף ב-$\|\cdot\|_1$ (טענה 1.8.12(ב)).
      - kind: result
        text: '(א) שקולות (משפט 3.5.5); (ב) שקולות, עם $1$ ו-$2$; (ג) לא שקולות, לפי השיניים $g_n$.'

  - id: W-3.5-03
    level: basic
    objectives: [OBJ-3.5-3]
    prompt: >-
      על $C[0,1]$ נסמן $\|f\|_2=\big(\int_0^1f^2\big)^{1/2}$ (נורמה לפי טענה 1.2.22).

      (א) הוכיחו ש-$\|f\|_1\le\|f\|_2\le\|f\|_\infty$ לכל $f$.

      (ב) הוכיחו שאף אחד משני האי-שוויונים אינו הפיך עם קבוע, בעזרת $f_n(x)=x^n$. הסיקו שאין שתיים שקולות מבין שלוש
      הנורמות.
    answer: >-
      (ב) $\|x^n\|_1=\frac1{n+1}$, $\|x^n\|_2=\frac1{\sqrt{2n+1}}$, $\|x^n\|_\infty=1$; היחסים $\sqrt{2n+1}$
      ו-$\frac{n+1}{\sqrt{2n+1}}$ אינם חסומים.
    solution:
      - kind: idea
        text: >-
          קושי-שוורץ מול הפונקציה הקבועה 1 נותן את האי-שוויון הראשון, וחסימת $f^2$ בקבוע את השני. $x^n$ מרוכזת ליד $1$,
          ולכן כל אחת משלוש הנורמות "רואה" אותה אחרת.
      - kind: step
        text: >-
          (א) לפי קושי-שוורץ במכפלה הפנימית של טענה 1.2.22, עם $|f|$ ו-$1$:

          $$\begin{aligned}\|f\|_1&=\int_0^1|f|\cdot1\\&\le\|f\|_2\Big(\int_0^11\Big)^{1/2}\\&=\|f\|_2 .\end{aligned}$$

          ו-$f^2\le\|f\|_\infty^2$ בכל נקודה, ולכן $\int_0^1f^2\le\|f\|_\infty^2$.
      - kind: computation
        text: >-
          (ב) $\|x^n\|_\infty=1$, $\|x^n\|_1=\int_0^1x^n=\frac1{n+1}$, $\|x^n\|_2^2=\int_0^1x^{2n}=\frac1{2n+1}$.
      - kind: step
        text: >-
          לכן $\frac{\|x^n\|_\infty}{\|x^n\|_2}=\sqrt{2n+1}\to\infty$: אין $C$ עם $\|f\|_\infty\le C\|f\|_2$. ו-

          $$\begin{aligned}\frac{\|x^n\|_2}{\|x^n\|_1}&=\frac{n+1}{\sqrt{2n+1}}\\&\ge\frac{n+1}{\sqrt{2n+2}}\\&=\sqrt{\frac{n+1}2}\to\infty ,\end{aligned}$$

          ולכן אין $C$ עם $\|f\|_2\le C\|f\|_1$.
      - kind: step
        text: >-
          שלושת הזוגות: שקילות של $\|\cdot\|_1$ ו-$\|\cdot\|_2$ דורשת $\|\cdot\|_2\le C\|\cdot\|_1$; של $\|\cdot\|_2$
          ו-$\|\cdot\|_\infty$ דורשת $\|\cdot\|_\infty\le C\|\cdot\|_2$; ושל $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ דורשת
          $\|\cdot\|_\infty\le C\|\cdot\|_1$, ולפי (א) גם $\|\cdot\|_\infty\le C\|\cdot\|_2$. שני האי-שוויונים האלה נשללו
          בשלב הקודם.
      - kind: check
        text: >-
          ב-$n=4$: $\|x^4\|_2=\frac13$, $\|x^4\|_1=\frac15$, והיחס $\frac53=\frac{5}{\sqrt9}$, כמו בנוסחה; בחישוב נומרי
          של האינטגרלים יוצא $1.66667$.
      - kind: result
        text: '$\|f\|_1\le\|f\|_2\le\|f\|_\infty$, ושום שתיים מהשלוש אינן שקולות על $C[0,1]$.'

  - id: W-3.5-04
    level: mid
    qualitative: true
    objectives: [OBJ-3.5-2]
    prompt: >-
      תהי $N:\mathbb{R}^n\to[0,\infty)$ פונקציה שמקיימת (N1) ו-(N2) של נורמה, **ורציפה** על $(\mathbb{R}^n,d_2)$, אבל
      אולי לא את אי-שוויון המשולש.

      (א) הוכיחו שיש $0<m\le M$ עם $m\|x\|_2\le N(x)\le M\|x\|_2$ לכל $x$.

      (ב) על $\mathbb{R}^2$ תהי $N(x)=\big(\sqrt{|x_1|}+\sqrt{|x_2|}\big)^2$. הראו שהיא מקיימת את ההנחות של (א), שאינה
      נורמה, ומצאו את $m$ ואת $M$ הטובים ביותר.
    answer: >-
      (ב) $m=1$ (ב-$(1,0)$), $M=2\sqrt2$ (ב-$\frac{(1,1)}{\sqrt2}$);
      $$\begin{aligned}N(1,1)&=4\\&>N(1,0)+N(0,1)\\&=2 .\end{aligned}$$
    solution:
      - kind: idea
        text: >-
          בהוכחה של משפט 3.5.5 אי-שוויון המשולש שימש רק כדי לקבל רציפות (למה 3.5.4). כאן הרציפות נתונה, ולכן שלבים
          1–5 שם עוברים כמו שהם.
      - kind: step
        text: >-
          (א) הספרה $S=\{\|x\|_2=1\}$ קומפקטית ולא ריקה (שלב 1 של משפט 3.5.5). $N$ רציפה, ולפי מסקנה 3.4.3 מקבלת על $S$
          מינימום $m=N(u)$ ומקסימום $M$. $u\ne0$, ולכן לפי (N1) $m>0$.
      - kind: step
        text: >-
          לכל $x\ne0$, $\frac x{\|x\|_2}\in S$, ולפי (N2)
          $$\begin{aligned}N(x)&=\|x\|_2\,N\big(\tfrac x{\|x\|_2}\big)\\&\in[m\|x\|_2,\ M\|x\|_2] .\end{aligned}$$
          ב-$x=0$ שוויון.
      - kind: step
        text: >-
          (ב) ההנחות: (N1): אם $N(x)=0$ אז $\sqrt{|x_1|}+\sqrt{|x_2|}=0$, סכום של שני מספרים אי-שליליים, ולכן
          $x_1=x_2=0$; (N2): $\sqrt{|\lambda x_i|}=\sqrt{|\lambda|}\sqrt{|x_i|}$, ובריבוע יוצא $|\lambda|$.
          רציפות: $x\mapsto x_i$ רציפה ב-$d_2$ ($|x_i-y_i|\le\|x-y\|_2$), וערך מוחלט, שורש וריבוע רציפים (אינפי 1),
          ולכן ההרכבה רציפה (טענה 1.6.5).
      - kind: step
        text: >-
          אינה נורמה: $N(1,1)=(1+1)^2=4$, ואילו $N(1,0)+N(0,1)=1+1=2$: (N3) נכשלת.
      - kind: computation
        text: >-
          הקבועים: לפי הסימטריה מספיק הרבע הראשון, $x=(\cos t,\sin t)$, $0\le t\le\frac\pi2$. נסמן
          $u=\cos t+\sin t\in[1,\sqrt2]$; אז $\cos t\sin t=\frac{u^2-1}2$, ולכן
          $$\begin{aligned}N&=\cos t+\sin t\\&\quad+2\sqrt{\cos t\sin t}\\&=u+\sqrt{2(u^2-1)} ,\end{aligned}$$
          פונקציה עולה של $u$. המינימום ב-$u=1$ (על הצירים):
          $N=1$. המקסימום ב-$u=\sqrt2$ (באלכסון): $N=\sqrt2+\sqrt2=2\sqrt2$.
      - kind: check
        text: >-
          בדגימה של 360000 כיוונים: מינימום $1$ ומקסימום $2.828427\approx2\sqrt2$. כדור "היחידה" $\{N\le1\}$ אינו קמור
          (הוא נכנס פנימה בין הצירים), כמו שטענה 1.2.11 צופה לפונקציה שאינה מקיימת את (N3).
      - kind: result
        text: >-
          כל פונקציה רציפה עם (N1) ו-(N2) על $\mathbb{R}^n$ חסומה בין שתי כפולות של $\|\cdot\|_2$; עבור
          $(\sqrt{|x_1|}+\sqrt{|x_2|})^2$ הקבועים $1$ ו-$2\sqrt2$.

  - id: W-3.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-3.5-3]
    prompt: >-
      (א) יהי $(V,\|\cdot\|)$ מרחב נורמי ממימד סופי ו-$T:V\to V$ לינארית, חד-חד-ערכית ועל. הוכיחו שיש $c>0$ עם
      $\|Tv\|\ge c\|v\|$ לכל $v$.

      (ב) על $(C[0,1],\|\cdot\|_\infty)$ תהי $J$ העתקת האינטגרל של טענה 1.8.12(א), $(Jf)(x)=\int_0^xf$. הוכיחו ש-$J$
      חד-חד-ערכית, ושאין $c>0$ עם $\|Jf\|_\infty\ge c\|f\|_\infty$ לכל $f$.
    answer: >-
      (א) $T^{-1}$ לינארית על מרחב ממימד סופי, ולכן חסומה (מסקנה 3.5.7). (ב) $f_n(x)=\cos(nx)$:
      $\|f_n\|_\infty=1$, $\|Jf_n\|_\infty\le\frac1n$.
    solution:
      - kind: idea
        text: >-
          "$\|Tv\|\ge c\|v\|$" אומר בדיוק שההפכית חסומה. במימד סופי כל העתקה לינארית חסומה; במימד אינסופי ההפכית של
          $J$ היא גזירה, שאינה חסומה (טענה 1.8.11).
      - kind: step
        text: >-
          (א) $T^{-1}:V\to V$ לינארית (אלגברה לינארית 1). לפי מסקנה 3.5.7 יש $C\ge0$ עם $\|T^{-1}w\|\le C\|w\|$ לכל $w$;
          אם האי-שוויון מתקיים עם $C$ הוא מתקיים גם עם כל קבוע גדול יותר, ולכן אפשר להניח $C>0$. עם $w=Tv$: $\|v\|\le C\|Tv\|$, כלומר $\|Tv\|\ge\frac1C\|v\|$. (אם $V=\{0\}$, כל $c$ מתאים.)
      - kind: step
        text: >-
          (ב) חד-חד-ערכית: אם $Jf=0$, אז לפי המשפט היסודי (אינפי 1) $f=(Jf)'=0$.
      - kind: computation
        text: >-
          $f_n(x)=\cos(nx)$: $\|f_n\|_\infty=1$ (ב-$x=0$), ו-$(Jf_n)(x)=\frac{\sin(nx)}n$, ולכן $\|Jf_n\|_\infty\le\frac1n$.
          אילו $\|Jf\|_\infty\ge c\|f\|_\infty$ לכל $f$, היה $c\le\frac1n$ לכל $n$, כלומר $c\le0$.
      - kind: check
        text: >-
          בחישוב על רשת: $\max_{[0,1]}\big|\frac{\sin(nx)}n\big|$ הוא $\frac13$ ב-$n=3$ ו-$0.05$ ב-$n=20$, כלומר בדיוק
          $\frac1n$ כשהקטע מכיל נקודה שבה $\sin(nx)=\pm1$. איפה נכנס המימד הסופי: רק ב-(א), דרך מסקנה 3.5.7.
      - kind: result
        text: >-
          במימד סופי העתקה לינארית הפיכה מקיימת $\|Tv\|\ge c\|v\|$; ב-$C[0,1]$ ההעתקה $J$ חד-חד-ערכית ואין לה $c$ כזה.

  - id: W-3.5-06
    level: mid
    qualitative: true
    objectives: [OBJ-3.5-1]
    prompt: >-
      יהיו $\|\cdot\|_a,\|\cdot\|_b$ נורמות על מרחב וקטורי ממשי $V$. הוכיחו או הפריכו.

      (א) אם $\|v\|_a\le\|v\|_b$ לכל $v$ ו-$(V,\|\cdot\|_b)$ שלם, אז $(V,\|\cdot\|_a)$ שלם.

      (ב) אם לשתי הנורמות אותן קבוצות פתוחות, הן שקולות. (הוכיחו ישירות, בעזרת הכדור $B_b(0,1)$.)

      (ג) אם לשתי הנורמות אותן קבוצות חסומות, הן שקולות.
    answer: >-
      (א) לא נכון ($C[0,1]$ עם $\|\cdot\|_1\le\|\cdot\|_\infty$). (ב) נכון. (ג) נכון, ובניגוד למטריקות (טענה 1.7.8(ג)).
    solution:
      - kind: idea
        text: >-
          (א) אי-שוויון בכיוון אחד מעביר סדרות קושי בכיוון ההפוך מזה שצריך. (ב) ו-(ג): כדור אחד סביב $0$ שמוכל בכדור
          של הנורמה השנייה, ואחריו הומוגניות (כמו טענה 3.5.1ב).
      - kind: step
        text: >-
          (א) $V=C[0,1]$, $\|\cdot\|_a=\|\cdot\|_1$, $\|\cdot\|_b=\|\cdot\|_\infty$: $\|f\|_1\le\|f\|_\infty$ (טענה 1.2.21(א)),
          $(C[0,1],\|\cdot\|_\infty)$ שלם (מסקנה 2.2.6(ג)) ו-$(C[0,1],\|\cdot\|_1)$ אינו שלם (טענה 2.2.7).
      - kind: step
        text: >-
          (ב) $B_b(0,1)$ פתוח ב-$\|\cdot\|_b$ (משפט 1.3.3), ולכן לפי ההנחה גם ב-$\|\cdot\|_a$; $0$ בו, ולכן יש $\delta>0$
          עם $B_a(0,\delta)\subseteq B_b(0,1)$. לכל $v\ne0$, $w=\frac{\delta}{2\|v\|_a}v$ מקיים $\|w\|_a=\frac\delta2$, ולכן
          $\|w\|_b<1$, כלומר $\|v\|_b<\frac2\delta\|v\|_a$. החלפת התפקידים נותנת את הקבוע השני.
      - kind: step
        text: >-
          (ג) $B_a(0,1)$ חסום ב-$\|\cdot\|_a$, ולכן לפי ההנחה חסום ב-$\|\cdot\|_b$: מוכל באיזה $B_b(u,R)$, ולפי הגדרה וטענה
          1.5.3(ב) ב-$B_b(0,R')$ עם $R'=R+\|u\|_b$. לכל $v\ne0$, $w=\frac{v}{2\|v\|_a}$ מקיים $\|w\|_a=\frac12<1$, ולכן
          $\|w\|_b<R'$, כלומר $\|v\|_b<2R'\|v\|_a$. החלפת התפקידים נותנת את הקבוע השני.
      - kind: check
        text: >-
          (ג) למטריקות זה לא נכון: על $\mathbb{R}$ ל-$|x-y|$ ול-$\sqrt{|x-y|}$ אותן קבוצות חסומות ואותן קבוצות פתוחות,
          והן אינן שקולות ליפשיץ (טענה 1.7.8(ג)). ההבדל הוא (N2): ב-(ג) "ניפחנו" כדור אחד לכל המרחב בעזרת הומוגניות,
          ולמטריקה כללית אין הומוגניות.
      - kind: result
        text: '(א) לא נכון; (ב) נכון; (ג) נכון לנורמות, ולא נכון למטריקות.'

  - id: W-3.5-07
    level: mid
    objectives: [OBJ-3.5-1, OBJ-3.5-2]
    prompt: >-
      על מרחב המטריצות הממשיות $2\times2$ נתבונן בנורמת האופרטור $\|A\|_2$ (ביחס ל-$\|\cdot\|_2$ על $\mathbb{R}^2$)
      ובנורמה $\|A\|_{\max}=\max_{i,j}|a_{ij}|$.

      (א) הסבירו, בלי לחשב, למה הן שקולות.

      (ב) הוכיחו ש-$\|A\|_{\max}\le\|A\|_2\le2\|A\|_{\max}$ לכל $A$, ושאי אפשר לשפר אף קבוע.
    answer: >-
      (ב) שוויון משמאל ב-$I$, ומימין ב-$J=\begin{pmatrix}1&1\\1&1\end{pmatrix}$ ($\|J\|_2=2$).
    solution:
      - kind: idea
        text: >-
          (א) מרחב המטריצות ממימד 4, ולכן מסקנה 3.5.6(א). (ב) כל כניסה היא $\langle e_i,Ae_j\rangle$, וקושי-שוורץ; בכיוון
          השני, חסם פרובניוס.
      - kind: step
        text: >-
          (א) $\|\cdot\|_2$ נורמה על מרחב המטריצות (משפט 1.8.5), ו-$\|\cdot\|_{\max}$ היא $\|\cdot\|_\infty$ על
          $\mathbb{R}^4$ אחרי סידור הכניסות בשורה. המרחב ממימד 4, ולפי מסקנה 3.5.6(א) כל שתי נורמות עליו שקולות.
      - kind: step
        text: >-
          (ב) שמאל: לפי קושי-שוורץ וטענה 1.8.4(א),

          $$\begin{aligned}|a_{ij}|&=|\langle e_i,Ae_j\rangle|\\&\le\|e_i\|_2\,\|Ae_j\|_2\le\|A\|_2 .\end{aligned}$$
      - kind: step
        text: >-
          ימין: לפי טענה 1.8.10ב,

          $$\begin{aligned}\|A\|_2&\le\Big(\sum_{i,j}a_{ij}^2\Big)^{1/2}\\&\le\big(4\|A\|_{\max}^2\big)^{1/2}\\&=2\|A\|_{\max} .\end{aligned}$$
      - kind: computation
        text: >-
          הדיקות: $\|I\|_2=1=\|I\|_{\max}$. $J$ סימטרית עם ערכים עצמיים $0$ ו-$2$ ($J(1,1)=2(1,1)$, $J(1,-1)=0$), ולפי
          מסקנה 1.8.10א $\|J\|_2=2=2\|J\|_{\max}$.
      - kind: check
        text: >-
          `opNorm` של `src/math/multivar.ts` נותן $\|J\|_2=2$ ו-$\|I\|_2=1$. בחסם הימני שני השלבים הדוקים בבת אחת רק כשכל
          הכניסות שוות בערך מוחלט ו-$A$ "בדרגה 1", כמו $J$.
      - kind: result
        text: '$\|A\|_{\max}\le\|A\|_2\le2\|A\|_{\max}$, עם שוויון ב-$I$ וב-$J$.'

  - id: W-3.5-08
    level: exam
    objectives: [OBJ-3.5-2]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי ממימד סופי ו-$W\subseteq V$ תת-מרחב עם $W\ne V$. הוכיחו שיש $v\in V$ עם
      $\|v\|=1$ ו-$\operatorname{dist}(v,W)=1$ (כלומר הלמה של ריס, 3.5.9, נכונה כאן עם $\eta=1$).
    answer: >-
      לוקחים $x\notin W$; המרחק שלו מ-$W$ מתקבל ב-$w_0$ (קומפקטיות), ו-$v=\frac{x-w_0}{\|x-w_0\|}$.
    solution:
      - kind: idea
        text: >-
          בהוכחה של למה 3.5.9 היה צריך $\eta<1$ רק כי המרחק של $x$ מ-$W$ אולי לא מתקבל. במימד סופי הוא מתקבל: מספיק
          לחפש את הנקודה הקרובה בחלק חסום של $W$, וזו קבוצה קומפקטית.
      - kind: step
        text: >-
          יהי $x\in V\setminus W$ ו-$\rho=\operatorname{dist}(x,W)$. $W$ ממימד סופי, ולכן סגור (מסקנה 3.5.6(ג)), ולכן
          $\rho>0$ (טענה 1.6.6(ד), כמו בשלב 2 של למה 3.5.9).
      - kind: step
        text: >-
          נסמן $K=W\cap B[x,\|x\|]$. $0\in K$, כי $\|x-0\|=\|x\|$. $K$ סגורה ב-$W$ (חיתוך של $W$ עם קבוצה סגורה ב-$V$,
          טענה 1.3.5(א) ומסקנה 1.3.12) וחסומה, ו-$W$, עם הצמצום של $\|\cdot\|$, מרחב נורמי ממימד סופי; לפי מסקנה
          3.5.6(ד) $K$ קומפקטית ב-$W$, ולפי טענה 3.2.3 (קומפקטיות היא תכונה פנימית) גם ב-$V$.
      - kind: step
        text: >-
          $\operatorname{dist}(x,W)=\operatorname{dist}(x,K)$, בשני אי-שוויונים. ראשית $K\subseteq W$, ולכן
          $$\begin{aligned}&\{\|x-w\|:\ w\in K\}\\&\quad\subseteq\{\|x-w\|:\ w\in W\} ,\end{aligned}$$
          ואינפימום של קבוצה גדולה יותר אינו גדול יותר:
          $\operatorname{dist}(x,W)\le\operatorname{dist}(x,K)$. שנית, $\operatorname{dist}(x,K)$ חוסם מלרע את
          $\|x-w\|$ לכל $w\in W$: אם $w\in K$ זו הגדרת האינפימום, ואם $w\in W\setminus K$ אז $w\notin B[x,\|x\|]$, כלומר
          (כי $0\in K$)
          $$\begin{aligned}\|x-w\|&>\|x\|=\|x-0\|\\&\ge\operatorname{dist}(x,K) .\end{aligned}$$
          לכן $\operatorname{dist}(x,W)\ge\operatorname{dist}(x,K)$.
          לפי טענה 3.4.10(א) יש $w_0\in K$ עם $\|x-w_0\|=\operatorname{dist}(x,K)=\rho$.
      - kind: step
        text: >-
          $v=\frac{x-w_0}{\rho}$, $\|v\|=1$. לכל $w\in W$, $w_0+\rho w\in W$, ולכן
          $\|v-w\|=\frac{\|x-(w_0+\rho w)\|}{\rho}\ge\frac\rho\rho=1$. ועם $w=0$: $\|v-0\|=1$. לכן $\operatorname{dist}(v,W)=1$.
      - kind: check
        text: >-
          דוגמה: $(\mathbb{R}^2,\|\cdot\|_\infty)$ ו-$W$ הישר דרך $(1,1)$. $v=(1,-1)$: $\|v\|_\infty=1$, ומתקיים
          $$\begin{aligned}&\|v-t(1,1)\|_\infty\\&\quad=\max(|1-t|,|1+t|)\ge1 ,\end{aligned}$$
          עם שוויון ב-$t=0$ (בדגימה של $t$ על רשת: מינימום $1$). אם
          $W=\{0\}$, כל וקטור יחידה מתאים.
      - kind: result
        text: 'במימד סופי יש וקטור יחידה במרחק בדיוק 1 מכל תת-מרחב שונה מ-$V$.'

  - id: W-3.5-09
    level: exam
    objectives: [OBJ-3.5-2, OBJ-3.5-3]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי ממימד אינסופי. הוכיחו שלכל קבוצה קומפקטית $K\subseteq V$ הפנים ריק: $K$ אינה
      מכילה אף כדור פתוח. מה קורה ב-$\mathbb{R}^n$?
    answer: >-
      אילו $B(x,r)\subseteq K$, אז $B[x,\frac r2]$ קומפקטי, ו-$B[0,1]$ הוא תמונה רציפה שלו, בסתירה למשפט 3.5.10. ב-$\mathbb{R}^n$
      $B[0,1]$ קומפקטי ופנימו לא ריק.
    solution:
      - kind: idea
        text: >-
          כל כדור סגור הוא "עותק" של כדור היחידה הסגור, אחרי הזזה ומתיחה, ופעולות אלה רציפות. לכן כדור סגור קומפקטי
          אחד היה נותן כדור יחידה קומפקטי.
      - kind: step
        text: >-
          נניח $B(x,r)\subseteq K$ עם $r>0$. אז $B[x,\frac r2]\subseteq B(x,r)\subseteq K$. $B[x,\frac r2]$ סגור (טענה 1.3.5(א)),
          ותת-קבוצה סגורה של קבוצה קומפקטית קומפקטית (טענה 3.2.6). לכן $B[x,\frac r2]$ קומפקטי.
      - kind: step
        text: >-
          $g(v)=\frac2r(v-x)$ ליפשיצית עם קבוע $\frac2r$, ולכן רציפה. היא שולחת את $B[x,\frac r2]$ **על** $B[0,1]$: אם
          $\|v-x\|\le\frac r2$ אז $\|g(v)\|\le1$, ולכל $u\in B[0,1]$ הנקודה $x+\frac r2u$ בכדור ו-$g(x+\frac r2u)=u$.
      - kind: step
        text: >-
          לפי משפט 3.4.1 $B[0,1]=g(B[x,\frac r2])$ קומפקטי, ולפי משפט 3.5.10 $V$ ממימד סופי. סתירה.
      - kind: check
        text: >-
          ב-$\mathbb{R}^n$ הטענה נכשלת: $B[0,1]$ קומפקטי (משפט 3.5.10) ומכיל את $B(0,1)$. ב-$C[0,1]$ המסקנה אומרת למשל
          שהקבוצה $L$ של טענה 3.3.10(א), שהיא קומפקטית, אינה מכילה אף כדור של $\|\cdot\|_\infty$.
      - kind: result
        text: 'במרחב נורמי ממימד אינסופי לכל קבוצה קומפקטית פנים ריק.'

  - id: W-3.5-10
    level: exam
    qualitative: true
    objectives: [OBJ-3.5-1, OBJ-3.5-3]
    prompt: >-
      (א) יהי $V$ מרחב נורמי ממימד אינסופי ו-$S=\{v:\ \|v\|=1\}$. הוכיחו ש-$S$ סגורה וחסומה ואינה קומפקטית.

      (ב) הוכיחו או הפריכו: יש על $C[0,1]$ נורמה (לא בהכרח שקולה ל-$\|\cdot\|_\infty$) שכדור היחידה הסגור שלה קומפקטי.

      (ג) על $C[0,1]$ עם $\|f\|_2=\big(\int_0^1f^2\big)^{1/2}$, מצאו במפורש סדרה של וקטורי יחידה $u_n$ עם
      $\|u_n-u_m\|_2=\sqrt2$ לכל $n\ne m$, בעזרת האוהלים $t_n$.
    answer: >-
      (א) הסדרה של משפט 3.5.10 נמצאת ב-$S$. (ב) לא נכון. (ג) $u_n=\sqrt{3\cdot2^n}\,t_n$.
    solution:
      - kind: idea
        text: >-
          (א) הסדרה $\frac12$-מופרדת של משפט 3.5.10 עשויה מווקטורי יחידה. (ב) משפט 3.5.10 לא תלוי בנורמה, רק במימד.
          (ג) לאוהלים פנימים זרים, ולכן הם "ניצבים" במכפלה הפנימית של $\|\cdot\|_2$.
      - kind: step
        text: >-
          (א) $v\mapsto\|v\|$ ליפשיצית עם קבוע 1 (טענה 1.6.6(ב)), ולכן רציפה (טענה 1.6.9), ולכן $S$ סגורה (מסקנה 1.6.7(א)); $S\subseteq B(0,2)$, ולכן חסומה.
          הסדרה $(v_k)$ משלב 2 של משפט 3.5.10 נמצאת ב-$S$ ו-$\|v_k-v_j\|\ge\frac12$; לפי למה 3.1.4 אין לה תת-סדרה
          מתכנסת, ולכן $S$ אינה קומפקטית סדרתית, ולפי משפט 3.2.10 אינה קומפקטית.
      - kind: step
        text: >-
          (ב) $C[0,1]$ ממימד אינסופי: $1,x,x^2,\dots$ בלתי תלויים (פולינום שמתאפס על $[0,1]$ הוא אפס). לפי משפט 3.5.10,
          לכל נורמה על $C[0,1]$ כדור היחידה הסגור אינו קומפקטי. הטענה לא נכונה.
      - kind: computation
        text: >-
          (ג) אוהל בגובה 1 מעל קטע באורך $\ell$: $\int t^2=2\int_0^{\ell/2}\big(\frac{2x}\ell\big)^2dx=\frac\ell3$. ל-$t_n$,
          $\ell=2^{-n}$, ולכן $\|t_n\|_2^2=\frac{2^{-n}}3$, ו-$u_n=\sqrt{3\cdot2^n}\,t_n$ וקטור יחידה.
      - kind: step
        text: >-
          ל-$n\ne m$ לקטעים $I_n,I_m$ פנימים זרים, ולכן $u_nu_m=0$ בכל נקודה, ו-

          $$\begin{aligned}&\|u_n-u_m\|_2^2\\&=\int u_n^2-2\int u_nu_m+\int u_m^2\\&=1-0+1=2 .\end{aligned}$$
      - kind: check
        text: >-
          בחישוב נומרי: $\|t_1\|_2^2\approx0.166667=\frac16$, $\|t_3\|_2^2\approx0.041667=\frac1{24}$, ו-$\|u_1-u_2\|_2\approx1.414214$.
      - kind: result
        text: >-
          (א) $S$ סגורה וחסומה ואינה קומפקטית; (ב) לא נכון, בשום נורמה; (ג) $u_n=\sqrt{3\cdot2^n}\,t_n$, והמרחק בין כל
          שניים $\sqrt2$.

challenge:
  - id: W-3.5-c1
    stars: 1
    objectives: [OBJ-3.5-1, OBJ-3.5-3]
    prompt: >-
      נסמן ב-$C^1_c[-1,1]$ את הפונקציות $f:[-1,1]\to\mathbb{R}$ שגזירות ברציפות, ומתאפסות בסביבה של כל אחת
      מנקודות הקצה $-1$ ו-$1$. נתבונן בארבע הפונקציות

      $$\begin{aligned}p(f)&=\sup|f|,\\q(f)&=\sup\big(|f|+|f'|\big),\\r(f)&=\sup|f'|,\\s(f)&=\Big|\int_{-1}^1f(x)\,dx\Big|.\end{aligned}$$

      (א) אילו מהן נורמות על $C^1_c[-1,1]$? נמקו בקצרה.

      (ב) אילו זוגות מבין הנורמות שקולים? הוכיחו.
    answer: >-
      (א) $p,q,r$ נורמות, $s$ לא. (ב) $q$ ו-$r$ שקולות ($r\le q\le2r$); $p$ אינה שקולה לאף אחת מהן.
    solution:
      - kind: idea
        text: >-
          ההתאפסות בקצוות היא מה שהופך את $r$ לנורמה: פונקציה עם נגזרת אפס היא קבועה, והקבוע היחיד שמתאפס בקצה הוא $0$.
          אותה התאפסות נותנת $|f|\le\sup|f'|$. בכיוון השני, פונקציה קטנה יכולה להיות תלולה.
      - kind: step
        text: >-
          $C^1_c[-1,1]$ מרחב וקטורי: אם $f$ מתאפסת על $[-1,-1+\alpha)\cup(1-\alpha,1]$ ו-$g$ על אותו דבר עם $\beta$,
          צירוף שלהן מתאפס עם $\min(\alpha,\beta)$.
      - kind: step
        text: >-
          (א) $p$ היא $\|\cdot\|_\infty$ מצומצמת (טענה 1.2.18). $q$: (N1) כי $q\ge p$; (N2) כי
          $|\lambda f|+|\lambda f'|=|\lambda|(|f|+|f'|)$ בכל נקודה, וכפל ב-$|\lambda|\ge0$ עובר דרך הסופרמום; (N3) כי בכל נקודה
          $$\begin{aligned}&|f+g|+|f'+g'|\\&\quad\le(|f|+|f'|)+(|g|+|g'|) .\end{aligned}$$ $r$ היא $\|\cdot\|_\infty$ של $f'$, ו-$f\mapsto f'$ לינארית,
          ולכן (N2), (N3) עוברות מטענה 1.2.18; (N1): אם $f'\equiv0$ אז לפי משפט
          לגרנז' $f$ קבועה, ו-$f(-1)=0$, ולכן $f=0$.
      - kind: step
        text: >-
          $s$ אינה נורמה: עם $b(x)=(1-4x^2)^2$ ל-$|x|\le\frac12$ ו-$b=0$ אחרת ($b$ גזירה ברציפות: $b(\pm\frac12)=0$
          ו-$b'(x)=-16x(1-4x^2)$ מתאפסת ב-$\pm\frac12$), הפונקציה $f(x)=x\,b(x)$ אי-זוגית, שונה מאפס, ב-$C^1_c$, ו-$s(f)=0$.
      - kind: step
        text: >-
          (ב) $p\le r$: לכל $x$, $f(-1)=0$ ולפי משפט לגרנז'
          $$\begin{aligned}|f(x)|&=|f(x)-f(-1)|\\&\le(x+1)\,r(f) ;\end{aligned}$$
          וגם $f(1)=0$, ולפי משפט לגרנז'
          $$\begin{aligned}|f(x)|&=|f(1)-f(x)|\\&\le(1-x)\,r(f) .\end{aligned}$$
          לכן
          $$\begin{aligned}&|f(x)|\\&\quad\le\min(1+x,1-x)\,r(f)\\&\quad\le r(f) .\end{aligned}$$
      - kind: step
        text: >-
          $q$ ו-$r$ שקולות: $r\le q$ כי $|f'|\le|f|+|f'|$, ומתקיים
          $$\begin{aligned}q&\le\sup|f|+\sup|f'|\\&=p+r\le2r .\end{aligned}$$
      - kind: step
        text: >-
          $p$ אינה שקולה ל-$r$: $f_n(x)=b(x)\sin(nx)$ ב-$C^1_c$, $p(f_n)\le1$, ומתקיים
          $$\begin{aligned}&f_n'(0)\\&\quad=b'(0)\sin0+n\,b(0)\cos0\\&\quad=n ,\end{aligned}$$
          ולכן
          $r(f_n)\ge n$. אין $C$ עם $r\le Cp$. ו-$p$ אינה שקולה ל-$q$: אחרת, כי $q\sim r$, לפי טענה 3.5.2(א) גם $p\sim r$.
      - kind: check
        text: >-
          בדגימה על רשת: $p(f_5)\approx0.595$, $r(f_5)=5$; $p(f_{50})\approx0.992$, $r(f_{50})=50$. ו-$\int_{-1}^1x\,b(x)\,dx=0$
          לפי אי-זוגיות (נומרית $\approx10^{-18}$). זו דוגמה במימד אינסופי לשתי נורמות שאינן שקולות, כמו טענה 3.5.8.
      - kind: result
        text: '$p,q,r$ נורמות ו-$s$ לא; $q\sim r$, ו-$p$ אינה שקולה ל-$q$ או ל-$r$.'
    source:
      name: 'University of Cambridge, Mathematical Tripos Part IB, Analysis II'
      year: 2015
      problem: 'Paper 4, Section I, 3G'
      url: 'https://www.maths.cam.ac.uk/undergrad/pastpapers/files/2015/List_IB.pdf'
      verified: '2026-11-11'
      adapted: true

  - id: W-3.5-c2
    stars: 1
    objectives: [OBJ-3.5-1, OBJ-3.5-2, OBJ-3.5-3]
    prompt: >-
      (א) הגדירו מתי שתי נורמות על מרחב וקטורי ממשי $V$ שקולות, והוכיחו שאם הן שקולות, קבוצה $F\subseteq V$ סגורה
      באחת אם ורק אם היא סגורה בשנייה.

      (ב) הוכיחו שכל שתי נורמות על מרחב ממימד סופי שקולות, כשמותר להשתמש **רק** במשפט בולצאנו-ויירשטראס לסדרות
      ב-$\mathbb{R}^n$ (בלי היינה-בורל ובלי משפט ויירשטראס על מקסימום).

      (ג) האם $H=\{f\in C[0,1]:\ f(\frac12)=0\}$ סגורה ב-$(C[0,1],\|\cdot\|_1)$?

      (ד) האם $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$ שקולות על $C[0,1]$?
    answer: >-
      (ב) הוכחה בשלילה עם סדרה על הספרה. (ג) לא: $1\in\overline H\setminus H$. (ד) לא: לפי (א) ו-(ג).
    solution:
      - kind: idea
        text: >-
          (ב) אם אין קבוע תחתון, יש וקטורי יחידה אוקלידיים עם $N$ קטן כרצוננו; בולצאנו-ויירשטראס נותן נקודת הצטברות
          על הספרה, ובה $N$ חייבת להתאפס. (ג)–(ד) $H$ סגורה בנורמה אחת ולא בשנייה, ו-(א) מסיים.
      - kind: definition
        text: >-
          (א) הגדרה 3.5.1. לפי מסקנה 1.5.8(ב), $F$ סגורה אם ורק אם היא מכילה את הגבול של כל סדרה מ-$F$ שמתכנסת ב-$V$.
          מ-$c\|\cdot\|_a\le\|\cdot\|_b\le C\|\cdot\|_a$: $\|x_k-x\|_b\to0$ אם ורק אם $\|x_k-x\|_a\to0$ (סנדוויץ'). לכן
          לשתי הנורמות אותן סדרות מתכנסות עם אותם גבולות, ואותן קבוצות סגורות.
      - kind: step
        text: >-
          (ב) לפי שלבים 1–2 של מסקנה 3.5.6 מספיק להוכיח שכל נורמה $N$ על $\mathbb{R}^n$ שקולה ל-$\|\cdot\|_2$. החסם העליון
          $N\le L\|\cdot\|_2$, והרציפות של $N$ ב-$d_2$, הם למה 3.5.4, בלי קומפקטיות.
      - kind: step
        text: >-
          נניח שאין $c>0$ עם $c\|x\|_2\le N(x)$. אז לכל $k\in\mathbb{N}$ יש $x_k\ne0$ עם $N(x_k)<\frac1k\|x_k\|_2$ (בוחרים
          אחד לכל $k$). $y_k=\frac{x_k}{\|x_k\|_2}$ מקיים $\|y_k\|_2=1$ ו-$N(y_k)<\frac1k$.
      - kind: step
        text: >-
          $(y_k)$ חסומה ב-$\mathbb{R}^n$, ולפי בולצאנו-ויירשטראס (משפט 3.1.7) יש תת-סדרה $y_{k_j}\to y$ ב-$d_2$. לפי
          רציפות $\|\cdot\|_2$, $\|y\|_2=1$, ובפרט $y\ne0$. לפי רציפות $N$, $N(y)=\lim_jN(y_{k_j})=0$, בסתירה ל-(N1).
      - kind: computation
        text: >-
          (ג) $1\notin H$. לכל $n\ge2$ תהי
          $$\begin{aligned}&w_n(x)\\&=1-\max\big(0,\ 1-n|x-\tfrac12|\big) :\end{aligned}$$
          רציפה ו-$w_n(\frac12)=0$, כלומר
          $w_n\in H$. $1-w_n$ הוא אוהל בגובה 1 עם בסיס $\frac2n$, ולכן $\|1-w_n\|_1=\frac1n\to0$. לפי משפט 1.5.7(א)
          $1\in\overline H$, ו-$H$ אינה סגורה ב-$\|\cdot\|_1$.
      - kind: step
        text: >-
          (ד) $H$ סגורה ב-$\|\cdot\|_\infty$: היא המקור של $\{0\}$ תחת $\operatorname{ev}_{1/2}$, שרציף ב-$\|\cdot\|_\infty$
          (טענה 1.8.12(ב)), ומסקנה 1.6.7(א). לפי (ג) היא אינה סגורה ב-$\|\cdot\|_1$, ולפי (א) הנורמות אינן שקולות.
      - kind: check
        text: >-
          בחישוב נומרי $\|1-w_2\|_1=0.5$ ו-$\|1-w_{10}\|_1=0.1$, כמו $\frac1n$. ההוכחה ב-(ב) היא אותה הוכחה כמו משפט 3.5.5,
          בשפה של סדרות: "אין מינימום חיובי" הופך ל"סדרה עם $N\to0$", והקומפקטיות הסדרתית של הספרה מחליפה את משפט
          ויירשטראס.
      - kind: result
        text: >-
          (ב) כל הנורמות על מרחב ממימד סופי שקולות; (ג) $H$ אינה סגורה ב-$\|\cdot\|_1$; (ד) $\|\cdot\|_1$ ו-$\|\cdot\|_\infty$
          אינן שקולות על $C[0,1]$.
