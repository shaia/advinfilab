  - id: W-3.1-c2
    stars: 1
    objectives: [OBJ-3.1-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי קומפקטי סדרתית, ותהי $f:X\to X$ עם $d\big(f(x),f(y)\big)=d(x,y)$ לכל $x,y\in X$ (איזומטריה של
      $X$ לתוך עצמו).

      (א) הוכיחו ש-$f(X)$ קומפקטית סדרתית, ולכן סגורה.

      (ב) הוכיחו ש-$f$ על. (רמז: אם $p\notin f(X)$, התבוננו בסדרה $p,f(p),f(f(p)),\dots$.)

      (ג) הראו בדוגמה שבלי קומפקטיות סדרתית זה לא נכון.
    answer: >-
      (א) $f$ שומרת מרחקים, ולכן שולחת תת-סדרה מתכנסת לתת-סדרה מתכנסת. (ב) אם $p\notin f(X)$, יש $\delta>0$ עם
      $B(p,\delta)\cap f(X)=\emptyset$, והסדרה $f^n(p)$ מופרדת $\delta$; למה 3.1.4. (ג) $[0,\infty)$ עם $f(x)=x+1$.
    solution:
      - kind: step
        text: >-
          (א) תהי $(f(y_n))$ סדרה ב-$f(X)$. יש $y_{n_k}\to y\in X$, ומתקיים
          $$\begin{aligned}d\big(f(y_{n_k}),f(y)\big)&=d(y_{n_k},y)\\&\to0 ,\end{aligned}$$
          כלומר
          $f(y_{n_k})\to f(y)\in f(X)$. לכן $f(X)$ קומפקטית סדרתית, ולפי משפט 3.1.5 סגורה.
      - kind: step
        text: >-
          (ב) נניח בשלילה ש-$p\notin f(X)$. $X\setminus f(X)$ פתוחה (הגדרה 1.3.4), ולכן יש $\delta>0$ עם
          $B(p,\delta)\subseteq X\setminus f(X)$: לכל $z\in f(X)$, $d(p,z)\ge\delta$.
      - kind: step
        text: >-
          נגדיר $x_0=p$ ו-$x_{n+1}=f(x_n)$, כלומר $x_n=f^n(p)$. יהיו $0\le n<m$. אז $x_m=f^n(q)$ עם $q=f^{m-n}(p)$, ו-$f^n$
          שומרת מרחקים (הרכבה של $n$ העתקות ששומרות מרחקים), ולכן
          $$\begin{aligned}d(x_n,x_m)&=d\big(f^n(p),f^n(q)\big)\\&=d(p,q) .\end{aligned}$$
          כאן
          $q\in f(X)$ (כי $m-n\ge1$), ולכן $d(x_n,x_m)\ge\delta$.
      - kind: step
        text: >-
          הסדרה $(x_n)$ מופרדת $\delta$, ולפי למה 3.1.4 לאף תת-סדרה שלה אין גבול, בסתירה לכך ש-$X$ קומפקטי סדרתית. לכן
          $f$ על.
      - kind: step
        text: >-
          (ג) $X=[0,\infty)$ עם $|x-y|$ ו-$f(x)=x+1$: $|f(x)-f(y)|=|x-y|$, ו-$f(X)=[1,\infty)\ne X$. ו-$X$ אינו קומפקטי
          סדרתית (אינו חסום, משפט 3.1.5). בהוכחה, הסדרה $0,1,2,\dots$ מופרדת 1, ואין שום סתירה.
      - kind: check
        text: >-
          בקטע $[0,1]$ (קומפקטי סדרתית) האיזומטריות של הקטע לתוך עצמו הן $x$ ו-$1-x$, ושתיהן על, כמו שהטענה מבטיחה. ב-(ב)
          השתמשנו בסגירות של $f(X)$, כלומר ב-(א), כדי לקבל את $\delta$.
      - kind: result
        text: >-
          כל איזומטריה של מרחב קומפקטי סדרתית לתוך עצמו היא על; ב-$[0,\infty)$ ההזזה ב-1 אינה על.
