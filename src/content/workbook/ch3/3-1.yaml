# Workbook of lesson 3.1 — sequential compactness.
# Objectives (src/course.ts):
#   OBJ-3.1-1  define sequential compactness; compact ⇒ closed and bounded in every metric space
#   OBJ-3.1-2  closed and bounded ⇒ compact in ℝᵏ, with Bolzano–Weierstrass
#   OBJ-3.1-3  closed and bounded sets that are not compact: the discrete metric, a space of functions
# Results cited by the numbers of the formal spine (3.1.k). Numbers recomputed with npx tsx: the lattice-point count of
# W-01, the L¹ norms and distances of the tents in W-07 (midpoint rule, 4·10⁵ cells), the separation of B in W-08.
lesson: '3.1'
practice:
  - id: W-3.1-01
    level: basic
    objectives: [OBJ-3.1-2]
    prompt: >-
      בכל סעיף קבעו אם הקבוצה קומפקטית סדרתית (במישור או במרחב עם $d_2$), ונמקו לפי מסקנה 3.1.8.

      (א) $\{(x,y):\ x^4+y^4\le1\}$.

      (ב) $\{(x,\sin\frac1x):\ 0<x\le1\}$.

      (ג) $\{(x,y):\ x^2\le y\le1\}$.

      (ד) $\mathbb{Z}^2\cap B[0,10]$, הנקודות עם שתי קואורדינטות שלמות ו-$x^2+y^2\le100$. כמה נקודות יש בה?

      (ה) הסליל $\{(\cos t,\sin t,t):\ t\in\mathbb{R}\}\subseteq\mathbb{R}^3$.
    answer: >-
      (א) כן. (ב) לא: אינה סגורה. (ג) כן. (ד) כן: קבוצה סופית בת 317 נקודות. (ה) לא: אינה חסומה.
    solution:
      - kind: theorem
        text: >-
          מסקנה 3.1.8: ב-$\mathbb{R}^k$ קבוצה קומפקטית סדרתית אם ורק אם היא סגורה וחסומה. סגירות בודקים בסדרות (מסקנה
          1.5.8(ב)), והתכנסות ב-$\mathbb{R}^k$ היא התכנסות בכל קואורדינטה (משפט 1.5.9).
      - kind: step
        text: >-
          (א) חסומה: $x^4\le1$ ולכן $|x|\le1$, וכך גם $|y|$. סגורה: אם $(x_n,y_n)\to(x,y)$ ו-$x_n^4+y_n^4\le1$, לפי
          אריתמטיקה של גבולות $x_n^4+y_n^4\to x^4+y^4$, ואי-שוויון חלש עובר לגבול. קומפקטית סדרתית.
      - kind: step
        text: >-
          (ב) הנקודות $p_n=\big(\frac1{n\pi},\sin(n\pi)\big)=\big(\frac1{n\pi},0\big)$ בקבוצה ושואפות ל-$(0,0)$, שאינה
          בקבוצה (הקואורדינטה הראשונה שלה 0). כל תת-סדרה שואפת ל-$(0,0)$ בלבד (טענה 1.5.4(א), משפט 1.5.2), ולכן לאף
          תת-סדרה אין גבול בקבוצה. היא חסומה ואינה סגורה.
      - kind: step
        text: >-
          (ג) חסומה: $0\le x^2\le y\le1$ נותן $|x|\le1$ ו-$0\le y\le1$. סגורה: שני האי-שוויונים $x_n^2\le y_n$ ו-$y_n\le1$
          עוברים לגבול. קומפקטית סדרתית.
      - kind: computation
        text: >-
          (ד) סופית, ולכן קומפקטית סדרתית לפי טענה 3.1.3(א), בלי מסקנה 3.1.8. ספירה: לכל $x\in\{-10,\dots,10\}$ מספר
          ה-$y$ השלמים עם $y^2\le100-x^2$ הוא $2\lfloor\sqrt{100-x^2}\rfloor+1$; הסכום על כל $x$ הוא 317.
      - kind: step
        text: >-
          (ה) הנקודות
          $$\begin{aligned}&(\cos2\pi n,\sin2\pi n,2\pi n)\\&\quad=(1,0,2\pi n)\end{aligned}$$
          בסליל, במרחק $d_2\ge2\pi n$ מ-$(1,0,0)$: כל תת-סדרה
          אינה חסומה ואינה מתכנסת (טענה 1.5.3(ג)). הסליל סגור ואינו חסום.
      - kind: check
        text: >-
          ספירה ישירה בחישוב של כל הזוגות $(a,b)$ עם $|a|,|b|\le10$ נותנת 317. ב-(ב), הסגור של הקבוצה מכיל את כל הקטע
          $\{0\}\times[-1,1]$; אבל לשאלה מספיקה נקודה אחת חסרה.
      - kind: result
        text: >-
          (א) כן; (ב) לא; (ג) כן; (ד) כן, 317 נקודות; (ה) לא.

  - id: W-3.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-1]
    prompt: >-
      $(X,d)$ מרחב מטרי כלשהו. נכון או לא נכון? הוכיחו או תנו דוגמה נגדית.

      (א) כל קבוצה קומפקטית סדרתית חסומה.

      (ב) איחוד של סדרה $K_1,K_2,\dots$ של קבוצות קומפקטיות סדרתית קומפקטי סדרתית.

      (ג) החיתוך של שתי קבוצות קומפקטיות סדרתית קומפקטי סדרתית.

      (ד) כל תת-קבוצה של קבוצה קומפקטית סדרתית קומפקטית סדרתית.

      (ה) ב-$X=\mathbb{R}$: לכל קבוצה קומפקטית סדרתית **לא ריקה** יש מקסימום.
    answer: >-
      (א) נכון. (ב) לא נכון. (ג) נכון. (ד) לא נכון. (ה) נכון.
    solution:
      - kind: theorem
        text: >-
          (א) זה משפט 3.1.5.
      - kind: step
        text: >-
          (ב) ב-$\mathbb{R}$, $K_n=\{n\}$ קומפקטית סדרתית (טענה 3.1.3(א)), והאיחוד $\mathbb{N}$ אינו חסום, ולכן אינו קומפקטי
          סדרתית (משפט 3.1.5). טענה 3.1.6(ב) מדברת על מספר סופי של קבוצות.
      - kind: step
        text: >-
          (ג) $K\cap L$, עם $L$ קומפקטית סדרתית, ולכן סגורה (משפט 3.1.5). לפי טענה 3.1.6(ג) עם $F=L$, $K\cap L$ קומפקטית
          סדרתית.
      - kind: step
        text: >-
          (ד) $(0,1]\subseteq[0,1]$: $[0,1]$ קומפקטי סדרתית (טענה 3.1.3(ד)), ו-$(0,1]$ אינה סגורה ב-$\mathbb{R}$ ($\frac1n\to0$),
          ולכן אינה קומפקטית סדרתית (משפט 3.1.5).
      - kind: step
        text: >-
          (ה) $K$ חסומה (משפט 3.1.5) ולא ריקה, ולכן יש לה סופרמום $s$ (אקסיומת השלמות). לפי הגדרת הסופרמום, לכל $n$
          יש $x_n\in K$ עם $s-\frac1n<x_n\le s$, ולפי כלל הסנדוויץ' $x_n\to s$. $K$ סגורה, ולכן $s\in K$ (מסקנה
          1.5.8(ב)): $s=\max K$.
      - kind: check
        text: >-
          ב-(ה) השתמשנו בשני החצאים של משפט 3.1.5: בחסימות כדי שיהיה סופרמום, ובסגירות כדי שהוא יתקבל. ל-$(0,1)$ יש
          סופרמום 1 ואין מקסימום, ו-$[0,\infty)$ אין לה אפילו סופרמום.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון ($\{n\}$); (ג) נכון; (ד) לא נכון ($(0,1]\subseteq[0,1]$); (ה) נכון.

  - id: W-3.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      על $\mathbb{R}$ נגדיר $\sigma(x,y)=\min(|x-y|,1)$ (מטריקה לפי מסקנה 1.1.12).

      (א) הוכיחו: $x_n\to x$ ב-$\sigma$ אם ורק אם $x_n\to x$ ב-$|\cdot|$.

      (ב) הסיקו ש-$[0,1]$ קומפקטי סדרתית ב-$(\mathbb{R},\sigma)$.

      (ג) הוכיחו ש-$[0,\infty)$ סגורה וחסומה ב-$(\mathbb{R},\sigma)$ ואינה קומפקטית סדרתית.

      (ד) על $\mathbb{Z}$ עם המטריקה הבדידה: אילו תת-קבוצות קומפקטיות סדרתית? האם $\mathbb{Z}$ חסומה?
    answer: >-
      (א) ל-$\varepsilon<1$, $\sigma(x_n,x)<\varepsilon$ אם ורק אם $|x_n-x|<\varepsilon$. (ב) לפי (א) וטענה 3.1.3(ד).
      (ג) הסדרה $n$ מופרדת 1. (ד) בדיוק הקבוצות הסופיות; $\mathbb{Z}$ חסומה.
    solution:
      - kind: step
        text: >-
          (א) לכל $0<\varepsilon\le1$: $\min(t,1)<\varepsilon$ אם ורק אם $t<\varepsilon$ (כש-$t\ge1$ שני הצדדים שקריים). בהגדרה
          1.5.1 מספיק לבדוק $\varepsilon\le1$: אם התנאי מתקיים עם $\min(\varepsilon,1)$, הוא מתקיים עם $\varepsilon$. לכן שתי
          ההגדרות של התכנסות אומרות אותו דבר.
      - kind: step
        text: >-
          (ב) תהי $(y_n)$ סדרה ב-$[0,1]$. לפי טענה 3.1.3(ד) יש תת-סדרה $y_{n_k}\to c\in[0,1]$ ב-$|\cdot|$, ולפי (א) גם ב-$\sigma$.
      - kind: step
        text: >-
          (ג) סגורה: אם $x_n\ge0$ ו-$x_n\to x$ ב-$\sigma$, לפי (א) גם ב-$|\cdot|$, ואי-שוויון חלש עובר לגבול (אינפי 1):
          $x\ge0$. לפי מסקנה 1.5.8(ב) הקבוצה סגורה. חסומה:
          $\sigma\le1$, ולכן $[0,\infty)\subseteq B_\sigma(0,2)$. לא קומפקטית סדרתית: $\sigma(n,m)=1$ לכל $n\ne m$, ולפי
          למה 3.1.4 לאף תת-סדרה של $x_n=n$ אין גבול.
      - kind: step
        text: >-
          (ד) לפי טענה 3.1.3(ב), הקבוצות הקומפקטיות סדרתית הן בדיוק הסופיות. $\mathbb{Z}$ חסומה: $\mathbb{Z}\subseteq B(0,2)$, כי
          כל המרחקים 0 או 1. לכן $\mathbb{Z}$ סגורה וחסומה ואינה קומפקטית סדרתית (טענה 3.1.9(א)).
      - kind: check
        text: >-
          המטריקות $\sigma$ ו-$|\cdot|$ נותנות אותן סדרות מתכנסות, ובכל זאת $[0,\infty)$ חסומה רק באחת מהן. חסימות תלויה
          במטריקה, לא רק בסדרות המתכנסות; קומפקטיות סדרתית לא תלויה במה שמעבר לסדרות, ולכן היא זהה בשתיהן:
          $[0,\infty)$ אינה קומפקטית סדרתית גם ב-$|\cdot|$.
      - kind: result
        text: >-
          (א) אותן סדרות מתכנסות. (ב) $[0,1]$ קומפקטי סדרתית. (ג) $[0,\infty)$ סגורה וחסומה ב-$\sigma$, ולא קומפקטית
          סדרתית. (ד) רק הקבוצות הסופיות; $\mathbb{Z}$ חסומה.

  - id: W-3.1-04
    level: mid
    objectives: [OBJ-3.1-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$K\subseteq X$ קומפקטית סדרתית ולא ריקה. הוכיחו שהקוטר מתקבל: יש $a,b\in K$ עם
      $d(a,b)=\operatorname{diam}K$. הראו בדוגמה שבלי קומפקטיות זה לא נכון.
    answer: >-
      בוחרים זוגות $a_n,b_n$ עם $d(a_n,b_n)>\operatorname{diam}K-\frac1n$, ועוברים לתת-סדרה של תת-סדרה. דוגמה נגדית:
      $(0,1)$, שקוטרה 1.
    solution:
      - kind: idea
        text: >-
          הקוטר הוא סופרמום, ולכן יש זוגות שמרחקם מתקרב אליו. מקומפקטיות יש לזוגות האלה גבול (קודם ברכיב הראשון, ובתוך
          תת-הסדרה הזו ברכיב השני), והמרחק רציף.
      - kind: step
        text: >-
          לפי משפט 3.1.5 $K$ חסומה, ולפי הגדרה וטענה 2.1.2(ב) $D=\operatorname{diam}K<\infty$. לפי הגדרת הסופרמום, לכל
          $n$ יש $a_n,b_n\in K$ עם $d(a_n,b_n)>D-\frac1n$; נבחר זוג כזה לכל $n$ (בחירה בת מנייה).
      - kind: step
        text: >-
          $(a_n)$ סדרה ב-$K$: יש תת-סדרה $a_{n_j}\to a\in K$. $(b_{n_j})_j$ סדרה ב-$K$: יש לה תת-סדרה $b_{n_{j_l}}\to b\in K$.
          נסמן $m_l=n_{j_l}$; גם $a_{m_l}\to a$ (טענה 1.5.4(א)).
      - kind: step
        text: >-
          לפי טענה 1.5.6(א), $d(a_{m_l},b_{m_l})\to d(a,b)$. לכל $l$, $D-\frac1{m_l}<d(a_{m_l},b_{m_l})\le D$, ו-$\frac1{m_l}\to0$.
          לפי כלל הסנדוויץ' $d(a,b)=D$.
      - kind: step
        text: >-
          דוגמה נגדית: $(0,1)\subseteq\mathbb{R}$, $\operatorname{diam}=\sup\{|x-y|\}=1$, אבל $|x-y|<1$ לכל $x,y\in(0,1)$. גם
          $B(\theta,1)$, הכדור **הפתוח** ב-$C[0,1]$, קוטרו 2 (הגדרה וטענה 2.1.2(ד)) ואינו מתקבל: לכל $f,g$ בכדור,
          $\|f\|_\infty<1$ ו-$\|g\|_\infty<1$ (הגדרת הכדור הפתוח), ולכן $\|f-g\|_\infty\le\|f\|_\infty+\|g\|_\infty<2$.
      - kind: check
        text: >-
          איפה הקומפקטיות: ההוכחה צריכה תת-סדרה **משותפת** לשני הרכיבים, כמו בהוכחה הראשונה של משפט 3.1.7. בחירת תת-סדרה
          נפרדת ל-$(a_n)$ ול-$(b_n)$ לא הייתה נותנת זוגות.
      - kind: result
        text: >-
          בקבוצה קומפקטית סדרתית ולא ריקה יש $a,b$ עם $d(a,b)=\operatorname{diam}K$; ב-$(0,1)$ אין.

  - id: W-3.1-05
    level: mid
    objectives: [OBJ-3.1-2]
    prompt: >-
      תהי $(x_n)$ סדרה חסומה ב-$(\mathbb{R}^k,d_\infty)$, ותהי $L$ קבוצת הגבולות החלקיים שלה: הנקודות $y$ שהן גבול של
      תת-סדרה כלשהי. הוכיחו ש-$L$ לא ריקה וקומפקטית סדרתית.
    answer: >-
      לא ריקה לפי משפט 3.1.7; חסומה כי הגבולות נשארים בכדור הסגור שמכיל את הסדרה; סגורה בבנייה של תת-סדרה עם
      $d_\infty(x_{n_j},y_j)<\frac1j$. לפי מסקנה 3.1.8, קומפקטית סדרתית.
    solution:
      - kind: idea
        text: >-
          לפי מסקנה 3.1.8 מספיק לא ריקה, חסומה וסגורה. הקושי הוא הסגירות: גבול של גבולות חלקיים צריך להיות בעצמו גבול
          של תת-סדרה **אחת**, ובונים אותה איבר אחר איבר, כל איבר קרוב לגבול החלקי ה-$j$.
      - kind: step
        text: >-
          (לא ריקה) לפי משפט 3.1.7 יש תת-סדרה מתכנסת, וגבולה ב-$L$.
      - kind: step
        text: >-
          (חסומה) יש $a$ ו-$R$ עם $d_\infty(x_n,a)<R$ לכל $n$. אם $x_{n_k}\to y$, לפי טענה 1.5.6(ג) (אי-שוויון חלש עובר
          לגבול) $d_\infty(y,a)\le R$. לכן $L\subseteq B[a,R]\subseteq B(a,R+1)$.
      - kind: step
        text: >-
          (סגורה) יהיו $y_j\in L$ עם $y_j\to y$. כל $y_j$ הוא גבול של תת-סדרה, ולכן הקבוצה $\{n:\ d_\infty(x_n,y_j)<\frac1j\}$
          אינסופית (היא מכילה את כל האינדקסים של תת-הסדרה מאיזשהו מקום). נבנה $n_1<n_2<\cdots$ ברקורסיה: $n_j$ הוא
          האינדקס הקטן ביותר בקבוצה הזו שגדול מ-$n_{j-1}$ (עם $n_0=0$).
      - kind: step
        text: >-
          אז
          $$\begin{aligned}&d_\infty(x_{n_j},y)\\&\quad\le d_\infty(x_{n_j},y_j)+d_\infty(y_j,y)\\&\quad<\tfrac1j+d_\infty(y_j,y)\to0 .\end{aligned}$$
          לכן $x_{n_j}\to y$,
          ו-$y\in L$. לפי מסקנה 1.5.8(ב) $L$ סגורה.
      - kind: theorem
        text: >-
          לפי מסקנה 3.1.8, $L$ קומפקטית סדרתית.
      - kind: check
        text: >-
          דוגמאות: ל-$(-1)^n$, $L=\{-1,1\}$; לסדרת ארבע הפינות של איור 3.1א, $L$ היא ארבע הנקודות $(\pm\frac12,\pm\frac12)$; ול-$x_n=(\cos n,\sin n)$ היא
          כל מעגל היחידה (עובדה שלא הוכחנו כאן). בכל המקרים $L$ סגורה וחסומה.
      - kind: result
        text: >-
          קבוצת הגבולות החלקיים של סדרה חסומה ב-$\mathbb{R}^k$ לא ריקה וקומפקטית סדרתית.

  - id: W-3.1-06
    level: mid
    objectives: [OBJ-3.1-2]
    prompt: >-
      נזהה מטריצה ממשית $2\times2$ עם הווקטור של ארבעת האיברים שלה ב-$\mathbb{R}^4$ (עם $d_2$).

      (א) הוכיחו שקבוצת המטריצות האורתוגונליות $O(2)=\{A:\ A^TA=I\}$ קומפקטית סדרתית.

      (ב) הוכיחו שקבוצת המטריצות ההפיכות אינה קומפקטית סדרתית.
    answer: >-
      (א) סגורה (התנאי $A^TA=I$ עובר לגבול) וחסומה (כל איבר בערך מוחלט לכל היותר 1); מסקנה 3.1.8. (ב) $\frac1nI\to0$,
      שאינה הפיכה.
    solution:
      - kind: step
        text: >-
          (א, חסומה) העמודות של $A\in O(2)$ הן וקטורי יחידה: $(A^TA)_{jj}=a_{1j}^2+a_{2j}^2=1$. לכן כל איבר מקיים
          $|a_{ij}|\le1$, ו-$O(2)\subseteq B_\infty[0,1]$.
      - kind: step
        text: >-
          (א, סגורה) יהיו $A_n\in O(2)$ עם $A_n\to A$ ב-$\mathbb{R}^4$. לפי משפט 1.5.9, כל איבר $(A_n)_{ij}\to A_{ij}$. כל
          איבר של $A_n^TA_n$ הוא סכום של שתי מכפלות של איברי $A_n$, ולפי אריתמטיקה של גבולות
          $(A_n^TA_n)_{ij}\to(A^TA)_{ij}$. אבל $(A_n^TA_n)_{ij}=\delta_{ij}$ לכל $n$, ולכן $A^TA=I$, ו-$A\in O(2)$.
      - kind: theorem
        text: >-
          לפי מסקנה 3.1.8, $O(2)$ קומפקטית סדרתית.
      - kind: step
        text: >-
          (ב) $A_n=\frac1nI$ הפיכה, ו-$A_n\to0$ (כל איבר שואף ל-0). כל תת-סדרה שואפת ל-0 בלבד, ו-0 אינה הפיכה. לכן לאף
          תת-סדרה אין גבול בקבוצה. (היא גם אינה חסומה: $nI$.)
      - kind: check
        text: >-
          מטריצות סיבוב $\begin{pmatrix}\cos t&-\sin t\\\sin t&\cos t\end{pmatrix}$ ב-$O(2)$: הסדרה עם $t=n$ אינה מתכנסת,
          ולפי (א) יש לה תת-סדרה מתכנסת, לגבול שהוא שוב מטריצה אורתוגונלית.
      - kind: result
        text: >-
          (א) $O(2)$ קומפקטית סדרתית. (ב) המטריצות ההפיכות לא: הן אינן סגורות ואינן חסומות.

  - id: W-3.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.1-3]
    prompt: >-
      $t_n$ פונקציות האוהל של טענה 3.1.9(ב). ב-$C[0,1]$ נתבונן גם בנורמת האינטגרל $\|f\|_1=\int_0^1|f|$.

      (א) חשבו את $\|t_n\|_1$, והוכיחו ש-$\{t_n:\ n\in\mathbb{N}\}\cup\{\theta\}$ קומפקטית סדרתית ב-$(C[0,1],\|\cdot\|_1)$.

      (ב) האם אותה קבוצה קומפקטית סדרתית ב-$(C[0,1],\|\cdot\|_\infty)$?

      (ג) הוכיחו שכדור היחידה הסגור של $(C[0,1],\|\cdot\|_1)$ אינו קומפקטי סדרתית. (רמז: $s_n=2^{n+1}t_n$.)
    answer: >-
      (א) $\|t_n\|_1=2^{-n-1}\to0$, ולפי טענה 3.1.3(ג) כן. (ב) לא: $\|t_n-t_m\|_\infty=1$. (ג) $\|s_n\|_1=1$ ו-$\|s_n-s_m\|_1=2$.
    solution:
      - kind: computation
        text: >-
          (א) הגרף של $t_n$ הוא משולש עם בסיס $I_n$, שאורכו $2^{-n+1}-2^{-n}=2^{-n}$, וגובה 1, ו-$t_n=0$ מחוץ ל-$I_n$. לכן
          $\|t_n\|_1=\frac12\cdot2^{-n}\cdot1=2^{-n-1}$.
      - kind: step
        text: >-
          $\|t_n-\theta\|_1=2^{-n-1}\to0$, כלומר $t_n\to\theta$ ב-$\|\cdot\|_1$, ולפי טענה 3.1.3(ג) הקבוצה קומפקטית סדרתית.
      - kind: step
        text: >-
          (ב) לא: לפי טענה 3.1.9(ב), $\|t_n-t_m\|_\infty=1$ לכל $n\ne m$, ולפי למה 3.1.4 לאף תת-סדרה של $(t_n)$ אין גבול
          ב-$\|\cdot\|_\infty$.
      - kind: step
        text: >-
          (ג) $\|s_n\|_1=2^{n+1}\cdot2^{-n-1}=1$, ולכן $s_n$ בכדור. לפי צעד 3 בהוכחת טענה 3.1.9(ב), בכל נקודה לפחות אחת
          מ-$s_n$, $s_m$ היא 0, ולכן $|s_n-s_m|=s_n+s_m$ (שתיהן אי-שליליות), ולכן
          $$\begin{aligned}\|s_n-s_m\|_1&=\|s_n\|_1+\|s_m\|_1\\&=2 .\end{aligned}$$
          לפי למה 3.1.4, לאף תת-סדרה אין גבול.
      - kind: check
        text: >-
          חישוב מספרי (כלל נקודת האמצע עם $4\cdot10^5$ תאים) נותן $\|t_n\|_1=0.25,\ 0.125,\ 0.0625$ ל-$n=1,2,3$, ו-$\|s_n-s_m\|_1=2$
          לזוגות $(1,2)$, $(2,5)$. אותה קבוצה, שתי מטריקות, שתי תשובות: קומפקטיות סדרתית תלויה במטריקה.
      - kind: result
        text: >-
          (א) $\|t_n\|_1=2^{-n-1}$, והקבוצה קומפקטית סדרתית ב-$\|\cdot\|_1$. (ב) לא ב-$\|\cdot\|_\infty$. (ג) כדור היחידה של
          $\|\cdot\|_1$ אינו קומפקטי סדרתית.

  - id: W-3.1-08
    level: exam
    qualitative: true
    objectives: [OBJ-3.1-1, OBJ-3.1-2]
    prompt: >-
      ב-$(\mathbb{R}^k,d_2)$ נגדיר $A+B=\{a+b:\ a\in A,\ b\in B\}$.

      (א) הוכיחו: אם $K,L$ קומפקטיות סדרתית, גם $K+L$ קומפקטית סדרתית.

      (ב) הוכיחו: אם $A$ סגורה ו-$K$ קומפקטית סדרתית, אז $A+K$ סגורה.

      (ג) הראו ב-$\mathbb{R}$ שתי קבוצות סגורות $A,B$ ש-$A+B$ אינה סגורה.
    answer: >-
      (א) תת-סדרה ב-$K$ ובתוכה תת-סדרה ב-$L$. (ב) $a_n+k_n\to z$: תת-סדרה $k_{n_j}\to k$, אז $a_{n_j}\to z-k\in A$. (ג)
      $A=\mathbb{N}$, $B=\{-n+\frac1n:\ n\in\mathbb{N}\}$: $\frac1n\in A+B$ ו-$0\notin A+B$.
    solution:
      - kind: idea
        text: >-
          סכום מתנהג יפה עם גבולות (טענה 1.5.6(ב)). מקומפקטיות סדרתית מוציאים תת-סדרה מתכנסת של המחובר הקומפקטי סדרתית,
          ואז המחובר השני מתכנס כהפרש. כשאף מחובר אינו קומפקטי סדרתית, שני המחוברים יכולים לברוח לאינסוף בכיוונים מנוגדים, והסכום שלהם
          מתכנס.
      - kind: step
        text: >-
          (א) תהי $z_n=u_n+v_n$ עם $u_n\in K$, $v_n\in L$ (נבחר הצגה כזו לכל $n$). יש $u_{n_j}\to u\in K$, ובתוך תת-הסדרה הזו
          $v_{n_{j_l}}\to v\in L$. עם $m_l=n_{j_l}$, לפי טענה 1.5.6(ב)
          $$\begin{aligned}z_{m_l}&=u_{m_l}+v_{m_l}\\&\to u+v\in K+L .\end{aligned}$$
      - kind: step
        text: >-
          (ב) יהיו $z_n=a_n+k_n\in A+K$ עם $z_n\to z$. יש $k_{n_j}\to k\in K$. לפי טענה 1.5.6(ב),
          $a_{n_j}=z_{n_j}-k_{n_j}\to z-k$. $A$ סגורה, ולכן $z-k\in A$ (מסקנה 1.5.8(ב)), ו-$z=(z-k)+k\in A+K$.
      - kind: step
        text: >-
          (ג) $A=\mathbb{N}$ ו-$B=\{b_n\}$ עם $b_n=-n+\frac1n$. לכל $n<m$:
          $$\begin{aligned}b_n-b_m&=(m-n)+(\tfrac1n-\tfrac1m)\\&\ge1 ,\end{aligned}$$
          ו-$|a-a'|\ge1$
          לנקודות שונות של $A$. סדרה מתכנסת היא סדרת קושי (טענה 2.1.4), ולכן בכל אחת מהקבוצות היא קבועה מאיזשהו מקום
          (עם $\varepsilon=1$) והגבול בקבוצה: שתיהן סגורות.
      - kind: step
        text: >-
          $n+b_n=\frac1n\in A+B$ ו-$\frac1n\to0$. אילו $0=m+b_n=m-n+\frac1n$, אז $\frac1n=n-m$ שלם, ולכן $n=1$ ו-$m=0\notin\mathbb{N}$.
          לכן $0\notin A+B$, ו-$A+B$ אינה סגורה.
      - kind: check
        text: >-
          ב-(ב) צריך שאחד המחוברים יהיה קומפקטי סדרתית: ב-(ג) $a_n=n$ ו-$b_n$ בורחים לאינסוף בכיוונים מנוגדים, ושום תת-סדרה של אף
          אחד מהם אינה מתכנסת. חישוב: הפער הקטן ביותר בין שני איברים של $B$, על $n,m<200$, הוא $1.00003$, מעל 1 כמו
          שהוכחנו.
      - kind: result
        text: >-
          (א) $K+L$ קומפקטית סדרתית. (ב) $A+K$ סגורה. (ג) $\mathbb{N}+\{-n+\frac1n\}$ אינה סגורה.

  - id: W-3.1-09
    level: exam
    objectives: [OBJ-3.1-1, OBJ-3.1-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שבו כל קבוצה סגורה וחסומה קומפקטית סדרתית.

      (א) הוכיחו ש-$X$ שלם.

      (ב) הראו שההפך אינו נכון: מרחב שלם שיש בו קבוצה סגורה וחסומה שאינה קומפקטית סדרתית.
    answer: >-
      (א) הסגור של איברי סדרת קושי סגור וחסום, ולכן קומפקטי סדרתית; לסדרה יש תת-סדרה מתכנסת, וטענה 2.1.8. (ב)
      $(C[0,1],d_\infty)$ וכדור היחידה שלו.
    solution:
      - kind: idea
        text: >-
          סדרת קושי חסומה, והסגור של קבוצת האיברים שלה סגור וחסום. לפי ההנחה הוא קומפקטי סדרתית, וזה נותן תת-סדרה
          מתכנסת; סדרת קושי עם תת-סדרה מתכנסת מתכנסת.
      - kind: step
        text: >-
          (א) תהי $(x_n)$ סדרת קושי, $T=\{x_n:\ n\in\mathbb{N}\}$ ו-$\overline T$ הסגור שלה. $\overline T$ סגורה (טענה 1.4.4(א)).
          $T$ חסומה (טענה 2.1.5), ולכן $\operatorname{diam}T<\infty$ (הגדרה וטענה 2.1.2(ב)), ולפי טענה 2.5.1
          $\operatorname{diam}\overline T=\operatorname{diam}T<\infty$: $\overline T$ חסומה.
      - kind: step
        text: >-
          לפי ההנחה $\overline T$ קומפקטית סדרתית. $(x_n)$ סדרה ב-$\overline T$, ולכן יש תת-סדרה $x_{n_k}\to x\in\overline T$.
          לפי טענה 2.1.8, $x_n\to x$. כל סדרת קושי מתכנסת: $X$ שלם.
      - kind: step
        text: >-
          (ב) $(C[0,1],d_\infty)$ שלם (מסקנה 2.2.6(ג)), והכדור $B[\theta,1]$ סגור וחסום ואינו קומפקטי סדרתית (טענה 3.1.9(ב)).
          גם מרחב בדיד אינסופי: שלם (טענה 2.1.13), והמרחב כולו סגור וחסום ואינו קומפקטי סדרתית (טענה 3.1.9(א)).
      - kind: check
        text: >-
          לפי מסקנה 3.1.8, $\mathbb{R}^k$ מקיים את ההנחה, ו-(א) נותן הוכחה חדשה לכך ש-$\mathbb{R}^k$ שלם, אם משתמשים בהוכחה
          הראשונה של משפט 3.1.7 (השנייה עצמה משתמשת בשלמות, משפט 2.1.11).
      - kind: result
        text: >-
          (א) $X$ שלם. (ב) $C[0,1]$ שלם, ובו $B[\theta,1]$ סגור וחסום ואינו קומפקטי סדרתית.

  - id: W-3.1-10
    level: exam
    objectives: [OBJ-3.1-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, ותהיינה $K_1\supseteq K_2\supseteq\cdots$ קבוצות קומפקטיות סדרתית ולא ריקות, עם חיתוך
      $K=\bigcap_nK_n$.

      (א) הוכיחו ש-$\operatorname{diam}K=\lim_{n\to\infty}\operatorname{diam}K_n$ (ובפרט שהגבול קיים).

      (ב) הראו שעם קבוצות סגורות וחסומות במקום קומפקטיות סדרתית זה לא נכון.
    answer: >-
      (א) הקטרים יורדים וחסומים מלמטה ב-$\operatorname{diam}K$; לכיוון השני, זוגות $a_n,b_n\in K_n$ כמעט במרחק הקוטר, ותת-סדרה
      של תת-סדרה עם גבולות ב-$K$. (ב) $\{0\}\cup\{n,n+1,\dots\}$ במרחב בדיד: קוטר 1, חיתוך $\{0\}$.
    solution:
      - kind: step
        text: >-
          (קיום הגבול) $K\ne\emptyset$ לפי משפט 3.1.11, ולכן $\operatorname{diam}K$ מוגדר. כל $K_n$ חסומה (משפט 3.1.5),
          ולכן $D_n=\operatorname{diam}K_n<\infty$. $K\subseteq K_{n+1}\subseteq K_n$, ולפי הגדרה וטענה 2.1.2(א)
          $\operatorname{diam}K\le D_{n+1}\le D_n$. סדרה יורדת וחסומה מלמטה מתכנסת (אינפי 1): $D_n\to D\ge\operatorname{diam}K$.
      - kind: step
        text: >-
          (זוגות) לכל $n$ נבחר $a_n,b_n\in K_n$ עם $d(a_n,b_n)>D_n-\frac1n\ge D-\frac1n$.
      - kind: step
        text: >-
          (גבולות ב-$K$) כל האיברים ב-$K_1$. יש $a_{n_j}\to a$, ובתוכה $b_{n_{j_l}}\to b$; עם $m_l=n_{j_l}$ גם $a_{m_l}\to a$. נקבע
          $m$. לכל $l\ge m$, $m_l\ge l\ge m$, ולכן $a_{m_l},b_{m_l}\in K_{m_l}\subseteq K_m$; $K_m$ סגורה (משפט 3.1.5), ולפי
          מסקנה 1.5.8(ב) $a,b\in K_m$. זה לכל $m$: $a,b\in K$.
      - kind: step
        text: >-
          (המרחק) לפי טענה 1.5.6(א), $d(a_{m_l},b_{m_l})\to d(a,b)$, וכל האיברים גדולים מ-$D-\frac1{m_l}$; בגבול
          $d(a,b)\ge D$. לכן $\operatorname{diam}K\ge d(a,b)\ge D$, ויחד עם הצעד הראשון $\operatorname{diam}K=D$.
      - kind: step
        text: >-
          (ב) $X=\{0\}\cup\mathbb{N}$ עם המטריקה הבדידה, $F_n=\{0\}\cup\{n,n+1,\dots\}$: סגורות (טענה 1.3.6), חסומות, לא ריקות
          ויורדות, עם $\operatorname{diam}F_n=1$. החיתוך $\{0\}$, וקוטרו 0.
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $K_n=[0,\frac1n]\cup[2,3+\frac1n]$: $D_n=3+\frac1n\to3$, והחיתוך $\{0\}\cup[2,3]$, שקוטרו 3. ב-(ב) נכשל
          צעד הזוגות: $0$ ו-$n$ במרחק 1, אבל $n$ "בורח" ואין לו גבול.
      - kind: result
        text: >-
          (א) $\operatorname{diam}\bigcap_nK_n=\lim_n\operatorname{diam}K_n$. (ב) עם סגורות וחסומות במרחב בדיד זה נכשל.

challenge:
  - id: W-3.1-c1
    stars: 1
    objectives: [OBJ-3.1-2]
    prompt: >-
      (א) הוכיחו שלכל סדרה של מספרים ממשיים יש תת-סדרה מונוטונית.

      (ב) הסיקו את משפט בולצאנו-ויירשטראס בישר מתוך (א) ומאקסיומת השלמות.

      (ג) הסיקו מ-(א) ו-(ב) את משפט 3.1.7 ב-$\mathbb{R}^2$, בלי לחצות ריבועים.
    answer: >-
      (א) "שיאים": אינדקס $m$ שבו $a_m\ge a_n$ לכל $n>m$. אם יש אינסוף שיאים הם נותנים תת-סדרה יורדת; אחרת, אחרי השיא
      האחרון בונים תת-סדרה עולה ממש. (ב) תת-סדרה מונוטונית וחסומה מתכנסת. (ג) תת-סדרה מונוטונית בקואורדינטה הראשונה,
      ובתוכה בשנייה.
    solution:
      - kind: idea
        text: >-
          מסתכלים על האיברים ש"רואים" את כל ההמשך מלמעלה. או שיש הרבה כאלה, והם יורדים; או שמעט, ואז מכל מקום מאוחר יש
          איבר גבוה יותר בהמשך, וזה נותן סדרה עולה.
      - kind: definition
        text: >-
          נקרא ל-$m\in\mathbb{N}$ **שיא** של $(a_n)$ אם $a_m\ge a_n$ לכל $n>m$.
      - kind: step
        text: >-
          (א, אינסוף שיאים) נמנה אותם בסדר עולה, $m_1<m_2<\cdots$ (כמו בצעד 3 בהוכחת טענה 3.1.3(א)). כל $m_j$ שיא ו-$m_{j+1}>m_j$,
          ולכן $a_{m_j}\ge a_{m_{j+1}}$: תת-סדרה יורדת (לא ממש).
      - kind: step
        text: >-
          (א, מספר סופי של שיאים) יהי $N$ גדול מכולם (או $N=0$ אם אין). $n_1=N+1$ אינו שיא, ולכן יש $n>n_1$ עם $a_n>a_{n_1}$;
          נבחר את הקטן ביותר, $n_2$. גם $n_2>N$ אינו שיא, וכן הלאה: $n_1<n_2<\cdots$ ו-$a_{n_1}<a_{n_2}<\cdots$.
      - kind: step
        text: >-
          (ב) אם $(a_n)$ חסומה, התת-סדרה המונוטונית מ-(א) חסומה. סדרה מונוטונית וחסומה מתכנסת (אינפי 1, מאקסיומת
          השלמות: לסדרה עולה, הגבול הוא הסופרמום). זה בולצאנו-ויירשטראס.
      - kind: step
        text: >-
          (ג) תהי $(x_n)$ חסומה ב-$\mathbb{R}^2$, $x_n=(x_{n,1},x_{n,2})$. לפי (א) ו-(ב) יש תת-סדרה $x_{n_j,1}\to u$. הסדרה
          $(x_{n_j,2})_j$ חסומה, ולפי (א) ו-(ב) יש לה תת-סדרה $x_{n_{j_l},2}\to v$. עם $m_l=n_{j_l}$, גם $x_{m_l,1}\to u$ (טענה
          1.5.4(א)), ולפי משפט 1.5.9 $x_{m_l}\to(u,v)$.
      - kind: check
        text: >-
          בסדרה $a_n=(-1)^n\frac1n$ השיאים הם בדיוק האינדקסים הזוגיים ($a_{2k}=\frac1{2k}$ גדול מכל איבר אחריו), ותת-הסדרה
          שלהם יורדת ל-0. בסדרה $a_n=1-\frac1n$ אין אף שיא, והבנייה של המקרה השני נותנת את כל הסדרה, עולה ממש.
      - kind: result
        text: >-
          לכל סדרה ממשית יש תת-סדרה מונוטונית; מכאן בולצאנו-ויירשטראס בישר, ובקואורדינטות ב-$\mathbb{R}^2$.
