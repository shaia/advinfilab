# Workbook of lesson 3.4 — continuous functions on compact sets.
# Objectives (src/course.ts):
#   OBJ-3.4-1  the continuous image of a compact set is compact; a real continuous function on a compact set attains max and min
#   OBJ-3.4-2  Cantor's theorem: continuous on a compact space ⇒ uniformly continuous (רציפה במידה שווה)
#   OBJ-3.4-3  a continuous bijection from a compact space is a homeomorphism; the distance to a compact set is attained
# Results cited by the numbers of the chapter-3 spine (3.k.m). Every number recomputed with npx tsx (grid maxima for
# W-02 and W-06, the integrals of W-08, the separations of W-06(ב)).
lesson: '3.4'
practice:
  - id: W-3.4-01
    level: basic
    qualitative: true
    objectives: [OBJ-3.4-1]
    prompt: >-
      לכל אחת מהקבוצות קבעו אם היא קומפקטית, ונמקו במשפט או בדוגמה נגדית. ב-$\mathbb{R}^2$ המטריקה $d_2$, וב-$\mathbb{R}$
      המטריקה $|x-y|$.

      (א) $\{(x,y): x^4+y^4\le1\}$.

      (ב) התמונה של הריבוע $[0,1]^2$ תחת $F(x,y)=(x+y,\ xy)$.

      (ג) $\{(x,y): xy\ge1\}$.

      (ד) $g(\mathbb{R})$, כאשר $g(t)=\frac{t}{1+t^2}$.

      (ה) המקור של $[0,1]$ תחת $\sin$, כלומר הקבוצה $\{t\in\mathbb{R}: 0\le\sin t\le1\}$.
    answer: >-
      (א) קומפקטית. (ב) קומפקטית. (ג) לא: סגורה ואינה חסומה. (ד) קומפקטית: $[-\frac12,\frac12]$, אף ש-$\mathbb{R}$ אינו
      קומפקטי. (ה) לא: אינה חסומה.
    solution:
      - kind: theorem
        text: >-
          במשפט היינה-בורל (משפט 3.2.11) קבוצה ב-$\mathbb{R}^n$ עם $d_p$ קומפקטית אם ורק אם היא סגורה וחסומה; ולפי משפט
          3.4.1 התמונה הרציפה של קומפקטית קומפקטית.
      - kind: step
        text: >-
          (א) $p(x,y)=x^4+y^4$ רציפה (פולינום, טענה 1.6.5(ג)), והקבוצה היא $\{p\le1\}$, סגורה לפי מסקנה 1.6.7(א). אם
          $x^4+y^4\le1$ אז $x^4\le1$, כלומר $|x|\le1$, וכך גם $|y|\le1$: הקבוצה מוכלת ב-$B[0,\sqrt2]$ של $d_2$ וחסומה.
          לכן קומפקטית.
      - kind: step
        text: >-
          (ב) $[0,1]^2$ סגור וחסום, ולכן קומפקטי. $F$ רציפה (כל רכיב פולינום; התכנסות ב-$\mathbb{R}^2$ היא לפי רכיבים,
          משפט 1.5.9, ומשפט 1.6.3). לפי משפט 3.4.1 התמונה קומפקטית, בלי לחשב אותה.
      - kind: step
        text: >-
          (ג) $\{xy\ge1\}$ סגורה (מסקנה 1.6.7(א)). היא מכילה את $(n,1)$ לכל $n\in\mathbb{N}$, ולכן אינה חסומה, ולפי משפט
          3.1.5 אינה קומפקטית.
      - kind: computation
        text: >-
          (ד) $(|t|-1)^2\ge0$ נותן $2|t|\le1+t^2$, כלומר $|g(t)|\le\frac12$, עם שוויון ב-$t=\pm1$: $g(1)=\frac12$,
          $g(-1)=-\frac12$. לפי משפט ערך הביניים (אינפי 1), $g$ הרציפה מקבלת כל ערך ביניהם. לכן
          $g(\mathbb{R})=[-\frac12,\frac12]$, קומפקטית. זו טענה 3.4.2(ד): תחום לא קומפקטי עם תמונה קומפקטית.
      - kind: step
        text: >-
          (ה) $\sin(2\pi n+\frac\pi2)=1$, ולכן $2\pi n+\frac\pi2$ שייכת לקבוצה לכל $n\in\mathbb{N}$: היא אינה חסומה, ולכן
          אינה קומפקטית. היא סגורה (טענה 3.4.2(ה)): המקור של קומפקטית הוא סגור, ולא יותר.
      - kind: result
        text: >-
          (א), (ב), (ד) קומפקטיות; (ג) ו-(ה) סגורות ואינן חסומות, ולכן אינן קומפקטיות.

  - id: W-3.4-02
    level: basic
    objectives: [OBJ-3.4-1]
    prompt: >-
      $K=\{(x,y): |x|+|y|\le1\}$ ו-$f(x,y)=xy$.

      (א) הסבירו למה $f$ מקבלת על $K$ מקסימום ומינימום.

      (ב) מצאו אותם, ואת כל הנקודות שבהן הם מתקבלים.
    answer: >-
      (א) $K$ קומפקטית ו-$f$ רציפה (מסקנה 3.4.3). (ב) המקסימום $\frac14$, ב-$\pm(\frac12,\frac12)$; המינימום
      $-\frac14$, ב-$\pm(\frac12,-\frac12)$.
    solution:
      - kind: step
        text: >-
          (א) $K$ היא הכדור הסגור $B[0,1]$ של $d_1$: סגורה (טענה 1.3.5(א)) וחסומה, ולכן קומפקטית (משפט 3.2.11), ולא
          ריקה. $f$ פולינום ולכן רציפה (טענה 1.6.5(ג)). לפי מסקנה 3.4.3 יש לה מקסימום ומינימום על $K$.
      - kind: computation
        text: >-
          (ב) לכל $(x,y)\in K$: $0\le(|x|-|y|)^2$ נותן $4|x||y|\le(|x|+|y|)^2\le1$, כלומר $|xy|\le\frac14$.
      - kind: step
        text: >-
          שוויון $xy=\frac14$ דורש $|x|=|y|$ ו-$|x|+|y|=1$, כלומר $|x|=|y|=\frac12$, עם אותו סימן: $(\frac12,\frac12)$
          או $(-\frac12,-\frac12)$. שתיהן ב-$K$. באותו אופן $xy=-\frac14$ בדיוק ב-$(\frac12,-\frac12)$ וב-$(-\frac12,\frac12)$.
      - kind: check
        text: >-
          על רשת של $K$ עם צעד $10^{-3}$ (בדיקה מספרית, לא הוכחה): המקסימום $0.2500$ והמינימום $-0.2500$. ושימו לב:
          (א) רק מבטיח שהמקסימום קיים; (ב) מוצא אותו באי-שוויון שיש בו שוויון בנקודה של $K$.
      - kind: result
        text: >-
          $\max_Kf=\frac14$ ב-$\pm(\frac12,\frac12)$, $\min_Kf=-\frac14$ ב-$\pm(\frac12,-\frac12)$.

  - id: W-3.4-03
    level: basic
    objectives: [OBJ-3.4-2]
    prompt: >-
      (א) לפי משפט קנטור, $f(x)=x^3$ רציפה במידה שווה על $[-1,2]$. מצאו $\delta$ מפורש: נוסחה ב-$\varepsilon$ כך
      שלכל $x,y\in[-1,2]$ עם $|x-y|<\delta$ מתקיים $|x^3-y^3|<\varepsilon$.

      (ב) הוכיחו ש-$x^3$ אינה רציפה במידה שווה על $\mathbb{R}$.
    answer: >-
      (א) $\delta=\frac{\varepsilon}{12}$ מתאים. (ב) $x_n=n$, $y_n=n+\frac1n$: $|x_n-y_n|\to0$ ו-$y_n^3-x_n^3>3$.
    solution:
      - kind: idea
        text: >-
          $$\begin{aligned}&x^3-y^3\\&\quad=(x-y)(x^2+xy+y^2) :\end{aligned}$$
          על קטע חסום הגורם השני חסום, וזה נותן קבוע ליפשיץ; על כל הישר הוא אינו חסום.
      - kind: computation
        text: >-
          (א) ל-$x,y\in[-1,2]$: $|x|,|y|\le2$, ולכן
          $$\begin{aligned}&|x^2+xy+y^2|\\&\quad\le x^2+|x||y|+y^2\\&\quad\le4+4+4=12 .\end{aligned}$$
          לכן
          $|x^3-y^3|\le12|x-y|$: $x^3$ ליפשיצית עם קבוע 12 על $[-1,2]$, ולפי טענה 1.6.9 $\delta=\frac\varepsilon{12}$
          מתאים.
      - kind: computation
        text: >-
          (ב) עם $\varepsilon=1$, יהי $\delta>0$ ו-$n>\frac1\delta$ (ארכימדס). $x_n=n$, $y_n=n+\frac1n$:
          $|x_n-y_n|=\frac1n<\delta$, ומתקיים
          $$\begin{aligned}y_n^3-x_n^3&=3n+\frac3n+\frac1{n^3}\\&>3>1 .\end{aligned}$$
          לכן אף $\delta$ אינו מתאים.
      - kind: check
        text: >-
          (א) הקבוע 12 הדוק: ליד $x=y=2$ היחס $\frac{|x^3-y^3|}{|x-y|}$ שואף ל-$3\cdot2^2=12$. ו-(ב) אינו סותר את משפט
          3.4.6: $\mathbb{R}$ אינו קומפקטי (טענה 3.4.7(ב) היא אותו דבר עם $x^2$).
      - kind: result
        text: >-
          (א) $\delta=\frac{\varepsilon}{12}$; (ב) $x^3$ אינה רציפה במידה שווה על $\mathbb{R}$.

  - id: W-3.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-3.4-2]
    prompt: >-
      (א) תהי $A\subseteq\mathbb{R}$ חסומה ולא ריקה, ו-$f:A\to\mathbb{R}$ רציפה במידה שווה. הוכיחו ש-$f$ חסומה.

      (ב) הראו בדוגמה שבלי "חסומה" (על $A$) המסקנה נכשלת, וגם שבלי "במידה שווה" היא נכשלת.
    answer: >-
      (א) $\delta$ של $\varepsilon=1$, וחלוקה של קטע שמכיל את $A$ למספר סופי של קטעים קצרים מ-$\delta$. (ב) $f(x)=x$ על
      $\mathbb{R}$; $\frac1x$ על $(0,1]$.
    solution:
      - kind: idea
        text: >-
          על קטע קצר מ-$\delta$ הערכים של $f$ קרובים עד 1 לערך בנקודה אחת שלו. $A$ חסומה, ולכן מספיקים מספר סופי של
          קטעים כאלה, ומספר סופי של "נקודות עוגן".
      - kind: step
        text: >-
          (א) לפי הגדרה 1.6.8(ב) עם $\varepsilon=1$ יש $\delta>0$ כך שלכל $x,y\in A$ עם $|x-y|<\delta$:
          $|f(x)-f(y)|<1$. $A$ חסומה, ולכן $A\subseteq[a,b]$ ל-$a<b$ מתאימים.
      - kind: step
        text: >-
          לפי ארכימדס יש $m\in\mathbb{N}$ עם $\frac{b-a}m<\delta$. נחלק את $[a,b]$ לקטעים $J_i=[a+\frac{(i-1)(b-a)}m,\ a+\frac{i(b-a)}m]$,
          $i=1,\dots,m$. לכל $i$ שבו $J_i\cap A\ne\emptyset$ נבחר $a_i\in J_i\cap A$ (מספר סופי של בחירות).
      - kind: step
        text: >-
          יהי $x\in A$. הוא שייך לאיזה $J_i$, ואז $J_i\cap A\ne\emptyset$ ו-$|x-a_i|\le\frac{b-a}m<\delta$. לכן
          $$\begin{aligned}|f(x)|&\le|f(a_i)|\\&\quad+|f(x)-f(a_i)|\\&<|f(a_i)|+1\le M+1 ,\end{aligned}$$
          כאשר $M$ המקסימום של המספרים $|f(a_i)|$ (מספר סופי
          שלהם). $f$ חסומה.
      - kind: step
        text: >-
          (ב) $f(x)=x$ על $\mathbb{R}$ ליפשיצית עם קבוע 1, ולכן רציפה במידה שווה (טענה 1.6.9), ואינה חסומה: הנחת
          החסימות של $A$ נחוצה. $\frac1x$ על $(0,1]$ רציפה ואינה חסומה: "במידה שווה" נחוצה (וזו הוכחה נוספת לטענה
          3.4.7(א)).
      - kind: check
        text: >-
          במרחב מטרי כללי (א) אינה נכונה בלי תנאי נוסף: הזהות מ-$(\mathbb{R},d_0)$, $d_0$ המטריקה הבדידה, אל
          $(\mathbb{R},|\cdot|)$ רציפה במידה שווה (טענה 1.6.10(א)), התחום חסום (כל המרחקים לכל היותר 1), והיא אינה
          חסומה. בשלב החלוקה השתמשנו בכך שקטע ב-$\mathbb{R}$ מתחלק לסופית קטעים קצרים, כלומר בחסימות כליל (שיעור 3.3).
      - kind: result
        text: >-
          (א) $|f|<M+1$ על $A$; (ב) $x$ על $\mathbb{R}$ ו-$\frac1x$ על $(0,1]$.

  - id: W-3.4-05
    level: mid
    objectives: [OBJ-3.4-3, OBJ-3.4-2]
    prompt: >-
      (א) תהי $K\subseteq\mathbb{R}^n$ קומפקטית (עם $d_2$), ו-$f:K\to\mathbb{R}^m$ רציפה וחד-חד-ערכית. הוכיחו שההופכית
      $f^{-1}:f(K)\to K$ רציפה במידה שווה.

      (ב) הראו שבלי קומפקטיות של $K$ המסקנה נכשלת, גם כש-$f(K)$ קומפקטית.
    answer: >-
      (א) משפט 3.4.8 נותן ש-$f^{-1}$ רציפה; $f(K)$ קומפקטית (משפט 3.4.1), ולפי משפט קנטור $f^{-1}$ רציפה בה במידה
      שווה. (ב) $t\mapsto(\cos t,\sin t)$ מ-$[0,2\pi)$ על $S^1$.
    solution:
      - kind: step
        text: >-
          (א) $f:K\to f(K)$ רציפה, חד-חד-ערכית ועל (על התמונה שלה), ו-$K$ מרחב קומפקטי (טענה 3.2.3). לפי משפט 3.4.8,
          $f$ הומיאומורפיזם מ-$K$ על $f(K)$; בפרט $f^{-1}:f(K)\to K$ רציפה.
      - kind: step
        text: >-
          לפי משפט 3.4.1, $f(K)$ קומפקטית, ולכן המרחב $f(K)$ (עם $d_2$ של $\mathbb{R}^m$) קומפקטי. $f^{-1}$ רציפה על מרחב
          קומפקטי, ולפי משפט 3.4.6 רציפה עליו במידה שווה.
      - kind: step
        text: >-
          (ב) לפי טענה 3.4.9(א), $\gamma(t)=(\cos t,\sin t)$ רציפה וחד-חד-ערכית על $[0,2\pi)$, $\gamma([0,2\pi))=S^1$
          קומפקטית (טענה 3.4.9(ג)), ו-$\gamma^{-1}$ אינה רציפה ב-$(1,0)$, ולכן בוודאי אינה רציפה במידה שווה.
      - kind: check
        text: >-
          הקומפקטיות של $K$ נכנסה פעמיים: במשפט 3.4.8 (ההופכית רציפה), ודרך משפט 3.4.1 בקומפקטיות של התחום של $f^{-1}$
          (משפט קנטור). ב-(ב) רק השנייה מתקיימת.
      - kind: result
        text: >-
          (א) $f^{-1}$ רציפה במידה שווה על $f(K)$; (ב) $\gamma$ על $[0,2\pi)$.

  - id: W-3.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-3.4-3]
    prompt: >-
      (א) $D=\{(x,y): x^2+y^2\le1\}$ ו-$F=\{(x,y): y\ge2+x^2\}$ ב-$\mathbb{R}^2$ עם $d_2$. מצאו את
      $$\begin{aligned}&\operatorname{dist}(D,F)\\&\quad=\inf\{d_2(k,p): k\in D,\ p\in F\}\end{aligned}$$
      והראו שהוא מתקבל.

      (ב) נכון או לא נכון: כל שתי קבוצות סגורות, לא ריקות וזרות ב-$\mathbb{R}$ נמצאות במרחק חיובי זו מזו.
    answer: >-
      (א) המרחק 1, מתקבל ב-$(0,1)\in D$ ו-$(0,2)\in F$. (ב) לא נכון: $\{n: n\ge2\}$ ו-$\{n+\frac1n: n\ge2\}$.
    solution:
      - kind: theorem
        text: >-
          לפי טענה 3.4.10(ג) המרחק חיובי, כי $D$ קומפקטית (משפט 3.2.11), $F$ סגורה (מסקנה 1.6.7(א)), והן זרות (ב-$F$,
          $y\ge2$, וב-$D$, $|y|\le1$). את הערך מחשבים.
      - kind: computation
        text: >-
          (א) לכל $p=(x,y)\in F$: $\|p\|_2\ge|y|\ge2$. לכל $k\in D$: $\|k\|_2\le1$. לפי אי-שוויון המשולש ההפוך
          (טענה 1.6.6(ב)):
          $$\begin{aligned}d_2(k,p)&\ge\|p\|_2-\|k\|_2\\&\ge2-1=1 .\end{aligned}$$
          ושוויון: $d_2((0,1),(0,2))=1$, עם $(0,1)\in D$ ו-$(0,2)\in F$.
      - kind: step
        text: >-
          (ב) לא נכון. $A=\{n\in\mathbb{N}: n\ge2\}$ ו-$C=\{n+\frac1n: n\ge2\}$. הן זרות: ל-$n\ge2$, $n<n+\frac1n<n+1$, ולכן
          $n+\frac1n$ אינו שלם.
      - kind: step
        text: >-
          שתיהן סגורות: נקודות שונות של $A$ רחוקות לפחות 1; ושל $C$, ל-$m>n\ge2$,
          $$\begin{aligned}&(m+\tfrac1m)-(n+\tfrac1n)\\&\quad\ge(n+1)+\tfrac1{n+1}-n-\tfrac1n\\&\quad=1-\tfrac1{n(n+1)}\ge\tfrac56 .\end{aligned}$$
          סדרה מתכנסת היא סדרת קושי
          (טענה 2.1.4), ולכן בכל אחת מהקבוצות היא קבועה החל ממקום מסוים, וגבולה בקבוצה (מסקנה 1.5.8(ב)).
      - kind: step
        text: >-
          המרחק ביניהן: $|(n+\frac1n)-n|=\frac1n\to0$, ולכן $\operatorname{dist}(A,C)=0$. אף אחת מהן אינה קומפקטית (אינן
          חסומות), ולכן טענה 3.4.10(ג) אינה חלה.
      - kind: check
        text: >-
          (א) על רשת של השפה של $D$ ושל $F$ ($|x|\le3$, צעד $10^{-3}$; בדיקה מספרית): המרחק הקטן ביותר $1.0000$, ליד
          $x=0$. (ב) ההבדל בין $\mathbb{R}$ ל-$C[0,1]$: ב-$\mathbb{R}$ כל נקודה רחוקה מקבוצה סגורה במרחק שמתקבל (טענה
          3.4.10(ב)), אבל קבוצה לא חסומה יכולה "להתקרב באינסוף".
      - kind: result
        text: >-
          (א) $\operatorname{dist}(D,F)=1$, מתקבל; (ב) לא נכון.

  - id: W-3.4-07
    level: mid
    qualitative: true
    objectives: [OBJ-3.4-1]
    prompt: >-
      יהי $K$ מרחב מטרי קומפקטי לא ריק, $f:K\to\mathbb{R}$ רציפה, ו-$Z=\{x\in K: f(x)=\max_Kf\}$ קבוצת נקודות
      המקסימום.

      (א) הוכיחו ש-$Z$ לא ריקה וקומפקטית.

      (ב) נכון או לא נכון: $Z$ תמיד סופית. ונכון או לא נכון: על $(0,1)$, קבוצת נקודות המקסימום של פונקציה רציפה
      וחסומה תמיד לא ריקה.
    answer: >-
      (א) $Z\ne\emptyset$ לפי מסקנה 3.4.3, והיא סגורה בקומפקטי. (ב) לא ולא: $f\equiv0$ על $[0,1]$; $x$ על $(0,1)$.
    solution:
      - kind: step
        text: >-
          (א) לפי מסקנה 3.4.3 יש $q\in K$ עם $f(q)=\max_Kf=:M$, ולכן $q\in Z$.
      - kind: step
        text: >-
          $Z=f^{-1}(\{M\})$. $\{M\}$ סגורה ב-$\mathbb{R}$ (טענה 1.3.5(ב)), ולפי משפט 1.6.4(ג) $Z$ סגורה ב-$K$.
      - kind: theorem
        text: >-
          לפי טענה 3.2.6, קבוצה סגורה בתוך מרחב קומפקטי קומפקטית. לכן $Z$ קומפקטית.
      - kind: step
        text: >-
          (ב) לא נכון: ל-$f\equiv0$ על $[0,1]$, $Z=[0,1]$, אינסופית (וקומפקטית, כמו ש-(א) אומר). והטענה השנייה לא נכונה:
          $f(x)=x$ על $(0,1)$ רציפה וחסומה, ו-$Z=\emptyset$ (טענה 3.4.4(א)).
      - kind: check
        text: >-
          (א) לא השתמשה בשום תכונה של $f$ חוץ מרציפות. ל-$f(x)=\sin\frac1x$ על $[\frac1{20},1]$, $Z$ היא הנקודות
          $\frac1{\pi/2+2\pi k}$ שבתחום, כלומר $k=0,1,2$ (צריך $\frac\pi2+2\pi k\le20$): שלוש נקודות.
      - kind: result
        text: >-
          (א) $Z$ לא ריקה וקומפקטית; (ב) שתי הטענות אינן נכונות.

  - id: W-3.4-08
    level: exam
    objectives: [OBJ-3.4-1]
    prompt: >-
      תהי $L$ הקבוצה של טענה 3.3.10(א): הפונקציות $f\in C[0,1]$ עם $f(0)=0$ ו-$|f(x)-f(y)|\le|x-y|$ לכל $x,y\in[0,1]$,
      עם $d_\infty$. ותהי

      $$\Phi(f)=\int_0^{1/2}f-\int_{1/2}^1f .$$

      (א) הסבירו, בלי לחשב, למה $\Phi$ מקבלת על $L$ מקסימום, בניגוד לכדור היחידה הסגור של $C[0,1]$ (טענה 3.4.4(ה)).

      (ב) הוכיחו ש-$\max_L\Phi=\frac14$, ושהוא מתקבל רק בפונקציה $f(x)=-x$.

      (ג) מהו $\min_L\Phi$?
    answer: >-
      (א) $L$ קומפקטית ולא ריקה ו-$\Phi$ רציפה. (ב)
      $$\begin{aligned}&\Phi(f)\\&\quad=\int_0^{1/2}\big(f(t)-f(1-t)\big)\,dt\\&\quad\le\int_0^{1/2}(1-2t)\,dt=\frac14 .\end{aligned}$$
      (ג) $-\frac14$, ב-$f(x)=x$ בלבד.
    solution:
      - kind: step
        text: >-
          (א) $L$ קומפקטית ב-$(C[0,1],d_\infty)$ (טענה 3.3.10(א)) ולא ריקה ($\theta\in L$). $\Phi$ ליפשיצית עם קבוע 1
          (טענה 3.4.4(ה), שלב 1), ולכן רציפה. לפי מסקנה 3.4.3 יש לה מקסימום על $L$. על $B[\theta,1]$ זה נכשל כי
          $B[\theta,1]$ אינו קומפקטי.
      - kind: computation
        text: >-
          (ב) בהצבה $t=1-s$: $\int_{1/2}^1f(t)\,dt=\int_0^{1/2}f(1-s)\,ds$. לכן
          $$\begin{aligned}&\Phi(f)\\&=\int_0^{1/2}\big(f(t)-f(1-t)\big)\,dt .\end{aligned}$$
      - kind: step
        text: >-
          ל-$t\in[0,\frac12]$ (ליפשיץ):
          $$\begin{aligned}f(t)-f(1-t)&\le|t-(1-t)|\\&=1-2t .\end{aligned}$$
          לפי המונוטוניות של האינטגרל,
          $$\begin{aligned}\Phi(f)&\le\int_0^{1/2}(1-2t)\,dt\\&=\big[t-t^2\big]_0^{1/2}=\frac14 .\end{aligned}$$
      - kind: computation
        text: >-
          ל-$f(x)=-x$ (שייכת ל-$L$): $f(t)-f(1-t)=1-2t$, ולכן $\Phi(f)=\frac14$. ישירות: $\int_0^{1/2}(-x)\,dx=-\frac18$,
          $\int_{1/2}^1(-x)\,dx=-\frac38$, והפרש $\frac14$.
      - kind: step
        text: >-
          (יחידות) אם $\Phi(f)=\frac14$, אז
          $$\begin{aligned}&\int_0^{1/2}\big[(1-2t)\\&\quad-(f(t)-f(1-t))\big]dt\\&\quad=0 ,\end{aligned}$$
          והאינטגרנד רציף ואי-שלילי,
          ולכן אפס זהותית (אינפי 1): $f(t)-f(1-t)=1-2t$ לכל $t\in[0,\frac12]$.
      - kind: step
        text: >-
          לפי ליפשיץ, $f(t)-f(\frac12)\le\frac12-t$ ו-$f(\frac12)-f(1-t)\le\frac12-t$. סכומם הוא $1-2t$, ולכן שניהם
          שוויונות: $f(t)=f(\frac12)+\frac12-t$ ו-$f(1-t)=f(\frac12)-\frac12+t$. כלומר $f(x)=f(\frac12)+\frac12-x$ לכל
          $x\in[0,1]$. מ-$f(0)=0$: $f(\frac12)=-\frac12$, ו-$f(x)=-x$.
      - kind: step
        text: >-
          (ג) אם $f\in L$ אז $-f\in L$, ו-$\Phi(-f)=-\Phi(f)$. לכן $\min_L\Phi=-\max_L\Phi=-\frac14$, ומתקבל רק ב-$f(x)=x$.
      - kind: check
        text: >-
          (ב) בלי התנאי $f(0)=0$ החסם $\frac14$ עדיין נכון, ומתקבל בכל $f(x)=c-x$; התנאי בוחר אחת מהן. ובחישוב:
          $\Phi(\theta)=0$, $\Phi(x)=\frac18-\frac38=-\frac14$, ול-$f(x)=\min(x,1-x)$ (ב-$L$): $\Phi=\frac18-\frac18=0$.
      - kind: result
        text: >-
          $\max_L\Phi=\frac14$ רק ב-$f(x)=-x$; $\min_L\Phi=-\frac14$ רק ב-$f(x)=x$.

  - id: W-3.4-09
    level: exam
    objectives: [OBJ-3.4-2]
    prompt: >-
      תהי $A\subseteq\mathbb{R}$ חסומה ולא ריקה, ו-$f:A\to\mathbb{R}$.

      (א) הוכיחו: אם $f$ רציפה במידה שווה על $A$, יש $g:\overline A\to\mathbb{R}$ רציפה (ואף רציפה במידה שווה) עם
      $g(x)=f(x)$ לכל $x\in A$.

      (ב) הסיקו: $f$ רציפה במידה שווה על $A$ אם ורק אם יש לה המשכה רציפה ל-$\overline A$.

      (ג) הסיקו בעזרת (ב) ש-$\sin\frac1x$ אינה רציפה במידה שווה על $(0,1]$.
    answer: >-
      (א) $g(x)=\lim f(a_n)$ ל-$a_n\to x$ מ-$A$: $f$ מעבירה סדרות קושי לסדרות קושי. (ב) הכיוון השני: $\overline A$ קומפקטית,
      קנטור ומסקנה 3.4.7א. (ג) ל-$\sin\frac1x$ אין גבול ב-0.
    solution:
      - kind: idea
        text: >-
          נקודה של $\overline A$ היא גבול של סדרה מ-$A$; סדרה כזו היא סדרת קושי, ו-$f$ רציפה במידה שווה מעבירה אותה
          לסדרת קושי של מספרים, שמתכנסת. הגבול הוא הערך של $g$.
      - kind: step
        text: >-
          (א) **1.** $f$ מעבירה סדרות קושי לסדרות קושי: יהיו $(a_n)$ סדרת קושי ב-$A$ ו-$\varepsilon>0$; יש $\delta$ מההגדרה
          1.6.8(ב), ויש $N$ עם $|a_n-a_m|<\delta$ ל-$m,n>N$, ולכן $|f(a_n)-f(a_m)|<\varepsilon$.
      - kind: step
        text: >-
          **2.** יהי $x\in\overline A$. לפי משפט 1.5.7(א) יש $a_n\in A$ עם $a_n\to x$. היא סדרת קושי (טענה 2.1.4), ולפי שלב 1
          $(f(a_n))$ סדרת קושי ב-$\mathbb{R}$, ולכן מתכנסת (משפט 2.1.10). נגדיר $g(x)=\lim f(a_n)$.
      - kind: step
        text: >-
          **3.** ההגדרה אינה תלויה בסדרה: אם גם $b_n\in A$, $b_n\to x$, הסדרה המשולבת $a_1,b_1,a_2,b_2,\dots$ שואפת ל-$x$,
          ולפי שלב 2 $f$ שלה מתכנסת; $(f(a_n))$ ו-$(f(b_n))$ הן תת-סדרות שלה, ולפי טענה 1.5.4(א) שתיהן שואפות לאותו
          גבול. ול-$x\in A$, הסדרה הקבועה $a_n=x$ נותנת $g(x)=f(x)$.
      - kind: step
        text: >-
          **4.** $g$ רציפה במידה שווה: יהי $\varepsilon>0$ ו-$\delta$ של $f$ עבור $\frac\varepsilon2$. יהיו $x,y\in\overline A$ עם
          $|x-y|<\delta$, ו-$a_n\to x$, $b_n\to y$ מ-$A$. אז $|a_n-b_n|\to|x-y|<\delta$ (טענה 1.5.6(א)), ולכן מ-$N$
          מסוים $|a_n-b_n|<\delta$ ו-$|f(a_n)-f(b_n)|<\frac\varepsilon2$. מצד שני, לפי שלבים 2 ו-3 (הערך של $g$ אינו
          תלוי בסדרה) $f(a_n)\to g(x)$ ו-$f(b_n)\to g(y)$, ולכן, לפי אריתמטיקה של גבולות ורציפות הערך המוחלט (אינפי
          1), $f(a_n)-f(b_n)\to g(x)-g(y)$ וגם
          $$\begin{aligned}&|f(a_n)-f(b_n)|\\&\quad\to|g(x)-g(y)| .\end{aligned}$$
          אי-שוויון חלש נשמר במעבר לגבול
          (אינפי 1), ולכן $|g(x)-g(y)|\le\frac\varepsilon2<\varepsilon$.
      - kind: step
        text: >-
          (ב) אם $f$ רציפה במידה שווה, (א) נותן המשכה רציפה. ולהפך: $\overline A$ סגורה (טענה 1.4.4(א)) וחסומה (מוכלת
          בקטע סגור שמכיל את $A$), ולכן קומפקטית (משפט 3.2.11); אם $g$ המשכה רציפה, לפי מסקנה 3.4.7א(ב) $f=g|_A$ רציפה
          במידה שווה.
      - kind: step
        text: >-
          (ג) $\overline{(0,1]}=[0,1]$. המשכה רציפה $g$ הייתה נותנת, לפי משפט 1.6.3, $\sin\frac1{x_n}\to g(0)$ לכל
          $x_n\to0$. אבל עם $x_n=\frac1{\pi/2+2\pi n}$ הערכים הם $1$, ועם $y_n=\frac1{3\pi/2+2\pi n}$ הם $-1$. אין המשכה,
          ולפי (ב) אין רציפות במידה שווה.
      - kind: check
        text: >-
          החסימות של $A$ נדרשה רק בכיוון "ולהפך" של (ב): (א) נכון לכל $A\subseteq\mathbb{R}$ (למשל $\sqrt x$ על $(0,\infty)$
          נמשכת ל-$[0,\infty)$). ובלי חסימות (ב) נכשל: $x^2$ על $\mathbb{R}$ היא המשכה רציפה של עצמה ל-$\overline{\mathbb{R}}=\mathbb{R}$,
          ואינה רציפה במידה שווה.
      - kind: result
        text: >-
          (א) $g(x)=\lim f(a_n)$ היא המשכה רציפה במידה שווה; (ב) על $A$ חסומה: רציפה במידה שווה אם ורק אם נמשכת ברציפות
          ל-$\overline A$; (ג) $\sin\frac1x$ אינה רציפה במידה שווה על $(0,1]$.

  - id: W-3.4-10
    level: exam
    qualitative: true
    objectives: [OBJ-3.4-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי.

      (א) תהיינה $K,L\subseteq X$ קומפקטיות ולא ריקות. הוכיחו שיש $k_0\in K$, $l_0\in L$ עם
      $d(k_0,l_0)=\operatorname{dist}(K,L)$.

      (ב) הוכיחו: ב-$\mathbb{R}^n$ עם $d_2$, אם $K$ קומפקטית ו-$F$ סגורה, שתיהן לא ריקות, גם $\operatorname{dist}(K,F)$ מתקבל.

      (ג) האם (ב) נכון בכל מרחב מטרי?
    answer: >-
      (א) $h(k)=\operatorname{dist}(k,L)$ מקבלת מינימום ב-$k_0$, ו-$\operatorname{dist}(k_0,L)$ מתקבל ב-$l_0$. (ב) אותו
      דבר עם טענה 3.4.10(ב). (ג) לא: $K=\{\theta\}$ ו-$F=\{(1+\frac1n)t_n\}$ ב-$C[0,1]$.
    solution:
      - kind: step
        text: >-
          (א) $h(k)=\operatorname{dist}(k,L)$ רציפה על $K$ (טענה 1.6.6(ג)). לפי מסקנה 3.4.3 יש $k_0\in K$ עם
          $h(k_0)\le h(k)$ לכל $k\in K$. לפי טענה 3.4.10(א) יש $l_0\in L$ עם $d(k_0,l_0)=h(k_0)$.
      - kind: step
        text: >-
          לכל $k\in K$, $l\in L$:
          $$\begin{aligned}d(k,l)&\ge h(k)\ge h(k_0)\\&=d(k_0,l_0) .\end{aligned}$$
          לכן $d(k_0,l_0)$ חסם מלרע של הקבוצה
          $\{d(k,l)\}$ ששייך לה, כלומר $\operatorname{dist}(K,L)=d(k_0,l_0)$.
      - kind: step
        text: >-
          (ב) אותם שני שלבים, עם $F$ במקום $L$: $h(k)=\operatorname{dist}(k,F)$ רציפה ומקבלת מינימום ב-$k_0$ (מסקנה
          3.4.3), ולפי טענה 3.4.10(ב) (ב-$\mathbb{R}^n$, $F$ סגורה) יש $y_0\in F$ עם $d_2(k_0,y_0)=h(k_0)$.
      - kind: step
        text: >-
          (ג) לא. ב-$(C[0,1],d_\infty)$ נקח $K=\{\theta\}$ (סופית ולכן קומפקטית) ו-$F=\{(1+\frac1n)t_n: n\in\mathbb{N}\}$,
          עם האוהלים של טענה 3.1.9(ב). לפי טענה 3.4.10 (הדוגמה הנגדית ל-(ב)), $F$ סגורה, $\operatorname{dist}(\theta,F)=1$,
          ו-$\|(1+\frac1n)t_n\|_\infty=1+\frac1n>1$ לכל $n$: המרחק אינו מתקבל.
      - kind: check
        text: >-
          ב-(א) השתמשנו בקומפקטיות פעמיים: של $K$ למינימום של $h$, ושל $L$ למרחק מ-$k_0$. ב-(ב) את השנייה החליף משפט
          היינה-בורל דרך טענה 3.4.10(ב), וזה בדיוק מה שאין ב-$C[0,1]$. דוגמה ל-(א): ב-$\mathbb{R}$, $K=[0,1]$ ו-$L=[3,5]$,
          $\operatorname{dist}=2$ ב-$k_0=1$, $l_0=3$.
      - kind: result
        text: >-
          (א) ו-(ב) נכונים: המרחק מתקבל; (ג) לא נכון במרחב כללי.

challenge:
  - id: W-3.4-c1
    stars: 1
    objectives: [OBJ-3.4-1, OBJ-3.4-3]
    prompt: >-
      יהי $(M,d)$ מרחב מטרי קומפקטי, ו-$f:M\to M$ שומרת מרחקים: $d(f(x),f(y))=d(x,y)$ לכל $x,y\in M$.

      (א) הוכיחו ש-$f$ על.

      (ב) האם הקומפקטיות נחוצה? כלומר: האם יש מרחב מטרי $M$ והעתקה שומרת מרחקים מ-$M$ על תת-קבוצה ממשית של $M$?
      הסבירו.
    answer: >-
      (א) $f(M)$ קומפקטית ולכן סגורה; נקודה $y\notin f(M)$ רחוקה ממנה $r>0$, והאיטרציות $f^n(y)$ רחוקות זו מזו לפחות
      $r$, בסתירה לקומפקטיות. (ב) נחוצה: $x\mapsto x+1$ מ-$[0,\infty)$ על $[1,\infty)$.
    solution:
      - kind: idea
        text: >-
          אם נקודה $y$ "חסרה" בתמונה, היא רחוקה ממנה מרחק חיובי. $f$ שומרת מרחקים, ולכן מעבירה את הפער הזה הלאה: כל
          איטרציה של $y$ רחוקה מכל איטרציה מאוחרת יותר. סדרה מופרדת כזו סותרת קומפקטיות.
      - kind: step
        text: >-
          (א) **1.** $f$ ליפשיצית עם קבוע 1, ולכן רציפה (טענה 1.6.9). לפי משפט 3.4.1 $f(M)$ קומפקטית, ולפי משפט 3.2.5
          סגורה.
      - kind: step
        text: >-
          **2.** נניח בשלילה שיש $y\in M\setminus f(M)$. $f(M)$ סגורה ולא ריקה, ולכן לפי טענה 1.6.6(ד) ($y\notin\overline{f(M)}=f(M)$)
          $r=\operatorname{dist}(y,f(M))>0$.
      - kind: step
        text: >-
          **3.** נגדיר $y_0=y$ ו-$y_n=f(y_{n-1})=f^n(y)$. ל-$0\le n<m$, הפעלה של שמירת המרחקים $n$ פעמים נותנת
          $$\begin{aligned}&d(y_n,y_m)\\&\quad=d\big(f^n(y),f^n(f^{m-n}(y))\big)\\&\quad=d\big(y,f^{m-n}(y)\big) .\end{aligned}$$
      - kind: step
        text: >-
          **4.** $m-n\ge1$, ולכן $f^{m-n}(y)\in f(M)$, ו-$d(y,f^{m-n}(y))\ge r$. כלומר $d(y_n,y_m)\ge r$ לכל $n\ne m$.
      - kind: theorem
        text: >-
          **5.** לפי למה 3.1.4 לאף תת-סדרה של $(y_n)$ אין גבול, בסתירה לכך ש-$M$ קומפקטי, ולכן קומפקטי סדרתית (משפט 3.2.10).
          לכן $f(M)=M$.
      - kind: step
        text: >-
          (ב) הקומפקטיות נחוצה. $f(x)=x+1$ על $M=[0,\infty)$ (סגור ב-$\mathbb{R}$, לא חסום ולכן לא קומפקטי) שומרת מרחקים,
          ו-$f(M)=[1,\infty)\ne M$. כלומר יש העתקה שומרת מרחקים מ-$[0,\infty)$ על תת-הקבוצה הממשית $[1,\infty)$. דוגמה נוספת: ההזזה
          $(x_1,x_2,\dots)\mapsto(0,x_1,x_2,\dots)$ ב-$B(\mathbb{N})$.
      - kind: check
        text: >-
          ב-(ב) הסדרה של שלב 3 היא $y_n=y+n$ מכל $y\in[0,1)$, והיא אכן 1-מופרדת: אין בה תת-סדרה מתכנסת, ובדיוק כאן
          ההוכחה נשברת. ב-$M=S^1$ סיבוב הוא שומר מרחקים ועל, כמו ש-(א) מבטיח.
      - kind: result
        text: >-
          (א) $f$ על; (ב) הקומפקטיות נחוצה: $x\mapsto x+1$ על $[0,\infty)$.
    source:
      name: 'University of British Columbia, Math 320 (Real Analysis), Fall 2007, Homework Sets 9 and 10'
      year: 2007
      problem: 'Problem 7'
      url: 'https://personal.math.ubc.ca/~malabika/teaching/ubc/fall07/math320/hw9-10.pdf'
      verified: '2026-11-11'
      adapted: false

  - id: W-3.4-c2
    stars: 1
    objectives: [OBJ-3.4-2, OBJ-3.4-3]
    prompt: >-
      יהיו $X,Y,Z$ מרחבים מטריים, $Y$ **קומפקטי**. תהי $f:X\to Y$ פונקציה כלשהי, תהי $g:Y\to Z$ רציפה וחד-חד-ערכית,
      ו-$h=g\circ f$.

      (א) הוכיחו: אם $h$ רציפה, אז $f$ רציפה.

      (ב) הוכיחו: אם $h$ רציפה במידה שווה, אז $f$ רציפה במידה שווה. האם ההפך נכון: אם $f$ רציפה במידה שווה, האם $h$
      רציפה במידה שווה?

      (ג) הראו שבלי הקומפקטיות של $Y$ (א) נכשל, גם כש-$X$ ו-$Z$ קומפקטיים.
    answer: >-
      (א)-(ב) $f=g^{-1}\circ h$, ו-$g^{-1}:g(Y)\to Y$ רציפה במידה שווה (משפט 3.4.8 ומשפט קנטור). ההפך נכון: $g$ רציפה
      במידה שווה על $Y$ הקומפקטי. (ג) $X=Z=S^1$, $Y=[0,2\pi)$, $g=\gamma$, $f=\gamma^{-1}$.
    solution:
      - kind: idea
        text: >-
          $g$ היא הומיאומורפיזם מ-$Y$ על התמונה שלו, ולכן אפשר "לבטל" אותה: $f=g^{-1}\circ h$. ההופכית רציפה במידה שווה,
          כי התחום שלה, $g(Y)$, קומפקטי.
      - kind: step
        text: >-
          **1.** $g:Y\to g(Y)$ רציפה, חד-חד-ערכית ועל, ו-$Y$ קומפקטי. לפי משפט 3.4.8 ההופכית $g^{-1}:g(Y)\to Y$ רציפה.
          לפי משפט 3.4.1 $g(Y)$ קומפקטית, ולפי משפט 3.4.6 $g^{-1}$ רציפה במידה שווה.
      - kind: step
        text: >-
          **2.** $h(X)\subseteq g(Y)$, ולכל $x$:
          $$\begin{aligned}g^{-1}(h(x))&=g^{-1}(g(f(x)))\\&=f(x) .\end{aligned}$$
          כלומר $f=g^{-1}\circ h$.
      - kind: step
        text: >-
          (א) הרכבה של רציפות רציפה (טענה 1.6.5(א)). (ב) הרכבה של רציפות במידה שווה רציפה במידה שווה: ל-$\varepsilon>0$
          יש $\eta$ של $g^{-1}$, ול-$\eta$ יש $\delta$ של $h$; אז $d_X(x,x')<\delta$ גורר $d_Z(h(x),h(x'))<\eta$, ולכן
          $d_Y(f(x),f(x'))<\varepsilon$.
      - kind: step
        text: >-
          ההפך: אם $f$ רציפה במידה שווה, $h=g\circ f$ רציפה במידה שווה, כי $g$ רציפה על $Y$ הקומפקטי, ולפי משפט 3.4.6 רציפה
          בו במידה שווה; ושוב הרכבה. (בשאלה המקורית שואלים גם "ומה אם $g$ רציפה במידה שווה": כאן זה אוטומטי.)
      - kind: step
        text: >-
          (ג) $Y=[0,2\pi)$ (לא קומפקטי), $X=Z=S^1$ (קומפקטי, טענה 3.4.9(ג)), $g=\gamma$, $\gamma(t)=(\cos t,\sin t)$,
          רציפה וחד-חד-ערכית, ו-$f=\gamma^{-1}:S^1\to[0,2\pi)$. אז $h=\gamma\circ\gamma^{-1}$ היא הזהות על $S^1$,
          ליפשיצית ולכן רציפה במידה שווה; אבל $f=\gamma^{-1}$ אינה רציפה ב-$(1,0)$ (טענה 3.4.9(א)).
      - kind: check
        text: >-
          הקומפקטיות של $Y$ נכנסה בשלב 1, פעמיים: לרציפות של $g^{-1}$ (משפט 3.4.8) ולקומפקטיות של $g(Y)$ (משפט קנטור).
          בדוגמה של (ג) $g(Y)=S^1$ קומפקטית, ובכל זאת $g^{-1}$ אינה רציפה: הקומפקטיות של התחום של $g$ היא שחסרה.
      - kind: result
        text: >-
          (א) $f$ רציפה; (ב) $f$ רציפה במידה שווה, וההפך נכון; (ג) $\gamma^{-1}$ מ-$S^1$ ל-$[0,2\pi)$.
