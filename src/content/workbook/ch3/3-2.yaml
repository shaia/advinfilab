# Workbook of lesson 3.2 — open covers and the Heine–Borel theorem.
# Objectives (src/course.ts):
#   OBJ-3.2-1  open cover, finite subcover; an explicit cover shows an open interval is not compact
#   OBJ-3.2-2  covers ⇔ sequences in a metric space; the Lebesgue number
#   OBJ-3.2-3  Heine–Borel in Euclidean space
#   OBJ-3.2-4  finite intersection property; compact ⇔ every closed family with the FIP has nonempty intersection
# Results cited by the numbers of the chapter-3 spine (3.1.k, 3.2.k). Lebesgue numbers recomputed exactly with
# largestLebesgue of src/math/cover.ts (W-04: 1/12 at 5/12).
lesson: '3.2'
practice:
  - id: W-3.2-01
    level: basic
    objectives: [OBJ-3.2-1]
    prompt: >-
      לכל אחת מהקבוצות מצאו כיסוי פתוח מפורש שאין לו תת-כיסוי סופי, והוכיחו שאין לו.

      (א) $[0,1)\subseteq\mathbb{R}$.

      (ב) כדור היחידה הפתוח $B(0,1)=\{(x,y):\ x^2+y^2<1\}$ ב-$(\mathbb{R}^2,d_2)$.

      (ג) $\mathbb{Z}\subseteq\mathbb{R}$.
    answer: >-
      (א) $(-1,1-\frac1n)$, $n\ge2$. (ב) $B(0,1-\frac1n)$, $n\ge2$. (ג) $(k-\frac12,\ k+\frac12)$, $k\in\mathbb{Z}$.
    solution:
      - kind: idea
        text: >-
          בכל סעיף בונים כיסוי שבו כל קבוצה "תופסת מעט מדי": ב-(א) ו-(ב) קבוצות עולות שאף אחת מהן לא מגיעה לשפה
          החסרה, וב-(ג) קבוצות שכל אחת מכילה נקודה אחת של הקבוצה.
      - kind: step
        text: >-
          (א) כיסוי פתוח מורכב מקבוצות פתוחות **ב-$\mathbb{R}$** (הגדרה 3.2.1), ולכן לא ניקח $[0,1-\frac1n)$, שאינה
          פתוחה ב-$\mathbb{R}$ (סביב $0$), אלא $U_n=(-1,\ 1-\frac1n)$, $n\ge2$. לכל $x\in[0,1)$ יש לפי ארכימדס $n$ עם
          $n>\max(2,\frac1{1-x})$; אז $n\ge2$ ו-$\frac1n<1-x$, ולכן $x\in U_n$: זה כיסוי פתוח של $[0,1)$.
      - kind: step
        text: >-
          הקבוצות עולות, ולכן איחוד של $U_{n_1},\dots,U_{n_m}$ הוא $U_N$ עם $N=\max n_i$, והנקודה
          $1-\frac1N\in[0,1)$ אינה בו. אין תת-כיסוי סופי.
      - kind: step
        text: >-
          (ב) $W_n=B(0,1-\frac1n)$, $n\ge2$, פתוחים (משפט 1.3.3). אם $\|v\|_2<1$, יש $n$ עם $\frac1n<1-\|v\|_2$, ואז
          $v\in W_n$. איחוד סופי הוא $W_N$ (הכדורים עולים), והנקודה $(1-\frac1N,\ 0)$ נמצאת ב-$B(0,1)$ ולא ב-$W_N$.
      - kind: step
        text: >-
          (ג) $I_k=(k-\frac12,\ k+\frac12)$, $k\in\mathbb{Z}$, פתוחים, ו-$k\in I_k$. כל $I_k$ מכיל שלם אחד בלבד, $k$:
          אם $l\in I_k$ שלם, אז $|l-k|<\frac12$, ולכן $l=k$. איחוד של מספר סופי מהקטעים מכיל מספר סופי של שלמים, ולכן
          אינו מכיל את $\mathbb{Z}$.
      - kind: check
        text: >-
          כל שלוש הקבוצות אינן קומפקטיות גם לפי משפט 3.2.5 ומשפט 3.2.11: (א) ו-(ב) אינן סגורות, (ג) אינה חסומה. הכיסויים
          נותנים הוכחה ישירה, בלי המשפטים.
      - kind: result
        text: >-
          (א) $(-1,1-\frac1n)$; (ב) $B(0,1-\frac1n)$; (ג) $(k-\frac12,k+\frac12)$. בכל אחד, איחוד סופי משאיר נקודה של
          הקבוצה בחוץ.

  - id: W-3.2-02
    level: basic
    objectives: [OBJ-3.2-3]
    qualitative: true
    prompt: >-
      אילו מהקבוצות קומפקטיות? נמקו כל תשובה בעזרת משפט 3.2.11. המטריקה על $\mathbb{R}$ היא $|x-y|$, ועל
      $\mathbb{R}^2$ היא $d_2$.

      (א) $\{x\in\mathbb{R}:\ x^2\le x+2\}$.

      (ב) $\{(x,y)\in\mathbb{R}^2:\ |x|+|y|=1\}$.

      (ג) $\{(x,y)\in\mathbb{R}^2:\ x^2\le y\le1\}$.

      (ד) $\{(x,y)\in\mathbb{R}^2:\ x^2+y^2\le1,\ x\ne0\}$.

      (ה) $\mathbb{Q}\cap[0,1]$.

      (ו) $\{(x,e^x):\ x\in\mathbb{R}\}$.
    answer: >-
      (א), (ב), (ג) קומפקטיות; (ד), (ה) אינן סגורות; (ו) אינה חסומה.
    solution:
      - kind: theorem
        text: >-
          משפט 3.2.11: ב-$\mathbb{R}^n$ (עם $d_1$, $d_2$ או $d_\infty$) קבוצה קומפקטית אם ורק אם היא סגורה וחסומה.
          סגירות של $\{g\le c\}$ או $\{g=c\}$ עם $g$ רציפה: משפט 1.6.4(ג), כי $(-\infty,c]$ ו-$\{c\}$ סגורות.
      - kind: step
        text: >-
          (א)
          $$\begin{aligned}x^2-x-2&=(x-2)(x+1)\\&\le0\end{aligned}$$
          בדיוק כש-$-1\le x\le2$: הקבוצה היא $[-1,2]$, סגורה וחסומה. קומפקטית.
      - kind: step
        text: >-
          (ב) $g(x,y)=|x|+|y|$ רציפה על $(\mathbb{R}^2,d_2)$: ההטלות רציפות (טענה 1.6.5(ג)), הערך המוחלט רציף על
          $\mathbb{R}$ (טענה 1.6.6(ב)), והרכבה וסכום של רציפות רציפים (טענה 1.6.5(א),(ב)). הקבוצה היא המקור של
          $\{1\}$ תחת $g$, ולכן סגורה. בה $x^2+y^2\le(|x|+|y|)^2=1$, ולכן היא מוכלת בכדור הסגור $B[0,1]$ של $d_2$
          סביב הראשית: חסומה. קומפקטית.
      - kind: step
        text: >-
          (ג) החיתוך של $\{x^2-y\le0\}$ ו-$\{y\le1\}$, שתיהן סגורות (פולינומים רציפים, טענה 1.6.5(ג)), ולכן סגורה
          (מסקנה 1.3.8(ב)). בה $0\le x^2\le y\le1$, ולכן $|x|\le1$ ו-$0\le y\le1$: חסומה. קומפקטית.
      - kind: step
        text: >-
          (ד) חסומה, אבל $(\frac1k,0)$ בה לכל $k$ ושואפת ל-$(0,0)$, שאינה בה. לפי מסקנה 1.5.8(ב) אינה סגורה, ולכן אינה
          קומפקטית.
      - kind: step
        text: >-
          (ה) לפי צפיפות $\mathbb{Q}$ (אינפי 1) יש רציונלי $q_k\in(\frac{\sqrt2}2-\frac1k,\ \frac{\sqrt2}2)$, ו-$q_k\in[0,1]$
          ל-$k\ge2$; $q_k\to\frac{\sqrt2}2\notin\mathbb{Q}$. אינה סגורה, אינה קומפקטית.
      - kind: step
        text: >-
          (ו) המקור של $\{0\}$ תחת $y-e^x$ (רציפה): סגורה. אבל $(n,e^n)$ בה ו-$\|(n,e^n)\|_2\ge n$: אינה חסומה (משפט
          3.2.5), ואינה קומפקטית.
      - kind: result
        text: >-
          קומפקטיות: (א) $[-1,2]$, (ב) שפת הריבוע $|x|+|y|=1$, (ג). לא: (ד) ו-(ה) (לא סגורות), (ו) (לא חסומה).

  - id: W-3.2-03
    level: basic
    objectives: [OBJ-3.2-4]
    qualitative: true
    prompt: >-
      לכל משפחה קבעו אם יש לה תכונת החיתוך הסופי, ומצאו את החיתוך של כל המשפחה.

      (א) $\{[-\frac1n,\frac1n]:\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$.

      (ב) $\{(0,\frac1n):\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$.

      (ג) $\{[n,n+1]:\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$.

      (ד) $\{\mathbb{R}\setminus\{q\}:\ q\in\mathbb{Q}\}$ ב-$\mathbb{R}$.

      (ה)
      $$\begin{aligned}F_n=\{f\in C[0,1]:\ &f(0)=0,\\&f(1)\ge n\}\end{aligned}$$
      עבור $n\in\mathbb{N}$, ב-$(C[0,1],d_\infty)$. מה זה אומר על $C[0,1]$
      לפי משפט 3.2.13?
    answer: >-
      (א) כן, $\{0\}$. (ב) כן, $\emptyset$. (ג) לא. (ד) כן, $\mathbb{R}\setminus\mathbb{Q}$. (ה) כן, $\emptyset$; לכן
      $C[0,1]$ אינו קומפקטי.
    solution:
      - kind: definition
        text: >-
          הגדרה 3.2.12: לכל מספר סופי של קבוצות מהמשפחה יש נקודה משותפת. במשפחה יורדת די לבדוק שכל קבוצה לא ריקה:
          חיתוך סופי הוא האחרונה מבין הקבוצות שבו.
      - kind: step
        text: >-
          (א) יורדת ולא ריקה: יש. $0$ בכולן, ואם $x\ne0$, אז $x\notin[-\frac1n,\frac1n]$ כש-$\frac1n<|x|$. החיתוך
          $\{0\}$.
      - kind: step
        text: >-
          (ב) יורדת ולא ריקה: יש. אם $x>0$, אז $x\notin(0,\frac1n)$ כש-$\frac1n\le x$; ו-$x\le0$ אינו באף אחת מהן. החיתוך ריק.
          זה לא סותר את משפט 3.2.13, כי הקבוצות אינן סגורות.
      - kind: step
        text: >-
          (ג) $[1,2]\cap[3,4]=\emptyset$: אין תכונת החיתוך הסופי, אף שכל שתי קבוצות **עוקבות** נחתכות.
      - kind: step
        text: >-
          (ד) חיתוך של מספר סופי מהן הוא $\mathbb{R}$ פחות מספר סופי של נקודות, לא ריק: יש. החיתוך של כולן הוא
          $\mathbb{R}\setminus\mathbb{Q}$, לא ריק. (הקבוצות פתוחות, לא סגורות; התכונה מוגדרת לכל משפחה.)
      - kind: step
        text: >-
          (ה) $|f(t)-g(t)|\le\|f-g\|_\infty$, ולכן $f\mapsto f(t)$ רציפה; $F_n$ היא חיתוך של מקור של $\{0\}$ ומקור של
          $[n,\infty)$, ולכן סגורה (משפט 1.6.4(ג), מסקנה 1.3.8(ב)). $f(x)=Nx$ נמצאת ב-$F_n$ לכל $n\le N$, ולכן חיתוך
          סופי, שהוא $F_N$, לא ריק. אבל אין $f$ עם $f(1)\ge n$ לכל $n$ (ארכימדס): החיתוך ריק.
      - kind: theorem
        text: >-
          לפי משפט 3.2.13(א), משפחה של קבוצות סגורות עם תכונת החיתוך הסופי וחיתוך ריק מראה ש-$C[0,1]$ אינו קומפקטי
          (גם לפי משפט 3.2.5: הוא אינו חסום).
      - kind: result
        text: >-
          (א) $\{0\}$; (ב) $\emptyset$ (לא סגורות); (ג) אין תכונת החיתוך הסופי; (ד) $\mathbb{R}\setminus\mathbb{Q}$;
          (ה) $\emptyset$, ולכן $C[0,1]$ אינו קומפקטי.

  - id: W-3.2-04
    level: mid
    objectives: [OBJ-3.2-2]
    prompt: >-
      המרחב $X=[0,1]$ עם $|x-y|$, והכיסוי הפתוח (ב-$X$) הוא $A_1=[0,\frac12)$, $A_2=(\frac13,\frac23)$,
      $A_3=(\frac12,1]$. מצאו את מספר לבג הגדול ביותר של הכיסוי, והוכיחו. מהי הנקודה שקובעת אותו?
    answer: >-
      $\frac1{12}$, בנקודה $\frac5{12}$ (וגם בנקודה הסימטרית $\frac7{12}$).
    solution:
      - kind: idea
        text: >-
          הנקודות הקשות הן באמצע החפיפות $A_1\cap A_2=(\frac13,\frac12)$ ו-$A_2\cap A_3=(\frac12,\frac23)$, שאורך כל
          אחת $\frac16$. מספר לבג הוא רדיוס: חצי מאורך החפיפה, $\frac1{12}$. הנקודה $\frac12$ עצמה אינה קשה: היא רחוקה
          $\frac16$ מקצות $A_2$.
      - kind: step
        text: >-
          ($\delta=\frac1{12}$ מתאים.) תהי $y\in X$ עם $|y-x|<\frac1{12}$. אם $x\le\frac5{12}$, אז
          $y<\frac5{12}+\frac1{12}=\frac12$, ולכן $B(x,\frac1{12})\subseteq A_1$. אם $\frac5{12}\le x\le\frac7{12}$, אז
          $y>\frac13$ ו-$y<\frac23$, ולכן $B(x,\frac1{12})\subseteq A_2$. אם $x\ge\frac7{12}$, אז $y>\frac12$, ולכן
          $B(x,\frac1{12})\subseteq A_3$.
      - kind: step
        text: >-
          (אף $\delta>\frac1{12}$ אינו מתאים.) ב-$x=\frac5{12}$: $\frac5{12}+\delta>\frac12$, ולכן הכדור מכיל נקודה
          $y\ge\frac12$ של $X$, שאינה ב-$A_1$; $\frac5{12}-\delta<\frac13$, ולכן הוא מכיל נקודה $y\le\frac13$, שאינה
          ב-$A_2$; והוא מכיל את $\frac5{12}<\frac12$, שאינה ב-$A_3$.
      - kind: check
        text: >-
          חישוב מדויק ב-`largestLebesgue` של src/math/cover.ts, על אותו כיסוי (עם $A_1=(-1,\frac12)\cap X$,
          $A_3=(\frac12,2)\cap X$), נותן $\frac1{12}$ בנקודה $\frac5{12}$. הטעות הנפוצה $\frac16$ היא אורך החפיפה.
      - kind: result
        text: >-
          מספר לבג הגדול ביותר הוא $\frac1{12}$, ונקבע בנקודות $\frac5{12}$ ו-$\frac7{12}$.

  - id: W-3.2-05
    level: mid
    objectives: [OBJ-3.2-2]
    prompt: >-
      הוכיחו את הלמה של לבג ישירות מההגדרה בכיסויים, בלי סדרות: אם $(X,d)$ מרחב מטרי קומפקטי (הגדרה 3.2.2) ו-$\{U_\alpha\}_{\alpha\in I}$
      כיסוי פתוח של $X$, יש לכיסוי מספר לבג.
    answer: >-
      לכל $x$ רדיוס $r_x$ עם $B(x,2r_x)$ בתוך קבוצה אחת; מספר סופי של הכדורים $B(x,r_x)$ מכסה; $\delta=\min r_{x_i}$.
    solution:
      - kind: idea
        text: >-
          לכל נקודה יש רדיוס משלה. מכסים בכדורים בחצי הרדיוס, בוחרים מספר סופי, ולוקחים את הקטן מבין הרדיוסים. החצי
          משאיר מקום: כדור ברדיוס $\delta$ סביב נקודה שנמצאת בכדור הקטן סביב $x_i$ נכנס לכדור הכפול סביב $x_i$.
      - kind: step
        text: >-
          לכל $x\in X$, $x\in U_\alpha$ לאיזה $\alpha$, פתוחה, ולכן יש $j\in\mathbb{N}$ ו-$\alpha$ עם
          $B(x,\frac1j)\subseteq U_\alpha$. יהי $j(x)$ ה-$j$ הקטן ביותר כזה ו-$r_x=\frac1{2j(x)}$. אז
          $B(x,2r_x)\subseteq U_\alpha$ לאיזה $\alpha$. (הרדיוס נקבע בנוסחה מפורשת, בלי בחירה.)
      - kind: step
        text: >-
          $\{B(x,r_x)\}_{x\in X}$ כיסוי פתוח של $X$ (משפט 1.3.3). $X$ קומפקטי: יש $x_1,\dots,x_m$ עם
          $X=\bigcup_iB(x_i,r_{x_i})$. נגדיר $\delta=\min_ir_{x_i}>0$.
      - kind: step
        text: >-
          יהי $y\in X$. $y\in B(x_i,r_{x_i})$ לאיזה $i$. לכל $z\in B(y,\delta)$, לפי אי-שוויון המשולש,
          $d(z,x_i)<\delta+r_{x_i}\le2r_{x_i}$. לכן $B(y,\delta)\subseteq B(x_i,2r_{x_i})\subseteq U_\alpha$ לאיזה
          $\alpha$.
      - kind: check
        text: >-
          הקומפקטיות נכנסה רק כדי שהמינימום יהיה על מספר סופי של רדיוסים. ב-$(0,1)$ עם $(\frac1n,1)$ הרדיוסים $r_x$
          שואפים ל-0 כש-$x\to0$, ואין מספר לבג (אחרי למה 3.2.8). זו הגרסה של למה 3.2.8 למרחב קומפקטי בכיסויים. היא אינה נותנת הוכחה שנייה
          של למה 3.2.8 דרך משפט 3.2.10: הכיוון "קומפקטי סדרתית גורר קומפקטי" של משפט 3.2.10 נשען על למה 3.2.8 עצמה,
          וזה היה מעגל.
      - kind: result
        text: >-
          $\delta=\min_ir_{x_i}$ הוא מספר לבג: כל $B(y,\delta)$ מוכל באחת מקבוצות הכיסוי.

  - id: W-3.2-06
    level: mid
    objectives: [OBJ-3.2-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$x_n\to x$ ב-$X$.

      (א) הוכיחו ישירות מההגדרה בכיסויים (בלי משפט 3.2.10) ש-$K=\{x_n:\ n\in\mathbb{N}\}\cup\{x\}$ קומפקטית.

      (ב) הראו בדוגמה ש-$\{x_n:\ n\in\mathbb{N}\}$ לבדה אינה חייבת להיות קומפקטית, ושאם $x_n=x$ לערך אחד לפחות של $n$ היא כן.
    answer: >-
      (א) הקבוצה שמכילה את $x$ בולעת את כל האיברים מאינדקס מסוים. (ב) $\frac1n$ ב-$\mathbb{R}$ לא; עם $x$ בסדרה כן.
    solution:
      - kind: idea
        text: >-
          כמו בטענה 3.2.4(ד): הגבול הוא שמציל. הקבוצה בכיסוי שמכילה את $x$ מכילה כדור סביבו, ומהגדרת ההתכנסות כל
          האיברים מאינדקס מסוים בכדור הזה. נשאר מספר סופי של איברים.
      - kind: step
        text: >-
          (א) יהי $\{U_\alpha\}$ כיסוי פתוח של $K$. $x\in U_{\alpha_0}$ לאיזה $\alpha_0$, ויש $r>0$ עם
          $B(x,r)\subseteq U_{\alpha_0}$. לפי הגדרה 1.5.1 יש $N$ כך ש-$d(x_n,x)<r$ לכל $n>N$, כלומר $x_n\in U_{\alpha_0}$.
      - kind: step
        text: >-
          לכל $n=1,\dots,N$ בוחרים $\alpha_n$ עם $x_n\in U_{\alpha_n}$ (מספר סופי של בחירות). אז
          $K\subseteq U_{\alpha_0}\cup U_{\alpha_1}\cup\dots\cup U_{\alpha_N}$.
      - kind: step
        text: >-
          (ב) $x_n=\frac1n$ ב-$\mathbb{R}$: $\{\frac1n\}$ אינה קומפקטית (טענה 3.2.4(ד)). ואם $x_n=x$ לערך אחד לפחות של
          $n$, אז $x\in\{x_n\}$, ולכן $\{x_n\}=K$, קומפקטית לפי (א).
      - kind: check
        text: >-
          למשל ב-$(C[0,1],d_\infty)$ עם $f_n(t)=\frac tn$ ו-$\theta$ פונקציית האפס: $\|f_n\|_\infty=\frac1n\to0$, ולכן
          $\{f_n\}\cup\{\theta\}$ קומפקטית, אף שכדור היחידה הסגור $B[\theta,1]$ שמכיל אותה אינו קומפקטי.
      - kind: result
        text: >-
          (א) $K$ קומפקטית: $U_{\alpha_0}$ ועוד $N$ קבוצות. (ב) $\{\frac1n\}$ אינה; אם הגבול הוא איבר של הסדרה, כן.

  - id: W-3.2-07
    level: mid
    objectives: [OBJ-3.2-3]
    qualitative: true
    prompt: >-
      נכון או לא נכון? הוכיחו או תנו דוגמה נגדית.

      (א) החיתוך של משפחה לא ריקה של קבוצות קומפקטיות ב-$\mathbb{R}^n$ קומפקטי.

      (ב) איחוד בן מנייה וחסום של קבוצות קומפקטיות ב-$\mathbb{R}$ קומפקטי.

      (ג) הסגור של קבוצה חסומה ב-$\mathbb{R}^n$ קומפקטי.

      (ד) ב-$(C[0,1],d_\infty)$, הסגור של קבוצה חסומה קומפקטי.
    answer: >-
      (א) נכון. (ב) לא נכון. (ג) נכון. (ד) לא נכון.
    solution:
      - kind: step
        text: >-
          (א) **נכון.** כל קבוצה במשפחה סגורה (משפט 3.2.5), ולכן החיתוך סגור (מסקנה 1.3.8(ב)); הוא מוכל באחת מהן,
          שהיא חסומה, ולכן חסום. לפי משפט 3.2.11 קומפקטי. (בכל מרחב מטרי: טענה 3.2.6(א).)
      - kind: step
        text: >-
          (ב) **לא נכון.** $\{\frac1n:\ n\in\mathbb{N}\}=\bigcup_n\{\frac1n\}$, איחוד בן מנייה של יחידונים קומפקטיים,
          מוכל ב-$[0,1]$, ואינו קומפקטי (טענה 3.2.4(ד)).
      - kind: step
        text: >-
          (ג) **נכון.** אם $A\subseteq B(0,R)$, אז $A\subseteq B[0,R]$, שהוא סגור (טענה 1.3.5(א)); לפי טענה 1.4.4(ב)
          $\overline A\subseteq B[0,R]$, ולכן $\overline A$ חסום. $\overline A$ סגור (טענה 1.4.4(א)). לפי משפט 3.2.11
          קומפקטי.
      - kind: step
        text: >-
          (ד) **לא נכון.** קבוצת האוהלים $T=\{t_n:\ n\in\mathbb{N}\}$ (טענה 3.1.9(ב)) חסומה ($\|t_n\|_\infty=1$) וסגורה:
          סדרה מתכנסת ב-$T$ היא סדרת קושי (טענה 2.1.4), ואוהלים שונים רחוקים $1$, ולכן היא קבועה מאינדקס מסוים
          וגבולה ב-$T$. לכן $\overline T=T$. לסדרה $(t_n)$ אין תת-סדרה מתכנסת (למה 3.1.4), ולכן $T$ אינה קומפקטית
          (משפט 3.2.10).
      - kind: result
        text: >-
          (א) נכון; (ב) לא ($\{\frac1n\}$); (ג) נכון; (ד) לא (האוהלים). ההבדל בין (ג) ל-(ד) הוא בדיוק היינה-בורל.

  - id: W-3.2-08
    level: exam
    objectives: [OBJ-3.2-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי קומפקטי, $p\in X$, ו-$(x_n)$ סדרה ב-$X$ כך שכל תת-סדרה **מתכנסת** של $(x_n)$ מתכנסת
      ל-$p$.

      (א) הוכיחו ש-$x_n\to p$.

      (ב) הראו שבלי קומפקטיות זה נכשל: מצאו סדרה ב-$\mathbb{R}$ שכל תת-סדרה מתכנסת שלה מתכנסת ל-$0$, והיא אינה
      מתכנסת.
    answer: >-
      (א) אחרת יש תת-סדרה שרחוקה מ-$p$ לפחות $\varepsilon$; לתת-סדרה שלה יש גבול, והוא חייב להיות $p$: סתירה. (ב)
      $x_n=n$ ל-$n$ זוגי ו-$x_n=0$ ל-$n$ אי-זוגי.
    solution:
      - kind: idea
        text: >-
          אם הסדרה לא מתכנסת ל-$p$, יש אינסוף איברים מחוץ לכדור סביב $p$. הקומפקטיות נותנת לאיברים האלה תת-סדרה
          מתכנסת, והגבול שלה רחוק מ-$p$: סתירה להנחה.
      - kind: step
        text: >-
          (א) נניח בשלילה ש-$x_n\not\to p$. אז יש $\varepsilon>0$ כך שלכל $N$ יש $n>N$ עם $d(x_n,p)\ge\varepsilon$,
          כלומר הקבוצה $A=\{n:\ d(x_n,p)\ge\varepsilon\}$ אינסופית. נגדיר $n_1=\min A$ ו-$n_{k+1}=\min\{n\in A:\ n>n_k\}$
          (קיים כי $A$ אינסופית): תת-סדרה עם $d(x_{n_k},p)\ge\varepsilon$ לכל $k$.
      - kind: theorem
        text: >-
          לפי משפט 3.2.10, $X$ קומפקטי סדרתית: ל-$(x_{n_k})$ יש תת-סדרה $(x_{n_{k_i}})$ שמתכנסת ל-$q\in X$. היא תת-סדרה
          של $(x_n)$ (האינדקסים $n_{k_i}$ עולים ממש), ולכן לפי ההנחה $q=p$.
      - kind: step
        text: >-
          לפי טענה 1.5.6(א), $d(x_{n_{k_i}},p)\to d(p,p)=0$. אבל $d(x_{n_{k_i}},p)\ge\varepsilon$ לכל $i$, ולכן הגבול
          לפחות $\varepsilon>0$ (אינפי 1). סתירה.
      - kind: step
        text: >-
          (ב) $x_n=n$ ל-$n$ זוגי, $x_n=0$ ל-$n$ אי-זוגי. תת-סדרה מתכנסת חסומה (הגדרה וטענה 1.5.3(ג)), ולכן יש בה רק
          מספר סופי של איברים עם אינדקס זוגי; מאינדקס מסוים כל איבריה $0$, וגבולה $0$. אבל $(x_n)$ אינה חסומה, ולכן
          אינה מתכנסת.
      - kind: result
        text: >-
          (א) $x_n\to p$. (ב) $0,2,0,4,0,6,\dots$: כל תת-סדרה מתכנסת שואפת ל-$0$, והסדרה מתבדרת; $\mathbb{R}$ אינו
          קומפקטי.

  - id: W-3.2-09
    level: exam
    objectives: [OBJ-3.2-4]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי קומפקטי, $F_1\supseteq F_2\supseteq\cdots$ קבוצות סגורות ב-$X$, $F=\bigcap_nF_n$, ו-$U$
      קבוצה פתוחה עם $F\subseteq U$.

      (א) הוכיחו שיש $N$ עם $F_N\subseteq U$.

      (ב) הראו שבלי קומפקטיות זה נכשל: $X=\mathbb{R}$, $F_n=\{0\}\cup[n,\infty)$, $U=(-1,1)$.
    answer: >-
      (א) $F_n\setminus U$ סגורות ויורדות עם חיתוך ריק, ולכן לפי מסקנה 3.2.14 אחת מהן ריקה. (ב) $F=\{0\}\subseteq U$
      ו-$F_n\not\subseteq U$ לכל $n$.
    solution:
      - kind: idea
        text: >-
          מה שנשאר מ-$F_n$ מחוץ ל-$U$ הוא סדרה יורדת של קבוצות סגורות שחיתוכן ריק. במרחב קומפקטי זה אפשרי רק אם אחת
          מהן ריקה כבר בשלב סופי.
      - kind: step
        text: >-
          (א) נגדיר $G_n=F_n\setminus U=F_n\cap(X\setminus U)$. $X\setminus U$ סגורה, ולכן $G_n$ סגורה (מסקנה 1.3.8(ב)),
          ו-$G_{n+1}\subseteq G_n$.
      - kind: step
        text: >-
          $$\begin{aligned}\bigcap_nG_n&=\Big(\bigcap_nF_n\Big)\setminus U\\&=F\setminus U=\emptyset .\end{aligned}$$
      - kind: theorem
        text: >-
          אילו כל $G_n$ הייתה לא ריקה, לפי מסקנה 3.2.14 היה $\bigcap_nG_n\ne\emptyset$. לכן יש $N$ עם $G_N=\emptyset$,
          כלומר $F_N\subseteq U$.
      - kind: step
        text: >-
          (ב) $F_n=\{0\}\cup[n,\infty)$ סגורות (איחוד של שתי סגורות) ויורדות, $F=\{0\}\subseteq(-1,1)$, אבל
          $n\in F_n\setminus U$ לכל $n$.
      - kind: check
        text: >-
          ההנחה שהקבוצות לא ריקות לא נדרשה: אם $F=\emptyset$, (א) אומר שגם $F_N=\emptyset$ לאיזה $N$, שזו בדיוק השלילה
          של מסקנה 3.2.14.
      - kind: result
        text: >-
          (א) יש $N$ עם $F_N\subseteq U$. (ב) ב-$\mathbb{R}$ עם $\{0\}\cup[n,\infty)$ ו-$(-1,1)$ אין.

  - id: W-3.2-10
    level: exam
    objectives: [OBJ-3.2-3, OBJ-3.2-2]
    prompt: >-
      (א) תהי $K\subseteq\mathbb{R}^n$ (עם $d_2$) סגורה, חסומה ולא ריקה. הוכיחו שיש $p,q\in K$ עם
      $\|p-q\|_2=\operatorname{diam}K$.

      (ב) הראו ש-(א) נכשל ב-$(C[0,1],d_\infty)$ עבור הקבוצה הסגורה והחסומה $S=\{(1-\frac1n)t_n:\ n\ge2\}$, כאשר $t_n$
      האוהלים של טענה 3.1.9(ב).
    answer: >-
      (א) $K$ קומפקטית (היינה-בורל); זוגות שהמרחק בהם שואף לקוטר, ותת-סדרות מתכנסות. (ב) $\operatorname{diam}S=1$ ואין
      זוג במרחק $1$.
    solution:
      - kind: idea
        text: >-
          בוחרים זוגות שהמרחק ביניהם מתקרב לקוטר. בזכות הקומפקטיות לוקחים תת-סדרה שבה הנקודה הראשונה מתכנסת, ובתוכה
          תת-סדרה שבה גם השנייה מתכנסת; המרחק עובר לגבול.
      - kind: step
        text: >-
          (א) לפי משפט 3.2.11, $K$ קומפקטית, ולפי משפט 3.2.10 קומפקטית סדרתית. $D=\operatorname{diam}K<\infty$ (הגדרה
          וטענה 2.1.2(ב)). לכל $j\in\mathbb{N}$, לפי הגדרת הסופרמום, יש $p_j,q_j\in K$ עם $\|p_j-q_j\|_2>D-\frac1j$;
          בוחרים זוג כזה לכל $j$ (אקסיומת הבחירה הבת מנייה).
      - kind: step
        text: >-
          יש תת-סדרה $p_{j_i}\to p\in K$, ובתוכה תת-סדרה $q_{j_{i_l}}\to q\in K$. גם $p_{j_{i_l}}\to p$ (טענה 1.5.4(א)).
          לפי טענה 1.5.6(א), $\|p_{j_{i_l}}-q_{j_{i_l}}\|_2\to\|p-q\|_2$.
      - kind: step
        text: >-
          לכל $l$: $D-\frac1{j_{i_l}}<\|p_{j_{i_l}}-q_{j_{i_l}}\|_2\le D$, ושני הקצוות שואפים ל-$D$ (כי
          $j_{i_l}\ge l$). לפי כלל הסנדוויץ' $\|p-q\|_2=D$.
      - kind: step
        text: >-
          (ב) ל-$n\ne m$ התומכים של $t_n,t_m$ נחתכים לכל היותר בקצה, ולכן בכל נקודה לכל היותר אחת מ-$(1-\frac1n)t_n$
          ו-$(1-\frac1m)t_m$ שונה מ-$0$, והמרחק ביניהן הוא $\max(1-\frac1n,\ 1-\frac1m)$: לפחות $\frac12$ וקטן ממש
          מ-$1$. לכן
          $$\begin{aligned}&\operatorname{diam}S\\&\quad=\sup_{n\ne m}\max\big(1-\tfrac1n,1-\tfrac1m\big)\\&\quad=1 ,\end{aligned}$$
          ואינו מתקבל.
      - kind: step
        text: >-
          $S$ חסומה ($S\subseteq B[\theta,1]$, עם $\theta$ פונקציית האפס) וסגורה: סדרה מתכנסת ב-$S$ היא סדרת קושי (טענה 2.1.4), ונקודות שונות של $S$
          רחוקות לפחות $\frac12$, ולכן היא קבועה מאינדקס מסוים וגבולה ב-$S$ (מסקנה 1.5.8(ב)).
      - kind: result
        text: >-
          (א) הקוטר של קבוצה סגורה וחסומה ב-$\mathbb{R}^n$ מתקבל. (ב) ב-$C[0,1]$ הקבוצה $S$ סגורה וחסומה, קוטרה $1$,
          ואין בה זוג במרחק $1$: שם אין היינה-בורל.

challenge:
  - id: W-3.2-c1
    stars: 1
    objectives: [OBJ-3.2-2]
    prompt: >-
      תהי $(X,d)$ מרחב מטרי, ו-$f:X\to X$ העתקה **מקטינת מרחקים**: $d(f(x),f(y))<d(x,y)$ לכל $x\ne y$.

      (א) הוכיחו: אם $X$ קומפקטי, ל-$f$ יש נקודת שבת אחת ויחידה.

      (ב) הראו ש-(א) נכשל אם מחליפים "קומפקטי" ב"שלם".

      (ג) הראו ש-$f(x)=x-\frac{x^2}2$ על $X=[0,1]$ מקטינה מרחקים אבל אינה מכווצת (הגדרה 2.3.1): לכן (א) אינו מקרה
      פרטי של משפט בנך.
    answer: >-
      (א) $m=\inf_xd(x,f(x))$ מתקבל בנקודה $p$ (קומפקטיות), ואם $m>0$ אז $d(f(p),f(f(p)))<m$. (ב) $x+\frac1x$ על
      $[1,\infty)$. (ג)
      $$\begin{aligned}&|f(x)-f(y)|\\&\quad=|x-y|\,(1-\tfrac{x+y}2),\end{aligned}$$
      והיחס שואף ל-1 ליד $0$.
    solution:
      - kind: idea
        text: >-
          נקודת שבת היא נקודה שבה המרחק $d(x,f(x))$ מתאפס. במרחב קומפקטי האינפימום של המרחק הזה מתקבל; ואם הוא היה
          חיובי, הפעלה אחת נוספת של $f$ הייתה מקטינה אותו עוד, בסתירה לכך שהוא אינפימום.
      - kind: step
        text: >-
          (א) **1.** $f$ ליפשיצית עם קבוע $1$, ולכן רציפה (טענה 1.6.9). יחידות: אם $f(p)=p$, $f(q)=q$ ו-$p\ne q$, אז
          $$\begin{aligned}d(p,q)&=d(f(p),f(q))\\&<d(p,q),\end{aligned}$$
          סתירה.
      - kind: step
        text: >-
          **2.** יהי
          $$\begin{aligned}m&=\inf\{d(x,f(x)):\ x\in X\}\\&\ge0 .\end{aligned}$$
          לכל $n$ יש $x_n$ עם $d(x_n,f(x_n))<m+\frac1n$; בוחרים כזה לכל
          $n$ (אקסיומת הבחירה הבת מנייה). לפי משפט 3.2.10 יש תת-סדרה $x_{n_k}\to p\in X$.
      - kind: step
        text: >-
          **3.** לפי משפט 1.6.3, $f(x_{n_k})\to f(p)$, ולפי טענה 1.5.6(א), $d(x_{n_k},f(x_{n_k}))\to d(p,f(p))$. מצד שני
          $m\le d(x_{n_k},f(x_{n_k}))<m+\frac1{n_k}$, ולכן הגבול הוא $m$ (סנדוויץ'). כלומר $d(p,f(p))=m$.
      - kind: step
        text: >-
          **4.** אילו $m>0$, אז $f(p)\ne p$, ולפי ההנחה עם $x=f(p)$, $y=p$:
          $$\begin{aligned}d\big(f(f(p)),f(p)\big)&<d(f(p),p)\\&=m ,\end{aligned}$$
          בסתירה לכך ש-$m$ הוא האינפימום. לכן $m=0$ ו-$f(p)=p$.
      - kind: step
        text: >-
          (ב) $X=[1,\infty)$ שלם, ו-$f(x)=x+\frac1x$ מקטינה מרחקים ואין לה נקודת שבת (טענה 2.3.5(ב)). $X$ אינו קומפקטי,
          כי אינו חסום (משפט 3.2.5).
      - kind: step
        text: >-
          (ג)
          $$\begin{aligned}&f(x)-f(y)\\&\quad=(x-y)\big(1-\tfrac{x+y}2\big).\end{aligned}$$
          ל-$x\ne y$ ב-$[0,1]$: $0<x+y<2$ (הם אינם שניהם $0$ ואינם שניהם
          $1$), ולכן $0<1-\frac{x+y}2<1$ ו-$|f(x)-f(y)|<|x-y|$. $f$ עולה ($f'(x)=1-x\ge0$), ולכן
          $f([0,1])=[0,\frac12]\subseteq[0,1]$. עם $y=0$: $\frac{|f(x)-f(0)|}{x}=1-\frac x2\to1$ כש-$x\to0^+$, ולכן אף
          $q<1$ אינו מקדם כיווץ.
      - kind: check
        text: >-
          ב-(ג) נקודת השבת היחידה היא $0$ ($x-\frac{x^2}2=x$ פירושו $x=0$), כמו ש-(א) מבטיח. האיטרציות מ-$x_0=1$:
          $\frac12,\ \frac38,\ \frac{39}{128},\dots$ יורדות ל-$0$, לאט, כי ליד $0$ השיפוע קרוב ל-$1$.
      - kind: result
        text: >-
          (א) במרחב קומפקטי להעתקה מקטינת מרחקים נקודת שבת יחידה; (ב) $x+\frac1x$ על $[1,\infty)$; (ג)
          $x-\frac{x^2}2$ על $[0,1]$ מקטינה מרחקים ואינה מכווצת.
    source:
      name: 'University of Toronto, MAT 327 Introduction to Topology, Assignment 4'
      year: 2023
      problem: 'Problem 1(b), 1(d)'
      url: 'https://www.math.toronto.edu/laithy/3272023/327ps4.pdf'
      verified: '2026-11-11'
      adapted: true

  - id: W-3.2-c2
    stars: 1
    objectives: [OBJ-3.2-1]
    prompt: >-
      הוכיחו שיש מטריקה $d'$ על $\mathbb{R}$ כך שהמרחב המטרי $(\mathbb{R},d')$ קומפקטי. (רמז: העבירו את
      $\mathbb{R}$ בהתאמה חד-חד-ערכית ועל אל $[0,1]$, ומשכו את המטריקה.)
    answer: >-
      $d'(x,y)=|\varphi(x)-\varphi(y)|$ עם $\varphi:\mathbb{R}\to[0,1]$ חד-חד-ערכית ועל; $\varphi$ מעבירה כיסויים פתוחים
      לכיסויים פתוחים של $[0,1]$, שהוא קומפקטי.
    solution:
      - kind: idea
        text: >-
          קומפקטיות היא תכונה של קבוצה **ומטריקה**. אם קיימת התאמה $\varphi$ בין $\mathbb{R}$ ל-$[0,1]$, מגדירים את
          המרחק בין שני ממשיים כמרחק בין התמונות שלהם; אז $(\mathbb{R},d')$ הוא "עותק" של $[0,1]$, והקומפקטיות עוברת.
          את ההתאמה בונים בשני שלבים: $\arctan$ נותנת התאמה בין $\mathbb{R}$ לקטע הפתוח $(0,1)$, וחסרות בו רק שתי
          הנקודות $0$ ו-$1$. מפנים להן מקום על ידי הזזת הסדרה $\frac12,\frac13,\frac14,\dots$ שני צעדים: $\frac12$
          ו-$\frac13$ עוברות ל-$0$ ול-$1$, וכל $\frac1n$ אחרת עוברת ל-$\frac1{n-2}$. כך אף נקודה לא הולכת לאיבוד.
      - kind: step
        text: >-
          **1. (ההתאמה.)** $h(x)=\frac12+\frac1\pi\arctan x$ עולה ממש ורציפה מ-$\mathbb{R}$ ל-$(0,1)$, עם גבולות $0$
          ו-$1$ באינסוף, ולכן לפי משפט ערך הביניים (אינפי 1) היא חד-חד-ערכית ועל $(0,1)$. נגדיר $g:(0,1)\to[0,1]$:
          $g(\frac12)=0$, $g(\frac13)=1$, $g(\frac1n)=\frac1{n-2}$ ל-$n\ge4$, ו-$g(x)=x$ לכל $x$ אחר. $g$ שולחת את
          $\{\frac1n:\ n\ge2\}$ חד-חד-ערכית ועל $\{0,1\}\cup\{\frac1k:\ k\ge2\}$, ואת השאר על עצמו; לכן $g$ חד-חד-ערכית
          ועל. $\varphi=g\circ h$.
      - kind: step
        text: >-
          **2. (המטריקה.)** $d'(x,y)=|\varphi(x)-\varphi(y)|$ היא מטריקה על $\mathbb{R}$ לפי טענה 1.1.13(ב), כי $\varphi$
          חד-חד-ערכית. לפי ההגדרה $\varphi$ שומרת מרחקים, ולכן לכל $x$ ו-$r>0$:
          $\varphi\big(B_{d'}(x,r)\big)=B_{[0,1]}(\varphi(x),r)$ ($\varphi$ על).
      - kind: step
        text: >-
          **3. (פתוחות עוברות לפתוחות.)** אם $U$ פתוחה ב-$(\mathbb{R},d')$ ו-$t=\varphi(x)\in\varphi(U)$, יש $r>0$ עם
          $B_{d'}(x,r)\subseteq U$, ולכן
          $$\begin{aligned}B_{[0,1]}(t,r)&=\varphi(B_{d'}(x,r))\\&\subseteq\varphi(U) :\end{aligned}$$
          $\varphi(U)$ פתוחה
          ב-$[0,1]$.
      - kind: step
        text: >-
          **4. (קומפקטיות.)** יהי $\{U_\alpha\}$ כיסוי פתוח של $(\mathbb{R},d')$. $\{\varphi(U_\alpha)\}$ כיסוי פתוח של
          $[0,1]$ ($\varphi$ על). $[0,1]$ קומפקטי (טענה 3.2.11א): $[0,1]=\varphi(U_{\alpha_1})\cup\dots\cup\varphi(U_{\alpha_m})$.
          $\varphi$ חד-חד-ערכית ועל, ולכן $\mathbb{R}=U_{\alpha_1}\cup\dots\cup U_{\alpha_m}$.
      - kind: check
        text: >-
          זה לא סותר את טענה 3.2.4(ב): שם המטריקה היא $|x-y|$. ב-$d'$ המרחב חסום ($d'\le1$), כמו שמשפט 3.2.5 דורש,
          ואפילו הסדרה $1,2,3,\dots$ מתכנסת: ל-$n\ge1$, $h(n)\ge\frac34>\frac12$, ולכן $h(n)$ אינו מהצורה $\frac1k$
          ו-$\varphi(n)=h(n)\to1$. עם $c=-\frac1{\sqrt3}$: $h(c)=\frac12-\frac16=\frac13$ ו-$\varphi(c)=g(\frac13)=1$.
          לכן $d'(n,c)=|\varphi(n)-1|\to0$: ב-$d'$, $n\to-\frac1{\sqrt3}$.
      - kind: result
        text: >-
          $d'(x,y)=|\varphi(x)-\varphi(y)|$ עם $\varphi=g\circ h$ הופכת את $\mathbb{R}$ למרחב קומפקטי. קומפקטיות תלויה
          במטריקה, לא רק בקבוצה.
