  - id: W-4.2-c2
    stars: 1
    objectives: [OBJ-4.2-1]
    prompt: >-
      $I=[a,b]$ קטע סגור וחסום, $f_n\in C(I)$, ולכל $x\in I$: $f_1(x)\le f_2(x)\le\dots$ ו-$f_n(x)\to f(x)$. הוכיחו
      ש-$\{f_n:\ n\in\mathbb{N}\}$ רציפה במידה אחידה על $I$ אם ורק אם $f$ רציפה על $I$.
    answer: >-
      ($\Rightarrow$) טענה 4.2.3(ד): גבול נקודתי של איברי משפחה רציפה במידה אחידה רציף. ($\Leftarrow$) $h_n=f-f_n\ge0$
      רציפות ויורדות ל-0; הקבוצות $\{h_n<\varepsilon\}$ פתוחות, עולות ומכסות את $I$, ומהקומפקטיות אחת מהן היא $I$: התכנסות
      במידה שווה, ואז משפט 4.2.8(א).
    solution:
      - kind: idea
        text: >-
          כיוון אחד הוא "גבול נקודתי של משפחה רציפה במידה אחידה רציף". בכיוון השני המונוטוניות והקומפקטיות הופכות
          התכנסות נקודתית להתכנסות במידה שווה (זה משפט דיני), ומשם משפט 4.2.8.
      - kind: step
        text: >-
          ($\Rightarrow$) $f$ גבול נקודתי של סדרה במשפחה, ולפי טענה 4.2.3(ד),(א) $f$ רציפה במידה שווה, ובפרט רציפה.
      - kind: step
        text: >-
          ($\Leftarrow$) **1.** נניח ש-$f$ רציפה, ונגדיר $h_n=f-f_n$: רציפות (טענה 1.6.5), $h_n\ge0$ (גבול של סדרה עולה
          גדול מכל איבריה), $h_{n+1}\le h_n$, ו-$h_n(x)\to0$ לכל $x$.
      - kind: step
        text: >-
          **2.** יהי $\varepsilon>0$, ו-$U_n=\{x\in I:\ h_n(x)<\varepsilon\}$. $U_n$ פתוחה ב-$I$ (מקור של קבוצה פתוחה,
          משפט 1.6.4), $U_n\subseteq U_{n+1}$ (כי $h_{n+1}\le h_n$), ו-$\bigcup_nU_n=I$ (כי $h_n(x)\to0$).
      - kind: step
        text: >-
          **3.** $I$ קומפקטי (משפט 3.2.11; כמרחב, טענה 3.2.3): יש $U_{n_1},\dots,U_{n_k}$ שמכסות את $I$, ועם
          $N=\max_jn_j$ הקבוצות עולות ולכן $U_N=I$. לכל $n\ge N$ ולכל $x$: $0\le h_n(x)\le h_N(x)<\varepsilon$. כלומר
          $f_n\to f$ במידה שווה.
      - kind: theorem
        text: >-
          **4.** לפי משפט 4.2.8(א) (עם $f_n,f\in C(I)$ ו-$\|f_n-f\|_\infty\to0$, טענה 4.1.3), $\{f_n\}$ רציפה במידה אחידה.
      - kind: check
        text: >-
          המונוטוניות נחוצה ב-($\Leftarrow$): האוהלים $t_n$ מתכנסים נקודתית לגבול הרציף $0$, והמשפחה אינה רציפה במידה
          אחידה (טענה 4.2.7(ג)); הם אינם סדרה עולה. וב-($\Rightarrow$) המונוטוניות אינה נחוצה כלל, וגם לא הכיוון שלה:
          ההוכחה של ($\Rightarrow$) לא השתמשה בה. למשל $x^n$ היא סדרה **יורדת**, לא עולה כמו בשאלה; הגבול שלה אינו רציף,
          ובהתאם ל-($\Rightarrow$) המשפחה $\{x^n\}$ אינה רציפה במידה אחידה.
      - kind: result
        text: >-
          המשפחה רציפה במידה אחידה בדיוק כשהגבול $f$ רציף.
