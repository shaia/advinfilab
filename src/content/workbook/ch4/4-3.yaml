# Workbook of lesson 4.3 — the Arzelà–Ascoli theorem (enrichment).
# Objectives (src/course.ts):
#   OBJ-4.3-1  state Arzelà–Ascoli: a subset of C(K) has compact closure iff it is bounded and equicontinuous
#   OBJ-4.3-2  build the subsequence by the diagonal argument on a countable dense set; the role of each hypothesis
#   OBJ-4.3-3  apply it to get a uniformly convergent subsequence, and show the conclusion fails without a hypothesis
# Results cited by the numbers of the chapter-4 spine (.claude/ch4-spine.md). Numbers recomputed with npx tsx
# (max x(1−x) = 1/4, max |1 − 2x| = 1, the bound 4 of W-04).
lesson: '4.3'
practice:
  - id: W-4.3-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.3-1]
    prompt: >-
      נכון או לא נכון? נמקו בהוכחה או בדוגמה נגדית. $K$ מרחב מטרי קומפקטי לא ריק.


      (א) כל תת-קבוצה סופית של $C(K)$ קומפקטית יחסית.


      (ב) תת-קבוצה של קבוצה קומפקטית יחסית ב-$C(K)$ היא קומפקטית יחסית.


      (ג) כל משפחה ב-$C[0,1]$ שחסומה נקודתית חסומה במידה שווה.
    answer: >-
      (א) נכון; (ב) נכון; (ג) לא נכון: $\{n^2x(1-x)^n:\ n\in\mathbb{N}\}$.
    solution:
      - kind: theorem
        text: >-
          טענה 3.2.4(א): קבוצה סופית קומפקטית. טענה 3.2.6(א): תת-קבוצה סגורה של קבוצה קומפקטית קומפקטית. מאינפי 1:
          ל-$0\le q<1$, $n^2q^n\to0$; סדרה מתכנסת חסומה; ואי-שוויון ברנולי $(1+h)^n\ge1+nh$ ל-$h\ge-1$.
      - kind: step
        text: >-
          (א) קבוצה סופית סגורה (המשלים של נקודה פתוח, ואיחוד סופי של סגורות סגור), ולכן שווה לסגור שלה, שהוא סופי
          ולפי טענה 3.2.4(א) קומפקטי.
      - kind: step
        text: >-
          (ב) אם $\mathcal{G}\subseteq\mathcal{F}$, אז $\overline{\mathcal{G}}\subseteq\overline{\mathcal{F}}$ (טענה
          1.4.4(ב): $\overline{\mathcal{F}}$ סגורה ומכילה את $\mathcal{G}$). $\overline{\mathcal{G}}$ סגורה ומוכלת
          בקבוצה הקומפקטית $\overline{\mathcal{F}}$, ולפי טענה 3.2.6(א) היא קומפקטית.
      - kind: step
        text: >-
          (ג) לא נכון. תהי $f_n(x)=n^2x(1-x)^n$ על $[0,1]$, רציפה (פולינום). חסומה נקודתית: ב-$x=0$ כל הערכים $0$;
          ול-$x\in(0,1]$, עם $q=1-x\in[0,1)$, הסדרה $f_n(x)=x\cdot n^2q^n$ שואפת ל-$0$, ולכן חסומה (בחסם שתלוי
          ב-$x$).
      - kind: computation
        text: >-
          אינה חסומה במידה שווה: ב-$x=\frac1{2n}$, לפי ברנולי עם $h=-\frac1{2n}$,

          $$\begin{aligned}f_n\big(\tfrac1{2n}\big)&=\tfrac n2\big(1-\tfrac1{2n}\big)^n\\&\ge\tfrac n2\big(1-\tfrac n{2n}\big)=\tfrac n4 .\end{aligned}$$

          לכן $\|f_n\|_\infty\ge\frac n4\to\infty$, ואין $M$ אחד.
      - kind: check
        text: >-
          ב-(ג) טענה 4.3.5 אינה סותרת: לפיה, משפחה חסומה נקודתית שאינה חסומה במידה שווה אינה יכולה להיות רציפה במידה
          אחידה; ואכן $\{f_n\}$ אינה רציפה במידה אחידה ב-$0$, כי $f_n(0)=0$ ו-$f_n(\frac1{2n})\ge\frac n4$ עם
          $\frac1{2n}\to0$. דוגמה אחרת מאותו סוג: $\{n\,t_n\}$ של השיעור.
      - kind: result
        text: '(א) נכון; (ב) נכון; (ג) לא נכון, למשל $\{n^2x(1-x)^n:\ n\in\mathbb{N}\}$.'

  - id: W-4.3-02
    level: basic
    objectives: [OBJ-4.3-1]
    prompt: >-
      ב-$C[0,1]$ תהי $\mathcal{F}=\{f_c:\ |c|\le2\}$ עם $f_c(x)=c\,x(1-x)$.


      (א) מצאו את החסם הקטן ביותר $M$ עם $|f(x)|\le M$ לכל $f\in\mathcal{F}$ ולכל $x$.


      (ב) מצאו קבוע ליפשיץ משותף לאיברי $\mathcal{F}$.


      (ג) האם $\mathcal{F}$ קומפקטית יחסית? האם היא קומפקטית?
    answer: >-
      (א) $M=\frac12$; (ב) $2$; (ג) קומפקטית יחסית, ואף קומפקטית.
    solution:
      - kind: computation
        text: >-
          (א) $x(1-x)$ מקבלת על $[0,1]$ מקסימום $\frac14$ ב-$x=\frac12$ (נגזרת $1-2x$), ומינימום $0$ בקצוות. לכן
          $\|f_c\|_\infty=\frac{|c|}4\le\frac12$, ושוויון ב-$c=\pm2$.
      - kind: computation
        text: >-
          (ב) $f_c'(x)=c(1-2x)$, ו-$|1-2x|\le1$ על $[0,1]$, ולכן $|f_c'|\le2$. לפי משפט לגרנז' כל $f_c$ ליפשיצית עם
          קבוע $2$.
      - kind: theorem
        text: >-
          (ג) לפי טענה 4.2.5(א) $\mathcal{F}$ רציפה במידה אחידה, והיא חסומה במידה שווה; לפי משפט 4.3.7 היא קומפקטית
          יחסית.
      - kind: step
        text: >-
          קומפקטיות: $f_c-f_d=(c-d)\,x(1-x)$, ולפי (א) $\|f_c-f_d\|_\infty=\frac{|c-d|}4$, כלומר ההעתקה
          $\Phi:[-2,2]\to C[0,1]$, $\Phi(c)=f_c$, מכפילה מרחקים ב-$\frac14$, ובפרט רציפה. $[-2,2]$ קומפקטי (משפט
          3.2.11), ולפי משפט 3.4.1 התמונה $\Phi([-2,2])=\mathcal{F}$ קומפקטית.
      - kind: check
        text: >-
          דרך שנייה, דרך מסקנה 4.3.9: מספיק ש-$\mathcal{F}$ סגורה. אם $f_{c_n}\to g$ ב-$C[0,1]$, אז $(f_{c_n})$
          מתכנסת ולכן סדרת קושי (טענה 2.1.4), ו-$|c_n-c_m|=4\|f_{c_n}-f_{c_m}\|_\infty$, כך ש-$(c_n)$ סדרת קושי
          ב-$\mathbb{R}$. היא מתכנסת ל-$c$, ו-$c\in[-2,2]$ כי האי-שוויון החלש $|c_n|\le2$ עובר לגבול. אז
          $\|f_{c_n}-f_c\|_\infty=\frac{|c_n-c|}4\to0$, ולפי יחידות הגבול $g=f_c\in\mathcal{F}$. לפי מסקנה 1.5.8(ב)
          $\mathcal{F}$ סגורה.
      - kind: result
        text: '(א) $\frac12$; (ב) $2$; (ג) $\mathcal{F}$ קומפקטית, ובפרט קומפקטית יחסית.'

  - id: W-4.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      בהוכחת למה 4.3.6 סטודנטית מציעה להגדיר את $n_k$ כ**איבר הראשון** של השורה $N_k$, במקום האיבר ה-$k$. הראו
      בדוגמה שההצעה אינה נותנת בהכרח תת-סדרה, ונמקו למה האיבר ה-$k$ כן נותן.
    answer: >-
      אם כל השורות הן $\mathbb{N}$, האיבר הראשון של כל אחת הוא $1$, ו-$n_k=1$ לכל $k$ אינה עולה ממש. האיבר ה-$k$
      נותן $n_k<n_{k+1}$ כי $N_{k+1}(k+1)\ge N_k(k+1)$ ו-$N_k(k+1)>N_k(k)$.
    solution:
      - kind: idea
        text: >-
          תת-סדרה דורשת אינדקסים עולים ממש. האיבר הראשון של שורה יכול לחזור על עצמו משורה לשורה; האיבר ה-$k$ "זז
          ימינה" לפחות במקום אחד בכל שורה.
      - kind: step
        text: >-
          דוגמה: $f_n\equiv0$ לכל $n$, על $D=\{q_1,q_2,\dots\}$ כלשהי. הסדרה $(f_n(q_j))$ קבועה ומתכנסת לאורך כל
          $\mathbb{N}$, ולכן מותר לבחור $N_j=\mathbb{N}$ לכל $j$. האיבר הראשון של כל שורה הוא $1$, ולפי ההצעה $n_k=1$
          לכל $k$: זו אינה תת-סדרה.
      - kind: step
        text: >-
          עם האיבר ה-$k$: $n_k=N_k(k)$. לפי שלב 2 בהוכחת הלמה, $N_{k+1}\subseteq N_k$ גורר
          $N_{k+1}(k+1)\ge N_k(k+1)$, ו-$N_k(k+1)>N_k(k)$ כי השורה רשומה בסדר עולה. לכן $n_{k+1}>n_k$. בדוגמה:
          $n_k=k$, הסדרה כולה.
      - kind: check
        text: >-
          אפשר גם לתקן את ההצעה אחרת: לבחור את $n_k$ כאיבר הקטן ביותר של $N_k$ שגדול מ-$n_{k-1}$, כמו בהוכחת משפט
          3.3.7. גם כך $n_k\in N_k$, וזה כל מה ששלב 4 של ההוכחה צריך.
      - kind: result
        text: >-
          ההצעה נכשלת כש-$N_j=\mathbb{N}$ לכל $j$ ($n_k=1$ קבוע); האיבר ה-$k$ עולה ממש כי השורות מקוננות.

  - id: W-4.3-04
    level: mid
    objectives: [OBJ-4.3-3]
    prompt: >-
      תהי $\mathcal{F}$ קבוצת הפונקציות $f\in C^1[0,2]$ עם $|f(1)|\le3$ ו-$|f'(t)|\le1$ לכל $t\in[0,2]$, כאשר $C^1[0,2]$ מוגדר
      כמו $C^1[0,1]$ בשיעור: פונקציות גזירות בכל נקודה של $[0,2]$ (חד-צדדית בקצוות) עם נגזרת רציפה.


      (א) הוכיחו ש-$\|f\|_\infty\le4$ לכל $f\in\mathcal{F}$, ושהחסם מתקבל.


      (ב) הוכיחו שלכל סדרה ב-$\mathcal{F}$ יש תת-סדרה שמתכנסת במידה שווה על $[0,2]$.


      (ג) הוכיחו שהגבול של תת-סדרה כזו מקיים $|g(1)|\le3$ ו-$|g(x)-g(y)|\le|x-y|$.
    answer: >-
      (א) $|f(x)|\le|f(1)|+|x-1|$, ושני המחוברים חסומים ב-$3$ וב-$1$; שוויון ל-$f(x)=x+2$ ב-$x=2$; (ב) ארצלה-אסקולי; (ג) אי-שוויונות חלשים עוברים
      לגבול.
    solution:
      - kind: step
        text: >-
          (א) לפי משפט לגרנז', לכל $x\in[0,2]$ יש $c$ בין $1$ ל-$x$ עם $f(x)-f(1)=f'(c)(x-1)$, ולכן

          $$\begin{aligned}|f(x)|&\le|f(1)|+|x-1|\\&\le3+1=4 .\end{aligned}$$
      - kind: computation
        text: >-
          $f(x)=x+2$: $f(1)=3$, $f'\equiv1$, ולכן $f\in\mathcal{F}$, ו-$f(2)=4$. החסם $4$ מתקבל.
      - kind: theorem
        text: >-
          (ב) אותו משפט לגרנז' נותן $|f(x)-f(y)|\le|x-y|$ לכל $f\in\mathcal{F}$: קבוע ליפשיץ משותף $1$, ולפי טענה
          4.2.5(ב) $\mathcal{F}$ רציפה במידה אחידה. עם (א) היא חסומה במידה שווה, ולפי משפט 4.3.7 ((ii)$\Rightarrow$(iii))
          לכל סדרה בה יש תת-סדרה שמתכנסת במידה שווה.
      - kind: step
        text: >-
          (ג) אם $f_{n_k}\to g$ במידה שווה, אז בפרט $f_{n_k}(x)\to g(x)$ לכל $x$. האי-שוויונות $|f_{n_k}(1)|\le3$
          ו-$|f_{n_k}(x)-f_{n_k}(y)|\le|x-y|$ חלשים, ועוברים לגבול (אינפי 1).
      - kind: check
        text: >-
          הגבול אינו חייב להיות ב-$C^1$: הפונקציות $\sqrt{(x-1)^2+\frac1{n^2}}$ ב-$\mathcal{F}$ (ל-$n\ge1$:
          $|f(1)|=\frac1n\le3$ והשיפוע קטן מ-$1$) מתכנסות במידה שווה ל-$|x-1|$, כמו בטענה 4.3.11(א).
      - kind: result
        text: '(א) $\|f\|_\infty\le4$, ו-$x+2$ מגיעה ל-$4$; (ב) לפי ארצלה-אסקולי; (ג) הגבול ליפשיצי עם קבוע $1$ ו-$|g(1)|\le3$.'

  - id: W-4.3-05
    level: mid
    objectives: [OBJ-4.3-1, OBJ-4.3-3]
    prompt: >-
      יהי $K$ מרחב מטרי קומפקטי לא ריק, $\mathcal{F}\subseteq C(K)$ קומפקטית יחסית, ו-$\varphi:\mathbb{R}\to\mathbb{R}$
      רציפה. הוכיחו ש-$\{\varphi\circ f:\ f\in\mathcal{F}\}$ קומפקטית יחסית.
    answer: >-
      לפי ארצלה-אסקולי $|f|\le M$ ו-$\mathcal{F}$ רציפה במידה אחידה; $\varphi$ רציפה במידה שווה על $[-M,M]$; ההרכבה
      חסומה ב-$\max_{[-M,M]}|\varphi|$ ורציפה במידה אחידה.
    solution:
      - kind: theorem
        text: >-
          משפט 4.3.7 בשני הכיוונים; משפט 3.4.6 (קנטור) ומסקנה 3.4.3 ל-$\varphi$ על הקטע הקומפקטי $[-M,M]$.
      - kind: step
        text: >-
          לפי משפט 4.3.7 ((i)$\Rightarrow$(ii)) יש $M\ge0$ עם $|f(x)|\le M$ לכל $f\in\mathcal{F}$ ו-$x\in K$, ו-$\mathcal{F}$
          רציפה במידה אחידה. כל $\varphi\circ f$ רציפה (טענה 1.6.5), כלומר ב-$C(K)$.
      - kind: step
        text: >-
          חסימות: $[-M,M]$ קומפקטי, ולפי מסקנה 3.4.3 $|\varphi|\le C$ עליו. לכן $|\varphi(f(x))|\le C$ לכל $f,x$.
      - kind: step
        text: >-
          רציפות במידה אחידה: יהי $\varepsilon>0$. לפי משפט 3.4.6 $\varphi$ רציפה במידה שווה על $[-M,M]$: יש $\eta>0$
          עם $|\varphi(s)-\varphi(t)|<\varepsilon$ כש-$s,t\in[-M,M]$ ו-$|s-t|<\eta$. ל-$\mathcal{F}$ יש $\delta$ עבור
          $\eta$. אם $d(x,y)<\delta$, אז $|f(x)-f(y)|<\eta$ ושני הערכים ב-$[-M,M]$, ולכן
          $|\varphi(f(x))-\varphi(f(y))|<\varepsilon$, לכל $f\in\mathcal{F}$.
      - kind: step
        text: >-
          לפי משפט 4.3.7 ((ii)$\Rightarrow$(i)) המשפחה $\{\varphi\circ f\}$ קומפקטית יחסית.
      - kind: check
        text: >-
          דוגמה 6(א) בשיעור היא המקרה $\varphi=|\cdot|$: שם $\varphi$ ליפשיצית עם קבוע $1$ על כל $\mathbb{R}$, ואין
          צורך במשפט קנטור. ל-$\varphi$ רציפה כללית, הרציפות במידה שווה באה רק על הקטע הקומפקטי $[-M,M]$, ולכן החסם
          $M$ נחוץ כאן כדי שתהיה רציפות במידה שווה של $\varphi$: $\varphi(s)=s^2$ אינה רציפה במידה שווה על
          $\mathbb{R}$. בלי חסימות, $\{x+c:\ c\in\mathbb{R}\}$ רציפה במידה אחידה ו-$\{(x+c)^2\}$ אינה (השיפוע
          $2(x+c)$ אינו חסום).
      - kind: result
        text: '$\{\varphi\circ f:\ f\in\mathcal{F}\}$ חסומה במידה שווה ורציפה במידה אחידה, ולכן קומפקטית יחסית.'

  - id: W-4.3-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      בבנייה של למה 4.3.6 התקבלו שורות $N_1\supseteq N_2\supseteq\cdots$ והאלכסון $n_k=N_k(k)$. נכון או לא נכון?
      נמקו.


      (א) לאורך $N_5$ הסדרה $(f_n(q_j))$ מתכנסת לכל $j\le5$.


      (ב) לאורך $N_5$ הסדרה $(f_n(q_6))$ מתכנסת.


      (ג) כל איברי האלכסון $n_1,n_2,\dots$ שייכים ל-$N_5$.


      (ד) $n_k\in N_5$ לכל $k\ge5$.
    answer: >-
      (א) נכון; (ב) לא בהכרח; (ג) לא בהכרח; (ד) נכון.
    solution:
      - kind: step
        text: >-
          (א) $N_5\subseteq N_j$ לכל $j\le5$. לאורך $N_j$ הסדרה מתכנסת ב-$q_j$, וסדרה לאורך $N_5$ היא תת-סדרה שלה,
          ולכן מתכנסת לאותו גבול.
      - kind: step
        text: >-
          (ב) לא בהכרח. בדוגמה 2 של השיעור (הספרות הבינאריות, $q_j=j$), $N_5=32\mathbb{N}$, והספרה השישית של
          $32m$ היא הספרה הראשונה של $m$: $0,1,0,1,\dots$ לאורך $m=1,2,3,\dots$, שאינה מתכנסת.
      - kind: step
        text: >-
          (ג) לא בהכרח. באותה דוגמה $n_1=2\notin32\mathbb{N}=N_5$.
      - kind: step
        text: >-
          (ד) נכון: ל-$k\ge5$, $n_k\in N_k\subseteq N_5$ (שלב 4 בהוכחת הלמה).
      - kind: check
        text: >-
          (ג) ו-(ד) יחד: האלכסון כולו תמיד מוכל ב-$N_1$ (כי $n_k\in N_k\subseteq N_1$), אבל לא בהכרח בשורות $N_j$
          עם $j\ge2$ (בדוגמה 2, $n_1=2\notin N_2=4\mathbb{N}$); מה שמובטח הוא שהזנב ממקום $j$ מוכל ב-$N_j$. זה מספיק
          להתכנסות ב-$q_5$, כי מספר סופי של איברים אינו משנה גבול.
      - kind: result
        text: '(א) נכון; (ב) לא בהכרח; (ג) לא בהכרח; (ד) נכון.'

  - id: W-4.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-1, OBJ-4.3-3]
    prompt: >-
      $K=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$ עם $|x-y|$. לכל $n$ תהי $e_n:K\to\mathbb{R}$ הפונקציה ששווה $1$
      בנקודה $\frac1n$ ו-$0$ בכל שאר הנקודות.


      (א) הוכיחו ש-$e_n\in C(K)$ ושהמשפחה $\{e_n\}$ חסומה במידה שווה.


      (ב) הוכיחו שהמשפחה אינה רציפה במידה אחידה.


      (ג) הוכיחו ישירות (בלי ארצלה-אסקולי) שלאף תת-סדרה של $(e_n)$ אין גבול ב-$C(K)$.
    answer: >-
      (א) $e_n$ מתאפסת ליד $0$, ו-$|e_n|\le1$; (ב) בנקודה $0$: $|e_n(\frac1n)-e_n(0)|=1$ עם $\frac1n\to0$; (ג)
      $\|e_n-e_m\|_\infty=1$ ולמה 3.1.4.
    solution:
      - kind: step
        text: >-
          (א) כל נקודה $\frac1m$ מבודדת ב-$K$, ולכן כל פונקציה רציפה בה. ב-$0$: לכל $\varepsilon>0$ נבחר
          $\delta=\frac1n$; אם $|x-0|<\delta$ ו-$x\in K$, אז $x=0$ או $x=\frac1m$ עם $m>n$, ובשני המקרים
          $e_n(x)=0=e_n(0)$. ו-$0\le e_n\le1$.
      - kind: step
        text: >-
          (ב) נניח בשלילה ש-$\delta$ מתאים ל-$\varepsilon=1$. יש $n$ עם $\frac1n<\delta$, ואז
          $|e_n(\frac1n)-e_n(0)|=1$, שאינו קטן מ-$1$. סתירה.
      - kind: step
        text: >-
          (ג) ל-$n\ne m$: $e_n(\frac1n)-e_m(\frac1n)=1$, ולכן $\|e_n-e_m\|_\infty=1$. לפי למה 3.1.4 לאף תת-סדרה אין
          גבול.
      - kind: check
        text: >-
          לפי טענה 4.1.2(ב) $C(K)$ כאן הוא מרחב הסדרות המתכנסות, ו-$e_n$ היא הסדרה שבמקום ה-$n$ שלה $1$: הסדרות
          $e_n$ של $\ell^\infty$, שוב רחוקות $1$ זו מזו. בהתאם למשפט 4.3.7, המשפחה חסומה, אינה רציפה במידה אחידה,
          ואינה קומפקטית יחסית.
      - kind: result
        text: '(א) $e_n\in C(K)$, $|e_n|\le1$; (ב) נכשלת ב-$0$; (ג) המשפחה $1$-מופרדת.'

  - id: W-4.3-08
    level: exam
    objectives: [OBJ-4.3-3]
    prompt: >-
      תהי $\mathcal{F}$ קבוצת הפונקציות $f\in C[0,1]$ שמקיימות $\int_0^1f=0$ ו-$|f(x)-f(y)|\le|x-y|^{1/3}$ לכל
      $x,y\in[0,1]$. הוכיחו ש-$\mathcal{F}$ קומפקטית ב-$C[0,1]$.
    answer: >-
      סגורה (שני התנאים נשמרים בגבול במידה שווה), חסומה ב-$1$ ($f$ מתאפסת באיזו נקודה), ורציפה במידה אחידה
      ($\delta=\varepsilon^3$); לפי מסקנה 4.3.9 קומפקטית.
    solution:
      - kind: theorem
        text: >-
          מסקנה 4.3.9: קומפקטית אם ורק אם סגורה, חסומה במידה שווה ורציפה במידה אחידה. משפט ערך הביניים (אינפי 1).
      - kind: step
        text: >-
          חסימות: תהי $f\in\mathcal{F}$. אם $f>0$ בכל $[0,1]$, אז לפי משפט ויירשטראס (אינפי 1, או מסקנה 3.4.3) יש
          ל-$f$ מינימום $m>0$, ולפי המונוטוניות של האינטגרל $\int_0^1f\ge m>0$, בסתירה; ובאותו אופן לא $f<0$ בכל
          מקום. לכן יש $a,b$ עם $f(a)\le0\le f(b)$, ולפי משפט ערך הביניים יש
          $x_0$ עם $f(x_0)=0$. אז

          $$\begin{aligned}|f(x)|&=|f(x)-f(x_0)|\\&\le|x-x_0|^{1/3}\le1 .\end{aligned}$$
      - kind: step
        text: >-
          רציפה במידה אחידה: יהי $\varepsilon>0$ ו-$\delta=\varepsilon^3$. אם $|x-y|<\delta$, אז
          $|f(x)-f(y)|\le|x-y|^{1/3}$ ו-$|x-y|^{1/3}<\delta^{1/3}=\varepsilon$, לכל $f\in\mathcal{F}$ (טענה 4.2.5(ג) עם
          $C=1$, $\alpha=\frac13$).
      - kind: step
        text: >-
          סגורה: יהיו $f_n\in\mathcal{F}$ עם $f_n\to f$ ב-$C[0,1]$. לפי טענה 4.1.7(ב), $\int_0^1f=\lim\int_0^1f_n=0$.
          לכל $x,y$: $f_n(x)\to f(x)$ ו-$f_n(y)\to f(y)$, והאי-שוויון החלש $|f_n(x)-f_n(y)|\le|x-y|^{1/3}$ עובר לגבול.
          לכן $f\in\mathcal{F}$, ולפי מסקנה 1.5.8(ב) $\mathcal{F}$ סגורה.
      - kind: step
        text: >-
          לפי מסקנה 4.3.9, $\mathcal{F}$ קומפקטית.
      - kind: check
        text: >-
          בלי התנאי $\int f=0$ הפונקציות הקבועות $c$ מקיימות את תנאי הלדר, והמשפחה אינה חסומה. התנאי משמש **רק**
          לחסימות, דרך נקודת האפס $x_0$; כל תנאי שמצמיד את $f$ בנקודה אחת היה עושה אותו דבר.
      - kind: result
        text: '$\mathcal{F}$ סגורה, חסומה ב-$1$ ורציפה במידה אחידה, ולכן קומפקטית.'

  - id: W-4.3-09
    level: exam
    objectives: [OBJ-4.3-3]
    prompt: >-
      תהי $(f_n)$ סדרה ב-$C[0,1]$ עם $\|f_n\|_\infty\le1$, ו-$V$ העתקת האינטגרל, $(Vf)(x)=\int_0^xf$. נגדיר
      $F_n=V(Vf_n)$, כלומר $F_n(x)=\int_0^x\int_0^sf_n(t)\,dt\,ds$. הוכיחו שיש תת-סדרה $(n_k)$ כך ש**גם**
      $(F_{n_k})$ **וגם** $(F_{n_k}')$ מתכנסות במידה שווה על $[0,1]$.
    answer: >-
      $F_n'=Vf_n$; לפי טענה 4.3.11(ד) יש תת-סדרה עם $Vf_{n_k}$ מתכנסת במידה שווה; $V$ ליפשיצית עם קבוע $1$, ולכן
      גם $F_{n_k}=V(Vf_{n_k})$ מתכנסת.
    solution:
      - kind: idea
        text: >-
          אין צורך בתת-סדרה שנייה: מספיק לבחור תת-סדרה שעבורה הנגזרות $F_n'$ מתכנסות, ולהשתמש בכך ש-$V$ רציפה.
      - kind: step
        text: >-
          לפי המשפט היסודי (אינפי 1) $F_n$ גזירה ו-$F_n'=Vf_n$.
      - kind: theorem
        text: >-
          טענה 4.3.11(ד): לכל סדרה בכדור היחידה הסגור יש תת-סדרה $(f_{n_k})$ עם $(Vf_{n_k})$ מתכנסת במידה שווה,
          נאמר ל-$G$.
      - kind: step
        text: >-
          $V$ ליפשיצית עם קבוע $1$ על $(C[0,1],\|\cdot\|_\infty)$: לכל $x$ ההפרש $|Vg(x)-Vh(x)|$ חסום
          ב-$\int_0^x|g-h|$, ולכן ב-$\|g-h\|_\infty$ (טענה 1.8.12(א)). לכן

          $$\begin{aligned}&\|F_{n_k}-VG\|_\infty\\&\quad=\|V(Vf_{n_k})-VG\|_\infty\\&\quad\le\|Vf_{n_k}-G\|_\infty\to0 .\end{aligned}$$
      - kind: step
        text: >-
          כך $F_{n_k}'=Vf_{n_k}\to G$ ו-$F_{n_k}\to VG$, שתיהן במידה שווה, לאורך **אותה** תת-סדרה.
      - kind: check
        text: >-
          הגבולות מתאימים: $(VG)'=G$ לפי המשפט היסודי, כלומר הגבול של הנגזרות הוא הנגזרת של הגבול. ו-$(f_{n_k})$
          עצמה לא חייבת להתכנס: עם האוהלים $f_n=t_n$ אין לה אף תת-סדרה מתכנסת.
      - kind: result
        text: 'התת-סדרה של טענה 4.3.11(ד) עובדת לשתיהן: $F_{n_k}'' \to G$ ו-$F_{n_k}\to VG$ במידה שווה.'

  - id: W-4.3-10
    level: exam
    objectives: [OBJ-4.3-2]
    prompt: >-
      הוכיחו ישירות, בלי לצטט את משפט 4.3.7 או את למה 4.2.10: אם $(f_n)$ סדרה ב-$C[0,1]$, $|f_n(x)|\le M$ ו-$|f_n(x)-f_n(y)|\le
      L|x-y|$ לכל $n,x,y$ (עם $L>0$), אז יש לה תת-סדרה שמתכנסת במידה שווה. מותר להשתמש בלמה 4.3.6 ובשלמות של
      $C[0,1]$. ציינו איפה נכנסת כל הנחה.
    answer: >-
      האלכסון על $D=\mathbb{Q}\cap[0,1]$ נותן התכנסות בנקודות $D$ (חסימות); עם $\delta=\frac{\varepsilon}{3L}$ ורשת
      סופית של $D$ (קומפקטיות) מקבלים סדרת קושי במידה שווה (ליפשיץ); השלמות נותנת גבול.
    solution:
      - kind: step
        text: >-
          $D=\mathbb{Q}\cap[0,1]$ בת מנייה וצפופה (משפט 1.4.15); נרשום $D=\{q_1,q_2,\dots\}$. לכל $j$,
          $|f_n(q_j)|\le M$. לפי למה 4.3.6 יש $n_1<n_2<\cdots$ כך ש-$g_k=f_{n_k}$ מתכנסת בכל $q_j$. **[כאן החסימות.]**
      - kind: step
        text: >-
          יהי $\varepsilon>0$ ו-$\delta=\frac{\varepsilon}{3L}$. לפי ארכימדס יש $m\in\mathbb{N}$ עם $\frac1m<\delta$.
          הנקודות $\frac im$, $i=0,\dots,m$, הן ב-$D$, ולכל $x\in[0,1]$ יש $i$ עם $|x-\frac im|\le\frac1{2m}<\delta$.
          **[כאן הקומפקטיות של $[0,1]$, בצורת חסימות כליל: הקטע חסום, ולכן מספר סופי של נקודות של $D$ קרוב לכל
          נקודה שלו. בקטע $[0,\infty)$ לא הייתה רשת סופית כזו.]**
      - kind: step
        text: >-
          לכל $i$ הסדרה $(g_k(\frac im))_k$ מתכנסת, ולכן קושי: יש $K_i$ עם $|g_k(\frac im)-g_l(\frac im)|<\frac\varepsilon3$
          ל-$k,l>K_i$. נגדיר $K_0=\max_iK_i$, מקסימום של $m+1$ מספרים.
      - kind: step
        text: >-
          לכל $x$ ו-$k,l>K_0$, עם $i$ משלב 2 ו-$p=\frac im$, לפי אי-שוויון המשולש:


          $$
          \begin{aligned}&|g_k(x)-g_l(x)|\\&\quad\le|g_k(x)-g_k(p)|\\&\qquad+|g_k(p)-g_l(p)|\\&\qquad+|g_l(p)-g_l(x)|\\&\quad<L\delta+\tfrac\varepsilon3+L\delta=\varepsilon .\end{aligned}
          $$


          **[כאן קבוע ליפשיץ המשותף: אותו $\delta$ ל-$g_k$ ול-$g_l$.]**
      - kind: step
        text: >-
          לכן $\|g_k-g_l\|_\infty<\varepsilon$ ל-$k,l>K_0$ (המקסימום מתקבל, מסקנה 3.4.3): $(g_k)$ סדרת קושי ב-$C[0,1]$,
          ולפי משפט 4.1.4 מתכנסת, כלומר מתכנסת במידה שווה. **[כאן השלמות.]**
      - kind: check
        text: >-
          שלב 4 נשבר בלי קבוע משותף: ל-$\sin(nx)$ הקבוע $n$, ו-$\delta=\frac\varepsilon{3n}$ תלוי ב-$n$, כך שאין $m$ אחד
          לכל $k$. ושלב 1 נשבר בלי חסימות: $f_n\equiv n$.
      - kind: result
        text: >-
          תת-הסדרה האלכסונית $(f_{n_k})$ מתכנסת במידה שווה; חסימות → אלכסון, קומפקטיות → רשת סופית, ליפשיץ משותף →
          $\delta$ אחד, שלמות → גבול.

challenge:
  - id: W-4.3-c1
    stars: 1
    objectives: [OBJ-4.3-3]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ רציפה, ולכל $n\in\mathbb{N}$ תהי $f_n(t)=f(nt)$. נניח שהמשפחה
      $\{f_n:\ n\in\mathbb{N}\}$ רציפה במידה אחידה על $[0,1]$. מה אפשר להסיק על $f$? הוכיחו את התשובה, והראו שהיא
      גם מספיקה.
    answer: >-
      $f$ קבועה על $[0,\infty)$; ולהפך, אם $f$ קבועה על $[0,\infty)$ אז כל $f_n$ קבועה על $[0,1]$ והמשפחה רציפה
      במידה אחידה.
    solution:
      - kind: idea
        text: >-
          $f_n$ על $[0,1]$ "מכווצת" את $f$ על $[0,n]$ לקטע באורך $1$. שתי נקודות $s,t\ge0$ כלשהן הופכות, אחרי כיווץ
          ב-$n$ גדול, לשתי נקודות קרובות כרצוננו של $[0,1]$, וה-$\delta$ המשותף אינו תלוי ב-$n$.
      - kind: step
        text: >-
          יהיו $s,t\ge0$ ו-$\varepsilon>0$. לפי ההנחה יש $\delta>0$ עם $|f_n(x)-f_n(y)|<\varepsilon$ לכל $n$ ולכל
          $x,y\in[0,1]$ עם $|x-y|<\delta$.
      - kind: step
        text: >-
          לפי ארכימדס יש $n$ עם $n\ge\max(s,t)$ ו-$n>\frac{|s-t|}\delta$. אז $x=\frac sn$, $y=\frac tn$ ב-$[0,1]$ ו-$|x-y|=\frac{|s-t|}n<\delta$.
      - kind: step
        text: >-
          כיוון ש-$f(s)=f_n(\frac sn)$ ו-$f(t)=f_n(\frac tn)$, מתקיים $|f(s)-f(t)|<\varepsilon$. כיוון ש-$\varepsilon>0$ כלשהו,
          $f(s)=f(t)$: $f$ קבועה על $[0,\infty)$.
      - kind: step
        text: >-
          ולהפך: אם $f\equiv c$ על $[0,\infty)$, אז $f_n(x)=f(nx)=c$ לכל $x\in[0,1]$, ו-$|f_n(x)-f_n(y)|=0$: כל
          $\delta$ מתאים.
      - kind: check
        text: >-
          על $(-\infty,0)$ אין שום מסקנה: $f_n$ אינה "רואה" שם דבר, כי $nt\ge0$ ל-$t\in[0,1]$. דוגמה: $f(t)=\min(t,0)$.
          ו-$f(t)=\sin t$ נותנת את $\sin(nx)$ של טענה 4.2.7(א), שאינה רציפה במידה אחידה, בהתאם.
      - kind: result
        text: '$\{f(nt)\}$ רציפה במידה אחידה על $[0,1]$ אם ורק אם $f$ קבועה על $[0,\infty)$.'
    source:
      name: "W. Rudin, Principles of Mathematical Analysis (3rd ed.), as quoted in W. Wu, Selected Solutions to Rudin's PMA"
      year: 1976
      problem: 'Chapter 7, Exercise 15'
      url: 'https://pages.cs.wisc.edu/~wentaowu/other-docs/POMA_Solution_Sheet.pdf'
      verified: '2026-11-12'
      adapted: true

  - id: W-4.3-c2
    stars: 1
    objectives: [OBJ-4.3-1]
    prompt: >-
      (א) תהי $\mathcal{F}$ משפחה של פונקציות $[0,1]\to\mathbb{R}$ שרציפה במידה אחידה, ונניח שיש נקודה $x^*\in[0,1]$
      שבה $\{f(x^*):\ f\in\mathcal{F}\}$ חסומה. הוכיחו ש-$\mathcal{F}$ חסומה במידה שווה.


      (ב) הראו שעל $X=[0,1]\cup[2,3]$ (עם $|x-y|$) הטענה של (א) נכשלת: יש משפחה רציפה במידה אחידה שחסומה בנקודה אחת
      ואינה חסומה נקודתית.
    answer: >-
      (א) $\delta$ עבור $\varepsilon=1$ ו-$m\in\mathbb{N}$ עם $\frac1m<\delta$; מ-$x^*$ לכל $x$ מגיעים ב-$m$ צעדים
      קצרים מ-$\delta$, ולכן $|f(x)|<M^*+m$. (ב) $f_n=0$ על $[0,1]$ ו-$f_n=n$ על $[2,3]$.
    solution:
      - kind: idea
        text: >-
          רציפות במידה אחידה שולטת בשינוי לאורך צעד קצר, באחידות. בקטע אפשר להגיע מכל נקודה לכל נקודה במספר חסום של
          צעדים קצרים; ב-$[0,1]\cup[2,3]$ אי אפשר לקפוץ על הפער בצעד קצר.
      - kind: step
        text: >-
          (א) יהי $M^*$ חסם ל-$|f(x^*)|$, ו-$\delta>0$ עם $|f(x)-f(y)|<1$ לכל $f\in\mathcal{F}$ ו-$|x-y|<\delta$. לפי
          ארכימדס יש $m\in\mathbb{N}$ עם $\frac1m<\delta$.
      - kind: step
        text: >-
          יהי $x\in[0,1]$. הנקודות $y_i=x^*+\frac im(x-x^*)$, $i=0,\dots,m$, כולן ב-$[0,1]$ (צירופים קמורים),
          $y_0=x^*$, $y_m=x$, ו-$|y_i-y_{i-1}|=\frac{|x-x^*|}m$; כיוון ש-$|x-x^*|\le1$, זה לכל היותר
          $\frac1m<\delta$.
      - kind: step
        text: >-
          לפי אי-שוויון המשולש, לכל $f\in\mathcal{F}$ ולכל $x$:

          $$\begin{aligned}&|f(x)|\le|f(x^*)|\\&\quad+\sum_{i=1}^m|f(y_i)-f(y_{i-1})|\\&\quad<M^*+m :\end{aligned}$$

          חסם אחד.
      - kind: step
        text: >-
          (ב) $f_n=0$ על $[0,1]$ ו-$f_n=n$ על $[2,3]$. כל $f_n$ רציפה ($X$ איחוד של שתי קבוצות במרחק $1$ זו מזו,
          ו-$f_n$ קבועה על כל אחת). עם $\delta=1$: אם $|x-y|<1$ אז $x,y$ באותו רכיב, ו-$f_n(x)=f_n(y)$; לכן המשפחה
          רציפה במידה אחידה. ב-$x^*=0$ כל הערכים $0$, וב-$x=2$ הערכים $n$ אינם חסומים.
      - kind: check
        text: >-
          (ב) אינו סותר את טענה 4.3.5: $X$ קומפקטי, אבל המשפחה אינה חסומה נקודתית; טענה 4.3.5 צריכה חסם **בכל**
          נקודה, ו-(א) מראה שבקטע די בנקודה אחת.
      - kind: result
        text: '(א) $|f|\le M^*+m$ עם $\frac1m<\delta$; (ב) המשפחה $f_n=n\cdot\chi_{[2,3]}$ על $[0,1]\cup[2,3]$.'
    source:
      name: "G. M. Bergman, Supplements to the Exercises in Chapters 1-7 of Walter Rudin's Principles of Mathematical Analysis"
      year: 2006
      problem: 'Exercise 7.6:1 (a), (b)'
      url: 'https://math.berkeley.edu/%7Egbergman/ug.hndts/m104_Rudin_exs.pdf'
      verified: '2026-11-12'
      adapted: true
