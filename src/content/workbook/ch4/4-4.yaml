  - id: W-4.4-c2
    stars: 1
    objectives: [OBJ-4.4-2, OBJ-4.4-1]
    prompt: >-
      הוכיחו שכל קבוצה פתוחה $U\subseteq\mathbb{R}$ (עם $|x-y|$) היא איחוד של משפחה לכל היותר בת מנייה של קטעים פתוחים
      זרים בזוגות. (קטע פתוח כאן רשאי להיות לא חסום: $(a,\infty)$, $(-\infty,b)$ או $\mathbb{R}$.)
    answer: >-
      לכל $x\in U$ יהי $I_x$ האיחוד של כל הקטעים הפתוחים שמכילים את $x$ ומוכלים ב-$U$. זה קטע פתוח, ושני קטעים כאלה
      שווים או זרים. לפי טענה 4.4.6(א) יש לכל היותר מספר בן מנייה של קטעים שונים כאלה.
    solution:
      - kind: idea
        text: >-
          מחלקים את $U$ ל"רכיבים": הקטע הפתוח הגדול ביותר סביב כל נקודה. רכיבים שונים זרים, וכל אחד מהם פתוח ולא ריק,
          ולכן הספרביליות של $\mathbb{R}$ (טענה 4.4.6(א)) מגבילה את מספרם.
      - kind: step
        text: >-
          לכל $x\in U$ נגדיר $a_x=\inf\{a<x:\ (a,x]\subseteq U\}$ ו-$b_x=\sup\{b>x:\ [x,b)\subseteq U\}$, עם $\pm\infty$
          כשהקבוצה אינה חסומה. שתי הקבוצות לא ריקות, כי $U$ פתוחה: יש $r>0$ עם $(x-r,x+r)\subseteq U$. נסמן
          $I_x=(a_x,b_x)$.
      - kind: step
        text: >-
          $I_x\subseteq U$: אם $a_x<y\le x$, לפי הגדרת האינפימום יש $a<y$ עם $(a,x]\subseteq U$, ולכן $y\in U$; ובאותו
          אופן ל-$x\le y<b_x$. ו-$I_x$ מקסימלי: אם $J$ קטע פתוח עם $x\in J\subseteq U$, אז $J\subseteq I_x$, כי לכל $y\in J$
          עם $y<x$ מתקיים $(y',x]\subseteq J\subseteq U$ לאיזה $y'<y$ (ולכן $a_x\le y'<y$), ובאותו אופן מימין.
      - kind: step
        text: >-
          שני קטעים $I_x,I_y$ שווים או זרים: אם $z\in I_x\cap I_y$, האיחוד $I_x\cup I_y$ הוא קטע פתוח (איחוד של שני קטעים
          פתוחים עם נקודה משותפת), מכיל את $x$ ומוכל ב-$U$, ולפי המקסימליות $I_x\cup I_y\subseteq I_x$, כלומר
          $I_y\subseteq I_x$. באותו אופן $I_x\subseteq I_y$.
      - kind: theorem
        text: >-
          $U=\bigcup_{x\in U}I_x$, כי $x\in I_x\subseteq U$. המשפחה $\mathcal U=\{I_x:\ x\in U\}$ (כל קטע נספר פעם אחת) היא
          משפחה של קבוצות פתוחות, לא ריקות וזרות בזוגות ב-$\mathbb{R}$, שהוא ספרבילי (טענה 4.4.2(א)). לפי טענה 4.4.6(א)
          $\mathcal U$ לכל היותר בת מנייה.
      - kind: check
        text: >-
          $U=\mathbb{R}\setminus\mathbb{Z}$ היא איחוד בן מנייה של הקטעים $(n,n+1)$, $n\in\mathbb{Z}$. ובטענה 4.4.6(א) הספירה
          היא "רציונלי אחד לכל קטע": $I_x$ מקבל את הרציונלי עם האינדקס הקטן ביותר ברשימה של $\mathbb{Q}$ שנמצא בו. ההיתר
          לקטעים לא חסומים נחוץ: אילו $\mathbb{R}$ היה איחוד של קטעים פתוחים חסומים וזרים, ו-$(a,b)$ אחד מהם, הנקודה $b$
          הייתה בקטע אחר $(c,e)$ עם $c<b<e$, והוא היה חותך את $(a,b)$ בקטע $(\max(a,c),b)$, שאינו ריק.
      - kind: result
        text: >-
          כל קבוצה פתוחה בישר היא איחוד של משפחה לכל היותר בת מנייה של קטעים פתוחים זרים.
