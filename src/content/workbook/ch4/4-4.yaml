# Workbook of lesson 4.4 — separability (enrichment).
# Objectives (src/course.ts):
#   OBJ-4.4-1  define a separable space and prove that Euclidean space is separable
#   OBJ-4.4-2  prove that a subspace of a separable metric space is separable, and that a compact space is separable
#   OBJ-4.4-3  prove that the bounded functions with the sup norm are not separable (uncountably many far-apart points)
# Results cited by the numbers of the chapter-4 spine (4.4.k; 4.1.2 as the spine states it). Facts (ס1)–(ס6) on
# countable sets are listed at the start of the lesson's Explain part.
lesson: '4.4'
practice:
  - id: W-4.4-01
    level: basic
    objectives: [OBJ-4.4-1]
    prompt: >-
      על $\mathbb{R}$ תהי $\rho$ המטריקה של טענה 2.1.15: $\rho(x,y)$ שווה ל-$|\arctan x-\arctan y|$. הוכיחו ש-$(\mathbb{R},\rho)$ ספרבילי, ומצאו
      קבוצה צפופה בת מנייה מפורשת. תנו שתי הוכחות: אחת דרך אי-שוויון בין המטריקות, ואחת דרך הקבוצות הפתוחות.
    answer: >-
      $\mathbb{Q}$ צפופה ב-$\rho$: לפי משפט לגרנז' $\rho(x,y)\le|x-y|$, ולפי טענה 4.4.3(א) כל קבוצה צפופה ב-$|x-y|$
      צפופה ב-$\rho$. או: לשתי המטריקות אותן קבוצות פתוחות, וספרביליות היא תכונה טופולוגית (טענה 4.4.3(ג)).
    solution:
      - kind: idea
        text: >-
          ספרביליות עוברת מ-$d'$ ל-$d$ כש-$d\le C\,d'$. כאן $\arctan$ מכווצת מרחקים, ולכן $\rho\le|x-y|$.
      - kind: step
        text: >-
          לכל $x<y$, לפי משפט לגרנז' (אינפי 1) יש $c\in(x,y)$ עם
          $\arctan y-\arctan x=\frac{y-x}{1+c^2}$, ולכן $\rho(x,y)\le|x-y|$. זה נכון גם כש-$x=y$ וגם בסדר ההפוך.
      - kind: theorem
        text: >-
          טענה 4.4.3(א) עם $d=\rho$, $d'=|x-y|$ ו-$C=1$: כל קבוצה צפופה ב-$(\mathbb{R},|x-y|)$ צפופה ב-$(\mathbb{R},\rho)$.
          $\mathbb{Q}$ צפופה ב-$|x-y|$ (משפט 1.4.15) ובת מנייה, ולכן צפופה בת מנייה ב-$\rho$.
      - kind: step
        text: >-
          הוכחה שנייה: לפי טענה 2.1.15(א) ל-$\rho$ ול-$|x-y|$ אותן קבוצות פתוחות, כלומר הן שקולות טופולוגית. לפי טענה
          1.7.6א ((א)$\Rightarrow$(ב)) הזהות $(\mathbb{R},|x-y|)\to(\mathbb{R},\rho)$ היא הומיאומורפיזם, ולפי טענה
          4.4.3(ג) $(\mathbb{R},\rho)$ ספרבילי.
      - kind: check
        text: >-
          השוו: $(\mathbb{R},\rho)$ אינו שלם (טענה 2.1.15(ב)), ושלמות **אינה** תכונה טופולוגית; ספרביליות כן. ואי-השוויון
          ההפוך $|x-y|\le C\rho(x,y)$ אינו נכון לאף $C$ (המרחק ב-$\rho$ חסום ב-$\pi$), ולכן המסלול הראשון עובר רק בכיוון
          אחד.
      - kind: result
        text: '$(\mathbb{R},\rho)$ ספרבילי, ו-$\mathbb{Q}$ צפופה בו.'

  - id: W-4.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-4.4-1]
    prompt: >-
      נכון או לא נכון? נמקו.


      (א) $\mathbb{Q}$ עם $|x-y|$ ספרבילי.


      (ב) $\mathbb{Z}$ עם המטריקה הבדידה ספרבילי.


      (ג) $[0,1]$ עם המטריקה הבדידה ספרבילי.


      (ד) אם $(X,d)$ ספרבילי ו-$d'=\min(d,1)$, אז $(X,d')$ ספרבילי.
    answer: '(א) נכון; (ב) נכון; (ג) לא נכון; (ד) נכון.'
    solution:
      - kind: step
        text: >-
          (א) נכון: $\mathbb{Q}$ בת מנייה, ולכן היא עצמה קבוצה צפופה בת מנייה במרחב $\mathbb{Q}$.
      - kind: step
        text: >-
          (ב) נכון: לפי טענה 4.4.2(ב) מרחב בדיד ספרבילי אם ורק אם הוא לכל היותר בן מנייה, ו-$\mathbb{Z}$ בת מנייה.
      - kind: step
        text: >-
          (ג) לא נכון: לפי טענה 1.4.17 הקבוצה הצפופה היחידה במטריקה הבדידה היא $[0,1]$ כולו, שאינו בן מנייה (האלכסון של
          קנטור). אותה קבוצה עם $|x-y|$ ספרבילית: הספרביליות תלויה במטריקה.
      - kind: theorem
        text: >-
          (ד) נכון: $d'=\min(d,1)$ מטריקה (מסקנה 1.1.12), ו-$d'(x,y)\le d(x,y)$ לכל $x,y$. לפי טענה 4.4.3(א) עם
          $d'$ בתפקיד $d$ שם, $d$ בתפקיד $d'$ שם ו-$C=1$, כל קבוצה צפופה ב-$(X,d)$ צפופה ב-$(X,d')$.
      - kind: check
        text: >-
          ב-(ד) גם הכיוון ההפוך נכון, אף שאין $C$ עם $d\le C\,d'$ כש-$d$ אינה חסומה: לכל $0<r\le1$,
          $\min(d(x,y),1)<r$ אם ורק אם $d(x,y)<r$, ולכן $B_{d'}(x,r)=B_d(x,r)$. קבוצה שפוגשת כל כדור של $d'$ פוגשת כל כדור
          $B_d(x,r)$, כי הוא מכיל את $B_d(x,\min(r,1))$, השווה ל-$B_{d'}(x,\min(r,1))$. ב-(ג), לעומת זאת, המטריקה משתנה באמת: היחידון
          $\{0\}$ פתוח במטריקה הבדידה ולא ב-$|x-y|$.
      - kind: result
        text: '(א) כן; (ב) כן; (ג) לא; (ד) כן.'

  - id: W-4.4-03
    level: basic
    objectives: [OBJ-4.4-3]
    prompt: >-
      ב-$(B([0,1]),d_\infty)$, לכל $E\subseteq[0,1]$ תהי $\chi_E$ הפונקציה המציינת של $E$.


      (א) הוכיחו שלכל $E\ne E'$, $d_\infty(\chi_E,\chi_{E'})=1$. מהו המרחק בין $\chi_{\mathbb{Q}\cap[0,1]}$ ל-$\chi_{[0,1/2]}$?


      (ב) תהי $\mathcal F=\{\chi_E:\ E\subseteq\mathbb{Q}\cap[0,1]\}$. הוכיחו ש-$\mathcal F$ קבוצה $1$-מופרדת שאינה בת
      מנייה, אף שכל הקבוצות $E$ מוכלות בקבוצה בת מנייה, והסיקו שאף קבוצה צפופה ב-$B([0,1])$ אינה לכל היותר בת מנייה.


      (ג) $C[0,1]\subseteq B([0,1])$ ספרבילי. כמה מהפונקציות של $\mathcal F$ רציפות? למה אין כאן סתירה ל-(ב)?
    answer: >-
      (א) $1$, גם בדוגמה. (ב) $E\mapsto\chi_E$ חד-חד-ערכית, וקבוצת תת-הקבוצות של קבוצה בת מנייה אינה בת מנייה; לפי
      למה 4.4.7. (ג) רק אחת, $\chi_\emptyset=0$; ספרביליות עוברת לתת-מרחבים ולא מתת-מרחב למרחב.
    solution:
      - kind: step
        text: >-
          (א) לכל $x$, $\chi_E(x)-\chi_{E'}(x)\in\{-1,0,1\}$, ולכן $d_\infty\le1$. כיוון ש-$E\ne E'$ יש $x_0$ באחת ולא
          בשנייה, ושם ההפרש בערכו המוחלט $1$. לכן $d_\infty(\chi_E,\chi_{E'})=1$.
      - kind: computation
        text: >-
          $\mathbb{Q}\cap[0,1]\ne[0,\frac12]$: למשל $1\in\mathbb{Q}\cap[0,1]$ ו-$1\notin[0,\frac12]$. לכן המרחק $1$.
      - kind: step
        text: >-
          (ב) לפי (א), כל שתי פונקציות שונות ב-$\mathcal F$ במרחק $1$, ו-$E\mapsto\chi_E$ חד-חד-ערכית (ל-$E\ne E'$ המרחק
          $1\ne0$). נשאר להראות שקבוצת תת-הקבוצות של $Q_0=\mathbb{Q}\cap[0,1]$ אינה בת מנייה. $Q_0$ בת מנייה (ס1, ס2;
          היא אינסופית), ולכן יש רשימה $r_1,r_2,\dots$ של כל איבריה, בלי חזרות.
      - kind: step
        text: >-
          ההעתקה $E\mapsto(\chi_E(r_n))_{n\in\mathbb{N}}$ מתת-הקבוצות של $Q_0$ ל-$\{0,1\}^{\mathbb{N}}$ היא על: לסדרה
          $(b_n)$ מתאימה $E=\{r_n:\ b_n=1\}$. אילו קבוצת תת-הקבוצות הייתה לכל היותר בת מנייה, לפי (ס1) גם התמונה שלה,
          $\{0,1\}^{\mathbb{N}}$, הייתה, בסתירה ל-(ס4). לכן $\mathcal F$ אינה בת מנייה, ולפי למה 4.4.7 עם $\varepsilon=1$
          אף קבוצה צפופה ב-$B([0,1])$ אינה לכל היותר בת מנייה.
      - kind: step
        text: >-
          (ג) פונקציה רציפה על $[0,1]$ שערכיה רק $0$ ו-$1$ קבועה: אחרת, לפי משפט ערך הביניים (אינפי 1), היא הייתה מקבלת
          גם את הערך $\frac12$. $\chi_E\equiv1$ פירושו $E=[0,1]$, ו-$[0,1]\not\subseteq\mathbb{Q}$; $\chi_E\equiv0$ פירושו
          $E=\emptyset$. לכן הפונקציה הרציפה היחידה ב-$\mathcal F$ היא $\chi_\emptyset=0$, וכל השאר מחוץ ל-$C[0,1]$.
      - kind: step
        text: >-
          אין סתירה: למה 4.4.7 מונעת ספרביליות מכל מרחב **שמכיל** את $\mathcal F$, ו-$C[0,1]$ אינו מכיל אותה. ספרביליות
          עוברת מטה, לתת-מרחבים (משפט 4.4.4), ולא מעלה (טענה 4.4.8(ד)).
      - kind: check
        text: >-
          ההפך גם הוא מלמד: כיוון ש-$C[0,1]$ ספרבילי, לפי למה 4.4.7 כל תת-קבוצה $1$-מופרדת שלו לכל היותר בת מנייה, כמו
          האוהלים $t_n$. והכדורים ברדיוס $\frac12$ סביב איברי $\mathcal F$ זרים, וברדיוס גדול מ-$\frac12$ לא: הממוצע
          $\frac12(\chi_E+\chi_{E'})$ במרחק $\frac12$ משתיהן (המשימה של איור 4.4ב).
      - kind: result
        text: >-
          כל שתי פונקציות מציינות שונות במרחק $1$, ו-$\mathcal F$ אינה בת מנייה; לכן $B([0,1])$ אינו ספרבילי, ו-$C[0,1]$
          הספרבילי מכיל רק אחת מהן.

  - id: W-4.4-04
    level: mid
    objectives: [OBJ-4.4-2]
    prompt: >-
      יהי $S^1=\{(x,y)\in\mathbb{R}^2:\ x^2+y^2=1\}$ עם $d_2$.


      (א) הוכיחו ש-$S^1$ ספרבילי בעזרת משפט 4.4.4.


      (ב) הוכיחו, בעזרת טענה 4.4.3(ב), שהקבוצה המפורשת $\{(\cos q,\sin q):\ q\in\mathbb{Q}\}$ צפופה ב-$S^1$.
    answer: >-
      (א) תת-מרחב של $\mathbb{R}^2$. (ב) $\gamma(t)=(\cos t,\sin t)$ רציפה מ-$\mathbb{R}$ על $S^1$, ו-$\mathbb{Q}$ צפופה ב-$\mathbb{R}$;
      לכן $\gamma(\mathbb{Q})$ צפופה ב-$\gamma(\mathbb{R})=S^1$.
    solution:
      - kind: theorem
        text: >-
          (א) $(\mathbb{R}^2,d_2)$ ספרבילי (טענה 4.4.2(א)), ו-$S^1\ne\emptyset$; לפי משפט 4.4.4 תת-המרחב $S^1$ ספרבילי.
      - kind: idea
        text: >-
          (ב) משפט 4.4.4 נותן קבוצה צפופה בבחירות, בלי לומר מה היא. כאן יש פרמטריזציה רציפה, והיא מעבירה את $\mathbb{Q}$
          לקבוצה מפורשת.
      - kind: step
        text: >-
          נגדיר $\gamma(t)=(\cos t,\sin t)$. לכל $s,t$, לפי $\cos^2+\sin^2=1$, נוסחת הקוסינוס של הפרש ו-$1-\cos2u=2\sin^2u$,
          $$\begin{aligned}&(\cos s-\cos t)^2\\&\quad+(\sin s-\sin t)^2\\&=2-2(\cos s\cos t\\&\qquad+\sin s\sin t)\\&=2-2\cos(s-t)\\&=4\sin^2\tfrac{s-t}2,\end{aligned}$$
          ולכן
          $$\begin{aligned}&d_2\big(\gamma(s),\gamma(t)\big)\\&\quad=2\big|\sin\tfrac{s-t}2\big|\\&\quad\le|s-t|,\end{aligned}$$
          כי $|\sin u|\le|u|$. לכן $\gamma$ ליפשיצית עם קבוע $1$, ובפרט רציפה (טענה 1.6.9).
      - kind: step
        text: >-
          $\gamma(\mathbb{R})=S^1$: כל $(x,y)$ עם $x^2+y^2=1$ הוא $(\cos t,\sin t)$ עבור $t\in[0,2\pi)$ (קואורדינטות
          קוטביות, אינפי 1). $\mathbb{Q}$ צפופה ב-$\mathbb{R}$ (משפט 1.4.15), ולפי טענה 4.4.3(ב) $\gamma(\mathbb{Q})$
          צפופה ב-$S^1$; היא בת מנייה כתמונה של $\mathbb{Q}$.
      - kind: check
        text: >-
          $\gamma$ אינה חד-חד-ערכית ($\gamma(t+2\pi)=\gamma(t)$), וזה לא מפריע: טענה 4.4.3(ב) אינה דורשת זאת. והקבוצה
          $\gamma(\mathbb{Q})$ אינה מכילה את $(-1,0)$: הנקודות $t$ עם $\gamma(t)=(-1,0)$ הן $\pi+2\pi k$, $k\in\mathbb{Z}$, ואף
          אחת מהן אינה רציונלית (אחרת $\pi$ היה רציונלי). קבוצה צפופה אינה חייבת להכיל נקודה מסוימת.
      - kind: result
        text: >-
          $S^1$ ספרבילי, ו-$\{(\cos q,\sin q):\ q\in\mathbb{Q}\}$ צפופה בו.

  - id: W-4.4-05
    level: mid
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      יהיו $(X,d_X)$ ו-$(Y,d_Y)$ מרחבים מטריים ספרביליים, ועל $X\times Y$ תהי מטריקת המקסימום
      $$\begin{aligned}&d\big((x,y),(x',y')\big)\\&\quad=\max\big(d_X(x,x'),\\&\qquad\qquad d_Y(y,y')\big).\end{aligned}$$
      הוכיחו ש-$(X\times Y,d)$ ספרבילי. הסיקו שוב ש-$(\mathbb{R}^n,d_\infty)$ ספרבילי.
    answer: >-
      אם $D$ צפופה ב-$X$ ו-$E$ ב-$Y$, אז $D\times E$ לכל היותר בת מנייה וצפופה. באינדוקציה $\mathbb{Q}^n$ צפופה ב-$d_\infty$.
    solution:
      - kind: idea
        text: >-
          כדור במטריקת המקסימום הוא מכפלה של שני כדורים; מקרבים כל רכיב בנפרד.
      - kind: step
        text: >-
          יהיו $D\subseteq X$ ו-$E\subseteq Y$ צפופות ולכל היותר בנות מנייה. $D\times E=\bigcup_{e\in E}\big(D\times\{e\}\big)$,
          וכל קבוצה באיחוד היא תמונה של $D$; לפי (ס1) ו-(ס3) $D\times E$ לכל היותר בת מנייה.
      - kind: step
        text: >-
          יהיו $(x,y)\in X\times Y$ ו-$r>0$. יש $q\in D$ עם $d_X(x,q)<r$ ו-$e\in E$ עם $d_Y(y,e)<r$ (טענה 1.4.14(ג)), ולכן
          $d\big((x,y),(q,e)\big)<r$. לפי טענה 1.4.14(ג), $D\times E$ צפופה.
      - kind: step
        text: >-
          $(\mathbb{R}^n,d_\infty)$ הוא $\mathbb{R}^{n-1}\times\mathbb{R}$ עם מטריקת המקסימום של $d_\infty$ על
          $\mathbb{R}^{n-1}$ ו-$|s-t|$. באינדוקציה, עם $D=\mathbb{Q}^{n-1}$ ו-$E=\mathbb{Q}$, הקבוצה $\mathbb{Q}^n$ צפופה.
      - kind: check
        text: >-
          זה מתיישב עם טענה 4.4.2(א) ומשפט 1.4.16. ולמכפלה של **אינסוף** מרחבים זה כבר לא עובד במטריקת הסופרמום:
          $\{0,1\}^{\mathbb{N}}\subseteq\ell^\infty$ היא מכפלה של עותקים של $\{0,1\}$, ואינה ספרבילית (טענה 4.4.8(ב)).
      - kind: result
        text: '$X\times Y$ ספרבילי עם הקבוצה הצפופה $D\times E$.'

  - id: W-4.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-4.4-3, OBJ-4.4-2]
    prompt: >-
      אילו מתת-הקבוצות הבאות של $(\ell^\infty,d_\infty)$, כתת-מרחבים, ספרביליות? נמקו כל תשובה.


      (א) $c$, הסדרות המתכנסות.


      (ב) $c_0$, הסדרות שמתכנסות ל-$0$.


      (ג) $\{0,1\}^{\mathbb{N}}$, הסדרות שכל איבריהן $0$ או $1$.


      (ד) הסדרות שכל איבריהן $0$ או $1$ וקבועות מאיזה מקום.


      (ה) $H=\{x:\ |x_n|\le\frac1n\ \forall n\}$.
    answer: '(א) כן; (ב) כן; (ג) לא; (ד) כן; (ה) כן.'
    solution:
      - kind: theorem
        text: >-
          (א) כן: זו ההוכחה של טענה 4.4.9(ב), שלב 2–4: הסדרות הרציונליות שקבועות מאיזה מקום צפופות ב-$c$.
      - kind: theorem
        text: >-
          (ב) כן: $c_0\subseteq c$ לא ריקה, ולפי משפט 4.4.4 ספרבילית.
      - kind: step
        text: >-
          (ג) לא: כל שתי סדרות שונות שם במרחק $1$ (ההוכחה של טענה 4.4.8(ב)), והקבוצה אינה בת מנייה. כתת-מרחב, היא
          $1$-מופרדת ולא בת מנייה, ולפי למה 4.4.7 אינה ספרבילית. (כתת-מרחב היא בעצם מרחב בדיד: טענה 4.4.8(ג).)
      - kind: step
        text: >-
          (ד) כן: סדרה כזו נקבעת לפי מקום $N$ שממנו היא קבועה ולפי $N$ האיברים הראשונים; לכן הקבוצה היא איחוד על $N$ של
          קבוצות סופיות (לכל היותר $2^N$ איברים), ולפי (ס3) לכל היותר בת מנייה. מרחב לכל היותר בן מנייה ספרבילי, עם $D=X$.
      - kind: step
        text: >-
          (ה) כן: $H\subseteq c_0$ (כי $|x_n|\le\frac1n\to0$) ו-$H\ne\emptyset$, ולפי (ב) ומשפט 4.4.4 $H$ ספרבילית. (דרך
          שנייה: לפי בעיית האתגר השנייה בחוברת התרגול של שיעור 3.3, $H$ קומפקטית, ולפי משפט 4.4.5(ב) ספרבילית.)
      - kind: check
        text: >-
          (ג) ו-(ד) מראים שלא המספר של **ערכים** אפשריים קובע (בשתיהן רק $0$ ו-$1$), אלא כמה נקודות רחוקות זו מזו יש:
          ב-(ד) יש מספר בן מנייה של סדרות, ב-(ג) לא.
      - kind: result
        text: '(א), (ב), (ד), (ה) ספרביליות; (ג) אינה.'

  - id: W-4.4-07
    level: mid
    objectives: [OBJ-4.4-1]
    prompt: >-
      על $\mathbb{R}$ תהי $d(x,y)=|x^3-y^3|$.


      (א) הוכיחו ש-$d$ מטריקה ושההעתקה $\varphi(x)=x^3$ היא איזומטריה של $(\mathbb{R},d)$ על $(\mathbb{R},|s-t|)$.
      הסיקו ש-$(\mathbb{R},d)$ ספרבילי ומצאו קבוצה צפופה בת מנייה.


      (ב) האם גם $\mathbb{Q}$ עצמה צפופה ב-$(\mathbb{R},d)$?
    answer: >-
      (א) $\{\sqrt[3]q:\ q\in\mathbb{Q}\}$. (ב) כן: כל כדור $B_d(x,r)$ הוא קטע פתוח סביב $x$.
    solution:
      - kind: step
        text: >-
          (א) $x\mapsto x^3$ חד-חד-ערכית ועל $\mathbb{R}$ (עולה ממש ורציפה, עם שורש שלישי הפוך; אינפי 1). לכן $d$ היא
          משיכה של $|s-t|$ דרך העתקה חד-חד-ערכית, ולפי טענה 1.1.13 מטריקה. $|\varphi(x)-\varphi(y)|=d(x,y)$ מההגדרה, ולכן
          $\varphi$ איזומטריה, והיא על.
      - kind: theorem
        text: >-
          לפי טענה 4.4.3(ג), $(\mathbb{R},d)$ ספרבילי כמו $(\mathbb{R},|s-t|)$. קבוצה צפופה: $\varphi^{-1}(\mathbb{Q})=\{\sqrt[3]q:\ q\in\mathbb{Q}\}$,
          התמונה של $\mathbb{Q}$ תחת האיזומטריה ההפכית (טענה 4.4.3(ב)).
      - kind: step
        text: >-
          (ב) יהיו $x\in\mathbb{R}$ ו-$r>0$. $B_d(x,r)$ היא קבוצת ה-$y$ עם $x^3-r<y^3<x^3+r$, ולפי מונוטוניות השורש השלישי זה הקטע
          הפתוח $\big(\sqrt[3]{x^3-r},\sqrt[3]{x^3+r}\big)$, שמכיל את $x$ ואינו ריק. לפי משפט 1.4.15 יש בו רציונלי.
      - kind: check
        text: >-
          $d$ ו-$|x-y|$ אינן שקולות ליפשיץ: $d(n,n+1)=3n^2+3n+1$ שואף לאינסוף בעוד $|n-(n+1)|=1$. ובכל זאת שתיהן ספרביליות עם
          אותה $\mathbb{Q}$, כי יש להן אותן קבוצות פתוחות (הכדורים של $d$ הם קטעים פתוחים).
      - kind: result
        text: >-
          $(\mathbb{R},d)$ ספרבילי; גם $\{\sqrt[3]q\}$ וגם $\mathbb{Q}$ צפופות בו.

  - id: W-4.4-08
    level: exam
    objectives: [OBJ-4.4-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ספרבילי.


      (א) הוכיחו שלכל משפחה $\{U_\alpha\}_{\alpha\in I}$ של קבוצות פתוחות עם $X=\bigcup_{\alpha\in I}U_\alpha$ יש תת-משפחה
      לכל היותר בת מנייה שהאיחוד שלה הוא $X$.


      (ב) הראו בדוגמה שבלי ספרביליות זה לא נכון.


      (ג) הסיקו: אם $X$ ספרבילי וכל נקודה של $X$ מוכלת בקבוצה פתוחה בת מנייה, אז $X$ בן מנייה (או סופי).
    answer: >-
      (א) לכל איבר של הבסיס בן המנייה $\mathcal B$ של טענה 4.4.6(ב) שמוכל באיזה $U_\alpha$ בוחרים $U_\alpha$ אחד כזה.
      (ב) מרחב בדיד שאינו בן מנייה, והכיסוי ביחידונים. (ג) מ-(א) עם כיסוי של קבוצות פתוחות בנות מנייה.
    solution:
      - kind: idea
        text: >-
          הבסיס בן המנייה הוא "מילון" בן מנייה של קבוצות פתוחות קטנות. במקום לבחור מתוך משפחה גדולה, בוחרים איבר אחד של
          המשפחה לכל מילה במילון.
      - kind: theorem
        text: >-
          לפי טענה 4.4.6(ב), תהי $\mathcal B=\{B_1,B_2,\dots\}$ משפחה לכל היותר בת מנייה של קבוצות פתוחות, כך שכל קבוצה
          פתוחה היא איחוד האיברים של $\mathcal B$ שמוכלים בה.
      - kind: step
        text: >-
          (א) תהי $J$ קבוצת האינדקסים $j$ שעבורם $B_j$ מוכלת באיזה $U_\alpha$. לכל $j\in J$ **נבחר** $\alpha_j$ עם
          $B_j\subseteq U_{\alpha_j}$ (אקסיומת הבחירה הבת מנייה). $\{U_{\alpha_j}:\ j\in J\}$ לכל היותר בת מנייה.
      - kind: step
        text: >-
          יהי $x\in X$. יש $\alpha$ עם $x\in U_\alpha$, ו-$U_\alpha$ איחוד של איברי $\mathcal B$ שמוכלים בה; לכן יש $j$ עם
          $x\in B_j\subseteq U_\alpha$. אז $j\in J$, ו-$x\in B_j\subseteq U_{\alpha_j}$. לכן $X=\bigcup_{j\in J}U_{\alpha_j}$.
      - kind: step
        text: >-
          (ב) $X=\mathbb{R}$ עם המטריקה הבדידה, והכיסוי $\{\{x\}:\ x\in\mathbb{R}\}$ ביחידונים, שפתוחים (טענה 1.3.6). כל
          תת-משפחה שמכסה את $X$ חייבת להכיל את כל היחידונים, ו-$\mathbb{R}$ אינו בן מנייה. בהתאם, $X$ אינו ספרבילי (טענה
          4.4.2(ב)).
      - kind: step
        text: >-
          (ג) תהי $\mathcal V$ המשפחה של **כל** הקבוצות הפתוחות ב-$X$ שהן לכל היותר בנות מנייה. לפי ההנחה כל נקודה של
          $X$ שייכת לאיבר של $\mathcal V$, ולכן $X=\bigcup\mathcal V$ (כך אין צורך לבחור קבוצה לכל נקודה). לפי (א) יש
          תת-משפחה $\{V_1,V_2,\dots\}\subseteq\mathcal V$, לכל היותר בת מנייה, עם $X=\bigcup_kV_k$: איחוד בן מנייה של
          קבוצות לכל היותר בנות מנייה, ולפי (ס3) $X$ לכל היותר בן מנייה.
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $|x-y|$ הכיסוי $\{(x-1,x+1):\ x\in\mathbb{R}\}$ אינו בן מנייה, ותת-הכיסוי $\{(n-1,n+1):\ n\in\mathbb{Z}\}$
          בן מנייה ומכסה. ההבדל מקומפקטיות: שם תת-הכיסוי **סופי**, וכאן רק בן מנייה; $\mathbb{R}$ ספרבילי ואינו קומפקטי.
      - kind: result
        text: >-
          במרחב מטרי ספרבילי לכל כיסוי פתוח יש תת-כיסוי לכל היותר בן מנייה; בלי ספרביליות לא.

  - id: W-4.4-09
    level: exam
    objectives: [OBJ-4.4-3, OBJ-4.4-2]
    prompt: >-
      (א) הוכיחו שכל תת-קבוצה לא ריקה וחסומה כליל של מרחב מטרי היא, כתת-מרחב, ספרבילית.


      (ב) הוכיחו ש-$B([0,1])$ אינו איחוד של סדרה $A_1,A_2,\dots$ של תת-קבוצות חסומות כליל. בפרט הוא אינו איחוד בן
      מנייה של קבוצות קומפקטיות.


      (ג) לעומת זאת, $\mathbb{R}$ הוא איחוד בן מנייה של קבוצות קומפקטיות, ו-$C[0,1]$ ספרבילי. הוכיחו שבכל זאת
      $(C[0,1],d_\infty)$ אינו איחוד של סדרה של קבוצות חסומות כליל. (רמז: משפט הקטגוריה של בייר, משפט 2.5.8.)
    answer: >-
      (א) טענה 3.3.2ב ומשפט 4.4.5(א). (ב) אחרת לפי טענה 4.4.3(ד) $B([0,1])$ היה ספרבילי, בסתירה לטענה 4.4.8(א). (ג) הסגור
      של כל קבוצה חסומה כליל קומפקטי ובלי נקודות פנימיות (אחרת היה מכיל סדרה מופרדת של אוהלים), כלומר דליל; לפי משפט
      2.5.8 המרחב השלם $C[0,1]$ אינו איחוד בן מנייה של דלילות. ספרביליות היא תנאי הכרחי בלבד.
    solution:
      - kind: theorem
        text: >-
          (א) לפי טענה 3.3.2ב, $A$ חסומה כליל כתת-קבוצה אם ורק אם המרחב $(A,d)$ חסום כליל. לפי משפט 4.4.5(א), המרחב $(A,d)$
          ספרבילי.
      - kind: step
        text: >-
          (ב) נניח בשלילה $B([0,1])=\bigcup_nA_n$ עם $A_n$ חסומות כליל. נשמיט את הריקות; נשארות לא ריקות, והאיחוד לא
          השתנה. (אם נשארו רק מספר סופי, נחזור על האחרונה כדי לקבל סדרה.) לפי (א) כל $A_n$ ספרבילית.
      - kind: step
        text: >-
          לפי טענה 4.4.3(ד), $B([0,1])$ ספרבילי, בסתירה לטענה 4.4.8(א). וקבוצה קומפקטית חסומה כליל (משפט 3.3.8), ולכן
          גם איחוד בן מנייה של קומפקטיות אינו אפשרי.
      - kind: step
        text: >-
          (ג) $\mathbb{R}=\bigcup_n[-n,n]$, וכל $[-n,n]$ קומפקטי (משפט היינה-בורל). ב-$C[0,1]$ הנימוק של (ב) אינו עובד,
          כי $C[0,1]$ ספרבילי. נניח בשלילה $C[0,1]=\bigcup_nA_n$ עם $A_n$ חסומות כליל. $C[0,1]$ שלם (מסקנה 2.2.6(ג)), ולכן
          לפי מסקנה 3.3.9(ב) כל $\overline{A_n}$ קומפקטית (ל-$A_n=\emptyset$ הסגור ריק).
      - kind: step
        text: >-
          ל-$\overline{A_n}$ אין נקודות פנימיות: אילו $B(f,r)\subseteq\overline{A_n}$ עם $r>0$, הפונקציות
          $u_k=f+\frac r2t_k$, עם האוהלים $t_k$ של טענה 3.1.9(ב), היו ב-$B(f,r)$ ($\|u_k-f\|_\infty=\frac r2$), ו-$\|u_k-u_l\|_\infty=\frac r2$
          ל-$k\ne l$. לפי למה 3.1.4 לסדרה $(u_k)$ אין תת-סדרה מתכנסת, בסתירה לקומפקטיות של $\overline{A_n}$ (משפט 3.2.10).
      - kind: theorem
        text: >-
          לכן כל $A_n$ דלילה (הגדרה 2.5.5(א)), ו-$C[0,1]$, מרחב שלם ולא ריק, הוא איחוד בן מנייה של דלילות, בסתירה למשפט
          2.5.8(ב).
      - kind: check
        text: >-
          החלק (ב) הוא הצורה החזקה של "לא ספרבילי": גם אם מרשים "חתיכות" חסומות כליל, ולא רק נקודות, אי אפשר לכסות את
          $B([0,1])$ במספר בן מנייה שלהן. ו-(ג) מראה שההפך אינו נכון: $C[0,1]$ ספרבילי, ובכל זאת אינו איחוד כזה. מה
          שמבדיל אותו מ-$\mathbb{R}$ הוא המימד האינסופי: ב-$C[0,1]$ לקבוצה קומפקטית אין נקודות פנימיות.
      - kind: result
        text: >-
          כל תת-קבוצה חסומה כליל ספרבילית; לכן $B([0,1])$ אינו איחוד בן מנייה של קבוצות חסומות כליל, ובפרט של קומפקטיות.
          גם $C[0,1]$ אינו איחוד כזה, מסיבה אחרת: משפט בייר.

  - id: W-4.4-10
    level: exam
    qualitative: true
    objectives: [OBJ-4.4-3, OBJ-4.4-1]
    prompt: >-
      תהי $X$ קבוצה לא ריקה. לאילו $X$ המרחב $(B(X),d_\infty)$ (הגדרה 1.1.7) ספרבילי? הוכיחו את תשובתכם.
    answer: >-
      בדיוק כש-$X$ סופית: אז $B(X)$ איזומטרי ל-$(\mathbb{R}^n,d_\infty)$; כש-$X$ אינסופית, הפונקציות המציינות של תת-קבוצות
      של קבוצה בת מנייה $\{x_1,x_2,\dots\}\subseteq X$ הן קבוצה $1$-מופרדת שאינה בת מנייה.
    solution:
      - kind: step
        text: >-
          $X=\{x_1,\dots,x_n\}$ סופית: כל פונקציה על $X$ חסומה, ו-$f\mapsto(f(x_1),\dots,f(x_n))$ חד-חד-ערכית ועל
          $\mathbb{R}^n$, עם $d_\infty(f,g)$ שווה ל-$\max_i|f(x_i)-g(x_i)|$: איזומטריה על $(\mathbb{R}^n,d_\infty)$. לפי טענות
          4.4.2(א) ו-4.4.3(ג), $B(X)$ ספרבילי.
      - kind: step
        text: >-
          $X$ אינסופית: **נבחר** ברקורסיה נקודות שונות $x_1,x_2,\dots\in X$ ($x_{k+1}\in X\setminus\{x_1,\dots,x_k\}$, שאינה
          ריקה כי $X$ אינסופית; אקסיומת הבחירה הבת מנייה). לכל $E\subseteq\mathbb{N}$ תהי $g_E=\chi_{\{x_n:\ n\in E\}}\in B(X)$.
      - kind: step
        text: >-
          אם $E\ne E'$, יש $n$ שנמצא באחת ולא בשנייה, ו-$|g_E(x_n)-g_{E'}(x_n)|=1$ (הנקודות $x_k$ שונות, ולכן $x_n$ שייכת
          לקבוצה $\{x_k:\ k\in E\}$ בדיוק כש-$n\in E$). כל ההפרשים לכל היותר $1$, ולכן $d_\infty(g_E,g_{E'})=1$.
      - kind: theorem
        text: >-
          $E\mapsto g_E$ חד-חד-ערכית, וקבוצת תת-הקבוצות של $\mathbb{N}$ אינה בת מנייה (היא בהתאמה עם $\{0,1\}^{\mathbb{N}}$,
          האלכסון של קנטור). לפי (ס5) המשפחה $\{g_E\}$ אינה בת מנייה, והיא $1$-מופרדת; לפי למה 4.4.7 $B(X)$ אינו ספרבילי.
      - kind: check
        text: >-
          המקרים $X=\mathbb{N}$ ו-$X=[0,1]$ הם טענה 4.4.8(ב) ו-(א). והמקרה הסופי מתיישב עם טענה 4.4.9(א): כש-$X$ סופית עם
          מטריקה כלשהי, $B(X)=C(X)$.
      - kind: result
        text: '$B(X)$ ספרבילי אם ורק אם $X$ סופית.'

challenge:
  - id: W-4.4-c1
    stars: 1
    objectives: [OBJ-4.4-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שבו לכל תת-קבוצה אינסופית יש נקודת הצטברות (הגדרה 1.4.7) ב-$X$. הוכיחו ש-$X$ ספרבילי.
      (רמז: לכל $n\in\mathbb{N}$ בחרו נקודות של $X$, כל אחת במרחק $\frac1n$ לפחות מכל הקודמות, כל עוד אפשר.)
    answer: >-
      לכל $n$ הבחירה נעצרת אחרי מספר סופי של צעדים (אחרת יש קבוצה $\frac1n$-מופרדת אינסופית בלי נקודת הצטברות), ונותנת
      $\frac1n$-רשת סופית $F_n$; האיחוד $\bigcup_nF_n$ בן מנייה וצפוף.
    solution:
      - kind: idea
        text: >-
          לקבוצה מופרדת אין נקודת הצטברות, כי כדור קטן סביב נקודה לא יכול להכיל שתי נקודות רחוקות זו מזו. לכן ההנחה
          אומרת שכל קבוצה מופרדת סופית, ולפי למה 3.3.3א זו בדיוק חסימות כליל.
      - kind: step
        text: >-
          **למה.** אם $S\subseteq X$ היא $r$-מופרדת עם $r>0$, אין לה נקודת הצטברות. נניח בשלילה ש-$p$ נקודת הצטברות של
          $S$. לפי הגדרה 1.4.7 יש $s_1\in S\setminus\{p\}$ עם $d(p,s_1)<\frac r2$. נסמן $\rho=d(p,s_1)>0$; שוב לפי ההגדרה
          יש $s_2\in S\setminus\{p\}$ עם $d(p,s_2)<\rho$. אז $s_2\ne s_1$ (המרחקים שלהן מ-$p$ שונים), ו-
          $$\begin{aligned}d(s_1,s_2)&\le d(s_1,p)\\&\quad+d(p,s_2)\\&<\tfrac r2+\tfrac r2=r,\end{aligned}$$
          בסתירה להיותה של $S$ $r$-מופרדת.
      - kind: step
        text: >-
          לפי הלמה וההנחה, לכל $r>0$ כל תת-קבוצה $r$-מופרדת של $X$ סופית: אילו הייתה אינסופית, הייתה לה נקודת הצטברות.
      - kind: theorem
        text: >-
          לפי למה 3.3.3א(ג) עם $A=X$, $X$ חסום כליל. (במפורש: לפי למה 3.3.3א(ב) עם $\varepsilon=\frac1n$, הבחירה של
          הרמז נעצרת ונותנת $\frac1n$-רשת סופית $F_n$.)
      - kind: theorem
        text: >-
          לפי משפט 4.4.5(א), $X$ ספרבילי; הקבוצה הצפופה היא $\bigcup_nF_n$, איחוד בן מנייה של קבוצות סופיות.
      - kind: check
        text: >-
          ההנחה נחוצה: $\mathbb{R}$ הבדיד אינו ספרבילי, והקבוצה האינסופית $\mathbb{N}$ אין לה בו נקודת הצטברות (כל כדור
          ברדיוס $\frac12$ הוא יחידון). ההפך אינו נכון: $\mathbb{R}$ עם $|x-y|$ ספרבילי, ו-$\mathbb{N}$ אין לה נקודת
          הצטברות בו. במקור, זה צעד בדרך להוכחה שמרחב כזה קומפקטי (רודין, פרק 2, תרגיל 26).
      - kind: result
        text: >-
          מרחב מטרי שבו לכל קבוצה אינסופית יש נקודת הצטברות חסום כליל, ולכן ספרבילי.
