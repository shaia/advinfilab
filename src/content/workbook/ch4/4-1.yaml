  - id: W-4.1-c2
    stars: 1
    objectives: [OBJ-4.1-2, OBJ-4.1-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, ותהיינה $f_n:X\to\mathbb{R}$ רציפות במידה שווה, עם $f_n\to f$ במידה שווה על $X$.

      (א) הוכיחו ש-$f$ רציפה במידה שווה.

      (ב) נסמן ב-$U_b(X)$ את הפונקציות החסומות שרציפות במידה שווה על $X$. הוכיחו ש-$U_b(X)$ תת-מרחב סגור של $C_b(X)$,
      ולכן שלם.

      (ג) הראו ש-$U_b(K)=C(K)$ כש-$K$ קומפקטי, ושב-$X=(0,1]$ ההכלה $U_b(X)\subseteq C_b(X)$ ממשית.
    answer: >-
      (א) $\frac\varepsilon3$: $N$ אחד מההתכנסות, ו-$\delta$ של $f_N$. (ב) לפי (א) ומסקנה 2.2.6(ב) עם משפט 2.2.1(א).
      (ג) משפט קנטור; $\sin\frac1x$.
    solution:
      - kind: idea
        text: >-
          כמו שלב 3 במשפט 4.1.4, אבל עם $\delta$ שאינו תלוי בנקודה: $f_N$ אחת קרובה ל-$f$ בכל מקום, וה-$\delta$ שלה מתאים לכל
          זוג נקודות.
      - kind: step
        text: >-
          (א) **1.** יהי $\varepsilon>0$. מההתכנסות במידה שווה יש $N$ עם $|f_N(x)-f(x)|<\frac\varepsilon3$ לכל $x\in X$. $f_N$ רציפה
          במידה שווה: יש $\delta>0$ כך ש-$d(x,y)<\delta$ גורר $|f_N(x)-f_N(y)|<\frac\varepsilon3$.
      - kind: step
        text: >-
          **2.** לכל $x,y$ עם $d(x,y)<\delta$:
          $$\begin{aligned}&|f(x)-f(y)|\\&\quad\le|f(x)-f_N(x)|\\&\qquad+|f_N(x)-f_N(y)|\\&\qquad+|f_N(y)-f(y)|\\&\quad<\varepsilon .\end{aligned}$$
          ה-$\delta$ תלוי רק ב-$\varepsilon$ (דרך $N$), ולכן $f$ רציפה במידה שווה.
      - kind: step
        text: >-
          (ב) **3.** $U_b(X)\subseteq C_b(X)$ (טענה 1.6.9). סכום של שתי פונקציות רציפות במידה שווה רציף במידה שווה ($\frac\varepsilon2$
          לכל אחת, והקטן מבין שני ה-$\delta$), וכך גם כפולה בסקלר: $U_b(X)$ תת-מרחב.
      - kind: step
        text: >-
          **4.** אם $f_n\in U_b(X)$ ו-$f_n\to f$ ב-$C_b(X)$, ההתכנסות במידה שווה (משפט 1.5.10(א)), ולפי (א) $f$ רציפה במידה שווה;
          היא חסומה כי $f\in C_b(X)$. לכן $U_b(X)$ סגורה (מסקנה 1.5.8(ב)), ולפי מסקנה 2.2.6(ב) ומשפט 2.2.1(א) שלמה.
      - kind: step
        text: >-
          (ג) **5.** לפי משפט קנטור (משפט 3.4.6) כל $f\in C(K)$ רציפה במידה שווה, והיא חסומה (טענה 4.1.1א): $U_b(K)=C(K)$.
          ב-$(0,1]$, $\sin\frac1x$ רציפה וחסומה ואינה רציפה במידה שווה (טענה 3.4.7(ג)).
      - kind: check
        text: >-
          ב-(ב) עם $K$ קומפקטי, $U_b(K)=C(K)$, והטענה היא משפט 4.1.4 שוב. ההנחה "במידה שווה" על $f_n$ ב-(א) נחוצה:
          $\sin\frac1x$ על $(0,1]$ היא גבול במידה שווה של עצמה, והרציפות לבדה אינה עוברת לרציפות במידה שווה.
      - kind: result
        text: >-
          (א) $f$ רציפה במידה שווה; (ב) $U_b(X)$ סגורה ב-$C_b(X)$ ושלמה; (ג) שוויון על קומפקטי, הכלה ממשית על $(0,1]$.
