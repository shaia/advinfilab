  - id: W-2.2-c2
    stars: 1
    objectives: [OBJ-2.2-2]
    prompt: >-
      יהיו $a<b$. פונקציה $f:[a,b]\to\mathbb{R}$ היא ליפשיצית אם יש $K$ עם $|f(x)-f(y)|\le K|x-y|$ לכל $x,y$. לפונקציה ליפשיצית
      $h$ נסמן $L(h)=\sup_{x\ne y}\frac{|h(x)-h(y)|}{|x-y|}$, ולשתי פונקציות ליפשיציות נגדיר

      $$
      d(f,g)=\sup_{x\in[a,b]}|f(x)-g(x)|+L(f-g).
      $$

      הוכיחו שמרחב הפונקציות הליפשיציות על $[a,b]$ עם $d$ הוא מרחב מטרי שלם.
    answer: >-
      $d(f,g)=\|f-g\|$ עם הנורמה $\|h\|=\|h\|_\infty+L(h)$. סדרת קושי בה היא סדרת קושי בסופרמום, ולכן מתכנסת במידה שווה
      לפונקציה רציפה $f$ (מסקנה 2.2.6(ג)); מעבר לגבול בתנאי קושי של מנות ההפרשים נותן $L(f_n-f)\le\varepsilon$.
    solution:
      - kind: given
        text: >-
          $\mathrm{Lip}[a,b]$, הפונקציות הליפשיציות על $[a,b]$, והמטריקה $d(f,g)=\|f-g\|_\infty+L(f-g)$.
      - kind: step
        text: >-
          מרחב וקטורי ונורמה. אם $h_1,h_2$ ליפשיציות עם קבועים $K_1,K_2$, אז $\lambda h_1+\mu h_2$ ליפשיצית עם קבוע
          $|\lambda|K_1+|\mu|K_2$. $L(h)$ הוא החסם המלעיל הקטן ביותר של מנות ההפרשים, ולכן $L(h)\le K$ סופי,
          $L(\lambda h)=|\lambda|L(h)$, ו-$L(h_1+h_2)\le L(h_1)+L(h_2)$ (אי-שוויון המשולש בכל מנה, ואחר כך סופרמום). פונקציה
          ליפשיצית רציפה (טענה 1.6.9), ולכן $\mathrm{Lip}[a,b]\subseteq C[a,b]$ ו-$\|h\|_\infty$ מוגדרת. $\|h\|=\|h\|_\infty+L(h)$
          מקיימת N2 ו-N3 כסכום של שתי פונקציות שמקיימות אותן, ו-N1 כי $\|h\|=0$ גורר $\|h\|_\infty=0$. לפי טענה 1.2.3, $d$
          מטריקה.
      - kind: step
        text: >-
          מועמד. תהי $(f_n)$ סדרת קושי ב-$d$. כי $\|f_n-f_m\|_\infty\le d(f_n,f_m)$, היא סדרת קושי ב-$(C[a,b],\|\cdot\|_\infty)$,
          ולפי מסקנה 2.2.6(ג) יש $f\in C[a,b]$ עם $\|f_n-f\|_\infty\to0$; בפרט $f_n(x)\to f(x)$ לכל $x$.
      - kind: step
        text: >-
          הערכה אחידה. יהי $\varepsilon>0$ ו-$N$ עם $d(f_n,f_m)<\varepsilon$ לכל $m,n>N$. אז $L(f_n-f_m)<\varepsilon$, כלומר
          לכל $x\ne y$: $|(f_n-f_m)(x)-(f_n-f_m)(y)|\le\varepsilon|x-y|$. נקבע $n>N$ ו-$x\ne y$ ונשאיף $m\to\infty$: האגף השמאלי
          שואף ל-$|(f_n-f)(x)-(f_n-f)(y)|$, ואי-שוויון חלש עובר לגבול:
          $|(f_n-f)(x)-(f_n-f)(y)|\le\varepsilon|x-y|$.
      - kind: step
        text: >-
          הגבול במרחב. לפי השלב הקודם $f_n-f$ ליפשיצית עם $L(f_n-f)\le\varepsilon$, ולכן $f=f_n-(f_n-f)$ ליפשיצית, כהפרש של
          שתי ליפשיציות.
      - kind: step
        text: >-
          התכנסות. לכל $n>N$: $d(f_n,f)=\|f_n-f\|_\infty+L(f_n-f)\le\|f_n-f\|_\infty+\varepsilon$, ו-$\|f_n-f\|_\infty\to0$; לכן
          $d(f_n,f)<2\varepsilon$ לכל $n$ גדול מספיק. $\varepsilon$ שרירותי, ולכן $f_n\to f$ ב-$d$.
      - kind: check
        text: >-
          בלי החלק $L(f-g)$ התשובה הייתה שונה: עם $\|\cdot\|_\infty$ בלבד הפונקציות הליפשיציות אינן שלמות. הפונקציות
          $\sqrt{(x-\frac12)^2+\frac1{n^2}}$ של טענה 2.2.9 ליפשיציות (נגזרתן חסומה ב-1) ושואפות במידה שווה ל-$|x-\frac12|$, שהיא
          ליפשיצית; אבל $\sqrt{x+\frac1n}$ על $[0,1]$ ליפשיציות ושואפות במידה שווה ל-$\sqrt x$, שאינה ליפשיצית. לכן הפונקציות
          הליפשיציות אינן סגורות ב-$(C[0,1],\|\cdot\|_\infty)$, ולפי משפט 2.2.1(ב) הן אינן שלמות עם הסופרמום לבדו.
      - kind: result
        text: >-
          $(\mathrm{Lip}[a,b],d)$ מרחב מטרי שלם.
