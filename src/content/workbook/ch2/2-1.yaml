# Workbook of lesson 2.1 — Cauchy sequences and complete spaces.
# Objectives (src/course.ts):
#   OBJ-2.1-1  define a Cauchy sequence; convergent ⇒ Cauchy; Cauchy ⇒ bounded
#   OBJ-2.1-2  a Cauchy sequence with a convergent subsequence converges
#   OBJ-2.1-3  define a complete space; ℝⁿ is complete; ℚ and an open interval are not
# Every number recomputed with npx tsx (diameters, partial sums, thresholds). Both challenges are from Thomson, Bruckner,
# Bruckner, Elementary Real Analysis, 2nd ed. (2008), opened 2026-11-10; c2 is adapted (see its check step).
lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    objectives: [OBJ-2.1-1]
    prompt: >-
      חשבו את הקטרים (הגדרה וטענה 2.1.2), והוכיחו.

      (א) העיגול הסגור $K=\{x\in\mathbb{R}^2:\ \|x\|_2\le1\}$, במטריקות $d_2$, $d_1$ ו-$d_\infty$.

      (ב) הקבוצה $A=\{\frac1n:\ n\in\mathbb{N}\}\subseteq\mathbb{R}$ עם $|x-y|$. האם יש ב-$A$ שתי נקודות שמרחקן הוא הקוטר?
    answer: >-
      (א) $2$ ב-$d_2$, $2\sqrt2$ ב-$d_1$, $2$ ב-$d_\infty$. (ב) $\operatorname{diam}A=1$, ואין זוג שמרחקו 1.
    solution:
      - kind: idea
        text: >-
          חוסמים את המרחק מלמעלה בעזרת אי-שוויון בין נורמות, ומראים שהחסם מתקבל, או שמתקרבים אליו כרצוננו. כשהחסם
          רק מתקרבים אליו, הקוטר שווה לו ואינו מתקבל.
      - kind: step
        text: >-
          (א, $d_2$) $K=B[0,1]$ ב-$(\mathbb{R}^2,\|\cdot\|_2)$, מרחב נורמי שונה מ-$\{0\}$ (משפט 1.2.10), ולפי הגדרה
          וטענה 2.1.2(ד) $\operatorname{diam}K=2$.
      - kind: step
        text: >-
          (א, $d_1$) לכל $x,y\in K$, לפי משפט 1.7.3 עם $n=2$: $d_1(x,y)\le\sqrt2\,d_2(x,y)\le2\sqrt2$. הזוג
          $x=\left(\frac1{\sqrt2},\frac1{\sqrt2}\right)$, $y=-x$ נמצא ב-$K$, ו-$x-y=(\sqrt2,\sqrt2)$, כך ש-$d_1(x,y)=2\sqrt2$.
          לכן הקוטר $2\sqrt2$, והוא מתקבל.
      - kind: step
        text: >-
          (א, $d_\infty$) $d_\infty\le d_2\le2$ על $K$ (למה 1.1.6), והזוג $(1,0)$, $(-1,0)$ נותן $d_\infty=2$. הקוטר 2.
      - kind: step
        text: >-
          (ב) לכל $m,n$ שני המספרים $\frac1m,\frac1n$ בקטע $(0,1]$, ולכן $\left|\frac1m-\frac1n\right|<1-0=1$: החסם 1
          הוא חסם מלעיל, וכל מרחק קטן ממנו **ממש**. מצד שני $\left|1-\frac1n\right|=1-\frac1n$, ולכל $s<1$ יש $n$
          (ארכימדס) עם $1-\frac1n>s$. לכן הסופרמום הוא 1, ואינו מתקבל.
      - kind: check
        text: >-
          מספרית: $2\sqrt2\approx2.828$, ובזוג $\left(1,0\right)$, $\left(-1,0\right)$ המרחק $d_1$ הוא רק 2: הקוטר ב-$d_1$
          מתקבל באלכסון. וב-(ב) $|1-\frac1{100}|=0.99$, קרוב ל-1 ולא שווה לו.
      - kind: result
        text: >-
          (א) $2$, $2\sqrt2$, $2$. (ב) $\operatorname{diam}A=1$, ואין שתי נקודות ב-$A$ במרחק 1. הקוטר הוא סופרמום,
          לא מקסימום.

  - id: W-2.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      קבעו אילו מהסדרות הבאות ב-$\mathbb{R}$ הן סדרות קושי, ונמקו. בכל סעיף בדקו גם אם $\sum_n|x_{n+1}-x_n|<\infty$.

      (א) $x_n=\ln n$.

      (ב) $x_n=\sum_{k=1}^n\frac{(-1)^k}{\sqrt k}$.

      (ג) $x_n=\sum_{k=1}^n\frac{\sin k}{2^k}$.
    answer: >-
      (א) לא: $x_{2n}-x_n=\ln2$. (ב) כן (מבחן לייבניץ), אבל $\sum\frac1{\sqrt{n+1}}=\infty$. (ג) כן, לפי למה 2.1.7 עם
      $c_n=2^{-(n+1)}$.
    solution:
      - kind: idea
        text: >-
          שלוש דרכים להכריע: למצוא $\varepsilon$ שבכל זנב יש זוג רחוק (השלילה שאחרי טענה 2.1.3); להראות שהסדרה מתכנסת
          ב-$\mathbb{R}$ (טענה 2.1.4); או לחסום את הצעדים בטור מתכנס (למה 2.1.7).
      - kind: step
        text: >-
          (א) $x_{2n}-x_n=\ln(2n)-\ln n=\ln2$ לכל $n$. עם $\varepsilon=\ln2$: בכל זנב, הזוג $n=N+1$, $m=2(N+1)$ מרחקו $\ln2$.
          זו השלילה של הגדרה 2.1.1. הצעדים $\ln\!\left(1+\frac1n\right)\to0$, ולכן זו עוד דוגמה לטענה 2.1.6(ב); והטור
          של הצעדים מתבדר, כי לא ייתכן שצעדים סכימים (למה 2.1.7) ייתנו סדרה שאינה סדרת קושי.
      - kind: step
        text: >-
          (ב) $\frac1{\sqrt k}$ יורדת ל-0, ולפי מבחן לייבניץ (אינפי 1) הטור מתכנס: $(x_n)$ מתכנסת ב-$\mathbb{R}$, ולפי
          טענה 2.1.4 היא סדרת קושי. הצעדים: $|x_{n+1}-x_n|=\frac1{\sqrt{n+1}}\ge\frac1{n+1}$, ולפי מבחן ההשוואה
          $\sum\frac1{\sqrt{n+1}}=\infty$, כי $\sum\frac1{n+1}=\infty$ (ההערה שאחרי למה 2.1.7).
      - kind: step
        text: >-
          (ג) $|x_{n+1}-x_n|=\frac{|\sin(n+1)|}{2^{n+1}}\le2^{-(n+1)}=c_n$, ו-$\sum_n2^{-(n+1)}=\frac12<\infty$. לפי למה
          2.1.7 הסדרה סדרת קושי, ול-$m>n$: $|x_m-x_n|\le\sum_{k\ge n}2^{-(k+1)}=2^{-n}$.
      - kind: check
        text: >-
          (ב) מספרית $x_1,x_2,x_3\approx-1,\ -0.293,\ -0.870$: קפיצות שקטנות לאט, בסימנים מתחלפים. ב-(ג) החסם
          $2^{-n}$ ל-$n=10$ הוא $\approx0.00098$.
      - kind: result
        text: >-
          (א) אינה סדרת קושי, והצעדים אינם סכימים. (ב) סדרת קושי, והצעדים אינם סכימים: למה 2.1.7 אינה הכרחית. (ג) סדרת
          קושי, עם צעדים סכימים.

  - id: W-2.1-03
    level: mid
    objectives: [OBJ-2.1-3]
    prompt: >-
      יהי $A=\{\frac1n:\ n\in\mathbb{N}\}$ ו-$K=A\cup\{0\}$, שניהם עם $|x-y|$.

      (א) הוכיחו ש-$A$ אינו שלם.

      (ב) הוכיחו ישירות, בלי שיעור 2.2, ש-$K$ שלם.
    answer: >-
      (א) $\frac1n$ סדרת קושי ב-$A$ שגבולה ב-$\mathbb{R}$ הוא $0\notin A$. (ב) סדרת קושי ב-$K$ מתכנסת ב-$\mathbb{R}$
      ל-$x$; כל נקודה מחוץ ל-$K$ היא מרכז של כדור זר ל-$K$, ולכן $x\in K$.
    solution:
      - kind: idea
        text: >-
          כמו בהוכחת טענה 2.1.14: סדרה ב-$K$ היא סדרה ב-$\mathbb{R}$ עם אותם מרחקים, ו-$\mathbb{R}$ שלם. השאלה היחידה היא
          אם הגבול ב-$\mathbb{R}$ נמצא ב-$K$. ל-$A$ חסר 0, ול-$K$ לא חסר כלום.
      - kind: step
        text: >-
          (א) $\frac1n\in A$ ו-$\frac1n\to0$ ב-$\mathbb{R}$, ו-$0\notin A$. לפי שלבים 1–2 בהוכחת טענה 2.1.14 עם $Y=A$ ו-$p=0$,
          זו סדרת קושי ב-$A$ שאין לה גבול ב-$A$.
      - kind: step
        text: >-
          (ב) תהי $(x_n)$ סדרת קושי ב-$K$. היא סדרת קושי ב-$\mathbb{R}$, ולפי משפט 2.1.10 $x_n\to x\in\mathbb{R}$. נראה ש-$x\in K$.
          נניח בשלילה ש-$x\notin K$, ונמצא $r>0$ עם $B(x,r)\cap K=\emptyset$.
      - kind: step
        text: >-
          אם $x<0$: $r=-x$, כי כל נקודות $K$ אי-שליליות. אם $x>1$: $r=x-1$, כי כל נקודות $K$ לכל היותר 1. אם $0<x<1$ ו-$x\ne\frac1n$
          לכל $n$: נסמן $n=\lfloor\frac1x\rfloor\ge1$; כי $\frac1x\notin\mathbb{N}$, $n<\frac1x<n+1$, כלומר $\frac1{n+1}<x<\frac1n$. עם
          $r=\min\left(x-\frac1{n+1},\ \frac1n-x\right)>0$: נקודות $K$ הן $0$ ו-$\frac1m$ עם $m\ge n+1$, שכולן לכל היותר $\frac1{n+1}$,
          ו-$\frac1m$ עם $m\le n$, שכולן לפחות $\frac1n$; לכן כולן במרחק לפחות $r$ מ-$x$.
      - kind: step
        text: >-
          מ-$x_n\to x$ יש $n$ עם $|x_n-x|<r$, כלומר $x_n\in B(x,r)\cap K$, סתירה. לכן $x\in K$, ו-$x_n\to x$ גם במרחב $K$
          (אותם מרחקים). $K$ שלם.
      - kind: check
        text: >-
          המקרה $x=1$ אינו נשאר בחוץ: $1=\frac11\in K$. ודוגמה למקרה השלישי: $x=0.4$ נותן $n=2$, $\frac13<0.4<\frac12$,
          ו-$r=\min(0.0667,\ 0.1)\approx0.0667$.
      - kind: result
        text: >-
          $A$ אינו שלם ו-$K=A\cup\{0\}$ שלם. הוספת הנקודה החסרה מתקנת את המרחב; זה הרעיון של ההשלמה (שיעור 2.6), ושל
          מסקנה 2.2.2.

  - id: W-2.1-04
    level: exam
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$(x_n)$ סדרה ב-$X$.

      (א) הוכיחו: אם שלוש התת-סדרות $(x_{2n})$, $(x_{2n-1})$ ו-$(x_{3n})$ הן סדרות קושי, אז $(x_n)$ סדרת קושי.

      (ב) הראו בשלוש דוגמאות ב-$\mathbb{R}$ שאף שתיים מהשלוש אינן מספיקות.
    answer: >-
      (א) זוג זוגי-אי-זוגי מחברים דרך $x_{6j}$ ו-$x_{6j+3}$, שתיהן כפולות של 3. (ב) $(-1)^n$; $x_n=1$ כש-$n\equiv1,5\pmod 6$
      ו-0 אחרת; $x_n=1$ כש-$n\equiv2,4\pmod6$ ו-0 אחרת.
    solution:
      - kind: idea
        text: >-
          זוג של שני זוגיים או של שני אי-זוגיים מכוסה ישירות. זוג מעורב צריך גשר: $x_{6j}$ זוגי וכפולה של 3, ו-$x_{6j+3}$ אי-זוגי
          וכפולה של 3, ושלושת הקטעים בדרך מכוסים כל אחד בתת-סדרה אחרת.
      - kind: step
        text: >-
          (א) יהי $\varepsilon>0$. יש $N_1,N_2,N_3$ כך ש: $d(x_{2k},x_{2l})<\frac\varepsilon3$ לכל $k,l>N_1$;
          $d(x_{2k-1},x_{2l-1})<\frac\varepsilon3$ לכל $k,l>N_2$; $d(x_{3k},x_{3l})<\frac\varepsilon3$ לכל $k,l>N_3$. נסמן
          $M=\max(N_1,N_2,N_3)$, $N=2M+1$ ו-$j=M+1$.
      - kind: step
        text: >-
          יהיו $m,n>N$. אם שניהם זוגיים, $m=2k$, $n=2l$ עם $k,l>M\ge N_1$, ו-$d(x_m,x_n)<\frac\varepsilon3$. אם שניהם אי-זוגיים,
          $m=2k-1$, $n=2l-1$ עם $2k>N+1$, כלומר $k>M+1>N_2$, וכך גם $l$.
      - kind: step
        text: >-
          זוג מעורב: $m=2k$ עם $k>M$, ו-$n=2l-1$ עם $l>M+1$. לפי אי-שוויון המצולע (למה 1.1.2(א)):
          $d(x_{2k},x_{2l-1})\le d(x_{2k},x_{6j})+d(x_{6j},x_{6j+3})+d(x_{6j+3},x_{2l-1})$. המחובר הראשון: $6j=2(3j)$ עם $3j>N_1$
          ו-$k>N_1$. השני: $6j=3(2j)$ ו-$6j+3=3(2j+1)$ עם $2j,2j+1>N_3$. השלישי: $6j+3=2(3j+2)-1$ עם $3j+2>N_2$ ו-$l>N_2$. כל
          אחד קטן מ-$\frac\varepsilon3$, והסכום קטן מ-$\varepsilon$. הסדר ההפוך, $m$ אי-זוגי ו-$n$ זוגי, נובע מזה לפי (M2):
          $d(x_m,x_n)=d(x_n,x_m)$.
      - kind: step
        text: >-
          (ב) זוגיים ואי-זוגיים: $x_n=(-1)^n$ (טענה 2.1.5 והדוגמה שאחריה). זוגיים וכפולות של 3: $x_n=1$ כש-$n\equiv1$ או $5\pmod6$
          ו-$x_n=0$ אחרת; כל זוגי וכל כפולה של 3 נותנים 0, אבל $|x_{6k+1}-x_{6k}|=1$ לכל $k$. אי-זוגיים וכפולות של 3: $x_n=1$
          כש-$n\equiv2$ או $4\pmod6$ ו-0 אחרת; כל אי-זוגי וכל כפולה של 3 נותנים 0, אבל $|x_{6k+2}-x_{6k+3}|=1$.
      - kind: check
        text: >-
          בשלוש הדוגמאות שתי התת-סדרות קבועות, ולכן סדרות קושי, ובכל זנב יש זוג במרחק 1: השלילה של הגדרה 2.1.1 עם
          $\varepsilon=1$. ובדיקת הגשר עם $j=4$: $x_{24}$ ו-$x_{27}$, ואכן $27=2\cdot14-1$.
      - kind: result
        text: >-
          שלוש התת-סדרות יחד גוררות שהסדרה סדרת קושי, ואף שתיים מהן לא. מה שעובד הוא שהקבוצות $2\mathbb{N}$ ו-$2\mathbb{N}-1$
          מכסות את $\mathbb{N}$, ו-$3\mathbb{N}$ פוגשת את שתיהן באינסוף מקומות.

  - id: W-2.1-05
    level: basic
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $(x_n)$ סדרת קושי ב-$X$, ו-$(y_n)$ סדרה ב-$X$ עם $d(x_n,y_n)\to0$.

      (א) הוכיחו ש-$(y_n)$ סדרת קושי.

      (ב) הוכיחו שאם לתת-סדרה כלשהי של $(y_n)$ יש גבול $p\in X$, אז $x_n\to p$ וגם $y_n\to p$.
    answer: >-
      (א) $d(y_m,y_n)\le d(y_m,x_m)+d(x_m,x_n)+d(x_n,y_n)$. (ב) לפי (א) וטענה 2.1.8 $y_n\to p$, ואז
      $d(x_n,p)\le d(x_n,y_n)+d(y_n,p)\to0$.
    solution:
      - kind: idea
        text: >-
          שתי הסדרות צמודות זו לזו, ולכן מרחקים בין איברי $(y_n)$ שווים כמעט למרחקים בין איברי $(x_n)$. ההתכנסות של תת-סדרה
          עוברת לכל הסדרה בזכות טענה 2.1.8.
      - kind: step
        text: >-
          (א) יהי $\varepsilon>0$. יש $N_1$ עם $d(x_m,x_n)<\frac\varepsilon3$ לכל $m,n>N_1$, ו-$N_2$ עם $d(x_n,y_n)<\frac\varepsilon3$
          לכל $n>N_2$. עם $N=\max(N_1,N_2)$, לכל $m,n>N$, לפי אי-שוויון המצולע ו-(M2):
          $d(y_m,y_n)\le d(y_m,x_m)+d(x_m,x_n)+d(x_n,y_n)<\varepsilon$.
      - kind: step
        text: >-
          (ב) לפי (א) $(y_n)$ סדרת קושי, ויש לה תת-סדרה ששואפת ל-$p$; לפי טענה 2.1.8 $y_n\to p$.
      - kind: step
        text: >-
          לפי (M3), $0\le d(x_n,p)\le d(x_n,y_n)+d(y_n,p)$, ושני המחוברים שואפים ל-0. לפי כלל הסנדוויץ' $x_n\to p$.
      - kind: check
        text: >-
          בלי "סדרת קושי" (ב) נופל: $x_n=y_n=(-1)^n$ מקיימות $d(x_n,y_n)=0$, ל-$(y_{2n})$ יש גבול 1, ואף אחת לא מתכנסת. ובמרחב לא
          שלם (א) עדיין נכון: ב-$\mathbb{Q}$, הקירובים העשרוניים של $\sqrt2$ והקירובים העשרוניים "מלמעלה", $q_n+10^{1-n}$, הם שתי
          סדרות קושי צמודות, ולאף אחת אין גבול ב-$\mathbb{Q}$.
      - kind: result
        text: >-
          סדרה שצמודה לסדרת קושי היא סדרת קושי, ואם אחת מהן מתכנסת, או רק תת-סדרה של אחת מהן, שתיהן מתכנסות לאותו גבול.

  - id: W-2.1-06
    level: mid
    objectives: [OBJ-2.1-3]
    prompt: >-
      על $\mathbb{R}$ נגדיר $\kappa(x,y)=|x-y|+|\arctan x-\arctan y|$, ונסמן $\rho(x,y)=|\arctan x-\arctan y|$ (טענה 2.1.15).

      (א) הוכיחו ש-$\kappa$ מטריקה.

      (ב) הוכיחו $|x-y|\le\kappa(x,y)\le2|x-y|$, והסיקו ש-$(\mathbb{R},\kappa)$ שלם.

      (ג) גם $\rho\le\kappa$. למה אי-שוויון זה אינו מעביר את השלמות של $(\mathbb{R},\kappa)$ אל $(\mathbb{R},\rho)$?
    answer: >-
      (א) סכום של שתי מטריקות. (ב) לפי לגרנז' $|\arctan x-\arctan y|\le|x-y|$; טענה 2.1.12(ב) ומשפט 2.1.10. (ג) $\rho\le\kappa$
      מעביר סדרות קושי מ-$\kappa$ ל-$\rho$, ושלמות צריכה את הכיוון ההפוך: $x_n=n$ סדרת קושי ב-$\rho$ ולא ב-$\kappa$.
    solution:
      - kind: idea
        text: >-
          $\kappa$ היא המטריקה הרגילה ועוד תיקון שקטן ממנה, ולכן שקולה לה ליפשיץ. אי-שוויון בכיוון אחד מעביר סדרות קושי בכיוון
          אחד בלבד (טענה 2.1.12(א)), והשאלה היא באיזה כיוון.
      - kind: step
        text: >-
          (א) $|x-y|$ מטריקה, ו-$\rho$ מטריקה (טענה 2.1.15(א)). לסכום: $\kappa\ge0$ ו-$\kappa(x,x)=0$; אם $\kappa(x,y)=0$ אז
          $|x-y|=0$ ו-$x=y$; סימטריה מכל מחובר; ואי-שוויון המשולש של כל מחובר בנפרד, בסכום, נותן את זה של $\kappa$.
      - kind: step
        text: >-
          (ב) לפי משפט הערך הממוצע של לגרנז' (אינפי 1) יש $t$ בין $x$ ל-$y$ עם
          $|\arctan x-\arctan y|=\frac1{1+t^2}|x-y|\le|x-y|$. לכן $|x-y|\le\kappa(x,y)\le2|x-y|$: המטריקות שקולות ליפשיץ (הגדרה
          1.7.1, עם $c=1$, $C=2$). $(\mathbb{R},|x-y|)$ שלם (משפט 2.1.10), ולפי טענה 2.1.12(ב) גם $(\mathbb{R},\kappa)$.
      - kind: step
        text: >-
          (ג) לפי טענה 2.1.12(א) עם $C=1$, $\rho\le\kappa$ אומר שכל סדרת קושי ב-$\kappa$ היא סדרת קושי ב-$\rho$. כדי להעביר
          שלמות אל $\rho$ היה צריך את ההפך: שכל סדרת קושי ב-$\rho$ תהיה סדרת קושי ב-$\kappa$. וזה נכשל: $x_n=n$ סדרת קושי ב-$\rho$
          (טענה 2.1.15(ב)), ו-$\kappa(n,n+1)\ge1$, ולכן אינה סדרת קושי ב-$\kappa$ (טענה 2.1.6(א)).
      - kind: check
        text: >-
          $\kappa(0,1)=1+\frac\pi4\approx1.785\le2$, ו-$\kappa(100,101)=1+(\arctan101-\arctan100)\approx1.0001$: היחס
          $\frac{\kappa}{|x-y|}$ נע בין 1 ל-2.
      - kind: result
        text: >-
          $\kappa$ מטריקה שקולה ליפשיץ ל-$|x-y|$, ולכן $(\mathbb{R},\kappa)$ שלם; $\rho\le\kappa$ אינו מספיק כדי להעביר את השלמות,
          ו-$(\mathbb{R},\rho)$ אכן אינו שלם.

  - id: W-2.1-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      על הקבוצה $X=(0,\infty)$ נתונות שתי מטריקות: $d(x,y)=|x-y|$ ו-$\lambda(x,y)=|\ln x-\ln y|$. איזה מהמרחבים $(X,d)$ ו-$(X,\lambda)$
      שלם? הוכיחו.
    answer: >-
      $(X,d)$ אינו שלם ($\frac1n$); $(X,\lambda)$ שלם, כי $\ln$ שולחת אותו, עם כל המרחקים, על $(\mathbb{R},|x-y|)$.
    solution:
      - kind: idea
        text: >-
          ב-$d$ חסרה לקצה השמאלי הנקודה 0. ב-$\lambda$ הלוגריתם "מותח" את הקצה עד אינסוף: $\ln$ שומרת על כל המרחקים ושולחת את
          $X$ **על** כל $\mathbb{R}$, ולכן אין לאן ש"ייפול" גבול.
      - kind: step
        text: >-
          ($\lambda$ מטריקה) $\ln$ חד-חד-ערכית על $(0,\infty)$, ולפי טענה 1.1.13(ב) $\lambda$ מטריקה.
      - kind: step
        text: >-
          ($(X,d)$) $\frac1n\in X$ ו-$\frac1n\to0\notin X$ ב-$\mathbb{R}$. לפי שלבים 1–2 בהוכחת טענה 2.1.14, זו סדרת קושי בלי גבול
          ב-$(X,d)$.
      - kind: step
        text: >-
          ($(X,\lambda)$) תהי $(x_n)$ סדרת קושי ב-$\lambda$. אז $|\ln x_m-\ln x_n|=\lambda(x_m,x_n)$, ולכן $(\ln x_n)$ סדרת קושי
          ב-$\mathbb{R}$, ולפי משפט 2.1.10 $\ln x_n\to L\in\mathbb{R}$. נגדיר $x=e^L\in X$. אז $\lambda(x_n,x)=|\ln x_n-L|\to0$, כלומר
          $x_n\to x$ ב-$(X,\lambda)$.
      - kind: check
        text: >-
          בדיקה של הסדרה שהפילה את $d$: $\lambda\left(\frac1n,\frac1{2n}\right)=\ln2$ לכל $n$, ולכן $\frac1n$ **אינה** סדרת קושי
          ב-$\lambda$, בהתאם. איפה השתמשנו בכך ש-$\ln$ על $\mathbb{R}$? ב-$x=e^L$: לכל גבול $L$ יש מקור. לעומת זאת $\arctan$ אינה
          על, וזו בדיוק הסיבה ש-$(\mathbb{R},\rho)$ של טענה 2.1.15 אינו שלם.
      - kind: result
        text: >-
          $(X,d)$ אינו שלם ו-$(X,\lambda)$ שלם: אותה קבוצה, שתי מטריקות, ותשובות הפוכות. (שתי המטריקות שקולות טופולוגית, כי $\ln$
          ו-$\exp$ רציפות; כך שגם כאן שלמות אינה נקבעת על ידי הקבוצות הפתוחות.)

  - id: W-2.1-08
    level: mid
    objectives: [OBJ-2.1-3]
    prompt: >-
      יהיו $(X,d_X)$ ו-$(Y,d_Y)$ מרחבים מטריים. על $X\times Y$ נגדיר

      $$D\big((x,y),(x',y')\big)=\max\big(d_X(x,x'),\ d_Y(y,y')\big).$$

      (א) הוכיחו ש-$D$ מטריקה.

      (ב) הוכיחו: אם $X$ ו-$Y$ שלמים, אז $(X\times Y,D)$ שלם.

      (ג) הוכיחו: אם $(X\times Y,D)$ שלם, אז $X$ שלם.

      (ד) הסיקו ש-$X\times Y$ שלם גם עם $D_1=d_X+d_Y$, וקבלו מחדש את משפט 2.1.11 ב-$\mathbb{R}^2$ עם $d_\infty$ ועם $d_1$.
    answer: >-
      (ב) קואורדינטות של סדרת קושי הן סדרות קושי, ו-$D$ הוא מקסימום של שני מרחקים ששואפים ל-0. (ג) מקבעים $y_0$ ומסתכלים על
      $(x_n,y_0)$. (ד) $D\le D_1\le2D$ וטענה 2.1.12(ב).
    solution:
      - kind: idea
        text: >-
          בדיוק ההוכחה של משפט 2.1.11, עם שני "רכיבים" שהם מרחבים מטריים במקום מספרים: $D$ שולטת בכל רכיב, ושני רכיבים
          קטנים נותנים $D$ קטן.
      - kind: step
        text: >-
          (א) $D\ge0$; $D=0$ אם ורק אם שני המרחקים 0, כלומר $x=x'$ ו-$y=y'$; סימטריה מ-(M2) בכל רכיב. משולש: לכל שלוש
          נקודות, $d_X(x,x'')\le d_X(x,x')+d_X(x',x'')\le D\big((x,y),(x',y')\big)+D\big((x',y'),(x'',y'')\big)$, ואותו הדבר
          ב-$Y$; המקסימום של שני מספרים שכל אחד מהם לכל היותר הסכום, לכל היותר הסכום.
      - kind: step
        text: >-
          (ב) תהי $(x_n,y_n)$ סדרת קושי ב-$D$. כי $d_X(x_m,x_n)\le D\big((x_m,y_m),(x_n,y_n)\big)$, ה-$N$ של $D$ מתאים
          ל-$(x_n)$: היא סדרת קושי ב-$X$, וכך גם $(y_n)$ ב-$Y$. מהשלמות, $x_n\to x\in X$ ו-$y_n\to y\in Y$.
      - kind: step
        text: >-
          יהי $\varepsilon>0$; יש $N_1$ עם $d_X(x_n,x)<\varepsilon$ ל-$n>N_1$, ו-$N_2$ עם $d_Y(y_n,y)<\varepsilon$ ל-$n>N_2$. ל-$n>\max(N_1,N_2)$:
          $D\big((x_n,y_n),(x,y)\big)<\varepsilon$. לכן $(x_n,y_n)\to(x,y)$, והמרחב שלם.
      - kind: step
        text: >-
          (ג) $Y\ne\emptyset$ (מרחב מטרי), ונקבע $y_0\in Y$. תהי $(x_n)$ סדרת קושי ב-$X$. אז $D\big((x_m,y_0),(x_n,y_0)\big)=d_X(x_m,x_n)$,
          ולכן $(x_n,y_0)$ סדרת קושי ב-$D$, ומתכנסת ל-$(x,y)$. אז $d_X(x_n,x)\le D\big((x_n,y_0),(x,y)\big)\to0$, ו-$x_n\to x\in X$.
      - kind: step
        text: >-
          (ד) לכל שני מספרים $a,b\ge0$: $\max(a,b)\le a+b\le2\max(a,b)$, ולכן $D\le D_1\le2D$; $D_1$ מטריקה (משולש מסכום
          המשולשים), שקולה ליפשיץ ל-$D$, ולפי טענה 2.1.12(ב) $(X\times Y,D_1)$ שלם. עם $X=Y=\mathbb{R}$ (שלם, משפט 2.1.10), $D$ היא
          $d_\infty$ ו-$D_1$ היא $d_1$ של $\mathbb{R}^2$.
      - kind: check
        text: >-
          (ג) צריך $Y\ne\emptyset$: בלעדיו $X\times Y$ ריק, ולא היה מאיפה לבנות סדרה. ובכיוון ההפוך של (ג): עם $X=\mathbb{Q}$ ו-$Y=\mathbb{R}$,
          המכפלה אינה שלמה, כי $(q_n,0)$ סדרת קושי בלי גבול, כש-$q_n$ הקירובים העשרוניים של $\sqrt2$.
      - kind: result
        text: >-
          $(X\times Y,D)$ שלם אם ורק אם $X$ ו-$Y$ שלמים (את "רק אם" ל-$Y$ מקבלים כמו ב-(ג)), וכך גם עם $D_1$; משפט 2.1.11
          ב-$\mathbb{R}^2$ הוא המקרה $X=Y=\mathbb{R}$.

  - id: W-2.1-09
    level: exam
    qualitative: true
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$(x_n)$ סדרה ב-$X$.

      (א) הוכיחו: $(x_n)$ סדרת קושי אם ורק אם לכל שתי סדרות עולות ממש של מספרים טבעיים $(m_k)$, $(n_k)$, מתקיים
      $d(x_{m_k},x_{n_k})\to0$.

      (ב) הסבירו בעזרת (א) למה התנאים $d(x_n,x_{n+1})\to0$ ו-$d(x_n,x_{2n})\to0$ חלשים מתנאי קושי, ותנו לכל אחד מהם
      סדרה ב-$\mathbb{R}$ שמקיימת אותו ואינה סדרת קושי.
    answer: >-
      (א) ($\Rightarrow$) $m_k,n_k\ge k$. ($\Leftarrow$) מהשלילה שאחרי טענה 2.1.3 בונים ברקורסיה זוגות עולים במרחק לפחות
      $\varepsilon$. (ב) הם (א) לבחירה אחת של זוגות: $m_k=k+1$, $n_k=k$ ($\sqrt n$) ו-$m_k=2k$, $n_k=k$ ($\ln\ln(n+1)$).
    solution:
      - kind: idea
        text: >-
          תנאי קושי הוא "כל הזוגות הרחוקים בסדרה קרובים". בניסוח בעזרת סדרות של זוגות, השלילה הופכת לבנייה: אם יש $\varepsilon$
          שבכל זנב יש זוג רחוק, בוחרים זוג רחוק, ואחריו זוג רחוק אחר, וכן הלאה.
      - kind: step
        text: >-
          (א, $\Rightarrow$) סדרה עולה ממש של טבעיים מקיימת $m_k\ge k$ (כמו בשיעור 1.5). יהי $\varepsilon>0$ ו-$N$ מהגדרה 2.1.1.
          לכל $k>N$: $m_k,n_k\ge k>N$, ולכן $d(x_{m_k},x_{n_k})<\varepsilon$.
      - kind: step
        text: >-
          (א, $\Leftarrow$) נניח ש-$(x_n)$ אינה סדרת קושי. לפי השלילה שאחרי טענה 2.1.3 יש $\varepsilon>0$ כך שלכל $N$ יש
          $m,n>N$ עם $d(x_m,x_n)\ge\varepsilon$. נבנה ברקורסיה: $(m_1,n_1)$ זוג כזה עם $N=1$; ואם $(m_k,n_k)$ נבחר, $(m_{k+1},n_{k+1})$
          זוג כזה עם $N=\max(m_k,n_k)$. (זו בחירה של סדרה: בכל שלב בוחרים זוג אחד. אפשר לקבוע אותו במפורש, למשל
          הזוג עם $m+n$ הקטן ביותר, ובו $m$ הקטן ביותר.)
      - kind: step
        text: >-
          אז $m_{k+1}>\max(m_k,n_k)\ge m_k$ ו-$n_{k+1}>n_k$: שתי סדרות עולות ממש, ו-$d(x_{m_k},x_{n_k})\ge\varepsilon$ לכל $k$, כך
          שהמרחקים אינם שואפים ל-0. זו השלילה של התנאי ב-(א).
      - kind: step
        text: >-
          (ב) $d(x_n,x_{n+1})\to0$ הוא התנאי של (א) לזוג היחיד $m_k=k+1$, $n_k=k$; $d(x_n,x_{2n})\to0$ הוא התנאי לזוג $m_k=2k$,
          $n_k=k$. (א) דורש את התנאי לכל הזוגות. $x_n=\sqrt n$ מקיימת את הראשון (טענה 2.1.6) ואינה סדרת קושי. $x_n=\ln\ln(n+1)$
          מקיימת את השני: $x_{2n}-x_n=\ln\frac{\ln(2n+1)}{\ln(n+1)}$, והמנה שואפת ל-1, כי
          $\ln(2n+1)-\ln(n+1)=\ln\frac{2n+1}{n+1}<\ln2$ בעוד $\ln(n+1)\to\infty$; אבל $x_n\to\infty$, ולכן היא אינה חסומה ואינה סדרת
          קושי (טענה 2.1.5).
      - kind: check
        text: >-
          מספרית: $\ln\ln(2n+1)-\ln\ln(n+1)$ שווה בערך $0.24$ ב-$n=10$, $0.096$ ב-$n=1000$ ו-$0.049$ ב-$n=10^6$: יורד, לאט. ובזוג
          $m_k=k^2$, $n_k=k$ אותה סדרה נותנת $\ln\frac{\ln(k^2+1)}{\ln(k+1)}\to\ln2$, ולא ל-0: לפי (א), זו עדות נוספת שהיא אינה סדרת
          קושי.
      - kind: result
        text: >-
          תנאי קושי שקול לכך ש-$d(x_{m_k},x_{n_k})\to0$ לכל שתי סדרות אינדקסים עולות; בדיקה של זוג אחד, כמו $(k+1,k)$ או $(2k,k)$,
          אינה מספיקה.

  - id: W-2.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-2.1-3]
    prompt: >-
      תהי $\varphi:\mathbb{R}\to\mathbb{R}$ רציפה ועולה ממש, ו-$d_\varphi(x,y)=|\varphi(x)-\varphi(y)|$.

      (א) הוכיחו ש-$d_\varphi$ מטריקה על $\mathbb{R}$.

      (ב) הוכיחו: $(\mathbb{R},d_\varphi)$ שלם אם ורק אם $\varphi$ אינה חסומה מלעיל ואינה חסומה מלרע.

      (ג) הכריעו אם $(\mathbb{R},d_\varphi)$ שלם עבור $\varphi(x)=x^3$, $\varphi(x)=e^x$, $\varphi(x)=\arctan x$ ו-$\varphi(x)=x+\arctan x$.
    answer: >-
      (ב) לא חסומה משני הצדדים $\iff\varphi(\mathbb{R})=\mathbb{R}$ (ערך הביניים), ואז גבול של $\varphi(x_n)$ הוא $\varphi(a)$. אם
      $\varphi$ חסומה מלעיל, $x_n=n$ סדרת קושי בלי גבול. (ג) $x^3$ ו-$x+\arctan x$: שלם; $e^x$ ו-$\arctan x$: לא.
    solution:
      - kind: idea
        text: >-
          $\varphi$ מעבירה את $(\mathbb{R},d_\varphi)$, עם כל המרחקים, אל הקבוצה $\varphi(\mathbb{R})$ עם המרחק הרגיל. השאלה היא אם
          $\varphi(\mathbb{R})$ היא כל $\mathbb{R}$, או קטע שחסר לו קצה, כמו $(-\frac\pi2,\frac\pi2)$ בטענה 2.1.15.
      - kind: step
        text: >-
          (א) $\varphi$ עולה ממש, ולכן חד-חד-ערכית; לפי טענה 1.1.13(ב) $d_\varphi$ מטריקה.
      - kind: step
        text: >-
          (ב, $\Leftarrow$) נניח ש-$\varphi$ אינה חסומה מלעיל ומלרע, ויהי $c\in\mathbb{R}$: יש $a,b$ עם $\varphi(a)<c<\varphi(b)$, ולפי
          משפט ערך הביניים (אינפי 1) יש $t$ עם $\varphi(t)=c$. לכן $\varphi(\mathbb{R})=\mathbb{R}$.
      - kind: step
        text: >-
          תהי $(x_n)$ סדרת קושי ב-$d_\varphi$. אז $(\varphi(x_n))$ סדרת קושי ב-$\mathbb{R}$ (אותם מספרים), ולפי משפט 2.1.10
          $\varphi(x_n)\to L$. לפי הצעד הקודם $L=\varphi(a)$ עבור $a\in\mathbb{R}$, ו-$d_\varphi(x_n,a)=|\varphi(x_n)-L|\to0$.
      - kind: step
        text: >-
          (ב, $\Rightarrow$) נניח ש-$\varphi$ חסומה מלעיל. $(\varphi(n))$ עולה וחסומה, ולכן מתכנסת ב-$\mathbb{R}$ (אינפי 1) ל-$L$,
          ולפי טענה 2.1.4 היא סדרת קושי: $x_n=n$ סדרת קושי ב-$d_\varphi$. אילו $d_\varphi(n,a)\to0$, אז $\varphi(n)\to\varphi(a)$ ו-$L=\varphi(a)$
          (משפט 1.5.2). אבל לכל $n\ge a+1$, $\varphi(n)\ge\varphi(a+1)$, ולכן $L\ge\varphi(a+1)>\varphi(a)$, סתירה. אם $\varphi$ חסומה
          מלרע, אותו טיעון עם $x_n=-n$.
      - kind: step
        text: >-
          (ג) $x^3$ ו-$x+\arctan x$ רציפות, עולות ממש ואינן חסומות משני הצדדים ($|x+\arctan x|\ge|x|-\frac\pi2$): שלם. $e^x>0$ חסומה
          מלרע: לא שלם ($x_n=-n$). $\arctan$ חסומה: לא שלם (טענה 2.1.15).
      - kind: check
        text: >-
          ב-$e^x$: $d_\varphi(-n,-m)=|e^{-n}-e^{-m}|<e^{-\min(m,n)}$, קטן כרצוננו, והגבול היה צריך להיות נקודה שבה $e^a=0$. וכל המטריקות
          כאן שקולות טופולוגית ל-$|x-y|$ (ההפכית של פונקציה רציפה ועולה ממש על קטע רציפה, אינפי 1), כך שהשאלה "שלם או לא" נקבעת
          כאן רק על ידי הקצוות של $\varphi(\mathbb{R})$.
      - kind: result
        text: >-
          $(\mathbb{R},d_\varphi)$ שלם בדיוק כש-$\varphi(\mathbb{R})=\mathbb{R}$. בפרט: $x^3$ ו-$x+\arctan x$ נותנות מרחב שלם, ו-$e^x$
          ו-$\arctan x$ לא.

challenge:
  - id: W-2.1-c1
    stars: 1
    objectives: [OBJ-2.1-1, OBJ-2.1-2, OBJ-2.1-3]
    prompt: >-
      הוכיחו שמרחב מטרי $(X,d)$ שלם אם ורק אם כל סדרה $(x_n)$ ב-$X$ שמקיימת $\sum_{k=1}^\infty d(x_k,x_{k+1})<\infty$ מתכנסת ב-$X$.
    answer: >-
      ($\Rightarrow$) למה 2.1.7. ($\Leftarrow$) לסדרת קושי בוחרים תת-סדרה עם $d(x_{n_k},x_{n_{k+1}})<2^{-k}$; היא מתכנסת לפי ההנחה,
      ולפי טענה 2.1.8 הסדרה כולה מתכנסת.
    solution:
      - kind: idea
        text: >-
          כיוון אחד הוא למה 2.1.7. בכיוון השני, סדרת קושי כללית אולי אינה בעלת צעדים סכימים, אבל יש לה תת-סדרה "מהירה" שהצעדים שלה
          קטנים מ-$2^{-k}$; ההנחה מטפלת בתת-סדרה, וטענה 2.1.8 בכל השאר.
      - kind: step
        text: >-
          ($\Rightarrow$) נניח ש-$X$ שלם ו-$\sum d(x_k,x_{k+1})<\infty$. לפי למה 2.1.7 עם $c_k=d(x_k,x_{k+1})$, $(x_n)$ סדרת קושי, ולפי
          הגדרה 2.1.9 היא מתכנסת ב-$X$.
      - kind: step
        text: >-
          ($\Leftarrow$) תהי $(x_n)$ סדרת קושי. לכל $k\in\mathbb{N}$, לפי הגדרה 2.1.1 עם $\varepsilon=2^{-k}$, יש $N$ עם
          $d(x_m,x_n)<2^{-k}$ לכל $m,n>N$; יהי $N_k$ הקטן ביותר כזה (כך כל $N_k$ מוגדר במפורש, בלי לבחור). נגדיר $n_k=\max(N_1,\dots,N_k)+k$.
      - kind: step
        text: >-
          $n_{k+1}\ge\max(N_1,\dots,N_k)+k+1>n_k$, ולכן $(x_{n_k})$ תת-סדרה. בנוסף $n_k\ge N_k+k>N_k$, ו-$n_{k+1}>n_k>N_k$.
          לפי הבחירה של $N_k$, $d(x_{n_k},x_{n_{k+1}})<2^{-k}$.
      - kind: step
        text: >-
          $\sum_k d(x_{n_k},x_{n_{k+1}})<\sum_k2^{-k}=1<\infty$, ולפי ההנחה הסדרה $y_k=x_{n_k}$ מתכנסת ל-$p\in X$. $(x_n)$ סדרת קושי עם
          תת-סדרה ששואפת ל-$p$, ולפי טענה 2.1.8 $x_n\to p$. לכן $X$ שלם.
      - kind: check
        text: >-
          אי אפשר להחליש את ההנחה ל"$d(x_k,x_{k+1})\to0$": ב-$\mathbb{R}$, שהוא שלם, $H_n$ מקיימת אותה ואינה מתכנסת (טענה 2.1.6).
          ודוגמה לבנייה: ב-$x_n=\frac1n$, $N_k=2^k-1$, ולכן $n_k=2^k-1+k$, והצעד $\frac1{n_k}-\frac1{n_{k+1}}$ ב-$k=3$ הוא
          $\frac1{10}-\frac1{19}\approx0.047<\frac18$.
      - kind: result
        text: >-
          מרחב שלם אם ורק אם כל סדרה עם צעדים סכימים מתכנסת בו. זו הגרסה המטרית של משפט 2.4.5: במרחב נורמי, שלמות שקולה לכך
          שכל טור שמתכנס בהחלט מתכנס.
    source:
      name: 'B. S. Thomson, J. B. Bruckner, A. M. Bruckner, Elementary Real Analysis, 2nd ed.'
      year: 2008
      problem: 'Exercise 13.8.7'
      url: 'https://www.classicalrealanalysis.info/com/documents/TBB-AllChapters-Portrait.pdf'
      verified: '2026-11-10'
