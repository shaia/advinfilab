      name: 'B. S. Thomson, J. B. Bruckner, A. M. Bruckner, Elementary Real Analysis, 2nd ed.'
      year: 2008
      problem: 'Exercise 13.15.12'
      url: 'https://www.classicalrealanalysis.info/com/documents/TBB-AllChapters-Portrait.pdf'
