  - id: W-2.1-c2
    stars: 1
    objectives: [OBJ-2.1-3]
    prompt: >-
      יהי $X=(0,1]$, $d(x,y)=|x-y|$, ו-$e(x,y)=|x-y|+\left|\frac1x-\frac1y\right|$.

      (א) הוכיחו ש-$e$ מטריקה על $X$.

      (ב) הוכיחו שסדרה $(x_k)$ ב-$X$ מתכנסת ל-$x\in X$ ב-$(X,e)$ אם ורק אם היא מתכנסת ל-$x$ ב-$(X,d)$. הסיקו של-$d$ ול-$e$ אותן
      קבוצות פתוחות, ושהזהות $(X,d)\to(X,e)$ היא הומיאומורפיזם.

      (ג) הוכיחו ש-$(X,e)$ שלם.

      (ד) $(X,d)$ אינו שלם. הסבירו איך זה מתיישב עם (ב) ו-(ג).
    answer: >-
      (ב) $e\ge d$, ו-$\frac1x$ רציפה ב-$x>0$; טענה 1.7.6א. (ג) בסדרת קושי של $e$ גם $(\frac1{x_k})$ סדרת קושי ולכן חסומה, כך
      שהגבול ב-$\mathbb{R}$ חיובי. (ד) $\frac1k$ סדרת קושי ב-$d$ ואינה סדרת קושי ב-$e$.
    solution:
      - kind: idea
        text: >-
          $e$ מוסיפה ל-$d$ את המרחק בין ההופכיים, ו-$\frac1x$ מתפוצצת ליד 0. לכן סדרה שמתקרבת ל-0, הנקודה החסרה, אינה סדרת קושי
          ב-$e$, וסדרות שמתכנסות לנקודה של המרחב לא מרגישות את התוספת.
      - kind: step
        text: >-
          (א) $e=d+\rho_1$ עם $\rho_1(x,y)=\left|\frac1x-\frac1y\right|$, מטריקה לפי טענה 1.1.13(ב) ($\frac1x$ חד-חד-ערכית על $X$).
          סכום של שתי מטריקות הוא מטריקה: אי-שליליות, סימטריה ואי-שוויון המשולש עוברים בסכום, ו-$e(x,y)=0$ גורר $d(x,y)=0$.
      - kind: step
        text: >-
          (ב) אם $e(x_k,x)\to0$ אז $d(x_k,x)\le e(x_k,x)\to0$. להפך, אם $x_k\to x$ ב-$d$ עם $x\in(0,1]$, אז, כי $\frac1t$ רציפה
          ב-$x>0$ (אינפי 1), $\frac1{x_k}\to\frac1x$, ו-$e(x_k,x)=|x_k-x|+\left|\frac1{x_k}-\frac1x\right|\to0$. לפי טענה 1.7.6א
          ((ג)$\Rightarrow$(א),(ב)) יש להן אותן קבוצות פתוחות, והזהות הומיאומורפיזם.
      - kind: step
        text: >-
          (ג) תהי $(x_k)$ סדרת קושי ב-$e$. כי $d\le e$ ו-$\rho_1\le e$, לפי טענה 2.1.12(א) גם $(x_k)$ וגם $\left(\frac1{x_k}\right)$
          סדרות קושי ב-$\mathbb{R}$. לפי משפט 2.1.10 $x_k\to x\in\mathbb{R}$, ולפי טענה 2.1.5 הסדרה
          $\left(\frac1{x_k}\right)$ חסומה: יש $a\in\mathbb{R}$ ו-$R>0$ עם $\frac1{x_k}\in B(a,R)=(a-R,a+R)$ לכל $k$. נסמן $M=a+R$;
          אז $0<\frac1{x_k}<M$ (בפרט $M>0$), כלומר $x_k>\frac1M$, לכל $k$.
      - kind: step
        text: >-
          מ-$\frac1M\le x_k\le1$ ואי-שוויון חלש בגבול: $\frac1M\le x\le1$, ולכן $x\in X$. $x_k\to x$ ב-$d$, ולפי (ב) גם ב-$e$. לכן
          $(X,e)$ שלם.
      - kind: step
        text: >-
          (ד) $\frac1k$ סדרת קושי ב-$(X,d)$ בלי גבול ב-$X$ (שלבים 1–2 בהוכחת טענה 2.1.14). ב-$e$ היא אינה סדרת קושי:
          $e\left(\frac1k,\frac1{k+1}\right)\ge|k-(k+1)|=1$, וזו השלילה של טענה 2.1.6(א). אין סתירה: (ב) אומר של-$d$ ול-$e$ אותן
          סדרות **מתכנסות**, לא אותן סדרות **קושי**, ושלמות היא תכונה של סדרות קושי.
      - kind: check
        text: >-
          על הניסוח: בספר המרחב הוא $(0,1)$, ושם (ג) אינו נכון: $x_k=1-\frac1{k+1}$ היא סדרת קושי ב-$e$ (גם $x_k$ וגם
          $\frac1{x_k}=1+\frac1k$ מתכנסות ב-$\mathbb{R}$), והגבול היחיד האפשרי הוא $1\notin(0,1)$. לכן התרגיל כאן על $(0,1]$, שבו
          הקצה הימני שייך למרחב. ($(0,1)$ עם $|x-y|+\left|\frac1x-\frac1y\right|+\left|\frac1{1-x}-\frac1{1-y}\right|$ כן שלם, באותה
          הוכחה.)
      - kind: result
        text: >-
          $d$ ו-$e$ שקולות טופולוגית, $(X,e)$ שלם ו-$(X,d)$ אינו שלם. זה ההפך של טענה 2.1.15: שם מטריקה שקולה קלקלה מרחב שלם, וכאן
          מטריקה שקולה מתקנת מרחב לא שלם.
