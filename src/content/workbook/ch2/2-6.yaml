# Workbook of lesson 2.6 — the completion of a metric space.
# Objectives (src/course.ts):
#   OBJ-2.6-1  completion = isometric embedding onto a dense subset of a complete space; R completes Q
#   OBJ-2.6-2  the construction from classes of Cauchy sequences; the metric is well defined
#   OBJ-2.6-3  uniqueness up to isometry; inside a complete space the completion is the closure
# Numbers recomputed with npx tsx (sqrt(2) - 1/3 = 1.08088..., x_3 = 0.333, y_3 = 0, a_3 = 1.41,
