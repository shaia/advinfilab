  - id: W-2.6-c2
    stars: 1
    objectives: [OBJ-2.6-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי ו-$\mathcal C$ קבוצת סדרות הקושי שלו. ל-$(p_n),(q_n)\in\mathcal C$ נגדיר את הסדרה
      המשולבת $(r_n)$: $r_n=p_{n/2}$ ל-$n$ זוגי ו-$r_n=q_{(n+1)/2}$ ל-$n$ אי-זוגי (כלומר $q_1,p_1,q_2,p_2,\dots$),
      ונכתוב $(p_n)\approx(q_n)$ אם $(r_n)$ סדרת קושי.

      (א) הוכיחו ש-$(p_n)\approx(q_n)$ אם ורק אם $d(p_n,q_n)\to0$.

      (ב) הסיקו ש-$\approx$ הוא יחס שקילות על $\mathcal C$, ושמחלקות השקילות שלו הן הנקודות של $\widehat X$.
    answer: >-
      (א) ($\Rightarrow$) $d(p_k,q_k)=d(r_{2k},r_{2k-1})$ עם שני אינדקסים גדולים. ($\Leftarrow$) לשני איברים של $(r_n)$
      מאותה סדרה תנאי קושי שלה, ולאיברים משתי סדרות $d(p_k,q_l)\le d(p_k,p_l)+d(p_l,q_l)$. (ב) $\approx$ הוא $\sim$ של
      טענה 2.6.5.
    solution:
      - kind: idea
        text: >-
          הסדרה המשולבת עוברת הלוך ושוב בין $(p_n)$ ל-$(q_n)$. היא סדרת קושי בדיוק כשהקפיצות בין שתי הסדרות קטנות,
          כלומר כשהן מתקרבות זו לזו: זו השקילות של השיעור, בניסוח שלא מזכיר אף מספר מלבד מרחקים בתוך סדרה אחת.
      - kind: step
        text: >-
          (א, $\Rightarrow$) יהי $\varepsilon>0$, ו-$N$ עם $d(r_m,r_n)<\varepsilon$ לכל $m,n>N$. לכל $k>N$ האינדקסים $2k-1\ge k$
          ו-$2k$ גדולים מ-$N$, ולכן $d(p_k,q_k)=d(r_{2k},r_{2k-1})<\varepsilon$. לכן $d(p_k,q_k)\to0$.
      - kind: step
        text: >-
          (א, $\Leftarrow$) יהי $\varepsilon>0$. יש $K_1$ עם $d(p_k,p_l)<\frac\varepsilon2$ ל-$k,l>K_1$; $K_2$ עם
          $d(q_k,q_l)<\frac\varepsilon2$ ל-$k,l>K_2$; ו-$K_3$ עם $d(p_k,q_k)<\frac\varepsilon2$ ל-$k>K_3$. יהי $K=\max(K_1,K_2,K_3)$.
      - kind: step
        text: >-
          ל-$m>2K$, $r_m$ הוא $p_k$ עם $k=\frac m2>K$ או $q_k$ עם $k=\frac{m+1}2>K$. יהיו $m,n>2K$. אם $r_m,r_n$ שניהם
          מ-$(p)$ או שניהם מ-$(q)$, המרחק קטן מ-$\frac\varepsilon2$. אם $r_m=p_k$ ו-$r_n=q_l$, אז לפי (M3)
          $d(p_k,q_l)\le d(p_k,p_l)+d(p_l,q_l)<\frac\varepsilon2+\frac\varepsilon2=\varepsilon$. לכן $(r_n)$ סדרת קושי.
      - kind: step
        text: >-
          (ב) לפי (א), $\approx$ ו-$\sim$ של טענה 2.6.5 הם אותו יחס על $\mathcal C$. לפי טענה 2.6.5(א) הוא יחס שקילות,
          ו-$\widehat X$ של משפט 2.6.8 הוא בדיוק $\mathcal C/{\approx}$.
      - kind: check
        text: >-
          ב-$\mathbb{Q}$, $p_n=a_n$ (הקירובים העשרוניים של $\sqrt2$) ו-$q_n=y_n$ (סדרת ניוטון): הסדרה המשולבת
          $2,\ 1,\ 1.5,\ 1.4,\ 1.41\overline6,\ 1.41,\dots$ מתקרבת ל-$\sqrt2$ משני הצדדים, ולכן היא סדרת קושי, כצפוי
          מ-$(a_n)\sim(y_n)$. עם $p_n=0$, $q_n=1$ היא $1,0,1,0,\dots$, שאינה סדרת קושי.
      - kind: result
        text: >-
          $(p_n)\approx(q_n)$ אם ורק אם $d(p_n,q_n)\to0$; לכן $\approx$ יחס שקילות, והמחלקות שלו הן נקודות ההשלמה.
