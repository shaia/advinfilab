# Workbook of lesson 2.5 — Cantor's intersection theorem and Baire's theorem.
# Objectives (src/course.ts):
#   OBJ-2.5-1  Cantor's intersection theorem (decreasing nonempty closed sets, diameter -> 0, complete space)
#   OBJ-2.5-2  nowhere dense sets; Baire's category theorem
#   OBJ-2.5-3  a complete metric space without isolated points is uncountable
# Numbers recomputed with npx tsx (diameters of W-01, the balls of W-10 in (N, rho)).
lesson: '2.5'
practice:
  - id: W-2.5-01
    level: basic
    objectives: [OBJ-2.5-1]
    prompt: >-
      במישור נגדיר $F_n=[-\frac1n,\frac1n]\times[0,\frac1{n^2}]$, $n\in\mathbb{N}$.


      (א) חשבו את $\operatorname{diam}F_n$ במטריקות $d_\infty$, $d_1$ ו-$d_2$.


      (ב) הוכיחו שהקבוצות $F_n$ סגורות ויורדות, ומצאו את $\bigcap_nF_n$ בעזרת משפט 2.5.2.
    answer: >-
      (א) $\frac2n$ ב-$d_\infty$, $\frac2n+\frac1{n^2}$ ב-$d_1$, $\sqrt{\frac4{n^2}+\frac1{n^4}}$ ב-$d_2$. (ב) $\bigcap_nF_n=\{(0,0)\}$.
    solution:
      - kind: idea
        text: >-
          לכל שתי נקודות של $F_n$, ההפרש בקואורדינטה הראשונה לכל היותר $\frac2n$ ובשנייה לכל היותר $\frac1{n^2}$, ושני
          החסמים מתקבלים יחד בפינות הנגדיות. אחר כך בודקים את ארבע ההנחות של משפט 2.5.2.
      - kind: computation
        text: >-
          יהיו $x,y\in F_n$. אז $|x_1-y_1|\le\frac2n$ ו-$|x_2-y_2|\le\frac1{n^2}$, ולכן $d_\infty(x,y)\le\max(\frac2n,\frac1{n^2})=\frac2n$
          (כי $\frac1{n^2}\le\frac1n<\frac2n$), $d_1(x,y)\le\frac2n+\frac1{n^2}$ ו-$d_2(x,y)\le\sqrt{\frac4{n^2}+\frac1{n^4}}$. בפינות
          $x=(-\frac1n,0)$ ו-$y=(\frac1n,\frac1{n^2})$ שני ההפרשים מתקבלים בדיוק, ולכן שלושת החסמים הם הקטרים (הגדרה 2.1.2).
      - kind: step
        text: >-
          (ב) סגירות: $F_n=\{x:\ |x_1|\le\frac1n\}\cap\{x:\ x_2\ge0\}\cap\{x:\ x_2\le\frac1{n^2}\}$. הפונקציות $x\mapsto x_1$
          ו-$x\mapsto x_2$ ליפשיציות עם קבוע 1 ביחס ל-$d_\infty$ ($|x_i-y_i|\le d_\infty(x,y)$), ולכן רציפות (טענה 1.6.9), וגם
          $x\mapsto|x_1|$ רציפה. לפי מסקנה 1.6.7(א) שלוש הקבוצות סגורות, ולפי מסקנה 1.3.8(ב) גם החיתוך. לפי טענה 1.4.2א
          הסגור זהה בשלוש המטריקות, ולכן $F_n$ סגורה בכל אחת מהן.
      - kind: step
        text: >-
          הקבוצות יורדות כי $\frac1{n+1}<\frac1n$ ו-$\frac1{(n+1)^2}<\frac1{n^2}$; $(0,0)\in F_n$ לכל $n$; הקוטר שואף ל-0
          בכל אחת מהמטריקות; ו-$\mathbb{R}^2$ שלם (משפט 2.1.11).
      - kind: theorem
        text: >-
          משפט 2.5.2: במרחב שלם, לסדרה יורדת של קבוצות סגורות לא ריקות עם $\operatorname{diam}F_n\to0$ יש חיתוך של נקודה אחת
          בדיוק.
      - kind: check
        text: >-
          עם $n=2$: הקטרים הם $1$, $1.25$ ו-$\sqrt{1.0625}\approx1.031$, בסדר $d_\infty\le d_2\le d_1$ של למה 1.1.6.
      - kind: result
        text: >-
          $\operatorname{diam}_{d_\infty}F_n=\frac2n$, $\operatorname{diam}_{d_1}F_n=\frac2n+\frac1{n^2}$,
          $\operatorname{diam}_{d_2}F_n=\sqrt{\frac4{n^2}+\frac1{n^4}}$; החיתוך הוא נקודה אחת, ו-$(0,0)$ בכולן, ולכן
          $\bigcap_nF_n=\{(0,0)\}$.

  - id: W-2.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.5-2]
    prompt: >-
      קבעו, עם הוכחה, אילו מהקבוצות הבאות דלילות.


      (א) $A=\{m+\frac1n:\ m\in\mathbb{Z},\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$.


      (ב) $E=\big(\mathbb{Q}\cap(0,1)\big)\cup\{2\}$ ב-$\mathbb{R}$.


      (ג) הקטע $S=[0,1]\times\{0\}$ במישור, עם $d_2$.
    answer: >-
      (א) דלילה: $A$ סגורה ו-$A\subseteq\mathbb{Q}$, ולכן $\overline A=A$ בלי פנים. (ב) לא דלילה: $(0,1)\subseteq\overline E$, אף
      של-$E$ עצמה אין פנים. (ג) דלילה: תת-קבוצה של הישר $x_2=0$.
    solution:
      - kind: idea
        text: >-
          לפי ההגדרה (הגדרה 2.5.5) צריך את הסגור, ורק אחריו את הפנים. ב-(א) הסגור נשאר בתוך $\mathbb{Q}$, וב-(ב) הסגור
          מכיל קטע שלם. ב-(ג) משתמשים בכך שתת-קבוצה של דלילה דלילה.
      - kind: step
        text: >-
          (א) קודם, $\mathbb{Z}\subseteq A$: עם $n=1$, $m+\frac11=m+1$, ו-$m+1$ עובר על כל השלמים. נראה ש-$A$ סגורה. יהי
          $x\notin A$; אז $x\notin\mathbb{Z}$, ונסמן $m=\lfloor x\rfloor$, כך ש-$m<x<m+1$. הנקודות של $A$ ב-$[m,m+1]$ הן $m$,
          $m+1$ ו-$m+\frac1n$ עם $n\ge2$. לפי ארכימדס יש $N\ge2$ עם $\frac1N<x-m$. הנקודות
          $m+\frac1n$ עם $n\ge N$ נמצאות ב-$(m,m+\frac1N]$, במרחק לפחות $x-m-\frac1N>0$ מ-$x$; ושאר הנקודות ב-$[m,m+1]$ הן
          מספר סופי של נקודות שונות מ-$x$. לכן יש $r>0$ עם $B(x,r)\subseteq(m,m+1)$ שזר ל-$A$: המשלים פתוח, ו-$A$ סגורה.
      - kind: step
        text: >-
          לפי טענה 1.4.4(ג), $\overline A=A\subseteq\mathbb{Q}$. כל כדור ב-$\mathbb{R}$ מכיל מספר אי-רציונלי
          (טענה 2.5.7(ו)), ולכן אף כדור אינו מוכל ב-$\overline A$: $\big(\overline A\big)^\circ=\emptyset$, ו-$A$ דלילה.
      - kind: step
        text: >-
          (ב) יהי $x\in(0,1)$ ו-$r>0$. $B(x,r)\cap(0,1)$ הוא קטע פתוח לא ריק, ולפי משפט 1.4.15 יש בו רציונלי, שהוא ב-$E$.
          לכן $x\in\overline E$, כלומר $(0,1)\subseteq\overline E$, ו-$(0,1)$ פתוחה; לפי טענה 1.4.2(ב) $(0,1)\subseteq\big(\overline E\big)^\circ\ne\emptyset$.
          $E$ אינה דלילה, אף שאין לה פנים: כל כדור מכיל אי-רציונלי, שאינו ב-$E$.
      - kind: step
        text: >-
          (ג) $S\subseteq\ell=\{x:\ 0\cdot x_1+1\cdot x_2=0\}$, ו-$\ell$ דליל לפי טענה 2.5.7(ד). לפי טענה 2.5.6(ו), $S$ דלילה.
      - kind: check
        text: >-
          (א) ו-(ב) שתיהן קבוצות של רציונליים (ועוד נקודה), אחת דלילה ואחת לא: מה שקובע הוא הסגור. זו בדיוק התפיסה
          השגויה "אין פנים פירושו דלילה".
      - kind: result
        text: >-
          (א) דלילה; (ב) אינה דלילה; (ג) דלילה.

  - id: W-2.5-03
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-3]
    prompt: >-
      לכל אחד מהמרחבים הבאים קבעו אם משפט 2.5.9 חל עליו, והאם הוא בן מנייה.


      (א) $[0,1]\cup[2,3]$ עם $|x-y|$.


      (ב) $K=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$ עם $|x-y|$.


      (ג) $S=\{x\in B(\mathbb{N}):\ x_k\in\{0,1\}\ \forall k\}$, הסדרות של אפסים ואחדים, עם $d_\infty$. (כאן $B(\mathbb{N})$
      הוא מרחב הסדרות הממשיות החסומות, שיעור 2.2, ולא כדור.)
    answer: >-
      (א) המשפט חל: אינו בן מנייה. (ב) לא חל (הנקודות $\frac1n$ מבודדות), ו-$K$ בת מנייה. (ג) לא חל (כל נקודה מבודדת),
      ובכל זאת $S$ אינה בת מנייה.
    solution:
      - kind: idea
        text: >-
          בודקים שתי הנחות: שלמות (סגורה בתוך מרחב שלם) ו"בלי נקודות מבודדות". המשפט מספיק ולא הכרחי: כשהוא לא חל,
          המרחב עדיין יכול להיות לא בן מנייה.
      - kind: step
        text: >-
          (א) $[0,1]$ ו-$[2,3]$ סגורות ב-$\mathbb{R}$ (טענה 1.3.5(א)), והאיחוד סגור (מסקנה 1.3.8(ג)), ולכן שלם (משפט
          2.2.1(א)). ל-$x$ באחד הקטעים $[c,c+1]$ ו-$r>0$, עם $t=\frac12\min(r,1)$: $x+t$ אם $x\le c+\frac12$, אחרת $x-t$,
          נמצאת באותו קטע, שונה מ-$x$, ובמרחק $t<r$. אין נקודות מבודדות, ולפי משפט 2.5.9 המרחב אינו בן מנייה.
      - kind: step
        text: >-
          (ב) המשלים של $K$ הוא $(-\infty,0)\cup(1,\infty)\cup\bigcup_n(\frac1{n+1},\frac1n)$, איחוד של קטעים פתוחים, פתוח לפי
          משפט 1.3.7(ב); לכן $K$ סגורה ב-$\mathbb{R}$, ושלמה (משפט 2.2.1(א)). אבל
          $B(\frac1n,\ \frac1n-\frac1{n+1})\cap K=\{\frac1n\}$, כלומר $\frac1n$ מבודדת, והמשפט לא חל. ו-$K$ בת מנייה: הרשימה
          $0,1,\frac12,\frac13,\dots$.
      - kind: step
        text: >-
          (ג) $S$ סגורה ב-$B(\mathbb{N})$: אם $x^{(m)}\in S$ ו-$x^{(m)}\to x$ ב-$d_\infty$, אז לכל $k$,
          $|x^{(m)}_k-x_k|\le d_\infty(x^{(m)},x)\to0$, ו-$x_k$ הוא גבול של סדרה ב-$\{0,1\}$, ולכן ב-$\{0,1\}$ (קבוצה סופית,
          סגורה ב-$\mathbb{R}$). לפי משפטים 2.2.4 ו-2.2.1(א) $S$ שלמה. אבל לשתי סדרות שונות ב-$S$ יש מקום שבו אחת $0$
          והשנייה $1$, ולכן $d_\infty(x,y)=1$: $B(x,\frac12)\cap S=\{x\}$, וכל נקודה מבודדת. המשפט לא חל.
      - kind: step
        text: >-
          ובכל זאת $S$ אינה בת מנייה (האלכסון של קנטור): $S$ אינסופית (הסדרות $e_k$ שונות זו מזו). תהי
          $x^{(1)},x^{(2)},\dots$ רשימה כלשהי של איברי $S$, ונגדיר $y_k=1-x^{(k)}_k$. אז $y\in S$, ולכל $k$,
          $y_k\ne x^{(k)}_k$, כלומר $y\ne x^{(k)}$: $y$ אינה ברשימה. לכן לאף רשימה אין כל איברי $S$.
      - kind: result
        text: >-
          (א) חל, ולכן אינו בן מנייה. (ב) לא חל, ו-$K$ בת מנייה. (ג) לא חל, ו-$S$ אינה בת מנייה: ההנחה "בלי נקודות מבודדות"
          מספיקה, לא הכרחית.

  - id: W-2.5-04
    level: basic
    objectives: [OBJ-2.5-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שלם, ו-$(x_n)$ סדרה ב-$X$ עם $d(x_n,x_{n+1})\le2^{-n}$ לכל $n$.


      (א) הוכיחו ש-$B[x_{n+1},2^{-n}]\subseteq B[x_n,2^{1-n}]$ לכל $n$.


      (ב) הסיקו בעזרת מסקנה 2.5.4 ש-$(x_n)$ מתכנסת לאיזה $x\in X$, ו-$d(x_n,x)\le2^{1-n}$.
    answer: >-
      (א) אי-שוויון המשולש: $d(y,x_n)\le2^{-n}+2^{-n}$. (ב) החיתוך של הכדורים הוא נקודה $x$, ו-$d(x_n,x)\le2^{1-n}\to0$.
    solution:
      - kind: idea
        text: >-
          הרדיוס $2^{1-n}$ נבחר כך שהוא שווה למרחק לאיבר הבא ועוד הרדיוס הבא: $2^{-n}+2^{-n}$. לכן כל כדור יושב בקודם,
          ומסקנה 2.5.4 נותנת את הגבול, עם החסם על המרחק.
      - kind: step
        text: >-
          (א) תהי $y\in B[x_{n+1},2^{-n}]$. לפי אי-שוויון המשולש,
          $d(y,x_n)\le d(y,x_{n+1})+d(x_{n+1},x_n)\le2^{-n}+2^{-n}=2^{1-n}$, ולכן $y\in B[x_n,2^{1-n}]$.
      - kind: step
        text: >-
          (ב) נסמן $r_n=2^{1-n}>0$. לפי (א), $B[x_{n+1},r_{n+1}]\subseteq B[x_n,r_n]$, ו-$r_n\to0$. $X$ שלם, ולפי מסקנה 2.5.4
          החיתוך הוא נקודה אחת $x$, $x_n\to x$, ו-$d(x_n,x)\le r_n=2^{1-n}$.
      - kind: check
        text: >-
          השוו ללמה 2.1.7 עם $c_n=2^{-n}$: שם $d(x_n,x_m)\le\sum_{k\ge n}2^{-k}=2^{1-n}$, אותו חסם. ב-$X=\mathbb{R}$ עם
          $x_n=\sum_{k=0}^{n-1}2^{-k}=2-2^{1-n}$: $d(x_n,x_{n+1})=2^{-n}$, $x=2$, ו-$d(x_n,2)=2^{1-n}$, כך שהחסם מתקבל בשוויון.
      - kind: result
        text: >-
          הכדורים $B[x_n,2^{1-n}]$ יורדים, ו-$(x_n)$ מתכנסת לנקודה $x$ שבחיתוך שלהם, עם $d(x_n,x)\le2^{1-n}$.

  - id: W-2.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שלם, ו-$A_1\supseteq A_2\supseteq\cdots$ קבוצות לא ריקות (לא בהכרח סגורות) עם
      $\operatorname{diam}A_n\to0$.


      (א) הוכיחו ש-$\bigcap_n\overline{A_n}$ היא נקודה אחת $x$.


      (ב) הוכיחו ש-$\bigcap_nA_n$ היא $\emptyset$ או $\{x\}$, ותנו ב-$\mathbb{R}$ דוגמה לכל אחת משתי האפשרויות.
    answer: >-
      (א) משפט 2.5.2 על הסגורים, עם טענה 2.5.1. (ב) $\bigcap A_n\subseteq\bigcap\overline{A_n}=\{x\}$; $(0,\frac1n]$ נותנת
      $\emptyset$, ו-$[0,\frac1n)$ נותנת $\{0\}$.
    solution:
      - kind: idea
        text: >-
          לוקחים סגור: הוא לא מגדיל את הקוטר (טענה 2.5.1), ושומר על הסדר ועל אי-הריקנות. אז משפט 2.5.2 חל. הקבוצות
          המקוריות קטנות יותר, ולכן החיתוך שלהן לכל היותר הנקודה הזו.
      - kind: step
        text: >-
          (א) $\overline{A_n}$ סגורה (טענה 1.4.4(א)), לא ריקה ($A_n\subseteq\overline{A_n}$), ויורדת: $A_{n+1}\subseteq A_n$
          גורר $\overline{A_{n+1}}\subseteq\overline{A_n}$ (טענה 1.4.4(ד)). לפי טענה 2.5.1, $\operatorname{diam}\overline{A_n}=\operatorname{diam}A_n\to0$.
          $X$ שלם, ולפי משפט 2.5.2 $\bigcap_n\overline{A_n}=\{x\}$.
      - kind: step
        text: >-
          (ב) $A_n\subseteq\overline{A_n}$ לכל $n$, ולכן $\bigcap_nA_n\subseteq\{x\}$: החיתוך ריק או $\{x\}$.
      - kind: step
        text: >-
          דוגמאות ב-$\mathbb{R}$ (שלם, משפט 2.1.10): $A_n=(0,\frac1n]$ יורדות, לא ריקות, קוטרן $\le\frac1n$, והחיתוך ריק
          (הדוגמה (א) אחרי משפט 2.5.2); כאן $x=0$. $A_n=[0,\frac1n)$: $0$ בכולן, ולכן החיתוך $\{0\}$, אף ש-$A_n$ אינן סגורות.
      - kind: result
        text: >-
          $\bigcap_n\overline{A_n}=\{x\}$ תמיד, ו-$\bigcap_nA_n\in\{\emptyset,\{x\}\}$: הסגירות במשפט 2.5.2 נחוצה כדי
          להבטיח את הנקודה, לא כדי להבטיח שיש לכל היותר אחת.

  - id: W-2.5-06
    level: mid
    objectives: [OBJ-2.5-2]
    prompt: >-
      ב-$(C[0,1],d_\infty)$ תהי $M$ קבוצת הפונקציות הלא יורדות: $f(s)\le f(t)$ לכל $0\le s<t\le1$. הוכיחו ש-$M$ דלילה.
    answer: >-
      $M$ סגורה (אי-שוויון חלש עובר לגבול נקודתי), ואין לה פנים: מחסירים מ-$f\in M$ "אוהל" צר בגובה $\frac r2$ ליד $0$.
    solution:
      - kind: idea
        text: >-
          לפי טענה 2.5.6(ה), לקבוצה סגורה מספיק להראות שאין פנים. ליד כל פונקציה לא יורדת יש פונקציה שיורדת איפשהו:
          מחסירים בליטה צרה. הבליטה צריכה להיות צרה מספיק כדי ש-$f$ לא תספיק לעלות לאורכה, ובשביל זה משתמשים
          ברציפות במידה שווה של $f$.
      - kind: step
        text: >-
          (סגורה) תהי $f_k\in M$ עם $f_k\to f$ ב-$d_\infty$. לכל $t$, $|f_k(t)-f(t)|\le d_\infty(f_k,f)\to0$. ל-$s<t$:
          $f_k(s)\le f_k(t)$ לכל $k$, ואי-שוויון חלש עובר לגבול: $f(s)\le f(t)$. לכן $f\in M$, ולפי מסקנה 1.5.8(ב) $M$ סגורה.
      - kind: step
        text: >-
          (בחירת רוחב) יהיו $f\in M$ ו-$r>0$. $f$ רציפה במידה שווה על $[0,1]$ (רציפות במידה שווה על קטע סגור, אינפי 1), ולכן יש
          $\delta'>0$ כך ש-$|f(s)-f(t)|<\frac r4$ כש-$|s-t|<\delta'$. נגדיר $\delta=\min(\frac{\delta'}2,1)\in(0,1]$; אז
          $|s-t|\le\delta$ גורר $|s-t|<\delta'$, ולכן $|f(s)-f(t)|<\frac r4$.
      - kind: step
        text: >-
          (האוהל) נגדיר $T(x)=\max\big(0,\ 1-|\frac{2x}\delta-1|\big)$: רציפה, $0\le T\le1$, $T(0)=0$, $T(\frac\delta2)=1$.
          ונגדיר $g=f-\frac r2T\in C[0,1]$. אז $d_\infty(f,g)=\frac r2\max T=\frac r2<r$.
      - kind: step
        text: >-
          ($g\notin M$) $g(0)=f(0)$, ו-$g(\frac\delta2)=f(\frac\delta2)-\frac r2<f(0)+\frac r4-\frac r2<f(0)=g(0)$. לכן
          $0<\frac\delta2$ אבל $g(\frac\delta2)<g(0)$: $g$ אינה לא יורדת.
      - kind: step
        text: >-
          לכל $f\in M$ ולכל $r>0$ הכדור $B(f,r)$ אינו מוכל ב-$M$, ולכן $M^\circ=\emptyset$. $M$ סגורה, ולפי טענה 2.5.6(ה)
          היא דלילה.
      - kind: check
        text: >-
          עם $f(x)=x$ ו-$r=0.1$: $|f(s)-f(t)|=|s-t|<0.025$ כש-$|s-t|<\delta'=0.025$; לפי המתכון
          $\delta=\min(0.0125,1)=0.0125$, ו-$g(\frac\delta2)=g(0.00625)=0.00625-0.05=-0.04375<0=g(0)$.
      - kind: result
        text: >-
          הפונקציות הלא יורדות הן קבוצה סגורה בלי פנים, ולכן דלילה ב-$(C[0,1],d_\infty)$.

  - id: W-2.5-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.5-2]
    prompt: >-
      הוכיחו או הפריכו.


      (א) ב-$\mathbb{R}$, לאיחוד של סדרה של קבוצות סגורות בלי פנים אין פנים.


      (ב) במרחב $\mathbb{Q}$ (עם $|x-y|$), לאיחוד של סדרה של קבוצות דלילות ב-$\mathbb{Q}$ אין פנים ב-$\mathbb{Q}$.


      (ג) במרחב שלם, חיתוך של סדרה של קבוצות צפופות צפוף.


      (ד) במרחב שלם ולא ריק, אם $X=\bigcup_nF_n$ עם $F_n$ סגורות, לאחת מהן יש כדור שלם.
    answer: >-
      (א) נכון (בייר). (ב) לא נכון: $\mathbb{Q}=\bigcup\{q_n\}$. (ג) לא נכון: $\mathbb{Q}\cap(\mathbb{R}\setminus\mathbb{Q})=\emptyset$.
      (ד) נכון (משפט 2.5.8(ג)).
    solution:
      - kind: idea
        text: >-
          לכל סעיף שואלים: האם המרחב שלם, והאם הקבוצות פתוחות (או, במשלים, סגורות). אלה ההנחות של משפט 2.5.8.
      - kind: step
        text: >-
          (א) סגורה בלי פנים היא דלילה (טענה 2.5.6(ה)), ו-$\mathbb{R}$ שלם (משפט 2.1.10). לפי משפט 2.5.8(ב) לאיחוד אין פנים.
          נכון.
      - kind: step
        text: >-
          (ב) עם רשימה $q_1,q_2,\dots$ של $\mathbb{Q}$, כל $\{q_n\}$ דליל ב-$\mathbb{Q}$ (אין ב-$\mathbb{Q}$ נקודות מבודדות; טענה
          2.5.7(א)), והאיחוד הוא $\mathbb{Q}$, שהוא הפנים של עצמו. לא נכון; המשפט לא חל כי $\mathbb{Q}$ אינו שלם.
      - kind: step
        text: >-
          (ג) ב-$\mathbb{R}$, $\mathbb{Q}$ ו-$\mathbb{R}\setminus\mathbb{Q}$ צפופות (טענה 2.5.7(ו)) וחיתוכן ריק. לא נכון; משפט
          2.5.8(א) דורש קבוצות **פתוחות** וצפופות.
      - kind: step
        text: >-
          (ד) זה משפט 2.5.8(ג): לאחת מהקבוצות יש נקודה פנימית $x$, כלומר כדור $B(x,r)\subseteq F_n$. נכון.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון; (ג) לא נכון; (ד) נכון.

  - id: W-2.5-08
    level: exam
    objectives: [OBJ-2.5-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שלם, לא ריק ובן מנייה (או סופי).


      (א) הוכיחו שבכל כדור $B(x,r)$ יש נקודה מבודדת של $X$. כלומר: הנקודות המבודדות של $X$ צפופות ב-$X$.


      (ב) בדקו את (א) במרחב $K=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$ עם $|x-y|$.
    answer: >-
      (א) אחרת הכדור מכוסה ביחידונים דלילים, ולפי משפט 2.5.8(ב) אין לו פנים. (ב) הנקודות המבודדות הן $\frac1n$, וכל
      כדור סביב $0$ מכיל אחת מהן.
    solution:
      - kind: idea
        text: >-
          משפט 2.5.9 אומר שמרחב כזה אינו יכול להיות **בלי** נקודות מבודדות. כאן מפעילים את אותו טיעון בתוך כדור אחד: אם
          בכדור אין נקודות מבודדות, הנקודות שבו הן איחוד בן מנייה של דלילות שמכסה קבוצה פתוחה.
      - kind: step
        text: >-
          (א) יהי $B=B(x,r)$, ונניח בשלילה שאף נקודה של $B$ אינה מבודדת ב-$X$. $X$ לכל היותר בן מנייה, ולכן גם $B$
          (תת-קבוצה), ו-$B\ne\emptyset$ ($x\in B$): יש רשימה $b_1,b_2,\dots$ של נקודות $B$, ו-$B=\bigcup_n\{b_n\}$.
      - kind: step
        text: >-
          כל $b_n$ אינה מבודדת, ולפי טענה 2.5.7(א) $\{b_n\}$ דליל. $X$ שלם ולא ריק, ולפי משפט 2.5.8(ב) ל-$\bigcup_n\{b_n\}=B$
          אין נקודות פנימיות.
      - kind: step
        text: >-
          אבל $B$ פתוח (משפט 1.3.3) ולא ריק, ולכן $B^\circ=B\ne\emptyset$ (טענה 1.4.2(ג)). סתירה. לכן ב-$B$ יש נקודה מבודדת,
          ולפי טענה 1.4.14(ג) הנקודות המבודדות צפופות.
      - kind: step
        text: >-
          (ב) $K$ סגורה ב-$\mathbb{R}$ ולכן שלמה (משפט 2.2.1(א)), ובת מנייה. $\frac1n$ מבודדת:
          $B(\frac1n,\frac1n-\frac1{n+1})\cap K=\{\frac1n\}$. $0$ אינה מבודדת: כל $B(0,r)$ מכיל $\frac1n$ עם $n>\frac1r$. כל כדור
          סביב נקודה של $K$ מכיל נקודה מבודדת: סביב $\frac1n$ היא עצמה, וסביב $0$ נקודה $\frac1n$.
      - kind: result
        text: >-
          במרחב שלם ובן מנייה (או סופי) הנקודות המבודדות צפופות; בפרט יש בו נקודה מבודדת. ב-$K$ הן $\frac1n$, והן צפופות
          ב-$K$.

  - id: W-2.5-09
    level: exam
    objectives: [OBJ-2.5-2, OBJ-2.5-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי שלם ולא ריק בלי נקודות מבודדות, ויהיו $U_1,U_2,\dots$ קבוצות פתוחות וצפופות ב-$X$.


      (א) הוכיחו ש-$G=\bigcap_nU_n$ אינה בת מנייה (וגם אינה סופית).


      (ב) הסיקו מחדש ש-$\mathbb{R}\setminus\mathbb{Q}$ אינה בת מנייה.
    answer: >-
      (א) אילו $G=\{g_1,g_2,\dots\}$, החיתוך של $U_n$ ושל $X\setminus\{g_k\}$ היה ריק, בסתירה לבייר. (ב)
      $\mathbb{R}\setminus\mathbb{Q}=\bigcap_k(\mathbb{R}\setminus\{q_k\})$.
    solution:
      - kind: idea
        text: >-
          משפט בייר נותן ש-$G$ צפופה ולא ריקה. אם $G$ הייתה בת מנייה, אפשר היה "להוציא" את הנקודות שלה אחת אחת עם עוד
          סדרה של פתוחות צפופות, ולקבל חיתוך ריק.
      - kind: step
        text: >-
          (א) נניח בשלילה ש-$G$ לכל היותר בת מנייה. לפי משפט 2.5.8(א) $G$ צפופה, ולכן לא ריקה, ויש רשימה $g_1,g_2,\dots$
          של איבריה.
      - kind: step
        text: >-
          לכל $k$, $V_k=X\setminus\{g_k\}$ פתוחה ($\{g_k\}$ סגורה, טענה 1.3.5(ב)), ו-$\{g_k\}$ דליל כי $g_k$ אינה מבודדת
          (טענה 2.5.7(א)), ולכן $V_k$ צפופה (טענה 2.5.6(ב)).
      - kind: step
        text: >-
          נסדר בסדרה אחת $W_{2n-1}=U_n$, $W_{2n}=V_n$: פתוחות וצפופות. לפי משפט 2.5.8(א), $\bigcap_mW_m\ne\emptyset$. אבל
          $\bigcap_mW_m=G\cap\bigcap_kV_k=G\setminus\{g_1,g_2,\dots\}=\emptyset$. סתירה.
      - kind: step
        text: >-
          (ב) עם רשימה $q_1,q_2,\dots$ של $\mathbb{Q}$: $U_k=\mathbb{R}\setminus\{q_k\}$ פתוחה וצפופה ב-$\mathbb{R}$ (כמו בצעד
          הקודם, $\mathbb{R}$ בלי נקודות מבודדות), ו-$\bigcap_kU_k=\mathbb{R}\setminus\mathbb{Q}$. $\mathbb{R}$ שלם (משפט
          2.1.10), ולפי (א) $\mathbb{R}\setminus\mathbb{Q}$ אינה בת מנייה.
      - kind: check
        text: >-
          (ב) לא משתמש בכך ש-$\mathbb{R}$ אינו בן מנייה, בניגוד להוכחה במסקנה 2.5.9א. ובלי "בלי נקודות מבודדות" (א) נכשל:
          ב-$\mathbb{Z}$, $U_1=\mathbb{Z}$ פתוחה וצפופה, וחיתוך כל ה-$U_n=\mathbb{Z}$ הוא $\mathbb{Z}$, בן מנייה.
      - kind: result
        text: >-
          במרחב שלם בלי נקודות מבודדות, חיתוך בן מנייה של פתוחות צפופות אינו בן מנייה; בפרט $\mathbb{R}\setminus\mathbb{Q}$
          אינה בת מנייה.

  - id: W-2.5-10
    level: exam
    objectives: [OBJ-2.5-1]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי, $V\ne\{0\}$.


      (א) הוכיחו: אם $r,s>0$ ו-$B[y,s]\subseteq B[x,r]$, אז $\|x-y\|+s\le r$.


      (ב) נניח ש-$V$ מרחב בנך (הגדרה 2.4.1), ו-$B[x_{n+1},r_{n+1}]\subseteq B[x_n,r_n]$ לכל $n$, עם $r_n>0$, **בלי** הנחה
      על $\lim r_n$. הוכיחו ש-$\bigcap_nB[x_n,r_n]\ne\emptyset$.


      (ג) הסבירו למה זה לא סותר את טענה 2.5.4א, ובדקו איפה (א) נכשל במרחב $(\mathbb{N},\rho)$ שם.
    answer: >-
      (א) הנקודה $y+su$, עם $u$ וקטור יחידה בכיוון $y-x$, מרוחקת $\|x-y\|+s$ מ-$x$. (ב) $\|x_n-x_m\|\le r_n-r_m$, ולכן
      $(x_n)$ קושי וגבולה בכל הכדורים. (ג) $(\mathbb{N},\rho)$ אינו מרחב נורמי: $B_\rho[2,\frac32]\subseteq B_\rho[1,2]$ אבל
      $\rho(1,2)+\frac32=\frac72>2$.
    solution:
      - kind: idea
        text: >-
          במרחב נורמי כדור מכיל נקודות בכל כיוון, עד מרחק $s$ מהמרכז. לכן כדור קטן בתוך גדול "מבזבז" מהרדיוס הגדול לפחות
          את המרחק בין המרכזים. אז המרכזים מתקרבים כמו הרדיוסים, שמהווים סדרה יורדת וחסומה של מספרים, והגבול שלהם בכל
          הכדורים.
      - kind: step
        text: >-
          (א) אם $y\ne x$, נגדיר $u=\frac{y-x}{\|y-x\|}$; אם $y=x$, $u=\frac v{\|v\|}$ ל-$v\ne0$ כלשהו. בשני המקרים $\|u\|=1$
          ו-$y-x=\|y-x\|\,u$. הנקודה $z=y+su$ מקיימת $\|z-y\|=s$, ולכן $z\in B[y,s]\subseteq B[x,r]$. אבל
          $z-x=(\|y-x\|+s)\,u$, ולכן $\|z-x\|=\|x-y\|+s\le r$.
      - kind: step
        text: >-
          (ב) לפי (א), $\|x_n-x_{n+1}\|\le r_n-r_{n+1}$; בפרט $r_{n+1}\le r_n$. $(r_n)$ יורדת וחסומה מלרע ב-$0$, ולכן מתכנסת
          לאיזה $r\ge0$ (אינפי 1). ל-$m>n$, לפי אי-שוויון המשולש וסכום טלסקופי:
          $\|x_n-x_m\|\le\sum_{k=n}^{m-1}(r_k-r_{k+1})=r_n-r_m$.
      - kind: step
        text: >-
          $(r_n)$ מתכנסת, ולכן סדרת קושי ב-$\mathbb{R}$ (טענה 2.1.4): ל-$\varepsilon>0$ יש $N$ עם $r_n-r_m<\varepsilon$ לכל
          $m>n>N$. אז $\|x_n-x_m\|<\varepsilon$, ו-$(x_n)$ סדרת קושי ב-$V$. $V$ בנך, ולכן $x_n\to x$ לאיזה $x\in V$.
      - kind: step
        text: >-
          נקבע $n$. לכל $m>n$: $\|x-x_n\|\le\|x-x_m\|+\|x_m-x_n\|\le\|x-x_m\|+r_n-r_m$. נשאיף $m\to\infty$ (אי-שוויון חלש עובר
          לגבול): $\|x-x_n\|\le r_n-r\le r_n$. לכן $x\in B[x_n,r_n]$ לכל $n$.
      - kind: step
        text: >-
          (ג) בטענה 2.5.4א המטריקה $\rho$ על $\mathbb{N}$ אינה באה מנורמה ($\mathbb{N}$ אינו אפילו מרחב וקטורי), ולכן (א) אינו
          חל, והמשפט כאן אינו סותר אותה. ב-$(\mathbb{N},\rho)$: $B_\rho[1,2]=\mathbb{N}$ (כל המרחקים מ-$1$ הם $0$ או $2$),
          ו-$B_\rho[2,\frac32]=\{2,3,\dots\}\subseteq B_\rho[1,2]$, אבל $\rho(1,2)+\frac32=2+\frac32>2$.
      - kind: check
        text: >-
          חישוב ב-$\mathbb{N}$ עם $\rho$, על $1\le m\le12$: $B_\rho[n,1+\frac1n]=\{n,\dots,12\}$ ל-$n=1,\dots,5$, ובפרט
          $B_\rho[1,2]$ הוא כל הקבוצה. ב-$\mathbb{R}$ (בנך): הכדורים $[-1-\frac1n,1+\frac1n]$ יורדים עם רדיוסים $\to1$,
          והחיתוך $[-1,1]$ לא ריק, כמו ש-(ב) מבטיח.
      - kind: result
        text: >-
          במרחב נורמי $B[y,s]\subseteq B[x,r]$ גורר $\|x-y\|+s\le r$; לכן במרחב בנך כל סדרה יורדת של כדורים סגורים נחתכת,
          גם כשהרדיוסים אינם שואפים ל-0. במרחב מטרי כללי זה נכשל (טענה 2.5.4א).

challenge:
  - id: W-2.5-c1
    stars: 1
    objectives: [OBJ-2.5-2]
    prompt: >-
      (א) יהי $(V,\|\cdot\|)$ מרחב נורמי, ו-$Y\subseteq V$ תת-מרחב לינארי עם $Y\ne V$. הוכיחו של-$Y$ אין נקודות פנימיות.


      (ב) יהי $V$ מרחב בנך, ויהיו $Y_1,Y_2,\dots$ תת-מרחבים לינאריים **סגורים** של $V$, כל אחד שונה מ-$V$. הוכיחו
      ש-$V\ne\bigcup_nY_n$.


      (ג) הראו שב-(ב) השלמות נחוצה: במרחב $c_{00}$ של הסדרות הממשיות שרק מספר סופי מאיבריהן שונה מ-0, עם
      $\|x\|_\infty=\max_k|x_k|$, נגדיר $Y_n=\{x\in c_{00}:\ x_k=0\ \forall k>n\}$. הוכיחו ש-$Y_n$ סגורים ב-$c_{00}$,
      שונים מ-$c_{00}$, ו-$c_{00}=\bigcup_nY_n$.
    answer: >-
      (א) אם $B(y,r)\subseteq Y$, אז לכל $v\ne0$, $v=\frac{2\|v\|}r\big((y+\frac r{2\|v\|}v)-y\big)\in Y$. (ב) כל $Y_n$ סגור
      בלי פנים, כלומר דליל, ומשפט 2.5.8(ב). (ג) גבול של סדרה ב-$Y_n$ מתאפס אחרי המקום $n$; $e_{n+1}\notin Y_n$; לכל
      $x\in c_{00}$ יש מקום אחרון שאינו אפס.
    solution:
      - kind: given
        text: >-
          $V$ נורמי; $Y$ תת-מרחב לינארי ממש. ב-(ב) $V$ שלם ו-$Y_n$ סגורים. ב-(ג) $c_{00}$ עם $\|\cdot\|_\infty$.
      - kind: idea
        text: >-
          תת-מרחב סגור לכפל בסקלר ולחיבור. אם יש בו כדור קטן סביב נקודה אחת, מזיזים את הכדור לראשית ומנפחים אותו, ומקבלים
          את כל המרחב. לכן תת-מרחב ממש סגור הוא קבוצה דלילה, ובייר אוסר על מרחב בנך להיות איחוד בן מנייה שלהם.
      - kind: step
        text: >-
          (א) נניח בשלילה ש-$y\in Y^\circ$: יש $r>0$ עם $B(y,r)\subseteq Y$. יהי $v\in V$, $v\ne0$, ו-$w=y+\frac r{2\|v\|}v$.
          אז $\|w-y\|=\frac r2<r$, ולכן $w\in Y$. $Y$ תת-מרחב ו-$y,w\in Y$, ולכן $v=\frac{2\|v\|}r(w-y)\in Y$. גם $0\in Y$. לכן
          $Y=V$, בסתירה להנחה.
      - kind: step
        text: >-
          (ב) כל $Y_n$ סגור, ולפי (א) $Y_n^\circ=\emptyset$; לפי טענה 2.5.6(ה) $Y_n$ דליל. $V$ שלם ולא ריק ($0\in V$), ולפי
          משפט 2.5.8(ב) $V$ אינו איחוד בן מנייה של דלילות: $V\ne\bigcup_nY_n$.
      - kind: step
        text: >-
          (ג) $Y_n$ סגור ב-$c_{00}$: אם $x^{(m)}\in Y_n$ ו-$x^{(m)}\to x\in c_{00}$, אז לכל $k$,
          $|x^{(m)}_k-x_k|\le\|x^{(m)}-x\|_\infty\to0$; ל-$k>n$, $x^{(m)}_k=0$ לכל $m$, ולכן $x_k=0$, כלומר $x\in Y_n$ (מסקנה
          1.5.8(ב)). $e_{n+1}$ (אחד במקום $n+1$, אפס בשאר) נמצא ב-$c_{00}$ ולא ב-$Y_n$. ולכל $x\in c_{00}$ יש $n$ כך
          ש-$x_k=0$ לכל $k>n$, כלומר $x\in Y_n$.
      - kind: step
        text: >-
          לכן $c_{00}$ הוא איחוד בן מנייה של תת-מרחבים סגורים ממש, שלפי (א) דלילים: לפי (ב) הוא **אינו** מרחב בנך. זו דרך
          שנייה להראות ש-$c_{00}$ אינו שלם.
      - kind: check
        text: >-
          (ג) אינו סותר את (ב): בהוכחה של (ב) השתמשנו בשלמות רק דרך משפט 2.5.8, וב-$c_{00}$ הסדרה
          $(1,\frac12,\dots,\frac1n,0,0,\dots)$ היא סדרת קושי בלי גבול ב-$c_{00}$ (הגבול ב-$B(\mathbb{N})$ הוא $(\frac1k)_k$, שאינו
          ב-$c_{00}$).
      - kind: result
        text: >-
          תת-מרחב לינארי ממש של מרחב נורמי הוא בלי פנים; לכן מרחב בנך אינו איחוד בן מנייה של תת-מרחבים סגורים ממש, ו-$c_{00}$
          עם $\|\cdot\|_\infty$, שהוא איחוד כזה, אינו שלם.
    source:
      name: 'Budapest Semesters in Mathematics, Functional Analysis, Exercise sheet: Baire category theorem and its consequences (Spring 2012)'
      year: 2012
      problem: 'Exercise 3 (W4P1)'
      url: 'https://users.renyi.hu/~harangi/fun/ex06_baire_category_thm.pdf'
