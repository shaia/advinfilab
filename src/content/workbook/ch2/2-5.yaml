  - id: W-2.5-c2
    stars: 2
    objectives: [OBJ-2.5-2]
    prompt: >-
      תהי $f:\mathbb{R}\to\mathbb{R}$ רציפה, כך שלכל $\alpha>0$ מתקיים $\lim_{n\to\infty}f(n\alpha)=0$. הוכיחו
      ש-$\lim_{x\to\infty}f(x)=0$.
    answer: >-
      ל-$\varepsilon>0$, הקבוצות $E_N=\{\alpha\in[1,2]:\ |f(n\alpha)|\le\varepsilon\ \forall n\ge N\}$ סגורות ומכסות את $[1,2]$;
      לפי בייר אחת מכילה קטע $(a,b)$, ואז $|f|\le\varepsilon$ על $\bigcup_{n\ge n_0}(na,nb)=(n_0a,\infty)$.
    solution:
      - kind: given
        text: >-
          $f$ רציפה על $\mathbb{R}$, ו-$f(n\alpha)\to0$ לכל $\alpha>0$ (לאורך הכפולות השלמות של כל מספר חיובי בנפרד).
      - kind: idea
        text: >-
          ההנחה היא "לכל $\alpha$ יש $N$", וצריך $N$ אחד שמתאים לקטע שלם של $\alpha$-ות. בייר נותן אותו: הקבוצות של
          ה-$\alpha$-ות עם $N$ נתון סגורות ומכסות קטע שלם, ולכן אחת מהן מכילה קטע $(a,b)$. הקטעים המנופחים $(na,nb)$
          מתארכים כש-$n$ גדל, ומ-$n$ מסוים הם חופפים ומכסים קרן.
      - kind: step
        text: >-
          יהי $\varepsilon>0$. לכל $N\in\mathbb{N}$ נגדיר $E_N=\{\alpha\in[1,2]:\ |f(n\alpha)|\le\varepsilon\ \ \forall n\ge N\}$.
          לכל $n$ הפונקציה $\alpha\mapsto|f(n\alpha)|$ רציפה (הרכבה, טענה 1.6.5), ולכן $\{\alpha:\ |f(n\alpha)|\le\varepsilon\}$
          סגורה ב-$\mathbb{R}$ (מסקנה 1.6.7(א)). $E_N$ היא החיתוך של הקבוצות האלה, $n\ge N$, ושל $[1,2]$, ולכן סגורה ב-$\mathbb{R}$
          (מסקנה 1.3.8(ב)), ובפרט סגורה בתת-המרחב $X=[1,2]$ (מסקנה 1.3.12).
      - kind: step
        text: >-
          לכל $\alpha\in[1,2]$, $f(n\alpha)\to0$, ולכן יש $N$ עם $|f(n\alpha)|\le\varepsilon$ לכל $n\ge N$: $\alpha\in E_N$. לכן
          $X=\bigcup_NE_N$. $X$ סגור ב-$\mathbb{R}$ ולכן שלם (משפט 2.2.1(א)), ולפי משפט 2.5.8(ג) יש $N$ ו-$\alpha_0\in E_N$, $r>0$
          עם $(\alpha_0-r,\alpha_0+r)\cap[1,2]\subseteq E_N$.
      - kind: step
        text: >-
          הקבוצה הזו מכילה קטע פתוח $(a,b)$ עם $1\le a<b\le2$: אם $\alpha_0<2$, הקטע $(\alpha_0,\min(\alpha_0+r,2))$; אם
          $\alpha_0=2$, הקטע $(2-\min(r,1),2)$. לכן $|f(n\alpha)|\le\varepsilon$ לכל $\alpha\in(a,b)$ ולכל $n\ge N$; כלומר
          $|f(y)|\le\varepsilon$ לכל $y\in(na,nb)$ ולכל $n\ge N$.
      - kind: step
        text: >-
          $(n+1)a<nb$ אם ורק אם $n>\frac a{b-a}$. נבחר $n_0\ge N$ עם $n_0>\frac a{b-a}$ (ארכימדס). יהי $y>n_0a$, ויהי $n\ge n_0$
          הגדול ביותר עם $na<y$ (קיים, כי $n_0a<y$ ו-$na\to\infty$). אז $y\le(n+1)a<nb$, ולכן $y\in(na,nb)$ ו-$|f(y)|\le\varepsilon$.
      - kind: step
        text: >-
          כלומר: לכל $\varepsilon>0$ יש $M=n_0a$ כך ש-$|f(y)|\le\varepsilon$ לכל $y>M$. זו ההגדרה של $\lim_{x\to\infty}f(x)=0$
          (עם $\le\varepsilon$ במקום $<\varepsilon$, ששקולה לה: מפעילים עם $\frac\varepsilon2$).
      - kind: check
        text: >-
          הרציפות שימשה רק לסגירות של $E_N$, והשלמות של $[1,2]$ נכנסה דרך משפט בייר. דוגמה לחפיפה: עם $a=1.2$, $b=1.3$,
          $\frac a{b-a}=12$. ב-$n=12$: $(n+1)a=15.6=nb$, והקטעים רק נוגעים; ב-$n=13$: $(n+1)a=16.8<16.9=nb$, והם חופפים.
      - kind: result
        text: >-
          לכל $\varepsilon>0$, $|f(y)|\le\varepsilon$ מ-$y$ מסוים והלאה, ולכן $\lim_{x\to\infty}f(x)=0$.
    source:
      name: 'The 25th William Lowell Putnam Mathematical Competition'
      year: 1964
      problem: 'B3'
      url: 'https://prase.cz/kalva/putnam/psoln/psol649.html'
      verified: '2026-11-10'
      adapted: true
