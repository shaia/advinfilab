# Workbook of lesson 1.5 — sequences in a metric space.
# Objectives (src/course.ts):
#   OBJ-1.5-1  define convergence in a metric space and prove the limit is unique
#   OBJ-1.5-2  a closed set contains the limits of its convergent sequences; the closure is the set of those limits
#   OBJ-1.5-3  convergence in R^n is coordinatewise; convergence in the sup metric is uniform convergence
# Rebuilt 2026-11-10 on the formal spine (results cited as 1.5.k). Numbers recomputed with npx tsx
# (sampled sups, src/math/multivar.ts simpson); W-02, W-07, W-10 are new proof problems.
lesson: '1.5'
practice:
  - id: W-1.5-01
    level: basic
    objectives: [OBJ-1.5-3]
    prompt: >-
      ב-$\mathbb{R}^2$ עם $d_\infty$, תהי $x_n=\left(\frac{(-1)^n}{n},\ 3-\frac{1}{n^2}\right)$.

      (א) מצאו את הגבול $x$, ונמקו לפי משפט.

      (ב) מצאו את ה-$N$ הקטן ביותר כך ש-$d_\infty(x_n,x)<0.01$ לכל $n>N$.
    answer: >-
      (א) $x=(0,3)$. (ב) $N=100$.
    solution:
      - kind: theorem
        text: >-
          משפט 1.5.9: ב-$\mathbb{R}^k$ עם $d_\infty$, $x_n\to x$ אם ורק אם כל קואורדינטה מתכנסת לקואורדינטה המתאימה של
          $x$.
      - kind: computation
        text: >-
          (א) $\frac{(-1)^n}{n}\to0$ ו-$3-\frac1{n^2}\to3$ (אינפי 1). לפי משפט 1.5.9 $x_n\to(0,3)$, ולפי משפט 1.5.2 זה
          הגבול היחיד.
      - kind: computation
        text: >-
          (ב) $d_\infty(x_n,x)=\max\left(\frac1n,\ \frac1{n^2}\right)=\frac1n$, כי $\frac1{n^2}\le\frac1n$. התנאי
          $\frac1n<0.01$ שקול ל-$n>100$.
      - kind: check
        text: >-
          $n=100$ נותן בדיוק $0.01$, שאינו קטן ממש. לכן $N=99$ לא מתאים ו-$N=100$ מתאים. הקואורדינטה השנייה מסתדרת
          כבר מ-$n=11$; הראשונה היא שקובעת.
      - kind: result
        text: >-
          $x=(0,3)$ ו-$N=100$.

  - id: W-1.5-02
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-1]
    prompt: >-
      $(X,d)$ מרחב מטרי, $(x_n)$ סדרה ב-$X$ ו-$x\in X$.

      (א) הוכיחו: אם $x_n\to x$, אז $d(x_n,x_{n+1})\to0$.

      (ב) הוכיחו: $x_n\to x$ אם ורק אם $x_{2n}\to x$ וגם $x_{2n-1}\to x$.

      (ג) הראו שההפך של (א) אינו נכון, בדוגמה ב-$\mathbb{R}$.
    answer: >-
      (א) $d(x_n,x_{n+1})\le d(x_n,x)+d(x_{n+1},x)$. (ב) ($\Rightarrow$) טענה 1.5.4(א); ($\Leftarrow$) $N=2\max(N_1,N_2)$.
      (ג) הסכומים החלקיים של הטור ההרמוני.
    solution:
      - kind: idea
        text: >-
          ב-(א) אי-שוויון המשולש חוסם את מה שרוצים בסכום של שני מרחקים לגבול. ב-(ב) כל אינדקס הוא זוגי או אי-זוגי, ולכן
          שני ה-$N$-ים של שתי התת-סדרות יחד שולטים בכל הסדרה.
      - kind: step
        text: >-
          (א) $(x_{n+1})_{n\in\mathbb{N}}$ היא תת-סדרה, עם $n_k=k+1$, ולפי טענה 1.5.4(א) $d(x_{n+1},x)\to0$. לפי M3 ו-M2,
          $0\le d(x_n,x_{n+1})\le d(x_n,x)+d(x_{n+1},x)$, וצד ימין שואף ל-0. לפי כלל הסנדוויץ' $d(x_n,x_{n+1})\to0$.
      - kind: step
        text: >-
          (ב) ($\Rightarrow$) $n_k=2k$ ו-$n_k=2k-1$ עולות ממש, ולכן $(x_{2k})$ ו-$(x_{2k-1})$ תת-סדרות, ולפי טענה 1.5.4(א)
          שתיהן שואפות ל-$x$.
      - kind: step
        text: >-
          ($\Leftarrow$) יהי $\varepsilon>0$. יש $N_1$ עם $d(x_{2k},x)<\varepsilon$ לכל $k>N_1$, ויש $N_2$ עם
          $d(x_{2k-1},x)<\varepsilon$ לכל $k>N_2$. נגדיר $N=2\max(N_1,N_2)$, ויהי $n>N$.
      - kind: step
        text: >-
          אם $n=2k$ זוגי, אז $2k>2\max(N_1,N_2)$, כלומר $k>N_1$, ולכן $d(x_n,x)<\varepsilon$. אם $n=2k-1$ אי-זוגי, אז
          $2k-1>2\max(N_1,N_2)$, כלומר $k>\max(N_1,N_2)+\frac12$, ובפרט $k>N_2$, ולכן $d(x_n,x)<\varepsilon$. לכן
          $x_n\to x$.
      - kind: step
        text: >-
          (ג) ב-$\mathbb{R}$, $x_n=\sum_{i=1}^n\frac1i$. אז $|x_{n+1}-x_n|=\frac1{n+1}\to0$, אבל $x_n\to\infty$ (הטור
          ההרמוני מתבדר, אינפי 1), ולכן $(x_n)$ אינה חסומה, ולפי טענה 1.5.3(ג) אינה מתכנסת.
      - kind: check
        text: >-
          ב-(ב) צריך את **שתי** התת-סדרות: $(-1)^n$ ב-$\mathbb{R}$ מקיימת $x_{2n}=1\to1$, אבל $x_{2n-1}=-1\to-1$, ולפי
          טענה 1.5.4(ב) היא מתבדרת.
      - kind: result
        text: >-
          (א) נכון. (ב) נכון בשני הכיוונים. (ג) ההפך של (א) נכשל: צעדים קטנים אינם מבטיחים גבול.

  - id: W-1.5-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.5-1]
    prompt: >-
      ב-$\mathbb{R}$ עם **המטריקה הבדידה**, אילו מהסדרות מתכנסות, ולאן?

      (א) $a_n=(-1)^n$

      (ב) $b_n=\max(5-n,\ 0)$

      (ג) $c_n=\frac{1}{n}$ אם $n$ זוגי, ו-$c_n=0$ אם $n$ אי-זוגי
    answer: >-
      (א) לא. (ב) כן, ל-0. (ג) לא.
    solution:
      - kind: theorem
        text: >-
          טענה 1.5.5: במטריקה הבדידה $x_n\to x$ אם ורק אם $x_n=x$ לכל $n$ מ-$N$ מסוים והלאה.
      - kind: step
        text: >-
          (א) לכל $x$ ולכל $N$, אחד משני האיברים $a_{N+1},a_{N+2}$ שונה מ-$x$, כי הם שונים זה מזה. לכן הסדרה אינה שווה
          ל-$x$ מאף מקום, ולפי טענה 1.5.5 אינה שואפת ל-$x$. זה לכל $x$: אין גבול.
      - kind: step
        text: >-
          (ב) $b_n=0$ לכל $n\ge5$. לפי טענה 1.5.5, עם $N=4$, $b_n\to0$.
      - kind: step
        text: >-
          (ג) נניח $c_n\to x$. לפי טענה 1.5.5 יש $N$ עם $c_n=x$ לכל $n>N$. ניקח $n$ אי-זוגי גדול מ-$N$: $x=0$. ניקח $n$
          זוגי גדול מ-$N$: $x=\frac1n\ne0$. סתירה. אין גבול, אף שב-$\mathbb{R}$ עם המטריקה הרגילה $c_n\to0$.
      - kind: result
        text: >-
          רק (ב) מתכנסת, ל-0.

  - id: W-1.5-04
    level: mid
    objectives: [OBJ-1.5-2]
    prompt: >-
      הוכיחו בעזרת סדרות:

      (א) הקטע $[a,b]$ סגור ב-$\mathbb{R}$, והקטע $[a,b)$ (עם $a<b$) אינו סגור.

      (ב) $\mathbb{Z}$ סגורה ב-$\mathbb{R}$.
    answer: >-
      (א) גבול של סדרה ב-$[a,b]$ מקיים $a\le x\le b$; הסדרה $b-\frac{b-a}{2n}$ ב-$[a,b)$ שואפת ל-$b\notin[a,b)$.
      (ב) סדרה מתכנסת של שלמים קבועה מ-$N$ מסוים, ולכן הגבול שלה שלם.
    solution:
      - kind: theorem
        text: >-
          מסקנה 1.5.8(ב): $A$ סגורה אם ורק אם הגבול של כל סדרה מ-$A$ שמתכנסת ב-$X$ נמצא ב-$A$.
      - kind: step
        text: >-
          (א) תהי $x_n\in[a,b]$ עם $x_n\to x$. לכל $n$: $a\le x_n\le b$. אי-שוויון חלש נשמר בגבול (אינפי 1), ולכן
          $a\le x\le b$, כלומר $x\in[a,b]$. לפי מסקנה 1.5.8(ב) $[a,b]$ סגור.
      - kind: step
        text: >-
          $x_n=b-\frac{b-a}{2n}$ מקיימת $a\le x_n<b$, כלומר $x_n\in[a,b)$, ו-$x_n\to b$. אבל $b\notin[a,b)$. סדרה אחת
          מ-$[a,b)$ שהגבול שלה מחוצה לה מספיקה: לפי מסקנה 1.5.8(ב) $[a,b)$ אינו סגור.
      - kind: check
        text: >-
          למה אי-שוויון חזק לא נשמר: $x_n<b$ לכל $n$, ובכל זאת הגבול שווה ל-$b$. בדיוק זה מה שמפיל את $[a,b)$.
      - kind: step
        text: >-
          (ב) תהי $k_n\in\mathbb{Z}$ עם $k_n\to x$. עם $\varepsilon=\frac12$ יש $N$ כך ש-$|k_n-x|<\frac12$ לכל $n>N$.
          אז לכל $n,m>N$: $|k_n-k_m|\le|k_n-x|+|x-k_m|<1$. שני שלמים שהמרחק ביניהם קטן מ-1 שווים, ולכן $k_n=k_{N+1}$
          לכל $n>N$: הסדרה קבועה מ-$N$ והלאה.
      - kind: step
        text: >-
          סדרה שקבועה מ-$N$ והלאה שואפת לערך הקבוע (הכיוון ($\Leftarrow$) של טענה 1.5.5, שנכון בכל מרחב מטרי), ולפי
          משפט 1.5.2 $x=k_{N+1}\in\mathbb{Z}$. לפי מסקנה 1.5.8(ב) $\mathbb{Z}$ סגורה.
      - kind: result
        text: >-
          (א) $[a,b]$ סגור; $[a,b)$ אינו סגור. (ב) $\mathbb{Z}$ סגורה.

  - id: W-1.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      ב-$\mathbb{R}^2$ עם $d_2$, תהי $A=\{(x,0): 0<x<1\}$. מצאו את $\overline A$ בעזרת סדרות, והוכיחו.
    answer: >-
      $\overline A=\{(x,0): 0\le x\le1\}$.
    solution:
      - kind: theorem
        text: >-
          מסקנה 1.5.8(א): $\overline A$ היא קבוצת הגבולות של סדרות מ-$A$. משפט 1.5.9: גבול ב-$(\mathbb{R}^2,d_2)$ הוא גבול
          לפי קואורדינטות.
      - kind: step
        text: >-
          ($\supseteq$) נקודה $(x,0)$ עם $0<x<1$ היא גבול של הסדרה הקבועה. $(0,0)=\lim\left(\frac1{n+1},0\right)$ ו-
          $(1,0)=\lim\left(1-\frac1{n+1},0\right)$, לפי משפט 1.5.9, ושתי הסדרות ב-$A$ (כי $0<\frac1{n+1}<1$).
      - kind: step
        text: >-
          ($\subseteq$) תהי $(x_n,0)\in A$ עם $(x_n,0)\to(x,y)$. לפי משפט 1.5.9 $x_n\to x$ ו-$0\to y$, ולכן $y=0$. וכיוון
          ש-$0<x_n<1$, הגבול מקיים $0\le x\le1$ (אי-שוויון חלש עובר לגבול).
      - kind: check
        text: >-
          הנקודה $(\tfrac12,\ 0.1)$ אינה בסגור: כל איבר של $A$ במרחק לפחות $0.1$ ממנה, ולכן הכדור $B\big((\tfrac12,0.1),0.1\big)$
          זר ל-$A$ (הגדרה 1.4.3).
      - kind: result
        text: >-
          $\overline A=[0,1]\times\{0\}$.

  - id: W-1.5-06
    level: basic
    objectives: [OBJ-1.5-3]
    prompt: >-
      $f_n(x)=\frac{x}{1+nx}$ על $[0,1]$.

      (א) מצאו את הגבול הנקודתי.

      (ב) חשבו את $d_\infty(f_n,f)$, והכריעו אם $f_n\to f$ במטריקת הסופרמום.

      (ג) חשבו את $d_\infty(f_9,f)$.
    answer: >-
      (א) $f=0$. (ב) $\frac{1}{1+n}\to0$: כן. (ג) $0.1$.
    solution:
      - kind: computation
        text: >-
          (א) $f_n(0)=0$, ול-$x>0$: $0\le\frac{x}{1+nx}\le\frac{x}{nx}=\frac1n\to0$. לכן $f=0$, ולפי משפט 1.5.10(ב) זה
          המועמד היחיד לגבול במטריקת הסופרמום.
      - kind: computation
        text: >-
          (ב) $\frac{x}{1+nx}=\frac1n\left(1-\frac{1}{1+nx}\right)$ עולה ב-$x$, ולכן המקסימום ב-$x=1$:
          $d_\infty(f_n,0)=\frac{1}{1+n}\to0$. לפי הגדרה 1.5.1 $f_n\to0$ ב-$d_\infty$, ולפי משפט 1.5.10(א) במידה שווה.
      - kind: computation
        text: >-
          (ג) $d_\infty(f_9,0)=\frac1{10}=0.1$.
      - kind: check
        text: >-
          ההערכה מ-(א), $\frac{x}{1+nx}\le\frac1n$, נכונה לכל $x$ יחד, ולכן כבר היא נותנת $d_\infty\le\frac1n\to0$. כשיש חסם
          שלא תלוי ב-$x$ **ושואף ל-0**, ההתכנסות במידה שווה. (חסם שלא שואף ל-0 לא מספיק: $|x^n|\le1$ על $[0,1]$, ו-$x^n$
          מתבדרת במטריקת הסופרמום.)
      - kind: result
        text: >-
          $f_n\to0$ במטריקת הסופרמום; $d_\infty(f_9,0)=0.1$.

  - id: W-1.5-07
    level: mid
    objectives: [OBJ-1.5-1]
    prompt: >-
      $(V,\|\cdot\|)$ מרחב נורמי, עם המטריקה $d(u,v)=\|u-v\|$.

      (א) הוכיחו: אם $x_n\to x$, אז $\|x_n\|\to\|x\|$.

      (ב) הראו שההפך אינו נכון כש-$V\ne\{0\}$.

      (ג) הוכיחו: אם $x_n\to x$ ו-$x\ne0$, אז יש $N$ כך ש-$x_n\ne0$ לכל $n>N$, ו-$\frac{x_n}{\|x_n\|}\to\frac{x}{\|x\|}$
      (כסדרה של האיברים עם $n>N$). האם ההנחה $x\ne0$ נחוצה?
    answer: >-
      (א) $|\|x_n\|-\|x\||\le\|x_n-x\|$ (למה 1.2.2). (ב) $x_n=(-1)^nv$ עם $v\ne0$. (ג) $\|x_n\|>\frac{\|x\|}2$ מ-$N$
      והלאה, ו-$\frac1{\|x_n\|}\to\frac1{\|x\|}$, ולפי טענה 1.5.6(ב). ההנחה נחוצה: $\frac{(-1)^n}{n}$ ב-$\mathbb{R}$.
    solution:
      - kind: step
        text: >-
          (א) לפי למה 1.2.2, $0\le\big|\|x_n\|-\|x\|\big|\le\|x_n-x\|=d(x_n,x)\to0$, ולפי כלל הסנדוויץ' $\|x_n\|\to\|x\|$.
      - kind: step
        text: >-
          (ב) יהי $v\in V$, $v\ne0$, ו-$x_n=(-1)^nv$. לפי N2 $\|x_n\|=\|v\|$ לכל $n$, ולכן $\|x_n\|\to\|v\|$. אבל
          $x_{2n}=v\to v$ ו-$x_{2n-1}=-v\to-v$, ו-$v\ne-v$, כי $\|v-(-v)\|=2\|v\|>0$ (N1). לפי טענה 1.5.4(ב),
          $(x_n)$ מתבדרת.
      - kind: step
        text: >-
          (ג) לפי (א) $\|x_n\|\to\|x\|$, ו-$\|x\|>0$ (N1). עם $\varepsilon=\frac{\|x\|}2$ יש $N$ כך ש-
          $\big|\|x_n\|-\|x\|\big|<\frac{\|x\|}2$ לכל $n>N$, ולכן $\|x_n\|>\frac{\|x\|}2>0$, ולפי N1 $x_n\ne0$.
      - kind: step
        text: >-
          ל-$n>N$ נגדיר $\lambda_n=\frac1{\|x_n\|}$. לפי אריתמטיקה של גבולות ב-$\mathbb{R}$ (מנה, עם מכנה שגבולו
          $\|x\|\ne0$), $\lambda_n\to\lambda=\frac1{\|x\|}$. לפי טענה 1.5.6(ב), $\lambda_nx_n\to\lambda x=\frac{x}{\|x\|}$.
          (השמטה של מספר סופי של איברים לא משנה התכנסות: ה-$N$ של ההגדרה רק גדל.)
      - kind: check
        text: >-
          בלי $x\ne0$ המסקנה נופלת. ב-$\mathbb{R}$ עם $|\cdot|$, $x_n=\frac{(-1)^n}{n}\to0$, ו-$\frac{x_n}{|x_n|}=(-1)^n$
          מתבדרת. ואפילו "יש $N$ עם $x_n\ne0$" נכשל: $x_n=0$ לכל $n$ שואפת ל-0.
      - kind: result
        text: >-
          (א) $\|x_n\|\to\|x\|$. (ב) $(-1)^nv$. (ג) $\frac{x_n}{\|x_n\|}\to\frac{x}{\|x\|}$ כש-$x\ne0$, וההנחה נחוצה.

  - id: W-1.5-08
    level: exam
    objectives: [OBJ-1.5-2, OBJ-1.5-3]
    prompt: >-
      ב-$B([0,1])$, הפונקציות החסומות על $[0,1]$ עם מטריקת הסופרמום:

      (א) הוכיחו ש-$F=\{f\in B([0,1]):\ |f(x)|\le1\ \ \forall x\in[0,1]\}$ סגורה.

      (ב) הוכיחו או הפריכו: $G=\{f\in B([0,1]):\ |f(x)|<1\ \ \forall x\}$ סגורה.

      (ג) הוכיחו ש-$C[0,1]$ היא תת-קבוצה סגורה של $(B([0,1]),d_\infty)$.
    answer: >-
      (א) גבול במטריקת הסופרמום הוא גבול נקודתי, ו-$\le$ נשמר. (ב) לא נכון: $1-\frac1n\to1\notin G$. (ג) גבול במידה
      שווה של פונקציות רציפות רציף.
    solution:
      - kind: theorem
        text: >-
          מסקנה 1.5.8(ב): קבוצה סגורה אם ורק אם היא מכילה את הגבול של כל סדרה שלה שמתכנסת במרחב. משפט 1.5.10: התכנסות
          ב-$d_\infty$ היא התכנסות במידה שווה, וגוררת התכנסות נקודתית.
      - kind: step
        text: >-
          (א) תהי $f_n\in F$, $f_n\to f$ ב-$d_\infty$. לפי משפט 1.5.10(ב), לכל $x$: $f_n(x)\to f(x)$, ו-$|f_n(x)|\le1$
          לכל $n$. לכן $|f(x)|=\lim|f_n(x)|\le1$ (אי-שוויון חלש עובר לגבול). לכן $f\in F$, ולפי מסקנה 1.5.8(ב) $F$ סגורה.
      - kind: step
        text: >-
          (ב) **לא נכון.** הפונקציות הקבועות $g_n=1-\frac1n$ נמצאות ב-$G$, ו-$d_\infty(g_n,1)=\frac1n\to0$. הגבול, הפונקציה
          הקבועה 1, אינו ב-$G$, ולפי מסקנה 1.5.8(ב) $G$ אינה סגורה.
      - kind: step
        text: >-
          (ג) תהי $f_n\in C[0,1]$ עם $f_n\to f$ ב-$(B([0,1]),d_\infty)$. לפי משפט 1.5.10(א), $f_n\to f$ במידה שווה על
          $[0,1]$. לפי משפט מאינפי 2, גבול במידה שווה של פונקציות רציפות הוא פונקציה רציפה, ולכן $f\in C[0,1]$. לפי
          מסקנה 1.5.8(ב) $C[0,1]$ סגורה ב-$B([0,1])$.
      - kind: check
        text: >-
          נסמן ב-$\theta$ את פונקציית האפס. אז $F=B[\theta,1]$, וזה מתאים לטענה 1.3.5(א) (כדור סגור הוא קבוצה סגורה). לעומת
          זאת $G$ אינה הכדור הפתוח $B(\theta,1)$: הפונקציה $h(x)=x$ ל-$x<1$ ו-$h(1)=0$ נמצאת ב-$G$, אבל $\sup|h|=1$, ולכן
          $h\notin B(\theta,1)$. ו-(ג) מסביר שוב למה $x^n$ מתבדרת ב-$B([0,1])$: גבול שלה היה רציף, אבל לפי משפט
          1.5.10(ב) הוא הגבול הנקודתי, שאינו רציף ב-1.
      - kind: result
        text: >-
          (א) $F$ סגורה. (ב) $G$ אינה סגורה. (ג) $C[0,1]$ סגורה ב-$(B([0,1]),d_\infty)$.

  - id: W-1.5-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.5-3]
    prompt: >-
      $f_n(x)=\sqrt n\,x\,(1-x^2)^n$ על $[0,1]$.

      (א) הוכיחו ש-$f_n(x)\to0$ לכל $x\in[0,1]$.

      (ב) חשבו את $\|f_n\|_\infty$, והכריעו אם $f_n\to0$ במטריקת הסופרמום.
    answer: >-
      (א) לכל $0<x\le1$, $(1-x^2)^n$ דועך מעריכית. (ב) $\|f_n\|_\infty=\sqrt{\frac{n}{2n+1}}\left(\frac{2n}{2n+1}\right)^n\to\frac{1}{\sqrt{2e}}\approx0.4289$:
      לא מתכנסת.
    solution:
      - kind: computation
        text: >-
          (א) $f_n(0)=0$ ו-$f_n(1)=0$. ל-$0<x<1$ נסמן $q=1-x^2\in(0,1)$. אז $\sqrt n\,q^n\to0$ (חזקה של $n$ כפול
          סדרה הנדסית עם מנה קטנה מ-1, מאינפי 1), ולכן $f_n(x)\to0$.
      - kind: computation
        text: >-
          (ב) $f_n'(x)=\sqrt n\,(1-x^2)^{n-1}\big(1-(2n+1)x^2\big)$, שמתאפסת ב-$(0,1)$ רק ב-$x_n=\frac{1}{\sqrt{2n+1}}$.
          $f_n\ge0$, מתאפסת בקצוות ואינה זהותית 0, ולכן לפי משפט ויירשטראס ומשפט פרמה המקסימום ב-$x_n$:
          $$\|f_n\|_\infty=f_n(x_n)=\sqrt{\frac{n}{2n+1}}\left(\frac{2n}{2n+1}\right)^{n}.$$
      - kind: computation
        text: >-
          $\sqrt{\frac{n}{2n+1}}\to\frac1{\sqrt2}$. ובגורם השני נכתוב $m=2n+1$:
          $$\left(1-\tfrac{1}{m}\right)^n=\Big[\left(1-\tfrac1m\right)^m\Big]^{n/m}.$$
          הבסיס שואף ל-$e^{-1}$ (גבול מוכר מאינפי 1), והמעריך $\frac{n}{2n+1}$ שואף ל-$\frac12$. לכן הגורם שואף ל-$e^{-1/2}$,
          ו-$\|f_n\|_\infty\to\frac{1}{\sqrt2}\,e^{-1/2}=\frac{1}{\sqrt{2e}}\approx0.4289\ne0$.
      - kind: step
        text: >-
          לפי משפט 1.5.10(ב), הגבול האפשרי היחיד במטריקת הסופרמום הוא הגבול הנקודתי 0, והמרחק אליו לא שואף ל-0. לכן אין
          גבול.
      - kind: check
        text: >-
          מספרית (דגימה של 20 001 נקודות): $\|f_1\|_\infty\approx0.3849$, $\|f_5\|_\infty\approx0.4186$,
          $\|f_{50}\|_\infty\approx0.4278$, מתקרבים ל-$0.4289$. הגבעה נודדת לכיוון 0 ונשארת בגובה קבוע, כמו בגבעה
          שבאיור.
      - kind: result
        text: >-
          מתכנסת נקודתית ל-0, אבל לא במטריקת הסופרמום: $\|f_n\|_\infty\to\frac1{\sqrt{2e}}$.

  - id: W-1.5-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      $(X,d)$ מרחב מטרי ו-$A\subseteq X$.

      (א) הוכיחו בעזרת סדרות שקבוצת נקודות ההצטברות $A'$ סגורה.

      (ב) הוכיחו או הפריכו: קבוצת הנקודות המבודדות של $A$ סגורה תמיד.
    answer: >-
      (א) אם $x_k\in A'$ ו-$x_k\to x$, בוחרים $a_k\in A\cap B(x_k,\frac1k)$ עם $a_k\ne x$; אז $a_k\to x$, ולפי משפט
      1.5.7(ב) $x\in A'$. (ב) לא נכון: ב-$A=\{0\}\cup\{\frac1n\}$ הנקודות המבודדות הן $\frac1n$, ששואפות ל-$0$.
    solution:
      - kind: goal
        text: >-
          (א) לפי מסקנה 1.5.8(ב) מספיק: לכל סדרה $x_k\in A'$ עם $x_k\to x\in X$, להראות $x\in A'$.
      - kind: idea
        text: >-
          כל $x_k$ מוקפת בנקודות של $A$; נבחר אחת קרובה מאוד ל-$x_k$, והנקודות שנבחרו יתקרבו ל-$x$. צריך לדאוג רק שאף אחת
          מהן לא תהיה $x$ עצמה, וטענה 1.4.8 נותנת מספיק נקודות לבחור מהן.
      - kind: step
        text: >-
          (א) לכל $k\in\mathbb{N}$: $x_k\in A'$, ולכן לפי טענה 1.4.8 הכדור $B(x_k,\frac1k)$ מכיל אינסוף נקודות של $A$.
          לכל היותר אחת מהן היא $x$, ולכן יש בו נקודה של $A\setminus\{x\}$. לפי אקסיומת הבחירה הבת מנייה נבחר, לכל
          $k$, נקודה $a_k\in A\setminus\{x\}$ עם $d(a_k,x_k)<\frac1k$.
      - kind: step
        text: >-
          לפי M3, $0\le d(a_k,x)\le d(a_k,x_k)+d(x_k,x)<\frac1k+d(x_k,x)$, וצד ימין שואף ל-0. לפי כלל הסנדוויץ'
          $a_k\to x$.
      - kind: step
        text: >-
          $a_k\in A\setminus\{x\}$ ו-$a_k\to x$, ולכן לפי משפט 1.5.7(ב) $x\in A'$. לפי מסקנה 1.5.8(ב) $A'$ סגורה.
      - kind: step
        text: >-
          (ב) **לא נכון.** ב-$\mathbb{R}$ תהי $A=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$. בדוגמה בישר שאחרי טענה 1.4.8
          ראינו ש-$B(\frac1n,r)\cap\{\frac1m:\ m\in\mathbb{N}\}=\{\frac1n\}$ עם $r=\frac1n-\frac1{n+1}$. הנקודה הנוספת $0$
          רחוקה מ-$\frac1n$ בדיוק $\frac1n>r$, ולכן גם $B(\frac1n,r)\cap A=\{\frac1n\}$: כל $\frac1n$ מבודדת ב-$A$.
      - kind: step
        text: >-
          $0$ אינה מבודדת: $\frac1n\in A\setminus\{0\}$ ו-$\frac1n\to0$, ולכן לפי משפט 1.5.7(ב) $0\in A'$. לכן קבוצת
          הנקודות המבודדות היא $I=\{\frac1n:\ n\in\mathbb{N}\}$, והסדרה $\frac1n\in I$ שואפת ל-$0\notin I$. לפי מסקנה
          1.5.8(ב) $I$ אינה סגורה.
      - kind: check
        text: >-
          כאן $A'=\{0\}$, סגורה כמו ש-(א) מבטיח. ובמרחב בדיד כל נקודה של $A$ מבודדת ו-$A'=\emptyset$; שתי הקבוצות סגורות
          שם, כמו כל קבוצה (טענה 1.3.6). הדוגמה הנגדית צריכה מרחב עם נקודות הצטברות.
      - kind: result
        text: >-
          (א) $A'$ סגורה בכל מרחב מטרי. (ב) לא נכון: קבוצת הנקודות המבודדות של $\{0\}\cup\{\frac1n\}$ היא $\{\frac1n\}$, שאינה
          סגורה.
challenge:
  - id: W-1.5-c1
    stars: 1
    objectives: [OBJ-1.5-2, OBJ-1.5-3]
    prompt: >-
      ב-$C[0,1]$ תהי $W=\{f\in C[0,1]:\ f(0)=0\}$. מצאו את הסגור $\overline W$ ונמקו בעזרת סדרות:

      (א) בנורמת הסופרמום $\|f\|_\infty=\max_{[0,1]}|f|$;

      (ב) בנורמת האינטגרל $\|f\|_1=\int_0^1|f|$.

      (ג) הסדרה $f_n(t)=t^{1/n}$ נמצאת ב-$W$. האם היא מתכנסת ב-$(C[0,1],\|\cdot\|_1)$? ב-$(C[0,1],\|\cdot\|_\infty)$?
      אם כן, לאן?
    answer: >-
      (א) $\overline W=W$: התכנסות במידה שווה שומרת על $f(0)=0$. (ב) $\overline W=C[0,1]$: לכל $f$, הפונקציות
      $w_n(t)=f(t)\min(1,nt)\in W$ מקיימות $\|f-w_n\|_1\le\frac{\|f\|_\infty}{2n}\to0$. (ג) $f_n\to1$
      בנורמת האינטגרל, כי $\|1-f_n\|_1=\frac1{n+1}$; בנורמת הסופרמום היא אינה מתכנסת.
    solution:
      - kind: given
        text: >-
          $W=\{f\in C[0,1]:\ f(0)=0\}$, ושתי נורמות על $C[0,1]$.
      - kind: theorem
        text: >-
          משפט 1.5.7(א) ומסקנה 1.5.8: הסגור $\overline W$ הוא קבוצת כל הגבולות של סדרות מ-$W$, ו-$W$ סגורה אם ורק אם
          היא מכילה את הגבולות של כל הסדרות המתכנסות שלה.
      - kind: idea
        text: >-
          התכנסות בנורמת הסופרמום היא התכנסות במידה שווה, ובפרט שולטת בערך בנקודה $0$, ולכן $f(0)=0$ שורד את הגבול.
          התכנסות בנורמת האינטגרל רואה רק שטח, ולכן ליד $0$ אפשר "לכופף" כל $f$ עד $0$ כמעט בלי מחיר.
      - kind: step
        text: >-
          (א) תהי $f_n\in W$ עם $f_n\to f$ ב-$\|\cdot\|_\infty$. אז
          $|f(0)|=|f(0)-f_n(0)|\le\|f-f_n\|_\infty\to0$, ולכן $f(0)=0$ ו-$f\in W$. לפי מסקנה 1.5.8(ב) $W$ סגורה, ולפי
          טענה 1.4.4(ג) $\overline W=W$.
      - kind: check
        text: >-
          אותו דבר דרך המשלים: אם $g(0)\ne0$, הכדור $B(g,|g(0)|)$ זר ל-$W$, כי כל $h$ בו מקיימת
          $|h(0)-g(0)|\le\|h-g\|_\infty<|g(0)|$, ולכן $h(0)\ne0$. המשלים פתוח, והטיעון בסדרות קצר באותה מידה.
      - kind: step
        text: >-
          (ב) תהי $f\in C[0,1]$ כלשהי, ו-$\varphi_n(t)=\min(1,nt)$: עולה לינארית מ-$0$ ל-$1$ על $[0,\tfrac1n]$ וקבועה $1$
          אחר כך. $w_n=f\cdot\varphi_n$ רציפה ו-$w_n(0)=f(0)\cdot0=0$, ולכן $w_n\in W$. (נשתמש ב-$w_n$ ולא ב-$f_n$, ששמור
          לסדרה של (ג).)
      - kind: computation
        text: >-
          $f-w_n=f\,(1-\varphi_n)$, וזה $0$ על $[\tfrac1n,1]$. על $[0,\tfrac1n]$, $|f(t)|\le\|f\|_\infty$ (המקסימום קיים
          לפי משפט ויירשטראס מאינפי 1). לכן
          $\|f-w_n\|_1=\int_0^{1/n}|f(t)|\,(1-nt)\,dt\le\|f\|_\infty\int_0^{1/n}(1-nt)\,dt=\frac{\|f\|_\infty}{2n}\to0$.
      - kind: step
        text: >-
          כל $f\in C[0,1]$ היא גבול ב-$\|\cdot\|_1$ של סדרה מ-$W$, ולכן לפי משפט 1.5.7(א) $\overline W=C[0,1]$: $W$ צפופה
          (הגדרה 1.4.13).
      - kind: check
        text: >-
          עם $f(t)=1+t$ ($\|f\|_\infty=2$): $\|f-w_1\|_1=\int_0^1(1+t)(1-t)\,dt=\frac23\le1$, ו-$\|f-w_5\|_1\approx0.107\le0.2$,
          כמו שהחסם $\frac{\|f\|_\infty}{2n}$ אומר.
      - kind: computation
        text: >-
          (ג) $\int_0^1t^{1/n}\,dt=\frac{1}{1+1/n}=\frac{n}{n+1}$, ולכן $\|1-f_n\|_1=\int_0^1(1-t^{1/n})\,dt=\frac1{n+1}\to0$:
          $f_n\to1$ בנורמת האינטגרל, ו-$1\notin W$. מספרית $\frac12$, $\frac13$, $\frac1{11}$ ל-$n=1,2,10$.
      - kind: step
        text: >-
          ב-$\|\cdot\|_\infty$ אין גבול. אילו $f_n\to g$ ב-$\|\cdot\|_\infty$, אז לפי (א) $g\in W$, כלומר $g(0)=0$. אבל
          לפי משפט 1.5.10(ב) התכנסות במידה שווה גוררת התכנסות נקודתית, ול-$t>0$, $t^{1/n}\to1$; לכן $g(t)=1$ ל-$t>0$,
          ומרציפות $g(0)=1$. סתירה. (ואכן $\|1-f_n\|_\infty=1$ לכל $n$, בנקודה $t=0$.)
      - kind: result
        text: >-
          $W$ סגורה ב-$(C[0,1],\|\cdot\|_\infty)$ וצפופה ב-$(C[0,1],\|\cdot\|_1)$: אותה קבוצה מתנהגת הפוך בשתי נורמות
          על אותו מרחב. $t^{1/n}\to1$ ב-$\|\cdot\|_1$ ואינה מתכנסת ב-$\|\cdot\|_\infty$.
    source:
      name: 'University of Edinburgh, Linear Analysis, Workshop 2 (with solutions)'
      year: 2015
      problem: 'Problem 3'
      url: 'https://webhomes.maths.ed.ac.uk/~aram/linan-web/W2-sol.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.5-c2
    stars: 2
    objectives: [OBJ-1.5-2]
    prompt: >-
      תהי $S=\big\{\sqrt[3]{n}-\sqrt[3]{m}:\ n,m\in\{0,1,2,\dots\}\big\}\subseteq\mathbb{R}$. האם יש סדרה של איברים
      של $S$ שמתכנסת ל-$\sqrt2$, כלומר האם $\sqrt2\in\overline S$?

      (א) ל-$N\in\mathbb{N}$ נסמן $g_N=\sqrt[3]{N+1}-\sqrt[3]{N}$. הוכיחו ש-$0<g_N<\frac{1}{3N^{2/3}}$.

      (ב) הוכיחו ש-$kx\in S$ לכל $x\in S$ ולכל $k\in\mathbb{N}$.

      (ג) בנו סדרה $x_j\in S$ עם $x_j\to\sqrt2$.

      (ד) הראו ש-$\overline S=\mathbb{R}$.
    answer: >-
      כן. $g_N\in S$ חיובי ושואף ל-$0$; כל כפולה טבעית של איבר של $S$ נמצאת ב-$S$, כי $k(\sqrt[3]n-\sqrt[3]m)=\sqrt[3]{k^3n}-\sqrt[3]{k^3m}$;
      לכן $kg_N$ עם $k=\lfloor\sqrt2/g_N\rfloor$ נמצא ב-$S$ במרחק פחות מ-$g_N$ מ-$\sqrt2$. באותו אופן כל מספר ממשי הוא
      גבול של סדרה מ-$S$.
    solution:
      - kind: given
        text: >-
          $S=\{\sqrt[3]n-\sqrt[3]m:\ n,m\ge0\}$, $n,m$ שלמים.
      - kind: goal
        text: >-
          סדרה $x_j\in S$ עם $x_j\to\sqrt2$. לפי משפט 1.5.7(א), זה בדיוק $\sqrt2\in\overline S$.
      - kind: idea
        text: >-
          שתי עובדות הופכות את $S$ ל"צפופה": יש בה מספרים חיוביים קטנים כרצוננו, ויש בה כל כפולה טבעית של כל איבר
          שלה. הכפולות של איבר זעיר הן סולם עם שלבים זעירים, שמגיע לכל מספר חיובי.
      - kind: step
        text: >-
          (א) נסמן $a=\sqrt[3]{N+1}$ ו-$b=\sqrt[3]N$, כך ש-$a>b>0$. מנוסחת ההפרש של חזקות שלישיות,
          $1=a^3-b^3=(a-b)(a^2+ab+b^2)$, ולכן $g_N=a-b=\frac{1}{a^2+ab+b^2}>0$.
      - kind: step
        text: >-
          $a>b$ נותן $a^2+ab+b^2>b^2+b^2+b^2=3N^{2/3}$, ולכן $g_N<\frac{1}{3N^{2/3}}$. בפרט $g_N\to0$, וכל $g_N$ ב-$S$
          (עם $n=N+1$, $m=N$).
      - kind: step
        text: >-
          (ב) ל-$k\in\mathbb{N}$: $k=\sqrt[3]{k^3}$, ולכן $k(\sqrt[3]n-\sqrt[3]m)=\sqrt[3]{k^3n}-\sqrt[3]{k^3m}$, ו-$k^3n$, $k^3m$
          שלמים אי-שליליים. לכן $kx\in S$.
      - kind: step
        text: >-
          (ג) יהי $j\in\mathbb{N}$. לפי (א) יש $N$ עם $g_N<\frac1j$. נסמן $k=\lfloor\sqrt2/g_N\rfloor$; מכיוון
          ש-$g_N<\frac13<\sqrt2$, $k\ge1$, כלומר $k\in\mathbb{N}$. נגדיר $x_j=kg_N$; לפי (ב) $x_j\in S$.
      - kind: step
        text: >-
          מהגדרת הערך השלם, $kg_N\le\sqrt2<(k+1)g_N$, כלומר $0\le\sqrt2-x_j<g_N<\frac1j$. לכן $x_j\to\sqrt2$.
      - kind: check
        text: >-
          $N=1000$: $g=\sqrt[3]{1001}-10\approx0.0033322$, מתחת לחסם $\frac1{300}\approx0.0033333$. $k=424$,
          ו-$x=424g\approx1.4128625=\sqrt[3]{76301249024}-\sqrt[3]{76225024000}$ (כי $424^3=76225024$),
          ו-$\sqrt2-x\approx0.00135<g$.
      - kind: step
        text: >-
          (ד) אותו טיעון עם כל $t>0$ במקום $\sqrt2$ נותן סדרה מ-$S$ ששואפת ל-$t$, עם $k=\lfloor t/g_N\rfloor$. כש-$t$
          קטן ייתכן $k=0$; אז $x_j=0$, וגם $0\in S$ ($n=m=0$), וההערכה $0\le t-x_j<g_N$ עדיין נכונה. בנוסף, $S$ מכילה
          את הנגדי של כל איבר שלה (מחליפים את $n$ ו-$m$), ולכן ל-$t<0$ לוקחים את הנגדיים של סדרה ששואפת ל-$-t$. כל מספר
          ממשי הוא גבול של סדרה מ-$S$, ולכן לפי משפט 1.5.7(א) $\overline S=\mathbb{R}$.
      - kind: result
        text: >-
          כן: יש סדרה ב-$S$ ששואפת ל-$\sqrt2$, ובעצם $\overline S=\mathbb{R}$.
