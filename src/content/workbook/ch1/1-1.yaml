# Workbook of lesson 1.1 — metric spaces: definition and examples.
# Objectives (src/course.ts):
#   OBJ-1.1-1  state the three axioms of a metric and check them, the triangle inequality in particular
#   OBJ-1.1-2  the basic examples: Euclidean, discrete, sum and max metrics on R^n, the sup metric on B(X)
#   OBJ-1.1-3  find the axiom that fails for a function that is not a metric (squared difference)
# Rebuilt 2026-11-10 on the formal spine (numbered results 1.1.1–1.1.13 of the lesson); W-07 is new (the reverse
# triangle inequality it used to ask for is now Lemma 1.1.2(b)). Fix round 2026-11-10: W-03(b) is now
# |x/(1+|x|) − y/(1+|y|)|, W-08 is now the weighted sequence metric D (the integral metric is lesson 1.2's
# Lemma 1.2.19 / Prop 1.2.20–1.2.21). Every number recomputed with npx tsx (src/math/multivar.ts pDist, direct
# evaluation) on 2026-11-10. Fix round 2026-11-11 (student read): W-09's metrics are δ1, δ2 (D was W-08's), W-10(b)'s
# function is η, Prop 1.1.13 is cited as g: S → X, "לא-יורדת" everywhere, and c2(b) proves the concavity of
# t/(1+t) by Lagrange instead of quoting "φ'' ≤ 0 ⇒ concave".
lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    objectives: [OBJ-1.1-2]
    prompt: >-
      ב-$\mathbb{R}^4$, $x=(2,-1,0,5)$ ו-$y=(-1,3,0,1)$. חשבו את $d_1(x,y)$, $d_2(x,y)$ ו-$d_\infty(x,y)$,
      ובדקו את התוצאה מול למה 1.1.6.
    answer: >-
      $d_1=11$, $d_2=\sqrt{41}\approx6.403$, $d_\infty=4$; ואכן $4\le6.403\le11\le16$.
    solution:
      - kind: definition
        text: >-
          לפי טענות 1.1.4 ו-1.1.5: $d_1=\sum|x_i-y_i|$, $d_2=\sqrt{\sum(x_i-y_i)^2}$, $d_\infty=\max_i|x_i-y_i|$.
      - kind: computation
        text: >-
          ההפרשים בערך מוחלט, קואורדינטה אחר קואורדינטה: $|2-(-1)|=3$, $|-1-3|=4$, $|0-0|=0$, $|5-1|=4$.
      - kind: computation
        text: >-
          $d_1=3+4+0+4=11$. $d_2=\sqrt{9+16+0+16}=\sqrt{41}\approx6.403$. $d_\infty=\max(3,4,0,4)=4$.
      - kind: check
        text: >-
          למה 1.1.6 עם $n=4$: $d_\infty\le d_2\le d_1\le4\,d_\infty$, כלומר $4\le6.403\le11\le16$. קואורדינטה
          שבה הנקודות שוות (כאן השלישית) לא תורמת לאף אחת מהמטריקות.
      - kind: result
        text: >-
          $11$, $\sqrt{41}$, $4$.

  - id: W-1.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      על $X=\{a,b,c\}$ מגדירים $d(u,u)=0$ לכל $u$, $d$ סימטרית, ו-$d(a,b)=2$, $d(b,c)=3$, $d(a,c)=6$.

      (א) האם $d$ מטריקה?

      (ב) מצאו את כל הערכים של $d(a,c)$ (כשהשאר נשאר כמו שהוא) שבהם $d$ מטריקה, והוכיחו.
    answer: >-
      (א) לא: $d(a,c)=6>5=d(a,b)+d(b,c)$. (ב) $1\le d(a,c)\le5$.
    solution:
      - kind: idea
        text: >-
          (M1) ו-(M2) נקבעים מהטבלה. ב-(M3) שלשה עם נקודה חוזרת לא יכולה להיכשל, ולכן נשארים שלושה אי-שוויונים: כל
          צלע לכל היותר סכום שתי האחרות.
      - kind: step
        text: >-
          (א) (M3) עם $x=a$, $y=b$, $z=c$ דורש $6\le2+3$, וזה שקרי. לכן $d$ אינה מטריקה.
      - kind: step
        text: >-
          (ב) נסמן $t=d(a,c)$. (M1) דורש $t>0$, כי $a\ne c$; (M2) מתקיים מההגדרה. ב-(M3), אם $x=y$ או $y=z$ האי-שוויון
          הוא $d(x,z)\le d(x,z)$, ואם $x=z$ הוא $0\le2d(x,y)$. שניהם נכונים.
      - kind: step
        text: >-
          לשלשות של שלוש נקודות שונות, לפי (M2) מספיק לבדוק כל צלע מול סכום השתיים האחרות: $t\le2+3$, $2\le t+3$,
          $3\le t+2$. כלומר $t\le5$ ו-$t\ge1$; התנאי האמצעי נובע מ-$t>0$.
      - kind: check
        text: >-
          בשני הקצוות יש שוויון, כמו שלוש נקודות על ישר אחד. ב-$t=5$: $a=0$, $b=2$, $c=5$ על $\mathbb{R}$ ($b$
          באמצע). ב-$t=1$: $b=0$, $a=2$, $c=3$ ($a$ באמצע, ו-$d(b,c)=3=2+1$).
      - kind: result
        text: >-
          (א) לא מטריקה. (ב) מטריקה בדיוק כש-$1\le d(a,c)\le5$.

  - id: W-1.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      לכל פונקציה, הוכיחו או הפריכו שהיא מטריקה על $\mathbb{R}$. אם לא, ציינו אקסיומה שנכשלת עם דוגמה נגדית
      ($\lfloor x\rfloor$ הוא החלק השלם של $x$).

      (א) $d(x,y)=x-y$

      (ב) $d(x,y)=\Big|\dfrac{x}{1+|x|}-\dfrac{y}{1+|y|}\Big|$

      (ג) $d(x,y)=\big|\lfloor x\rfloor-\lfloor y\rfloor\big|$
    answer: >-
      (א) לא: $d(0,1)=-1<0$, וגם (M2) נכשל. (ב) מטריקה, לפי טענה 1.1.13(ב), כי $g(x)=\frac{x}{1+|x|}$ חד-חד-ערכית.
      (ג) לא: $d(0,\frac12)=0$.
    solution:
      - kind: step
        text: >-
          (א) (M1) נכשל: $d(0,1)=-1<0$. גם (M2) נכשל: $d(1,0)=1\ne-1=d(0,1)$.
      - kind: theorem
        text: >-
          טענה 1.1.13: לכל קבוצה לא ריקה $S$, מרחב מטרי $(X,d)$ והעתקה $g:S\to X$, הפונקציה
          $d_g(u,u')=d(g(u),g(u'))$ אי-שלילית, מקיימת $d_g(u,u)=0$, ומקיימת את (M2) ואת (M3) (חלק (א)); והיא מטריקה
          אם ורק אם $g$ חד-חד-ערכית (חלק (ב)).
      - kind: idea
        text: >-
          (ב) היא $d_g$ עם $S=X=\mathbb{R}$, המטריקה $|s-t|$ על $\mathbb{R}$, ו-$g(x)=\frac{x}{1+|x|}$. כל העבודה היא להוכיח ש-$g$
          חד-חד-ערכית: הסימן של $g(x)$ הוא הסימן של $x$, והערך המוחלט שלה קובע את $|x|$.
      - kind: step
        text: >-
          (ב) נניח $g(x)=g(y)$. המכנים חיוביים, ולכן ל-$g(x)$ אותו סימן כמו ל-$x$ (חיובי, אפס או שלילי), וכך גם
          ל-$g(y)$ ול-$y$; לכן ל-$x$ ול-$y$ אותו סימן. בערך מוחלט: $\frac{|x|}{1+|x|}=\frac{|y|}{1+|y|}$, כלומר
          $|x|(1+|y|)=|y|(1+|x|)$, ואחרי צמצום $|x||y|$ משני האגפים $|x|=|y|$. מספרים עם אותו סימן ואותו ערך מוחלט
          שווים: $x=y$. לפי טענה 1.1.13(ב), $d$ מטריקה.
      - kind: step
        text: >-
          (ג) $x\mapsto\lfloor x\rfloor$ אינה חד-חד-ערכית: $\lfloor0\rfloor=\lfloor\frac12\rfloor=0$, ולכן
          $d(0,\frac12)=0$ אף ש-$0\ne\frac12$. (M1) נכשל, כמו שטענה 1.1.13(ב) מנבאת. (M2) ו-(M3) מתקיימים, לפי
          טענה 1.1.13(א).
      - kind: check
        text: >-
          ב-(ב): $d(0,1)=\frac12$, $d(-1,1)=1$, $d(-3,3)=\frac32$. כל הערכים של $g$ ב-$(-1,1)$, ולכן כל המרחקים
          קטנים מ-$2$, אף ש-$\mathbb{R}$ אינה חסומה במטריקה הרגילה.
      - kind: result
        text: >-
          (א) לא ((M1), (M2)); (ב) כן; (ג) לא ((M1)).

  - id: W-1.1-04
    level: mid
    objectives: [OBJ-1.1-2]
    prompt: >-
      חשבו את המרחק במטריקת הסופרמום:

      (א) בין $f(x)=e^x$ ל-$g(x)=1+x$ ב-$C[0,1]$.

      (ב) בין $f(x)=x$ ל-$g(x)=x^2$ ב-$C[0,2]$.
    answer: >-
      (א) $e-2\approx0.718$. (ב) $2$.
    solution:
      - kind: theorem
        text: >-
          לפי טענה 1.1.8(ב) (משפט ויירשטראס), ב-$C[a,b]$ מתקיים $d_\infty(f,g)=\max_{[a,b]}|f-g|$: מחפשים
          את המקסימום של $|h|$, $h=f-g$, בנקודות קריטיות ובקצוות.
      - kind: computation
        text: >-
          (א) $h(x)=e^x-1-x$, $h'(x)=e^x-1\ge0$ על $[0,1]$, ולכן $h$ לא-יורדת. $h(0)=0$, ולכן $h\ge0$ ו-$|h|=h$.
          המקסימום בקצה הימני: $h(1)=e-2\approx0.718$.
      - kind: computation
        text: >-
          (ב) $h(x)=x-x^2$. על $[0,1]$: $h\ge0$, ומקסימום $\tfrac14$ ב-$x=\tfrac12$. על $[1,2]$: $|h|=x^2-x$, עולה,
          ובקצה $x=2$ שווה $2$. לכן $\max_{[0,2]}|h|=\max(\tfrac14,\ 2)=2$.
      - kind: check
        text: >-
          ב-(ב) המקסימום בקצה, ובזוג $\sin,\cos$ על $[0,\pi]$ (בשיעור) הוא היה בנקודה פנימית: אין כלל קבוע, צריך
          לבדוק את שניהם.
      - kind: result
        text: >-
          (א) $e-2$. (ב) $2$.

  - id: W-1.1-05
    level: mid
    objectives: [OBJ-1.1-1]
    prompt: >-
      על $\mathbb{R}^2$ מגדירים ("מטריקת הרכבת": כל נסיעה עוברת דרך התחנה המרכזית $0$)
      $d(x,y)=d_2(x,0)+d_2(y,0)$ אם $x\ne y$, ו-$d(x,x)=0$. הוכיחו ש-$d$ מטריקה.
    answer: >-
      (M1) ו-(M2) מההגדרה ומ-(M1) של $d_2$; (M3) בחלוקה למקרים לפי אילו מהנקודות שוות.
    solution:
      - kind: given
        text: >-
          $d_2$ מטריקה על $\mathbb{R}^2$ (טענה 1.1.5). נכתוב $r(x)=d_2(x,0)\ge0$; לפי (M1) של $d_2$, $r(x)=0$ רק
          כש-$x=0$.
      - kind: step
        text: >-
          (M1) $d\ge0$ כסכום של אי-שליליים, ו-$d(x,x)=0$ מההגדרה. אם $x\ne y$, לפחות אחת מהן אינה $0$, ולכן
          $d(x,y)=r(x)+r(y)>0$. (M2) הביטוי $r(x)+r(y)$ סימטרי, והתנאי $x\ne y$ סימטרי.
      - kind: idea
        text: >-
          ל-(M3), $d(x,z)\le d(x,y)+d(y,z)$, מחלקים לפי אילו נקודות שוות. אם $x=z$ האגף השמאלי $0$. אחרת
          $d(x,z)=r(x)+r(z)$, ובכל המקרים האגף הימני "מכיל" את שני המחוברים האלה.
      - kind: step
        text: >-
          נניח $x\ne z$. אם $y=x$, האגף הימני $0+d(x,z)$. אם $y=z$, הוא $d(x,z)+0$. אחרת $y$ שונה משתיהן, והאגף
          הימני $r(x)+r(y)+r(y)+r(z)\ge r(x)+r(z)=d(x,z)$, כי $r(y)\ge0$.
      - kind: check
        text: >-
          שתי נקודות על אותה קרן מהראשית, $(1,0)$ ו-$(2,0)$: המרחק $3$, לא $1$, כי הנסיעה עוברת דרך $0$.
      - kind: result
        text: >-
          $d$ מטריקה על $\mathbb{R}^2$.

  - id: W-1.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      על $\mathbb{R}^2$, הוכיחו או הפריכו:

      (א) $d(x,y)=|x_1-y_1|+2|x_2-y_2|$ היא מטריקה.

      (ב) $d(x,y)=\max\big(|x_1-y_1|,\ (x_2-y_2)^2\big)$ היא מטריקה.
    answer: >-
      (א) נכון. (ב) לא נכון: (M3) נכשל ב-$(0,0)$, $(0,1)$, $(0,2)$.
    solution:
      - kind: idea
        text: >-
          (א) כמו ההוכחה של $d_1$ בטענה 1.1.4, עם משקל בקואורדינטה השנייה. (ב) לאורך הציר $x_1=0$ הפונקציה היא
          ריבוע ההפרש, ולכן טענה 1.1.10 צריכה להפריך אותה.
      - kind: step
        text: >-
          (א) (M1) סכום של שני מספרים אי-שליליים, והוא $0$ רק אם שניהם $0$, כלומר $x_1=y_1$ ו-$x_2=y_2$. (M2) כל
          מחובר סימטרי. (M3) בכל קואורדינטה $|x_i-z_i|\le|x_i-y_i|+|y_i-z_i|$ (אינפי 1); כופלים את אי-השוויון של
          $i=2$ ב-$2>0$ ומחברים.
      - kind: step
        text: >-
          (ב) (M1) ו-(M2) מתקיימים: המקסימום של שני אי-שליליים הוא $0$ רק אם שניהם $0$, ושני הרכיבים סימטריים.
          אבל ב-$x=(0,0)$, $y=(0,1)$, $z=(0,2)$: $d(x,z)=\max(0,4)=4$, ואילו $d(x,y)+d(y,z)=1+1=2$.
      - kind: check
        text: >-
          ב-(ב) על הנקודות $(0,t)$ הפונקציה היא בדיוק $(t-s)^2$, ולפי טענה 1.1.10 כל $y$ שנמצאת ממש בין $x$ ל-$z$
          על הציר הזה נותנת עקיפה קצרה.
      - kind: result
        text: >-
          (א) מטריקה; (ב) לא, (M3) נכשל.

  - id: W-1.1-07
    level: mid
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      $\rho$ ו-$\sigma$ מטריקות על קבוצה $X$, ו-$c>0$.

      (א) הוכיחו ש-$c\rho$ ו-$m=\max(\rho,\sigma)$ הן מטריקות על $X$.

      (ב) על $\mathbb{R}$, $\rho(x,y)=|x-y|$ ו-$\sigma$ המטריקה הבדידה. הראו ש-$m=\max(\rho,\sigma)$ שונה גם מ-$\rho$
      וגם מ-$\sigma$, וכתבו נוסחה ל-$m$.
    answer: >-
      (א) (M3) של כל אחת חסום על ידי $m(x,y)+m(y,z)$. (ב) $m(x,y)=\max(|x-y|,1)$ ל-$x\ne y$ ו-$0$ ל-$x=y$;
      $m(0,\frac12)=1\ne\frac12$ ו-$m(0,2)=2\ne1$.
    solution:
      - kind: idea
        text: >-
          מקסימום של שני מספרים קטן או שווה למספר שחוסם את שניהם. לכן מספיק לחסום את $\rho(x,z)$ ואת $\sigma(x,z)$
          באותו ביטוי $m(x,y)+m(y,z)$.
      - kind: step
        text: >-
          (א) $c\rho$: (M1) $c\rho\ge0$, ו-$c\rho(x,y)=0$ אם ורק אם $\rho(x,y)=0$ (כי $c\ne0$), אם ורק אם $x=y$. (M2)
          מ-(M2) של $\rho$. (M3) כופלים את (M3) של $\rho$ ב-$c>0$, וזה שומר על כיוון אי-השוויון.
      - kind: step
        text: >-
          $m$: (M1) $m\ge\rho\ge0$; אם $x=y$ שני המרחקים $0$; ואם $m(x,y)=0$ אז $0\le\rho(x,y)\le m(x,y)=0$, ולפי (M1)
          של $\rho$, $x=y$. (M2) מ-(M2) של שתיהן.
      - kind: step
        text: >-
          (M3) לפי (M3) של $\rho$, ומפני ש-$\rho\le m$: $\rho(x,z)\le\rho(x,y)+\rho(y,z)\le m(x,y)+m(y,z)$. לפי (M3)
          של $\sigma$, ומפני ש-$\sigma\le m$: $\sigma(x,z)\le\sigma(x,y)+\sigma(y,z)\le m(x,y)+m(y,z)$. לכן גם הגדול מביניהם,
          $m(x,z)$, קטן או שווה ל-$m(x,y)+m(y,z)$.
      - kind: computation
        text: >-
          (ב) ל-$x\ne y$, $\sigma(x,y)=1$, ולכן $m(x,y)=\max(|x-y|,1)$; ו-$m(x,x)=0$. ב-$(0,\frac12)$:
          $m=1\ne\frac12=\rho$. ב-$(0,2)$: $m=2\ne1=\sigma$.
      - kind: check
        text: >-
          לפי (א), $m$ מטריקה. בה נקודות קרובות נמצאות במרחק $1$ כמו בבדידה, ונקודות רחוקות במרחק $|x-y|$ כמו בישר.
          המינימום, לעומת זאת, אינו בהכרח מטריקה (דוגמה 4 בשיעור).
      - kind: result
        text: >-
          (א) $c\rho$ ו-$\max(\rho,\sigma)$ מטריקות. (ב) $m(x,y)=\max(|x-y|,1)$ ל-$x\ne y$, שונה משתיהן.

  - id: W-1.1-08
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      תהי $S$ קבוצת **כל** הסדרות הממשיות $x=(x_k)_{k\in\mathbb{N}}$, חסומות או לא. מגדירים

      $$D(x,y)=\sum_{k=1}^\infty 2^{-k}\,\frac{|x_k-y_k|}{1+|x_k-y_k|}.$$

      (א) הוכיחו שהטור מתכנס, ש-$D$ מטריקה על $S$, ושכל ערכיה קטנים מ-$1$.

      (ב) על הסדרות החסומות, $B(\mathbb{N})\subseteq S$, הוכיחו ש-$D(x,y)\le d_\infty(x,y)$.

      (ג) הוכיחו שאין קבוע $C$ כך ש-$d_\infty(x,y)\le C\,D(x,y)$ לכל $x,y\in B(\mathbb{N})$.
    answer: >-
      (א) כל מחובר בין $0$ ל-$2^{-k}$; (M3) מחובר אחר מחובר לפי מסקנה 1.1.12. (ב) $\frac{t}{1+t}\le t\le d_\infty$ וסכום
      $2^{-k}$ הוא $1$. (ג) $e^{(n)}$ (אחד במקום $n$, אפס בשאר): $d_\infty(e^{(n)},0)=1$ ו-$D(e^{(n)},0)=2^{-n-1}$.
    solution:
      - kind: theorem
        text: >-
          מאינפי 1: טור של מספרים אי-שליליים שאיבריו חסומים באיברי טור מתכנס מתכנס (מבחן ההשוואה), וסכומו חסום בסכום
          החוסם; $\sum_{k=1}^\infty2^{-k}=1$; ואם $a_k\le b_k+c_k$ לכל $k$ ושלושת הטורים מתכנסים, אז
          $\sum a_k\le\sum b_k+\sum c_k$ (מעבר לגבול בסכומים החלקיים, ואריתמטיקה של גבולות).
      - kind: idea
        text: >-
          לכל $k$, $\sigma(s,t)=\frac{|s-t|}{1+|s-t|}$ היא מטריקה על $\mathbb{R}$ (מסקנה 1.1.12 עם $d=|\cdot|$), שערכיה
          ב-$[0,1)$. $D$ היא סכום משוקלל שלהן לאורך הקואורדינטות, כמו $d_1$ בטענה 1.1.4, והמשקלים $2^{-k}$ מבטיחים
          התכנסות גם לסדרות לא חסומות.
      - kind: step
        text: >-
          (א) **התכנסות וחסם.** נסמן $a_k=2^{-k}\sigma(x_k,y_k)$. אז $0\le a_k<2^{-k}$, ולפי מבחן ההשוואה הטור מתכנס,
          ו-$D(x,y)\le1$. החסם חזק: $D(x,y)=\sum2^{-k}-\sum\big(2^{-k}-a_k\big)=1-\sum\big(2^{-k}-a_k\big)$, וכל
          מחובר בטור האחרון חיובי, ולכן סכומו לפחות המחובר הראשון, $2^{-1}-a_1>0$. לכן $D(x,y)<1$.
      - kind: step
        text: >-
          **(M1)** $D\ge0$ כסכום של אי-שליליים, ו-$D(x,x)=0$. אם $D(x,y)=0$, אז לכל $k$, $0\le a_k\le D(x,y)=0$ (מחובר
          אחד של טור אי-שלילי לא גדול מסכומו), ולכן $\sigma(x_k,y_k)=0$, ולפי (M1) של $\sigma$, $x_k=y_k$. לכן $x=y$.
          **(M2)** כל מחובר סימטרי.
      - kind: step
        text: >-
          **(M3)** לכל $k$, לפי (M3) של $\sigma$ וכפל במספר החיובי $2^{-k}$:
          $2^{-k}\sigma(x_k,z_k)\le2^{-k}\sigma(x_k,y_k)+2^{-k}\sigma(y_k,z_k)$. שלושת הטורים מתכנסים, ולפי
          המשפט שצוטט $D(x,z)\le D(x,y)+D(y,z)$.
      - kind: step
        text: >-
          (ב) יהיו $x,y\in B(\mathbb{N})$ ו-$t_k=|x_k-y_k|\le d_\infty(x,y)$. מכיוון ש-$1+t_k\ge1$,
          $\frac{t_k}{1+t_k}\le t_k\le d_\infty(x,y)$. לכן $a_k\le2^{-k}d_\infty(x,y)$, ולפי מבחן ההשוואה
          $D(x,y)\le d_\infty(x,y)\sum2^{-k}=d_\infty(x,y)$.
      - kind: computation
        text: >-
          (ג) $e^{(n)}$ היא הסדרה עם $1$ במקום $n$ ו-$0$ בשאר המקומות, והיא חסומה. $d_\infty(e^{(n)},0)=1$. ב-$D$ רק
          המחובר $k=n$ שונה מאפס: $D(e^{(n)},0)=2^{-n}\cdot\frac{1}{1+1}=2^{-n-1}$.
      - kind: step
        text: >-
          נניח שיש $C$ עם $d_\infty\le C\,D$ על כל הזוגות. עם $e^{(n)}$ ו-$0$: $1\le C\,2^{-n-1}$, כלומר $2^{n+1}\le C$
          לכל $n\in\mathbb{N}$. אבל $2^{n+1}\ge n$ (אינדוקציה), ולפי תכונת ארכימדס יש $n>C$; סתירה.
      - kind: check
        text: >-
          הסדרה הקבועה $1$ והסדרה $0$: $D=\sum2^{-k}\cdot\frac12=\frac12\le1=d_\infty$, כמו ב-(ב). ו-$e^{(10)}$ נותנת
          $D=2^{-11}\approx0.00049$ מול $d_\infty=1$: ב-$D$ הבדל בקואורדינטה רחוקה כמעט לא נספר, וב-$d_\infty$ הוא נספר
          במלואו.
      - kind: result
        text: >-
          (א) $D$ מטריקה על כל הסדרות, עם ערכים ב-$[0,1)$. (ב) $D\le d_\infty$ על $B(\mathbb{N})$. (ג) אין $C$ עם
          $d_\infty\le C\,D$.

  - id: W-1.1-09
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      יהיו $(X_1,\rho_1),\dots,(X_n,\rho_n)$ מרחבים מטריים. על המכפלה $X=X_1\times\dots\times X_n$ מגדירים
      $\delta_1(x,y)=\sum_{i=1}^n \rho_i(x_i,y_i)$ ו-$\delta_2(x,y)=\sqrt{\sum_{i=1}^n \rho_i(x_i,y_i)^2}$.

      (א) הוכיחו ש-$\delta_1$ מטריקה על $X$.

      (ב) כש-$X_i=\{0,1\}$ עם המטריקה הבדידה, $\delta_1(x,y)$ הוא מספר המקומות שבהם $x$ ו-$y$ שונות. חשבו את
      $\delta_1$ בין $10110$ ל-$01100$ (מחרוזות של אפסים ואחדים באורך 5).

      (ג) מה המטריקות $\delta_1$ ו-$\delta_2$ כש-$X_i=\mathbb{R}$ עם $\rho_i(s,t)=|s-t|$?

      (ד) הוכיחו ש-$\delta_2$ מטריקה על $X$.
    answer: >-
      (א) כל אקסיומה בכל קואורדינטה, וסוכמים. (ב) $3$. (ג) $d_1$ ו-$d_2$ על $\mathbb{R}^n$. (ד) (M3) של כל $\rho_i$,
      ואחריו (M3) של $d_2$ על $\mathbb{R}^n$ (טענה 1.1.5).
    solution:
      - kind: idea
        text: >-
          כמו ההוכחה של $d_1$ בטענה 1.1.4: בכל קואורדינטה יש מטריקה, וסכום של אי-שוויונים הוא אי-שוויון. ל-$\delta_2$
          מעבירים את וקטור המרחקים ל-$\mathbb{R}^n$ ומשתמשים בטענה 1.1.5.
      - kind: step
        text: >-
          (א) (M1) $\delta_1$ סכום של אי-שליליים, והוא $0$ אם ורק אם כל מחובר $0$, אם ורק אם (לפי (M1) של כל $\rho_i$)
          $x_i=y_i$ לכל $i$, כלומר $x=y$. (M2) כל מחובר סימטרי. (M3) לכל $i$,
          $\rho_i(x_i,z_i)\le\rho_i(x_i,y_i)+\rho_i(y_i,z_i)$; סוכמים על $i$.
      - kind: computation
        text: >-
          (ב) משווים מקום אחר מקום: $1/0$ שונה, $0/1$ שונה, $1/1$ שווה, $1/0$ שונה, $0/0$ שווה. שלושה מקומות שונים:
          $\delta_1=3$.
      - kind: check
        text: >-
          (M3) ב-(ב) דרך $11111$: $\delta_1(10110,11111)=2$ ו-$\delta_1(11111,01100)=3$, ו-$3\le2+3$.
      - kind: step
        text: >-
          (ג) $\delta_1(x,y)=\sum|x_i-y_i|=d_1(x,y)$ ו-$\delta_2(x,y)=\sqrt{\sum(x_i-y_i)^2}=d_2(x,y)$: מטריקת הסכום והמטריקה
          האוקלידית של טענות 1.1.4 ו-1.1.5 הן המקרים הפרטיים האלה.
      - kind: step
        text: >-
          (ד) (M1) ו-(M2) כמו ב-(א), כי סכום ריבועים של אי-שליליים הוא $0$ רק אם כולם $0$. ל-(M3) נסמן
          $a_i=\rho_i(x_i,y_i)$, $b_i=\rho_i(y_i,z_i)$, $c_i=\rho_i(x_i,z_i)$, כולם אי-שליליים. לפי (M3) של $\rho_i$,
          $0\le c_i\le a_i+b_i$, ולכן $c_i^2\le(a_i+b_i)^2$ ו-$\delta_2(x,z)=\sqrt{\sum c_i^2}\le\sqrt{\sum(a_i+b_i)^2}$.
      - kind: step
        text: >-
          נסתכל על $a=(a_1,\dots,a_n)$ ו-$-b=(-b_1,\dots,-b_n)$ כווקטורים ב-$\mathbb{R}^n$. הקואורדינטה ה-$i$ של
          $a-(-b)$ היא $a_i-(-b_i)=a_i+b_i$, ולכן $\sqrt{\sum(a_i+b_i)^2}=d_2(a,-b)$, המרחק האוקלידי ביניהם. לפי (M3)
          של $d_2$ (טענה 1.1.5) דרך הראשית:
          $d_2(a,-b)\le d_2(a,0)+d_2(0,-b)=\sqrt{\sum a_i^2}+\sqrt{\sum b_i^2}=\delta_2(x,y)+\delta_2(y,z)$.
      - kind: check
        text: >-
          איפה היה צריך את אי-השליליות? בהעלאה בריבוע של $c_i\le a_i+b_i$: בלי $c_i\ge0$ היא לא שומרת על הכיוון. וב-(ג)
          זה בדיוק (M3) של $d_2$, כמו שצריך.
      - kind: result
        text: >-
          (א) $\delta_1$ מטריקה. (ב) $3$. (ג) $d_1$ ו-$d_2$. (ד) $\delta_2$ מטריקה.

  - id: W-1.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      על $\mathbb{R}$, הוכיחו או הפריכו:

      (א) $d(x,y)=|x-y|+|x^2-y^2|$ היא מטריקה.

      (ב) $\eta(x,y)=|x-y|+(x-y)^2$ היא מטריקה.
    answer: >-
      (א) נכון. (ב) לא נכון: $\eta(0,2)=6>4=\eta(0,1)+\eta(1,2)$.
    solution:
      - kind: idea
        text: >-
          (א) $|x^2-y^2|$ אינה מטריקה, אבל היא מקיימת את (M2), את (M3) ואת האי-שליליות (טענה 1.1.13(א), עם $g(x)=x^2$), וחסר
          לה רק הכיוון "$0$ גורר שוויון" של (M1). את הכיוון הזה נותן המחובר $|x-y|$. (ב) המחובר השני מפר את (M3)
          (טענה 1.1.10), ומספיק שהוא "מנצח".
      - kind: step
        text: >-
          (א) (M1) $d\ge0$ כסכום של אי-שליליים, $d(x,x)=0$, ו-$d(x,y)=0$ גורר $|x-y|=0$, כלומר $x=y$. (M2) שני
          המחוברים סימטריים. (M3) $|x-y|$ ו-$|x^2-y^2|$ מקיימות את (M3), כל אחת מהצורה $|g(x)-g(y)|$ (טענה 1.1.13(א),
          עם $g(x)=x$ ו-$g(x)=x^2$); מחברים את שני אי-השוויונים.
      - kind: computation
        text: >-
          (ב) $\eta(0,2)=2+4=6$, ואילו $\eta(0,1)+\eta(1,2)=(1+1)+(1+1)=4$. (M3) נכשל.
      - kind: check
        text: >-
          הכישלון ב-(ב) אינו רק במרחקים גדולים: $\eta(0,0.2)=0.24$, ואילו $\eta(0,0.1)+\eta(0.1,0.2)=0.22$. באופן
          כללי, עם $a=y-x$ ו-$b=z-y$ באותו סימן ושונים מאפס, החלק הלינארי נותן שוויון והריבועי נותן עודף $2ab>0$
          (שלב 3 של טענה 1.1.10), ולכן כל נקודה ממש באמצע הדרך מקצרת.
      - kind: result
        text: >-
          (א) מטריקה. (ב) לא מטריקה: (M3) נכשל.
challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      תהי $X$ קבוצה, ותהי $d:X\times X\to\mathbb{R}$ פונקציה (לא מניחים מראש שערכיה אי-שליליים) שמקיימת שני
      תנאים: $(\ast)$ $d(x,y)=0$ אם ורק אם $x=y$; ו-$(\ast\ast)$ $d(x,z)\le d(x,y)+d(z,y)$ לכל $x,y,z\in X$.
      שימו לב לסדר במחובר השני: $d(z,y)$, ולא $d(y,z)$.

      (א) הוכיחו ש-$d$ מטריקה: ערכיה אי-שליליים, היא סימטרית, והיא מקיימת את אי-שוויון המשולש הרגיל.

      (ב) מפרקים את ההגדרה של מטריקה לארבעה תנאים: (1) $d(x,x)=0$ לכל $x$; (2) $d(x,y)>0$ כש-$x\ne y$;
      (3) סימטריה; (4) אי-שוויון המשולש. לכל אחד מארבעת התנאים מצאו פונקציה $d:\mathbb{R}\times\mathbb{R}\to\mathbb{R}$
      שמקיימת את שלושת האחרים ונכשלת בו.
    answer: >-
      (א) מציבים ב-$(\ast\ast)$ נקודות חוזרות: $a=c=x$ ו-$b=y$ נותן $d\ge0$; $a=b=y$ ו-$c=x$ נותן סימטריה; ואז
      $(\ast\ast)$ הוא המשולש הרגיל. (ב) (1) $|x-y|+1$; (2) $d\equiv0$; (3) $\max\big(y-x,\ 2(x-y)\big)$;
      (4) $(x-y)^2$.
    solution:
      - kind: given
        text: >-
          $d:X\times X\to\mathbb{R}$ עם $(\ast)$: $d(x,y)=0$ אם ורק אם $x=y$, ועם $(\ast\ast)$:
          $d(a,c)\le d(a,b)+d(c,b)$ לכל שלוש נקודות $a,b,c\in X$ (כתבנו את $(\ast\ast)$ באותיות אחרות, כדי שיהיה
          נוח להציב בו).
      - kind: goal
        text: >-
          (א) $d(x,y)\ge0$, $d(x,y)=d(y,x)$ ו-$d(x,z)\le d(x,y)+d(y,z)$ לכל $x,y,z$. (ב) ארבע פונקציות, כל אחת
          נכשלת בתנאי אחד בדיוק.
      - kind: idea
        text: >-
          $(\ast\ast)$ נכון לכל שלוש נקודות, גם כששתיים מהן שוות. בחירה נכונה של נקודות חוזרות הופכת אותו לכל אחת
          מהאקסיומות החסרות. הסדר חשוב: קודם אי-שליליות, אחר כך סימטריה, ורק בעזרת הסימטריה המשולש הרגיל.
      - kind: step
        text: >-
          **אי-שליליות.** נציב ב-$(\ast\ast)$ את $a=x$, $b=y$, $c=x$: $d(x,x)\le d(x,y)+d(x,y)$. לפי $(\ast)$,
          $d(x,x)=0$, ולכן $0\le2d(x,y)$, כלומר $d(x,y)\ge0$.
      - kind: step
        text: >-
          **סימטריה.** נציב ב-$(\ast\ast)$ את $a=y$, $b=y$, $c=x$: $d(y,x)\le d(y,y)+d(x,y)=d(x,y)$, כי $d(y,y)=0$.
          זה נכון לכל שתי נקודות, ולכן גם אחרי החלפת השמות של $x$ ו-$y$: $d(x,y)\le d(y,x)$. שני אי-השוויונים יחד
          נותנים $d(x,y)=d(y,x)$.
      - kind: step
        text: >-
          **המשולש.** נציב ב-$(\ast\ast)$ את $a=x$, $b=y$, $c=z$ ונשתמש בסימטריה:
          $d(x,z)\le d(x,y)+d(z,y)=d(x,y)+d(y,z)$. יחד עם $(\ast)$ אלה שלוש האקסיומות, וערכי $d$ ב-$[0,\infty)$:
          $d$ מטריקה.
      - kind: check
        text: >-
          האם אי-שוויון המשולש הרגיל, יחד עם $(\ast)$, היה מספיק? ההצבה $a=b=y$, $c=x$ במשולש הרגיל
          $d(a,c)\le d(a,b)+d(b,c)$ נותנת רק $d(y,x)\le0+d(y,x)$, שאינו אומר דבר. הסדר ההפוך במחובר השני של
          $(\ast\ast)$ הוא שמוציא את הסימטריה, והדוגמה ל-(3) בחלק (ב) תראה שבלעדיו היא באמת לא נובעת.
      - kind: step
        text: >-
          (ב) **(1) נכשל:** $d(x,y)=|x-y|+1$ לכל $x,y$, גם כש-$x=y$. היא חיובית תמיד, ובפרט ב-$x\ne y$, והיא
          סימטרית. משולש: $|x-z|+1\le(|x-y|+1)+(|y-z|+1)$, כי $|x-z|\le|x-y|+|y-z|$ ו-$1\le2$. אבל
          $d(x,x)=1\ne0$.
      - kind: step
        text: >-
          **(2) נכשל:** $d\equiv0$. אז $d(x,x)=0$, $d$ סימטרית, ו-$0\le0+0$. אבל $d(0,1)=0$ אף ש-$0\ne1$.
      - kind: step
        text: >-
          **(3) נכשל:** $d(x,y)=\max\big(y-x,\ 2(x-y)\big)$. נסמן $t=y-x$, אז $d(x,y)=\max(t,-2t)$. אם $t>0$,
          $d(x,y)=t>0$; אם $t<0$, $d(x,y)=-2t>0$; ואם $t=0$, $d(x,y)=0$. לכן (1) ו-(2) מתקיימים.
      - kind: step
        text: >-
          משולש ל-(3): $z-x=(y-x)+(z-y)\le d(x,y)+d(y,z)$, כי כל מחובר קטן או שווה למקסימום שבו הוא מופיע. מאותה
          סיבה $2(x-z)=2(x-y)+2(y-z)\le d(x,y)+d(y,z)$. $d(x,z)$ הוא הגדול מבין $z-x$ ו-$2(x-z)$, ושניהם לכל היותר
          $d(x,y)+d(y,z)$. אבל הסימטריה נכשלת: $d(0,1)=\max(1,-2)=1$ ואילו $d(1,0)=\max(-1,2)=2$.
      - kind: check
        text: >-
          לפי (א), פונקציה שמקיימת $(\ast)$ ו-$(\ast\ast)$ סימטרית. לכן הדוגמה ל-(3) חייבת להיכשל ב-$(\ast\ast)$, ואכן
          עם $a=1$, $b=1$, $c=0$: $d(1,0)=2>1=d(1,1)+d(0,1)$.
      - kind: step
        text: >-
          **(4) נכשל:** $d(x,y)=(x-y)^2$. היא $0$ בדיוק כש-$x=y$, חיובית אחרת, וסימטרית. אבל
          $d(0,2)=4>2=d(0,1)+d(1,2)$.
      - kind: result
        text: >-
          (א) $(\ast)$ ו-$(\ast\ast)$ גוררים אי-שליליות, סימטריה ואי-שוויון משולש: $d$ מטריקה. (ב) $|x-y|+1$,
          $d\equiv0$, $\max\big(y-x,\ 2(x-y)\big)$ ו-$(x-y)^2$ מראות שארבעת התנאים בלתי תלויים: אף אחד מהם אינו
          נובע משלושת האחרים.
    source:
      name: 'UNICAMP, MA-604 Topologia dos Espaços Métricos (R. Ruffino), 1ª Lista de Exercícios (exercises 1–5 taken from E. L. Lima, Espaços Métricos)'
      year: 2014
      problem: 'Exercícios 1 e 2'
      url: 'https://www.ime.unicamp.br/~ruffino/cursos/2014-1sem/esp-metricos/lista1-linha.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.1-c2
    stars: 1
    objectives: [OBJ-1.1-1, OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      פונקציה $\varphi:[0,\infty)\to\mathbb{R}$ נקראת **קעורה** אם
      $\varphi(\lambda s+(1-\lambda)t)\ge\lambda\varphi(s)+(1-\lambda)\varphi(t)$ לכל $s,t\ge0$ ולכל
      $\lambda\in[0,1]$: המיתר בין שתי נקודות על הגרף נמצא מתחת לגרף. יהי $(X,d)$ מרחב מטרי.

      (א) הוכיחו: אם $\varphi$ קעורה, לא-יורדת (כמו בלמה 1.1.11(i)), $\varphi(0)=0$ ו-$\varphi(t)>0$ לכל $t>0$, אז
      $\rho(x,y)=\varphi(d(x,y))$ היא מטריקה על $X$.

      (ב) הסיקו ש-$\dfrac{d}{1+d}$ ו-$\min(d,1)$ מטריקות על $X$.

      (ג) הראו ש-$d^2$ אינה בהכרח מטריקה, וקבעו איזו מההנחות של (א) נכשלת ב-$\varphi(t)=t^2$.
    answer: >-
      (א) קעירות עם $\varphi(0)=0$ נותנת תת-חיבוריות, $\varphi(a+b)\le\varphi(a)+\varphi(b)$; עם המונוטוניות זה
      אי-שוויון המשולש. (ב) $\frac{t}{1+t}$ ו-$\min(t,1)$ מקיימות את ההנחות. (ג) על $\mathbb{R}$:
      $d(0,2)^2=4>2=d(0,1)^2+d(1,2)^2$; $t^2$ אינה קעורה.
    solution:
      - kind: given
        text: >-
          $(X,d)$ מרחב מטרי; $\varphi:[0,\infty)\to\mathbb{R}$ קעורה, לא-יורדת, $\varphi(0)=0$ ו-$\varphi>0$
          על $(0,\infty)$; $\rho=\varphi\circ d$.
      - kind: goal
        text: >-
          (א) שלוש האקסיומות ל-$\rho$. (ב) לבדוק את ההנחות לשתי פונקציות. (ג) דוגמה נגדית ל-$d^2$.
      - kind: idea
        text: >-
          אפס וסימטריה עוברים דרך $\varphi$ מיד. למשולש צריך שתי תכונות של $\varphi$: שהיא לא-יורדת, כדי שמרחק גדול לא
          יעבור לערך קטן, ושהיא תת-חיבורית. התת-חיבוריות היא הצעד החדש: היא נובעת מהקעירות, כשכותבים את $a$ כממוצע
          משוקלל של $a+b$ ושל $0$.
      - kind: step
        text: >-
          **אפס וסימטריה.** $\rho(x,y)=\varphi(d(x,y))\ge0$, כי $\varphi(0)=0$ ו-$\varphi>0$ על $(0,\infty)$. מאותה
          סיבה $\rho(x,y)=0$ אם ורק אם $d(x,y)=0$, אם ורק אם $x=y$. סימטריה:
          $\rho(x,y)=\varphi(d(x,y))=\varphi(d(y,x))=\rho(y,x)$.
      - kind: step
        text: >-
          **תת-חיבוריות.** יהיו $a,b\ge0$. אם $a+b=0$, שני הצדדים של $\varphi(a+b)\le\varphi(a)+\varphi(b)$ הם $0$.
          אחרת נסמן $\lambda=\frac{a}{a+b}\in[0,1]$. אז $\lambda(a+b)+(1-\lambda)\cdot0=a$, ולפי הקעירות עם $s=a+b$
          ו-$t=0$:
          $\varphi(a)\ge\lambda\varphi(a+b)+(1-\lambda)\varphi(0)=\frac{a}{a+b}\varphi(a+b)$.
      - kind: step
        text: >-
          עכשיו $\mu=\frac{b}{a+b}\in[0,1]$: $\mu(a+b)+(1-\mu)\cdot0=b$, ולפי הקעירות עם $s=a+b$ ו-$t=0$:
          $\varphi(b)\ge\mu\varphi(a+b)+(1-\mu)\varphi(0)=\frac{b}{a+b}\varphi(a+b)$. מחברים את שני אי-השוויונים:
          $\varphi(a)+\varphi(b)\ge\frac{a+b}{a+b}\varphi(a+b)=\varphi(a+b)$.
      - kind: step
        text: >-
          **המשולש.** $d(x,z)\le d(x,y)+d(y,z)$ ו-$\varphi$ לא-יורדת, ולכן
          $\rho(x,z)=\varphi(d(x,z))\le\varphi\big(d(x,y)+d(y,z)\big)\le\varphi(d(x,y))+\varphi(d(y,z))=\rho(x,y)+\rho(y,z)$,
          כשבצעד השני השתמשנו בתת-חיבוריות. זו בדיוק ההוכחה של למה 1.1.11 בשיעור (ואפשר פשוט לצטט אותה); מה
          שהוספנו הוא שקעירות מספיקה לתת-חיבוריות.
      - kind: step
        text: >-
          (ב) $\varphi(t)=\frac{t}{1+t}$: $\varphi(0)=0$ ו-$\varphi(t)>0$ ל-$t>0$. $\varphi'(t)=\frac{1}{(1+t)^2}>0$,
          ולכן $\varphi$ עולה ממש, ובפרט לא-יורדת. נשארה הקעירות. $\varphi'$ יורדת ממש על $[0,\infty)$, כי המכנה
          $(1+t)^2$ עולה ממש. יהיו $0\le s<t$ ו-$\lambda\in(0,1)$ (ב-$\lambda=0$, ב-$\lambda=1$ או ב-$s=t$ אי-השוויון
          הוא שוויון, ואם $s>t$ מחליפים את $s$ ו-$t$ ואת $\lambda$ ב-$1-\lambda$), ונסמן $c=\lambda s+(1-\lambda)t$.
          אז $s<c<t$, $c-s=(1-\lambda)(t-s)$ ו-$t-c=\lambda(t-s)$.
      - kind: step
        text: >-
          לפי משפט לגרנז' (אינפי 1) יש $\xi_1\in(s,c)$ ו-$\xi_2\in(c,t)$ עם $\varphi(c)-\varphi(s)=\varphi'(\xi_1)(c-s)$
          ו-$\varphi(t)-\varphi(c)=\varphi'(\xi_2)(t-c)$. מכיוון ש-$\xi_1<\xi_2$ ו-$\varphi'$ יורדת,
          $\varphi'(\xi_1)\ge\varphi'(\xi_2)$, כלומר
          $\frac{\varphi(c)-\varphi(s)}{(1-\lambda)(t-s)}\ge\frac{\varphi(t)-\varphi(c)}{\lambda(t-s)}$. כופלים במספר
          החיובי $\lambda(1-\lambda)(t-s)$: $\lambda\big(\varphi(c)-\varphi(s)\big)\ge(1-\lambda)\big(\varphi(t)-\varphi(c)\big)$,
          ומעבירים אגפים: $\varphi(c)\ge\lambda\varphi(s)+(1-\lambda)\varphi(t)$. זו הקעירות, ולפי (א), $\frac{d}{1+d}$
          מטריקה.
      - kind: step
        text: >-
          $m(t)=\min(t,1)$: $m(0)=0$, $m(t)>0$ ל-$t>0$, ו-$m$ לא-יורדת (מסקנה 1.1.12). ל-$m$ אין נגזרת שנייה ב-$t=1$, ולכן
          בודקים קעירות ישירות. יהיו $s,t\ge0$ ו-$\lambda\in[0,1]$, ונסמן $w=\lambda m(s)+(1-\lambda)m(t)$. מכיוון
          ש-$m(s)\le s$ ו-$m(t)\le t$, $w\le\lambda s+(1-\lambda)t$. מכיוון ש-$m(s)\le1$ ו-$m(t)\le1$,
          $w\le\lambda+(1-\lambda)=1$. לכן $w$ קטן או שווה לקטן מבין שני החסמים, שהוא בדיוק
          $m(\lambda s+(1-\lambda)t)$. לפי (א), $\min(d,1)$ מטריקה.
      - kind: check
        text: >-
          על $\mathbb{R}$ עם $d(x,y)=|x-y|$ ובנקודות $0,1,2$: ב-$\min(d,1)$, $1\le1+1$; ב-$\frac{d}{1+d}$,
          $\frac23\le\frac12+\frac12$. את שתי המטריקות האלה הוכחנו במסקנה 1.1.12 בחישוב ישיר של התת-חיבוריות;
          כאן היא באה מהקעירות, בלי חישוב.
      - kind: step
        text: >-
          (ג) על $\mathbb{R}$ עם $d(x,y)=|x-y|$: $d(0,2)^2=4$, ואילו $d(0,1)^2+d(1,2)^2=1+1=2$. אי-שוויון המשולש
          נכשל (טענה 1.1.10), ולכן $d^2$ אינה מטריקה. ההנחה שנכשלת היא הקעירות: עם $s=0$, $t=2$, $\lambda=\frac12$,
          $\varphi(1)=1<2=\frac12\varphi(0)+\frac12\varphi(2)$. שאר ההנחות ($t^2$ לא-יורדת על $[0,\infty)$, ומתאפסת רק ב-$0$) מתקיימות.
      - kind: result
        text: >-
          $\varphi\circ d$ מטריקה לכל $\varphi$ קעורה ולא-יורדת, עם $\varphi(0)=0$ ו-$\varphi>0$ על
          $(0,\infty)$; בפרט $\frac{d}{1+d}$ ו-$\min(d,1)$. $d^2$ אינה בהכרח מטריקה, כי $t^2$ אינה קעורה.
