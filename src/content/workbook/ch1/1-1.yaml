# Workbook of lesson 1.1 — metric spaces: definition and examples.
# Objectives (src/course.ts):
#   OBJ-1.1-1  state the three axioms of a metric and check them, the triangle inequality in particular
#   OBJ-1.1-2  the basic examples: Euclidean, discrete, sum and max metrics on R^n, the sup metric on B(X)
#   OBJ-1.1-3  find the axiom that fails for a function that is not a metric (squared difference)
# Numbers recomputed with src/math/multivar.ts (pDist) and src/math/axioms.ts.
lesson: '1.1'
practice:
  - id: W-1.1-01
    level: basic
    objectives: [OBJ-1.1-2]
    prompt: >-
      ב-$\mathbb{R}^4$, $x=(2,-1,0,5)$ ו-$y=(-1,3,0,1)$. חשבו את $d_1(x,y)$, $d_2(x,y)$ ו-$d_\infty(x,y)$.
    answer: >-
      $d_1=11$, $d_2=\sqrt{41}\approx6.403$, $d_\infty=4$.
    solution:
      - kind: computation
        text: >-
          ההפרשים בערך מוחלט, קואורדינטה אחר קואורדינטה: $|2-(-1)|=3$, $|-1-3|=4$, $|0-0|=0$, $|5-1|=4$.
      - kind: computation
        text: >-
          $d_1=3+4+0+4=11$. $d_2=\sqrt{9+16+0+16}=\sqrt{41}\approx6.403$. $d_\infty=\max(3,4,0,4)=4$.
      - kind: check
        text: >-
          $d_\infty\le d_2\le d_1$: $4\le6.403\le11$. קואורדינטה שבה הנקודות שוות (כאן השלישית) לא תורמת לאף
          אחת מהמטריקות.
      - kind: result
        text: >-
          $11$, $\sqrt{41}$, $4$.

  - id: W-1.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      על $X=\{a,b,c\}$ מגדירים $d(u,u)=0$ לכל $u$, $d$ סימטרית, ו-$d(a,b)=2$, $d(b,c)=3$, $d(a,c)=6$.

      (א) האם $d$ מטריקה?

      (ב) לאילו ערכים של $d(a,c)$, כשהשאר נשאר כמו שהוא, $d$ כן מטריקה?
    answer: >-
      (א) לא: $d(a,c)=6>5=d(a,b)+d(b,c)$. (ב) $1\le d(a,c)\le5$.
    solution:
      - kind: idea
        text: >-
          בקבוצה של שלוש נקודות אפס וסימטריה כבר נתונים (כשכל המרחקים בין נקודות שונות חיוביים). נשארים שלושה
          אי-שוויוני משולש: כל צלע לכל היותר סכום שתי האחרות.
      - kind: step
        text: >-
          (א) $d(a,c)\le d(a,b)+d(b,c)$ דורש $6\le2+3$, וזה שקרי. אי-שוויון המשולש נכשל, ו-$d$ אינה מטריקה.
      - kind: step
        text: >-
          (ב) נסמן $t=d(a,c)>0$. שלושת התנאים: $t\le2+3$, $2\le t+3$, $3\le t+2$. כלומר $t\le5$ ו-$t\ge1$ (התנאי
          השני מתקיים תמיד).
      - kind: check
        text: >-
          בשני הקצוות יש שוויון, כמו שלוש נקודות על ישר אחד. ב-$t=5$: $a=0$, $b=2$, $c=5$ ($b$ באמצע). ב-$t=1$:
          $b=0$, $a=2$, $c=3$ ($a$ באמצע, ו-$d(b,c)=3=2+1$).
      - kind: result
        text: >-
          (א) לא מטריקה. (ב) מטריקה בדיוק כש-$1\le d(a,c)\le5$.

  - id: W-1.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      לכל פונקציה, קבעו אם היא מטריקה על $\mathbb{R}$. אם לא, ציינו אקסיומה שנכשלת עם דוגמה נגדית.

      (א) $d(x,y)=x-y$

      (ב) $d(x,y)=|e^x-e^y|$

      (ג) $d(x,y)=|\cos x-\cos y|$
    answer: >-
      (א) לא: $d(0,1)=-1<0$, והסימטריה נכשלת. (ב) מטריקה. (ג) לא: $d(\pi,-\pi)=0$.
    solution:
      - kind: step
        text: >-
          (א) מטריקה מקבלת ערכים ב-$[0,\infty)$, ו-$d(0,1)=-1$. גם הסימטריה נכשלת: $d(1,0)=1\ne-1=d(0,1)$.
      - kind: step
        text: >-
          (ב) $x\mapsto e^x$ חד-חד-ערכית, ולכן $|e^x-e^y|$ מטריקה: הסימטריה והמשולש באים מהערך המוחלט
          ($|e^x-e^z|\le|e^x-e^y|+|e^y-e^z|$), ו-$|e^x-e^y|=0$ רק כש-$e^x=e^y$, כלומר $x=y$.
      - kind: step
        text: >-
          (ג) $\cos$ אינה חד-חד-ערכית: $\cos\pi=\cos(-\pi)=-1$, ולכן $d(\pi,-\pi)=0$ אף ש-$\pi\ne-\pi$. אקסיומת האפס
          נכשלת. הסימטריה והמשולש דווקא מתקיימים.
      - kind: result
        text: >-
          (א) לא (ערך שלילי, סימטריה); (ב) כן; (ג) לא (אפס).

  - id: W-1.1-04
    level: mid
    objectives: [OBJ-1.1-2]
    prompt: >-
      חשבו את המרחק במטריקת הסופרמום:

      (א) בין $f(x)=e^x$ ל-$g(x)=1+x$ על $[0,1]$.

      (ב) בין $f(x)=x$ ל-$g(x)=x^2$ על $[0,2]$.
    answer: >-
      (א) $e-2\approx0.718$. (ב) $2$.
    solution:
      - kind: idea
        text: >-
          מחשבים את פונקציית ההפרש $h=f-g$, ומוצאים את המקסימום של $|h|$ על הקטע: בנקודות קריטיות ובקצוות.
      - kind: computation
        text: >-
          (א) $h(x)=e^x-1-x$, $h'(x)=e^x-1\ge0$ על $[0,1]$, ולכן $h$ עולה. $h(0)=0$, ולכן $h\ge0$ ו-$|h|=h$. המקסימום
          בקצה הימני: $h(1)=e-2\approx0.718$.
      - kind: computation
        text: >-
          (ב) $h(x)=x-x^2$. על $[0,1]$: $h\ge0$, ומקסימום $\tfrac14$ ב-$x=\tfrac12$. על $[1,2]$: $|h|=x^2-x$, עולה,
          ובקצה $x=2$ שווה $2$. לכן $\sup_{[0,2]}|h|=\max(\tfrac14,\ 2)=2$.
      - kind: check
        text: >-
          ב-(ב) הסופרמום דווקא בקצה, וב-$[0,1]$ (בשיעור) הוא היה בנקודה פנימית: אין כלל קבוע, צריך לבדוק את שניהם.
      - kind: result
        text: >-
          (א) $e-2$. (ב) $2$.

  - id: W-1.1-05
    level: mid
    objectives: [OBJ-1.1-1]
    prompt: >-
      על $\mathbb{R}^2$ מגדירים ("מטריקת הרכבת": כל נסיעה עוברת דרך התחנה המרכזית $0$)
      $d(x,y)=\|x\|_2+\|y\|_2$ אם $x\ne y$, ו-$d(x,x)=0$, כאשר $\|x\|_2=\sqrt{x_1^2+x_2^2}$. הוכיחו ש-$d$ מטריקה.
    answer: >-
      אפס וסימטריה מההגדרה; המשולש בחלוקה למקרים לפי אילו מהנקודות שוות.
    solution:
      - kind: step
        text: >-
          **אפס:** $d(x,x)=0$ מההגדרה. אם $x\ne y$, אז לפחות אחת מהן אינה $0$, ולכן $\|x\|_2+\|y\|_2>0$.
          **סימטריה:** הביטוי $\|x\|_2+\|y\|_2$ סימטרי.
      - kind: idea
        text: >-
          למשולש $d(x,z)\le d(x,y)+d(y,z)$ מחלקים לפי אילו נקודות שוות. אם $x=z$ האגף השמאלי 0. אחרת
          $d(x,z)=\|x\|_2+\|z\|_2$, ובכל המקרים האגף הימני "מכיל" את שני המחוברים האלה.
      - kind: step
        text: >-
          נניח $x\ne z$. אם $y=x$: האגף הימני $0+d(x,z)=d(x,z)$. אם $y=z$: באותו אופן. אחרת $y$ שונה משתיהן, והאגף
          הימני $\|x\|_2+\|y\|_2+\|y\|_2+\|z\|_2\ge\|x\|_2+\|z\|_2=d(x,z)$.
      - kind: check
        text: >-
          שתי נקודות על אותה קרן מהראשית, $(1,0)$ ו-$(2,0)$: המרחק $3$, לא $1$, כי הנסיעה עוברת דרך $0$.
      - kind: result
        text: >-
          $d$ מטריקה על $\mathbb{R}^2$.

  - id: W-1.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      על $\mathbb{R}^2$:

      (א) האם $d(x,y)=|x_1-y_1|+2|x_2-y_2|$ מטריקה?

      (ב) האם $d(x,y)=\max\big(|x_1-y_1|,\ (x_2-y_2)^2\big)$ מטריקה?
    answer: >-
      (א) כן. (ב) לא: המשולש נכשל ב-$(0,0)$, $(0,1)$, $(0,2)$.
    solution:
      - kind: step
        text: >-
          (א) **כן.** אפס: סכום של שני מספרים אי-שליליים הוא 0 רק אם שניהם 0, כלומר $x_1=y_1$ ו-$x_2=y_2$.
          סימטריה ברורה. משולש: בכל קואורדינטה $|x_i-z_i|\le|x_i-y_i|+|y_i-z_i|$; כופלים את השני ב-2 ומחברים.
      - kind: step
        text: >-
          (ב) **לא.** אפס וסימטריה מתקיימים. אבל ב-$x=(0,0)$, $y=(0,1)$, $z=(0,2)$: $d(x,z)=\max(0,4)=4$, ואילו
          $d(x,y)+d(y,z)=1+1=2$.
      - kind: check
        text: >-
          ב-(ב) הבעיה היא הריבוע בקואורדינטה השנייה: לאורך ציר ה-$y$ הפונקציה היא בדיוק $(x_2-y_2)^2$, שאינה
          מטריקה על $\mathbb{R}$.
      - kind: result
        text: >-
          (א) מטריקה; (ב) לא, אי-שוויון המשולש נכשל.

  - id: W-1.1-07
    level: mid
    objectives: [OBJ-1.1-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי. הוכיחו את **אי-שוויון המשולש ההפוך**: לכל $x,y,z\in X$,
      $|d(x,z)-d(y,z)|\le d(x,y)$.
    answer: >-
      שני אי-שוויוני משולש: $d(x,z)\le d(x,y)+d(y,z)$ ו-$d(y,z)\le d(y,x)+d(x,z)$.
    solution:
      - kind: goal
        text: >-
          $|t|\le s$ שקול לשני אי-שוויונים: $t\le s$ ו-$-t\le s$. כאן $t=d(x,z)-d(y,z)$ ו-$s=d(x,y)$.
      - kind: idea
        text: >-
          כל אחד מהשניים הוא אי-שוויון המשולש עם הנקודה האמצעית המתאימה, ועם הסימטריה.
      - kind: step
        text: >-
          לפי המשולש עם נקודה אמצעית $y$: $d(x,z)\le d(x,y)+d(y,z)$, כלומר $d(x,z)-d(y,z)\le d(x,y)$.
      - kind: step
        text: >-
          לפי המשולש עם נקודה אמצעית $x$: $d(y,z)\le d(y,x)+d(x,z)$. לפי הסימטריה $d(y,x)=d(x,y)$, ולכן
          $d(y,z)-d(x,z)\le d(x,y)$.
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $z=0$ זה $\big||x|-|y|\big|\le|x-y|$, אי-שוויון מוכר מאינפי 1.
      - kind: result
        text: >-
          $|d(x,z)-d(y,z)|\le d(x,y)$. (בשיעור 1.6 זה יראה שהפונקציה $x\mapsto d(x,z)$ רציפה.)

  - id: W-1.1-08
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      לפונקציות אינטגרביליות רימן על $[0,1]$ מגדירים $d(f,g)=\int_0^1|f(x)-g(x)|\,dx$.

      (א) הוכיחו ש-$d$ מטריקה על $C[0,1]$.

      (ב) הראו ש-$d$ אינה מטריקה על קבוצת כל הפונקציות האינטגרביליות רימן על $[0,1]$, ואמרו איזו אקסיומה נכשלת.

      (ג) על $C[0,1]$ הוכיחו ש-$d(f,g)\le d_\infty(f,g)$, והראו שאין קבוע $C$ כך ש-$d_\infty(f,g)\le C\,d(f,g)$ לכל
      $f,g\in C[0,1]$.
    answer: >-
      (א) המשולש מהמונוטוניות של האינטגרל; האפס מהרציפות. (ב) $f\equiv0$ ו-$g=\chi_{\{1/2\}}$: מרחק 0. אקסיומת
      האפס. (ג) $\int_0^1|f-g|\le\int_0^1\max|f-g|$; העוקצים $g_n(x)=\max(0,1-nx)$ נותנים $d_\infty(g_n,0)=1$
      ו-$d(g_n,0)=\frac1{2n}$.
    solution:
      - kind: step
        text: >-
          (א) $|f-g|$ רציפה, ולכן אינטגרבילית, והאינטגרל סופי ואי-שלילי. סימטריה: $|f-g|=|g-f|$.
          משולש: לכל $x$, $|f(x)-h(x)|\le|f(x)-g(x)|+|g(x)-h(x)|$; האינטגרל מונוטוני ולינארי, ולכן
          $d(f,h)\le d(f,g)+d(g,h)$.
      - kind: idea
        text: >-
          אקסיומת האפס היא הצעד הקשה: אינטגרל 0 של פונקציה אי-שלילית לא אומר שהיא 0 בכל נקודה, אלא אם היא רציפה.
      - kind: step
        text: >-
          נניח $f\ne g$, כלומר יש $x_0$ עם $c=|f(x_0)-g(x_0)|>0$. הפונקציה $|f-g|$ רציפה ב-$x_0$, ולכן יש קטע
          $I\subseteq[0,1]$ באורך $\ell>0$ שמכיל את $x_0$ (אם $x_0$ קצה של $[0,1]$, זה חצי-קטע מצד אחד), שבו
          $|f-g|>\tfrac c2$. האינטגרנד אי-שלילי, ולכן $d(f,g)\ge\int_I|f-g|\ge\tfrac c2\,\ell>0$.
      - kind: step
        text: >-
          (ב) $f\equiv0$ ו-$g=\chi_{\{1/2\}}$ ($g(\tfrac12)=1$ ו-$g=0$ בשאר הנקודות). $g$ אינטגרבילית רימן (שינוי בנקודה
          אחת), ו-$\int_0^1|g|=0$. לכן $d(f,g)=0$ אף ש-$f\ne g$: אקסיומת האפס נכשלת. (הסימטריה והמשולש עוברים גם
          כאן: הערך המוחלט של הפרש של שתי פונקציות אינטגרביליות רימן אינטגרבילי, מאינפי 2.)
      - kind: step
        text: >-
          (ג) לכל $x$, $|f(x)-g(x)|\le\max_{[0,1]}|f-g|=d_\infty(f,g)$. מאינטגרלים על קטע באורך 1:
          $d(f,g)\le\int_0^1 d_\infty(f,g)\,dx=d_\infty(f,g)$.
      - kind: idea
        text: >-
          לכיוון השני מחפשים פונקציות שרחוקות מ-0 בנקודה אחת, אבל השטח מתחתן זעיר: "עוקץ" צר. אז $d$ קטן ו-$d_\infty$
          לא, והיחס ביניהם לא חסום.
      - kind: computation
        text: >-
          $g_n(x)=\max(0,\ 1-nx)$: רציפה, $g_n(0)=1$ ו-$0\le g_n\le1$, ולכן $d_\infty(g_n,0)=1$. היא מתאפסת מ-$\tfrac1n$
          והלאה, ו-$d(g_n,0)=\int_0^{1/n}(1-nx)\,dx=\tfrac1n-\tfrac n2\cdot\tfrac1{n^2}=\tfrac1{2n}$.
      - kind: step
        text: >-
          נניח שיש $C$ עם $d_\infty\le C\,d$. עם $g_n$ ו-$0$: $1\le\tfrac{C}{2n}$ לכל $n$, כלומר $n\le\tfrac C2$ לכל $n$,
          וזה שקרי. לכן אין קבוע כזה.
      - kind: check
        text: >-
          ההבדל בין (א) ל-(ב) הוא בדיוק הרציפות, כמו בדוגמה 5 של השיעור. ב-(ג): $n=10$ נותן $d=0.05$ ו-$d_\infty=1$.
          שתי המטריקות על $C[0,1]$ שונות באמת, לא רק בנוסחה; בשיעור 1.6 נראה מה זה אומר על קבוצות פתוחות.
      - kind: result
        text: >-
          (א) מטריקה על $C[0,1]$. (ב) לא מטריקה על הפונקציות האינטגרביליות: נכשלת אקסיומת האפס. (ג) $d\le d_\infty$,
          ואין $C$ עם $d_\infty\le C\,d$.

  - id: W-1.1-09
    level: exam
    objectives: [OBJ-1.1-1, OBJ-1.1-2]
    prompt: >-
      יהיו $(X_1,\rho_1),\dots,(X_n,\rho_n)$ מרחבים מטריים. על המכפלה $X=X_1\times\dots\times X_n$ מגדירים
      $D(x,y)=\sum_{i=1}^n \rho_i(x_i,y_i)$ ו-$E(x,y)=\sqrt{\sum_{i=1}^n \rho_i(x_i,y_i)^2}$.

      (א) הוכיחו ש-$D$ מטריקה על $X$.

      (ב) כש-$X_i=\{0,1\}$ עם המטריקה הבדידה, $D(x,y)$ הוא מספר המקומות שבהם $x$ ו-$y$ שונות. חשבו את $D$ בין
      $10110$ ל-$01100$ (מחרוזות של אפסים ואחדים באורך 5).

      (ג) מה המטריקות $D$ ו-$E$ כש-$X_i=\mathbb{R}$ עם $|x-y|$?

      (ד) הוכיחו ש-$E$ מטריקה על $X$.
    answer: >-
      (א) כל אקסיומה בכל קואורדינטה, וסוכמים. (ב) $3$. (ג) $d_1$ ו-$d_2$ על $\mathbb{R}^n$. (ד) המשולש של כל
      $\rho_i$, ואחריו אי-שוויון המשולש של $d_2$ על $\mathbb{R}^n$.
    solution:
      - kind: idea
        text: >-
          כמו ההוכחה ל-$d_1$ על $\mathbb{R}^n$: בכל קואורדינטה יש מטריקה, וסכום של אי-שוויונים הוא אי-שוויון.
      - kind: step
        text: >-
          (א) אפס: $D(x,y)=0$ אם ורק אם כל המחוברים, שהם אי-שליליים, אפס, אם ורק אם $x_i=y_i$ לכל $i$, כלומר $x=y$.
          סימטריה: כל מחובר סימטרי. משולש: לכל $i$, $\rho_i(x_i,z_i)\le\rho_i(x_i,y_i)+\rho_i(y_i,z_i)$; סוכמים על $i$.
      - kind: computation
        text: >-
          (ב) משווים מקום אחר מקום: $1/0$ שונה, $0/1$ שונה, $1/1$ שווה, $1/0$ שונה, $0/0$ שווה. שלושה מקומות שונים:
          $D=3$.
      - kind: check
        text: >-
          המשולש ב-(ב) דרך $11111$: $D(10110,11111)=2$ ו-$D(11111,01100)=3$, ו-$3\le2+3$.
      - kind: step
        text: >-
          (ג) $D(x,y)=\sum|x_i-y_i|=d_1(x,y)$ ו-$E(x,y)=\sqrt{\sum(x_i-y_i)^2}=d_2(x,y)$: מטריקת הסכום והמטריקה
          האוקלידית הן המקרים הפרטיים האלה.
      - kind: idea
        text: >-
          (ד) אפס וסימטריה כמו ב-(א). למשולש: נסמן את וקטורי המרחקים בקואורדינטות, $a_i=\rho_i(x_i,y_i)$,
          $b_i=\rho_i(y_i,z_i)$, $c_i=\rho_i(x_i,z_i)$. אז $E(x,z)=\sqrt{\sum c_i^2}$, ואנחנו יודעים שני דברים: $c_i\le a_i+b_i$
          בכל קואורדינטה, ואי-שוויון המשולש של $d_2$ על $\mathbb{R}^n$ מהשיעור.
      - kind: step
        text: >-
          כל המספרים אי-שליליים, ולכן מ-$0\le c_i\le a_i+b_i$ נובע $c_i^2\le(a_i+b_i)^2$, ו-$\sqrt{\sum c_i^2}\le\sqrt{\sum(a_i+b_i)^2}$.
      - kind: step
        text: >-
          $\sqrt{\sum(a_i+b_i)^2}$ הוא $d_2(a,-b)$, המרחק האוקלידי בין הווקטורים $a$ ו-$-b$ ב-$\mathbb{R}^n$. לפי המשולש של
          $d_2$ דרך הראשית: $d_2(a,-b)\le d_2(a,0)+d_2(0,-b)=\sqrt{\sum a_i^2}+\sqrt{\sum b_i^2}=E(x,y)+E(y,z)$.
      - kind: check
        text: >-
          איפה היה צריך את אי-השליליות? בהעלאה בריבוע של $c_i\le a_i+b_i$: בלי $c_i\ge0$ היא לא שומרת על הכיוון. וב-(ג)
          זה בדיוק אי-שוויון המשולש של $d_2$, כמו שצריך.
      - kind: result
        text: >-
          (א) $D$ מטריקה. (ב) $3$. (ג) $d_1$ ו-$d_2$. (ד) $E$ מטריקה.

  - id: W-1.1-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.1-3, OBJ-1.1-1]
    prompt: >-
      על $\mathbb{R}$:

      (א) האם $d(x,y)=|x-y|+|x^2-y^2|$ מטריקה?

      (ב) האם $\rho(x,y)=|x-y|+(x-y)^2$ מטריקה?
    answer: >-
      (א) כן. (ב) לא: $\rho(0,2)=6>4=\rho(0,1)+\rho(1,2)$.
    solution:
      - kind: idea
        text: >-
          (א) סכום של מטריקה ושל פונקציה אי-שלילית שמתאפסת על נקודה ועצמה ($\sigma(x,x)=0$), סימטרית ומקיימת את
          המשולש (אבל עלולה להתאפס גם בין נקודות שונות) הוא מטריקה: הכיוון "$d=0$ גורר $x=y$" מגיע מהמחובר הראשון.
          (בלי $\sigma(x,x)=0$ זה נכשל: $|x-y|+1$.)
          (ב) המחובר השני אינו מקיים את המשולש, ומספיק שהוא "מנצח" כשהמרחקים גדולים.
      - kind: step
        text: >-
          (א) אפס: $d(x,y)=0$ רק אם $|x-y|=0$, כלומר $x=y$ (וההפך ברור). סימטריה ברורה. משולש: גם $|x-y|$ וגם
          $|x^2-y^2|$ מקיימות את המשולש (שתיהן מהצורה $|g(x)-g(y)|$), ומחברים.
      - kind: computation
        text: >-
          (ב) $\rho(0,2)=2+4=6$, ואילו $\rho(0,1)+\rho(1,2)=(1+1)+(1+1)=4$. המשולש נכשל.
      - kind: check
        text: >-
          הכישלון ב-(ב) אינו רק במרחקים גדולים: $\rho(0,0.2)=0.2+0.04=0.24$, ואילו
          $\rho(0,0.1)+\rho(0.1,0.2)=2(0.1+0.01)=0.22$. באופן כללי, עם $a=y-x$ ו-$b=z-y$ באותו סימן, החלק הלינארי
          נותן שוויון והריבועי נותן $(a+b)^2-a^2-b^2=2ab>0$, ולכן כל נקודה באמצע הדרך מקצרת.
      - kind: result
        text: >-
          (א) מטריקה. (ב) לא מטריקה: אי-שוויון המשולש נכשל.
challenge:
  - id: W-1.1-c1
    stars: 1
    objectives: [OBJ-1.1-1, OBJ-1.1-3]
    prompt: >-
      תהי $X$ קבוצה, ותהי $d:X\times X\to\mathbb{R}$ פונקציה (לא מניחים מראש שערכיה אי-שליליים) שמקיימת שני
      תנאים: $(\ast)$ $d(x,y)=0$ אם ורק אם $x=y$; ו-$(\ast\ast)$ $d(x,z)\le d(x,y)+d(z,y)$ לכל $x,y,z\in X$.
      שימו לב לסדר במחובר השני: $d(z,y)$, ולא $d(y,z)$.

      (א) הוכיחו ש-$d$ מטריקה: ערכיה אי-שליליים, היא סימטרית, והיא מקיימת את אי-שוויון המשולש הרגיל.

      (ב) מפרקים את ההגדרה של מטריקה לארבעה תנאים: (1) $d(x,x)=0$ לכל $x$; (2) $d(x,y)>0$ כש-$x\ne y$;
      (3) סימטריה; (4) אי-שוויון המשולש. לכל אחד מארבעת התנאים מצאו פונקציה $d:\mathbb{R}\times\mathbb{R}\to\mathbb{R}$
      שמקיימת את שלושת האחרים ונכשלת בו.
    answer: >-
      (א) מציבים ב-$(\ast\ast)$ נקודות חוזרות: $a=c=x$ ו-$b=y$ נותן $d\ge0$; $a=b=y$ ו-$c=x$ נותן סימטריה; ואז
      $(\ast\ast)$ הוא המשולש הרגיל. (ב) (1) $|x-y|+1$; (2) $d\equiv0$; (3) $\max\big(y-x,\ 2(x-y)\big)$;
      (4) $(x-y)^2$.
    solution:
      - kind: given
        text: >-
          $d:X\times X\to\mathbb{R}$ עם $(\ast)$: $d(x,y)=0$ אם ורק אם $x=y$, ועם $(\ast\ast)$:
          $d(a,c)\le d(a,b)+d(c,b)$ לכל שלוש נקודות $a,b,c\in X$ (כתבנו את $(\ast\ast)$ באותיות אחרות, כדי שיהיה
          נוח להציב בו).
      - kind: goal
        text: >-
          (א) $d(x,y)\ge0$, $d(x,y)=d(y,x)$ ו-$d(x,z)\le d(x,y)+d(y,z)$ לכל $x,y,z$. (ב) ארבע פונקציות, כל אחת
          נכשלת בתנאי אחד בדיוק.
      - kind: idea
        text: >-
          $(\ast\ast)$ נכון לכל שלוש נקודות, גם כששתיים מהן שוות. בחירה נכונה של נקודות חוזרות הופכת אותו לכל אחת
          מהאקסיומות החסרות. הסדר חשוב: קודם אי-שליליות, אחר כך סימטריה, ורק בעזרת הסימטריה המשולש הרגיל.
      - kind: step
        text: >-
          **אי-שליליות.** נציב ב-$(\ast\ast)$ את $a=x$, $b=y$, $c=x$: $d(x,x)\le d(x,y)+d(x,y)$. לפי $(\ast)$,
          $d(x,x)=0$, ולכן $0\le2d(x,y)$, כלומר $d(x,y)\ge0$.
      - kind: step
        text: >-
          **סימטריה.** נציב ב-$(\ast\ast)$ את $a=y$, $b=y$, $c=x$: $d(y,x)\le d(y,y)+d(x,y)=d(x,y)$, כי $d(y,y)=0$.
          זה נכון לכל שתי נקודות, ולכן גם אחרי החלפת השמות של $x$ ו-$y$: $d(x,y)\le d(y,x)$. שני אי-השוויונים יחד
          נותנים $d(x,y)=d(y,x)$.
      - kind: step
        text: >-
          **המשולש.** נציב ב-$(\ast\ast)$ את $a=x$, $b=y$, $c=z$ ונשתמש בסימטריה:
          $d(x,z)\le d(x,y)+d(z,y)=d(x,y)+d(y,z)$. יחד עם $(\ast)$ אלה שלוש האקסיומות, וערכי $d$ ב-$[0,\infty)$:
          $d$ מטריקה.
      - kind: check
        text: >-
          האם אי-שוויון המשולש הרגיל, יחד עם $(\ast)$, היה מספיק? ההצבה $a=b=y$, $c=x$ במשולש הרגיל
          $d(a,c)\le d(a,b)+d(b,c)$ נותנת רק $d(y,x)\le0+d(y,x)$, שאינו אומר דבר. הסדר ההפוך במחובר השני של
          $(\ast\ast)$ הוא שמוציא את הסימטריה, והדוגמה ל-(3) בחלק (ב) תראה שבלעדיו היא באמת לא נובעת.
      - kind: step
        text: >-
          (ב) **(1) נכשל:** $d(x,y)=|x-y|+1$ לכל $x,y$, גם כש-$x=y$. היא חיובית תמיד, ובפרט ב-$x\ne y$, והיא
          סימטרית. משולש: $|x-z|+1\le(|x-y|+1)+(|y-z|+1)$, כי $|x-z|\le|x-y|+|y-z|$ ו-$1\le2$. אבל
          $d(x,x)=1\ne0$.
      - kind: step
        text: >-
          **(2) נכשל:** $d\equiv0$. אז $d(x,x)=0$, $d$ סימטרית, ו-$0\le0+0$. אבל $d(0,1)=0$ אף ש-$0\ne1$.
      - kind: step
        text: >-
          **(3) נכשל:** $d(x,y)=\max\big(y-x,\ 2(x-y)\big)$. נסמן $t=y-x$, אז $d(x,y)=\max(t,-2t)$. אם $t>0$,
          $d(x,y)=t>0$; אם $t<0$, $d(x,y)=-2t>0$; ואם $t=0$, $d(x,y)=0$. לכן (1) ו-(2) מתקיימים.
      - kind: step
        text: >-
          משולש ל-(3): $z-x=(y-x)+(z-y)\le d(x,y)+d(y,z)$, כי כל מחובר קטן או שווה למקסימום שבו הוא מופיע. באותו
          אופן $2(x-z)=2(x-y)+2(y-z)\le d(x,y)+d(y,z)$. $d(x,z)$ הוא הגדול מבין $z-x$ ו-$2(x-z)$, ושניהם לכל היותר
          $d(x,y)+d(y,z)$. אבל הסימטריה נכשלת: $d(0,1)=\max(1,-2)=1$ ואילו $d(1,0)=\max(-1,2)=2$.
      - kind: check
        text: >-
          לפי (א), פונקציה שמקיימת $(\ast)$ ו-$(\ast\ast)$ סימטרית. לכן הדוגמה ל-(3) חייבת להיכשל ב-$(\ast\ast)$, ואכן
          עם $a=1$, $b=1$, $c=0$: $d(1,0)=2>1=d(1,1)+d(0,1)$.
      - kind: step
        text: >-
          **(4) נכשל:** $d(x,y)=(x-y)^2$. היא $0$ בדיוק כש-$x=y$, חיובית אחרת, וסימטרית. אבל
          $d(0,2)=4>2=d(0,1)+d(1,2)$.
      - kind: result
        text: >-
          (א) $(\ast)$ ו-$(\ast\ast)$ גוררים אי-שליליות, סימטריה ואי-שוויון משולש: $d$ מטריקה. (ב) $|x-y|+1$,
          $d\equiv0$, $\max\big(y-x,\ 2(x-y)\big)$ ו-$(x-y)^2$ מראות שארבעת התנאים בלתי תלויים: אף אחד מהם אינו
          נובע משלושת האחרים.
    source:
      name: 'UNICAMP, MA-604 Topologia dos Espaços Métricos (R. Ruffino), 1ª Lista de Exercícios (exercises 1–5 taken from E. L. Lima, Espaços Métricos)'
      year: 2014
