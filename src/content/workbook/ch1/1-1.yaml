  - id: W-1.1-c2
    stars: 1
    objectives: [OBJ-1.1-1, OBJ-1.1-2, OBJ-1.1-3]
    prompt: >-
      פונקציה $\varphi:[0,\infty)\to\mathbb{R}$ נקראת **קעורה** אם
      $\varphi(\lambda s+(1-\lambda)t)\ge\lambda\varphi(s)+(1-\lambda)\varphi(t)$ לכל $s,t\ge0$ ולכל
      $\lambda\in[0,1]$: המיתר בין שתי נקודות על הגרף נמצא מתחת לגרף. יהי $(X,d)$ מרחב מטרי.

      (א) הוכיחו: אם $\varphi$ קעורה, עולה במובן החלש, $\varphi(0)=0$ ו-$\varphi(t)>0$ לכל $t>0$, אז
      $\rho(x,y)=\varphi(d(x,y))$ היא מטריקה על $X$.

      (ב) הסיקו ש-$\dfrac{d}{1+d}$ ו-$\min(d,1)$ מטריקות על $X$.

      (ג) הראו ש-$d^2$ אינה בהכרח מטריקה, וקבעו איזו מההנחות של (א) נכשלת ב-$\varphi(t)=t^2$.
    answer: >-
      (א) קעירות עם $\varphi(0)=0$ נותנת תת-חיבוריות, $\varphi(a+b)\le\varphi(a)+\varphi(b)$; עם המונוטוניות זה
      אי-שוויון המשולש. (ב) $\frac{t}{1+t}$ ו-$\min(t,1)$ מקיימות את ההנחות. (ג) על $\mathbb{R}$:
      $d(0,2)^2=4>2=d(0,1)^2+d(1,2)^2$; $t^2$ אינה קעורה.
    solution:
      - kind: given
        text: >-
          $(X,d)$ מרחב מטרי; $\varphi:[0,\infty)\to\mathbb{R}$ קעורה, עולה במובן החלש, $\varphi(0)=0$ ו-$\varphi>0$
          על $(0,\infty)$; $\rho=\varphi\circ d$.
      - kind: goal
        text: >-
          (א) שלוש האקסיומות ל-$\rho$. (ב) לבדוק את ההנחות לשתי פונקציות. (ג) דוגמה נגדית ל-$d^2$.
      - kind: idea
        text: >-
          אפס וסימטריה עוברים דרך $\varphi$ מיד. למשולש צריך שתי תכונות של $\varphi$: שהיא עולה, כדי שמרחק גדול לא
          יעבור לערך קטן, ושהיא תת-חיבורית. התת-חיבוריות היא הצעד החדש: היא נובעת מהקעירות, כשכותבים את $a$ כממוצע
          משוקלל של $a+b$ ושל $0$.
      - kind: step
        text: >-
          **אפס וסימטריה.** $\rho(x,y)=\varphi(d(x,y))\ge0$, כי $\varphi(0)=0$ ו-$\varphi>0$ על $(0,\infty)$. מאותה
          סיבה $\rho(x,y)=0$ אם ורק אם $d(x,y)=0$, אם ורק אם $x=y$. סימטריה:
          $\rho(x,y)=\varphi(d(x,y))=\varphi(d(y,x))=\rho(y,x)$.
      - kind: step
        text: >-
          **תת-חיבוריות.** יהיו $a,b\ge0$. אם $a+b=0$, שני הצדדים של $\varphi(a+b)\le\varphi(a)+\varphi(b)$ הם $0$.
          אחרת נסמן $\lambda=\frac{a}{a+b}\in[0,1]$. אז $\lambda(a+b)+(1-\lambda)\cdot0=a$, ולפי הקעירות עם $s=a+b$
          ו-$t=0$:
          $\varphi(a)\ge\lambda\varphi(a+b)+(1-\lambda)\varphi(0)=\frac{a}{a+b}\varphi(a+b)$.
      - kind: step
        text: >-
          באותו אופן, עם $\frac{b}{a+b}$ במקום $\lambda$: $\varphi(b)\ge\frac{b}{a+b}\varphi(a+b)$. מחברים את שני
          אי-השוויונים: $\varphi(a)+\varphi(b)\ge\frac{a+b}{a+b}\varphi(a+b)=\varphi(a+b)$.
      - kind: step
        text: >-
          **המשולש.** $d(x,z)\le d(x,y)+d(y,z)$ ו-$\varphi$ עולה, ולכן
          $\rho(x,z)=\varphi(d(x,z))\le\varphi\big(d(x,y)+d(y,z)\big)\le\varphi(d(x,y))+\varphi(d(y,z))=\rho(x,y)+\rho(y,z)$,
          כשבצעד השני השתמשנו בתת-חיבוריות. זו בדיוק ההוכחה של הטענה על מטריקות חדשות ממטריקה קיימת בשיעור; מה
          שהוספנו הוא שקעירות מספיקה לתת-חיבוריות.
      - kind: step
        text: >-
          (ב) $\varphi(t)=\frac{t}{1+t}$: $\varphi(0)=0$ ו-$\varphi(t)>0$ ל-$t>0$. $\varphi'(t)=\frac{1}{(1+t)^2}>0$,
          ולכן $\varphi$ עולה. $\varphi''(t)=-\frac{2}{(1+t)^3}<0$, ופונקציה עם נגזרת שנייה אי-חיובית בקטע קעורה בו
          (אינפי 1). לפי (א), $\frac{d}{1+d}$ מטריקה.
      - kind: step
        text: >-
          $m(t)=\min(t,1)$: $m(0)=0$, $m(t)>0$ ל-$t>0$, ו-$m$ עולה במובן החלש. ל-$m$ אין נגזרת שנייה ב-$t=1$, ולכן
          בודקים קעירות ישירות. יהיו $s,t\ge0$ ו-$\lambda\in[0,1]$, ונסמן $w=\lambda m(s)+(1-\lambda)m(t)$. מכיוון
          ש-$m(s)\le s$ ו-$m(t)\le t$, $w\le\lambda s+(1-\lambda)t$. מכיוון ש-$m(s)\le1$ ו-$m(t)\le1$,
          $w\le\lambda+(1-\lambda)=1$. לכן $w$ קטן או שווה לקטן מבין שני החסמים, שהוא בדיוק
          $m(\lambda s+(1-\lambda)t)$. לפי (א), $\min(d,1)$ מטריקה.
      - kind: check
        text: >-
          על $\mathbb{R}$ עם $d(x,y)=|x-y|$ ובנקודות $0,1,2$: ב-$\min(d,1)$, $1\le1+1$; ב-$\frac{d}{1+d}$,
          $\frac23\le\frac12+\frac12$. את $\frac{d}{1+d}$ הוכחנו בדוגמה 3 של השיעור בחישוב ישיר; כאן התת-חיבוריות
          באה מהקעירות, בלי חישוב.
      - kind: step
        text: >-
          (ג) על $\mathbb{R}$ עם $d(x,y)=|x-y|$: $d(0,2)^2=4$, ואילו $d(0,1)^2+d(1,2)^2=1+1=2$. אי-שוויון המשולש
          נכשל, ולכן $d^2$ אינה מטריקה. ההנחה שנכשלת היא הקעירות: עם $s=0$, $t=2$, $\lambda=\frac12$,
          $\varphi(1)=1<2=\frac12\varphi(0)+\frac12\varphi(2)$. שאר ההנחות ($t^2$ עולה, $0$ רק ב-$0$) מתקיימות.
      - kind: result
        text: >-
          $\varphi\circ d$ מטריקה לכל $\varphi$ קעורה, עולה במובן החלש, עם $\varphi(0)=0$ ו-$\varphi>0$ על
          $(0,\infty)$; בפרט $\frac{d}{1+d}$ ו-$\min(d,1)$. $d^2$ אינה בהכרח מטריקה, כי $t^2$ אינה קעורה.
