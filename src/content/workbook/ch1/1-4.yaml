# Objectives (src/course.ts):
#   OBJ-1.4-1  define interior, closure and boundary and compute them for given sets
#   OBJ-1.4-2  accumulation points and isolated points; the closure in their terms
#   OBJ-1.4-3  dense sets; Q dense in R and Q^n dense in R^n
# Rebuilt on the formal spine 2026-11-10: solutions cite the lesson's numbered results (1.4.1–1.4.18) and the spine
# numbers of lessons 1.1–1.3. Numbers recomputed with tsx one-offs (W-1.4-06, W-1.4-07, W-1.4-09, c2).
lesson: '1.4'
practice:
  - id: W-1.4-01
    level: basic
    objectives: [OBJ-1.4-1]
    prompt: >-
      במישור עם $d_2$ תהי $A=[0,1]\times(0,1)$: הריבוע שבו הצלעות האנכיות שייכות לקבוצה והצלעות האופקיות לא.
      מצאו את $A^\circ$, את $\overline A$ ואת $\partial A$, ונמקו כל שלב בטענה ממוספרת מהשיעור.
    answer: >-
      $A^\circ=(0,1)\times(0,1)$, $\overline A=[0,1]\times[0,1]$, $\partial A$ היא ארבע הצלעות של הריבוע.
    solution:
      - kind: idea
        text: >-
          את הפנים נותנת טענה 1.4.2(ב): קבוצה פתוחה בתוך $A$ מוכלת בפנים. את הסגור נותנת טענה 1.4.4(ב): קבוצה סגורה
          שמכילה את $A$ מכילה את הסגור. נשאר לבדוק את הנקודות שעל הצלעות.
      - kind: step
        text: >-
          **פנים.** $Q=(0,1)\times(0,1)$ פתוחה: לנקודה $(x,y)\in Q$ ו-$r=\min(x,\ 1-x,\ y,\ 1-y)$, כל נקודה $(x',y')$
          ב-$B\big((x,y),r\big)$ מקיימת $|x'-x|\le d_2<r$ ו-$|y'-y|<r$, ולכן ב-$Q$. $Q\subseteq A$, ולפי טענה 1.4.2(ב)
          $Q\subseteq A^\circ$. נקודות הצלעות האופקיות אינן ב-$A$, ולכן אינן פנימיות ($A^\circ\subseteq A$). נקודה
          $(0,y)$ של הצלע השמאלית, ששייכת ל-$A$, אינה פנימית: כל עיגול $B\big((0,y),r\big)$ מכיל את
          $(-\tfrac r2,\ y)\notin A$; ובצלע הימנית, $(1,y)$, הנקודה $(1+\tfrac r2,\ y)$. לכן $A^\circ=Q$.
      - kind: step
        text: >-
          **סגור.** $K=[0,1]\times[0,1]$ סגורה: לנקודה מחוץ ל-$K$ יש קואורדינטה מחוץ ל-$[0,1]$, למשל $x>1$, והעיגול ברדיוס
          $x-1$ זר ל-$K$, כי $|x'-x|\le d_2$. (וכך לכל אחד מארבעת המקרים.) $A\subseteq K$, ולפי טענה 1.4.4(ב)
          $\overline A\subseteq K$. בכיוון השני, כל נקודה של $K$ בסגור: לנקודה $(a,b)\in K$ ו-$r>0$, הנקודה
          $(a,b)+t\big((\tfrac12,\tfrac12)-(a,b)\big)$ עם $t\in(0,1]$ קטן מספיק נמצאת ב-$Q\subseteq A$ ובמרחק
          $t\cdot d_2\big((a,b),(\tfrac12,\tfrac12)\big)<r$. לכן $\overline A=K$.
      - kind: step
        text: >-
          **שפה.** לפי הגדרה 1.4.6, $\partial A=\overline A\setminus A^\circ=K\setminus Q$: הנקודות של $K$ עם
          $x\in\{0,1\}$ או $y\in\{0,1\}$, כלומר ארבע הצלעות.
      - kind: check
        text: >-
          בשפה יש נקודות של $A$ (הצלעות האנכיות, בלי הפינות) ונקודות שאינן ב-$A$ (הצלעות האופקיות והפינות). לפי טענה
          1.4.6(ה), $A$ אינה סגורה (יש נקודת שפה מחוצה לה) ואינה פתוחה (יש נקודת שפה בתוכה).
      - kind: result
        text: >-
          $A^\circ=(0,1)^2$, $\overline A=[0,1]^2$, $\partial A$ = ארבע הצלעות.

  - id: W-1.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-2]
    prompt: >-
      ב-$\mathbb{R}$ תהי $A=\{\frac1n:\ n\in\mathbb{N}\}\cup[2,3]$. מצאו את $A'$, את הנקודות המבודדות של $A$,
      ואת $\overline A$. האם $2$ היא נקודה מבודדת?
    answer: >-
      $A'=\{0\}\cup[2,3]$; המבודדות הן $\frac1n$ לכל $n$; $\overline A=A\cup\{0\}$; $2$ אינה מבודדת.
    solution:
      - kind: definition
        text: >-
          הגדרה 1.4.7: $x\in A'$ אם כל כדור סביב $x$ מכיל נקודה של $A$ ששונה מ-$x$; נקודה $x\in A$ מבודדת אם יש
          כדור שבו היא הנקודה היחידה של $A$. נקודה של $A$ היא בדיוק אחד מהשניים.
      - kind: step
        text: >-
          **הקטע.** כל $x\in[2,3]$ היא נקודת הצטברות: לכל $r>0$ הקטע $(x-r,x+r)\cap[2,3]$ אינסופי, ולכן יש בו נקודה
          ששונה מ-$x$. ובפרט $2$ אינה מבודדת, אף שהיא "קצה".
      - kind: step
        text: >-
          **הסדרה.** כל $\frac1n$ מבודדת: הכדור ברדיוס $r_n=\frac1n-\frac1{n+1}$ סביבה לא מכיל אף נקודה אחרת של $A$.
          הסדרה $\frac1m$ יורדת ממש, ולכן ל-$m>n$, $\frac1n-\frac1m\ge\frac1n-\frac1{n+1}=r_n$, ול-$m<n$,
          $\frac1m-\frac1n\ge\frac1{n-1}-\frac1n>r_n$: כל $\frac1m$ אחרת, לא רק השכנות, רחוקה לפחות $r_n$. והקטע $[2,3]$
          במרחק לפחות $1>r_n$. $0$ היא נקודת
          הצטברות: כל קטע $(-r,r)$ מכיל $\frac1n$ עם $n>\frac1r$ (ארכימדס).
      - kind: step
        text: >-
          שאר הנקודות אינן נקודות הצטברות: לכל אחת יש קטע סביבה שזר ל-$A$. אם $x<0$, הרדיוס $|x|$. אם $1<x<2$, הרדיוס
          $\min(x-1,\ 2-x)$; אם $x>3$, הרדיוס $x-3$. ואם $0<x<1$ ו-$x$ אינו מהצורה $\frac1n$, יש $n$ עם
          $\frac1{n+1}<x<\frac1n$, והרדיוס $\min\big(x-\frac1{n+1},\ \frac1n-x\big)$.
      - kind: theorem
        text: >-
          לפי משפט 1.4.9, $\overline A=A\cup A'=\{\frac1n\}\cup\{0\}\cup[2,3]$.
      - kind: check
        text: >-
          לפי מסקנה 1.4.10, $A$ אינה סגורה, כי $0\in A'\setminus A$. ו-$A\cup\{0\}=\overline A$ סגורה לפי טענה 1.4.4(א).
      - kind: result
        text: >-
          $A'=\{0\}\cup[2,3]$, המבודדות $\{\frac1n: n\in\mathbb{N}\}$, $\overline A=A\cup\{0\}$, ו-$2$ אינה מבודדת.

  - id: W-1.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-3]
    prompt: >-
      ב-$\mathbb{R}$ עם $|x-y|$, קבעו אילו מהקבוצות צפופות, והוכיחו.

      (א) $\mathbb{Z}$

      (ב) $D=\{\frac{m}{2^k}:\ m\in\mathbb{Z},\ k\in\mathbb{N}\}$, השברים שהמכנה שלהם חזקה של 2.

      (ג) $\mathbb{Q}\cap(0,\infty)$
    answer: >-
      (א) לא. (ב) כן. (ג) לא: הקטע $(-2,-1)$ זר לה.
    solution:
      - kind: theorem
        text: >-
          לפי טענה 1.4.14(ג), $A$ צפופה ב-$\mathbb{R}$ אם ורק אם כל כדור, כלומר כל קטע $(a,b)$ עם $a<b$, פוגש את $A$.
      - kind: step
        text: >-
          (א) הקטע $(\tfrac14,\ \tfrac34)$ זר ל-$\mathbb{Z}$, ולכן $\mathbb{Z}$ אינה צפופה.
      - kind: step
        text: >-
          (ב) יהי $a<b$. נבחר $k$ עם $2^k>\frac1{b-a}$: קיים כי $2^k\ge k$ (אינדוקציה) ולפי תכונת ארכימדס יש $k>\frac1{b-a}$.
          אז $\frac1{2^k}<b-a$. יהי $m=\lfloor 2^ka\rfloor+1$. כמו בהוכחת משפט 1.4.15:
          $a<\frac{m}{2^k}\le a+\frac1{2^k}<b$. לכן $D$ צפופה.
      - kind: step
        text: >-
          (ג) הקטע $(-2,-1)$ אינו מכיל אף מספר חיובי, ולכן זר לקבוצה, והיא אינה צפופה ב-$\mathbb{R}$. אבל היא צפופה
          בתת-המרחב $(0,\infty)$: כדור בו הוא $(y-\varepsilon,y+\varepsilon)\cap(0,\infty)$ עם $y>0$ (הגדרה 1.3.10), והוא
          מכיל את הקטע הלא ריק $\big(\max(0,y-\varepsilon),\ y+\varepsilon\big)$, שבו יש רציונלי לפי משפט 1.4.15, וזה
          רציונלי חיובי.
      - kind: check
        text: >-
          (ב) מראה שאפשר להסתפק בפחות רציונליים מכל $\mathbb{Q}$: ההוכחה של משפט 1.4.15 השתמשה רק בכך שאפשר לבחור צעד
          $\frac1n$ קטן כרצוננו, ו-$\frac1{2^k}$ הוא צעד כזה.
      - kind: result
        text: >-
          רק (ב) צפופה ב-$\mathbb{R}$.

  - id: W-1.4-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי.

      (א) הוכיחו: אם $U$ פתוחה, אז $U\subseteq\big(\overline U\big)^\circ$; ואם $F$ סגורה, אז $\overline{F^\circ}\subseteq F$.

      (ב) הראו ב-$\mathbb{R}$ ששתי ההכלות יכולות להיות ממש.

      (ג) חשבו את $\big(\overline{\mathbb{Q}}\big)^\circ$ ואת $\overline{\mathbb{Q}^\circ}$ ב-$\mathbb{R}$. מה זה אומר על הסדר של "סגור" ו"פנים"?
    answer: >-
      (א) $U$ פתוחה בתוך $\overline U$; $\overline{F^\circ}$ הסגורה הקטנה שמכילה את $F^\circ\subseteq F$.
      (ב) $U=(0,1)\cup(1,2)$: $\big(\overline U\big)^\circ=(0,2)$. $F=[0,1]\cup\{2\}$: $\overline{F^\circ}=[0,1]$.
      (ג) $\big(\overline{\mathbb{Q}}\big)^\circ=\mathbb{R}$ ו-$\overline{\mathbb{Q}^\circ}=\emptyset$: הסדר משנה.
    solution:
      - kind: idea
        text: >-
          שתי ההכלות הן "מקסימליות" ו"מינימליות": הפנים הוא הפתוחה הגדולה ביותר בפנים (טענה 1.4.2(ב)), והסגור הוא
          הסגורה הקטנה ביותר מבחוץ (טענה 1.4.4(ב)).
      - kind: step
        text: >-
          (א) $U\subseteq\overline U$, ו-$U$ פתוחה, ולכן לפי טענה 1.4.2(ב) $U\subseteq\big(\overline U\big)^\circ$.
          $F^\circ\subseteq F$, ו-$F$ סגורה, ולכן לפי טענה 1.4.4(ב) $\overline{F^\circ}\subseteq F$.
      - kind: computation
        text: >-
          (ב) $U=(0,1)\cup(1,2)$ פתוחה (איחוד של שני כדורים, משפט 1.3.7). $[0,2]=B[1,1]$ סגורה (טענה 1.3.5) ומכילה
          את $U$, ולכן $\overline U\subseteq[0,2]$ (טענה 1.4.4(ב)); ו-$0,1,2$ נקודות הצטברות של $U$ (כל קטע סביבן
          מכיל נקודות של $(0,1)$ או של $(1,2)$ ששונות מהן), ולכן לפי משפט 1.4.9 $\overline U\supseteq U\cup\{0,1,2\}=[0,2]$.
          הפנים: $(0,2)$ פתוחה ומוכלת ב-$[0,2]$, ולכן מוכלת ב-$[0,2]^\circ$ (טענה 1.4.2(ב)); ו-$0$, $2$ אינן פנימיות,
          כי כל קטע סביבן מכיל את $-\frac r2$ או את $2+\frac r2$, שאינם ב-$[0,2]$. לכן
          $\big(\overline U\big)^\circ=(0,2)\ni1$, ו-$1\notin U$.
      - kind: computation
        text: >-
          $F=[0,1]\cup\{2\}$ סגורה (איחוד של שתי סגורות, מסקנה 1.3.8). $F^\circ=(0,1)$: $(0,1)$ פתוחה ומוכלת ב-$F$,
          ולכן ב-$F^\circ$ (טענה 1.4.2(ב)); ו-$0$, $1$, $2$ אינן פנימיות, כי כל קטע ברדיוס $r$ סביבן מכיל בהתאמה את
          $-\frac r2$, את $1+\min(\frac r2,\frac12)\in(1,\tfrac32]$ ואת $2+\frac r2$, ואף אחד מהם אינו ב-$F$. הסגור:
          $[0,1]=B[\tfrac12,\tfrac12]$ סגורה ומכילה את $(0,1)$, ולכן $\overline{(0,1)}\subseteq[0,1]$ (טענה 1.4.4(ב)); ו-$0,1$
          נקודות הצטברות של $(0,1)$, ולכן לפי משפט 1.4.9 $\overline{(0,1)}\supseteq[0,1]$. אז $\overline{F^\circ}=[0,1]$,
          ו-$2\notin[0,1]$.
      - kind: step
        text: >-
          (ג) לפי משפט 1.4.15 $\overline{\mathbb{Q}}=\mathbb{R}$, ו-$\mathbb{R}^\circ=\mathbb{R}$ (טענה 1.4.2(ג)). ולפי
          דוגמה 4 בשיעור $\mathbb{Q}^\circ=\emptyset$, ו-$\overline\emptyset=\emptyset$.
      - kind: check
        text: >-
          ב-(ג) $\mathbb{Q}$ אינה פתוחה ואינה סגורה, כך ש-(א) לא חל עליה; היא מראה ש"סגור ואחר כך פנים" ו"פנים
          ואחר כך סגור" יכולים להיות רחוקים ככל האפשר: כל הישר מול הקבוצה הריקה.
      - kind: result
        text: >-
          (א) $U\subseteq\big(\overline U\big)^\circ$, $\overline{F^\circ}\subseteq F$. (ב) $(0,1)\cup(1,2)$ ו-$[0,1]\cup\{2\}$.
          (ג) $\mathbb{R}$ מול $\emptyset$.

  - id: W-1.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-2]
    prompt: >-
      $X$ מרחב מטרי ו-$A,E\subseteq X$.

      (א) הוכיחו: אם $A\subseteq E$ אז $A'\subseteq E'$.

      (ב) הוכיחו: $(A\cup E)'=A'\cup E'$.

      (ג) הוכיחו או הפריכו: לכל משפחה $(A_n)_{n\in\mathbb{N}}$, $\big(\bigcup_nA_n\big)'=\bigcup_nA_n'$.
    answer: >-
      (א) מההגדרה. (ב) $\supseteq$ מ-(א); $\subseteq$ בשלילה, עם המינימום של שני רדיוסים. (ג) לא נכון:
      $A_n=\{q_n\}$ לסידור $q_1,q_2,\dots$ של $\mathbb{Q}$: $\bigcup_nA_n'=\emptyset$ ו-$\big(\bigcup_nA_n\big)'=\mathbb{Q}'=\mathbb{R}$.
    solution:
      - kind: definition
        text: >-
          הגדרה 1.4.7: $x\in A'$ אם $B(x,r)\cap(A\setminus\{x\})\ne\emptyset$ לכל $r>0$.
      - kind: step
        text: >-
          (א) $A\setminus\{x\}\subseteq E\setminus\{x\}$, ולכן כל כדור שפוגש את הראשונה פוגש את השנייה.
      - kind: step
        text: >-
          (ב) ($\supseteq$) $A\subseteq A\cup E$ ו-$E\subseteq A\cup E$, ולפי (א) $A'\cup E'\subseteq(A\cup E)'$.
      - kind: step
        text: >-
          ($\subseteq$) נניח $x\notin A'\cup E'$. אז יש $r_1>0$ עם $B(x,r_1)\cap(A\setminus\{x\})=\emptyset$ ו-$r_2>0$ עם
          $B(x,r_2)\cap(E\setminus\{x\})=\emptyset$. נגדיר $r=\min(r_1,r_2)>0$. אז $B(x,r)$ זר ל-$A\setminus\{x\}$ ול-$E\setminus\{x\}$,
          ולכן ל-$(A\cup E)\setminus\{x\}$: $x\notin(A\cup E)'$.
      - kind: step
        text: >-
          (ג) **לא נכון.** $\mathbb{Q}$ בת מנייה (אינפי 1); נסדר אותה בסדרה $q_1,q_2,\dots$ ונגדיר $A_n=\{q_n\}$. לפי
          טענה 1.4.8(ב), לקבוצה סופית אין נקודות הצטברות, ולכן $\bigcup_nA_n'=\emptyset$. אבל $\bigcup_nA_n=\mathbb{Q}$,
          ו-$\mathbb{Q}'=\mathbb{R}$: לכל $x\in\mathbb{R}$ ו-$r>0$ יש לפי משפט 1.4.15 רציונלי בקטע $(x,\ x+r)$, והוא
          שונה מ-$x$ ונמצא ב-$B(x,r)$.
      - kind: check
        text: >-
          איפה ההוכחה של (ב) נכשלת לאינסוף קבוצות? במינימום: ל-$x$ נתון, הרדיוס שמרחיק את $q_n$ הוא $|x-q_n|$ (כש-$q_n\ne x$),
          והאינפימום של כל הרדיוסים האלה הוא $0$, כי $\mathbb{Q}$ צפופה. זו אותה תופעה כמו בדוגמה הנגדית אחרי טענה 1.4.2.
      - kind: result
        text: >-
          (א) $A'\subseteq E'$. (ב) $(A\cup E)'=A'\cup E'$. (ג) לא נכון לאינסוף קבוצות: הנקודות של $\mathbb{Q}$, כל אחת
          לבד, נותנות $\emptyset$ מול $\mathbb{R}$.

  - id: W-1.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-2, OBJ-1.4-3]
    prompt: >-
      על $\mathbb{N}$ נגדיר $\rho(m,n)=\left|\frac1m-\frac1n\right|$. זו מטריקה לפי טענה 1.1.13(ב), כי $n\mapsto\frac1n$
      חד-חד-ערכית. במרחב הזה כל המרחקים קטנים מ-1, והכדורים הגדולים
      מכילים נקודות רבות, כך שהוא אינו "נראה" בדיד.

      (א) הוכיחו שכל $n\in\mathbb{N}$ היא נקודה מבודדת של $\mathbb{N}$: מצאו $r_n>0$ עם $B(n,r_n)=\{n\}$.

      (ב) תהי $A\subseteq\mathbb{N}$ כלשהי. מצאו את $A^\circ$, $\overline A$, $\partial A$ ו-$A'$.

      (ג) אילו תת-קבוצות של $(\mathbb{N},\rho)$ צפופות? והאם לקבוצה $\{\frac1n:\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$ יש נקודת
      הצטברות? הסבירו את ההבדל.
    answer: >-
      (א) $r_n=\frac1n-\frac1{n+1}=\frac1{n(n+1)}$. (ב) $A^\circ=\overline A=A$, $\partial A=A'=\emptyset$. (ג) רק
      $\mathbb{N}$ צפופה. ב-$\mathbb{R}$ ל-$\{\frac1n\}$ יש נקודת הצטברות, $0$, אבל $0$ אינה במרחב $(\mathbb{N},\rho)$.
    solution:
      - kind: idea
        text: >-
          המספרים $\frac1n$ מסודרים בישר בסדר יורד, והשכנה הקרובה ביותר של $\frac1n$ היא $\frac1{n+1}$. כדור ברדיוס
          המרחק אליה לא מכיל אף נקודה אחרת. מרגע שכל נקודה מבודדת, כל החישובים הם כמו במטריקה הבדידה, אבל צריך את (א)
          במקום $B(x,\tfrac12)=\{x\}$.
      - kind: step
        text: >-
          (א) $\rho(m,n)$ הוא בדיוק המרחק בישר בין $\frac1m$ ל-$\frac1n$, ולכן החישוב בדוגמה שאחרי טענה 1.4.8 עובר
          כמו שהוא: עם $r_n=\frac1n-\frac1{n+1}=\frac1{n(n+1)}$, כל $m\ne n$ מקיים $\rho(m,n)\ge r_n$, ו-$B(n,r_n)=\{n\}$.
      - kind: step
        text: >-
          (ב) כל תת-קבוצה $A$ פתוחה: לכל $n\in A$, $B(n,r_n)=\{n\}\subseteq A$. לכן כל תת-קבוצה גם סגורה (המשלים
          שלה פתוח). לפי טענות 1.4.2(ג) ו-1.4.4(ג), $A^\circ=A=\overline A$, ולכן $\partial A=\emptyset$. ואף נקודה אינה
          נקודת הצטברות, כי $B(n,r_n)$ לא מכיל נקודה אחרת: $A'=\emptyset$.
      - kind: step
        text: >-
          (ג) $A$ צפופה אם $\overline A=\mathbb{N}$ (הגדרה 1.4.13), ו-$\overline A=A$, ולכן רק $A=\mathbb{N}$ צפופה, כמו
          במטריקה הבדידה (טענה 1.4.17).
      - kind: step
        text: >-
          ב-$\mathbb{R}$, הקבוצה $\{\frac1n\}$ היא "אותן נקודות" בדיוק, ושם $0$ נקודת הצטברות (אותה דוגמה). ההבדל: $0$ היא נקודה של
          $\mathbb{R}$, ולא של המרחב $(\mathbb{N},\rho)$. נקודות ההצטברות תלויות במרחב שבו מסתכלים, כמו הפתיחות בשיעור 1.3.
      - kind: check
        text: >-
          מספרים: $r_1=\frac12$, ו-$\rho(1,2)=\frac12$ אינו קטן ממש מ-$\frac12$. $r_3=\frac1{12}$, ו-$\rho(3,4)=\frac1{12}$
          בדיוק, ו-$\rho(2,3)=\frac16>\frac1{12}$. כלומר הרדיוס $r_n$ הוא הגדול ביותר שמבודד את $n$.
      - kind: result
        text: >-
          (א) $B\big(n,\frac1{n(n+1)}\big)=\{n\}$. (ב) $A^\circ=\overline A=A$, $\partial A=A'=\emptyset$. (ג) רק
          $\mathbb{N}$ צפופה; ל-$\{\frac1n\}$ בתוך $\mathbb{R}$ יש נקודת הצטברות $0$, שאינה במרחב $(\mathbb{N},\rho)$.

  - id: W-1.4-07
    level: mid
    objectives: [OBJ-1.4-3, OBJ-1.4-1]
    prompt: >-
      במישור עם $d_2$ יהיו $\ell=\{(t,\ \sqrt2\,t):\ t\in\mathbb{R}\}$ הישר $y=\sqrt2x$, ו-$L=\{(q,\ \sqrt2\,q):\ q\in\mathbb{Q}\}$.

      (א) הוכיחו ש-$L$ צפופה בתת-המרחב $\ell$.

      (ב) הוכיחו ש-$\ell$ סגורה במישור. רמז: לנקודה $(a,b)$ עם $b\ne\sqrt2a$ השתמשו באי-שוויון קושי-שוורץ
      $|u_1|+\sqrt2|u_2|\le\sqrt3\,\|u\|_2$.

      (ג) הסיקו ש-$\overline L=\ell$ במישור, ולכן $L$ **אינה** צפופה במישור. מה הרדיוס הגדול ביותר של עיגול סביב
      $(1,0)$ שזר ל-$L$?
    answer: >-
      (א) $d_2\big((t,\sqrt2t),(q,\sqrt2q)\big)=\sqrt3\,|t-q|$. (ב) העיגול ברדיוס $\frac{|b-\sqrt2a|}{\sqrt3}$ זר ל-$\ell$.
      (ג) $\overline L=\ell\ne\mathbb{R}^2$; הרדיוס $\sqrt{2/3}\approx0.8165$.
    solution:
      - kind: idea
        text: >-
          $L$ היא העתק של $\mathbb{Q}$ על הישר, ולכן צפופה בו לפי משפט 1.4.15. אבל הישר עצמו סגור ודק, ולכן הסגור של $L$
          במישור לא יכול לצאת ממנו (טענה 1.4.4(ב)).
      - kind: step
        text: >-
          (א) כדור בתת-המרחב $\ell$ הוא $B(x,\varepsilon)\cap\ell$ (הגדרה 1.3.10). יהיו $x=(t,\sqrt2t)\in\ell$ ו-$\varepsilon>0$.
          לפי משפט 1.4.15 יש $q\in\mathbb{Q}$ עם $|t-q|<\frac{\varepsilon}{\sqrt3}$. אז
          $d_2\big(x,(q,\sqrt2q)\big)=\sqrt{(t-q)^2+2(t-q)^2}=\sqrt3\,|t-q|<\varepsilon$. לפי טענה 1.4.14(ג), $L$ צפופה ב-$\ell$.
      - kind: step
        text: >-
          (ב) תהי $(a,b)\notin\ell$, ו-$\delta=|b-\sqrt2a|>0$. לנקודה $(x,y)$ עם $d_2\big((x,y),(a,b)\big)<\rho=\frac{\delta}{\sqrt3}$,
          לפי קושי-שוורץ ב-$\mathbb{R}^2$ (אלגברה לינארית) עם הווקטורים $(1,\sqrt2)$ ו-$(|y-b|,|x-a|)$:
          $|y-b|+\sqrt2|x-a|\le\sqrt3\,d_2<\delta$.
      - kind: step
        text: >-
          לכן $|y-\sqrt2x|\ge|b-\sqrt2a|-|y-b|-\sqrt2|x-a|>\delta-\delta=0$: $(x,y)\notin\ell$. העיגול $B\big((a,b),\rho\big)$
          זר ל-$\ell$, המשלים פתוח, ו-$\ell$ סגורה.
      - kind: step
        text: >-
          (ג) $\ell$ סגורה ומכילה את $L$, ולכן $\overline L\subseteq\ell$ (טענה 1.4.4(ב)). ולכל $x\in\ell$ ו-$\varepsilon>0$
          מצאנו ב-(א) נקודה של $L$ במרחק קטן מ-$\varepsilon$, ולכן $\ell\subseteq\overline L$. לכן $\overline L=\ell\ne\mathbb{R}^2$,
          ו-$L$ אינה צפופה במישור.
      - kind: computation
        text: >-
          ל-$(a,b)=(1,0)$: $\delta=\sqrt2$, ו-$\rho=\frac{\sqrt2}{\sqrt3}=\sqrt{2/3}\approx0.8165$. זה הגדול ביותר: הנקודה
          $\big(\frac13,\ \frac{\sqrt2}3\big)\in\ell$ במרחק $\sqrt{\frac49+\frac29}=\sqrt{2/3}$ מ-$(1,0)$, ולכן כל עיגול
          גדול יותר מכיל אותה ואת נקודות $\ell$ הסמוכות לה, ובהן נקודות של $L$ לפי (א).
      - kind: check
        text: >-
          $L$ צפופה **בתוך הישר**, כמו ש-$\mathbb{Q}$ צפופה ב-$\mathbb{R}$, אבל לא במישור: צפיפות תלויה במרחב. השוו ל-$\mathbb{Q}^2$,
          שצפופה במישור (משפט 1.4.16).
      - kind: result
        text: >-
          (א) $L$ צפופה ב-$\ell$. (ב) $\ell$ סגורה. (ג) $\overline L=\ell$; $L$ אינה צפופה במישור; הרדיוס המקסימלי
          סביב $(1,0)$ הוא $\sqrt{2/3}$.

  - id: W-1.4-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי ו-$A,E\subseteq X$.

      (א) הוכיחו: $\partial(A\cup E)\subseteq\partial A\cup\partial E$.

      (ב) הוכיחו: תמיד $\partial(\partial A)\subseteq\partial A$; ואם $A$ סגורה או פתוחה, אז $(\partial A)^\circ=\emptyset$ ו-$\partial(\partial A)=\partial A$.

      (ג) הראו שבלי ההנחה של (ב) השוויון יכול להיכשל.
    answer: >-
      (א) $\partial(A\cup E)\subseteq(\overline A\cup\overline E)\cap\overline{X\setminus A}\cap\overline{X\setminus E}$.
      (ב) $\partial A$ סגורה; כדור בתוך $\partial A\subseteq A$ היה הופך נקודת שפה לנקודה פנימית. (ג) $\partial\mathbb{Q}=\mathbb{R}$
      ו-$\partial\mathbb{R}=\emptyset$.
    solution:
      - kind: idea
        text: >-
          הכלי הוא הנוסחה $\partial A=\overline A\cap\overline{X\setminus A}$ (טענה 1.4.6(ב)), יחד עם
          $\overline{A\cup E}=\overline A\cup\overline E$ (טענה 1.4.5(ג)) והמונוטוניות של הסגור (טענה 1.4.4(ד)).
      - kind: step
        text: >-
          (א) $X\setminus(A\cup E)$ מוכלת ב-$X\setminus A$ וב-$X\setminus E$, ולכן לפי טענה 1.4.4(ד)
          $\overline{X\setminus(A\cup E)}\subseteq\overline{X\setminus A}\cap\overline{X\setminus E}$. לפי טענות 1.4.6(ב) ו-1.4.5(ג):
          $$\partial(A\cup E)=\overline{A\cup E}\cap\overline{X\setminus(A\cup E)}\subseteq(\overline A\cup\overline E)\cap\overline{X\setminus A}\cap\overline{X\setminus E}.$$
      - kind: step
        text: >-
          תהי $x$ בצד ימין. אם $x\in\overline A$, אז $x\in\overline A\cap\overline{X\setminus A}=\partial A$; אחרת
          $x\in\overline E$, ו-$x\in\overline E\cap\overline{X\setminus E}=\partial E$.
      - kind: step
        text: >-
          (ב) $\partial A$ סגורה (טענה 1.4.6(ב)), ולכן שווה לסגור שלה (טענה 1.4.4(ג)), ו-$\partial(\partial A)=\partial A\setminus(\partial A)^\circ\subseteq\partial A$.
      - kind: step
        text: >-
          נניח ש-$A$ סגורה. לפי טענה 1.4.6(ה), $\partial A\subseteq A$. נניח בשלילה ש-$x\in(\partial A)^\circ$: יש $r>0$ עם
          $B(x,r)\subseteq\partial A\subseteq A$. אז $x\in A^\circ$. אבל $x\in\partial A=\overline A\setminus A^\circ$, סתירה.
          לכן $(\partial A)^\circ=\emptyset$, ו-$\partial(\partial A)=\partial A\setminus\emptyset=\partial A$.
      - kind: step
        text: >-
          אם $A$ פתוחה, $X\setminus A$ סגורה (הגדרה 1.3.4), ו-$\partial A=\partial(X\setminus A)$ (טענה 1.4.6(ג)). לפי המקרה
          הקודם על $X\setminus A$: $(\partial A)^\circ=\emptyset$ ו-$\partial(\partial A)=\partial A$.
      - kind: step
        text: >-
          (ג) ב-$\mathbb{R}$, $\partial\mathbb{Q}=\mathbb{R}$ (דוגמה 4 בשיעור). $\mathbb{R}$ פתוחה וסגורה בעצמה, ולכן לפי טענה
          1.4.6(ה) $\partial\mathbb{R}=\emptyset$. לכן $\partial(\partial\mathbb{Q})=\emptyset\ne\mathbb{R}=\partial\mathbb{Q}$. ו-$\mathbb{Q}$
          אכן אינה סגורה ואינה פתוחה.
      - kind: check
        text: >-
          על $A=[0,1)$ (לא סגורה ולא פתוחה, ובכל זאת): $\partial A=\{0,1\}$, סופית ולכן סגורה ובלי פנים, ו-$\partial\{0,1\}=\{0,1\}$.
          ההנחה של (ב) מספיקה, לא הכרחית. וב-(א) ההכלה יכולה להיות ממש: $\partial[0,1]\cup\partial[1,2]=\{0,1,2\}$, אבל
          $\partial[0,2]=\{0,2\}$.
      - kind: result
        text: >-
          (א) $\partial(A\cup E)\subseteq\partial A\cup\partial E$. (ב) $\partial\partial A\subseteq\partial A$, ושוויון כש-$A$
          סגורה או פתוחה. (ג) $\partial\partial\mathbb{Q}=\emptyset\ne\partial\mathbb{Q}$.

  - id: W-1.4-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.4-3]
    prompt: >-
      (א) תהי $L_{\mathbb{Q}}\subseteq C[0,1]$ קבוצת הקווים השבורים שהצמתים שלהם $t_i=\frac im$ ($m\in\mathbb{N}$) והערכים
      בצמתים רציונליים. הוכיחו ש-$L_{\mathbb{Q}}$ צפופה ב-$(C[0,1],d_\infty)$.

      (ב) במשפט 1.4.18 הקטע **סגור**. במרחב $B((0,1])$ של הפונקציות החסומות על $(0,1]$ עם $d_\infty$ (הגדרה 1.1.7), תהי
      $f(x)=\sin\frac1x$, רציפה וחסומה. פונקציה $g$ על $(0,1]$ היא לינארית למקוטעין אם יש $0=t_0<t_1<\dots<t_m=1$ כך
      ש-$g$ רציפה ועל $(t_0,t_1]$ ועל כל $[t_{i-1},t_i]$, $i\ge2$, היא מהצורה $\alpha t+\beta$. הוכיחו
      ש-$d_\infty(f,g)\ge1$ לכל $g$ כזו.
    answer: >-
      (א) לפי משפט 1.4.18 קו שבור עם צמתים $\frac im$ קרוב ל-$f$; מחליפים את ערכיו ברציונליים קרובים, והשינוי קטן
      ב-$d_\infty$. (ב) על $(0,t_1]$, $g=\alpha t+\beta$, ו-$f$ מקבלת $1$ ו-$-1$ קרוב ל-$0$: $\sup|f-g|\ge\max(|1-\beta|,|1+\beta|)\ge1$.
    solution:
      - kind: idea
        text: >-
          (א) שני קירובים בזה אחר זה, כל אחד בתקציב $\frac\varepsilon2$: קו שבור עם ערכי $f$ בצמתים (משפט 1.4.18),
          ואחר כך ערכים רציונליים במקום ערכי $f$ (משפט 1.4.15). (ב) הקטע הראשון של $g$ ישר, ו-$f$ מתנודדת בו בין $1$ ל-$-1$
          אינסוף פעמים: ישר לא יכול להיות קרוב לשני הערכים.
      - kind: step
        text: >-
          (א) יהיו $f\in C[0,1]$ ו-$\varepsilon>0$. לפי משפט 1.4.18(א) יש $m$ כך שהקו השבור $g$ עם הצמתים $t_i=\frac im$
          ו-$g(t_i)=f(t_i)$ מקיים $d_\infty(f,g)<\frac\varepsilon2$.
      - kind: step
        text: >-
          לפי משפט 1.4.15 נבחר $q_i\in\mathbb{Q}$ עם $|q_i-f(t_i)|<\frac\varepsilon2$, ל-$i=0,\dots,m$, ונגדיר את $h\in L_{\mathbb{Q}}$
          שמחבר בקווים ישרים את $(t_i,q_i)$. על $[t_{i-1},t_i]$, עם $\lambda=m(t-t_{i-1})\in[0,1]$:
          $$g(t)-h(t)=(1-\lambda)\big(f(t_{i-1})-q_{i-1}\big)+\lambda\big(f(t_i)-q_i\big),$$
          ולכן $|g(t)-h(t)|<(1-\lambda)\frac\varepsilon2+\lambda\frac\varepsilon2=\frac\varepsilon2$.
      - kind: step
        text: >-
          $|g-h|$ רציפה על $[0,1]$, ולפי ויירשטראס המקסימום שלה מתקבל בנקודה, ולכן $d_\infty(g,h)<\frac\varepsilon2$. לפי
          אי-שוויון המשולש $d_\infty(f,h)<\varepsilon$, ולפי טענה 1.4.14(ג) $L_{\mathbb{Q}}$ צפופה.
      - kind: step
        text: >-
          (ב) תהי $g$ כזו; על $(0,t_1]$, $g(t)=\alpha t+\beta$. קודם, $g$ חסומה, ולכן $g\in B((0,1])$ ו-$d_\infty(f,g)$
          מוגדר: על $(0,t_1]$, $|g|\le|\alpha|+|\beta|$; ועל $[t_1,1]$ $g$ רציפה, ולפי משפט ויירשטראס חסומה. נגדיר $x_k=\frac{1}{\pi/2+2\pi k}$ ו-$y_k=\frac{1}{3\pi/2+2\pi k}$:
          $f(x_k)=1$, $f(y_k)=-1$, ושתי הסדרות שואפות ל-$0$, ולכן מ-$k$ מסוים הן ב-$(0,t_1]$.
      - kind: step
        text: >-
          לכל $k$ כזה, $d_\infty(f,g)\ge|f(x_k)-g(x_k)|=|1-\beta-\alpha x_k|\ge|1-\beta|-|\alpha|x_k$. כש-$k\to\infty$,
          $x_k\to0$, ולכן $d_\infty(f,g)\ge|1-\beta|$. מאותו חישוב עם $y_k$: $d_\infty(f,g)\ge|1+\beta|$.
      - kind: step
        text: >-
          לכן $d_\infty(f,g)\ge\max(|1-\beta|,|1+\beta|)\ge\frac{|1-\beta|+|1+\beta|}{2}\ge\frac{|(1-\beta)+(1+\beta)|}{2}=1$.
          כלומר הכדור $B(f,1)$ ב-$B((0,1])$ זר לקבוצת הקווים השבורים: הם אינם צפופים שם.
      - kind: check
        text: >-
          איפה ההוכחה של משפט 1.4.18 נשברת? בשלב 1: $\sin\frac1x$ רציפה על $(0,1]$ אבל אינה רציפה במידה שווה, כי
          $|x_k-y_k|\to0$ ו-$|f(x_k)-f(y_k)|=2$. משפט קנטור דורש קטע סגור וחסום. ו-$L_{\mathbb{Q}}$ היא בת מנייה (כל
          איבר נקבע על ידי $m$ ו-$m+1$ רציונליים); בשיעור 4.4 נראה שזה הופך את $C[0,1]$ למרחב ספרבילי.
      - kind: result
        text: >-
          (א) $L_{\mathbb{Q}}$ צפופה ב-$(C[0,1],d_\infty)$. (ב) $d_\infty(\sin\frac1x,\ g)\ge1$ לכל קו שבור $g$ על $(0,1]$: בלי
          קטע סגור משפט 1.4.18 נכשל.

  - id: W-1.4-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.4-3, OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי.

      (א) הוכיחו: אם $U$ ו-$V$ פתוחות וצפופות ב-$X$, אז $U\cap V$ צפופה ב-$X$.

      (ב) נכון או לא נכון: החיתוך של שתי קבוצות צפופות ב-$X$ צפוף. הוכיחו או תנו דוגמה נגדית.

      (ג) הסיקו: אם $F_1,F_2$ סגורות ו-$F_1^\circ=F_2^\circ=\emptyset$, אז $(F_1\cup F_2)^\circ=\emptyset$.
    answer: >-
      (א) כדור $B$ פוגש את $U$; $B\cap U$ פתוחה ולא ריקה ולכן מכילה כדור, שפוגש את $V$. (ב) לא נכון:
      $\mathbb{Q}\cap(\mathbb{R}\setminus\mathbb{Q})=\emptyset$. (ג) המשלימים פתוחים וצפופים; מפעילים את (א) ועוברים
      למשלים.
    solution:
      - kind: goal
        text: >-
          (א) לפי טענה 1.4.14(ג): לכל $x\in X$ ו-$r>0$, $B(x,r)\cap U\cap V\neq\emptyset$.
      - kind: idea
        text: >-
          הפתיחות של $U$ מאפשרת להחליף את "הכדור פוגש את $U$" ב"יש כדור קטן **בתוך** $B(x,r)\cap U$". את הכדור הקטן
          הזה פוגשת $V$, כי היא צפופה.
      - kind: step
        text: >-
          (א) $U$ צפופה, ולכן לפי טענה 1.4.14(ג) יש $y\in B(x,r)\cap U$. החיתוך $B(x,r)\cap U$ הוא חיתוך של שתי פתוחות
          (משפט 1.3.3), ולכן פתוח (משפט 1.3.7), ויש $s>0$ עם $B(y,s)\subseteq B(x,r)\cap U$.
      - kind: step
        text: >-
          $V$ צפופה, ולכן יש $z\in B(y,s)\cap V$. אז $z\in B(x,r)$, $z\in U$ ו-$z\in V$, כלומר
          $B(x,r)\cap U\cap V\neq\emptyset$.
      - kind: step
        text: >-
          (ב) **לא נכון.** ב-$\mathbb{R}$, $\mathbb{Q}$ ו-$\mathbb{R}\setminus\mathbb{Q}$ צפופות (משפט 1.4.15 ודוגמה 4 בשיעור),
          והחיתוך שלהן ריק, שאינו צפוף.
      - kind: step
        text: >-
          (ג) $U_j=X\setminus F_j$ פתוחה (הגדרה 1.3.4). לפי טענה 1.4.5(א),
          $X\setminus\overline{U_j}=(X\setminus U_j)^\circ=F_j^\circ=\emptyset$, ולכן $U_j$ צפופה. לפי (א),
          $U_1\cap U_2$ צפופה, ושוב לפי טענה 1.4.5(א):
          $(F_1\cup F_2)^\circ=\big(X\setminus(U_1\cap U_2)\big)^\circ=X\setminus\overline{U_1\cap U_2}=\emptyset$.
      - kind: check
        text: >-
          איפה (ב) נכשל לעומת (א)? ב-$\mathbb{Q}$ אין כדור קטן בתוך $B(x,r)\cap\mathbb{Q}$, כי הפנים שלה ריק. בלי
          פתיחות אין "כדור קטן" לתת ל-$V$. ו-(ג) נכשל בלי סגירות: $\mathbb{Q}^\circ=(\mathbb{R}\setminus\mathbb{Q})^\circ=\emptyset$,
          אבל $(\mathbb{Q}\cup(\mathbb{R}\setminus\mathbb{Q}))^\circ=\mathbb{R}$.
      - kind: result
        text: >-
          (א) חיתוך של שתי פתוחות צפופות צפוף. (ב) לא נכון בלי פתיחות: $\mathbb{Q}$ והאי-רציונליים. (ג) איחוד של שתי
          סגורות בלי פנים הוא בלי פנים.
challenge:
  - id: W-1.4-c1
    stars: 1
    objectives: [OBJ-1.4-2, OBJ-1.4-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $E\subseteq X$, ו-$E'$ קבוצת נקודות ההצטברות של $E$.

      (א) הוכיחו ש-$E'$ סגורה, כלומר שכל נקודת הצטברות של $E'$ שייכת ל-$E'$.

      (ב) הראו בדוגמה ב-$\mathbb{R}$ שקבוצת הנקודות המבודדות של $E$ אינה בהכרח סגורה, אפילו כש-$E$ עצמה סגורה.
      רמז: $E=\mathbb{Z}\cup\{k+\frac1n:\ k\in\mathbb{Z},\ n\ge2\}$.
    answer: >-
      (א) אם $x$ נקודת הצטברות של $E'$, כל כדור $B(x,r)$ מכיל $y\in E'$ עם $y\ne x$, וכדור קטן סביב $y$, שנשאר בתוך
      $B(x,r)$ ולא מגיע ל-$x$, מכיל נקודה של $E$ ששונה מ-$x$; לכן $x\in E'$. (ב) ב-$E=\mathbb{Z}\cup\{k+\frac1n:\ n\ge2\}$:
      $E'=\mathbb{Z}\subseteq E$, כך ש-$E$ סגורה; המבודדות הן $I=E\setminus\mathbb{Z}$, ו-$I'=\mathbb{Z}$ זרה ל-$I$.
    solution:
      - kind: given
        text: >-
          $(X,d)$ מרחב מטרי, $E\subseteq X$. $x\in E'$ אם כל כדור $B(x,r)$ מכיל נקודה של $E$ ששונה מ-$x$ (הגדרה 1.4.7).
      - kind: goal
        text: >-
          (א) לפי מסקנה 1.4.10, קבוצה $A$ סגורה אם ורק אם $A'\subseteq A$. לכן צריך להראות: כל נקודת
          הצטברות $x$ של $E'$ שייכת ל-$E'$, כלומר לכל $r>0$ יש $z\in E$ עם $z\ne x$ ו-$d(x,z)<r$.
      - kind: idea
        text: >-
          להיות קרובים לנקודה של $E'$ פירושו להיות קרובים לנקודות שמוקפות בנקודות של $E$. לוקחים נקודה $y\in E'$ בתוך
          $B(x,r)$, ומקטינים את הכדור סביב $y$ כך שיישאר בתוך $B(x,r)$ ולא יגיע עד $x$. הנקודה של $E$ שבתוכו היא
          המבוקשת.
      - kind: step
        text: >-
          תהי $x$ נקודת הצטברות של $E'$ ויהי $r>0$. יש $y\in E'$ עם $y\ne x$ ו-$d(x,y)<r$, כלומר
          $0<d(x,y)<r$. נגדיר $s=\min\big(r-d(x,y),\ d(x,y)\big)$; שני המספרים חיוביים, ולכן $s>0$.
      - kind: step
        text: >-
          $y\in E'$, ולכן הכדור $B(y,s)$ מכיל נקודה $z\in E$ (עם $z\ne y$, אבל זה לא נחוץ לנו).
      - kind: step
        text: >-
          $z$ בתוך $B(x,r)$: לפי אי-שוויון המשולש, $d(x,z)\le d(x,y)+d(y,z)<d(x,y)+\big(r-d(x,y)\big)=r$.
      - kind: step
        text: >-
          $z\ne x$: $d(y,z)<s\le d(x,y)$. אילו $z=x$, היינו מקבלים $d(y,x)<d(x,y)$, וזה בלתי אפשרי. כאן נחוץ החלק
          השני של המינימום בהגדרת $s$.
      - kind: step
        text: >-
          $r>0$ היה כלשהו, ולכן כל כדור $B(x,r)$ מכיל נקודה של $E$ ששונה מ-$x$: $x\in E'$. כלומר $(E')'\subseteq E'$,
          ו-$E'$ סגורה.
      - kind: check
        text: >-
          בדוגמאות מהשיעור: לקבוצה $\{\frac1n\}$, $E'=\{0\}$; לקבוצה $(0,1)\cup(1,2]\cup\{3\}$ (דוגמה 1), $E'=[0,2]$; ול-$\mathbb{Q}$,
          $E'=\mathbb{R}$. שלושתן סגורות, אף ש-$E$ עצמה אינה סגורה באף אחד מהמקרים.
      - kind: step
        text: >-
          (ב) ב-$\mathbb{R}$ תהי $E=\mathbb{Z}\cup\{k+\frac1n:\ k\in\mathbb{Z},\ n\ge2\}$. בכל קטע $[k,k+1)$ הנקודות של $E$
          הן $k$ והנקודות $k+\frac1n$, $n\ge2$, וכולן ב-$[k,\ k+\tfrac12]$; בקטע $(k+\tfrac12,\ k+1)$ אין נקודות של $E$.
      - kind: step
        text: >-
          **כל $s=k+\frac1n$ ($n\ge2$) מבודדת.** נגדיר $\rho=\frac1n-\frac1{n+1}\le\frac16$. הסדרה $\frac1m$ יורדת ממש,
          ולכן ל-$m\ne n$, $m\ge2$: $|s-(k+\frac1m)|\ge\rho$ (כמו בדוגמה שאחרי טענה 1.4.8). המרחק מ-$s$ ל-$k$ הוא
          $\frac1n>\rho$; וכל נקודה אחרת של $E$ קטנה או שווה ל-$k-\frac12$ או גדולה או שווה ל-$k+1$, במרחק לפחות
          $\frac12>\rho$ מ-$s\in(k,\ k+\tfrac12]$. לכן $B(s,\rho)\cap E=\{s\}$.
      - kind: step
        text: >-
          **כל $k\in\mathbb{Z}$ היא נקודת הצטברות של $I=E\setminus\mathbb{Z}$.** לכל $r>0$, לפי תכונת ארכימדס יש
          $n\ge2$ עם $\frac1n<r$, ואז $k+\frac1n\in I\cap B(k,r)$, ושונה מ-$k$. בפרט $k\in E'$, ולפי טענה 1.4.7א $k$
          אינה מבודדת. לכן קבוצת המבודדות היא בדיוק $I$.
      - kind: step
        text: >-
          **$E$ סגורה.** תהי $x\notin E$, ו-$k=\lfloor x\rfloor$, כך ש-$k<x<k+1$. אם $x>k+\frac12$, הקטע ברדיוס
          $\min\big(x-k-\frac12,\ k+1-x\big)$ זר ל-$E$. אחרת $k<x<k+\frac12$ ו-$x$ אינו מהצורה $k+\frac1m$, ולכן יש $n\ge2$
          עם $k+\frac1{n+1}<x<k+\frac1n$, והקטע ברדיוס $\min\big(x-k-\frac1{n+1},\ k+\frac1n-x\big)$ זר ל-$E$. לכן
          $x\notin E'$, כלומר $E'\subseteq E$, ולפי מסקנה 1.4.10 $E$ סגורה.
      - kind: step
        text: >-
          **$I$ אינה סגורה.** כל שלם $k$ הוא נקודת הצטברות של $I$ שאינה ב-$I$, ולפי מסקנה 1.4.10 $I$ אינה סגורה.
          יתרה מזו, $I'=\mathbb{Z}$: מההגדרה $I'\subseteq E'$ (כי $I\subseteq E$), $E'\subseteq E$, ונקודות $I$ מבודדות ולכן
          אינן ב-$E'$; כלומר $\mathbb{Z}\subseteq I'\subseteq E'\subseteq\mathbb{Z}$. לנקודות המבודדות יש אינסוף נקודות
          הצטברות, כולן ב-$E$, ולפי משפט 1.4.9 $\overline I=I\cup\mathbb{Z}=E$.
      - kind: result
        text: >-
          (א) קבוצת נקודות ההצטברות של כל קבוצה סגורה. (ב) קבוצת הנקודות המבודדות לא בהכרח, אפילו של קבוצה סגורה:
          ל-$E=\mathbb{Z}\cup\{k+\frac1n\}$ היא $E\setminus\mathbb{Z}$, שהסגור שלה הוא $E$.
    source:
      name: 'Harvard University, Math 112, Homework 2 (due February 14, 2019)'
      year: 2019
      problem: 'Problem 5 (the source asks for part (א) only; part (ב) is added)'
      url: 'https://people.math.harvard.edu/~auroux/112s19/hw2.pdf'
      verified: '2026-11-10'
      adapted: true

  - id: W-1.4-c2
    stars: 2
    objectives: [OBJ-1.4-3]
    prompt: >-
      האם הקבוצה $S=\{2^m3^n:\ m,n\in\mathbb{Z}\}$ צפופה בקרן $(0,\infty)$, כתת-מרחב של $\mathbb{R}$? כלומר: האם לכל
      $y>0$ ולכל $\varepsilon>0$ יש $s\in S$ עם $|s-y|<\varepsilon$? (המעריכים שלמים, גם שליליים.)

      (א) תהי $G\subseteq\mathbb{R}$ קבוצה שמכילה את $0$, את הסכום של כל שני איברים שלה ואת הנגדי של כל איבר שלה
      (כלומר $x,x'\in G$ גורר $x+x'\in G$ ו-$-x\in G$). הוכיחו: אם לכל $\delta>0$ יש $g\in G$ עם $0<g<\delta$, אז $G$
      צפופה ב-$\mathbb{R}$.

      (ב) תהי $L=\{m\ln2+n\ln3:\ m,n\in\mathbb{Z}\}$. הוכיחו שלכל $\delta>0$ יש $g\in L$ עם $0<g<\delta$. רמז:
      הניחו ש-$s_0=\inf\big(L\cap(0,\infty)\big)>0$, הראו ש-$s_0\in L$ ושכל איבר של $L$ הוא כפולה שלמה של
      $s_0$, והגיעו לסתירה.

      (ג) הכריעו את השאלה.
    answer: >-
      כן. $L$ מקיימת את תנאי (א), וב-(ב) מראים שיש בה איברים חיוביים קטנים כרצוננו: אחרת $L=s_0\mathbb{Z}$, ואז
      $2^b=3^a$ עם $a,b\in\mathbb{N}$, זוגי שווה לאי-זוגי. לכן $L$ צפופה ב-$\mathbb{R}$, ומהרציפות של $e^t$
      הקבוצה $S=\{e^x:\ x\in L\}$ צפופה ב-$(0,\infty)$.
    solution:
      - kind: given
        text: >-
          $S=\{2^m3^n:\ m,n\in\mathbb{Z}\}\subseteq(0,\infty)$. כדור בתת-מרחב $(0,\infty)$ הוא
          $(y-\varepsilon,y+\varepsilon)\cap(0,\infty)$ (הגדרה 1.3.10), ו-$S\subseteq(0,\infty)$, ולכן לפי טענה 1.4.14(ג)
          צפיפות פירושה בדיוק: לכל $y>0$ ולכל $\varepsilon>0$ יש $s\in S$ עם $|s-y|<\varepsilon$.
      - kind: idea
        text: >-
          לוקחים לוגריתם: $\ln(2^m3^n)=m\ln2+n\ln3$, והכפל הופך לחיבור. הקבוצה $L$ של הלוגריתמים מכילה את הסכום של
          כל שני איברים שלה ואת הנגדי של כל איבר. אם יש בה איבר חיובי זעיר $g$, הכפולות $kg$ הן "סולם" עם שלבים ברוחב $g$, שמגיע עד מרחק $g$ מכל
          מספר ממשי. בסוף חוזרים עם $e^t$.
      - kind: step
        text: >-
          (א) יהיו $t\in\mathbb{R}$ ו-$\delta>0$. נבחר $g\in G$ עם $0<g<\delta$, ונסמן $k=\lfloor t/g\rfloor\in\mathbb{Z}$.
          $kg\in G$: ל-$k>0$ זה $g+\dots+g$, ל-$k=0$ זה $0$, ול-$k<0$ זה הנגדי של $|k|g$. ומהגדרת הערך השלם,
          $kg\le t<(k+1)g$, כלומר $0\le t-kg<g<\delta$. כל קטע $(t-\delta,t+\delta)$ פוגש את $G$, ולפי טענה 1.4.14(ג)
          $G$ צפופה.
      - kind: step
        text: >-
          (ב) $L$ מכילה את $0$, את הסכום של כל שני איברים שלה ואת הנגדי של כל איבר, ובפרט את ההפרש של כל שניים.
          $P=L\cap(0,\infty)$ לא ריקה ($\ln2\in P$) וחסומה
          מלרע ב-$0$, ולכן $s_0=\inf P\ge0$ קיים. נניח בשלילה ש-$s_0>0$.
      - kind: step
        text: >-
          **$s_0\in P$.** נניח שלא. אז $s_0$ אינו מתקבל, ומתכונת האינפימום יש $x_1\in P$ עם $s_0<x_1<2s_0$, ושוב
          מתכונת האינפימום (עם $x_1>s_0$) יש $x_2\in P$ עם $s_0<x_2<x_1$. אז $x_1-x_2\in L$
          ו-$0<x_1-x_2<2s_0-s_0=s_0$: איבר של $P$ שקטן מהאינפימום, סתירה.
      - kind: step
        text: >-
          **$L=s_0\mathbb{Z}$.** כל כפולה שלמה של $s_0$ ב-$L$, כי $L$ מכילה סכומים ונגדיים. להפך, יהי $x\in L$
          ו-$k=\lfloor x/s_0\rfloor$. אז $\rho=x-ks_0\in L$ ו-$0\le\rho<s_0$. אילו $\rho>0$, היה $\rho\in P$ קטן מ-$s_0$; לכן $\rho=0$ ו-$x=ks_0$.
      - kind: step
        text: >-
          **הסתירה.** $\ln2=as_0$ ו-$\ln3=bs_0$ עם $a,b\in\mathbb{Z}$, ומכיוון ש-$\ln2,\ln3,s_0>0$, $a,b\in\mathbb{N}$.
          אז $b\ln2=abs_0=a\ln3$, כלומר $2^b=3^a$. אבל $2^b$ זוגי ו-$3^a$ אי-זוגי. לכן $s_0=0$, ומתכונת האינפימום
          לכל $\delta>0$ יש $g\in P$ עם $g<\delta$.
      - kind: step
        text: >-
          (ג) יהיו $y>0$ ו-$\varepsilon>0$. $e^t$ רציפה ב-$\ln y$ (אינפי 1), ולכן יש $\delta>0$ כך ש-$|t-\ln y|<\delta$
          גורר $|e^t-y|<\varepsilon$. לפי (א) ו-(ב) יש $x=m\ln2+n\ln3\in L$ עם $|x-\ln y|<\delta$. אז
          $e^x=2^m3^n\in S$ ו-$|2^m3^n-y|<\varepsilon$.
      - kind: check
        text: >-
          איבר קטן מפורש: $\frac{3^{12}}{2^{19}}=\frac{531441}{524288}\approx1.01364$, ולכן $g=12\ln3-19\ln2\approx0.013551\in L$.
          ל-$y=5$: $k=\lfloor\ln5/g\rfloor=118$, ו-$e^{118g}=3^{1416}\cdot2^{-2242}\approx4.9482$, במרחק כ-$0.052$ מ-$5$.
          עם $g$ קטן יותר מתקבל קירוב טוב יותר. (חישוב מספרי; ההוכחה היא (א)–(ג).)
      - kind: result
        text: >-
          כן: $\{2^m3^n:\ m,n\in\mathbb{Z}\}$ צפופה ב-$(0,\infty)$.
