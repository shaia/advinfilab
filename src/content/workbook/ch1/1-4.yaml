# Objectives (src/course.ts):
#   OBJ-1.4-1  define interior, closure and boundary and compute them for given sets
#   OBJ-1.4-2  accumulation points and isolated points; the closure in their terms
#   OBJ-1.4-3  dense sets; Q dense in R and Q^n dense in R^n
# Numbers recomputed with src/math/metric.ts (dist) and a tsx one-off (W-1.4-07).
lesson: '1.4'
practice:
  - id: W-1.4-01
    level: basic
    objectives: [OBJ-1.4-1]
    prompt: >-
      במישור עם $d_2$ תהי $A=[0,1]\times(0,1)$: הריבוע שבו הצלעות האנכיות שייכות לקבוצה והצלעות האופקיות לא.
      מצאו את $A^\circ$, את $\overline A$ ואת $\partial A$.
    answer: >-
      $A^\circ=(0,1)\times(0,1)$, $\overline A=[0,1]\times[0,1]$, $\partial A$ היא ארבע הצלעות של הריבוע.
    solution:
      - kind: idea
        text: >-
          פנים: הנקודות שיש סביבן עיגול בתוך $A$. סגור: הנקודות שכל עיגול סביבן פוגש את $A$. שתי השאלות לא תלויות
          בשאלה אילו צלעות שייכות ל-$A$, ורק הפנים והסגור קובעים את השפה.
      - kind: step
        text: >-
          **פנים.** לנקודה $(x,y)$ עם $0<x<1$ ו-$0<y<1$ מתאים $r=\min(x,\ 1-x,\ y,\ 1-y)$: מעיגול ברדיוס הזה
          לא יוצאים מהריבוע הפתוח. נקודה על צלע, גם על צלע ששייכת ל-$A$ כמו $(0,\ 0.5)$, אינה פנימית: כל עיגול
          סביבה מכיל נקודות עם $x<0$. לכן $A^\circ=(0,1)\times(0,1)$.
      - kind: step
        text: >-
          **סגור.** כל נקודה של הריבוע הסגור בסגור: גם נקודה על צלע אופקית, כמו $(0.5,\ 0)$, כי כל עיגול סביבה
          מכיל נקודות $(0.5,\ t)$ עם $t>0$ קטן, שב-$A$. לנקודה $(x,y)$ מחוץ לריבוע הסגור יש קואורדינטה מחוץ
          ל-$[0,1]$, למשל $x>1$. אז העיגול ברדיוס $x-1$ זר ל-$A$: בכל נקודה שלו הקואורדינטה הראשונה גדולה מ-1, כי
          $|x'-x|\le d_2$. (וכך גם ל-$x<0$, $y>1$, $y<0$.) לכן $\overline A=[0,1]\times[0,1]$.
      - kind: step
        text: >-
          **שפה.** $\partial A=\overline A\setminus A^\circ$: הנקודות של הריבוע הסגור עם $x\in\{0,1\}$ או
          $y\in\{0,1\}$, כלומר ארבע הצלעות.
      - kind: check
        text: >-
          בשפה יש נקודות של $A$ (הצלעות האנכיות, בלי הפינות) ונקודות שאינן ב-$A$ (הצלעות האופקיות והפינות).
      - kind: result
        text: >-
          $A^\circ=(0,1)^2$, $\overline A=[0,1]^2$, $\partial A$ = ארבע הצלעות.

  - id: W-1.4-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-2]
    prompt: >-
      ב-$\mathbb{R}$ תהי $A=\{\frac1n:\ n\in\mathbb{N}\}\cup[2,3]$. מצאו את $A'$, את הנקודות המבודדות של $A$,
      ואת $\overline A$. האם $2$ היא נקודה מבודדת?
    answer: >-
      $A'=\{0\}\cup[2,3]$; המבודדות הן $\frac1n$ לכל $n$; $\overline A=A\cup\{0\}$; $2$ אינה מבודדת.
    solution:
      - kind: step
        text: >-
          **הקטע.** כל $x\in[2,3]$ היא נקודת הצטברות: כל קטע סביבה מכיל נקודות אחרות של $[2,3]$. ובפרט $2$ אינה
          מבודדת, אף שהיא "קצה".
      - kind: step
        text: >-
          **הסדרה.** כל $\frac1n$ מבודדת: הכדור ברדיוס $\frac1n-\frac1{n+1}$ סביבה לא מכיל אף נקודה אחרת של $A$
          (השכנות $\frac1{n+1}$ ו-(ל-$n\ge2$) $\frac1{n-1}$ רחוקות לפחות כמוהו, והקטע $[2,3]$ רחוק יותר). $0$ היא נקודת הצטברות: כל קטע
          $(-r,r)$ מכיל $\frac1n$ עם $n>\frac1r$.
      - kind: step
        text: >-
          שאר הנקודות אינן נקודות הצטברות: לכל אחת יש קטע סביבה שזר ל-$A$ (חוץ אולי מהנקודה עצמה). אם $x<0$, הרדיוס
          $|x|$. אם $1<x<2$, הרדיוס $\min(x-1,\ 2-x)$; אם $x>3$, הרדיוס $x-3$. ואם $0<x<1$ ו-$x$ אינו
          מהצורה $\frac1n$, יש $n$ עם $\frac1{n+1}<x<\frac1n$, והרדיוס $\min\big(x-\frac1{n+1},\ \frac1n-x\big)$.
      - kind: step
        text: >-
          לפי המשפט $\overline A=A\cup A'=\{\frac1n\}\cup\{0\}\cup[2,3]$.
      - kind: result
        text: >-
          $A'=\{0\}\cup[2,3]$, המבודדות $\{\frac1n: n\in\mathbb{N}\}$, $\overline A=A\cup\{0\}$, ו-$2$ אינה מבודדת.

  - id: W-1.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.4-3]
    prompt: >-
      ב-$\mathbb{R}$ עם $|x-y|$, אילו מהקבוצות צפופות? נמקו.

      (א) $\mathbb{Z}$

      (ב) $D=\{\frac{m}{2^k}:\ m\in\mathbb{Z},\ k\in\mathbb{N}\}$, השברים שהמכנה שלהם חזקה של 2.

      (ג) $\mathbb{Q}\cap(0,\infty)$
    answer: >-
      (א) לא. (ב) כן. (ג) לא: הקטע $(-2,-1)$ זר לה.
    solution:
      - kind: definition
        text: >-
          $A$ צפופה ב-$\mathbb{R}$ אם כל קטע פתוח לא ריק $(a,b)$ פוגש את $A$.
      - kind: step
        text: >-
          (א) הקטע $(\tfrac14,\ \tfrac34)$ זר ל-$\mathbb{Z}$, ולכן $\mathbb{Z}$ אינה צפופה.
      - kind: step
        text: >-
          (ב) יהי $a<b$. נבחר $k$ עם $2^k>\frac1{b-a}$ (קיים כי $2^k\ge k$ ולפי תכונת ארכימדס), כלומר
          $\frac1{2^k}<b-a$. יהי $m=\lfloor 2^ka\rfloor+1$. כמו בהוכחה ש-$\mathbb{Q}$ צפופה:
          $a<\frac{m}{2^k}\le a+\frac1{2^k}<b$. לכן $D$ צפופה.
      - kind: step
        text: >-
          (ג) הקטע $(-2,-1)$ אינו מכיל אף מספר חיובי, ולכן זר לקבוצה. היא צפופה ב-$(0,\infty)$ כתת-מרחב, אבל לא
          ב-$\mathbb{R}$.
      - kind: check
        text: >-
          (ב) מראה שאפשר להסתפק בפחות רציונליים מכל $\mathbb{Q}$: ההוכחה השתמשה רק בכך שאפשר לבחור צעד $\frac1{2^k}$
          קטן כרצוננו.
      - kind: result
        text: >-
          רק (ב) צפופה ב-$\mathbb{R}$.

  - id: W-1.4-04
    level: mid
    objectives: [OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי ו-$A,B\subseteq X$.

      (א) הוכיחו: $\overline{A\cup B}=\overline A\cup\overline B$.

      (ב) הוכיחו: $\overline{A\cap B}\subseteq\overline A\cap\overline B$, ותנו דוגמה ב-$\mathbb{R}$ שבה ההכלה ממש.
    answer: >-
      (א) $\supseteq$ מהמונוטוניות; $\subseteq$ כי $\overline A\cup\overline B$ סגורה ומכילה את $A\cup B$.
      (ב) $A=(0,1)$, $B=(1,2)$: $\overline{A\cap B}=\emptyset$ ו-$\overline A\cap\overline B=\{1\}$.
    solution:
      - kind: idea
        text: >-
          שני כלים: אם $A\subseteq B$ אז $\overline A\subseteq\overline B$; והסגור מוכל בכל קבוצה סגורה שמכילה את
          הקבוצה.
      - kind: step
        text: >-
          (א) $A\subseteq A\cup B$, ולכן $\overline A\subseteq\overline{A\cup B}$; כך גם $\overline B$. לכן
          $\overline A\cup\overline B\subseteq\overline{A\cup B}$.
      - kind: step
        text: >-
          בכיוון השני: $\overline A\cup\overline B$ היא איחוד של **שתי** קבוצות סגורות, ולכן סגורה (שיעור 1.3), והיא
          מכילה את $A\cup B$. הסגור של $A\cup B$ מוכל בכל קבוצה סגורה כזו, ולכן
          $\overline{A\cup B}\subseteq\overline A\cup\overline B$.
      - kind: step
        text: >-
          (ב) $A\cap B\subseteq A$, ולכן $\overline{A\cap B}\subseteq\overline A$; כך גם עם $B$, ולכן
          $\overline{A\cap B}\subseteq\overline A\cap\overline B$.
      - kind: computation
        text: >-
          דוגמה: $A=(0,1)$ ו-$B=(1,2)$. $A\cap B=\emptyset$, ולכן $\overline{A\cap B}=\emptyset$. אבל
          $\overline A\cap\overline B=[0,1]\cap[1,2]=\{1\}$.
      - kind: check
        text: >-
          ב-(א) השתמשנו בכך שאיחוד **סופי** של סגורות סגור. לאיחוד אינסופי זה נכשל: $\bigcup_n\overline{\{\frac1n\}}=
          \{\frac1n\}$, והסגור של האיחוד מכיל גם את $0$.
      - kind: result
        text: >-
          (א) $\overline{A\cup B}=\overline A\cup\overline B$. (ב) רק הכלה; $(0,1)$ ו-$(1,2)$ נותנות הכלה ממש.

  - id: W-1.4-05
    level: mid
    objectives: [OBJ-1.4-2]
    prompt: >-
      $X$ מרחב מטרי, $A\subseteq X$ ו-$x\in X$.

      (א) הוכיחו: $x$ נקודת הצטברות של $A$ אם ורק אם כל כדור סביב $x$ מכיל **אינסוף** נקודות של $A$.

      (ב) הסיקו שלקבוצה סופית אין נקודות הצטברות, ושקבוצה סופית סגורה.
    answer: >-
      (א) אם בכדור $B(x,r)$ רק מספר סופי של נקודות של $A$ ששונות מ-$x$, כדור ברדיוס המרחק הקטן ביותר אליהן לא
      מכיל אף אחת. (ב) $A'=\emptyset$, ולכן $\overline A=A\cup A'=A$.
    solution:
      - kind: idea
        text: >-
          הכיוון הקשה הוא $\Rightarrow$. אם באחד הכדורים יש רק מספר סופי של נקודות של $A$, אפשר לכווץ את הכדור כך
          שאף אחת מהן לא תישאר, ואז $x$ אינה נקודת הצטברות. זה עובד כי למספר סופי של מרחקים חיוביים יש מינימום חיובי.
      - kind: step
        text: >-
          ($\Leftarrow$) כדור עם אינסוף נקודות של $A$ מכיל בפרט נקודה של $A$ ששונה מ-$x$.
      - kind: step
        text: >-
          ($\Rightarrow$) נניח בשלילה שיש $r>0$ שבכדור $B(x,r)$ רק מספר סופי של נקודות של $A$. אלה ששונות מ-$x$ הן
          $a_1,\dots,a_k$ (ייתכן $k=0$). אם $k=0$, הכדור הזה עצמו מראה ש-$x$ אינה נקודת הצטברות. אחרת נגדיר
          $s=\min_i d(x,a_i)$, מינימום של מספר סופי של מספרים חיוביים, ולכן $s>0$.
      - kind: step
        text: >-
          הכדור $B(x,\min(r,s))$ מוכל ב-$B(x,r)$, ולכן כל נקודה של $A$ בו ששונה מ-$x$ היא אחת מה-$a_i$; אבל
          $d(x,a_i)\ge s$, כך ש-$a_i$ אינה בכדור. לכן בכדור אין נקודה של $A$ ששונה מ-$x$, בסתירה לכך ש-$x\in A'$.
      - kind: step
        text: >-
          (ב) לקבוצה סופית אין אינסוף נקודות בשום כדור, ולכן לפי (א) $A'=\emptyset$. לפי המשפט
          $\overline A=A\cup A'=A$, ולכן $A$ סגורה.
      - kind: check
        text: >-
          במטריקה הבדידה $A'=\emptyset$ לכל $A$, גם אינסופית: שם הכדור $B(x,\tfrac12)$ מכיל נקודה אחת בלבד, ו-(א)
          מסכים.
      - kind: result
        text: >-
          (א) נקודת הצטברות = בכל כדור סביבה אינסוף נקודות של $A$. (ב) לקבוצה סופית $A'=\emptyset$, והיא סגורה.

  - id: W-1.4-06
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-1, OBJ-1.4-2, OBJ-1.4-3]
    prompt: >-
      על $\mathbb{N}$ נגדיר $\rho(m,n)=\left|\frac1m-\frac1n\right|$. זו מטריקה, כי $n\mapsto\frac1n$ חד-חד-ערכית
      (שיעור 1.1). במרחב הזה כל המרחקים קטנים מ-1, והכדורים הגדולים מכילים נקודות רבות, כך שהוא אינו "נראה" בדיד.

      (א) הוכיחו שכל $n\in\mathbb{N}$ היא נקודה מבודדת של $\mathbb{N}$: מצאו $r_n>0$ עם $B(n,r_n)=\{n\}$.

      (ב) תהי $A\subseteq\mathbb{N}$ כלשהי. מצאו את $A^\circ$, $\overline A$, $\partial A$ ו-$A'$.

      (ג) אילו תת-קבוצות של $(\mathbb{N},\rho)$ צפופות? והאם לקבוצה $\{\frac1n:\ n\in\mathbb{N}\}$ ב-$\mathbb{R}$ יש נקודת
      הצטברות? הסבירו את ההבדל.
    answer: >-
      (א) $r_n=\frac1n-\frac1{n+1}=\frac1{n(n+1)}$. (ב) $A^\circ=\overline A=A$, $\partial A=A'=\emptyset$. (ג) רק
      $\mathbb{N}$ צפופה. ב-$\mathbb{R}$ ל-$\{\frac1n\}$ יש נקודת הצטברות, $0$, אבל $0$ אינה במרחב $(\mathbb{N},\rho)$.
    solution:
      - kind: idea
        text: >-
          המספרים $\frac1n$ מסודרים בישר בסדר יורד, והשכנה הקרובה ביותר של $\frac1n$ היא $\frac1{n+1}$. כדור ברדיוס
          המרחק אליה לא מכיל אף נקודה אחרת. מרגע שכל נקודה מבודדת, כל החישובים הם כמו במטריקה הבדידה, אבל צריך את (א)
          במקום $B(x,\tfrac12)=\{x\}$.
      - kind: step
        text: >-
          (א) יהי $n\in\mathbb{N}$ ו-$r_n=\frac1n-\frac1{n+1}=\frac1{n(n+1)}$. ל-$m>n$:
          $\rho(m,n)=\frac1n-\frac1m\ge\frac1n-\frac1{n+1}=r_n$. ל-$m<n$ (אם $n\ge2$):
          $\rho(m,n)=\frac1m-\frac1n\ge\frac1{n-1}-\frac1n=\frac1{n(n-1)}>r_n$. לכן אף $m\ne n$ אינו ב-$B(n,r_n)$,
          ו-$B(n,r_n)=\{n\}$.
      - kind: step
        text: >-
          (ב) כל $n\in A$ פנימית, כי $B(n,r_n)=\{n\}\subseteq A$; לכן $A^\circ=A$. כל $n\notin A$ אינה בסגור, כי
          $B(n,r_n)=\{n\}$ זר ל-$A$; לכן $\overline A=A$, ו-$\partial A=\overline A\setminus A^\circ=\emptyset$. ואף נקודה
          אינה נקודת הצטברות, כי $B(n,r_n)$ לא מכיל נקודה אחרת: $A'=\emptyset$.
      - kind: step
        text: >-
          (ג) $A$ צפופה אם $\overline A=\mathbb{N}$, ו-$\overline A=A$, ולכן רק $A=\mathbb{N}$ צפופה.
      - kind: step
        text: >-
          ב-$\mathbb{R}$, הקבוצה $\{\frac1n\}$ היא "אותן נקודות" בדיוק: $\rho(m,n)$ הוא המרחק בין $\frac1m$ ל-$\frac1n$
          בישר. שם $0$ נקודת הצטברות, כי כל קטע $(-r,r)$ מכיל $\frac1n$ עם $n>\frac1r$. ההבדל: $0$ היא נקודה של
          $\mathbb{R}$, ולא של המרחב $(\mathbb{N},\rho)$. נקודות ההצטברות תלויות במרחב שבו מסתכלים, כמו הפתיחות בשיעור 1.3.
      - kind: check
        text: >-
          מספרים: $r_1=\frac12$, ו-$\rho(1,2)=\frac12$ אינו קטן ממש מ-$\frac12$. $r_3=\frac1{12}$, ו-$\rho(3,4)=\frac1{12}$
          בדיוק, ו-$\rho(2,3)=\frac16>\frac1{12}$. כלומר הרדיוס $r_n$ הוא הגדול ביותר שמבודד את $n$.
      - kind: result
        text: >-
          (א) $B\big(n,\frac1{n(n+1)}\big)=\{n\}$. (ב) $A^\circ=\overline A=A$, $\partial A=A'=\emptyset$. (ג) רק
          $\mathbb{N}$ צפופה; ל-$\{\frac1n\}$ בתוך $\mathbb{R}$ יש נקודת הצטברות $0$, שאינה במרחב $(\mathbb{N},\rho)$.

  - id: W-1.4-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.4-3]
    prompt: >-
      (א) הוכיחו ישירות ש-$\mathbb{Q}^2$ צפופה במישור עם $d_1$ ועם $d_\infty$. בכמה מותר לקרב כל קואורדינטה בכל
      מטריקה?

      (ב) עבור $x=(\sqrt2,\ \pi)$ ו-$\varepsilon=0.01$, בדקו שהנקודה הרציונלית $q=(1.41,\ 3.14)$ מקיימת
      $d_1(x,q)<\varepsilon$, ומצאו את $d_\infty(x,q)$.

      (ג) תהי $L=\{(q,\ \sqrt2\,q):\ q\in\mathbb{Q}\}$, נקודות על הישר $y=\sqrt2x$. הוכיחו ש-$L$ **אינה** צפופה במישור
      עם $d_2$.
    answer: >-
      (א) ב-$d_1$ תקציב $\frac\varepsilon2$ לכל קואורדינטה, ב-$d_\infty$ תקציב $\varepsilon$. (ב)
      $d_1(x,q)\approx0.00581<0.01$, $d_\infty(x,q)=\sqrt2-1.41\approx0.00421$. (ג) העיגול סביב $(1,0)$ ברדיוס
      $\frac{\sqrt2}{\sqrt3}\approx0.816$ זר לישר $y=\sqrt2x$, ולכן גם ל-$L$.
    solution:
      - kind: idea
        text: >-
          מקרבים כל קואורדינטה בנפרד בעזרת צפיפות $\mathbb{Q}$ ב-$\mathbb{R}$. כמה מותר לכל אחת תלוי באיך המטריקה
          מצרפת את ההפרשים: סכום ב-$d_1$, מקסימום ב-$d_\infty$.
      - kind: step
        text: >-
          (א) יהיו $(a,b)$ ו-$\varepsilon>0$. ב-$d_1$: נבחר רציונליים $q_1,q_2$ עם $|a-q_1|<\frac\varepsilon2$ ו-$|b-q_2|<\frac\varepsilon2$.
          אז $d_1\big((a,b),(q_1,q_2)\big)<\frac\varepsilon2+\frac\varepsilon2=\varepsilon$.
      - kind: step
        text: >-
          ב-$d_\infty$: מספיק $|a-q_1|<\varepsilon$ ו-$|b-q_2|<\varepsilon$, כי
          $d_\infty=\max(|a-q_1|,\ |b-q_2|)<\varepsilon$.
      - kind: computation
        text: >-
          (ב) $|\sqrt2-1.41|\approx0.0042136$ ו-$|\pi-3.14|\approx0.0015927$. לכן $d_1(x,q)\approx0.0058062<0.01$ ו-
          $d_\infty(x,q)\approx0.0042136$. (ב-$d_2$ יוצא $\approx0.0045045$.)
      - kind: check
        text: >-
          $d_\infty\le d_2\le d_1$, כמו שצריך: $0.00421\le0.00450\le0.00581$.
      - kind: step
        text: >-
          (ג) **רעיון:** כל $L$ יושבת על ישר אחד, ונקודה שמחוץ לישר רחוקה ממנו. מספיק עיגול אחד שזר ל-$L$. ניקח את
          הנקודה $(a,b)=(1,0)$, ש-$|b-\sqrt2a|=\sqrt2>0$. תהי $(x,y)$ עם $d_2\big((x,y),(1,0)\big)<r$. לפי קושי-שוורץ,
          $|y-b|+\sqrt2\,|x-a|\le\sqrt{1+2}\cdot\sqrt{(y-b)^2+(x-a)^2}<\sqrt3\,r$.
      - kind: step
        text: >-
          לכן $|y-\sqrt2x|\ge|b-\sqrt2a|-|y-b|-\sqrt2\,|x-a|>\sqrt2-\sqrt3\,r$. עם $r=\frac{\sqrt2}{\sqrt3}$ מקבלים
          $|y-\sqrt2x|>0$: אף נקודה בעיגול אינה על הישר, ובפרט אף נקודה של $L$. לכן $\overline L\ne\mathbb{R}^2$.
      - kind: check
        text: >-
          $\frac{\sqrt2}{\sqrt3}\approx0.8165$ הוא בדיוק המרחק מ-$(1,0)$ לישר: לנקודה $\big(\frac13,\ \frac{\sqrt2}3\big)$
          שעל הישר המרחק הוא $\sqrt{\frac49+\frac29}=\frac{\sqrt2}{\sqrt3}$. והשוו: $L$ צפופה
          **בתוך הישר**, כמו ש-$\mathbb{Q}$ צפופה ב-$\mathbb{R}$, אבל המישור "רחב" ממנה. צפיפות תלויה במרחב.
      - kind: result
        text: >-
          (א) $\mathbb{Q}^2$ צפופה ב-$d_1$ (תקציב $\frac\varepsilon2$) וב-$d_\infty$ (תקציב $\varepsilon$). (ב)
          $d_1\approx0.00581$, $d_\infty\approx0.00421$. (ג) $L$ אינה צפופה במישור.

  - id: W-1.4-08
    level: exam
    objectives: [OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי ו-$A\subseteq X$.

      (א) הוכיחו: $\partial A=\overline A\cap\overline{X\setminus A}$.

      (ב) הסיקו ש-$\partial A$ סגורה ושמתקיים $\partial A=\partial(X\setminus A)$.

      (ג) הוכיחו: $A$ סגורה אם ורק אם $\partial A\subseteq A$.
    answer: >-
      (א) $X\setminus A^\circ=\overline{X\setminus A}$. (ב) חיתוך של שתי סגורות; הנוסחה סימטרית. (ג) $\overline A=A\cup\partial A$.
    solution:
      - kind: idea
        text: >-
          הכלי הוא הזהות $X\setminus\overline B=(X\setminus B)^\circ$ מהשיעור. עם $B=X\setminus A$ היא נותנת
          $X\setminus A^\circ=\overline{X\setminus A}$: "לא פנימית" פירושו "בסגור של המשלים".
      - kind: step
        text: >-
          (א) מהזהות עם $B=X\setminus A$: $X\setminus\overline{X\setminus A}=A^\circ$, כלומר
          $X\setminus A^\circ=\overline{X\setminus A}$. לכן
          $\partial A=\overline A\setminus A^\circ=\overline A\cap(X\setminus A^\circ)=\overline A\cap\overline{X\setminus A}$.
      - kind: step
        text: >-
          (ב) $\overline A$ ו-$\overline{X\setminus A}$ סגורות, וחיתוך של סגורות סגור. והנוסחה של (א) לא משתנה כשמחליפים
          את $A$ ב-$X\setminus A$, כי $X\setminus(X\setminus A)=A$. לכן $\partial(X\setminus A)=\partial A$.
      - kind: step
        text: >-
          (ג) $\overline A=A^\circ\cup\partial A$ (כי $\partial A=\overline A\setminus A^\circ$ ו-$A^\circ\subseteq\overline A$),
          ולכן $\overline A=A\cup\partial A$, כי $A^\circ\subseteq A\subseteq\overline A$. אם $\partial A\subseteq A$,
          אז $\overline A=A$ ו-$A$ סגורה. אם $A$ סגורה, $\partial A\subseteq\overline A=A$.
      - kind: check
        text: >-
          על $A=[0,1)$: $\overline A\cap\overline{\mathbb{R}\setminus A}=[0,1]\cap\big((-\infty,0]\cup[1,\infty)\big)=\{0,1\}$,
          ו-$1\notin A$, כך ש-$A$ אינה סגורה, כמו ש-(ג) אומר.
      - kind: result
        text: >-
          $\partial A=\overline A\cap\overline{X\setminus A}$, סגורה, שווה ל-$\partial(X\setminus A)$; ו-$A$ סגורה
          אם ורק אם היא מכילה את שפתה.

  - id: W-1.4-09
    level: exam
    objectives: [OBJ-1.4-1]
    prompt: >-
      ב-$C[0,1]$ עם $d_\infty(f,g)=\max|f-g|$, נסמן $I(f)=\int_0^1f$, ותהיינה
      $V=\{f\in C[0,1]:\ I(f)>0\}$ ו-$E=\{f\in C[0,1]:\ I(f)=0\}$.

      (א) הוכיחו: $|I(g)-I(h)|\le d_\infty(g,h)$ לכל $g,h\in C[0,1]$.

      (ב) הוכיחו ש-$V$ פתוחה ושהקבוצה $W=\{f:\ I(f)\ge0\}$ סגורה.

      (ג) מצאו את $\overline V$, את $W^\circ$ ואת $\partial V$.
    answer: >-
      (א) $|I(g)-I(h)|\le\int_0^1|g-h|\le\max|g-h|$. (ב) סביב $f\in V$ מתאים הרדיוס $I(f)$; המשלים של $W$ פתוח מאותה
      סיבה. (ג) $\overline V=W$, $W^\circ=V$, $\partial V=E$.
    solution:
      - kind: idea
        text: >-
          ההבדל מדוגמה 5 בשיעור: שם התנאי היה על ערך בכל נקודה, וכאן על ממוצע. מה שמחבר אותו ל-$d_\infty$ הוא (א): אם
          הגרפים קרובים בכל נקודה, גם האינטגרלים קרובים. אחר כך הכלי הוא שוב הזזה של הגרף בקבוע קטן.
      - kind: step
        text: >-
          (א) לפי תכונות האינטגרל (אינפי 1–2): $|I(g)-I(h)|=\left|\int_0^1(g-h)\right|\le\int_0^1|g-h|\le\int_0^1d_\infty(g,h)
          =d_\infty(g,h)$, כי $|g(x)-h(x)|\le d_\infty(g,h)$ בכל $x$ והקטע באורך 1.
      - kind: step
        text: >-
          (ב) תהי $f\in V$, ו-$r=I(f)>0$. אם $d_\infty(g,f)<r$, אז לפי (א) $I(g)\ge I(f)-|I(g)-I(f)|>r-r=0$, כלומר
          $g\in V$. לכן $V$ פתוחה. באותו אופן המשלים של $W$, $\{f:\ I(f)<0\}$, פתוח (הרדיוס $|I(f)|$), ולכן $W$ סגורה.
      - kind: step
        text: >-
          (ג) **הסגור.** $W$ סגורה ומכילה את $V$, ולכן $\overline V\subseteq W$. בכיוון השני, תהי $f\in W$ ו-$r>0$. אז
          $g=f+\frac r2$ רציפה, $d_\infty(f,g)=\frac r2<r$, ו-$I(g)=I(f)+\frac r2>0$, כלומר $g\in V$. כל כדור סביב $f$
          פוגש את $V$, ולכן $f\in\overline V$. מכאן $\overline V=W$.
      - kind: step
        text: >-
          **הפנים של $W$.** $V$ פתוחה ומוכלת ב-$W$, ולכן $V\subseteq W^\circ$. בכיוון השני, תהי $f\in E$ ו-$r>0$: הפונקציה
          $f-\frac r2$ ב-$B(f,r)$ ו-$I\big(f-\frac r2\big)=-\frac r2<0$, ולכן אינה ב-$W$. כלומר אף $f\in E$ אינה פנימית
          ב-$W$, ו-$W^\circ=V$.
      - kind: step
        text: >-
          **השפה.** $V$ פתוחה, ולכן $V^\circ=V$, ו-$\partial V=\overline V\setminus V^\circ=W\setminus V=E$.
      - kind: check
        text: >-
          $f(x)=x-\frac12$ ב-$E$: $I(f)=0$. בכדור $B(f,0.1)$ נמצאות $x-0.45$, עם אינטגרל $0.05>0$ (ב-$V$), ו-$x-0.55$, עם
          אינטגרל $-0.05$ (מחוץ ל-$W$): הכדור פוגש את שני הצדדים, כמו שנקודת שפה צריכה.
      - kind: result
        text: >-
          $V$ פתוחה, $W$ סגורה, $\overline V=W$, $W^\circ=V$, ו-$\partial V=E$: הפונקציות שהאינטגרל שלהן אפס.

  - id: W-1.4-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.4-3, OBJ-1.4-1]
    prompt: >-
      $X$ מרחב מטרי.

      (א) הוכיחו: אם $U$ ו-$V$ פתוחות וצפופות ב-$X$, אז $U\cap V$ צפופה ב-$X$.

      (ב) נכון או לא נכון: החיתוך של שתי קבוצות צפופות ב-$X$ צפוף. הוכיחו או תנו דוגמה נגדית.
    answer: >-
      (א) כדור $B$ פוגש את $U$; $B\cap U$ פתוחה ולא ריקה ולכן מכילה כדור, שפוגש את $V$. (ב) לא נכון:
      $\mathbb{Q}\cap(\mathbb{R}\setminus\mathbb{Q})=\emptyset$.
    solution:
      - kind: goal
        text: >-
          (א) לכל $x\in X$ ו-$r>0$: $B(x,r)\cap U\cap V\neq\emptyset$.
      - kind: idea
        text: >-
          הפתיחות של $U$ מאפשרת להחליף את "הכדור פוגש את $U$" ב"יש כדור קטן **בתוך** $B(x,r)\cap U$". את הכדור הקטן
          הזה פוגשת $V$, כי היא צפופה.
      - kind: step
        text: >-
          (א) $U$ צפופה, ולכן יש $y\in B(x,r)\cap U$. החיתוך $B(x,r)\cap U$ הוא חיתוך של שתי פתוחות, ולכן פתוח, ויש
          $s>0$ עם $B(y,s)\subseteq B(x,r)\cap U$.
      - kind: step
        text: >-
          $V$ צפופה, ולכן יש $z\in B(y,s)\cap V$. אז $z\in B(x,r)$, $z\in U$ ו-$z\in V$, כלומר
          $B(x,r)\cap U\cap V\neq\emptyset$.
      - kind: step
        text: >-
          (ב) **לא נכון.** ב-$\mathbb{R}$, $\mathbb{Q}$ ו-$\mathbb{R}\setminus\mathbb{Q}$ צפופות (שיעור 1.4, דוגמה 4),
          והחיתוך שלהן ריק, שאינו צפוף.
      - kind: check
        text: >-
          איפה (ב) נכשל לעומת (א)? ב-$\mathbb{Q}$ אין כדור קטן בתוך $B(x,r)\cap\mathbb{Q}$, כי הפנים שלה ריק. בלי
          פתיחות אין "כדור קטן" לתת ל-$V$.
      - kind: result
        text: >-
          (א) חיתוך של שתי פתוחות צפופות צפוף. (ב) לא נכון בלי פתיחות: $\mathbb{Q}$ והאי-רציונליים.
challenge:
  - id: W-1.4-c1
    stars: 1
    objectives: [OBJ-1.4-2, OBJ-1.4-1]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, $E\subseteq X$, ו-$E'$ קבוצת נקודות ההצטברות של $E$.

      (א) הוכיחו ש-$E'$ סגורה, כלומר שכל נקודת הצטברות של $E'$ שייכת ל-$E'$.

      (ב) הראו בדוגמה ב-$\mathbb{R}$ שקבוצת הנקודות המבודדות של $E$ אינה בהכרח סגורה.
    answer: >-
      (א) אם $x$ נקודת הצטברות של $E'$, כל כדור $B(x,r)$ מכיל $y\in E'$ עם $y\ne x$, וכדור קטן סביב $y$, שנשאר בתוך
      $B(x,r)$ ולא מגיע ל-$x$, מכיל נקודה של $E$ ששונה מ-$x$; לכן $x\in E'$. (ב) $E=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$:
      המבודדות הן $\frac1n$, ו-$0$ גבול שלהן שאינו מבודד.
    solution:
      - kind: given
        text: >-
          $(X,d)$ מרחב מטרי, $E\subseteq X$. $x\in E'$ אם כל כדור $B(x,r)$ מכיל נקודה של $E$ ששונה מ-$x$.
      - kind: goal
        text: >-
          (א) לפי המשפט $\overline A=A\cup A'$, קבוצה $A$ סגורה אם ורק אם $A'\subseteq A$. לכן צריך להראות: כל נקודת
          הצטברות $x$ של $E'$ שייכת ל-$E'$, כלומר לכל $r>0$ יש $z\in E$ עם $z\ne x$ ו-$d(x,z)<r$.
      - kind: idea
        text: >-
          להיות קרובים לנקודה של $E'$ פירושו להיות קרובים לנקודות שמוקפות בנקודות של $E$. לוקחים נקודה $y\in E'$ בתוך
          $B(x,r)$, ומקטינים את הכדור סביב $y$ כך שיישאר בתוך $B(x,r)$ ולא יגיע עד $x$. הנקודה של $E$ שבתוכו היא
          המבוקשת.
      - kind: step
        text: >-
          תהי $x$ נקודת הצטברות של $E'$ ויהי $r>0$. יש $y\in E'$ עם $y\ne x$ ו-$d(x,y)<r$, כלומר
          $0<d(x,y)<r$. נגדיר $s=\min\big(r-d(x,y),\ d(x,y)\big)$; שני המספרים חיוביים, ולכן $s>0$.
      - kind: step
        text: >-
          $y\in E'$, ולכן הכדור $B(y,s)$ מכיל נקודה $z\in E$ (עם $z\ne y$, אבל זה לא נחוץ לנו).
      - kind: step
        text: >-
          $z$ בתוך $B(x,r)$: לפי אי-שוויון המשולש, $d(x,z)\le d(x,y)+d(y,z)<d(x,y)+\big(r-d(x,y)\big)=r$.
      - kind: step
        text: >-
          $z\ne x$: $d(y,z)<s\le d(x,y)$. אילו $z=x$, היינו מקבלים $d(y,x)<d(x,y)$, וזה בלתי אפשרי. כאן נחוץ החלק
          השני של המינימום בהגדרת $s$.
      - kind: step
        text: >-
          $r>0$ היה כלשהו, ולכן כל כדור $B(x,r)$ מכיל נקודה של $E$ ששונה מ-$x$: $x\in E'$. כלומר $(E')'\subseteq E'$,
          ו-$E'$ סגורה.
      - kind: check
        text: >-
          בדוגמאות מהשיעור: לקבוצה $\{\frac1n\}$, $E'=\{0\}$; לקבוצה $(0,1)\cup\mathbb{N}$ (דוגמה 2), $E'=[0,1]$; ול-$\mathbb{Q}$,
          $E'=\mathbb{R}$. שלושתן סגורות, אף ש-$E$ עצמה אינה סגורה באף אחד מהמקרים.
      - kind: step
        text: >-
          (ב) ב-$\mathbb{R}$ תהי $E=\{0\}\cup\{\frac1n:\ n\in\mathbb{N}\}$. כל $\frac1n$ מבודדת:
          $B\big(\frac1n,\ \frac1n-\frac1{n+1}\big)\cap E=\{\frac1n\}$, כי השכנות הקרובות, $\frac1{n+1}$ ו-(ל-$n\ge2$) $\frac1{n-1}$ (ו-$0$),
          רחוקות לפחות כרדיוס הזה. $0$ אינה מבודדת: כל קטע $(-r,r)$ מכיל $\frac1n$ עם $n>\frac1r$.
      - kind: step
        text: >-
          לכן קבוצת המבודדות היא $I=\{\frac1n:\ n\in\mathbb{N}\}$. ל-$I$ יש נקודת הצטברות, $0$, שאינה ב-$I$, ולכן $I$
          אינה סגורה.
      - kind: result
        text: >-
          (א) קבוצת נקודות ההצטברות של כל קבוצה סגורה. (ב) קבוצת הנקודות המבודדות לא בהכרח: ל-$\{0\}\cup\{\frac1n\}$
          היא $\{\frac1n\}$, שאינה סגורה.
    source:
      name: 'Harvard University, Math 112, Homework 2 (due February 14, 2019)'
      year: 2019
      problem: 'Problem 5'
      url: 'https://people.math.harvard.edu/~auroux/112s19/hw2.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.4-c2
    stars: 2
    objectives: [OBJ-1.4-3]
    prompt: >-
      האם הקבוצה $S=\{2^m3^n:\ m,n\in\mathbb{Z}\}$ צפופה בקרן $(0,\infty)$, כתת-מרחב של $\mathbb{R}$? כלומר: האם לכל
      $y>0$ ולכל $\varepsilon>0$ יש $s\in S$ עם $|s-y|<\varepsilon$? (המעריכים שלמים, גם שליליים.)

      (א) תהי $G\subseteq\mathbb{R}$ קבוצה שמכילה את $0$, את הסכום של כל שני איברים שלה ואת הנגדי של כל איבר שלה
      (כלומר $x,x'\in G$ גורר $x+x'\in G$ ו-$-x\in G$). הוכיחו: אם לכל $\delta>0$ יש $g\in G$ עם $0<g<\delta$, אז $G$
      צפופה ב-$\mathbb{R}$.

      (ב) תהי $L=\{m\ln2+n\ln3:\ m,n\in\mathbb{Z}\}$. הוכיחו שלכל $\delta>0$ יש $g\in L$ עם $0<g<\delta$. רמז:
      הניחו ש-$s_0=\inf\big(L\cap(0,\infty)\big)>0$, הראו ש-$s_0\in L$ ושכל איבר של $L$ הוא כפולה שלמה של
      $s_0$, והגיעו לסתירה.

      (ג) הכריעו את השאלה.
    answer: >-
      כן. $L$ מקיימת את תנאי (א), וב-(ב) מראים שיש בה איברים חיוביים קטנים כרצוננו: אחרת $L=s_0\mathbb{Z}$, ואז
      $2^b=3^a$ עם $a,b\in\mathbb{N}$, זוגי שווה לאי-זוגי. לכן $L$ צפופה ב-$\mathbb{R}$, ומהרציפות של $e^t$
      הקבוצה $S=\{e^x:\ x\in L\}$ צפופה ב-$(0,\infty)$.
    solution:
      - kind: given
        text: >-
          $S=\{2^m3^n:\ m,n\in\mathbb{Z}\}\subseteq(0,\infty)$. כדור בתת-מרחב $(0,\infty)$ הוא
          $(y-\varepsilon,y+\varepsilon)\cap(0,\infty)$, ו-$S\subseteq(0,\infty)$, ולכן צפיפות פירושה בדיוק: לכל $y>0$ ולכל
          $\varepsilon>0$ יש $s\in S$ עם $|s-y|<\varepsilon$.
      - kind: idea
        text: >-
          לוקחים לוגריתם: $\ln(2^m3^n)=m\ln2+n\ln3$, והכפל הופך לחיבור. הקבוצה $L$ של הלוגריתמים מכילה את הסכום של
          כל שני איברים שלה ואת הנגדי של כל איבר. אם יש בה איבר חיובי זעיר $g$, הכפולות $kg$ הן "סולם" עם שלבים ברוחב $g$, שמגיע עד מרחק $g$ מכל
          מספר ממשי. בסוף חוזרים עם $e^t$.
      - kind: step
        text: >-
          (א) יהיו $t\in\mathbb{R}$ ו-$\delta>0$. נבחר $g\in G$ עם $0<g<\delta$, ונסמן $k=\lfloor t/g\rfloor\in\mathbb{Z}$.
          $kg\in G$: ל-$k>0$ זה $g+\dots+g$, ל-$k=0$ זה $0$, ול-$k<0$ זה הנגדי של $|k|g$. ומהגדרת הערך השלם,
          $kg\le t<(k+1)g$, כלומר $0\le t-kg<g<\delta$. כל קטע $(t-\delta,t+\delta)$ פוגש את $G$.
      - kind: step
        text: >-
          (ב) $L$ מכילה את $0$, את הסכום של כל שני איברים שלה ואת הנגדי של כל איבר, ובפרט את ההפרש של כל שניים.
          $P=L\cap(0,\infty)$ לא ריקה ($\ln2\in P$) וחסומה
          מלרע ב-$0$, ולכן $s_0=\inf P\ge0$ קיים. נניח בשלילה ש-$s_0>0$.
      - kind: step
        text: >-
          **$s_0\in P$.** נניח שלא. אז $s_0$ אינו מתקבל, ומתכונת האינפימום יש $x_1\in P$ עם $s_0<x_1<2s_0$, ושוב
          מתכונת האינפימום (עם $x_1>s_0$) יש $x_2\in P$ עם $s_0<x_2<x_1$. אז $x_1-x_2\in L$
          ו-$0<x_1-x_2<2s_0-s_0=s_0$: איבר של $P$ שקטן מהאינפימום, סתירה.
      - kind: step
        text: >-
          **$L=s_0\mathbb{Z}$.** כל כפולה שלמה של $s_0$ ב-$L$, כי $L$ מכילה סכומים ונגדיים. להפך, יהי $x\in L$
          ו-$k=\lfloor x/s_0\rfloor$. אז $\rho=x-ks_0\in L$ ו-$0\le\rho<s_0$. אילו $\rho>0$, היה $\rho\in P$ קטן מ-$s_0$; לכן $\rho=0$ ו-$x=ks_0$.
      - kind: step
        text: >-
          **הסתירה.** $\ln2=as_0$ ו-$\ln3=bs_0$ עם $a,b\in\mathbb{Z}$, ומכיוון ש-$\ln2,\ln3,s_0>0$, $a,b\in\mathbb{N}$.
          אז $b\ln2=abs_0=a\ln3$, כלומר $2^b=3^a$. אבל $2^b$ זוגי ו-$3^a$ אי-זוגי. לכן $s_0=0$, ומתכונת האינפימום
          לכל $\delta>0$ יש $g\in P$ עם $g<\delta$.
      - kind: step
        text: >-
          (ג) יהיו $y>0$ ו-$\varepsilon>0$. $e^t$ רציפה ב-$\ln y$ (אינפי 1), ולכן יש $\delta>0$ כך ש-$|t-\ln y|<\delta$
          גורר $|e^t-y|<\varepsilon$. לפי (א) ו-(ב) יש $x=m\ln2+n\ln3\in L$ עם $|x-\ln y|<\delta$. אז
          $e^x=2^m3^n\in S$ ו-$|2^m3^n-y|<\varepsilon$.
      - kind: check
        text: >-
          איבר קטן מפורש: $\frac{3^{12}}{2^{19}}=\frac{531441}{524288}\approx1.01364$, ולכן $g=12\ln3-19\ln2\approx0.013551\in L$.
          ל-$y=5$: $k=\lfloor\ln5/g\rfloor=118$, ו-$e^{118g}=3^{1416}\cdot2^{-2242}\approx4.9482$, במרחק כ-$0.052$ מ-$5$.
          עם $g$ קטן יותר מתקבל קירוב טוב יותר. (חישוב מספרי; ההוכחה היא (א)–(ג).)
      - kind: result
        text: >-
          כן: $\{2^m3^n:\ m,n\in\mathbb{Z}\}$ צפופה ב-$(0,\infty)$.
