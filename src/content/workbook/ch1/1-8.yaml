  - id: W-1.8-c2
    stars: 1
    objectives: [OBJ-1.8-2, OBJ-1.8-1]
    prompt: >-
      על $(C[0,1],\|\cdot\|_\infty)$ נגדיר $(Tf)(x)=f\big(\tfrac x2\big)$. מספר $\mu$ הוא **ערך עצמי** של $T$ אם יש
      $f\in C[0,1]$, $f\ne0$, עם $Tf=\mu f$, כמו באלגברה לינארית.

      (א) הוכיחו ש-$T$ לינארית וחסומה, וחשבו את $\|T\|_{\mathrm{op}}$.

      (ב) הוכיחו שכל $\mu\in(0,1]$ הוא ערך עצמי של $T$. רמז: $f_p(x)=x^p$ עם $p\ge0$.

      (ג) יהי $\mu\in\mathbb{R}$ עם $|\mu|>\|T\|_{\mathrm{op}}$, ו-$g(x)=x$. מצאו את **כל** הפונקציות
      $f\in C[0,1]$ עם $Tf-\mu f=g$.
    answer: >-
      (א) $\|T\|_{\mathrm{op}}=1$. (ב) $Tx^p=2^{-p}x^p$, ו-$\mu=2^{-p}$ עם $p=\log_2\frac1\mu\ge0$. (ג) הפתרון
      היחיד הוא $f(x)=\dfrac{x}{\frac12-\mu}$.
    solution:
      - kind: given
        text: >-
          $(Tf)(x)=f(\tfrac x2)$ על $(C[0,1],\|\cdot\|_\infty)$. $Tf$ רציפה כהרכבה של רציפות, ו-$\tfrac x2\in[0,\tfrac12]\subseteq[0,1]$,
          ולכן $Tf\in C[0,1]$.
      - kind: idea
        text: >-
          $Tf$ מסתכלת רק על הערכים של $f$ ב-$[0,\tfrac12]$, ולכן לא יכולה להיות גדולה מ-$f$; קבועים מראים שהיא גם לא
          קטנה ממנה. ב-(ג) מנחשים פתרון מאותה צורה כמו $g$, ומשתמשים בנורמה כדי להראות שההפרש בין שני פתרונות חייב
          להתאפס כש-$|\mu|>\|T\|_{\mathrm{op}}$.
      - kind: step
        text: >-
          (א) **לינאריות:** $T(af+bh)(x)=af(\tfrac x2)+bh(\tfrac x2)=a(Tf)(x)+b(Th)(x)$.
          **חסם מלעיל:** $\{f(\tfrac x2):\ x\in[0,1]\}=\{f(t):\ t\in[0,\tfrac12]\}\subseteq\{f(t):\ t\in[0,1]\}$, ולכן
          $\|Tf\|_\infty\le\|f\|_\infty$: $T$ חסומה (ולכן רציפה, משפט 1.8.2), ולפי טענה 1.8.4(א) $\|T\|_{\mathrm{op}}\le1$.
      - kind: step
        text: >-
          **חסם מלרע:** $f\equiv1$ נותנת $Tf\equiv1$, כלומר $\|Tf\|_\infty=1=\|f\|_\infty$. לכן $\|T\|_{\mathrm{op}}=1$.
      - kind: step
        text: >-
          (ב) ל-$p\ge0$, $f_p(x)=x^p$ (ו-$f_0\equiv1$) רציפה על $[0,1]$ ואינה אפס,
          ו-$(Tf_p)(x)=\left(\tfrac x2\right)^p=2^{-p}x^p=2^{-p}f_p(x)$. לכן $2^{-p}$ ערך עצמי. בהינתן $\mu\in(0,1]$,
          נבחר $p=\log_2\frac1\mu$; מכיוון ש-$\frac1\mu\ge1$, $p\ge0$, ו-$2^{-p}=\mu$.
      - kind: step
        text: >-
          (ג) **קיום.** נחפש $f(x)=cx$: $(Tf-\mu f)(x)=\frac{cx}2-\mu cx=c\left(\tfrac12-\mu\right)x$. מכיוון
          ש-$|\mu|>1$, $\mu\ne\frac12$, ולכן $c=\frac{1}{\frac12-\mu}$ נותן $Tf-\mu f=g$.
      - kind: step
        text: >-
          **יחידות.** אם $f_1,f_2$ שני פתרונות, $h=f_1-f_2$ מקיימת, מהלינאריות, $Th-\mu h=g-g=0$, כלומר $Th=\mu h$.
          לפי טענה 1.8.4(א), $|\mu|\,\|h\|_\infty=\|\mu h\|_\infty=\|Th\|_\infty\le\|T\|_{\mathrm{op}}\|h\|_\infty=\|h\|_\infty$,
          ולכן $(|\mu|-1)\|h\|_\infty\le0$. מכיוון ש-$|\mu|-1>0$, $\|h\|_\infty=0$, כלומר $h=0$ ו-$f_1=f_2$.
      - kind: check
        text: >-
          $\mu=3$: $f(x)=\frac{x}{\frac12-3}=-0.4x$. ב-$x=0.7$: $f(0.35)-3f(0.7)=-0.14+0.84=0.7=g(0.7)$.
          ובניסוח של (ב): היחידות אומרת שאין ערך עצמי $\mu$ עם $|\mu|>1$, כי וקטור עצמי $h\ne0$ היה נותן
          $|\mu|\le\|T\|_{\mathrm{op}}=1$ (כמו בדוגמה 4 של השיעור).
      - kind: result
        text: >-
          $\|T\|_{\mathrm{op}}=1$; כל $\mu\in(0,1]$ ערך עצמי; ל-$|\mu|>1$ הפתרון היחיד של $Tf-\mu f=x$ הוא
          $f(x)=\dfrac{x}{\frac12-\mu}$.
