# Workbook of lesson 1.8 — bounded linear maps and the operator norm.
# Objectives (src/course.ts):
#   OBJ-1.8-1  a linear map between normed spaces is continuous iff bounded iff continuous at 0
#   OBJ-1.8-2  the operator norm; matrices in the 1- and ∞-norms, an estimate in the Euclidean norm
#   OBJ-1.8-3  an unbounded linear map in infinite dimension: differentiation in the sup norm
# Matrix norms recomputed with src/math/multivar.ts (opNorm, symEigenvalues); integrals with simpson.
# Rebuilt 2026-11-10 on the numbered spine of lesson 1.8 (1.8.1–1.8.12): W-02, W-03, W-05 rewritten as proofs,
# citations by number everywhere; challenges c1, c2 kept with their sources.
lesson: '1.8'
practice:
  - id: W-1.8-01
    level: basic
    objectives: [OBJ-1.8-2]
    prompt: >-
      $A=\begin{pmatrix}1&-2\\3&0\\-1&1\end{pmatrix}$ כהעתקה מ-$\mathbb{R}^2$ ל-$\mathbb{R}^3$.

      (א) חשבו את $\|A\|_\infty$ (נורמת אינסוף בשני הצדדים), ומצאו $x$ עם $\|x\|_\infty=1$ שמשיג אותה.

      (ב) חשבו את $\|A\|_1$, ומצאו $x$ עם $\|x\|_1=1$ שמשיג אותה.
    answer: >-
      (א) 3, למשל ב-$x=(1,-1)$. (ב) 5, ב-$x=e_1$.
    solution:
      - kind: theorem
        text: >-
          משפט 1.8.8: $\|A\|_1=\max_j\sum_i|a_{ij}|$ (עמודות), מתקבלת ב-$e_{j^*}$. משפט 1.8.9:
          $\|A\|_\infty=\max_i\sum_j|a_{ij}|$ (שורות), מתקבלת בווקטור הסימנים של השורה המקסימלית.
      - kind: computation
        text: >-
          (א) סכומי השורות בערך מוחלט: $1+2=3$, $3+0=3$, $1+1=2$. המקסימום 3. וקטור הסימנים של השורה הראשונה,
          $x=(1,-1)$, נותן $Ax=(3,\ 3,\ -2)$, ו-$\|Ax\|_\infty=3$.
      - kind: computation
        text: >-
          (ב) סכומי העמודות: $1+3+1=5$ ו-$2+0+1=3$. המקסימום 5, ב-$x=e_1$: $Ae_1=(1,3,-1)$, ו-$\|Ae_1\|_1=5$.
      - kind: check
        text: >-
          בשני הסעיפים הווקטור שמצאנו נמצא בכדור היחידה ומשיג את החסם, כפי שהמשפטים מבטיחים. ב-(א) גם $x=(1,0)$
          משיג 3, דרך השורה השנייה: וקטור משיג אינו יחיד.
      - kind: result
        text: >-
          (א) $\|A\|_\infty=3$; (ב) $\|A\|_1=5$.

  - id: W-1.8-02
    level: basic
    objectives: [OBJ-1.8-2]
    prompt: >-
      $T:\mathbb{R}^2\to\mathbb{R}^2$, $T(x,y)=(x+y,\ x-y)$.

      (א) הוכיחו ש-$\|T(x,y)\|_2=\sqrt2\,\|(x,y)\|_2$ לכל $(x,y)$, והסיקו ש-$\|T\|_2=\sqrt2$ ושהסופרמום מתקבל בכל
      וקטור יחידה.

      (ב) חשבו את $\|T\|_1$ ואת $\|T\|_\infty$.

      (ג) בדקו את (א) בעזרת משפט 1.8.10.
    answer: >-
      (א) $\|T(x,y)\|_2^2=2(x^2+y^2)$, ולכן $\|T\|_2=\sqrt2$. (ב) $\|T\|_1=\|T\|_\infty=2$. (ג) $A^TA=2I$.
    solution:
      - kind: computation
        text: >-
          (א) $(x+y)^2+(x-y)^2=x^2+2xy+y^2+x^2-2xy+y^2=2(x^2+y^2)$. מוציאים שורש חיובי:
          $\|T(x,y)\|_2=\sqrt2\,\|(x,y)\|_2$.
      - kind: step
        text: >-
          לפי טענה 1.8.4(ב), $\|T\|_2=\sup_{v\ne0}\frac{\|Tv\|_2}{\|v\|_2}$, וכאן כל היחסים שווים ל-$\sqrt2$. לכן
          $\|T\|_2=\sqrt2$, וכל $v$ עם $\|v\|_2=1$ מקיים $\|Tv\|_2=\sqrt2$, כלומר משיג את הסופרמום.
      - kind: computation
        text: >-
          (ב) המטריצה היא $A=\begin{pmatrix}1&1\\1&-1\end{pmatrix}$. סכומי העמודות וסכומי השורות בערך מוחלט כולם 2,
          ולכן לפי משפטים 1.8.8 ו-1.8.9 $\|T\|_1=\|T\|_\infty=2$.
      - kind: check
        text: >-
          (ג) $A^TA=\begin{pmatrix}1&1\\1&-1\end{pmatrix}\begin{pmatrix}1&1\\1&-1\end{pmatrix}=\begin{pmatrix}2&0\\0&2\end{pmatrix}$,
          שהערך העצמי היחיד שלה 2, ולכן לפי משפט 1.8.10 $\|T\|_2=\sqrt2$, וכל וקטור הוא וקטור עצמי: בדיוק מה
          שמצאנו ב-(א). ו-$\sqrt2\approx1.414<2$: שלוש הנורמות לא חייבות להיות שוות.
      - kind: result
        text: >-
          $\|T\|_2=\sqrt2$ (מתקבלת בכל וקטור יחידה); $\|T\|_1=\|T\|_\infty=2$.

  - id: W-1.8-03
    level: mid
    qualitative: true
    objectives: [OBJ-1.8-1]
    prompt: >-
      $T:V\to W$ לינארית בין מרחבים נורמיים. הוכיחו או הפריכו.

      (א) אם $T$ רציפה בנקודה אחת $x_0\in V$, אז היא רציפה בכל נקודה.

      (ב) אם לכל סדרה $x_n\to0$ ב-$V$ הסדרה $(Tx_n)$ חסומה ב-$W$, אז $T$ חסומה.

      (ג) אם $T$ חסומה, חד-חד-ערכית ועל, אז גם $T^{-1}$ חסומה. (רמז: על $P$, הפולינומים על $[0,1]$ עם נורמת
      הסופרמום, הסתכלו על $(Sp)(x)=p(\tfrac x2)$.)
    answer: >-
      (א) נכון. (ב) נכון. (ג) לא נכון: $S$ חסומה עם $\|S\|\le1$, ו-$S^{-1}p(x)=p(2x)$ מעבירה את $x^n$ ל-$2^nx^n$.
    solution:
      - kind: idea
        text: >-
          (א) לינאריות מזיזה כל נקודה ל-$x_0$; (ב) אם $T$ אינה חסומה יש וקטורים קצרים שבהם $T$ עצומה, ומקטינים אותם
          לאט יותר משהם גדלים; (ג) במימד אינסופי ההפכית יכולה למתוח בלי גבול גם כש-$T$ מכווצת.
      - kind: step
        text: >-
          (א) **נכון.** יהי $y\in V$ ו-$y_n\to y$. לפי טענה 1.5.6, $x_0+(y_n-y)\to x_0$, ולפי משפט 1.6.3 (הרציפות
          ב-$x_0$ בניסוח סדרתי) $T(x_0+y_n-y)\to Tx_0$. לפי הלינאריות $T(x_0+y_n-y)-Tx_0=Ty_n-Ty$, ולכן
          $\|Ty_n-Ty\|\to0$, כלומר $Ty_n\to Ty$. לפי משפט 1.6.3, $T$ רציפה ב-$y$.
      - kind: step
        text: >-
          (ב) **נכון.** נניח בשלילה ש-$T$ אינה חסומה. לפי משפט 1.8.2, (ה)$\Leftrightarrow$(ד), הסופרמום של $\|Tx\|$
          על כדור היחידה הסגור אינו סופי, ולכן לכל $n\in\mathbb{N}$ יש $x_n$ עם $\|x_n\|\le1$ ו-$\|Tx_n\|>n^2$;
          בוחרים סדרה כזו (בחירה בת מנייה).
      - kind: computation
        text: >-
          נגדיר $y_n=\frac{x_n}{n}$. אז $\|y_n\|\le\frac1n\to0$, כלומר $y_n\to0$, ואילו $\|Ty_n\|=\frac{\|Tx_n\|}{n}>n$.
          אילו $(Ty_n)$ הייתה חסומה, היא הייתה מוכלת באיזה כדור $B(w,r)$ (טענה 1.5.3), ואז
          $\|Ty_n\|<r+\|w\|$ לכל $n$, בסתירה ל-$\|Ty_n\|>n$ עבור $n>r+\|w\|$. סתירה להנחה, ולכן $T$ חסומה.
      - kind: step
        text: >-
          (ג) **לא נכון.** $Sp(x)=p(\tfrac x2)$ ו-$Rp(x)=p(2x)$ מעבירות פולינומים לפולינומים, הן לינאריות, ו-$S(Rp)=p$,
          $R(Sp)=p$; לכן $S$ חד-חד-ערכית ועל, ו-$S^{-1}=R$. $S$ חסומה:
          $\|Sp\|_\infty=\max_{x\in[0,1]}|p(\tfrac x2)|=\max_{[0,\frac12]}|p|\le\|p\|_\infty$.
      - kind: computation
        text: >-
          אבל $R$ אינה חסומה: $\|x^n\|_\infty=1$ ו-$R(x^n)=2^nx^n$, עם $\|R(x^n)\|_\infty=2^n$. אילו
          $\|Rp\|_\infty\le M\|p\|_\infty$ לכל $p$, היה $2^n\le M$ לכל $n$, וזה בלתי אפשרי.
      - kind: check
        text: >-
          ב-$\mathbb{R}^n$ (ג) כן נכון: ההפכית של העתקה לינארית הפיכה היא לינארית, ולפי טענה 1.8.7 חסומה. ההפרכה
          חייבת להשתמש במימד אינסופי, כמו כאן. וב-(ב), אם היינו לוקחים רק $\|Tx_n\|>n$, היינו מקבלים
          $\|Ty_n\|>1$ בלבד, וזה לא סותר כלום: לכן $n^2$.
      - kind: result
        text: >-
          (א) נכון; (ב) נכון; (ג) לא נכון, וההפרכה היא $S$ על $P$.

  - id: W-1.8-04
    level: mid
    objectives: [OBJ-1.8-2]
    prompt: >-
      על $(C[0,1],\|\cdot\|_\infty)$ יהי $\varphi(f)=f(0)+f(1)-\int_0^1f(x)\,dx$.

      (א) הוכיחו ש-$\varphi$ פונקציונל לינארי חסום עם $\|\varphi\|\le3$.

      (ב) מצאו פונקציות $f_n$ עם $\|f_n\|_\infty=1$ ו-$\varphi(f_n)\to3$, והסיקו את הנורמה.

      (ג) הוכיחו שהנורמה אינה מתקבלת.
    answer: >-
      $\|\varphi\|=3$. למשל $f_n$ ששווה 1 בקצוות ו-$(-1)$ על $[\frac1n,1-\frac1n]$, עם $\varphi(f_n)=3-\frac2n$. אין $f$
      עם $\|f\|_\infty\le1$ ו-$|\varphi(f)|=3$.
    solution:
      - kind: idea
        text: >-
          חסם מלעיל מאי-שוויון המשולש; חסם מלרע מפונקציה שהיא 1 בקצוות (כדי ששני המחוברים הראשונים יתרמו $+2$)
          ו-$(-1)$ כמעט בכל הקטע (כדי ש"מינוס האינטגרל" יתרום כמעט $+1$). אבל רציפות לא מרשה את שני הדברים בבת אחת.
      - kind: computation
        text: >-
          (א) $\varphi$ לינארי כסכום של פונקציונלים לינאריים. לפי אי-שוויון המשולש והמונוטוניות של האינטגרל,
          $|\varphi(f)|\le|f(0)|+|f(1)|+\int_0^1|f|\le3\|f\|_\infty$. לפי טענה 1.8.4(א), $\|\varphi\|\le3$.
      - kind: step
        text: >-
          (ב) ל-$n\ge2$ תהי $f_n$ רציפה, לינארית מ-1 ב-$0$ עד $(-1)$ ב-$\frac1n$, שווה ל-$(-1)$ על
          $\left[\frac1n,1-\frac1n\right]$, ולינארית מ-$(-1)$ עד 1 על $\left[1-\frac1n,1\right]$. אז $\|f_n\|_\infty=1$.
      - kind: computation
        text: >-
          על כל אחד משני קטעי המעבר האינטגרל 0 (הקו עובר מ-1 ל-$(-1)$ באופן סימטרי סביב אמצע הקטע). על הקטע האמצעי,
          שאורכו $1-\frac2n$, האינטגרל $-\left(1-\frac2n\right)$. לכן $\int_0^1f_n=-1+\frac2n$,
          ו-$\varphi(f_n)=1+1-\left(-1+\frac2n\right)=3-\frac2n$. לפי טענה 1.8.4(ב) $\|\varphi\|\ge3-\frac2n$ לכל $n$,
          ולכן $\|\varphi\|=3$.
      - kind: step
        text: >-
          (ג) נניח $\|f\|_\infty\le1$ ו-$\varphi(f)=3$. כל אחד משלושת המחוברים קטן או שווה ל-1: $f(0)\le1$, $f(1)\le1$,
          ו-$-\int_0^1f\le\int_0^1|f|\le1$. הסכום שלהם 3, ולכן כל אחד מהם שווה ל-1: $f(0)=f(1)=1$ ו-$\int_0^1(1+f)=0$.
          הפונקציה $1+f$ רציפה ואי-שלילית (כי $f\ge-1$) עם אינטגרל 0, ולפי למה 1.2.19 היא אפס בכל הקטע, כלומר
          $f\equiv-1$, בסתירה ל-$f(0)=1$. אם $\varphi(f)=-3$, אותו נימוק על $g=-f$ נותן סתירה.
      - kind: check
        text: >-
          עם $n=4$ ו-$n=10$: $3-\frac2n$ נותן $2.5$ ו-$2.8$, ואינטגרציה מספרית של $f_{10}$ נותנת אותו ערך.
      - kind: result
        text: >-
          $\|\varphi\|=3$, ואינה מתקבלת.

  - id: W-1.8-05
    level: mid
    objectives: [OBJ-1.8-2]
    prompt: >-
      (א) עבור $A=\begin{pmatrix}3&0\\4&5\end{pmatrix}$ הוכיחו ש-$5\le\|A\|_2\le\sqrt{50}$, בלי לחשב ערכים עצמיים.

      (ב) חשבו את $\|A\|_2$ בדיוק, ומצאו וקטור יחידה שמשיג אותה.

      (ג) הוכיחו שלכל מטריצה ממשית $A$ מגודל $m\times n$ מתקיים $\|A^TA\|_2=\|A\|_2^2$, ובדקו על המטריצה מ-(א).
    answer: >-
      (א) $\|Ae_2\|_2=5$ ו-$\|A\|_F=\sqrt{50}$. (ב) $\|A\|_2=\sqrt{45}=3\sqrt5\approx6.708$, ב-$\frac{1}{\sqrt2}(1,1)$.
      (ג) $\|A^TA\|_2=\lambda_{\max}(A^TA)$; כאן $45$.
    solution:
      - kind: computation
        text: >-
          (א) $e_2$ מקיים $\|e_2\|_2=1$ ו-$Ae_2=(0,5)$, ולכן לפי הגדרה 1.8.3 $\|A\|_2\ge5$. ולפי טענה 1.8.10ב,
          $\|A\|_2\le\|A\|_F=\sqrt{9+0+16+25}=\sqrt{50}\approx7.071$.
      - kind: computation
        text: >-
          (ב) $A^TA=\begin{pmatrix}3&4\\0&5\end{pmatrix}\begin{pmatrix}3&0\\4&5\end{pmatrix}=\begin{pmatrix}25&20\\20&25\end{pmatrix}$.
          העקבה 50 והדטרמיננטה $625-400=225$, ולכן $\lambda^2-50\lambda+225=0$, $\lambda\in\{5,\ 45\}$. לפי משפט
          1.8.10, $\|A\|_2=\sqrt{45}=3\sqrt5\approx6.708$.
      - kind: step
        text: >-
          $v=\frac1{\sqrt2}(1,1)$ הוא וקטור עצמי באורך 1 של $A^TA$ עם הערך 45: $A^TA(1,1)=(45,45)$. ובדיקה ישירה:
          $Av=\frac{(3,9)}{\sqrt2}$, שאורכו $\sqrt{\frac{90}{2}}=\sqrt{45}$.
      - kind: step
        text: >-
          (ג) נסמן $B=A^TA$. לפי משפט 1.8.10, $B$ סימטרית וכל הערכים העצמיים שלה $\lambda_i\ge0$. לפי מסקנה 1.8.10א,
          $\|B\|_2=\max_i|\lambda_i|=\max_i\lambda_i=\lambda_{\max}(B)$, ולפי משפט 1.8.10 שוב,
          $\|A\|_2^2=\lambda_{\max}(B)$. לכן $\|A^TA\|_2=\|A\|_2^2$.
      - kind: check
        text: >-
          על המטריצה מ-(א): $A^TA$ סימטרית עם ערכים עצמיים 5 ו-45, ולכן $\|A^TA\|_2=45=(\sqrt{45})^2$. ו-(א) עקבי עם
          (ב): $5\le6.708\le7.071$. ($5$ הוא גם הערך העצמי הגדול של $A$ עצמה; $A$ אינה סימטרית, והנורמה גדולה ממנו
          ממש.)
      - kind: result
        text: >-
          (ב) $\|A\|_2=3\sqrt5\approx6.708$; (ג) $\|A^TA\|_2=\|A\|_2^2$ לכל $A$, וכאן 45.

  - id: W-1.8-06
    level: basic
    objectives: [OBJ-1.8-1, OBJ-1.8-2]
    prompt: >-
      תהי $g\in C[0,1]$, ונגדיר על $(C[0,1],\|\cdot\|_\infty)$ את העתקת הכפל $(T_gf)(x)=g(x)f(x)$.

      (א) הוכיחו ש-$T_g$ לינארית, חסומה ורציפה.

      (ב) הוכיחו ש-$\|T_g\|=\|g\|_\infty$, ושהסופרמום מתקבל.
    answer: >-
      $\|T_gf\|_\infty\le\|g\|_\infty\|f\|_\infty$, ושוויון ב-$f\equiv1$.
    solution:
      - kind: step
        text: >-
          (א) מכפלה של פונקציות רציפות רציפה (טענה 1.6.5), ולכן $T_gf\in C[0,1]$. לינאריות: $g(af+bh)=a\,gf+b\,gh$.
      - kind: computation
        text: >-
          חסם: לכל $x$, $|g(x)f(x)|\le\|g\|_\infty\,\|f\|_\infty$, ולכן $\|T_gf\|_\infty\le\|g\|_\infty\|f\|_\infty$. זו
          חסימות עם $M=\|g\|_\infty$ (הגדרה 1.8.1), ולפי משפט 1.8.2 $T_g$ רציפה, ואפילו ליפשיצית עם קבוע $\|g\|_\infty$.
      - kind: step
        text: >-
          (ב) לפי טענה 1.8.4(א), החסם נותן $\|T_g\|\le\|g\|_\infty$. מלרע: $f\equiv1$ מקיימת $\|f\|_\infty=1$
          ו-$T_g1=g$, ולכן לפי הגדרה 1.8.3 $\|T_g\|\ge\|g\|_\infty$, והסופרמום מתקבל ב-$f\equiv1$.
      - kind: check
        text: >-
          עם $g(x)=x$ מקבלים $\|T_g\|=1$, כמו שצריך: $|xf(x)|\le|f(x)|$ על $[0,1]$. ועם $g$ קבועה $c$, $T_g=c\cdot\mathrm{id}$
          ו-$\|T_g\|=|c|$, לפי ההומוגניות שבמשפט 1.8.5.
      - kind: result
        text: >-
          $T_g$ חסומה ורציפה, ו-$\|T_g\|=\|g\|_\infty$, מתקבלת ב-$f\equiv1$.

  - id: W-1.8-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.8-3]
    prompt: >-
      $P$ הפולינומים על $[0,1]$, הפעם עם נורמת האינטגרל $\|p\|_1=\int_0^1|p(x)|\,dx$ בשני הצדדים. הוכיחו או הפריכו:
      הגזירה $D:(P,\|\cdot\|_1)\to(P,\|\cdot\|_1)$, $Dp=p'$, חסומה.
    answer: >-
      לא חסומה: $\|x^n\|_1=\frac1{n+1}$ ו-$\|nx^{n-1}\|_1=1$, והיחס $n+1$ אינו חסום.
    solution:
      - kind: idea
        text: >-
          ננסה את אותם פולינומים שהפילו את $D$ בנורמת הסופרמום (טענה 1.8.11): $x^n$. צריך לחשב את שתי הנורמות מחדש,
          כי הנורמה השתנתה.
      - kind: step
        text: >-
          $\|\cdot\|_1$ היא נורמה על $C[0,1]$ (טענה 1.2.20), ולכן גם על תת-המרחב $P$. $D$ לינארית ומעבירה פולינומים
          לפולינומים.
      - kind: computation
        text: >-
          $\|x^n\|_1=\int_0^1x^n\,dx=\frac1{n+1}$, ו-$\|Dx^n\|_1=\int_0^1nx^{n-1}\,dx=1$.
      - kind: step
        text: >-
          לכן $\frac{\|Dx^n\|_1}{\|x^n\|_1}=n+1$. אילו $D$ הייתה חסומה עם קבוע $M$, היה מתקיים $n+1\le M$ לכל $n$,
          בסתירה לתכונת ארכימדס. לכן $D$ אינה חסומה, ולפי משפט 1.8.2 אינה רציפה.
      - kind: check
        text: >-
          ל-$n=10$: $\|x^{10}\|_1=\frac1{11}\approx0.0909$ ו-$\|10x^9\|_1=1$, והיחס 11. בנורמת הסופרמום היחס היה $n=10$:
          הנורמה השתנתה, אבל הפולינומים $x^n$ מפילים את $D$ בשתיהן.
      - kind: result
        text: >-
          הטענה שקרית: $D$ אינה חסומה גם בנורמת האינטגרל.

  - id: W-1.8-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    prompt: >-
      $V$ מרחב נורמי, ו-$\varphi:V\to\mathbb{R}$ פונקציונל לינארי. הגרעין שלו הוא $\ker\varphi=\{x\in V:\ \varphi(x)=0\}$.

      (א) ציינו, עם מספרי הטענות, למה $\ker\varphi$ סגורה כש-$\varphi$ חסום.

      (ב) הוכיחו את הכיוון ההפוך: אם $\ker\varphi$ סגורה, אז $\varphi$ חסום. רמז: הניחו שלא, בחרו $x_n$ עם
      $\|x_n\|\le1$ ו-$|\varphi(x_n)|>n$, ו-$z$ עם $\varphi(z)=1$, והסתכלו על $y_n=z-\frac{x_n}{\varphi(x_n)}$.

      (ג) האם (ב) נכון גם להעתקה לינארית $T:V\to W$ כללית, כלומר: גרעין סגור גורר חסומה? בדקו את הגזירה
      $D:P\to P$ על הפולינומים עם נורמת הסופרמום.

      (ד) נניח $\varphi\ne0$. הוכיחו ש-$\overline{\ker\varphi}$ תת-מרחב וקטורי של $V$, ושכל תת-מרחב $Y$ עם
      $\ker\varphi\subseteq Y\subseteq V$ הוא $\ker\varphi$ או $V$. הסיקו: $\ker\varphi$ סגורה או צפופה, ו-$\varphi$
      אינו חסום אם ורק אם $\ker\varphi$ צפופה.
    answer: >-
      (א) משפט 1.8.2, טענה 1.3.5 ומשפט 1.6.4. (ב) $y_n\in\ker\varphi$ ו-$y_n\to z$, אבל $\varphi(z)=1$: סתירה
      לסגירות. (ג) לא: $\ker D$ היא הפולינומים הקבועים, קבוצה סגורה, ו-$D$ אינה חסומה. (ד) אם $w\in Y$ ו-$\varphi(w)\ne0$,
      כל $x$ הוא $\big(x-\frac{\varphi(x)}{\varphi(w)}w\big)+\frac{\varphi(x)}{\varphi(w)}w\in Y$; לכן הסגור הוא
      $\ker\varphi$ או $V$.
    solution:
      - kind: step
        text: >-
          (א) זה השלב האחרון של דוגמה 6(ג) בשיעור: $\varphi$ חסום, ולכן רציף (משפט 1.8.2); $\{0\}$ סגורה (טענה 1.3.5);
          ו-$\ker\varphi=\varphi^{-1}(\{0\})$ סגורה כמקור של קבוצה סגורה (משפט 1.6.4).
      - kind: idea
        text: >-
          (ב) אם $\varphi$ אינו חסום, יש וקטורים קצרים שבהם $\varphi$ עצום. מחלקים אותם בערך של $\varphi$ ומקבלים וקטורים
          זעירים; מזיזים בהם נקודה $z$ שמחוץ לגרעין בדיוק לתוך הגרעין. כך נקודות מהגרעין מתכנסות ל-$z$, והגרעין
          אינו סגור.
      - kind: step
        text: >-
          אם $\varphi=0$, הוא חסום ואין מה להוכיח. אחרת יש $w$ עם $\varphi(w)\ne0$, ונגדיר $z=\frac{w}{\varphi(w)}$; אז
          $\varphi(z)=1$, ובפרט $z\notin\ker\varphi$.
      - kind: step
        text: >-
          נניח בשלילה ש-$\varphi$ אינו חסום. לפי משפט 1.8.2, (ה)$\Leftrightarrow$(ד), $\sup_{\|x\|\le1}|\varphi(x)|$ אינו
          סופי, ולכן לכל $n\in\mathbb{N}$ יש $x_n$ עם $\|x_n\|\le1$ ו-$|\varphi(x_n)|>n$; בוחרים סדרה כזו (בחירה
          בת מנייה). בפרט $\varphi(x_n)\ne0$, ונגדיר $y_n=z-\frac{x_n}{\varphi(x_n)}$.
      - kind: computation
        text: >-
          לפי הלינאריות $\varphi(y_n)=\varphi(z)-\frac{\varphi(x_n)}{\varphi(x_n)}=1-1=0$, כלומר $y_n\in\ker\varphi$.
          והמרחק: $\|y_n-z\|=\frac{\|x_n\|}{|\varphi(x_n)|}<\frac1n\to0$, כלומר $y_n\to z$.
      - kind: step
        text: >-
          קבוצה סגורה מכילה את הגבולות של כל הסדרות המתכנסות שלה (מסקנה 1.5.8). $\ker\varphi$ סגורה ו-$y_n\to z$,
          ולכן $z\in\ker\varphi$, כלומר $\varphi(z)=0$. אבל $\varphi(z)=1$: סתירה. לכן $\varphi$ חסום.
      - kind: step
        text: >-
          (ג) **לא.** $Dp=0$ אם ורק אם $p$ קבוע, ולכן $\ker D$ היא קבוצת הפולינומים הקבועים. היא סגורה, לפי מסקנה
          1.5.8: אם קבועים $c_n$ מתכנסים ל-$p$ בנורמת הסופרמום, אז לכל $x\in[0,1]$, $|c_n-p(x)|\le\|c_n-p\|_\infty\to0$,
          ולכן $p(x)=\lim c_n$ לא תלוי ב-$x$: גם $p$ קבוע. ובכל זאת $D$ אינה חסומה (טענה 1.8.11(א), שגם קובעת שהצמצום
          ל-$P$ אינו חסום).
      - kind: check
        text: >-
          איפה השתמשנו ב-(ב) בכך שהטווח הוא $\mathbb{R}$? ב-$z$: לפונקציונל שאינו אפס יש וקטור שעליו הוא 1, ו-$y_n$
          "נופלת" לגרעין כי $\varphi(x_n)$ הוא מספר שאפשר לחלק בו. להעתקה ל-$W$ כללי אין מספר כזה, ו-(ג) מראה שהטענה
          אכן נשברת. ועם הפונקציונל $\varphi(p)=p'(0)$ מדוגמה 6 של השיעור: הגרעין שם צפוף ואינו סגור, ו-(א), בניסוח
          השלילה, מסביר למה $\varphi$ אינו חסום.
      - kind: step
        text: >-
          (ד) **הסגור הוא תת-מרחב.** $0\in\ker\varphi\subseteq\overline{\ker\varphi}$. יהיו $x,y\in\overline{\ker\varphi}$
          ו-$a,b\in\mathbb{R}$. לפי משפט 1.5.7 יש סדרות $x_n\to x$ ו-$y_n\to y$ ב-$\ker\varphi$ (בחירה בת מנייה), ואז
          $ax_n+by_n\in\ker\varphi$ (לינאריות) ו-$ax_n+by_n\to ax+by$ (טענה 1.5.6). לפי משפט 1.5.7 שוב,
          $ax+by\in\overline{\ker\varphi}$.
      - kind: step
        text: >-
          **אין תת-מרחב באמצע.** יהי $Y$ תת-מרחב עם $\ker\varphi\subseteq Y$ ו-$Y\ne\ker\varphi$; יש $w\in Y$ עם
          $\varphi(w)\ne0$. לכל $x\in V$, הווקטור $x-\frac{\varphi(x)}{\varphi(w)}w$ נמצא ב-$\ker\varphi\subseteq Y$ (לפי
          הלינאריות, $\varphi$ שלו הוא $\varphi(x)-\varphi(x)=0$), ו-$\frac{\varphi(x)}{\varphi(w)}w\in Y$. הסכום שלהם, $x$,
          ב-$Y$. לכן $Y=V$.
      - kind: step
        text: >-
          **המסקנה.** עם $Y=\overline{\ker\varphi}$: או $\overline{\ker\varphi}=\ker\varphi$, ואז $\ker\varphi$ סגורה
          (טענה 1.4.4), או $\overline{\ker\varphi}=V$, ואז $\ker\varphi$ צפופה (הגדרה 1.4.13). שתי האפשרויות לא מתקיימות
          יחד, כי $\ker\varphi\ne V$ ($\varphi\ne0$). לפי (א) ו-(ב), $\varphi$ אינו חסום אם ורק אם $\ker\varphi$ אינה
          סגורה, כלומר אם ורק אם היא צפופה.
      - kind: result
        text: >-
          לפונקציונל לינארי: חסום אם ורק אם הגרעין סגור, ולפונקציונל שאינו אפס הגרעין סגור או צפוף, ואינו חסום בדיוק
          כשהגרעין צפוף (כמו בדוגמה 6). להעתקה לינארית כללית רק הכיוון של (א) נכון: הגזירה $D$ היא דוגמה נגדית לכיוון
          השני.

  - id: W-1.8-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.8-1, OBJ-1.8-3]
    prompt: >-
      $P$ הפולינומים על $[0,1]$ עם נורמת הסופרמום (על $[0,1]$ בלבד).

      (א) הוכיחו ש-$S(p)=p(2)$ הוא פונקציונל לינארי שאינו חסום.

      (ב) מצאו סדרה $q_n\to0$ ב-$P$ עם $S(q_n)\to\infty$.

      (ג) לעומת זאת, הוכיחו ש-$E(p)=p(\tfrac12)$ חסום, ומצאו את הנורמה שלו.

      (ד) לכל $a\in\mathbb{R}$ נגדיר $E_a(p)=p(a)$ (כך ש-$E=E_{1/2}$ ו-$S=E_2$). לאילו $a$ הפונקציונל $E_a$ חסום, ומה
      הנורמה שלו? רמז למספרים שליליים: $(1-x)^n$.
    answer: >-
      (א) $\|x^n\|_\infty=1$ ו-$S(x^n)=2^n$. (ב) $q_n=\frac{x^n}{2^{n/2}}$. (ג) $|p(\frac12)|\le\|p\|_\infty$, ו-$\|E\|=1$.

      (ד) $E_a$ חסום, עם נורמה 1, בדיוק כש-$a\in[0,1]$; ל-$a>1$ ול-$a<0$ הוא אינו חסום.
    solution:
      - kind: idea
        text: >-
          הנורמה מודדת את $p$ רק על $[0,1]$, אבל $S$ מסתכל מחוץ לקטע, ב-2. פולינום יכול להיות קטן על $[0,1]$ ועצום
          ב-2. לעומת זאת $\frac12$ בתוך הקטע.
      - kind: step
        text: >-
          (א) לינאריות: $(ap+bq)(2)=ap(2)+bq(2)$. ל-$p_n=x^n$: $\|p_n\|_\infty=\max_{[0,1]}x^n=1$, ואילו $S(p_n)=2^n$.
          אילו היה $M$ עם $|S(p)|\le M\|p\|_\infty$ לכל $p$, היה $2^n\le M$ לכל $n$. לכן $S$ אינו חסום.
      - kind: step
        text: >-
          (ב) $q_n=\frac{x^n}{2^{n/2}}$: $\|q_n\|_\infty=2^{-n/2}\to0$, ו-$S(q_n)=\frac{2^n}{2^{n/2}}=2^{n/2}\to\infty$.
          לפי משפט 1.6.3 זו הפרה ישירה של רציפות ב-0: $q_n\to0$, אבל $S(q_n)\not\to S(0)=0$, כפי שמשפט 1.8.2 מנבא.
      - kind: step
        text: >-
          (ג) $|E(p)|=|p(\tfrac12)|\le\max_{[0,1]}|p|=\|p\|_\infty$, ולכן לפי טענה 1.8.4(א) $\|E\|\le1$; והפולינום הקבוע
          1 נותן $E(1)=1$. לכן $\|E\|=1$, והסופרמום מתקבל.
      - kind: step
        text: >-
          (ד) ל-$a\in[0,1]$: בדיוק כמו ב-(ג), $|p(a)|\le\|p\|_\infty$ והקבוע 1 משיג שוויון, ולכן $\|E_a\|=1$.
          ל-$a>1$: כמו ב-(א), $\|x^n\|_\infty=1$ ו-$E_a(x^n)=a^n\to\infty$ (כי $a>1$), ולכן $E_a$ אינו חסום.
      - kind: step
        text: >-
          ל-$a<0$ הפולינומים $x^n$ לא עוזרים: $|a^n|$ יכול להיות קטן. במקומם $u_n(x)=(1-x)^n$: על $[0,1]$ מתקיים
          $0\le u_n\le1$ ו-$u_n(0)=1$, ולכן $\|u_n\|_\infty=1$. ואילו $E_a(u_n)=(1-a)^n$, ו-$1-a>1$, ולכן
          $E_a(u_n)\to\infty$. גם כאן $E_a$ אינו חסום.
      - kind: check
        text: >-
          מספרית: $q_{10}=\frac{x^{10}}{32}$, $\|q_{10}\|_\infty=\frac1{32}$, $S(q_{10})=\frac{1024}{32}=32$. וב-(ד) עם
          $a=-1$: $u_{10}(-1)=2^{10}=1024$, בעוד $\|u_{10}\|_\infty=1$. הקו המפריד הוא הקטע עצמו: בתוכו הערך בנקודה
          חסום בנורמה (כמו בטענה 1.8.12(ב)), ומחוצה לו פולינום קטן על הקטע יכול להיות עצום.
      - kind: result
        text: >-
          $S$ לינארי, לא חסום ולא רציף; $E$ חסום עם נורמה 1. ובכלל, $E_a$ חסום (עם נורמה 1) אם ורק אם $a\in[0,1]$.

  - id: W-1.8-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.8-2]
    prompt: >-
      על $C[0,1]$ עם **נורמת האינטגרל** $\|f\|_1=\int_0^1|f|$, יהי $\varphi(f)=\int_0^1x\,f(x)\,dx$.

      (א) הוכיחו ש-$\varphi$ חסום ו-$\|\varphi\|\le1$.

      (ב) הוכיחו ש-$\|\varphi\|=1$, בעזרת פונקציות משולש צרות ליד הנקודה 1.

      (ג) הוכיחו שהנורמה אינה מתקבלת.
    answer: >-
      (א) $|\varphi(f)|\le\int x|f|\le\|f\|_1$. (ב) $f_n=\max(0,\ 1-n(1-x))$ נותנת יחס $\ge1-\frac1n$. (ג) שוויון גורר $f=0$.
    solution:
      - kind: computation
        text: >-
          (א) $\varphi$ לינארי (לינאריות האינטגרל), ו-$|\varphi(f)|\le\int_0^1x|f(x)|\,dx\le\int_0^1|f(x)|\,dx=\|f\|_1$, כי
          $0\le x\le1$ בקטע (מונוטוניות האינטגרל). לפי טענה 1.8.4(א), $\|\varphi\|\le1$.
      - kind: idea
        text: >-
          החסם $x\le1$ כמעט הדוק רק ליד $x=1$. לכן ניקח פונקציות שכל המסה שלהן ליד 1.
      - kind: step
        text: >-
          (ב) $f_n(x)=\max(0,\ 1-n(1-x))$: משולש בגובה 1 על $\left[1-\frac1n,1\right]$, רציף, עם $\|f_n\|_1=\frac1{2n}$.
          בקטע שבו $f_n\ne0$ מתקיים $x\ge1-\frac1n$, ולכן $\varphi(f_n)\ge\left(1-\frac1n\right)\int_0^1f_n=\left(1-\frac1n\right)\|f_n\|_1$.
          לפי טענה 1.8.4(ב) $\|\varphi\|\ge1-\frac1n$ לכל $n$, ולכן $\|\varphi\|\ge1$; יחד עם (א) $\|\varphi\|=1$.
      - kind: step
        text: >-
          (ג) נניח $\|f\|_1\le1$ ו-$|\varphi(f)|=1$. אז $1=|\varphi(f)|\le\int_0^1x|f|\le\int_0^1|f|\le1$, ולכן
          $\int_0^1x|f|=\int_0^1|f|$, כלומר $\int_0^1(1-x)|f(x)|\,dx=0$. הפונקציה $(1-x)|f(x)|$ רציפה ואי-שלילית, ולפי
          למה 1.2.19 היא אפס בכל הקטע; לכן $f=0$ על $[0,1)$, ומרציפות גם ב-1. אבל אז $\varphi(f)=0$: סתירה.
      - kind: check
        text: >-
          היחס ב-$f_n$ הוא בדיוק $1-\frac1{3n}$: $\varphi(f_n)=\frac1{2n}-\frac1{6n^2}$ (בהצבה $u=1-x$), ומחלקים
          ב-$\|f_n\|_1=\frac1{2n}$. עם $n=10$ זה $1-\frac1{30}\approx0.967$, מעל $1-\frac1{10}=0.9$, כמו שהחסם מבטיח.
      - kind: result
        text: >-
          $\|\varphi\|=1$, והיא אינה מתקבלת. השוו: בנורמת הסופרמום אותו $\varphi$ חסום עם נורמה $\frac12$, והיא
          מתקבלת ב-$f\equiv1$.
challenge:
  - id: W-1.8-c1
    stars: 1
    objectives: [OBJ-1.8-1, OBJ-1.8-2]
    prompt: >-
      תהי $k$ פונקציה רציפה על הריבוע $[0,1]\times[0,1]$ עם $k(x,y)\ge0$ לכל $x,y$, ונגדיר על $(C[0,1],\|\cdot\|_\infty)$
      את **העתקת האינטגרל** $(Tf)(x)=\int_0^1k(x,y)\,f(y)\,dy$. הניחו (נוכיח את זה בפרק 3) ש-$Tf\in C[0,1]$ לכל
      $f\in C[0,1]$, ושהפונקציה $\kappa(x)=\int_0^1k(x,y)\,dy$ רציפה על $[0,1]$.

      (א) הוכיחו ש-$T$ לינארית וחסומה, ולכן רציפה, וש-$\|T\|_{\mathrm{op}}=\max_{x\in[0,1]}\kappa(x)$.

      (ב) חשבו את $\|T\|_{\mathrm{op}}$ עבור $k(x,y)=x+y$.

      (ג) עבור $k(x,y)=x-y$, שמחליף סימן, (א) אינו חל. הוכיחו בכל זאת ש-$\|T\|_{\mathrm{op}}=\max_x\int_0^1|x-y|\,dy$,
      וחשבו אותה.
    answer: >-
      (א) $|Tf(x)|\le \kappa(x)\|f\|_\infty$ נותן $\|T\|_{\mathrm{op}}\le\max\kappa$, ו-$f\equiv1$ נותנת $Tf=\kappa$, ולכן שוויון. (ב)
      $\kappa(x)=x+\frac12$, $\|T\|_{\mathrm{op}}=\frac32$. (ג) $\int_0^1|x-y|\,dy=\frac{x^2+(1-x)^2}2\le\frac12$, ו-$f\equiv-1$
      נותנת $Tf(x)=\frac12-x$ עם $\|Tf\|_\infty=\frac12$; לכן $\|T\|_{\mathrm{op}}=\frac12$.
    solution:
      - kind: given
        text: >-
          $k$ רציפה ו-$k\ge0$ על $[0,1]^2$; $Tf\in C[0,1]$ ו-$\kappa(x)=\int_0^1k(x,y)\,dy$ רציפה (נתון). לפי משפט
          ויירשטראס מאינפי 1, ל-$\kappa$ יש מקסימום $M=\max_{[0,1]}\kappa$.
      - kind: goal
        text: >-
          $\|T\|_{\mathrm{op}}=M$: חסם מלעיל $\|Tf\|_\infty\le M\|f\|_\infty$, ופונקציה אחת עם $\|f\|_\infty=1$ שמשיגה
          $\|Tf\|_\infty=M$.
      - kind: idea
        text: >-
          חסם מלעיל מתקבל כשמוציאים את $\|f\|_\infty$ מהאינטגרל. כדי שהחסם יושג צריך $f$ אחת שבה כל המחוברים
          באינטגרל "דוחפים באותו כיוון", כלומר $k(x,y)f(y)=|k(x,y)|$. כש-$k\ge0$, הפונקציה הקבועה $1$ עושה את זה.
      - kind: step
        text: >-
          (א) **לינאריות:** $T(af+bg)(x)=\int_0^1k(x,y)\big(af(y)+bg(y)\big)dy=a(Tf)(x)+b(Tg)(x)$, מהלינאריות של
          האינטגרל.
      - kind: step
        text: >-
          **חסם מלעיל:** לכל $f$ ולכל $x$, מכיוון ש-$k\ge0$,
          $|(Tf)(x)|\le\int_0^1k(x,y)\,|f(y)|\,dy\le\|f\|_\infty\int_0^1k(x,y)\,dy=\kappa(x)\|f\|_\infty\le M\|f\|_\infty$.
          לכן $\|Tf\|_\infty\le M\|f\|_\infty$: $T$ חסומה, לפי משפט 1.8.2 רציפה, ולפי טענה 1.8.4(א) $\|T\|_{\mathrm{op}}\le M$.
      - kind: step
        text: >-
          **חסם מלרע:** $f\equiv1$ מקיימת $\|f\|_\infty=1$ ו-$(Tf)(x)=\int_0^1k(x,y)\,dy=\kappa(x)$, ולכן
          $\|Tf\|_\infty=\max|\kappa|=M$ (כי $\kappa\ge0$). לכן $\|T\|_{\mathrm{op}}\ge M$, וביחד $\|T\|_{\mathrm{op}}=M$. הסופרמום
          בהגדרה 1.8.3 מתקבל כאן.
      - kind: computation
        text: >-
          (ב) $k=x+y\ge0$ על הריבוע. $\kappa(x)=\int_0^1(x+y)\,dy=x+\frac12$, עולה, ולכן $M=\kappa(1)=\frac32$
          ו-$\|T\|_{\mathrm{op}}=\frac32$.
      - kind: computation
        text: >-
          (ג) **חסם מלעיל:** אותו חישוב כמו ב-(א), עם $|k|$ במקום $k$: $|(Tf)(x)|\le\|f\|_\infty\int_0^1|x-y|\,dy$.
          מפצלים ב-$y=x$: $\int_0^x(x-y)\,dy+\int_x^1(y-x)\,dy=\frac{x^2}2+\frac{(1-x)^2}2$. זו פרבולה קמורה ב-$x$,
          ולכן המקסימום שלה על $[0,1]$ בקצוות: $\frac12$ ב-$x=0$ וב-$x=1$. לכן $\|T\|_{\mathrm{op}}\le\frac12$.
      - kind: step
        text: >-
          **חסם מלרע:** $f\equiv-1$: $(Tf)(x)=\int_0^1(y-x)\,dy=\frac12-x$, ו-$\|Tf\|_\infty=\max_{[0,1]}|\tfrac12-x|=\frac12$,
          בנקודה $x=0$. לכן $\|T\|_{\mathrm{op}}=\frac12$.
      - kind: check
        text: >-
          למה פונקציה קבועה הצליחה ב-(ג), אף ש-$k$ מחליף סימן? כי בנקודה שבה $\int|k|$ מקסימלי, $x=0$, הפונקציה
          $k(0,y)=-y$ אינה מחליפה סימן, ו-$f\equiv-1$ היא בדיוק הסימן שלה. ובמספרים: $\int_0^1|x-y|\,dy=\frac{x^2+(1-x)^2}2$
          הוא $\frac12$ בקצוות ו-$\frac14$ ב-$x=\frac12$, ו-$(Tf)(0)=\frac12$ ל-$f\equiv-1$.
      - kind: result
        text: >-
          לגרעין אי-שלילי $\|T\|_{\mathrm{op}}=\max_x\int_0^1k(x,y)\,dy$, והיא מתקבלת בפונקציה הקבועה $1$. (ב) $\frac32$;
          (ג) $\frac12$.
