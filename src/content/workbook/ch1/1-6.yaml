  - id: W-1.6-c2
    stars: 1
    objectives: [OBJ-1.6-2]
    prompt: >-
      תהי $f:X\to Y$ רציפה בין מרחבים מטריים.

      (א) הוכיחו שלכל $A\subseteq X$ מתקיים $f\big(\overline A\big)\subseteq\overline{f(A)}$.

      (ב) תנו דוגמה של $f:\mathbb{R}\to\mathbb{R}$ רציפה וקבוצה $A$ שעבורן ההכלה ב-(א) ממש.

      (ג) הוכיחו את הכיוון ההפוך: אם $f:X\to Y$ (לא בהכרח רציפה) מקיימת $f\big(\overline A\big)\subseteq\overline{f(A)}$ לכל
      $A\subseteq X$, אז $f$ רציפה.
    answer: >-
      (א) $f^{-1}\big(\overline{f(A)}\big)$ סגורה ומכילה את $A$, ולכן מכילה את $\overline A$. (ב) $f=\arctan$, $A=\mathbb{R}$.
      (ג) לסגורה $F$, עם $A=f^{-1}(F)$: $f(\overline A)\subseteq\overline{f(A)}\subseteq F$, ולכן $\overline A=A$.
    solution:
      - kind: idea
        text: >-
          הסגור $\overline A$ הוא הקבוצה הסגורה הקטנה ביותר שמכילה את $A$ (טענה 1.4.4), ומקור של סגורה תחת רציפה סגור
          (משפט 1.6.4). כדי
          להראות ש-$\overline A$ מוכלת בקבוצה מסוימת, מספיק למצוא קבוצה סגורה שמכילה את $A$.
      - kind: step
        text: >-
          (א) $F=\overline{f(A)}$ סגורה ב-$Y$ (טענה 1.4.4), ולכן לפי משפט 1.6.4 $f^{-1}(F)$ סגורה ב-$X$. לכל $a\in A$, $f(a)\in f(A)\subseteq F$, ולכן
          $A\subseteq f^{-1}(F)$. מכאן $\overline A\subseteq f^{-1}(F)$, כלומר $f(\overline A)\subseteq F$.
      - kind: step
        text: >-
          (ב) $f=\arctan$ ו-$A=\mathbb{R}$, שסגורה, ולכן $\overline A=\mathbb{R}$ ו-$f(\overline A)=(-\frac\pi2,\frac\pi2)$.
          אבל $\overline{f(A)}=[-\frac\pi2,\frac\pi2]$: הנקודה $\frac\pi2$ בסגור (כל קטע סביבה מכיל $\arctan n$ ל-$n$
          גדול), ואינה בתמונה. ההכלה ממש.
      - kind: step
        text: >-
          (ג) לפי משפט 1.6.4 ((ג) גורר (א)), מספיק להראות שלכל $F$ סגורה ב-$Y$ הקבוצה $A=f^{-1}(F)$ סגורה. לפי ההנחה
          $f(\overline A)\subseteq\overline{f(A)}$, ו-$f(A)\subseteq F$ עם $F$ סגורה, ולכן $\overline{f(A)}\subseteq F$. כלומר
          $f(\overline A)\subseteq F$, ו-$\overline A\subseteq f^{-1}(F)=A$. תמיד $A\subseteq\overline A$, ולכן $A=\overline A$
          סגורה.
      - kind: check
        text: >-
          ב-(ב), $\arctan$ היא הומיאומורפיזם מ-$\mathbb{R}$ על $(-\frac\pi2,\frac\pi2)$; הבעיה היא שהתמונה אינה סגורה בישר.
          אותה תופעה כמו ב-W-1.6-07: תמונה של סגורה אינה בהכרח סגורה.
      - kind: result
        text: >-
          $f$ רציפה אם ורק אם $f(\overline A)\subseteq\overline{f(A)}$ לכל $A$; ההכלה יכולה להיות ממש ($\arctan$ על $\mathbb{R}$).
