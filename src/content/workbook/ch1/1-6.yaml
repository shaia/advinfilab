# Workbook of lesson 1.6 — continuity between metric spaces.
# Objectives (src/course.ts):
#   OBJ-1.6-1  continuity at a point by ε-δ and by sequences, and their equivalence
#   OBJ-1.6-2  continuous ⇔ preimages of open sets are open; use it to show sets open or closed
#   OBJ-1.6-3  Lipschitz, uniformly continuous (רציפה במידה שווה), homeomorphism: definitions and examples
# Rebuilt 2026-11-10 on the formal spine (numbered results 1.6.1–1.6.11). Numbers recomputed with
# src/math/multivar.ts (simpson) and a scratch script; every value a solution states is exact (areas of triangles,
# closed-form values), the commands only confirmed them.
lesson: '1.6'
practice:
  - id: W-1.6-01
    level: basic
    objectives: [OBJ-1.6-1, OBJ-1.6-3]
    prompt: >-
      $m:(\mathbb{R}^2,d_\infty)\to\mathbb{R}$, $m(x,y)=\max(x,y)$.

      (א) הוכיחו ש-$|m(u)-m(v)|\le d_\infty(u,v)$ לכל $u,v\in\mathbb{R}^2$, וש-1 הוא הקבוע הקטן ביותר.

      (ב) הסיקו ש-$m$ רציפה במידה שווה, ותנו $\delta$ כנוסחה ב-$\varepsilon$.
    answer: >-
      (א) $m$ ליפשיצית עם קבוע 1, ושוויון ב-$u=(1,0)$, $v=(0,0)$. (ב) לפי טענה 1.6.9, $\delta=\varepsilon$ בכל נקודה.
    solution:
      - kind: idea
        text: >-
          אם כל קואורדינטה זזה לכל היותר $t$, גם המקסימום זז לכל היותר $t$. מוכיחים אי-שוויון חד-צדדי ומחליפים
          תפקידים.
      - kind: step
        text: >-
          (א) נסמן $u=(x,y)$, $v=(x',y')$ ו-$t=d_\infty(u,v)=\max(|x-x'|,|y-y'|)$. אז $x\le x'+t\le m(v)+t$ ובאותו נימוק
          עם הקואורדינטה השנייה $y\le y'+t\le m(v)+t$. לכן $m(u)=\max(x,y)\le m(v)+t$.
      - kind: step
        text: >-
          אותו טיעון עם $u$ ו-$v$ מוחלפים נותן $m(v)\le m(u)+t$. ביחד $|m(u)-m(v)|\le t=d_\infty(u,v)$: לפי הגדרה 1.6.8
          (א), $m$ ליפשיצית עם קבוע 1.
      - kind: step
        text: >-
          הקבוע הדוק: עם $u=(1,0)$ ו-$v=(0,0)$, $|m(u)-m(v)|=1=d_\infty(u,v)$, ולכן כל $L<1$ נכשל.
      - kind: theorem
        text: >-
          טענה 1.6.9: ליפשיצית עם קבוע $L>0$ גוררת רציפה במידה שווה, עם $\delta=\frac\varepsilon L$.
      - kind: step
        text: >-
          (ב) יהי $\varepsilon>0$ ונבחר $\delta=\varepsilon$. אם $d_\infty(u,v)<\delta$ אז $|m(u)-m(v)|\le d_\infty(u,v)<\varepsilon$,
          לכל $u,v$ יחד.
      - kind: check
        text: >-
          $u=(3,1)$, $v=(2.5,\ 1.2)$: $d_\infty=0.5$, ו-$|m(u)-m(v)|=|3-2.5|=0.5$, שוויון גם כאן.
      - kind: result
        text: >-
          $m$ ליפשיצית עם קבוע 1 (המיטבי) ביחס ל-$d_\infty$, ולכן רציפה במידה שווה עם $\delta=\varepsilon$.

  - id: W-1.6-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.6-2]
    prompt: >-
      לכל אחת מהקבוצות הבאות ב-$\mathbb{R}$ קבעו אם היא פתוחה ואם היא סגורה, והוכיחו. בכל סעיף מסקנה 1.6.7 נותנת
      חלק אחד של התשובה; את החלק השני (שהקבוצה **אינה** סגורה, או **אינה** פתוחה) הוכיחו ישירות מההגדרות.

      (א) $\{x: x^3-x>0\}$

      (ב) $\{x: \cos x\ge0\}$

      (ג) $\{x: x^2=2\}$
    answer: >-
      (א) פתוחה ואינה סגורה. (ב) סגורה ואינה פתוחה. (ג) סגורה ואינה פתוחה. המסקנה נותנת רק כיוון אחד: את התשובה
      ההפוכה בודקים ישירות.
    solution:
      - kind: theorem
        text: >-
          מסקנה 1.6.7 (א): אם $h:X\to\mathbb{R}$ רציפה ו-$c\in\mathbb{R}$, אז $\{h>c\}$ פתוחה, ו-$\{h\ge c\}$, $\{h=c\}$ סגורות.
      - kind: step
        text: >-
          (א) $h(x)=x^3-x$ פולינום, ולכן רציפה (טענה 1.6.5 (ג) עם $n=1$). הקבוצה היא $\{h>0\}$: פתוחה.
      - kind: step
        text: >-
          (ב) $\cos$ רציפה (אינפי 1, וזו אותה הגדרה כמו הגדרה 1.6.1 עם $|\cdot|$). הקבוצה היא $\{\cos\ge0\}$: סגורה.
      - kind: step
        text: >-
          (ג) $h(x)=x^2$ רציפה, והקבוצה היא $\{h=2\}$: סגורה. (היא $\{-\sqrt2,\sqrt2\}$.)
      - kind: step
        text: >-
          (א) אינה סגורה. הקבוצה היא $(-1,0)\cup(1,\infty)$, כי $x^3-x=x(x-1)(x+1)$. היא אינה
          סגורה: $1$ אינו בה, וכל קטע $(1-r,1+r)$ פוגש אותה (בנקודה $1+\frac r2$), כלומר $1\in\overline A\setminus A$ (הגדרה
          1.4.3, טענה 1.4.4).
      - kind: step
        text: >-
          (ב) אינה פתוחה: $\frac\pi2$ בקבוצה, כי $\cos\frac\pi2=0\ge0$. לכל $r>0$ נסמן $s=\min(r,\pi)$; הנקודה
          $\frac\pi2+\frac s2$ נמצאת ב-$B(\frac\pi2,r)$ ובקטע $(\frac\pi2,\frac{3\pi}2)$, שבו $\cos<0$ (אינפי 1), ולכן אינה
          בקבוצה. אין כדור סביב $\frac\pi2$ בתוך הקבוצה (הגדרה 1.3.2).
      - kind: step
        text: >-
          (ג) אינה פתוחה: $\sqrt2$ בקבוצה, ולכל $r>0$ הנקודה $\sqrt2+\frac r2\in B(\sqrt2,r)$ מקיימת
          $\big(\sqrt2+\frac r2\big)^2>2$, ולכן אינה בקבוצה.
      - kind: result
        text: >-
          (א) פתוחה ואינה סגורה; (ב) סגורה ואינה פתוחה; (ג) סגורה ואינה פתוחה.

  - id: W-1.6-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.6-3]
    prompt: >-
      אילו מההעתקות הבאות הן הומיאומורפיזם (הגדרה 1.6.8 (ג), עם המרחק הרגיל בשני הצדדים)? נמקו.

      (א) $f:\mathbb{R}\to\mathbb{R}$, $f(x)=2x+1$.

      (ב) $f:\mathbb{R}\to\mathbb{R}$, $f(x)=x^3$.

      (ג) $f:[0,\infty)\to[0,\infty)$, $f(x)=x^2$.

      (ד) $f:\mathbb{R}\to[0,\infty)$, $f(x)=x^2$.
    answer: >-
      (א), (ב), (ג) כן; (ד) לא, כי $f(1)=f(-1)$.
    solution:
      - kind: definition
        text: >-
          הגדרה 1.6.8 (ג): הומיאומורפיזם הוא העתקה חד-חד-ערכית ועל, רציפה, שגם ההפכית שלה רציפה.
      - kind: step
        text: >-
          (א) ההפכית $g(y)=\frac{y-1}2$. שתיהן ליפשיציות (עם קבועים $2$ ו-$\frac12$), ולכן רציפות לפי טענה 1.6.9.
      - kind: step
        text: >-
          (ב) $x^3$ רציפה (טענה 1.6.5 (ג)), עולה ממש ועל $\mathbb{R}$ (ערך הביניים, אינפי 1), וההפכית $\sqrt[3]{y}$ רציפה
          (אינפי 1).
      - kind: step
        text: >-
          (ג) על $[0,\infty)$ הפונקציה $x^2$ עולה ממש ועל $[0,\infty)$, וההפכית $\sqrt y$ רציפה (אינפי 1).
      - kind: step
        text: >-
          (ד) $f(1)=f(-1)=1$, ולכן $f$ אינה חד-חד-ערכית ואין לה הפכית. הנוסחה זהה ל-(ג); מה שהשתנה הוא התחום.
      - kind: check
        text: >-
          ב-(ב), $x^3$ אינה ליפשיצית על $\mathbb{R}$ (עם $x=n+1$, $y=n$ היחס $3n^2+3n+1$ אינו חסום), וההפכית אינה ליפשיצית
          ליד 0, ובכל זאת שתיהן רציפות. הגדרה 1.6.8 (ג) מבקשת רק רציפות.
      - kind: result
        text: >-
          (א), (ב), (ג) הומיאומורפיזמים; (ד) לא.

  - id: W-1.6-04
    level: exam
    qualitative: true
    objectives: [OBJ-1.6-1]
    prompt: >-
      במישור עם $d_2$, נגדיר $f(x,y)=\frac{x^2y}{x^2+y^2}$ ו-$g(x,y)=\frac{x^2}{x^2+y^2}$ מחוץ לראשית, ו-$f(0,0)=g(0,0)=0$.

      (א) הוכיחו מהגדרה 1.6.1 ש-$f$ רציפה ב-$(0,0)$.

      (ב) הוכיחו ש-$g$ אינה רציפה ב-$(0,0)$.

      (ג) נכון או לא: אם $h:\mathbb{R}^2\to\mathbb{R}$ מקיימת $h(p_n)\to h(0,0)$ לכל ישר $\ell$ דרך הראשית ולכל סדרה
      $p_n\to(0,0)$ שכל איבריה על $\ell$, אז $h$ רציפה ב-$(0,0)$.
    answer: >-
      (א) $|f(x,y)|\le|y|\le d_2$, ולכן $\delta=\varepsilon$. (ב) $g(\tfrac1n,0)=1\not\to0$. (ג) לא נכון:
      $h(x,y)=\frac{x^2y}{x^4+y^2}$, $h(0,0)=0$, שואפת ל-0 על כל ישר ושווה $\frac12$ על הפרבולה $y=x^2$.
    solution:
      - kind: idea
        text: >-
          (א) המנה $\frac{x^2}{x^2+y^2}$ נמצאת בין 0 ל-1, ולכן $|f|$ קטן מ-$|y|$. (ב) לאורך ציר ה-$x$ הערך של $g$ קבוע 1,
          ולא 0; לפי משפט 1.6.3 סדרה אחת כזו מספיקה.
      - kind: step
        text: >-
          (א) ל-$(x,y)\ne(0,0)$: $0\le\frac{x^2}{x^2+y^2}\le1$, ולכן $|f(x,y)|\le|y|\le\sqrt{x^2+y^2}=d_2\big((x,y),0\big)$;
          ב-$(0,0)$ עצמה ההפרש 0. יהי $\varepsilon>0$ ונבחר $\delta=\varepsilon$. אם $d_2((x,y),0)<\delta$ אז
          $|f(x,y)-f(0,0)|<\varepsilon$, וזו הגדרה 1.6.1.
      - kind: step
        text: >-
          (ב) $p_n=(\tfrac1n,0)\to(0,0)$, כי כל קואורדינטה שואפת ל-0 (משפט 1.5.9). $g(p_n)=\frac{1/n^2}{1/n^2}=1$ לכל $n$,
          ולכן $g(p_n)\to1\ne0=g(0,0)$. לפי משפט 1.6.3, $g$ אינה רציפה ב-$(0,0)$.
      - kind: step
        text: >-
          (ג) **לא נכון.** תהי $h(x,y)=\frac{x^2y}{x^4+y^2}$ מחוץ לראשית (שם $x^4+y^2>0$) ו-$h(0,0)=0$. ישר דרך הראשית
          הוא ציר ה-$y$, $\{(0,t)\}$, או $\{(t,mt): t\in\mathbb{R}\}$ עבור $m\in\mathbb{R}$. על ציר ה-$y$, $h(0,t)=0$. על
          $\{(t,mt)\}$, ל-$t\ne0$:
          $$h(t,mt)=\frac{mt^3}{t^4+m^2t^2}=\frac{mt}{t^2+m^2},$$
          שהוא 0 אם $m=0$, ואם $m\ne0$ מקיים $|h(t,mt)|\le\frac{|m|\,|t|}{m^2}=\frac{|t|}{|m|}$.
      - kind: step
        text: >-
          לכן אם $p_n=(t_n,mt_n)\to(0,0)$, אז $|t_n|\le d_2(p_n,0)\to0$ ו-$|h(p_n)|\le\frac{|t_n|}{|m|}\to0$ (או $h(p_n)=0$);
          ועל ציר ה-$y$ $h(p_n)=0$. ההנחה של (ג) מתקיימת. אבל $q_n=(\tfrac1n,\tfrac1{n^2})\to(0,0)$ (משפט 1.5.9), ו-
          $$h(q_n)=\frac{\frac1{n^2}\cdot\frac1{n^2}}{\frac1{n^4}+\frac1{n^4}}=\frac12\not\to0 .$$
          לפי משפט 1.6.3, $h$ אינה רציפה ב-$(0,0)$.
      - kind: check
        text: >-
          חישוב: $h(0.1,\ 0.1)\approx0.0990$, $h(0.01,\ 0.01)\approx0.0100$, ו-$h(0.1,\ 0.01)=h(0.01,\ 0.0001)=0.5$. על כל ישר
          הערכים יורדים ל-0, ועל הפרבולה $y=x^2$ הם קבועים $\frac12$. משפט 1.6.3 דורש **כל** סדרה; סדרה אחת שנכשלת מוכיחה
          אי-רציפות, וגם משפחה אינסופית של סדרות טובות (כל הישרים) אינה מוכיחה רציפות.
      - kind: result
        text: >-
          $f$ רציפה ב-$(0,0)$; $g$ אינה רציפה שם; (ג) לא נכון ($\frac{x^2y}{x^4+y^2}$).

  - id: W-1.6-05
    level: mid
    objectives: [OBJ-1.6-2, OBJ-1.6-1]
    prompt: >-
      (א) תהי $f:X\to Y$ רציפה בין מרחבים מטריים, ותהי $F\subseteq Y$ סגורה. הוכיחו **בעזרת סדרות**, בלי משפט 1.6.4,
      ש-$f^{-1}(F)$ סגורה ב-$X$.

      (ב) תהי $P$ קבוצת הפונקציות $f\in C[0,1]$ שמקיימות $f(x)\ge0$ לכל $x\in[0,1]$. הוכיחו ש-$P$ סגורה
      ב-$(C[0,1],d_\infty)$.

      (ג) האם $P$ פתוחה ב-$(C[0,1],d_\infty)$?
    answer: >-
      (א) אם $x_n\in f^{-1}(F)$ ו-$x_n\to x$, אז $f(x_n)\to f(x)$ ו-$f(x_n)\in F$, ולכן $f(x)\in F$. (ב)
      $P=\bigcap_{x\in[0,1]}\{\operatorname{ev}_x\ge0\}$, חיתוך של סגורות. (ג) לא.
    solution:
      - kind: theorem
        text: >-
          מסקנה 1.5.8: קבוצה $A$ במרחב מטרי סגורה אם ורק אם הגבול של כל סדרה מתכנסת של נקודות מ-$A$ נמצא ב-$A$. משפט 1.6.3:
          $f$ רציפה ב-$x$ אם ורק אם $x_n\to x$ גורר $f(x_n)\to f(x)$.
      - kind: step
        text: >-
          (א) תהי $(x_n)$ סדרה ב-$f^{-1}(F)$ שמתכנסת ל-$x\in X$. כלומר $f(x_n)\in F$ לכל $n$. $f$ רציפה ב-$x$, ולפי משפט 1.6.3
          $f(x_n)\to f(x)$. זו סדרה ב-$F$ שמתכנסת ל-$f(x)$, ו-$F$ סגורה, ולכן לפי מסקנה 1.5.8 $f(x)\in F$, כלומר
          $x\in f^{-1}(F)$. שוב לפי מסקנה 1.5.8, $f^{-1}(F)$ סגורה.
      - kind: step
        text: >-
          (ב) לכל $x\in[0,1]$ ההעתקה $\operatorname{ev}_x(f)=f(x)$ ליפשיצית עם קבוע 1 ב-$d_\infty$ (טענה 1.6.11 (א)), ולכן
          רציפה (טענה 1.6.9). לפי מסקנה 1.6.7, $P_x=\{f:\ f(x)\ge0\}$ סגורה.
      - kind: step
        text: >-
          $f\in P$ אם ורק אם $f\in P_x$ לכל $x$, כלומר $P=\bigcap_{x\in[0,1]}P_x$: חיתוך של משפחה (אינסופית) של קבוצות סגורות.
          לפי מסקנה 1.3.8 חיתוך כלשהו של סגורות סגור, ולכן $P$ סגורה.
      - kind: step
        text: >-
          (ג) **לא.** פונקציית האפס $\theta$ ב-$P$. לכל $r>0$ הפונקציה הקבועה $-\frac r2$ מקיימת
          $d_\infty\big(-\frac r2,\theta\big)=\frac r2<r$, ואינה ב-$P$. לכן אין כדור סביב $\theta$ בתוך $P$ (הגדרה 1.3.2).
      - kind: check
        text: >-
          כאן היה צורך בחיתוך **אינסופי**, קבוצה לכל $x\in[0,1]$, ורק לסגורות מותר לחתוך כמה שרוצים (משפט 1.3.7 מתיר
          לפתוחות רק חיתוך סופי). השוו לקבוצה $U$ של הפונקציות החיוביות ממש (טענה 1.3.14): היא פתוחה ב-$d_\infty$, אבל
          החיתוך האינסופי של הקבוצות הפתוחות $\{f: f(x)>0\}$ לא היה מוכיח זאת, וצריך היה את המינימום של $f$.
      - kind: result
        text: >-
          (א) מקור של סגורה תחת רציפה סגור, דרך סדרות. (ב) $P$ סגורה ב-$d_\infty$. (ג) $P$ אינה פתוחה.

  - id: W-1.6-06
    level: mid
    objectives: [OBJ-1.6-3]
    prompt: >-
      $f(x)=\sin(x^2)$ על $\mathbb{R}$.

      (א) הוכיחו שלכל $R>0$, $f$ ליפשיצית על $[-R,R]$ עם קבוע $2R$.

      (ב) האם $f$ רציפה במידה שווה על $\mathbb{R}$? הוכיחו.
    answer: >-
      (א) $|f'(x)|=|2x\cos(x^2)|\le2R$, ומשפט הערך הממוצע. (ב) לא: $x_n=\sqrt{n\pi}$, $y_n=\sqrt{n\pi+\frac\pi2}$:
      $y_n-x_n\to0$ ו-$|f(y_n)-f(x_n)|=1$.
    solution:
      - kind: step
        text: >-
          (א) $f$ גזירה ו-$f'(x)=2x\cos(x^2)$, ולכן $|f'(x)|\le2|x|\le2R$ על $[-R,R]$. לפי משפט הערך הממוצע (אינפי 1), לכל
          $x,y\in[-R,R]$ יש $c$ ביניהם, ובפרט $c\in[-R,R]$, עם $f(x)-f(y)=f'(c)(x-y)$. לכן $|f(x)-f(y)|\le2R\,|x-y|$, וזו
          הגדרה 1.6.8 (א) עם $L=2R$.
      - kind: idea
        text: >-
          (ב) הגרף מתנדנד מהר יותר ויותר: המרחק בין אפס של $\sin(x^2)$ לבין הנקודה הסמוכה שבה הערך $\pm1$ שואף לאפס.
          לכן יש זוגות נקודות קרובות כרצוננו שערכיהן רחוקים 1 זה מזה, וזו שלילת הגדרה 1.6.8 (ב).
      - kind: step
        text: >-
          נגדיר $x_n=\sqrt{n\pi}$ ו-$y_n=\sqrt{n\pi+\frac\pi2}$. אז $f(x_n)=\sin(n\pi)=0$ ו-$f(y_n)=\sin\left(n\pi+\frac\pi2\right)=\pm1$,
          כלומר $|f(y_n)-f(x_n)|=1$. ובהכפלה בצמוד:

          $$y_n-x_n=\frac{y_n^2-x_n^2}{y_n+x_n}=\frac{\pi/2}{y_n+x_n}<\frac{\pi/2}{2\sqrt{n\pi}}=\frac14\sqrt{\frac\pi n}.$$
      - kind: step
        text: >-
          ניקח $\varepsilon=1$. לכל $\delta>0$ נבחר $n$ עם $\frac14\sqrt{\frac\pi n}<\delta$ (קיים לפי ארכימדס, כי זה שקול ל-$n>\frac{\pi}{16\delta^2}$).
          אז $|y_n-x_n|<\delta$, אבל $|f(y_n)-f(x_n)|=1$, שאינו קטן מ-$\varepsilon$. לכן אף $\delta$ אינו מתאים לכל
          הנקודות.
      - kind: check
        text: >-
          עם $n=100$: $y_n-x_n\approx0.04426$, והחסם $\frac14\sqrt{\pi/100}\approx0.04431$ גדול ממנו במעט. ב-(א) הקבוע $2R$
          גדל עם $R$, ובהתאם אין קבוע אחד לכל הישר: על קטע חסום הפונקציה ליפשיצית, ועל הישר כולו היא אפילו לא
          רציפה במידה שווה.
      - kind: result
        text: >-
          $\sin(x^2)$ ליפשיצית על כל קטע חסום, אבל אינה רציפה במידה שווה על $\mathbb{R}$, אף שהיא חסומה: חסימות של
          הפונקציה אינה מספיקה לרציפות במידה שווה.

  - id: W-1.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-2]
    prompt: >-
      תהי $\pi_1:\mathbb{R}^2\to\mathbb{R}$, $\pi_1(x,y)=x$ (ההטלה), ובמישור $d_2$.

      (א) הוכיחו ש-$\pi_1$ ליפשיצית עם קבוע 1, ובפרט רציפה.

      (ב) תהי $F=\{(x,y): xy=1\}$. הוכיחו ש-$F$ סגורה במישור.

      (ג) חשבו את $\pi_1(F)$. האם היא סגורה ב-$\mathbb{R}$? מה זה אומר על תמונות של קבוצות סגורות תחת פונקציות רציפות?
    answer: >-
      (א) $|x-x'|\le d_2$. (ב) $F=\{h=1\}$ עם $h(x,y)=xy$ רציפה. (ג) $\pi_1(F)=\mathbb{R}\setminus\{0\}$, לא סגורה:
      תמונה של סגורה תחת רציפה אינה בהכרח סגורה.
    solution:
      - kind: step
        text: >-
          (א) $|\pi_1(x,y)-\pi_1(x',y')|=|x-x'|\le\sqrt{(x-x')^2+(y-y')^2}$, וזו טענה 1.6.5 (ג) עם $p=2$, $i=1$. לפי טענה
          1.6.9 $\pi_1$ רציפה.
      - kind: step
        text: >-
          (ב) $h(x,y)=xy$ פולינום, ולכן רציפה (טענה 1.6.5 (ג)). לפי מסקנה 1.6.7, $F=\{h=1\}$ סגורה.
      - kind: step
        text: >-
          (ג) $(x,y)\in F$ אם ורק אם $x\ne0$ ו-$y=\frac1x$, ולכן $\pi_1(F)=\{x: x\ne0\}=\mathbb{R}\setminus\{0\}$. היא
          אינה סגורה: $0$ מחוצה לה, וכל קטע $(-r,r)$ פוגש אותה (בנקודה $\frac r2$), ולכן
          $0\in\overline{\pi_1(F)}\setminus\pi_1(F)$ (הגדרה 1.4.3, טענה 1.4.4).
      - kind: check
        text: >-
          משפט 1.6.4 מדבר על **מקורות**: המקור של סגורה תחת רציפה סגור. למשל $\pi_1^{-1}([0,1])=[0,1]\times\mathbb{R}$
          סגורה. על **תמונות** הוא לא אומר דבר, ו-$F$ מראה שתמונה של סגורה יכולה להיות לא סגורה (בשיעור ראינו את
          אותו דבר לפתוחות: $x^2$ שולחת את $(-1,1)$ ל-$[0,1)$).
      - kind: result
        text: >-
          $\pi_1$ רציפה ו-$F$ סגורה, אבל $\pi_1(F)=\mathbb{R}\setminus\{0\}$ אינה סגורה.

  - id: W-1.6-08
    level: exam
    objectives: [OBJ-1.6-2, OBJ-1.6-3]
    prompt: >-
      על $C[0,1]$ נגדיר $m(f)=\max_{x\in[0,1]}f(x)$, ונסמן ב-$\theta$ את פונקציית האפס.

      (א) הוכיחו ש-$|m(f)-m(g)|\le d_\infty(f,g)$ לכל $f,g\in C[0,1]$.

      (ב) הוכיחו ש-$m$ אינה רציפה ב-$\theta$ ביחס ל-$d_1(f,g)=\int_0^1|f-g|$.

      (ג) תהי $S=\{f\in C[0,1]: m(f)<1\}$. הוכיחו ש-$S$ פתוחה ב-$d_\infty$ ואינה פתוחה ב-$d_1$.
    answer: >-
      (א) $f\le g+d_\infty(f,g)$ בכל נקודה, ולכן $m(f)\le m(g)+d_\infty(f,g)$, ובהחלפת תפקידים. (ב) אוהלים $T_n$ מעל
      $\frac12$: $d_1(T_n,\theta)=\frac1n\to0$ ו-$m(T_n)=1$. (ג) $S=\{m<1\}$; ב-$d_1$ כל כדור סביב $\theta$ מכיל אוהל
      $T_n\notin S$.
    solution:
      - kind: given
        text: >-
          לכל $f\in C[0,1]$ המקסימום קיים לפי משפט ויירשטראס (אינפי 1), ולכן $m$ מוגדרת היטב.
      - kind: idea
        text: >-
          (א) מוכיחים אי-שוויון בכל נקודה ועוברים למקסימום, כמו באינפימום של טענה 1.6.6. (ב), (ג) $d_1$ מודדת שטח, והמקסימום
          רואה גובה: אוהל גבוה וצר הוא בעל שטח קטן ומקסימום 1, כמו בהוכחה של טענה 1.6.11 (ב).
      - kind: step
        text: >-
          (א) יהיו $f,g$ ו-$t=d_\infty(f,g)$. לכל $x\in[0,1]$: $f(x)\le g(x)+|f(x)-g(x)|\le m(g)+t$. לכן $m(g)+t$ הוא חסם מלעיל
          של $f$, ובפרט $m(f)\le m(g)+t$. אותו טיעון עם $f,g$ מוחלפים נותן $m(g)\le m(f)+t$, וביחד $|m(f)-m(g)|\le t$. לפי
          הגדרה 1.6.8 (א), $m$ ליפשיצית עם קבוע 1 ב-$d_\infty$.
      - kind: step
        text: >-
          (ב) לכל $n\ge2$ יהי $T_n(x)=\max\big(0,\ 1-n|x-\tfrac12|\big)$, האוהל של טענה 1.6.11 עם $x_0=\frac12$. כש-$n\ge2$
          המשולש כולו בתוך $[0,1]$, ולכן $d_1(T_n,\theta)=\int_0^1T_n=\frac12\cdot\frac2n\cdot1=\frac1n\to0$: $T_n\to\theta$ ב-$d_1$.
      - kind: step
        text: >-
          אבל $0\le T_n\le1$ ו-$T_n(\tfrac12)=1$, ולכן $m(T_n)=1$ לכל $n$, ואינו שואף ל-$m(\theta)=0$. לפי משפט 1.6.3, $m$ אינה
          רציפה ב-$\theta$ ביחס ל-$d_1$.
      - kind: step
        text: >-
          (ג) לפי (א) וטענה 1.6.9, $m$ רציפה ב-$d_\infty$, ו-$S=\{m<1\}$; לפי מסקנה 1.6.7, $S$ פתוחה ב-$d_\infty$.
      - kind: step
        text: >-
          $S$ אינה פתוחה ב-$d_1$: $\theta\in S$ כי $m(\theta)=0<1$. יהי $r>0$, ונבחר $n\ge2$ עם $\frac1n<r$ (ארכימדס). אז
          $d_1(T_n,\theta)=\frac1n<r$, כלומר $T_n\in B_{d_1}(\theta,r)$ (הכדור הפתוח ביחס ל-$d_1$), אבל $m(T_n)=1$, ולכן
          $T_n\notin S$. אף כדור של $d_1$ סביב $\theta$ אינו מוכל ב-$S$ (הגדרה 1.3.2).
      - kind: check
        text: >-
          חישוב מספרי: $\int_0^1T_{10}=0.1000$, ו-$m(T_{10})=1$. שימו לב ש-(ג) אינו נובע מ-(ב) לבד: המקור של קבוצה מסוימת
          יכול להיות פתוח גם כשהפונקציה אינה רציפה. לכן בחלק השני של (ג) מצאנו במפורש נקודות בכל כדור.
      - kind: result
        text: >-
          $m$ ליפשיצית עם קבוע 1 ב-$d_\infty$ ואינה רציפה ב-$\theta$ ב-$d_1$; $S=\{\max f<1\}$ פתוחה ב-$d_\infty$ ולא ב-$d_1$.

  - id: W-1.6-09
    level: mid
    qualitative: true
    objectives: [OBJ-1.6-3, OBJ-1.6-1]
    prompt: >-
      יהיו $f:X\to Y$ ו-$g:Y\to Z$ בין מרחבים מטריים.

      (א) הוכיחו שאם $f$ ליפשיצית עם קבוע $L_f$ ו-$g$ ליפשיצית עם קבוע $L_g$, אז $g\circ f$ ליפשיצית עם קבוע $L_gL_f$.

      (ב) הוכיחו שאם $f$ ו-$g$ רציפות במידה שווה, אז $g\circ f$ רציפה במידה שווה.

      (ג) הוכיחו: אם $g\circ f$ רציפה ו-$g$ **הומיאומורפיזם**, אז $f$ רציפה.

      (ד) נכון או לא: אם $g\circ f$ רציפה ו-$g$ רציפה, אז $f$ רציפה.
    answer: >-
      (א) $d_Z\le L_g\,d_Y\le L_gL_f\,d_X$. (ב) $\varepsilon\to\eta$ דרך $g$, ו-$\eta\to\delta$ דרך $f$. (ג)
      $f=g^{-1}\circ(g\circ f)$ וטענה 1.6.5 (א). (ד) לא: $g$ קבועה.
    solution:
      - kind: step
        text: >-
          (א) לכל $x,y\in X$: $d_Z\big(g(f(x)),g(f(y))\big)\le L_g\,d_Y\big(f(x),f(y)\big)\le L_gL_f\,d_X(x,y)$, פעמיים הגדרה
          1.6.8 (א).
      - kind: step
        text: >-
          (ב) יהי $\varepsilon>0$. לפי הגדרה 1.6.8 (ב) עבור $g$ יש $\eta>0$ כך שלכל $u,v\in Y$ עם $d_Y(u,v)<\eta$:
          $d_Z(g(u),g(v))<\varepsilon$. לפי אותה הגדרה עבור $f$, עם $\eta$ בתפקיד $\varepsilon$, יש $\delta>0$ כך שלכל
          $x,y\in X$ עם $d_X(x,y)<\delta$: $d_Y(f(x),f(y))<\eta$, ולכן $d_Z(g(f(x)),g(f(y)))<\varepsilon$. $\delta$ אינו
          תלוי בנקודות.
      - kind: step
        text: >-
          (ג) $g$ הומיאומורפיזם, ולכן $g^{-1}:Z\to Y$ קיימת ורציפה (הגדרה 1.6.8 (ג)). $f=g^{-1}\circ(g\circ f)$, הרכבה של שתי
          פונקציות רציפות, ולפי טענה 1.6.5 (א) רציפה.
      - kind: step
        text: >-
          (ד) **לא נכון.** תהי $f:\mathbb{R}\to\mathbb{R}$ פונקציית המדרגה ($f(x)=0$ ל-$x<0$, $f(x)=1$ ל-$x\ge0$), שאינה
          רציפה ב-0 (משפט 1.6.3 עם $x_n=-\frac1n$), ו-$g\equiv0$. אז $g\circ f\equiv0$ רציפה ו-$g$ רציפה, אבל $f$ לא.
      - kind: check
        text: >-
          ב-(ד) $g$ "מוחקת" את הקפיצה של $f$, ולכן מההרכבה אי אפשר לשחזר את $f$. ב-(ג) $g$ חד-חד-ערכית עם הפכית רציפה,
          ולכן אינה מוחקת דבר: ההנחה "הומיאומורפיזם" היא מה ש-(ד) מראה שחסר. ובדיקה של (א): $f(x)=2x$, $g(y)=3y$
          על $\mathbb{R}$ נותנות $g\circ f=6x$, עם קבוע $6=2\cdot3$ בדיוק.
      - kind: result
        text: >-
          (א) הרכבה של ליפשיציות ליפשיצית עם מכפלת הקבועים. (ב) הרכבה של רציפות במידה שווה רציפה במידה שווה. (ג) נכון.
          (ד) לא נכון.

  - id: W-1.6-10
    level: exam
    objectives: [OBJ-1.6-3, OBJ-1.6-1]
    prompt: >-
      תהי $f:X\to Y$ בין מרחבים מטריים.

      (א) הוכיחו: $f$ רציפה במידה שווה אם ורק אם לכל שתי סדרות $(x_n),(y_n)$ ב-$X$ עם $d_X(x_n,y_n)\to0$ מתקיים
      $d_Y\big(f(x_n),f(y_n)\big)\to0$.

      (ב) הסיקו ש-$f(x)=e^x$ אינה רציפה במידה שווה על $\mathbb{R}$.
    answer: >-
      (א) כיוון אחד מההגדרה עם $N$ שמתאים ל-$\delta$; הכיוון השני בשלילה, עם $\delta=\frac1n$ ובחירה בת מנייה. (ב)
      $x_n=n$, $y_n=n+\frac1n$: $e^{y_n}-e^{x_n}\ge\frac{e^n}n\ge1$.
    solution:
      - kind: idea
        text: >-
          אותו מבנה כמו משפט 1.6.3, עם זוגות נקודות במקום נקודה וסדרה: $\delta$ הופך ל-$N$ בכיוון אחד, ו-$\delta=\frac1n$
          מייצר זוגות "רעים" בכיוון השני.
      - kind: step
        text: >-
          (א) ($\Rightarrow$) יהי $\varepsilon>0$, ויהי $\delta>0$ מהגדרה 1.6.8 (ב). כיוון ש-$d_X(x_n,y_n)\to0$, יש $N$ כך
          שלכל $n>N$, $d_X(x_n,y_n)<\delta$, ולכן $d_Y(f(x_n),f(y_n))<\varepsilon$. זו בדיוק ההתכנסות לאפס.
      - kind: step
        text: >-
          ($\Leftarrow$) בשלילה: נניח ש-$f$ אינה רציפה במידה שווה. לפי שלילת הגדרה 1.6.8 (ב) יש $\varepsilon>0$ כך שלכל
          $\delta>0$ יש $x,y\in X$ עם $d_X(x,y)<\delta$ ו-$d_Y(f(x),f(y))\ge\varepsilon$. לכל $n$, עם $\delta=\frac1n$, קבוצת
          הזוגות האלה אינה ריקה, ולפי אקסיומת הבחירה הבת מנייה בוחרים לכל $n$ זוג $(x_n,y_n)$ ממנה.
      - kind: step
        text: >-
          אז $d_X(x_n,y_n)<\frac1n\to0$, אבל $d_Y(f(x_n),f(y_n))\ge\varepsilon$ לכל $n$, ולכן אינו שואף ל-0. זו סתירה להנחה.
      - kind: computation
        text: >-
          (ב) $x_n=n$, $y_n=n+\frac1n$: $|x_n-y_n|=\frac1n\to0$. לפי $e^t\ge1+t$ (אינפי 1),
          $e^{y_n}-e^{x_n}=e^n\big(e^{1/n}-1\big)\ge\frac{e^n}n$, ו-$e^n\ge1+n>n$, ולכן ההפרש גדול מ-1 לכל $n$ ואינו
          שואף ל-0. לפי (א), $e^x$ אינה רציפה במידה שווה.
      - kind: check
        text: >-
          עם $n=5$: $e^{5.2}-e^5\approx32.86$, ו-$\frac{e^5}5\approx29.68$. הנקודות קרובות ($0.2$), והערכים רחוקים: הגרף
          תלול כרצוננו ככל שמתקדמים ימינה. ובאיזה שלב בחרנו סדרה מתוך "לכל $n$ יש"? רק בכיוון $\Leftarrow$ של (א).
      - kind: result
        text: >-
          (א) רציפות במידה שווה שקולה לתנאי על זוגות סדרות. (ב) $e^x$ אינה רציפה במידה שווה על $\mathbb{R}$.

challenge:
  - id: W-1.6-c1
    stars: 1
    objectives: [OBJ-1.6-2, OBJ-1.6-3]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי, ויהיו $A,E\subseteq X$ קבוצות סגורות, לא ריקות וזרות. נגדיר

      $$f(z)=\frac{\operatorname{dist}(z,A)}{\operatorname{dist}(z,A)+\operatorname{dist}(z,E)}\qquad(z\in X).$$

      (א) הוכיחו שהמכנה אינו מתאפס, ש-$f:X\to\mathbb{R}$ רציפה וערכיה ב-$[0,1]$, ש-$f(z)=0$ בדיוק כש-$z\in A$, ו-$f(z)=1$
      בדיוק כש-$z\in E$.

      (ב) הסיקו שהקבוצות $V=\{z:f(z)<\frac12\}$ ו-$W=\{z:f(z)>\frac12\}$ פתוחות וזרות, עם $A\subseteq V$ ו-$E\subseteq W$.

      (ג) ב-$(\mathbb{R}^2,d_2)$ יהיו $A=\{(x,y): xy=1\}$ ו-$E=\{(x,y): y=0\}$. הוכיחו ש-$A$, $E$ סגורות, לא ריקות וזרות,
      ובכל זאת $\inf\{d_2(a,e): a\in A,\ e\in E\}=0$.

      (ד) עבור $A$, $E$ של (ג), הוכיחו ש-$f$ אינה רציפה במידה שווה, אף ש-$\operatorname{dist}(\cdot,A)$ ו-$\operatorname{dist}(\cdot,E)$
      ליפשיציות עם קבוע 1.
    answer: >-
      (א) מכנה 0 היה נותן $z\in\overline A\cap\overline E=A\cap E=\emptyset$; $f$ מנה של רציפות; $f=0$ אם ורק אם
      $\operatorname{dist}(z,A)=0$, אם ורק אם $z\in A$. (ב) מסקנה 1.6.7 (א). (ג) $a_n=(n,\frac1n)$, $e_n=(n,0)$:
      $d_2(a_n,e_n)=\frac1n$. (ד) $f(a_n)=0$, $f(e_n)=1$ ו-$d_2(a_n,e_n)\to0$.
    solution:
      - kind: given
        text: >-
          $A,E$ סגורות, לא ריקות וזרות. לפי טענה 1.6.6 (ג), $\operatorname{dist}(\cdot,A)$ ו-$\operatorname{dist}(\cdot,E)$
          מוגדרות (כי $A,E\ne\emptyset$), אי-שליליות וליפשיציות עם קבוע 1; לפי טענה 1.6.6 (ד) הן מתאפסות בדיוק על
          $\overline A$ ועל $\overline E$.
      - kind: idea
        text: >-
          $f$ היא "המשקל היחסי" של המרחק מ-$A$: 0 על $A$, 1 על $E$, וביניהם עוברת ברציפות. כל מה שצריך הוא שהמכנה אינו
          מתאפס, ובזה משתמשים בכך ש-$A$ ו-$E$ סגורות וזרות. אבל הרציפות אינה במידה שווה: אם $A$ ו-$E$ מתקרבות זו לזו
          בלי להיפגש, $f$ קופצת מ-0 ל-1 על מרחקים קטנים כרצוננו.
      - kind: step
        text: >-
          (א) נניח ש-$\operatorname{dist}(z,A)+\operatorname{dist}(z,E)=0$. שני המחוברים אי-שליליים, ולכן שניהם 0, ולפי טענה
          1.6.6 (ד) $z\in\overline A$ ו-$z\in\overline E$. $A$, $E$ סגורות, ולפי טענה 1.4.4 $\overline A=A$ ו-$\overline E=E$,
          ולכן $z\in A\cap E=\emptyset$, סתירה. המכנה אינו מתאפס.
      - kind: step
        text: >-
          המונה והמכנה רציפים (טענה 1.6.6 (ג) וטענה 1.6.5 (ב) לסכום), והמכנה אינו מתאפס, ולכן לפי טענה 1.6.5 (ב) $f$ רציפה.
          מכיוון ש-$0\le\operatorname{dist}(z,A)\le\operatorname{dist}(z,A)+\operatorname{dist}(z,E)$, $0\le f(z)\le1$.
      - kind: step
        text: >-
          $f(z)=0$ אם ורק אם $\operatorname{dist}(z,A)=0$, אם ורק אם $z\in\overline A=A$. ו-$f(z)=1$ אם ורק אם המונה שווה למכנה,
          כלומר $\operatorname{dist}(z,E)=0$, אם ורק אם $z\in\overline E=E$.
      - kind: step
        text: >-
          (ב) לפי מסקנה 1.6.7 (א), $V=\{f<\frac12\}$ ו-$W=\{f>\frac12\}$ פתוחות. הן זרות, כי אין $z$ עם $f(z)<\frac12$ וגם
          $f(z)>\frac12$. לפי (א), $f=0<\frac12$ על $A$ ו-$f=1>\frac12$ על $E$, ולכן $A\subseteq V$ ו-$E\subseteq W$.
      - kind: step
        text: >-
          (ג) $A=\{h=1\}$ עם $h(x,y)=xy$, ו-$E=\{\pi_2=0\}$; $h$ ו-$\pi_2$ פולינומים, רציפים לפי טענה 1.6.5 (ג), ולכן לפי
          מסקנה 1.6.7 (א) שתי הקבוצות סגורות. $(1,1)\in A$ ו-$(0,0)\in E$. הן זרות: אם $y=0$ אז $xy=0\ne1$.
      - kind: step
        text: >-
          לכל $n\in\mathbb{N}$, $a_n=(n,\frac1n)\in A$ ו-$e_n=(n,0)\in E$, ו-$d_2(a_n,e_n)=\frac1n$. $0$ הוא חסם מלרע של
          $\{d_2(a,e): a\in A,\ e\in E\}$, ולכל $r>0$ יש לפי ארכימדס $n$ עם $\frac1n<r$; לפי האפיון של האינפימום (אינפי 1)
          האינפימום הוא 0.
      - kind: step
        text: >-
          (ד) לפי (א), $f(a_n)=0$ ו-$f(e_n)=1$. ניקח $\varepsilon=1$ ויהי $\delta>0$. נבחר $n>\frac1\delta$; אז
          $d_2(a_n,e_n)=\frac1n<\delta$, אבל $|f(a_n)-f(e_n)|=1$, שאינו קטן מ-$\varepsilon$. לכן אף $\delta$ אינו מתאים לכל
          הנקודות: $f$ אינה רציפה במידה שווה (הגדרה 1.6.8 (ב)).
      - kind: check
        text: >-
          חישוב מספרי עבור (ג): $f(1,1)=0$ (נקודה של $A$), $f(0,0)=1$ (נקודה של $E$), ו-$f(0,1)\approx0.450$, כי
          $\operatorname{dist}((0,1),A)\approx0.818$ ו-$\operatorname{dist}((0,1),E)=1$. ב-(ד) המונה והמכנה ליפשיציים, ובכל זאת
          המנה אינה רציפה במידה שווה: המכנה, $\operatorname{dist}(z,A)+\operatorname{dist}(z,E)$, אינו חסום מלרע בקבוע חיובי
          (ב-$a_n$ הוא $\frac1n$ לכל היותר). זה ההבדל מטענה 1.6.5 (ב), שבה רציפות נשמרת במנה. ו-(א) מחזק את מסקנה 1.6.7 (ב):
          לא רק קבוצה סגורה אחת היא קבוצת אפסים, אלא שתי סגורות זרות הן $\{f=0\}$ ו-$\{f=1\}$ של אותה $f$.
      - kind: result
        text: >-
          $f$ רציפה, $0\le f\le1$, $\{f=0\}=A$ ו-$\{f=1\}=E$; לכן $V=\{f<\frac12\}$ ו-$W=\{f>\frac12\}$ הן קבוצות פתוחות זרות
          שמפרידות בין $A$ ל-$E$. שתי קבוצות סגורות זרות יכולות להיות במרחק 0 זו מזו ($xy=1$ וציר ה-$x$), ואז $f$ אינה
          רציפה במידה שווה.
