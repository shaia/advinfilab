# Workbook of lesson 1.3 — balls, open sets and closed sets.
# Objectives (src/course.ts):
#   OBJ-1.3-1  define open and closed balls and sets; prove an open ball is open
#   OBJ-1.3-2  arbitrary unions and finite intersections of open sets are open; an infinite intersection need not be
#   OBJ-1.3-3  decide open / closed / both / neither, in the discrete metric and in a subspace too
# Distances recomputed with src/math/metric.ts (dist).
lesson: '1.3'
practice:
  - id: W-1.3-01
    level: basic
    objectives: [OBJ-1.3-1]
    prompt: >-
      במישור עם המטריקה $d_\infty(x,y)=\max(|x_1-y_1|,\ |x_2-y_2|)$, תהי $c=(1,2)$.

      (א) תארו את $B(c,\tfrac12)$ ואת $B[c,\tfrac12]$ בעזרת תנאים על הקואורדינטות.

      (ב) האם הנקודה $(1.5,\ 2.2)$ שייכת ל-$B(c,\tfrac12)$? ול-$B[c,\tfrac12]$?

      (ג) והנקודה $(1.3,\ 1.6)$?
    answer: >-
      (א) $B(c,\tfrac12)=(0.5,\ 1.5)\times(1.5,\ 2.5)$ ו-$B[c,\tfrac12]=[0.5,\ 1.5]\times[1.5,\ 2.5]$.

      (ב) לא לכדור הפתוח, כן לכדור הסגור. (ג) לשניהם.
    solution:
      - kind: definition
        text: >-
          $B(c,r)=\{y: d_\infty(c,y)<r\}$ ו-$B[c,r]=\{y: d_\infty(c,y)\le r\}$. המקסימום של שני מספרים קטן מ-$r$ אם
          ורק אם **שניהם** קטנים מ-$r$.
      - kind: step
        text: >-
          (א) לכן $y\in B(c,\tfrac12)$ אם ורק אם $|y_1-1|<\tfrac12$ וגם $|y_2-2|<\tfrac12$, כלומר
          $0.5<y_1<1.5$ ו-$1.5<y_2<2.5$: ריבוע פתוח. בכדור הסגור אותם תנאים עם $\le$: הריבוע הסגור
          $[0.5,\ 1.5]\times[1.5,\ 2.5]$.
      - kind: computation
        text: >-
          (ב) $d_\infty\big((1,2),(1.5,\ 2.2)\big)=\max(0.5,\ 0.2)=0.5$. זה אינו קטן ממש מ-$\tfrac12$, ולכן
          הנקודה אינה בכדור הפתוח, אבל $0.5\le\tfrac12$, ולכן היא בכדור הסגור. היא על השפה של הריבוע.
      - kind: computation
        text: >-
          (ג) $d_\infty\big((1,2),(1.3,\ 1.6)\big)=\max(0.3,\ 0.4)=0.4<\tfrac12$, ולכן הנקודה בשני הכדורים.
      - kind: result
        text: >-
          (א) ריבוע פתוח וריבוע סגור שמרכזם $(1,2)$ וצלעם 1. (ב) רק בכדור הסגור. (ג) בשניהם.

  - id: W-1.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      $X=\{a,b,c\}$ עם המטריקה הבדידה.

      (א) מצאו את $B(a,\tfrac12)$, $B(a,1)$, $B[a,1]$ ו-$B(a,2)$.

      (ב) האם $\{a,b\}$ פתוחה? סגורה?
    answer: >-
      (א) $\{a\}$, $\{a\}$, $X$, $X$. (ב) גם פתוחה וגם סגורה.
    solution:
      - kind: definition
        text: >-
          במטריקה הבדידה $d(x,y)=1$ ל-$x\ne y$ ו-$d(x,x)=0$.
      - kind: computation
        text: >-
          (א) $B(a,\tfrac12)$: הנקודות במרחק קטן מ-$\tfrac12$ מ-$a$. רק $a$ עצמה, ולכן $\{a\}$. $B(a,1)$: מרחק קטן
          **ממש** מ-1. גם כאן רק $a$, כי $d(a,b)=d(a,c)=1$. $B[a,1]$: מרחק לכל היותר 1, כלומר כל הנקודות: $X$.
          $B(a,2)$: מרחק קטן מ-2, כל הנקודות: $X$.
      - kind: step
        text: >-
          (ב) $\{a,b\}$ פתוחה: סביב $a$ הכדור $B(a,\tfrac12)=\{a\}$ מוכל בה, וסביב $b$ הכדור $\{b\}$. המשלים $\{c\}$
          פתוח מאותה סיבה, ולכן $\{a,b\}$ גם סגורה.
      - kind: check
        text: >-
          המלכודת היא $B(a,1)$: מי שכותב $X$ שכח שהכדור הפתוח דורש אי-שוויון ממש.
      - kind: result
        text: >-
          (א) $\{a\},\ \{a\},\ X,\ X$. (ב) שתיהן; במטריקה הבדידה כל קבוצה פתוחה וסגורה.

  - id: W-1.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      ב-$\mathbb{R}$ עם המטריקה $|x-y|$, קבעו לכל קבוצה אם היא פתוחה, סגורה, שתיהן או אף אחת.

      (א) $[2,\infty)$

      (ב) $(-\infty,0)\cup(0,1)$

      (ג) $\{1,2,3\}$
    answer: >-
      (א) סגורה ולא פתוחה. (ב) פתוחה ולא סגורה. (ג) סגורה ולא פתוחה.
    solution:
      - kind: idea
        text: >-
          לכל קבוצה בודקים שתי שאלות נפרדות: האם לכל נקודה שלה יש קטע בתוכה, והאם לכל נקודה מחוצה לה יש קטע מחוצה לה.
      - kind: step
        text: >-
          (א) המשלים $(-\infty,2)$ פתוח (לנקודה $x<2$ מתאים $r=2-x$), ולכן $[2,\infty)$ סגורה. היא לא פתוחה: כל קטע
          סביב $2$ מכיל מספרים קטנים מ-2.
      - kind: step
        text: >-
          (ב) איחוד של שני קטעים פתוחים, ולכן פתוחה. היא לא סגורה: $0$ במשלים, וכל קטע $(-r,r)$ מכיל מספרים שליליים,
          שנמצאים בקבוצה. (גם $1$ במשלים ומפריע באותו אופן.)
      - kind: step
        text: >-
          (ג) כל קבוצה של נקודה אחת, $\{k\}$, סגורה, כי המשלים שלה הוא איחוד של שני קטעים פתוחים. איחוד **סופי** של
          סגורות סגור. הקבוצה לא פתוחה: הקטע $(1-r,\ 1+r)$ מכיל מספרים שאינם שלמים.
      - kind: result
        text: >-
          (א) סגורה ולא פתוחה; (ב) פתוחה ולא סגורה; (ג) סגורה ולא פתוחה.

  - id: W-1.3-04
    level: mid
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      במישור עם המטריקה האוקלידית $d_2$, יהי $H=\{(x,y): y>0\}$ חצי המישור העליון הפתוח, ו-$K=\{(x,y): y\ge0\}$.

      (א) הוכיחו ש-$H$ פתוחה.

      (ב) הוכיחו ש-$K$ סגורה, ושאינה פתוחה.
    answer: >-
      (א) לנקודה $(a,b)$ עם $b>0$ מתאים הרדיוס $b$. (ב) המשלים $\{y<0\}$ פתוח מאותה סיבה; סביב $(0,0)$ אין כדור
      בתוך $K$.
    solution:
      - kind: idea
        text: >-
          הנקודה $(a,b)$ רחוקה מהציר $y=0$ בדיוק $b$. כדור ברדיוס הזה לא מגיע לציר. כדי להוכיח את זה משתמשים בכך
          שהפרש הקואורדינטות קטן מהמרחק האוקלידי או שווה לו.
      - kind: step
        text: >-
          (א) תהי $(a,b)\in H$, כלומר $b>0$. נבחר $r=b$. תהי $(x,y)\in B\big((a,b),b\big)$. אז
          $|y-b|\le\sqrt{(x-a)^2+(y-b)^2}<b$, ולכן $y>b-b=0$, כלומר $(x,y)\in H$.
      - kind: step
        text: >-
          (ב) המשלים של $K$ הוא $\{(x,y): y<0\}$. לנקודה $(a,b)$ עם $b<0$ מתאים הרדיוס $|b|$, באותו
          חישוב: $|y-b|<|b|$ נותן $y<b+|b|=0$. לכן המשלים פתוח, ו-$K$ סגורה.
      - kind: step
        text: >-
          $K$ אינה פתוחה: $(0,0)\in K$, ולכל $r>0$ הנקודה $(0,-\tfrac r2)$ נמצאת ב-$B\big((0,0),r\big)$
          ואינה ב-$K$.
      - kind: check
        text: >-
          דוגמה מספרית: הנקודה $(0.3,\ 0.4)$ ב-$H$, ו-$r=0.4$. הנקודות שמתחת למרכז, $(0.3,\ 0.4-t)$ עם $0\le t<0.4$,
          כולן מעל הציר. (לכדור הפתוח אין נקודה "נמוכה ביותר": הנקודה $(0.3,\ 0)$ שעל הציר כבר אינה בו.)
      - kind: result
        text: >-
          $H$ פתוחה; $K$ סגורה ואינה פתוחה.

  - id: W-1.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      נכון או לא נכון? הוכיחו או תנו דוגמה נגדית. בכל הסעיפים המרחב הוא $\mathbb{R}$ עם $|x-y|$.

      (א) אם $U\cup V$ פתוחה, אז $U$ ו-$V$ פתוחות.

      (ב) המשלים של קבוצה בת מנייה הוא קבוצה פתוחה.

      (ג) אם $U$ פתוחה ו-$F$ סגורה, אז $F\setminus U$ סגורה.
    answer: >-
      (א) לא נכון: $U=[0,1]$, $V=\mathbb{R}\setminus[0,1]$. (ב) לא נכון: $\mathbb{Q}$ בת מנייה, והמשלים שלה אינו
      פתוח. (ג) נכון: $F\setminus U=F\cap(\mathbb{R}\setminus U)$.
    solution:
      - kind: step
        text: >-
          (א) **לא נכון.** $U=[0,1]$ ו-$V=\mathbb{R}\setminus[0,1]=(-\infty,0)\cup(1,\infty)$. האיחוד הוא $\mathbb{R}$,
          שפתוח, אבל $U$ אינה פתוחה (סביב $0$ אין קטע בתוכה). המשפט אומר שאיחוד של פתוחות פתוח, לא שכל איחוד פתוח
          בא מפתוחות.
      - kind: step
        text: >-
          (ב) **לא נכון.** $\mathbb{Q}$ בת מנייה (שיעור 0.4), והמשלים שלה, $\mathbb{R}\setminus\mathbb{Q}$, אינו פתוח:
          סביב $\sqrt2$, שאינו רציונלי, כל קטע $(\sqrt2-r,\ \sqrt2+r)$ מכיל מספר רציונלי, כי הרציונליים צפופים בישר.
          (לקבוצה **סופית** הטענה דווקא נכונה: היא איחוד סופי של נקודות, וכל נקודה סגורה.)
      - kind: step
        text: >-
          (ג) **נכון.** $F\setminus U=F\cap(\mathbb{R}\setminus U)$. המשלים של קבוצה פתוחה סגור, וחיתוך של שתי קבוצות
          סגורות סגור (חיתוך של כל משפחה של סגורות סגור).
      - kind: check
        text: >-
          ב-(ג) דוגמה: $F=[0,3]$, $U=(1,2)$, ו-$F\setminus U=[0,1]\cup[2,3]$, סגורה כמו שצריך.
      - kind: result
        text: >-
          (א) לא נכון; (ב) לא נכון; (ג) נכון.

  - id: W-1.3-06
    level: mid
    objectives: [OBJ-1.3-2]
    prompt: >-
      חשבו את הקבוצות וקבעו אם הן פתוחות או סגורות ב-$\mathbb{R}$:

      (א) $\displaystyle A=\bigcap_{n=1}^{\infty}\left(1-\tfrac1n,\ 2+\tfrac1n\right)$

      (ב) $\displaystyle B=\bigcup_{n=2}^{\infty}\left[\tfrac1n,\ 1-\tfrac1n\right]$
    answer: >-
      (א) $A=[1,2]$, סגורה ולא פתוחה. (ב) $B=(0,1)$, פתוחה ולא סגורה.
    solution:
      - kind: idea
        text: >-
          כדי לחשב חיתוך או איחוד אינסופי מוכיחים הכלה בשני הכיוונים. המקרים האלה מראים שחיתוך אינסופי של פתוחות יכול
          להיות סגור, ואיחוד אינסופי של סגורות יכול להיות פתוח.
      - kind: step
        text: >-
          (א) $[1,2]\subseteq A$: אם $1\le x\le2$ אז לכל $n$ מתקיים $1-\tfrac1n<1\le x\le2<2+\tfrac1n$. בכיוון השני,
          אם $x<1$ אז יש $n$ עם $\tfrac1n<1-x$, כלומר $x<1-\tfrac1n$, ו-$x$ אינו בקטע ה-$n$. באותו אופן $x>2$ אינו
          בחיתוך. לכן $A=[1,2]$.
      - kind: step
        text: >-
          (ב) כל $\left[\tfrac1n,\ 1-\tfrac1n\right]$ מוכל ב-$(0,1)$, ולכן $B\subseteq(0,1)$. בכיוון השני, אם $0<x<1$
          נבחר $n\ge2$ עם $\tfrac1n\le\min(x,\ 1-x)$. אז $\tfrac1n\le x\le1-\tfrac1n$, ו-$x\in B$. לכן $B=(0,1)$.
      - kind: step
        text: >-
          $[1,2]=B[\tfrac32,\tfrac12]$ סגורה (כדור סגור, דוגמה 3 בשיעור) ולא פתוחה (סביב $1$ אין קטע בתוכה).
          $(0,1)=B(\tfrac12,\tfrac12)$ פתוחה (כדור פתוח) ולא סגורה ($0$ מחוצה לה, וכל קטע סביבו פוגש אותה).
      - kind: result
        text: >-
          $A=[1,2]$: חיתוך אינסופי של פתוחות שאינו פתוח. $B=(0,1)$: איחוד אינסופי של סגורות שאינו סגור.

  - id: W-1.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      (א) $Y=\mathbb{N}$ כתת-מרחב של $\mathbb{R}$. הוכיחו שכל תת-קבוצה של $Y$ פתוחה ב-$Y$.

      (ב) $Z=\{0\}\cup\{\tfrac1n: n\in\mathbb{N}\}$ כתת-מרחב של $\mathbb{R}$. האם $\{1\}$ פתוחה ב-$Z$? האם $\{0\}$
      פתוחה ב-$Z$?
    answer: >-
      (א) $B_Y(n,\tfrac12)=\{n\}$. (ב) $\{1\}$ פתוחה ב-$Z$; $\{0\}$ אינה פתוחה ב-$Z$.
    solution:
      - kind: definition
        text: >-
          בתת-מרחב $B_Y(y,r)=B_{\mathbb{R}}(y,r)\cap Y$, ו-$U\subseteq Y$ פתוחה ב-$Y$ אם לכל $y\in U$ יש $r>0$ עם
          $B_Y(y,r)\subseteq U$.
      - kind: step
        text: >-
          (א) לכל $n\in\mathbb{N}$: $B_Y(n,\tfrac12)=\left(n-\tfrac12,\ n+\tfrac12\right)\cap\mathbb{N}=\{n\}$. לכן לכל
          $A\subseteq\mathbb{N}$ ולכל $n\in A$ מתקיים $B_Y(n,\tfrac12)\subseteq A$: $A$ פתוחה ב-$Y$. ($\mathbb{N}$
          מתנהג כמו מרחב בדיד.)
      - kind: step
        text: >-
          (ב) $B_Z(1,\tfrac13)=\left(\tfrac23,\ \tfrac43\right)\cap Z=\{1\}$, כי $\tfrac12<\tfrac23$. לכן $\{1\}$ פתוחה
          ב-$Z$.
      - kind: step
        text: >-
          $\{0\}$ אינה פתוחה ב-$Z$: לכל $r>0$ יש $n$ עם $\tfrac1n<r$, ואז $\tfrac1n\in B_Z(0,r)$ אבל $\tfrac1n\notin\{0\}$.
      - kind: check
        text: >-
          ההבדל בין הנקודות: ל-$1$ יש "רווח" בתוך $Z$ (השכנה הקרובה, $\tfrac12$, רחוקה), ול-$0$ אין: נקודות של $Z$
          מצטברות אליה. בשיעור 1.4 תקראו לזה נקודה מבודדת מול נקודת הצטברות.
      - kind: result
        text: >-
          (א) כל תת-קבוצה של $\mathbb{N}$ פתוחה ב-$\mathbb{N}$. (ב) $\{1\}$ כן, $\{0\}$ לא.

  - id: W-1.3-08
    level: exam
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      ב-$C[0,1]$ עם מטריקת הסופרמום $d_\infty(f,g)=\max_{x\in[0,1]}|f(x)-g(x)|$, תהי
      $F=\{f\in C[0,1]:\ f(0)=0\}$.

      (א) הוכיחו ש-$F$ סגורה.

      (ב) הוכיחו ש-$F$ אינה פתוחה.
    answer: >-
      (א) אם $g(0)\ne0$, הכדור $B(g,|g(0)|)$ זר ל-$F$. (ב) סביב $f\equiv0$ כל כדור מכיל את הפונקציה הקבועה $\tfrac r2$.
    solution:
      - kind: goal
        text: >-
          (א) המשלים $\{g: g(0)\ne0\}$ פתוח: לכל $g$ כזו יש כדור סביבה שכל הפונקציות בו מקיימות $h(0)\ne0$.
      - kind: idea
        text: >-
          מטריקת הסופרמום שולטת בהפרש בכל נקודה, ובפרט בנקודה $0$: $|h(0)-g(0)|\le d_\infty(h,g)$. אם הכדור צר מ-$|g(0)|$,
          הערך $h(0)$ לא יכול להגיע לאפס.
      - kind: step
        text: >-
          תהי $g$ עם $g(0)\ne0$, ונבחר $r=|g(0)|>0$. אם $d_\infty(h,g)<r$ אז $|h(0)-g(0)|<|g(0)|$, ולכן
          $|h(0)|\ge|g(0)|-|h(0)-g(0)|>0$. כלומר $h(0)\ne0$ ו-$h\notin F$. לכן $B(g,r)\subseteq C[0,1]\setminus F$, והמשלים
          פתוח.
      - kind: step
        text: >-
          (ב) $f\equiv0$ שייכת ל-$F$. לכל $r>0$ הפונקציה הקבועה $h\equiv\tfrac r2$ רציפה, $d_\infty(f,h)=\tfrac r2<r$,
          ו-$h(0)=\tfrac r2\ne0$. לכן אין כדור סביב $f$ שמוכל ב-$F$.
      - kind: check
        text: >-
          השתמשנו רק בנקודה $0$. אותה הוכחה מראה שלכל $x_0\in[0,1]$ ולכל $c$ הקבוצה $\{f: f(x_0)=c\}$ סגורה ב-$d_\infty$.
      - kind: result
        text: >-
          $F$ סגורה ואינה פתוחה.

  - id: W-1.3-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      (א) הוכיחו שבכל מרחב מטרי, קבוצה סופית היא סגורה.

      (ב) הוכיחו שב-$\mathbb{R}$ עם $|x-y|$ אין קבוצה סופית ולא ריקה שהיא פתוחה.

      (ג) תנו מרחב מטרי שבו יש קבוצה סופית ולא ריקה שהיא פתוחה, והסבירו.
    answer: >-
      (א) כל נקודה סגורה, ואיחוד סופי של סגורות סגור. (ב) כל קטע מכיל אינסוף נקודות. (ג) מרחב בדיד, למשל $\{1\}$
      במטריקה הבדידה על $\mathbb{R}$.
    solution:
      - kind: idea
        text: >-
          (א) מספיק להוכיח שקבוצה של נקודה אחת סגורה, ואז להשתמש במשפט על איחוד סופי. נקודה אחת סגורה כי לכל נקודה אחרת
          יש מרחק חיובי ממנה.
      - kind: step
        text: >-
          (א) יהי $a\in X$, ותהי $z\ne a$. אז $t=d(a,z)>0$ (אקסיומת המטריקה: מרחק אפס רק לנקודה עצמה). הכדור $B(z,t)$
          אינו מכיל את $a$, כי $d(z,a)=t$ אינו קטן מ-$t$. לכן $X\setminus\{a\}$ פתוחה, ו-$\{a\}$ סגורה.
      - kind: step
        text: >-
          קבוצה סופית $\{a_1,\dots,a_n\}$ היא איחוד של $n$ קבוצות סגורות, ואיחוד **סופי** של סגורות סגור. (הקבוצה
          הריקה סגורה גם היא.)
      - kind: step
        text: >-
          (ב) תהי $A\subseteq\mathbb{R}$ סופית ולא ריקה, ו-$a\in A$. כל כדור $B(a,r)=(a-r,\ a+r)$ מכיל אינסוף מספרים,
          ולכן אינו מוכל ב-$A$, שיש בה מספר סופי של איברים. לכן $A$ אינה פתוחה.
      - kind: step
        text: >-
          (ג) $\mathbb{R}$ עם המטריקה הבדידה: $B(1,\tfrac12)=\{1\}$, ולכן $\{1\}$ פתוחה. (גם $\mathbb{N}$ כתת-מרחב
          של $\mathbb{R}$ מתאים, כמו בתרגיל 7.)
      - kind: check
        text: >-
          ב-(ב) השתמשנו בתכונה של $\mathbb{R}$ (בכל קטע אינסוף נקודות), ולכן הטענה תלויה במרחב, כמו שמראה (ג).
      - kind: result
        text: >-
          (א) בכל מרחב מטרי כל קבוצה סופית סגורה. (ב) ב-$\mathbb{R}$ קבוצה סופית לא ריקה אינה פתוחה. (ג) במרחב בדיד היא פתוחה.

  - id: W-1.3-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      במישור עם $d_2$ תהי $A=\{(x,0): x>0\}$, החלק החיובי של ציר ה-$x$.

      (א) האם $A$ פתוחה במישור? סגורה במישור?

      (ב) יהי $Y=\{(x,0): x\in\mathbb{R}\}$ ציר ה-$x$, כתת-מרחב. האם $A$ פתוחה ב-$Y$? סגורה ב-$Y$?
    answer: >-
      (א) אף אחת. (ב) פתוחה ב-$Y$ ואינה סגורה ב-$Y$.
    solution:
      - kind: step
        text: >-
          (א) **לא פתוחה:** $(1,0)\in A$, ולכל $r>0$ הנקודה $(1,\tfrac r2)$ ב-$B\big((1,0),r\big)$ ולא ב-$A$.
          **לא סגורה:** $(0,0)\notin A$, ולכל $r>0$ הנקודה $(\tfrac r2,0)\in A$ נמצאת ב-$B\big((0,0),r\big)$; לכן אין
          כדור סביב $(0,0)$ שזר ל-$A$, והמשלים אינו פתוח.
      - kind: step
        text: >-
          (ב) **פתוחה ב-$Y$:** $A=\{(x,y): x>0\}\cap Y$, וחצי המישור הימני $\{x>0\}$ פתוח במישור (לנקודה $(a,b)$ עם
          $a>0$ מתאים $r=a$, כמו בתרגיל 4). לפי המשפט על תת-מרחב, $A$ פתוחה ב-$Y$.
      - kind: step
        text: >-
          **לא סגורה ב-$Y$:** הנקודה $(0,0)$ שייכת ל-$Y$ ולא ל-$A$, ולכל $r>0$ הכדור $B_Y\big((0,0),r\big)$ מכיל את
          $(\tfrac r2,0)\in A$. לכן $Y\setminus A$ אינה פתוחה ב-$Y$.
      - kind: check
        text: >-
          השוו ל-(א): מה שהפריע לפתיחות במישור היו נקודות **מעל** הציר, והן אינן ב-$Y$. מה שהפריע לסגירות, $(0,0)$,
          נמצא ב-$Y$, ולכן מפריע גם שם.
      - kind: result
        text: >-
          (א) לא פתוחה ולא סגורה במישור. (ב) פתוחה ב-$Y$ ולא סגורה ב-$Y$.
challenge:
  - id: W-1.3-c1
    stars: 1
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      ב-$C[0,1]$ תהי $A=\{f\in C[0,1]:\ f(0)>0\}$: התנאי הוא על הערך של $f$ בנקודה אחת בלבד, ובשאר הקטע $f$ יכולה
      להיות גם שלילית.

      (א) הוכיחו ש-$A$ פתוחה במטריקת הסופרמום $d_\infty(f,g)=\max_{x\in[0,1]}|f(x)-g(x)|$.

      (ב) הוכיחו ש-$A$ אינה פתוחה במטריקת האינטגרל $d_1(f,g)=\int_0^1|f(x)-g(x)|\,dx$.

      (ג) האם $A$ פתוחה במטריקה הבדידה על $C[0,1]$?
    answer: >-
      (א) לכל $f\in A$: $B_\infty(f,f(0))\subseteq A$. (ב) סביב $f\equiv1$: $g_n(x)=\min(1,nx)\notin A$
      ו-$d_1(g_n,1)=\frac1{2n}$, ולכן אין כדור $B_1(1,r)$ בתוך $A$. (ג) כן: במטריקה הבדידה כל קבוצה פתוחה.
    solution:
      - kind: given
        text: >-
          $A=\{f\in C[0,1]:\ f(0)>0\}$, ושלוש מטריקות על $C[0,1]$: $d_\infty$, $d_1$ והבדידה.
      - kind: goal
        text: >-
          (א) לכל $f\in A$ יש $r>0$ עם $B_\infty(f,r)\subseteq A$. (ב) יש $f\in A$ כך שכל כדור $B_1(f,r)$ מכיל פונקציה
          שאינה ב-$A$. (ג) הכרעה.
      - kind: idea
        text: >-
          $d_\infty$ שולטת בהפרש בכל נקודה, ובפרט בנקודה $0$: הפרש סופרמום קטן משאיר את $g(0)$ חיובי. $d_1$ שולטת רק
          בשטח שבין הגרפים, ופונקציה יכולה לשנות את הערך שלה ב-$0$ הרבה ואת השטח רק מעט.
      - kind: step
        text: >-
          (א) תהי $f\in A$, ונבחר $r=f(0)>0$. אם $d_\infty(g,f)<r$, אז $|g(0)-f(0)|\le d_\infty(g,f)<r$, ולכן
          $g(0)>f(0)-r=0$, כלומר $g\in A$. לכן $B_\infty(f,r)\subseteq A$, ו-$A$ פתוחה.
      - kind: step
        text: >-
          (ב) ניקח $f\equiv1\in A$ ו-$r>0$ כלשהו. לכל $n\in\mathbb{N}$ נגדיר $g_n(x)=\min(1,nx)$: היא עולה לינארית
          מ-$0$ ל-$1$ על $[0,\tfrac1n]$ וקבועה $1$ אחר כך. $g_n$ רציפה ו-$g_n(0)=0$, ולכן $g_n\notin A$.
      - kind: computation
        text: >-
          $f-g_n=1-nx$ על $[0,\tfrac1n]$ ו-$0$ אחר כך, ולכן
          $d_1(g_n,f)=\int_0^{1/n}(1-nx)\,dx=\frac1n-n\cdot\frac{1}{2n^2}=\frac{1}{2n}$.
      - kind: step
        text: >-
          נבחר $n>\frac{1}{2r}$; אז $d_1(g_n,f)=\frac1{2n}<r$, כלומר $g_n\in B_1(f,r)$ אבל $g_n\notin A$. זה נכון לכל
          $r>0$, ולכן אין כדור $B_1(f,r)$ שמוכל ב-$A$, ו-$A$ אינה פתוחה ב-$d_1$.
      - kind: check
        text: >-
          אותו מספר בגאומטריה: השטח שבין הגרפים הוא משולש עם בסיס $\frac1n$ (על הציר) וגובה $1$ (ב-$x=0$), ושטחו
          $\frac12\cdot\frac1n\cdot1=\frac1{2n}$. ל-$n=1,4,10$: $\frac12$, $\frac18$, $\frac1{20}$.
      - kind: step
        text: >-
          (ג) במטריקה הבדידה $B(f,\tfrac12)=\{f\}\subseteq A$ לכל $f\in A$. לכן $A$ פתוחה, כמו כל קבוצה במטריקה
          הבדידה.
      - kind: check
        text: >-
          השוו לדוגמה 5 בשיעור, שבה הקבוצה היא של הפונקציות החיוביות **בכל** הקטע. שם הרדיוס ב-$d_\infty$ היה המינימום
          של $f$, ונדרש משפט ויירשטראס; כאן מספיק הערך $f(0)$, כי התנאי הוא על נקודה אחת. ב-(ב) שם היה צריך עוקץ
          שיורד מתחת לאפס; כאן מספיק להגיע ל-$0$ בדיוק, כי $g(0)=0$ כבר מחוץ ל-$A$. ובתרגיל 8 ראינו שהקבוצה
          $\{f(0)=0\}$ סגורה ב-$d_\infty$; כאן קבוצת אי-השוויון החזק פתוחה בה.
      - kind: result
        text: >-
          $A$ פתוחה ב-$d_\infty$ ובמטריקה הבדידה, ואינה פתוחה ב-$d_1$: אם קבוצה פתוחה תלוי במטריקה.
    source:
      name: 'University of Oregon, Math 413, Midterm 1 (Friday, November 1, 2024)'
      year: 2024
      problem: 'Problem 2(c)–(d)'
      url: 'https://pages.uoregon.edu/adding/courses/413/midterm1.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.3-c2
    stars: 1
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי עם המטריקה המושרית $d(x,y)=\|x-y\|$, ויהי $W\subseteq V$ תת-מרחב לינארי
      (במובן של אלגברה לינארית: מכיל את $0$, סגור לחיבור ולכפל בסקלר) כך ש-$W\ne V$.

      (א) הוכיחו ש-$W$ אינה קבוצה פתוחה ב-$V$.

      (ב) הסיקו שהמטריקה הבדידה על $\mathbb{R}^2$ אינה מושרית מאף נורמה.

      (ג) הראו שתת-מרחב לינארי כזה יכול בכל זאת להיות סגור: הישר $L=\{(t,0):\ t\in\mathbb{R}\}$ סגור
      ב-$(\mathbb{R}^2,d_2)$.
    answer: >-
      (א) אילו $B(0,r)\subseteq W$, כל וקטור $z\ne0$ היה כפולה של $\frac{r}{2\|z\|}z\in W$, ולכן $W=V$. (ב) במטריקה
      הבדידה הישר $L$, תת-מרחב לינארי שאינו $\mathbb{R}^2$, פתוח. (ג) סביב $(a,b)$ עם $b\ne0$ הכדור
      $B\big((a,b),|b|\big)$ זר ל-$L$.
    solution:
      - kind: given
        text: >-
          $V$ נורמי, $W\subseteq V$ תת-מרחב לינארי, $W\ne V$.
      - kind: goal
        text: >-
          (א) יש נקודה של $W$ שאין סביבה כדור בתוך $W$. (ב) המטריקה הבדידה על $\mathbb{R}^2$ אינה $\|x-y\|$ לאף
          נורמה. (ג) $\mathbb{R}^2\setminus L$ פתוחה ב-$d_2$.
      - kind: idea
        text: >-
          קבוצה פתוחה שמכילה נקודה מכילה כדור קטן סביבה. תת-מרחב לינארי שמכיל כדור קטן סביב $0$ מכיל וקטור קצר בכל
          כיוון, וכפל בסקלר מאריך אותו לכל אורך. לכן הוא כל המרחב.
      - kind: step
        text: >-
          (א) נניח בשלילה ש-$W$ פתוחה. $0\in W$, ולכן יש $r>0$ עם $B(0,r)\subseteq W$. יהי $z\in V$, $z\ne0$. נגדיר
          $y=\frac{r}{2\|z\|}\,z$. מהומוגניות $\|y\|=\frac{r}{2\|z\|}\|z\|=\frac r2<r$, כלומר $y\in B(0,r)\subseteq W$.
      - kind: step
        text: >-
          $W$ סגור לכפל בסקלר, ולכן $z=\frac{2\|z\|}{r}\,y\in W$. כך כל $z\ne0$ ב-$W$, וגם $0\in W$: $W=V$, בסתירה
          להנחה. לכן $W$ אינה פתוחה.
      - kind: step
        text: >-
          (ב) הישר $L=\{(t,0)\}$ הוא תת-מרחב לינארי של $\mathbb{R}^2$ ו-$L\ne\mathbb{R}^2$. במטריקה הבדידה כל קבוצה
          פתוחה, ובפרט $L$. אילו המטריקה הבדידה הייתה $\|x-y\|$ לנורמה כלשהי, לפי (א) $L$ לא הייתה פתוחה. סתירה,
          ולכן אין נורמה כזו.
      - kind: check
        text: >-
          אותה מסקנה ישירות מההומוגניות: נורמה כזו הייתה נותנת $\|2e_1\|=d(2e_1,0)=1$ וגם
          $\|2e_1\|=2\|e_1\|=2\,d(e_1,0)=2$. ובדוגמה 5 של שיעור 1.2 ראינו נימוק שלישי: מטריקה מושרית אינה חסומה.
      - kind: step
        text: >-
          (ג) תהי $(a,b)\notin L$, כלומר $b\ne0$. אם $(x,y)\in B\big((a,b),|b|\big)$ ב-$d_2$, אז
          $|y-b|\le d_2\big((x,y),(a,b)\big)<|b|$, ולכן $y\ne0$, כלומר $(x,y)\notin L$. לכן
          $B\big((a,b),|b|\big)\subseteq\mathbb{R}^2\setminus L$, המשלים פתוח, ו-$L$ סגורה.
      - kind: result
        text: >-
          במרחב נורמי תת-מרחב לינארי פתוח רק אם הוא כל המרחב; הוא יכול להיות סגור (הישר במישור). קבוצה שפתוחה
          במטריקה הבדידה אינה בהכרח פתוחה במטריקה של נורמה.
