# Workbook of lesson 1.3 — balls, open sets and closed sets.
# Objectives (src/course.ts):
#   OBJ-1.3-1  define open and closed balls and sets; prove an open ball is open
#   OBJ-1.3-2  arbitrary unions and finite intersections of open sets are open; an infinite intersection need not be
#   OBJ-1.3-3  decide open / closed / both / neither, in the discrete metric and in a subspace too
# Rebuilt 2026-11-10 on the formal spine: solutions cite the lesson's numbered results (1.3.1–1.3.14) and lessons
# 1.1–1.2 by the spine's numbers. Distances recomputed with src/math/metric.ts (dist); W-09 is new (the old W-09,
# "a finite set is closed", is now Proposition 1.3.5(b) in the lesson).
# 2026-11-11 (student read): W-08 rewritten to exam level ({f ≤ 1} as an uncountable intersection of closed sets,
# and {f < 1} open by Weierstrass); W-10 moved from the x-axis (too close to Example 6) to the unit circle.
lesson: '1.3'
practice:
  - id: W-1.3-01
    level: basic
    objectives: [OBJ-1.3-1]
    prompt: >-
      במישור עם המטריקה $d_\infty(x,y)=\max(|x_1-y_1|,\ |x_2-y_2|)$, תהי $c=(1,2)$.

      (א) תארו את $B(c,\tfrac12)$ ואת $B[c,\tfrac12]$ בעזרת תנאים על הקואורדינטות.

      (ב) האם הנקודה $(1.5,\ 2.2)$ שייכת ל-$B(c,\tfrac12)$? ול-$B[c,\tfrac12]$?

      (ג) והנקודה $(1.3,\ 1.6)$?
    answer: >-
      (א) $B(c,\tfrac12)=(0.5,\ 1.5)\times(1.5,\ 2.5)$ ו-$B[c,\tfrac12]=[0.5,\ 1.5]\times[1.5,\ 2.5]$.

      (ב) לא לכדור הפתוח, כן לכדור הסגור. (ג) לשניהם.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 1.3.1, $B(c,r)=\{y: d_\infty(c,y)<r\}$ ו-$B[c,r]=\{y: d_\infty(c,y)\le r\}$. המקסימום של שני מספרים
          קטן מ-$r$ אם ורק אם **שניהם** קטנים מ-$r$, וקטן מ-$r$ או שווה לו אם ורק אם שניהם כאלה.
      - kind: step
        text: >-
          (א) לכן $y\in B(c,\tfrac12)$ אם ורק אם $|y_1-1|<\tfrac12$ וגם $|y_2-2|<\tfrac12$, כלומר
          $0.5<y_1<1.5$ ו-$1.5<y_2<2.5$: ריבוע פתוח. בכדור הסגור אותם תנאים עם $\le$: הריבוע הסגור
          $[0.5,\ 1.5]\times[1.5,\ 2.5]$.
      - kind: computation
        text: >-
          (ב) $d_\infty\big((1,2),(1.5,\ 2.2)\big)=\max(0.5,\ 0.2)=0.5$. זה אינו קטן ממש מ-$\tfrac12$, ולכן
          הנקודה אינה בכדור הפתוח, אבל $0.5\le\tfrac12$, ולכן היא בכדור הסגור. היא על השפה של הריבוע.
      - kind: computation
        text: >-
          (ג) $d_\infty\big((1,2),(1.3,\ 1.6)\big)=\max(0.3,\ 0.4)=0.4<\tfrac12$, ולכן הנקודה בשני הכדורים.
      - kind: result
        text: >-
          (א) ריבוע פתוח וריבוע סגור שמרכזם $(1,2)$ וצלעם 1. (ב) רק בכדור הסגור. (ג) בשניהם.

  - id: W-1.3-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      $X=\{a,b,c\}$ עם המטריקה הבדידה.

      (א) מצאו את $B(a,\tfrac12)$, $B(a,1)$, $B[a,1]$ ו-$B(a,2)$.

      (ב) הוכיחו ש-$\{a,b\}$ פתוחה, ישירות מהגדרה 1.3.2. האם היא גם סגורה?
    answer: >-
      (א) $\{a\}$, $\{a\}$, $X$, $X$. (ב) פתוחה, כי $B(a,\tfrac12)=\{a\}$ ו-$B(b,\tfrac12)=\{b\}$; וגם סגורה.
    solution:
      - kind: definition
        text: >-
          במטריקה הבדידה $d(x,y)=1$ ל-$x\ne y$ ו-$d(x,x)=0$.
      - kind: computation
        text: >-
          (א) $B(a,\tfrac12)$: הנקודות במרחק קטן מ-$\tfrac12$ מ-$a$. רק $a$ עצמה, ולכן $\{a\}$. $B(a,1)$: מרחק קטן
          **ממש** מ-1. גם כאן רק $a$, כי $d(a,b)=d(a,c)=1$. $B[a,1]$: מרחק לכל היותר 1, כלומר כל הנקודות: $X$.
          $B(a,2)$: מרחק קטן מ-2, כל הנקודות: $X$.
      - kind: step
        text: >-
          (ב) לנקודה $a$ מתאים $r=\tfrac12$: $B(a,\tfrac12)=\{a\}\subseteq\{a,b\}$. לנקודה $b$ אותו רדיוס:
          $B(b,\tfrac12)=\{b\}\subseteq\{a,b\}$. לכל נקודה של הקבוצה יש כדור בתוכה, ולכן לפי הגדרה 1.3.2 היא פתוחה.
      - kind: step
        text: >-
          המשלים הוא $\{c\}$, ו-$B(c,\tfrac12)=\{c\}$, ולכן גם הוא פתוח, ו-$\{a,b\}$ סגורה לפי הגדרה 1.3.4. זה מקרה
          פרטי של טענה 1.3.6.
      - kind: check
        text: >-
          המלכודת היא $B(a,1)$: מי שכותב $X$ שכח שהכדור הפתוח דורש אי-שוויון ממש.
      - kind: result
        text: >-
          (א) $\{a\},\ \{a\},\ X,\ X$. (ב) גם פתוחה וגם סגורה.

  - id: W-1.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      ב-$\mathbb{R}$ עם המטריקה $|x-y|$, קבעו לכל קבוצה אם היא פתוחה, סגורה, שתיהן או אף אחת, והוכיחו.

      (א) $[2,\infty)$

      (ב) $(-\infty,0)\cup(0,1)$

      (ג) $(0,1)\cup\{2\}$
    answer: >-
      (א) סגורה ולא פתוחה. (ב) פתוחה ולא סגורה. (ג) אף אחת.
    solution:
      - kind: idea
        text: >-
          לכל קבוצה שתי שאלות נפרדות: האם לכל נקודה שלה יש כדור בתוכה (הגדרה 1.3.2), והאם לכל נקודה מחוצה לה יש
          כדור מחוצה לה (הגדרה 1.3.4). ל"לא" מספיקה נקודה אחת.
      - kind: step
        text: >-
          (א) המשלים $(-\infty,2)$ פתוח: לנקודה $x<2$ מתאים $r=2-x$, כי $|y-x|<2-x$ גורר $y<2$. לכן $[2,\infty)$
          סגורה. היא לא פתוחה: לכל $r>0$, $2-\tfrac r2\in B(2,r)$ ואינו בקבוצה.
      - kind: step
        text: >-
          (ב) $(-\infty,0)$ ו-$(0,1)$ פתוחות (לנקודה $x<0$ מתאים $r=|x|$, ול-$x\in(0,1)$ מתאים $\min(x,1-x)$), ולפי
          משפט 1.3.7(ב) האיחוד פתוח. הוא לא סגור: $0$ במשלים, ולכל $r>0$ הנקודה $x=-\tfrac r2$ נמצאת ב-$B(0,r)$ ושייכת לקבוצה.
      - kind: step
        text: >-
          (ג) לא פתוחה: $2$ בקבוצה, ולכל $r>0$ הנקודה $2+\tfrac12\min(r,1)$ נמצאת ב-$B(2,r)$, והיא בקטע $(2,\ 2.5]$,
          ולכן אינה בקבוצה. לא סגורה: $0$ מחוץ לקבוצה, ולכל $r>0$ הנקודה $\tfrac12\min(r,1)$ נמצאת ב-$B(0,r)$
          ובקטע $(0,1)$. הנקודה המבודדת $2$ הורסת את הפתיחות, והקצה החסר $0$ (וגם $1$) הורס את הסגירות.
      - kind: result
        text: >-
          (א) סגורה ולא פתוחה; (ב) פתוחה ולא סגורה; (ג) אף אחת.

  - id: W-1.3-04
    level: mid
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      במישור עם המטריקה האוקלידית $d_2$, יהי $H=\{(x,y): y>0\}$ חצי המישור העליון הפתוח, ו-$K=\{(x,y): y\ge0\}$.

      (א) הוכיחו ש-$H$ פתוחה.

      (ב) הוכיחו ש-$K$ סגורה, ושאינה פתוחה.
    answer: >-
      (א) לנקודה $(a,b)$ עם $b>0$ מתאים הרדיוס $b$. (ב) המשלים $\{y<0\}$ פתוח מאותה סיבה; סביב $(0,0)$ אין כדור
      בתוך $K$.
    solution:
      - kind: idea
        text: >-
          הנקודה $(a,b)$ רחוקה מהציר $y=0$ בדיוק $|b|$. כדור ברדיוס הזה לא מגיע לציר. כדי להוכיח את זה משתמשים בכך
          שהפרש הקואורדינטות קטן מהמרחק האוקלידי או שווה לו (למה 1.1.6: $d_\infty\le d_2$).
      - kind: step
        text: >-
          (א) תהי $(a,b)\in H$, כלומר $b>0$. נבחר $r=b$. תהי $(x,y)\in B\big((a,b),b\big)$. אז
          $|y-b|\le d_2\big((x,y),(a,b)\big)<b$, ולכן $y>b-b=0$, כלומר $(x,y)\in H$. לפי הגדרה 1.3.2, $H$ פתוחה.
      - kind: step
        text: >-
          (ב) המשלים של $K$ הוא $\{(x,y): y<0\}$. לנקודה $(a,b)$ עם $b<0$ נבחר $r=|b|$: אם $d_2\big((x,y),(a,b)\big)<|b|$
          אז $|y-b|<|b|$, ולכן $y<b+|b|=0$. לכן המשלים פתוח, ו-$K$ סגורה לפי הגדרה 1.3.4.
      - kind: step
        text: >-
          $K$ אינה פתוחה: $(0,0)\in K$, ולכל $r>0$ הנקודה $(0,-\tfrac r2)$ נמצאת ב-$B\big((0,0),r\big)$
          ואינה ב-$K$.
      - kind: check
        text: >-
          דוגמה מספרית: הנקודה $(0.3,\ 0.4)$ ב-$H$, ו-$r=0.4$. הנקודות שמתחת למרכז, $(0.3,\ 0.4-t)$ עם $0\le t<0.4$,
          כולן מעל הציר. (לכדור הפתוח אין נקודה "נמוכה ביותר": הנקודה $(0.3,\ 0)$ שעל הציר כבר אינה בו.)
      - kind: result
        text: >-
          $H$ פתוחה; $K$ סגורה ואינה פתוחה.

  - id: W-1.3-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      הוכיחו או הפריכו. בכל הסעיפים המרחב הוא $\mathbb{R}$ עם $|x-y|$.

      (א) אם $U\cup V$ פתוחה, אז $U$ ו-$V$ פתוחות.

      (ב) המשלים של קבוצה בת מנייה הוא קבוצה פתוחה.

      (ג) אם $F$ סגורה ו-$U$ פתוחה, אז $F\setminus U$ פתוחה.

      (ד) אם $U$ פתוחה ו-$F$ סגורה, אז $U\setminus F$ סגורה.
    answer: >-
      (א) לא נכון: $U=[0,1]$, $V=\mathbb{R}\setminus[0,1]$. (ב) לא נכון: $\mathbb{Q}$ בת מנייה, והמשלים שלה אינו
      פתוח. (ג) לא נכון: $[0,3]\setminus(1,2)=[0,1]\cup[2,3]$ אינה פתוחה. (ד) לא נכון:
      $(0,3)\setminus[1,2]=(0,1)\cup(2,3)$ אינה סגורה.
    solution:
      - kind: step
        text: >-
          (א) **לא נכון.** $U=[0,1]$ ו-$V=\mathbb{R}\setminus[0,1]=(-\infty,0)\cup(1,\infty)$. האיחוד הוא $\mathbb{R}$,
          שפתוח (משפט 1.3.7(א)), אבל $U$ אינה פתוחה: לכל $r>0$ הנקודה $x=-\tfrac r2$ מקיימת $x\in B(0,r)\setminus U$. משפט 1.3.7(ב)
          אומר שאיחוד של פתוחות פתוח, לא שכל איחוד פתוח בא מפתוחות.
      - kind: step
        text: >-
          (ב) **לא נכון.** $\mathbb{Q}$ בת מנייה (עובדה מאינפי 1, ראו "קבוצה בת מנייה" במילון של שיעור 0.4: אפשר
          לרשום את כל השברים ברשימה אחת, קודם אלה שבהם הערך המוחלט של המונה ועוד המכנה הוא 1, אחר כך 2, וכן הלאה,
          ובכל שלב יש רק מספר סופי של שברים). המשלים שלה, $\mathbb{R}\setminus\mathbb{Q}$, אינו
          פתוח: $\sqrt2$ אינו רציונלי (אינפי 1). יהי $r>0$; לפי ארכימדס יש $k\in\mathbb{N}$ עם $10^{-k}<r$. המספר
          $q_k=\frac{\lfloor10^k\sqrt2\rfloor}{10^k}$ רציונלי, ומ-$\lfloor u\rfloor\le u<\lfloor u\rfloor+1$ נקבל
          $0\le\sqrt2-q_k<10^{-k}<r$. לכן $q_k\in B(\sqrt2,r)$ ואינו במשלים. (לקבוצה **סופית** הטענה דווקא נכונה:
          לפי טענה 1.3.5(ב) היא סגורה.)
      - kind: step
        text: >-
          (ג) **לא נכון.** $F=[0,3]=B[\tfrac32,\tfrac32]$ סגורה (טענה 1.3.5(א)), $U=(1,2)=B(\tfrac32,\tfrac12)$ פתוחה
          (משפט 1.3.3), ו-$F\setminus U=[0,1]\cup[2,3]$. היא אינה פתוחה: $0$ בה, ולכל $r>0$ הנקודה $x=-\tfrac r2$
          מקיימת $x\in B(0,r)$ ואינה בה.
      - kind: step
        text: >-
          (ד) **לא נכון.** $U=(0,3)$ פתוחה, $F=[1,2]$ סגורה, ו-$U\setminus F=(0,1)\cup(2,3)$. היא אינה סגורה: $0$ מחוצה
          לה, ולכל $r>0$ הנקודה $\tfrac12\min(r,1)$ נמצאת ב-$B(0,r)\cap(0,1)$.
      - kind: check
        text: >-
          מה **כן** נכון: $F\setminus U=F\cap(\mathbb{R}\setminus U)$ היא חיתוך של שתי סגורות, ולכן סגורה (מסקנה 1.3.8(ב)), ו-$U\setminus F$
          פתוחה (דוגמה 4(ג) בשיעור). כלומר כשמוציאים קבוצה פתוחה מקבוצה סגורה מקבלים קבוצה סגורה, וכשמוציאים קבוצה
          סגורה מקבוצה פתוחה מקבלים קבוצה פתוחה; (ג) ו-(ד) שואלות על ההפך, ולכן נכשלו. ואכן בדוגמאות שלהן
          $[0,1]\cup[2,3]$ סגורה ו-$(0,1)\cup(2,3)$ פתוחה.
      - kind: result
        text: >-
          ארבע הטענות שגויות.

  - id: W-1.3-06
    level: mid
    objectives: [OBJ-1.3-2]
    prompt: >-
      חשבו את הקבוצות וקבעו אם הן פתוחות או סגורות ב-$\mathbb{R}$, עם הוכחה:

      (א) $\displaystyle A=\bigcap_{n=1}^{\infty}\left(1-\tfrac1n,\ 2+\tfrac1n\right)$

      (ב) $\displaystyle D=\bigcup_{n=2}^{\infty}\left[\tfrac1n,\ 1-\tfrac1n\right]$
    answer: >-
      (א) $A=[1,2]$, סגורה ולא פתוחה. (ב) $D=(0,1)$, פתוחה ולא סגורה.
    solution:
      - kind: idea
        text: >-
          כדי לחשב חיתוך או איחוד אינסופי מוכיחים הכלה בשני הכיוונים. המקרים האלה מראים שחיתוך אינסופי של פתוחות יכול
          להיות סגור, ואיחוד אינסופי של סגורות יכול להיות פתוח: משפט 1.3.7 ומסקנה 1.3.8 לא מבטיחים דבר על משפחות
          אינסופיות במקרים האלה.
      - kind: step
        text: >-
          (א) $[1,2]\subseteq A$: אם $1\le x\le2$ אז לכל $n$ מתקיים $1-\tfrac1n<1\le x\le2<2+\tfrac1n$. בכיוון השני,
          אם $x<1$, לפי ארכימדס יש $n$ עם $\tfrac1n<1-x$, כלומר $x<1-\tfrac1n$, ו-$x$ אינו בקטע ה-$n$. אם $x>2$, יש
          $n$ עם $\tfrac1n<x-2$, כלומר $x>2+\tfrac1n$, ושוב $x$ אינו בקטע ה-$n$. לכן $A=[1,2]$.
      - kind: step
        text: >-
          (ב) כל $\left[\tfrac1n,\ 1-\tfrac1n\right]$ מוכל ב-$(0,1)$, ולכן $D\subseteq(0,1)$. בכיוון השני, אם $0<x<1$,
          לפי ארכימדס יש $n\ge2$ עם $\tfrac1n\le\min(x,\ 1-x)$. אז $\tfrac1n\le x\le1-\tfrac1n$, ו-$x\in D$. לכן
          $D=(0,1)$.
      - kind: step
        text: >-
          $[1,2]=B[\tfrac32,\tfrac12]$ סגורה (טענה 1.3.5(א)) ולא פתוחה ($1-\tfrac r2\in B(1,r)\setminus[1,2]$ לכל $r>0$).
          $(0,1)=B(\tfrac12,\tfrac12)$ פתוחה (משפט 1.3.3) ולא סגורה ($0$ מחוצה לה, ו-$\tfrac12\min(r,1)\in B(0,r)\cap(0,1)$
          לכל $r>0$).
      - kind: result
        text: >-
          $A=[1,2]$: חיתוך אינסופי של פתוחות שאינו פתוח. $D=(0,1)$: איחוד אינסופי של סגורות שאינו סגור.

  - id: W-1.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      (א) $Y=\mathbb{N}$ כתת-מרחב של $\mathbb{R}$ (הגדרה 1.3.10). הוכיחו שכל תת-קבוצה של $Y$ פתוחה ב-$Y$.

      (ב) $Z=\{0\}\cup\{\tfrac1n: n\in\mathbb{N}\}$ כתת-מרחב של $\mathbb{R}$. הוכיחו ש-$\{1\}$ פתוחה ב-$Z$ ושאילו
      $\{0\}$ אינה פתוחה ב-$Z$.
    answer: >-
      (א) $B_Y(n,\tfrac12)=\{n\}$. (ב) $B_Z(1,\tfrac13)=\{1\}$; ולכל $r>0$, $B_Z(0,r)$ מכיל $\tfrac1n\ne0$.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 1.3.10, בתת-מרחב $B_Y(y,r)=B_{\mathbb{R}}(y,r)\cap Y$, ו-$U\subseteq Y$ פתוחה ב-$Y$ אם לכל $y\in U$
          יש $r>0$ עם $B_Y(y,r)\subseteq U$.
      - kind: step
        text: >-
          (א) לכל $n\in\mathbb{N}$: $B_Y(n,\tfrac12)=\left(n-\tfrac12,\ n+\tfrac12\right)\cap\mathbb{N}=\{n\}$, כי בקטע
          הזה אין שלם אחר. לכן לכל $A\subseteq\mathbb{N}$ ולכל $n\in A$ מתקיים $B_Y(n,\tfrac12)\subseteq A$: $A$ פתוחה
          ב-$Y$. ($\mathbb{N}$ מתנהג כמו מרחב בדיד, אף שהמטריקה עליו אינה הבדידה.)
      - kind: step
        text: >-
          (ב) $B_Z(1,\tfrac13)=\left(\tfrac23,\ \tfrac43\right)\cap Z=\{1\}$, כי שאר הנקודות של $Z$ הן לכל היותר
          $\tfrac12<\tfrac23$. לכן $\{1\}$ פתוחה ב-$Z$.
      - kind: step
        text: >-
          $\{0\}$ אינה פתוחה ב-$Z$: לכל $r>0$ יש לפי ארכימדס $n$ עם $\tfrac1n<r$, ואז $\tfrac1n\in B_Z(0,r)$ אבל
          $\tfrac1n\notin\{0\}$.
      - kind: check
        text: >-
          ההבדל בין הנקודות: ל-$1$ יש "רווח" בתוך $Z$ (השכנה הקרובה, $\tfrac12$, רחוקה), ול-$0$ אין: נקודות של $Z$
          מצטברות אליה. בשיעור 1.4 תקראו לזה נקודה מבודדת מול נקודת הצטברות.
      - kind: result
        text: >-
          (א) כל תת-קבוצה של $\mathbb{N}$ פתוחה ב-$\mathbb{N}$. (ב) $\{1\}$ פתוחה ב-$Z$, $\{0\}$ לא.

  - id: W-1.3-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-2, OBJ-1.3-3]
    prompt: >-
      ב-$C[0,1]$ עם מטריקת הסופרמום $d_\infty(f,g)=\max_{x\in[0,1]}|f(x)-g(x)|$, תהי $M$ קבוצת הפונקציות
      $f\in C[0,1]$ שמקיימות $f(x)\le1$ לכל $x\in[0,1]$.

      (א) יהי $x_0\in[0,1]$. הוכיחו שהקבוצה $F_{x_0}=\{f\in C[0,1]:\ f(x_0)\le1\}$ סגורה.

      (ב) הסיקו ש-$M$ סגורה. ציינו את התוצאה מהשיעור שמאפשרת את המעבר, והסבירו למה אין בעיה בכך שיש כאן אינסוף
      קבוצות.

      (ג) הוכיחו ש-$M$ אינה פתוחה.

      (ד) תהי $M'$ קבוצת הפונקציות $f\in C[0,1]$ שמקיימות $f(x)<1$ לכל $x\in[0,1]$. הוכיחו או הפריכו: $M'$ פתוחה.
    answer: >-
      (א) אם $g(x_0)>1$, הכדור $B_\infty(g,\ g(x_0)-1)$ זר ל-$F_{x_0}$. (ב) $M=\bigcap_{x_0\in[0,1]}F_{x_0}$, וחיתוך של
      כל משפחה של סגורות סגור (מסקנה 1.3.8(ב)). (ג) סביב $f\equiv1$ כל כדור מכיל את הקבועה $1+\tfrac r2$.
      (ד) נכון: עם $\mu=\max f<1$ (ויירשטראס), $B_\infty(f,\ 1-\mu)\subseteq M'$.
    solution:
      - kind: goal
        text: >-
          (א) לפי הגדרה 1.3.4: לכל $g\notin F_{x_0}$ יש כדור סביב $g$ שזר ל-$F_{x_0}$. (ב) לכתוב את $M$ כחיתוך של
          סגורות. (ג) פונקציה של $M$ שכל כדור סביבה יוצא מ-$M$. (ד) הכרעה והוכחה.
      - kind: idea
        text: >-
          מטריקת הסופרמום שולטת בהפרש בכל נקודה: $|h(x_0)-g(x_0)|\le d_\infty(h,g)$. התנאי של $M$ הוא אינסוף תנאים,
          אחד לכל $x_0$. בקבוצות **סגורות** מותר לחתוך אינסוף (מסקנה 1.3.8(ב)), ולכן (ב) מיידי. בקבוצות **פתוחות**
          אסור (משפט 1.3.7 ודוגמת $\bigcap_n(-\frac1n,\frac1n)$), ולכן ב-(ד) צריך רדיוס אחד שמתאים לכל $x$ בבת אחת.
      - kind: step
        text: >-
          (א) תהי $g\notin F_{x_0}$, כלומר $g(x_0)>1$, ונגדיר $t=g(x_0)-1>0$. תהי $h$ עם $d_\infty(h,g)<t$. אז
          $|h(x_0)-g(x_0)|\le d_\infty(h,g)<t$, ולכן $h(x_0)>g(x_0)-t=1$, כלומר $h\notin F_{x_0}$. לכן
          $B_\infty(g,t)$ זר ל-$F_{x_0}$, המשלים פתוח, ו-$F_{x_0}$ סגורה לפי הגדרה 1.3.4.
      - kind: step
        text: >-
          (ב) $f\in M$ אם ורק אם $f(x_0)\le1$ לכל $x_0\in[0,1]$, כלומר אם ורק אם $f\in F_{x_0}$ לכל $x_0$. לכן
          $M=\bigcap_{x_0\in[0,1]}F_{x_0}$. זו משפחה עם קבוצת אינדקסים $[0,1]$, שאינה סופית ואפילו אינה בת מנייה,
          אבל מסקנה 1.3.8(ב) חלה על **כל** משפחה של קבוצות סגורות. לכן $M$ סגורה.
      - kind: step
        text: >-
          (ג) $f\equiv1$ שייכת ל-$M$. לכל $r>0$ הפונקציה הקבועה $h\equiv1+\tfrac r2$ רציפה, $d_\infty(f,h)=\tfrac r2<r$,
          ו-$h(0)=1+\tfrac r2>1$, כלומר $h\notin M$. לכן אין כדור סביב $f$ שמוכל ב-$M$, ו-$M$ אינה פתוחה לפי הגדרה 1.3.2.
      - kind: step
        text: >-
          (ד) **נכון.** תהי $f\in M'$. $f$ רציפה על הקטע הסגור $[0,1]$, ולכן לפי משפט ויירשטראס (אינפי 1) יש $x_1$ עם
          $f(x_1)=\max f=:\mu$. כיוון ש-$f\in M'$, $\mu=f(x_1)<1$. נגדיר $t=1-\mu>0$.
      - kind: step
        text: >-
          תהי $h$ עם $d_\infty(f,h)<t$. לכל $x\in[0,1]$: $h(x)\le f(x)+|h(x)-f(x)|<\mu+t=1$. לכן $h\in M'$, כלומר
          $B_\infty(f,t)\subseteq M'$, ו-$M'$ פתוחה לפי הגדרה 1.3.2.
      - kind: check
        text: >-
          מספרים: $f(x)=\tfrac{x^2}2$ מקיימת $\mu=\tfrac12$ ו-$t=\tfrac12$; למשל $h=f+0.4$ נמצאת במרחק $0.4<\tfrac12$,
          והמקסימום שלה $0.9<1$. ובלי רציפות (ד) נכשלת: במרחב הפונקציות החסומות על $[0,1]$ עם $d_\infty$ (הגדרה
          1.1.7), תהי $k(x)=x$ ל-$0\le x<1$ ו-$k(1)=0$. אז $k(x)<1$ בכל נקודה, אבל לכל $r>0$ הפונקציה $k+\tfrac r2$
          נמצאת בכדור ברדיוס $r$ סביב $k$, ובנקודה $x=1-\tfrac14\min(r,1)$ ערכה $1-\tfrac14\min(r,1)+\tfrac r2\ge1+\tfrac r4>1$.
          ויירשטראס הוא מה שנותן רדיוס אחד לכל $x$.
      - kind: result
        text: >-
          (א) $F_{x_0}$ סגורה. (ב) $M$ סגורה, כחיתוך של משפחה של סגורות. (ג) $M$ אינה פתוחה. (ד) $M'$ פתוחה.

  - id: W-1.3-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-1, OBJ-1.3-2]
    prompt: >-
      יהי $(X,d)$ מרחב מטרי.

      (א) הוכיחו: אם $x\ne y$ ו-$\rho=\tfrac12d(x,y)$, אז $B(x,\rho)\cap B(y,\rho)=\emptyset$.

      (ב) תהי $A=\{a_1,\dots,a_m\}\subseteq X$ סופית ולא ריקה, ו-$x\notin A$. הוכיחו שיש $r>0$ וקבוצה פתוחה
      $O\supseteq A$ כך ש-$B(x,r)\cap O=\emptyset$.

      (ג) הוכיחו או הפריכו: בכל מרחב מטרי, לכל $x\ne y$ יש $r>\tfrac12d(x,y)$ כך ש-$B(x,r)\cap B(y,r)=\emptyset$.
    answer: >-
      (א) נקודה משותפת $z$ הייתה נותנת $d(x,y)<2\rho$. (ב) $r_i=\tfrac12d(x,a_i)$, $r=\min r_i$,
      $O=\bigcup_iB(a_i,r_i)$. (ג) לא נכון: ב-$\mathbb{R}$, $x=0$, $y=1$, הנקודה $\tfrac12$ בשני הכדורים לכל
      $r>\tfrac12$. (במרחב בדיד דווקא $r=1$ מתאים.)
    solution:
      - kind: idea
        text: >-
          (א) אי-שוויון המשולש: נקודה שקרובה לשתיהן מקרבת אותן זו לזו. (ב) מפרידים את $x$ מכל $a_i$ לפי (א), ולוקחים
          את הקטן מבין הרדיוסים סביב $x$: מינימום של מספר **סופי** של חיוביים, כמו במשפט 1.3.7(ג).
      - kind: step
        text: >-
          (א) $\rho>0$ לפי M1. נניח בשלילה ש-$z\in B(x,\rho)\cap B(y,\rho)$. לפי M2 ו-M3,
          $d(x,y)\le d(x,z)+d(z,y)<\rho+\rho=d(x,y)$, סתירה. לכן הכדורים זרים.
      - kind: step
        text: >-
          (ב) לכל $i$, $x\ne a_i$; נגדיר $r_i=\tfrac12d(x,a_i)>0$. לפי (א), $B(x,r_i)\cap B(a_i,r_i)=\emptyset$. נגדיר
          $r=\min(r_1,\dots,r_m)>0$ (מינימום של מספר סופי של חיוביים) ו-$O=\bigcup_{i=1}^mB(a_i,r_i)$.
      - kind: step
        text: >-
          $O$ פתוחה לפי משפט 1.3.3 ומשפט 1.3.7(ב), ו-$a_i\in B(a_i,r_i)\subseteq O$ לכל $i$, כלומר $A\subseteq O$. אם
          $w\in B(x,r)\cap O$, אז $w\in B(a_i,r_i)$ לאיזה $i$, ו-$w\in B(x,r)\subseteq B(x,r_i)$, בסתירה ל-(א). לכן
          $B(x,r)\cap O=\emptyset$.
      - kind: step
        text: >-
          (ג) **לא נכון.** ב-$\mathbb{R}$ עם $|x-y|$, $x=0$, $y=1$: לכל $r>\tfrac12$, $|0-\tfrac12|=|1-\tfrac12|=\tfrac12<r$,
          ולכן $\tfrac12\in B(0,r)\cap B(1,r)$. כלומר הרדיוס $\tfrac12d(x,y)$ של (א) הוא הטוב ביותר שאפשר להבטיח בכל
          מרחב.
      - kind: check
        text: >-
          במרחב בדיד דווקא $r=1>\tfrac12$ מתאים: $B(x,1)=\{x\}$ ו-$B(y,1)=\{y\}$ זרים. לכן ההפרכה ב-(ג) צריכה מרחב
          מסוים: הטענה "בכל מרחב" שגויה, אף שבמרחבים מסוימים היא נכונה. ובסעיף (ב) המינימום הוא המקום שבו "סופית" נחוצה: עבור
          $A=\{\tfrac1n: n\in\mathbb{N}\}$ ו-$x=0$ ב-$\mathbb{R}$ הרדיוסים $r_n=\tfrac1{2n}$ חיוביים ו-$\inf r_n=0$. ולא רק ההוכחה נכשלת, גם המסקנה: אם
          $O\supseteq A$ פתוחה כלשהי, אז לכל $r>0$ יש לפי ארכימדס $n$ עם $\tfrac1n<r$, ואז
          $\tfrac1n\in B(0,r)\cap A\subseteq B(0,r)\cap O$. לכן אף כדור סביב $0$ אינו זר ל-$O$.
      - kind: result
        text: >-
          (א) הכדורים ברדיוס $\tfrac12d(x,y)$ זרים. (ב) $r=\min_i\tfrac12d(x,a_i)$, $O=\bigcup_iB(a_i,r_i)$. (ג) לא נכון
          באופן כללי (ב-$\mathbb{R}$), אף שבמרחב בדיד זה נכון.

  - id: W-1.3-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.3-3]
    prompt: >-
      במישור עם $d_2$ יהי $S=S\big((0,0),1\big)=\{(x,y): x^2+y^2=1\}$ מעגל היחידה, כתת-מרחב (הגדרה 1.3.10), ותהי
      $A=\{(x,y)\in S:\ y>0\}$ חצי המעגל העליון, בלי שתי הנקודות $(\pm1,0)$.

      (א) הוכיחו ש-$A$ פתוחה ב-$S$ ושאינה סגורה ב-$S$.

      (ב) הוכיחו ש-$A$ אינה פתוחה ואינה סגורה במישור.

      (ג) הוכיחו שקבוצה $F\subseteq S$ סגורה ב-$S$ אם ורק אם היא סגורה במישור. האם הטענה המקבילה לקבוצות פתוחות
      נכונה?
    answer: >-
      (א) $A=H\cap S$ עם $H$ חצי המישור העליון הפתוח; ליד $e_1=(1,0)\in S\setminus A$ יש נקודות של $A$. (ב) לא פתוחה:
      סביב $(0,1)$ יש נקודות מחוץ למעגל; לא סגורה: אחרת הייתה סגורה ב-$S$. (ג) $S$ סגורה במישור, וטענה 1.3.13(ב)
      חלה; לפתוחות לא: $A$ פתוחה ב-$S$ ולא במישור.
    solution:
      - kind: given
        text: >-
          $S$ מעגל היחידה ב-$(\mathbb{R}^2,d_2)$, ו-$A$ חצי המעגל העליון הפתוח. מתרגיל 4: $H=\{(x,y): y>0\}$ פתוחה
          במישור. מדוגמה 3 בשיעור: הספרה $S$ סגורה במישור (3(א)) ואינה פתוחה בו (3(ב)).
      - kind: idea
        text: >-
          בתת-מרחב בודקים פתיחות דרך חיתוך עם קבוצה פתוחה של המרחב (משפט 1.3.11), וסגירות דרך המשלים בתוך $S$. נקודת
          המפתח היא $e_1=(1,0)$: היא ב-$S$ ולא ב-$A$, ונקודות של $A$ מתקרבות אליה לאורך המעגל.
      - kind: step
        text: >-
          (א) **פתוחה ב-$S$:** $A=H\cap S$, כי נקודה של $S$ שייכת ל-$A$ בדיוק כשהרכיב השני שלה חיובי. $H$ פתוחה
          במישור (תרגיל 4(א)), ולכן לפי משפט 1.3.11 $A$ פתוחה ב-$S$.
      - kind: step
        text: >-
          **לא סגורה ב-$S$:** $e_1\in S\setminus A$. יהי $r>0$, ונגדיר $\varphi=\tfrac12\min(r,\pi)$, כך ש-$0<\varphi\le\tfrac\pi2$
          ו-$\varphi<r$. הנקודה $w=(\cos\varphi,\ \sin\varphi)$ על המעגל, ו-$\sin\varphi>0$, ולכן $w\in A$. המרחק:
          $d_2(w,e_1)^2=(1-\cos\varphi)^2+\sin^2\varphi$, וזה שווה ל-$2-2\cos\varphi=4\sin^2\tfrac\varphi2$, ולכן
          $d_2(w,e_1)=2\sin\tfrac\varphi2\le\varphi<r$ (כי $\sin u\le u$ ל-$u\ge0$, אינפי 1). כלומר
          $w\in B_S(e_1,r)\cap A$, ואין כדור סביב $e_1$ ב-$S$ שזר ל-$A$. לכן $S\setminus A$ אינה פתוחה ב-$S$.
      - kind: step
        text: >-
          (ב) **לא פתוחה במישור:** $(0,1)\in A$, ולכל $r>0$ הנקודה $(0,\ 1+\tfrac r2)$ נמצאת ב-$B\big((0,1),r\big)$ ואינה
          על המעגל, כי $(1+\tfrac r2)^2\ne1$; לכן היא אינה ב-$A$. **לא סגורה במישור:** אילו $A$ הייתה סגורה במישור,
          אז $A=A\cap S$ הייתה סגורה ב-$S$ לפי מסקנה 1.3.12, בסתירה ל-(א).
      - kind: step
        text: >-
          (ג) $S$ סגורה במישור (דוגמה 3(א) בשיעור), ולכן לפי טענה 1.3.13(ב) קבוצה $F\subseteq S$ סגורה ב-$S$ אם ורק
          אם היא סגורה במישור. לקבוצות פתוחות הטענה המקבילה **שגויה**: $A$ פתוחה ב-$S$ לפי (א) ואינה פתוחה במישור
          לפי (ב). אין כאן סתירה לטענה 1.3.13(א), כי היא דורשת ש-$S$ תהיה פתוחה במישור, ו-$S$ אינה פתוחה (דוגמה 3(ב)).
      - kind: check
        text: >-
          מספרים: עם $r=0.1$, $\varphi=0.05$ ו-$d_2(w,e_1)=2\sin0.025\approx0.049995<0.1$. ובדיקת כיוון: חצי המעגל
          **הסגור** $\{(x,y)\in S: y\ge0\}=K\cap S$, עם $K=\{y\ge0\}$ הסגורה מתרגיל 4(ב), סגור ב-$S$, ולפי (ג) גם
          במישור; ואכן הוא חיתוך של שתי סגורות במישור (מסקנה 1.3.8(ב)).
      - kind: result
        text: >-
          (א) $A$ פתוחה ב-$S$ ולא סגורה ב-$S$. (ב) לא פתוחה ולא סגורה במישור. (ג) סגירות ב-$S$ ובמישור מתלכדות,
          כי $S$ סגורה; פתיחות לא, כי $S$ אינה פתוחה.
challenge:
  - id: W-1.3-c1
    stars: 1
    objectives: [OBJ-1.3-1, OBJ-1.3-3]
    prompt: >-
      ב-$C[0,1]$ תהי $A=\{f\in C[0,1]:\ f(0)>0\}$: התנאי הוא על הערך של $f$ בנקודה אחת בלבד, ובשאר הקטע $f$ יכולה
      להיות גם שלילית.

      (א) הוכיחו ש-$A$ פתוחה במטריקת הסופרמום $d_\infty(f,g)=\max_{x\in[0,1]}|f(x)-g(x)|$.

      (ב) הוכיחו ש-$A$ אינה פתוחה במטריקת האינטגרל $d_1(f,g)=\int_0^1|f(x)-g(x)|\,dx$.

      (ג) האם $A$ פתוחה במטריקה הבדידה על $C[0,1]$?
    answer: >-
      (א) לכל $f\in A$: $B_\infty(f,f(0))\subseteq A$. (ב) סביב $f\equiv1$: $g_n(x)=\min(1,nx)\notin A$
      ו-$d_1(g_n,1)=\frac1{2n}$, ולכן אין כדור $B_{d_1}(f,r)$ סביב $f\equiv1$ בתוך $A$. (ג) כן: במטריקה הבדידה כל קבוצה פתוחה.
    solution:
      - kind: given
        text: >-
          $A=\{f\in C[0,1]:\ f(0)>0\}$, ושלוש מטריקות על $C[0,1]$: $d_\infty$, $d_1$ והבדידה.
      - kind: goal
        text: >-
          (א) לכל $f\in A$ יש $r>0$ עם $B_\infty(f,r)\subseteq A$. (ב) יש $f\in A$ כך שכל כדור $B_{d_1}(f,r)$ מכיל פונקציה
          שאינה ב-$A$. (ג) הכרעה.
      - kind: idea
        text: >-
          $d_\infty$ שולטת בהפרש בכל נקודה, ובפרט בנקודה $0$: הפרש סופרמום קטן משאיר את $g(0)$ חיובי. $d_1$ שולטת רק
          בשטח שבין הגרפים, ופונקציה יכולה לשנות את הערך שלה ב-$0$ הרבה ואת השטח רק מעט.
      - kind: step
        text: >-
          (א) תהי $f\in A$, ונבחר $r=f(0)>0$. אם $d_\infty(g,f)<r$, אז $|g(0)-f(0)|\le d_\infty(g,f)<r$, ולכן
          $g(0)>f(0)-r=0$, כלומר $g\in A$. לכן $B_\infty(f,r)\subseteq A$, ו-$A$ פתוחה לפי הגדרה 1.3.2.
      - kind: step
        text: >-
          (ב) ניקח $f\equiv1\in A$ ו-$r>0$ כלשהו. לכל $n\in\mathbb{N}$ נגדיר $g_n(x)=\min(1,nx)$: היא עולה לינארית
          מ-$0$ ל-$1$ על $[0,\tfrac1n]$ וקבועה $1$ אחר כך. $g_n$ רציפה ו-$g_n(0)=0$, ולכן $g_n\notin A$.
      - kind: computation
        text: >-
          $f-g_n=1-nx$ על $[0,\tfrac1n]$ ו-$0$ אחר כך, ולכן
          $d_1(g_n,f)=\int_0^{1/n}(1-nx)\,dx=\frac1n-n\cdot\frac{1}{2n^2}=\frac{1}{2n}$.
      - kind: step
        text: >-
          נבחר $n>\frac{1}{2r}$ (ארכימדס); אז $d_1(g_n,f)=\frac1{2n}<r$, כלומר $g_n\in B_{d_1}(f,r)$ אבל $g_n\notin A$. זה
          נכון לכל $r>0$, ולכן אין כדור $B_{d_1}(f,r)$ שמוכל ב-$A$, ו-$A$ אינה פתוחה ב-$d_1$.
      - kind: check
        text: >-
          אותו מספר בגאומטריה: השטח שבין הגרפים הוא משולש עם בסיס $\frac1n$ (על הציר) וגובה $1$ (ב-$x=0$), ושטחו
          $\frac12\cdot\frac1n\cdot1=\frac1{2n}$. ל-$n=1,4,10$: $\frac12$, $\frac18$, $\frac1{20}$.
      - kind: step
        text: >-
          (ג) במטריקה הבדידה $B(f,\tfrac12)=\{f\}\subseteq A$ לכל $f\in A$. לכן $A$ פתוחה, כמו כל קבוצה במטריקה
          הבדידה (טענה 1.3.6).
      - kind: check
        text: >-
          השוו לטענה 1.3.14 בשיעור, שבה הקבוצה היא של הפונקציות החיוביות **בכל** הקטע. שם הרדיוס ב-$d_\infty$ היה
          המינימום של $f$, ונדרש משפט ויירשטראס; כאן מספיק הערך $f(0)$, כי התנאי הוא על נקודה אחת. ב-(ב) שם היה צריך
          עוקץ שיורד מתחת לאפס; כאן מספיק להגיע ל-$0$ בדיוק, כי $g(0)=0$ כבר מחוץ ל-$A$. ובתרגיל 8(א) ראינו שקבוצה של
          אי-שוויון **חלש** בנקודה אחת, $\{f: f(x_0)\le1\}$, סגורה ב-$d_\infty$; כאן קבוצה של אי-שוויון **חזק** בנקודה
          אחת פתוחה בה.
      - kind: result
        text: >-
          $A$ פתוחה ב-$d_\infty$ ובמטריקה הבדידה, ואינה פתוחה ב-$d_1$: אם קבוצה פתוחה תלוי במטריקה.
