# Workbook of lesson 1.9 — convergence of a sequence of linear maps.
# Objectives (src/course.ts):
#   OBJ-1.9-1  norm and pointwise convergence of linear maps; norm convergence = uniform on every ball, same limit
#   OBJ-1.9-2  matrices: norm convergence = entrywise = (in finite dimension) pointwise
#   OBJ-1.9-3  in a function space pointwise does not imply norm; converging norms do not imply converging maps
# Levels: basic 01–03, mid 04–07, exam 08–10; qualitative 03, 04, 07, 08, 09.
# W-08 was written as W-1.8-04 on 2026-11-16 and moved here on 2026-11-17 with its citations renumbered.
# c1 was replaced on 2026-11-17: the Uppsala FA2006 sheet it cited could not be opened (TLS certificate error).
# Numbers recomputed with src/math/multivar.ts (opNorm, symEigenvalues, inverse, simpson).
lesson: '1.9'
practice:
  - id: W-1.9-01
    level: basic
    objectives: [OBJ-1.9-2]
    prompt: >-
      $A_k=\begin{pmatrix}\frac1k&1-\frac1k\\2+\frac3k&0\end{pmatrix}$, כהעתקות של $\mathbb{R}^2$ עם אותה נורמה $p$
      בתחום ובטווח.

      (א) מצאו את הגבול $A$ של $A_k$ בנורמת האופרטור.

      (ב) חשבו את $\|A_k-A\|_1$ ואת $\|A_k-A\|_\infty$, ומצאו את $k$ הקטן ביותר שממנו והלאה $\|A_k-A\|_1<0.001$.

      (ג) חסמו את $\|A_k-A\|_2$ מלעיל ומלרע בלי ערכים עצמיים, ואחר כך חשבו אותו בדיוק.
    answer: >-
      (א) $A=\begin{pmatrix}0&1\\2&0\end{pmatrix}$. (ב) $\frac4k$ ו-$\frac3k$; מ-$k=4001$. (ג)
      $\frac3k\le\|A_k-A\|_2\le\frac{\sqrt{11}}k$, ובדיוק $\|A_k-A\|_2=\frac1k\sqrt{\frac{11+\sqrt{85}}2}\approx\frac{3.180}k$.
    solution:
      - kind: idea
        text: >-
          לפי טענה 1.9.5(ב) הגבול הוא מטריצת הגבולות של הכניסות. ההפרש $A_k-A$ הוא $\frac1k$ כפול מטריצה קבועה $B$,
          ולכן לפי ההומוגניות של נורמת האופרטור (משפט 1.8.5) $\|A_k-A\|_p=\frac1k\|B\|_p$, ונשאר לחשב נורמות של $B$.
      - kind: computation
        text: >-
          (א) $\frac1k\to0$, $1-\frac1k\to1$, $2+\frac3k\to2$, ו-$0\to0$. לפי טענה 1.9.5(ב)
          $A=\begin{pmatrix}0&1\\2&0\end{pmatrix}$, ו-$A_k-A=\frac1kB$ עם $B=\begin{pmatrix}1&-1\\3&0\end{pmatrix}$.
      - kind: computation
        text: >-
          (ב) סכומי העמודות של $B$ בערך מוחלט: $1+3=4$ ו-$1+0=1$, ולכן לפי משפט 1.8.8 $\|B\|_1=4$ ו-$\|A_k-A\|_1=\frac4k$.
          סכומי השורות: $1+1=2$ ו-$3+0=3$, ולכן לפי משפט 1.8.9 $\|A_k-A\|_\infty=\frac3k$. התנאי $\frac4k<0.001$ שקול
          ל-$k>4000$, ולכן $k$ הקטן ביותר הוא $4001$ (ב-$k=4000$ מתקבל $0.001$ בדיוק).
      - kind: step
        text: >-
          (ג) בלי ערכים עצמיים: לפי טענה 1.9.5(א) $\|B\|_2$ לפחות הכניסה הגדולה, $3$. ולפי טענה 1.8.10ב (חסם פרובניוס)
          $\|B\|_2\le\sqrt{1+1+9+0}=\sqrt{11}\approx3.317$; זה טוב יותר מסכום הכניסות, $5$, שטענה 1.9.5(א) נותנת.
      - kind: computation
        text: >-
          בדיוק, לפי משפט 1.8.10:
          $$B^TB=\begin{pmatrix}1&3\\-1&0\end{pmatrix}\begin{pmatrix}1&-1\\3&0\end{pmatrix}=\begin{pmatrix}10&-1\\-1&1\end{pmatrix},$$
          עם עקבה $11$ ודטרמיננטה $10-1=9$. הפולינום האופייני $\lambda^2-11\lambda+9$, ו-$\lambda_{\max}=\frac{11+\sqrt{85}}2\approx10.110$.
          לכן $\|B\|_2=\sqrt{\frac{11+\sqrt{85}}2}\approx3.180$, בין $3$ ל-$3.317$.
      - kind: check
        text: >-
          עם $k=7$, חישוב ישיר של נורמות האופרטור של $A_7-A$ נותן $0.5714$, $0.4542$ ו-$0.4286$ בנורמות 1, 2 ואינסוף,
          כמו $\frac47$, $\frac{3.180}7$ ו-$\frac37$. שלושתן שונות, ושואפות לאפס יחד.
      - kind: result
        text: >-
          $A=\begin{pmatrix}0&1\\2&0\end{pmatrix}$; $\|A_k-A\|_1=\frac4k$, $\|A_k-A\|_\infty=\frac3k$,
          $\|A_k-A\|_2=\frac1k\sqrt{\frac{11+\sqrt{85}}2}$; $\|A_k-A\|_1<0.001$ מ-$k=4001$.

  - id: W-1.9-02
    level: basic
    objectives: [OBJ-1.9-1]
    prompt: >-
      $T_k,T\in\mathcal{L}(V,W)$, ונתון ש-$\|T_k-T\|\le\frac3k$ לכל $k$.

      (א) מצאו $k_0$ כך שלכל $k>k_0$ ולכל $x$ עם $\|x\|\le2$ מתקיים $\|T_kx-Tx\|<0.01$.

      (ב) נתון גם $\|T\|=4$. באיזה קטע נמצא $\|T_{100}\|$?

      (ג) $x_0$ וקטור עם $\|x_0\|=1000$. מאיזה $k$ החסם מבטיח $\|T_kx_0-Tx_0\|<0.01$? מה זה אומר על השאלה אם
      ההתכנסות במידה שווה על כל $V$?
    answer: >-
      (א) $k_0=600$. (ב) $[3.97,\ 4.03]$. (ג) $k>300000$; ה-$k$ הדרוש גדל עם $\|x\|$, ולכן החסם נותן התכנסות במידה
      שווה רק על כדורים.
    solution:
      - kind: idea
        text: >-
          טענה 1.9.3(א) נותנת חסם מפורש, $\|T_kx-Tx\|\le\|T_k-T\|\,\|x\|$, וטענה 1.9.3(ג) נותנת את קצב ההתכנסות של
          הנורמות. כל מה שצריך הוא להציב.
      - kind: computation
        text: >-
          (א) לכל $x$ עם $\|x\|\le2$, לפי טענה 1.8.4(א) על $T_k-T$: $\|T_kx-Tx\|\le\|T_k-T\|\,\|x\|\le\frac3k\cdot2=\frac6k$.
          $\frac6k<0.01$ שקול ל-$k>600$. לכן $k_0=600$ מתאים, לכל $x$ בכדור בבת אחת.
      - kind: computation
        text: >-
          (ב) לפי אי-שוויון המשולש ההפוך ב-$\mathcal{L}(V,W)$ (טענה 1.9.3(ג)),
          $\big|\,\|T_{100}\|-\|T\|\,\big|\le\|T_{100}-T\|\le\frac3{100}=0.03$. לכן $3.97\le\|T_{100}\|\le4.03$.
      - kind: computation
        text: >-
          (ג) $\|T_kx_0-Tx_0\|\le\frac3k\cdot1000=\frac{3000}k$, ו-$\frac{3000}k<0.01$ שקול ל-$k>300000$.
      - kind: step
        text: >-
          ככל ש-$\|x\|$ גדול יותר, ה-$k$ שהחסם דורש גדל, בלי גבול. זה אינו רק חיסרון של החסם: אם $T_k\ne T$, יש $x$
          עם $(T_k-T)x\ne0$, ו-$\|(T_k-T)(tx)\|=|t|\,\|(T_k-T)x\|$ גדל בלי גבול. לכן ההתכנסות במידה שווה על כל כדור
          (טענה 1.9.3(א)), ובדרך כלל לא על כל $V$.
      - kind: check
        text: >-
          הצבה: $\frac6{600}=0.01$ בדיוק, ולכן צריך $k>600$ ממש; $\frac3{100}=0.03$; $\frac{3000}{300000}=0.01$.
      - kind: result
        text: >-
          (א) כל $k>600$. (ב) $\|T_{100}\|\in[3.97,\ 4.03]$. (ג) $k>300000$: הקצב תלוי ברדיוס, והתכנסות בנורמה היא
          התכנסות במידה שווה על כל כדור, לא על כל המרחב.

  - id: W-1.9-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.9-3, OBJ-1.9-2]
    prompt: >-
      $A_k=\begin{pmatrix}1&0\\0&(-1)^k\end{pmatrix}$, כהעתקות של $(\mathbb{R}^2,\|\cdot\|_p)$ עם $p\in\{1,2,\infty\}$.
      הוכיחו או הפריכו:

      (א) $\|A_k\|_p=\|I\|_p$ לכל $k$.

      (ב) $A_ke_1\to Ie_1$.

      (ג) מ-(א) ומ-(ב) נובע ש-$A_k\to I$ בנורמת האופרטור.
    answer: >-
      (א) נכון: כל הנורמות 1. (ב) נכון: $A_ke_1=e_1$. (ג) לא נכון: $A_ke_2=(-1)^ke_2$ אינה מתכנסת, ו-$\|A_k-I\|_p=2$
      לכל $k$ אי-זוגי.
    solution:
      - kind: idea
        text: >-
          הנורמה רואה רק כמה ההעתקה מותחת, ווקטור אחד רואה רק עמודה אחת. כדי להפריך מספיק למצוא וקטור שעליו
          $A_kx$ אינה מתכנסת, ולהשתמש בטענה 1.9.3(א).
      - kind: computation
        text: >-
          (א) $A_k$ אלכסונית עם $1$ ו-$\pm1$ על האלכסון. סכומי העמודות וסכומי השורות בערך מוחלט כולם $1$, ולכן לפי
          משפטים 1.8.8 ו-1.8.9 $\|A_k\|_1=\|A_k\|_\infty=1$. $A_k$ סימטרית עם ערכים עצמיים $1$ ו-$(-1)^k$, ולכן לפי
          מסקנה 1.8.10א $\|A_k\|_2=1$. ובאותו אופן $\|I\|_p=1$. נכון.
      - kind: step
        text: >-
          (ב) $A_ke_1=e_1=Ie_1$ לכל $k$. נכון.
      - kind: step
        text: >-
          (ג) לא נכון. אילו $A_k\to I$ בנורמה, לפי טענה 1.9.3(א) היה $A_ke_2\to e_2$. אבל $A_ke_2=(-1)^ke_2$, שקופצת בין
          $e_2$ ל-$(-e_2)$, במרחק $2$ זה מזה, ואינה מתכנסת. ובמספרים: ל-$k$ אי-זוגי $A_k-I=\begin{pmatrix}0&0\\0&-2\end{pmatrix}$,
          שנורמת האופרטור שלה $2$ בשלוש הנורמות.
      - kind: check
        text: >-
          לפי טענה 1.9.5, $A_k$ מתכנסת בנורמה אם ורק אם כל כניסה מתכנסת, והכניסה $(-1)^k$ אינה מתכנסת. וזו גם הסדרה
          "סימן מתחלף" של איור 1.9א, רק בכיוון אחד.
      - kind: result
        text: >-
          (א) ו-(ב) נכונות, (ג) לא: נורמות מתכנסות והתכנסות על וקטור אחד אינן גוררות התכנסות של ההעתקות.

  - id: W-1.9-04
    level: mid
    qualitative: true
    objectives: [OBJ-1.9-1]
    prompt: >-
      $V,W$ מרחבים נורמיים, $T_k,T\in\mathcal{L}(V,W)$, ו-$x_k\to x$ ב-$V$.

      (א) הוכיחו: אם $T_k\to T$ בנורמת האופרטור, אז $T_kx_k\to Tx$.

      (ב) הוכיחו שמספיק פחות: אם $T_k\to T$ נקודתית ו-$M=\sup_k\|T_k\|<\infty$, אז $T_kx_k\to Tx$.

      (ג) הסיקו שעל $(C[0,1],\|\cdot\|_\infty)$, עם $T_kf=f(\frac1k)-f(0)$, אם $f_k\to f$ אז $T_kf_k\to0$, אף ש-$T_k$
      אינה מתכנסת בנורמה.
    answer: >-
      (ב) $\|T_kx_k-Tx\|\le M\|x_k-x\|+\|T_kx-Tx\|\to0$. (א) נובע מ-(ב), כי התכנסות בנורמה נותנת התכנסות נקודתית
      ונורמות חסומות. (ג) $\|T_k\|=2$ לכל $k$, ו-$T_kf\to0$.
    solution:
      - kind: idea
        text: >-
          מוסיפים ומחסירים $T_kx$: הפרש אחד, $T_k(x_k-x)$, קטן כי הנורמות של $T_k$ חסומות; השני, $T_kx-Tx$, קטן
          כי $T_k$ מתכנסת ב-$x$ **הקבוע**. מה שבאמת נדרש הוא שני הדברים האלה, לא התכנסות בנורמה.
      - kind: step
        text: >-
          (ב) לפי הלינאריות $T_kx_k-Tx=T_k(x_k-x)+(T_kx-Tx)$. לפי אי-שוויון המשולש ב-$W$ וטענה 1.8.4(א),
          $$\begin{aligned}\|T_kx_k-Tx\|&\le\|T_k\|\,\|x_k-x\|+\|T_kx-Tx\|\\&\le M\|x_k-x\|+\|T_kx-Tx\| .\end{aligned}$$
      - kind: step
        text: >-
          המחובר הראשון שואף ל-$0$ כי $x_k\to x$, והשני כי $T_k\to T$ נקודתית (ב-$x$ אחד, קבוע). לכן הסכום שואף
          ל-$0$ (אריתמטיקה של גבולות), כלומר $T_kx_k\to Tx$.
      - kind: step
        text: >-
          (א) אם $T_k\to T$ בנורמה, אז לפי טענה 1.9.3(א) $T_k\to T$ נקודתית, ולפי טענה 1.9.3(ג) הסדרה $\|T_k\|$
          מתכנסת, ולכן חסומה (אינפי 1). אלה שתי ההנחות של (ב).
      - kind: step
        text: >-
          (ג) לפי טענה 1.9.4, $\|T_k\|=2$ לכל $k$, ו-$T_kf\to0$ לכל $f$. לפי (ב) עם $M=2$ ו-$T=0$, $T_kf_k\to0$ לכל
          $f_k\to f$ ב-$C[0,1]$.
      - kind: check
        text: >-
          למה (ב) אינו סותר את טענה 1.9.4? כי הסדרה $g_k=\min(1,2kx-1)$, שעליה $T_kg_k=2$, **אינה מתכנסת** ב-$C[0,1]$:
          הגבול הנקודתי שלה הוא $(-1)$ ב-$0$ ו-$1$ בשאר הקטע, שאינו רציף (משפט 1.5.10). (ב) מדבר רק על סדרות
          מתכנסות $x_k$.
      - kind: result
        text: >-
          התכנסות נקודתית יחד עם נורמות חסומות כבר מעבירה סדרות מתכנסות לסדרות מתכנסות; התכנסות בנורמה נותנת את
          שתיהן. ב-$C[0,1]$, $T_kf_k\to0$ לכל $f_k\to f$.

  - id: W-1.9-05
    level: mid
    objectives: [OBJ-1.9-2]
    prompt: >-
      (א) תהי $D=\operatorname{diag}(d_1,\dots,d_n)$ מטריצה אלכסונית. הוכיחו ש-$\|D\|_p=\max_i|d_i|$ ל-$p=1,2,\infty$.

      (ב) הסיקו שסדרת מטריצות אלכסוניות $D_k$ מתכנסת בנורמת האופרטור למטריצה אלכסונית $D$ אם ורק אם כל איבר על
      האלכסון מתכנס, ושאז $\|D_k-D\|_p=\max_i|d^{(k)}_i-d_i|$, אותו מספר בשלוש הנורמות.

      (ג) $D_k=\operatorname{diag}\big(1+\frac1k,\ 2-\frac1{k^2},\ \frac{k}{k+1}\big)$. מצאו את הגבול, חשבו את
      $\|D_k-D\|_p$, ומצאו את $k$ הקטן ביותר שממנו $\|D_k-D\|_p<0.05$.
    answer: >-
      (א) עמודות, שורות, ומסקנה 1.8.10א. (ג) $D=\operatorname{diag}(1,2,1)$, $\|D_k-D\|_p=\frac1k$, ו-$k=21$.
    solution:
      - kind: idea
        text: >-
          במטריצה אלכסונית בכל שורה ובכל עמודה יש כניסה אחת לכל היותר שאינה אפס, והיא גם סימטרית. לכן שלוש
          הנוסחאות של שיעור 1.8 נותנות את אותו מספר.
      - kind: computation
        text: >-
          (א) סכום הערכים המוחלטים בעמודה $j$ הוא $|d_j|$, ולכן לפי משפט 1.8.8 $\|D\|_1=\max_j|d_j|$; בשורה $i$ הוא
          $|d_i|$, ולכן לפי משפט 1.8.9 $\|D\|_\infty=\max_i|d_i|$. $D$ סימטרית, והערכים העצמיים שלה $d_1,\dots,d_n$
          (הפולינום האופייני $\prod_i(\lambda-d_i)$), ולכן לפי מסקנה 1.8.10א $\|D\|_2=\max_i|d_i|$.
      - kind: step
        text: >-
          (ב) $D_k-D=\operatorname{diag}\big(d^{(k)}_1-d_1,\dots,d^{(k)}_n-d_n\big)$ אלכסונית, ולפי (א)
          $\|D_k-D\|_p=\max_i|d^{(k)}_i-d_i|$. מקסימום של $n$ מספרים אי-שליליים שואף ל-$0$ אם ורק אם כל אחד מהם שואף
          ל-$0$ (כל אחד בין $0$ למקסימום, והמקסימום לכל היותר הסכום). זו גם טענה 1.9.5(ב), כי שאר הכניסות אפס.
      - kind: computation
        text: >-
          (ג) $1+\frac1k\to1$, $2-\frac1{k^2}\to2$, $\frac k{k+1}\to1$, ולכן $D=\operatorname{diag}(1,2,1)$. ההפרשים בערך
          מוחלט: $\frac1k$, $\frac1{k^2}$, ו-$\big|\frac k{k+1}-1\big|=\frac1{k+1}$. הגדול שבהם $\frac1k$, ולכן
          $\|D_k-D\|_p=\frac1k$ בשלוש הנורמות.
      - kind: computation
        text: >-
          $\frac1k<0.05$ שקול ל-$k>20$. ב-$k=20$ מתקבל $0.05$ בדיוק, ולכן $k$ הקטן ביותר הוא $21$.
      - kind: check
        text: >-
          חישוב ישיר של $\|D_{20}-D\|_2$ נותן $0.05$, ושל $\|D_{21}-D\|_p$ נותן $\frac1{21}\approx0.0476$.
      - kind: result
        text: >-
          $\|D\|_p=\max_i|d_i|$; מטריצות אלכסוניות מתכנסות בדיוק כשהאלכסון מתכנס; ב-(ג) $\|D_k-D\|_p=\frac1k$, ו-$k=21$.

  - id: W-1.9-06
    level: mid
    objectives: [OBJ-1.9-2]
    prompt: >-
      $R_\theta=\begin{pmatrix}\cos\theta&-\sin\theta\\\sin\theta&\cos\theta\end{pmatrix}$ היא הסיבוב בזווית $\theta$,
      ומודדים את $\mathbb{R}^2$ בנורמה האוקלידית.

      (א) הוכיחו ש-$\|R_\psi x\|_2=\|x\|_2$ לכל $x$ ו-$\psi$, והסיקו ש-$\|R_\psi B\|_2=\|B\|_2$ לכל מטריצה $B$ מגודל $2\times2$.

      (ב) הוכיחו ש-$R_\theta-I=2\sin\frac\theta2\,R_{\theta/2+\pi/2}$, והסיקו
      $$\|R_\theta-R_\varphi\|_2=2\Big|\sin\frac{\theta-\varphi}2\Big| .$$

      (ג) הסיקו ש-$R_{\theta_k}\to I$ בנורמת האופרטור אם ורק אם $\sin\frac{\theta_k}2\to0$. האם $\theta_k\to0$ הכרחי?
    answer: >-
      (ב) $\cos\theta-1=-2\sin^2\frac\theta2$ ו-$\sin\theta=2\sin\frac\theta2\cos\frac\theta2$. (ג) לא: $\theta_k=2\pi k+\frac1k$
      נותן $R_{\theta_k}=R_{1/k}\to I$ אף ש-$\theta_k\to\infty$.
    solution:
      - kind: idea
        text: >-
          סיבוב שומר על אורכים, ולכן אינו משנה נורמות של מטריצות שהוא מוכפל בהן. ההפרש $R_\theta-I$ הוא "סיבוב כפול
          מספר", ולכן הנורמה שלו היא המספר.
      - kind: computation
        text: >-
          (א) ל-$x=(x_1,x_2)$, $R_\psi x=(x_1\cos\psi-x_2\sin\psi,\ x_1\sin\psi+x_2\cos\psi)$. פותחים סוגריים; המכפלות
          המעורבות מתבטלות, ו-$\cos^2\psi+\sin^2\psi=1$, ולכן $\|R_\psi x\|_2^2=x_1^2+x_2^2$. לכן לכל $x$,
          $\|R_\psi Bx\|_2=\|Bx\|_2$, והסופרמום על כדור היחידה זהה: $\|R_\psi B\|_2=\|B\|_2$.
      - kind: computation
        text: >-
          (ב) נסמן $s=\sin\frac\theta2$ ו-$c=\cos\frac\theta2$. לפי נוסחאות הזווית הכפולה, $\cos\theta-1=-2s^2$
          ו-$\sin\theta=2sc$, ולכן
          $$R_\theta-I=\begin{pmatrix}-2s^2&-2sc\\2sc&-2s^2\end{pmatrix}=2s\begin{pmatrix}-s&-c\\c&-s\end{pmatrix}.$$
          המטריצה האחרונה היא $R_{\theta/2+\pi/2}$, כי $\cos(\frac\theta2+\frac\pi2)=-s$ ו-$\sin(\frac\theta2+\frac\pi2)=c$.
          לפי ההומוגניות ו-(א) עם $B=I$, $\|R_\theta-I\|_2=2|s|\,\|R_{\theta/2+\pi/2}\|_2=2|s|$.
      - kind: step
        text: >-
          לכל $\theta,\varphi$: $R_\varphi R_{\theta-\varphi}=R_\theta$ (נוסחאות החיבור של סינוס וקוסינוס), ולכן
          $R_\theta-R_\varphi=R_\varphi(R_{\theta-\varphi}-I)$. לפי (א) והצעד הקודם,
          $\|R_\theta-R_\varphi\|_2=\|R_{\theta-\varphi}-I\|_2=2\big|\sin\frac{\theta-\varphi}2\big|$.
      - kind: step
        text: >-
          (ג) לפי (ב), $\|R_{\theta_k}-I\|_2=2|\sin\frac{\theta_k}2|$, ולכן $R_{\theta_k}\to I$ אם ורק אם
          $\sin\frac{\theta_k}2\to0$. זה לא דורש $\theta_k\to0$: עם $\theta_k=2\pi k+\frac1k$,
          $\sin\frac{\theta_k}2=\sin(\pi k+\frac1{2k})=\pm\sin\frac1{2k}\to0$, ואכן $R_{\theta_k}=R_{1/k}\to I$, אף
          ש-$\theta_k\to\infty$.
      - kind: check
        text: >-
          חישוב ישיר: $\|R_{0.9}-R_{0.3}\|_2\approx0.5910=2\sin0.3$, ו-$\|R_{6\pi+1/3}-I\|_2\approx0.3318=2\sin\frac16$. וזה
          המספר שהאיור 1.9א מציג לסיבוב ב-$p=2$, $2\sin\frac1{2k}$: ב-$k=3$ הוא $0.3318$.
      - kind: result
        text: >-
          $\|R_\theta-R_\varphi\|_2=2|\sin\frac{\theta-\varphi}2|$; $R_{\theta_k}\to I$ בדיוק כש-$\theta_k$ מתקרבת לכפולות
          של $2\pi$, לא בהכרח ל-$0$.

  - id: W-1.9-07
    level: mid
    qualitative: true
    objectives: [OBJ-1.9-3]
    prompt: >-
      על $(C[0,1],\|\cdot\|_\infty)$ נגדיר, לכל $k\in\mathbb{N}$, את $(K_kf)(x)=f\big((1-\frac1k)x\big)$ ("כיווץ" של
      הגרף לעבר $0$).

      (א) הוכיחו ש-$K_k\in\mathcal{L}(C[0,1],C[0,1])$ ו-$\|K_k\|=1=\|I\|$.

      (ב) הוכיחו ש-$K_kf\to f$ במידה שווה לכל $f\in C[0,1]$, כלומר $K_k\to I$ נקודתית.

      (ג) הוכיחו ש-$\|K_k-I\|=2$ לכל $k\in\mathbb{N}$ (גם ל-$k=1$, שבו $K_1f$ היא הפונקציה הקבועה $f(0)$). מה מסיקים?
    answer: >-
      (ב) $f$ רציפה במידה שווה על $[0,1]$, והמרחק בין $x$ ל-$(1-\frac1k)x$ לכל היותר $\frac1k$. (ג) פונקציה ששווה
      $(-1)$ ב-$1-\frac1k$ ו-$1$ ב-$1$ נותנת $2$. מסקנה: התכנסות נקודתית, נורמות שוות, ואין התכנסות בנורמה.
    solution:
      - kind: idea
        text: >-
          לכל $f$ קבועה הכיווץ מזיז את הארגומנט ב-$\frac1k$ לכל היותר, ורציפות במידה שווה סוגרת את הפער. אבל לכל $k$
          יש בכדור היחידה פונקציה שמשנה את ערכה ב-$2$ בדיוק על הקטע $[1-\frac1k,1]$, והכיווץ מעביר אותה אל הערך הלא
          נכון.
      - kind: step
        text: >-
          (א) $x\mapsto(1-\frac1k)x$ רציפה ומעבירה את $[0,1]$ לתוך $[0,1]$, ולכן $K_kf$ רציפה (הרכבה, טענה 1.6.5).
          הלינאריות מיידית: $(af+bg)(tx)=af(tx)+bg(tx)$. לכל $x$, $|f((1-\frac1k)x)|\le\|f\|_\infty$, ולכן $\|K_k\|\le1$;
          ו-$f\equiv1$ נותנת $K_k1=1$, ולכן $\|K_k\|=1=\|I\|$.
      - kind: step
        text: >-
          (ב) תהי $f\in C[0,1]$ ו-$\varepsilon>0$. $f$ רציפה במידה שווה על הקטע הסגור $[0,1]$ (משפט קנטור, אינפי 1):
          יש $\delta>0$ כך ש-$|f(u)-f(v)|<\varepsilon$ כש-$|u-v|<\delta$. לכל $x\in[0,1]$,
          $\big|(1-\frac1k)x-x\big|=\frac xk\le\frac1k$. לכן לכל $k>\frac1\delta$ ולכל $x$,
          $|(K_kf)(x)-f(x)|<\varepsilon$, כלומר $\|K_kf-f\|_\infty\le\varepsilon$. ה-$k$ תלוי ב-$\delta$, כלומר ב-$f$.
      - kind: step
        text: >-
          (ג) חסם מלעיל: $\|K_k-I\|\le\|K_k\|+\|I\|=2$ (משפט 1.8.5). חסם מלרע: תהי
          $h_k(x)=\min\big(1,\ \max(-1,\ 2k(x-1)+1)\big)$. היא רציפה, $|h_k|\le1$, $h_k(1)=1$ ו-$h_k(1-\frac1k)=-1$. לכן
          $$\begin{aligned}\|K_kh_k-h_k\|_\infty&\ge|h_k(1-\tfrac1k)-h_k(1)|\\&=|-1-1|=2,\end{aligned}$$
          ו-$\|K_k-I\|\ge2$. יחד: $\|K_k-I\|=2$, מתקבלת ב-$h_k$. זה נכון לכל $k\in\mathbb{N}$, גם ל-$k=1$: אז
          $1-\frac1k=0$, $h_1(x)=\min(1,\max(-1,2x-1))=2x-1$, ו-$(K_1h_1-h_1)(1)=h_1(0)-h_1(1)=-2$.
      - kind: step
        text: >-
          מסקנה: $K_k\to I$ נקודתית, $\|K_k\|\to\|I\|$ (הן שוות), ובכל זאת $K_k$ אינה מתכנסת בנורמה לשום העתקה, כי
          הגבול בנורמה היה חייב להיות הגבול הנקודתי $I$ (טענה 1.9.3(ד)), והמרחק אליו $2$. זו דוגמה של טענה 1.9.4, אבל
          עם העתקות $C[0,1]\to C[0,1]$ ולא פונקציונלים.
      - kind: check
        text: >-
          עם $f=\sqrt x$ ו-$k=10$: $\|K_{10}f-f\|_\infty=1-\sqrt{0.9}\approx0.0513$, ב-$x=1$ (חישוב מספרי על רשת נותן אותו
          ערך). ועם $k=4$: $h_4(1)=1$ ו-$h_4(0.75)=-1$, הפרש $2$; חישוב מספרי של $\|K_kh_k-h_k\|_\infty$ על רשת נותן $2$
          ב-$k=1$, $2$ ו-$4$.
      - kind: result
        text: >-
          $\|K_k\|=1$, $K_k\to I$ נקודתית, ו-$\|K_k-I\|=2$: התכנסות נקודתית ונורמות מתכנסות בלי התכנסות בנורמה.

  - id: W-1.9-08
    level: exam
    qualitative: true
    objectives: [OBJ-1.9-3, OBJ-1.9-1]
    prompt: >-
      על $(C[0,1],\|\cdot\|_\infty)$ נגדיר, לכל $k\in\mathbb{N}$, את הפונקציונלים $\varphi_k(f)=\int_0^1x^kf(x)\,dx$
      ו-$\psi_k=(k+1)\varphi_k$, ונסמן $\operatorname{ev}_1(f)=f(1)$.

      (א) הוכיחו ש-$\|\varphi_k\|=\frac1{k+1}$, והסיקו ש-$\varphi_k\to0$ בנורמת האופרטור.

      (ב) הוכיחו ש-$\psi_k(f)\to f(1)$ לכל $f\in C[0,1]$.

      (ג) הוכיחו ש-$\|\psi_k-\operatorname{ev}_1\|=2$ לכל $k$, והסיקו ש-$(\psi_k)$ אינה מתכנסת בנורמת האופרטור לשום
      פונקציונל. (רמז לחסם מלרע: ל-$0<\eta<1$, הפונקציה ששווה 1 על $[0,1-\eta]$, $(-1)$ ב-1, ולינארית ביניהן.)
    answer: >-
      (א) $|\varphi_k(f)|\le\frac{\|f\|_\infty}{k+1}$, ושוויון ב-$f\equiv1$. (ב) ההפרש $\psi_k(f)-f(1)$ הוא האינטגרל על
      $[0,1]$ של $(k+1)x^k\big(f(x)-f(1)\big)$, ומפצלים את הקטע ליד 1. (ג) חסם מלעיל 2 מאי-שוויון המשולש; הפונקציות מהרמז נותנות לפחות $2(1-\eta)^{k+1}$.
      הגבול בנורמה היה חייב להיות הגבול הנקודתי $\operatorname{ev}_1$, והמרחק אליו 2.
    solution:
      - kind: idea
        text: >-
          המשקל $x^k$ מתרכז ליד 1 כש-$k$ גדל. בלי הנרמול, $\varphi_k$ פשוט קטן, ולכן מתכנס לאפס בנורמה. עם הנרמול
          $(k+1)$, $\psi_k$ הוא "ממוצע ליד 1", ולכן שואף ל-$f(1)$ לכל $f$; אבל לכל $k$ יש פונקציה רציפה שקופצת
          מ-1 ל-$(-1)$ בקטע קצר כל כך ליד 1, ש-$\psi_k$ עדיין לא "רואה" את הקפיצה.
      - kind: computation
        text: >-
          (א) $\varphi_k$ לינארי (לינאריות האינטגרל). לפי המונוטוניות של האינטגרל,
          $$\begin{aligned}|\varphi_k(f)|&\le\int_0^1x^k|f(x)|\,dx\\&\le\|f\|_\infty\int_0^1x^k\,dx\\&=\frac{\|f\|_\infty}{k+1},\end{aligned}$$
          ולפי טענה 1.8.4(א) $\|\varphi_k\|\le\frac1{k+1}$. ו-$f\equiv1$ מקיימת $\|f\|_\infty=1$ ו-$\varphi_k(1)=\frac1{k+1}$, ולכן לפי הגדרה
          1.8.3 $\|\varphi_k\|=\frac1{k+1}$. לכן $\|\varphi_k-0\|=\frac1{k+1}\to0$: לפי הגדרה 1.9.1, $\varphi_k\to0$
          ב-$\mathcal{L}(C[0,1],\mathbb{R})$.
      - kind: step
        text: >-
          (ב) תהי $f\in C[0,1]$. כי $(k+1)\int_0^1x^k\,dx=1$, אפשר לכתוב $f(1)$ כאינטגרל של $(k+1)x^kf(1)$ על
          $[0,1]$, ולכן ההפרש $\psi_k(f)-f(1)$ הוא האינטגרל על $[0,1]$ של $(k+1)x^k\big(f(x)-f(1)\big)$. יהי $\varepsilon>0$. $f$ רציפה ב-1, ולכן יש
          $\delta_0>0$ כך ש-$|f(x)-f(1)|<\frac\varepsilon2$ לכל $x\in[0,1]$ עם $|x-1|<\delta_0$. נבחר
          $\delta=\min\left(\frac{\delta_0}2,\frac12\right)$. אז $\delta\in(0,1)$, וכל $x\in[1-\delta,1]$ מקיים
          $|x-1|\le\delta<\delta_0$, ולכן $|f(x)-f(1)|<\frac\varepsilon2$ על כל הקטע הסגור $[1-\delta,1]$.
      - kind: computation
        text: >-
          מפצלים את האינטגרל ב-$1-\delta$. על $[1-\delta,1]$ האינטגרנד בערך מוחלט קטן מ-$\frac\varepsilon2(k+1)x^k$,
          ולכן החלק הזה קטן או שווה ל-$\frac\varepsilon2(k+1)\int_{1-\delta}^1x^k\,dx$. כאן **מגדילים בכוונה** את קטע
          האינטגרציה ל-$[0,1]$: $x^k\ge0$, ולכן $\int_{1-\delta}^1x^k\,dx$ קטן או שווה ל-$\int_0^1x^k\,dx=\frac1{k+1}$.
          ההגדלה חוסכת את חישוב האינטגרל על הקטע הקצר, ונותנת חסם נקי: החלק הזה קטן או שווה ל-$\frac\varepsilon2$.
          על $[0,1-\delta]$, $|f(x)-f(1)|\le2\|f\|_\infty$, ולכן החלק הזה לכל היותר
          $$\begin{aligned}&2\|f\|_\infty(k+1)\int_0^{1-\delta}x^k\,dx\\&\quad=2\|f\|_\infty(1-\delta)^{k+1}.\end{aligned}$$
          כי $0<1-\delta<1$, הביטוי האחרון שואף לאפס (אינפי 1), ולכן יש $K$ כך שלכל $k>K$ הוא קטן מ-$\frac\varepsilon2$.
          לכל $k>K$: $|\psi_k(f)-f(1)|<\varepsilon$.
      - kind: step
        text: >-
          (ג) חסם מלעיל. $\psi_k-\operatorname{ev}_1$ לינארי, ולכל $f$:
          $$\begin{aligned}&|\psi_k(f)-f(1)|\\&\quad\le(k+1)\int_0^1x^k|f(x)|\,dx\\&\qquad+|f(1)|\\&\quad\le\|f\|_\infty+\|f\|_\infty .\end{aligned}$$
          לפי טענה 1.8.4(א),
          $\|\psi_k-\operatorname{ev}_1\|\le2$.
      - kind: computation
        text: >-
          חסם מלרע. ל-$0<\eta<1$ תהי $h_\eta$ הפונקציה מהרמז: רציפה, $|h_\eta|\le1$, $h_\eta(1)=-1$, ולכן
          $\|h_\eta\|_\infty=1$. נסמן $a=(1-\eta)^{k+1}$. אז $(k+1)\int_0^{1-\eta}x^k\,dx=a$,
          ו-$(k+1)\int_{1-\eta}^1x^k\,dx=1-a$. על $[0,1-\eta]$ הפונקציה $h_\eta$ היא 1, ועל $[1-\eta,1]$ היא לפחות
          $(-1)$; כי $x^k\ge0$, לפי המונוטוניות של האינטגרל $\psi_k(h_\eta)\ge a-(1-a)$, כלומר $\psi_k(h_\eta)\ge2a-1$.
      - kind: computation
        text: >-
          עכשיו מחסירים את $h_\eta(1)$. כי $h_\eta(1)=-1$, להחסיר אותו פירושו להוסיף 1: ההפרש
          $\psi_k(h_\eta)-h_\eta(1)$ שווה ל-$\psi_k(h_\eta)+1$. לפי הצעד הקודם הוא לפחות $(2a-1)+1=2a$, כלומר לפחות
          $2(1-\eta)^{k+1}$.
      - kind: step
        text: >-
          לפי הגדרה 1.8.3, $\|\psi_k-\operatorname{ev}_1\|\ge2(1-\eta)^{k+1}$ לכל $\eta\in(0,1)$. עבור $k$ קבוע,
          $(1-\eta)^{k+1}\to1$ כש-$\eta\to0^+$ (רציפות של פולינום), ולכן $\|\psi_k-\operatorname{ev}_1\|\ge2$, ויחד עם
          החסם מלעיל, $\|\psi_k-\operatorname{ev}_1\|=2$.
      - kind: step
        text: >-
          אין גבול בנורמה. נניח ש-$\psi_k\to S$ ב-$\mathcal{L}(C[0,1],\mathbb{R})$. לפי (ב), $\psi_k$ מתכנסת נקודתית
          ל-$\operatorname{ev}_1$, ולפי טענה 1.9.3(ד) $S=\operatorname{ev}_1$. אבל $\|\psi_k-\operatorname{ev}_1\|=2$ לכל
          $k$, ואינו שואף לאפס: סתירה.
      - kind: check
        text: >-
          מספרית, עם $\eta=0.01$: ל-$k=3$ מתקבל $\psi_3(h_\eta)-h_\eta(1)\approx1.960$, מעל החסם
          $2\cdot0.99^4\approx1.921$; ל-$k=10$ ו-$\eta=0.001$: $\approx1.989$, מעל $2\cdot0.999^{11}\approx1.978$. ול-$f(x)=\cos3x$,
          $\psi_{1000}(f)\approx-0.9896$, קרוב ל-$\cos3\approx-0.9900$. השוו לטענה 1.9.4: שם הנורמה 2 מתקבלת, וכאן היא
          רק גבול (כל $h$ שמשיגה 2 הייתה צריכה להיות 1 על $[0,1)$ ו-$(-1)$ ב-1). ובמטריצות זה לא יכול לקרות: התכנסות
          נקודתית שם היא התכנסות בנורמה (משפט 1.9.7).
      - kind: result
        text: >-
          (א) $\|\varphi_k\|=\frac1{k+1}\to0$, ו-$\varphi_k\to0$ בנורמת האופרטור. (ב) $\psi_k\to\operatorname{ev}_1$
          נקודתית. (ג) $\|\psi_k-\operatorname{ev}_1\|=2$ לכל $k$, ולכן $(\psi_k)$ אינה מתכנסת בנורמת האופרטור.

  - id: W-1.9-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.9-3, OBJ-1.9-1]
    prompt: >-
      נמדוד הפעם את $C[0,1]$ ב**נורמת האינטגרל** $\|f\|_1=\int_0^1|f|$, ונגדיר $(M_kf)(x)=x^kf(x)$.

      (א) הוכיחו ש-$M_k\in\mathcal{L}\big((C[0,1],\|\cdot\|_1),(C[0,1],\|\cdot\|_1)\big)$ ו-$\|M_k\|\le1$.

      (ב) הוכיחו ש-$\|M_kf\|_1\to0$ לכל $f\in C[0,1]$.

      (ג) הוכיחו ש-$\|M_k\|=1$ לכל $k$, והסיקו ש-$(M_k)$ מתכנסת נקודתית ואינה מתכנסת בנורמת האופרטור.

      (ד) השוו לדוגמה 5 בשיעור: שם, בנורמת הסופרמום, התכנסות נקודתית של העתקות כפל גררה התכנסות בנורמה. מה השתנה?
    answer: >-
      (ב) $\|M_kf\|_1\le\frac{\|f\|_\infty}{k+1}$. (ג) פונקציה שמרוכזת על $[1-\eta,1]$ נותנת יחס לפחות $(1-\eta)^k$. (ד)
      בנורמת האינטגרל הפונקציה $1$ כבר אינה משיגה את הנורמה: $\|M_k1\|_1=\frac1{k+1}$ ואילו $\|M_k\|=1$.
    solution:
      - kind: idea
        text: >-
          $x^k$ קטן בכל הקטע פרט לקצה הימני. פונקציה קבועה מראש "מתפזרת" על כל הקטע, ולכן $M_kf$ קטנה בנורמת
          האינטגרל. אבל פונקציה שמרוכזת ליד $1$ כמעט לא מושפעת מהכפל, ובנורמת האינטגרל מותר לה להיות גבוהה ודקה.
      - kind: step
        text: >-
          (א) $x^kf$ רציפה, והכפל לינארי. $0\le x^k\le1$ על $[0,1]$, ולכן $|x^kf(x)|\le|f(x)|$, ולפי המונוטוניות של
          האינטגרל $\|M_kf\|_1\le\|f\|_1$. לפי טענה 1.8.4(א) $\|M_k\|\le1$.
      - kind: computation
        text: >-
          (ב) $f$ רציפה, ולכן $\|f\|_\infty<\infty$ (ויירשטראס, אינפי 1), ו-
          $$\|M_kf\|_1=\int_0^1x^k|f(x)|\,dx\le\|f\|_\infty\int_0^1x^k\,dx=\frac{\|f\|_\infty}{k+1}\to0 .$$
          כלומר $M_k\to0$ נקודתית. (החסם משתמש ב-$\|f\|_\infty$, לא ב-$\|f\|_1$: הקצב תלוי ב-$f$.)
      - kind: computation
        text: >-
          (ג) ל-$0<\eta<1$ תהי $f_\eta(x)=\max\big(0,\ x-(1-\eta)\big)$: רציפה, אפס על $[0,1-\eta]$, ו-$\|f_\eta\|_1=\frac{\eta^2}2>0$
          (שטח משולש). על $[1-\eta,1]$ מתקיים $x^k\ge(1-\eta)^k$, ולכן לפי המונוטוניות
          $$\|M_kf_\eta\|_1=\int_{1-\eta}^1x^kf_\eta\ge(1-\eta)^k\|f_\eta\|_1 .$$
          לפי טענה 1.8.4(ב) $\|M_k\|\ge(1-\eta)^k$ לכל $\eta\in(0,1)$, ו-$(1-\eta)^k\to1$ כש-$\eta\to0^+$. לכן $\|M_k\|\ge1$,
          ויחד עם (א) $\|M_k\|=1$.
      - kind: step
        text: >-
          לפי (ב) $M_k\to0$ נקודתית. אילו $M_k\to S$ בנורמה, לפי טענה 1.9.3(ד) $S=0$, אבל $\|M_k-0\|=1$ לכל $k$: סתירה.
      - kind: step
        text: >-
          (ד) בדוגמה 5 הפונקציה הקבועה $1$ משיגה את הנורמה של **כל** העתקת כפל, $\|M_g1\|_\infty=\|g\|_\infty=\|M_g\|$,
          ולכן התכנסות בווקטור הקבוע הזה מספיקה. בנורמת האינטגרל זה נשבר: $\|M_k1\|_1=\frac1{k+1}$ ו-$\|M_k\|=1$, והעדים
          $f_\eta$ שמשיגים כמעט את הנורמה צריכים להתרכז ליד $1$ יותר ויותר. (ובנורמת הסופרמום $M_k$ אפילו אינה
          מתכנסת נקודתית: $M_k1=x^k$ אינה מתכנסת ב-$C[0,1]$.) אותה סדרת העתקות, נורמה אחרת, תמונה אחרת.
      - kind: check
        text: >-
          מספרית (שיטת סימפסון), עם $k=10$: ל-$\eta=0.1$ היחס $\frac{\|M_kf_\eta\|_1}{\|f_\eta\|_1}\approx0.731$, מעל
          $0.9^{10}\approx0.349$; ל-$\eta=0.01$ הוא $\approx0.967$, מתקרב ל-1. ו-$\|x^{10}\|_1=\frac1{11}\approx0.0909$.
      - kind: result
        text: >-
          $M_k\to0$ נקודתית ו-$\|M_k\|=1$ לכל $k$: אין התכנסות בנורמה. ההבדל מדוגמה 5 הוא הנורמה על התחום.

  - id: W-1.9-10
    level: exam
    objectives: [OBJ-1.9-2, OBJ-1.9-1]
    prompt: >-
      $A_k$ ו-$A$ מטריצות $n\times n$, $A_k\to A$ בנורמת האופרטור (באחת מהנורמות 1, 2, אינסוף), ו-$A$ הפיכה.

      (א) הוכיחו ש-$\det A_k\to\det A$, ושיש $K$ כך ש-$A_k$ הפיכה לכל $k>K$.

      (ב) הוכיחו ש-$A_k^{-1}\to A^{-1}$ בנורמת האופרטור.

      (ג) $A_k=\begin{pmatrix}2&\frac1k\\\frac1k&1\end{pmatrix}$. חשבו את $\|A_k^{-1}-A^{-1}\|_\infty$ בדיוק.

      (ד) הראו שבלי ההנחה ש-$A$ הפיכה (ב) נכשל, גם כשכל $A_k$ הפיכות.
    answer: >-
      (א) הדטרמיננטה פולינום בכניסות. (ב) $A_k^{-1}=\frac1{\det A_k}\operatorname{adj}A_k$ וטענה 1.9.5. (ג)
      $\frac{k+1}{2k^2-1}$. (ד) $A_k=\frac1kI\to0$ ו-$A_k^{-1}=kI$.
    solution:
      - kind: idea
        text: >-
          לפי טענה 1.9.5 התכנסות בנורמה היא התכנסות של הכניסות, ולכן כל ביטוי רציף בכניסות מתכנס. הדטרמיננטה
          וכניסות ההפכית (לפי נוסחת המטריצה המצורפת) הן ביטויים כאלה, כל עוד לא מחלקים באפס.
      - kind: step
        text: >-
          (א) לפי טענה 1.9.5(ב) כל כניסה של $A_k$ שואפת לכניסה המתאימה של $A$. $\det A_k$ הוא סכום סופי של מכפלות של
          כניסות (הנוסחה המפורשת של הדטרמיננטה, אלגברה לינארית 1), ולפי אריתמטיקה של גבולות $\det A_k\to\det A$.
          $\det A\ne0$; עם $\varepsilon=\frac{|\det A|}2$ יש $K$ כך ש-$|\det A_k-\det A|<\frac{|\det A|}2$ לכל $k>K$,
          ולכן $|\det A_k|>\frac{|\det A|}2>0$, ו-$A_k$ הפיכה.
      - kind: step
        text: >-
          (ב) לכל מטריצה הפיכה $B$, $B^{-1}=\frac1{\det B}\operatorname{adj}B$, וכניסות $\operatorname{adj}B$ הן (עד סימן)
          דטרמיננטות של תת-מטריצות $(n-1)\times(n-1)$, כלומר שוב פולינומים בכניסות. לכן ל-$k>K$ כל כניסה של $A_k^{-1}$
          היא הכניסה המתאימה של $\operatorname{adj}A_k$ חלקי $\det A_k$. המונה שואף לכניסה המתאימה של
          $\operatorname{adj}A$ (אריתמטיקה של גבולות, כמו ב-(א)), והמכנה שואף ל-$\det A\ne0$. לפי אריתמטיקה של גבולות
          של מנה, הכניסה של $A_k^{-1}$ שואפת לכניסה המתאימה של $\frac1{\det A}\operatorname{adj}A=A^{-1}$. לפי טענה 1.9.5(ב), $A_k^{-1}\to A^{-1}$ בנורמה.
      - kind: computation
        text: >-
          (ג) $A=\operatorname{diag}(2,1)$, $A^{-1}=\operatorname{diag}(\frac12,1)$. $\det A_k=2-\frac1{k^2}=\frac{2k^2-1}{k^2}$, ו-
          $$A_k^{-1}=\frac{k^2}{2k^2-1}\begin{pmatrix}1&-\frac1k\\-\frac1k&2\end{pmatrix}.$$
          הכניסות של $A_k^{-1}-A^{-1}$: $\frac{k^2}{2k^2-1}-\frac12=\frac1{2(2k^2-1)}$; מחוץ לאלכסון $-\frac{k}{2k^2-1}$;
          ו-$\frac{2k^2}{2k^2-1}-1=\frac1{2k^2-1}$.
      - kind: computation
        text: >-
          סכומי השורות בערך מוחלט: $\frac{k+\frac12}{2k^2-1}$ ו-$\frac{k+1}{2k^2-1}$. לפי משפט 1.8.9
          $\|A_k^{-1}-A^{-1}\|_\infty=\frac{k+1}{2k^2-1}$, שהוא בערך $\frac1{2k}$ ל-$k$ גדול.
      - kind: step
        text: >-
          (ד) $A_k=\frac1kI$ הפיכות, ו-$\|A_k-0\|=\frac1k\to0$, אבל $A_k^{-1}=kI$ ו-$\|kI\|=k\to\infty$, ולכן לפי טענה
          1.9.3(ג) $A_k^{-1}$ אינה מתכנסת בנורמה לשום מטריצה. הגבול $0$ אינו הפיך, וזה בדיוק המקום שבו (א) חילק ב-$\det A$.
      - kind: check
        text: >-
          עם $k=10$: היפוך מספרי של $A_{10}$ נותן $\begin{pmatrix}0.5025&-0.0503\\-0.0503&1.0050\end{pmatrix}$, ונורמת
          אינסוף של ההפרש $\approx0.05528$, כמו $\frac{11}{199}$.
      - kind: result
        text: >-
          כש-$A$ הפיכה, $A_k$ הפיכות מ-$K$ מסוים ו-$A_k^{-1}\to A^{-1}$; ב-(ג) $\|A_k^{-1}-A^{-1}\|_\infty=\frac{k+1}{2k^2-1}$;
          בלי הפיכות של $A$ זה נכשל.

challenge:
  - id: W-1.9-c1
    stars: 1
    objectives: [OBJ-1.9-3, OBJ-1.9-1]
    prompt: >-
      נסמן ב-$\ell^2$ את מרחב הסדרות הממשיות $\xi=(\xi_1,\xi_2,\dots)$ עם $\sum_j\xi_j^2<\infty$, עם הנורמה
      $\|\xi\|_2=\big(\sum_j\xi_j^2\big)^{1/2}$ (הניחו שזה מרחב נורמי: אי-שוויון המשולש עובר מ-$\mathbb{R}^n$ לגבול של
      סכומים חלקיים). לכל $n\in\mathbb{N}$ נגדיר $T_n,S_n:\ell^2\to\ell^2$ על ידי
      $$T_n\xi=\tfrac1n\,\xi,\qquad S_n\xi=(0,\dots,0,\ \xi_{n+1},\ \xi_{n+2},\dots),$$
      כלומר $S_n$ מאפסת את $n$ האיברים הראשונים של הסדרה ומשאירה את השאר.

      (א) הוכיחו ש-$T_n\to0$ בנורמת האופרטור.

      (ב) הוכיחו ש-$S_n$ לינארית וחסומה, $\|S_n\|=1$, ו-$S_n\to0$ נקודתית.

      (ג) הוכיחו ש-$(S_n)$ אינה מתכנסת בנורמת האופרטור לשום איבר של $\mathcal{L}(\ell^2,\ell^2)$.
    answer: >-
      (א) $\|T_n\|=\frac1n\to0$. (ב) $\|S_n\xi\|_2^2=\sum_{j>n}\xi_j^2\le\|\xi\|_2^2$, ו-$e_{n+1}$ משיג; הזנב של טור מתכנס
      שואף ל-$0$. (ג) הגבול בנורמה היה חייב להיות הגבול הנקודתי $0$, אבל $\|S_n-0\|=1$ לכל $n$.
    solution:
      - kind: given
        text: >-
          $T_n$ מכווצת כל סדרה פי $n$; $S_n$ "חותכת" את $n$ האיברים הראשונים. שתיהן העתקות $\ell^2\to\ell^2$.
      - kind: goal
        text: >-
          $T_n\to0$ בנורמה; $\|S_n\|=1$ ו-$S_n\to0$ נקודתית; ואין ל-$(S_n)$ גבול בנורמה.
      - kind: idea
        text: >-
          $T_n$ מקטינה **כל** וקטור באותו יחס, ולכן היא קטנה על כל כדור היחידה בבת אחת. $S_n$ משאירה רק את הזנב של
          הסדרה: לכל $\xi$ קבועה הזנב שואף לאפס, אבל לכל $n$ יש וקטור, $e_{n+1}$, שכל המשקל שלו בזנב, ו-$S_n$ אינה
          מקטינה אותו כלל.
      - kind: step
        text: >-
          (א) $T_n$ לינארית, ו-$\|T_n\xi\|_2=\frac1n\|\xi\|_2$ לכל $\xi$ (הומוגניות). לכן לפי טענה 1.8.4(א)
          $\|T_n\|\le\frac1n$, ו-$\xi=e_1=(1,0,0,\dots)$ נותן שוויון, כלומר $\|T_n-0\|=\frac1n\to0$: לפי הגדרה 1.9.1,
          $T_n\to0$ בנורמת האופרטור.
      - kind: step
        text: >-
          (ב) לינאריות: כל רכיב של $S_n\xi$ הוא $0$ או רכיב של $\xi$. חסימות: לכל $\xi\in\ell^2$,
          $\|S_n\xi\|_2^2=\sum_{j>n}\xi_j^2\le\sum_j\xi_j^2=\|\xi\|_2^2$. בפרט $S_n\xi\in\ell^2$, ולפי טענה 1.8.4(א)
          $\|S_n\|\le1$. ונסמן ב-$e_m$ את הסדרה שבמקום ה-$m$ שלה $1$ ובשאר המקומות $0$: $\|e_{n+1}\|_2=1$
          ו-$S_ne_{n+1}=e_{n+1}$, ולכן $\|S_n\|=1$.
      - kind: step
        text: >-
          נקודתית: תהי $\xi\in\ell^2$. $\|S_n\xi\|_2^2=\sum_{j>n}\xi_j^2$ הוא הזנב של הטור המתכנס $\sum_j\xi_j^2$,
          כלומר $\sum_j\xi_j^2$ פחות הסכום החלקי ה-$n$. הסכומים החלקיים שואפים לסכום הטור, ולכן הזנב שואף ל-$0$ (אינפי
          1), ו-$\|S_n\xi-0\|_2\to0$. ה-$n$ הדרוש תלוי ב-$\xi$: ככל שהזנב של $\xi$ "כבד" יותר, צריך $n$ גדול יותר.
      - kind: step
        text: >-
          (ג) נניח בשלילה ש-$S_n\to S$ ב-$\mathcal{L}(\ell^2,\ell^2)$. לפי (ב) $S_n$ מתכנסת נקודתית להעתקת האפס, ולפי
          טענה 1.9.3(ד) $S=0$. אבל $\|S_n-0\|=\|S_n\|=1$ לכל $n$, ואינו שואף לאפס: סתירה. העד $e_{n+1}$ משתנה עם
          $n$, כמו $g_k$ בטענה 1.9.4.
      - kind: check
        text: >-
          עם $\xi_j=2^{-(j-1)}$, כלומר $\xi=(1,\frac12,\frac14,\dots)$: $\|\xi\|_2^2=\sum_{j\ge1}4^{-(j-1)}=\frac43$,
          ו-$\|S_n\xi\|_2^2=\sum_{j>n}4^{-(j-1)}=\frac43\cdot4^{-n}$, כלומר $\|S_n\xi\|_2=\frac{2}{\sqrt3}\,2^{-n}$. חישוב
          מספרי (200 איברים) נותן $\|\xi\|_2\approx1.1547$, ו-$\|S_n\xi\|_2\approx0.5774$, $0.1443$ ו-$0.001128$ ל-$n=1$,
          $3$ ו-$10$, כמו הנוסחה. ו-$\|S_ne_{n+1}\|_2=1$ לכל $n$: נקודתית לאפס, ונורמה $1$.
      - kind: result
        text: >-
          $T_n\to0$ בנורמה ($\|T_n\|=\frac1n$); $\|S_n\|=1$ ו-$S_n\to0$ נקודתית; ל-$(S_n)$ אין גבול בנורמת האופרטור.
    source:
      name: 'SISSA and University of Trieste, LM in Mathematics, Functional Analysis (A. Maspero), Sheet 1 (SS 21): Bounded and compact operators'
      year: 2021
      problem: 'Exercise 3(a)-(b)'
      url: 'https://people.sissa.it/~amaspero/teaching/functional%20analysis/exercises/Sheet_1.pdf'
      verified: '2026-11-17'
      adapted: true

  - id: W-1.9-c2
    stars: 1
    objectives: [OBJ-1.9-3, OBJ-1.9-1]
    prompt: >-
      על $(C[0,1],\|\cdot\|_\infty)$ נגדיר, לכל $n\in\mathbb{N}$, את הממוצע ליד $0$:
      $$L_n(f)=n\int_0^{1/n}f(t)\,dt .$$

      (א) הוכיחו ש-$L_n$ פונקציונל לינארי חסום ו-$\|L_n\|=1$.

      (ב) הוכיחו ש-$L_n(f)\to f(0)$ לכל $f\in C[0,1]$.

      (ג) הוכיחו ש-$\|L_n-L_{2n}\|=1$ לכל $n$, והסיקו, **בלי** לזהות את הגבול, ש-$(L_n)$ אינה מתכנסת בנורמת האופרטור.
    answer: >-
      (א) $|L_n f|\le\|f\|_\infty$, ו-$f\equiv1$ משיגה. (ב) $|L_nf-f(0)|\le\max_{[0,1/n]}|f-f(0)|\to0$. (ג) חסם מלעיל 1;
      פונקציה ששווה $(-1)$ עד $\frac1{2n}-\eta$ ו-$1$ מ-$\frac1{2n}+\eta$ נותנת $1-n\eta$. אילו $L_n\to L$, אז
      $\|L_n-L_{2n}\|\le\|L_n-L\|+\|L-L_{2n}\|\to0$.
    solution:
      - kind: given
        text: >-
          $L_n$ הוא הממוצע של $f$ על $[0,\frac1n]$.
      - kind: goal
        text: >-
          נורמה, התכנסות נקודתית, וההפרש בין $L_n$ ל-$L_{2n}$.
      - kind: idea
        text: >-
          כל $L_n$ "רואה" רק את הקטע $[0,\frac1n]$. ההפרש $L_n-L_{2n}$ משווה את הממוצע על החצי הימני של הקטע לממוצע
          על החצי השמאלי, ופונקציה שקופצת מ-$(-1)$ ל-$1$ באמצע הקטע מבדילה ביניהם. ואם הסדרה הייתה מתכנסת, איבריה
          היו מתקרבים זה לזה.
      - kind: step
        text: >-
          (א) לינאריות האינטגרל. לפי המונוטוניות, $|L_nf|\le n\int_0^{1/n}|f|\le n\cdot\frac1n\|f\|_\infty=\|f\|_\infty$, ולכן
          $\|L_n\|\le1$; ו-$L_n(1)=1$, ולכן $\|L_n\|=1$.
      - kind: step
        text: >-
          (ב) כי $n\int_0^{1/n}f(0)\,dt=f(0)$, ההפרש $L_nf-f(0)$ הוא $n\int_0^{1/n}\big(f(t)-f(0)\big)\,dt$, ולכן בערך מוחלט
          לכל היותר $\max_{t\in[0,1/n]}|f(t)-f(0)|$. יהי $\varepsilon>0$; $f$ רציפה ב-$0$, ולכן יש $\delta>0$ עם
          $|f(t)-f(0)|<\varepsilon$ כש-$t<\delta$. לכל $n>\frac1\delta$ כל $t\in[0,\frac1n]$ מקיים $t<\delta$, ולכן
          $|L_nf-f(0)|<\varepsilon$ (המקסימום מתקבל, ויירשטראס).
      - kind: computation
        text: >-
          (ג) חסם מלעיל. $L_nf=n\int_0^{1/(2n)}f+n\int_{1/(2n)}^{1/n}f$ ו-$L_{2n}f=2n\int_0^{1/(2n)}f$, ולכן
          $(L_n-L_{2n})f=n\int_{1/(2n)}^{1/n}f-n\int_0^{1/(2n)}f$. כל אחד משני האינטגרלים, בערך מוחלט, לכל היותר $\frac1{2n}\|f\|_\infty$, ולכן
          $|(L_n-L_{2n})f|\le\|f\|_\infty$, ו-$\|L_n-L_{2n}\|\le1$.
      - kind: computation
        text: >-
          חסם מלרע. ל-$0<\eta<\frac1{2n}$ נסמן $a=\frac1{2n}$, ותהי $f_\eta$ שווה ל-$(-1)$ על $[0,a-\eta]$, ל-$1$ על
          $[a+\eta,1]$, ולינארית ביניהן. היא רציפה ו-$\|f_\eta\|_\infty=1$. על $[a-\eta,a]$ היא עולה לינארית מ-$(-1)$ ל-$0$,
          עם אינטגרל $-\frac\eta2$, ולכן $\int_0^af_\eta=-(a-\eta)-\frac\eta2=-a+\frac\eta2$; בסימטריה
          $\int_a^{2a}f_\eta=a-\frac\eta2$. לכן
          $$(L_n-L_{2n})f_\eta=n\Big(a-\frac\eta2\Big)-n\Big(-a+\frac\eta2\Big)=2na-n\eta=1-n\eta .$$
          לפי הגדרה 1.8.3 $\|L_n-L_{2n}\|\ge1-n\eta$ לכל $\eta$ כזה, ולכן $\|L_n-L_{2n}\|\ge1$, ויחד: $=1$.
      - kind: step
        text: >-
          אילו $L_n\to L$ בנורמת האופרטור, אז גם $L_{2n}\to L$ (תת-סדרה, טענה 1.5.4), ולפי אי-שוויון המשולש
          $\|L_n-L_{2n}\|\le\|L_n-L\|+\|L-L_{2n}\|\to0$, בסתירה ל-$\|L_n-L_{2n}\|=1$. לא היה צורך לדעת שהגבול הנקודתי
          הוא $\operatorname{ev}_0$.
      - kind: check
        text: >-
          אינטגרציה מספרית (סימפסון) עם $n=3$, $\eta=0.01$ נותנת $(L_3-L_6)f_\eta=0.97=1-3\cdot0.01$, ועם $n=5$, $\eta=0.02$
          נותנת $0.9$. ו-$L_{50}(\cos3t)\approx0.9994$, קרוב ל-$\cos0=1$. השוו לטענה 1.9.4: גם כאן הגבול הנקודתי הוא
          $\operatorname{ev}_0$, אבל כאן ההוכחה שאין גבול בנורמה אינה צריכה אותו.
      - kind: result
        text: >-
          $\|L_n\|=1$, $L_n\to\operatorname{ev}_0$ נקודתית, $\|L_n-L_{2n}\|=1$, ולכן אין התכנסות בנורמה.
    source:
      name: 'University of Bristol, Functional Analysis MATH 36202/M6202 (A. Gorodnik, L. Palmisano), 2016/17, Problem Set 8'
      year: 2017
      problem: 'Problem 3'
      url: 'https://math.uzh.ch/gorodnik/fa17/FTex8.pdf'
      verified: '2026-11-17'
      adapted: true
