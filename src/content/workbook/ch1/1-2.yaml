# Workbook of lesson 1.2 — normed spaces and inner products.
# Objectives (src/course.ts):
#   OBJ-1.2-1  define a norm, show every norm induces a metric, recognise a metric that comes from no norm
#   OBJ-1.2-2  compute the 1-, 2- and ∞-norms on R^n and draw their unit balls
#   OBJ-1.2-3  norms from an inner product; decide by the parallelogram law
#   OBJ-1.2-4  the sup norm and the integral norm on C[a,b]
# Citations use the lesson's numbering (1.2.1–1.2.21) and the chapter spine for lesson 1.1 (1.1.1–1.1.12).
# The lesson proves Minkowski (1.2.10) and the converse of the parallelogram law (1.2.17): no problem here asks for
# either; the challenges ask for what the lesson does not prove (comparison of p-norms, the complex case).
# Numbers recomputed with src/math/multivar.ts (pNorm, simpson) and ad-hoc npx tsx scripts.
lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    objectives: [OBJ-1.2-2]
    prompt: >-
      חשבו את $\|x\|_1$, $\|x\|_2$ ו-$\|x\|_\infty$ עבור $x=(1,-2,2,-4)\in\mathbb{R}^4$, ובדקו את אי-שוויון הלדר
      (משפט 1.2.9) עם $p=q=2$ עבור $x$ ו-$y=(1,1,1,1)$.
    answer: >-
      $\|x\|_1=9$, $\|x\|_2=5$, $\|x\|_\infty=4$; הלדר: $9\le5\cdot2=10$.
    solution:
      - kind: definition
        text: >-
          $\|x\|_1=\sum|x_i|$ (טענה 1.2.6), $\|x\|_2=\big(\sum x_i^2\big)^{1/2}$ (הגדרה 1.2.7), $\|x\|_\infty=\max|x_i|$.
          הערכים המוחלטים של הקואורדינטות הם $1,2,2,4$.
      - kind: computation
        text: >-
          $\|x\|_1=1+2+2+4=9$. $\|x\|_2=\sqrt{1+4+4+16}=\sqrt{25}=5$. $\|x\|_\infty=\max(1,2,2,4)=4$.
      - kind: computation
        text: >-
          הלדר עם $p=q=2$: $\sum_i|x_iy_i|=\sum_i|x_i|=9$, ו-$\|x\|_2\|y\|_2=5\cdot\sqrt4=10$. אכן $9\le10$.
      - kind: check
        text: >-
          למה 1.1.6 (עם $y=0$) דורשת $\|x\|_\infty\le\|x\|_2\le\|x\|_1\le4\|x\|_\infty$: $4\le5\le9\le16$. מתקיימת.
      - kind: result
        text: >-
          $9$, $5$, $4$; ו-$9\le10$.

  - id: W-1.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      שרטטו במישור את כדורי היחידה הסגורים $K_1=\{\|x\|_1\le1\}$, $K_2=\{\|x\|_2\le1\}$ ו-$K_\infty=\{\|x\|_\infty\le1\}$.
      לכל אחת מהנקודות $(0.5,\ 0.5)$, $(0.7,\ 0.6)$, $(1,0)$ קבעו לאילו מהכדורים היא שייכת.
    answer: >-
      $(0.5,0.5)$ ו-$(1,0)$ בשלושתם (על השפה של $K_1$); $(0.7,0.6)$ ב-$K_2$ וב-$K_\infty$, לא ב-$K_1$.
    solution:
      - kind: step
        text: >-
          $K_1$ הוא המעוין עם קודקודים $(\pm1,0)$, $(0,\pm1)$; $K_2$ העיגול; $K_\infty$ הריבוע $[-1,1]\times[-1,1]$.
          לפי למה 1.1.6, $\|x\|_\infty\le\|x\|_2\le\|x\|_1$, ולכן $K_1\subseteq K_2\subseteq K_\infty$.
      - kind: computation
        text: >-
          $(0.5,0.5)$: $\|\cdot\|_1=1$, $\|\cdot\|_2\approx0.707$, $\|\cdot\|_\infty=0.5$. כולם לכל היותר 1, ולכן
          בשלושת הכדורים; על השפה של המעוין.
      - kind: computation
        text: >-
          $(0.7,0.6)$: $\|\cdot\|_1=1.3>1$, $\|\cdot\|_2=\sqrt{0.85}\approx0.922$, $\|\cdot\|_\infty=0.7$. לכן מחוץ
          למעוין, בעיגול ובריבוע.
      - kind: computation
        text: >-
          $(1,0)$: שלוש הנורמות שוות 1. היא בשלושת הכדורים, על השפה של כולם: הקודקוד של המעוין נוגע בעיגול ובריבוע.
      - kind: check
        text: >-
          התוצאות מתאימות להכלות: אף נקודה אינה ב-$K_1$ בלי להיות ב-$K_2$, ואף אחת אינה ב-$K_2$ בלי להיות ב-$K_\infty$.
      - kind: result
        text: >-
          $(0.5,0.5)$ ו-$(1,0)$ בכל השלושה; $(0.7,0.6)$ רק ב-$K_2$ וב-$K_\infty$.

  - id: W-1.2-03
    level: basic
    objectives: [OBJ-1.2-4]
    prompt: >-
      חשבו את $\|f\|_\infty$ ואת $\|f\|_1$ עבור $f(x)=\sin x$ ב-$C[0,2\pi]$, ובדקו את טענה 1.2.21(א).
    answer: >-
      $\|f\|_\infty=1$, $\|f\|_1=4$.
    solution:
      - kind: computation
        text: >-
          $|\sin x|\le1$, ושוויון ב-$x=\frac\pi2$. לכן המקסימום של טענה 1.2.18 הוא $\|f\|_\infty=1$.
      - kind: computation
        text: >-
          על הקטע $[0,\pi]$ מתקיים $\sin x\ge0$, ועל $[\pi,2\pi]$ מתקיים $\sin x\le0$. לכן
          $\|f\|_1=\int_0^\pi\sin x\,dx-\int_\pi^{2\pi}\sin x\,dx=2-(-2)=4$.
      - kind: check
        text: >-
          בלי ערך מוחלט $\int_0^{2\pi}\sin x\,dx=0$, אף ש-$f\ne0$: לכן צריך את $|f|$. ו-$4\le(2\pi-0)\cdot1\approx6.28$,
          כמו שטענה 1.2.21(א) דורשת.
      - kind: result
        text: >-
          $\|f\|_\infty=1$, $\|f\|_1=4$.

  - id: W-1.2-04
    level: mid
    objectives: [OBJ-1.2-1]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי.

      (א) הוכיחו שלכל $x,y\in V$ עם $x\ne0$ ו-$y\ne0$:
      $\Big\|\frac{x}{\|x\|}-\frac{y}{\|y\|}\Big\|\le\frac{2\|x-y\|}{\|x\|}$.

      (ב) הראו שהקבוע $2$ אינו ניתן להחלפה ב-$1$: מצאו $x,y\ne0$ ב-$(\mathbb{R}^2,\|\cdot\|_2)$ שבהם האגף השמאלי גדול
      מ-$\frac{\|x-y\|}{\|x\|}$.
    answer: >-
      (א) מוסיפים ומחסירים $\frac{y}{\|x\|}$, ואז משולש ולמה 1.2.2. (ב) $x=(1,0)$, $y=(-\tfrac12,0)$: $2>1.5$.
    solution:
      - kind: given
        text: >-
          $x,y\ne0$, ולכן לפי (N1) $\|x\|>0$ ו-$\|y\|>0$.
      - kind: goal
        text: >-
          לחסום את המרחק בין שני הווקטורים המנורמלים במרחק בין $x$ ל-$y$.
      - kind: idea
        text: >-
          כותבים $\frac{x}{\|x\|}-\frac{y}{\|y\|}=\frac{x-y}{\|x\|}+y\Big(\frac1{\|x\|}-\frac1{\|y\|}\Big)$: המחובר הראשון
          הוא ההפרש עצמו, והשני תלוי רק בהפרש בין האורכים, שאותו חוסם אי-שוויון המשולש ההפוך.
      - kind: step
        text: >-
          (א) לפי (N3) על הפירוק שב-idea, ולפי (N2):
          $\Big\|\frac{x}{\|x\|}-\frac{y}{\|y\|}\Big\|\le\frac{\|x-y\|}{\|x\|}+\|y\|\cdot\Big|\frac{1}{\|x\|}-\frac{1}{\|y\|}\Big|$.
      - kind: step
        text: >-
          $\|y\|\cdot\Big|\frac{1}{\|x\|}-\frac{1}{\|y\|}\Big|=\|y\|\cdot\frac{\big|\|y\|-\|x\|\big|}{\|x\|\,\|y\|}=\frac{\big|\|x\|-\|y\|\big|}{\|x\|}$,
          ולפי למה 1.2.2 זה לכל היותר $\frac{\|x-y\|}{\|x\|}$. מחברים את שני המחוברים.
      - kind: computation
        text: >-
          (ב) $x=(1,0)$, $y=(-\tfrac12,0)$: $\frac{x}{\|x\|}-\frac{y}{\|y\|}=(1,0)-(-1,0)=(2,0)$, שאורכו $2$; ו-$\|x-y\|=\tfrac32$,
          $\|x\|=1$. לכן האגף השמאלי $2>\tfrac32=\frac{\|x-y\|}{\|x\|}$, ואילו החסם של (א) נותן $3$.
      - kind: check
        text: >-
          דוגמה נוספת ל-(א): $x=(3,4)$, $y=(1,0)$. אגף שמאל $\|(-0.4,\ 0.8)\|_2=\sqrt{0.8}\approx0.894$, ואגף ימין
          $\frac{2\sqrt{20}}{5}\approx1.789$.
      - kind: result
        text: >-
          $\Big\|\frac{x}{\|x\|}-\frac{y}{\|y\|}\Big\|\le\frac{2\|x-y\|}{\|x\|}$, והקבוע $1$ אינו מספיק.

  - id: W-1.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      יהיו $\|\cdot\|_a$ ו-$\|\cdot\|_b$ שתי נורמות על מרחב וקטורי ממשי $V$. הוכיחו או הפריכו:

      (א) $N(x)=\max\big(\|x\|_a,\ \|x\|_b\big)$ היא נורמה על $V$.

      (ב) $M(x)=\min\big(\|x\|_a,\ \|x\|_b\big)$ היא נורמה על $V$.

      (ג) הסבירו את (א) ואת (ב) דרך כדורי היחידה ובעזרת טענה 1.2.11.
    answer: >-
      (א) נכון. (ב) לא נכון: על $\mathbb{R}^2$ עם $\|x\|_a=|x_1|+2|x_2|$, $\|x\|_b=2|x_1|+|x_2|$,
      $M(1,1)=3>2=M(1,0)+M(0,1)$. (ג) הכדור של $N$ הוא החיתוך, קמור; של $M$ האיחוד, לא קמור.
    solution:
      - kind: idea
        text: >-
          (N1) ו-(N2) עוברים למקסימום ולמינימום ישירות. ב-(N3) המקסימום מתנהג טוב: כל אחת מהנורמות חסומה בסכום
          המקסימומים. במינימום, $x$ ו-$y$ יכולים "לבחור" נורמות שונות, ואז הסכום שלהם גדול בשתיהן.
      - kind: step
        text: >-
          (א) (N1) $N(x)=0$ אם ורק אם $\|x\|_a=\|x\|_b=0$, אם ורק אם $x=0$. (N2) $\max(|\lambda|s,|\lambda|t)=|\lambda|\max(s,t)$
          ל-$s,t\ge0$. (N3) לפי (N3) של $\|\cdot\|_a$, $\|x+y\|_a\le\|x\|_a+\|y\|_a\le N(x)+N(y)$, ובאותה שרשרת עם $b$
          במקום $a$: $\|x+y\|_b\le\|x\|_b+\|y\|_b\le N(x)+N(y)$. לכן גם המקסימום, $N(x+y)$, לכל היותר $N(x)+N(y)$.
      - kind: step
        text: >-
          (ב) $\|x\|_a=|x_1|+2|x_2|$ ו-$\|x\|_b=2|x_1|+|x_2|$ נורמות על $\mathbb{R}^2$ (דוגמה 3: $\|Ax\|_1$ עם מטריצה
          אלכסונית הפיכה). $M(1,0)=\min(1,2)=1$, $M(0,1)=\min(2,1)=1$, ו-$M(1,1)=\min(3,3)=3>2$. (N3) נכשלת.
      - kind: step
        text: >-
          (ג) $N(x)\le1$ אם ורק אם $\|x\|_a\le1$ וגם $\|x\|_b\le1$: הכדור של $N$ הוא $K_a\cap K_b$, חיתוך של שתי
          קבוצות קמורות (טענה 1.2.11, כיוון $\Rightarrow$), ולכן קמור. $M(x)\le1$ אם ורק אם $x\in K_a\cup K_b$.
      - kind: computation
        text: >-
          האיחוד אינו קמור: $(1,0)\in K_a$ ו-$(0,1)\in K_b$, אבל האמצע $(\tfrac12,\tfrac12)$ נותן
          $\|\cdot\|_a=\|\cdot\|_b=\tfrac32>1$. ל-$M$ יש (N1) ו-(N2), ולכן לפי טענה 1.2.11 הכדור הלא-קמור הוא בדיוק
          הסיבה ש-(N3) נכשלת.
      - kind: check
        text: >-
          המספרים של (ב) ו-(ג) עקביים: $M(\tfrac12,\tfrac12)=\tfrac32=\tfrac12M(1,1)$, כפי ש-(N2) מחייבת.
      - kind: result
        text: >-
          המקסימום של שתי נורמות הוא נורמה; המינימום לא בהכרח.

  - id: W-1.2-06
    level: mid
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) במרחב מכפלה פנימית $\|x\|=2$, $\|y\|=3$ ו-$\langle x,y\rangle=1$. חשבו את $\|x+y\|$ ואת $\|x-y\|$, ובדקו את
      חוק המקבילית.

      (ב) במרחב מכפלה פנימית אחר ידוע רק ש-$\|u\|=2$, $\|v\|=3$ ו-$\|u+v\|=4$. חשבו את $\|u-v\|$ ואת $\langle u,v\rangle$.
    answer: >-
      (א) $\|x+y\|=\sqrt{15}\approx3.873$, $\|x-y\|=\sqrt{11}\approx3.317$. (ב) $\|u-v\|=\sqrt{10}$,
      $\langle u,v\rangle=\tfrac32$.
    solution:
      - kind: theorem
        text: >-
          בשלב 1 של ההוכחה של טענה 1.2.15: $\|x\pm y\|^2=\|x\|^2\pm2\langle x,y\rangle+\|y\|^2$. ומהטענה עצמה: חוק
          המקבילית וזהות הקיטוב.
      - kind: computation
        text: >-
          (א) $\|x+y\|^2=4+2\cdot1+9=15$ ו-$\|x-y\|^2=4-2+9=11$. לכן $\|x+y\|=\sqrt{15}\approx3.873$ ו-$\|x-y\|=\sqrt{11}\approx3.317$.
      - kind: check
        text: >-
          חוק המקבילית: $15+11=26=2\cdot4+2\cdot9$. וזהות הקיטוב מחזירה את הנתון: $\frac14(15-11)=1=\langle x,y\rangle$.
      - kind: step
        text: >-
          (ב) הפעם המכפלה לא נתונה, אבל חוק המקבילית (טענה 1.2.15(א)) קושר את ארבעת האורכים:
          $\|u-v\|^2=2\|u\|^2+2\|v\|^2-\|u+v\|^2=8+18-16=10$, ולכן $\|u-v\|=\sqrt{10}$.
      - kind: computation
        text: >-
          זהות הקיטוב (טענה 1.2.15(ב)): $\langle u,v\rangle=\tfrac14\big(\|u+v\|^2-\|u-v\|^2\big)=\tfrac14(16-10)=\tfrac32$.
      - kind: check
        text: >-
          לפי קושי-שוורץ (משפט 1.2.13) חייב להתקיים $|\langle u,v\rangle|\le\|u\|\,\|v\|=6$, ואכן $\tfrac32\le6$. ובדרך
          אחרת: $\|u+v\|^2=4+2\cdot\tfrac32+9=16$. מתאים.
      - kind: result
        text: >-
          (א) $\sqrt{15}$ ו-$\sqrt{11}$. (ב) $\|u-v\|=\sqrt{10}$ ו-$\langle u,v\rangle=\tfrac32$.

  - id: W-1.2-07
    level: exam
    objectives: [OBJ-1.2-2, OBJ-1.2-1]
    prompt: >-
      יהי $1<p<\infty$ ו-$q=\frac{p}{p-1}$ הצמוד שלו, ויהי $x\in\mathbb{R}^n$, $x\ne0$.

      (א) הוכיחו שלכל $y\in\mathbb{R}^n$ עם $\|y\|_q\le1$ מתקיים $\sum_ix_iy_i\le\|x\|_p$.

      (ב) הוכיחו שהווקטור $y^*$ עם $y^*_i=\dfrac{\operatorname{sgn}(x_i)\,|x_i|^{p-1}}{\|x\|_p^{p-1}}$ מקיים $\|y^*\|_q=1$
      ו-$\sum_ix_iy^*_i=\|x\|_p$. הסיקו ש-$\|x\|_p=\max\big\{\sum_ix_iy_i:\ \|y\|_q\le1\big\}$.

      (ג) בדקו את (ב) עם $n=2$, $p=3$, $x=(3,4)$.
    answer: >-
      (א) הלדר. (ב) $(p-1)q=p$, ולכן $\|y^*\|_q^q=\frac{\sum|x_i|^p}{\|x\|_p^p}=1$ ו-$\sum x_iy^*_i=\frac{\|x\|_p^p}{\|x\|_p^{p-1}}$.
      (ג) $\|x\|_3=91^{1/3}\approx4.498$, $y^*=91^{-2/3}(9,16)$.
    solution:
      - kind: given
        text: >-
          $1<p<\infty$, $\frac1p+\frac1q=1$, $x\ne0$, ולכן $\|x\|_p>0$. כאן $\operatorname{sgn}(t)$ הוא $1$, $-1$ או $0$ לפי
          הסימן של $t$, כך ש-$\operatorname{sgn}(t)\,t=|t|$.
      - kind: goal
        text: >-
          חסם עליון לכל $y$ בכדור $K_q$, ווקטור אחד בכדור שמשיג אותו: אז החסם הוא מקסימום.
      - kind: idea
        text: >-
          (א) הוא הלדר. ב-(ב) בוחרים את $y$ שעבורו יש שוויון ביאנג בכל קואורדינטה: $|y_i|^q$ פרופורציוני ל-$|x_i|^p$.
      - kind: step
        text: >-
          (א) $\sum_ix_iy_i\le\sum_i|x_iy_i|\le\|x\|_p\|y\|_q\le\|x\|_p$, לפי משפט 1.2.9 ו-$\|y\|_q\le1$.
      - kind: computation
        text: >-
          (ב) $(p-1)q=\frac{(p-1)p}{p-1}=p$. לכן $|y^*_i|^q=\frac{|x_i|^{(p-1)q}}{\|x\|_p^{(p-1)q}}=\frac{|x_i|^p}{\|x\|_p^p}$,
          ובסכום: $\|y^*\|_q^q=\frac{\sum_i|x_i|^p}{\|x\|_p^p}=1$.
      - kind: computation
        text: >-
          $x_iy^*_i=\frac{\operatorname{sgn}(x_i)x_i\,|x_i|^{p-1}}{\|x\|_p^{p-1}}=\frac{|x_i|^p}{\|x\|_p^{p-1}}$, ובסכום:
          $\sum_ix_iy^*_i=\frac{\|x\|_p^p}{\|x\|_p^{p-1}}=\|x\|_p$.
      - kind: step
        text: >-
          לפי (א), $\|x\|_p$ הוא חסם מלעיל של הקבוצה $\{\sum_ix_iy_i:\ \|y\|_q\le1\}$, ולפי מה שחושב הוא איבר שלה
          (עם $y=y^*$). חסם מלעיל ששייך לקבוצה הוא המקסימום שלה.
      - kind: computation
        text: >-
          (ג) $\|x\|_3=(27+64)^{1/3}=91^{1/3}\approx4.4979$. $y^*=\frac{(3^2,4^2)}{91^{2/3}}$, ולכן, עם $q=\frac32$:
          $\|y^*\|_{3/2}=\frac{(27+64)^{2/3}}{91^{2/3}}=1$ ו-$\sum x_iy^*_i=\frac{27+64}{91^{2/3}}=91^{1/3}$.
      - kind: check
        text: >-
          חישוב מספרי מאשר: $\|y^*\|_{3/2}=1.0000$ ו-$\sum x_iy^*_i=4.4979=\|x\|_3$. ו-$y$ אחר בכדור, למשל $y=(0,1)$
          עם $\|y\|_{3/2}=1$, נותן $\sum x_iy_i=4<4.4979$, כפי ש-(א) מחייב.
      - kind: result
        text: >-
          $\|x\|_p=\max\big\{\sum_ix_iy_i:\ \|y\|_q\le1\big\}$, והמקסימום מושג ב-$y^*$.

  - id: W-1.2-08
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) הוכיחו שבמרחב מכפלה פנימית, לכל $x,y,z$, עם $m=\frac{x+y}2$:
      $\|z-x\|^2+\|z-y\|^2=\tfrac12\|x-y\|^2+2\|z-m\|^2$ (זהות אפולוניוס).

      (ב) הוכיחו: נורמה שמקיימת את זהות אפולוניוס לכל $x,y,z$ באה ממכפלה פנימית.

      (ג) האם $\|\cdot\|_1$ על $\mathbb{R}^2$ מקיימת את זהות אפולוניוס? נמקו.
    answer: >-
      (א) חוק המקבילית עם $u=z-x$, $v=z-y$. (ב) עם $z=0$ הזהות היא חוק המקבילית; משפט 1.2.17. (ג) לא:
      $x=(1,0)$, $y=(0,1)$, $z=0$ נותנים $2\ne4$.
    solution:
      - kind: idea
        text: >-
          זהות אפולוניוס היא חוק המקבילית במקבילית שצלעותיה $z-x$ ו-$z-y$: האלכסון אחד הוא $2(z-m)$ והשני $y-x$.
      - kind: step
        text: >-
          (א) לפי טענה 1.2.15(א) עם $u=z-x$, $v=z-y$: $u+v=2z-x-y=2(z-m)$ ו-$u-v=y-x$, ולכן
          $\|2(z-m)\|^2+\|y-x\|^2=2\|z-x\|^2+2\|z-y\|^2$.
      - kind: step
        text: >-
          לפי (N2), $\|2(z-m)\|^2=4\|z-m\|^2$ ו-$\|y-x\|=\|x-y\|$. מחלקים ב-2: $2\|z-m\|^2+\tfrac12\|x-y\|^2=\|z-x\|^2+\|z-y\|^2$.
      - kind: step
        text: >-
          (ב) יהיו $u,v\in V$. נציב בזהות $z=0$, $x=-u$, $y=-v$; אז $m=-\frac{u+v}2$, והזהות נותנת
          $\|u\|^2+\|v\|^2=\tfrac12\|u-v\|^2+2\cdot\tfrac14\|u+v\|^2$. מכפילים ב-2: $\|u+v\|^2+\|u-v\|^2=2\|u\|^2+2\|v\|^2$,
          לכל $u,v$. לפי משפט 1.2.17 הנורמה באה ממכפלה פנימית.
      - kind: computation
        text: >-
          (ג) $x=(1,0)$, $y=(0,1)$, $z=0$, $m=(\tfrac12,\tfrac12)$: אגף שמאל $\|x\|_1^2+\|y\|_1^2=2$; אגף ימין
          $\tfrac12\|(1,-1)\|_1^2+2\|(-\tfrac12,-\tfrac12)\|_1^2=\tfrac12\cdot4+2\cdot1=4$. $2\ne4$.
      - kind: check
        text: >-
          (ג) מתיישב עם מסקנה 1.2.16(א): אילו $\|\cdot\|_1$ הייתה מקיימת את הזהות, לפי (א)-(ב) היא הייתה מקיימת גם את
          חוק המקבילית, והוא נכשל באותו זוג ($8\ne4$).
      - kind: result
        text: >-
          נורמה באה ממכפלה פנימית אם ורק אם היא מקיימת את זהות אפולוניוס; $\|\cdot\|_1$ אינה מקיימת אותה.

  - id: W-1.2-09
    level: exam
    objectives: [OBJ-1.2-4, OBJ-1.2-1]
    prompt: >-
      על $C[0,1]$ נגדיר $N(f)=\int_0^1|f(x)|\,x\,dx$.

      (א) הוכיחו ש-$N$ נורמה.

      (ב) הוכיחו ש-$N(f)\le\|f\|_1$ לכל $f$.

      (ג) עם $g_n(x)=\max(0,\ 1-nx)$ חשבו את $\|g_n\|_1$ ואת $N(g_n)$, והסיקו שאין קבוע $C$ עם $\|f\|_1\le C\,N(f)$
      לכל $f$.
    answer: >-
      (ג) $\|g_n\|_1=\frac{1}{2n}$, $N(g_n)=\frac{1}{6n^2}$, והיחס $3n$ אינו חסום.
    solution:
      - kind: idea
        text: >-
          כמו בטענה 1.2.20, עם המשקל $x$. רק (N1) דורשת זהירות: המשקל מתאפס ב-0, ולכן נקודה שבה $f\ne0$ צריכה להיות
          חיובית, ואותה מוצאים מרציפות.
      - kind: step
        text: >-
          (א) **(N2) ו-(N3)** מהאינטגרל: $|\lambda f|x=|\lambda|\,|f|x$, ו-$|f+g|\,x\le|f|\,x+|g|\,x$ כי $x\ge0$; ואז
          לינאריות ומונוטוניות של האינטגרל.
      - kind: step
        text: >-
          **(N1)** $N(0)=0$. נניח $f\ne0$: יש $x_0$ עם $f(x_0)\ne0$. אם $x_0>0$ נבחר $x_1=x_0$. אם $x_0=0$, מרציפות $f$
          ב-0 יש $\delta\in(0,1]$ עם $f(x)\ne0$ לכל $x\in[0,\delta)$, ונבחר $x_1=\frac\delta2$. בשני המקרים $x_1>0$
          ו-$f(x_1)\ne0$.
      - kind: step
        text: >-
          הפונקציה $h(x)=|f(x)|\,x$ רציפה, אי-שלילית, ו-$h(x_1)>0$. לפי למה 1.2.19, $N(f)=\int_0^1h>0$.
      - kind: step
        text: >-
          (ב) על הקטע $[0,1]$ מתקיים $x\le1$, ולכן $|f(x)|\,x\le|f(x)|$, ולפי המונוטוניות $N(f)\le\int_0^1|f|=\|f\|_1$.
      - kind: computation
        text: >-
          (ג) $g_n=1-nx$ על $[0,\frac1n]$ ו-$0$ אחר כך. $\|g_n\|_1=\frac12\cdot\frac1n\cdot1=\frac{1}{2n}$.
          $N(g_n)=\int_0^{1/n}(1-nx)x\,dx=\left[\frac{x^2}{2}-\frac{nx^3}{3}\right]_0^{1/n}=\frac{1}{2n^2}-\frac{1}{3n^2}=\frac{1}{6n^2}$.
      - kind: step
        text: >-
          לכן $\frac{\|g_n\|_1}{N(g_n)}=\frac{6n^2}{2n}=3n$. אילו היה $C$ עם $\|f\|_1\le C\,N(f)$, אז $3n\le C$ לכל $n$,
          בסתירה לארכימדס.
      - kind: check
        text: >-
          חישוב מספרי עם $n=4$: $\|g_4\|_1=0.125$ ו-$N(g_4)\approx0.0104=\frac1{96}$, יחס $12=3\cdot4$.
      - kind: result
        text: >-
          $N$ נורמה, $N\le\|\cdot\|_1$, ואין קבוע בכיוון ההפוך: היחס $3n$.

  - id: W-1.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      יהי $V\ne\{0\}$ מרחב וקטורי ממשי. הוכיחו או הפריכו:

      (א) אם $\|\cdot\|_a$, $\|\cdot\|_b$ נורמות על $V$, אז $d(x,y)=\|x-y\|_a+\|x-y\|_b$ היא המטריקה המושרית של נורמה.

      (ב) אם $d$ המטריקה המושרית של נורמה על $V$, אז גם $\sqrt d$ (מטריקה לפי מסקנה 1.1.12) היא המטריקה המושרית של
      נורמה.

      (ג) $\rho(x,y)=|\arctan x-\arctan y|$ על $\mathbb{R}$ היא המטריקה המושרית של נורמה.
    answer: >-
      (א) נכון: $N=\|\cdot\|_a+\|\cdot\|_b$. (ב) לא נכון: $\sqrt d$ אינה הומוגנית. (ג) לא נכון: $\rho<\pi$ חסומה.
    solution:
      - kind: idea
        text: >-
          לפי טענה 1.2.3 מטריקה מושרית אינווריאנטית להזזות והומוגנית, ולפי מסקנה 1.2.5(א) אינה חסומה: להפרכה מספיקה
          תכונה אחת שנכשלת. להוכחה מציגים את הנורמה.
      - kind: step
        text: >-
          (א) **נכון.** $N(x)=\|x\|_a+\|x\|_b$: (N1) סכום של שני אי-שליליים מתאפס רק כששניהם $0$, כלומר $x=0$; (N2)
          $N(\lambda x)=|\lambda|\|x\|_a+|\lambda|\|x\|_b=|\lambda|N(x)$; (N3) מחברים את (N3) של שתי הנורמות. ו-$d(x,y)=N(x-y)$.
      - kind: step
        text: >-
          (ב) **לא נכון.** $\sqrt d(x,y)=\sqrt{\|x-y\|}$. יהי $v\in V$ עם $\|v\|=1$ (מנרמלים וקטור שאינו אפס). אז
          $\sqrt d(4v,0)=\sqrt4=2$, ואילו הומוגניות הייתה נותנת $4\sqrt d(v,0)=4$. לפי טענה 1.2.3, $\sqrt d$ אינה
          מושרית מנורמה. (היא כן אינווריאנטית להזזות: ההנחה (ii) של טענה 1.2.4 היא שנכשלת.)
      - kind: step
        text: >-
          (ג) **לא נכון.** $\rho$ מטריקה לפי טענה 1.1.13(ב): $\arctan$ עולה ממש, ולכן חד-חד-ערכית. $|\arctan t|<\frac\pi2$, ולכן $\rho(x,y)<\pi$ לכל $x,y$: $\rho$ חסומה, ולפי מסקנה
          1.2.5(א) אינה מושרית מנורמה על $\mathbb{R}\ne\{0\}$.
      - kind: computation
        text: >-
          בדיקה נוספת ל-(ג): $\rho$ גם אינה אינווריאנטית להזזות. $\rho(1,0)=\frac\pi4\approx0.785$, ואילו
          $\rho(2,1)=\arctan2-\frac\pi4\approx0.322$.
      - kind: check
        text: >-
          ב-(ב), עם $V=\mathbb{R}$ ו-$d=|x-y|$: $\sqrt{|4-0|}=2\ne4=4\sqrt{|1-0|}$. מתאים.
      - kind: result
        text: >-
          (א) נכון; (ב) לא נכון; (ג) לא נכון.
challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      ל-$1\le p<\infty$ ול-$x\in\mathbb{R}^n$, $\|x\|_p=\big(|x_1|^p+\dots+|x_n|^p\big)^{1/p}$, ולפי משפט 1.2.10 זו נורמה.
      כאן משווים בין נורמות $p$ שונות. (חלקים (א) ו-(ג) הם חלקים 2 ו-3 של המקור; את חלק 1 שלו, שהנוסחה נורמה,
      הוכחנו בשיעור; חלק (ב) נוסף כאן.)

      (א) הוכיחו ש-$\|x\|_p\le\|x\|_q$ כש-$1\le q\le p<\infty$, וש-$\|x\|_\infty\le\|x\|_q$. הראו שב-$x=e_1=(1,0,\dots,0)$
      כל אי-השוויונות האלה הם שוויונות.

      (ב) הוכיחו ש-$\|x\|_q\le n^{1/q-1/p}\,\|x\|_p$ כש-$1\le q<p<\infty$, ושיש שוויון ב-$x=(1,\dots,1)$. (רמז: אי-שוויון
      הלדר עם המעריך $r=\frac pq$.)

      (ג) הוכיחו ש-$\|x\|_p\to\|x\|_\infty$ כש-$p\to\infty$.
    answer: >-
      (א) מנרמלים ל-$\|y\|_q=1$; אז $|y_i|\le1$ ו-$|y_i|^p\le|y_i|^q$. (ב) הלדר על $(|x_i|^q)$ ו-$(1,\dots,1)$ עם
      $r=\frac pq$ ו-$r'=\frac{p}{p-q}$. (ג) $\|x\|_\infty\le\|x\|_p\le n^{1/p}\|x\|_\infty$.
    solution:
      - kind: given
        text: >-
          $\|\cdot\|_p$ נורמה על $\mathbb{R}^n$ לכל $1\le p<\infty$ (משפט 1.2.10), ו-$\|\cdot\|_\infty$ נורמה (טענה 1.2.6).
      - kind: goal
        text: >-
          (א) $p\mapsto\|x\|_p$ אינה עולה; (ב) חסם הפוך עם הקבוע $n^{1/q-1/p}$, והוא הטוב ביותר; (ג) הגבול.
      - kind: idea
        text: >-
          (א) הומוגניות מאפשרת לנרמל: לווקטור עם $\|y\|_q=1$ כל הקואורדינטות לכל היותר 1 בערכן המוחלט, ולמספר
          ב-$[0,1]$ חזקה גדולה יותר קטנה יותר. (ב) $\sum|x_i|^q=\sum|x_i|^q\cdot1$ הוא מכפלה של שני וקטורים, ועליה
          הלדר. (ג) סנדוויץ'.
      - kind: step
        text: >-
          (א) אם $x=0$ אין מה להוכיח. אחרת נסמן $y=\frac{x}{\|x\|_q}$, כך ש-$\sum_i|y_i|^q=1$. כל מחובר בסכום הזה
          קטן או שווה לסכום, ולכן $|y_i|^q\le1$, כלומר $|y_i|\le1$. ל-$0\le s\le1$ ו-$p\ge q$,
          $s^p=s^q\cdot s^{p-q}\le s^q$. לכן $\sum_i|y_i|^p\le\sum_i|y_i|^q=1$, כלומר $\|y\|_p\le1$. לפי (N2):
          $\|x\|_p=\|x\|_q\,\|y\|_p\le\|x\|_q$.
      - kind: step
        text: >-
          לאינסוף: יש $j$ עם $|x_j|=\|x\|_\infty$, ו-$|x_j|^q$ הוא אחד המחוברים של $\sum_i|x_i|^q$. לכן
          $\|x\|_\infty^q\le\|x\|_q^q$, כלומר $\|x\|_\infty\le\|x\|_q$.
      - kind: computation
        text: >-
          ב-$e_1$: $\|e_1\|_p=(1^p)^{1/p}=1$ לכל $1\le p<\infty$, ו-$\|e_1\|_\infty=1$. לכן
          $\|e_1\|_\infty=\|e_1\|_p=\|e_1\|_q$: אי-השוויונות של (א) הם שוויונות, ואי אפשר להחליף אותם בקבוע קטן מ-1.
      - kind: step
        text: >-
          (ב) $r=\frac pq>1$, והצמוד שלו $r'=\frac{r}{r-1}=\frac{p}{p-q}$. לפי משפט 1.2.9 על הווקטורים $a=(|x_1|^q,\dots,|x_n|^q)$
          ו-$b=(1,\dots,1)$: $\sum_i|x_i|^q\le\Big(\sum_i|x_i|^{qr}\Big)^{1/r}\Big(\sum_i1\Big)^{1/r'}=\Big(\sum_i|x_i|^p\Big)^{q/p}n^{(p-q)/p}$.
      - kind: step
        text: >-
          מעלים בחזקת $\frac1q$ (פונקציה עולה על $[0,\infty)$): $\|x\|_q\le\|x\|_p\cdot n^{\frac{p-q}{pq}}=n^{1/q-1/p}\|x\|_p$.
          ב-$x=(1,\dots,1)$: $\|x\|_q=n^{1/q}$ ו-$n^{1/q-1/p}\|x\|_p=n^{1/q-1/p}n^{1/p}=n^{1/q}$, שוויון; לכן אי אפשר
          להקטין את הקבוע.
      - kind: step
        text: >-
          (ג) נסמן $m=\|x\|_\infty$. כל מחובר $|x_i|^p$ הוא לכל היותר $m^p$, ואחד מהם שווה $m^p$:
          $m^p\le\sum_i|x_i|^p\le n\,m^p$. מוציאים שורש מסדר $p$: $m\le\|x\|_p\le n^{1/p}m$. כש-$p\to\infty$,
          $n^{1/p}=e^{(\ln n)/p}\to1$, ולפי כלל הסנדוויץ' $\|x\|_p\to m$.
      - kind: check
        text: >-
          $x=(3,4)$: $\|x\|_1=7$, $\|x\|_2=5$, $\|x\|_3\approx4.4979$, $\|x\|_{10}\approx4.0220$,
          $\|x\|_{100}\approx4.0000$, ו-$\|x\|_\infty=4$: הסדרה יורדת, כמו ש-(א) אומר, ומתקרבת ל-$4$, כמו ש-(ג) אומר.
          ו-(ב) עם $q=1$, $p=2$: $7\le\sqrt2\cdot5\approx7.071$.
      - kind: result
        text: >-
          ל-$1\le q\le p<\infty$: $\|x\|_\infty\le\|x\|_p\le\|x\|_q\le n^{1/q-1/p}\|x\|_p$; שני אי-השוויונות הראשונים
          שוויונות ב-$e_1$, והשלישי ב-$(1,\dots,1)$, ולכן אף קבוע אינו ניתן לשיפור; ו-$\|x\|_p\to\|x\|_\infty$.
    source:
      name: 'Universität Stuttgart, Mathematik-Online (authors as shown on the page: Höllig/Höfert), Aufgabe 457: P-Norm (undated problem; the year is the page''s "automatisch erstellt am 18. 1. 2017" line)'
      year: 2017
      problem: 'Problem 457, parts 2 and 3 (part 1 is proved in the lesson; part (ב) here, the bound with n^{1/q-1/p}, is added)'
      url: 'https://morw-en.mathematik.uni-stuttgart.de/inhalt/aufgabe/aufgabe457'
      verified: '2026-11-10'
      adapted: true

  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-3]
    prompt: >-
      במשפט 1.2.17 הוכחנו שנורמה על מרחב **ממשי** שמקיימת את חוק המקבילית באה ממכפלה פנימית. כאן המקרה המרוכב.
      יהי $V$ מרחב וקטורי מעל $\mathbb{C}$ עם נורמה מרוכבת: (N1), (N3), ו-$\|\lambda x\|=|\lambda|\,\|x\|$ לכל
      $\lambda\in\mathbb{C}$, שמקיימת את חוק המקבילית לכל $u,v\in V$. מכפלה פנימית מרוכבת (אלגברה לינארית 2) היא
      $(\cdot,\cdot):V\times V\to\mathbb{C}$, לינארית במשתנה הראשון, עם $(y,x)=\overline{(x,y)}$ ו-$(x,x)>0$ לכל $x\ne0$.

      (א) $V$ הוא גם מרחב וקטורי ממשי. הסבירו למה משפט 1.2.17 חל עליו, ונסמן ב-$\langle\cdot,\cdot\rangle$ את המכפלה
      הפנימית הממשית שהוא נותן. הוכיחו ש-$\langle ix,iy\rangle=\langle x,y\rangle$ ו-$\langle ix,y\rangle=-\langle x,iy\rangle$.

      (ב) נגדיר $(x,y)=\langle x,y\rangle+i\langle x,iy\rangle$. הוכיחו ש-$(\cdot,\cdot)$ מכפלה פנימית מרוכבת
      עם $(x,x)=\|x\|^2$, ושמתקיימת זהות הקיטוב המרוכבת
      $(x,y)=\tfrac14\big(\|x+y\|^2-\|x-y\|^2+i\|x+iy\|^2-i\|x-iy\|^2\big)$.

      (ג) בדקו את הזהות ב-$\mathbb{C}^2$ עם המכפלה $(x,y)=x_1\overline{y_1}+x_2\overline{y_2}$, $x=(1,i)$, $y=(2,1-i)$.
    answer: >-
      (א) צמצום לסקלרים ממשיים, ו-$\|iz\|=\|z\|$. (ב) $(ix,y)=i(x,y)$ מ-(א); הצמידות מהסימטריה של $\langle\cdot,\cdot\rangle$;
      $\langle x,ix\rangle=0$. (ג) שני האגפים $1+i$.
    solution:
      - kind: given
        text: >-
          $V$ מעל $\mathbb{C}$, $\|\cdot\|$ נורמה מרוכבת שמקיימת $\|u+v\|^2+\|u-v\|^2=2\|u\|^2+2\|v\|^2$.
      - kind: goal
        text: >-
          מכפלה פנימית מרוכבת $(\cdot,\cdot)$ עם $(x,x)=\|x\|^2$, ונוסחה שלה דרך הנורמה.
      - kind: idea
        text: >-
          המשפט הממשי נותן את החלק הממשי של המכפלה. את החלק המדומה נותנת אותה מכפלה ממשית עם $iy$, כי ב-$\mathbb{C}$
          החלק המדומה של $w$ הוא החלק הממשי של $-iw$. כל השאר הוא חשבון עם $\|iz\|=\|z\|$.
      - kind: step
        text: >-
          (א) כשמגבילים את הסקלרים ל-$\mathbb{R}$, $V$ מרחב וקטורי ממשי, ו-$\|\cdot\|$ מקיימת (N1), (N3), ו-(N2) עם
          $\lambda$ ממשי (כי $\mathbb{R}\subseteq\mathbb{C}$): נורמה ממשית שמקיימת את חוק המקבילית. לפי משפט 1.2.17,
          $\langle x,y\rangle=\frac14\big(\|x+y\|^2-\|x-y\|^2\big)$ מכפלה פנימית ממשית עם $\langle x,x\rangle=\|x\|^2$.
      - kind: step
        text: >-
          $\|iz\|=|i|\,\|z\|=\|z\|$ לכל $z$. לכן $\langle ix,iy\rangle=\frac14\big(\|i(x+y)\|^2-\|i(x-y)\|^2\big)=\langle x,y\rangle$.
          ומאותה זהות עם $ix$ במקום $x$, ומהלינאריות הממשית: $\langle ix,y\rangle=\langle i(ix),iy\rangle=\langle -x,iy\rangle=-\langle x,iy\rangle$.
      - kind: step
        text: >-
          (ב) **חיבוריות והומוגניות ממשית** במשתנה הראשון: $(x,y)$ בנוי משתי פונקציות לינאריות (מעל $\mathbb{R}$) של
          $x$, $\langle x,y\rangle$ ו-$\langle x,iy\rangle$.
      - kind: computation
        text: >-
          **הכפלה ב-$i$.** לפי (א): $(ix,y)=\langle ix,y\rangle+i\langle ix,iy\rangle=-\langle x,iy\rangle+i\langle x,y\rangle=i\big(\langle x,y\rangle+i\langle x,iy\rangle\big)=i(x,y)$.
          לכן ל-$\lambda=a+ib$: $(\lambda x,y)=(ax+b\,ix,y)=a(x,y)+b\,i(x,y)=\lambda(x,y)$.
      - kind: computation
        text: >-
          **צמידות.** לפי הסימטריה של $\langle\cdot,\cdot\rangle$ ו-(א): $(y,x)=\langle y,x\rangle+i\langle y,ix\rangle=\langle x,y\rangle+i\langle ix,y\rangle=\langle x,y\rangle-i\langle x,iy\rangle=\overline{(x,y)}$.
      - kind: step
        text: >-
          **חיוביות.** $\langle x,ix\rangle=-\langle ix,x\rangle$ (לפי (א) עם $y=x$), וגם $\langle x,ix\rangle=\langle ix,x\rangle$
          (סימטריה); לכן $\langle x,ix\rangle=0$ ו-$(x,x)=\langle x,x\rangle=\|x\|^2>0$ ל-$x\ne0$.
      - kind: step
        text: >-
          **הנוסחה.** לפי ההגדרה שב-(א), $\langle x,iy\rangle=\frac14\big(\|x+iy\|^2-\|x-iy\|^2\big)$; מציבים ב-$(x,y)=\langle x,y\rangle+i\langle x,iy\rangle$.
      - kind: computation
        text: >-
          (ג) $x+y=(3,\ 1)$, $x-y=(-1,\ -1+2i)$, $iy=(2i,\ 1+i)$, $x+iy=(1+2i,\ 1+2i)$, $x-iy=(1-2i,\ -1)$. הריבועים:
          $\|x+y\|^2=10$, $\|x-y\|^2=1+5=6$, $\|x+iy\|^2=5+5=10$, $\|x-iy\|^2=5+1=6$. הנוסחה: $\frac14(10-6)+\frac i4(10-6)=1+i$.
      - kind: check
        text: >-
          ישירות: $(x,y)=1\cdot\overline2+i\cdot\overline{1-i}=2+i(1+i)=1+i$. מתאים.
      - kind: result
        text: >-
          גם מעל $\mathbb{C}$: נורמה באה ממכפלה פנימית אם ורק אם היא מקיימת את חוק המקבילית, והמכפלה נתונה בזהות
          הקיטוב המרוכבת.
