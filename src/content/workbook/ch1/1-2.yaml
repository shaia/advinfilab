# Workbook of lesson 1.2 — normed spaces and inner products.
# Objectives (src/course.ts):
#   OBJ-1.2-1  define a norm, show every norm induces a metric, recognise a metric that comes from no norm
#   OBJ-1.2-2  compute the 1-, 2- and ∞-norms on R^n and draw their unit balls
#   OBJ-1.2-3  norms from an inner product; decide by the parallelogram law
#   OBJ-1.2-4  the sup norm and the integral norm on C[a,b]
# Numbers recomputed with src/math/multivar.ts (pNorm, supDist, l1Dist) and src/math/norms.ts.
lesson: '1.2'
practice:
  - id: W-1.2-01
    level: basic
    objectives: [OBJ-1.2-2]
    prompt: >-
      חשבו את $\|x\|_1$, $\|x\|_2$ ו-$\|x\|_\infty$ עבור $x=(1,-2,2,-4)\in\mathbb{R}^4$.
    answer: >-
      $\|x\|_1=9$, $\|x\|_2=5$, $\|x\|_\infty=4$.
    solution:
      - kind: definition
        text: >-
          $\|x\|_1=\sum|x_i|$, $\|x\|_2=\sqrt{\sum x_i^2}$, $\|x\|_\infty=\max|x_i|$. הערכים המוחלטים של הקואורדינטות
          הם $1,2,2,4$.
      - kind: computation
        text: >-
          $\|x\|_1=1+2+2+4=9$. $\|x\|_2=\sqrt{1+4+4+16}=\sqrt{25}=5$. $\|x\|_\infty=\max(1,2,2,4)=4$.
      - kind: check
        text: >-
          השרשרת $\|x\|_\infty\le\|x\|_2\le\|x\|_1\le4\|x\|_\infty$: $4\le5\le9\le16$. מתקיימת.
      - kind: result
        text: >-
          $9$, $5$, $4$.

  - id: W-1.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.2-2]
    prompt: >-
      שרטטו במישור את כדורי היחידה הסגורים $K_1=\{\|x\|_1\le1\}$, $K_2=\{\|x\|_2\le1\}$ ו-$K_\infty=\{\|x\|_\infty\le1\}$.
      לכל אחת מהנקודות $(0.5,\ 0.5)$, $(0.7,\ 0.6)$, $(1,0)$ קבעו לאילו מהכדורים היא שייכת.
    answer: >-
      $(0.5,0.5)$ ו-$(1,0)$ בשלושתם (על השפה של $K_1$); $(0.7,0.6)$ ב-$K_2$ וב-$K_\infty$, לא ב-$K_1$.
    solution:
      - kind: step
        text: >-
          $K_1$ הוא המעוין עם קודקודים $(\pm1,0)$, $(0,\pm1)$; $K_2$ העיגול; $K_\infty$ הריבוע $[-1,1]\times[-1,1]$.
          $K_1\subseteq K_2\subseteq K_\infty$.
      - kind: computation
        text: >-
          $(0.5,0.5)$: $\|\cdot\|_1=1$, $\|\cdot\|_2\approx0.707$, $\|\cdot\|_\infty=0.5$. כולם לכל היותר 1, ולכן
          בשלושה הכדורים; על השפה של המעוין.
      - kind: computation
        text: >-
          $(0.7,0.6)$: $\|\cdot\|_1=1.3>1$, $\|\cdot\|_2=\sqrt{0.85}\approx0.922$, $\|\cdot\|_\infty=0.7$. לכן מחוץ
          למעוין, בעיגול ובריבוע.
      - kind: computation
        text: >-
          $(1,0)$: שלוש הנורמות שוות 1. היא בשלושה הכדורים, על השפה של כולם: הקודקוד של המעוין נוגע בעיגול ובריבוע.
      - kind: result
        text: >-
          $(0.5,0.5)$ ו-$(1,0)$ בכל השלושה; $(0.7,0.6)$ רק ב-$K_2$ וב-$K_\infty$.

  - id: W-1.2-03
    level: basic
    objectives: [OBJ-1.2-4]
    prompt: >-
      חשבו את $\|f\|_\infty$ ואת $\|f\|_1$ עבור $f(x)=\sin x$ ב-$C[0,2\pi]$.
    answer: >-
      $\|f\|_\infty=1$, $\|f\|_1=4$.
    solution:
      - kind: computation
        text: >-
          $|\sin x|\le1$, ושוויון ב-$x=\frac\pi2$. לכן $\|f\|_\infty=1$.
      - kind: computation
        text: >-
          על הקטע $[0,\pi]$ מתקיים $\sin x\ge0$, ועל $[\pi,2\pi]$ מתקיים $\sin x\le0$. לכן
          $\|f\|_1=\int_0^\pi\sin x\,dx-\int_\pi^{2\pi}\sin x\,dx=2-(-2)=4$.
      - kind: check
        text: >-
          בלי ערך מוחלט $\int_0^{2\pi}\sin x\,dx=0$, אף ש-$f\ne0$: לכן צריך את $|f|$. ו-$4\le(2\pi-0)\cdot1\approx6.28$,
          כמו ש-$\|f\|_1\le(b-a)\|f\|_\infty$ דורש.
      - kind: result
        text: >-
          $\|f\|_\infty=1$, $\|f\|_1=4$.

  - id: W-1.2-04
    level: mid
    objectives: [OBJ-1.2-1]
    prompt: >-
      יהי $(V,\|\cdot\|)$ מרחב נורמי.

      (א) הוכיחו את אי-שוויון המשולש ההפוך: $\big|\,\|x\|-\|y\|\,\big|\le\|x-y\|$ לכל $x,y\in V$.

      (ב) הסיקו שבמטריקה המושרית $\big|\,d(x,0)-d(y,0)\,\big|\le d(x,y)$.
    answer: >-
      (א) $\|x\|\le\|x-y\|+\|y\|$ ובאותו אופן עם $x,y$ מוחלפים. (ב) $d(x,0)=\|x\|$.
    solution:
      - kind: idea
        text: >-
          כותבים $x=(x-y)+y$ ומפעילים את אי-שוויון המשולש. זה נותן חסם בכיוון אחד; הכיוון השני בא מהחלפת התפקידים.
      - kind: step
        text: >-
          (א) $\|x\|=\|(x-y)+y\|\le\|x-y\|+\|y\|$, ולכן $\|x\|-\|y\|\le\|x-y\|$.
      - kind: step
        text: >-
          באותו אופן $\|y\|-\|x\|\le\|y-x\|=|-1|\,\|x-y\|=\|x-y\|$ (הומוגניות עם $\lambda=-1$). שני אי-השוויונות
          יחד אומרים שהערך המוחלט של $\|x\|-\|y\|$ קטן או שווה ל-$\|x-y\|$.
      - kind: step
        text: >-
          (ב) במטריקה המושרית $d(x,0)=\|x-0\|=\|x\|$ ו-$d(x,y)=\|x-y\|$; מציבים ב-(א).
      - kind: check
        text: >-
          ב-$\mathbb{R}$ עם $|x|$: $x=3$, $y=-1$ נותנים $|3-1|=2\le|3-(-1)|=4$.
      - kind: result
        text: >-
          $\big|\,\|x\|-\|y\|\,\big|\le\|x-y\|$.

  - id: W-1.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      (א) האם $N(x)=|x_1-x_2|$ היא נורמה על $\mathbb{R}^2$?

      (ב) האם $N(x)=|x_1-x_2|+|x_2|$ היא נורמה על $\mathbb{R}^2$?
    answer: >-
      (א) לא: $N(1,1)=0$. (ב) כן.
    solution:
      - kind: step
        text: >-
          (א) $N(1,1)=0$ אף ש-$(1,1)\ne0$: אקסיומת האפס נכשלת. (הומוגניות ומשולש מתקיימים, אבל זה לא מספיק.)
      - kind: step
        text: >-
          (ב) **אפס:** אם $N(x)=0$, שני המחוברים האי-שליליים מתאפסים: $x_2=0$ ו-$x_1=x_2$, ולכן $x=0$.
      - kind: step
        text: >-
          **הומוגניות:** $|\lambda x_1-\lambda x_2|+|\lambda x_2|=|\lambda|\big(|x_1-x_2|+|x_2|\big)$.
      - kind: step
        text: >-
          **משולש:** $|(x_1+y_1)-(x_2+y_2)|\le|x_1-x_2|+|y_1-y_2|$ ו-$|x_2+y_2|\le|x_2|+|y_2|$; מחברים ומקבלים
          $N(x+y)\le N(x)+N(y)$.
      - kind: check
        text: >-
          מבט אחר: $N(x)=\|Ax\|_1$ עם $A=\begin{pmatrix}1&-1\\0&1\end{pmatrix}$. ל-$A$ דטרמיננטה 1, ולכן היא הפיכה,
          ו-$Ax=0$ רק ל-$x=0$. ב-(א) המטריצה $\begin{pmatrix}1&-1\end{pmatrix}$ מאפסת את $(1,1)$.
      - kind: result
        text: >-
          (א) לא נורמה; (ב) נורמה.

  - id: W-1.2-06
    level: mid
    objectives: [OBJ-1.2-3]
    prompt: >-
      (א) במרחב מכפלה פנימית $\|x\|=2$, $\|y\|=3$ ו-$\langle x,y\rangle=1$. חשבו את $\|x+y\|$ ואת $\|x-y\|$, ובדקו את
      חוק המקבילית.

      (ב) במרחב מכפלה פנימית אחר ידוע רק ש-$\|u\|=2$, $\|v\|=3$ ו-$\|u+v\|=4$. חשבו את $\|u-v\|$ ואת $\langle u,v\rangle$.
    answer: >-
      (א) $\|x+y\|=\sqrt{15}\approx3.873$, $\|x-y\|=\sqrt{11}\approx3.317$. (ב) $\|u-v\|=\sqrt{10}$,
      $\langle u,v\rangle=\tfrac32$.
    solution:
      - kind: idea
        text: >-
          בנורמה שבאה ממכפלה פנימית $\|x\pm y\|^2=\|x\|^2\pm2\langle x,y\rangle+\|y\|^2$: ריבוע הנורמה נפתח כמו
          ריבוע של סכום.
      - kind: computation
        text: >-
          $\|x+y\|^2=4+2\cdot1+9=15$ ו-$\|x-y\|^2=4-2+9=11$. לכן $\|x+y\|=\sqrt{15}\approx3.873$ ו-$\|x-y\|=\sqrt{11}\approx3.317$.
      - kind: check
        text: >-
          חוק המקבילית: $15+11=26=2\cdot4+2\cdot9$. וזהות הקיטוב מחזירה את הנתון: $\frac14(15-11)=1=\langle x,y\rangle$.
      - kind: step
        text: >-
          (ב) הפעם המכפלה לא נתונה, אבל חוק המקבילית קושר את ארבעת האורכים:
          $\|u-v\|^2=2\|u\|^2+2\|v\|^2-\|u+v\|^2=8+18-16=10$, ולכן $\|u-v\|=\sqrt{10}$.
      - kind: computation
        text: >-
          עכשיו זהות הקיטוב: $\langle u,v\rangle=\tfrac14\big(\|u+v\|^2-\|u-v\|^2\big)=\tfrac14(16-10)=\tfrac32$.
      - kind: check
        text: >-
          לפי קושי-שוורץ חייב להתקיים $|\langle u,v\rangle|\le\|u\|\,\|v\|=6$, ואכן $\tfrac32\le6$. ובדרך אחרת:
          $\|u+v\|^2=4+2\cdot\tfrac32+9=16$. מתאים.
      - kind: result
        text: >-
          (א) $\sqrt{15}$ ו-$\sqrt{11}$. (ב) $\|u-v\|=\sqrt{10}$ ו-$\langle u,v\rangle=\tfrac32$.

  - id: W-1.2-07
    level: exam
    objectives: [OBJ-1.2-2]
    prompt: >-
      הוכיחו שלכל $x\in\mathbb{R}^n$: $\|x\|_1\le\sqrt n\,\|x\|_2$. מתי יש שוויון?
    answer: >-
      קושי-שוורץ ל-$(|x_1|,\dots,|x_n|)$ ול-$(1,\dots,1)$; שוויון כשכל $|x_i|$ שווים.
    solution:
      - kind: idea
        text: >-
          $\|x\|_1=\sum|x_i|\cdot1$ היא מכפלה סקלרית של $(|x_1|,\dots,|x_n|)$ עם $(1,\dots,1)$, ועליה מפעילים את
          קושי-שוורץ משיעור 0.5.
      - kind: step
        text: >-
          יהי $u=(|x_1|,\dots,|x_n|)$ ו-$e=(1,\dots,1)$. אז $\|x\|_1=\langle u,e\rangle\le\|u\|_2\|e\|_2$.
      - kind: computation
        text: >-
          $\|u\|_2=\sqrt{\sum|x_i|^2}=\|x\|_2$ ו-$\|e\|_2=\sqrt n$. לכן $\|x\|_1\le\sqrt n\,\|x\|_2$.
      - kind: step
        text: >-
          בקושי-שוורץ יש שוויון בדיוק כשהווקטורים תלויים לינארית (מקרה השוויון בקושי-שוורץ, מאלגברה לינארית 2).
          כאן $e\ne0$, ולכן זה קורה כש-$u=ce$: כל הערכים המוחלטים $|x_i|$ שווים.
      - kind: check
        text: >-
          $x=(1,-1,1,-1)$: $\|x\|_1=4$, $\sqrt4\cdot\|x\|_2=2\cdot2=4$. שוויון. ו-$x=(1,0,0,0)$: $1\le2\cdot1$.
      - kind: result
        text: >-
          $\|x\|_1\le\sqrt n\,\|x\|_2$, ושוויון בדיוק כש-$|x_1|=\dots=|x_n|$.

  - id: W-1.2-08
    level: mid
    qualitative: true
    objectives: [OBJ-1.2-3, OBJ-1.2-2]
    prompt: >-
      לכל $1\le p\le\infty$ נבדוק את חוק המקבילית ל-$\|\cdot\|_p$ על $\mathbb{R}^2$ עם $x=(1,0)$, $y=(0,1)$.

      (א) חשבו את שני האגפים כפונקציה של $p$ (ל-$p<\infty$, ובנפרד ל-$p=\infty$).

      (ב) לאילו $p$ החוק מתקיים לזוג הזה? מה מותר להסיק מכך, ומה לא?
    answer: >-
      (א) אגף שמאל $2\cdot2^{2/p}$ (ו-$2$ ל-$p=\infty$), אגף ימין $4$. (ב) רק $p=2$; לכל $p\ne2$ הנורמה אינה באה
      ממכפלה פנימית. ל-$p=2$ זוג אחד לא מוכיח, אבל שם יש מכפלה פנימית.
    solution:
      - kind: computation
        text: >-
          (א) $x+y=(1,1)$ ו-$x-y=(1,-1)$, ולשניהם $\|\cdot\|_p=(1+1)^{1/p}=2^{1/p}$. לכן אגף שמאל
          $2\cdot\left(2^{1/p}\right)^2=2\cdot2^{2/p}$. אגף ימין: $\|x\|_p=\|y\|_p=1$, ולכן $2+2=4$.
      - kind: computation
        text: >-
          ל-$p=\infty$: $\|(1,\pm1)\|_\infty=1$, אגף שמאל $2$, אגף ימין $4$.
      - kind: step
        text: >-
          (ב) $2\cdot2^{2/p}=4\iff2^{2/p}=2\iff\frac2p=1\iff p=2$. וב-$p=\infty$ אגף שמאל הוא $2$, שונה מ-$4$. לכן
          החוק נכשל לכל $p\ne2$.
      - kind: step
        text: >-
          מה מותר להסיק: לכל $p\ne2$ זוג אחד מפר את החוק, ולכן $\|\cdot\|_p$ **אינה** באה ממכפלה פנימית. ל-$p=2$
          שוויון לזוג אחד אינו הוכחה; ש-$\|\cdot\|_2$ באה ממכפלה פנימית יודעים כי מציגים אותה: $\sum x_iy_i$.
      - kind: check
        text: >-
          מספרית: $p=1$ נותן $8$, $p=3$ נותן $2\cdot2^{2/3}\approx3.175$, $p=10$ נותן $\approx2.297$, וכשה-$p$ גדל
          אגף שמאל יורד לעבר $2$, הערך של $p=\infty$.
      - kind: result
        text: >-
          החוק מתקיים לזוג רק ב-$p=2$; כל $\|\cdot\|_p$ עם $p\ne2$ אינה באה ממכפלה פנימית.

  - id: W-1.2-09
    level: exam
    objectives: [OBJ-1.2-4, OBJ-1.2-1]
    prompt: >-
      על $C[0,1]$ נגדיר $N(f)=\int_0^1|f(x)|\,x\,dx$.

      (א) הוכיחו ש-$N$ נורמה.

      (ב) הוכיחו ש-$N(f)\le\|f\|_1$ לכל $f$.

      (ג) עם $g_n(x)=\max(0,\ 1-nx)$ חשבו את $\|g_n\|_1$ ואת $N(g_n)$, והסיקו שאין קבוע $C$ עם $\|f\|_1\le C\,N(f)$
      לכל $f$.
    answer: >-
      (ג) $\|g_n\|_1=\frac{1}{2n}$, $N(g_n)=\frac{1}{6n^2}$, והיחס $3n$ אינו חסום.
    solution:
      - kind: step
        text: >-
          (א) **הומוגניות ומשולש** באים מהאינטגרל: $|\lambda f|x=|\lambda|\,|f|x$, ו-$|f+g|\,x\le|f|\,x+|g|\,x$ כי
          $x\ge0$, ואז מונוטוניות ולינאריות של האינטגרל.
      - kind: step
        text: >-
          **אפס** (כאן משתמשים ברציפות): נניח $f(x_0)\ne0$. המשקל $x$ מתאפס ב-$0$, ולכן אם במקרה $x_0=0$ הנקודה
          עצמה לא עוזרת: שם $|f(x_0)|\cdot x_0=0$. לכן עוברים לנקודה סמוכה: מרציפות, יש $x_1\in(0,1]$ קרוב ל-$x_0$
          עם $f(x_1)\ne0$, ואז הפונקציה הרציפה $|f(x)|x$ חיובית ב-$x_1$, ולכן גדולה מחצי ערכה על קטע סביב $x_1$ שאורכו חיובי. האינטגרל
          חיובי, כלומר $N(f)>0$. לכן $N(f)=0$ רק ל-$f=0$.
      - kind: step
        text: >-
          (ב) על הקטע $[0,1]$ מתקיים $x\le1$, ולכן $|f(x)|\,x\le|f(x)|$, ומהמונוטוניות $N(f)\le\int_0^1|f|=\|f\|_1$.
      - kind: computation
        text: >-
          (ג) $g_n=1-nx$ על $[0,\frac1n]$ ו-$0$ אחר כך. $\|g_n\|_1=\frac12\cdot\frac1n\cdot1=\frac{1}{2n}$.
          $N(g_n)=\int_0^{1/n}(1-nx)x\,dx=\left[\frac{x^2}{2}-\frac{nx^3}{3}\right]_0^{1/n}=\frac{1}{2n^2}-\frac{1}{3n^2}=\frac{1}{6n^2}$.
      - kind: step
        text: >-
          לכן $\frac{\|g_n\|_1}{N(g_n)}=\frac{6n^2}{2n}=3n$. אילו היה $C$ עם $\|f\|_1\le C\,N(f)$, אז $3n\le C$ לכל $n$,
          וזה לא ייתכן.
      - kind: check
        text: >-
          חישוב מספרי עם $n=4$: $\|g_4\|_1=0.125$ ו-$N(g_4)\approx0.0104=\frac1{96}$, יחס $12=3\cdot4$.
      - kind: result
        text: >-
          $N$ נורמה, $N\le\|\cdot\|_1$, ואין קבוע בכיוון ההפוך: היחס $3n$.

  - id: W-1.2-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.2-1]
    prompt: >-
      לכל אחת מהמטריקות על $\mathbb{R}$ הבאות (שתיהן מטריקות) קבעו אם היא מושרית מנורמה, ונמקו.

      (א) $d(x,y)=|x^3-y^3|$.

      (ב) $d(x,y)=|\arctan x-\arctan y|$.
    answer: >-
      שתיהן אינן מושרות: (א) אינה אינווריאנטית להזזות; (ב) חסומה.
    solution:
      - kind: idea
        text: >-
          מטריקה מושרית מקיימת שתי תכונות: אינווריאנטיות להזזות, $d(x+a,y+a)=d(x,y)$, והומוגניות, ולכן היא לא חסומה.
          מספיק להראות שאחת מהן נכשלת.
      - kind: step
        text: >-
          שתיהן מטריקות: $x\mapsto x^3$ ו-$x\mapsto\arctan x$ חח״ע, ומטריקה מהצורה $|\varphi(x)-\varphi(y)|$ עם
          $\varphi$ חח״ע היא מטריקה (אפס מחד-חד-ערכיות, סימטריה ומשולש מהערך המוחלט).
      - kind: computation
        text: >-
          (א) $d(1,0)=1$, אבל אחרי הזזה ב-1: $d(2,1)=8-1=7$. אינה אינווריאנטית להזזות, ולכן אינה מושרית.
      - kind: step
        text: >-
          (ב) $|\arctan x|<\frac\pi2$, ולכן $d(x,y)<\pi$ לכל $x,y$: המטריקה חסומה. מטריקה מושרית מנורמה על $\mathbb{R}$
          אינה חסומה ($d(t,0)=|t|\,\|1\|\to\infty$). לכן אינה מושרית.
      - kind: check
        text: >-
          גם ב-(א) ההומוגניות נכשלת: $d(2,0)=8$, ואילו נורמה הייתה נותנת $2\,d(1,0)=2$.
      - kind: result
        text: >-
          (א) לא מושרית; (ב) לא מושרית.
challenge:
  - id: W-1.2-c1
    stars: 1
    objectives: [OBJ-1.2-1, OBJ-1.2-2]
    prompt: >-
      ל-$1\le p<\infty$ ול-$x\in\mathbb{R}^n$ נסמן $\|x\|_p=\big(|x_1|^p+\dots+|x_n|^p\big)^{1/p}$
      ו-$K_p=\big\{x\in\mathbb{R}^n:\ |x_1|^p+\dots+|x_n|^p\le1\big\}$. קבוצה $K\subseteq\mathbb{R}^n$ נקראת
      **קמורה** אם $\lambda x+(1-\lambda)y\in K$ לכל $x,y\in K$ ולכל $\lambda\in[0,1]$: הקטע בין כל שתי נקודות
      שלה נמצא בה. ופונקציה $g:[0,\infty)\to\mathbb{R}$ נקראת **קמורה** אם
      $g(\lambda s+(1-\lambda)t)\le\lambda g(s)+(1-\lambda)g(t)$ לכל $s,t\ge0$ ולכל $\lambda\in[0,1]$: המיתר בין שתי
      נקודות על הגרף נמצא מעל הגרף.

      (א) הוכיחו ש-$K_p$ קמורה.

      (ב) השתמשו ב-(א) כדי להוכיח ש-$\|\cdot\|_p$ היא נורמה על $\mathbb{R}^n$. (בשיעור קיבלנו את זה בלי הוכחה.)

      (ג) הוכיחו ש-$\|x\|_p\le\|x\|_q$ כש-$1\le q\le p<\infty$, וש-$\|x\|_\infty\le\|x\|_q$.

      (ד) הוכיחו ש-$\|x\|_p\to\|x\|_\infty$ כש-$p\to\infty$.

      (ה) הראו שעם $p=\tfrac12$ הקבוצה $K_{1/2}\subseteq\mathbb{R}^2$ אינה קמורה, ושהנוסחה אינה נורמה.
    answer: >-
      (א) $t\mapsto t^p$ עולה וקמורה על $[0,\infty)$, ולכן כל מחובר קטן או שווה לצירוף הקמור של המחוברים.
      (ב) $\frac{x+y}{\|x\|_p+\|y\|_p}$ הוא צירוף קמור של $\frac{x}{\|x\|_p},\frac{y}{\|y\|_p}\in K_p$. (ג) מנרמלים
      ל-$\|y\|_q=1$; אז $|y_i|\le1$ ו-$|y_i|^p\le|y_i|^q$. (ד) $\|x\|_\infty\le\|x\|_p\le n^{1/p}\|x\|_\infty$.
      (ה) $(1,0),(0,1)\in K_{1/2}$ אבל $(\tfrac12,\tfrac12)\notin K_{1/2}$; $\|(1,1)\|_{1/2}=4>2$.
    solution:
      - kind: given
        text: >-
          $1\le p<\infty$, $\|x\|_p$ ו-$K_p$ כמו בשאלה. (ל-$p=\infty$ הכדור הוא הקובייה $\{\max_i|x_i|\le1\}$,
          ו-$\|\cdot\|_\infty$ נורמה כבר מהשיעור.)
      - kind: goal
        text: >-
          (א) קמירות של $K_p$; (ב) שלוש האקסיומות של נורמה, והעיקר אי-שוויון המשולש; (ג)–(ה) כמו בשאלה.
      - kind: idea
        text: >-
          לפונקציה הומוגנית, אי-שוויון המשולש שקול לקמירות של "כדור היחידה" שלה: מנרמלים את $x$ ואת $y$ לווקטורים
          $u,v$ על השפה של $K_p$, ומגלים ש-$\frac{x+y}{\|x\|_p+\|y\|_p}$ הוא נקודה על הקטע שבין $u$ ל-$v$. לכן כל
          העבודה היא ב-(א), ושם היא בממד אחד: קמירות של $t\mapsto t^p$.
      - kind: definition
        text: >-
          לפי ההגדרה שבשאלה, $g(t)=t^p$ קמורה: ל-$p=1$ יש שוויון; ל-$p>1$,
          $g''(t)=p(p-1)t^{p-2}\ge0$ ל-$t>0$, ולכן $g$ קמורה על $(0,\infty)$ (אינפי 1). אי-השוויון עובר גם ל-$s=0$ או
          $t=0$ בגבול, כי $g$ רציפה ב-$0$.
      - kind: step
        text: >-
          (א) יהיו $a,b\in\mathbb{R}$ ו-$\lambda\in[0,1]$. לפי אי-שוויון המשולש ב-$\mathbb{R}$,
          $|\lambda a+(1-\lambda)b|\le\lambda|a|+(1-\lambda)|b|$, ו-$t\mapsto t^p$ עולה על $[0,\infty)$, ולכן
          $|\lambda a+(1-\lambda)b|^p\le\big(\lambda|a|+(1-\lambda)|b|\big)^p\le\lambda|a|^p+(1-\lambda)|b|^p$, כשהצעד
          השני הוא הקמירות של $t^p$.
      - kind: step
        text: >-
          יהיו $x,y\in K_p$. מפעילים את הצעד הקודם בכל קואורדינטה, עם $a=x_i$ ו-$b=y_i$, וסוכמים:
          $\sum_i|\lambda x_i+(1-\lambda)y_i|^p\le\lambda\sum_i|x_i|^p+(1-\lambda)\sum_i|y_i|^p\le\lambda+(1-\lambda)=1$.
          כלומר $\lambda x+(1-\lambda)y\in K_p$, ו-$K_p$ קמורה.
      - kind: step
        text: >-
          (ב) **אפס והומוגניות.** $\|x\|_p\ge0$, ו-$\|x\|_p=0$ רק אם $|x_i|^p=0$ לכל $i$, כלומר $x=0$.
          $\|cx\|_p=\big(|c|^p\sum_i|x_i|^p\big)^{1/p}=|c|\,\|x\|_p$.
      - kind: step
        text: >-
          **המשולש.** אם $x=0$ או $y=0$ אין מה להוכיח. אחרת נסמן $a=\|x\|_p>0$, $b=\|y\|_p>0$, $u=\frac xa$,
          $v=\frac yb$. אז $\sum_i|u_i|^p=\frac{1}{a^p}\sum_i|x_i|^p=\frac{a^p}{a^p}=1$, ולכן $u\in K_p$, ובאותו אופן
          $v\in K_p$.
      - kind: step
        text: >-
          עם $\lambda=\frac{a}{a+b}\in[0,1]$: $\lambda u+(1-\lambda)v=\frac{a}{a+b}\cdot\frac xa+\frac{b}{a+b}\cdot\frac yb=\frac{x+y}{a+b}$.
          לפי (א), $\frac{x+y}{a+b}\in K_p$, כלומר $\sum_i|x_i+y_i|^p\le(a+b)^p$. מוציאים שורש מסדר $p$ (פונקציה עולה):
          $\|x+y\|_p\le a+b=\|x\|_p+\|y\|_p$.
      - kind: step
        text: >-
          (ג) אם $x=0$ אין מה להוכיח. אחרת נסמן $y=\frac{x}{\|x\|_q}$, כך ש-$\sum_i|y_i|^q=1$. כל מחובר בסכום הזה
          קטן או שווה לסכום, ולכן $|y_i|^q\le1$, כלומר $|y_i|\le1$. ל-$0\le s\le1$ ו-$p\ge q$,
          $s^p=s^q\cdot s^{p-q}\le s^q$. לכן $\sum_i|y_i|^p\le\sum_i|y_i|^q=1$, כלומר $\|y\|_p\le1$. מהומוגניות:
          $\|x\|_p=\|x\|_q\,\|y\|_p\le\|x\|_q$.
      - kind: step
        text: >-
          לאינסוף: יש $j$ עם $|x_j|=\|x\|_\infty$, ו-$|x_j|^q$ הוא אחד המחוברים של $\sum_i|x_i|^q$. לכן
          $\|x\|_\infty^q\le\|x\|_q^q$, כלומר $\|x\|_\infty\le\|x\|_q$.
      - kind: step
        text: >-
          (ד) נסמן $m=\|x\|_\infty$. כל מחובר $|x_i|^p$ הוא לכל היותר $m^p$, ואחד מהם שווה $m^p$:
          $m^p\le\sum_i|x_i|^p\le n\,m^p$. מוציאים שורש מסדר $p$: $m\le\|x\|_p\le n^{1/p}m$. כש-$p\to\infty$,
          $n^{1/p}=e^{(\ln n)/p}\to1$, ולפי כלל הסנדוויץ' $\|x\|_p\to m$.
      - kind: check
        text: >-
          $x=(3,4)$: $\|x\|_1=7$, $\|x\|_2=5$, $\|x\|_3\approx4.4979$, $\|x\|_{10}\approx4.0220$,
          $\|x\|_{100}\approx4.0000$, ו-$\|x\|_\infty=4$. הסדרה יורדת, כמו ש-(ג) אומר, ומתקרבת ל-$4$, כמו ש-(ד) אומר.
      - kind: step
        text: >-
          (ה) עם $p=\tfrac12$ ב-$\mathbb{R}^2$: $N(x)=\big(\sqrt{|x_1|}+\sqrt{|x_2|}\big)^2$
          ו-$K_{1/2}=\{\sqrt{|x_1|}+\sqrt{|x_2|}\le1\}$. הנקודות $(1,0)$ ו-$(0,1)$ ב-$K_{1/2}$, אבל אמצע הקטע ביניהן,
          $(\tfrac12,\tfrac12)$, לא: $\sqrt{\tfrac12}+\sqrt{\tfrac12}=\sqrt2>1$. וגם $N(1,1)=(1+1)^2=4>2=N(1,0)+N(0,1)$:
          המשולש נכשל.
      - kind: check
        text: >-
          איפה ההוכחה של (א)–(ב) נשברת ב-$p=\tfrac12$? בקמירות של $t^p$: ל-$p<1$,
          $g''(t)=p(p-1)t^{p-2}<0$, והפונקציה $\sqrt t$ קעורה. זה גם ההסבר לכדור "המכווץ" פנימה.
      - kind: result
        text: >-
          $\|\cdot\|_p$ נורמה על $\mathbb{R}^n$ לכל $1\le p\le\infty$, כי כדור היחידה שלה קמור; כש-$p$ גדל
          היא אינה גדלה, ו-$\|x\|_p\to\|x\|_\infty$. ל-$p<1$ הכדור אינו קמור והנוסחה אינה נורמה.
    source:
      name: 'Universität Stuttgart, Mathematik-Online (authors as shown on the page: Höllig/Höfert), Aufgabe 457: P-Norm'
      year: 2017
      problem: 'Problem 457'
      url: 'https://morw-en.mathematik.uni-stuttgart.de/inhalt/aufgabe/aufgabe457'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.2-c2
    stars: 1
    objectives: [OBJ-1.2-3]
    prompt: >-
      בשיעור ראינו שנורמה שבאה ממכפלה פנימית מקיימת את חוק המקבילית, וציינו בלי הוכחה שגם ההפך נכון. כאן
      מוכיחים את ההפך. יהי $(V,\|\cdot\|)$ מרחב נורמי ממשי שמקיים את חוק המקבילית,
      $\|u+v\|^2+\|u-v\|^2=2\|u\|^2+2\|v\|^2$ לכל $u,v\in V$, ונגדיר, בהשראת זהות הקיטוב,
      $\langle x,y\rangle=\tfrac14\big(\|x+y\|^2-\|x-y\|^2\big)$.

      (א) הוכיחו ש-$\langle x,x\rangle=\|x\|^2$, ש-$\langle y,x\rangle=\langle x,y\rangle$, ש-$\langle0,y\rangle=0$
      וש-$\langle-x,y\rangle=-\langle x,y\rangle$.

      (ב) הוכיחו ש-$\langle x+x',y\rangle=\langle x,y\rangle+\langle x',y\rangle$. רמז: עם $m=\frac{x+x'}2$
      ו-$h=\frac{x-x'}2$, הפעילו את חוק המקבילית על $u=m+y$, $v=h$ ועל $u=m-y$, $v=h$.

      (ג) הוכיחו ש-$\langle tx,y\rangle=t\langle x,y\rangle$ לכל $t\in\mathbb{R}$: קודם ל-$t\in\mathbb{N}$, אחר כך
      ל-$t\in\mathbb{Z}$ ול-$t\in\mathbb{Q}$, ולבסוף ל-$t\in\mathbb{R}$ בעזרת סדרה של רציונליים.

      (ד) הסיקו ש-$\langle\cdot,\cdot\rangle$ מכפלה פנימית שמשרה את $\|\cdot\|$, ובדקו ש-$\|\cdot\|_1$ על
      $\mathbb{R}^2$ אינה מקיימת את חוק המקבילית.
    answer: >-
      $\langle x,y\rangle=\tfrac14(\|x+y\|^2-\|x-y\|^2)$ מכפלה פנימית עם $\langle x,x\rangle=\|x\|^2$: (א) ישירות
      מההגדרה; (ב) מחוק המקבילית; (ג) מ-(ב), דרך $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$, ולבסוף בגבול של סדרת רציונליים, עם אי-שוויון
      המשולש ההפוך.
      (ד) ב-$\|\cdot\|_1$, עם $e_1,e_2$: $4+4=8\ne4$.
    solution:
      - kind: given
        text: >-
          $V$ מרחב נורמי ממשי, $\|u+v\|^2+\|u-v\|^2=2\|u\|^2+2\|v\|^2$ לכל $u,v$,
          ו-$\langle x,y\rangle=\tfrac14\big(\|x+y\|^2-\|x-y\|^2\big)$.
      - kind: goal
        text: >-
          $\langle\cdot,\cdot\rangle$ סימטרית, לינארית במשתנה הראשון (ולכן, עם הסימטריה, בכל משתנה),
          ו-$\langle x,x\rangle=\|x\|^2$, שהוא חיובי ל-$x\ne0$.
      - kind: idea
        text: >-
          אם הנורמה באה ממכפלה פנימית בכלל, זו חייבת להיות המכפלה של זהות הקיטוב. לכן מגדירים אותה ובודקים את
          האקסיומות. רק החיבוריות צריכה את חוק המקבילית; ההומוגניות נובעת מהחיבוריות, קודם לסקלרים רציונליים ואחר
          כך בגבול.
      - kind: step
        text: >-
          (א) $\langle x,x\rangle=\tfrac14\big(\|2x\|^2-\|0\|^2\big)=\tfrac14\cdot4\|x\|^2=\|x\|^2$, וזה חיובי ל-$x\ne0$.
          סימטריה: $\|y+x\|=\|x+y\|$ ו-$\|y-x\|=\|-(x-y)\|=\|x-y\|$. $\langle0,y\rangle=\tfrac14(\|y\|^2-\|-y\|^2)=0$.
          $\langle-x,y\rangle=\tfrac14(\|y-x\|^2-\|-x-y\|^2)=\tfrac14(\|x-y\|^2-\|x+y\|^2)=-\langle x,y\rangle$.
      - kind: step
        text: >-
          (ב) **זהות האמצע.** עם $m=\frac{x+x'}2$ ו-$h=\frac{x-x'}2$ מתקיים $x=m+h$ ו-$x'=m-h$. חוק המקבילית עם
          $u=m+y$, $v=h$: $u+v=x+y$ ו-$u-v=x'+y$, ולכן $\|x+y\|^2+\|x'+y\|^2=2\|m+y\|^2+2\|h\|^2$.
      - kind: step
        text: >-
          חוק המקבילית עם $u=m-y$, $v=h$: $u+v=x-y$ ו-$u-v=x'-y$, ולכן $\|x-y\|^2+\|x'-y\|^2=2\|m-y\|^2+2\|h\|^2$.
          מחסירים את השוויון הזה מהקודם; $2\|h\|^2$ מתקזז. מחלקים ב-4:
          $\langle x,y\rangle+\langle x',y\rangle=2\langle m,y\rangle$.
      - kind: step
        text: >-
          **חיבוריות.** בזהות האמצע עם $x'=0$, ולפי $\langle0,y\rangle=0$: $\langle x,y\rangle=2\langle\tfrac x2,y\rangle$
          לכל $x$. כלומר $2\langle\tfrac z2,y\rangle=\langle z,y\rangle$ לכל $z$, ועם $z=x+x'$:
          $2\langle m,y\rangle=\langle x+x',y\rangle$. יחד עם זהות האמצע:
          $\langle x+x',y\rangle=\langle x,y\rangle+\langle x',y\rangle$.
      - kind: step
        text: >-
          (ג) **רציונליים.** באינדוקציה מ-(ב), $\langle nx,y\rangle=\langle(n-1)x,y\rangle+\langle x,y\rangle=n\langle x,y\rangle$
          ל-$n\in\mathbb{N}$. עם $\langle-x,y\rangle=-\langle x,y\rangle$ ו-$\langle0,y\rangle=0$ זה נכון לכל $n\in\mathbb{Z}$.
          ל-$r=\frac pq$ עם $p\in\mathbb{Z}$ ו-$q\in\mathbb{N}$: $q\langle\tfrac pq x,y\rangle=\langle px,y\rangle=p\langle x,y\rangle$,
          כשהשוויון הראשון הוא המקרה השלם עם הווקטור $\tfrac pq x$. מחלקים ב-$q$.
      - kind: step
        text: >-
          **ממשיים.** יהי $t\in\mathbb{R}$, ותהי $r_k$ סדרת רציונליים עם $r_k\to t$. לפי אי-שוויון המשולש ההפוך
          (תרגיל W-1.2-04),
          $\big|\|r_kx\pm y\|-\|tx\pm y\|\big|\le\|(r_k-t)x\|=|r_k-t|\,\|x\|\to0$. לכן $\|r_kx\pm y\|\to\|tx\pm y\|$,
          ומאריתמטיקה של גבולות ב-$\mathbb{R}$, $\langle r_kx,y\rangle\to\langle tx,y\rangle$.
      - kind: step
        text: >-
          מצד שני $\langle r_kx,y\rangle=r_k\langle x,y\rangle\to t\langle x,y\rangle$. לסדרה ממשית יש גבול אחד לכל
          היותר, ולכן $\langle tx,y\rangle=t\langle x,y\rangle$.
      - kind: step
        text: >-
          (ד) $\langle\cdot,\cdot\rangle$ סימטרית (א), לינארית במשתנה הראשון (ב, ג), ולכן לפי הסימטריה גם בשני,
          ו-$\langle x,x\rangle=\|x\|^2>0$ ל-$x\ne0$ (א). זו מכפלה פנימית, ו-$\sqrt{\langle x,x\rangle}=\|x\|$.
      - kind: check
        text: >-
          ב-$\|\cdot\|_2$ על $\mathbb{R}^2$ הנוסחה מחזירה את המכפלה הרגילה: עם $x=(1,2)$ ו-$y=(3,-1)$,
          $\tfrac14\big(\|(4,1)\|_2^2-\|(-2,3)\|_2^2\big)=\tfrac14(17-13)=1=1\cdot3+2\cdot(-1)$.
      - kind: computation
        text: >-
          ב-$\|\cdot\|_1$ עם $u=e_1=(1,0)$ ו-$v=e_2=(0,1)$: $\|u+v\|_1^2+\|u-v\|_1^2=2^2+2^2=8$, ואילו
          $2\|u\|_1^2+2\|v\|_1^2=4$. החוק נכשל, ולכן $\|\cdot\|_1$ אינה באה מאף מכפלה פנימית.
      - kind: result
        text: >-
          נורמה על מרחב ממשי באה ממכפלה פנימית אם ורק אם היא מקיימת את חוק המקבילית, והמכפלה היא
          $\tfrac14\big(\|x+y\|^2-\|x-y\|^2\big)$.
