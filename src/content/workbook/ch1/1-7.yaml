# Workbook of lesson 1.7 — Lipschitz equivalence of metrics.
# Objectives (src/course.ts):
#   OBJ-1.7-1  Lipschitz equivalence; best constants between d1, d2, d-infinity on R^n
#   OBJ-1.7-2  Lipschitz-equivalent metrics: same open sets, same convergent sequences, same continuous functions
#   OBJ-1.7-3  a one-sided bound is not enough; same open sets without Lipschitz equivalence
# W-05, W-09, W-10 and c1 moved here from lesson 1.6's workbook when 1.6 was split (2026-11-10).
# Rebuilt on the formal spine (2026-11-10): W-01, W-04 new, W-06, W-10 reshaped; every number recomputed with
# src/math/multivar.ts (pNorm, pDist) and a midpoint-rule integral.
lesson: '1.7'
practice:
  - id: W-1.7-01
    level: basic
    objectives: [OBJ-1.7-1]
    prompt: >-
      על $\mathbb{R}^n$ נגדיר $D(x,y)=\|x-y\|_2+\big|\|x\|_2-\|y\|_2\big|$.

      (א) הוכיחו ש-$D$ מטריקה.

      (ב) הוכיחו $d_2\le D\le2\,d_2$, ושני הקבועים הטובים ביותר. מה מסיקים על הקבוצות הפתוחות של $D$?
    answer: >-
      (ב) $d_2\le D$ כי המחובר השני אי-שלילי; $D\le2\,d_2$ מאי-שוויון המשולש ההפוך (למה 1.2.2). שוויון משמאל
      ב-$x=e_1$, $y=-e_1$; מימין ב-$x=e_1$, $y=0$. לפי משפט 1.7.5, ל-$D$ אותן קבוצות פתוחות כמו ל-$d_1,d_2,d_\infty$.
    solution:
      - kind: idea
        text: >-
          $D$ היא $d_2$ ועוד "תיקון" שמודד את ההבדל בין המרחקים מהראשית. התיקון אי-שלילי, ולפי אי-שוויון המשולש
          ההפוך הוא לא גדול מ-$d_2$; לכן $D$ בין $d_2$ ל-$2\,d_2$.
      - kind: step
        text: >-
          (א) (M1): $D\ge d_2(x,y)\ge0$; $D(x,x)=0+0=0$; ואם $D(x,y)=0$ אז $d_2(x,y)=0$ ו-$x=y$. (M2): שני המחוברים סימטריים. (M3):
          $d_2(x,z)\le d_2(x,y)+d_2(y,z)$ (טענה 1.1.5), ו-$\big|\|x\|_2-\|z\|_2\big|\le\big|\|x\|_2-\|y\|_2\big|+\big|\|y\|_2-\|z\|_2\big|$
          (אי-שוויון המשולש ב-$\mathbb{R}$ למספרים $\|x\|_2,\|y\|_2,\|z\|_2$). מחברים.
      - kind: theorem
        text: >-
          למה 1.2.2 (אי-שוויון המשולש ההפוך): $\big|\|u\|-\|v\|\big|\le\|u-v\|$ בכל מרחב נורמי.
      - kind: step
        text: >-
          (ב) $d_2\le D$ כי $\big|\|x\|_2-\|y\|_2\big|\ge0$. לפי למה 1.2.2, $\big|\|x\|_2-\|y\|_2\big|\le\|x-y\|_2$, ולכן
          $D\le2\,d_2$.
      - kind: check
        text: >-
          שוויון משמאל: $x=e_1$, $y=-e_1$ נותנים $d_2=2$ ו-$\|x\|_2=\|y\|_2=1$, ולכן $D=2=d_2$. שוויון מימין:
          $x=e_1$, $y=0$ נותנים $d_2=1$ ו-$D=1+1=2=2\,d_2$. בכל אחד מהם הנקודות שונות, ולכן קבוע טוב יותר נכשל
          באותו זוג (כמו בצעד 5 בהוכחת משפט 1.7.3). חישוב על 200,000 זוגות אקראיים במישור נתן יחסים
          $\frac{D}{d_2}$ בין $1.000003$ ל-$1.99999$.
      - kind: result
        text: >-
          $D$ מטריקה ו-$d_2\le D\le2\,d_2$ עם קבועים הדוקים. לכן $D$ שקולה ליפשיץ ל-$d_2$, ולפי משפט 1.7.3 וטענה
          1.7.2 גם ל-$d_1$ ול-$d_\infty$; לפי משפט 1.7.5 יש לה אותן קבוצות פתוחות.

  - id: W-1.7-02
    level: basic
    objectives: [OBJ-1.7-1]
    prompt: >-
      במישור נגדיר $\tau(x,y)=\max\big(|x_1-y_1|,\ 3|x_2-y_2|\big)$. הוכיחו $d_\infty\le\tau\le3\,d_\infty$, ושאי
      אפשר לשפר אף אחד משני הקבועים.
    answer: >-
      $\max(u,v)\le\max(u,3v)\le3\max(u,v)$; שוויון ב-$x-y=(1,0)$ וב-$x-y=(0,1)$.
    solution:
      - kind: idea
        text: >-
          נסמן $u=|x_1-y_1|$, $v=|x_2-y_2|$. רק ההפרש השני מוכפל ב-3, והראשון נשאר. לכן המקסימום לא קטן, וגדל לכל
          היותר פי 3.
      - kind: step
        text: >-
          $v\le3v$, ולכן $\max(u,v)\le\max(u,3v)$. ו-$u\le3u$, ולכן $\max(u,3v)\le\max(3u,3v)=3\max(u,v)$. כלומר
          $d_\infty\le\tau\le3\,d_\infty$.
      - kind: check
        text: >-
          עם $x-y=(1,0)$: $\tau=1=d_\infty$, שוויון משמאל. עם $x-y=(0,1)$: $\tau=3$ ו-$d_\infty=1$, שוויון מימין. בשני
          הזוגות הנקודות שונות, ולכן, כמו בצעד 5 בהוכחת משפט 1.7.3, אי אפשר להקטין את 3 או להגדיל את 1.
      - kind: result
        text: >-
          $d_\infty\le\tau\le3\,d_\infty$ עם קבועים הדוקים. בפרט $\tau$ ו-$d_\infty$ שקולות ליפשיץ, ולפי משפט 1.7.5
          יש להן אותן קבוצות פתוחות.

  - id: W-1.7-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      על $\mathbb{R}$ עם $d(x,y)=|x-y|$, קבעו לכל מטריקה אם היא שקולה ליפשיץ ל-$d$, והוכיחו (מותר להניח שאלה
      מטריקות).

      (א) $d'(x,y)=3|x-y|$.

      (ב) $d'(x,y)=|x-y|+|\sin x-\sin y|$.

      (ג) $d'(x,y)=|x-y|+|x^2-y^2|$. (רמז: נסו זוגות נקודות רחוקים מהראשית, כמו $n$ ו-$n+1$.)
    answer: >-
      (א) כן, $c=C=3$. (ב) כן: $d\le d'\le2d$. (ג) לא: $d'(n,n+1)=2n+2$ ו-$d(n,n+1)=1$.
    solution:
      - kind: definition
        text: >-
          לפי הגדרה 1.7.1 צריך $c,C>0$ עם $c\,d\le d'\le C\,d$. כדי לשלול מספיק להראות שהיחס $\frac{d'}{d}$, על זוגות
          נקודות שונות, אינו חסום מלמעלה, או שהוא מקבל ערכים חיוביים קטנים כרצוננו.
      - kind: step
        text: >-
          (א) $d'=3d$, ולכן $3d\le d'\le3d$.
      - kind: step
        text: >-
          (ב) $d\le d'$ כי המחובר השני אי-שלילי. לפי משפט הערך הממוצע של לגרנז' (אינפי 1) יש $t$ בין $x$ ל-$y$ עם
          $|\sin x-\sin y|=|\cos t|\,|x-y|\le|x-y|$, ולכן $d'\le2d$.
      - kind: step
        text: >-
          (ג) $d\le d'$, אבל אין $C$: עם $x=n$, $y=n+1$, $d'=1+\big|n^2-(n+1)^2\big|=1+(2n+1)=2n+2$ ו-$d=1$. אילו
          $d'\le C\,d$, היה $2n+2\le C$ לכל $n$, בסתירה לתכונת ארכימדס.
      - kind: check
        text: >-
          ב-(ב) אי אפשר להקטין את הקבוע 2: עם $x=t$, $y=0$ היחס הוא $1+\frac{|\sin t|}{|t|}$, ששואף ל-2 כש-$t\to0$. ב-(ג)
          הקבוע נכשל בזוגות **רחוקים מהראשית**, אף שהנקודות במרחק 1 זו מזו.
      - kind: result
        text: >-
          (א) ו-(ב) שקולות ליפשיץ ל-$d$; (ג) לא.

  - id: W-1.7-04
    level: mid
    objectives: [OBJ-1.7-1]
    prompt: >-
      יהי $1\le p<\infty$ ותהי $\|\cdot\|_p$ הנורמה של הגדרה 1.2.7 על $\mathbb{R}^n$.

      (א) הוכיחו $\|v\|_\infty\le\|v\|_p\le n^{1/p}\|v\|_\infty$ לכל $v\in\mathbb{R}^n$, ושני הקבועים הטובים ביותר.

      (ב) הסיקו ש-$d_p(x,y)=\|x-y\|_p$ שקולה ליפשיץ ל-$d_1$, ומצאו קבועים מפורשים. האם הקבועים שקיבלתם הטובים
      ביותר?
    answer: >-
      (א) $M^p\le\sum|v_i|^p\le nM^p$ עם $M=\max|v_i|$; שוויון ב-$e_1$ וב-$\mathbf 1$. (ב) $\frac1n\,d_1\le d_p\le n^{1/p}\,d_1$;
      לא בהכרח הטובים ביותר (ב-$p=1$ הם $\frac1n$ ו-$n$ במקום $1$ ו-$1$).
    solution:
      - kind: idea
        text: >-
          זה אותו טיעון כמו בצעד 2 בהוכחת משפט 1.7.3, עם חזקה $p$ במקום ריבוע: כל קואורדינטה לכל היותר המקסימום,
          והמקסימום עצמו אחד המחוברים. את (ב) משרשרים דרך $d_\infty$ בעזרת טענה 1.7.2.
      - kind: step
        text: >-
          (א) נסמן $M=\|v\|_\infty=\max_i|v_i|$, ויהי $k$ אינדקס עם $|v_k|=M$. כל המחוברים ב-$\sum_i|v_i|^p$
          אי-שליליים ואחד מהם $M^p$, ולכן $M^p\le\sum_i|v_i|^p$. ולכל $i$, $|v_i|^p\le M^p$ (החזקה $t\mapsto t^p$ עולה על
          $[0,\infty)$), ולכן $\sum_i|v_i|^p\le nM^p$. מוציאים שורש $p$, שגם הוא עולה על $[0,\infty)$:
          $M\le\|v\|_p\le n^{1/p}M$.
      - kind: check
        text: >-
          שוויון: $v=e_1$ נותן $\|v\|_\infty=\|v\|_p=1$; $v=\mathbf 1$ נותן $\|v\|_\infty=1$ ו-$\|v\|_p=n^{1/p}$. לכן, כמו
          בצעד 5 בהוכחת משפט 1.7.3, אי אפשר לשפר אף קבוע. לדוגמה $n=2$, $p=3$: $\|(1,1)\|_3=2^{1/3}\approx1.26$.
      - kind: step
        text: >-
          (ב) עם $v=x-y$, (א) נותן $d_\infty\le d_p\le n^{1/p}\,d_\infty$, ולפי משפט 1.7.3 $d_\infty\le d_1\le n\,d_\infty$.
          משרשרים כמו בצעד 3 בהוכחת טענה 1.7.2: $d_p\le n^{1/p}\,d_\infty\le n^{1/p}\,d_1$, ו-$d_1\le n\,d_\infty\le n\,d_p$,
          כלומר $\frac1n\,d_1\le d_p\le n^{1/p}\,d_1$.
      - kind: check
        text: >-
          הקבועים מהשרשור אינם בהכרח הטובים ביותר: ב-$p=1$ מקבלים $\frac1n\,d_1\le d_1\le n\,d_1$, אף ש-$d_1=d_1$; וב-$p=2$
          מקבלים $\frac1n\,d_1\le d_2\le\sqrt n\,d_1$, ואילו לפי משפט 1.7.3 $\frac1{\sqrt n}\,d_1\le d_2\le d_1$.
      - kind: result
        text: >-
          (א) $\|v\|_\infty\le\|v\|_p\le n^{1/p}\|v\|_\infty$, הדוק. (ב) $\frac1n\,d_1\le d_p\le n^{1/p}\,d_1$: כל המטריקות
          $d_p$ על $\mathbb{R}^n$ שקולות ליפשיץ זו לזו (טענה 1.7.2), עם קבועים שהשרשור לא מבטיח שהם הטובים ביותר.

  - id: W-1.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.7-3]
    prompt: >-
      על $\mathbb{R}$ נתונות $d(x,y)=|x-y|$ ו-$d'(x,y)=|x^3-y^3|$.

      (א) הוכיחו ש-$d'$ מטריקה.

      (ב) הוכיחו ש-$d$ ו-$d'$ שקולות טופולוגית (הגדרה 1.7.6).

      (ג) הוכיחו ש-$d$ ו-$d'$ אינן שקולות ליפשיץ: אף אחד משני הקבועים אינו קיים.
    answer: >-
      (א) $x\mapsto x^3$ חד-חד-ערכית. (ב) לפי טענה 1.7.6א: $x_n\to a$ אם ורק אם $x_n^3\to a^3$ ($x^3$ והשורש השלישי
      רציפים). (ג) $n$ ו-$0$ נותנים $n^3$ מול $n$; $\frac1n$ ו-$0$ נותנים $\frac1{n^3}$ מול $\frac1n$.
    solution:
      - kind: step
        text: >-
          (א) $t\mapsto t^3$ עולה ממש על $\mathbb{R}$, ולכן חד-חד-ערכית, ולפי טענה 1.1.13(ב) (משיכה של מטריקה דרך
          העתקה חד-חד-ערכית) $d'$ מטריקה. ישירות: (M1): $d'\ge0$, ו-$d'(x,y)=0$ גורר $x^3=y^3$,
          כלומר $x=y$. (M2) מהערך המוחלט. (M3) הוא אי-שוויון המשולש ב-$\mathbb{R}$ למספרים $x^3,y^3,z^3$.
      - kind: theorem
        text: >-
          טענה 1.7.6א: $d$ ו-$d'$ שקולות טופולוגית אם ורק אם לכל סדרה $(x_n)$ ולכל $a$: $x_n\to a$ ב-$d$ אם ורק אם
          $x_n\to a$ ב-$d'$.
      - kind: step
        text: >-
          (ב) אם $|x_n-a|\to0$, אז $x_n^3\to a^3$ (רציפות של $t^3$, אינפי 1), כלומר $d'(x_n,a)\to0$. אם
          $|x_n^3-a^3|\to0$, אז מהרציפות של השורש השלישי ב-$a^3$ (אינפי 1) $x_n=\sqrt[3]{x_n^3}\to\sqrt[3]{a^3}=a$. לפי
          טענה 1.7.6א, $d$ ו-$d'$ שקולות טופולוגית.
      - kind: step
        text: >-
          (ג) אילו היה $C$ עם $d'\le C\,d$, אז עם $x=n$, $y=0$: $n^3\le Cn$, כלומר $n^2\le C$ לכל $n$, וזה נכשל. אילו
          היה $C$ עם $d\le C\,d'$, אז עם $x=\frac1n$, $y=0$: $\frac1n\le\frac{C}{n^3}$, כלומר $n^2\le C$ לכל $n$, וזה נכשל.
      - kind: check
        text: >-
          השוו לטענה 1.7.8: ב-$\min(d,1)$ נכשל רק קבוע אחד (במרחקים גדולים); ב-$\sqrt d$ נכשלים שניהם, כל אחד בקצה
          אחר. כאן: $d'\le C\,d$ נכשל במרחקים גדולים ($n^3$ מול $n$) ו-$d\le C\,d'$ בקטנים ($\frac1n$ מול $\frac1{n^3}$);
          ועדיין הקבוצות הפתוחות זהות.
      - kind: result
        text: >-
          $d'$ מטריקה, שקולה טופולוגית ל-$d$, ואינה שקולה לה ליפשיץ: שקילות ליפשיץ מספיקה לאותן קבוצות פתוחות (משפט
          1.7.5), אבל אינה הכרחית.

  - id: W-1.7-06
    level: mid
    objectives: [OBJ-1.7-2, OBJ-1.7-1]
    prompt: >-
      תהי $f(x)=x_1+x_2$ מהמישור ל-$\mathbb{R}$.

      (א) הוכיחו ש-$f$ ליפשיצית כשבמישור $d_1$, כשבמישור $d_2$ וכשבמישור $d_\infty$, ומצאו בכל מקרה את קבוע
      ליפשיץ הטוב ביותר.

      (ב) לפי משפט 1.7.5(6), אם $c\,d\le d'$ ו-$f$ ליפשיצית ביחס ל-$d$ עם קבוע $L$, היא ליפשיצית ביחס ל-$d'$ עם
      קבוע $\frac Lc$. איזה קבוע נותן המשפט ל-$d_\infty$ מתוך הקבוע של $d_2$ (בעזרת $d_2\le\sqrt2\,d_\infty$), ואיזה
      ל-$d_1$ מתוך הקבוע של $d_2$ (בעזרת $d_2\le d_1$)? האם הם הטובים ביותר?
    answer: >-
      (א) 1, $\sqrt2$, 2. (ב) ל-$d_\infty$: $\sqrt2\cdot\sqrt2=2$, הטוב ביותר. ל-$d_1$: $\sqrt2$, לא הטוב ביותר (הוא 1).
    solution:
      - kind: computation
        text: >-
          (א) עם $u=x_1-y_1$, $v=x_2-y_2$: $|f(x)-f(y)|=|u+v|$. ב-$d_1$: $|u+v|\le|u|+|v|=d_1$. ב-$d_2$: לפי קושי-שוורץ
          ב-$\mathbb{R}^2$, $|u\cdot1+v\cdot1|\le\sqrt2\,\sqrt{u^2+v^2}=\sqrt2\,d_2$. ב-$d_\infty$:
          $|u+v|\le|u|+|v|\le2\max(|u|,|v|)=2\,d_\infty$.
      - kind: check
        text: >-
          הדיקות: ב-$d_1$, $x-y=(1,0)$ נותן $|f(x)-f(y)|=1=d_1$. ב-$d_2$ וב-$d_\infty$, $x-y=(1,1)$ נותן $|f(x)-f(y)|=2$,
          $d_2=\sqrt2$, $d_\infty=1$. בכל מקרה שוויון בזוג נקודות שונות, ולכן קבוע קטן יותר נכשל שם. חישוב על
          200,000 זוגות אקראיים נתן יחסים מקסימליים $1$, $1.41421$, $1.99999$.
      - kind: step
        text: >-
          (ב) $d_2\le\sqrt2\,d_\infty$ פירושו $\frac1{\sqrt2}\,d_2\le d_\infty$, כלומר $c=\frac1{\sqrt2}$ עם $d=d_2$ ו-$d'=d_\infty$.
          מהקבוע $L=\sqrt2$ המשפט נותן $\frac{\sqrt2}{1/\sqrt2}=2$, ולפי (א) זה הטוב ביותר. עם $d_2\le d_1$ ($c=1$, $d'=d_1$)
          המשפט נותן $\frac{\sqrt2}1=\sqrt2$, ולפי (א) הטוב ביותר הוא 1.
      - kind: result
        text: >-
          (א) 1, $\sqrt2$, 2. (ב) הקבוע שמשפט 1.7.5 נותן הוא חסם: ל-$d_\infty$ הוא יוצא הדוק (2), ול-$d_1$ לא ($\sqrt2$
          במקום 1).

  - id: W-1.7-07
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-3, OBJ-1.7-2]
    prompt: >-
      במישור, "מטריקת הרכבת" מוגדרת כך: $\tau(x,y)=\|x\|_2+\|y\|_2$ אם $x\ne y$, ו-$\tau(x,x)=0$. אפשר להניח שזו
      מטריקה.

      (א) הוכיחו $d_2\le\tau$. מה נובע מזה לפי למה 1.7.4?

      (ב) הוכיחו שלכל $x\ne0$ הקבוצה $\{x\}$ פתוחה ב-$\tau$. האם היא פתוחה ב-$d_2$?

      (ג) הסיקו ש-$\tau$ ו-$d_2$ אינן שקולות טופולוגית, ולכן גם אינן שקולות ליפשיץ.

      (ד) אילו סדרות מתכנסות ב-$\tau$ לנקודה $x\ne0$? ולנקודה $0$?
    answer: >-
      (א) אי-שוויון המשולש של $\|\cdot\|_2$; כל קבוצה פתוחה ב-$d_2$ פתוחה ב-$\tau$. (ב) $B_\tau(x,\|x\|_2)=\{x\}$; ב-$d_2$
      לא. (ד) ל-$x\ne0$: רק סדרות שמ-$N$ מסוים שוות ל-$x$; ל-$0$: בדיוק הסדרות עם $\|x_n\|_2\to0$.
    solution:
      - kind: step
        text: >-
          (א) ל-$x=y$ שני האגפים 0. ל-$x\ne y$: $d_2(x,y)=\|x-y\|_2\le\|x\|_2+\|y\|_2=\tau(x,y)$, לפי אי-שוויון המשולש
          של הנורמה ו-$\|-y\|_2=\|y\|_2$. לפי למה 1.7.4 (עם $d'=d_2$, $d=\tau$, $C=1$): כל קבוצה פתוחה ב-$d_2$ פתוחה
          ב-$\tau$, וכל סדרה שמתכנסת ב-$\tau$ מתכנסת ב-$d_2$ לאותו גבול.
      - kind: step
        text: >-
          (ב) יהי $x\ne0$ ו-$r=\|x\|_2>0$. לכל $y\ne x$, $\tau(x,y)=\|x\|_2+\|y\|_2\ge r$, ולכן $y\notin B_\tau(x,r)$. כלומר
          $B_\tau(x,r)=\{x\}$, ו-$\{x\}$ פתוחה ב-$\tau$. ב-$d_2$ היא אינה פתוחה: לכל $s>0$ הנקודה
          $x+\frac s2e_1\ne x$ נמצאת ב-$B_{d_2}(x,s)$.
      - kind: step
        text: >-
          (ג) $\{(1,0)\}$ פתוחה ב-$\tau$ ולא ב-$d_2$, ולכן אין להן אותן קבוצות פתוחות (הגדרה 1.7.6). לפי משפט 1.7.5(1),
          מטריקות שקולות ליפשיץ שקולות טופולוגית, ולכן $\tau$ ו-$d_2$ אינן שקולות ליפשיץ. ישירות: עם $x=(1,0)$,
          $y=(1,t)$, $t>0$: $\tau\ge2$ ו-$d_2=t$, ולכן אין $C$ עם $\tau\le C\,d_2$.
      - kind: step
        text: >-
          (ד) אם $x_n\to x\ne0$ ב-$\tau$, אז מ-$N$ מסוים $\tau(x_n,x)<\|x\|_2$, ולפי (ב) $x_n=x$. ולהפך, סדרה שמ-$N$
          מסוים שווה ל-$x$ מתכנסת ל-$x$ בכל מטריקה. ל-$0$: $\tau(x_n,0)=\|x_n\|_2$ כש-$x_n\ne0$, ו-$0$ כש-$x_n=0$;
          בשני המקרים $\tau(x_n,0)=\|x_n\|_2$, ולכן $x_n\to0$ ב-$\tau$ אם ורק אם $\|x_n\|_2\to0$.
      - kind: check
        text: >-
          (ד) מתאים ל-(א): כל סדרה שמתכנסת ב-$\tau$ מתכנסת ב-$d_2$. ההפך נכשל: $(1,\frac1n)\to(1,0)$ ב-$d_2$, אבל
          $\tau\big((1,\frac1n),(1,0)\big)=\sqrt{1+\frac1{n^2}}+1>2$. זו שוב התופעה של טענה 1.7.7: קבוע אחד אינו
          מספיק.
      - kind: result
        text: >-
          $d_2\le\tau$ בלבד; ב-$\tau$ כל נקודה שונה מ-0 מבודדת, ולכן הקבוצות הפתוחות שונות והמטריקות אינן שקולות
          טופולוגית, ובוודאי לא ליפשיץ.

  - id: W-1.7-08
    level: mid
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      יהיו $(X,d_X)$ ו-$(Y,d_Y)$ מרחבים מטריים. על $X\times Y$, עם $p=(x,y)$ ו-$q=(x',y')$, נגדיר
      $D_1(p,q)=d_X(x,x')+d_Y(y,y')$, $D_\infty(p,q)=\max\big(d_X(x,x'),\ d_Y(y,y')\big)$ ו-
      $D_2(p,q)=\sqrt{d_X(x,x')^2+d_Y(y,y')^2}$.

      (א) הוכיחו ש-$D_2$ מטריקה. (את $D_1$ ו-$D_\infty$ אפשר להניח.)

      (ב) הוכיחו $D_\infty\le D_2\le D_1\le2\,D_\infty$.

      (ג) הוכיחו: $(x_n,y_n)\to(x,y)$ ב-$D_2$ אם ורק אם $x_n\to x$ ב-$X$ ו-$y_n\to y$ ב-$Y$.
    answer: >-
      (א) המשולש מהמשולש של $d_2$ במישור. (ב) כמו ב-$\mathbb{R}^2$, עם $a=d_X$, $b=d_Y$. (ג) המטריקות שקולות ליפשיץ
      (משפט 1.7.5), ו-$D_\infty(p_n,p)\to0$ פירושו ששני המרחקים שואפים ל-0.
    solution:
      - kind: idea
        text: >-
          לזוג נקודות מתאימים את הווקטור $\big(d_X(x,x'),\ d_Y(y,y')\big)$ במישור, ואז $D_1,D_2,D_\infty$ הן $\|\cdot\|_1$,
          $\|\cdot\|_2$, $\|\cdot\|_\infty$ שלו. כל אי-שוויון בין הנורמות במישור עובר.
      - kind: step
        text: >-
          (א) (M1) ו-(M2) מ-(M1) ו-(M2) של $d_X$ ושל $d_Y$. למשולש, עם $s=(x'',y'')$: נסמן $a_1=d_X(x,x')$, $a_2=d_X(x',x'')$,
          $b_1=d_Y(y,y')$, $b_2=d_Y(y',y'')$. לפי המשולש ב-$X$ וב-$Y$, $d_X(x,x'')\le a_1+a_2$ ו-$d_Y(y,y'')\le b_1+b_2$,
          וכל הגדלים אי-שליליים. לכן
          $D_2(p,s)\le\sqrt{(a_1+a_2)^2+(b_1+b_2)^2}\le\sqrt{a_1^2+b_1^2}+\sqrt{a_2^2+b_2^2}=D_2(p,q)+D_2(q,s)$; האי-שוויון
          השני הוא אי-שוויון המשולש של $\|\cdot\|_2$ במישור (טענה 1.1.5) לווקטורים $(a_1,b_1)$ ו-$(a_2,b_2)$.
      - kind: step
        text: >-
          (ב) עם $a=d_X(x,x')\ge0$, $b=d_Y(y,y')\ge0$: לפי משפט 1.7.3 עם $n=2$ לווקטור $(a,b)$,
          $\max(a,b)\le\sqrt{a^2+b^2}\le a+b\le2\max(a,b)$.
      - kind: step
        text: >-
          (ג) לפי (ב), $D_\infty\le D_2\le2\,D_\infty$, ולכן $D_2$ שקולה ליפשיץ ל-$D_\infty$; לפי משפט 1.7.5(3),
          $p_n\to p$ ב-$D_2$ אם ורק אם ב-$D_\infty$. ו-$D_\infty(p_n,p)=\max\big(d_X(x_n,x),d_Y(y_n,y)\big)<\varepsilon$
          בדיוק כששני המרחקים קטנים מ-$\varepsilon$; לכן $D_\infty(p_n,p)\to0$ אם ורק אם שניהם שואפים ל-0.
      - kind: check
        text: >-
          עם $X=Y=\mathbb{R}$ מקבלים את $d_1,d_2,d_\infty$ במישור ואת משפט 1.5.9 על התכנסות לפי קואורדינטות. הקבועים
          הדוקים כש-$X$ ו-$Y$ מכילים נקודות במרחק 1, למשל $\mathbb{R}$.
      - kind: result
        text: >-
          $D_2$ מטריקה, $D_\infty\le D_2\le D_1\le2D_\infty$, והתכנסות במכפלה היא התכנסות בכל רכיב.

  - id: W-1.7-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      על $C[0,1]$ נגדיר "מטריקות סופרמום עם משקל":
      $d_\mu(f,g)=\max_{x\in[0,1]}e^x|f(x)-g(x)|$ ו-$d_\nu(f,g)=\max_{x\in[0,1]}x\,|f(x)-g(x)|$. נסמן ב-$\theta$ את פונקציית
      האפס.

      (א) הוכיחו ש-$d_\mu$ ו-$d_\nu$ מטריקות.

      (ב) הוכיחו $d_\infty\le d_\mu\le e\,d_\infty$, והראו ששני הקבועים אינם ניתנים לשיפור. מה מסיקים על הקבוצות הפתוחות?

      (ג) הוכיחו $d_\nu\le d_\infty$, ושאין $C$ עם $d_\infty\le C\,d_\nu$. (רמז: $\varphi_n(x)=(1-x)^n$.)

      (ד) תהי $V=\{f\in C[0,1]:\ f(0)>0\}$. הוכיחו ש-$V$ פתוחה ב-$d_\infty$ וב-$d_\mu$. האם היא פתוחה ב-$d_\nu$?
    answer: >-
      (ב) $1\le e^x\le e$; שוויון ב-$e^{-x}$ ובפונקציה הקבועה 1; אותן קבוצות פתוחות ואותן סדרות מתכנסות. (ג)
      $d_\infty(\varphi_n,\theta)=1$ ו-$d_\nu(\varphi_n,\theta)=\frac1{n+1}\big(\frac n{n+1}\big)^n\le\frac1{n+1}$. (ד) פתוחה
      ב-$d_\infty$ (הכדור ברדיוס $f(0)$) וב-$d_\mu$ (משפט 1.7.5); לא פתוחה ב-$d_\nu$: $1-2\varphi_n$ קרובה ל-$1$ ב-$d_\nu$
      ומחוץ ל-$V$.
    solution:
      - kind: step
        text: >-
          (א) המקסימום קיים לפי משפט ויירשטראס, כי $w(x)|f(x)-g(x)|$ רציפה על $[0,1]$ ($w=e^x$ או $w=x$). סימטריה: מהערך
          המוחלט. משולש: לכל $x$, $w(x)|f-h|(x)\le w(x)|f-g|(x)+w(x)|g-h|(x)\le d(f,g)+d(g,h)$, ולוקחים מקסימום על $x$. אפס:
          $d_\mu(f,f)=d_\nu(f,f)=0$, ושני המקסימומים אי-שליליים. אם $d_\mu(f,g)=0$ אז $e^x|f(x)-g(x)|=0$ לכל $x$, ו-$e^x>0$, ולכן $f=g$. אם $d_\nu(f,g)=0$ אז $f=g$ על $(0,1]$,
          ומהרציפות גם $f(0)=\lim f(\tfrac1n)=\lim g(\tfrac1n)=g(0)$.
      - kind: step
        text: >-
          (ב) לכל $x\in[0,1]$: $1\le e^x\le e$, ולכן $|f-g|(x)\le e^x|f-g|(x)\le e\,|f-g|(x)$; מקסימום על $x$ נותן
          $d_\infty\le d_\mu\le e\,d_\infty$. שוויון משמאל: $f-g=e^{-x}$ נותנת $d_\mu=1=d_\infty$. שוויון מימין: $f-g\equiv1$
          נותנת $d_\mu=e$ ו-$d_\infty=1$. לכן $d_\mu$ ו-$d_\infty$ שקולות ליפשיץ, ולפי משפט 1.7.5 יש להן אותן קבוצות
          פתוחות ואותן סדרות מתכנסות.
      - kind: step
        text: >-
          (ג) $0\le x\le1$ על $[0,1]$, ולכן $x|f-g|(x)\le|f-g|(x)$ ו-$d_\nu\le d_\infty$. עבור $\varphi_n(x)=(1-x)^n$:
          $0\le\varphi_n\le1$ ו-$\varphi_n(0)=1$, ולכן $d_\infty(\varphi_n,\theta)=1$. הנגזרת של $h(x)=x(1-x)^n$ היא
          $(1-x)^{n-1}\big(1-(n+1)x\big)$, אי-שלילית על $[0,\frac1{n+1}]$ ואי-חיובית על $[\frac1{n+1},1]$; לכן המקסימום של
          $h$ מושג ב-$x=\frac1{n+1}$, ו-$d_\nu(\varphi_n,\theta)=\frac1{n+1}\big(\frac n{n+1}\big)^n\le\frac1{n+1}$. אילו היה $C$ עם
          $d_\infty\le C\,d_\nu$, היינו מקבלים $1\le\frac{C}{n+1}$ לכל $n$, וזה נכשל כש-$n+1>C$ (ארכימדס).
      - kind: step
        text: >-
          (ד) פתוחה ב-$d_\infty$: תהי $f\in V$ ו-$r=f(0)>0$. אם $d_\infty(g,f)<r$, אז $|g(0)-f(0)|<r$, ולכן
          $g(0)>f(0)-r=0$. כלומר $B_{d_\infty}(f,f(0))\subseteq V$. לפי (ב), $d_\mu$ שקולה ליפשיץ ל-$d_\infty$, ולפי משפט
          1.7.5(1) $V$ פתוחה גם ב-$d_\mu$.
      - kind: step
        text: >-
          **לא** פתוחה ב-$d_\nu$: הפונקציה הקבועה $1$ שייכת ל-$V$. יהי $r>0$, ונבחר $n$ עם $\frac2{n+1}<r$. נגדיר
          $h_n=1-2\varphi_n$. אז $h_n(0)=-1$, ולכן $h_n\notin V$; ולפי (ג)
          $d_\nu(h_n,1)=2\,d_\nu(\varphi_n,\theta)\le\frac2{n+1}<r$. לכן אף כדור של $d_\nu$ סביב $1$ אינו מוכל ב-$V$.
      - kind: check
        text: >-
          המשקל $e^x$ חסום מלמטה במספר חיובי (1), ולכן הוא לא משנה דבר. המשקל $x$ מתאפס ב-0, ולכן $d_\nu$ "לא רואה" מה
          שקורה ליד 0, ושם בדיוק $\varphi_n$ גבוהה ו-$V$ מוגדרת. עם $n=5$: $d_\nu(\varphi_5,\theta)=\frac16\big(\frac56\big)^5\approx0.0670$,
          בנקודה $x=\frac16$; עם $n=10$: $\approx0.0350$ (חישוב על רשת של 200,001 נקודות נותן אותם ערכים). זה אותו
          דפוס כמו בטענה 1.7.7: $d_\nu\le d_\infty$ בלבד.
      - kind: result
        text: >-
          $d_\mu$ שקולה ליפשיץ ל-$d_\infty$ (קבועים 1 ו-$e$, הטובים ביותר). $d_\nu\le d_\infty$ בלבד: הן אינן שקולות ליפשיץ,
          ואף לא שקולות טופולוגית, כי $V$ פתוחה ב-$d_\infty$ ולא ב-$d_\nu$.

  - id: W-1.7-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      על $X=(0,\infty)$ נגדיר $d(x,y)=|x-y|$ ו-$d'(x,y)=\left|\frac1x-\frac1y\right|$.

      (א) הוכיחו ש-$d'$ מטריקה, ושהיא שקולה טופולוגית ל-$d$.

      (ב) הוכיחו ש-$f(x)=\frac1x$ רציפה במידה שווה מ-$(X,d')$ אל $\mathbb{R}$, ואינה רציפה במידה שווה מ-$(X,d)$.

      (ג) הסיקו ש-$d$ ו-$d'$ אינן שקולות ליפשיץ, והראו ישירות שאף אחד משני הקבועים אינו קיים.
    answer: >-
      (א) $d'$ היא $|\cdot|$ אחרי $x\mapsto\frac1x$; אותן סדרות מתכנסות (טענה 1.7.6א). (ב) $|f(x)-f(y)|=d'(x,y)$; על
      $(0,1]$ לא במידה שווה ב-$d$. (ג) משפט 1.7.5(6); $d'(\frac1n,\frac1{2n})=n$ מול $d=\frac1{2n}$, ו-$d'(n,2n)=\frac1{2n}$
      מול $d=n$.
    solution:
      - kind: step
        text: >-
          (א) $d'(x,y)=|\varphi(x)-\varphi(y)|$ עם $\varphi(x)=\frac1x$, יורדת ממש על $(0,\infty)$ ולכן חד-חד-ערכית; לפי טענה 1.1.13(ב) $d'$ מטריקה. ישירות, (M1):
          $d'\ge0$, ו-$d'(x,y)=0$ גורר $\varphi(x)=\varphi(y)$, כלומר $x=y$. (M2) ו-(M3) עוברים מ-$|\cdot|$ ב-$\mathbb{R}$.
      - kind: step
        text: >-
          סדרות: אם $x_n\to x$ ב-$d$ (עם $x>0$), אז מהרציפות של $\varphi$ ב-$x$ (אינפי 1) $\frac1{x_n}\to\frac1x$, כלומר
          $x_n\to x$ ב-$d'$. ולהפך, אם $\frac1{x_n}\to\frac1x$, אז מהרציפות של $t\mapsto\frac1t$ ב-$\frac1x>0$ נובע
          $x_n=\frac1{1/x_n}\to x$. לפי טענה 1.7.6א, (ג)$\Rightarrow$(א), $d$ ו-$d'$ שקולות טופולוגית.
      - kind: step
        text: >-
          (ב) $|f(x)-f(y)|=d'(x,y)$, ולכן $f$ ליפשיצית עם קבוע 1 ביחס ל-$d'$, ולפי טענה 1.6.9 רציפה במידה שווה. ביחס
          ל-$d$, ניקח $\varepsilon=1$. לכל $\delta>0$ נבחר $n>\frac1\delta$, ונגדיר $x=\frac1n$ ו-$y=\frac1{2n}$. אז
          $d(x,y)=\frac1{2n}<\delta$, אבל $|f(x)-f(y)|=|n-2n|=n\ge1$.
      - kind: step
        text: >-
          (ג) לפי משפט 1.7.5(6), אילו $d$ ו-$d'$ היו שקולות ליפשיץ, $f$ הייתה רציפה במידה שווה בשתיהן או באף אחת; (ב)
          מראה שלא כך. ישירות: עם $x=\frac1n$, $y=\frac1{2n}$, $d'=n$ ו-$d=\frac1{2n}$, ולכן $d'\le C\,d$ דורש
          $2n^2\le C$ לכל $n$. עם $x=n$, $y=2n$, $d=n$ ו-$d'=\frac1{2n}$, ולכן $d\le C\,d'$ דורש $2n^2\le C$ לכל $n$.
          שניהם נכשלים (ארכימדס).
      - kind: check
        text: >-
          חישוב: $d'(10,20)=0.05$ מול $d(10,20)=10$, ו-$d'(100,200)=0.005$ מול $100$. הקבוע $d\le C\,d'$ נכשל במרחקים
          גדולים, ו-$d'\le C\,d$ ליד $0$, כמו ב-W-1.7-05.
      - kind: result
        text: >-
          ל-$d$ ול-$d'$ אותן קבוצות פתוחות ואותן סדרות מתכנסות, ובכל זאת הן אינן שקולות ליפשיץ: רציפות נשמרת בשקילות
          טופולוגית, רציפות במידה שווה לא.

challenge:
  - id: W-1.7-c1
    stars: 1
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      תהי $\ell^1$ קבוצת הסדרות הממשיות $x=(x_1,x_2,x_3,\dots)$ עם $\sum_{k=1}^\infty|x_k|<\infty$ (הטור מתכנס
      בהחלט). זה מרחב וקטורי עם חיבור וכפל בסקלר איבר-איבר. נגדיר עליו
      $\|x\|_1=\sum_{k=1}^\infty|x_k|$ ו-$\|x\|_w=\sum_{k=1}^\infty e^{-k}|x_k|$, ונסמן ב-$u_n$ את הסדרה שבמקום ה-$n$
      שלה $1$ ובשאר המקומות $0$.

      (א) הוכיחו ש-$\|\cdot\|_w$ נורמה על $\ell^1$. (ש-$\|\cdot\|_1$ נורמה מוכיחים באותה דרך.)

      (ב) הוכיחו ש-$\|x\|_w\le e^{-1}\|x\|_1$ לכל $x\in\ell^1$.

      (ג) הוכיחו שהמטריקות המושרות מ-$\|\cdot\|_1$ ומ-$\|\cdot\|_w$ אינן שקולות ליפשיץ.

      (ד) הראו ש-$u_n\to0$ ב-$\|\cdot\|_w$, ושהסדרה $(u_n)$ אינה מתכנסת ב-$\|\cdot\|_1$ לשום גבול.

      (ה) הראו שכדור היחידה הפתוח $U=\{x:\ \|x\|_1<1\}$ פתוח ב-$\|\cdot\|_1$ ואינו פתוח ב-$\|\cdot\|_w$.
    answer: >-
      (ב) $e^{-k}\le e^{-1}$. (ג) $\|u_n\|_1=1$ ו-$\|u_n\|_w=e^{-n}$, ולכן אין $C$ עם $\|x\|_1\le C\|x\|_w$. (ד)
      $\|u_n\|_w=e^{-n}\to0$; גבול ב-$\|\cdot\|_1$ היה צריך להיות $0$ בכל קואורדינטה, אבל $\|u_n\|_1=1$. (ה)
      כש-$2e^{-n}<r$: $\|2u_n\|_w<r$, ובכל זאת $2u_n\notin U$.
    solution:
      - kind: given
        text: >-
          $\ell^1$, $\|x\|_1=\sum|x_k|$, $\|x\|_w=\sum e^{-k}|x_k|$, ו-$u_n$ כמו בשאלה.
      - kind: idea
        text: >-
          המשקלות $e^{-k}$ הופכים קואורדינטות רחוקות כמעט לבלתי נראות ל-$\|\cdot\|_w$, ואילו $\|\cdot\|_1$ רואה אותן
          בגודלן המלא. וקטור יחידה שנדחף רחוק, $u_n$, גודלו $1$ ב-$\|\cdot\|_1$ ו-$e^{-n}\to0$ ב-$\|\cdot\|_w$, ולכן
          שום קבוע לא משווה בין שתי הנורמות בכיוון הזה.
      - kind: step
        text: >-
          (א) הטור $\sum e^{-k}|x_k|$ מתכנס, כי $0\le e^{-k}|x_k|\le|x_k|$ (מבחן ההשוואה). אם $\|x\|_w=0$, כל מחובר
          אי-שלילי הוא $0$, ולכן $x_k=0$ לכל $k$. $\|cx\|_w=\sum e^{-k}|c||x_k|=|c|\,\|x\|_w$. משולש: לכל $k$,
          $e^{-k}|x_k+y_k|\le e^{-k}|x_k|+e^{-k}|y_k|$, וסוכמים (טורים מתכנסים עם אי-שוויון בין האיברים).
      - kind: step
        text: >-
          (ב) ל-$k\ge1$, $e^{-k}\le e^{-1}$, ולכן $\|x\|_w=\sum e^{-k}|x_k|\le e^{-1}\sum|x_k|=e^{-1}\|x\|_1$. בפרט
          $\|x-y\|_w\le e^{-1}\|x-y\|_1$: אחד משני האי-שוויונים של שקילות ליפשיץ (הגדרה 1.7.1) מתקיים.
      - kind: step
        text: >-
          (ג) נניח שיש $C>0$ עם $\|x\|_1\le C\|x\|_w$ לכל $x$. עם $x=u_n$: $\|u_n\|_1=1$ ו-$\|u_n\|_w=e^{-n}$, ולכן
          $1\le Ce^{-n}$, כלומר $e^n\le C$ לכל $n\in\mathbb{N}$. זה בלתי אפשרי, כי $e^n\to\infty$. לכן האי-שוויון השני
          של שקילות ליפשיץ נכשל, והמטריקות אינן שקולות ליפשיץ.
      - kind: step
        text: >-
          (ד) $\|u_n-0\|_w=e^{-n}\to0$, ולכן $u_n\to0$ ב-$\|\cdot\|_w$. נניח ש-$u_n\to y$ ב-$\|\cdot\|_1$. לכל $k$ קבוע,
          $|(u_n)_k-y_k|\le\|u_n-y\|_1\to0$, ו-$(u_n)_k=0$ לכל $n>k$. לכן $y_k=0$ לכל $k$, כלומר $y=0$.
      - kind: step
        text: >-
          אבל $\|u_n-0\|_1=1$ לכל $n$, ולכן $u_n\not\to0$ ב-$\|\cdot\|_1$. סתירה: $(u_n)$ אינה מתכנסת ב-$\|\cdot\|_1$.
          זו הוכחה שנייה ל-(ג): למטריקות שקולות ליפשיץ יש אותן סדרות מתכנסות (משפט 1.7.5(3)).
      - kind: step
        text: >-
          (ה) $U$ הוא הכדור הפתוח ברדיוס 1 סביב $0$ של המטריקה המושרית מ-$\|\cdot\|_1$, ולכן פתוח בה. $0\in U$. יהי
          $r>0$, ונבחר $n$ עם $2e^{-n}<r$. אז $\|2u_n\|_w=2e^{-n}<r$, כלומר $2u_n$ בכדור ברדיוס $r$ סביב $0$ של
          $\|\cdot\|_w$, אבל $\|2u_n\|_1=2$, ולכן $2u_n\notin U$. אין כדור של $\|\cdot\|_w$ סביב $0$ שמוכל ב-$U$, ו-$U$
          אינה פתוחה ב-$\|\cdot\|_w$.
      - kind: check
        text: >-
          $\|u_n\|_w=e^{-n}$, כלומר $\frac1e,\ \frac1{e^2},\ \frac1{e^3}$ ל-$n=1,2,3$. השוו לטענה 1.7.7: שם
          $d_1\le d_\infty$ על $C[0,1]$, והסדרה $x^n$ והקבוצה של טענה 1.3.14 הפרידו בין שתי המטריקות; כאן אותה תופעה
          במרחב של סדרות.
      - kind: result
        text: >-
          $\|x\|_w\le e^{-1}\|x\|_1$, אבל אין קבוע בכיוון ההפוך: הנורמות אינן שקולות ליפשיץ, ויש להן סדרות מתכנסות
          שונות וקבוצות פתוחות שונות. במרחב ממימד אינסופי שתי נורמות יכולות להיות ניתנות להשוואה בכיוון אחד בלבד.
