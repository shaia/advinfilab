  - id: W-1.7-c2
    stars: 1
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      יהי $X=\{0,1\}^{\mathbb{N}}$ מרחב כל הסדרות $x=(x_1,x_2,\dots)$ שאיבריהן $0$ או $1$. ל-$x\ne y$ נסמן ב-$k(x,y)$
      את האינדקס הראשון שבו $x_n\ne y_n$, ונגדיר

      $$\delta(x,y)=2^{-k(x,y)}\ \ (x\ne y),\qquad \delta(x,x)=0,\qquad \tau(x,y)=\sum_{n=1}^{\infty}\frac{|x_n-y_n|}{2^n}.$$

      (א) הוכיחו ש-$\delta$ ו-$\tau$ מטריקות. (רמז ל-$\delta$: הוכיחו אפילו $\delta(x,z)\le\max\big(\delta(x,y),\delta(y,z)\big)$.)

      (ב) הוכיחו $\delta\le\tau\le2\delta$, והראו ששני הקבועים הדוקים.

      (ג) הסיקו: סדרה $x^{(j)}$ מתכנסת ל-$x$ ב-$\tau$ אם ורק אם לכל $N$, מ-$j$ מסוים והלאה $x^{(j)}$ מסכימה עם $x$
      ב-$N$ האיברים הראשונים.
    answer: >-
      (ב) עם $k=k(x,y)$: $\tau=2^{-k}+\sum_{n>k}\frac{|x_n-y_n|}{2^n}$, וזה בין $2^{-k}$ ל-$2\cdot2^{-k}$; שוויון כשהסדרות
      נבדלות רק ב-$k$, וכשהן נבדלות בכל $n\ge k$. (ג) $\delta(x^{(j)},x)<2^{-N}$ פירושו הסכמה ב-$N$ האיברים
      הראשונים, ו-$\tau$ שקולה ליפשיץ ל-$\delta$.
    solution:
      - kind: idea
        text: >-
          $\delta$ מודדת **כמה מוקדם** שתי סדרות נפרדות, ו-$\tau$ סוכמת את כל ההבדלים עם משקלות שקטנים פי 2 בכל צעד.
          האיבר הראשון שבו הן נבדלות שולט ב-$\tau$, כי כל מה שאחריו יחד שוקל לכל היותר כמוהו.
      - kind: step
        text: >-
          (א) $\delta$: אפס וסימטריה מההגדרה. למשולש החזק, נניח $x,y,z$ שונות זו מזו (אחרת הטענה מיידית) ונסמן
          $m=\min\big(k(x,y),k(y,z)\big)$. לכל $n<m$ מתקיים $x_n=y_n$ ו-$y_n=z_n$, ולכן $x_n=z_n$. לכן $k(x,z)\ge m$, כלומר
          $\delta(x,z)=2^{-k(x,z)}\le2^{-m}=\max\big(\delta(x,y),\delta(y,z)\big)\le\delta(x,y)+\delta(y,z)$.
      - kind: step
        text: >-
          $\tau$: הטור מתכנס, כי כל איבר לכל היותר $2^{-n}$. סימטריה: מהערך המוחלט. משולש: $|x_n-z_n|\le|x_n-y_n|+|y_n-z_n|$
          לכל $n$; מחלקים ב-$2^n$ וסוכמים. ו-$\tau(x,y)=0$ גורר שכל האיברים אפס, כלומר $x=y$.
      - kind: computation
        text: >-
          (ב) יהי $x\ne y$ ו-$k=k(x,y)$. האיברים עם $n<k$ אפס, והאיבר ה-$k$ הוא $2^{-k}$, ולכן
          $\tau(x,y)=2^{-k}+\sum_{n>k}\frac{|x_n-y_n|}{2^n}$. הסכום הנוסף בין $0$ ל-$\sum_{n>k}2^{-n}=2^{-k}$. לכן
          $2^{-k}\le\tau\le2\cdot2^{-k}$, כלומר $\delta\le\tau\le2\delta$.
      - kind: check
        text: >-
          הדיקות: $x=(0,0,0,\dots)$ ו-$y=(1,0,0,\dots)$ נותנות $\delta=\tau=\frac12$. ו-$x=(0,0,\dots)$, $y=(1,1,\dots)$
          נותנות $\delta=\frac12$ ו-$\tau=\sum 2^{-n}=1=2\delta$.
      - kind: step
        text: >-
          (ג) לפי (ב) ולפי משפט 1.7.5(3), ל-$\tau$ ול-$\delta$ אותן סדרות מתכנסות. ו-$\delta(x^{(j)},x)<2^{-N}$ אם ורק
          אם $x^{(j)}=x$ או $k(x^{(j)},x)>N$, כלומר $x^{(j)}$ מסכימה עם $x$ ב-$N$ האיברים הראשונים. "לכל $\varepsilon$
          מ-$j$ מסוים" עם $\varepsilon=2^{-N}$ הוא בדיוק התנאי.
      - kind: result
        text: >-
          $\delta,\tau$ מטריקות, $\delta\le\tau\le2\delta$ עם קבועים הדוקים, והתכנסות בהן היא "התייצבות" של כל קטע
          התחלתי סופי.
