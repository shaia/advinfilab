# Workbook of lesson 1.7 — Lipschitz equivalence of metrics.
# Objectives (src/course.ts):
#   OBJ-1.7-1  Lipschitz equivalence; best constants between d1, d2, d-infinity on R^n
#   OBJ-1.7-2  Lipschitz-equivalent metrics: same open sets, same convergent sequences, same continuous functions
#   OBJ-1.7-3  a one-sided bound is not enough; same open sets without Lipschitz equivalence
# W-01, W-05, W-09, W-10 and c1 moved here from lesson 1.6's workbook when 1.6 was split (2026-11-10).
lesson: '1.7'
practice:
  - id: W-1.7-01
    level: basic
    objectives: [OBJ-1.7-1]
    prompt: >-
      ב-$\mathbb{R}^3$ מצאו את הקבועים הקטנים ביותר $C_1$, $C_2$ כך ש-$d_1\le C_1\,d_\infty$ ו-$d_2\le C_2\,d_\infty$, והסבירו
      למה אי אפשר להקטין אותם.
    answer: >-
      $C_1=3$, $C_2=\sqrt3\approx1.732$.
    solution:
      - kind: computation
        text: >-
          נסמן $u_i=|x_i-y_i|$ ו-$M=\max u_i=d_\infty(x,y)$. אז $d_1=u_1+u_2+u_3\le3M$, ו-$d_2=\sqrt{u_1^2+u_2^2+u_3^2}\le\sqrt{3M^2}=\sqrt3\,M$.
      - kind: check
        text: >-
          עם $x-y=(1,1,1)$: $d_\infty=1$, $d_1=3$, $d_2=\sqrt3$. השוויון מתקבל, ולכן קבוע קטן יותר נכשל בזוג הזה.
      - kind: result
        text: >-
          $C_1=3$ ו-$C_2=\sqrt3$. יחד עם $d_\infty\le d_2\le d_1$, שלוש המטריקות שקולות ליפשיץ ב-$\mathbb{R}^3$.

  - id: W-1.7-02
    level: basic
    objectives: [OBJ-1.7-1]
    prompt: >-
      במישור נגדיר $\tau(x,y)=\max\big(|x_1-y_1|,\ 3|x_2-y_2|\big)$. מצאו את הקבועים הטובים ביותר $c,C$ כך ש-
      $c\,d_\infty\le\tau\le C\,d_\infty$.
    answer: >-
      $c=1$, $C=3$: $d_\infty\le\tau\le3\,d_\infty$, עם שוויון ב-$x-y=(1,0)$ וב-$x-y=(0,1)$.
    solution:
      - kind: idea
        text: >-
          נסמן $u=|x_1-y_1|$, $v=|x_2-y_2|$. רק ההפרש השני מוכפל ב-3, והראשון נשאר. לכן המקסימום לא קטן, וגדל לכל
          היותר פי 3.
      - kind: computation
        text: >-
          $\max(u,v)\le\max(u,3v)$, כי $v\le3v$. ו-$\max(u,3v)\le\max(3u,3v)=3\max(u,v)$. לכן $d_\infty\le\tau\le3\,d_\infty$.
      - kind: check
        text: >-
          עם $x-y=(1,0)$: $\tau=1=d_\infty$, שוויון משמאל. עם $x-y=(0,1)$: $\tau=3$ ו-$d_\infty=1$, שוויון מימין. לכן אי
          אפשר להגדיל את $c$ או להקטין את $C$.
      - kind: result
        text: >-
          $c=1$, $C=3$. בפרט $\tau$ ו-$d_\infty$ שקולות ליפשיץ, ויש להן אותן קבוצות פתוחות.

  - id: W-1.7-03
    level: basic
    qualitative: true
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      על $\mathbb{R}$ עם $d(x,y)=|x-y|$, קבעו לכל מטריקה אם היא שקולה ליפשיץ ל-$d$, ונמקו (מותר להניח שאלה
      מטריקות).

      (א) $d'(x,y)=3|x-y|$.

      (ב) $d'(x,y)=|x-y|+|\sin x-\sin y|$.

      (ג) $d'(x,y)=|x-y|+|x^2-y^2|$. (רמז: נסו זוגות נקודות רחוקים מהראשית, כמו $n$ ו-$n+1$.)
    answer: >-
      (א) כן, $c=C=3$. (ב) כן: $d\le d'\le2d$. (ג) לא: $d'(n,n+1)=2n+2$ ו-$d(n,n+1)=1$.
    solution:
      - kind: definition
        text: >-
          שקולות ליפשיץ: יש $c,C>0$ עם $c\,d\le d'\le C\,d$. כדי לשלול מספיק להראות שהיחס $\frac{d'}{d}$, על זוגות
          נקודות שונות, אינו חסום, או שיש לו ערכים קרובים ל-0 כרצוננו.
      - kind: step
        text: >-
          (א) $d'=3d$, ולכן $3d\le d'\le3d$.
      - kind: step
        text: >-
          (ב) $d\le d'$ כי המחובר השני אי-שלילי. לפי משפט הערך הממוצע $|\sin x-\sin y|=|\cos t|\,|x-y|\le|x-y|$, ולכן
          $d'\le2d$.
      - kind: step
        text: >-
          (ג) $d\le d'$, אבל אין $C$: עם $x=n$, $y=n+1$, $d'=1+\big|n^2-(n+1)^2\big|=1+(2n+1)=2n+2$ ו-$d=1$. היחס
          $2n+2$ אינו חסום.
      - kind: check
        text: >-
          ב-(ב) הקבוע 2 הוא הטוב ביותר אף שאינו מתקבל: ליד 0, $\frac{|\sin t|}{t}\to1$, ולכן היחס $\frac{d'}{d}$ מתקרב
          ל-2. ב-(ג) הקבוע נכשל במרחקים **גדולים מהראשית**, אף שהנקודות במרחק 1 זו מזו.
      - kind: result
        text: >-
          (א) ו-(ב) שקולות ליפשיץ ל-$d$; (ג) לא.

  - id: W-1.7-04
    level: mid
    objectives: [OBJ-1.7-1]
    prompt: >-
      במישור נגדיר $\langle a,b\rangle_*=a_1b_1+4a_2b_2$ ו-$\tau(x,y)=\sqrt{\langle x-y,\ x-y\rangle_*}$.

      (א) הסבירו למה $\langle\cdot,\cdot\rangle_*$ מכפלה פנימית, ולכן $\tau$ מטריקה (שיעור 1.2).

      (ב) מצאו את הקבועים הטובים ביותר ב-$c\,d_2\le\tau\le C\,d_2$.
    answer: >-
      (א) סימטרית, לינארית, ו-$a_1^2+4a_2^2>0$ ל-$a\ne0$. (ב) $c=1$, $C=2$.
    solution:
      - kind: step
        text: >-
          (א) $\langle a,b\rangle_*$ סימטרית ולינארית בכל משתנה (סכום של מכפלות של קואורדינטות עם מקדמים קבועים), ו-
          $\langle a,a\rangle_*=a_1^2+4a_2^2>0$ לכל $a\ne0$. נורמה שבאה ממכפלה פנימית משרה מטריקה (שיעור 1.2).
      - kind: computation
        text: >-
          (ב) עם $u=x_1-y_1$, $v=x_2-y_2$: $u^2+v^2\le u^2+4v^2\le4(u^2+v^2)$. מוציאים שורש: $d_2\le\tau\le2\,d_2$.
      - kind: check
        text: >-
          שוויון משמאל ב-$x-y=(1,0)$: $\tau=1=d_2$. שוויון מימין ב-$x-y=(0,1)$: $\tau=2$ ו-$d_2=1$. כדור היחידה של
          $\tau$ הוא האליפסה $u^2+4v^2<1$, שנמצאת בין העיגול ברדיוס $\tfrac12$ לעיגול ברדיוס 1.
      - kind: result
        text: >-
          $d_2\le\tau\le2\,d_2$, עם קבועים הדוקים; לכן $\tau$ ו-$d_2$ שקולות ליפשיץ.

  - id: W-1.7-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.7-3]
    prompt: >-
      על $\mathbb{R}$ נתונות $d(x,y)=|x-y|$ ו-$d'(x,y)=|x^3-y^3|$ (מטריקה לפי שיעור 1.1, כי $x\mapsto x^3$ חד-חד-ערכית).

      (א) הוכיחו שהזהות מ-$(\mathbb{R},d)$ אל $(\mathbb{R},d')$ היא הומיאומורפיזם (ההגדרה בשיעור 1.6).

      (ב) הסיקו של-$d$ ול-$d'$ אותן קבוצות פתוחות.

      (ג) הוכיחו ש-$d$ ו-$d'$ אינן שקולות ליפשיץ: אף אחד משני הקבועים אינו קיים.
    answer: >-
      (א) $x^3$ ושורש שלישי רציפים. (ב) התמונה של פתוחה תחת הומיאומורפיזם היא המקור שלה תחת ההפכית. (ג) $n$ ו-$0$
      נותנים $n^3$ מול $n$; $\frac1n$ ו-$0$ נותנים $\frac1{n^3}$ מול $\frac1n$.
    solution:
      - kind: definition
        text: >-
          הומיאומורפיזם: חד-חד-ערכית ועל, רציפה, ועם הפכית רציפה. הזהות $\mathrm{id}(x)=x$ חד-חד-ערכית ועל, וההפכית שלה
          היא הזהות בכיוון ההפוך.
      - kind: step
        text: >-
          (א) רציפות מ-$d$ ל-$d'$: אם $|x_n-a|\to0$ אז $x_n^3\to a^3$ (רציפות של $x^3$, אינפי 1), כלומר $d'(x_n,a)\to0$.
          רציפות מ-$d'$ ל-$d$: אם $|x_n^3-a^3|\to0$, אז מהרציפות של השורש השלישי $x_n=\sqrt[3]{x_n^3}\to\sqrt[3]{a^3}=a$.
          לפי המשפט משיעור 1.6 (פונקציה רציפה בנקודה אם ורק אם היא שולחת כל סדרה שמתכנסת אליה לסדרה שמתכנסת לתמונה),
          שתי הזהויות רציפות, והזהות היא הומיאומורפיזם.
      - kind: step
        text: >-
          (ב) תהי $U$ פתוחה ב-$d$. התמונה שלה תחת הזהות היא $U$ עצמה, וזה גם המקור של $U$ תחת ההפכית, שהיא רציפה
          מ-$(\mathbb{R},d')$ אל $(\mathbb{R},d)$. לפי המשפט על מקורות, $U$ פתוחה ב-$d'$. באותו אופן, עם הזהות
          בכיוון השני, כל קבוצה פתוחה ב-$d'$ פתוחה ב-$d$. (באופן כללי: הומיאומורפיזם שולח קבוצות פתוחות לקבוצות פתוחות,
          כי התמונה תחת $f$ היא המקור תחת $f^{-1}$.)
      - kind: step
        text: >-
          (ג) אילו היה $C$ עם $d'\le C\,d$, אז עם $x=n$, $y=0$: $n^3\le Cn$, כלומר $n^2\le C$ לכל $n$, וזה נכשל. אילו היה
          $C$ עם $d\le C\,d'$, אז עם $x=\frac1n$, $y=0$: $\frac1n\le\frac{C}{n^3}$, כלומר $n^2\le C$ לכל $n$, וזה נכשל.
      - kind: check
        text: >-
          השוו לדוגמאות שבשיעור: ב-$\min(d,1)$ נכשל רק קבוע אחד (במרחקים גדולים). ב-$\sqrt{d_2}$ נכשלים שניהם, כל אחד
          בקצה אחר. כאן: $d'\le Cd$ נכשל במרחקים גדולים ($n^3$ מול $n$) ו-$d\le Cd'$ בקטנים ($\frac1n$ מול
          $\frac1{n^3}$); ועדיין הקבוצות הפתוחות זהות, כי הזהות היא הומיאומורפיזם.
      - kind: result
        text: >-
          (א) הזהות הומיאומורפיזם. (ב) לכן אותן קבוצות פתוחות. (ג) אין אף אחד מהקבועים: שקילות ליפשיץ מספיקה לאותן
          קבוצות פתוחות, אבל אינה הכרחית.

  - id: W-1.7-06
    level: mid
    objectives: [OBJ-1.7-2, OBJ-1.7-1]
    prompt: >-
      (א) יהיו $d,d'$ על $X$ עם $c\,d\le d'$ ($c>0$), ותהי $f:X\to Y$ ליפשיצית ביחס ל-$d$ עם קבוע $L$. הוכיחו ש-$f$
      ליפשיצית ביחס ל-$d'$ עם קבוע $\frac Lc$.

      (ב) תהי $f(x,y)=x+y$ מהמישור ל-$\mathbb{R}$. מצאו את קבוע ליפשיץ הטוב ביותר שלה כשבמישור $d_1$, כשבמישור
      $d_2$, וכשבמישור $d_\infty$.

      (ג) מ-$d_2\le\sqrt2\,d_\infty$ ו-(א), איזה קבוע מקבלים ל-$d_\infty$ מהקבוע של $d_2$? האם הוא הטוב ביותר?
    answer: >-
      (א) $d_Y(f(x),f(y))\le L\,d\le\frac Lc\,d'$. (ב) 1, $\sqrt2$, 2. (ג) $\sqrt2\cdot\sqrt2=2$, הטוב ביותר.
    solution:
      - kind: step
        text: >-
          (א) $d\le\frac1c d'$, ולכן $d_Y(f(x),f(y))\le L\,d(x,y)\le\frac Lc\,d'(x,y)$.
      - kind: computation
        text: >-
          (ב) עם $u=x_1-y_1$, $v=x_2-y_2$: $|f(x)-f(y)|=|u+v|$.
          ב-$d_1$: $|u+v|\le|u|+|v|=d_1$, ושוויון ב-$(1,0)$: הקבוע 1.
          ב-$d_2$: לפי קושי-שוורץ $|u\cdot1+v\cdot1|\le\sqrt2\,\sqrt{u^2+v^2}$, ושוויון ב-$(1,1)$: הקבוע $\sqrt2$.
          ב-$d_\infty$: $|u+v|\le2\max(|u|,|v|)$, ושוויון ב-$(1,1)$: הקבוע 2.
      - kind: step
        text: >-
          (ג) $d_2\le\sqrt2\,d_\infty$ פירושו $\frac1{\sqrt2}d_2\le d_\infty$, כלומר $c=\frac1{\sqrt2}$ ב-(א) עם $d=d_2$
          ו-$d'=d_\infty$. מהקבוע $L=\sqrt2$ מקבלים $\frac{\sqrt2}{1/\sqrt2}=2$, ולפי (ב) זה הקבוע הטוב ביותר.
      - kind: check
        text: >-
          אם מתחילים מ-$d_2$ ועוברים ל-$d_1$ עם $d_2\le d_1$ ($c=1$), (א) נותן $\sqrt2$, שאינו הטוב ביותר (הוא 1): הקבוע
          ש-(א) נותן הוא חסם, לא תמיד הדוק.
      - kind: result
        text: >-
          (א) ליפשיציות עוברת בין מטריקות שקולות ליפשיץ, עם קבוע שמשתנה. (ב) 1, $\sqrt2$, 2. (ג) 2, הטוב ביותר.

  - id: W-1.7-07
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-3, OBJ-1.7-2]
    prompt: >-
      במישור, "מטריקת הרכבת" מתרגיל W-1.1-05: $\tau(x,y)=\|x\|_2+\|y\|_2$ אם $x\ne y$, ו-$\tau(x,x)=0$.

      (א) הוכיחו $d_2\le\tau$.

      (ב) הוכיחו שלכל $x\ne0$ הקבוצה $\{x\}$ פתוחה ב-$\tau$. האם היא פתוחה ב-$d_2$?

      (ג) הסיקו ש-$\tau$ ו-$d_2$ אינן שקולות ליפשיץ, ואפילו אין להן אותן קבוצות פתוחות.

      (ד) אילו סדרות מתכנסות ב-$\tau$ לנקודה $x\ne0$? ולנקודה $0$?
    answer: >-
      (א) אי-שוויון המשולש של $\|\cdot\|_2$. (ב) $B_\tau(x,\|x\|_2)=\{x\}$; ב-$d_2$ לא. (ד) ל-$x\ne0$: רק סדרות שמ-$N$
      מסוים קבועות ושוות ל-$x$; ל-$0$: בדיוק הסדרות עם $\|x_n\|_2\to0$.
    solution:
      - kind: step
        text: >-
          (א) ל-$x=y$ שני האגפים 0. ל-$x\ne y$: $d_2(x,y)=\|x-y\|_2\le\|x\|_2+\|y\|_2=\tau(x,y)$, לפי אי-שוויון המשולש
          של הנורמה.
      - kind: step
        text: >-
          (ב) יהי $x\ne0$ ו-$r=\|x\|_2>0$. לכל $y\ne x$, $\tau(x,y)=\|x\|_2+\|y\|_2\ge r$, ולכן $y\notin B_\tau(x,r)$. כלומר
          $B_\tau(x,r)=\{x\}$, ו-$\{x\}$ פתוחה ב-$\tau$. ב-$d_2$ היא אינה פתוחה: כל עיגול סביב $x$ מכיל נקודות אחרות.
      - kind: step
        text: >-
          (ג) ל-$\tau$ ול-$d_2$ קבוצות פתוחות שונות (ב), ולכן הן אינן שקולות ליפשיץ: לפי המשפט שבשיעור, שקילות ליפשיץ
          הייתה נותנת אותן קבוצות פתוחות. ישירות: עם $x=(1,0)$, $y=(1,t)$, $t>0$: $\tau\ge2$ ו-$d_2=t$, ולכן אין $C$ עם
          $\tau\le C\,d_2$.
      - kind: step
        text: >-
          (ד) $x_n\to x\ne0$ ב-$\tau$: מ-$N$ מסוים $\tau(x_n,x)<\|x\|_2$, ולפי (ב) $x_n=x$. ולהפך, סדרה שקבועה מ-$N$
          מסוים מתכנסת. ל-$0$: $\tau(x_n,0)=\|x_n\|_2$ כש-$x_n\ne0$ (ו-0 כש-$x_n=0$), ולכן $x_n\to0$ ב-$\tau$ אם ורק אם
          $\|x_n\|_2\to0$, כמו ב-$d_2$.
      - kind: check
        text: >-
          כיוון אחד יש: $d_2\le\tau$, ולכן כל קבוצה פתוחה ב-$d_2$ פתוחה ב-$\tau$ (הלמה עם $C=1$), וכל סדרה שמתכנסת
          ב-$\tau$ מתכנסת ב-$d_2$. (ב) ו-(ד) מראים שההפך נכשל. זו שוב הדוגמה של "קבוע אחד אינו מספיק".
      - kind: result
        text: >-
          $d_2\le\tau$ בלבד; ב-$\tau$ כל נקודה שונה מ-0 מבודדת, ולכן הקבוצות הפתוחות שונות והמטריקות אינן שקולות ליפשיץ.

  - id: W-1.7-08
    level: mid
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      יהיו $(X,d_X)$ ו-$(Y,d_Y)$ מרחבים מטריים. על $X\times Y$, עם $p=(x,y)$ ו-$q=(x',y')$, נגדיר
      $D_1(p,q)=d_X(x,x')+d_Y(y,y')$, $D_\infty(p,q)=\max\big(d_X(x,x'),\ d_Y(y,y')\big)$ ו-
      $D_2(p,q)=\sqrt{d_X(x,x')^2+d_Y(y,y')^2}$.

      (א) הוכיחו ש-$D_2$ מטריקה. (את $D_1$ ו-$D_\infty$ אפשר להניח.)

      (ב) הוכיחו $D_\infty\le D_2\le D_1\le2\,D_\infty$.

      (ג) הוכיחו: $(x_n,y_n)\to(x,y)$ ב-$D_2$ אם ורק אם $x_n\to x$ ב-$X$ ו-$y_n\to y$ ב-$Y$.
    answer: >-
      (א) המשולש מהמשולש של $d_2$ במישור. (ב) כמו ב-$\mathbb{R}^2$, עם $a=d_X$, $b=d_Y$. (ג) המטריקות שקולות ליפשיץ,
      ו-$D_\infty(p_n,p)\to0$ פירושו ששני המרחקים שואפים ל-0.
    solution:
      - kind: idea
        text: >-
          לזוג נקודות מתאימים את הווקטור $\big(d_X(x,x'),\ d_Y(y,y')\big)$ במישור, ואז $D_1,D_2,D_\infty$ הן $\|\cdot\|_1$,
          $\|\cdot\|_2$, $\|\cdot\|_\infty$ שלו. כל אי-שוויון ממישור עובר.
      - kind: step
        text: >-
          (א) אפס וסימטריה ישירות. למשולש, עם $r=(x'',y'')$: נסמן $a_1=d_X(x,x')$, $a_2=d_X(x',x'')$, $b_1=d_Y(y,y')$,
          $b_2=d_Y(y',y'')$. לפי המשולש ב-$X$ וב-$Y$: $d_X(x,x'')\le a_1+a_2$ ו-$d_Y(y,y'')\le b_1+b_2$, ושני הצדדים
          אי-שליליים. לכן
          $D_2(p,r)\le\sqrt{(a_1+a_2)^2+(b_1+b_2)^2}\le\sqrt{a_1^2+b_1^2}+\sqrt{a_2^2+b_2^2}=D_2(p,q)+D_2(q,r)$; האי-שוויון
          השני הוא אי-שוויון המשולש של $d_2$ במישור (שיעור 1.1) לווקטורים $(a_1,b_1)$ ו-$(a_2,b_2)$.
      - kind: step
        text: >-
          (ב) עם $a=d_X(x,x')$, $b=d_Y(y,y')\ge0$: $\max(a,b)^2\le a^2+b^2\le(a+b)^2$, ו-$a+b\le2\max(a,b)$.
      - kind: step
        text: >-
          (ג) לפי (ב) $D_2$ שקולה ליפשיץ ל-$D_\infty$, ולכן (המשפט שבשיעור) $p_n\to p$ ב-$D_2$ אם ורק אם ב-$D_\infty$.
          ו-$D_\infty(p_n,p)=\max\big(d_X(x_n,x),d_Y(y_n,y)\big)\to0$ אם ורק אם שני המרחקים שואפים ל-0: המקסימום קטן
          מ-$\varepsilon$ בדיוק כששניהם קטנים מ-$\varepsilon$.
      - kind: check
        text: >-
          עם $X=Y=\mathbb{R}$ מקבלים את $d_1,d_2,d_\infty$ במישור ואת המשפט על התכנסות לפי קואורדינטות משיעור 1.5. הקבועים
          הדוקים כש-$X$ ו-$Y$ מכילים נקודות במרחק 1, למשל $\mathbb{R}$.
      - kind: result
        text: >-
          $D_2$ מטריקה, $D_\infty\le D_2\le D_1\le2D_\infty$, והתכנסות במכפלה היא התכנסות בכל רכיב.

  - id: W-1.7-09
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      על $C[0,1]$ נגדיר "מטריקות סופרמום עם משקל":
      $d_\mu(f,g)=\max_{x\in[0,1]}e^x|f(x)-g(x)|$ ו-$d_\nu(f,g)=\max_{x\in[0,1]}x\,|f(x)-g(x)|$. נסמן ב-$\theta$ את פונקציית
      האפס.

      (א) הוכיחו ש-$d_\mu$ ו-$d_\nu$ מטריקות.

      (ב) הוכיחו $d_\infty\le d_\mu\le e\,d_\infty$, והראו ששני הקבועים אינם ניתנים לשיפור. מה מסיקים על הקבוצות הפתוחות?

      (ג) הוכיחו $d_\nu\le d_\infty$, ושאין $C$ עם $d_\infty\le C\,d_\nu$. (רמז: $g_n(x)=\max(0,\ 1-nx)$.)

      (ד) האם הכדור $B_{d_\infty}(\theta,1)$ פתוח ב-$d_\nu$?
    answer: >-
      (ב) $1\le e^x\le e$; שוויון ב-$e^{-x}$ ובפונקציה הקבועה 1; אותן קבוצות פתוחות ואותן סדרות מתכנסות. (ג)
      $d_\nu(g_n,\theta)=\frac1{4n}$ ו-$d_\infty(g_n,\theta)=1$. (ד) לא: $2g_n$ קרובה ל-$\theta$ ב-$d_\nu$ ומחוץ לכדור.
    solution:
      - kind: step
        text: >-
          (א) המקסימום קיים, כי $w(x)|f(x)-g(x)|$ רציפה על $[0,1]$ ($w=e^x$ או $w=x$). סימטריה ברורה מהערך המוחלט.
          משולש: לכל $x$, $w(x)|f-h|(x)\le w(x)|f-g|(x)+w(x)|g-h|(x)\le d(f,g)+d(g,h)$, ולוקחים מקסימום על $x$. אפס: אם
          $d_\mu(f,g)=0$ אז $e^x|f(x)-g(x)|=0$ לכל $x$, ו-$e^x>0$, ולכן $f=g$. אם $d_\nu(f,g)=0$ אז $f=g$ על $(0,1]$, ומהרציפות
          גם $f(0)=\lim f(\tfrac1n)=\lim g(\tfrac1n)=g(0)$.
      - kind: step
        text: >-
          (ב) לכל $x\in[0,1]$: $1\le e^x\le e$, ולכן $|f-g|(x)\le e^x|f-g|(x)\le e\,|f-g|(x)$; מקסימום על $x$ נותן
          $d_\infty\le d_\mu\le e\,d_\infty$. שוויון משמאל: $f-g=e^{-x}$ נותנת $d_\mu=1=d_\infty$. שוויון מימין: $f-g\equiv1$
          נותנת $d_\mu=e$ ו-$d_\infty=1$. לכן $d_\mu$ ו-$d_\infty$ שקולות ליפשיץ, ולפי המשפט יש להן אותן קבוצות פתוחות ואותן
          סדרות מתכנסות.
      - kind: step
        text: >-
          (ג) $x\le1$ על $[0,1]$, ולכן $d_\nu\le d_\infty$. עבור $g_n$: היא אפס על $[\frac1n,1]$, ועל $[0,\frac1n]$ הפונקציה
          $x(1-nx)$ היא פרבולה שהמקסימום שלה ב-$x=\frac1{2n}$, שם ערכה $\frac1{2n}\cdot\frac12=\frac1{4n}$. לכן
          $d_\nu(g_n,\theta)=\frac1{4n}$, ואילו $d_\infty(g_n,\theta)=g_n(0)=1$. אילו היה $C$ עם $d_\infty\le C\,d_\nu$, היינו
          מקבלים $1\le\frac{C}{4n}$ לכל $n$, וזה נכשל כש-$n>\frac C4$.
      - kind: step
        text: >-
          (ד) **לא.** $\theta$ בכדור. יהי $r>0$, ונבחר $n>\frac1{2r}$. אז $d_\nu(2g_n,\theta)=\frac2{4n}=\frac1{2n}<r$, אבל
          $d_\infty(2g_n,\theta)=2$, ולכן $2g_n\notin B_{d_\infty}(\theta,1)$. אין כדור של $d_\nu$ סביב $\theta$ בתוך
          $B_{d_\infty}(\theta,1)$.
      - kind: check
        text: >-
          המשקל $e^x$ חסום מלמטה במספר חיובי (1), ולכן הוא לא משנה דבר. המשקל $x$ מתאפס ב-0, ולכן $d_\nu$ "לא רואה" מה
          שקורה ליד 0, ושם בדיוק $g_n$ גבוהה. עם $n=5$: $d_\nu(g_5,\theta)=\frac1{20}$, בנקודה $x=0.1$.
      - kind: result
        text: >-
          $d_\mu$ שקולה ליפשיץ ל-$d_\infty$ (קבועים 1 ו-$e$, הטובים ביותר). $d_\nu\le d_\infty$ בלבד: הן אינן שקולות ליפשיץ,
          ול-$d_\nu$ ול-$d_\infty$ קבוצות פתוחות שונות.

  - id: W-1.7-10
    level: exam
    qualitative: true
    objectives: [OBJ-1.7-2, OBJ-1.7-3]
    prompt: >-
      (א) יהיו $d,d'$ מטריקות שקולות ליפשיץ על $X$, ו-$f:X\to Y$. הוכיחו ש-$f$ רציפה במידה שווה ביחס ל-$d$ אם ורק אם היא
      רציפה במידה שווה ביחס ל-$d'$.

      (ב) על $X=(0,\infty)$ נגדיר $d(x,y)=|x-y|$ ו-$d'(x,y)=\left|\frac1x-\frac1y\right|$. הוכיחו ש-$d'$ מטריקה, ושיש
      ל-$d$ ול-$d'$ אותן סדרות מתכנסות.

      (ג) הוכיחו ש-$f(x)=\frac1x$ רציפה במידה שווה מ-$(X,d')$ ל-$\mathbb{R}$, ואינה רציפה במידה שווה מ-$(X,d)$. מה
      זה אומר על $d$ ו-$d'$?
    answer: >-
      (א) $\delta'=c\,\delta$ (או $\delta/C$). (ב) $d'$ היא $|\cdot|$ אחרי $x\mapsto\frac1x$, שהוא הומיאומורפיזם של $(0,\infty)$ (שיעור 1.6). (ג) $|f(x)-f(y)|=d'(x,y)$;
      על $(0,1]$ לא במידה שווה ב-$d$. לכן $d,d'$ אינן שקולות ליפשיץ, אף שיש להן אותן סדרות מתכנסות.
    solution:
      - kind: step
        text: >-
          (א) נניח $c\,d\le d'\le C\,d$ ו-$f$ רציפה במידה שווה ביחס ל-$d$. יהי $\varepsilon>0$ ויהי $\delta$ שמתאים ל-$d$.
          נבחר $\delta'=c\,\delta$. אם $d'(x,y)<\delta'$ אז $d(x,y)\le\frac1c d'(x,y)<\delta$, ולכן $d_Y(f(x),f(y))<\varepsilon$.
          הכיוון השני זהה, עם $\delta'=\frac\delta C$.
      - kind: step
        text: >-
          (ב) $d'(x,y)=|\varphi(x)-\varphi(y)|$ עם $\varphi(x)=\frac1x$, שהיא חד-חד-ערכית. לכן $d'$ מטריקה: סימטריה ואי-שוויון
          המשולש עוברים מ-$|\cdot|$, ו-$d'(x,y)=0$ גורר $\varphi(x)=\varphi(y)$, כלומר $x=y$.
      - kind: step
        text: >-
          סדרות: אם $x_n\to x$ ב-$d$ (ו-$x>0$), אז מהרציפות של $\varphi$ ב-$x$ נובע $\frac1{x_n}\to\frac1x$, כלומר $x_n\to x$
          ב-$d'$. ולהפך, אם $\frac1{x_n}\to\frac1x$ אז מהרציפות של $t\mapsto\frac1t$ ב-$\frac1x>0$ נובע $x_n\to x$.
      - kind: step
        text: >-
          (ג) $|f(x)-f(y)|=d'(x,y)$, ולכן $f$ ליפשיצית עם קבוע 1 ביחס ל-$d'$, ובפרט רציפה במידה שווה. ביחס ל-$d$, ניקח
          $\varepsilon=1$. לכל $\delta>0$ נבחר $n>\frac1\delta$, ונגדיר $x=\frac1n$ ו-$y=\frac1{2n}$. אז $d(x,y)=\frac1{2n}<\delta$,
          אבל $|f(x)-f(y)|=n\ge1$.
      - kind: check
        text: >-
          לפי (א), אילו $d$ ו-$d'$ היו שקולות ליפשיץ, $f$ הייתה רציפה במידה שווה בשתיהן או באף אחת. (ג) מראה שלא כך.
      - kind: result
        text: >-
          לשתי המטריקות אותן סדרות מתכנסות, עם אותם גבולות. לפי שיעור 1.5 קבוצה סגורה אם ורק אם היא מכילה את הגבולות של
          כל הסדרות המתכנסות שלה, ולכן יש להן גם אותן קבוצות סגורות, ובמעבר למשלימים אותן קבוצות פתוחות. ובכל זאת הן
          אינן שקולות ליפשיץ: רציפות נשמרת, רציפות במידה שווה לא.

challenge:
  - id: W-1.7-c1
    stars: 1
    objectives: [OBJ-1.7-1, OBJ-1.7-3]
    prompt: >-
      תהי $\ell^1$ קבוצת הסדרות הממשיות $x=(x_1,x_2,x_3,\dots)$ עם $\sum_{k=1}^\infty|x_k|<\infty$ (הטור מתכנס
      בהחלט). זה מרחב וקטורי עם חיבור וכפל בסקלר איבר-איבר. נגדיר עליו
      $\|x\|_1=\sum_{k=1}^\infty|x_k|$ ו-$\|x\|_w=\sum_{k=1}^\infty e^{-k}|x_k|$, ונסמן ב-$u_n$ את הסדרה שבמקום ה-$n$
      שלה $1$ ובשאר המקומות $0$.

      (א) הוכיחו ש-$\|\cdot\|_w$ נורמה על $\ell^1$. (ש-$\|\cdot\|_1$ נורמה מוכיחים באותה דרך.)

      (ב) הוכיחו ש-$\|x\|_w\le e^{-1}\|x\|_1$ לכל $x\in\ell^1$.

      (ג) הוכיחו שהמטריקות המושרות מ-$\|\cdot\|_1$ ומ-$\|\cdot\|_w$ אינן שקולות ליפשיץ.

      (ד) הראו ש-$u_n\to0$ ב-$\|\cdot\|_w$, ושהסדרה $(u_n)$ אינה מתכנסת ב-$\|\cdot\|_1$ לשום גבול.

      (ה) הראו שכדור היחידה הפתוח $U=\{x:\ \|x\|_1<1\}$ פתוח ב-$\|\cdot\|_1$ ואינו פתוח ב-$\|\cdot\|_w$.
    answer: >-
      (ב) $e^{-k}\le e^{-1}$. (ג) $\|u_n\|_1=1$ ו-$\|u_n\|_w=e^{-n}$, ולכן אין $C$ עם $\|x\|_1\le C\|x\|_w$. (ד)
      $\|u_n\|_w=e^{-n}\to0$; גבול ב-$\|\cdot\|_1$ היה צריך להיות $0$ בכל קואורדינטה, אבל $\|u_n\|_1=1$. (ה)
      כש-$2e^{-n}<r$: $\|2u_n\|_w<r$, ובכל זאת $2u_n\notin U$.
    solution:
      - kind: given
        text: >-
          $\ell^1$, $\|x\|_1=\sum|x_k|$, $\|x\|_w=\sum e^{-k}|x_k|$, ו-$u_n$ כמו בשאלה.
      - kind: idea
        text: >-
          המשקלות $e^{-k}$ הופכים קואורדינטות רחוקות כמעט לבלתי נראות ל-$\|\cdot\|_w$, ואילו $\|\cdot\|_1$ רואה אותן
          בגודלן המלא. וקטור יחידה שנדחף רחוק, $u_n$, גודלו $1$ ב-$\|\cdot\|_1$ ו-$e^{-n}\to0$ ב-$\|\cdot\|_w$, ולכן
          שום קבוע לא משווה בין שתי הנורמות בכיוון הזה.
      - kind: step
        text: >-
          (א) הטור $\sum e^{-k}|x_k|$ מתכנס, כי $0\le e^{-k}|x_k|\le|x_k|$ (מבחן ההשוואה). אם $\|x\|_w=0$, כל מחובר
          אי-שלילי הוא $0$, ולכן $x_k=0$ לכל $k$. $\|cx\|_w=\sum e^{-k}|c||x_k|=|c|\,\|x\|_w$. משולש: לכל $k$,
          $e^{-k}|x_k+y_k|\le e^{-k}|x_k|+e^{-k}|y_k|$, וסוכמים (טורים מתכנסים עם אי-שוויון בין האיברים).
      - kind: step
        text: >-
          (ב) ל-$k\ge1$, $e^{-k}\le e^{-1}$, ולכן $\|x\|_w=\sum e^{-k}|x_k|\le e^{-1}\sum|x_k|=e^{-1}\|x\|_1$. בפרט
          $\|x-y\|_w\le e^{-1}\|x-y\|_1$: אחד משני האי-שוויונים של שקילות ליפשיץ מתקיים.
      - kind: step
        text: >-
          (ג) נניח שיש $C>0$ עם $\|x\|_1\le C\|x\|_w$ לכל $x$. עם $x=u_n$: $\|u_n\|_1=1$ ו-$\|u_n\|_w=e^{-n}$, ולכן
          $1\le Ce^{-n}$, כלומר $e^n\le C$ לכל $n\in\mathbb{N}$. זה בלתי אפשרי, כי $e^n\to\infty$. לכן האי-שוויון השני
          של שקילות ליפשיץ נכשל, והמטריקות אינן שקולות ליפשיץ.
      - kind: step
        text: >-
          (ד) $\|u_n-0\|_w=e^{-n}\to0$, ולכן $u_n\to0$ ב-$\|\cdot\|_w$. נניח ש-$u_n\to y$ ב-$\|\cdot\|_1$. לכל $k$ קבוע,
          $|(u_n)_k-y_k|\le\|u_n-y\|_1\to0$, ו-$(u_n)_k=0$ לכל $n>k$. לכן $y_k=0$ לכל $k$, כלומר $y=0$.
      - kind: step
        text: >-
          אבל $\|u_n-0\|_1=1$ לכל $n$, ולכן $u_n\not\to0$ ב-$\|\cdot\|_1$. סתירה: $(u_n)$ אינה מתכנסת ב-$\|\cdot\|_1$.
          זו הוכחה שנייה ל-(ג): למטריקות שקולות ליפשיץ יש אותן סדרות מתכנסות (המשפט שבשיעור).
      - kind: step
        text: >-
          (ה) $U$ הוא הכדור הפתוח ברדיוס 1 סביב $0$ של המטריקה המושרית מ-$\|\cdot\|_1$, ולכן פתוח בה. $0\in U$. יהי
          $r>0$, ונבחר $n$ עם $2e^{-n}<r$. אז $\|2u_n\|_w=2e^{-n}<r$, כלומר $2u_n$ בכדור ברדיוס $r$ סביב $0$ של
          $\|\cdot\|_w$, אבל $\|2u_n\|_1=2$, ולכן $2u_n\notin U$. אין כדור של $\|\cdot\|_w$ סביב $0$ שמוכל ב-$U$, ו-$U$
          אינה פתוחה ב-$\|\cdot\|_w$.
      - kind: check
        text: >-
          $\|u_n\|_w=e^{-n}$, כלומר $\frac1e,\ \frac1{e^2},\ \frac1{e^3}$ ל-$n=1,2,3$. השוו לדוגמה שבשיעור: שם
          $d_1\le d_\infty$ על $C[0,1]$, ו"אוהלים" צרים הפרידו בין שתי המטריקות; כאן אותה תופעה במרחב של סדרות.
      - kind: result
        text: >-
          $\|x\|_w\le e^{-1}\|x\|_1$, אבל אין קבוע בכיוון ההפוך: הנורמות אינן שקולות ליפשיץ, ויש להן סדרות מתכנסות
          שונות וקבוצות פתוחות שונות. במרחב ממימד אינסופי שתי נורמות יכולות להיות ניתנות להשוואה בכיוון אחד בלבד.
    source:
      name: 'University of Groningen, Functional Analysis (WBMA033-05), Final Exam, 4 April 2023'
      year: 2023
      problem: 'Problem 1'
      url: 'https://toetscie.fmf.nl/%F0%9F%94%A2%20Mathematics/Functional%20Analysis/2023-04-04_Exam%20+%20Solutions.pdf'
      verified: '2026-11-09'
      adapted: true

  - id: W-1.7-c2
    stars: 1
    objectives: [OBJ-1.7-1, OBJ-1.7-2]
    prompt: >-
      יהי $X=\{0,1\}^{\mathbb{N}}$ מרחב כל הסדרות $x=(x_1,x_2,\dots)$ שאיבריהן $0$ או $1$. ל-$x\ne y$ נסמן ב-$k(x,y)$
      את האינדקס הראשון שבו $x_n\ne y_n$, ונגדיר

      $$\delta(x,y)=2^{-k(x,y)}\ \ (x\ne y),\qquad \delta(x,x)=0,\qquad \tau(x,y)=\sum_{n=1}^{\infty}\frac{|x_n-y_n|}{2^n}.$$

      (א) הוכיחו ש-$\delta$ ו-$\tau$ מטריקות. (רמז ל-$\delta$: הוכיחו אפילו $\delta(x,z)\le\max\big(\delta(x,y),\delta(y,z)\big)$.)

      (ב) הוכיחו $\delta\le\tau\le2\delta$, והראו ששני הקבועים הדוקים.

      (ג) הסיקו: סדרה $x^{(j)}$ מתכנסת ל-$x$ ב-$\tau$ אם ורק אם לכל $N$, מ-$j$ מסוים והלאה $x^{(j)}$ מסכימה עם $x$
      ב-$N$ האיברים הראשונים.
    answer: >-
      (ב) עם $k=k(x,y)$: $\tau=2^{-k}+\sum_{n>k}\frac{|x_n-y_n|}{2^n}$, וזה בין $2^{-k}$ ל-$2\cdot2^{-k}$; שוויון כשהסדרות
      נבדלות רק ב-$k$, וכשהן נבדלות בכל $n\ge k$. (ג) $\delta(x^{(j)},x)<2^{-N}$ פירושו הסכמה ב-$N$ האיברים
      הראשונים, ו-$\tau$ שקולה ליפשיץ ל-$\delta$.
    solution:
      - kind: idea
        text: >-
          $\delta$ מודדת **כמה מוקדם** שתי סדרות נפרדות, ו-$\tau$ סוכמת את כל ההבדלים עם משקלות שקטנים פי 2 בכל צעד.
          האיבר הראשון שבו הן נבדלות שולט ב-$\tau$, כי כל מה שאחריו יחד שוקל לכל היותר כמוהו.
      - kind: step
        text: >-
          (א) $\delta$: אפס וסימטריה מההגדרה. למשולש החזק, נניח $x,y,z$ שונות זו מזו (אחרת הטענה מיידית) ונסמן
          $m=\min\big(k(x,y),k(y,z)\big)$. לכל $n<m$ מתקיים $x_n=y_n$ ו-$y_n=z_n$, ולכן $x_n=z_n$. לכן $k(x,z)\ge m$, כלומר
          $\delta(x,z)=2^{-k(x,z)}\le2^{-m}=\max\big(\delta(x,y),\delta(y,z)\big)\le\delta(x,y)+\delta(y,z)$.
      - kind: step
        text: >-
          $\tau$: הטור מתכנס, כי כל איבר לכל היותר $2^{-n}$. סימטריה ברורה. משולש: $|x_n-z_n|\le|x_n-y_n|+|y_n-z_n|$
          לכל $n$; מחלקים ב-$2^n$ וסוכמים. ו-$\tau(x,y)=0$ גורר שכל האיברים אפס, כלומר $x=y$.
      - kind: computation
        text: >-
          (ב) יהי $x\ne y$ ו-$k=k(x,y)$. האיברים עם $n<k$ אפס, והאיבר ה-$k$ הוא $2^{-k}$, ולכן
          $\tau(x,y)=2^{-k}+\sum_{n>k}\frac{|x_n-y_n|}{2^n}$. הסכום הנוסף בין $0$ ל-$\sum_{n>k}2^{-n}=2^{-k}$. לכן
          $2^{-k}\le\tau\le2\cdot2^{-k}$, כלומר $\delta\le\tau\le2\delta$.
      - kind: check
        text: >-
          הדיקות: $x=(0,0,0,\dots)$ ו-$y=(1,0,0,\dots)$ נותנות $\delta=\tau=\frac12$. ו-$x=(0,0,\dots)$, $y=(1,1,\dots)$
          נותנות $\delta=\frac12$ ו-$\tau=\sum 2^{-n}=1=2\delta$.
      - kind: step
        text: >-
          (ג) לפי (ב) ולפי המשפט שבשיעור, ל-$\tau$ ול-$\delta$ אותן סדרות מתכנסות. ו-$\delta(x^{(j)},x)<2^{-N}$ אם ורק
          אם $x^{(j)}=x$ או $k(x^{(j)},x)>N$, כלומר $x^{(j)}$ מסכימה עם $x$ ב-$N$ האיברים הראשונים. "לכל $\varepsilon$
          מ-$j$ מסוים" עם $\varepsilon=2^{-N}$ הוא בדיוק התנאי.
      - kind: result
        text: >-
          $\delta,\tau$ מטריקות, $\delta\le\tau\le2\delta$ עם קבועים הדוקים, והתכנסות בהן היא "התייצבות" של כל קטע
          התחלתי סופי.
